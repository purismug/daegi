<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#0f1216; --card:#181d24; --card2:#1f2630; --line:#2a323d;
 --tx:#e8edf3; --tx2:#9aa7b6; --tx3:#68748a;
 --ac:#4ea1ff; --ac2:#2b7fd4; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c;
 --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;
 font-size:15px;line-height:1.65;overscroll-behavior:none}
#app{padding-top:var(--safe-top);padding-bottom:calc(62px + var(--safe-bot));min-height:100%}
/* ---- header ---- */
.hd{position:sticky;top:0;z-index:20;background:rgba(15,18,22,.92);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-top)) 16px 10px;margin-top:calc(-1*var(--safe-top))}
.hd h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.hd .sub{font-size:12px;color:var(--tx2);margin-top:2px}
/* ---- layout ---- */
.wrap{padding:14px 14px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--tx2)}
.badge.a{background:rgba(255,92,92,.15);color:#ff8080}
.badge.b{background:rgba(255,176,32,.15);color:#ffc357}
.badge.ac{background:rgba(78,161,255,.16);color:var(--ac)}
.badge.ok{background:rgba(61,220,132,.15);color:var(--ok)}
h2.sec{font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:.4px;margin:20px 2px 8px}
/* ---- streak hero ---- */
.hero{background:linear-gradient(140deg,#1a3a5c,#16212e);border:1px solid #274a6d;
 border-radius:16px;padding:18px;margin-bottom:14px}
.hero .big{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.hero .lbl{font-size:12px;color:#9fc4e8;margin-top:2px}
.hero .stats{display:flex;gap:22px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
.hero .stats div{flex:1}
.hero .stats b{display:block;font-size:19px;font-weight:700}
.hero .stats span{font-size:11px;color:#9fc4e8}
.pbar{height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4ea1ff,#3ddc84);border-radius:4px;transition:width .4s}
/* ---- keywords ---- */
.kw{border-left:3px solid var(--ac);padding:8px 0 8px 12px;margin-bottom:10px}
.kw b{font-size:15px;display:block;margin-bottom:5px}
.kw ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.kw li{font-size:12.5px;background:var(--card2);color:var(--tx2);padding:4px 9px;border-radius:7px;border:1px solid var(--line)}
/* ---- markdown body ---- */
.md{font-size:14.5px;line-height:1.85;word-break:keep-all;overflow-wrap:break-word}
.md h1{font-size:19px;font-weight:800;margin:4px 0 14px;padding-bottom:9px;border-bottom:2px solid var(--ac)}
.md h2{font-size:16px;font-weight:700;margin:22px 0 9px;color:#8fc4ff}
.md h3{font-size:14.5px;font-weight:700;margin:16px 0 6px;color:#c6d6e8}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0 8px 20px}
.md li{margin:4px 0}
.md strong{color:#fff;font-weight:700}
.md code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:13px;color:#ffd479}
.md pre{background:#0b0e12;border:1px solid var(--line);border-radius:9px;padding:12px;overflow-x:auto;margin:10px 0}
.md pre code{background:none;padding:0;color:#a8d8ff;font-size:12px;line-height:1.6;white-space:pre}
.md blockquote{border-left:3px solid var(--warn);background:rgba(255,176,32,.07);padding:9px 12px;margin:10px 0;border-radius:0 8px 8px 0;color:#e2d5b8;font-size:13.5px}
.md em{color:var(--tx2);font-style:normal;font-size:13px}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.tblwrap{overflow-x:auto;margin:11px 0;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:9px}
.md table{border-collapse:collapse;width:100%;font-size:13px;min-width:max-content}
.md th{background:var(--card2);padding:8px 10px;text-align:left;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
.md td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.md tr:nth-child(even) td{background:rgba(255,255,255,.018)}
/* ---- accordion ---- */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.acc>summary{padding:14px 16px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;
 align-items:center;justify-content:space-between;gap:8px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'▾';color:var(--tx2);font-size:12px;transition:transform .2s;flex:none}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--card2)}
.acc .inner{padding:14px 16px}
/* ---- buttons ---- */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-size:15.5px;font-weight:700;
 background:var(--ac);color:#06121f;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.985)}
.btn.done{background:rgba(61,220,132,.16);color:var(--ok);border:1px solid rgba(61,220,132,.4)}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn2{display:flex;gap:9px}
.btn2 .btn{flex:1;padding:12px;font-size:14px}
/* ---- calendar ---- */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhd b{font-size:16px;font-weight:700}
.navb{background:var(--card2);border:1px solid var(--line);color:var(--tx);width:36px;height:36px;
 border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit}
.navb:disabled{opacity:.3}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.dow span{text-align:center;font-size:11px;color:var(--tx2);font-weight:700;padding:4px 0}
.dow span:first-child{color:#ff8080}.dow span:last-child{color:#7fb0ff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:12.5px;background:var(--card);border:1px solid transparent;position:relative;cursor:pointer}
.cell.pad{background:none;cursor:default}
.cell.out{color:#3a444f;background:rgba(255,255,255,.015)}
.cell.done{background:linear-gradient(140deg,#2d9c5f,#1f7a48);color:#fff;font-weight:700;border-color:#3ddc84}
.cell.today{border:2px solid var(--ac);font-weight:800}
.cell.miss{background:rgba(255,92,92,.07);color:#8d6b6b}
.cell .dot{width:4px;height:4px;border-radius:50%;background:var(--ac);position:absolute;bottom:5px}
.cell.done .dot{background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--tx2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---- curriculum list ---- */
.item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .n{width:40px;flex:none;text-align:center;font-size:11px;color:var(--tx2);font-weight:700}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.item .t span{font-size:11px;color:var(--tx2)}
.item .st{flex:none;font-size:16px;width:22px;text-align:center}
.item.isdone .t b{color:var(--tx2);text-decoration:line-through}
.item.istoday{background:rgba(78,161,255,.07)}
.phase{padding:11px 14px;background:var(--card2);font-size:12px;font-weight:700;color:#8fc4ff;
 border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
/* ---- tabs ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
 background:rgba(19,23,29,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
 padding-bottom:var(--safe-bot)}
.tabs button{background:none;border:0;color:var(--tx3);padding:9px 0 8px;font-size:10.5px;font-weight:600;
 cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ic{font-size:19px;line-height:1}
.tabs button.on{color:var(--ac)}
/* ---- misc ---- */
.empty{text-align:center;padding:44px 20px;color:var(--tx2);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);background:#263140;border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:11px;font-size:13.5px;
 font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mini{font-size:11.5px;color:var(--tx2)}
.dday{font-size:12px;font-weight:700;color:var(--warn)}

</style>
</head>

window.LESSONS={"1":{"day":1,"date":"2026-08-01","title":"대기의 연직구조와 조성","keywords":[{"k":"대류권(Troposphere)","subs":["평균 기온감률 6.5℃/km","대기질량의 약 80% 집중","기상현상·대기오염 발생층"]},{"k":"성층권(Stratosphere)","subs":["오존층(20~30km) 존재","고도상승 시 기온 상승 → 강한 안정","오존의 UV 흡수가 열원"]},{"k":"중간권·열권","subs":["중간권 최저기온 약 -90℃","열권 전리층(D·E·F층)","중간권계면이 대기 최한랭"]},{"k":"대기의 조성","subs":["N₂ 78.08%, O₂ 20.95%, Ar 0.93%","CO₂ 약 420ppm 이상, 지속 증가","가변성분: 수증기·O₃·에어로졸"]},{"k":"균질층·비균질층","subs":["균질층 0~80km, 조성비 일정","비균질층 80km 이상, 분자량별 성층화","난류혼합 유무가 경계 결정"]}],"answer":"# 대기의 연직구조와 조성\n\n## Ⅰ. 개요\n\n대기는 지표에서 약 1,000km까지 분포하나, 대기오염이 실질적으로 발생·확산·소멸하는 영역은 지표로부터 약 11km 이내의 **대류권**이다. 대기의 연직구조는 **기온의 연직분포(Temperature Profile)**를 기준으로 4개 층으로 구분하며, 각 층의 기온 변화 방향이 곧 **대기안정도**를 결정하므로 대기확산·오염물질 거동 해석의 출발점이 된다.\n\n## Ⅱ. 대기의 연직구조\n\n### 1. 구분 기준\n기온이 고도에 따라 **감소 → 증가 → 감소 → 증가**로 4회 반전되며, 이 변곡점을 각각 대류권계면·성층권계면·중간권계면이라 한다.\n\n| 구분 | 고도 | 기온변화 | 안정도 | 주요 특징 |\n|---|---|---|---|---|\n| 대류권 | 0~11km | 감소(-6.5℃/km) | 불안정 | 기상현상, 대기오염, 대기질량 80% |\n| 성층권 | 11~50km | 증가 | 매우 안정 | 오존층(20~30km), 항공로 |\n| 중간권 | 50~80km | 감소 | 불안정 | 최저기온 -90℃, 수증기 거의 없음 |\n| 열권 | 80km~ | 증가 | 안정 | 전리층, 오로라, 분자 열해리 |\n\n### 2. 대류권(Troposphere)\n- **기온감률**: 평균 6.5℃/km(0.65℃/100m). 지표가 태양복사로 가열되어 아래에서 위로 열이 전달되므로 고도에 따라 기온 하강\n- **두께**: 적도 약 17km, 극지방 약 8km. 여름 > 겨울\n- **의의**: 수증기의 대부분이 존재하여 구름·강수 등 기상현상 발생. 대기오염물질의 배출·확산·침적이 모두 이 층에서 일어남\n- 대류권 내에서도 지표 1~2km는 **대기경계층(Planetary Boundary Layer)**으로, 지표 마찰과 가열의 영향을 직접 받아 일변화가 뚜렷함\n\n### 3. 성층권(Stratosphere)\n- **기온역전 구조**: 오존이 태양 자외선(UV-B, UV-C)을 흡수하여 발열하므로 고도상승 시 기온 상승\n- **오존층**: 20~30km에 최대 농도. 오존 전량 단위는 **돕슨(DU)**이며, 220DU 이하를 오존홀로 정의\n- **강한 안정성**: 연직혼합이 억제되어 유입된 물질(CFCs, 화산재)이 장기간 체류 → 오존층 파괴물질의 성층권 체류시간이 긴 이유\n\n### 4. 중간권·열권\n- **중간권**: 오존 농도 감소로 기온 재하강. 중간권계면(약 80km)이 대기 중 최저기온. 대류는 있으나 수증기가 없어 기상현상 없음\n- **열권**: 산소·질소 분자가 단파장 복사를 흡수·해리하며 기온 급상승. 전리층 형성으로 전파 반사, 극지방 오로라 발생\n\n## Ⅲ. 대기의 조성\n\n### 1. 건조공기의 조성(부피비)\n\n| 성분 | 부피비 | 비고 |\n|---|---|---|\n| 질소(N₂) | 78.08% | 불활성, 고온연소 시 NOx 전구물질 |\n| 산소(O₂) | 20.95% | 연소·산화반응 관여 |\n| 아르곤(Ar) | 0.93% | 불활성 기체 |\n| 이산화탄소(CO₂) | 약 0.042%(420ppm↑) | 온실가스, 지속 증가 |\n| 기타 | Ne, He, CH₄, Kr, H₂, N₂O 등 | 미량 |\n\n### 2. 고정성분과 가변성분\n- **고정성분**: N₂, O₂, Ar 등. 시·공간적으로 조성비가 거의 일정\n- **가변성분**: 수증기(0~4%), O₃, CO₂, 에어로졸, SO₂, NOx 등. 기상조건·배출원에 따라 크게 변동하며 대기오염 관리의 대상\n\n### 3. 균질층과 비균질층\n- **균질층(Homosphere, 0~80km)**: 난류혼합이 활발하여 분자량에 관계없이 조성비가 일정\n- **비균질층(Heterosphere, 80km 이상)**: 난류혼합이 약해 분자확산이 지배 → 가벼운 기체(He, H)가 상층에 분포하는 성층화 발생\n\n## Ⅳ. 대기환경 관리적 의의\n\n1. **확산 해석의 기초**: 연직 기온분포(ELR)와 단열감률(Γd)의 비교가 대기안정도 판정의 핵심이며, 이는 Pasquill 안정도 등급·확산계수 산정으로 직결된다.\n2. **역전층 형성**: 대류권 하부에 기온이 고도에 따라 증가하는 구간(역전층)이 생기면 연직확산이 차단되어 고농도 오염이 발생한다.\n3. **성층권 오존 보호**: 성층권의 강한 안정성 때문에 CFCs 등 오존층파괴물질(ODS)의 체류시간이 수십~수백 년에 달하므로 몬트리올의정서에 의한 사전적 배출규제가 필요하다.\n4. **온실효과**: 대류권 CO₂·CH₄·N₂O 등 온실가스가 지표 장파복사를 흡수·재방출하여 지구온난화를 유발한다.\n\n## Ⅴ. 대기의 물리량과 단위\n\n### 1. 농도 단위와 환산\n- **부피비**: ppm, ppb (기체상 물질)\n- **질량농도**: mg/m³, µg/m³ (입자상 및 규제기준)\n- **환산식(0℃, 1atm 표준상태)**:\n  **mg/m³ = ppm × M / 22.4**  (M: 분자량)\n  25℃ 기준은 24.45를 사용\n- 예: SO₂ 1ppm = 1 × 64 / 22.4 = **2.86 mg/m³**\n\n### 2. 표준상태 환산\n배출가스 농도는 **표준상태(0℃, 1기압) 건조가스** 기준으로 보정한다.\n\nC_표준 = C_실측 × (273+t)/273 × P/760 × 100/(100−수분%)\n\n### 3. 산소농도 보정\n연소시설은 희석에 의한 농도 저감을 방지하기 위해 **기준산소농도(On)**로 보정한다.\n\n**C = C_실측 × (21 − On) / (21 − Os)**\n\n- Os: 실측 산소농도(%), On: 배출시설별 기준산소농도\n- 예: 소각시설 12%, 고체연료 보일러 6%, 액체·기체연료 4%\n\n## Ⅵ. 결론\n\n대기의 연직구조는 기온분포에 따라 4개 층으로 구분되며, 대기오염 관리의 실질적 대상은 대류권, 특히 하부의 대기경계층이다. 대기오염 문제를 해석할 때는 ① 연직 기온분포에 따른 안정도 ② 층별 체류시간 ③ 성분별 고정·가변 특성을 함께 고려하여야 하며, 향후 기후변화에 따른 대류권계면 상승과 성층권 냉각 현상이 대기질에 미치는 영향에 대한 지속적 감시가 요구된다.\n","side":[{"title":"온위(Potential Temperature)","body":"### 정의\n공기덩어리를 단열적으로 표준기압(1,000hPa)까지 이동시켰을 때 갖는 온도.\n\nθ = T (1000/P)^(R/Cp),  R/Cp ≈ 0.286\n\n### 의미\n- 단열과정에서 **보존되는 양** → 공기덩어리의 추적자(tracer) 역할\n- 온위의 연직경사로 안정도 판정\n  - dθ/dz > 0 : **안정**\n  - dθ/dz = 0 : **중립**\n  - dθ/dz < 0 : **불안정**\n- 기온(T)만으로는 기압효과가 섞여 안정도 판정이 곤란하므로 실무 모델에서는 온위를 사용\n\n### 온위와 기온의 관계\n| ELR 조건 | dT/dz | dθ/dz | 안정도 |\n|---|---|---|---|\n| ELR > Γd | 급격히 감소 | < 0 | 불안정 |\n| ELR = Γd | -0.98℃/100m | = 0 | 중립 |\n| 0 < ELR < Γd | 완만히 감소 | > 0 | 안정 |\n| ELR < 0 (역전) | 증가 | ≫ 0 | 절대안정 |\n\n기온만 보면 \"고도상승 시 기온 하강 = 불안정\"으로 오판하기 쉽다. 중립(Γd)에서도 기온은 감소하므로, **기온 감소 자체가 불안정을 뜻하지 않는다.** 온위를 쓰면 이 혼동이 사라진다.\n\n### 관련 개념\n- **상당온위(θe)**: 수증기의 잠열까지 포함해 단열적으로 응결시킨 뒤의 온위. 습윤과정에서도 보존되어 기단 구분·대류 잠재력 평가에 사용\n- **가온위(θv)**: 수증기의 밀도효과를 보정한 온위. 부력 계산에 사용\n\n### 대기환경 활용\n- **리차드슨수** 산정식의 분자항 (g/T)·(∂θ/∂z)\n- **혼합고 산정**: 온위 프로파일이 급증하는 고도가 혼합고 상단\n- **역전층 탐지**: 온위가 급격히 증가하는 구간\n- **AERMOD 입력**: 안정경계층의 온위경사(dθ/dz)를 직접 입력받아 σz 산정\n- CMAQ·WRF 등 수치모델은 예단변수로 기온이 아닌 온위를 사용\n"},{"title":"돕슨 단위(DU)와 오존 전량","body":"### 정의\n연직 기둥 내 전체 오존을 0℃, 1기압 상태로 압축했을 때의 두께를 나타내는 단위. **1DU = 0.01mm**.\n\n### 기준값\n- 전 지구 평균: 약 300DU (약 3mm 두께)\n- **오존홀 기준: 220DU 미만**\n- 우리나라 평균: 약 300~350DU (겨울~봄 높음)\n\n### 측정방법\n- **지상**: 돕슨 분광광도계, 브루어 분광광도계 (UV 파장쌍의 강도비 이용)\n- **연직분포**: 오존존데, 라이다(LIDAR)\n- **위성**: TOMS, OMI, 국내 정지궤도 환경위성 **GEMS**(천리안 2B호)\n\n### 오존홀의 형성 기작 (극지방)\n1. 극야(polar night) 중 **극소용돌이(polar vortex)** 형성 → 공기 고립\n2. 저온(-78℃ 이하)에서 **극성층권운(PSC)** 생성\n3. PSC 표면에서 불균질 반응 → 안정한 HCl·ClONO₂가 반응성 Cl₂로 전환\n4. 봄철 일사 재개 → Cl₂ 광분해 → **Cl 라디칼 촉매 연쇄반응**\n   - Cl + O₃ → ClO + O₂\n   - ClO + O → Cl + O₂\n   - Cl 원자 1개가 오존 약 **10만 개** 파괴\n5. 9~10월(남극) 오존 전량 최소 → 오존홀\n\n### 주요 오존층파괴물질(ODS)과 ODP\n| 물질 | ODP | 비고 |\n|---|---|---|\n| CFC-11 | 1.0 | 기준물질 |\n| CFC-12 | 1.0 | 냉매 |\n| Halon-1301 | **10.0** | 소화약제, 최대 |\n| CCl₄ | 1.1 | 용제 |\n| HCFC-22 | 0.055 | 과도물질, 2040 전폐 |\n| HFCs | **0** | 대체물질이나 GWP 높음 → 키갈리개정서 규제 |\n\n### 관리적 의미\n오존 전량 1% 감소 시 지표 UV-B 약 2% 증가, 피부암 발생률 약 2~4% 증가로 추정된다. 이는 **몬트리올의정서(1987)**에 따른 ODS 단계적 감축과, HFCs까지 규제 대상에 포함한 **키갈리개정서(2016, 국내 2024 발효)**의 근거가 된다.\n"},{"title":"대류권계면(Tropopause)의 특성","body":"### 정의\n대류권과 성층권의 경계면. 기온감률이 2℃/km 이하로 되는 최저 고도(WMO 정의).\n\n### 특징\n- **고도**: 적도 16~17km, 중위도 11~12km, 극 8~9km\n- **계절변동**: 여름 상승, 겨울 하강\n- **극전선 제트류**가 형성되어 대류권계면이 불연속적으로 끊기는 구간 존재\n\n### 대기환경적 의의\n1. **오염물질 차단막**: 강한 안정층이므로 대류권에서 배출된 오염물질이 성층권으로 확산되는 것을 억제 → 대류권 오염물질의 체류시간 결정\n2. **성층권-대류권 물질교환(STE)**: 제트류 부근 단절대(tropopause folding)를 통해 성층권 오존이 대류권으로 유입 → 봄철 지표 배경오존 농도 상승 원인\n3. **기후변화 지표**: 온난화로 대류권 팽창·성층권 냉각이 진행되면서 대류권계면 고도가 상승하는 경향이 관측됨\n\n### 제트류(Jet Stream)\n대류권계면 부근에서 부는 좁고 강한 편서풍대(풍속 30~100 m/s).\n\n| 구분 | 위치 | 특징 |\n|---|---|---|\n| **한대 제트** | 위도 40~60°, 고도 9~12km | 강도 변동 큼, 겨울 강화 |\n| **아열대 제트** | 위도 25~35°, 고도 12~15km | 상대적으로 안정 |\n\n### 대기환경적 의의\n1. **장거리 이송의 고속 통로**: 황사·국외 유입 미세먼지가 편서풍·제트류를 타고 수천 km 이송. 중국 발원 황사가 1~3일 내 한반도 도달\n2. **블로킹(Blocking)**: 제트류가 사행(meandering)하며 정체하면 고기압이 장기 정체 → **국내 고농도 미세먼지 장기화**\n3. **성층권-대류권 물질교환(STE)**: 제트류 부근 대류권계면 단절대를 통해 성층권 오존이 하강 → 봄철 지표 배경오존 상승\n4. **기후변화 영향**: 북극 온난화(북극증폭)로 남북 온도경도가 약화되어 제트류가 약화·사행 → 정체성 기상 증가 → 고농도 대기오염 빈발 가능성\n"}]},"2":{"day":2,"date":"2026-08-02","title":"정적안정도 - 환경감률과 단열감률","keywords":[{"k":"건조단열감률(Γd)","subs":["0.98℃/100m ≈ 1℃/100m","Γd = g/Cp 로 유도","불포화 공기덩어리의 단열변화"]},{"k":"습윤단열감률(Γs)","subs":["약 0.5~0.6℃/100m","응결잠열 방출로 Γd보다 작음","기온·습도에 따라 변동"]},{"k":"환경감률(ELR)","subs":["실제 대기의 연직 기온분포","평균 0.65℃/100m","라디오존데·계류기구로 측정"]},{"k":"안정도 판정","subs":["ELR>Γd 과단열=불안정","ELR=Γd 중립","ELR<Γd 미단열=안정, ELR<0 역전"]},{"k":"조건부 불안정","subs":["Γs < ELR < Γd 구간","불포화 시 안정, 포화 시 불안정","적운·뇌우 발달 조건"]}],"answer":"# 정적안정도 - 환경감률과 단열감률\n\n## Ⅰ. 개요\n\n**정적안정도(Static Stability)**란 공기덩어리(air parcel)가 외력에 의해 연직으로 변위되었을 때 원래 위치로 되돌아오려는 성질의 정도를 말한다. 이는 **실제 대기의 기온분포(환경감률, ELR)**와 **단열적으로 상승·하강하는 공기덩어리의 기온변화율(단열감률, Γ)**을 비교하여 판정하며, 대기오염물질의 연직확산 능력을 결정하는 가장 기본적인 지표이다.\n\n## Ⅱ. 단열감률(Adiabatic Lapse Rate)\n\n### 1. 건조단열감률(Γd)\n불포화 공기덩어리가 주위와 열교환 없이(단열) 상승할 때, 기압 감소로 팽창하며 내부에너지를 소모해 온도가 낮아진다.\n\n열역학 제1법칙과 정역학 방정식으로부터\n\n**Γd = -dT/dz = g / Cp = 9.8 / 1,005 ≈ 0.0098 K/m = 0.98℃/100m ≈ 1℃/100m**\n\n- g: 중력가속도(9.8m/s²), Cp: 건조공기 정압비열(1,005 J/kg·K)\n- 수증기 응결이 없는 한 항상 일정한 **물리상수**\n\n### 2. 습윤단열감률(Γs)\n포화된 공기덩어리가 상승하면 수증기가 응결하며 **잠열(약 2,500 kJ/kg)**을 방출하여 냉각을 상쇄한다.\n\n**Γs ≈ 0.5 ~ 0.6℃/100m (평균 0.5℃/100m), 항상 Γs < Γd**\n\n- 고온·다습할수록 응결량이 많아 Γs가 작아짐(0.4℃/100m 내외)\n- 저온·건조한 상층에서는 수증기량이 적어 Γs → Γd에 수렴\n\n### 3. 환경감률(ELR, Environmental Lapse Rate)\n실제 대기에서 관측되는 고도별 기온 분포로, **주어진 시각·장소의 실측값**이다.\n- 표준대기 평균: 0.65℃/100m (6.5℃/km)\n- 측정: 라디오존데, 계류기구(tethersonde), 항공기 관측, RASS/SODAR\n- 지표 가열·냉각, 이류, 침강 등에 따라 시시각각 변화하며 음(-)의 값(역전)도 가능\n\n## Ⅲ. 정적안정도의 판정\n\n### 1. 판정 원리\n공기덩어리를 Δz 상승시켰을 때\n- 주위보다 **따뜻하면**(밀도 작음) → 계속 상승 → **불안정**\n- 주위보다 **차가우면**(밀도 큼) → 원위치 복귀 → **안정**\n\n### 2. 판정 기준표\n\n| 조건 | 명칭 | 안정도 | 연기형태 | 확산 |\n|---|---|---|---|---|\n| ELR > Γd | 과단열(Superadiabatic) | 절대불안정 | Looping | 매우 양호 |\n| ELR = Γd | 중립(Neutral) | 중립 | Coning | 양호 |\n| Γs < ELR < Γd | 조건부불안정 | 조건부 | - | 보통 |\n| 0 < ELR < Γs | 미단열(Subadiabatic) | 안정 | Fanning | 불량 |\n| ELR < 0 (역전) | 역전(Inversion) | 절대안정 | Fanning | 매우 불량 |\n\n### 3. 온위(θ)에 의한 판정\nθ = T(1,000/P)^0.286 로 정의하면\n- **dθ/dz > 0 : 안정 / = 0 : 중립 / < 0 : 불안정**\n- 기압효과가 제거되어 판정이 명확하므로 수치모델·실무에서 표준으로 사용\n\n### 4. 조건부 불안정(Conditional Instability)\nΓs < ELR < Γd 인 구간은\n- 공기가 **불포화**일 때는 Γd로 냉각 → 주위보다 차가워짐 → **안정**\n- 공기가 **포화**되면 Γs로 냉각 → 주위보다 따뜻해짐 → **불안정**\n\n즉 수증기 포화 여부에 따라 안정도가 달라지는 상태로, 자유대류고도(LFC)를 넘으면 적란운·뇌우가 급격히 발달한다. 우리나라 여름철 대기 대부분이 이 상태에 해당한다.\n\n## Ⅳ. 대기오염 관리적 의의\n\n1. **연직확산 능력의 결정**: 불안정할수록 연직혼합이 활발하여 지표농도가 낮아지나, 국지적으로 Looping에 의한 순간 고농도(착지농도 급증)가 발생할 수 있다.\n2. **역전층과 고농도 사건**: ELR < 0 인 역전층은 오염물질을 지표 부근에 가두어 런던스모그·LA스모그 등 대기오염 사건의 직접 원인이 되었다.\n3. **굴뚝 설계 인자**: 안정도에 따라 유효굴뚝높이(He)와 확산계수(σy, σz)가 달라지므로, 최악 조건(안정·저풍속)을 가정한 굴뚝높이 산정이 필요하다.\n4. **환경영향평가**: 대기질 예측 시 안정도 등급별 출현빈도(기상결합빈도함수)를 적용하여 장·단기 평균농도를 산정한다.\n\n## Ⅴ. 안정도 판정 계산 예제\n\n### 예제 1\n지상 10m 기온 18.0℃, 고도 110m 기온 17.2℃일 때 안정도를 판정하시오.\n\n- ELR = (18.0 − 17.2) / (110 − 10) × 100 = **0.8℃/100m**\n- Γd = 0.98℃/100m\n- **0 < ELR(0.8) < Γd(0.98)** → **미단열, 안정**\n- 단, Γs(0.5) < 0.8 < Γd(0.98) 이므로 **조건부 불안정** 구간에도 해당\n  → 공기가 포화되면 불안정으로 전환\n\n### 예제 2 (역전 판정)\n지상 2m 기온 5.0℃, 고도 50m 기온 7.4℃\n\n- ELR = (5.0 − 7.4)/(50 − 2) × 100 = **−5.0℃/100m** (음수)\n- **ELR < 0 → 접지역전, 절대안정**\n- 연기형태 **Fanning** 예상, 연직확산 거의 없음\n\n### 예제 3 (온위 판정)\n1,000hPa에서 20℃, 900hPa에서 13℃인 두 층의 안정도\n\n- θ₁ = (20+273)×(1000/1000)^0.286 = 293.0 K\n- θ₂ = (13+273)×(1000/900)^0.286 = 286 × 1.0306 = **294.8 K**\n- **dθ/dz > 0 → 안정**\n\n## Ⅵ. 결론\n\n정적안정도는 환경감률(ELR)과 단열감률(Γd, Γs)의 상대적 크기로 판정되는 대기확산의 핵심 지표이다. 실무에서는 온위 경사로 판정하는 것이 정확하며, 조건부 불안정 구간의 존재로 인해 습도 조건을 반드시 함께 고려하여야 한다. 다만 정적안정도만으로는 기계적 난류를 반영할 수 없으므로, 실제 확산 해석에는 **리차드슨수(Ri)** 등 동적안정도 지표를 병행 적용하는 것이 타당하다.\n","side":[{"title":"건조단열감률 Γd = g/Cp 의 유도","body":"### 1. 열역학 제1법칙 (단열: dq = 0)\ndq = Cp·dT - (1/ρ)dP = 0\n→ Cp·dT = (1/ρ)dP\n\n### 2. 정역학 방정식\ndP = -ρ·g·dz\n\n### 3. 대입\nCp·dT = (1/ρ)(-ρ·g·dz) = -g·dz\n\n**∴ -dT/dz = g/Cp = 9.8 / 1,005 = 0.0098 K/m = 0.98℃/100m**\n\n### 4. 시사점\n- Γd는 기상조건이 아닌 **중력가속도와 비열만의 함수** → 지구상 어디서나 일정한 상수\n- 습윤단열의 경우 응결잠열 L·dqs 항이 추가되어\n  Cp·dT = -g·dz - L·dqs → Γs = (g/Cp)·[보정계수] < Γd\n- 답안에서 이 유도를 1~2줄로 제시하면 이해도 측면에서 가점 요인이 된다.\n\n### 습윤단열감률의 근사식\n포화 상태에서 잠열 항을 포함하면\n\nΓs = Γd · [1 + L·qs/(R·T)] / [1 + L²·qs/(Cp·Rv·T²)]\n\n- L: 응결잠열(2.5×10⁶ J/kg), qs: 포화혼합비, Rv: 수증기 기체상수\n\n### 온도에 따른 Γs 변화\n| 기온 | Γs (℃/100m) | 비고 |\n|---|---|---|\n| 30℃ | 약 0.36 | 고온다습, 잠열 방출 최대 |\n| 20℃ | 약 0.43 | |\n| 10℃ | 약 0.53 | |\n| 0℃ | 약 0.65 | |\n| -20℃ | 약 0.85 | 수증기 적음, Γd에 근접 |\n| -40℃ | 약 0.95 | 사실상 Γd |\n\n### 시사점\n습윤단열감률은 **상수가 아니라 기온·기압의 함수**이며, 상층으로 갈수록 Γd에 수렴한다. 시험 답안에서는 통상 **0.5℃/100m**를 대표값으로 쓰되, \"기온·습도에 따라 0.4~0.9℃/100m 범위에서 변한다\"는 단서를 붙이면 정확하다.\n"},{"title":"환경감률의 실측 방법","body":"### 1. 라디오존데(Radiosonde)\n- 기구에 기온·습도·기압 센서와 GPS를 탑재해 상공 30km까지 관측\n- 국내 정규관측: 1일 2~4회(00, 12 UTC 등). 대기확산 모델의 상층 입력자료\n- 장점: 고고도까지 관측 / 단점: 시간해상도 낮음, 1회용\n\n### 2. 계류기구(Tethersonde)\n- 줄로 계류한 기구를 상하 이동시켜 경계층(~1km) 연속 관측\n- 역전층·혼합고 조사에 적합. 환경영향평가 현황조사에 활용\n\n### 3. 원격탐사\n- **SODAR**: 음파 산란으로 연직 풍향·풍속·난류강도 관측\n- **RASS**: SODAR + 레이더로 연직 기온 프로파일 산출\n- **LIDAR**: 레이저 후방산란으로 에어로졸 연직분포 및 혼합고 산정\n- **항공기·드론 관측**: 국지 역전 조사에 활용\n\n### 4. 관측 기준 및 정확도\n| 항목 | 요구사항 |\n|---|---|\n| 관측 층 간격 | 지표~200m는 10~25m, 상층은 50~100m |\n| 기온 정확도 | ±0.2℃ 이내 (감률 판정을 위해 정밀도 중요) |\n| 관측 횟수 | 환경영향평가 시 계절별 각 1회 이상, 일 4회(03·09·15·21시) 권장 |\n| 병행 관측 | 풍향·풍속(Ri 산정용), 습도(Γs 판정용) |\n\n### 5. 유의사항\n- **복사오차**: 주간 일사에 의한 센서 가열 → 차폐통·통풍식 센서 사용\n- **응답지연**: 상승 중 센서 시정수로 인한 위상차 보정\n- **대표성**: 지형·지물 영향을 받지 않는 개활지 선정. 해안·산지는 국지성이 커 다지점 관측 필요\n\n### 6. 활용\n관측된 ELR을 Γd와 비교해 안정도를 판정하고, **역전층의 고도·두께·강도**, **혼합고**를 산정하여 확산모델 입력자료로 사용한다. 환경영향평가에서는 관측 결과를 표와 온도-고도 그래프로 함께 제시하는 것이 원칙이다.\n"},{"title":"단열선도(Adiabatic Chart)","body":"### 정의\n기온·기압·습도의 연직 관측값을 도시하여 대기상태와 안정도를 해석하는 열역학 선도. 국내 기상청은 **Skew T-log P 선도**를 사용한다.\n\n### 구성요소\n1. **등압선(Isobar)**: 수평선, log P 척도\n2. **등온선(Isotherm)**: 우상향 45° 사선(skew)\n3. **건조단열선**: 온위 일정선\n4. **습윤단열선(포화단열선)**: 상당온위 일정선\n5. **포화혼합비선**: 등포화혼합비선\n\n### 산출 가능 기상요소\n- 안정도(대기불안정지수: CAPE, LI, SSI, K-index)\n- 이슬점·상대습도, 혼합비\n- **상승응결고도(LCL)**, 자유대류고도(LFC), 평형고도(EL)\n- 역전층의 고도·두께·강도\n- 혼합고(최대혼합고 MMD): 지표 최고기온에서 건조단열선을 그어 ELR과 만나는 고도\n\n### 주요 불안정지수\n| 지수 | 의미 | 판정 |\n|---|---|---|\n| **CAPE** | 대류가용잠재에너지(J/kg) | > 1,000 강한 대류 |\n| **LI**(Lifted Index) | 500hPa 기온 - 상승기괴 기온 | < 0 불안정 |\n| **SSI**(Showalter) | 850→500hPa 상승 시 온도차 | < 3 뇌우 가능 |\n| **K-index** | 중층 습도·기온차 조합 | > 30 뇌우 가능 |\n\n### 최대혼합고(MMD) 작도법\n1. 아침(06시) 관측 ELR 곡선을 선도에 작도\n2. 당일 예상 **최고기온**을 지표 기압선상에 표시\n3. 그 점에서 **건조단열선**을 위로 그림\n4. ELR 곡선과 만나는 고도 = **최대혼합고(MMD)**\n\n### 대기환경 활용\n1. **혼합고·통풍계수** 산정 → 확산능력 평가, 고농도 예보\n2. **역전층 판정**: 기온이 고도에 따라 증가하는 구간을 직독\n3. **연기상승고 계산**: 안정도 매개변수 S = (g/T)(∂θ/∂z) 산출\n4. **백연 예측**: 습공기선도와 함께 배출가스 응축 여부 판정\n5. 123회 기출 \"건조단열감률, 습윤단열감률\", 최근 기출 \"단열선도의 정의 및 구성요소와 산출 가능한 기상요소\"\n"}]},"3":{"day":3,"date":"2026-08-03","title":"동적안정도 - 리차드슨수와 마찰속도","keywords":[{"k":"리차드슨수(Ri)","subs":["Ri = (g/T)(∂θ/∂z)/(∂u/∂z)²","열적난류/기계적난류 비","무차원수"]},{"k":"Ri 판정기준","subs":["Ri>0.25 안정·난류소멸","0>Ri>-0.03 기계적난류 우세","Ri<-0.04 대류난류 우세"]},{"k":"마찰속도(u*)","subs":["u* = √(τ₀/ρ)","전단응력의 속도 차원 표현","난류강도의 척도"]},{"k":"로그 풍속분포","subs":["u(z) = (u*/k)·ln(z/z₀)","k=0.4 (von Karman 상수)","z₀: 조도길이(roughness length)"]},{"k":"Monin-Obukhov 길이(L)","subs":["기계적·열적 난류 균형 고도","L>0 안정, L<0 불안정","안정도 매개변수 z/L"]}],"answer":"# 동적안정도 - 리차드슨수와 마찰속도\n\n## Ⅰ. 개요\n\n정적안정도는 기온의 연직분포만을 고려하므로 **바람의 연직전단(wind shear)에 의한 기계적 난류**를 반영하지 못한다. 실제 대기확산은 부력에 의한 **열적 난류**와 전단에 의한 **기계적 난류**가 함께 작용하므로, 두 난류의 상대적 크기를 평가하는 **동적안정도(Dynamic Stability)** 지표가 필요하다. 그 대표적 지표가 **리차드슨수(Richardson Number, Ri)**이며, 지표 부근 난류의 강도는 **마찰속도(u\\*)**로 정량화한다.\n\n## Ⅱ. 리차드슨수(Ri)\n\n### 1. 정의식\n\n**Ri = (g/T) · (∂θ/∂z) / (∂u/∂z)²**\n\n- g: 중력가속도, T: 절대온도(K), θ: 온위, u: 수평풍속, z: 고도\n- **분자**: 부력항(열적 난류의 생성/소멸)\n- **분모**: 전단항(기계적 난류의 생성)\n- 무차원수이며, 두 난류의 **비(ratio)**를 의미\n\n실무에서는 두 고도(z₁, z₂)의 관측값으로 **Bulk Richardson Number**를 산정한다.\n\nRi_B = (g/T̄) · (Δθ·Δz) / (Δu)²\n\n### 2. 판정기준\n\n| Ri 범위 | 안정도 | 난류 특성 | 확산 |\n|---|---|---|---|\n| Ri > 0.25 | 매우 안정 | 난류 소멸, 층류화 | 연직확산 거의 없음 |\n| 0 < Ri < 0.25 | 안정 | 기계적 난류만 존재 | 약한 연직확산 |\n| Ri = 0 | 중립 | 기계적 난류 지배 | 보통 |\n| -0.03 < Ri < 0 | 약불안정 | 기계적 난류 우세 | 양호 |\n| Ri < -0.04 | 불안정 | 대류(열적) 난류 우세 | 매우 양호 |\n\n- **임계 리차드슨수 Ric ≈ 0.25**: 이 값을 넘으면 부력이 전단을 압도하여 난류가 소멸(층류 전이)\n- Ri의 **부호**는 정적안정도(θ 경사)를, **절대값**은 난류의 지배기구를 알려준다\n\n### 3. Gradient Ri 와 Flux Ri\n- **Gradient Ri**: 위 정의식. 평균장의 경사로 계산\n- **Flux Ri**: 난류 플럭스의 비 Rf = (부력플럭스)/(전단생성). Rf = Ri·(Km/Kh)의 관계\n- 실무 관측에서는 계산이 용이한 Gradient Ri(또는 Bulk Ri)를 사용\n\n## Ⅲ. 마찰속도(Friction Velocity, u\\*)\n\n### 1. 정의\n\n**u\\* = √(τ₀/ρ)**  [m/s]\n\n- τ₀: 지표 전단응력(surface shear stress) [N/m²], ρ: 공기밀도\n- 전단응력을 속도 차원으로 환산한 값으로, **지표층 난류강도의 척도**\n- 통상 값: 0.1~1.0 m/s (풍속 및 지표조도에 비례)\n\n### 2. 표면층(Surface Layer)의 개념\n대기경계층 하부 약 10%(수십~100m)는 난류 플럭스(운동량·열·수증기)가 고도에 관계없이 **거의 일정**한 층으로, **접지층(constant flux layer)**이라 한다. 이 층에서 τ₀ ≈ 일정 → u\\*가 층 전체의 대표값이 된다.\n\n### 3. 로그 풍속분포(중립조건)\n\n**u(z) = (u\\*/k) · ln(z/z₀)**\n\n- k = 0.4 (von Karman 상수), z₀ = 조도길이(roughness length)\n- **z₀ 예시**: 수면 0.0001~0.001m, 초지 0.01~0.03m, 농경지 0.05~0.1m, 삼림 0.5~1.0m, 도시 1~3m\n- 밀집식생·도시에서는 영면변위 d를 고려하여 u(z) = (u\\*/k)·ln((z-d)/z₀)\n\n### 4. 안정도 보정 - Monin-Obukhov 상사이론\n\n**L = -(u\\*³·T) / (k·g·(w'θ')₀)**\n\n- L: Monin-Obukhov 길이. 기계적 난류와 열적 난류가 균형을 이루는 고도\n- **L > 0: 안정 / L → ±∞: 중립 / L < 0: 불안정**\n- 안정도 매개변수 **z/L**을 사용하여 풍속분포를 보정\n\nu(z) = (u\\*/k)[ln(z/z₀) - ψm(z/L)]\n\n여기서 ψm은 안정도 보정함수이며, Ri와 z/L은 중립 부근에서 Ri ≈ z/L의 관계를 갖는다.\n\n## Ⅳ. 대기환경 관리적 활용\n\n1. **확산계수 산정**: AERMOD 등 현대 확산모델은 Pasquill 등급 대신 u\\*, L, w\\*(대류속도), 혼합고 등 **경계층 매개변수**를 직접 입력받아 σy, σz를 산정한다.\n2. **건성침적속도 산정**: Vd = 1/(Ra + Rb + Rc)에서 공기역학저항 Ra가 u\\*의 함수이므로, 침적량 평가에 필수적이다.\n3. **지표 재비산 평가**: 비산먼지 발생량은 마찰속도가 임계마찰속도(u\\*t)를 초과할 때 급증하므로, 야적장·나대지 비산먼지 저감대책(방진벽, 살수, 피복) 설계 근거가 된다.\n4. **역전층 내 확산 평가**: Ri > 0.25인 강안정 조건에서는 연직확산을 사실상 무시할 수 있어, 지표 고농도 예측 시 보수적 조건으로 적용한다.\n\n## Ⅴ. 결론\n\n리차드슨수는 열적 난류와 기계적 난류의 상대적 크기를 하나의 무차원수로 표현하여 정적안정도의 한계를 보완하는 동적안정도 지표이며, 임계값 0.25를 기준으로 난류 소멸 여부를 판정한다. 마찰속도는 표면층 난류강도의 대표값으로 로그 풍속분포와 Monin-Obukhov 상사이론의 핵심 변수이다. 최근 확산모델이 경계층 매개변수 기반으로 전환됨에 따라 u\\*, L, 혼합고의 정확한 산정이 대기질 예측 신뢰도를 좌우하므로, 국내 기상관측망의 난류 플럭스 관측 확충이 필요하다.\n","side":[{"title":"조도길이(z₀)와 영면변위(d)","body":"### 조도길이 z₀\n로그 풍속분포에서 풍속이 0이 되는 가상 고도. 지표면의 거칠기를 길이 차원으로 표현한 값.\n\n| 지표조건 | z₀ (m) |\n|---|---|\n| 잔잔한 수면 | 0.0001 ~ 0.001 |\n| 눈·모래 | 0.001 ~ 0.005 |\n| 초지 | 0.01 ~ 0.03 |\n| 농경지 | 0.05 ~ 0.1 |\n| 관목·산림 | 0.5 ~ 1.0 |\n| 도시·시가지 | 1.0 ~ 3.0 |\n\n### 영면변위 d\n밀집한 식생·건물군에서는 유효 지표면이 위로 밀려 올라가므로, 이를 보정하는 높이.\n- 통상 d ≈ 0.7 × (평균 장애물 높이 h)\n- z₀ ≈ 0.1 × h\n\n### 대기환경 의의\n- z₀가 클수록 기계적 난류 증가 → 확산 양호, 그러나 풍속 감소\n- 도시는 z₀가 커서 풍속이 낮아 **환기(ventilation)가 불량** → 도시 대기질 악화 및 열섬 심화의 물리적 원인\n- 확산모델에서 도시/농촌 확산계수를 구분하는 근거\n\n### 조도길이의 실무 산정\n1. **분류표 적용(가장 일반적)**: 토지이용도(위성·GIS)를 조도등급으로 환산\n2. **풍속 프로파일 회귀**: 2개 이상 고도의 관측풍속을 ln(z)에 대해 회귀 → 절편에서 z₀ 역산\n3. **Lettau 식**: z₀ ≈ 0.5·h·(s/S)  (h: 장애물 높이, s: 실루엣 면적, S: 점유 면적)\n\n### 풍향별 z₀ 적용\nAERMET(AERMOD 전처리기)는 관측지점 주변을 최대 12개 섹터로 나누어 **풍향별 z₀·알베도·보웬비**를 입력받는다. 해안·도시 경계처럼 방향에 따라 지표특성이 크게 다른 지점에서는 필수적이다.\n\n### 실무 유의사항\n- 계절별 변화 반영: 농경지는 생육기/휴경기 z₀가 3~5배 차이\n- 적설 시 z₀ 급감 → 풍속 증가\n- z₀ 과대 산정 시 풍속 과소평가 → **농도 과대예측(보수적)**\n"},{"title":"난류의 종류와 확산","body":"### 1. 기계적 난류(Mechanical Turbulence)\n- **생성원인**: 풍속의 연직전단(wind shear), 지표 조도, 건물·지형 장애물\n- 풍속이 클수록, 지표가 거칠수록 강함\n- 안정도와 무관하게 발생 → 야간 강풍 시에도 확산이 이루어지는 이유\n- 규모(eddy size)가 작아 **국지적 희석**에 기여\n\n### 2. 열적(대류) 난류(Thermal/Convective Turbulence)\n- **생성원인**: 지표 가열에 의한 부력\n- 주간·맑은 날·저풍속 시 최대\n- eddy 규모가 커서 **연기의 Looping** 발생 → 순간 착지 고농도 유발\n- 대류속도 척도 w\\* = [(g/T)·(w'θ')₀·zi]^(1/3)\n\n### 3. 상호관계\n- **Ri**가 두 난류의 비를 표현\n- 주간 불안정: 열적 난류 지배 → Looping, 확산 양호하나 국지 고농도\n- 야간 안정: 기계적 난류만 존재 → Fanning, 확산 불량\n- 중립(흐린 날·강풍): 기계적 난류 지배 → Coning, 가우시안 확산 가정이 가장 잘 성립\n\n### 난류강도(Turbulence Intensity)\nI = σu / ū  (풍속 변동의 표준편차 / 평균풍속)\n- 개활지 중립: 약 0.10~0.15\n- 도시: 0.20~0.30\n- 값이 클수록 확산 양호\n\n### 난류 에너지 수지(TKE 방정식)\n∂e/∂t = **전단생성(S)** + **부력생성/소멸(B)** − 소산(ε) − 수송\n- B > 0 (불안정): 부력이 난류를 생성\n- B < 0 (안정): 부력이 난류를 소멸시킴\n- **Ri = −B/S** 의 물리적 의미가 여기서 나온다\n\n### 에디 규모와 확산\n| 에디 크기 vs 플룸 폭 | 거동 |\n|---|---|\n| 에디 ≪ 플룸 | 플룸 내부를 균질하게 희석 |\n| 에디 ≈ 플룸 | 플룸을 찢어 확산 극대화 |\n| **에디 ≫ 플룸** | 플룸 전체를 통째로 이동 → **Looping**, 순간 착지 |\n\n주간 대류 에디(규모 ~혼합고)가 플룸보다 훨씬 커서 Looping이 나타나는 이유이다.\n"},{"title":"AERMOD의 경계층 매개변수","body":"### 배경\n과거 ISCST3는 Pasquill 6등급의 이산적 안정도로 σy, σz를 산정하여 실제 난류구조 반영에 한계가 있었다. **AERMOD**(US EPA 규제모델, 국내 환경영향평가 권장모델)는 경계층을 연속적 매개변수로 기술한다.\n\n### 주요 입력 매개변수 (AERMET 전처리 산출)\n| 매개변수 | 기호 | 의미 |\n|---|---|---|\n| 마찰속도 | u\\* | 기계적 난류 강도 |\n| 대류속도 척도 | w\\* | 열적 난류 강도 |\n| Monin-Obukhov 길이 | L | 안정도 |\n| 대류혼합고 | zic | 주간 혼합층 두께 |\n| 기계적혼합고 | zim | 야간 혼합층 두께 |\n| 온위경사 | dθ/dz | 안정층 강도 |\n| 지표열플럭스 | H | 부력 생성 |\n\n### 특징\n- **불안정(CBL)**: 비대칭(bi-Gaussian) 연직농도분포 적용 → 상승·하강 기류 구분\n- **안정(SBL)**: 가우시안 분포 유지\n- 지형효과(플룸의 지형 상승/우회) 및 도시 열섬 보정 기능 포함\n\n### AERMOD의 구성\n| 모듈 | 기능 |\n|---|---|\n| **AERMET** | 기상 전처리 — 지상·상층 관측 → u\\*, w\\*, L, zi 산출 |\n| **AERMAP** | 지형 전처리 — DEM으로 수용점·배출원 표고 및 지형고도척도 산정 |\n| **BPIP-PRIME** | 건물 제원 전처리 — Down Wash 계산용 |\n| **AERMOD** | 확산 계산 본체 |\n\n### 지형효과 처리 (개념)\n안정 조건에서 플룸은 지형을 **우회**하고, 불안정 조건에서는 지형을 **타고 넘는다.** AERMOD는 두 극한(수평 플룸 / 지형 추종 플룸)의 농도를 각각 계산한 뒤, **임계분할고도(dividing streamline height, Hc)**로 가중평균한다.\n\nC_total = f·C_지형추종 + (1−f)·C_수평\n\n### 입력자료 요구사항\n- 지상기상: 시간별 풍향·풍속·기온·운량·운고 (1년 이상)\n- 상층기상: 1일 1회 이상 라디오존데(혼합고 산정용)\n- 지표특성: 풍향섹터별 z₀·알베도·보웬비\n- 배출원: 위치·높이·직경·배출온도·토출속도·배출률\n"}]},"4":{"day":4,"date":"2026-08-04","title":"Pasquill-Gifford 대기안정도 등급","keywords":[{"k":"안정도 6등급 체계","subs":["A(강불안정)~F(안정)","G 추가 시 7등급(극안정)","D는 중립"]},{"k":"주간 분류인자","subs":["지상 10m 풍속","일사강도(강·중·약)","태양고도각으로 판정"]},{"k":"야간 분류인자","subs":["지상 10m 풍속","운량(≥4/8 또는 ≤3/8)","박명 시 D 적용"]},{"k":"확산계수 σy·σz","subs":["Pasquill-Gifford 곡선","풍하거리 x의 함수","도시/농촌 구분(Briggs식)"]},{"k":"한계와 대안","subs":["이산적 6등급의 불연속성","혼합고·지형 미반영","AERMOD의 연속 매개변수화"]}],"answer":"# Pasquill-Gifford 대기안정도 등급\n\n## Ⅰ. 개요\n\n**Pasquill 안정도 등급**은 일상적으로 관측 가능한 **풍속·일사량·운량**만으로 대기안정도를 6등급(A~F)으로 분류하는 실용적 방법이다. Gifford가 이 등급에 대응하는 **확산계수(σy, σz) 곡선**을 제시함으로써 가우시안 확산모델의 표준 입력체계로 정착되었으며, 국내 대기환경영향평가에서도 널리 활용된다.\n\n## Ⅱ. 안정도 등급 체계\n\n| 등급 | 명칭 | 안정도 | 연기형태 | 대표 기상 |\n|---|---|---|---|---|\n| A | 매우 불안정 | 강한 대류 | Looping | 맑은 여름 낮, 미풍 |\n| B | 불안정 | 대류 | Looping | 맑은 낮 |\n| C | 약간 불안정 | 약한 대류 | Coning | 낮, 중풍 |\n| D | 중립 | 중립 | Coning | 흐림, 강풍(주·야 무관) |\n| E | 약간 안정 | 약안정 | Fanning | 야간, 약풍 |\n| F | 안정 | 강안정 | Fanning | 맑은 야간, 미풍 |\n| (G) | 매우 안정 | 극안정 | Fanning | 강한 접지역전 |\n\n## Ⅲ. 등급 판정 방법\n\n### 1. 주간(일사 기준)\n\n| 지상 10m 풍속(m/s) | 강한 일사 | 보통 일사 | 약한 일사 |\n|---|---|---|---|\n| < 2 | A | A~B | B |\n| 2 ~ 3 | A~B | B | C |\n| 3 ~ 5 | B | B~C | C |\n| 5 ~ 6 | C | C~D | D |\n| > 6 | C | D | D |\n\n- **일사강도**는 태양고도각으로 판정: 60° 초과=강, 35~60°=보통, 15~35°=약\n- 운량이 많으면 일사강도를 한 단계 낮춤\n\n### 2. 야간(운량 기준)\n\n| 지상 10m 풍속(m/s) | 운량 ≥ 4/8(흐림) | 운량 ≤ 3/8(맑음) |\n|---|---|---|\n| < 2 | F(또는 G) | F |\n| 2 ~ 3 | E | F |\n| 3 ~ 5 | D | E |\n| 5 ~ 6 | D | D |\n| > 6 | D | D |\n\n### 3. 공통 원칙\n- **일출 전후·일몰 전후 1시간(박명)**은 중립(D)으로 간주\n- **운량 8/8(완전 흐림)**은 주·야 관계없이 D\n- **풍속이 클수록** 기계적 난류가 지배하여 중립(D)에 수렴\n- 국내 실무에서는 기상청 종관관측(ASOS) 자료를 이용해 시간별 등급을 산정하고, **기상결합빈도(풍향×풍속×안정도)**를 작성하여 장기 평균농도 예측에 사용한다\n\n## Ⅳ. 확산계수(σy, σz)\n\n### 1. 개념\n가우시안 플룸 모델의 농도식\n\nC = (Q / 2π·u·σy·σz) · exp(-y²/2σy²) · [exp(-(z-He)²/2σz²) + exp(-(z+He)²/2σz²)]\n\n에서 σy(수평 확산폭), σz(연직 확산폭)는 **안정도 등급과 풍하거리 x의 함수**로 결정된다.\n\n### 2. Briggs 근사식(개활지 기준)\n\n| 등급 | σy (m) | σz (m) |\n|---|---|---|\n| A | 0.22x(1+0.0001x)^-1/2 | 0.20x |\n| B | 0.16x(1+0.0001x)^-1/2 | 0.12x |\n| C | 0.11x(1+0.0001x)^-1/2 | 0.08x(1+0.0002x)^-1/2 |\n| D | 0.08x(1+0.0001x)^-1/2 | 0.06x(1+0.0015x)^-1/2 |\n| E | 0.06x(1+0.0001x)^-1/2 | 0.03x(1+0.0003x)^-1 |\n| F | 0.04x(1+0.0001x)^-1/2 | 0.016x(1+0.0003x)^-1 |\n\n### 3. 도시·농촌 구분\n- 도시는 지표조도와 열섬효과로 난류가 강해 **동일 기상에서도 확산이 양호**\n- Briggs는 도시(urban)·개활지(rural)용 σ식을 별도로 제시\n- 실무적으로 도시지역은 안정도 등급을 한 단계 불안정 쪽으로 조정하기도 함\n\n### 4. 특징\n- σy, σz는 **x가 증가할수록 증가**하며, 불안정(A)일수록 급격히 증가\n- σz는 혼합고(zi)에 도달하면 성장이 멈추고 **반사·완전혼합** 가정으로 전환\n\n## Ⅴ. 한계와 개선방향\n\n### 1. 한계\n1. **이산적 6등급**: 연속적인 실제 안정도를 6개로 불연속 처리 → 등급 경계에서 농도가 급변\n2. **혼합고 미반영**: 등급 자체에 경계층 두께 정보가 없음\n3. **적용범위 제약**: 평탄지형, 풍하 100m~10km, 정상상태 가정. 복잡지형·저풍속(<1m/s)·장거리 확산 부적합\n4. **연직 비균질성 무시**: 풍속·확산계수를 고도 방향으로 일정하다고 가정\n5. 원자료가 1960년대 영국 개활지 실험(Prairie Grass 등) 기반이라 국내 적용성 검증 필요\n\n### 2. 개선방향\n- **AERMOD**: u\\*, w\\*, L, zi 등 경계층 매개변수를 직접 사용하는 연속적 안정도 기술. 불안정 조건에서 비대칭 농도분포 적용. 국내 환경영향평가 권장모델\n- **CALPUFF**: 비정상·비균질 퍼프 모델로 저풍속·복잡지형·장거리 이송에 적용\n- **CFD/WRF-CMAQ**: 건물군 국지 유동 및 광화학 반응 포함 해석\n\n## Ⅵ. 결론\n\nPasquill-Gifford 안정도 등급은 최소한의 기상관측만으로 확산계수를 산정할 수 있어 실무 적용성이 매우 높으며, 지금도 스크리닝 평가와 장기 평균농도 산정의 표준으로 사용된다. 다만 이산적 분류와 평탄지형 가정이라는 구조적 한계가 있으므로, 복잡지형·저풍속·장거리 이송 조건에서는 AERMOD·CALPUFF 등 경계층 매개변수 기반 모델을 병행 적용하고, 국내 기상특성에 맞는 확산계수 검증·보정이 지속적으로 이루어져야 한다.\n","side":[{"title":"기상결합빈도함수와 장기평균농도","body":"### 개념\n장기간(연평균) 평균농도를 산정하기 위해 **풍향(16방위) × 풍속(계급) × 안정도(6등급)** 조합별 출현빈도를 집계한 표(STAR: STability ARray)를 이용하는 방법.\n\n### 산정 절차\n1. 대상지역 인근 기상관측소의 **최소 1년(권장 3~5년)** 시간별 자료 수집\n2. 시간별로 풍향·풍속·안정도 등급 판정\n3. 조합별 출현빈도 f(θ, u, s) 산정 (합 = 1)\n4. 각 조합에 대해 섹터평균 가우시안 식으로 농도 계산\n\nC̄(r) = Σ Σ Σ [f(θ,u,s) × 2.032·Q / (u·σz·r·(2π/16))] × exp(-He²/2σz²)\n\n5. 빈도 가중합으로 **장기 평균농도** 산출\n\n### 특징\n- 정상상태 가정을 장기간에 적용하므로 계산이 간단\n- **섹터평균(sector average)**을 사용해 수평 확산항(σy)을 방위각 폭으로 대체\n- 129회 기출: \"가우시안 대기확산모델 중 기상결합빈도함수를 이용하여 장기간 평균농도를 계산하는 방법\"\n- 한계: 개별 사건(고농도 에피소드) 재현 불가, 정온(calm) 처리 곤란\n\n### 섹터평균식의 유도\n장기 평균에서는 풍향이 한 섹터(16방위 → 22.5° = 2π/16 rad) 내에 균일하게 분포한다고 가정한다. 풍하거리 r에서 섹터의 호 길이는 r·(2π/16)이므로, 수평 확산항 1/(√(2π)σy)를 1/[r·(2π/16)]로 대체하면\n\nC̄ = **2.032 · Q / (u · σz · r)** × exp(−He²/2σz²)\n\n(2.032 = 16/(2π·√(2π)) × √(2π) 정리값)\n\n### STAR 표의 구성 예\n| 안정도 | 풍속계급 | N | NNE | … | 계 |\n|---|---|---|---|---|---|\n| A | 0.5~2 | 0.002 | 0.001 | … | |\n| … | | | | | |\n| F | >6 | 0.000 | 0.000 | … | |\n| **총합** | | | | | **1.000** |\n\n### 실무 유의사항\n- **정온(calm) 처리방법**을 반드시 명시 (제외 후 정규화 vs 최소풍속 대입)\n- 관측지점의 대표성 검토 — 대상지와 지형·지표조건이 유사해야 함\n- 연평균 예측치는 환경기준(연평균)과, 별도로 단기 최대치는 시간평균 기준과 비교\n"},{"title":"안정도 등급별 연기형태(Plume Behavior)","body":"| 형태 | 안정도 | ELR과 Γd | 특징 |\n|---|---|---|---|\n| **Looping**(환상형) | 불안정(A,B) | ELR > Γd | 파상 요동, 순간 착지 고농도. 주간 맑은 날 |\n| **Coning**(원추형) | 중립(C,D) | ELR ≈ Γd | 원뿔형 확산. 가우시안 가정 최적. 흐린 날·강풍 |\n| **Fanning**(부채형) | 안정(E,F) | ELR < Γd | 수평만 확산, 연직 억제. 야간 접지역전 |\n| **Lofting**(지붕형) | 하층 안정/상층 불안정 | 하부 역전 | 상방 확산, **지표농도 최소** → 가장 바람직 |\n| **Fumigation**(훈증형) | 하층 불안정/상층 안정 | 상부 역전 | 하향 급확산, **지표 최고농도**. 일출 후 역전 해소 시 |\n| **Trapping**(구속형) | 상·하층 모두 역전 | 이중 역전 | 상하 갇힘, 고농도 지속 |\n\n### 관리적 시사점\n- **Fumigation**과 **Trapping**이 최악 조건 → 굴뚝높이 결정 시 지배조건\n- Lofting을 유도하려면 **유효굴뚝높이가 역전층 상단을 초과**해야 함\n- 123회 기출: \"대기오염 축적과 관련된 연기현상에 대한 유동특수현상\"\n\n### 형태별 최대착지거리(Xmax) 경향\n| 연기형태 | 안정도 | Xmax 대략치 | 최대농도 |\n|---|---|---|---|\n| Looping | A~B | He의 5~10배 (수백 m) | 순간 최대(변동 큼) |\n| Coning | C~D | He의 10~20배 (1~3km) | 중간 |\n| Fanning | E~F | 수십 km 또는 착지 안 함 | 낮음 |\n| Fumigation | 전이 | He의 5~15배 | **최고** |\n\n### 도해 작성 요령 (답안 필수)\n연기형태 문제는 **반드시 그림**을 그려야 한다. 각 형태마다\n1. 좌측에 **기온-고도 그래프**(ELR 실선, Γd 점선)\n2. 우측에 **굴뚝과 연기 형상**\n3. 아래에 **지표농도 분포 곡선**\n\n세 요소를 나란히 배치하면 채점자가 이해도를 즉시 파악할 수 있어 가점 요인이 된다.\n\n### 시간대별 출현 순서 (하루)\n새벽 Fanning → 일출 후 **Fumigation** → 오전~오후 Looping → 저녁 Coning → 일몰 후 **Lofting** → 심야 Fanning\n"},{"title":"안정도 판정법의 비교","body":"### 1. Pasquill-Gifford 법\n- **입력**: 풍속, 일사, 운량 (일반 기상관측으로 가능)\n- **장점**: 자료 확보 용이, 실무 표준\n- **단점**: 이산적, 정성적\n\n### 2. 연직 기온경사법 (ΔT/Δz)\n- 두 고도의 기온차로 ELR 산정 후 Γd와 비교\n- US NRC 기준(원자력): ΔT/Δz(℃/100m)\n  - < -1.9 : A, -1.9~-1.7 : B, -1.7~-1.5 : C, -1.5~-0.5 : D, -0.5~1.5 : E, 1.5~4.0 : F\n- **장점**: 정량적 / **단점**: 철탑 등 연직 관측시설 필요\n\n### 3. 리차드슨수법 (Ri)\n- 기온·풍속 연직경사 모두 반영 → 기계적 난류 포함\n- **가장 물리적으로 타당**하나 관측자료 요구수준 높음\n\n### 4. 풍향 표준편차법 (σθ, Sigma-theta)\n- 수평 풍향의 변동 표준편차로 난류강도 직접 측정\n- σθ > 22.5°: A, 17.5~22.5°: B, 12.5~17.5°: C, 7.5~12.5°: D, 3.75~7.5°: E, < 3.75°: F\n- **장점**: 난류를 직접 측정, 자동관측 용이 → 최근 선호\n\n### 결론\n자료 가용성에 따라 선택하되, 가능하면 **σθ 또는 Ri**와 같은 정량적 방법을 병행 검증하는 것이 바람직하다.\n\n### 방법별 비교 요약\n| 방법 | 필요 관측 | 정량성 | 실무 적용성 |\n|---|---|---|---|\n| Pasquill-Gifford | 풍속·일사·운량 | 낮음(이산) | **매우 높음** |\n| 기온경사(ΔT/Δz) | 2고도 기온 | 높음 | 중간(철탑 필요) |\n| 리차드슨수 | 2고도 기온+풍속 | **매우 높음** | 낮음 |\n| σθ(풍향표준편차) | 고속응답 풍향계 | 높음 | 높음 |\n| Monin-Obukhov(L) | 플럭스 관측 | 매우 높음 | 낮음(초음파 풍속계) |\n\n### 방법 간 불일치 시\n동일 시각에 방법마다 등급이 다르게 나오는 경우가 흔하다. 실무 원칙은\n1. **관측 신뢰도가 높은 방법 우선** (σθ > ΔT/Δz > P-G)\n2. 목적에 따라: 규제·보수적 평가는 **더 안정한 등급** 채택\n3. 사용 방법과 근거를 평가서에 명시\n\n### 국내 적용상 유의\nPasquill 등급은 영국 개활지 실험 기반이라, 산지가 70%인 국내 지형과 여름 고온다습 조건에서는 편차가 크다. 가능하면 **현장 관측(σθ) 기반 등급**을 병행하고, 모델 검증으로 보정 필요성을 확인해야 한다.\n"}]},"5":{"day":5,"date":"2026-08-05","title":"역전층의 종류와 형성과정","keywords":[{"k":"복사역전(방사역전)","subs":["야간 지표 복사냉각","지표역전, 청명·미풍·장야","일출 후 소멸 → Fumigation"]},{"k":"침강역전","subs":["고기압 하강기류 단열압축","공중역전, 수일간 지속","LA스모그의 원인"]},{"k":"이류역전","subs":["온난공기가 한랭지표 위 이류","해풍역전·전선역전","해안·호수 인근 발생"]},{"k":"난류(혼합)역전","subs":["난류층 상부 열손실","혼합층 상단 형성","공중역전"]},{"k":"역전의 영향","subs":["연직확산 차단 → 고농도","Fumigation·Trapping 유발","대기오염 사건의 공통 원인"]}],"answer":"# 역전층의 종류와 형성과정\n\n## Ⅰ. 개요\n\n**기온역전(Temperature Inversion)**이란 고도가 상승함에 따라 기온이 오히려 상승하는 현상(ELR < 0)으로, 대기가 절대안정 상태가 되어 **연직 혼합이 차단**되는 층을 말한다. 역전층 하부에 오염물질이 축적되어 고농도 대기오염을 유발하므로, 런던스모그(1952)·LA스모그·뮤즈계곡·도노라 사건 등 역사적 대기오염 사건의 **공통적 기상요인**이다.\n\n## Ⅱ. 역전의 분류\n\n### 1. 발생 위치에 따른 분류\n- **지표역전(접지역전, Surface/Ground Inversion)**: 지표면에서 시작 → 복사역전, 이류역전\n- **공중역전(상층역전, Elevated Inversion)**: 지표에서 떨어진 상공에 형성 → 침강역전, 난류역전, 전선역전\n\n### 2. 발생 원인에 따른 분류\n복사역전, 침강역전, 이류역전, 난류역전, 전선역전\n\n## Ⅲ. 종류별 형성과정과 특성\n\n### 1. 복사역전(방사역전, Radiation Inversion)\n**형성과정**\n① 야간 지표면이 장파복사로 열을 방출(복사냉각) → ② 지표 온도가 상공보다 급격히 하강 → ③ 지표에 접한 공기가 전도·복사로 냉각 → ④ 지표역전 형성\n\n**형성 조건**\n- 맑은 하늘(운량 少): 복사냉각 억제 요인 없음\n- 미풍(< 2~3m/s): 기계적 혼합 억제\n- 긴 밤(겨울·고위도), 건조한 공기, 분지·계곡 지형(냉기호 형성)\n- 적설 시 알베도 증가로 강화\n\n**특성**\n- 두께: 수십~수백 m (통상 100~300m)\n- 지속: 일출 후 지표 가열로 하부부터 소멸 → **2~3시간 내 해소**\n- 해소 시 상층에 축적된 오염물질이 급격히 하향 혼합 → **훈증(Fumigation)** 발생, 지표 최고농도 기록\n- 우리나라 겨울철 새벽 고농도 미세먼지의 주요 원인\n\n### 2. 침강역전(Subsidence Inversion)\n**형성과정**\n① 정체성 고기압 중심부에서 상층 공기가 서서히 하강 → ② 하강하며 단열압축으로 승온(Γd = 0.98℃/100m) → ③ 하부의 냉각된 공기층 위에 온난한 층이 얹힘 → ④ 공중역전 형성\n\n**특성**\n- 두께: 수백~1,000m 이상, 넓은 지역에 걸쳐 형성\n- **수일~수주간 지속** → 가장 심각한 대기오염 유발\n- 역전층 하부에 **Trapping** 발생, 오염물질 지속 축적\n- **LA 스모그**의 대표적 원인 (태평양 고기압 + 분지지형 + 해풍)\n- 우리나라 봄·가을 이동성 고기압 정체 시 고농도 미세먼지 발생 원인\n\n### 3. 이류역전(Advection Inversion)\n**형성과정**: 온난한 공기가 상대적으로 한랭한 지표면(해면·설면·호수면) 위로 수평 이동하면서 하층이 냉각되어 형성\n\n**세부 유형**\n- **해풍역전**: 온난한 육지 공기가 찬 해면 위로 이류 → 해안 인접 산업단지 고농도 유발\n- **설면·빙면 역전**: 겨울 적설지역\n- **분지 냉기류 역전**: 산지 냉기가 계곡 저지대로 유입\n\n### 4. 난류(혼합)역전(Turbulence Inversion)\n**형성과정**: 지표 부근에서 난류혼합이 활발하면 혼합층 내부는 단열감률에 가까워지나, 혼합층 **상단부**에서 열을 잃고 상부 비혼합층과의 사이에 얇은 역전층 형성\n\n**특성**: 혼합고(mixing height)의 상단을 정의하는 역전으로, 확산모델의 반사면 역할\n\n### 5. 전선역전(Frontal Inversion)\n**형성과정**: 온난전선·한랭전선에서 따뜻한 기단이 찬 기단 위로 올라타면서 경계면에 형성. 경사진 공중역전이며 이동성이 커 지속시간이 짧다.\n\n## Ⅳ. 역전층의 영향\n\n| 구분 | 내용 |\n|---|---|\n| 확산 | 연직확산 차단(σz 성장 정지) → 지표농도 상승 |\n| 연기형태 | Fanning(역전 내), Fumigation(하부 해소), Lofting(상부 배출), Trapping(이중역전) |\n| 2차 오염 | 정체로 반응시간 확보 → 2차 PM2.5·오존 생성 촉진 |\n| 시정 | 에어로졸 축적으로 시정장애·연무 발생 |\n| 사건 | 런던스모그(복사역전+무풍), LA스모그(침강역전), 뮤즈계곡·도노라(계곡 복사역전) |\n\n## Ⅴ. 대응 및 관리방안\n\n1. **굴뚝 설계**: 유효굴뚝높이(He)를 **역전층 상단 위로** 설계하여 Lofting 유도. 역전층 두께·발생빈도 조사 필수\n2. **입지 계획**: 분지·계곡 등 역전 다발지역의 배출시설 입지 제한, 바람길 확보\n3. **예보·저감조치**: 역전 발생·정체 예상 시 **비상저감조치**(배출시설 가동조정, 차량 운행제한), **상한제약** 시행\n4. **연료·연소 관리**: 계절관리제 기간 중 저황유·LNG 전환, 발전 상한제약\n5. **모니터링**: 라디오존데·라이다·SODAR·RASS로 역전 고도·강도 실시간 감시\n\n## Ⅵ. 결론\n\n역전층은 복사·침강·이류·난류·전선의 5가지 기작으로 형성되며, 특히 **야간 복사역전**과 **정체성 고기압에 의한 침강역전**이 국내 고농도 미세먼지 사건의 지배적 요인이다. 역전은 인위적으로 제거할 수 없으므로, 역전 발생 특성을 반영한 **굴뚝높이 설계·입지관리·예보 기반 비상저감조치**라는 사전예방적 접근이 필수적이며, 연직 기상관측 인프라 확충을 통한 예측 정확도 향상이 병행되어야 한다.\n","side":[{"title":"훈증(Fumigation) 현상과 최대착지농도","body":"### 정의\n야간에 형성된 역전층이 일출 후 지표부터 해소되면서, 역전층 상부에 축적되어 있던 오염물질이 **급격히 하향 혼합되어 지표 고농도**를 나타내는 현상.\n\n### 발생 과정\n1. 야간 복사역전 형성 → 굴뚝 배출가스가 역전층 상부에서 Fanning 상태로 수평 확산·축적\n2. 일출 후 지표 가열 → 하부부터 불안정층(혼합층) 성장\n3. 혼합층 상단이 플룸 고도에 도달 → 플룸 전체가 하향 급확산\n4. **지표에서 최고농도** 발생 (지속 30분~2시간)\n\n### 농도식 (완전혼합 가정)\nC = Q / (√(2π) · u · σy · hi)\n- hi: 훈증 시 혼합고 (≈ He + 2σz)\n- 수평은 가우시안, 연직은 혼합고 내 균일 분포로 가정\n\n### 관리적 의의\n- 통상 **일출 후 2~3시간**, 계절적으로 겨울~봄에 빈발\n- 굴뚝 인근 주거지 민원의 주요 원인\n- **Building Down Draught / Down Wash**와 함께 126회 기출 출제\n- 대책: 굴뚝높이 상향, 배출가스 온도·유속 확보(부력·운동량 상승 증대), 야간 가동률 조정\n\n### 훈증의 지속시간 추정\n혼합층이 플룸 고도까지 성장하는 데 걸리는 시간과, 플룸을 완전히 삼키는 데 걸리는 시간의 차이가 훈증 지속시간이다. 통상 **30분~2시간**이며, 겨울 강한 역전에서는 더 길다.\n\n### 해안 훈증(Shoreline Fumigation)\n내륙 훈증과 별개로, **해안 산업단지에서 주간에 상시 발생**하는 유형.\n1. 해상 위 안정한 공기(찬 해면)가 육지로 이류\n2. 육지에 도달하며 지표 가열로 하부부터 불안정화 → **내부경계층(TIBL, Thermal Internal Boundary Layer)** 성장\n3. 해상 구간에서 안정하게 이송된 플룸이 TIBL에 삼켜지며 지표 급강하\n\nTIBL 높이: h ≈ A·√(x)  (x: 해안선으로부터 내륙거리, A: 상수)\n→ **해안선에서 수 km 내륙 지점에 고농도** 형성. 국내 동·남해안 산단의 구조적 문제.\n\n### 대책\n- 굴뚝높이 결정 시 훈증 조건을 **지배조건**으로 반영\n- TIBL 교차지점을 최대영향예상지점으로 선정\n- 오전 시간대 부하 조정, 배출온도·토출속도 확보\n"},{"title":"혼합고(Mixing Height)와 통풍계수","body":"### 혼합고\n지표에서 발생한 오염물질이 연직으로 혼합될 수 있는 대기층의 두께. 상단은 통상 역전층(안정층) 하단.\n\n### 일변화\n- **일출 전**: 야간 안정경계층(SBL), 혼합고 100~300m로 최소\n- **일출 후**: 지표 가열로 대류혼합층(CBL) 성장\n- **오후 2~4시**: 최대혼합고(MMD, Maximum Mixing Depth) 1,000~2,000m\n- **일몰 후**: 급격히 붕괴, 잔류층(residual layer) 남음\n\n### 산정방법\n1. **단열선도법**: 지표 최고기온에서 건조단열선을 그어 아침 기온연직분포(ELR)와 만나는 고도\n2. **온위 프로파일법**: dθ/dz가 급증하는 고도\n3. **원격탐사**: LIDAR(에어로졸 후방산란 급감 고도), SODAR, RASS, 실링미터\n4. **모델 진단**: WRF 등 기상모델의 PBL 스킴\n\n### 통풍계수(Ventilation Coefficient)\n**VC = 혼합고(m) × 혼합층 평균풍속(m/s)  [m²/s]**\n- VC < 6,000 m²/s: 확산 불량 → 고농도 우려\n- 대기질 예보 및 배출시설 입지 평가 지표로 활용\n\n### 혼합고 산정 시 유의사항\n- **야간 혼합고**는 정의가 모호(간헐 난류) → 모델마다 다르게 산정. AERMOD는 기계적 혼합고 zim과 대류 혼합고 zic을 구분\n- **잔류층을 혼합고에 포함하지 않는다** — 잔류층은 난류가 없어 실질 혼합이 일어나지 않음\n- 라이다 관측 시 **구름·강수·에어로졸 층상구조**로 오판 가능 → 온위 프로파일과 교차검증\n\n### 혼합고와 농도의 관계\n완전혼합 가정에서 C ∝ 1/(H·u) 이므로\n\n| 조건 | 혼합고 | 풍속 | 상대농도 |\n|---|---|---|---|\n| 오후(불안정) | 1,500m | 5m/s | 1.0 (기준) |\n| 새벽(안정) | 200m | 1.5m/s | **25배** |\n\n→ 야간·새벽 고농도의 정량적 근거\n\n### 국내 혼합고 특성\n- 여름 오후 최대 2,000~2,500m, 겨울 오후 800~1,200m\n- 겨울 새벽 100~200m로 최소 → 계절관리제 시행의 물리적 근거\n- 서해안은 해풍 유입 시 TIBL로 혼합고가 급격히 낮아짐\n"},{"title":"주요 대기오염 사건과 기상요인","body":"| 사건 | 연도 | 기상요인 | 주 오염물질 | 피해 |\n|---|---|---|---|---|\n| 뮤즈계곡(벨기에) | 1930 | 계곡 복사역전, 무풍, 안개 | SO₂, 황산미스트 | 사망 63명 |\n| 도노라(미국) | 1948 | 계곡 역전, 5일 정체 | SO₂, 먼지 | 사망 20명, 6,000명 이환 |\n| 런던스모그 | 1952 | **복사역전 + 무풍 + 짙은 안개**, 저온 | SO₂, 매연(석탄) | 약 4,000명(누적 12,000명) |\n| LA스모그 | 1954~ | **침강역전 + 분지 + 강한 일사** | NOx, VOC → **O₃(2차)** | 눈·호흡기 자극, 식물피해 |\n| 요코하마(일본) | 1946 | 역전, 해안 | SO₂, 먼지 | 천식 |\n| 보팔(인도) | 1984 | 야간 역전, 무풍 | MIC(메틸이소시아네이트) | 사망 2,500명 이상 |\n\n### 런던형 vs LA형 스모그 비교\n| 구분 | 런던형 | LA형 |\n|---|---|---|\n| 발생시기 | 겨울 새벽, 저온다습 | 여름 한낮, 고온건조 |\n| 역전 | 복사역전(지표) | 침강역전(공중) |\n| 원인물질 | SO₂, 매연 (석탄) | NOx, VOC (자동차) |\n| 반응 | 환원형 | **산화형(광화학)** |\n| 주 생성물 | 황산미스트 | O₃, PAN, 알데하이드 |\n\n### 사건이 주는 교훈과 제도적 대응\n| 사건 | 교훈 | 제도적 산물 |\n|---|---|---|\n| 뮤즈계곡·도노라 | 지형+역전의 위험성 | 배출원 입지규제 개념 |\n| **런던스모그** | 생활연료(석탄) 규제 필요 | **영국 청정대기법(1956)**, 무연탄지역 지정 |\n| **LA스모그** | 2차 오염물질 개념 확립 | 미국 대기청정법(CAA), 자동차 배출규제, **오존 기준** |\n| 보팔 | 사고 대비 필요 | 미국 EPCRA, 국내 **장외영향평가·위해관리계획** |\n\n### 공통 기상요인 3가지 (암기)\n1. **역전층** (복사 또는 침강)\n2. **무풍·저풍속** (정체)\n3. **분지·계곡 지형** 또는 안개(습도)\n\n### 국내 시사점\n우리나라는 국토의 70%가 산지이고 대도시 다수가 분지(대구·춘천·원주)이며, 겨울 정체성 고기압이 빈발하여 **역사적 사건과 동일한 기상조건이 반복적으로 형성**된다. 다만 SO₂ 규제가 성공하여 런던형은 재현되지 않으며, 현재 문제는 **2차 생성 PM2.5와 오존**이라는 LA형에 가깝다.\n"}]},"6":{"day":6,"date":"2026-08-06","title":"대기경계층과 혼합고","keywords":[{"k":"대기경계층(PBL) 구조","subs":["접지층(하부 10%, 플럭스 일정)","에크만층(전이층, 코리올리 영향)","자유대기와 구분"]},{"k":"주간 대류경계층(CBL)","subs":["혼합층·유입층 구조","온위 거의 일정(잘 혼합)","최대혼합고 1~2km"]},{"k":"야간 안정경계층(SBL)","subs":["안정층 + 잔류층","혼합고 100~300m","야간 제트류 발생"]},{"k":"혼합고 산정","subs":["단열선도법·온위경사법","LIDAR·SODAR·RASS 원격탐사","모델 PBL 스킴"]},{"k":"통풍계수","subs":["VC = 혼합고 × 평균풍속","6,000 m²/s 미만 시 확산불량","대기질 예보 지표"]}],"answer":"# 대기경계층과 혼합고\n\n## Ⅰ. 개요\n\n**대기경계층(PBL, Planetary Boundary Layer)**은 대류권 최하부에서 지표면의 마찰·가열·냉각 영향을 직접 받아 **1시간 이내로 반응**하는 층으로, 두께는 통상 100m~2km이다. 대기오염물질의 배출·확산·희석·침적이 사실상 전량 이 층에서 일어나므로, PBL 구조와 그 상단인 **혼합고(Mixing Height)**의 이해는 대기질 예측의 핵심이다.\n\n## Ⅱ. 대기경계층의 연직 구조\n\n### 1. 접지층(Surface Layer, 표면층)\n- PBL 하부 약 **10%** (수십~100m)\n- 운동량·열·수증기의 **난류 플럭스가 고도에 무관하게 거의 일정** → constant flux layer\n- 코리올리력 무시, 풍향 일정, 풍속은 **로그분포**: u(z) = (u\\*/k)·ln(z/z₀)\n- 마찰속도 u\\* = √(τ₀/ρ) 가 이 층의 대표 난류 척도\n- Monin-Obukhov 상사이론이 적용되는 구간\n\n### 2. 에크만층(Ekman Layer, 전이층)\n- 접지층 상부 ~ PBL 상단\n- **마찰력 + 기압경도력 + 전향력**이 균형 → 고도상승에 따라 풍향이 지균풍 방향으로 시계방향 회전(북반구)\n- 풍향의 연직 회전 궤적을 **에크만 나선(Ekman Spiral)**이라 함\n\n### 3. 자유대기(Free Atmosphere)\n- PBL 상단 이상. 지표 마찰 영향 소멸, 지균풍(geostrophic wind)이 성립\n\n## Ⅲ. 경계층의 일변화\n\n### 1. 주간 대류경계층(CBL, Convective Boundary Layer)\n① 일출 후 지표 가열 → 부력에 의한 열적 난류(thermal) 발생\n② 혼합층(mixed layer)이 아래에서 위로 성장\n③ **오후 2~4시 최대**: 1,000~2,000m (내륙 여름 최대 2,500m 이상)\n\n**구조**\n- **혼합층**: 온위·풍속·오염물질 농도가 연직으로 거의 균일 (잘 혼합)\n- **유입층(Entrainment Zone)**: 상단 10~40%, 자유대기 공기가 하향 유입되는 층\n- 대류속도 척도 w\\* = [(g/T)·(w'θ')₀·zi]^(1/3), 통상 1~2 m/s\n\n### 2. 야간 안정경계층(SBL, Stable Boundary Layer)\n① 일몰 후 지표 복사냉각 → 하부부터 안정화\n② **안정층(SBL)**: 100~300m, 기계적 난류만 존재(간헐적)\n③ **잔류층(Residual Layer)**: 낮의 혼합층이 남은 중립층. 오염물질이 갇힌 채 잔류\n④ **야간 제트(Nocturnal Jet, Low-Level Jet)**: 안정층 상단에서 마찰 분리로 풍속 극대(초지균풍) → 야간 장거리 이송의 주요 통로\n\n## Ⅳ. 혼합고(Mixing Height)\n\n### 1. 정의\n지표에서 배출된 오염물질이 난류에 의해 연직으로 혼합될 수 있는 대기층의 두께. 상단은 통상 **안정층(역전층) 하단**이다.\n\n### 2. 산정방법\n\n| 방법 | 원리 | 특징 |\n|---|---|---|\n| **단열선도법** | 지표 최고기온에서 건조단열선을 그어 아침 ELR과 만나는 고도(MMD) | 간편, 일 최대치 산정 |\n| **온위경사법** | dθ/dz가 급증하는 고도 | 정량적, 모델 표준 |\n| **Bulk Ri 법** | Ri_B = 임계값(0.25)에 도달하는 고도 | 안정·불안정 모두 적용 |\n| **LIDAR** | 에어로졸 후방산란 급감 고도 | 연속 관측, 고해상도 |\n| **SODAR/RASS** | 음파 산란 강도·기온 프로파일 | 경계층 전용 |\n| **실링미터(Ceilometer)** | 후방산란 경도 | 상시 운영 용이 |\n| **기상모델** | WRF의 PBL 파라미터화(YSU, MYJ 등) | 시공간 연속장 제공 |\n\n### 3. 최대혼합고(MMD, Maximum Mixing Depth)\n- 하루 중 최대 혼합고. 여름 > 겨울, 오후 최대\n- MMD가 작을수록(겨울·야간) 오염물질 희석용적 감소 → **고농도**\n\n## Ⅴ. 통풍계수(Ventilation Coefficient)\n\n**VC = 혼합고 H(m) × 혼합층 평균풍속 ū(m/s)  [m²/s]**\n\n- 단위시간·단위폭당 대기가 오염물질을 실어 나르는 능력\n- **VC < 6,000 m²/s: 확산 불량** → 고농도 발생 가능성 높음\n- 지역 대기환경 용량 평가, 산업단지 입지 적정성 검토, 대기질 예보 지표로 활용\n\n## Ⅵ. 대기환경 관리적 활용\n\n1. **확산모델 입력**: σz가 혼합고에 도달하면 성장을 멈추고 상·하 **반사(reflection)** 후 완전혼합으로 전환. AERMOD는 zic(대류)·zim(기계적) 혼합고를 별도 입력\n2. **고농도 예보**: 혼합고 저하 + 저풍속 + 역전 → 비상저감조치 발령 판단 근거\n3. **굴뚝높이 결정**: 유효굴뚝높이가 혼합고를 초과하면 지표 영향 최소화(Lofting), 미달 시 Trapping\n4. **환경용량 산정**: VC 기반으로 지역 배출허용총량 할당의 과학적 근거 제공\n5. **장거리 이송**: 잔류층·야간 제트를 통한 국외 유입 미세먼지 이송 경로 해석\n\n## Ⅶ. 결론\n\n대기경계층은 접지층·에크만층으로 구성되며, 주간 대류경계층과 야간 안정경계층의 뚜렷한 일변화를 보인다. 혼합고는 오염물질의 희석용적을 결정하는 핵심 변수로, 통풍계수와 함께 대기환경용량 평가 및 고농도 예보의 정량적 지표로 활용된다. 국내에서는 라이다·실링미터 등 연직 원격탐사망이 아직 제한적이므로, 관측망 확충과 WRF-CMAQ 등 수치모델의 PBL 스킴 검증을 통해 혼합고 산정 정확도를 높이는 것이 시급하다.\n","side":[{"title":"야간 제트(Nocturnal Low-Level Jet)","body":"### 정의\n야간 안정경계층 상단(통상 100~500m)에서 나타나는 풍속 극대층. 지균풍보다 강한 **초지균풍(supergeostrophic)**이 형성된다.\n\n### 형성 기작\n1. 일몰 후 지표 냉각 → 하부 안정층 형성\n2. 안정층이 상부 잔류층과 **마찰적으로 분리(decoupling)**\n3. 마찰력이 사라진 잔류층 공기가 기압경도력·전향력만으로 관성진동\n4. 지균 평형을 넘어 가속 → 풍속 극대(10~20 m/s)\n\n### 대기환경적 의의\n- **장거리 이송의 고속 통로**: 야간에 오염물질이 잔류층을 타고 수백 km 이송\n  → 국외 유입 미세먼지, 오존 전구물질의 광역 이송 설명\n- 새벽 하층 오염물질의 급격한 이동으로 예보 불확실성 증가\n- 아침 혼합층 성장 시 잔류층 오염물질이 하향 혼합 → 오전 농도 급상승\n- 풍력발전 출력 예측에서도 중요 인자\n\n### 관측 방법\n- **윈드프로파일러(Wind Profiler)**: 도플러 레이더로 연직 풍향·풍속 프로파일 연속 관측. 국내 기상청 다수 운영\n- **라디오존데**: 야간 제트 고도·강도 직접 확인\n- **라이다**: 에어로졸 층상구조로 잔류층 경계 파악\n\n### 국내 관측 사례\n- 야간 제트 고도 200~500m, 풍속 12~18 m/s가 서해상~내륙에서 관측\n- 봄철 황사·국외 유입 미세먼지 사례에서 야간 제트와 농도 급증 시각이 일치\n\n### 대기질 예보상의 함의\n1. 야간 제트로 이송된 오염물질은 **잔류층에 저장**된 채 새벽까지 지표에 나타나지 않음\n2. 일출 후 혼합층이 잔류층에 도달하면 **하향 혼합(fumigation)**으로 오전 8~10시 농도 급등\n3. 따라서 새벽 측정농도가 낮아도 오전 고농도를 배제할 수 없음 → **연직 관측 병행 필요**\n"},{"title":"대기환경용량(Environmental Capacity)","body":"### 정의\n특정 지역의 환경기준을 달성·유지하면서 수용할 수 있는 **최대 오염물질 배출 허용량**. 129회 기출('환경용량').\n\n### 산정 개념\n1. **물리적(확산) 접근**: 통풍계수·확산모델을 이용해 환경기준 농도를 만족하는 최대 배출량 역산\n   Q_max = (C_기준 - C_배경) / (모델 전달함수)\n2. **총량적 접근**: 지역 배출인벤토리 + 대기질 모델링 → 목표농도 달성 배출량 산정\n3. **생태적 접근**: 임계부하량(Critical Load) 개념 — 산성·질소 침적이 생태계 피해를 일으키지 않는 한계\n\n### 활용\n- **대기관리권역법**상 사업장 **배출허용총량 할당**의 과학적 근거\n- 산업단지 입지·개발계획 적정성 평가(환경영향평가)\n- 지역배출허용기준·특별대책지역 설정\n\n### 한계\n- 배경농도·국외 기여도 불확실성\n- 기상 변동성에 따른 용량 변화\n- 지역 간 이동·2차 생성 반영의 어려움\n→ 모델 신뢰도 향상과 지역 간 협력 관리체계가 병행되어야 함\n\n### 임계부하량(Critical Load)\n생태계에 장기적으로 유해한 영향을 주지 않는 오염물질 침적량의 상한.\n- 산성 임계부하: 토양·수계의 완충능(염기포화도, ANC)으로 산정\n- 질소 임계부하: 부영양화·생물다양성 변화 기준\n- **PAI(Potential Acid Input)**: 잠재 산부하량 = (SO₄²⁻ + NO₃⁻ + NH₄⁺ 침적당량) − (염기양이온 침적당량)\n  → 최근 기출 용어. 값이 클수록 토양 산성화 위험 큼\n\n### 초과분(Exceedance) 개념\nExceedance = 실제 침적량 − 임계부하량\n- 유럽 CLRTAP 체제에서 **국가별 감축의무 배분의 과학적 근거**로 사용\n- 국내는 산림토양 산성화 감시 및 동아시아 산성강하물 모니터링(EANET)에 활용\n\n### 총량관리와의 연계\n「대기관리권역법」상 사업장 배출허용총량은 ① 권역 환경용량 ② 기준연도 배출량 ③ 삭감계획을 종합해 산정하며, 배출권 거래(총량 내 이전)가 허용된다.\n"},{"title":"WRF-CMAQ 모델링 체계","body":"### 구성\n| 단계 | 모델 | 역할 |\n|---|---|---|\n| 기상장 | **WRF** | 3차원 기상장(바람·기온·습도·PBL) 생성 |\n| 배출량 | **SMOKE** | CAPSS 배출인벤토리를 시공간·화학종별로 할당 |\n| 대기질 | **CMAQ** | 이송·확산·화학반응·침적 계산 |\n\n### 특징\n- **오일러리안 격자 모델**: 고정 격자에서 질량보존식 수치해석\n- **광화학 메커니즘**: SAPRC, CB6 등 → O₃, 2차 PM2.5 생성 모의\n- **에어로졸 모듈(AERO)**: 무기·유기 에어로졸 생성·성장\n- 격자 해상도: 국가 27km → 수도권 9km → 도시 3km 순차 축소(nesting)\n\n### 활용\n- 미세먼지 **기여도 분석**: BFM(Brute-Force Method), DDM, ISAM\n- 국외 유입 기여율 산정, 배출저감 정책 효과 사전평가\n- 대기환경관리 기본계획·미세먼지 관리 종합계획 수립 근거\n\n### 한계\n- 배출인벤토리(CAPSS) 불확실성이 최대 오차원\n- 2차 생성(질산염·유기에어로졸) 과소·과대 모의\n- 격자 해상도 한계로 국지 고농도 재현 곤란\n\n### 기여도 분석 기법 비교\n| 기법 | 원리 | 장점 | 한계 |\n|---|---|---|---|\n| **BFM**(Brute-Force) | 특정 배출원 배출량을 0 또는 −N%로 바꿔 농도차 산정 | 직관적, 구현 용이 | 비선형성·중복계산, 계산량 많음 |\n| **DDM**(Decoupled Direct) | 민감도 방정식 동시 적분 | 정확, 1회 수행 | 모델 개조 필요 |\n| **ISAM/PSAT** | 화학종에 배출원 꼬리표(tag) 부여 | 질량기반 배분, 합=100% | 2차 생성 배분 가정 필요 |\n\n**126회 기출**: \"Brute-Force Method(BFM)\"\n\n### BFM의 비선형성 문제\nNOx를 줄였을 때 오존이 오히려 **증가**하는 VOC-limited 영역처럼, 배출-농도 관계가 비선형이면 BFM 결과가 감축률에 따라 달라진다. 따라서 실무에서는 **−100%가 아닌 −20~30%** 감축 시나리오로 수행하고, 결과를 선형 외삽하지 않도록 주의한다.\n\n### 국내 활용\n미세먼지 관리 종합계획·대기환경관리 기본계획 수립 시 국내외·부문별(발전·산업·수송·생활) 기여도 산정에 사용되며, 국외 기여율은 연평균 약 30~50%(고농도 시 60~80%)로 보고된다.\n"}]},"7":{"day":7,"date":"2026-08-07","title":"바람의 발생요인 4가지 힘","keywords":[{"k":"기압경도력(PGF)","subs":["고압→저압, 등압선 직각","PGF = -(1/ρ)(∂P/∂n)","바람의 1차 발생 원인"]},{"k":"전향력(Coriolis force)","subs":["지구자전 겉보기 힘","C = 2Ω·sinφ·V","북반구 우편향, 적도 0"]},{"k":"마찰력(Friction)","subs":["지표 조도에 비례","경계층 내에서만 작용","풍속 감소·풍향 편향"]},{"k":"원심력(Centrifugal force)","subs":["곡선운동 시 바깥 방향","경도풍에서 작용","저기압/고기압 곡률"]},{"k":"힘의 균형에 따른 바람","subs":["지균풍: PGF+전향력","경도풍: +원심력","지상풍: +마찰력(등압선 사교)"]}],"answer":"# 바람의 발생요인 4가지 힘\n\n## Ⅰ. 개요\n\n바람은 **기압차에 의해 발생한 공기의 수평운동**이며, 그 방향과 세기는 ① 기압경도력 ② 전향력 ③ 마찰력 ④ 원심력의 4가지 힘의 균형에 의해 결정된다. 바람은 대기오염물질의 **이송(advection)** 방향과 **희석(dilution)** 정도를 직접 지배하므로, 확산모델의 가장 중요한 입력자료이자 대기환경영향평가 현황조사의 핵심 항목이다.\n\n## Ⅱ. 바람을 발생·변형시키는 4가지 힘\n\n### 1. 기압경도력(PGF, Pressure Gradient Force)\n**정의**: 단위질량의 공기에 작용하는, 기압차에 의한 힘\n\n**PGF = -(1/ρ)·(∂P/∂n)**  [m/s²]\n- ρ: 공기밀도, ∂P/∂n: 등압선에 수직인 방향의 기압경도\n\n**특성**\n- **바람을 일으키는 유일한 1차적 원인**(다른 힘은 이미 부는 바람을 변형)\n- 방향: 고기압 → 저기압, **등압선에 직각**\n- 크기: 등압선 간격이 좁을수록(기압경도 클수록) 큼\n- 밀도에 반비례 → 상층으로 갈수록 동일 기압차에서 힘이 커짐\n\n### 2. 전향력(Coriolis Force, 코리올리력)\n**정의**: 지구 자전에 의해 운동하는 물체에 나타나는 **겉보기 힘**\n\n**C = 2Ω·V·sinφ = f·V**  (f = 2Ω·sinφ: 코리올리 매개변수)\n- Ω: 지구 자전 각속도(7.29×10⁻⁵ rad/s), V: 풍속, φ: 위도\n\n**특성**\n- 방향: **북반구 - 운동방향의 오른쪽 90°**, 남반구 - 왼쪽\n- 크기: **풍속에 비례, sin(위도)에 비례** → 극지방 최대, **적도에서 0**\n- 속도의 크기는 변화시키지 않고 **방향만 변화**시킴\n- 정지한 공기에는 작용하지 않음\n\n### 3. 마찰력(Friction Force)\n**정의**: 지표면과 공기 사이, 공기층 사이의 점성에 의한 저항력\n\n**특성**\n- 방향: 바람의 **반대 방향**\n- 크기: 풍속에 비례, **지표 조도(z₀)에 비례**\n- 작용 범위: **대기경계층 내부(약 1km 이하)**. 자유대기에서는 무시\n- 효과: 풍속 감소 + 전향력 약화 → 풍향이 **저기압 쪽으로 편향**\n\n### 4. 원심력(Centrifugal Force)\n**정의**: 곡선 운동하는 공기에 작용하는 관성력\n\n**Ce = V²/r**  (r: 곡률반경)\n\n**특성**\n- 방향: 곡률 중심의 **바깥쪽**\n- 저기압(반시계 회전)에서는 PGF와 반대, 고기압에서는 PGF와 같은 방향\n- 곡률이 클수록(태풍·소용돌이) 지배적 → 태풍의 선형풍(cyclostrophic wind)\n\n## Ⅲ. 힘의 균형에 따른 바람의 종류\n\n| 종류 | 작용하는 힘 | 특징 | 고도 |\n|---|---|---|---|\n| **지균풍(Geostrophic)** | PGF + 전향력 | 등압선에 **평행**, 직선 등압선 | 자유대기(1km↑) |\n| **경도풍(Gradient)** | PGF + 전향력 + 원심력 | 등압선(곡선)에 평행 | 자유대기 |\n| **선형풍(Cyclostrophic)** | PGF + 원심력 | 소규모·고속 회전(토네이도) | - |\n| **지상풍(Surface wind)** | PGF + 전향력 + 마찰력 | 등압선과 **사교(경사)**, 저기압 쪽으로 | 경계층 |\n| **관성풍** | 전향력 + 원심력 | 관성 원운동 | - |\n\n### 1. 지균풍\nPGF와 전향력이 크기가 같고 방향이 반대로 평형 → 바람은 **등압선에 평행**하게 분다.\n북반구에서 **저기압을 왼쪽에 두고** 부는 방향(Buys-Ballot 법칙).\n\nVg = -(1/ρf)·(∂P/∂n)\n\n### 2. 경도풍\n곡선 등압선에서 원심력이 추가된 균형.\n- **저기압성**: PGF = 전향력 + 원심력 → 경도풍 < 지균풍(아저기압풍)\n- **고기압성**: PGF + 원심력 = 전향력 → 경도풍 > 지균풍(초지균풍)\n\n### 3. 지상풍\n마찰력으로 풍속이 감소하고 전향력도 약해져, 바람이 **등압선을 가로질러 저압부로 유입**한다.\n- 교각: 해상 10~20°, 육상 25~45°(조도 클수록 큼)\n- 결과: **저기압 중심으로 수렴 → 상승기류 → 구름·강수**\n- **고기압 중심에서 발산 → 하강기류 → 침강역전 → 대기오염 정체**\n\n### 4. 에크만 나선(Ekman Spiral)\n경계층 내에서 고도가 높아질수록 마찰이 약해져 풍향이 시계방향으로 회전하며 지균풍에 접근하는 연직구조.\n\n## Ⅳ. 대기환경 관리적 의의\n\n1. **오염물질 이송방향 결정**: 지상풍이 등압선과 사교하므로, 상층 지균풍 방향과 지표 오염물질 이송방향이 다를 수 있어 **연직 풍향 프로파일 관측**이 필요하다.\n2. **고기압 정체와 고농도**: 고기압권 하강기류 → 침강역전 + 저풍속 → 국내 고농도 미세먼지 사건의 지배적 종관 조건\n3. **바람장미(Wind Rose) 작성**: 환경영향평가에서 풍향별 출현빈도를 분석해 최대영향지점(주풍 하류)을 선정\n4. **저풍속(Calm) 처리**: 풍속 1m/s 미만에서는 가우시안 모델이 발산하므로 CALPUFF 등 퍼프 모델 적용\n5. **바람길 계획**: 지표 마찰(도시 조도) 저감을 통한 도시 환기 개선\n\n## Ⅴ. 결론\n\n바람은 기압경도력에 의해 발생하고 전향력·마찰력·원심력에 의해 방향과 세기가 변형된다. 자유대기에서는 지균풍·경도풍이, 경계층에서는 마찰의 영향으로 등압선과 사교하는 지상풍이 나타난다. 대기환경 실무에서는 특히 **고기압 정체 시 하강기류-침강역전-저풍속**의 연쇄가 고농도 사건을 일으키므로, 종관 기상 패턴과 국지 바람장을 함께 해석하는 통합적 접근이 요구된다.\n","side":[{"title":"바람장미(Wind Rose)와 오염장미(Pollution Rose)","body":"### 바람장미\n일정 기간의 **풍향별 출현빈도**와 **풍속 계급별 분포**를 방사형으로 도시한 그림.\n\n**구성**\n- 16방위(또는 8, 36방위) 방사축\n- 막대 길이 = 해당 풍향의 출현빈도(%)\n- 막대 색상·구간 = 풍속 계급\n- 중심 원 = **정온(Calm) 출현율** (통상 풍속 0.5m/s 미만)\n\n**활용**\n- 주풍향(prevailing wind) 파악 → **최대영향예상지점** 선정\n- 배출시설 입지·굴뚝 위치 계획\n- 환경영향평가 기상현황 조사의 필수 항목\n\n### 오염장미(Pollution Rose)\n풍향별로 **오염물질 농도**를 도시한 그림.\n\n**활용**\n- **배출원 추적(source apportionment)**: 특정 풍향에서 농도가 높으면 그 방향에 배출원 존재\n- 민원 발생 시 원인 사업장 규명\n- CPF(Conditional Probability Function), CBPF 등으로 정량화 발전\n- 126회 기출: \"Wind Rose, Pollutants Rose\"\n\n### 유의사항\n- 최소 1년(권장 3~5년) 자료로 계절변동 반영\n- 관측고도(10m 표준)와 주변 장애물 영향 확인\n\n### 작성 시 유의사항\n- **관측기간**: 최소 1년, 권장 3~5년 (계절·경년 변동 반영)\n- **관측고도**: 지상 10m 표준. 다른 고도 자료는 멱법칙 u₂=u₁(z₂/z₁)^p 로 보정\n- **방위 수**: 16방위가 표준, 정밀 분석은 36방위\n- **정온 기준**: 0.5m/s(기상청) 또는 1.0m/s를 명시\n\n### 계절별·시간대별 분리 작성\n연간 바람장미만으로는 국지순환(해륙풍·산곡풍)이 상쇄되어 보이지 않는다. 반드시\n1. **계절별**(봄·여름·가을·겨울) 4매\n2. **주·야간** 분리\n를 함께 제시해야 해륙풍 반전이 드러난다.\n\n### 오염장미의 정량화 기법\n- **CPF**(Conditional Probability Function): 특정 풍향에서 고농도(상위 25% 등)가 발생할 조건부 확률\n- **CBPF**: 풍속까지 고려 → 지면배출원(저풍속 고농도)과 고가배출원(고풍속 고농도) 구분\n- **NWR**(Non-parametric Wind Regression): 평활화된 농도 분포\n→ 민원 원인 사업장 규명 및 미확인 배출원 탐색에 활용\n"},{"title":"정온(Calm) 조건과 저풍속 확산","body":"### 정의\n풍속이 매우 낮아(통상 **0.5 또는 1.0 m/s 미만**) 풍향 판별이 어려운 상태. 국내 연평균 정온율은 지역에 따라 10~30%.\n\n### 문제점\n가우시안 플룸 모델 C = Q/(2π·u·σy·σz)·exp(...) 에서 **u → 0이면 C → ∞**로 발산 → 모델 적용 불가.\n\n### 실무적 처리방법\n1. **최소풍속 설정**: u < 1.0 m/s인 경우 u = 1.0 m/s로 고정 (보수적)\n2. **정온 시간 제외**: 정온 시간을 계산에서 배제하고 유효시간으로 정규화 → 과소평가 우려\n3. **퍼프 모델 적용**: **CALPUFF** 등 라그랑지안 퍼프 모델은 정온 시 퍼프가 제자리에서 성장하도록 처리 → 물리적으로 타당\n4. **AERMOD**: u\\* 기반 처리 및 저풍속 옵션(LOWWIND) 적용\n\n### 관리적 의의\n- 정온 조건은 곧 **최악의 확산조건** → 국지 고농도 발생\n- 정온율이 높은 분지·계곡 지역은 배출시설 입지 신중 검토\n- 환경영향평가 시 정온 처리방법과 그 근거를 반드시 명시해야 함\n\n### 정온율이 높은 조건\n- 지형: **분지·계곡**, 산으로 둘러싸인 내륙\n- 기상: 정체성 고기압, 야간 복사냉각, 겨울\n- 시간: 해륙풍·산곡풍 **전환기**(일출·일몰 전후)\n\n### 국내 정온율 예시\n| 지역 특성 | 연평균 정온율 |\n|---|---|\n| 해안·도서 | 5~10% |\n| 평야 내륙 | 10~20% |\n| **분지 도시** | 20~35% |\n\n### 환경영향평가상 처리 원칙\n1. 정온율을 **반드시 제시**하고, 처리방법과 근거를 기술\n2. 정온율이 20%를 초과하면 가우시안 플룸모델 단독 적용은 부적절 → **CALPUFF 병행**\n3. 정온 조건의 예측 결과를 별도 제시하여 보수성 확인\n\n### 관련 개념 — 통풍계수와의 결합\n정온이면 풍속이 0에 가까우므로 통풍계수 VC = H×u 도 극소가 된다. 정온율이 높은 지역은 **환경용량이 구조적으로 작다**는 뜻이며, 이는 배출시설 입지 제한의 정량적 근거가 된다.\n"},{"title":"기압경도력과 등압선 해석","body":"### 등압선(Isobar)\n동일 기압 지점을 연결한 선. 일기도에서 통상 **4hPa 간격**으로 표시.\n\n### 해석 원칙\n| 관측 | 의미 |\n|---|---|\n| 등압선 **조밀** | 기압경도 큼 → **강풍** |\n| 등압선 **성김** | 기압경도 작음 → 약풍, 정체 |\n| 폐곡선 L | 저기압 → 반시계 수렴, 상승기류, 강수 |\n| 폐곡선 H | 고기압 → 시계 발산, **하강기류, 침강역전** |\n\n### Buys-Ballot 법칙\n북반구에서 **바람을 등지고 서면 왼손 방향이 저기압**.\n\n### 대기오염과의 연관\n1. **이동성 고기압 정체**: 하강기류 + 저풍속 + 침강역전 → 국내 봄·가을 고농도 미세먼지의 전형적 종관 패턴\n2. **서고동저 겨울형**: 북서기류 강화 → 국외 유입 증가하나 풍속이 커 확산은 양호\n3. **정체전선**: 습도 상승 → 2차 에어로졸 생성(황산염·질산염) 촉진\n4. 기상청 종관 패턴 분류를 미세먼지 예보 및 **비상저감조치 발령 판단**에 활용\n\n### 국내 고농도 미세먼지 3대 종관 패턴\n| 패턴 | 기압배치 | 특징 |\n|---|---|---|\n| **정체형** | 이동성 고기압이 한반도 상공 정체 | 하강기류·저풍속·역전 → 국내 배출 축적 |\n| **유입형** | 중국 대륙고기압 → 북서·서풍 | 국외 유입 지배, 풍속은 있으나 배경농도 높음 |\n| **복합형** | 유입 후 고기압 정체 | 국외 유입 + 국내 축적 → **최고농도** |\n\n### 기압배치와 계절\n- **서고동저(겨울형)**: 북서 계절풍 강함 → 확산 양호하나 국외 유입\n- **남고북저(여름형)**: 남풍·강수 → 세정효과로 저농도\n- **이동성 고기압(봄·가을)**: 정체 → 고농도 빈발\n\n### 습도의 역할\n상대습도 70~80% 이상에서 **황산염·질산염 2차 생성이 급증**한다(액상 산화, 조해성 흡습성장). 정체 + 고습 조합이 최악이며, 안개·연무 시 PM2.5가 단시간에 2~3배 상승하는 원인이다.\n\n### 예보 활용\n기상청 종관 패턴 분류와 CMAQ 예측을 결합하여 **비상저감조치 발령**(당일 50㎍/㎥ 초과 + 익일 50㎍/㎥ 초과 예상 등)을 판단한다.\n"}]},"8":{"day":8,"date":"2026-08-08","title":"1단계 이론·확산·집진 회독 1회차","keywords":[{"k":"대기 연직구조·조성","subs":["대류권 6.5℃/km, 질량 80%","N₂78.08·O₂20.95·Ar0.93%","균질층 80km"]},{"k":"정적안정도","subs":["Γd=0.98℃/100m=g/Cp","Γs≈0.5℃/100m","ELR>Γd 불안정, dθ/dz>0 안정"]},{"k":"동적안정도","subs":["Ri=(g/T)(∂θ/∂z)/(∂u/∂z)²","Ric=0.25","u*=√(τ₀/ρ), k=0.4"]},{"k":"Pasquill 등급","subs":["A~F 6등급, D=중립","주간 풍속+일사 / 야간 풍속+운량","박명·전운량 8/8 → D"]},{"k":"역전층","subs":["복사(지표)·침강(공중)·이류·난류·전선","복사=야간청명미풍, 침강=고기압 수일","해소 시 Fumigation"]}],"answer":"# 1단계 회독 1회차 — 요약·자가점검 (Day 1~7)\n\n## Ⅰ. 회독 목적\n\n1회독의 목표는 **암기가 아니라 구조 파악**이다. Day 1~7에서 다룬 내용은 모두 \"**연직 기온분포 → 안정도 → 난류 → 확산**\"이라는 하나의 논리 사슬로 연결된다. 이 사슬을 백지에 그릴 수 있으면 회독은 성공이다.\n\n```\n지표 가열/냉각\n   ↓\n연직 기온분포(ELR)  ←→  단열감률(Γd, Γs)\n   ↓                        ↓\n정적안정도 판정      온위 dθ/dz\n   ↓\n+ 풍속 연직전단(∂u/∂z)\n   ↓\n동적안정도(Ri), 마찰속도(u*)\n   ↓\nPasquill 등급 (A~F)\n   ↓\n확산계수 σy, σz  →  가우시안 농도식\n   ↓\n연기형태 / 지표농도\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 건조단열감률 Γd | 0.98℃/100m (= g/Cp = 9.8/1005) | ☐ |\n| 습윤단열감률 Γs | 0.5~0.6℃/100m | ☐ |\n| 표준 환경감률 | 0.65℃/100m (6.5℃/km) | ☐ |\n| 대류권 두께 | 적도 17km / 극 8km / 평균 11km | ☐ |\n| 오존층 고도 | 20~30km, 최대 25km 부근 | ☐ |\n| 대기조성 | N₂ 78.08 / O₂ 20.95 / Ar 0.93 / CO₂ 0.042% | ☐ |\n| 균질층 두께 | 0~80km | ☐ |\n| 임계 리차드슨수 | Ric = 0.25 | ☐ |\n| von Karman 상수 | k = 0.4 | ☐ |\n| 마찰속도 범위 | 0.1~1.0 m/s | ☐ |\n| 조도길이 z₀ (도시) | 1~3m (수면 0.0001m, 초지 0.01~0.03m) | ☐ |\n| 접지층 두께 | PBL 하부 약 10% | ☐ |\n| 최대혼합고(MMD) | 1,000~2,000m (오후 2~4시) | ☐ |\n| 야간 혼합고 | 100~300m | ☐ |\n| 통풍계수 기준 | VC < 6,000 m²/s 확산불량 | ☐ |\n| 코리올리 매개변수 | f = 2Ω sinφ, Ω=7.29×10⁻⁵ rad/s | ☐ |\n| 지상풍 교각 | 해상 10~20° / 육상 25~45° | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **Γd = g / Cp = 9.8 / 1,005 = 0.98℃/100m**  (유도 2줄 가능해야 함)\n2. **θ = T (1,000/P)^0.286**,  판정: dθ/dz > 0 안정\n3. **Ri = (g/T)(∂θ/∂z) / (∂u/∂z)²**,  Ric = 0.25\n4. **u\\* = √(τ₀/ρ)**,  **u(z) = (u\\*/k)·ln(z/z₀)**\n5. **L = -(u\\*³·T)/(k·g·(w'θ')₀)**  (M-O 길이, L>0 안정)\n6. **VC = 혼합고 × 평균풍속**\n7. **PGF = -(1/ρ)(∂P/∂n)**,  **C = 2Ω V sinφ**,  **Ce = V²/r**\n\n## Ⅳ. 자주 혼동하는 개념 정리\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| Γd vs ELR | 공기덩어리의 변화율(상수) | 실제 대기의 분포(실측) | Γd는 물리상수, ELR은 관측값 |\n| 복사역전 vs 침강역전 | 지표역전, 야간, 수시간 | 공중역전, 고기압, 수일 | 위치·지속시간·규모 |\n| Fumigation vs Lofting | 상부 안정/하부 불안정 → 지표 최고농도 | 하부 안정/상부 불안정 → 지표 최저농도 | 역전층과 배출고도의 상대위치 |\n| 지균풍 vs 지상풍 | 등압선 평행 | 등압선과 사교 | 마찰력 유무 |\n| 기계적 난류 vs 열적 난류 | 전단(풍속) 기원, 소규모 | 부력(가열) 기원, 대규모 | Ri의 분모 vs 분자 |\n| 정적 vs 동적 안정도 | 기온분포만 | 기온+풍속전단 | Ri가 동적 |\n| CBL vs SBL | 주간, 1~2km, 잘 혼합 | 야간, 100~300m, 잔류층 존재 | 일변화 |\n\n## Ⅴ. 기출 연계 자가점검(답을 소리내어 말해보기)\n\n1. Γd = g/Cp를 유도하고 값이 0.98℃/100m임을 설명하시오. *(119회 유사)*\n2. Gradient Richardson 수의 정의와 의미를 설명하고 대기안정도를 분류하시오. *(119회 25점 기출)*\n3. 마찰속도의 정의와 표면층에서의 의미를 설명하시오. *(119회 25점 기출)*\n4. Pasquill-Gifford 안정도 등급과 기상인자 사이의 관계를 설명하시오. *(114회 25점 기출)*\n5. 대기역전층의 종류 3가지를 쓰시오. *(119회 10점 기출)*\n6. 대기의 연직구조를 4개 층으로 분류·도식하고 각 층의 특징을 설명하시오. *(119회 25점 기출)*\n7. 대기경계층 내에서 바람의 방향과 세기를 결정하는 힘의 종류를 쓰고 풍향·풍속의 연직구조를 설명하시오. *(119회 25점 기출)*\n8. 대기혼합고의 측정방법과 일변화를 설명하시오. *(119회 25점 기출)*\n9. 환경감률에 따른 대기의 정적안정도를 분류하시오. *(119회 10점 기출)*\n10. 리차드슨수(Ri)를 설명하시오. *(114회 10점 기출)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(30분)**: 위 Ⅰ의 논리 사슬을 아무것도 보지 않고 그린다.\n2. **수치 암기(20분)**: Ⅱ의 체크리스트를 가리고 답한다. 3개 이상 틀리면 해당 Day를 다시 본다.\n3. **식 쓰기(20분)**: Ⅲ의 7개 식을 손으로 쓴다. 단위와 기호 정의까지.\n4. **기출 구술(30분)**: Ⅴ의 10문항을 각 2분씩 소리내어 답한다. 막히는 문항에 ★ 표시.\n5. **★문항 재학습(30분)**: 막힌 문항의 원 학습일 본문을 다시 읽는다.\n\n> **회독 원칙**: 1회독은 넓고 얕게, 2회독은 구조 완성, 3회독 이후 세부 수치 암기. 지금 다 외우려 하지 말 것.\n","side":[{"title":"기술사 답안 작성의 기본 골격","body":"### 논술형(25점) 표준 구조 — A4 3장 기준\n```\nⅠ. 개요 (5~7줄)\n   - 정의 + 출제 의도에 대한 답의 방향 제시\nⅡ. 본론 1 (원리/이론)\n   - 그림·식·표 반드시 1개 이상\nⅢ. 본론 2 (종류/분류/비교표)\nⅣ. 본론 3 (문제점 / 적용 / 관리방안)\nⅤ. 결론 (5줄)\n   - 요약 1~2줄 + 본인 의견·개선방향 3줄\n```\n\n### 용어형(10점) 표준 구조 — 답안지 1/2~2/3장\n```\n1. 정의\n2. 원리 / 관련식 (또는 도해)\n3. 특징 3~5가지 (번호 나열)\n4. 대기환경적 의의 / 적용\n```\n\n### 득점 포인트\n- **소제목 번호체계 일관성** (Ⅰ→1.→가.→①)\n- **표·그림 1문항당 최소 1개** — 채점자 가독성이 곧 점수\n- **법령·기준 수치 인용** — \"대기환경보전법 시행규칙 제○조\"\n- **최신 정책 연계** — 결론에 반드시 1줄\n- **분량**: 25점 문항 = 답안지 3면(A4 3장), 10점 문항 = 1면 내외\n\n### 감점 요인 (반드시 피할 것)\n1. **개요 없이 바로 본론** — 출제의도 파악 실패로 보임\n2. **결론 누락** — 마무리 없이 끝나면 미완성 답안 취급\n3. 문제에서 요구한 항목 누락 (예: \"종류와 대책\"인데 종류만 서술)\n4. 그림·표 없이 줄글만 3장 — 가독성 최악\n5. 법령명·수치 오기 — 틀린 인용은 안 쓰느니만 못함\n6. 답안지 여백 과다 (분량 미달)\n\n### 답안 작성 순서 (권장)\n1. 문제 정독 후 **키워드에 밑줄** (요구항목 체크)\n2. 여백에 **목차 3~5줄 초안** (2분)\n3. 개요부터 순서대로 작성\n4. 그림·표 위치를 미리 확보\n5. 마지막 2분 검토: 요구항목 누락·오탈자\n\n### 글씨와 편집\n- 채점자는 하루 수백 장을 본다. **가독성이 곧 점수**\n- 소제목은 한 줄 띄우고 들여쓰기 일관되게\n- 중요 키워드에 밑줄 또는 ○ 표시\n- 볼펜(검정) 사용, 수정테이프 최소화\n"},{"title":"60점 합격 전략 - 시간·문항 배분","body":"### 시험 구조\n| 교시 | 시간 | 문제 수 | 선택 | 배점 |\n|---|---|---|---|---|\n| 1교시 | 100분 | 13문제 | **10문제 선택** | 각 10점 = 100점 |\n| 2교시 | 100분 | 6문제 | **4문제 선택** | 각 25점 = 100점 |\n| 3교시 | 100분 | 6문제 | 4문제 선택 | 각 25점 = 100점 |\n| 4교시 | 100분 | 6문제 | 4문제 선택 | 각 25점 = 100점 |\n\n**합격 = 4교시 평균 60점 이상 (총 400점 만점 중 240점)**\n\n### 시간 배분\n- **1교시**: 문항당 **9분** (읽기·선택 5분 + 10문항×9분 = 95분)\n- **2~4교시**: 문항당 **23분** (선택 5분 + 4문항×23분 = 97분)\n- 마지막 3분은 반드시 **검토·누락 확인**\n\n### 60점 전략의 핵심\n1. **완벽한 4문제보다 무난한 4문제**: 25점 만점 중 15점(60%)이 목표. 아는 것을 확실히 쓰는 것이 우선\n2. **선택의 기술**: 개요·결론을 쓸 수 있는 문제 우선. 계산문제는 확신 없으면 회피\n3. **백지 방지**: 모르는 문제도 정의+일반론+관리방안으로 최소 8~10점 확보\n4. **1교시가 승부처**: 용어 200선 암기로 1교시 70점 이상 확보 시 논술 부담 대폭 감소\n5. **분량 확보**: 답안지 3면을 채우지 못하면 내용이 좋아도 감점\n\n### 교시별 전략\n**1교시(용어 13중 10)**\n- 가장 확실한 득점원. **아는 것부터** 순서 무관하게 작성\n- 1문항 9분 초과 금지. 넘어가면 뒤 문항을 못 씀\n- 모르는 3문항을 버릴 수 있으므로 **13문제 중 10개 선택권**을 최대한 활용\n\n**2~4교시(논술 6중 4)**\n- 6문제를 모두 훑고 **쓸 수 있는 4개를 확정한 뒤** 시작\n- 계산문제는 검산 시간까지 고려. 확신 없으면 회피\n- 최신 정책·법령 문제는 배점이 후한 편\n\n### 과목 편중 방지\n4교시 평균 60점이므로 **특정 교시가 40점 이하면 다른 교시로 만회하기 어렵다.** 따라서 분야를 편식하지 말고 이론·방지기술·측정·정책을 고르게 준비해야 한다. 본 커리큘럼이 4단계로 분야를 나눈 이유이다.\n\n### 시험 당일 체크리스트\n신분증 · 수험표 · 검정 볼펜 3자루 · 자 · 계산기(공학용, 프로그램 기능 없는 것) · 시계 · 간식\n"},{"title":"암기 카드 - Day 1~7 핵심 20선","body":"1. **Γd** = g/Cp = 0.98℃/100m\n2. **Γs** = 0.5~0.6℃/100m (잠열 방출)\n3. **ELR** 표준 = 0.65℃/100m\n4. **안정도 판정**: ELR>Γd 불안정 / =Γd 중립 / <Γd 안정 / <0 역전\n5. **조건부불안정**: Γs < ELR < Γd\n6. **온위** θ = T(1000/P)^0.286, dθ/dz>0 안정\n7. **Ri** = (g/T)(∂θ/∂z)/(∂u/∂z)², **Ric = 0.25**\n8. **u\\*** = √(τ₀/ρ), 로그분포 u=(u\\*/k)ln(z/z₀), **k=0.4**\n9. **M-O 길이** L>0 안정, L<0 불안정, L→∞ 중립\n10. **Pasquill** A~F, D=중립, 박명·전운량=D\n11. **주간 판정**: 풍속 + 일사 / **야간**: 풍속 + 운량\n12. **연기형태**: Looping(불안정)-Coning(중립)-Fanning(안정)-Lofting-Fumigation-Trapping\n13. **복사역전**: 야간·청명·미풍·장야, 지표역전, 수시간\n14. **침강역전**: 고기압 하강 단열압축, 공중역전, 수일, **LA스모그**\n15. **PBL 구조**: 접지층(10%, 플럭스일정) + 에크만층\n16. **CBL** 1~2km(오후) / **SBL** 100~300m + 잔류층\n17. **통풍계수** VC = 혼합고×풍속, <6,000 m²/s 불량\n18. **4가지 힘**: 기압경도력·전향력·마찰력·원심력\n19. **지균풍**(등압선 평행) → **지상풍**(사교, 육상 25~45°)\n20. **고기압 정체 = 하강기류 + 침강역전 + 저풍속 = 고농도**\n\n21. **조건부불안정** Γs<ELR<Γd — 불포화 안정 / 포화 불안정\n22. **온위 판정** dθ/dz > 0 안정 (기압효과 제거)\n23. **Ri 부호** = 정적안정도, **절대값** = 지배 난류\n24. **조도길이** z₀: 수면 0.0001 / 초지 0.02 / 도시 1~3m\n25. **에크만 나선**: 고도상승 시 풍향 시계방향 회전(북반구)\n26. **훈증** C = Q/(√(2π)·u·σy·hi)\n27. **최대착지** σz = He/√2, **Cmax ∝ 1/He²**\n28. **잔류층**: 야간 중립층, 오염물 저장 → 오전 재혼합\n29. **야간 제트**: 안정층 상단 초지균풍, 장거리 이송 통로\n30. **런던형**(겨울·SO₂·환원) vs **LA형**(여름·O₃·산화)\n\n### 회독 주기 (에빙하우스 망각곡선 적용)\n| 회차 | 시점 | 목표 |\n|---|---|---|\n| 1회독 | 학습 당일~7일 | 구조 파악 |\n| 2회독 | 1개월 후 | 논리 완성 |\n| 3회독 | 3개월 후 | 수치 암기 |\n| 4회독 | 시험 2주 전 | 인출 연습 |\n\n본 커리큘럼은 7일마다 회독일을 배치하고, 4단계(총정리)에서 전 범위 재회독을 수행하도록 설계되어 있다.\n"}]},"9":{"day":9,"date":"2026-08-09","title":"국지순환풍 - 해륙풍·산곡풍·푄","keywords":[{"k":"해륙풍(Sea/Land Breeze)","subs":["비열차에 의한 일변화","주간 해풍(바다→육지)","야간 육풍(육지→바다), 전환기 무풍"]},{"k":"해풍전선·재순환","subs":["해풍전선(Sea Breeze Front)","오염물질 재유입(recirculation)","해안 산단 고농도 원인"]},{"k":"산곡풍(Mountain/Valley Wind)","subs":["주간 곡풍(계곡→산정)","야간 산풍(산정→계곡)","냉기호(cold air pool) 형성"]},{"k":"푄(Föhn) 현상","subs":["풍상 습윤단열 상승·강수","풍하 건조단열 하강","고온건조풍, 국내 높새바람"]},{"k":"국지풍과 대기질","subs":["저풍속·정체 유발","역전 강화","확산모델 재현 곤란"]}],"answer":"# 국지순환풍 - 해륙풍·산곡풍·푄\n\n## Ⅰ. 개요\n\n**국지순환풍(Local Circulation)**은 종관규모 기압배치가 약할 때(고기압 정체·맑은 날) 지표면의 **가열·냉각 차이나 지형효과**에 의해 발생하는 수 km~수십 km 규모의 바람이다. 해륙풍·산곡풍은 하루를 주기로 풍향이 역전되어 **오염물질의 재순환(recirculation)**을 일으키고, 전환기에는 무풍 상태가 되어 고농도를 유발하므로 해안·분지 지역 대기질 관리의 핵심 인자이다.\n\n## Ⅱ. 해륙풍(Sea Breeze / Land Breeze)\n\n### 1. 발생 원인\n물과 육지의 **비열(比熱) 차이**\n- 물의 비열(4.18 kJ/kg·K) ≫ 흙·암석의 비열(0.8~1.0 kJ/kg·K)\n- 육지는 빨리 가열·냉각, 해양은 온도변화가 완만\n\n### 2. 해풍(Sea Breeze) — 주간\n① 주간 육지가 빠르게 가열 → ② 육지 상공 공기 상승, 지표 기압 하강 → ③ 상대적 고압인 **바다에서 육지로** 바람 유입\n\n**특성**\n- 발생시각: 오전 10시경 시작, **오후 2~3시 최강**\n- 풍속: 3~7 m/s, 침투거리 내륙 20~50km, 두께 500~1,000m\n- 상층에는 반대방향의 **반류(return flow)**가 존재 → 폐쇄 순환셀 형성\n\n### 3. 육풍(Land Breeze) — 야간\n① 야간 육지가 복사냉각으로 급격히 냉각 → ② 육지 지표 기압 상승 → ③ **육지에서 바다로** 바람\n\n**특성**\n- 발생시각: 일몰 후 2~3시간 뒤, 새벽에 최강\n- 풍속: 1~3 m/s (해풍보다 약함, 온도차가 작기 때문)\n- 두께 100~300m로 얕음\n\n### 4. 전환기(무풍기)\n해풍↔육풍 전환 시각(일출 후·일몰 후)에 **풍속 0에 가까운 정온(calm) 상태**가 수십 분~수 시간 지속 → **오염물질 정체·축적**\n\n### 5. 해풍전선과 재순환\n- **해풍전선(Sea Breeze Front)**: 해풍 선단부에서 해양성 냉기와 육지 온난기가 충돌하는 국지전선. 전선 부근에서 상승기류·수렴이 발생하여 오염물질이 집중되고, **내륙형 훈증**을 일으킴\n- **재순환(Recirculation)**: 야간 육풍으로 해상에 나간 오염물질이 다음 날 해풍을 타고 다시 육지로 유입 → 며칠간 축적되며 **광화학 오존 고농도** 형성. LA·지중해 연안·국내 동해안 산단에서 관측\n- **해풍역전(Advection Inversion)**: 온난한 육지 공기 아래로 찬 해풍이 침투 → 얕은 지표역전 형성 → 연안 산단 저층 배출원 고농도\n\n## Ⅲ. 산곡풍(Mountain / Valley Wind)\n\n### 1. 곡풍(Valley Wind, 골바람) — 주간\n- 주간 산 사면이 강하게 가열 → 사면을 따라 상승기류\n- **계곡 → 산정 방향**의 바람 (Anabatic wind)\n- 오전 늦게 발달, 오후 최강. 풍속 2~5 m/s\n\n### 2. 산풍(Mountain Wind, 산바람) — 야간\n- 야간 산 사면이 복사냉각 → 냉각된 무거운 공기가 사면을 따라 하강(**활강풍, Katabatic wind**)\n- **산정 → 계곡 방향**의 바람\n- 계곡 저지대에 냉기가 고여 **냉기호(Cold Air Pool)** 형성 → 강한 접지역전 → **분지형 고농도** 발생\n- 국내 사례: 대구·춘천·원주 등 분지도시 겨울철 고농도 미세먼지\n\n### 3. 관리적 시사점\n분지·계곡 지역은 야간 냉기호 + 복사역전으로 확산이 극히 불량하므로, 배출시설 입지 제한과 굴뚝높이 상향이 필요하다.\n\n## Ⅳ. 푄(Föhn) 현상\n\n### 1. 정의\n습윤한 공기가 산맥을 넘을 때, **풍상측에서는 습윤단열, 풍하측에서는 건조단열** 변화를 거치면서 풍하측에 **고온·건조한 바람**이 부는 현상.\n\n### 2. 발생 과정\n① **풍상측 상승**: 초기에는 건조단열(0.98℃/100m)로 냉각 → 상승응결고도(LCL) 도달\n② **응결 후 상승**: 습윤단열(0.5℃/100m)로 냉각하며 구름·강수 발생 → 수증기 상실\n③ **산정 통과**\n④ **풍하측 하강**: 수증기를 잃어 건조하므로 **건조단열(0.98℃/100m)로 승온**\n\n### 3. 계산 예 (산 높이 2,000m, LCL 1,000m, 시점 20℃)\n- 0→1,000m (건조단열): 20 - 9.8 = **10.2℃**\n- 1,000→2,000m (습윤단열): 10.2 - 5.0 = **5.2℃**\n- 2,000→0m (건조단열 하강): 5.2 + 19.6 = **24.8℃**\n- **∴ 풍하측이 4.8℃ 높고 매우 건조** → 상대습도 급감\n\n### 4. 국내 사례\n**높새바람**: 늦봄~초여름 오호츠크해 기단의 동풍이 태백산맥을 넘어 영서지방(춘천·홍천)에 고온건조풍으로 부는 현상. 가뭄·산불 위험 증가.\n\n### 5. 대기환경적 의의\n- 풍하측 **기온 상승·습도 저하** → 광화학반응 촉진, **오존 고농도**\n- 상층 침강으로 **역전층 강화** → 확산 불량\n- 산불 확산 위험 증대 → 연무·PM 배출\n\n## Ⅴ. 국지풍과 대기질 관리\n\n| 국지풍 | 대기질 영향 | 관리 방안 |\n|---|---|---|\n| 해륙풍 | 재순환·전환기 정체, 해풍역전 | 해안 산단 총량관리, 야간 가동 조정 |\n| 산곡풍 | 냉기호·분지 역전, 야간 고농도 | 분지 입지 제한, 굴뚝 상향, 바람길 확보 |\n| 푄 | 고온건조 → O₃ 생성 촉진 | 오존경보제, VOC·NOx 저감 |\n| 도시풍 | 열섬순환, 오염 돔(dome) | 바람길·녹지 조성 |\n\n## Ⅵ. 결론\n\n국지순환풍은 종관 기압배치가 약한 정체 조건에서 발달하여, 그 자체로 오염물질을 확산시키기도 하지만 **재순환·전환기 정온·역전 강화**를 통해 오히려 고농도를 유발하는 이중적 성격을 갖는다. 따라서 해안·분지지역의 대기질 관리에서는 종관 기상만이 아니라 국지 순환장을 재현할 수 있는 **고해상도 기상모델(WRF, CFD)과 CALPUFF 등 비정상 퍼프모델**의 적용이 필수적이며, 국지 기상관측망(연직바람관측장비, 자동기상관측장비) 확충이 병행되어야 한다.\n","side":[{"title":"자동기상관측장비(AWS)와 대기환경 활용","body":"### 정의\n기온·습도·풍향·풍속·기압·강수 등을 무인 자동으로 관측·전송하는 장비. 기상청은 전국 약 500여 지점에서 운영.\n\n### 관측요소와 표준 관측고도\n| 요소 | 센서 | 표준고도 |\n|---|---|---|\n| 풍향·풍속 | 풍배(컵)·풍향계, 초음파 풍속계 | **지상 10m** |\n| 기온·습도 | 백금저항온도계, 정전용량식 | 1.5m (백엽상/차폐통) |\n| 기압 | 전자식 기압계 | 지면 |\n| 강수 | 전도형·무게식 우량계 | 0.5~1m |\n| 일사·일조 | 전천일사계, 일조계 | 개활지 |\n\n### 대기환경 활용\n1. **확산모델 입력자료**: 시간별 풍향·풍속·기온 → Pasquill 등급 산정\n2. **환경영향평가 기상현황조사**: 최근 5년 자료 분석, 바람장미 작성\n3. **미세먼지 예보**: 풍속·혼합고·강수와 결합한 정체 판단\n4. **TMS 자료 검증**: 배출·기상 연계 분석\n\n### 유의사항\n- 주변 장애물(건물 높이의 10배 이상 이격) 확인\n- 대상지역 대표성 검토 — 해안·산지는 국지성이 커 별도 관측 필요\n- 결측·이상치 보정 절차 명시\n\n### 관측 자료의 품질관리(QC)\n| 검사 | 내용 |\n|---|---|\n| 물리한계 검사 | 기온 −40~50℃, 풍속 0~75m/s 등 범위 |\n| 단계 검사 | 시간당 변화율 이상치 |\n| 지속성 검사 | 동일값 연속(센서 고착) 탐지 |\n| 내적 일관성 | 기온≥이슬점, 풍속=0일 때 풍향 |\n\n### 결측 처리\n- 결측률 10% 초과 시 해당 기간 사용 불가\n- 인근 관측소 회귀보정 또는 재분석자료(ERA5, RDAPS) 대체 — 방법 명시 필수\n\n### 대표성 검토 (환경영향평가 필수)\n1. 대상지와 관측소의 **거리·표고차·지형** 비교\n2. 해안·산지는 국지성이 커 20km 이상 떨어지면 부적절 → **현장 관측 1년 이상** 권장\n3. 관측소 주변 건물·수목 변화(도시화) 확인 → 장기자료의 불연속 여부\n\n### 관련 관측망\nASOS(종관, 약 100개소) · **AWS(방재, 약 500개소)** · 해양기상부이 · 항공기상 · 농업기상 · 연직바람관측장비\n"},{"title":"단열선도를 이용한 푄 계산","body":"### 문제 유형\n\"기온 T₀, 상대습도 RH인 공기가 높이 H인 산을 넘을 때 풍하측 기온을 구하시오\"\n\n### 풀이 순서\n**1단계 — 상승응결고도(LCL) 산정**\nLCL(m) ≈ 125 × (T - Td)\n(T: 기온℃, Td: 이슬점℃)\n\n**2단계 — LCL까지 건조단열 냉각**\nT₁ = T₀ - 0.98 × (LCL/100)\n\n**3단계 — LCL~산정상 습윤단열 냉각**\nT₂ = T₁ - 0.5 × ((H - LCL)/100)\n\n**4단계 — 산정상→풍하측 지면 건조단열 승온**\nT₃ = T₂ + 0.98 × (H/100)\n\n### 검산 팁\n**ΔT = (Γd - Γs) × (H - LCL)/100**\n= (0.98 - 0.5) × (H-LCL)/100\n→ 풍상·풍하 기온차는 **구름층 두께에만 비례**한다는 점을 기억하면 검산이 쉽다.\n\n### 예시\nT₀=20℃, Td=12℃, H=2,000m\n- LCL = 125×8 = 1,000m\n- 풍하 기온 = 20 + 0.48×(2000-1000)/100 = 20 + 4.8 = **24.8℃**\n\n### 상승응결고도(LCL) 산정법 비교\n| 방법 | 식 | 비고 |\n|---|---|---|\n| 간이식 | LCL ≈ 125(T − Td) | 실무 표준, ℃·m |\n| Espy 식 | LCL ≈ 122(T − Td) | 유사 |\n| 단열선도 | 건조단열선과 포화혼합비선의 교점 | 가장 정확 |\n\n### 푄과 유사 현象의 구분\n| 현상 | 기작 | 차이점 |\n|---|---|---|\n| **푄** | 강수로 수증기 상실 후 건조단열 하강 | 습도 급감 동반 |\n| **활강풍(보라, Bora)** | 찬 공기가 산을 넘어 하강 | 승온하나 **여전히 차가움** |\n| **친 눅(Chinook)** | 북미 로키산맥 푄 | 동일 원리 |\n\n### 국내 높새바람의 대기환경 영향\n- 영서지방 기온 상승·습도 20~30%까지 급감\n- **산불 위험 급증** → 연무·PM 대량 배출 (2019 고성 산불 등)\n- 고온·강일사 조건에서 **오존 고농도** 유발\n- 농작물 건조피해(백화현상)\n\n### 답안 작성 팁\n푄 문제는 반드시 **산을 그리고 풍상·산정·풍하 3지점의 기온을 계산해 표기**한다. 검산식 ΔT = 0.48 × (H−LCL)/100 을 함께 쓰면 정확도가 확인된다.\n"},{"title":"CALPUFF - 비정상 퍼프모델","body":"### 개요\nUS EPA가 **장거리(50km 이상)·복잡지형·저풍속·정온 조건**의 규제모델(guideline model)로 승인한 라그랑지안 퍼프 모델. 국내 환경영향평가 권장모델 중 하나.\n\n### 구성\n| 모듈 | 역할 |\n|---|---|\n| **CALMET** | 3차원 진단 기상장 생성 (지형·토지이용 반영, 사면풍·해륙풍 모의) |\n| **CALPUFF** | 퍼프 이송·확산·화학변환·침적 계산 |\n| **CALPOST** | 후처리·통계·시각화 |\n\n### 가우시안 플룸 대비 장점\n1. **비정상(non-steady) 처리**: 시간에 따라 변하는 기상장 반영\n2. **정온(Calm) 대응**: 퍼프가 제자리에서 성장 → 발산하지 않음\n3. **비균질 풍속장**: 해륙풍·산곡풍 등 국지순환 재현\n4. **장거리 이송**: 화학변환(SO₂→SO₄²⁻, NOx→NO₃⁻), 습·건성 침적 포함\n5. **인과관계 추적**: 퍼프별 이력 추적 가능\n\n### 한계\n- 계산시간·입력자료 요구량이 큼\n- CALMET 진단 기상장의 불확실성\n- 건물 후류(down wash) 등 근거리 현상은 AERMOD가 우수\n\n### 적용 판단\n근거리·평탄지형·정상상태 → **AERMOD**\n장거리·복잡지형·저풍속 → **CALPUFF**\n\n### CALMET 진단 기상장의 생성 과정\n1. **1단계(진단 초기장)**: 지형에 의한 운동학적 효과 — 사면풍, 지형 차폐, 발산 최소화\n2. **2단계(관측 융합)**: 지상·상층 관측자료를 객관분석으로 내삽\n3. 결과: 시간별 3차원 풍속·안정도·혼합고 격자장\n\n### 퍼프의 확산 처리\n각 퍼프는 가우시안 형상을 유지하며 성장하고, 수용점 농도는 모든 퍼프의 기여를 합산한다.\n\nC = Σᵢ [ Qᵢ / (2π σyᵢ σzᵢ) ] × exp(−dᵢ²/2σyᵢ²) × 연직항\n\n- 저풍속에서 퍼프가 제자리에 머물며 σ만 커짐 → **발산하지 않음**\n- 풍향이 급변해도 각 퍼프가 독립적으로 이동 → 궤적 굴절 재현\n\n### 국내 적용 사례\n- 해안 발전소·산단(해륙풍 재순환)\n- 산악지형 시멘트·소각시설\n- 광역 총량관리 기여도 분석\n\n### 선정 근거 기술 요령\n평가서에는 ① 대상지 지형복잡도 ② 정온율 ③ 평가거리 ④ 대상물질(1차/2차)를 근거로 모델을 선정한 사유를 명시하고, 가능하면 AERMOD와 병행 수행하여 결과를 비교 제시하는 것이 바람직하다.\n"}]},"10":{"day":10,"date":"2026-08-10","title":"도시열섬현상과 바람길","keywords":[{"k":"열섬현상(UHI) 정의","subs":["도심이 교외보다 고온","열섬강도 ΔT(u-r)","야간·겨울·맑고 미풍 시 최대"]},{"k":"발생 원인","subs":["인공열(냉난방·교통·산업)","불투수면 증가·증발산 감소","도시협곡 복사포획, 조도 증가"]},{"k":"열섬순환과 먼지지붕","subs":["도심 상승 → 교외 하강","Dust Dome / Heat Island Circulation","오염물질 재유입"]},{"k":"바람길(Wind Path)","subs":["찬공기 생성지·이동통로·작용공간","독일 슈투트가르트 사례","클리마아틀라스(기후지도)"]},{"k":"개선방안","subs":["녹지·수공간 확충, 옥상·벽면녹화","쿨루프·투수포장(알베도↑)","건축물 배치·높이 규제로 통풍 확보"]}],"answer":"# 도시열섬현상과 바람길\n\n## Ⅰ. 개요\n\n**도시열섬현상(UHI, Urban Heat Island)**은 도시 중심부의 기온이 주변 교외지역보다 높게 나타나는 현상으로, 등온선을 그리면 도심이 섬처럼 고온역으로 나타나는 데서 유래한다. 열섬은 **에너지 소비 증가 → 온실가스·오염물질 배출 증가 → 열섬 심화**의 악순환을 형성하고, 광화학 오존 생성을 촉진하며 폭염 시 온열질환 사망률을 높인다. **바람길(Wind Path, Ventilation Corridor)**은 도시 외곽의 찬공기를 도심으로 유입시켜 열섬과 대기오염을 동시에 완화하는 도시계획적 대응수단이다.\n\n## Ⅱ. 도시열섬현상\n\n### 1. 열섬강도(UHI Intensity)\n**ΔT(u-r) = T(도심) - T(교외)**\n- 국내 대도시 최대 3~7℃ (서울 여름 야간 최대 5~8℃ 관측)\n- **야간, 겨울, 맑고 바람이 약한 날(풍속 < 3m/s)** 최대\n- 주간에는 오히려 도심이 낮을 수도 있음(건물 그늘·열저장)\n\n### 2. 발생 원인\n\n| 구분 | 세부 원인 | 기작 |\n|---|---|---|\n| **인공열(Anthropogenic heat)** | 냉난방, 교통, 산업, 조명 | 직접 열 방출. 서울 도심 연평균 20~100 W/m² |\n| **지표 피복 변화** | 아스팔트·콘크리트 등 불투수면 | 열용량·열전도도 큼 → 주간 축열, 야간 방출 |\n| **증발산 감소** | 녹지·수면 감소 | 잠열플럭스 감소 → 현열플럭스 증가 (보웬비 상승) |\n| **도시협곡(Urban Canyon)** | 고층건물 밀집 | 장파복사 포획(sky view factor 감소) → 야간 냉각 방해 |\n| **조도 증가** | 건물에 의한 마찰 | 풍속 감소 → 환기 불량 |\n| **대기오염** | 에어로졸·CO₂ | 장파복사 흡수·재방출 |\n\n### 3. 열섬순환(Heat Island Circulation)과 먼지지붕\n- 도심 가열 → 상승기류 → 지표에서 교외 → 도심 방향 수렴풍(**도시풍, Country Breeze**) → 상공에서 교외로 발산 → 하강 → 폐쇄순환\n- 순환 내부에 오염물질이 갇혀 도시 상공에 **먼지지붕(Dust Dome)**을 형성\n- 바람이 불면 풍하측으로 늘어져 **먼지깃(Dust Plume)** 형성\n- 결과: 배출된 오염물질이 도심으로 **재유입·축적**\n\n### 4. 영향\n1. **대기질**: 기온 상승으로 **VOC 증발·광화학반응 촉진 → 오존 고농도**. 기온 1℃ 상승 시 오존 농도 유의하게 증가\n2. **에너지**: 냉방부하 증가 → 전력수요·발전 배출 증가 → 온실가스 증가\n3. **건강**: 폭염일수·열대야 증가, 온열질환·심혈관질환 사망률 상승. 취약계층 집중 피해\n4. **물순환**: 불투수면 증가로 도시홍수, 지하수 함양 감소\n5. **생태**: 도시 생물 서식지 변화, 개화시기 변동\n\n## Ⅲ. 바람길(Wind Path / Ventilation Corridor)\n\n### 1. 개념\n도시 외곽 산림·하천·농지에서 야간에 생성된 **찬공기(cold air)**를 도심으로 유입시켜 기온을 낮추고 오염물질을 배출시키는 통로. 독일 **슈투트가르트(Stuttgart)**가 대표 사례이며, 국내는 서울·대구·부산 등이 도시기후지도 기반으로 도입 중.\n\n### 2. 구성요소\n\n| 구성 | 기능 | 계획 요소 |\n|---|---|---|\n| **찬공기 생성지(Cold air production area)** | 야간 복사냉각으로 냉기 생성 | 산림·녹지·농경지·하천 — **보전** |\n| **바람길(이동통로, Ventilation path)** | 찬공기 수송 | 하천변·도로축·저층부 — **개방 유지** |\n| **작용공간(Action area)** | 냉기가 도달해 효과를 발휘 | 고밀 시가지·취약지역 — **수용** |\n\n### 3. 설계 방법\n1. **도시기후지도(Klimaatlas) 작성**: 기온·풍속·찬공기 생성량·오염물질 분포를 GIS로 도면화\n2. **찬공기 유동 해석**: KLAM_21, FITNAH 등 냉기류 모델 또는 CFD 해석\n3. **바람길 축 설정**: 주풍향 및 냉기 유동방향과 일치하는 선형 오픈스페이스 확보\n4. **건축 규제**: 바람길 축상의 **건축물 높이·용적률·배치 제한**, 저층부 필로티, 이격거리 확보\n5. **연결성 확보**: 하천-녹지-가로수-공원의 **네트워크화**(단절 방지)\n6. **제도화**: 도시기본계획·지구단위계획에 반영, 환경영향평가 협의조건화\n\n### 4. 효과\n- 야간 기온 1~3℃ 저감\n- 도심 환기 개선 → PM·오존 농도 저감\n- 냉방에너지 절감 → 온실가스 감축\n- 폭염 취약계층 보호\n\n## Ⅳ. 열섬 개선방안 종합\n\n| 구분 | 방안 | 기대효과 |\n|---|---|---|\n| **지표피복** | 옥상·벽면녹화, 쿨루프(고반사 도료), 투수·차열 포장 | 알베도 상승, 축열 감소 |\n| **녹지·수공간** | 도시숲·가로수·소공원, 하천 복원(청계천 등), 실개천·분수 | 증발산 냉각, 그늘 |\n| **도시구조** | 바람길 확보, 건폐율·높이 규제, 건물 배치 조정 | 환기 개선 |\n| **에너지** | 지역냉난방, 신재생에너지, 건물 에너지효율(제로에너지빌딩) | 인공열 저감 |\n| **교통** | 대중교통·전기차 전환, 도로 다이어트 | 인공열·배출 저감 |\n| **제도** | 도시기후지도 제도화, 환경영향평가 시 열섬·바람길 평가 항목화 | 사전예방 |\n\n## Ⅴ. 결론\n\n도시열섬은 인공열·불투수면·증발산 감소·도시협곡·조도 증가가 복합 작용한 결과이며, 열섬순환에 의한 먼지지붕 형성으로 대기질을 직접 악화시킨다. 열섬 대응은 개별 건축물 단위의 녹화·쿨루프만으로는 한계가 있으므로, **도시기후지도에 기반한 바람길 축의 설정과 이를 뒷받침하는 건축·도시계획 규제의 제도화**가 병행되어야 한다. 기후변화로 폭염 강도가 증가하는 상황에서 열섬 저감은 대기질 개선·온실가스 감축·건강 보호를 동시에 달성하는 **다중편익(co-benefit) 전략**으로 접근할 필요가 있다.\n","side":[{"title":"그린커튼(Green Curtain)","body":"### 정의\n건축물의 벽면·창문 외부에 덩굴성 식물을 격자(네트)에 유인하여 **커튼 형태의 녹색 차양**을 조성하는 기법. 129회 기출 용어.\n\n### 원리\n1. **차광**: 태양복사의 직접 유입 차단 (일사 차단율 60~80%)\n2. **증발산 냉각**: 잎의 증산작용으로 잠열 소비 → 주변 기온 저하\n3. **단열**: 식물층이 공기층을 형성해 벽면 열전달 억제\n\n### 효과\n- 벽면 표면온도 **10~15℃ 저감**\n- 실내온도 2~4℃ 저감 → 냉방에너지 20~30% 절감\n- CO₂ 흡수, 미세먼지 흡착·저감\n- 도시 경관 개선, 심리적 안정\n\n### 주요 수종\n나팔꽃, 여주, 수세미, 담쟁이덩굴, 으아리, 마삭줄 등 (생장 빠르고 병해충에 강한 덩굴성 식물)\n\n### 적용 및 한계\n- 학교·공공청사·주택 남측·서측 벽면에 적용\n- 겨울철 낙엽 후 일사 취득 가능(낙엽성 수종 유리)\n- **한계**: 관수·유인 등 유지관리 필요, 건물 하중·습기·해충 문제\n- 벽면녹화·옥상녹화와 함께 열섬 저감 및 탄소중립 도시 조성 수단으로 활용\n\n### 설치 방법\n1. 벽면에서 20~30cm 이격하여 네트(줄·와이어) 설치 — 벽면 습기·하중 문제 회피\n2. 화분 또는 지면 식재 후 유인\n3. 관수시설(점적관수) 병행\n\n### 유사 기법 비교\n| 기법 | 적용부위 | 냉각효과 | 유지관리 |\n|---|---|---|---|\n| **그린커튼** | 벽·창 외부 | 표면 10~15℃↓ | 관수·유인 필요 |\n| 옥상녹화 | 옥상 | 표면 15~20℃↓ | 방수·하중 검토 |\n| 벽면녹화 | 벽면 부착 | 표면 10~15℃↓ | 구조 보강 |\n| 쿨루프(고반사) | 옥상 | 표면 10~20℃↓ | 재도장 주기 |\n\n### 정책적 위치\n- 「도시숲법」·「탄소중립기본법」상 온실가스 흡수원 및 적응대책 수단\n- 지자체 그린커튼 지원사업(학교·경로당·공공청사) 확대\n- 건축물 녹화 시 **생태면적률** 산정에 반영되어 인허가 인센티브\n\n### 한계와 보완\n단일 건물 단위 효과이므로 도시 전체 열섬 저감에는 한계가 있다. **바람길·도시숲 등 광역 대책과 병행**해야 실질적 효과를 낸다.\n"},{"title":"도시협곡(Urban Canyon)과 오염물질 거동","body":"### 정의\n도로 양측에 건물이 연속적으로 늘어서 협곡 형태를 이루는 도시 공간. **종횡비 H/W**(건물높이/도로폭)로 특성화.\n\n### 유동 패턴 (H/W에 따라)\n| H/W | 유동 형태 | 특징 |\n|---|---|---|\n| < 0.3 | **고립 조도류** | 건물마다 독립 후류, 환기 양호 |\n| 0.3~0.7 | **후류 간섭류** | 후류가 서로 간섭 |\n| **> 0.7** | **스키밍류(Skimming flow)** | 상부 기류가 협곡 위로 미끄러짐, **협곡 내 폐쇄 와류** 형성 → 환기 극히 불량 |\n\n### 오염물질 거동\n- 스키밍류에서 협곡 내 **캐노피 와류(canyon vortex)** 발생\n- **풍상측 보도(leeward side)에 오염물질 집중**, 풍하측(windward)은 상대적 청정\n- 자동차 배출 NO₂·PM의 보행자 노출 농도가 배경농도의 3~10배\n- 열섬 심화(sky view factor 감소 → 야간 냉각 방해)\n\n### 대책\n1. 건물 높이·배치 규제로 H/W 관리, 저층부 필로티·개구부 확보\n2. 가로수는 **수관이 과밀하지 않은 수종** 선택 (과밀 시 오히려 환기 저해)\n3. 도로변 완충녹지·방음벽 형태 최적화\n4. 저공해 차량 전환, 통행량 관리\n5. CFD 해석을 통한 사전 검토(환경영향평가)\n\n### 종횡비별 저감효과 (개략)\n| H/W | 협곡 내 상대농도 |\n|---|---|\n| 0.3 | 1.0 (기준) |\n| 0.7 | 1.8 |\n| 1.5 | 3.0 이상 |\n\n### 가로수의 양면성\n| 효과 | 내용 |\n|---|---|\n| **긍정** | 그늘·증발산 냉각, 입자 침착(잎 표면), 심리적 효과 |\n| **부정** | 수관이 협곡 상부를 덮으면 환기 차단 → **농도 오히려 상승** |\n\n→ 설계 원칙: 수관 폭이 도로폭의 일정 비율 이하, 수고를 건물 높이보다 낮게, 수관이 성긴 수종(느티나무보다 이팝나무 등), 열식(列植) 간격 확보\n\n### 국내 관련 제도\n- 「대기관리권역법」상 **도로 재비산먼지 관리**, 도로청소차 운영\n- **도로변 대기측정망**(전국 40여 개소) — 협곡 노출농도 감시\n- 환경영향평가 시 도로·터널 사업의 CFD 해석 요구 증가\n\n### 개선 사례\n서울 세종대로·연세로 등의 **도로 다이어트(차로 축소 + 보행공간 확대)**는 통행량 감소와 협곡 개방을 동시에 달성해 NO₂·PM 저감 효과가 보고되었다.\n"},{"title":"폭염 위험도와 대응","body":"### 폭염 특보 기준 (기상청)\n- **폭염주의보**: 일 최고체감온도 33℃ 이상이 2일 이상 지속 예상\n- **폭염경보**: 일 최고체감온도 35℃ 이상이 2일 이상 지속 예상\n- 급격한 체감온도 상승·폭염 장기화로 큰 피해 예상 시에도 발령\n\n### 폭염 위험도 평가 (IPCC 리스크 개념)\n**위험도 = 위해성(Hazard) × 노출(Exposure) × 취약성(Vulnerability)**\n\n| 요소 | 지표 예시 |\n|---|---|\n| 위해성 | 폭염일수, 열대야일수, 최고기온, 열섬강도 |\n| 노출 | 인구밀도, 시가화 면적, 야외근로자 수 |\n| 취약성 | 고령자·기저질환자 비율, 독거노인, 냉방기 보급률, 녹지율, 기초수급자 |\n\n### 대응방안\n1. **구조적**: 그늘막·쿨링포그·무더위쉼터, 도시숲·바람길, 쿨루프·쿨페이브먼트\n2. **비구조적**: 폭염 조기경보, 취약계층 방문건강관리, 야외작업 중지 기준(체감온도 기반), 무더위 휴식시간제\n3. **계획적**: 기후변화 적응대책 세부시행계획, 도시기후지도 기반 우선지역 선정\n4. **대기질 연계**: 폭염 시 오존 고농도 동반 → 오존경보제와 통합 대응\n\n### 관련 제도\n「기후위기 대응을 위한 탄소중립·녹색성장 기본법」에 따른 **기후변화 적응대책**, 「재난 및 안전관리 기본법」상 폭염의 자연재난 포함(2018)\n\n### 열지수와 체감온도\n- **열지수(Heat Index)**: 기온과 습도로 산정. 미국 NWS 방식\n- **WBGT(습구흑구온도)**: 기온·습도·복사열·풍속 종합. 산업안전 기준\n  - WBGT 31℃ 이상: 중작업 중지\n- 기상청 폭염특보는 **일 최고체감온도** 기준으로 전환(2020~)\n\n### 폭염과 대기질의 상호작용\n1. 고온·강일사 → **광화학반응 촉진 → 오존 고농도**\n2. 고온 → VOC 증발 증가(주유소·도장시설)\n3. 냉방수요 급증 → 발전 배출 증가\n4. 폭염 시 정체성 기압배치 동반 → 확산 불량\n→ 폭염과 오존경보가 동시 발령되는 경우가 많아 **통합 대응체계**가 필요\n\n### 국내 제도\n| 제도 | 근거 |\n|---|---|\n| 폭염 자연재난 지정(2018) | 재난안전법 |\n| 기후변화 적응대책 | 탄소중립기본법 |\n| 온열질환 응급실감시체계 | 질병관리청 |\n| 무더위쉼터·폭염저감시설 | 지자체 조례 |\n\n### 취약계층 우선 대응\n독거노인·기초수급자·야외근로자·영유아를 대상으로 도시기후지도상 **고위험 지역을 우선 선정**하여 그늘막·쿨링포그·무더위쉼터를 배치하는 것이 비용효과적이다.\n"}]},"11":{"day":11,"date":"2026-08-11","title":"연기의 유동특수현상 6가지","keywords":[{"k":"Looping(환상형)","subs":["ELR>Γd 강한 불안정","주간 맑음·미풍","순간 착지 고농도"]},{"k":"Coning(원추형)","subs":["ELR≈Γd 중립","흐린 날·강풍","가우시안 가정 최적"]},{"k":"Fanning(부채형)","subs":["ELR<0 역전, 강안정","야간 접지역전","수평만 확산"]},{"k":"Lofting(지붕형)","subs":["하
