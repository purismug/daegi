부를 덮으면 환기 차단 → **농도 오히려 상승** |\n\n→ 설계 원칙: 수관 폭이 도로폭의 일정 비율 이하, 수고를 건물 높이보다 낮게, 수관이 성긴 수종(느티나무보다 이팝나무 등), 열식(列植) 간격 확보\n\n### 국내 관련 제도\n- 「대기관리권역법」상 **도로 재비산먼지 관리**, 도로청소차 운영\n- **도로변 대기측정망**(전국 40여 개소) — 협곡 노출농도 감시\n- 환경영향평가 시 도로·터널 사업의 CFD 해석 요구 증가\n\n### 개선 사례\n서울 세종대로·연세로 등의 **도로 다이어트(차로 축소 + 보행공간 확대)**는 통행량 감소와 협곡 개방을 동시에 달성해 NO₂·PM 저감 효과가 보고되었다.\n"},{"title":"폭염 위험도와 대응","body":"### 폭염 특보 기준 (기상청)\n- **폭염주의보**: 일 최고체감온도 33℃ 이상이 2일 이상 지속 예상\n- **폭염경보**: 일 최고체감온도 35℃ 이상이 2일 이상 지속 예상\n- 급격한 체감온도 상승·폭염 장기화로 큰 피해 예상 시에도 발령\n\n### 폭염 위험도 평가 (IPCC 리스크 개념)\n**위험도 = 위해성(Hazard) × 노출(Exposure) × 취약성(Vulnerability)**\n\n| 요소 | 지표 예시 |\n|---|---|\n| 위해성 | 폭염일수, 열대야일수, 최고기온, 열섬강도 |\n| 노출 | 인구밀도, 시가화 면적, 야외근로자 수 |\n| 취약성 | 고령자·기저질환자 비율, 독거노인, 냉방기 보급률, 녹지율, 기초수급자 |\n\n### 대응방안\n1. **구조적**: 그늘막·쿨링포그·무더위쉼터, 도시숲·바람길, 쿨루프·쿨페이브먼트\n2. **비구조적**: 폭염 조기경보, 취약계층 방문건강관리, 야외작업 중지 기준(체감온도 기반), 무더위 휴식시간제\n3. **계획적**: 기후변화 적응대책 세부시행계획, 도시기후지도 기반 우선지역 선정\n4. **대기질 연계**: 폭염 시 오존 고농도 동반 → 오존경보제와 통합 대응\n\n### 관련 제도\n「기후위기 대응을 위한 탄소중립·녹색성장 기본법」에 따른 **기후변화 적응대책**, 「재난 및 안전관리 기본법」상 폭염의 자연재난 포함(2018)\n\n### 열지수와 체감온도\n- **열지수(Heat Index)**: 기온과 습도로 산정. 미국 NWS 방식\n- **WBGT(습구흑구온도)**: 기온·습도·복사열·풍속 종합. 산업안전 기준\n  - WBGT 31℃ 이상: 중작업 중지\n- 기상청 폭염특보는 **일 최고체감온도** 기준으로 전환(2020~)\n\n### 폭염과 대기질의 상호작용\n1. 고온·강일사 → **광화학반응 촉진 → 오존 고농도**\n2. 고온 → VOC 증발 증가(주유소·도장시설)\n3. 냉방수요 급증 → 발전 배출 증가\n4. 폭염 시 정체성 기압배치 동반 → 확산 불량\n→ 폭염과 오존경보가 동시 발령되는 경우가 많아 **통합 대응체계**가 필요\n\n### 국내 제도\n| 제도 | 근거 |\n|---|---|\n| 폭염 자연재난 지정(2018) | 재난안전법 |\n| 기후변화 적응대책 | 탄소중립기본법 |\n| 온열질환 응급실감시체계 | 질병관리청 |\n| 무더위쉼터·폭염저감시설 | 지자체 조례 |\n\n### 취약계층 우선 대응\n독거노인·기초수급자·야외근로자·영유아를 대상으로 도시기후지도상 **고위험 지역을 우선 선정**하여 그늘막·쿨링포그·무더위쉼터를 배치하는 것이 비용효과적이다.\n"}]},"11":{"day":11,"date":"2026-08-11","title":"연기의 유동특수현상 6가지","keywords":[{"k":"Looping(환상형)","subs":["ELR>Γd 강한 불안정","주간 맑음·미풍","순간 착지 고농도"]},{"k":"Coning(원추형)","subs":["ELR≈Γd 중립","흐린 날·강풍","가우시안 가정 최적"]},{"k":"Fanning(부채형)","subs":["ELR<0 역전, 강안정","야간 접지역전","수평만 확산"]},{"k":"Lofting(지붕형)","subs":["하층 안정 / 상층 불안정","지표농도 최소 → 가장 이상적","일몰 후 역전 형성기"]},{"k":"Fumigation·Trapping","subs":["Fumigation: 상층안정/하층불안정 → 지표 최고농도","일출 후 역전 해소기","Trapping: 상·하 이중역전, 지속 축적"]}],"answer":"# 연기의 유동특수현상(Plume Behavior) 6가지\n\n## Ⅰ. 개요\n\n굴뚝에서 배출된 배출가스(plume)는 **대기안정도(ELR과 Γd의 관계)**에 따라 뚜렷이 다른 형태로 확산된다. 이를 **연기의 유동특수현상**이라 하며, 형태별로 지표 착지농도와 최대착지거리가 크게 달라지므로 **굴뚝높이 설계·입지 계획·민원 대응**의 기초가 된다. 기본형 3가지(Looping, Coning, Fanning)와 역전층과의 상대적 위치에 따른 3가지(Lofting, Fumigation, Trapping)로 구분한다.\n\n## Ⅱ. 기본형 3가지 — 안정도에 의한 분류\n\n### 1. 환상형(Looping, 파상형)\n- **조건**: ELR > Γd (**과단열, 절대불안정**)\n- **기상**: 맑은 여름 낮, 강한 일사, 풍속 2m/s 이하. Pasquill A~B\n- **형태**: 대규모 대류 와동(thermal)에 의해 연기가 크게 상하로 요동\n- **특징**\n  - 전체적 확산은 매우 양호하나 **순간적으로 지표에 착지**하여 국지 고농도 발생\n  - 착지지점이 시시각각 변동 → 민원 발생 원인\n  - 최대착지농도 지점이 굴뚝에 **가까움**\n- **대책**: 유효굴뚝높이 상향, 주간 고부하 운전 조정\n\n### 2. 원추형(Coning)\n- **조건**: ELR ≈ Γd (**중립**)\n- **기상**: 흐린 날, 강풍(> 6m/s), 주야 무관. Pasquill C~D\n- **형태**: 풍하방향으로 원뿔 모양으로 균일 확산\n- **특징**\n  - 수평·연직 확산이 모두 정규분포(Gaussian) → **가우시안 플룸모델 가정이 가장 잘 성립**\n  - 농도 예측 정확도가 가장 높은 조건\n  - 최대착지거리는 통상 굴뚝높이의 10~20배\n\n### 3. 부채형(Fanning)\n- **조건**: ELR < 0 (**역전, 절대안정**) 또는 강한 미단열\n- **기상**: 맑은 야간~새벽, 미풍, 접지역전. Pasquill E~F\n- **형태**: 연직확산이 억제되어 **수평으로만 부채처럼 퍼짐**\n- **특징**\n  - 지표 착지가 거의 없어 **단기적으로는 지표농도 낮음**\n  - 그러나 오염물질이 상공에 **축적**되었다가 일출 후 Fumigation으로 급강하 → 최악의 결과\n  - 상공에서 장거리 이송\n\n## Ⅲ. 역전층과의 상대 위치에 의한 3가지\n\n### 4. 지붕형(Lofting, 상승형)\n- **조건**: **하층 안정(역전) / 상층 불안정 또는 중립**, 배출구가 역전층 **위**에 위치\n- **기상**: 일몰 후 지표 복사역전이 형성되기 시작하는 시간대\n- **형태**: 연기가 위로만 확산, 아래로는 역전층에 막혀 내려오지 못함\n- **특징**: **지표 착지농도가 6가지 중 가장 낮음 → 가장 바람직한 형태**\n- **설계 시사점**: 유효굴뚝높이(He)를 **역전층 상단보다 높게** 설계하면 Lofting을 유도할 수 있음\n\n### 5. 훈증형(Fumigation)\n- **조건**: **상층 안정(역전) / 하층 불안정**, 배출구가 역전층 **아래 또는 내부**\n- **기상**: 일출 후 2~3시간, 지표부터 역전층이 해소되는 시간대\n- **형태**: 상부 역전층에 막혀 위로 못 가고, 하부 불안정으로 급격히 **하향 확산**\n- **특징**\n  - **지표 착지농도가 6가지 중 가장 높음 → 최악 조건**\n  - 지속시간 30분~2시간, 굴뚝 인근 고농도 민원의 주원인\n  - 농도식(연직 완전혼합 가정): **C = Q / (√(2π)·u·σy·hi)**  (hi ≈ He + 2σz)\n- **대책**: 굴뚝높이 상향, 배출가스 온도·유속 확보(유효고 증대), 아침 시간대 부하 조정\n\n### 6. 구속형(Trapping, 함정형)\n- **조건**: **상·하층 모두 역전**(이중역전), 배출구가 두 역전층 사이\n- **기상**: 야간 복사역전 + 상공 침강역전이 동시 발생하는 정체 고기압\n- **형태**: 상하로 갇힌 채 수평으로만 확산·축적\n- **특징**: 오염물질이 **수일간 지속 축적** → LA스모그·런던스모그형 대기오염 사건의 조건\n\n## Ⅳ. 종합 비교표\n\n| 형태 | 안정도 조건 | 발생 시간대 | 지표농도 | 확산 |\n|---|---|---|---|---|\n| Looping | ELR > Γd (불안정) | 맑은 낮 | 순간 고농도(변동) | 매우 양호 |\n| Coning | ELR ≈ Γd (중립) | 흐림·강풍 | 보통 | 양호 |\n| Fanning | ELR < 0 (역전) | 맑은 밤 | 낮음(단기) | 불량 |\n| **Lofting** | 하부 역전 / 상부 불안정 | 일몰 후 | **최저** | 상방 양호 |\n| **Fumigation** | 상부 역전 / 하부 불안정 | 일출 후 | **최고** | 하방 급확산 |\n| Trapping | 상·하 이중역전 | 정체 고기압 | 지속 고농도 | 최악 |\n\n## Ⅴ. 대기환경 관리적 적용\n\n1. **굴뚝높이 설계**: **Fumigation과 Trapping을 지배조건**으로 가정하여 최악 착지농도를 산정하고, 유효굴뚝높이가 역전층 상단을 초과하도록 설계한다.\n2. **환경영향평가**: 시간대별 안정도 출현빈도를 반영해 단기(1시간 최대) 예측 시 Fumigation 조건을 반드시 포함한다.\n3. **입지 계획**: 역전 빈발지역(분지·계곡·해안)은 Trapping 위험이 크므로 배출시설 입지를 제한하거나 총량관리를 적용한다.\n4. **운전 관리**: 아침 훈증 시간대에 고부하 운전을 피하고, 배출가스 온도(부력 상승)와 토출속도(운동량 상승)를 확보한다.\n5. **민원 대응**: 민원 발생 시각과 기상조건을 대조하여 Looping(주간 순간) 또는 Fumigation(오전)을 구분하면 원인 규명이 용이하다.\n\n## Ⅵ. 결론\n\n연기의 유동특수현상은 대기안정도와 역전층의 상대적 위치가 결정하며, **Lofting이 가장 바람직하고 Fumigation과 Trapping이 최악**의 조건이다. 실무에서는 이 6가지 형태를 정성적으로 이해하는 데 그치지 않고, 각 조건에 대응하는 농도식과 발생 빈도를 정량적으로 평가하여 **유효굴뚝높이 결정과 최대착지농도 예측**에 반영하여야 하며, 특히 역전 발생특성 조사가 선행되어야 한다.\n","side":[{"title":"Building Down Wash와 Down Draught","body":"126회 기출: \"Fumigation, Building Down Draught & Down Wash\"\n\n### 1. Building Down Wash (건물 세류)\n- **정의**: 굴뚝 인근 건물의 **후류(wake)** 영역에 배출가스가 말려들어 지표로 끌려 내려오는 현상\n- **원인**: 건물 풍하측에 생기는 저압 재순환 영역\n- **판정 기준(GEP, Good Engineering Practice 굴뚝높이)**\n  - **Hs ≥ H + 1.5L** 이면 down wash 회피\n  - H: 인접 건물 높이, L: 건물의 높이와 투영폭 중 작은 값\n  - 미국 EPA GEP 최대 인정높이 = 65m 또는 H+1.5L\n- **영향**: 지표농도 수배 상승, 근거리 고농도\n\n### 2. Stack Down Wash (굴뚝 세류)\n- **정의**: 굴뚝 자체의 후류에 배출가스가 말려 내려오는 현상\n- **판정**: **토출속도 Vs < 1.5 × 풍속 u** 일 때 발생\n- **대책**: **Vs ≥ 1.5u** 유지 (통상 Vs 15~20 m/s 이상 설계), 굴뚝 상단부 축소(cone), 풍향판 설치\n- Briggs 보정: Vs < 1.5u 이면 유효고에 h' = 2(Vs/u - 1.5)·d 만큼 감산\n\n### 3. Down Draught (하강기류)\n- 굴뚝 주변 지형(산·절벽)이나 건물군에 의해 발생하는 하강기류가 배출가스를 지표로 끌어내리는 현상\n\n### 4. 종합 대책\n1. 굴뚝높이 ≥ 주변 건물 높이의 2.5배 또는 GEP 만족\n2. 토출속도 확보 (Vs/u ≥ 1.5)\n3. **빗물유입방지 갓(rain cap) 금지** — 하향 토출 유발\n4. 배치계획 단계에서 건물·굴뚝 상대위치 검토 (풍동실험·CFD)\n\n### 건물 후류(Wake) 구조\n| 영역 | 범위 | 특징 |\n|---|---|---|\n| 공동역(Cavity) | 건물 풍하 1~3H | 재순환 와류, **농도 최대** |\n| 후류역(Wake) | 3~10H | 난류 강화, 확산 촉진 |\n| 변위역(Displacement) | 건물 전면 | 상승 유동 |\n\n### 확산모델에서의 처리\n- **PRIME 알고리즘**(AERMOD 내장): 공동역 내 균일혼합 + 후류 확산 증대를 동시 모의\n- BPIP-PRIME 전처리기로 36개 풍향별 건물 투영폭·높이 입력\n- Down Wash 미고려 시 지표농도를 **수배 과소평가**하게 되므로 반드시 적용\n\n### 실무 점검사항\n1. 굴뚝 반경 5L 이내 모든 구조물 조사(높이·폭·위치)\n2. 향후 증축 계획까지 고려\n3. 냉각탑·저장탱크 등 부속 구조물도 포함\n4. 인접 사업장 건물도 검토 대상\n"},{"title":"최대착지농도와 최대착지거리","body":"### 정의\n- **최대착지농도(Cmax)**: 지표(z=0), 플룸 중심선(y=0)에서 나타나는 최대 농도\n- **최대착지거리(Xmax)**: Cmax가 나타나는 굴뚝으로부터의 풍하거리\n\n### 유도 (σz/σy = 일정 가정)\n가우시안 지표농도식\nC(x,0,0) = (Q / π·u·σy·σz)·exp(-He²/2σz²)\n\ndC/dx = 0 조건에서\n\n**σz(at Xmax) = He / √2**\n\n이를 대입하면\n\n**Cmax = 2Q / (π·e·u·He²) × (σz/σy)**\n   ≈ **0.234 Q / (u·He²) × (σz/σy)**\n\n### 시사점\n1. **Cmax ∝ 1/He²** → **유효굴뚝높이를 2배로 하면 최대농도는 1/4로 감소**\n   → 굴뚝높이가 가장 효과적인 저감수단인 이유\n2. **Cmax ∝ 1/u** → 저풍속에서 고농도\n3. **Cmax ∝ Q** → 배출량에 비례\n4. Xmax는 안정도에 따라 변화: 불안정(A)일수록 가깝고, 안정(F)일수록 멀어짐\n   (대략 He의 5~10배(불안정) ~ 수십 km(안정))\n\n### 실무 적용\n환경영향평가에서 Cmax와 Xmax를 산정해 **최대영향예상지점**을 선정하고, 해당 지점의 예측농도를 환경기준과 비교한다.\n\n### 안정도별 Xmax 개략값 (He = 100m 기준)\n| 안정도 | σz 성장 | Xmax |\n|---|---|---|\n| A (강불안정) | 매우 빠름 | 약 0.3~0.5 km |\n| C | 빠름 | 약 1~2 km |\n| D (중립) | 보통 | 약 2~4 km |\n| E | 느림 | 약 8~15 km |\n| F (안정) | 매우 느림 | 20 km 이상 또는 미착지 |\n\n### 계산 문제 풀이 순서\n1. **He = Hs + Δh** 산정 (Briggs 식)\n2. **σz = He/√2** 계산\n3. 해당 안정도의 σz 곡선(또는 Briggs 식)에서 **역으로 Xmax** 산출\n4. 그 지점의 σy를 구해 **Cmax** 계산\n5. 단위 확인: Q[g/s], u[m/s], σ[m] → C[g/m³] → **×10⁶ 하여 µg/m³**\n\n### 실무적 시사점\n- Cmax는 굴뚝높이의 제곱에 반비례하나, **배출량 저감이 우선**이라는 원칙은 변하지 않는다\n- 굴뚝을 높이면 Cmax는 감소하지만 Xmax가 멀어져 **영향범위가 넓어지고 장거리 이송이 증가**한다\n- 따라서 GEP 상한(65m) 개념으로 \"굴뚝만 높이는 회피\"를 제도적으로 차단한다\n"},{"title":"플레어시스템(Flare System)","body":"### 정의\n석유화학·정유 공정에서 비정상 운전·긴급방출 시 발생하는 가연성 가스를 안전하게 **연소 처리**하는 설비. 120회·최근 기출.\n\n### 구성\n| 구성요소 | 기능 |\n|---|---|\n| **Knock-out Drum** | 액적 제거 (액체 낙하 화재 방지) |\n| **Liquid Seal Drum** | 역화(flash back) 방지 |\n| **Flare Stack** | 연소 및 확산 (통상 30~100m) |\n| **Pilot Burner + Igniter** | 상시 점화 유지 |\n| **Steam/Air Injection** | 매연(smoke) 억제, 연소 촉진 |\n| **Molecular Seal** | 공기 유입 차단 |\n\n### 설계 시 고려사항\n1. **복사열(Radiation)**: 지상 인체 노출 한계 통상 **4.73 kW/m²** 이하 → 높이·이격거리 결정\n2. **연소효율**: 98% 이상 (US EPA 기준: 열량 ≥ 11.2 MJ/Nm³, 출구유속 제한)\n3. **매연 억제**: Steam/Air 주입비, 발연한계(smokeless capacity)\n4. **역화 방지**: Purge gas 상시 공급 (유속 하한 유지)\n5. **소음**: 저소음 팁, 야간 기준 준수\n\n### 대기환경 측면\n- 배출물질: **NOx, CO, 미연 VOC, 매연(그을음), SO₂**(H₂S 함유 시)\n- 「대기환경보전법」상 **비산배출시설 관리대상**(정유·석유화학 업종)\n- 비정상 운전 시 순간 대량 배출 → 인근 악취·민원\n- **저감방안**: Flare Gas Recovery System(FGRS) 도입으로 회수·재사용, 발생 자체 최소화\n- 통합환경허가 시 BAT로 FGRS 및 플레어 모니터링(유량계·열량계·영상감시) 요구\n"}]},"12":{"day":12,"date":"2026-08-12","title":"유효굴뚝높이와 굴뚝설계","keywords":[{"k":"유효굴뚝높이(He)","subs":["He = Hs + Δh","Hs: 실제높이, Δh: 연기상승고","최대착지농도 ∝ 1/He²"]},{"k":"연기상승 기구","subs":["운동량 상승(momentum): Vs·d","부력 상승(buoyancy): ΔT","풍속에 반비례"]},{"k":"Δh 산정식","subs":["Briggs식(부력플럭스 F)","CONCAWE식, Holland식","안정도별 구분 적용"]},{"k":"Down Wash 방지","subs":["Stack: Vs ≥ 1.5u","Building: Hs ≥ H + 1.5L (GEP)","rain cap 금지"]},{"k":"굴뚝 설계 요소","subs":["법정 최소높이·측정공 위치","내식·내열 재질, 라이닝","항공장애표시, 구조안정성"]}],"answer":"# 유효굴뚝높이와 굴뚝설계\n\n## Ⅰ. 개요\n\n굴뚝에서 배출된 가스는 자체의 **운동량(momentum)**과 주위 대기보다 높은 온도에 의한 **부력(buoyancy)**으로 실제 굴뚝높이보다 더 높은 곳까지 상승한 후 수평 이송된다. 이때 연기 중심선이 최종적으로 도달한 높이를 **유효굴뚝높이(He, Effective Stack Height)**라 하며, 최대착지농도가 **He²에 반비례**하므로 굴뚝 설계에서 가장 중요한 인자이다.\n\n## Ⅱ. 유효굴뚝높이의 정의\n\n**He = Hs + Δh**\n\n- **Hs**: 실제 굴뚝높이(geometric stack height) [m]\n- **Δh**: 연기상승고(plume rise) [m]\n- 확산모델에서 배출원의 연직 위치로 He를 사용한다.\n\n### 최대착지농도와의 관계\n가우시안 모델에서\n\n**Cmax ≈ 0.234 · Q / (u · He²) × (σz/σy)**\n\n→ **He를 2배로 하면 Cmax는 1/4로 감소**. 굴뚝높이 상향이 가장 확실한 저감수단인 이유이며, 동시에 \"높은 굴뚝은 희석일 뿐 저감이 아니다(dilution is not the solution)\"라는 비판의 근거이기도 하다.\n\n## Ⅲ. 연기상승(Plume Rise)의 기구\n\n### 1. 운동량 상승(Momentum Rise)\n- 배출가스의 **토출속도(Vs)와 굴뚝 내경(d)**에 의한 상승\n- 운동량 플럭스 **Fm = Vs²·d²·(Ts - Ta)/(4·Ts)** 또는 Fm = Vs²·d²/4 × (ρs/ρa)\n- 배출가스 온도가 대기온도와 같을 때(등온 배출) 지배적\n\n### 2. 부력 상승(Buoyancy Rise)\n- 배출가스가 주변 공기보다 **뜨거워 밀도가 작기 때문**에 발생\n- 부력 플럭스 **F = g·Vs·d²·(Ts - Ta) / (4·Ts)**  [m⁴/s³]\n- 대부분의 연소시설(보일러·소각로)에서 **지배적 기구**\n\n### 3. 영향 인자\n\n| 인자 | Δh와의 관계 |\n|---|---|\n| 배출가스 온도(Ts) | 높을수록 증가 (부력↑) |\n| 토출속도(Vs) | 클수록 증가 (운동량↑) |\n| 굴뚝 직경(d) | 클수록 증가 |\n| **풍속(u)** | **클수록 감소** (Δh ∝ 1/u) |\n| 대기안정도 | 안정할수록 감소(부력 억제) |\n\n## Ⅳ. 연기상승고(Δh) 산정식\n\n### 1. Briggs 식 (가장 널리 사용, US EPA 표준)\n\n**(1) 불안정·중립 조건 (F ≥ 55 m⁴/s³)**\n- 최종상승고: **Δh = 38.71 · F^(3/5) / u**\n- 천이거리: xf = 119 F^(2/5)\n\n**(2) 불안정·중립 (F < 55)**\n- **Δh = 21.425 · F^(3/4) / u**\n- xf = 49 F^(5/8)\n\n**(3) 안정 조건**\n- **Δh = 2.6 · (F / (u·S))^(1/3)**\n- 여기서 안정도 매개변수 **S = (g/Ta)·(∂θ/∂z)**\n\n**(4) 무풍(u→0) 안정 조건**\n- Δh = 5.0 · F^(1/4) · S^(-3/8)\n\n### 2. Holland 식 (간이식)\n**Δh = (Vs·d/u) · [1.5 + 2.68×10⁻³ · P · d · (Ts - Ta)/Ts]**\n- P: 대기압(mb). 중립 기준이며 불안정 시 ×1.1~1.2, 안정 시 ×0.8~0.9 보정\n\n### 3. CONCAWE 식\n**Δh = 2.71 · Qh^0.5 / u^0.75**  (Qh: 배출열량 kcal/s)\n- 유럽 정유업계 실측 기반. 부력 지배 조건에 적합\n\n### 4. 적용 시 유의\n- 국내 환경영향평가에서는 AERMOD 내장 **Briggs 식**이 표준\n- 식마다 결과 편차가 크므로 사용 식과 근거를 반드시 명시\n\n## Ⅴ. 굴뚝 설계 시 고려사항\n\n### 1. 높이 결정\n| 항목 | 내용 |\n|---|---|\n| **법정 최소높이** | 「대기환경보전법 시행규칙」 배출시설별 규정, 지자체 조례 |\n| **확산 요구높이** | 예측 착지농도 ≤ 환경기준·목표농도가 되는 높이 |\n| **Building Down Wash 회피** | **Hs ≥ H + 1.5L** (GEP: H=인접건물 높이, L=건물 높이·투영폭 중 작은 값) |\n| **역전층 상단 초과** | Lofting 유도, Fumigation 회피 |\n| **항공법** | 공항 주변 장애물 제한표면, 60m 초과 시 항공장애표시등·주간표지 |\n\n### 2. 토출속도 설계\n- **Vs ≥ 1.5 u** (Stack Down Wash 방지). 통상 **15~20 m/s** 설계\n- 과도한 Vs는 송풍동력 증가 → 최적화 필요\n- **빗물받이 갓(rain cap) 설치 금지** — 하향 토출로 down wash 유발. 대신 배수구·경사 처리\n\n### 3. 구조·재질\n- **재질**: 강판(내후성강), 콘크리트, FRP. 부식성 가스는 내산 라이닝(고무·불소수지·내산벽돌)\n- **부식·응축 방지**: 배출가스 온도를 **산노점(acid dew point) 이상**으로 유지(통상 SO₃ 함유 시 130~150℃ 이상), 보온·재가열\n- **구조 안정성**: 풍하중·지진하중, 와류진동(vortex shedding) 검토 → 나선형 스트레이크(helical strake) 설치\n- **연돌효과(Stack Effect)**: 통풍력 확보를 위한 단면·높이 설계\n\n### 4. 부대설비 및 법정 요구사항\n- **측정공(Sampling port)**: 「대기오염공정시험기준」에 따라 **굴뚝 내경의 8배 이상 하류, 2배 이상 상류** 직관부에 설치(수직 굴뚝 기준). 작업대·안전난간·사다리·전원 확보\n- **TMS 설치**: 배출량 기준 해당 시 굴뚝자동측정기기 부착\n- **다중관 굴뚝(multi-flue)**: 여러 배출시설을 하나의 외통에 묶어 부지 절약 및 부력 증대\n\n## Ⅵ. 결론\n\n유효굴뚝높이는 실제 높이에 운동량·부력에 의한 연기상승고를 더한 값으로, 최대착지농도가 He²에 반비례하므로 대기질 영향 저감에 결정적이다. 다만 굴뚝높이 상향은 **국지 농도를 희석할 뿐 총 배출량을 줄이지 않으며 장거리 이송을 오히려 증가**시키므로, 방지시설에 의한 **배출량 저감이 우선**되고 굴뚝 설계는 보완적 수단으로 접근하여야 한다. 설계 시에는 Down Wash 회피(GEP, Vs ≥ 1.5u), 역전층 고도, 산노점 이상의 온도 유지, 측정공 기준 등을 종합적으로 반영하여야 한다.\n","side":[{"title":"굴뚝 측정공(Sampling Port) 설치기준","body":"### 근거\n「대기오염공정시험기준」 ES 01301 배출가스 시료채취방법\n\n### 위치 선정 원칙\n**\"가장 균일한 유속분포를 나타내는 곳\"**\n- **굴뚝 내경(D)의 8배 이상 하류(직관부)**, **2배 이상 상류**\n- 즉, 굴곡부·단면변화부에서 충분히 떨어진 직관 구간\n- 부득이한 경우 **하류 2D, 상류 0.5D 이상** 확보하고 측정점 수를 늘림\n\n### 측정점 수 (원형 굴뚝)\n| 굴뚝 직경 | 반경 구분 수 | 측정점 수 |\n|---|---|---|\n| 1m 이하 | 1 | 4 |\n| 1~2m | 2 | 8 |\n| 2~4m | 3 | 12 |\n| 4~4.5m | 4 | 16 |\n| 4.5m 초과 | 5 | 20 |\n\n### 사각 굴뚝\n단면을 등면적으로 분할(통상 1구역 ≤ 1m²)하여 각 구역 중심에서 측정. 최대 20점.\n\n### 부대 요구사항\n- 측정공 내경 **100mm 이상** 권장, 마개 설치\n- 안전한 **작업대(폭 80cm 이상)**·안전난간(높이 1.1m 이상)·사다리\n- 전원(220V) 및 조명 확보\n- 굴뚝 상부에서 측정공까지 접근로 확보\n\n### 유의사항\n와류·역류가 있는 지점, 누기(air in-leakage)가 있는 지점을 피하고, 예비측정으로 유속분포를 확인한다.\n"},{"title":"GEP 굴뚝높이(Good Engineering Practice)","body":"### 개념\n인접 건물에 의한 **Building Down Wash를 회피**하기 위해 필요한 최소 굴뚝높이. US EPA가 규정하고 국내 확산모델링에서도 준용.\n\n### 산정식\n**HGEP = H + 1.5 L**\n- **H**: 인접 건물(구조물) 높이\n- **L**: 건물의 **높이(H)와 최대 투영폭(W)** 중 **작은 값**\n\n### 적용 범위\n- 굴뚝으로부터 **5L 이내**에 있는 건물이 대상\n- 미국 EPA는 규제 목적상 **GEP 최대 인정높이를 65m**로 제한 (그 이상은 \"희석에 의한 회피\"로 간주하여 확산모델에서 인정하지 않음)\n\n### 계산 예\n건물 높이 H = 30m, 투영폭 W = 50m\n→ L = min(30, 50) = 30m\n→ HGEP = 30 + 1.5×30 = **75m**\n\n### 실무 적용\n1. 굴뚝높이 Hs < HGEP 이면 확산모델에 **Building Down Wash 알고리즘(PRIME)** 적용 필수\n2. AERMOD는 **BPIP-PRIME** 전처리기로 건물 제원을 입력\n3. 신규 설계 시 가능한 한 Hs ≥ HGEP 확보\n4. 확보 불가 시: 건물 재배치, 굴뚝 위치 변경, 토출속도 증대, 방지시설 강화로 배출농도 저감\n\n### 유의\nGEP는 \"이 이상 높이면 규제상 인정 안 함\"이라는 **상한 개념**이기도 하다. 즉 배출량 저감 없이 굴뚝만 높이는 것을 방지하는 제도적 장치이다.\n"},{"title":"연돌효과(Stack Effect)와 통풍력","body":"### 정의\n굴뚝 내부의 고온가스와 외부 대기의 **밀도차**에 의해 발생하는 자연 상승력(자연통풍력).\n\n### 통풍력 산정식\n**Z = 273 · H · (γa/(273+ta) - γg/(273+tg))**  [mmH₂O]\n\n- H: 굴뚝높이(m)\n- γa, γg: 표준상태 공기·배출가스 비중량(kgf/m³, 통상 1.293)\n- ta, tg: 외기·배출가스 온도(℃)\n\n간이식(γa ≈ γg ≈ 1.293):\n**Z ≈ 355 · H · (1/(273+ta) - 1/(273+tg))**\n\n### 영향 인자\n| 인자 | 통풍력 |\n|---|---|\n| 굴뚝높이 ↑ | 증가(비례) |\n| 배출가스 온도 ↑ | 증가 |\n| 외기온도 ↓ (겨울) | 증가 |\n| 굴뚝 내 마찰·굴곡 | 감소 |\n\n### 통풍의 종류\n1. **자연통풍**: 연돌효과만 이용. 동력 불필요, 조절 곤란\n2. **강제통풍(압입)**: 송풍기로 연소용 공기 압입. 노 내 정압\n3. **흡인통풍(유인)**: 굴뚝 앞 유인송풍기로 흡인. 노 내 부압 → 누출 방지\n4. **평형통풍**: 압입 + 흡인 병용. 대형 보일러 표준\n\n### 대기환경 의의\n- 통풍력 부족 → 불완전연소, 배출가스 역류, 실내 오염\n- **116회 기출**: \"굴뚝의 통풍력 및 산정방법\"\n- 방지시설(집진기·탈황탑) 설치 시 압력손실이 커져 자연통풍만으로는 부족 → 유인송풍기 필수\n"}]},"13":{"day":13,"date":"2026-08-13","title":"굴뚝 통풍력과 백연현상 대책","keywords":[{"k":"통풍력(Draft)","subs":["Z=273H(γa/(273+ta) - γg/(273+tg))","밀도차에 의한 자연 상승력","높이·온도차에 비례"]},{"k":"통풍방식","subs":["자연통풍 / 강제(압입)통풍","흡인(유인)통풍: 노내 부압","평형통풍: 대형 보일러 표준"]},{"k":"백연(White Plume) 발생기구","subs":["배출가스 수증기의 응축","혼합선이 포화곡선 상부 통과","습식 방지시설·저온 배출 시"]},{"k":"백연 방지대책","subs":["재가열(Reheating)","혼합희석(고온 공기 혼합)","응축·제습 후 배출"]},{"k":"청연·황연 등","subs":["청연: 미연탄화수소·유황","황연: NO₂ 과다","흑연: 매연(불완전연소)"]}],"answer":"# 굴뚝 통풍력과 백연현상 대책\n\n## Ⅰ. 개요\n\n**통풍력(Draft)**은 연소용 공기의 공급과 배출가스의 배출을 위해 필요한 압력차로, 굴뚝 내 고온가스와 외기의 밀도차에 의한 **연돌효과(Stack Effect)**가 기본이 된다. 한편 습식 방지시설이나 저온 배출 조건에서는 배출가스 중 수증기가 대기 중에서 응축하여 **백연(White Plume)**을 형성하는데, 이는 오염물질이 아님에도 시각적 불쾌감과 민원을 유발하고 시정장애·착빙 등 2차 문제를 일으켜 별도의 대책이 요구된다.\n\n## Ⅱ. 굴뚝 통풍력\n\n### 1. 원리\n굴뚝 내 고온 배출가스는 밀도가 작아 부력을 받아 상승하며, 이때 굴뚝 하부에 부압이 형성되어 연소용 공기를 흡입하는 힘이 생긴다.\n\n### 2. 산정식\n**Z = 273 · H · [ γa/(273 + ta) − γg/(273 + tg) ]**  [mmH₂O]\n- H: 굴뚝높이(m)\n- γa, γg: 표준상태 공기·배출가스 비중량(kgf/m³, 통상 1.293)\n- ta, tg: 외기온도·배출가스 온도(℃)\n\nγa ≈ γg ≈ 1.293 인 경우 간이식\n\n**Z ≈ 355 · H · [ 1/(273+ta) − 1/(273+tg) ]**\n\n### 3. 영향 인자\n\n| 인자 | 통풍력 변화 | 비고 |\n|---|---|---|\n| 굴뚝높이(H) ↑ | **증가(비례)** | 가장 직접적 |\n| 배출가스 온도(tg) ↑ | 증가 | 단, 열손실 증가 |\n| 외기온도(ta) ↓ | 증가 | 겨울철 통풍력 양호 |\n| 굴뚝 내 마찰·굴곡 | 감소 | 실통풍력 = 이론값의 80% 내외 |\n| 배출가스 밀도 ↑ | 감소 | |\n\n### 4. 통풍방식\n\n| 방식 | 원리 | 노 내 압력 | 특징 |\n|---|---|---|---|\n| **자연통풍** | 연돌효과만 이용 | 부압 | 동력 불필요, 조절 곤란, 소형에 적용 |\n| **강제(압입)통풍** | 송풍기로 연소용 공기 압입 | **정압** | 고온 공기 예열 가능, 노 밖으로 가스 누출 우려 |\n| **흡인(유인)통풍** | 굴뚝 앞 유인송풍기로 흡인 | **부압** | 누출 방지, 고온가스 통과로 송풍기 내식·내열 필요 |\n| **평형통풍** | 압입 + 흡인 병용 | 미세 부압 | 대형 보일러 표준, 정밀 제어 가능 |\n\n### 5. 방지시설과 통풍\n집진기·탈황탑·SCR 등 방지시설의 **압력손실(수백 mmH₂O)**이 통풍력을 크게 초과하므로, 실무에서는 자연통풍만으로 불가능하고 **유인송풍기(IDF)**가 반드시 필요하다.\n\n## Ⅲ. 백연현상(White Plume)\n\n### 1. 정의\n굴뚝에서 배출된 고온·다습한 배출가스가 찬 대기와 혼합·냉각되면서 **수증기가 응축하여 미세 물방울(안개)을 형성**해 흰 연기처럼 보이는 현상. 오염물질이 아니라 **수증기의 상변화**이다.\n\n### 2. 발생 기구 — 습공기선도(Psychrometric Chart) 해석\n- 배출가스 상태점(고온·고습)과 외기 상태점(저온·저습)을 잇는 **혼합선(mixing line)**을 그림\n- 이 혼합선이 **포화곡선(RH=100%)의 상부를 통과**하면 → 과포화 → **응축(백연 발생)**\n- 혼합선이 포화곡선 아래로만 지나면 → 백연 없음\n- 겨울철·야간에 외기온도가 낮고 습도가 높을수록 발생 용이\n\n### 3. 발생 조건\n- **습식 방지시설**(습식 세정기, 습식 EP, 습식 탈황(FGD), 냉각탑) 후단\n- 배출가스 온도가 낮고 수분함량이 높은 경우\n- 외기온도가 낮고(겨울) 상대습도가 높은 경우\n\n### 4. 문제점\n1. **시각적 민원** — 오염물질로 오인\n2. **시정장애**: 인근 도로 가시거리 저하 → 교통안전 위험\n3. **착빙(icing)**: 겨울철 지표·도로·구조물 결빙\n4. **낙수·부식**: 응축수 낙하로 인근 시설·농작물 피해\n5. **산성 응축수**: SO₃ 함유 시 산성 미스트 형성\n\n## Ⅳ. 백연 방지대책\n\n### 1. 재가열법(Reheating) — 가장 일반적\n배출가스를 산노점 및 포화점 이상으로 **재가열**하여 상대습도를 낮춤\n- **GGH(Gas-Gas Heater, 회전식 열교환기)**: 탈황탑 입구 고온가스의 열을 출구 저온가스로 전달 (Ljungström형)\n- **직접 재가열(버너)**: 별도 연료 사용 → 에너지비·CO₂ 증가\n- **스팀 열교환기**: 공정 폐열 활용\n- 통상 배출온도를 **80~90℃ 이상**으로 상승\n\n### 2. 혼합희석법(Mixing)\n고온·저습의 외기 또는 공정 폐열 공기를 배출가스에 혼합하여 혼합선이 포화곡선 아래를 지나도록 조정\n- 설비 간단, 그러나 **배출가스량 증가** → 굴뚝·송풍기 용량 증대\n\n### 3. 응축·제습법(Condensing)\n배출 전 냉각하여 수증기를 **미리 응축·제거**한 후 배출\n- 응축열 회수 가능(**백연저감형 열회수 시스템**)\n- 응축수 처리(수처리) 필요\n- 최근 에너지 회수와 결합한 방식으로 확대\n\n### 4. 근본적 방법\n- **건식/반건식 방지시설로 전환** (Semi-dry Reactor, 건식 EP, 백필터)\n- 수분 발생원 자체 억제\n\n### 5. 대책 비교\n\n| 방법 | 장점 | 단점 |\n|---|---|---|\n| 재가열(GGH) | 확실, 검증됨 | 설비비·차압 증가, 부식·누설 |\n| 재가열(버너) | 즉시 효과 | 연료비·CO₂·NOx 증가 |\n| 혼합희석 | 단순, 저비용 | 가스량 증가, 굴뚝 용량 증대 |\n| 응축·제습 | 열회수 가능, 오염물 동시 제거 | 초기 투자비 큼, 폐수 발생 |\n| 건식 전환 | 근본 해결 | 공정 변경, 처리효율 재검토 |\n\n## Ⅴ. 기타 착색연기\n\n| 종류 | 색 | 원인 |\n|---|---|---|\n| **백연** | 흰색 | 수증기 응축(무해) |\n| **흑연(매연)** | 검정 | 불완전연소에 의한 그을음(C) |\n| **청연** | 푸른빛 | 미연 탄화수소·황화합물의 미세 액적 |\n| **황연** | 황갈색 | **NO₂** 과다(NO₂는 적갈색), 소각·질산 공정 |\n| **적연** | 붉은색 | 산화철 미분(제철·소결) |\n\n## Ⅵ. 결론\n\n통풍력은 굴뚝높이와 배출가스-외기 온도차에 비례하나, 방지시설의 압력손실이 크므로 실무에서는 평형통풍 방식이 표준이다. 백연은 오염물질이 아닌 수증기 응축현상이지만 민원·시정장애·착빙 등 실질적 문제를 야기하므로, **재가열(GGH)·혼합희석·응축제습** 중 배출조건과 경제성을 고려해 선정하여야 한다. 특히 최근에는 백연 저감과 **폐열회수·용수 재이용**을 결합한 응축식 시스템이 탄소중립 측면에서도 유리하여 확대 적용되고 있다.\n","side":[{"title":"습공기선도(Psychrometric Chart)를 이용한 백연 판정","body":"### 선도의 구성\n- **가로축**: 건구온도(DBT, ℃)\n- **세로축**: 절대습도(kg/kg-DA)\n- **곡선**: 상대습도(RH) 곡선, 최상단이 **포화곡선(RH=100%)**\n- 사선: 습구온도, 엔탈피, 비체적\n\n### 백연 판정 절차\n1. **배출가스 상태점 A** 표시 (온도 tg, 절대습도 xg)\n2. **외기 상태점 B** 표시 (온도 ta, 절대습도 xa)\n3. A와 B를 **직선(혼합선)**으로 연결\n4. **판정**\n   - 혼합선이 **포화곡선을 넘어감** → 과포화 → **백연 발생**\n   - 혼합선이 포화곡선 아래에 머묾 → 백연 없음\n\n### 대책의 도해적 의미\n| 대책 | 선도상 변화 |\n|---|---|\n| **재가열** | A점을 오른쪽(고온)으로 이동 → 혼합선이 아래로 내려감 |\n| **혼합희석** | 고온·저습 공기와 먼저 혼합 → A점 이동 후 재작도 |\n| **응축·제습** | A점을 아래(저습)로 이동 |\n\n### 실무 활용\n- 연중 외기조건(특히 **최저 외기온도·고습도 시**)을 기준으로 최악 조건 검토\n- 필요 재가열 온도를 정량 산정하여 GGH 용량 결정\n- 백연 발생일수 예측 → 민원 대응 근거자료\n\n### 백연 발생 판정의 실무 절차\n1. 배출가스 조건 확보: 온도 tg, 수분함량(체적%), 유량\n2. **절대습도 환산**: x = 0.622 × Pw/(P − Pw)\n3. 외기 설계조건 결정 — **연중 최저기온·고습 조건**(보수적)\n4. 선도에 A(배출)·B(외기) 작도 후 혼합선 검토\n5. 포화곡선 초과 시 필요 재가열 온도 역산\n\n### 백연 저감 목표 설정\n| 수준 | 목표 |\n|---|---|\n| 완전 무백연 | 연중 100% 미발생 — 설비비 과다 |\n| **실용 수준** | 외기 0℃ 이상에서 미발생 (국내 통상) |\n| 최소 수준 | 민원 발생 시간대만 대응 |\n\n### 관련 계산 예\n배출가스 60℃·포화, 외기 0℃·RH 60% → 혼합선이 포화곡선을 크게 넘음 → 백연 발생.\n재가열로 배출온도를 90℃로 올리면 혼합선이 포화곡선 아래로 이동 → 백연 소멸.\n\n### 답안 작성 팁\n습공기선도를 **간략히 스케치**(가로 건구온도, 세로 절대습도, 포화곡선 1개)하고 A·B점과 혼합선을 표시하면 원리 이해를 명확히 보여줄 수 있다.\n"},{"title":"GGH(Gas-Gas Heater)의 구조와 문제점","body":"### 목적\n습식 탈황(FGD) 후단의 저온·포화 배출가스를 재가열하여 **백연 방지 + 부력 확보 + 부식 방지**.\n\n### 형식\n1. **회전재생식(Ljungström형)** — 가장 일반적\n   - 축열체(element)가 회전하며 고온측/저온측을 번갈아 통과\n   - 장점: 열회수율 높음(60~80%), 컴팩트\n   - **단점: 누설(leakage) 5~10%** — 미처리 가스가 처리 가스로 섞임 → SO₂ 제거효율 저하\n2. **비재생식(무누설형, MGGH)**\n   - 열매체(물·오일) 순환식 열교환기 2대\n   - 장점: **누설 없음**\n   - 단점: 설비비·부지 증가, 열매체 배관 부식\n\n### 주요 문제점과 대책\n| 문제 | 원인 | 대책 |\n|---|---|---|\n| 저온부식 | 산노점 이하 → 황산 응축 | 입구온도 상한 관리, 내산 코팅(에나멜) |\n| 폐색(clogging) | 황산암모늄((NH₄)HSO₄) 생성 | 수트블로잉, 고압수 세정, NH₃ 슬립 억제 |\n| 누설 | 씰(seal) 마모 | 씰 자동조정, 차압 관리, MGGH 채택 |\n| 차압 상승 | 폐색 누적 | 정기 세정, 차압 감시 |\n\n### 최근 동향\n탄소중립 대응으로 GGH 재가열 대신 **응축식 백연저감 + 폐열회수(열교환기 + 히트펌프)** 방식이 확대되고 있으며, 회수열은 지역난방·공정 예열에 활용된다.\n\n### GGH 열회수율과 에너지 영향\n- 회전재생식 열회수율 60~80%\n- 재가열에 필요한 열량의 상당 부분을 자체 회수하나, **압력손실(100~200 mmH₂O)**로 송풍동력이 증가\n- 직접 버너 재가열은 연료 소비로 CO₂·NOx 추가 발생 → 탄소중립 관점에서 불리\n\n### 운전관리 점검항목\n| 항목 | 주기 | 판단 기준 |\n|---|---|---|\n| 차압 | 연속 | 설계값 대비 130% 초과 시 세정 |\n| 입·출구 온도 | 연속 | 열회수율 저하 감시 |\n| 누설률 | 정기 | 트레이서 가스(SF₆) 측정 |\n| 축열체 부식·폐색 | 정기점검 | 육안·내시경 |\n\n### 대안 기술\n1. **MGGH(무누설형)**: 열매체 순환, 탈황효율 저하 없음\n2. **응축식 백연저감 + 히트펌프**: 응축열 회수하여 지역난방 공급. 용수 재이용 가능\n3. **하이브리드**: 부분 응축 + 소량 재가열로 설비·운전비 최적화\n\n최근 국내 대형 발전소·소각시설에서는 GGH 대신 **응축·열회수형**을 채택하는 사례가 증가하고 있다.\n"},{"title":"산노점(Acid Dew Point)과 저온부식","body":"### 정의\n배출가스 중 **SO₃**가 수증기와 결합해 황산(H₂SO₄) 증기를 형성하고, 이것이 응축하기 시작하는 온도.\n\n**SO₃ + H₂O → H₂SO₄(g) → (냉각) → H₂SO₄(l)**\n\n### 특징\n- 물의 이슬점(약 40~60℃)보다 **훨씬 높음**: SO₃ 농도에 따라 **90~160℃**\n- SO₃가 10ppm만 있어도 산노점이 140℃ 내외로 상승\n- SO₃는 연소 중 SO₂의 1~5%가 산화되어 생성 (과잉공기·촉매(V₂O₅)·고온에서 증가)\n\n### 저온부식(Low Temperature Corrosion)\n산노점 이하로 냉각되는 부위(공기예열기 저온단, 굴뚝 상부, 덕트)에서 황산이 응축하여 급격한 부식 발생.\n\n### 대책\n1. **온도 관리**: 배출가스 온도를 **산노점 + 10~20℃ 이상** 유지 (통상 150℃ 이상)\n2. **SO₃ 생성 억제**\n   - 저황 연료 사용, 탈황\n   - **공기비(과잉공기) 최소화** → SO₂→SO₃ 산화 억제\n   - 첨가제 주입: **MgO, Mg(OH)₂, NH₃** (SO₃ 중화)\n3. **재질**: 내산 코팅(에나멜, 불소수지), Corten강, 유리관 열교환기\n4. **설계**: 공기예열기 저온단을 교체 가능한 카세트형으로\n\n### 상충관계\n배출온도를 높이면 부식·백연은 방지되나 **열손실 증가 → 에너지효율 저하 → CO₂ 증가**. 최근에는 저온 열회수 + 내식재질 조합으로 산노점 이하 운전을 허용하는 방향으로 발전 중이다.\n"}]},"14":{"day":14,"date":"2026-08-14","title":"가우시안 플룸 확산모델","keywords":[{"k":"기본 가정","subs":["정상상태·질량보존(무반응)","농도분포 정규(Gaussian)","풍속 일정, 풍하 확산 무시"]},{"k":"기본식","subs":["C=(Q/2πuσyσz)·exp(-y²/2σy²)·exp(-(z-He)²/2σz²)","지표반사항 추가","σy,σz는 안정도·거리 함수"]},{"k":"지표농도·최대착지","subs":["σz=He/√2 에서 Cmax","Cmax≈0.234Q/(u·He²)","Cmax ∝ 1/He²"]},{"k":"혼합고 반사","subs":["σz > 1.6·zi 시 완전혼합","C = Q/(√(2π)·u·σy·zi)","다중반사항 적용"]},{"k":"적용 한계","subs":["평탄지형·근거리(<50km)","저풍속(<1m/s) 부적합","2차 생성·침적 미반영"]}],"answer":"# 가우시안 플룸 확산모델(Gaussian Plume Model)\n\n## Ⅰ. 개요\n\n**가우시안 플룸모델**은 연속적으로 배출되는 오염물질의 풍하방향 농도분포가 수평·연직으로 **정규분포(Gaussian distribution)**를 이룬다고 가정하는 정상상태 확산모델이다. 이론적 간명성과 계산 효율 덕분에 60여 년간 대기확산 예측의 표준으로 사용되어 왔으며, 국내 환경영향평가에서도 AERMOD·ISCST 등 가우시안 계열 모델이 널리 활용된다.\n\n## Ⅱ. 기본 가정\n\n1. **정상상태(Steady-state)**: 배출량 Q와 기상조건이 시간에 따라 일정\n2. **질량보존**: 화학반응·침적·분해가 없어 배출된 질량이 보존\n3. **정규분포**: y(수평)·z(연직) 방향 농도분포가 가우시안\n4. **풍속 일정**: 풍속 u가 시간·공간적으로 일정하며, 연직 평균값 사용\n5. **풍하방향 확산 무시**: 이송(advection)이 확산보다 지배적 (u가 충분히 클 때)\n6. **지표 완전반사**: 지표면에서 흡수 없이 전량 반사\n7. 연기상승(plume rise)은 별도 산정하여 He로 반영\n\n## Ⅲ. 기본식\n\n### 1. 일반식 (지표반사 포함)\n\n**C(x, y, z) = Q / (2π · u · σy · σz) × exp(−y²/2σy²) × [ exp(−(z−He)²/2σz²) + exp(−(z+He)²/2σz²) ]**\n\n- C: 농도 [g/m³ 또는 µg/m³]\n- Q: 배출률 [g/s]\n- u: 유효굴뚝높이에서의 평균풍속 [m/s]\n- σy, σz: 수평·연직 확산계수 [m] (안정도와 x의 함수)\n- He: 유효굴뚝높이 [m]\n- 우변 둘째 항이 **지표 반사(virtual source, 가상배출원)** 항\n\n### 2. 지표농도식 (z = 0)\n\n**C(x, y, 0) = Q / (π · u · σy · σz) × exp(−y²/2σy²) × exp(−He²/2σz²)**\n\n### 3. 플룸 중심선 지표농도 (y = 0, z = 0)\n\n**C(x, 0, 0) = Q / (π · u · σy · σz) × exp(−He²/2σz²)**\n\n### 4. 지표배출원(He = 0)\n\n**C = Q / (π · u · σy · σz) × exp(−y²/2σy²)**  → 지표배출은 동일 배출량에서 최고 농도\n\n## Ⅳ. 최대착지농도와 최대착지거리\n\n### 1. 유도\nC(x,0,0)를 x에 대해 미분하여 0으로 두면(σz/σy = 일정 가정)\n\n**σz(Xmax) = He / √2 ≈ 0.707 He**\n\n### 2. 최대착지농도\n\n**Cmax = 2Q / (π · e · u · He²) × (σz/σy) ≈ 0.234 · Q / (u · He²) × (σz/σy)**\n\n### 3. 시사점\n- **Cmax ∝ 1/He²** : 유효굴뚝높이 2배 → 최대농도 1/4\n- **Cmax ∝ 1/u** : 저풍속에서 최고농도\n- **Cmax ∝ Q** : 배출량에 정비례\n- **Xmax**는 불안정할수록 가깝고(수백 m), 안정할수록 멀어짐(수~수십 km)\n\n## Ⅴ. 혼합고(zi)의 처리\n\n배출가스가 상방으로 확산되다 혼합고 상단의 안정층에 도달하면 반사된다.\n\n- **σz < 0.47 zi**: 반사 없음, 기본식 적용\n- **0.47 zi ≤ σz < 1.6 zi**: **다중반사항** 적용\n  C = (Q/2πuσyσz)·exp(−y²/2σy²)·Σₙ[exp(−(z−He−2n·zi)²/2σz²) + exp(−(z+He−2n·zi)²/2σz²)]\n- **σz ≥ 1.6 zi**: 혼합층 내 **완전혼합** 가정\n  **C = Q / (√(2π) · u · σy · zi) × exp(−y²/2σy²)**\n\n## Ⅵ. 확산계수(σy, σz)\n\n- **Pasquill-Gifford 곡선** 또는 **Briggs 근사식**으로 안정도 등급(A~F)과 풍하거리 x로부터 산정\n- 도시(urban)/개활지(rural) 구분 적용\n- 예: 중립(D), 개활지 → σy = 0.08x(1+0.0001x)^(−1/2), σz = 0.06x(1+0.0015x)^(−1/2)\n\n## Ⅶ. 확장 및 응용\n\n| 조건 | 처리방법 |\n|---|---|\n| **훈증(Fumigation)** | 연직 완전혼합: C = Q/(√(2π)·u·σy·hi), hi ≈ He + 2σz |\n| **선 배출원(도로)** | 무한선원 적분: C = 2q/(√(2π)·σz·u·sinφ)·exp(−He²/2σz²), q=단위길이당 배출률 |\n| **면 배출원** | 가상거리(virtual distance)법으로 초기 σy0, σz0 부여 |\n| **장기평균농도** | 섹터평균 + 기상결합빈도(STAR) |\n| **침적·감쇠** | 지수감쇠항 exp(−λt) 또는 침적속도(Vd) 반영한 tilted plume |\n\n## Ⅷ. 적용 한계와 대안\n\n### 1. 한계\n1. **정상상태 가정** → 시간에 따라 변하는 기상·배출 반영 불가\n2. **저풍속·정온(u < 1m/s)**에서 C → ∞ 로 발산\n3. **평탄·균질 지형** 가정 → 복잡지형·해안 순환 재현 불가\n4. **근거리(수백 m ~ 50km)**에 한정. 장거리 이송 부적합\n5. **화학반응 미반영** → O₃, 2차 PM2.5 등 2차 생성물 예측 불가\n6. 건물 후류(down wash), 지형 상승효과는 별도 알고리즘 필요\n\n### 2. 대안 모델\n\n| 모델 | 특징 | 적용 |\n|---|---|---|\n| **AERMOD** | 경계층 매개변수(u\\*, w\\*, L) 기반, PRIME 건물영향 | 근거리 규제모델(권장) |\n| **CALPUFF** | 라그랑지안 퍼프, 비정상·비균질 | 장거리·복잡지형·저풍속 |\n| **CMAQ / CAMx** | 오일러리안 광화학 격자모델 | 2차 생성·광역 대기질 |\n| **CFD** | 나비에-스토크스 직접 해석 | 건물군·도시협곡 국지 |\n\n## Ⅸ. 결론\n\n가우시안 플룸모델은 명확한 물리적 가정 위에 세워진 간명한 해석해로, 최대착지농도가 유효굴뚝높이의 제곱에 반비례한다는 핵심 설계 지침을 제공한다. 다만 정상상태·평탄지형·무반응이라는 가정은 실제 대기와 괴리가 크므로, 근거리 규제 목적에는 **AERMOD**, 복잡지형·장거리에는 **CALPUFF**, 2차 오염물질에는 **CMAQ** 등을 조건에 맞게 선택·병행하여야 하며, 어떤 경우든 실측자료를 이용한 **모델 검증(Model Performance Evaluation)**이 필수적이다.\n","side":[{"title":"Fick의 확산법칙과 확산방정식","body":"### Fick의 제1법칙\n확산에 의한 물질 플럭스는 **농도경사에 비례**하고 방향은 반대이다.\n\n**J = −D · (∂C/∂x)**  [g/m²·s]\n- J: 확산 플럭스, D: 확산계수 [m²/s], ∂C/∂x: 농도경사\n\n3차원: **J = −D∇C**\n\n### Fick의 제2법칙 (연속식과 결합)\n질량보존식 ∂C/∂t = −∇·J 에 제1법칙 대입\n\n**∂C/∂t = D · ∇²C = D(∂²C/∂x² + ∂²C/∂y² + ∂²C/∂z²)**\n\n### 대기확산방정식(이송-확산식)\n분자확산 대신 **난류확산계수 K**를 사용(K-이론, gradient transport theory)하고 이송항을 추가하면\n\n**∂C/∂t + u(∂C/∂x) = ∂/∂y(Ky ∂C/∂y) + ∂/∂z(Kz ∂C/∂z) + S − R**\n\n- S: 배출항(source), R: 제거항(sink: 반응·침적)\n\n### 가우시안 해와의 관계\n정상상태(∂C/∂t=0), Ky·Kz 일정, 풍하확산 무시, 무한공간 조건에서 위 식을 풀면 **정규분포 형태의 해**가 얻어지며, 이때\n**σy² = 2Ky·x/u,  σz² = 2Kz·x/u**\n즉 가우시안 모델은 이송-확산방정식의 **해석해(analytical solution)**이다. 실제로는 K가 일정하지 않으므로 σ를 실험식(Pasquill-Gifford)으로 대체한 것이다.\n\n### K-이론(Gradient Transport Theory)의 한계\n난류 확산을 분자확산과 같은 형태(플럭스 ∝ −K∇C)로 가정하는 K-이론은\n1. **대류경계층에서 성립하지 않음** — 큰 에디가 농도경사와 무관하게 물질을 수송(역경사 수송, counter-gradient flux)\n2. 근거리(플룸이 에디보다 작을 때) 부적합\n3. K값이 위치·안정도에 따라 크게 변함\n\n→ AERMOD가 불안정 조건에서 **비대칭 이중가우시안**을 쓰는 이유이며, 대안으로 라그랑지안 입자모델·LES가 사용된다.\n\n### 통계이론(Taylor의 확산이론)\nσy² = 2 σv² T² [ t/T − 1 + exp(−t/T) ]\n- σv: 횡방향 풍속 변동 표준편차, T: 라그랑지안 시간척도\n- **단시간(t≪T)**: σy ≈ σv·t (선형 성장)\n- **장시간(t≫T)**: σy ≈ σv·√(2Tt) (√t 성장)\n\nPasquill-Gifford 곡선이 근거리에서 기울기 1, 원거리에서 0.5에 가까워지는 것이 이 이론과 부합한다.\n"},{"title":"모델 검증(Model Performance Evaluation)","body":"### 필요성\n확산모델의 예측값은 배출량·기상·확산계수의 불확실성이 누적되므로, **실측치와의 비교 검증**이 없으면 신뢰할 수 없다.\n\n### 주요 통계지표\n| 지표 | 식 | 이상값 |\n|---|---|---|\n| **FB**(Fractional Bias) | 2(C̄o − C̄p)/(C̄o + C̄p) | 0 (\\|FB\\| < 0.3 양호) |\n| **NMSE**(정규화 평균제곱오차) | (Co−Cp)²̄ / (C̄o·C̄p) | 0 (< 1.5 양호) |\n| **FAC2** | 0.5 ≤ Cp/Co ≤ 2 인 비율 | 1 (> 0.5 양호) |\n| **R**(상관계수) | — | 1 |\n| **MG / VG** | 기하평균편차·기하분산 | 1 |\n\n(Co: 관측값, Cp: 예측값)\n\n### 검증 절차\n1. 대상지역 측정망 자료 확보(1년 이상 권장)\n2. 동일 기간 모델 수행\n3. 시간별·일별·연평균 단위로 짝지어 비교\n4. 통계지표 산정 및 **Q-Q plot**, 산점도 작성\n5. 편차 원인 분석(배출인벤토리, 기상장, 배경농도)\n6. 필요 시 보정계수 적용 및 근거 명시\n\n### 실무 유의\n- 대기 확산모델은 개별 시간의 농도 재현보다 **상위 백분위 농도(예: 98 백분위)**의 재현성이 중요\n- 환경영향평가 시 모델 선정 근거·입력자료 출처·검증 결과를 반드시 기술\n\n### 규제 목적의 평가 관점\n규제모델 평가는 개별 시각의 농도 일치가 아니라 **분포의 상단(설계농도) 재현**을 본다.\n- **Q-Q plot**: 관측·예측 농도를 각각 크기순 정렬해 대응시킴 (시각 일치 불필요)\n- **RHC**(Robust Highest Concentration): 상위 농도의 안정적 추정치\n- 목표: 예측 RHC가 관측 RHC의 **0.5~2배** 범위\n\n### 불확실성의 주요 원인\n| 원인 | 기여 |\n|---|---|\n| 배출량(인벤토리) | 최대 — CAPSS 불확실성 |\n| 기상장 | 큼 — 특히 저풍속·복잡지형 |\n| 확산계수 | 중간 |\n| 배경농도 산정 | 중간 |\n| 화학변환·침적 | 2차 물질에서 큼 |\n\n### 실무 원칙\n1. 검증 결과가 나쁘면 **모델을 바꾸기 전에 입력자료부터 점검**\n2. 임의의 보정계수 적용은 지양하되, 불가피하면 근거를 명시\n3. 검증 불가(측정망 없음) 시에는 **보수적 가정**을 적용하고 그 사실을 기술\n4. 민감도 분석(배출량 ±20%, 풍속 ±1m/s)으로 결과의 강건성 제시\n"},{"title":"환경영향평가 권장 대기확산모델","body":"### 국내 체계\n「환경영향평가서등 작성 등에 관한 규정」 및 환경부 **대기질 모델링 지침**에 따라 사업 특성별로 모델을 선정한다.\n\n### 주요 권장모델\n| 모델 | 유형 | 적용 조건 |\n|---|---|---|\n| **AERMOD** | 정상 가우시안 플룸 | 평탄~완만 지형, 50km 이내, 점·면·선 배출원. **기본 권장** |\n| **ISCST3** | 가우시안 플룸(구형) | 간이 스크리닝 (현재는 AERMOD로 대체) |\n| **CALPUFF** | 라그랑지안 퍼프 | 복잡지형, 해안, 저풍속, 50km 초과 장거리 |\n| **CMAQ / CAMx** | 오일러리안 광화학 | 2차 생성(O₃·PM2.5), 광역 정책평가 |\n| **CFD** | 전산유체역학 | 건물·터널·도시협곡 국지 유동 |\n| **ADMS** | 가우시안(경계층 기반) | 유럽계 대안 |\n\n### 미국 EPA SCRAM\n**Support Center for Regulatory Atmospheric Modeling** — EPA가 규제용 대기질 모델과 관련 자료(모델 코드, 전처리기, 기상자료, 가이드라인)를 제공하는 공식 창구.\n- **Preferred/Recommended models**: AERMOD, CALPUFF(장거리), CMAQ 등\n- **117회 기출**: \"우리나라 환경영향평가 권장모델과 미국 EPA의 SCRAM\"\n\n### 선정 시 검토사항\n1. 지형 복잡도, 대상 거리, 배출원 형태\n2. 대상 물질(1차/2차)\n3. 기상자료 가용성(지상·상층)\n4. 예측 기간(단기 최대 vs 장기 평균)\n5. 모델 검증 가능성\n\n### 모델 선정 절차 (환경영향평가)\n1. 사업 유형·배출원 형태 파악 (점/면/선, 고가/지표)\n2. 대상지 지형복잡도·정온율 검토\n3. 평가 거리와 대상물질(1차/2차) 확정\n4. 후보 모델 비교표 작성 후 선정사유 기술\n5. 입력자료 출처·기간 명시\n6. 가능 시 **2개 모델 병행** 및 결과 비교\n7. 측정망 자료로 검증, 통계지표 제시\n\n### 예측 결과의 제시 요건\n| 항목 | 제시 방법 |\n|---|---|\n| 최대영향예상지점 | 위치·거리·농도 |\n| 예측농도 | 1시간·24시간·연평균 |\n| 배경농도 | 인근 측정망 실측치 |\n| **총 농도** | 예측 + 배경 → **환경기준과 비교** |\n| 등농도선도 | GIS 중첩(주거지·보호시설 표시) |\n\n### 유의사항\n- 배경농도를 누락하고 기여농도만 기준과 비교하는 것은 **중대한 오류**\n- 저감방안 적용 전·후를 각각 제시\n- 2차 생성물질(PM2.5·O₃)은 가우시안 모델로 평가 불가 → CMAQ 등 광화학 모델 또는 정성적 평가로 대체하고 그 한계를 명시\n"}]},"15":{"day":15,"date":"2026-08-15","title":"확산모델의 종류와 선정기준","keywords":[{"k":"해석 방식별 분류","subs":["가우시안 플룸(정상·해석해)","퍼프(라그랑지안·비정상)","격자(오일러리안·광화학)"]},{"k":"용도별 분류","subs":["스크리닝 / 정밀(refined)","규제용 / 연구용","단기 최대 / 장기 평균"]},{"k":"주요 규제모델","subs":["AERMOD(근거리 평탄지형)","CALPUFF(장거리·복잡지형)","CMAQ·CAMx(2차 생성)"]},{"k":"선정 기준 5요소","subs":["지형복잡도·평가거리","배출원 형태(점/선/면)","대상물질(1차/2차), 기상자료 가용성"]},{"k":"국내 적용 근거","subs":["환경영향평가 대기질 모델링 지침","US EPA SCRAM 권장모델","모델 검증(MPE) 필수"]}],"answer":"# 확산모델의 종류와 선정기준\n\n## Ⅰ. 개요\n\n**대기확산모델**은 배출원의 배출량과 기상조건으로부터 풍하지역의 오염물질 농도를 정량적으로 예측하는 수학적 도구이다. 환경영향평가·통합환경허가·총량관리·사고영향 예측 등 대기환경 관리의 거의 모든 의사결정에 사용되므로, **대상 문제의 특성에 맞는 모델을 선정하고 그 근거를 명시**하는 것이 무엇보다 중요하다.\n\n## Ⅱ. 해석 방식에 따른 분류\n\n### 1. 가우시안 모델(Gaussian Plume Model)\n- **원리**: 정상상태 가정하에 이송-확산방정식의 해석해를 이용. 농도분포가 y·z 방향 정규분포\n- **대표모델**: AERMOD, ISCST3, ADMS\n- **장점**: 계산 신속, 입력자료 단순, 검증 이력 풍부\n- **한계**: 평탄지형·정상상태·무반응 가정. 저풍속 발산\n\n### 2. 퍼프 모델(Puff Model, 라그랑지안)\n- **원리**: 배출가스를 일련의 퍼프(덩어리)로 나누어 각 퍼프를 기상장을 따라 이동시키며 성장시킴\n- **대표모델**: CALPUFF, SCIPUFF\n- **장점**: **비정상·비균질** 기상 반영, 정온 조건 처리 가능, 장거리 이송·화학변환 포함\n- **한계**: 입력자료·계산량 과다, 진단 기상장 불확실성\n\n### 3. 격자 모델(Grid Model, 오일러리안)\n- **원리**: 공간을 3차원 격자로 나누고 각 격자에서 질량보존식을 수치해석\n- **대표모델**: CMAQ, CAMx, WRF-Chem\n- **장점**: **광화학 반응·2차 생성(O₃, PM2.5) 모의 가능**, 광역 정책평가\n- **한계**: 격자 해상도 한계로 국지 고농도 재현 곤란, 배출인벤토리 불확실성\n\n### 4. 수용모델(Receptor Model)\n- **원리**: 수용지점의 성분 측정치로부터 **역으로 배출원 기여도를 추정**\n- **대표모델**: CMB, PMF, PCA/MLR\n- **특징**: 배출량 자료 없이도 기여도 산정 가능. 확산모델과 상호 검증\n\n### 5. 전산유체역학(CFD)\n- **원리**: 나비에-스토크스 방정식 직접 수치해석\n- **적용**: 건물군·도시협곡·터널·복잡 구조물 주변 국지 유동\n- **한계**: 계산비용 극대, 광역 적용 불가\n\n### 6. 물리모델(풍동실험)\n축소모형을 풍동에 넣어 유동·확산을 실측. 건물 down wash, 복잡지형 검증에 사용하며 수치모델의 검증자료로 활용.\n\n## Ⅲ. 용도에 따른 분류\n\n| 구분 | 특징 | 예 |\n|---|---|---|\n| **스크리닝(Screening)** | 최악조건 가정, 보수적 결과, 간단 | AERSCREEN, SCREEN3 |\n| **정밀(Refined)** | 실제 기상자료 1년 이상 사용 | AERMOD, CALPUFF |\n| **규제용(Regulatory)** | 기관이 승인한 표준모델 | AERMOD, CALPUFF |\n| **연구용** | 최신 기법, 검증 진행 중 | LES, WRF-Chem |\n\n스크리닝에서 기준을 만족하면 정밀 모델링을 생략할 수 있어 단계적 접근(tiered approach)이 효율적이다.\n\n## Ⅳ. 모델 선정 기준\n\n### 1. 5대 선정 요소\n\n| 요소 | 판단 내용 | 모델 선택 |\n|---|---|---|\n| **지형 복잡도** | 평탄 / 완만 / 복잡(산지·해안) | 평탄 → AERMOD, 복잡 → CALPUFF·CFD |\n| **평가 거리** | 50km 이내 / 초과 | 근거리 → AERMOD, 장거리 → CALPUFF·CMAQ |\n| **배출원 형태** | 점·선·면·체적, 고가·지표 | 도로 → 선원모델(CALINE, AERMOD) |\n| **대상 물질** | 1차(먼지·SO₂) / **2차(O₃·PM2.5)** | 2차 → **반드시 광화학 격자모델** |\n| **기상자료** | 지상만 / 상층 포함 / 정온율 | 정온율 20%↑ → CALPUFF |\n\n### 2. 추가 고려사항\n- **건물 영향**: 굴뚝높이 < GEP이면 Down Wash 알고리즘(PRIME) 필수\n- **평가 기간**: 1시간 최대 vs 연평균 → 기상자료 기간 결정\n- **화학변환·침적**: SO₂→SO₄²⁻ 등 변환이 중요하면 CALPUFF·CMAQ\n- **검증 가능성**: 인근 측정망 유무\n\n### 3. 국내 제도적 근거\n환경부 **대기질 모델링 지침** 및 「환경영향평가서등 작성 등에 관한 규정」에 따라 사업 특성에 맞는 모델을 선정하고, **선정 사유·입력자료 출처·검증 결과**를 평가서에 명시하여야 한다. 미국 EPA는 **SCRAM**(Support Center for Regulatory Atmospheric Modeling)을 통해 권장모델과 가이드라인을 제공하며 국내에서도 준용한다.\n\n## Ⅴ. 모델 적용 절차\n\n1. **문제 정의**: 대상물질·평가항목·평가기간 확정\n2. **모델 선정** 및 근거 기술\n3. **입력자료 구축**: 배출량(제원·배출률), 기상(1년 이상), 지형(DEM), 건물, 수용점 격자\n4. **모델 수행**: 기본·최악 시나리오\n5. **결과 정리**: 최대영향예상지점, 등농도선도, 시간·일·연평균\n6. **배경농도 합산** 후 환경기준과 비교\n7. **모델 검증(MPE)**: FB, NMSE, FAC2 등 통계지표\n8. **저감방안 반영 후 재수행**\n\n## Ⅵ. 결론\n\n확산모델은 가우시안·퍼프·격자·수용·CFD로 대별되며, 어느 하나가 항상 우수한 것이 아니라 **지형·거리·배출원 형태·대상물질·기상자료**의 조건에 따라 적합한 모델이 달라진다. 특히 2차 생성물질인 오존과 초미세먼지는 가우시안 모델로 평가할 수 없으므로 광화학 격자모델을 적용하거나 그 한계를 명시하여야 한다. 향후 국내 지형·기상 특성에 맞는 모델 검증 데이터베이스 구축과 고해상도 배출인벤토리 개선이 예측 신뢰도 향상의 핵심 과제이다.\n","side":[{"title":"스크리닝 모델과 단계적 접근(Tiered Approach)","body":"### 개념\n모든 사업에 정밀 모델링을 요구하면 비용·시간이 과다하므로, **보수적인 간이 평가로 먼저 걸러내는** 단계적 접근을 사용한다.\n\n### 단계 구성\n| 단계 | 방법 | 판정 |\n|---|---|---|\n| **Tier 1** | 스크리닝 모델(AERSCREEN 등), 최악 기상 가정 | 기준 만족 시 **종료** |\n| **Tier 2** | 정밀 모델(AERMOD), 실제 1년 기상 | 기준 만족 시 종료 |\n| **Tier 3** | CALPUFF·CMAQ, 현장 관측 병행 | 상세 평가 |\n\n### 스크리닝 모델의 특징\n- **최악 조건 자동 탐색**: 모든 안정도 등급 × 풍속 조합을 계산해 최대 농도 산출\n- 풍향을 고려하지 않고 항상 수용점 방향으로 분다고 가정\n- 결과는 실제보다 **2~10배 과대평가** → 안전측\n\n### 실무적 의의\n1. 소규모 사업의 행정 부담 경감\n2. Tier 1에서 초과하면 그때 정밀 평가 → 자원 효율\n3. 단, 스크리닝 결과 초과를 곧바로 \"환경기준 초과\"로 해석하면 안 됨. 보수성 정도를 함께 설명해야 함\n\n### 유의사항\n스크리닝은 **단일 배출원·평탄지형**을 전제하므로, 다수 배출원이 밀집하거나 복잡지형이면 처음부터 정밀 모델을 적용해야 한다.\n\n### 국내 스크리닝 관행\n환경영향평가 실무에서는 별도 스크리닝 모델 대신, **AERMOD를 최악 기상조건(안정도 F, 풍속 1m/s 등)으로 1회 수행**하여 스크리닝을 대체하는 경우가 많다. 이때도 보수적 가정임을 명시해야 한다.\n\n### 스크리닝 결과 해석 시 주의\n| 오해 | 실제 |\n|---|---|\n| \"스크리닝 초과 = 기준 초과\" | 최악 가정이므로 실제 농도는 훨씬 낮음 |\n| \"스크리닝 만족 = 안전\" | 다수 배출원·복잡지형이면 적용 범위 밖 |\n| \"농도만 보면 됨\" | 배경농도 합산 후 비교해야 함 |\n"},{"title":"CFD를 이용한 국지 확산 해석","body":"### 개요\n**전산유체역학(Computational Fluid Dynamics)**은 유체의 지배방정식(연속·운동량·에너지·화학종 수송)을 격자에서 직접 수치해석하는 기법. 건물·구조물 주변의 복잡한 유동을 재현할 수 있다.\n\n### 난류 모델\n| 방식 | 특징 | 계산량 |\n|---|---|---|\n| **RANS**(k-ε, k-ω) | 평균장 해석, 실무 표준 | 낮음 |\n| **LES**(Large Eddy Simulation) | 큰 와동 직접 계산 | 높음 |\n| **DNS** | 모든 스케일 직접 계산 | 극대(연구용) |\n\n### 대기환경 적용 분야\n1. **도시협곡** 내 자동차 배출가스 농도분포\n2. **건물 down wash**·후류 영역 상세 해석\n3. **터널 갱구** 배출가스 확산\n4. **바람길** 설계 검토 및 열섬 해석\n5. 유해화학물질 **누출 사고** 시 고밀도 가스 거동\n6. 실내 환기 성능 평가\n\n### 장단점\n- **장점**: 건물 형상·지형을 실제 그대로 반영, 유동 구조를 시각적으로 제시\n- **단점**: 계산비용 극대(수 km 이상 불가), 경계조건·격자 의존성 큼, 검증 필수\n\n### 실무 유의\nCFD 결과는 격자·난류모델·경계조건에 따라 크게 달라지므로, **풍동실험 또는 현장 측정과의 검증**을 반드시 병행하고 격자 민감도 분석 결과를 제시해야 한다.\n\n### 격자 생성 지침(권장)\n- 건물 1개당 최소 10개 격자, 벽면 근처는 조밀화\n- 계산영역: 대상 건물 높이(H)의 **상류 5H, 하류 15H, 상방 5H**\n- 측면 blockage ratio 3% 이하\n- 격자 민감도 분석(coarse/medium/fine 3단계) 결과 제시\n\n### 검증 기준 (COST 732 / AIJ 가이드라인)\nFAC2 > 0.5, |FB| < 0.3, NMSE < 4 를 충족하면 실용적으로 수용 가능한 것으로 본다.\n"},{"title":"배출원의 형태별 모델링","body":"### 배출원 분류\n| 형태 | 정의 | 예시 | 모델 처리 |\n|---|---|---|---|\n| **점원(Point)** | 굴뚝 등 단일 지점 | 발전소, 소각로 | 기본 가우시안식 |\n| **선원(Line)** | 선형 연속 배출 | 도로, 철도, 컨베이어 | 선원 적분식 |\n| **면원(Area)** | 넓은 면적에서 배출 | 야적장, 매립장, 주차장 | 가상거리법 |\n| **체적원(Volume)** | 일정 부피에서 확산 | 건물 누출, 비산배출 | 초기 σy₀·σz₀ 부여 |\n\n### 선원 확산식(무한 선원, 바람이 도로와 각 φ)\nC = 2q / (√(2π)·σz·u·sinφ) × exp(−He²/2σz²)\n- q: 단위길이당 배출률 [g/m·s]\n- φ가 작을수록(도로와 평행한 바람) 농도 급증\n\n### 면원·체적원 처리 — 가상거리법\n실제 배출원의 크기를 반영하기 위해, 점원이 그 크기까지 확산되는 데 필요한 **가상의 풍상거리**를 설정하여 초기 확산폭 σy₀, σz₀를 부여한다.\n- σy₀ ≈ 면원 폭 / 4.3\n- σz₀ ≈ 배출 높이 / 2.15\n\n### 국내 적용\n- **도로**: 재비산먼지·자동차 배출가스 → 선원, CALINE4·AERMOD LINE 소스\n- **비산먼지 사업장**: 야적·적치장 → 면원\n- **비산배출시설**: 플랜지·밸브 누출 → 체적원 또는 면원\n- 배출계수(EPA AP-42, CAPSS)로 배출률을 산정한다.\n\n### 배출원별 배출량 산정\n| 형태 | 산정 방법 |\n|---|---|\n| 점원 | 실측(TMS·자가측정) 또는 배출계수 × 활동도 |\n| 선원 | 교통량 × 차종별 배출계수(CAPSS, MOVES) |\n| 면원 | 면적 × 단위면적 배출계수(AP-42) |\n| 체적원 | 누출부 개수 × 성분별 배출계수(LDAR) |\n\n### 다수 배출원 처리\n동일 사업장 내 여러 굴뚝은 각각 점원으로 입력하되, 인접·유사 조건이면 **다중관 굴뚝(merged plume)**으로 처리해 부력 상승 증대를 반영할 수 있다.\n"}]},"16":{"day":16,"date":"2026-08-16","title":"1단계 이론·확산·집진 회독 2회차","keywords":[{"k":"국지순환풍","subs":["해륙풍: 비열차, 전환기 정온","산곡풍: 야간 냉기호 → 분지 고농도","푄: ΔT=0.48×(H−LCL)/100"]},{"k":"도시열섬·바람길","subs":["ΔT(u-r) 3~7℃, 야간·겨울 최대","열섬순환 → Dust Dome","찬공기 생성지·이동통로·작용공간"]},{"k":"연기형태 6종","subs":["Looping·Coning·Fanning","Lofting 최저 / Fumigation 최고","Trapping 이중역전"]},{"k":"유효굴뚝높이","subs":["He=Hs+Δh, Cmax ∝ 1/He²","Briggs: Δh=38.71F^(3/5)/u","GEP: Hs ≥ H+1.5L, Vs ≥ 1.5u"]},{"k":"가우시안 모델","subs":["σz(Xmax)=He/√2","Cmax≈0.234Q/(u·He²)","정상·평탄·무반응 가정"]}],"answer":"# 1단계 회독 2회차 — Day 9~15 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n2회독의 목표는 **논리 연결 완성**이다. 1회독에서 \"안정도 → 확산\"의 뼈대를 세웠다면, 이번에는 여기에 **국지 기상(바람) → 연기형태 → 굴뚝설계 → 농도식**의 실무 사슬을 붙인다.\n\n```\n종관 기상(고기압 정체)\n   ↓\n국지순환풍(해륙풍·산곡풍·푄) + 도시열섬\n   ↓\n대기안정도 + 역전층 위치\n   ↓\n연기형태 6종 (Looping ~ Trapping)\n   ↓\n유효굴뚝높이 He = Hs + Δh\n   ↓\n가우시안 농도식 → Cmax, Xmax\n   ↓\n모델 선정(AERMOD / CALPUFF / CMAQ) → 검증\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 물의 비열 / 흙·암석 비열 | 4.18 / 0.8~1.0 kJ/kg·K | ☐ |\n| 해풍 최강 시각 / 풍속 | 오후 2~3시 / 3~7 m/s | ☐ |\n| 해풍 침투거리 / 두께 | 20~50km / 500~1,000m | ☐ |\n| 푄 기온차 | ΔT = 0.48 × (H−LCL)/100 | ☐ |\n| LCL 간이식 | 125 × (T − Td) | ☐ |\n| 열섬강도 ΔT(u-r) | 3~7℃ (야간·겨울 최대) | ☐ |\n| 인공열(서울 도심) | 20~100 W/m² | ☐ |\n| **최대착지 조건** | **σz = He/√2 ≈ 0.707He** | ☐ |\n| **최대착지농도** | **Cmax ≈ 0.234Q/(u·He²)** | ☐ |\n| GEP 굴뚝높이 | Hs ≥ H + 1.5L (L=min(H,W)) | ☐ |\n| GEP 최대 인정높이 | 65m | ☐ |\n| Stack down wash 방지 | **Vs ≥ 1.5u** (통상 15~20 m/s) | ☐ |\n| Briggs 부력플럭스 | F = g·Vs·d²(Ts−Ta)/(4Ts) | ☐ |\n| Briggs Δh (F≥55, 중립) | 38.71 F^(3/5) / u | ☐ |\n| Briggs Δh (F<55, 중립) | 21.425 F^(3/4) / u | ☐ |\n| Briggs Δh (안정) | 2.6 (F/(u·S))^(1/3) | ☐ |\n| 통풍력 Z | 273·H·[γa/(273+ta) − γg/(273+tg)] | ☐ |\n| 산노점 | 90~160℃ (SO₃ 농도 의존) | ☐ |\n| 습식 탈황 후 재가열 온도 | 80~90℃ 이상 | ☐ |\n| 혼합고 완전혼합 판정 | σz ≥ 1.6 zi | ☐ |\n| 확산모델 적용 거리 | 가우시안 50km 이내 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **He = Hs + Δh**\n2. **F = g·Vs·d²·(Ts − Ta)/(4Ts)** [m⁴/s³]\n3. **Δh = 38.71 F^(3/5)/u** (불안정·중립, F ≥ 55)\n4. **C = Q/(2π u σy σz) · exp(−y²/2σy²) · [exp(−(z−He)²/2σz²) + exp(−(z+He)²/2σz²)]**\n5. **σz(Xmax) = He/√2**, **Cmax = 2Q/(π e u He²)·(σz/σy)**\n6. **훈증**: C = Q/(√(2π)·u·σy·hi)\n7. **완전혼합**: C = Q/(√(2π)·u·σy·zi)\n8. **선원**: C = 2q/(√(2π)·σz·u·sinφ)·exp(−He²/2σz²)\n9. **통풍력** Z = 355·H·[1/(273+ta) − 1/(273+tg)]\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 해풍 vs 육풍 | 주간, 바다→육지, 강함 | 야간, 육지→바다, 약함 | 온도차 크기 |\n| 곡풍 vs 산풍 | 주간, 계곡→산정 | 야간, 산정→계곡(활강) | 가열/냉각 |\n| 푄 vs 보라 | 승온, 건조 | 승온하나 여전히 차가움 | 원래 기단 온도 |\n| Lofting vs Fumigation | 하부 역전, 지표 **최저** | 상부 역전, 지표 **최고** | 역전층-배출고 상대위치 |\n| Building vs Stack down wash | 인접 건물 후류 | 굴뚝 자체 후류 | GEP vs Vs/u |\n| 백연 vs 흑연 | 수증기 응축(무해) | 불완전연소 매연 | 오염물질 여부 |\n| 가우시안 vs 퍼프 | 정상·해석해 | 비정상·수치 | 기상 변동 반영 |\n| 분산모델 vs 수용모델 | 배출→농도(정방향) | 농도→배출원(역방향) | 계산 방향 |\n\n## Ⅴ. 기출 연계 자가점검 (소리내어 답하기)\n\n1. 도시열섬현상의 발생원인과 개선방안을 설명하시오. *(129회 25점)*\n2. 도시건설에 있어서 바람길의 역할과 설계방법을 설명하시오. *(120회 25점)*\n3. 대기오염 축적과 관련된 연기현상의 유동특수현상을 도식하고 설명하시오. *(123회 25점)*\n4. 기상안정도에 따른 굴뚝의 연기배출 모양에 관하여 설명하시오. *(123회 25점)*\n5. 유효굴뚝높이와 굴뚝설계방법에 대하여 설명하시오. *(120회 25점)*\n6. 굴뚝의 통풍력 및 산정방법을 설명하시오. *(116회 10점)*\n7. 백연현상을 기술하고 그 방지대책 3가지를 설명하시오. *(114회 25점)*\n8. Fumigation, Building Down Draught & Down Wash를 설명하시오. *(126회 10점)*\n9. 고속도로와 같은 선 배출원의 풍하지역 오염농도 평가식을 쓰고 설명하시오. *(120회 25점)*\n10. 그린커튼을 설명하시오. *(129회 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(30분)**: Ⅰ의 사슬을 그리고, 각 단계에 해당하는 식을 옆에 적는다.\n2. **수치 암기(20분)**: Ⅱ 체크리스트. 굵게 표시된 3개(σz=He/√2, Cmax식, Vs≥1.5u)는 반드시.\n3. **식 쓰기(25분)**: Ⅲ의 9개 식. 단위까지.\n4. **도해 연습(25분)**: 연기형태 6종을 기온-고도 그래프와 함께 손으로 그린다.\n5. **기출 구술(30분)**: Ⅴ의 10문항, 각 2분. 막힌 문항은 ★ 표시 후 원 학습일 재독.\n\n> **주의**: 2회독에서 수치가 안 외워져도 정상이다. 지금은 \"어디에 무엇이 있는지\"를 알면 충분하다. 암기는 3회독부터.\n","side":[{"title":"25점 논술 답안 골격 — 확산 분야 응용","body":"### 확산 분야 문제의 전형적 구조\n확산·기상 문제는 대부분 아래 4가지 유형 중 하나다.\n\n| 유형 | 예시 문제 | 답안 골격 |\n|---|---|---|\n| **현상 설명형** | 역전층의 종류와 형성과정 | 정의 → 분류 → 종류별 기작 → 영향 → 대책 |\n| **비교형** | 수용모델과 분산모델 | 각각 정의·원리 → **비교표** → 상호보완 활용 |\n| **설계형** | 유효굴뚝높이와 굴뚝설계 | 개념·식 → 영향인자 → 설계 고려사항 → 한계 |\n| **계산형** | 전기집진기 필요 집진면적 | 식 제시 → 대입 → 단위 확인 → 검산 → 의미 해석 |\n\n### 확산 문제에서 반드시 넣을 것\n1. **그림**: 기온-고도 그래프, 굴뚝-연기 형상, 농도분포 곡선\n2. **식**: 최소 1개. 기호 정의를 반드시 병기\n3. **수치**: Γd=0.98, Ri=0.25, σz=He/√2 등\n4. **기출·법령 연계**: 「대기환경보전법」, 환경영향평가 지침\n5. **결론에 한계와 개선방향**: \"가우시안 모델은 평탄지형 가정이므로 복잡지형에서는 CALPUFF 병행 필요\"\n\n### 시간 배분 (25점 = 23분)\n- 목차 구상 2분 → 개요 3분 → 본론 14분(그림 포함) → 결론 3분 → 검토 1분\n\n### 10점 용어 답안 골격 — 확산 분야\n```\n1. 정의 (2~3줄)\n2. 관련식 또는 도해  ← 확산 문제는 거의 필수\n3. 특징 3~5가지 (번호 나열)\n4. 대기환경적 의의 1~2줄\n```\n분량은 답안지 **1면(2/3~1면)**. 9분 안에 끝내고 다음으로 넘어간다.\n\n### 예시 — \"리차드슨수(Ri)\" (10점)\n1. **정의**: 열적 난류와 기계적 난류의 비를 나타내는 무차원수\n2. **식**: Ri = (g/T)(∂θ/∂z)/(∂u/∂z)²\n3. **판정**: Ri>0.25 난류소멸(안정) / 0~0.25 기계적 난류 / <−0.04 대류난류 우세\n4. **의의**: 정적안정도가 반영하지 못하는 풍속전단을 포함하여 실제 확산능력을 평가. AERMOD 등 경계층 매개변수 모델의 기초\n\n이 정도면 10점 만점 중 8~9점은 확보된다.\n"},{"title":"암기 카드 — Day 9~15 핵심 20선","body":"1. **해륙풍** 원인 = 물과 육지의 **비열차**\n2. **해풍** 오후 2~3시 최강, 3~7m/s / **육풍** 새벽, 1~3m/s\n3. **전환기 정온** → 오염물질 정체\n4. **재순환(recirculation)**: 야간 해상 → 주간 육지 재유입 → 오존 축적\n5. **산풍(활강풍)** → 계곡 **냉기호** → 분지 고농도\n6. **푄**: ΔT = (Γd−Γs)×(H−LCL)/100 = **0.48×(H−LCL)/100**\n7. **LCL** = 125(T − Td)\n8. **높새바람** = 태백산맥 넘는 동풍, 영서 고온건조\n9. **열섬강도** 3~7℃, **야간·겨울·미풍**에 최대\n10. **Dust Dome / Dust Plume**\n11. **바람길 3요소**: 찬공기 생성지 – 이동통로 – 작용공간\n12. **연기형태**: Looping/Coning/Fanning/**Lofting(최저)**/**Fumigation(최고)**/Trapping\n13. **He = Hs + Δh**, 상승 = 운동량 + **부력**\n14. **F** = g·Vs·d²(Ts−Ta)/(4Ts), **Δh ∝ 1/u**\n15. **Cmax ∝ 1/He²** → 굴뚝 2배 = 농도 1/4\n16. **σz(Xmax) = He/√2**\n17. **GEP**: Hs ≥ H + 1.5L, 최대 인정 **65m**\n18. **Stack down wash**: **Vs < 1.5u**일 때 발생 → 갓(rain cap) 금지\n19. **통풍력** ∝ 굴뚝높이 × (내외 온도차)\n20. **백연** = 수증기 응축 → **재가열(GGH)·혼합희석·응축제습**\n\n\n### 카드 활용법\n- 출퇴근길에 **번호만 보고 내용을 떠올린다**\n- 3초 안에 안 떠오르면 즉시 본문 확인\n- 주 1회 전체 훑기, 틀린 것만 ★ 표시 후 반복\n\n### 특히 자주 나오는 5개 (별 3개)\n★★★ **Cmax ∝ 1/He²** — 굴뚝 설계의 근거\n★★★ **σz(Xmax) = He/√2** — 계산문제 필수\n★★★ **연기형태 6종** — 도해 출제 빈발\n★★★ **GEP: Hs ≥ H+1.5L** — 통합허가·모델링\n★★★ **Vs ≥ 1.5u** — down wash 방지\n"},{"title":"1단계 진도 점검 — 여기까지 왔다면","body":"### 현재 위치\nDay 15까지 완료했다면 **1단계(52일) 중 29%** 진행. 전체 194일 기준 8%.\n\n### 지금까지 다룬 범위\n| 영역 | 학습일 | 상태 |\n|---|---|---|\n| 대기 구조·조성 | Day 1 | ✔ |\n| 안정도(정적·동적) | Day 2~4 | ✔ |\n| 역전·경계층·혼합고 | Day 5~6 | ✔ |\n| 바람·국지순환·열섬 | Day 7, 9~10 | ✔ |\n| 연기형태·굴뚝 | Day 11~13 | ✔ |\n| 확산모델 | Day 14~15 | ✔ |\n| **남은 것** | 수용모델·영향평가·2차오염·집진 | Day 17~51 |\n\n### 자가 진단\n아래 5개에 막힘없이 답할 수 있으면 진도가 정상이다.\n\n1. Γd가 0.98℃/100m인 이유를 식으로 설명할 수 있는가?\n2. Ri = 0.25의 의미를 말할 수 있는가?\n3. 연기형태 6종을 그림으로 그릴 수 있는가?\n4. Cmax가 He²에 반비례하는 이유를 유도할 수 있는가?\n5. AERMOD와 CALPUFF의 선택 기준을 말할 수 있는가?\n\n3개 이상 막히면 **속도를 늦추고 해당 일자를 다시 보는 것**이 낫다. 진도를 나가는 것보다 사슬이 끊기지 않는 것이 중요하다.\n\n### 페이스 조언\n- 하루 1주제 + 주 1회독이 기본 설계\n- 못 지킨 날이 있어도 **연속을 끊지 않는 것**이 우선. 5분이라도 앱을 열고 키워드만 훑어라\n- 완벽주의보다 **꾸준함**. 60점이 목표지 100점이 아니다\n\n\n### 남은 1단계 미리보기 (Day 17~52)\n| 구간 | 주제 |\n|---|---|\n| Day 17~19 | 오일러리안·라그랑지안, 수용모델, 선·면 배출원 |\n| Day 20~22 | 대기환경영향평가 (항목·예측·건강영향) |\n| Day 23~29 | 제거기작, 시정장애, 산성비, 광화학·오존 |\n| Day 30~36 | 입자 특성, 집진 일반, 중력·관성·원심력 집진 |\n| Day 37~43 | 여과집진, 전기집진 |\n| Day 44~51 | 세정집진, 후드·덕트·송풍기, 국소배기 |\n\n여기까지가 **방지시설 25%·이론 21%**를 차지하는 최대 출제 영역이다. 1단계를 제대로 마치면 2~4교시 논술에서 선택할 수 있는 문항이 크게 늘어난다.\n"}]},"17":{"day":17,"date":"2026-08-17","title":"오일러리안·라그랑지안 모델 비교","keywords":[{"k":"오일러리안(Eulerian)","subs":["고정 격자에서 질량보존식 해석","∂C/∂t + u·∇C = ∇(K∇C)+S−R","CMAQ·CAMx, 광화학 반응 가능"]},{"k":"라그랑지안(Lagrangian)","subs":["공기덩어리를 따라가며 추적","궤적·퍼프·입자 모델","CALPUFF·HYSPLIT"]},{"k":"좌표계의 차이","subs":["오일러: 관측자 고정(강가에서 보기)","라그랑지: 유체와 함께 이동(뗏목 타기)","수치확산 유무"]},{"k":"장단점","subs":["오일러: 화학반응 유리 / 수치확산·해상도 한계","라그랑지: 궤적추적·정온 유리 / 반응 처리 곤란","혼합모델(hybrid) 등장"]},{"k":"적용 분야","subs":["오일러: 광역 대기질·2차 생성","라그랑지: 사고 확산·역궤적·장거리 이송","116회 25점 기출"]}],"answer":"# 오일러리안·라그랑지안 모델 비교\n\n## Ⅰ. 개요\n\n대기 중 오염물질의 거동을 기술하는 방식은 **관찰자의 기준좌표계**를 어디에 두느냐에 따라 두 가지로 나뉜다. 공간의 **고정된 지점**에서 물질의 출입을 보는 것이 **오일러리안(Eulerian) 관점**이고, **공기덩어리와 함께 이동하면서** 그 안의 변화를 보는 것이 **라그랑지안(Lagrangian) 관점**이다. 두 관점은 물리적으로 동등하지만 수치해석 방법과 장단점이 크게 달라, 목적에 따라 선택하여야 한다. 116회 25점으로 출제되었다.\n\n## Ⅱ. 두 관점의 개념\n\n### 1. 비유\n- **오일러리안**: 강가에 서서 한 지점을 통과하는 물의 성질 변화를 관찰\n- **라그랑지안**: 뗏목을 타고 물과 함께 떠내려가며 주변 변화를 관찰\n\n### 2. 수학적 관계\n두 관점은 **물질도함수(material derivative)**로 연결된다.\n\n**DC/Dt = ∂C/∂t + u·∇C**\n\n- 좌변(라그랑지안): 이동하는 덩어리에서의 변화율\n- 우변 제1항(오일러리안): 고정점에서의 시간변화율\n- 우변 제2항: 이송(advection)에 의한 변화\n\n## Ⅲ. 오일러리안 모델(Eulerian Model)\n\n### 1. 지배방정식\n고정 격자에서 질량보존식을 푼다.\n\n**∂C/∂t + u·∇C = ∇·(K∇C) + S − R − D**\n\n- K: 난류확산계수, S: 배출항, R: 화학반응항, D: 침적항\n\n### 2. 특징\n- 계산영역을 3차원 격자(예: 27km → 9km → 3km 순차 축소)로 분할\n- 각 격자마다 농도·온도·화학종을 저장하고 시간 적분\n- **모든 배출원을 동시에** 계산 → 광역 대기질 재현\n\n### 3. 대표 모델\n**CMAQ**(US EPA), **CAMx**, **WRF-Chem**, **MM5/WRF-CMAQ** 체계\n\n### 4. 장점\n1. **화학반응 처리에 유리**: 격자 내 농도가 정의되므로 광화학 메커니즘(SAPRC, CB6) 적용 용이 → **O₃, 2차 PM2.5** 모의 가능\n2. 다수 배출원·배경농도 동시 처리\n3. 질량보존이 엄밀\n4. 물리·화학 과정을 모듈로 분리해 확장 용이\n\n### 5. 단점\n1. **수치확산(numerical diffusion)**: 이송항의 차분 과정에서 인위적으로 농도가 퍼짐 → 근거리 첨두농도 과소평가\n2. **격자 해상도 한계**: 격자보다 작은 규모(굴뚝 플룸, 도로 협곡)는 즉시 격자 전체로 희석됨 → 국지 고농도 재현 불가\n3. 계산량 방대, 배출인벤토리 불확실성이 결과를 지배\n\n## Ⅳ. 라그랑지안 모델(Lagrangian Model)\n\n### 1. 개념\n배출된 물질을 **퍼프(puff)** 또는 **입자(particle)** 단위로 나누고, 각각을 기상장을 따라 이동시키며 확산·변환·침적을 계산한다.\n\n### 2. 세부 유형\n\n| 유형 | 방식 | 대표모델 |\n|---|---|---|\n| **궤적(Trajectory) 모델** | 공기덩어리 이동경로 추적 | HYSPLIT(역궤적 분석) |\n| **퍼프(Puff) 모델** | 퍼프가 가우시안 형상으로 성장 | **CALPUFF** |\n| **입자(Particle) 모델** | 다수 입자를 확률적으로 이동 | FLEXPART, LPDM |\n\n### 3. 장점\n1. **수치확산 없음**: 이송을 직접 추적하므로 인위적 희석이 없음\n2. **비정상·비균질 기상 대응**: 시간·공간에 따라 변하는 풍향·풍속 반영\n3. **정온(calm) 조건에서도 안정**: 퍼프가 제자리에서 성장\n4. **궤적 추적 가능**: 어느 배출원의 물질이 어디서 왔는지 역추적 → 장거리 이송·국외 기여 분석\n5. 근거리 첨두농도 재현 우수\n\n### 4. 단점\n1. **화학반응 처리가 어려움**: 퍼프 간 혼합·상호작용을 다루기 곤란 → 2차 생성 모의 제한적(선형 변환식 근사)\n2. 배출원이 많으면 퍼프 수가 급증하여 계산량 폭증\n3. 배경농도·다수 배출원 중첩 처리 불편\n\n## Ⅴ. 종합 비교\n\n| 항목 | 오일러리안 | 라그랑지안 |\n|---|---|---|\n| 기준좌표 | 공간 고정 | 유체와 함께 이동 |\n| 계산 단위 | 격자(cell) | 퍼프·입자 |\n| 대표모델 | CMAQ, CAMx | CALPUFF, HYSPLIT |\n| **화학반응** | **우수** | 제한적 |\n| **수치확산** | 발생 | **없음** |\n| 정온 조건 | 가능 | **우수** |\n| 근거리 첨두 | 과소평가 | **우수** |\n| 다수 배출원 | **우수** | 계산량 급증 |\n| 궤적 추적 | 불가 | **가능** |\n| 주 용도 | 광역 대기질·2차 생성 | 사고확산·장거리 이송·복잡지형 |\n\n## Ⅵ. 혼합(Hybrid) 접근\n\n두 방식의 장점을 결합하려는 시도가 활발하다.\n- **PiG(Plume-in-Grid)**: 배출원 근처는 라그랑지안 플룸으로 정밀 계산하고, 충분히 확산되면 오일러리안 격자에 편입 → CAMx·CMAQ에 구현\n- **CALPUFF + CMAQ**: 국지 영향은 퍼프, 배경·2차 생성은 격자로 산정 후 합산\n- **Adjoint 기법**: 오일러리안 모델을 역으로 풀어 라그랑지안적 기여도 분석(DDM, ISAM)\n\n## Ⅶ. 결론\n\n오일러리안과 라그랑지안은 동일한 물리현상을 서로 다른 좌표계에서 기술한 것으로, **오일러리안은 화학반응과 광역 대기질에, 라그랑지안은 궤적 추적·정온·복잡지형·근거리 첨두농도에 각각 강점**을 갖는다. 국내 대기질 관리에서는 미세먼지·오존의 2차 생성 평가에 CMAQ을, 개별 사업장의 영향 평가와 국외 유입 경로 분석에 CALPUFF·HYSPLIT을 사용하는 것이 타당하며, 최근에는 Plume-in-Grid 등 혼합 기법을 통해 두 방식의 한계를 상호 보완하는 방향으로 발전하고 있다.\n","side":[{"title":"HYSPLIT 역궤적 분석과 장거리 이송","body":"### 개요\n**HYSPLIT**(HYbrid Single-Particle Lagrangian Integrated Trajectory)은 미국 NOAA가 개발한 라그랑지안 궤적·확산 모델로, 웹에서 무료로 사용할 수 있어 국내 연구·실무에서 널리 활용된다.\n\n### 역궤적(Backward Trajectory) 분석\n관측지점에서 **시간을 거꾸로 돌려** 공기덩어리가 어디서 왔는지 추적하는 기법.\n\n**절차**\n1. 수용지점(예: 서울 백령도) 좌표와 고도(500m, 1000m, 1500m) 지정\n2. 고농도 발생 시각을 시작점으로 설정\n3. 재분석 기상장(GDAS, NCEP)을 이용해 **72~120시간 역추적**\n4. 다수 사례의 궤적을 **군집분석(cluster analysis)**으로 유형화\n\n### 대기환경 활용\n| 활용 | 내용 |\n|---|---|\n| **국외 기여 분석** | 고농도 시 궤적이 중국 화북·산둥을 통과하는지 확인 |\n| **황사 발원지 추적** | 고비·내몽골 사막 통과 여부 |\n| **PSCF/CWT** | 궤적에 농도를 결합해 잠재 배출원 지역 확률 지도 작성 |\n| **월경성 오염** | CLRTAP·동북아 협력의 과학적 근거 |\n| **사고 확산 예측** | 방사성물질·유해화학물질 누출 시 |\n\n### 한계\n- 기상장 해상도(1° ≈ 100km)의 한계로 국지 순환 미반영\n- 단일 궤적은 불확실성이 커 **다수 궤적의 통계 처리** 필수\n- 궤적은 이송 경로일 뿐 **배출량 정보를 포함하지 않음** → 인벤토리와 결합 필요\n- 습·건성 침적, 화학변환이 미반영된 순수 궤적은 실제 물질 이동과 차이\n\n### 답안 작성 팁\n\"국외 유입 기여도\" 문제에서 **CMAQ(정량) + HYSPLIT 역궤적(경로) + 수용모델 PMF(성분)**의 3중 검증을 제시하면 완결성이 높다.\n"},{"title":"수치확산(Numerical Diffusion)","body":"### 정의\n이송방정식을 유한차분·유한체적으로 이산화할 때, **물리적 확산이 아닌 계산상의 오차로 농도가 퍼지는 현상**. 오일러리안 격자모델의 고유한 한계다.\n\n### 발생 원인\n이송항 u(∂C/∂x)를 풍상차분(upwind)으로 근사하면, 테일러 전개의 절단오차가\n\n−(u·Δx/2)(1−Cr)·(∂²C/∂x²)\n\n형태가 되어 **확산항과 같은 수학적 형태**를 갖는다. 즉 존재하지 않는 확산계수가 인위적으로 추가된다. (Cr = uΔt/Δx: Courant 수)\n\n### 영향\n| 현상 | 결과 |\n|---|---|\n| 첨두농도 감소 | 굴뚝 근처 최대농도 **과소평가** |\n| 플룸 폭 증가 | 영향범위 과대평가 |\n| 급격한 농도경사 소실 | 도로변·경계면 재현 곤란 |\n\n### 저감 방법\n1. **고차 정확도 수치기법**: Piecewise Parabolic Method(PPM), Bott 기법, 준라그랑지안 이송\n2. **격자 세밀화**: Δx 감소 → 오차 감소, 그러나 계산량 급증\n3. **적응형 격자(AMR)**: 농도경사가 큰 영역만 조밀화\n4. **Plume-in-Grid**: 근거리를 라그랑지안으로 처리\n5. **Courant 수 관리**: Cr ≤ 1 유지(안정성 조건)\n\n### 실무 시사점\n- CMAQ 27km 격자로 개별 사업장 영향을 평가하면 **거의 의미 없는 결과**가 나온다. 사업장 단위는 AERMOD·CALPUFF를 써야 한다\n- 반대로 AERMOD로 광역 오존을 평가할 수 없다\n- 모델 결과 해석 시 \"격자 해상도 대비 대상 현상의 규모\"를 항상 확인해야 한다\n"}]},"18":{"day":18,"date":"2026-08-18","title":"수용모델(CMB·PMF)과 분산모델","keywords":[{"k":"수용모델 개념","subs":["수용지점 성분 → 배출원 기여도 역산","질량収支 원리","배출량 자료 불필요"]},{"k":"CMB(화학질량수지)","subs":["배출원 지문(source profile) 필요","최소자승법으로 기여도 산정","기지 배출원에 적합"]},{"k":"PMF(양행렬인수분해)","subs":["배출원 지문 불필요(비음수 제약)","다변량 통계, Factor 해석 필요","EPA PMF 5.0"]},{"k":"분산모델과 비교","subs":["분산: 배출→농도(정방향, 예측)","수용: 농도→배출원(역방향, 진단)","상호 검증·보완 관계"]},{"k":"한계와 활용","subs":["2차 생성물질 배분 곤란","공선성(collinearity) 문제","123·129회 기출"]}],"answer":"# 수용모델(Receptor Model)과 분산모델(Dispersion Model)\n\n## Ⅰ. 개요\n\n대기오염물질의 배출원 기여도를 파악하는 방법은 두 가지 방향이 있다. **분산모델**은 배출량과 기상자료로부터 농도를 **예측(정방향)**하고, **수용모델**은 수용지점에서 측정한 성분 조성으로부터 배출원의 기여도를 **역산(역방향)**한다. 두 방법은 서로 다른 자료를 사용하므로 결과를 교차 검증하면 신뢰도를 크게 높일 수 있으며, 미세먼지 관리 정책 수립의 핵심 도구이다. 123회 25점으로 출제되었다.\n\n## Ⅱ. 수용모델의 원리\n\n### 1. 기본 가정 — 화학질량수지\n수용지점에서 측정된 어떤 성분 i의 농도는, 각 배출원 j의 기여농도에 그 배출원의 성분 조성을 곱한 값의 합이다.\n\n**Cᵢ = Σⱼ (aᵢⱼ × Sⱼ) + eᵢ**\n\n- Cᵢ: 수용점에서 측정한 성분 i의 농도\n- aᵢⱼ: 배출원 j의 배출물 중 성분 i의 분율 (**배출원 지문, source profile**)\n- Sⱼ: 배출원 j의 기여농도\n- eᵢ: 잔차\n\n### 2. 전제 조건\n1. 배출원의 성분 조성이 **이동 중 변하지 않음**(비반응성 추적자)\n2. 배출원 간 성분 조성이 **서로 충분히 다름**\n3. 배출원 수 < 측정 성분 수\n4. 측정오차가 정규분포·독립\n\n## Ⅲ. 수용모델의 종류\n\n### 1. CMB(Chemical Mass Balance, 화학질량수지법)\n- **원리**: 배출원 지문 aᵢⱼ를 **미리 알고 있다고 가정**하고, 최소자승법으로 Sⱼ를 구함\n- **필요 자료**: 수용점 성분 측정치 + **배출원별 지문 DB**\n- **장점**: 단일 시료로도 계산 가능, 결과 해석이 명확\n- **단점**: 배출원 지문 DB의 정확도에 결과가 좌우됨. 국내 지문 DB가 부족. 미지의 배출원은 반영 불가\n- **공선성 문제**: 조성이 유사한 배출원(예: 경유차 vs 건설기계)은 구분이 어려움\n\n### 2. PMF(Positive Matrix Factorization, 양행렬인수분해)\n- **원리**: 측정 데이터 행렬 X를 **X = G·F + E** 로 분해. G(기여도)와 F(인자 프로파일)를 모두 미지수로 두고, **비음수(non-negative) 제약** 하에 오차 가중 최소화\n- **필요 자료**: 다수 시료(통상 **100개 이상**)의 성분 측정치. **배출원 지문 불필요**\n- **장점**: 지문 DB 없이 적용 가능, 미지의 배출원도 인자로 추출\n- **단점**: 추출된 인자가 어떤 배출원인지 **연구자가 해석**해야 함(주관 개입), 회전 모호성(rotational ambiguity)\n- **도구**: US EPA PMF 5.0 (무료 배포)\n\n**Factor 정의 시 고려사항** (129회 기출)\n1. 인자 수 결정: Q/Qexp 값, 잔차 분포, 물리적 타당성\n2. 지시물질(marker) 확인: 각 인자의 특징적 성분\n3. 회전 제어: Fpeak, 제약조건 적용\n4. 불확실성 평가: BS(bootstrap), DISP, BS-DISP\n5. 시계열·풍향(CPF)과의 정합성 검토\n\n### 3. 기타\n- **PCA/APCS**: 주성분분석 기반. 음수 해가 나올 수 있어 해석 곤란\n- **UNMIX**: EPA 개발, 자기모델링 곡선 분해\n- **PSCF/CWT**: 역궤적과 결합한 지역 기여 확률\n\n## Ⅳ. 주요 배출원의 지시물질(Marker)\n\n| 배출원 | 지시 성분 |\n|---|---|\n| 토양·비산먼지 | Al, Si, Ca, Fe, Ti |\n| 해염입자 | Na⁺, Cl⁻, Mg²⁺ |\n| 자동차(경유) | EC, OC, 유기추적자 |\n| 자동차(휘발유) | OC/EC 비 높음 |\n| 석탄연소 | As, Se, S, Cl |\n| 중유연소 | V, Ni (V/Ni 비) |\n| 소각 | Zn, Pb, Cl⁻ |\n| 제철·제강 | Fe, Mn, Zn |\n| 2차 무기입자 | SO₄²⁻, NO₃⁻, NH₄⁺ |\n| 생물성 연소 | K⁺, levoglucosan |\n| 브레이크·타이어 마모 | Cu, Sb, Ba, Zn |\n\n## Ⅴ. 분산모델과 수용모델 비교\n\n| 항목 | **분산모델** | **수용모델** |\n|---|---|---|\n| 계산 방향 | 배출원 → 수용점 (정방향) | 수용점 → 배출원 (역방향) |\n| 주 입력자료 | 배출량, 기상, 지형 | 수용점 성분 측정치 |\n| 대표 모델 | AERMOD, CALPUFF, CMAQ | CMB, PMF, UNMIX |\n| 목적 | **예측**(장래·시나리오) | **진단**(현재 원인 규명) |\n| 미래 예측 | **가능** | 불가 |\n| 미지 배출원 | 반영 불가 | **PMF는 추출 가능** |\n| 2차 생성 | CMAQ은 가능 | 배분 곤란 |\n| 최대 오차원 | 배출인벤토리 | 배출원 지문·인자 해석 |\n| 정책 활용 | 저감대책 효과 사전평가 | 현 상황 원인 진단 |\n\n### 상호 보완\n1. **수용모델**로 현재 기여도를 진단 → 인벤토리 검증·보정\n2. 보정된 인벤토리로 **분산모델** 수행 → 저감 시나리오 평가\n3. 두 결과가 크게 다르면 인벤토리 누락·지문 오류를 의심\n4. 국내 미세먼지 관리 종합계획 수립 시 두 방법을 병행\n\n## Ⅵ. 한계와 개선방향\n\n1. **2차 생성물질 배분**: 황산염·질산염은 어느 배출원에서 왔는지 지문으로 구분 불가 → 전구물질 기여도는 CMAQ 등 광화학 모델로 보완\n2. **국내 배출원 지문 DB 부족**: 업종·연료별 실측 지문 확충 필요\n3. **공선성**: 조성이 유사한 배출원 분리 곤란 → 유기추적자·동위원소비 등 신규 지시물질 도입\n4. **시간 해상도**: 24시간 필터 시료 중심 → 준실시간 측정(ACSM, XRF)으로 고해상도 PMF 가능\n5. **국외 유입 분리**: 역궤적(HYSPLIT)·PSCF와 결합\n\n## Ⅶ. 결론\n\n수용모델과 분산모델은 대립하는 것이 아니라 **진단과 예측이라는 서로 다른 역할**을 수행하는 상호보완적 도구이다. CMB는 배출원 지문이 확보된 경우, PMF는 지문 없이 다수 시료가 있는 경우에 적합하다. 국내에서는 미세먼지 기여도 산정에 두 방법이 함께 활용되고 있으나, 배출원 지문 DB 확충과 2차 생성물질의 배출원 배분 방법론 정립이 시급한 과제이다.\n","side":[{"title":"CMB 적용 절차와 검증 지표","body":"### 적용 절차\n1. **수용점 선정 및 시료 채취**: PM10·PM2.5 필터 시료 (통상 24시간, 계절별)\n2. **성분 분석**\n   - 이온: IC (SO₄²⁻, NO₃⁻, NH₄⁺, Cl⁻, Na⁺, K⁺ 등)\n   - 금속: ICP-MS, XRF (Al, Si, Ca, Fe, V, Ni, Zn, Pb 등)\n   - 탄소: TOR/TOT 열광학법 (OC, EC)\n3. **배출원 지문 확보**: 국내 실측 또는 EPA SPECIATE DB\n4. **CMB 8.2 실행**: 배출원 조합을 바꾸어가며 최적해 탐색\n5. **검증 지표 확인** 후 결과 채택\n\n### 주요 검증 지표\n| 지표 | 의미 | 허용범위 |\n|---|---|---|\n| **R²** | 측정-계산 질량 적합도 | > 0.8 |\n| **χ²** | 카이제곱 | < 4 |\n| **%Mass** | 설명된 질량 비율 | 80~120% |\n| **T-statistic** | 각 배출원 기여의 유의성 | > 2.0 |\n\nT-stat이 2 미만인 배출원은 통계적으로 유의하지 않으므로 제외하거나 다른 조합을 시도한다.\n\n### 실무상 주의\n- 지문의 **노후화**: 배출규제 강화로 실제 배출조성이 변했는데 옛 지문을 쓰면 오류\n- **계절별 분리 적용**: 난방·생물성 연소 등 계절 배출원 반영\n- 결과는 **기여농도(㎍/㎥)**와 **기여율(%)** 모두 제시\n- 미설명 질량(unexplained mass)이 크면 누락 배출원 존재를 의심\n\n### CMB vs PMF 선택 기준\n| 조건 | 권장 |\n|---|---|\n| 배출원 지문 DB 확보됨 | **CMB** |\n| 시료 수 100개 이상 | **PMF** |\n| 미지 배출원 의심 | **PMF** |\n| 단일 사건(고농도 1회) 분석 | **CMB** |\n| 장기 경향 분석 | **PMF** |\n\n가능하면 **두 방법을 모두 적용**하고 결과가 일치하는 배출원부터 신뢰하는 것이 안전하다.\n"},{"title":"국내 미세먼지 기여도 산정 체계","body":"### 3중 접근\n국내 미세먼지 관리 정책은 서로 다른 방법의 결과를 교차 검증하여 신뢰도를 확보한다.\n\n| 방법 | 산출 내용 | 대표 도구 |\n|---|---|---|\n| **배출인벤토리** | 부문별 배출량(톤/년) | CAPSS |\n| **분산·광화학 모델** | 지역·부문별 농도 기여도 | CMAQ + BFM/ISAM |\n| **수용모델** | 실측 기반 배출원 기여율 | PMF, CMB |\n| **궤적 분석** | 국외 유입 경로 | HYSPLIT 역궤적 |\n\n### CAPSS(대기정책지원시스템)\n- 국립환경과학원이 운영하는 **국가 대기오염물질 배출량 산정 시스템**\n- 대상물질: CO, NOx, SOx, TSP, PM10, PM2.5, VOCs, NH₃, BC\n- 배출원 분류: **13개 대분류**(에너지산업 연소, 비산업 연소, 제조업 연소, 생산공정, 에너지수송·저장, 유기용제 사용, 도로이동오염원, 비도로이동오염원, 폐기물처리, 농업, 기타면오염원, 비산먼지, 생물성연소)\n- 산정: **배출량 = 활동도 × 배출계수 × (1 − 제거효율)**\n- 117회·126회 10점 기출\n\n### 국외 기여율\n연평균 약 **30~50%**, 고농도 사례 시 **60~80%**로 보고되나, 방법·기간에 따라 편차가 크다. 한중일 공동연구보고서(LTP)에서 3국이 공동 산정한 결과를 정책 근거로 활용한다.\n\n### 개선 과제\n1. CAPSS 배출계수의 국내 실측 기반 갱신 (특히 비산먼지·생물성연소·NH₃)\n2. 응축성 미세먼지(CPM) 배출량 산정 체계 도입\n3. 2차 생성 기여의 전구물질별 배분 방법론 정립\n4. 준실시간 성분 측정망 확충으로 고해상도 수용모델 적용\n\n### 응축성 미세먼지(CPM)\n굴뚝에서는 기체 상태였다가 대기 중에서 냉각·응축되어 입자가 되는 물질. 현행 공정시험기준의 여과지 포집(FPM)으로는 잡히지 않아 **배출량이 과소 산정**되는 문제가 지속 제기되고 있다.\n- 측정: 미국 EPA Method 202(임핀저 응축법)\n- 국내 일부 업종 실측 결과 FPM의 수 배에 달하는 사례 보고\n- 배출허용기준·인벤토리 반영 여부가 향후 쟁점\n"}]},"19":{"day":19,"date":"2026-08-19","title":"선·면 배출원 확산식","keywords":[{"k":"선 배출원(Line Source)","subs":["도로·철도·컨베이어","C=2q/(√(2π)σz·u·sinφ)·exp(−He²/2σz²)","φ: 바람과 도로의 교각"]},{"k":"교각(φ)의 영향","subs":["φ=90° 직각 시 최소농도","φ→0 평행 시 농도 급증","φ<45° 시 무한선원 가정 부적합"]},{"k":"면 배출원(Area Source)","subs":["야적장·매립장·주차장","가상거리법으로 σy₀·σz₀ 부여","σy₀≈폭/4.3, σz₀≈높이/2.15"]},{"k":"체적 배출원(Volume)","subs":["비산배출·건물 누출","초기 확산폭 직접 부여","LDAR 배출계수 적용"]},{"k":"실무 적용","subs":["도로 CALINE4·AERMOD LINE","비산먼지 면원 처리","120회 25점 기출"]}],"answer":"# 선·면 배출원 확산식\n\n## Ⅰ. 개요\n\n가우시안 확산모델의 기본식은 **점 배출원(굴뚝)**을 전제로 유도되었으나, 실제 대기오염 배출원에는 도로와 같은 **선 배출원**, 야적장·매립장 같은 **면 배출원**, 배관 누출과 같은 **체적 배출원**이 존재한다. 이들은 배출 형태가 다르므로 점원식을 그대로 적용할 수 없고, **적분** 또는 **가상거리법**으로 변환하여 해석한다. 120회에서 \"고속도로와 같은 선 배출원의 풍하지역 오염농도 평가식\"이 25점으로 출제되었다.\n\n## Ⅱ. 선 배출원(Line Source)\n\n### 1. 개념\n도로·철도·이동식 컨베이어처럼 **선을 따라 연속적으로 배출**되는 배출원. 단위길이당 배출률 **q [g/m·s]**로 표현한다.\n\n### 2. 무한 선원 확산식 유도\n점원식을 선을 따라 −∞에서 +∞까지 적분하면, 수평 확산항이 상쇄되어 **σy가 사라지고 σz만 남는다.**\n\n**바람이 선원에 수직인 경우(φ = 90°)**\n\n**C(x, 0) = 2q / (√(2π) · σz · u) × exp(−He²/2σz²)**\n\n**바람이 선원과 각 φ를 이루는 경우**\n\n**C(x, 0) = 2q / (√(2π) · σz · u · sin φ) × exp(−He²/2σz²)**\n\n- q: 단위길이당 배출률 [g/m·s]\n- u: 풍속 [m/s], σz: 연직 확산계수 [m]\n- He: 유효배출고 (지표 도로는 He ≈ 0~2m)\n- φ: 바람 방향과 도로가 이루는 각\n\n지표 배출(He = 0)이면 exp 항이 1이 되어\n\n**C = 2q / (√(2π) · σz · u · sin φ)**\n\n### 3. 교각 φ의 영향\n\n| φ | sin φ | 상대농도 | 상황 |\n|---|---|---|---|\n| 90° (직각) | 1.00 | 1.0 (최소) | 바람이 도로를 가로지름 |\n| 60° | 0.87 | 1.15 | |\n| 45° | 0.71 | 1.41 | |\n| 30° | 0.50 | **2.0** | |\n| 10° | 0.17 | **5.8** | 거의 평행 |\n\n**φ가 작아질수록(바람이 도로와 나란할수록) 농도가 급증**한다. 같은 배출원에서 오염물질이 계속 누적되며 이동하기 때문이다. 다만 **φ < 45°(일부 문헌 30°)**에서는 무한선원 가정이 성립하지 않아 오차가 커지므로, 유한 선원으로 분할하여 수치적분하거나 CALINE4 등 전용 모델을 사용해야 한다.\n\n### 4. 유한 선원(Finite Line Source)\n실제 도로는 길이가 유한하므로, 오차함수(error function)를 이용한다.\n\nC = (q / (√(2π) · σz · u)) × exp(−He²/2σz²) × [erf(y₂/(√2 σy)) − erf(y₁/(√2 σy))]\n\n- y₁, y₂: 수용점에서 본 선원 양 끝의 횡방향 좌표\n\n### 5. 도로 전용 모델\n- **CALINE3/CALINE4**: 도로를 유한 요소로 분할하고 각 요소를 등가 유한선원으로 처리. 차량 유발 난류(traffic-induced turbulence)와 혼합영역(mixing zone) 개념 포함\n- **AERMOD LINE/RLINE 소스**: 최근 EPA가 도로 전용 알고리즘 추가\n- **혼합영역**: 도로 폭 + 양측 3m 구간은 차량 난류로 완전혼합된다고 가정\n\n## Ⅲ. 면 배출원(Area Source)\n\n### 1. 개념\n야적장, 매립장, 주차장, 나대지, 저수조 수면 등 **일정 면적에서 균일하게 배출**되는 배출원. 단위면적당 배출률 **qA [g/m²·s]**.\n\n### 2. 가상거리법(Virtual Distance / Virtual Point Source)\n면원을 점원으로 치환하되, 배출 시점에 이미 면원의 크기만큼 확산되어 있다고 보아 **초기 확산폭**을 부여한다.\n\n**초기 확산계수**\n- **σy₀ ≈ W / 4.3**  (W: 바람 직각방향 면원 폭)\n- **σz₀ ≈ Hz / 2.15**  (Hz: 배출 연직 두께 또는 배출고)\n\n(4.3 = 2×2.15, 2.15는 정규분포에서 전체의 약 97%를 포함하는 계수)\n\n**가상거리 xᵥ**: 점원이 확산되어 σy = σy₀가 되는 풍상거리를 안정도별 σy 식에서 역산한다.\n\n**적용**: 실제 풍하거리 x에 대해 **σy(x + xᵥ)**, **σz(x + xᵥ)**를 사용하여 점원식에 대입.\n\n### 3. 적분법\n면원을 다수의 미소 선원으로 분할하여 수치적분. AERMOD의 AREA 소스는 이 방식을 사용하며, 사각형·원형·다각형 면원을 지원한다.\n\n## Ⅳ. 체적 배출원(Volume Source)\n\n### 1. 개념\n건물 내부에서 새어나오는 배출, 플랜지·밸브 등 **비산배출(fugitive emission)**, 개방형 설비처럼 일정 부피에서 확산이 시작되는 배출원.\n\n### 2. 처리\n초기 확산폭을 직접 부여한다.\n- **σy₀ = 측면 길이 / 4.3**\n- **σz₀ = 연직 높이 / 2.15** (지표 접촉 시 /2.15, 공중이면 /4.3)\n\n### 3. 배출량 산정\n- 비산배출: **LDAR**(Leak Detection And Repair) 결과 또는 부품 개수 × 성분별 배출계수\n- 저장탱크: EPA TANKS 프로그램(호흡손실 + 출하손실)\n\n## Ⅴ. 배출원 형태별 정리\n\n| 형태 | 배출률 단위 | 처리 방법 | 대표 사례 |\n|---|---|---|---|\n| 점원 | g/s | 기본 가우시안식 | 굴뚝 |\n| **선원** | **g/m·s** | 선적분 (sin φ 항) | 도로, 철도 |\n| **면원** | **g/m²·s** | 가상거리법·수치적분 | 야적장, 매립장 |\n| **체적원** | g/s | 초기 σy₀·σz₀ 부여 | 비산배출, 건물 누출 |\n\n## Ⅵ. 대기환경 관리적 의의\n\n1. **도로변 대기질**: 국내 NO₂ 환경기준 초과는 대부분 도로변 측정소에서 발생한다. 선원 확산식으로 완충거리·방음벽 효과·도로 다이어트 효과를 정량 평가할 수 있다.\n2. **비산먼지 관리**: 「대기환경보전법」상 비산먼지 발생사업의 야적·수송 공정은 면원으로 평가하여 방진벽·살수·피복 등 억제시설의 효과를 검토한다.\n3. **비산배출시설**: 정유·석유화학 업종의 플랜지·밸브 누출은 체적원으로 처리하며, LDAR 시행 전후의 농도 저감을 예측한다.\n4. **환경영향평가**: 도로·터널 사업은 선원, 산업단지 조성은 면원+점원 복합으로 평가한다.\n\n## Ⅶ. 결론\n\n선·면·체적 배출원은 점원식의 확장으로 해석되며, 선원은 **sin φ 항에 의해 바람이 도로와 평행할수록 농도가 급증**하고, 면·체적원은 **가상거리법으로 초기 확산폭을 부여**하는 것이 핵심이다. 다만 φ가 작거나 도로 구조가 복잡한 경우 무한선원 가정이 성립하지 않으므로 CALINE4·RLINE 등 전용 알고리즘이나 CFD를 적용하여야 하며, 특히 도시협곡 도로에서는 가우시안 계열 모델의 적용 한계를 명확히 인식하여야 한다.\n","side":[{"title":"도로 재비산먼지 관리시스템","body":"### 정의\n도로에 쌓인 먼지가 차량 주행에 의해 다시 날리는 **재비산먼지(re-suspended dust)**를 측정·관리하는 체계. 114회 25점으로 \"도로 재비산먼지 측정관리시스템의 정의, 대상지역, 측정물질, 측정원리\"가 출제되었다.\n\n### 재비산먼지의 중요성\n- CAPSS 기준 **비산먼지 부문의 최대 배출원** 중 하나\n- 도로변 PM10 농도의 상당 부분을 차지\n- 배출 자체가 아니라 **퇴적 후 재비산**이므로 저감 방법이 다름(청소·살수)\n\n### 측정 시스템\n| 방식 | 원리 |\n|---|---|\n| **이동측정차량(MDMS)** | 차량 전면 흡입구로 도로면 부근 공기를 채취, 광산란법으로 PM10 실시간 측정. GPS로 위치 기록 |\n| 고정식 도로변 측정소 | 베타선법·중량법 |\n| 실리트 부하(sL) 측정 | 도로면 먼지를 진공 채취·체분석 → EPA AP-42 배출계수 산정 |\n\n### AP-42 재비산 배출계수\nE = k × (sL)^0.91 × (W)^1.02\n- sL: 실리트 부하(g/m²), W: 차량 평균 중량(톤), k: 입경별 계수\n\n### 저감 대책\n1. **도로 청소차 운영**: 분진흡입차·고압살수차·노면청소차 조합\n2. **살수**: 건조기 살수로 재비산 억제 (단, 하절기 단시간 효과)\n3. **화물차 세륜·세차 시설** 의무화\n4. **비산먼지 발생사업장 진출입로 포장**\n5. 「대기관리권역법」에 따른 도로 재비산먼지 저감사업\n\n### 한계\n청소 효과는 며칠 내 소멸하므로 **지속적 운영 예산**이 관건이며, 근본적으로는 교통량·중량차 통행 관리가 필요하다.\n"},{"title":"터널 배출가스의 확산 특성","body":"### 문제의 성격\n117회·최근 회차에 \"터널에서 배출되는 오염물질의 확산특성 및 대기질 환경영향평가 방법\"이 25점으로 반복 출제되었다.\n\n### 터널 배출의 특징\n1. **점원 성격**: 갱구에서 고농도가 집중 배출 → 사실상 지표 점원\n2. **고농도·저희석**: 터널 내 축적된 NO₂·PM이 한꺼번에 배출\n3. **피스톤 효과**: 차량 주행이 만드는 종방향 기류로 배출 방향과 속도가 결정\n4. **갱구 주변 지형**: 대부분 산지·절토부라 확산이 불량\n5. 환기방식(자연/종류식/횡류식/반횡류식)에 따라 배출 지점이 달라짐\n\n### 확산 평가 방법\n| 단계 | 방법 |\n|---|---|\n| 터널 내 농도 | 교통량 × 배출계수 ÷ 환기량 (일차원 모델) |\n| 갱구 배출량 | 터널 내 농도 × 환기 배출유량 |\n| 갱구 주변 확산 | 가우시안(점원·체적원) 또는 **CFD** |\n| 수직갱(환기탑) | 점원(굴뚝)으로 처리 |\n\n### 주요 예측 문제점과 개선방안\n- **문제점**: 가우시안 모델은 갱구 부근의 제트류·지형 영향을 재현 못 함, 초기 희석 과대평가\n- **개선**: CFD 병행, 갱구 전면 일정 구간을 체적원으로 처리, 실측 검증\n\n### 저감 대책\n1. **환기탑(수직갱) 설치**: 갱구 배출을 상공으로 분산 → 유효고 증대\n2. **전기집진기·광촉매 등 터널 내 정화설비**\n3. 갱구 주변 완충녹지·방음벽 설계\n4. 저공해차 전환, 터널 내 정체 방지(교통관리)\n5. 장대터널은 **횡류식 환기**로 균등 배출\n"}]},"20":{"day":20,"date":"2026-08-20","title":"대기환경영향평가 항목과 현황조사","keywords":[{"k":"평가 대상·절차","subs":["전략환경영향평가/환경영향평가/소규모","스코핑(평가항목·범위 결정)","협의→사후환경영향조사"]},{"k":"대기 분야 평가항목","subs":["기상, 대기질, 악취","온실가스, 위해성(필요시)","공사시/운영시 구분"]},{"k":"기상 현황조사","subs":["최근 5년 기상관측자료(ASOS/AWS)","풍향·풍속·안정도·혼합고","바람장미·기상결합빈도"]},{"k":"대기질 현황조사","subs":["측정망 자료 + 현지측정","항목: PM10·PM2.5·SO₂·NO₂·CO·O₃","계절별 각 1회, 연속 24시간×N일"]},{"k":"배경농도 산정","subs":["기존 측정망 최근 3년 평균","현지측정치와 비교·검증","예측농도와 합산해 기준 비교"]}],"answer":"# 대기환경영향평가 항목과 현황조사\n\n## Ⅰ. 개요\n\n**환경영향평가**는 사업 시행이 환경에 미치는 영향을 사전에 예측·평가하여 저감방안을 마련하는 제도로, 「환경영향평가법」에 근거한다. 대기 분야는 기상·대기질·악취·온실가스를 포괄하며, 정확한 **현황조사**가 예측의 신뢰도를 좌우하므로 평가의 출발점이자 가장 중요한 단계이다.\n\n## Ⅱ. 평가 제도의 체계\n\n### 1. 3단계 체계\n\n| 구분 | 대상 | 시기 | 목적 |\n|---|---|---|---|\n| **전략환경영향평가(SEA)** | 정책계획·개발기본계획 | 계획 수립 단계 | 입지·규모의 적정성, 대안 검토 |\n| **환경영향평가(EIA)** | 17개 분야 대규모 사업 | 사업계획 확정 전 | 영향 예측·저감방안 |\n| **소규모 환경영향평가** | 보전이 필요한 지역의 소규모 사업 | 인허가 전 | 간이 평가 |\n\n### 2. 절차\n① 평가준비서 작성 → ② **스코핑(평가항목·범위 등의 결정)** — 환경영향평가협의회 심의 → ③ 초안 작성 → ④ **주민 의견수렴**(설명회·공청회) → ⑤ 평가서 작성 → ⑥ 승인기관 제출 → ⑦ **환경부 협의** → ⑧ 협의내용 반영·이행 → ⑨ **사후환경영향조사**\n\n## Ⅲ. 대기 분야 평가항목\n\n### 1. 「환경영향평가법 시행령」상 대기환경 분야\n- **기상**\n- **대기질**\n- **악취**\n- **온실가스**\n\n(대기환경 분야 외에 소음·진동, 위락·경관 등은 별도 분야)\n\n### 2. 사업 단계별 구분\n\n| 단계 | 주요 영향요인 | 평가 항목 |\n|---|---|---|\n| **공사시** | 토공·발파·차량운행·건설장비 | 비산먼지(TSP, PM10), NOx, 소음 |\n| **운영시** | 굴뚝 배출, 교통량 증가, 악취 | SO₂, NOx, PM, VOCs, 악취, 온실가스 |\n\n### 3. 항목 선정(스코핑)\n사업 특성·지역 특성을 고려하여 평가항목을 가감한다.\n- 소각·발전 사업 → 다이옥신, 중금속 추가\n- 축산·폐기물 사업 → **악취** 중점\n- 도로·터널 사업 → NO₂, PM, 재비산먼지\n- 산업단지 → **건강영향평가** 추가 (특정대기유해물질 배출 시)\n\n## Ⅳ. 기상 현황조사\n\n### 1. 조사 항목\n풍향·풍속, 기온, 습도, 강수량, 일사·운량, 대기안정도, 혼합고, 역전층, 정온율\n\n### 2. 조사 방법\n\n| 자료원 | 내용 |\n|---|---|\n| **기존 자료** | 기상청 ASOS(종관)·AWS(방재) **최근 5년** 시간별 자료 |\n| **현지 관측** | 대상지 대표성이 부족한 경우 자체 기상탑 설치(최소 1년 권장) |\n| **상층 기상** | 라디오존데 자료(혼합고 산정용) |\n\n### 3. 정리·제시 방법\n1. **바람장미(Wind Rose)**: 연간 + **계절별 4매**, 주·야간 분리\n2. **기상결합빈도(STAR)**: 풍향(16) × 풍속계급 × 안정도(6등급)\n3. **정온율** 명시 및 처리방법 기술\n4. 대기안정도 등급별 출현빈도\n5. 혼합고 일변화·계절변화\n6. **관측지점의 대표성 검토** — 대상지와의 거리·표고차·지형 비교\n\n## Ⅴ. 대기질 현황조사\n\n### 1. 조사 항목\n- **기본**: PM10, PM2.5, SO₂, NO₂, CO, O₃ (대기환경기준 6항목)\n- **사업 특성별 추가**: TSP, VOCs, 중금속(Pb, Cd 등), 다이옥신, HCl, NH₃, H₂S 등\n- **악취**: 복합악취(공기희석관능법), 지정악취물질 22종\n\n### 2. 조사 방법\n\n| 구분 | 내용 |\n|---|---|\n| **기존 자료** | 인근 대기오염측정망 **최근 3년** 자료 |\n| **현지 측정** | 계절별 각 1회(연 4회), 회당 **연속 24시간 이상**(통상 5~7일) |\n| **측정지점** | 사업지구 내·경계·주변 주거지·최대영향예상지점 등 **3~5지점 이상** |\n| **측정방법** | 「대기오염공정시험기준」 준수 |\n\n### 3. 측정지점 선정 원칙\n1. 사업으로 인한 **최대영향예상지점**(주풍 하류)\n2. 인근 **주거지·학교·병원 등 보호대상시설**\n3. **배경농도** 파악을 위한 풍상측 지점\n4. 지형·기상 특성을 대표할 수 있는 위치\n5. 주변 장애물·국지 배출원 영향 배제\n\n## Ⅵ. 배경농도(Background Concentration) 산정\n\n### 1. 개념\n사업 시행과 무관하게 이미 존재하는 대기 중 농도. **예측농도(기여농도) + 배경농도 = 총 농도**이며, 이 총 농도를 대기환경기준과 비교하여야 한다.\n\n### 2. 산정 방법\n- 인근 측정망의 **최근 3년 평균** 또는 상위 백분위 값\n- 현지측정 결과와 비교하여 타당성 검증\n- 국지 배출원의 영향이 큰 지점은 배경농도로 부적합\n- 풍상측(upwind) 측정값 활용\n\n### 3. 유의사항\n**기여농도만 환경기준과 비교하는 것은 중대한 오류**이다. 배경농도가 이미 기준의 80%를 차지하는 경우, 작은 기여농도로도 기준을 초과할 수 있다.\n\n## Ⅶ. 결론\n\n대기환경영향평가에서 현황조사는 예측·평가의 기초자료를 제공하는 핵심 단계로, **기상 5년·대기질 3년의 기존 자료와 계절별 현지측정**을 병행하여야 한다. 특히 관측지점의 대표성 검토와 배경농도의 적정 산정이 평가 신뢰도를 좌우하며, 이를 소홀히 하면 이후의 정밀한 모델링도 의미를 잃는다. 향후에는 고해상도 측정망 자료와 위성관측(GEMS) 자료를 결합하여 현황조사의 공간적 대표성을 높이는 방향으로 개선될 필요가 있다.\n","side":[{"title":"스코핑(평가항목·범위 등의 결정)","body":"### 개념\n환경영향평가를 본격 수행하기 전, **어떤 항목을 어느 범위·수준으로 평가할지 미리 정하는 절차**. 「환경영향평가법」상 정식 명칭은 \"평가항목·범위 등의 결정\"이다.\n\n### 필요성\n- 모든 항목을 획일적으로 평가하면 비용·시간 낭비\n- 사업·지역 특성상 **중요한 항목에 자원을 집중**\n- 사후 분쟁·재협의 방지\n\n### 결정 주체와 절차\n1. 사업자가 **평가준비서** 작성\n2. 승인기관장이 **환경영향평가협의회** 개최\n3. 협의회가 심의·결정 → 결과 공개\n\n### 결정 내용\n| 항목 | 내용 |\n|---|---|\n| 평가항목 | 대기질·수질·소음 등 중 실제 평가할 항목 |\n| **공간적 범위** | 영향권 설정(대기는 통상 반경 2~10km) |\n| **시간적 범위** | 공사기간, 운영 후 몇 년까지 |\n| 평가방법 | 사용할 모델, 조사 지점·횟수 |\n| 주민 의견수렴 방안 | |\n\n### 대기 분야 스코핑 시 고려\n- 특정대기유해물질 배출 → **건강영향평가** 추가 여부\n- 악취 민원 우려 지역 → 악취 항목 강화\n- 대기관리권역 내 → 총량관리 연계\n- 인근 보호대상시설(학교·병원·주거지) 유무\n\n### 의의\n스코핑이 부실하면 평가서 작성 후 항목 누락으로 **보완·재협의**가 발생하므로, 초기에 충실히 검토하는 것이 전체 일정 단축의 핵심이다.\n\n### 스코핑 결과의 구속력\n결정된 평가항목·범위는 사업자와 협의기관 모두를 구속한다. 임의로 항목을 빼면 **평가서 반려** 사유가 되고, 반대로 결정되지 않은 항목을 협의 단계에서 새로 요구하기도 어렵다.\n\n### 대기 분야 공간적 범위 설정 기준\n| 사업 유형 | 통상 영향권 |\n|---|---|\n| 도로·철도 | 노선 양측 300m~1km |\n| 산업단지 | 경계 반경 2~5km |\n| 발전소·소각시설 | 반경 5~10km (최대착지거리 포함) |\n| 택지·관광단지 | 반경 1~2km |\n\n최대착지거리가 영향권을 벗어나면 범위를 확대해야 한다.\n"},{"title":"사후환경영향조사","body":"### 정의\n협의내용이 제대로 이행되는지, 실제 환경영향이 예측과 부합하는지를 **사업 시행 중·후에 확인**하는 제도. 「환경영향평가법」 제36조.\n\n### 목적\n1. 협의내용 이행 여부 확인\n2. 예측하지 못한 영향 발견 및 조치\n3. **예측 정확도 검증** → 향후 평가 기법 개선\n4. 주민 민원 대응 근거\n\n### 대기 분야 조사 내용\n\n| 구분 | 조사 항목 | 주기 |\n|---|---|---|\n| **공사시** | 비산먼지(TSP, PM10), 소음 | 통상 분기 1회 |\n| **운영시** | PM10, PM2.5, SO₂, NO₂, 악취 | 사업 특성별 반기~연 1회 |\n| 배출시설 | 배출농도(자가측정·TMS) | 법정 주기 |\n\n### 결과 처리\n- 조사 결과를 **환경영향평가 정보지원시스템(EIASS)**에 등록·공개\n- 기준 초과 또는 예측과 현저히 다른 경우 → **저감방안 추가 시행**\n- 승인기관·환경청의 조치명령 가능\n\n### 실무상 쟁점\n1. **예측-실측 괴리**: 예측이 과대/과소한 사례가 축적되고 있으나 환류(feedback)가 부족\n2. 조사 지점·주기가 형식적으로 운영되는 경우\n3. 배경농도 변화(주변 개발)를 반영하지 못함\n\n### 개선방향\n사후조사 결과를 DB화하여 **모델 검증·배출계수 보정**에 활용하고, 예측 정확도가 낮은 항목은 평가기법을 개선하는 환류체계 구축이 필요하다.\n\n### 조사 결과의 활용 사례\n- 예측 대비 실측이 크게 낮으면 → 배출계수·가동률 가정이 보수적이었음\n- 예측보다 실측이 높으면 → 누락 배출원, 배경농도 상승, 모델 부적합 의심\n- 특정 풍향에서만 초과 → **오염장미(CPF)**로 원인 배출원 규명\n\n### 관련 시스템\n**EIASS**(환경영향평가정보지원시스템, eiass.go.kr)에서 협의내용·평가서·사후조사 결과를 공개하며, 유사 사업의 평가 사례를 검색할 수 있어 실무 참고자료로 유용하다.\n"}]},"21":{"day":21,"date":"2026-08-21","title":"대기환경영향평가 예측·저감방안","keywords":[{"k":"예측 절차","subs":["배출량 산정 → 모델 선정 → 수행","기여농도 + 배경농도 = 총농도","환경기준과 비교"]},{"k":"배출량 산정","subs":["공사시: 건설장비·비산먼지 배출계수","운영시: 시설 제원·배출허용기준","AP-42, CAPSS 배출계수"]},{"k":"예측 결과 제시","subs":["최대영향예상지점·최대착지거리","단기(1h/24h)·장기(연평균)","등농도선도 GIS 중첩"]},{"k":"공사시 저감방안","subs":["방진벽·세륜시설·살수","저공해 건설기계, 공정 조정","가설방음벽 병행"]},{"k":"운영시 저감방안","subs":["방지시설 고도화(BAT)","청정연료 전환·굴뚝 상향","완충녹지, 총량 상쇄"]}],"answer":"# 대기환경영향평가 예측·저감방안\n\n## Ⅰ. 개요\n\n현황조사로 기초자료가 확보되면, 사업 시행에 따른 오염물질 **배출량을 산정**하고 **확산모델로 농도를 예측**한 뒤, 배경농도를 합산하여 **환경기준과 비교**한다. 기준 초과가 예상되거나 영향이 유의미한 경우에는 **저감방안**을 수립하고 그 효과를 재예측하여야 하며, 이것이 대기환경영향평가의 핵심 과정이다.\n\n## Ⅱ. 배출량 산정\n\n### 1. 기본식\n**배출량 = 활동도(Activity) × 배출계수(EF) × (1 − 제거효율)**\n\n### 2. 공사시 배출량\n\n| 발생원 | 산정 방법 |\n|---|---|\n| **비산먼지** | EPA AP-42 공정별 배출계수 (굴착·상차·운반·야적·풍식) |\n| 건설장비 | 장비별 정격출력 × 가동시간 × 배출계수(NOx, PM) |\n| 공사차량 | 주행거리 × 차종별 배출계수 + 재비산먼지 |\n| 발파 | 폭약량 × 배출계수 |\n\n**AP-42 야적장 풍식 배출식(예)**: E = k·(s/1.5)·(365−p)/235·(f/15) 형태로 실트함량(s), 강수일수(p), 풍속초과빈도(f)를 반영\n\n### 3. 운영시 배출량\n- **점원(굴뚝)**: 시설 설계제원 + **배출허용기준** 또는 유사시설 실측치. 배출량 = 배출가스량 × 농도\n- **선원(도로)**: 예측 교통량 × 차종별 배출계수(CAPSS, MOVES)\n- **면원**: 저장시설·야적장 면적 × 단위 배출계수\n- **온실가스**: 「온실가스 목표관리 운영 등에 관한 지침」의 Tier 1~3 방법\n\n## Ⅲ. 예측 방법\n\n### 1. 모델 선정\n| 조건 | 모델 |\n|---|---|\n| 평탄·근거리·점원 | **AERMOD** (기본 권장) |\n| 복잡지형·해안·저풍속·장거리 | **CALPUFF** |\n| 2차 생성(O₃, PM2.5) | CMAQ 등 광화학 모델 |\n| 도로·터널 | CALINE4, RLINE, CFD |\n| 간이 검토 | 스크리닝 모델 |\n\n### 2. 입력자료\n기상(1년 이상 시간별), 지형(DEM), 배출원 제원(위치·높이·직경·온도·유속·배출률), 건물 제원(BPIP), 수용점 격자(사업지 중심 반경 2~10km, 격자 간격 100~500m)\n\n### 3. 예측 시나리오\n- **공사시** / **운영시** 구분\n- **저감방안 적용 전 / 후**\n- 최악 기상조건 포함\n- 누적영향: 주변 기존·계획 사업 포함\n\n### 4. 결과 제시 항목\n\n| 항목 | 제시 내용 |\n|---|---|\n| 최대영향예상지점 | 위치·거리·방위 |\n| 기여농도 | 1시간, 24시간, 연평균 최대치 |\n| **배경농도** | 인근 측정망 실측치 |\n| **총 농도** | 기여 + 배경 → **환경기준과 비교** |\n| 등농도선도 | GIS 중첩(주거지·보호시설 표시) |\n| 보호대상시설 영향 | 학교·병원 등 지점별 농도 |\n\n## Ⅳ. 공사시 저감방안\n\n### 1. 비산먼지 억제 (「대기환경보전법 시행규칙」 별표14 기준)\n\n| 공정 | 억제시설·조치 |\n|---|---|\n| **야적** | 방진덮개, **방진벽(높이 야적 높이 이상)**, 방진망, 살수 |\n| **싣기·내리기** | 살수, 집진시설, 낙하높이 최소화, 풍속 8m/s 이상 시 작업중지 |\n| **수송** | **세륜·세차시설**, 적재함 덮개, 적재높이 제한, 운행속도 제한(20km/h) |\n| **이송(컨베이어)** | 밀폐, 집진시설, 살수 |\n| **파쇄·분쇄** | 살수, 집진, 밀폐 |\n| **채광·채취** | 살수, 방진벽 |\n\n### 2. 건설장비·차량\n- **저공해 건설기계 사용 의무**(대기관리권역 내 100억 원 이상 관급공사)\n- DPF 부착·엔진 교체, 노후 건설기계 사용 제한\n- 공회전 제한, 저유황 연료 사용\n- 공사 시기·공정 조정(고농도 계절 회피)\n\n### 3. 기타\n가설방음벽 겸용 방진벽, 이동식 살수차 운영, 공사장 출입구 자동 살수시설, 미세먼지 계절관리제 기간 중 공사시간 조정\n\n## Ⅴ. 운영시 저감방안\n\n### 1. 배출원 저감(우선순위 1)\n- **최적가용기법(BAT) 적용**: 통합환경허가 대상 시설\n- 방지시설 고도화: 백필터·전기집진기 + SCR + 탈황\n- **청정연료 전환**: 벙커C유 → LNG, 저황유\n- 공정 개선·원단위 저감\n\n### 2. 배출조건 개선\n- **굴뚝높이 상향** (GEP 준수, 역전층 고려)\n- 배출가스 온도·토출속도 확보(유효고 증대)\n- 다중관 굴뚝으로 부력 증대\n\n### 3. 입지·배치 계획\n- 배출시설을 주거지 **풍하 반대편**에 배치\n- 완충녹지·수림대 조성\n- 이격거리 확보\n\n### 4. 제도적 수단\n- **대기관리권역 총량관리**: 배출허용총량 할당·거래\n- 자발적 협약, 주변 노후시설 상쇄(offset)\n- TMS 부착·실시간 공개\n\n### 5. 사후관리\n사후환경영향조사, 주민 감시체계(민관협의체), 비상저감조치 시 가동률 조정\n\n## Ⅵ. 결론\n\n대기환경영향평가의 예측은 배출량 산정의 정확도와 모델 선정의 적정성에 좌우되며, **반드시 배경농도를 합산한 총 농도를 환경기준과 비교**하여야 한다. 저감방안은 굴뚝높이 상향 등 희석 위주가 아니라 **BAT 적용·연료전환 등 배출량 자체의 저감**을 우선하여야 하며, 공사시에는 비산먼지 억제시설의 실질적 운영이 관건이다. 아울러 사후환경영향조사 결과를 예측기법 개선에 환류하는 체계가 정착되어야 평가의 실효성이 확보될 것이다.\n","side":[{"title":"비산먼지 발생사업 신고와 억제시설 기준","body":"### 근거\n「대기환경보전법」제43조 및 시행규칙 별표13·14\n\n### 신고 대상 사업 (11개 업종)\n시멘트·석회·플라스터 및 그 제품 제조업, **건설업**, 비금속물질 채취·처리업, 제1차 금속제조업, 비료·사료제품 제조업, 코크스·연탄 제조업, 석유정제·화학제품 제조업, 목재·나무제품 제조업, 운송장비 제조업, 폐기물 매립시설·처리업, 그 밖의 대통령령으로 정하는 사업\n\n### 신고 절차\n사업 시행 전 **관할 시장·군수·구청장에게 신고** → 억제시설 설치·조치계획 제출 → 변경 시 변경신고\n\n### 주요 억제시설 기준\n| 공정 | 기준 요약 |\n|---|---|\n| 야적 | 야적물 높이보다 **1m 이상 높은 방진벽**, 최고 저장높이의 1/3 이상 방진망 |\n| 싣기·내리기 | 상·하차 시 **살수**, 풍속 8m/s 이상 시 작업 중지 |\n| 수송 | **세륜시설(자동식 권장)**, 적재함 덮개, 적재높이 이하 적재, 출입구 살수 |\n| 이송 | 컨베이어 **덮개 설치**, 하부 살수 또는 집진 |\n| 채광·채취 | 발파 시 사전 살수, 방진벽 |\n\n### 위반 시 조치\n개선명령 → 사용중지 → 조업정지, 과태료·벌칙. 특히 세륜시설 미가동·덮개 미설치는 단속 빈도가 높다.\n\n### 실무 팁\n환경영향평가 협의내용에 억제시설 사양을 구체적으로 명시하고, **사진대장·살수일지 등 이행 증빙**을 관리하는 것이 분쟁 예방에 효과적이다.\n\n### 세륜시설의 종류\n| 방식 | 특징 |\n|---|---|\n| **자동식(터널형)** | 차량 통과 시 자동 분사. 대형 현장 표준 |\n| 수조식 | 물웅덩이 통과. 세척력 낮음 |\n| 노즐식(수동) | 인력 살수. 소규모 현장 |\n\n자동식은 **측면 살수 + 하부 살수 + 침전조 + 순환수 재이용**을 갖추어야 하며, 침전물의 적기 준설이 성능 유지의 관건이다.\n\n### 단속 시 주요 지적사항\n1. 세륜시설 전원 차단·미가동\n2. 적재함 덮개 미설치 또는 파손\n3. 방진벽 높이 미달\n4. 살수 미실시(특히 겨울철 동파 이유)\n5. 야적물 방진망 미피복\n"},{"title":"저공해 건설기계와 대기관리권역법","body":"### 배경\n건설기계·농기계 등 **비도로 이동오염원**은 배출가스 규제가 자동차보다 늦게 도입되어 노후 장비의 NOx·PM 배출 기여도가 크다. CAPSS 기준 비도로이동오염원의 PM2.5 기여가 상당하다.\n\n### 「대기관리권역의 대기환경개선에 관한 특별법」상 의무\n- **대기관리권역 내에서 발주하는 100억 원 이상 관급공사**는 **저공해 건설기계 사용 의무**\n- 대상 기종: 굴착기, 지게차, 덤프트럭, 콘크리트 믹서트럭 등\n- 저공해 조치: **DPF 부착**, 엔진 교체, 신형(Tier-4 이상) 장비 사용\n\n### 대기관리권역\n수도권·중부권·남부권·동남권 4개 권역으로 지정되어 있으며, 권역 내에서는\n1. 사업장 **배출허용총량 할당**\n2. 저공해 자동차·건설기계 의무\n3. 배출가스 5등급 차량 운행제한\n4. 가정용 저녹스보일러 보급\n등의 강화된 규제가 적용된다.\n\n### 환경영향평가에서의 반영\n- 대기관리권역 내 사업은 **총량관리 대상 여부**를 확인하고 할당량 확보 계획을 제시\n- 공사시 저감방안에 저공해 건설기계 투입 비율을 구체적 수치로 명시\n- 협의내용 이행 점검 시 장비 목록·저공해 조치 증빙 제출\n\n### 효과와 한계\n저공해 조치로 PM은 큰 폭 저감되나 **NOx 저감 효과는 제한적**이며, 임대 장비 위주의 건설현장 특성상 이행 관리가 어렵다는 지적이 있다.\n\n### 저공해 조치 방법별 비교\n| 조치 | PM 저감 | NOx 저감 | 비용 |\n|---|---|---|---|\n| **DPF 부착** | 80% 이상 | 미미 | 중 |\n| DPF+SCR 복합 | 80% 이상 | 60~80% | 고 |\n| 엔진 교체 | 높음 | 중간 | 고 |\n| 신형(Tier-4f) 장비 | 매우 높음 | 높음 | 최고 |\n\n### 확인 방법\n건설기계에 부착된 **저공해조치 확인표지**와 등록증으로 확인하며, 대기관리권역 내 공사는 감독기관이 현장 점검을 실시한다.\n"}]},"22":{"day":22,"date":"2026-08-22","title":"건강영향평가와 산업단지 적정성","keywords":[{"k":"건강영향평가(HIA)","subs":["환경영향평가 내 절차로 시행","특정대기유해물질 배출 사업 대상","위해도(Risk) 정량 평가"]},{"k":"위해성평가 4단계","subs":["유해성 확인 → 용량-반응 평가","노출평가 → 위해도 결정","US EPA 4-step 체계"]},{"k":"발암·비발암 지표","subs":["발암위해도 ECR, 기준 10⁻⁶~10⁻⁴","비발암 위해지수 HQ·HI < 1","호흡단위위해도(IUR)·참고치(RfC)"]},{"k":"대상 사업","subs":["산업단지, 화력발전, 소각·매립","특정대기유해물질 배출시설","도시개발(일정 규모 이상)"]},{"k":"적정성 평가","subs":["입지·규모·배치의 타당성","완충녹지·이격거리","126회 25점 기출"]}],"answer":"# 건강영향평가와 산업단지 적정성\n\n## Ⅰ. 개요\n\n**건강영향평가(HIA, Health Impact Assessment)**는 개발사업이 주민 건강에 미치는 영향을 사전에 예측·평가하고 저감방안을 마련하는 제도로, 국내에서는 별도 법이 아니라 **환경영향평가의 한 절차**로 시행된다. 종래의 환경영향평가가 오염물질 농도를 환경기준과 비교하는 데 그쳤다면, 건강영향평가는 **그 농도에서 주민이 실제로 얼마나 위해를 입는가**를 정량화한다는 점에서 진일보한 방법이다. 126회에서 \"산업단지 건강영향평가 계획 적정성 평가방안\"이 25점으로 출제되었다.\n\n## Ⅱ. 제도 개요\n\n### 1. 근거\n「환경보건법」제13조 및 「환경영향평가법」. 환경영향평가서에 **건강영향 항목을 추가하여 검토**하는 방식으로 운영된다.\n\n### 2. 대상 사업\n\n| 구분 | 대상 |\n|---|---|\n| **산업단지** 조성 | 특정대기유해물질 배출시설 입주 예정 |\n| **에너지 개발** | 화력발전소 등 |\n| **폐기물 처리시설** | 소각시설, 매립시설 |\n| **가축분뇨 처리시설** | |\n| 도시개발 | 일정 규모 이상 |\n\n핵심 기준은 **특정대기유해물질 또는 악취 배출 여부**이다.\n\n### 3. 평가 대상 물질\n「대기환경보전법」상 **특정대기유해물질**(벤젠, 포름알데히드, 1,3-부타디엔, 염화비닐, 6가크롬, 카드뮴, 비소, 니켈, 다이옥신 등) 중 사업 특성상 배출이 예상되는 물질과, 악취·미세먼지 등.\n\n## Ⅲ. 위해성평가 4단계\n\n미국 EPA의 표준 체계를 따른다.\n\n### 1. 유해성 확인(Hazard Identification)\n대상 물질이 어떤 건강영향(발암성·호흡기·신경독성 등)을 일으키는지 문헌·독성자료로 확인.\n- IARC 발암등급(Group 1, 2A, 2B), EPA 발암분류 참조\n\n### 2. 용량-반응 평가(Dose-Response Assessment)\n노출량과 건강영향 발생 확률의 정량 관계를 도출.\n\n| 구분 | 지표 | 의미 |\n|---|---|---|\n| **발암** | **IUR**(호흡단위위해도, Inhalation Unit Risk) [㎍/m³]⁻¹ | 평생 1㎍/m³ 노출 시 초과 암 발생 확률 |\n| **비발암** | **RfC**(호흡노출참고치, Reference Concentration) [mg/m³] | 평생 노출해도 유해영향이 없을 것으로 기대되는 농도 |\n\n(최근 기출 용어: \"호흡노출참고치, 호흡단위위해도\")\n\n### 3. 노출평가(Exposure Assessment)\n확산모델로 예측한 농도와 인구·행동 특성을 결합해 실제 노출농도를 산정.\n\n**EC = (C × ET × EF × ED) / AT**\n- C: 대기 중 농도, ET: 노출시간, EF: 노출빈도(일/년), ED: 노출기간(년), AT: 평균시간\n- 일반적으로 **주거지 24시간 노출, 70년(평생)** 가정\n\n### 4. 위해도 결정(Risk Characterization)\n\n**(1) 발암위해도(ECR, Excess Cancer Risk)**\n**ECR = EC × IUR**\n\n| 값 | 판정 |\n|---|---|\n| ECR < 10⁻⁶ | 무시할 수준 |\n| 10⁻⁶ ~ 10⁻⁴ | **관리 필요 구간**(국내 통상 판단 기준) |\n| ECR > 10⁻⁴ | 저감대책 필수 |\n\n10⁻⁶은 \"평생 노출 시 100만 명 중 1명의 초과 암 발생\"을 의미한다.\n\n**(2) 비발암 위해지수**\n**HQ(Hazard Quotient) = EC / RfC**\n**HI(Hazard Index) = Σ HQᵢ** (동일 표적장기 물질의 합)\n\n**HQ, HI < 1이면 유해영향 우려 없음**으로 판정한다.\n\n## Ⅳ. 산업단지 계획 적정성 평가\n\n### 1. 평가 관점\n단순히 기준 충족 여부가 아니라, **입지 자체가 타당한가**를 검토한다.\n\n| 항목 | 검토 내용 |\n|---|---|\n| **입지 적정성** | 주거지·학교·병원 등 보호대상시설과의 거리, 주풍향과의 관계, 지형(분지·계곡 회피) |\n| **규모 적정성** | 지역 대기환경용량 대비 배출총량, 대기관리권역 총량 할당 가능 여부 |\n| **배치 적정성** | 오염물질 다량 배출 업종을 주거지 **풍하 반대편**에 배치, 완충녹지 폭 |\n| **업종 적정성** | 특정대기유해물질 배출업종 입주 제한, 업종 제한 계획의 실효성 |\n| **저감계획** | BAT 적용, 공동 방지시설, 통합관리 |\n| **모니터링** | 측정망 설치, 주민 참여 감시체계 |\n\n### 2. 누적영향 평가\n기존 산업단지·주변 배출원을 포함한 **누적 농도**로 평가하여야 한다. 신규 사업만 평가하면 이미 포화된 지역의 문제를 놓친다.\n\n### 3. 주민 참여\n설명회·공청회, 민관협의체 구성, 평가 과정 정보공개가 수용성 확보의 핵심이다.\n\n## Ⅴ. 저감 및 관리방안\n\n1. **입지 단계**: 이격거리 확보, 완충녹지(폭 50~100m 이상) 조성, 배치 조정\n2. **업종 관리**: 특정대기유해물질 다량 배출업종 입주 제한, 입주 심의\n3. **배출 저감**: BAT 적용 의무화, 공동 방지시설·집단에너지, LDAR 시행\n4. **총량 관리**: 대기관리권역 배출허용총량 할당, 기존 시설 상쇄\n5. **모니터링**: 유해대기물질 측정망, TMS, 실시간 공개\n6. **건강 모니터링**: 주민 건강영향 추적조사, 환경보건센터 연계\n\n## Ⅵ. 한계와 개선방향\n\n1. **독성자료 부족**: 국내 실측 IUR·RfC가 없어 미국 EPA IRIS 값을 차용 → 인구집단 차이 미반영\n2. **노출평가 불확실성**: 확산모델 오차, 실내 노출·복합노출 미고려\n3. **복합노출**: 다수 물질 동시 노출의 상승작용 평가 곤란\n4. **민감계층**: 어린이·노인·기저질환자에 대한 별도 고려 미흡\n5. **사후 검증 부재**: 예측 위해도와 실제 건강영향의 비교 연구 부족\n\n→ 국내 독성DB 구축, 복합노출 평가기법 개발, 환경보건 감시체계와의 연계 강화가 필요하다.\n\n## Ⅶ. 결론\n\n건강영향평가는 오염물질 농도 중심의 평가를 **주민 건강 위해도 중심**으로 전환한 제도로, 위해성평가 4단계를 통해 발암위해도(ECR 10⁻⁶ 기준)와 비발암 위해지수(HI < 1)를 산정한다. 산업단지 계획의 적정성은 기준 충족 여부만이 아니라 **입지·규모·배치·업종의 타당성과 누적영향**을 종합적으로 검토하여야 하며, 평가 결과를 실질적인 입지·업종 제한으로 연결하고 사후 건강 모니터링과 환류하는 체계가 정착되어야 제도의 실효성이 확보될 것이다.\n","side":[{"title":"특정대기유해물질과 유해성대기감시물질","body":"### 3가지 개념 구분 (120회 10점 기출)\n\n| 구분 | 정의 | 개수 | 근거 |\n|---|---|---|---|\n| **대기오염물질** | 대기오염의 원인이 되는 가스·입자상 물질 | 60여 종 | 대기환경보전법 시행규칙 별표1 |\n| **유해성대기감시물질** | 대기오염물질 중 사람 건강·동식물에 **해를 끼칠 수 있어 지속 관찰이 필요**한 물질 | 40여 종 | 별표1의2 |\n| **특정대기유해물질** | 유해성대기감시물질 중 **저농도에서도 장기 노출 시 위해성이 인정**되는 물질 | **35종** | 별표2 |\n\n포함 관계: **대기오염물질 ⊃ 유해성대기감시물질 ⊃ 특정대기유해물질**\n\n### 특정대기유해물질 주요 예시\n카드뮴, 시안화수소, 납, 폴리염화비페닐, 크롬(6가), 비소, 수은, 프로필렌옥사이드, 염소, 벤젠, 사염화탄소, 클로로포름, **포름알데히드**, 아세트알데히드, **1,3-부타디엔**, 다이옥신, 니켈, 에틸렌옥사이드, 염화비닐 등\n\n### 규제상 의미\n1. 특정대기유해물질 배출시설은 **배출허용기준이 별도로 엄격**하게 설정\n2. **설치 제한지역** 지정 가능 (주거지역 인근 등)\n3. **건강영향평가** 대상 판단 기준\n4. 통합환경허가 시 중점 관리\n5. 배출시설 설치허가 시 특별 심사\n\n### 답안 작성 팁\n세 개념의 **포함관계를 그림(동심원)으로 표현**하면 명확하고, 각 개수와 근거 조문을 함께 쓰면 완결성이 높다.\n\n### 배출허용기준의 구조\n| 종류 | 설정 주체 | 성격 |\n|---|---|---|\n| 일반 배출허용기준 | 환경부령 | 전국 공통 |\n| **엄격한 배출허용기준** | 시·도 조례 | 지역 실정 반영, 일반기준보다 강화 |\n| **특별대책지역 기준** | 환경부장관 | 특별대책지역 |\n| 총량기준 | 대기관리권역 | 농도 아닌 **총량** 규제 |\n\n특정대기유해물질은 일반 기준과 별도로 규정되며, 배출시설 설치 시 **주거지역 등에서 설치 제한**을 받을 수 있다.\n"},{"title":"위해성평가 계산 예제","body":"### 문제\n어느 산업단지 인근 주거지의 벤젠 예측 연평균 농도가 **2.0 ㎍/m³**이다. 발암위해도를 산정하고 판정하시오.\n(벤젠 IUR = 7.8×10⁻⁶ (㎍/m³)⁻¹, 노출 24시간/일, 350일/년, 30년, 평균시간 70년)\n\n### 풀이\n**1) 노출농도(EC) 산정**\nEC = C × (ET/24) × (EF/365) × (ED/AT)\n  = 2.0 × (24/24) × (350/365) × (30/70)\n  = 2.0 × 1.0 × 0.959 × 0.4286\n  = **0.822 ㎍/m³**\n\n**2) 발암위해도(ECR)**\nECR = EC × IUR = 0.822 × 7.8×10⁻⁶\n  = **6.4 × 10⁻⁶**\n\n**3) 판정**\n10⁻⁶ < 6.4×10⁻⁶ < 10⁻⁴ → **관리 필요 구간**\n→ 저감대책 수립 및 지속 모니터링 필요\n\n### 비발암 예제 (동일 농도, RfC = 0.03 mg/m³ = 30 ㎍/m³)\nHQ = EC / RfC = 0.822 / 30 = **0.027 < 1** → 비발암 유해영향 우려 없음\n\n### 답안 작성 시 유의\n1. **단위 통일**(㎍/m³ vs mg/m³) — 가장 흔한 실수\n2. 노출계수(ET·EF·ED·AT)의 가정을 명시\n3. 결과를 **판정 기준과 비교**하여 결론 제시\n4. 불확실성(모델 오차, 독성값 출처)을 한 줄 언급하면 완성도가 높다\n"}]},"23":{"day":23,"date":"2026-08-23","title":"대기오염물질의 자연적 제거기작","keywords":[{"k":"건성침적(Dry Deposition)","subs":["강수 없이 지표면에 침착","Vd = 1/(Ra+Rb+Rc)","중력침강·관성충돌·확산"]},{"k":"습성침적(Wet Deposition)","subs":["Rainout(구름내)·Washout(구름밑)","세정계수 Λ, C=C₀e^(−Λt)","산성비의 주 경로"]},{"k":"화학적 변환","subs":["OH 라디칼에 의한 산화","광분해(photolysis)","SO₂→SO₄²⁻, NOx→NO₃⁻"]},{"k":"체류시간","subs":["τ = 1/(k건성+k습성+k화학)","NOx 1일, SO₂ 2~4일","CO₂ 수백년, CFC 수십~백년"]},{"k":"기타 기작","subs":["난류확산에 의한 희석","식물 흡수(기공)·표면 흡착","해양 흡수"]}],"answer":"# 대기오염물질의 자연적 제거기작\n\n## Ⅰ. 개요\n\n대기 중으로 배출된 오염물질은 무한히 축적되지 않고 **침적·화학변환·확산희석**의 자연적 기작에 의해 제거된다. 제거 속도는 물질별로 크게 달라 **대기 중 체류시간(residence time)**을 결정하며, 이는 곧 **국지 오염물질인가 광역·전지구 오염물질인가**를 가르는 기준이 된다. 117회에서 \"대기오염물질의 자연적인 제거기작 4가지\"가 10점으로 출제되었다.\n\n## Ⅱ. 제거기작의 분류\n\n```\n자연적 제거기작\n├─ 물리적 제거\n│   ├─ 건성침적(Dry Deposition)\n│   ├─ 습성침적(Wet Deposition) — Rainout, Washout\n│   └─ 확산·희석 (실질 제거는 아님)\n└─ 화학적 제거\n    ├─ 광화학 반응·광분해\n    ├─ OH 라디칼 등에 의한 산화\n    └─ 상변화(가스 → 입자, gas-to-particle conversion)\n```\n\n## Ⅲ. 건성침적(Dry Deposition)\n\n### 1. 정의\n강수의 매개 없이 오염물질이 **직접 지표면(토양·식생·수면·구조물)에 침착**되는 현상. 116회 10점으로 \"세정효과(washout), 건성침적(dry deposition)\"이 출제되었다.\n\n### 2. 기작\n| 입경 | 지배 기작 |\n|---|---|\n| **> 10 ㎛** | **중력 침강**(Stokes 종말속도) |\n| 1~10 ㎛ | 관성 충돌(impaction), 차단(interception) |\n| **< 0.1 ㎛** | **브라운 확산**(Brownian diffusion) |\n| 가스상 | 난류확산 + 표면 흡수(기공·수막) |\n\n**0.1~1 ㎛ 구간은 어느 기작도 효율적이지 않아 침적속도가 최소**가 되며, 이 때문에 축적모드(accumulation mode) 입자가 대기 중에 오래 머물고 장거리 이송된다.\n\n### 3. 침적속도(Deposition Velocity, Vd)\n**F = Vd × C**  (F: 침적플럭스 [㎍/m²·s], C: 농도 [㎍/m³])\n\n**저항 모형(Resistance Model)**\n**Vd = 1 / (Ra + Rb + Rc)** (+ 중력침강 항)\n\n| 저항 | 의미 | 영향인자 |\n|---|---|---|\n| **Ra** (공기역학저항) | 대기 난류를 통한 수송 | **마찰속도 u\\***, 안정도 |\n| **Rb** (경계층저항) | 준층류 경계층 통과 | 분자확산계수, u\\* |\n| **Rc** (표면저항) | 표면에서의 흡수·반응 | 식생 기공, 습윤도, 물질 용해도 |\n\n### 4. 물질별 Vd 예시\n| 물질 | Vd (cm/s) |\n|---|---|\n| SO₂ | 0.3~1.0 |\n| NO₂ | 0.1~0.5 |\n| HNO₃ | 1~5 (매우 큼) |\n| O₃ | 0.2~0.8 |\n| PM2.5 | 0.05~0.2 (최소) |\n| PM10 | 0.5~2 |\n\n## Ⅳ. 습성침적(Wet Deposition)\n\n### 1. Rainout(구름 내 세정, In-cloud scavenging)\n- 오염물질이 **구름 형성 과정에 참여**하여 제거\n- 에어로졸이 **응결핵(CCN)**으로 작용하거나, 가스가 구름물방울에 용해 후 액상 산화\n- **SO₂ → (액상 H₂O₂·O₃ 산화) → SO₄²⁻**: 산성비의 핵심 경로\n- 제거 효율이 매우 높음\n\n### 2. Washout(구름 밑 세정, Below-cloud scavenging)\n- 낙하하는 **빗방울이 대기 중 오염물질을 포획**하며 제거\n- 관성충돌·차단·확산에 의해 입자를 쓸어내림\n- 굵은 입자에 효과적, 세립자(0.1~1㎛)에는 비효율\n\n### 3. 세정계수(Scavenging Coefficient, Λ)\n**dC/dt = −Λ·C  →  C = C₀ · exp(−Λt)**\n\n- Λ ≈ a·I^b (I: 강수강도 mm/h,
