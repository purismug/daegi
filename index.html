 a·b는 물질·입경별 상수)\n- 통상 Λ = 10⁻⁵ ~ 10⁻³ s⁻¹\n- 강수 시 반감기가 수십 분~수 시간으로 급감\n\n### 4. 기여도\n연간 기준 습성침적이 전체 제거의 **50~80%**를 차지하는 물질이 많으며, 특히 수용성이 큰 SO₄²⁻·NO₃⁻·NH₄⁺에서 지배적이다.\n\n## Ⅴ. 화학적 변환\n\n### 1. OH 라디칼 — \"대기의 세제(detergent)\"\n주간에 O₃ 광분해로 생성된 O(¹D)가 수증기와 반응해 생성된다.\n- O₃ + hν(λ<310nm) → O(¹D) + O₂\n- O(¹D) + H₂O → **2·OH**\n\nOH는 대부분의 대기오염물질(CO, CH₄, VOC, SO₂, NO₂)과 반응하여 산화·제거한다.\n- SO₂ + OH → ... → **H₂SO₄** (황산염)\n- NO₂ + OH → **HNO₃** (질산염)\n- CH₄ + OH → ... (메탄의 주 소멸 경로)\n\n### 2. 광분해(Photolysis)\nNO₂, 알데히드, 케톤, 유기과산화물 등이 자외선을 흡수해 분해된다.\n- NO₂ + hν → NO + O (오존 생성의 출발)\n\n### 3. 가스-입자 전환\n가스상 전구물질이 산화되어 저휘발성 물질이 되면 응결·응집하여 **2차 입자**를 형성한다. 이는 제거라기보다 **형태 변환**이며, 이후 침적으로 최종 제거된다.\n\n## Ⅵ. 대기 체류시간\n\n**τ = M / F = 1/(k_건성 + k_습성 + k_화학)**  (M: 대기 중 총량, F: 제거율)\n\n| 물질 | 체류시간 | 규모 |\n|---|---|---|\n| NOx | 약 1일 | 국지~지역 |\n| SO₂ | 2~4일 | 지역 |\n| PM2.5 | 3~10일 | 지역~대륙(장거리 이송) |\n| CO | 1~3개월 | 반구 |\n| CH₄ | 약 9~12년 | 전지구 |\n| N₂O | 약 120년 | 전지구 |\n| CFC-11 | 약 45~55년 | 전지구 |\n| CO₂ | 수백~수천 년(다중 시상수) | 전지구 |\n\n**체류시간이 길수록 공간적으로 균일하게 분포**하며, 그래서 온실가스는 배출 위치와 무관하게 전지구적 문제가 된다.\n\n## Ⅶ. 대기환경 관리적 의의\n\n1. **장거리 이송**: PM2.5의 체류시간이 수일이므로 국경을 넘어 이동 → 동북아 협력·CLRTAP의 근거\n2. **산성비**: 습성침적이 산성물질을 지표로 운반 → 임계부하량·PAI 개념\n3. **확산모델**: 근거리 모델은 침적을 무시할 수 있으나, 장거리 모델(CALPUFF·CMAQ)은 반드시 침적·화학변환을 포함\n4. **온실가스 정책**: 체류시간이 GWP 산정의 핵심 변수. CH₄은 짧아 단기 감축 효과가 크고, CO₂는 길어 누적배출이 중요\n5. **오존층**: ODS의 긴 체류시간 때문에 배출 중단 후에도 회복에 수십 년 소요\n\n## Ⅷ. 결론\n\n대기오염물질의 자연적 제거는 **건성침적·습성침적·화학변환**의 세 기작으로 이루어지며, 여기에 확산에 의한 희석이 더해진다. 특히 0.1~1㎛ 축적모드 입자는 어느 침적기작으로도 잘 제거되지 않아 체류시간이 길고 장거리 이송되므로, PM2.5 관리는 국내 저감만으로 완결될 수 없고 국제 협력이 병행되어야 한다. 자연적 제거능력은 유한하므로 결국 **배출 저감이 유일한 근본 대책**이라는 점을 명확히 인식할 필요가 있다.\n","side":[{"title":"산성비의 침적 형태와 임계부하량","body":"### 산성 침적의 두 경로\n| 형태 | 물질 | 특징 |\n|---|---|---|\n| **습성침적** | H₂SO₄, HNO₃ 용해된 강수 | pH 5.6 미만을 산성비로 정의 |\n| **건성침적** | SO₂, NO₂, HNO₃ 가스 / SO₄²⁻, NO₃⁻ 입자 | 강수 없는 기간에도 지속. 산림에서는 습성보다 클 수 있음 |\n\n**총 산성침적 = 습성 + 건성**이므로 산성비만 측정해서는 실제 부하를 알 수 없다.\n\n### pH 5.6의 근거\n청정 대기의 CO₂(약 400ppm)가 빗물에 용해되어 탄산을 형성할 때의 평형 pH.\nCO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻\n\n### PAI(Potential Acid Input, 잠재 산부하량)\n**PAI = (SO₄²⁻ + NO₃⁻ + NH₄⁺ 침적당량) − (Ca²⁺ + Mg²⁺ + K⁺ + Na⁺ 염기양이온 침적당량)**\n\n- 단위: keq/ha·yr\n- NH₄⁺가 산부하에 포함되는 이유: 토양에서 질산화되며 H⁺를 방출하기 때문\n- 값이 클수록 토양·수계 산성화 위험 증가\n\n### 임계부하량(Critical Load)\n생태계에 장기적 유해영향을 주지 않는 침적량의 상한. **초과분(Exceedance) = 실제 침적 − 임계부하**로 관리 목표를 설정하며, 유럽 CLRTAP 체제에서 국가별 감축의무 배분의 과학적 근거로 사용된다.\n\n### 국내 현황\nEANET(동아시아 산성강하물 모니터링 네트워크)에 참여하여 습·건성 침적을 관측하고 있으며, 강원·경기 일부 산림토양의 산성화가 보고되고 있다.\n"},{"title":"OH 라디칼과 대기 산화능","body":"### 왜 \"대기의 세제\"인가\nOH 라디칼은 반응성이 극히 커서 대류권에 배출된 거의 모든 환원성 물질을 산화·제거한다. **대기 자정능력의 핵심**이다.\n\n### 생성 경로\n**주간 주 경로**\n1. O₃ + hν (λ < 310 nm) → O(¹D) + O₂\n2. O(¹D) + H₂O → 2·OH\n\n**부차 경로**: HONO 광분해, 알켄-오존 반응, H₂O₂ 광분해\n\n### 특성\n| 항목 | 값 |\n|---|---|\n| 대기 중 농도 | 약 10⁶ molecules/cm³ (극미량) |\n| 수명 | **1초 미만** |\n| 일변화 | 정오 최대, 야간 거의 0 |\n| 계절변화 | 여름 최대(일사·수증기) |\n\n### 주요 반응과 대기환경 의의\n| 반응 | 생성물 | 의의 |\n|---|---|---|\n| SO₂ + OH → | H₂SO₄ | **황산염 2차 입자**, 산성비 |\n| NO₂ + OH → | HNO₃ | **질산염 2차 입자** |\n| VOC + OH → | RO₂ → 오존 생성 | **광화학 스모그** |\n| CH₄ + OH → | CO, CO₂ | 메탄 소멸(체류시간 결정) |\n| CO + OH → | CO₂ | OH 소모(농도 저하) |\n\n### 야간 산화제 — NO₃ 라디칼\n야간에는 OH가 없으므로 **NO₃ 라디칼**(NO₂ + O₃ → NO₃)이 산화를 담당한다.\n- NO₃ + NO₂ ⇌ **N₂O₅**\n- N₂O₅ + H₂O(입자 표면) → **2HNO₃** → 질산암모늄\n\n겨울철 야간 고습 조건에서 이 경로가 활발하여 **새벽 질산염 급증**의 원인이 된다. 국내 겨울 PM2.5에서 질산염 비중이 높은 이유이기도 하다.\n"}]},"24":{"day":24,"date":"2026-08-24","title":"1단계 이론·확산·집진 회독 3회차","keywords":[{"k":"모델 3계열","subs":["가우시안(정상·해석해)·퍼프(비정상)","격자(오일러리안·광화학)","수용모델(역방향 진단)"]},{"k":"배출원 형태별 식","subs":["선원 C=2q/(√(2π)σz·u·sinφ)","면원 σy₀≈W/4.3, σz₀≈H/2.15","점원 기본 가우시안"]},{"k":"환경영향평가","subs":["스코핑→현황조사→예측→저감→사후조사","기상 5년·대기질 3년 + 현지 계절별","기여 + 배경 = 총농도"]},{"k":"건강영향평가","subs":["위해성평가 4단계","ECR = EC × IUR, 10⁻⁶~10⁻⁴","HQ = EC/RfC < 1"]},{"k":"자연적 제거기작","subs":["건성침적 Vd=1/(Ra+Rb+Rc)","습성침적 Rainout·Washout, C=C₀e^(−Λt)","OH 라디칼 산화, 체류시간"]}],"answer":"# 1단계 회독 3회차 — Day 17~23 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n3회독부터는 **수치와 식을 실제로 외우는 단계**다. 1·2회독에서 구조를 잡았다면, 이제는 백지에 식을 쓰고 숫자를 채울 수 있어야 한다. 이번 구간은 \"모델 → 평가 → 제거\"의 흐름이다.\n\n```\n배출량 산정 (배출계수 × 활동도)\n   ↓\n모델 선정 (가우시안 / 퍼프 / 격자 / 수용)\n   ↓\n배출원 형태별 식 (점 / 선 / 면 / 체적)\n   ↓\n예측농도 + 배경농도 = 총농도\n   ↓\n환경기준 비교 / 건강위해도(ECR, HQ)\n   ↓\n저감방안 → 사후환경영향조사\n   ↕\n자연적 제거(침적·화학변환) → 체류시간 → 영향 범위\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 가우시안 적용 거리 | 50km 이내 | ☐ |\n| 선원 확산식 | C = 2q/(√(2π)·σz·u·**sin φ**) | ☐ |\n| φ = 30°일 때 상대농도 | 90° 대비 **2배** | ☐ |\n| 면원 초기 확산폭 | σy₀ ≈ W/**4.3**, σz₀ ≈ H/**2.15** | ☐ |\n| 혼합고 완전혼합 판정 | σz ≥ **1.6 zi** | ☐ |\n| 기상 현황조사 기간 | 최근 **5년** | ☐ |\n| 대기질 기존자료 조사 | 최근 **3년** | ☐ |\n| 현지측정 | 계절별 각 1회, 연속 **24시간 이상** | ☐ |\n| 발암위해도 관리구간 | **10⁻⁶ ~ 10⁻⁴** | ☐ |\n| 비발암 판정 | **HQ, HI < 1** | ☐ |\n| ECR 산정식 | ECR = **EC × IUR** | ☐ |\n| HQ 산정식 | HQ = **EC / RfC** | ☐ |\n| 특정대기유해물질 | **35종** | ☐ |\n| 침적속도 저항모형 | Vd = 1/(**Ra + Rb + Rc**) | ☐ |\n| 침적속도 최소 입경 | **0.1~1 ㎛**(축적모드) | ☐ |\n| 세정 감쇠식 | C = C₀·exp(−**Λ**t) | ☐ |\n| 산성비 pH 기준 | **5.6** 미만 | ☐ |\n| SO₂ 체류시간 | 2~4일 | ☐ |\n| PM2.5 체류시간 | 3~10일 | ☐ |\n| CH₄ / N₂O 체류시간 | 약 9~12년 / 약 120년 | ☐ |\n| OH 라디칼 수명 | **1초 미만** | ☐ |\n| 비산먼지 작업중지 풍속 | **8 m/s 이상** | ☐ |\n| 공사차량 운행속도 제한 | 20 km/h | ☐ |\n| 저공해 건설기계 의무 | 대기관리권역 **100억 원 이상** 관급공사 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **선원**: C = 2q/(√(2π)·σz·u·sinφ) × exp(−He²/2σz²)\n2. **면원 가상거리**: σy₀ = W/4.3, σz₀ = H/2.15\n3. **완전혼합**: C = Q/(√(2π)·u·σy·zi)\n4. **CMB**: Cᵢ = Σⱼ(aᵢⱼ·Sⱼ) + eᵢ\n5. **PMF**: X = G·F + E (비음수 제약)\n6. **배출량**: 활동도 × 배출계수 × (1 − 제거효율)\n7. **노출농도**: EC = (C×ET×EF×ED)/AT\n8. **발암위해도**: ECR = EC × IUR\n9. **비발암**: HQ = EC/RfC, HI = ΣHQ\n10. **건성침적**: F = Vd·C, Vd = 1/(Ra+Rb+Rc)\n11. **습성침적**: C = C₀·exp(−Λt)\n12. **체류시간**: τ = 1/(k건성 + k습성 + k화학)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 오일러리안 vs 라그랑지안 | 격자 고정, **화학반응 유리** | 덩어리 추적, **수치확산 없음** | 좌표계 |\n| 분산 vs 수용모델 | 배출→농도(예측) | 농도→배출원(진단) | 계산 방향 |\n| CMB vs PMF | 지문 **필요**, 시료 1개 가능 | 지문 **불필요**, 시료 100개↑ | 지문 유무 |\n| Rainout vs Washout | **구름 내** 세정 | **구름 밑** 세정 | 제거 위치 |\n| 건성 vs 습성침적 | 강수 없이 상시 | 강수 시 집중 | 강수 매개 |\n| 기여농도 vs 총농도 | 사업 영향분 | 기여 + **배경** | 기준 비교는 **총농도** |\n| IUR vs RfC | 발암, 위해도 산정 | 비발암, 안전농도 | 발암성 유무 |\n| 대기오염물질 vs 특정대기유해물질 | 60여 종 | **35종**(포함관계) | 위해성 정도 |\n| SEA vs EIA | 계획 단계, 입지 타당성 | 사업 단계, 영향 예측 | 시점 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 대기오염 예측모델 중 오일러리안 모델과 라그랑지안 모델을 비교 설명하시오. *(116회 25점)*\n2. 수용모델과 분산모델에 관하여 설명하시오. *(123회 25점)*\n3. PMF 모델의 개념과 Factor 정의 시 고려사항을 설명하시오. *(최근 25점)*\n4. 고속도로와 같은 선 배출원의 풍하지역 오염농도 평가식을 쓰고 설명하시오. *(120회 25점)*\n5. 우리나라 환경영향평가 권장모델과 미국 EPA의 SCRAM을 설명하시오. *(117회 25점)*\n6. 산업단지 건강영향평가 계획 적정성 평가방안을 설명하시오. *(126회 25점)*\n7. 호흡노출참고치, 호흡단위위해도를 설명하시오. *(최근 10점)*\n8. 대기오염물질의 자연적인 제거기작 4가지를 쓰시오. *(117회 10점)*\n9. 세정효과(washout), 건성침적(dry deposition)을 설명하시오. *(116회 10점)*\n10. 대기오염물질, 유해성대기감시물질, 특정대기유해물질을 설명하시오. *(120회 10점)*\n11. Brute-Force Method(BFM)를 설명하시오. *(126회 10점)*\n12. CAPSS를 설명하시오. *(117·126회 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(25분)**: Ⅰ의 흐름도를 그린다.\n2. **식 쓰기(30분)**: Ⅲ의 12개 식을 손으로. 기호 정의 포함. **이번 회독의 핵심 과제**.\n3. **수치 암기(25분)**: Ⅱ 체크리스트. 5개 이상 틀리면 해당 일자 재독.\n4. **기출 구술(30분)**: Ⅴ의 12문항.\n5. **계산 연습(20분)**: Day 22의 위해성평가 예제를 숫자를 바꿔 다시 풀어본다.\n\n> 3회독인데도 식이 안 나오면, 외우려 하지 말고 **유도 과정을 한 번 더 따라가 보라.** 이해한 식은 안 잊는다.\n","side":[{"title":"모델 선정 의사결정 흐름도","body":"### 판단 순서\n```\nQ1. 대상물질이 2차 생성물(O₃, PM2.5)인가?\n   YES → CMAQ / CAMx (광화학 격자모델)\n   NO  → Q2\n\nQ2. 평가거리 50km 초과인가?\n   YES → CALPUFF\n   NO  → Q3\n\nQ3. 지형이 복잡한가? (산지·해안·분지)\n   YES → CALPUFF (또는 AERMOD + 지형처리)\n   NO  → Q4\n\nQ4. 정온율 20% 초과인가?\n   YES → CALPUFF\n   NO  → Q5\n\nQ5. 건물·구조물 영향이 큰가? (Hs < GEP)\n   YES → AERMOD + PRIME\n   NO  → Q6\n\nQ6. 배출원이 도로·터널인가?\n   YES → CALINE4 / RLINE / CFD\n   NO  → **AERMOD** (기본)\n```\n\n### 병행 수행이 바람직한 경우\n- 대규모 사업(발전소·산업단지): AERMOD + CALPUFF 병행 후 보수적 결과 채택\n- 정책 평가: CMAQ(광역) + 수용모델(검증)\n- 국지 민원: AERMOD + CFD\n\n### 평가서 기술 요령\n\"① 대상지가 평탄지형이고 ② 평가거리가 5km 이내이며 ③ 정온율이 12%로 낮고 ④ 대상물질이 1차 오염물질이므로, 환경부 대기질 모델링 지침에 따라 **AERMOD**를 선정하였다.\" — 이렇게 **번호로 근거를 나열**하면 명확하다.\n"},{"title":"암기 카드 — Day 17~23 핵심 20선","body":"1. **오일러리안** = 격자 고정, 화학반응 유리, **수치확산** 발생\n2. **라그랑지안** = 덩어리 추적, 수치확산 없음, 정온 유리\n3. **CMAQ** = 오일러리안 + 광화학 → O₃·2차 PM2.5\n4. **CALPUFF** = 퍼프, 장거리·복잡지형·저풍속\n5. **HYSPLIT** = 역궤적 → 국외 유입 경로\n6. **CMB** = 배출원 지문 **필요**, T-stat > 2\n7. **PMF** = 지문 **불필요**, 비음수 제약, 시료 100개↑\n8. **지시물질**: V·Ni=중유 / As·Se=석탄 / Zn·Pb=소각 / K⁺=생물성연소 / Cu·Sb=브레이크\n9. **선원** C ∝ **1/sin φ** → 도로와 평행할수록 고농도\n10. **면원** σy₀ = W/4.3, σz₀ = H/2.15\n11. **CAPSS** = 국가 배출량 산정, **13개 대분류**\n12. 환경영향평가 절차: 스코핑 → 현황 → 예측 → 저감 → 협의 → **사후조사**\n13. 기상 **5년** / 대기질 **3년** + 계절별 현지측정\n14. **기여 + 배경 = 총농도** → 기준 비교\n15. **ECR = EC × IUR**, 관리구간 **10⁻⁶~10⁻⁴**\n16. **HQ = EC / RfC < 1**\n17. **특정대기유해물질 35종** (대기오염물질 ⊃ 감시물질 ⊃ 특정)\n18. **Vd = 1/(Ra+Rb+Rc)**, 최소 침적 입경 **0.1~1㎛**\n19. **Rainout**(구름 내) vs **Washout**(구름 밑), C = C₀e^(−Λt)\n20. **OH 라디칼** = 대기의 세제, 수명 1초 미만 / 야간은 **NO₃·N₂O₅**\n"}]},"25":{"day":25,"date":"2026-08-25","title":"시정장애 현상과 소멸계수","keywords":[{"k":"소멸계수(b_ext)","subs":["산란(b_sp,b_sg)+흡수(b_ap,b_ag)","PM2.5가 최대 기여"]},{"k":"Koschmieder 식","subs":["L_v = 3.912 / b_ext","시정거리는 소멸계수에 반비례"]},{"k":"Mie 산란","subs":["0.1~1㎛ 축적모드 입자에서 극대","가시광 파장과 유사한 크기"]},{"k":"상대습도 영향","subs":["조해성 입자 흡습 성장","산란 증가 → 시정 악화"]}],"answer":"# 시정장애 현상과 소멸계수\n\n## Ⅰ. 개요\n\n**시정(Visibility)**이란 대기의 혼탁도를 나타내는 척도로, 정상 시력의 관측자가 목표물을 인지·식별할 수 있는 최대 수평거리(가시거리)를 말한다. **시정장애(Visibility Impairment)**는 대기 중 부유입자와 일부 기체가 빛을 **산란·흡수**시켜 시정거리가 짧아지는 현상으로, 특히 **PM2.5** 농도를 체감할 수 있는 대표적 지표이자 대기질 악화의 시각적 증거이다.\n\n## Ⅱ. 빛의 소멸 기작과 소멸계수\n\n대기를 통과하는 빛은 산란과 흡수로 세기가 감소하며, 이 총량을 **소멸계수(Extinction Coefficient, b_ext)**로 나타낸다.\n\n**b_ext = b_sp + b_ap + b_sg + b_ag**\n\n| 성분 | 의미 | 주요 기여 |\n|---|---|---|\n| b_sp | 입자 산란 | PM2.5(황산염·질산염·유기탄소) **최대 기여** |\n| b_ap | 입자 흡수 | 블랙카본(검댕, BC) |\n| b_sg | 기체 산란(Rayleigh) | 공기분자 자체 산란(배경값) |\n| b_ag | 기체 흡수 | NO₂(갈색 착색) 등 |\n\n- **산란**: 가시광 파장(0.4~0.7㎛)과 비슷한 축적모드 입자(0.1~1㎛)에서 **Mie 산란**이 극대 → PM2.5가 시정에 가장 치명적\n- **흡수**: 블랙카본이 대표적이며 소량으로도 시정을 크게 악화\n\n## Ⅲ. 시정거리와 Koschmieder 식\n\n소멸계수와 시정거리(L_v)는 반비례하며, 대비역치 2%를 적용한 **Koschmieder 식**으로 연결된다.\n\n**L_v = 3.912 / b_ext**\n\n- b_ext가 클수록(입자 많을수록) 시정거리는 짧아짐\n- 예: b_ext=0.1/km → L_v≈39km, b_ext=1.0/km → L_v≈3.9km\n\n## Ⅳ. 시정 영향 인자\n\n1. **입자 조성**: 황산염·질산염·유기탄소가 산란 주도, 블랙카본이 흡수 주도\n2. **상대습도**: 조해성 입자가 수분을 흡수해 커지면 산란 급증 → 고습 시 시정 급격 악화\n3. **입경분포**: 0.1~1㎛ 축적모드 입자가 단위질량당 산란효율 최대\n\n## Ⅴ. 관리적 의의\n\n시정 개선의 핵심은 **PM2.5(특히 2차 생성 황산염·질산염) 저감**이다. 국립공원 조망경관 보호, 공항 운항안전, 국민 체감 대기질 관리 측면에서 시정은 중요한 관리지표로 활용된다.","side":[{"title":"Koschmieder 식과 대비역치","body":"### 유도 배경\n관측자가 목표물을 배경과 구분하려면 최소 대비(對比)가 필요하다. 대비역치를 2%로 두면\n\n**L_v = 3.912 / b_ext**\n\n- 상수 3.912 = ln(1/0.02)\n- 대비역치를 5%로 보면 상수는 약 3.0으로 낮아짐\n- b_ext 단위는 1/거리(예: 1/km)"},{"title":"습도와 조해성 입자 성장","body":"### 요점\n황산염·질산염 같은 조해성(潮解性) 입자는 상대습도가 높아지면 수분을 흡수해 입경이 커진다.\n\n- 입경이 커지면 산란효율(Mie 산란) 급증 → **시정 급격히 악화**\n- 조해점(deliquescence point) 이상에서 급성장\n- 안개·연무 시 시정이 크게 떨어지는 주된 이유"}]},"26":{"day":26,"date":"2026-08-26","title":"산성비의 기작·영향·대책","keywords":[{"k":"산성비 정의","subs":["pH 5.6 미만(CO₂ 평형 기준)","SOx·NOx 기원"]},{"k":"생성 기작","subs":["SO₂→H₂SO₄, NOx→HNO₃","습성(rainout·washout)·건성침착"]},{"k":"영향","subs":["호소 산성화·Al 용출","토양 염기용탈, 대리석(CaCO₃) 부식"]},{"k":"대책","subs":["탈황·탈질, 저황연료","국제협약, 석회 중화"]}],"answer":"# 산성비의 기작·영향·대책\n\n## Ⅰ. 개요\n\n**산성비(Acid Rain)**란 대기 중 **황산화물(SOx)·질소산화물(NOx)**이 산화·용해되어 생성된 강수로, 통상 **pH 5.6 미만**의 강수를 말한다. 기준 pH 5.6은 청정대기의 CO₂가 빗물에 평형 용해되었을 때의 값이다. 넓은 의미로 습성·건성침착을 포함한 **산성강하물(Acid Deposition)**로 이해된다.\n\n## Ⅱ. 생성 기작\n\n### 1. 전구물질의 산화\n- **SO₂** → OH·H₂O₂·O₃ 등에 의한 기상·액상 산화 → **황산(H₂SO₄)**\n- **NOx** → OH 반응 → **질산(HNO₃)**\n- 황산 약 60~70%, 질산 약 30~40% 기여(지역·계절 편차)\n\n### 2. 침착 형태\n- **습성침착**: 구름 내 포착(rainout), 강하 중 세정(washout)\n- **건성침착**: 가스·입자가 지표·식생에 직접 침적\n\n## Ⅲ. 영향\n\n| 대상 | 피해 |\n|---|---|\n| 육수(호소) | 산성화, 알루미늄 용출 → 어류 폐사, 생태계 파괴 |\n| 토양 | 염기양이온(Ca²⁺·Mg²⁺·K⁺) 용탈, 중금속 이동성 증가 |\n| 삼림 | 잎 손상·수관 쇠퇴, 병해충 저항력 저하 |\n| 구조물·문화재 | 대리석·석회암(CaCO₃) 용해, 금속 부식 |\n| 인체 | 미세입자(황산염·질산염) 흡입 호흡기 영향 |\n\n## Ⅳ. 특징 및 대책\n\n- **장거리 이동(월경성)**: 배출지역과 피해지역이 달라 국제 협력 필요(CLRTAP 등)\n- **배출 저감**: 탈황(FGD)·탈질(SCR/SNCR), 저황·청정연료 전환, 자동차 NOx 저감\n- **피해 완화**: 산성화 호수·토양에 석회(CaCO₃) 살포로 중화","side":[{"title":"pH와 산성강하물 지표","body":"### 요점\n- 자연 강수 pH ≈ 5.6 (CO₂ 평형)\n- pH 5.6 미만을 산성비로 정의\n- pH는 로그 척도 → pH 4는 pH 5보다 산도 10배\n- 습성침착량 = 강수량 × 이온농도로 정량"},{"title":"국내 산성비 특징","body":"### 요점\n- 겨울·봄철 심화(난방·황사·월경성 이동)\n- 질산 기여 비중 증가(자동차 NOx)\n- 장거리이동으로 배출지-피해지 불일치 → 국제협력(동북아 LTP 등) 필요"}]},"27":{"day":27,"date":"2026-08-27","title":"광화학반응과 2차 대기오염물질","keywords":[{"k":"1차 vs 2차","subs":["직접 배출 vs 대기 중 반응 생성"]},{"k":"광화학 개시","subs":["NO₂+hν→NO+O→O₃","자외선 에너지·OH 순환"]},{"k":"VOC 역할","subs":["RO₂/HO₂가 NO→NO₂ 산화","O₃ 순증가"]},{"k":"2차 오염물질","subs":["O₃, PAN, 알데하이드","2차 에어로졸(질산염·SOA)"]}],"answer":"# 광화학반응과 2차 대기오염물질\n\n## Ⅰ. 개요\n\n대기오염물질은 배출원에서 직접 나오는 **1차 오염물질**과, 대기 중 화학반응으로 새로 생성되는 **2차 오염물질**으로 나뉜다. **광화학반응(Photochemical Reaction)**은 태양의 **자외선 에너지**로 개시되는 반응으로, **VOC와 NOx**가 햇빛 아래 반응하여 오존 등 산화성 2차 오염물질을 만든다.\n\n## Ⅱ. 광화학반응 기구\n\n### 1. NO₂ 광분해와 오존 생성\n- NO₂ + hν(λ<420nm) → NO + O(³P)\n- O(³P) + O₂ + M → **O₃** + M\n\n### 2. VOC의 역할과 라디칼 순환\n- VOC + OH → RO₂·(퍼옥시라디칼)\n- **RO₂· + NO → NO₂ + RO·** : 오존을 소비하지 않고 NO를 NO₂로 산화 → **O₃ 순증가**\n- HO₂·도 동일하게 NO→NO₂ 전환에 기여, OH 라디칼이 재생되며 연쇄 진행\n\n## Ⅲ. 주요 2차 대기오염물질\n\n| 물질 | 설명 |\n|---|---|\n| 오존(O₃) | 대표적 광화학 산화제, 호흡기·식물 피해 |\n| PAN | 강한 눈 자극, 식물독성, 광화학스모그 지표 |\n| 알데하이드(HCHO 등) | 중간생성물, 자극성·발암성 |\n| 2차 에어로졸 | 황산염·질산염(2차 무기), SOA(2차 유기) → PM2.5 |\n\n## Ⅳ. 발생 특성과 관리\n\n- **시간**: 일사가 강한 여름철 오후에 최대\n- **공간**: 전구물질 배출지의 **풍하측**에서 농도 극대\n- **관리**: 전구물질 **VOC와 NOx의 동시·균형 저감**이 핵심","side":[{"title":"OH 라디칼 — 대기의 세정제","body":"### 요점\n- OH는 대기 산화반응의 개시자로 \"대기의 세정제\"로 불림\n- VOC·CO·CH₄ 등을 산화 제거\n- 주간 광화학반응으로 생성, 야간엔 NO₃ 라디칼이 역할 대체\n- OH 농도가 대기 자정능력을 좌우"},{"title":"PAN(퍼옥시아세틸나이트레이트)","body":"### 요점\n- 광화학스모그의 대표적 2차 생성물·지표물질\n- 강한 눈 자극·식물독성\n- 저온에서 안정 → 오염물질을 원거리로 수송 후 분해해 NOx 재방출\n- 온도가 오르면 분해되어 오존 생성에 재기여"}]},"28":{"day":28,"date":"2026-08-28","title":"오존 생성기작과 NOx/VOC 농도비","keywords":[{"k":"광정상상태","subs":["NO₂+hν→NO+O→O₃","O₃+NO→NO₂(titration)"]},{"k":"VOC 律速","subs":["낮은 VOC/NOx, 도심","VOC 저감이 효과"]},{"k":"NOx 律速","subs":["높은 VOC/NOx, 교외·풍하","NOx 저감이 효과"]},{"k":"주말효과·EKMA","subs":["NOx만 줄이면 오존 증가 가능","EKMA로 전략 도출"]}],"answer":"# 오존 생성기작과 NOx/VOC 농도비\n\n## Ⅰ. 개요\n\n오존(O₃)은 대류권에서 **NOx·VOC·햇빛**의 광화학반응으로 생성되는 대표적 2차 오염물질이다. 오존은 전구물질과 **비선형** 관계를 가지므로, 저감 대책 수립 시 **VOC/NOx 농도비**에 따른 감수성 판단이 필수이다.\n\n## Ⅱ. 광정상상태(Photostationary State)\n\nVOC가 없을 때 다음 순환은 오존을 순생성하지 못한다(null cycle).\n\n- NO₂ + hν → NO + O\n- O + O₂ → O₃\n- **O₃ + NO → NO₂ + O₂** (NO에 의한 오존 소모, titration)\n\n오존이 생성되어도 NO가 이를 다시 소모하여 평형을 이룬다. **VOC가 존재해야** RO₂·/HO₂·가 NO→NO₂ 전환을 대신하여 오존이 순증가한다.\n\n## Ⅲ. VOC/NOx 농도비와 오존 감수성\n\n| VOC/NOx 비 | 명칭 | 지배 인자 | 효과적 대책 | 대표 지역 |\n|---|---|---|---|---|\n| 낮음(대략 <4~8) | VOC 律速(NOx 과잉) | VOC 부족 | **VOC 저감** | 도심(고NOx) |\n| 높음 | NOx 律速 | NOx 부족 | **NOx 저감** | 교외·풍하측 |\n\n- **NOx 적정 현상**: VOC 律速 지역에서 NOx만 줄이면 titration이 약해져 오히려 오존 증가 가능\n- **주말효과**: 주말 NOx 감소로 도심 오존이 오히려 상승 → VOC 律速의 증거\n- **EKMA(오존 등농도 곡선)**: VOC·NOx 조합별 최대 오존을 나타내어 저감 전략 도출\n\n## Ⅳ. 관리 시사점\n\n지역별 감수성 진단에 따라 저감 대상을 달리해야 하며, 도심은 VOC(특히 반응성 VOC), 광역·풍하지역은 NOx 관리가 효과적이다.","side":[{"title":"EKMA 다이어그램","body":"### 요점\n- VOC(가로)·NOx(세로) 배출 조합별 **최대 오존 등농도곡선**\n- 능선(ridge line) 기준\n  - 좌상(고NOx·저VOC): **VOC 律速** → VOC 저감 효과\n  - 우하(저NOx·고VOC): **NOx 律速** → NOx 저감 효과\n- 지역 배출특성에 맞춘 저감전략 수립에 활용"},{"title":"주말효과와 NOx 적정","body":"### 요점\n- 주말 NOx 배출 감소에도 도심 오존이 오히려 상승 → VOC 律速의 증거\n- **NOx 적정(titration)**: NO + O₃ → NO₂ 로 오존이 소모되므로, 고NOx 지역에서 NOx만 줄이면 오존이 일시 증가할 수 있음\n- 저감은 VOC/NOx 감수성 진단 후 결정"}]},"29":{"day":29,"date":"2026-08-29","title":"광화학스모그와 오존경보제","keywords":[{"k":"런던형 vs LA형","subs":["환원성·겨울·SO₂","산화성·여름·O₃/PAN"]},{"k":"발생조건","subs":["강한 일사·고온·역전정체","다량 VOC·NOx"]},{"k":"오존경보제 기준","subs":["주의보 0.12 / 경보 0.30 / 중대경보 0.50 ppm","1시간 평균"]},{"k":"근거·운영","subs":["대기환경보전법 제8조, 5.1~9.15","권역 1개소 초과 시 발령"]}],"answer":"# 광화학스모그와 오존경보제\n\n## Ⅰ. 개요\n\n**광화학스모그(Photochemical Smog)**는 자동차·산업에서 배출된 VOC·NOx가 강한 일사 아래 광화학반응을 일으켜 오존·PAN 등 **산화성 물질**을 축적시키는 현상으로, 미국 로스앤젤레스에서 처음 문제가 되어 **LA형 스모그**라 불린다.\n\n## Ⅱ. 런던형 vs LA형(광화학) 비교\n\n| 구분 | 런던형(환원성) | LA형(광화학·산화성) |\n|---|---|---|\n| 주 오염물질 | SO₂, 매연 | O₃, PAN, NOx, VOC |\n| 계절·시간 | 겨울 새벽·아침 | 여름 한낮 |\n| 기상조건 | 방사역전, 고습, 무풍 | 강한 일사, 고온, 침강역전 |\n| 성상 | 환원성, 검은색 | 산화성, 백색~갈색 |\n| 대표 피해 | 호흡기(사망) | 눈·호흡기 자극, 식물·고무 피해, 시정악화 |\n\n## Ⅲ. 발생 조건과 피해\n\n- **조건**: 강한 자외선, 높은 기온, 대기정체(역전), 다량의 VOC·NOx\n- **피해**: 눈·점막 자극, 호흡기 질환, 식물 잎 손상, 고무 균열, 시정 악화\n\n## Ⅳ. 오존경보제 (대기환경보전법 제8조)\n\n고농도 오존으로부터 국민 건강을 보호하기 위해 **1시간 평균 오존 농도**를 기준으로 3단계 경보를 발령한다.\n\n| 단계 | 발령기준(1시간 평균) | 주요 조치 |\n|---|---|---|\n| 주의보 | **0.12 ppm 이상** | 실외활동 자제 권고, 배출 자제 |\n| 경보 | **0.30 ppm 이상** | 자동차 운행 제한, 사업장 연료 감축 |\n| 중대경보 | **0.50 ppm 이상** | 자동차 통행금지, 사업장 조업단축 |\n\n- **시행기간**: 매년 5월 1일 ~ 9월 15일\n- **발령**: 권역 내 도시대기측정소 중 **1개소라도** 기준 초과 시 발령, 미만 시 해제\n\n## Ⅴ. 결론\n\n광화학스모그는 VOC·NOx의 광화학반응 산물로 근본 대책은 전구물질 저감이다. 오존경보제는 단기 고농도 시 국민을 보호하는 사후적 제도이며, 예보제·계절관리와 함께 운영된다.","side":[{"title":"오존 대기환경기준","body":"### 요점 (환경정책기본법 시행령)\n- **8시간 평균 0.06 ppm 이하**\n- **1시간 평균 0.1 ppm 이하**\n\n오존경보제 발령기준(1시간 0.12/0.30/0.50 ppm)과 혼동 주의 — 기준은 상시 관리목표, 경보는 고농도 시 대응."},{"title":"런던형 vs LA형 요점 비교","body":"### 핵심\n| 구분 | 런던형 | LA형 |\n|---|---|---|\n| 성질 | 환원성 | 산화성 |\n| 주물질 | SO₂·매연 | O₃·PAN |\n| 시기 | 겨울 아침 | 여름 한낮 |\n| 역전 | 방사(복사)역전 | 침강역전 |"}]},"30":{"day":30,"date":"2026-08-30","title":"입자의 물리적 특성과 Stokes 법칙","keywords":[{"k":"공기역학경","subs":["밀도 1 구 환산 침강 등가경","집진·호흡기 침착 표준"]},{"k":"Stokes 법칙","subs":["v_t = d_p²(ρ_p−ρ)g/18μ","침강속도 ∝ 입경², Re<1"]},{"k":"Cunningham 보정","subs":["미세입자 슬립으로 저항 감소","C_c≥1, 입경 작을수록 커짐"]},{"k":"유동영역","subs":["Stokes(Re<1, C_D=24/Re)","Newton(Re>1) 보정"]}],"answer":"# 입자의 물리적 특성과 Stokes 법칙\n\n## Ⅰ. 개요\n\n집진장치 설계와 입자 거동 해석의 출발점은 입자의 **크기·형상·밀도** 등 물리적 특성이다. 특히 중력·관성·원심 집진의 효율은 입자의 **침강속도**에 좌우되며, 이는 **Stokes 법칙**으로 기술된다.\n\n## Ⅱ. 입경의 정의\n\n| 종류 | 정의 |\n|---|---|\n| 기하학적 직경 | 현미경 등으로 측정한 실제 크기 |\n| **공기역학경** | 동일 침강속도를 갖는 밀도 1g/cm³ 구형 입자의 직경(집진·호흡기 표준) |\n| Stokes경 | 동일 침강속도·동일 밀도를 갖는 구의 직경 |\n| 중위경(MMD) | 질량 기준 누적 50%에 해당하는 입경 |\n\n- 입경분포는 통상 **대수정규분포**를 따르며 **기하표준편차(σg)**로 분산을 표현\n\n## Ⅲ. Stokes 법칙(중력 침강)\n\n층류 영역(Reynolds 수 Re < 1)에서 구형 입자의 **종말침강속도(v_t)**는\n\n**v_t = d_p²(ρ_p − ρ)g / 18μ**\n\n- d_p: 입경, ρ_p: 입자밀도, ρ: 기체밀도, g: 중력가속도, μ: 기체점도\n- 침강속도는 **입경의 제곱에 비례** → 큰 입자일수록 빠르게 침강(중력집진 유리)\n\n## Ⅳ. 적용 범위와 보정\n\n### 1. Cunningham 보정계수(C_c)\n입경이 기체 평균자유행로에 근접할 만큼 작아지면(대략 1㎛ 이하) 입자가 기체분자 사이로 미끄러져 저항이 감소한다.\n\n**v_t = C_c · d_p²(ρ_p − ρ)g / 18μ  (C_c ≥ 1, 입경 작을수록 커짐)**\n\n### 2. 유동영역 구분\n- **Stokes 영역(Re<1)**: 층류, 항력계수 C_D = 24/Re\n- **중간·Newton 영역(Re>1)**: 항력계수 완만, Stokes 식 과대평가 → 보정 필요\n\n## Ⅴ. 관리적 의의\n\nStokes 법칙은 중력집진기·침강실 설계의 기본식이며, 사이클론 절단입경(cut size) 산정, 대기 중 입자의 침강·체류시간 예측에 활용된다. 미세입자일수록 침강이 느려(C_c 보정) 중력집진만으로 제거가 어렵고, 여과·전기·세정집진이 필요하다.","side":[{"title":"공기역학경 vs 기하학경","body":"### 요점\n- **기하학적 직경**: 실제 측정 크기\n- **공기역학경(D_ae)**: 같은 침강속도를 갖는 밀도 1g/cm³ 구의 직경\n- 관계: D_ae ≈ D_geo × √(ρ_p·C_c 보정)\n- 집진·호흡기 침착은 공기역학경 기준(PM10, PM2.5)"},{"title":"Cunningham 보정계수(C_c)","body":"### 요점\n- 입경이 기체 평균자유행로(≈0.066㎛)에 근접하면 슬립(slip)으로 저항 감소\n- **C_c = 1 + (2λ/d_p)[1.257 + 0.4·exp(−0.55 d_p/λ)]**\n- d_p ≫ λ 이면 C_c → 1, d_p 작을수록 C_c > 1\n- 미세입자 침강속도 보정에 필수"}]},"31":{"day":31,"date":"2026-08-31","title":"Cunningham 보정계수와 항력계수","keywords":[{"k":"Cunningham 보정 C_c","subs":["C_c=1+(2λ/d_p)[1.257+0.4·exp(−0.55d_p/λ)]","미세입자 슬립으로 저항 감소"]},{"k":"평균자유행로·Knudsen수","subs":["λ≈0.066㎛(상온상압)","Kn=2λ/d_p로 유동영역 구분"]},{"k":"항력계수 영역","subs":["Stokes Re<1: 24/Re","Newton Re>10³: ≈0.44"]},{"k":"보정 침강속도","subs":["v_t=C_c·d_p²(ρ_p−ρ)g/18μ"]}],"answer":"# Cunningham 보정계수와 항력계수\n\n## Ⅰ. 왜 필요한가\nStokes 법칙은 \"입자가 연속된 유체 속을 천천히 가라앉는다\"는 가정에서 나온 식이다. 이 가정은 두 경우에 깨진다. ① 입자가 **너무 작을 때**(공기를 연속체로 볼 수 없음) ② 입자가 **너무 크거나 빠를 때**(관성·난류 지배). 이 둘을 각각 보정하는 것이 **Cunningham 보정계수**와 **항력계수**다.\n\n## Ⅱ. Cunningham 보정 — \"작은 입자는 덜 저항받는다\"\n공기는 분자들의 집합이고 분자 사이엔 평균 **0.066㎛**의 빈 공간(평균자유행로 λ)이 있다. 입자가 이 λ만큼 작아지면 분자 벽에 부딪히는 대신 **분자 사이를 미끄러져(slip)** 빠져나가 저항이 줄고 더 빨리 가라앉는다.\n- 이 \"덜 받는 저항\"을 곱해 보정: **v_t = C_c · d_p²(ρ_p−ρ)g / 18μ** (C_c ≥ 1)\n- 입경이 작을수록 C_c↑, 크면 C_c→1. 척도는 **Knudsen 수 Kn = 2λ/d_p**.\n- 요점: **PM2.5·나노입자일수록 보정이 중요**하며, 빼면 미세입자 거동을 과소평가한다.\n\n## Ⅲ. 항력계수 — \"빨라지면 저항 법칙이 바뀐다\"\n입자가 크거나 빠르면 후류·난류로 저항이 속도에 정비례하지 않는다. 이때 **항력계수 C_D**로 표현하며, 상태는 **레이놀즈수 Re = ρd_p v/μ** 로 판단한다.\n\n| 영역 | Re | C_D | 의미 |\n|---|---|---|---|\n| Stokes | <1 | 24/Re | 점성 지배, 저항∝속도 |\n| 중간(Allen) | 1~1,000 | ≈18.5/Re^0.6 | 점성+관성 |\n| Newton | 10³~2×10⁵ | ≈0.44 | 관성 지배, 저항∝속도² |\n\n## Ⅳ. 최근 동향\n- **정밀 모델링**: 초미세입자 거동을 CFD-DEM(전산유체+입자추적)으로 해석해 집진기를 설계하는 방식이 확산되며, Cunningham·항력 보정이 핵심 입력값이 된다.\n- **초미세·나노 규제 강화**: 배출기준이 미세영역 중심으로 강해지면서 슬립영역(작은 입경) 거동의 정확도가 설계 성능을 좌우한다.\n\n## Ⅴ. 한 줄 정리\n\"작으면 덜 저항받고(Cunningham), 빠르면 저항 법칙이 바뀐다(항력계수).\" 미세입자 집진설계의 출발점.","side":[{"title":"Knudsen수로 보는 슬립","body":"### 직관\n- Kn=2λ/d_p, 입자가 작을수록 Kn↑\n- Kn<0.01 연속체 → Stokes 그대로\n- 0.01~0.1 슬립 → Cunningham 보정\n- PM2.5·나노는 슬립영역, 보정 필수"},{"title":"항력계수의 의미","body":"### 직관\n- 느리면(Re<1) 저항∝속도 → 24/Re\n- 빠르면(Newton) 저항∝속도² → ≈0.44\n- 같은 입자도 유속에 따라 적용식이 달라짐"}]},"32":{"day":32,"date":"2026-09-01","title":"1단계 이론·확산·집진 회독 4회차","keywords":[{"k":"회독 목적","subs":["반복 인출로 장기기억화","오답노트 우선 인출"]},{"k":"기상 핵심","subs":["Γd≈0.98℃/100m","온위 dθ/dz>0 안정"]},{"k":"확산 핵심","subs":["가우시안 플룸","연기형태 6종"]},{"k":"집진 기초","subs":["Stokes+C_c","항력 영역"]}],"answer":"# 1단계 회독 4회차 — 개념을 이야기로 연결\n\n## Ⅰ. 이번 회독의 목표\n공식 암기가 아니라 **개념을 이야기로 연결해 인출**하는 회차다. \"왜 그런가\"를 말로 설명할 수 있으면 시험장에서 응용문제에 대응할 수 있다.\n\n## Ⅱ. 하나의 흐름으로 잇기\n태양이 지표를 데운다 → 공기가 뜨고 안정도가 정해진다(**기상**) → 오염물질이 퍼진다(**확산**) → 굴뚝높이가 착지농도를 좌우한다(**굴뚝**) → 남은 입자를 걷어낸다(**집진**). 각 단계를 한 문장으로 설명해 보자.\n\n## Ⅲ. \"말로 설명\" 자가점검\n| 주제 | 스스로 답해보기 |\n|---|---|\n| 안정도 | 기온이 낮아져도 왜 안정일 수 있나? (온위) |\n| 확산 | 역전층은 왜 고농도를 만드나? |\n| 굴뚝 | 유효굴뚝높이가 왜 중요한가? |\n| 집진 | 입자가 작을수록 왜 잡기 어려운가? |\n\n## Ⅳ. 답안·학습 전략\n- 기술사 답안은 **개념 → 원리 → 관리적 의의 → 최신 동향** 흐름이 안전하다.\n- 공식은 반드시 **의미와 함께** 적어야 감점을 피한다(\"이 식이 말하는 것은…\").\n\n## Ⅴ. 정리\n\"외우지 말고 설명하라. 흐름으로 이으면 오래 남는다.\"","side":[{"title":"틀리기 쉬운 개념","body":"### 체크\n- 기온감소=불안정? (X) 중립도 감소\n- Γs < Γd (습윤이 더 완만)\n- 절단입경은 작을수록 고성능\n- 직렬 집진은 관통율을 곱한다"},{"title":"답안 작성 팁","body":"### 요령\n- 개념→원리→의의→동향 4단 구성\n- 공식은 의미 한 줄과 함께\n- 표·그림으로 비교하면 가점"}]},"33":{"day":33,"date":"2026-09-02","title":"집진효율·부분집진율·절단입경","keywords":[{"k":"총집진효율 η","subs":["η=1−C_o/C_i","포집량/유입량"]},{"k":"관통율·직렬","subs":["P=1−η","직렬 P_t=ΠP_i"]},{"k":"부분집진효율","subs":["입경별, 미세일수록 낮음","총효율=Σ(부분효율×질량분율)"]},{"k":"절단입경 d_p50","subs":["부분효율 50% 입경","작을수록 고성능"]}],"answer":"# 집진효율·부분집진율·절단입경\n\n## Ⅰ. 왜 세 지표가 필요한가\n\"이 집진기 성능 좋아요\"는 애매하다. 성능을 정량화하려면 세 가지를 봐야 한다 — **얼마나 잡나(총효율), 어떤 크기를 잡나(부분효율), 어디까지 잡나(절단입경)**.\n\n## Ⅱ. 총집진효율 — 전체 성적표\nη = 1 − (나간 농도/들어온 농도), 놓친 비율이 관통율 P = 1 − η.\n- 핵심 직관: 장치를 **직렬**로 걸면 **관통율이 곱해진다**(P_t = P₁·P₂). 90%+90% = 총 **99%** → \"전처리 + 고효율\" 조합의 근거.\n\n## Ⅲ. 부분집진효율 — 크기별 성적표\n같은 장치라도 **큰 입자는 잘 잡고 작은 입자는 놓친다.** 입경별 효율을 그리면 미세영역에서 뚝 떨어지며, 총효율은 이 곡선을 질량분포로 가중평균한 값이다.\n\n## Ⅳ. 절단입경 — 성능의 대표 숫자\n부분효율이 딱 **50%가 되는 입경**. **작을수록 미세입자까지 잡는 고성능**이며, 장치 비교의 대표 스펙이다.\n\n## Ⅴ. 최근 동향\n- **평가 척도의 이동**: 질량기준 총효율만 보면 미세입자 성능이 과대평가된다. PM2.5·개수/표면적 기준 평가와 절단입경 관리가 중요해졌다.\n- **초저배출(ultra-low) 규제**: 먼지 배출기준이 10 mg/m³ 이하, 일부는 1 mg/m³급으로 강화되며 부분효율·미세영역 성능이 설계 기준이 된다.\n\n## Ⅵ. 정리\n\"전체·크기별·대표값 세 눈으로 본다. 미세입자 시대엔 절단입경이 진짜 성능.\"","side":[{"title":"직렬 효율의 직관","body":"### 요점\n- 직렬은 관통율의 곱: P_t=P₁·P₂\n- 90%+99% → 관통 0.1×0.01=0.001 → 총 99.9%\n- 사이클론(전처리)+백필터 조합의 근거"},{"title":"질량기준의 함정","body":"### 요점\n- 질량은 조대입자가 지배 → 미세성능 과대평가\n- PM2.5는 개수·표면적 비중↑\n- 초저배출은 미세영역 성능이 관건"}]},"34":{"day":34,"date":"2026-09-03","title":"중력식·관성력식 집진장치","keywords":[{"k":"침강실 효율","subs":["η=v_g·L/(H·u)","다단으로 H↓→효율↑"]},{"k":"최소포집입경","subs":["v_g=H·u/L 만족 입경"]},{"k":"관성력식","subs":["방향전환+배플 충돌","약 10㎛까지"]},{"k":"전처리 용도","subs":["조대입자>20㎛","후단 부하 경감"]}],"answer":"# 중력식·관성력식 집진장치\n\n## Ⅰ. 원시적이지만 여전히 쓰는 이유\n큰 먼지를 미리 걷어 두면 뒤쪽 고급 집진기가 오래 산다. 중력·관성 집진은 **전처리(pre-cleaner)**로서 지금도 현역이다.\n\n## Ⅱ. 중력식(침강실) — 그냥 가라앉히기\n넓은 방에 가스를 천천히 통과시키면 무거운 입자가 바닥에 가라앉는다.\n- 효율 **η = v_g·L/(H·u)** 가 말하는 것: **천천히(u↓)·길게(L↑)·낮게(H↓)** 지날수록 잘 가라앉는다.\n- 그래서 **선반(다단)**으로 H를 잘게 나누면 효율이 오른다.\n- 한계: 20㎛ 이상 조대입자, 저효율.\n\n## Ⅲ. 관성력식 — 관성으로 튕겨내기\n가스 길을 갑자기 꺾으면 가벼운 공기는 돌아가지만 무거운 입자는 관성으로 직진해 배플에 부딪혀 떨어진다. 중력식보다 조금 작은 입자(약 10㎛)까지 잡는다.\n\n## Ⅳ. 최근 동향\n- 단독으로는 규제를 못 맞추므로 **전처리 전용**으로 자리매김. 사이클론과 함께 고농도·조대분진 1차 제거에 쓰인다.\n- **CFD 기반 내부 유동 최적화**로 압력손실을 줄이고 재비산을 억제하는 설계 개선이 이뤄진다.\n\n## Ⅴ. 정리\n\"싸고 튼튼하지만 미세입자엔 약하다 → 전처리로 활용.\"","side":[{"title":"전처리의 가치","body":"### 요점\n- 조대·고농도를 1차 제거\n- 후단 백필터/EP 폐색·부하↓\n- 전체 시스템 수명·안정성↑"},{"title":"다단 침강실 직관","body":"### 요점\n- 효율은 L/H·v_g에 비례, u에 반비례\n- 선반으로 유효 침강높이↓ → 효율↑\n- 유속을 낮춰 재비산 방지(<3 m/s)"}]},"35":{"day":35,"date":"2026-09-04","title":"원심력집진장치 원리와 설계","keywords":[{"k":"이중 와류","subs":["외부 하강+내부 상승","접선 유입 선회류"]},{"k":"절단입경식","subs":["d_pc=√(9μW/2πN_e v_i(ρ_p−ρ))"]},{"k":"유효회전수 N_e","subs":["N_e=(1/H)[L_b+L_c/2]","통상 5~10"]},{"k":"입구속도","subs":["약 7~15 m/s","과속→재비산·손실↑"]}],"answer":"# 원심력집진장치(사이클론) 원리와 설계\n\n## Ⅰ. 개념 — 회전시켜 벽으로 던지기\n가스를 원통에 **접선**으로 밀어넣으면 소용돌이가 생기고, 무거운 입자는 원심력으로 벽에 던져져 흘러내린다. **바깥은 하강 와류, 안쪽은 상승 와류**의 이중구조가 핵심이다.\n\n## Ⅱ. 성능을 정하는 것 — 절단입경\n**d_pc = √( 9μW / (2π N_e v_i (ρ_p−ρ)) )** 는 복잡해 보이지만 말로 풀면 간단하다.\n- **빠르게 넣고(v_i↑)·많이 돌리고(N_e↑)·통로를 좁히면(W↓)** 더 작은 입자까지 벽으로 던진다(d_pc↓).\n- N_e(유효회전수)는 입자가 장치 안에서 도는 바퀴 수로, 보통 **5~10회**.\n\n## Ⅲ. 설계 포인트\n입구속도는 **7~15 m/s**가 적정. 너무 빠르면 내부 난류로 오히려 재비산·압력손실이 커진다. 고효율은 **소구경 멀티사이클론**으로 구현한다.\n\n## Ⅳ. 최근 동향\n- **CFD로 내부 소용돌이를 시각화**해 원추각·볼텍스파인더 등 형상을 최적화하는 설계가 표준화되고 있다.\n- 순환유동층 보일러·바이오매스·시멘트 등에서 여전히 핵심 전처리로 쓰이며, **세라믹 라이닝 등 내마모 소재**를 적용해 수명을 늘린다.\n\n## Ⅴ. 정리\n\"접선 유입 → 이중 와류 → 원심력으로 벽에 던짐. 빠르고 좁고 많이 돌릴수록 미세입자까지.\"","side":[{"title":"이중 와류","body":"### 그림\n- 접선 유입 → 외부 하강 와류(벽 따라 아래로)\n- 중심에서 내부 상승 와류(위로 배출)\n- 입자는 원심력으로 벽 → 하부 호퍼"},{"title":"입구속도의 딜레마","body":"### 요점\n- 속도↑ → 원심력↑ 효율↑\n- 그러나 과속은 난류·재비산으로 효율↓\n- 7~15 m/s 최적점 존재"}]},"36":{"day":36,"date":"2026-09-05","title":"원심력집진장치 효율인자·분리계수","keywords":[{"k":"분리계수 S","subs":["S=v_t²/(R·g)","소구경일수록 S↑"]},{"k":"효율 영향인자","subs":["입경·밀도·입구속도↑→효율↑","점도·구경↓→효율↑"]},{"k":"블로우다운","subs":["하부 5~10% 흡인","재비산 방지"]},{"k":"멀티클론","subs":["소구경 병렬로 고효율"]}],"answer":"# 사이클론 효율인자·분리계수\n\n## Ⅰ. 분리계수 — 원심력이 중력의 몇 배인가\n**S = v_t²/(R·g)** 는 회전으로 만든 원심력이 중력의 몇 배인지를 뜻한다. S가 크면 작은 입자도 벽으로 밀린다.\n- 핵심 직관: **구경(R)이 작을수록 S가 커진다.** 같은 속도라도 작은 원통이 더 세게 던진다 → **소구경 멀티클론이 고효율**인 이유.\n\n## Ⅱ. 효율을 좌우하는 인자\n입경·밀도↑, 입구속도↑, 구경↓, 가스점도↓ → 효율↑. 단, 속도를 지나치게 올리면 난류·재비산으로 **효율이 다시 떨어지는 최적점**이 있다.\n\n## Ⅲ. 블로우다운(Blow-down) — 바닥 먼지 재비산 막기\n하부에서 처리가스의 **5~10%를 살짝 빨아내면** 모아둔 먼지가 다시 떠오르지 않아 효율이 오른다.\n\n## Ⅳ. 최근 동향\n- **소구경 멀티클론 + 내마모(세라믹) 소재**로 고효율·장수명화가 진행된다.\n- 전처리 사이클론 성능을 **CFD로 예측**해 후단 백필터의 부하를 정량적으로 설계한다.\n\n## Ⅴ. 정리\n\"분리계수 = 원심력/중력. 작은 원통일수록 세게 던진다. 과속은 금물, 바닥 재비산은 블로우다운으로.\"","side":[{"title":"분리계수와 구경","body":"### 요점\n- S=v_t²/(R·g): R↓ → S↑\n- 같은 접선속도라도 소구경이 유리\n- 그래서 고효율=소구경 멀티클론"},{"title":"효율의 최적 속도","body":"### 요점\n- 저속: 원심력 부족 → 미세입자 놓침\n- 과속: 난류·재비산 → 효율 저하\n- 중간 최적속도에서 효율 최대"}]},"37":{"day":37,"date":"2026-09-06","title":"여과집진장치 원리와 여재 선정","keywords":[{"k":"4대 포집기구","subs":["관성충돌·차단·확산·정전기","확산은 미세입자 지배"]},{"k":"분진층(cake) 여과","subs":["실질 여과층","효율↑·압력손실↑"]},{"k":"여재 구비조건","subs":["내열·내식·강도·통기·탈진성"]},{"k":"여재 내열","subs":["폴리에스터 130~150, 노멕스 200","유리섬유 250~280, PTFE 250"]}],"answer":"# 여과집진장치(백필터) 원리와 여재 선정\n\n## Ⅰ. 개념 — 천으로 거르고, 쌓인 먼지로 다시 거른다\n여과포에 가스를 통과시켜 입자를 거른다. 흥미로운 점은 **처음엔 천이 거르지만 곧 천 위에 쌓인 먼지층(dust cake)이 진짜 필터가 된다**는 것. 그래서 시간이 갈수록 효율은 오르고 압력손실도 오른다.\n\n## Ⅱ. 어떻게 잡나 — 4가지 기구\n관성충돌(큰 입자)·직접차단·**확산(아주 작은 입자가 브라운운동으로 섬유에 붙음)**·정전기.\n- 가장 잡기 어려운 크기는 **0.1~0.3㎛(MPPS)** — 관성도 확산도 약한 구간. 이 영역 성능이 고성능의 관건.\n\n## Ⅲ. 여재 고르기 — 온도·화학성이 기준\n구비조건: 내열·내산/알칼리·강도·통기성·탈진성·경제성.\n| 여재 | 사용온도 |\n|---|---|\n| 폴리에스터 | 130~150℃ |\n| 노멕스(아라미드) | ~200℃ |\n| PTFE·유리섬유 | 250~280℃ |\n\n## Ⅳ. 최근 동향 (가장 활발한 분야)\n- **ePTFE 멤브레인 표면여과**: 미세 다공막을 코팅해 먼지가 속으로 파고들지 않고 표면에서 걸린다. 0.3~0.5㎛에서 **99.98%**, **초저배출(10→1 mg/m³급)**을 달성하며, 탈진이 잘 돼 **압력손실·에너지 절감** 효과.\n- **촉매 여과백(De-NOx·다이옥신 일체형)**: 여재에 SCR 촉매를 넣어 **먼지 포집 + NOx 제거 + 다이옥신 분해**를 한 장치에서 처리. 공정 단축으로 투자·운전비 최대 30% 절감(시멘트·소각·석회 산업 확대). **세라믹 촉매필터**는 고온에서 탈질·탈황·다이옥신·HCl/HF까지 동시 처리한다.\n- **나노섬유·고온여재**로 시멘트·소각 등 고온·초저배출에 대응한다.\n\n## Ⅴ. 정리\n\"천 → 먼지층으로 거른다. 가장 어려운 0.1~0.3㎛를 잡는 게 핵심. 요즘은 ePTFE 표면여과와 촉매여재가 대세.\"","side":[{"title":"MPPS(가장 잡기 어려운 크기)","body":"### 요점\n- 0.1~0.3㎛는 관성↓·확산↓ → 포집 최저(MPPS)\n- 이 구간을 잡아야 초저배출 달성\n- 먼지층 형성 후 전 영역 효율↑"},{"title":"촉매여재·ePTFE 동향","body":"### 요점\n- ePTFE: 표면여과 → 저압손실·고효율\n- 촉매백/세라믹필터: 먼지+NOx+다이옥신 일체\n- 시멘트·소각 중심 확대, 비용 30%↓"}]},"38":{"day":38,"date":"2026-09-07","title":"여과집진장치 탈진방식과 여과속도","keywords":[{"k":"탈진방식 3종","subs":["진동·역기류·충격제트","pulse-jet 주류"]},{"k":"pulse-jet","subs":["압축공기 순간분사","온라인·고농도·대용량"]},{"k":"여과속도(A/C)","subs":["=Q/A","낮을수록 효율·수명↑"]},{"k":"압력손실","subs":["Δp=여재+분진층 저항"]}],"answer":"# 여과집진 탈진방식과 여과속도\n\n## Ⅰ. 왜 털어야 하나\n먼지층이 쌓일수록 효율은 좋아지지만 압력손실이 커져 송풍 동력이 급증한다. 그래서 주기적으로 **털어내(탈진)** 압력을 관리한다. 탈진 방식과 통과속도가 성능·수명·전기요금을 결정한다.\n\n## Ⅱ. 탈진 3가지\n| 방식 | 원리 | 특징 |\n|---|---|---|\n| 진동형 | 흔들기 | 소규모·저농도 |\n| 역기류형 | 반대방향 저압공기 | 유리섬유백, 중대형 |\n| 충격제트형(pulse-jet) | 압축공기 순간 분사 | 가동 중 탈진, 고농도·대용량 **표준** |\n\n## Ⅲ. 여과속도(A/C비) — 천 1㎡가 처리하는 가스량\n**여과속도 = 가스량/여과면적.** **낮출수록** 압력손실↓·효율↑·백 수명↑(대신 설비는 커진다). pulse-jet은 약 **1~2 m/min**.\n\n## Ⅳ. 최근 동향\n- **표면여과(ePTFE) 여재로 저압손실 운전** → 송풍기 동력·탄소 절감. 탈진이 잘 돼 압축공기 사용량도 준다.\n- **스마트 탈진(clean-on-demand)**: 정해진 시간마다가 아니라 **차압을 실시간 감시해 필요할 때만** 탈진 → 압축공기 절약·백 수명 연장. IoT 컨트롤러가 여러 집진기의 차압을 통합 관리한다.\n\n## Ⅴ. 정리\n\"쌓이면 털고, 천천히 통과시킬수록 오래 간다. 요즘은 차압 기반 스마트 탈진과 저압손실 여재로 에너지를 아낀다.\"","side":[{"title":"탈진방식 선택","body":"### 요점\n- shaking: 단순·소규모\n- reverse-air: 부드러운 탈진, 유리섬유\n- pulse-jet: 강력·온라인, 고농도 대용량 표준"},{"title":"여과속도와 에너지","body":"### 요점\n- A/C비↑ → 압력손실·재비산↑, 수명↓\n- 점착·미세분진은 낮게 설계\n- 여과면적 = 가스량 / 목표 여과속도"}]},"39":{"day":39,"date":"2026-09-08","title":"여과집진장치 장애현상과 대책","keywords":[{"k":"눈막힘(blinding)","subs":["미세분진·유증기 폐색","프리코팅·온도관리"]},{"k":"백 파손","subs":["마모·화학공격·불티","케이지·기류분산"]},{"k":"결로·노점관리","subs":["노점+20℃ 이상 유지","보온·가열"]},{"k":"재비산·화재","subs":["과탈진 조절","스파크어레스터"]}],"answer":"# 여과집진 장애현상과 대책\n\n## Ⅰ. 백필터는 결국 소모품 관리\n여과포는 언젠가 막히거나 찢어지거나 젖는다. **장애를 미리 잡는 것**이 안정운전의 핵심이다.\n\n## Ⅱ. 대표 장애 — 원인과 대책\n| 장애 | 원인 | 대책 |\n|---|---|---|\n| 눈막힘(blinding) | 미세분진·유증기·조해성분 | 여재변경·프리코팅·온도관리 |\n| 백 파손 | 마모·화학공격·불티 | 케이지·기류분산·스파크방지 |\n| 결로(응축) | 노점 이하 운전 | 보온·가열, **노점+20℃ 이상** |\n| 재비산 | 과탈진·고여과속도 | 탈진주기·압력 조절 |\n| 화재 | 고온·불티 | 온도감시·스파크어레스터 |\n\n## Ⅲ. 진단의 열쇠 — 차압\n차압이 **서서히 오르면** 눈막힘, **갑자기 떨어지면** 백 파손/누설. 차압 하나로 장치 상태를 읽는다.\n\n## Ⅳ. 최근 동향\n- **IoT 예지보전**: 차압·배출농도·진동·온도를 실시간 수집·분석해 고장을 **사전 예측**하고 계획정비로 전환 → 비계획 정지 최소화, 백 수명 연장.\n- **미세누설 관리**: 작은 핀홀 누설이 PM2.5 배출에 크게 기여함이 밝혀져, **TMS(굴뚝 자동측정)·먼지센서와 연계한 상시 감시**가 강화되고 있다.\n\n## Ⅴ. 정리\n\"막힘·파손·결로·재비산·화재를 차압으로 읽는다. 요즘은 IoT로 미리 예측하고 미세누설까지 감시.\"","side":[{"title":"차압으로 상태 읽기","body":"### 요점\n- 서서히↑ = 눈막힘/탈진불량\n- 갑자기↓ = 백 파손/누설\n- 정상범위 설정·경보로 조기 대응"},{"title":"IoT 예지보전·TMS","body":"### 요점\n- 차압·진동·온도·배출 실시간 감시\n- 고장 사전 예측 → 계획정비\n- TMS·먼지센서로 미세누설 관리"}]},"40":{"day":40,"date":"2026-09-09","title":"1단계 이론·확산·집진 회독 5회차","keywords":[{"k":"집진 5대 공식","subs":["Stokes·총효율·절단입경·분리계수·여과속도"]},{"k":"장치별 특성","subs":["중력·관성·원심·여과","대상입경·효율·손실"]},{"k":"절단입경","subs":["사이클론 d_pc","부분효율 50%"]},{"k":"회독 인출","subs":["백지 유도 점검"]}],"answer":"# 1단계 회독 5회차 — 집진 통합 정리\n\n## Ⅰ. 집진의 큰 그림\n\"입자를 어떤 힘으로 벽/천으로 보내느냐\"가 집진의 전부다. 중력·관성·원심력으로 밀거나, 천으로 거른다. **미는 힘이 약할수록 잡을 수 있는 입경이 작아지고 효율이 오른다.**\n\n## Ⅱ. 장치 한눈에\n| 장치 | 미는 힘 | 대상입경 | 효율 | 압력손실 |\n|---|---|---|---|---|\n| 중력식 | 중력 | >20㎛ | 저 | 매우낮음 |\n| 관성력식 | 관성 | >10㎛ | 저~중 | 낮음 |\n| 원심력식 | 원심력 | >5㎛ | 중~고 | 중 |\n| 여과식 | 여과·먼지층 | <1㎛ | 매우높음 | 높음 |\n\n## Ⅲ. 개념 인출 (공식은 의미로)\n- 작은 입자는 슬립(C_c)으로 덜 저항, 큰 입자는 항력법칙이 바뀐다.\n- 직렬 집진은 관통율이 곱해진다.\n- 사이클론은 작은 원통일수록 세게 던진다(분리계수).\n- 백필터는 **먼지층이 진짜 필터**다.\n\n## Ⅳ. 최근 동향 요약\n- **규제**: 초저배출(→1 mg/m³) · 통합환경허가/BAT.\n- **여과**: ePTFE 표면여과, 촉매여재(먼지+NOx+다이옥신 일체).\n- **운영**: IoT 예지보전·스마트 탈진으로 에너지·수명 최적화.\n\n## Ⅴ. 정리\n\"힘으로 밀거나 천으로 거른다. 미세할수록 여과, 요즘은 일체형·저압손실·스마트가 대세.\"","side":[{"title":"장치 선정 기준","body":"### 요점\n- 입경·농도·온도·점착성으로 선정\n- 조대·고농도: 사이클론(전처리)\n- 미세·고효율: 백필터/전기집진"},{"title":"빈출 개념 정리","body":"### 요점\n- Cunningham·항력 영역\n- 직렬 관통율 곱\n- 분리계수 S=v_t²/Rg\n- ePTFE·촉매여재·IoT 동향"}]}};

var SUP='⁰¹²³⁴⁵⁶⁷⁸⁹', SUB='₀₁₂₃₄₅₆₇₈₉';
function supNum(s){ return s.split('').map(function(c){return SUP.indexOf(c);}).join(''); }
function subNum(s){ return s.split('').map(function(c){return SUB.indexOf(c);}).join(''); }

function sym(t){
  for(var i=0;i<SYM.length;i++) t = t.replace(SYM[i][0], SYM[i][1]);
  // 최종 정리: 남은 마크다운·수학기호 제거
  t = t.replace(/u\s*\*+/g,'유 스타').replace(/w\s*\*+/g,'더블유 스타');
  t = t.replace(/\|/g,' ').replace(/\*/g,'');
  t = t.replace(/\s+/g,' ');
  return t;
}

function inlineClean(t){
  return t.replace(/\*\*([^*]+)\*\*/g,'$1')
          .replace(/\*([^*\n]+)\*/g,'$1')
          .replace(/`([^`]+)`/g,'$1')
          .replace(/\\/g,'')
          .replace(/\s+/g,' ').trim();
}

/* 마크다운 → 읽기용 문장 배열 */
function toSpeech(md){
  var lines = md.split('\n'), out = [], i = 0;
  function push(s){
    s = sym(inlineClean(s));
    s = s.replace(/\s+/g,' ').replace(/^[\s.,·-]+/,'').trim();
    if(s.length > 1) out.push(s);
  }
  while(i < lines.length){
    var l = lines[i];
    if(/^```/.test(l)){                        // 코드블록(흐름도) — 건너뜀
      i++; while(i<lines.length && !/^```/.test(lines[i])) i++;
      i++; continue;
    }
    if(/^\|/.test(l) && i+1<lines.length && /^\|[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var cells = function(r){
        var a = r.split('|'); a.shift();
        if(a.length && /^\s*$/.test(a[a.length-1])) a.pop();
        return a.map(function(x){ return inlineClean(x); });
      };
      var head = cells(l); i += 2;
      var rows = [];
      while(i<lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      rows.forEach(function(r){
        if(!r.length) return;
        var first = r[0];
        if(!first) return;
        var parts = [];
        for(var k=1;k<r.length;k++){
          var v = r[k];
          if(!v || v==='-' || v==='—') continue;
          var h = head[k] || '';
          parts.push(h ? (h + ' ' + v) : v);
        }
        push(parts.length ? (first + ', ' + parts.join(', ') + '.') : (first + '.'));
      });
      continue;
    }
    var hm = l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ push(hm[2] + '.'); i++; continue; }
    if(/^---+\s*$/.test(l)){ i++; continue; }
    if(/^>\s?/.test(l)){ push(l.replace(/^>\s?/,'')); i++; continue; }
    if(/^\s*\d+\.\s+/.test(l)){ push(l.replace(/^\s*(\d+)\.\s+/,'$1. ')); i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ push(l.replace(/^\s*[-*]\s+/,'')); i++; continue; }
    if(/^\s*$/.test(l)){ i++; continue; }
    push(l); i++;
  }
  // 긴 문장 분할 (안드로이드 TTS 안정성)
  var fin = [];
  out.forEach(function(s){
    if(s.length <= 170){ fin.push(s); return; }
    var buf = '';
    s.split(/(?<=[.。!?])\s+|(?<=다)\s+(?=[가-힣])|,\s+/).forEach(function(p){
      if((buf + p).length > 170 && buf){ fin.push(buf.trim()); buf = ''; }
      buf += p + ' ';
    });
    if(buf.trim()) fin.push(buf.trim());
  });
  return fin;
}

/* 하루 분량 전체를 재생 큐로 */
function buildQueue(L){
  var q = [];
  q.push({sec:'제목', t:'오늘의 주제. ' + sym(L.title) + '.'});
  q.push({sec:'키워드', t:'핵심 키워드 5가지입니다.'});
  L.keywords.forEach(function(k,i){
    q.push({sec:'키워드', t:(i+1) + '. ' + sym(inlineClean(k.k)) + '. ' + k.subs.map(function(s){return sym(inlineClean(s));}).join(', ') + '.'});
  });
  q.push({sec:'답안', t:'이제 메인 답안입니다.'});
  toSpeech(L.answer).forEach(function(t){ q.push({sec:'답안', t:t}); });
  L.side.forEach(function(s,i){
    q.push({sec:'사이드'+(i+1), t:'사이드 주제 ' + (i+1) + '. ' + sym(inlineClean(s.title)) + '.'});
    toSpeech(s.body).forEach(function(t){ q.push({sec:'사이드'+(i+1), t:t}); });
  });
  q.push({sec:'종료', t:'오늘 분량이 끝났습니다. 수고하셨습니다.'});
  return q;
}

return { toSpeech: toSpeech, buildQueue: buildQueue, sym: sym };

/* ===== 재생 엔진 ===== */
var Player = (function(){
'use strict';
var SUP = ('speechSynthesis' in window);
var q=[], idx=0, playing=false, rate=1.0, voice=null, wake=null, curDayNo=null;
var onTick = function(){};

function pickVoice(){
  if(!SUP) return null;
  var vs = speechSynthesis.getVoices()||[];
  var ko = vs.filter(function(v){ return /^ko(-|_)?/i.test(v.lang||''); });
  return ko[0] || null;
}
if(SUP){
  try{ speechSynthesis.onvoiceschanged = function(){ voice = pickVoice(); }; }catch(e){}
}

function reqWake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(w){
    wake = w;
    w.addEventListener('release', function(){ wake = null; });
  }).catch(function(){});
}
function relWake(){ if(wake){ try{ wake.release(); }catch(e){} wake=null; } }
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && playing) reqWake();
});

function speakAt(i){
  if(!SUP || i>=q.length){ stop(true); return; }
  idx = i; onTick();
  var u = new SpeechSynthesisUtterance(q[i].t);
  u.lang='ko-KR'; u.rate=rate; u.pitch=1;
  if(voice) u.voice=voice;
  u.onend = function(){ if(playing) speakAt(idx+1); };
  u.onerror = function(){ if(playing) setTimeout(function(){ speakAt(idx+1); },250); };
  try{ speechSynthesis.speak(u); }catch(e){}
}

function load(dayNo, L){
  if(curDayNo!==dayNo){ q = TTS.buildQueue(L); idx = 0; curDayNo = dayNo; }
  return q.length;
}
function play(){
  if(!SUP || !q.length) return;
  if(!voice) voice = pickVoice();
  playing = true; reqWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(function(){ speakAt(idx); }, 60);
  onTick();
}
function pause(){
  playing = false; relWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  onTick();
}
function stop(done){
  playing = false; relWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  if(done) idx = 0;
  onTick();
}
function jump(d){
  var n = Math.max(0, Math.min(q.length-1, idx+d));
  idx = n;
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
function jumpSection(dir){
  var cur = q[idx] ? q[idx].sec : null, i = idx;
  while(i>=0 && i<q.length){
    i += dir;
    if(!q[i]) break;
    if(q[i].sec !== cur){ break; }
  }
  idx = Math.max(0, Math.min(q.length-1, i));
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
function setRate(r){
  rate = r;
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
return {
  supported: SUP, load: load, play: play, pause: pause, stop: stop,
  jump: jump, jumpSection: jumpSection, setRate: setRate,
  isPlaying: function(){ return playing; },
  pos: function(){ return {i: idx, n: q.length, sec: q[idx]?q[idx].sec:'', t: q[idx]?q[idx].t:''}; },
  rate: function(){ return rate; },
  onTick: function(f){ onTick = f; }
};
})();

var C = window.CURRICULUM, LS = window.LESSONS;
var KEY='amt_done_v1', KEYSET='amt_settings_v1';

/* ---------- storage ---------- */
var MEM={};
var STORE_OK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function sGet(k){ if(STORE_OK){try{return localStorage.getItem(k);}catch(e){}} return MEM[k]||null; }
function sSet(k,v){ if(STORE_OK){try{localStorage.setItem(k,v);return;}catch(e){}} MEM[k]=v; }
function loadDone(){ try{return JSON.parse(sGet(KEY))||{};}catch(e){return {};} }

/* ---------- date utils ---------- */
function iso(d){var m=d.getMonth()+1,dy=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dy<10?'0':'')+dy;}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){return iso(new Date());}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

var DAYS=C.days, BYDATE={}, BYDAY={};
DAYS.forEach(function(d){BYDATE[d.date]=d;BYDAY[d.day]=d;});

/* 오늘에 해당하는 학습일 (범위 밖이면 가장 가까운 날) */
function currentDay(){
  var t=todayISO();
  if(BYDATE[t]) return BYDATE[t];
  if(t < C.start) return DAYS[0];
  return DAYS[DAYS.length-1];
}

/* ---------- streak ---------- */
function streak(){
  var n=0, d=new Date(), guard=0;
  // 오늘 미완료면 어제부터 센다
  if(!DONE[iso(d)]) d.setDate(d.getDate()-1);
  while(guard++<400){ if(DONE[iso(d)]){n++;d.setDate(d.getDate()-1);} else break; }
  return n;
}
function bestStreak(){
  var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
  var best=0,cur=0,prev=null;
  ks.forEach(function(k){
    if(prev && daysBetween(prev,k)===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=k;
  });
  return best;
}
function doneCount(){var n=0;for(var k in DONE){if(DONE[k])n++;}return n;}

/* ---------- markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(src){
  var lines=esc(src).split('\n'), out=[], i=0;
  function flushList(tag,items){ if(items.length){out.push('<'+tag+'>'+items.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</'+tag+'>');} }
  while(i<lines.length){
    var l=lines[i];
    // code fence
    if(/^```/.test(l)){
      var buf=[];i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out.push('<pre><code>'+buf.join('\n')+'</code></pre>'); continue;
    }
    // table
    if(/^\|/.test(l) && i+1<lines.length && /^\|[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var head=l, rows=[]; i+=2;
      while(i<lines.length && /^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){var a=r.split('|');a.shift();if(a.length&&/^\s*$/.test(a[a.length-1]))a.pop();return a.map(function(x){return inline(x.trim());});};
      var h='<tr>'+cells(head).map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
      var b=rows.map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('');
      out.push('<div class="tblwrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>');
      continue;
    }
    // heading
    var hm=l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){var lv=Math.min(hm[1].length,4);out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>');i++;continue;}
    // hr
    if(/^---+\s*$/.test(l)){out.push('<hr>');i++;continue;}
    // blockquote
    if(/^&gt;\s?/.test(l)){
      var q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^&gt;\s?/,''));i++;}
      out.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>');continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(l)){
      var oi=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){oi.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      flushList('ol',oi);continue;
    }
    // unordered list
    if(/^\s*[-*]\s+/.test(l)){
      var ui=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ui.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      flushList('ul',ui);continue;
    }
    if(/^\s*$/.test(l)){i++;continue;}
    // paragraph
    var p=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^[#|`]|^&gt;|^\s*[-*]\s|^\s*\d+\.\s|^---+\s*$/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+inline(p.join('<br>'))+'</p>');
  }
  return out.join('');
}

  /* topic */
  h+='<div class="card"><div class="row" style="margin-bottom:8px"><div>'+pill(d)+' <span class="badge">'+d.phaseName+'</span></div>'+(isDone?'<span class="badge ok">✓ 완료</span>':'')+'</div>';
  h+='<div style="font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.3px">'+d.title+'</div></div>';

  if(!L){
    h+='<div class="card"><div class="empty">📘 이 날짜의 상세 본문은<br>ver.1.0에 아직 포함되지 않았습니다.<br><br><span class="mini">현재 Day 1~14 본문 제공<br>(다음 버전에서 확대 예정)</span></div></div>';
    h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
    h+='</div>';
    app.innerHTML=h; bindToday(d); return;
  }
  /* keywords */
  h+=playerHTML();
  h+='<h2 class="sec">핵심 키워드 5</h2><div class="card">';
  L.keywords.forEach(function(k,idx){
    h+='<div class="kw"><b>'+(idx+1)+'. '+k.k+'</b><ul>'+k.subs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>';
  });
  h+='</div>';
  /* main answer */
  h+='<h2 class="sec">메인 답안 (A4 3장 분량)</h2>';
  h+='<details class="acc" open><summary>📝 '+L.title+'</summary><div class="inner md">'+md(L.answer)+'</div></details>';
  /* side */
  h+='<h2 class="sec">사이드 주제 ('+L.side.length+')</h2>';
  L.side.forEach(function(s,idx){
    h+='<details class="acc"><summary>'+(idx+1)+'. '+s.title+'</summary><div class="inner md">'+md(s.body)+'</div></details>';
  });
  /* actions */
  h+='<div style="height:6px"></div>';
  h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
  h+='<div style="height:9px"></div><div class="btn2">';
  h+='<button class="btn ghost" id="prev"'+(d.day<=1?' disabled':'')+'>← 이전날</button>';
  h+='<button class="btn ghost" id="next"'+(d.day>=C.total?' disabled':'')+'>다음날 →</button></div>';
  if(curDay && curDay.date!==todayISO()){
    h+='<div style="height:9px"></div><button class="btn ghost" id="goto">오늘로 돌아가기</button>';
  }
  h+='</div>';
  app.innerHTML=h; bindToday(d); bindPlayer(d,L);
}
function playerHTML(){
  if(!Player.supported) return '';
  var p=Player.pos(), on=Player.isPlaying();
  var pct=p.n?Math.round((p.i+1)/p.n*100):0;
  var h='<h2 class="sec">듣기 (운전 중 학습)</h2><div class="card ply">';
  h+='<div class="row" style="margin-bottom:10px"><div><span class="badge ac">'+(p.sec||'대기')+'</span> <span class="mini">'+(p.n?(p.i+1)+' / '+p.n+' 문장':'준비')+'</span></div><span class="mini">'+pct+'%</span></div>';
  h+='<div class="pbar" style="margin:0 0 12px"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="nowtx" id="nowtx">'+(p.t?esc(p.t):'재생 버튼을 누르면 오늘 분량을 처음부터 끝까지 읽어줍니다.')+'</div>';
  h+='<div class="plyrow">';
  h+='<button class="pbtn" id="pPrevS" title="이전 구간">⏮</button>';
  h+='<button class="pbtn" id="pPrev" title="이전 문장">◀</button>';
  h+='<button class="pbtn big" id="pPlay">'+(on?'⏸':'▶')+'</button>';
  h+='<button class="pbtn" id="pNext" title="다음 문장">▶</button>';
  h+='<button class="pbtn" id="pNextS" title="다음 구간">⏭</button>';
  h+='</div>';
  h+='<div class="plyrow2"><span class="mini">속도</span>';
  [0.8,1.0,1.2,1.4,1.6].forEach(function(r){
    h+='<button class="rbtn'+(Math.abs(Player.rate()-r)<0.01?' on':'')+'" data-r="'+r+'">'+r.toFixed(1)+'x</button>';
  });
  h+='<button class="rbtn" id="pStop">처음</button></div>';
  h+='<div class="mini" style="margin-top:10px">화면이 꺼지면 재생이 멈춥니다. 차량 거치대에 두고 화면을 켜두세요. 운전 중에는 조작하지 마시고 출발 전에 재생을 눌러두시면 끝까지 이어집니다.</div>';
  h+='</div>';
  return h;
}
function bindPlayer(d,L){
  if(!Player.supported||!L) return;
  Player.load(d.day,L);
  Player.onTick(function(){
    var p=Player.pos(), on=Player.isPlaying();
    var el=document.getElementById('nowtx'); if(el&&p.t) el.textContent=p.t;
    var pb=document.getElementById('pPlay'); if(pb) pb.textContent=on?'⏸':'▶';
    var bar=document.querySelector('.ply .pbar i'); if(bar&&p.n) bar.style.width=Math.round((p.i+1)/p.n*100)+'%';
    var rw=document.querySelector('.ply .row'); if(rw&&p.n) rw.innerHTML='<div><span class="badge ac">'+(p.sec||'')+'</span> <span class="mini">'+(p.i+1)+' / '+p.n+' 문장</span></div><span class="mini">'+Math.round((p.i+1)/p.n*100)+'%</span>';
  });
  var g=function(id){return document.getElementById(id);};
  if(g('pPlay')) g('pPlay').onclick=function(){ Player.isPlaying()?Player.pause():Player.play(); };
  if(g('pPrev')) g('pPrev').onclick=function(){ Player.jump(-1); };
  if(g('pNext')) g('pNext').onclick=function(){ Player.jump(1); };
  if(g('pPrevS')) g('pPrevS').onclick=function(){ Player.jumpSection(-1); };
  if(g('pNextS')) g('pNextS').onclick=function(){ Player.jumpSection(1); };
  if(g('pStop')) g('pStop').onclick=function(){ Player.stop(true); toast('처음으로 이동'); };
  Array.prototype.forEach.call(document.querySelectorAll('.rbtn[data-r]'),function(b){
    b.onclick=function(){
      Player.setRate(parseFloat(b.getAttribute('data-r')));
      Array.prototype.forEach.call(document.querySelectorAll('.rbtn[data-r]'),function(x){x.classList.remove('on');});
      b.classList.add('on');
    };
  });
}
function bindToday(d){
  var mk=document.getElementById('mk');
  if(mk) mk.onclick=function(){
    if(DONE[d.date]){ delete DONE[d.date]; toast('완료 취소'); }
    else { DONE[d.date]=true; toast('🔥 '+streak()+'일 연속! 잘하고 있어요'); }
    saveDone(DONE); viewToday();
  };
  var p=document.getElementById('prev'), n=document.getElementById('next'), g=document.getElementById('goto');
  if(p) p.onclick=function(){Player.stop(true);curDay=BYDAY[d.day-1];window.scrollTo(0,0);viewToday();};
  if(n) n.onclick=function(){Player.stop(true);curDay=BYDAY[d.day+1];window.scrollTo(0,0);viewToday();};
  if(g) g.onclick=function(){curDay=null;window.scrollTo(0,0);viewToday();};
}

function viewCal(){
  var t=new Date();
  if(!calYM) calYM={y:t.getFullYear(),m:t.getMonth()};
  var y=calYM.y,m=calYM.m;
  var first=new Date(y,m,1), last=new Date(y,m+1,0);
  var pad=first.getDay(), n=last.getDate();
  var sD=parseISO(C.start), eD=parseISO(C.end);
  var h='';
  h+='<div class="hd"><h1>학습 캘린더</h1><div class="sub">매일 꾸준히 — 연속 '+streak()+'일 · 최고 '+bestStreak()+'일</div></div>';
  h+='<div class="wrap">';
  h+='<div class="hero"><div class="big">🔥 '+streak()+'일</div><div class="lbl">현재 연속 학습</div>'+
     '<div class="stats"><div><b>'+doneCount()+'</b><span>총 완료일</span></div><div><b>'+bestStreak()+'</b><span>최고 기록</span></div>'+
     '<div><b>'+Math.round(doneCount()/C.total*100)+'%</b><span>전체 진도</span></div></div></div>';
  h+='<div class="card">';
  h+='<div class="calhd"><button class="navb" id="pm">‹</button><b>'+y+'년 '+(m+1)+'월</b><button class="navb" id="nm">›</button></div>';
  h+='<div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>';
  h+='<div class="grid">';
  for(var i=0;i<pad;i++) h+='<div class="cell pad"></div>';
  for(var dd=1;dd<=n;dd++){
    var cur=new Date(y,m,dd), s=iso(cur), cls='cell', dot='';
    var inRange = cur>=sD && cur<=eD;
    if(!inRange) cls+=' out';
    if(DONE[s]) {cls+=' done';}
    else if(inRange && cur<t && s!==todayISO()) cls+=' miss';
    if(s===todayISO()) cls+=' today';
    if(inRange && LS[String((BYDATE[s]||{}).day)]) dot='<div class="dot"></div>';
    h+='<div class="'+cls+'" data-d="'+s+'">'+dd+dot+'</div>';
  }
  h+='</div>';
  h+='<div class="legend">'+
     '<span><i style="background:#2f9c6a"></i>학습 완료</span>'+
     '<span><i style="background:rgba(255,92,92,.25)"></i>미완료</span>'+
     '<span><i style="border:2px solid #5ec9a8;background:none"></i>오늘</span>'+
     '<span><i style="background:#5ec9a8;border-radius:50%;width:7px;height:7px"></i>본문 제공일</span></div>';
  h+='</div>';
  h+='<div class="card tight"><div class="mini">📅 날짜를 탭하면 해당 일자의 학습으로 이동합니다. 완료 체크는 학습 화면에서 하세요.</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('pm').onclick=function(){calYM={y:m===0?y-1:y,m:m===0?11:m-1};viewCal();};
  document.getElementById('nm').onclick=function(){calYM={y:m===11?y+1:y,m:m===11?0:m+1};viewCal();};
  Array.prototype.forEach.call(document.querySelectorAll('.cell[data-d]'),function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-d');
      if(BYDATE[s]){ curDay=BYDATE[s]; setTab('today'); }
      else toast('학습 기간이 아닙니다');
    };
  });
}

function viewCurr(){
  var h='';
  h+='<div class="hd"><h1>전체 커리큘럼</h1><div class="sub">'+C.start+' ~ '+C.end+' · 총 '+C.total+'일 · 완료 '+doneCount()+'일</div></div>';
  h+='<div class="wrap">';
  var lastPhase=null, open=false;
  DAYS.forEach(function(d){
    if(d.phaseName!==lastPhase){
      if(open) h+='</div>';
      h+='<div class="listcard"><div class="phase">'+d.phaseName+'</div>';
      lastPhase=d.phaseName; open=true;
    }
    var cls='item'+(DONE[d.date]?' isdone':'')+(d.date===todayISO()?' istoday':'');
    var st=DONE[d.date]?'✅':(LS[String(d.day)]?'📘':'⚪');
    h+='<div class="'+cls+'" data-day="'+d.day+'"><div class="n">D'+d.day+'</div>'+
       '<div class="t"><b>'+d.title+'</b><span>'+d.date+' ('+d.dow+') · '+d.cat+'</span></div>'+
       '<div class="st">'+st+'</div></div>';
  });
  if(open) h+='</div>';
  h+='<div class="card tight"><div class="mini">✅ 완료 · 📘 본문 제공(ver.1.0) · ⚪ 제목만 (다음 버전 확대)</div></div>';
  h+='</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.item[data-day]'),function(el){
    el.onclick=function(){curDay=BYDAY[+el.getAttribute('data-day')];setTab('today');};
  });
}

function viewStat(){
  var byPhase={}, byCat={};
  DAYS.forEach(function(d){
    byPhase[d.phaseName]=byPhase[d.phaseName]||{t:0,d:0};
    byPhase[d.phaseName].t++; if(DONE[d.date]) byPhase[d.phaseName].d++;
    byCat[d.cat]=byCat[d.cat]||{t:0,d:0};
    byCat[d.cat].t++; if(DONE[d.date]) byCat[d.cat].d++;
  });
  var dleft=daysBetween(todayISO(),C.end);
  var elapsed=daysBetween(C.start,todayISO())+1;
  var expect=Math.max(0,Math.min(elapsed,C.total));
  var h='';
  h+='<div class="hd"><h1>학습 통계</h1><div class="sub">시험까지 D-'+(dleft>=0?dleft:0)+' · 목표 60점 합격</div></div>';
  h+='<div class="wrap">';
  h+='<div class="card"><div class="row"><b>전체 진도</b><span class="badge ac">'+doneCount()+' / '+C.total+'일</span></div>'+
     '<div class="pbar" style="margin-top:10px"><i style="width:'+(doneCount()/C.total*100)+'%"></i></div>'+
     '<div class="mini" style="margin-top:9px">예정 '+expect+'일 대비 <b style="color:'+(doneCount()>=expect?'#3ddc84':'#ffb020')+'">'+
     (doneCount()>=expect?'+':'')+(doneCount()-expect)+'일</b></div></div>';
  h+='<h2 class="sec">단계별 진도</h2><div class="card">';
  Object.keys(byPhase).forEach(function(k){
    var v=byPhase[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:13px"><div class="row" style="margin-bottom:5px"><span style="font-size:13.5px;font-weight:600">'+k+'</span><span class="mini">'+v.d+'/'+v.t+'</span></div>'+
       '<div class="pbar"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">분야별 진도</h2><div class="card">';
  Object.keys(byCat).sort(function(a,b){return byCat[b].t-byCat[a].t;}).forEach(function(k){
    var v=byCat[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:11px"><div class="row" style="margin-bottom:4px"><span style="font-size:13px">'+k+'</span><span class="mini">'+v.d+'/'+v.t+' ('+p+'%)</span></div>'+
       '<div class="pbar" style="height:5px"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">데이터 관리</h2>';
  if(!STORE_OK){
    h+='<div class="card" style="border-color:#7a5a20;background:rgba(255,176,32,.08)">'+
       '<div style="font-size:13.5px;color:#ffc357;font-weight:700;margin-bottom:6px">⚠️ 저장 기능이 꺼져 있습니다</div>'+
       '<div class="mini">지금 방식으로는 앱을 닫으면 기록이 사라집니다. 아래 <b>기록 내보내기</b>로 백업하거나, README의 GitHub Pages 방법으로 설치하면 자동 저장됩니다.</div></div>';
  }
  h+='<div class="card"><div class="mini" style="margin-bottom:11px">학습 기록은 이 기기에만 저장됩니다. 기기를 바꾸기 전에 내보내기로 백업하세요.</div>'+
     '<div class="btn2"><button class="btn ghost" id="exp">기록 내보내기</button><button class="btn ghost" id="imp">기록 불러오기</button></div>'+
     '<div style="height:9px"></div><button class="btn ghost" id="rst">기록 초기화</button></div>';
  h+='<div class="card tight"><div class="mini">대기관리기술사 학습앱 <b>ver.1.0</b><br>커리큘럼 194일 · 본문 Day 1~14 수록<br>114~138회 기출 325문항 분석 기반</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('exp').onclick=function(){
    var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
    var txt=ks.join(',');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('클립보드에 복사됨 ('+ks.length+'일)');},
        function(){prompt('아래 내용을 복사해 보관하세요',txt);});
    } else prompt('아래 내용을 복사해 보관하세요',txt);
  };
  document.getElementById('imp').onclick=function(){
    var v=prompt('내보내기한 완료일 목록을 붙여넣으세요\n(예: 2026-08-01,2026-08-02)','');
    if(v===null) return;
    var n=0;
    v.split(/[,\s]+/).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)){DONE[k]=true;n++;} });
    saveDone(DONE); toast(n+'일 불러왔습니다'); viewStat();
  };
  document.getElementById('rst').onclick=function(){
    if(confirm('모든 학습 기록을 삭제할까요? 되돌릴 수 없습니다.')){DONE={};saveDone(DONE);toast('초기화되었습니다');viewStat();}
  };
}

/* ---------- toast ---------- */
var tEl=null,tTimer=null;
function toast(msg){
  if(!tEl){tEl=document.createElement('div');tEl.className='toast';document.body.appendChild(tEl);}
  tEl.textContent=msg; tEl.classList.add('on');
  clearTimeout(tTimer); tTimer=setTimeout(function(){tEl.classList.remove('on');},1900);
}

/* ---------- tabs ---------- */
function setTab(t){
  if(Player.supported && t!=='today') Player.pause();
  tab=t; window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-t')===t);
  });
  if(t==='today') viewToday();
  else if(t==='cal') viewCal();
  else if(t==='curr') viewCurr();
  else viewStat();
}
function initTabs(){
  var n=document.createElement('div'); n.className='tabs';
  n.innerHTML=
   '<button data-t="today" class="on"><span class="ic">📖</span>오늘의 학습</button>'+
   '<button data-t="cal"><span class="ic">🗓</span>캘린더</button>'+
   '<button data-t="curr"><span class="ic">📋</span>커리큘럼</button>'+
   '<button data-t="stat"><span class="ic">📊</span>통계</button>';
  document.body.appendChild(n);
  Array.prototype.forEach.call(n.querySelectorAll('button'),function(b){
    b.onclick=function(){ if(b.getAttribute('data-t')==='today') curDay=null; setTab(b.getAttribute('data-t')); };
  });
}
initTabs(); setTab('today');
window.__APP={md:md,streak:streak,DAYS:DAYS,LS:LS};
})();

</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
