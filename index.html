확인(마모성·점착성)\n   마모성 심함 → 역기류형(충격 적음) 고려\n3. 설치면적 제약 확인\n   부지 협소 → 고A/C비 가능한 펄스제트형 유리\n4. 유지관리 인력·비용 여건 확인\n   압축공기 설비(펄스제트 필수) 운영 가능 여부 확인\n```\n\n### 실무 트러블슈팅\n| 증상 | 추정 원인 | 조치 |\n|---|---|---|\n| 압력손실 지속 상승(탈진 무효) | 블라인딩(눈막힘) 진행 | 여재 세척 또는 교체, 압축공기 압력 점검 |\n| 배출농도 간헐적 급상승 | 백 파손·핀홀 | 개별 모듈 격리 후 육안·연막점검 |\n| 탈진 직후 압력손실 미회복 | 케이크 고착(습분·점착성 분진) | 운전온도 상향(결로방지), 예열계통 점검 |\n| 특정 모듈만 압력손실 편차 큼 | 유량 편중, 밸브 오작동 | 댐퍼·밸브 개도 점검 |\n\n### 압축공기 설비 관리(펄스제트형)\n펄스제트형은 탈진용 압축공기 공급이 필수이므로, 공기압축기 용량 부족·건조기 미비로 인한 수분 혼입 시 오히려 여재 결로·부식을 유발할 수 있어 압축공기 품질(노점) 관리도 설계에 포함해야 한다.\n\n### 압축공기 사용량 산정 개념\n펄스제트 탈진의 압축공기 사용량은 백 개수·탈진 빈도·펄스 지속시간에 비례하므로, 대형 설비일수록 전용 공기압축기 계통을 별도로 구성하고 예비 압축기(N+1)를 확보하는 것이 안정 운전의 관건이다. 압축공기 공급 중단은 곧 탈진 정지로 이어져 단시간 내 압력손실 급상승·처리유량 저하를 초래할 수 있다."}]},"39":{"day":39,"date":"2026-09-08","title":"여과집진장치 장애현상과 대책","keywords":[{"k":"블라인딩(Blinding)","subs":["여재 공극 영구폐색","압력손실 지속상승·탈진 무효","산노점 결로·점착성 분진이 주원인"]},{"k":"결로(Condensation)","subs":["산노점 이하 운전 시 발생","황산 응축→여재 부식+블라인딩","예열·보온·산노점 여유 확보로 예방"]},{"k":"화재·폭발","subs":["가연성 분진 축적+정전기 스파크","분진폭발 5요소(연료·산소·점화원 등)","방폭설비·접지·불꽃감지기 설치"]},{"k":"백 파손·마모","subs":["과도한 탈진 압력·빈도","마모성 분진에 의한 국부마모","리텐션밴드·케이지 손상"]},{"k":"운전관리 대책","subs":["예열 기동절차 준수","압력손실·온도 상시 모니터링","정기 백 교체·점검 계획 수립"]}],"answer":"# 여과집진장치 장애현상과 대책\n\n## Ⅰ. 개요\n\n여과집진장치는 미세먼지 포집효율이 우수하지만, 운전조건 관리에 실패하면 블라인딩·결로·화재폭발·백 파손 등 심각한 장애가 발생해 성능저하는 물론 설비 손상·안전사고로 이어질 수 있다. 기술사 시험에서는 각 장애현상의 발생기작과 대책을 구체적으로 서술하는 문제가 자주 출제되므로, 원인-현상-대책을 연결지어 정리해야 한다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 블라인딩(Blinding, 눈막힘)\n\n### 1. 발생기작\n여재 섬유 사이 공극이 미세분진·점착성 물질·응축수분 등으로 영구적으로 막혀, 탈진을 실시해도 압력손실이 초기 수준으로 회복되지 않는 현상. 케이크 여과의 정상적인 탈진 사이클(형성→탈락→재형성)이 깨진 상태다.\n\n### 2. 주요 원인\n| 원인 | 기작 |\n|---|---|\n| 산노점 이하 운전 | 황산 미스트가 여재에 응축·고착 |\n| 점착성·흡습성 분진 | 습분 함유 분진이 섬유에 달라붙어 고화 |\n| 과소 여과속도 장기운전 | 미세입자가 여재 깊숙이 침투(depth blinding) |\n| 오일미스트 혼입 | 유분이 분진과 결합해 끈적한 층 형성 |\n\n### 3. 대책\n1. 운전온도를 산노점보다 20~30℃ 높게 유지(예열·보온 강화)\n2. 발수·발유 표면처리 여재 또는 멤브레인 코팅 여재 채택\n3. 정기적인 여재 세정(에어블로우, 부분교체) 실시\n\n## Ⅲ. 결로(Condensation)와 부식\n\n### 1. 발생기작\n배출가스 중 SOx가 수분과 결합해 황산(H2SO4) 미스트를 형성하는 온도(산노점, 통상 120~150℃ 내외, 연료 황함량에 따라 변동)보다 운전온도가 낮아지면 여재 표면·지지구조물(케이지)에 결로가 발생해 부식과 블라인딩을 동시에 유발한다.\n\n### 2. 대책\n| 대책 | 내용 |\n|---|---|\n| 예열 기동절차 | 정지 후 재기동 시 상온 가스가 유입되지 않도록 예열계통 우선 가동 |\n| 보온·트레이싱 | 하우징·덕트 외부 보온으로 열손실 최소화 |\n| 산노점 여유 확보 | 설계온도를 산노점 대비 20~30℃ 이상 높게 설정 |\n| 내식성 재질 적용 | 케이지·하우징에 내산 코팅 또는 스테인리스 적용 |\n\n## Ⅳ. 화재·폭발 위험과 백 파손\n\n### 1. 분진폭발\n가연성·유기성 분진(목분, 금속분, 유기용제 잔류 분진 등)이 여과집진기 내부에 고농도로 축적된 상태에서 정전기 스파크 등 점화원이 존재하면 분진폭발로 이어질 수 있다. 분진폭발은 **가연성 분진, 공기(산소), 점화원, 부유(분산)상태, 밀폐공간**의 5요소가 동시에 충족될 때 발생한다.\n\n| 방폭 대책 | 내용 |\n|---|---|\n| 접지(Grounding) | 백·케이지·하우징 전체 등전위 접지로 정전기 축적 방지 |\n| 대전방지 여재 | 도전성 섬유 혼입 여재 사용 |\n| 폭발구(Explosion vent) | 폭발압 방출용 파열판 설치 |\n| 불꽃감지기·소화설비 | 초기 화재 감지·자동소화 시스템 연동 |\n| 불티유입 방지 | 용접·연마 공정 등 점화원 발생 공정은 전처리 스파크트랩 설치 |\n\n### 2. 백 파손·마모\n탈진 압축공기 압력이 과도하거나 빈도가 지나치게 잦으면 여재 피로가 누적되어 조기 파손되며, 마모성 분진(경질 입자)이 고농도로 유입되면 백 하단부가 국부적으로 마모·천공된다. 파손 시 배출농도가 급상승하므로 개별 백 검사(스모크 테스트, 형광분말시험 등)를 통한 조기 발견이 중요하다.\n\n## Ⅴ. 장애현상 종합 비교와 예방설계 원칙\n\n| 장애 | 핵심 원인 | 1차 예방설계 |\n|---|---|---|\n| 블라인딩 | 결로·점착성 분진 | 산노점 여유 확보, 발수여재 |\n| 결로·부식 | 저온 운전 | 예열·보온, 내식재질 |\n| 화재·폭발 | 정전기·점화원 | 접지, 방폭설비, 스파크트랩 |\n| 백 파손·마모 | 과탈진, 마모성 분진 | 탈진압력 최적화, 내마모 여재 |\n\n네 가지 장애는 서로 독립적이지 않고 연쇄적으로 발생하는 경우가 많다. 예를 들어 결로로 인한 부식이 백 지지구조(케이지)를 약화시켜 백 파손을 가속하거나, 블라인딩으로 압력손실이 상승하면 탈진 강도를 무리하게 높여 여재 피로·조기파손으로 이어지는 식이다. 따라서 원인별 개별 대책과 함께 **운전온도·압력손실 통합 모니터링 체계**를 구축하는 것이 근본적인 예방설계 원칙이다.\n\n또한 설계 단계에서부터 대상 공정의 배출가스 특성(온도·습도·SOx농도·분진의 가연성 여부)을 정확히 파악해 여재·탈진방식·방폭설비를 함께 결정해야 하며, 운전 개시 후 임의로 운전조건(온도·유량)을 변경할 경우 반드시 여재 사양과의 적합성을 재검토해야 한다.\n\n### 신뢰성 확보를 위한 이중화 설계\n공정 특성상 여과집진장치 정지가 곧 생산공정 정지로 이어지는 경우, 예비 계열(bypass 또는 예비 하우징)을 구성해 한 계열의 긴급 정비 중에도 최소한의 배출기준 준수 운전이 가능하도록 설계하는 사례도 있다. 다만 이 경우 bypass 가동 시 무처리 배출로 이어지지 않도록 반드시 인허가 조건과 비상운전 절차를 사전에 관계기관과 협의해야 한다.\n\n## Ⅵ. 결론\n\n여과집진장치의 대표적 장애인 블라인딩·결로·화재폭발·백 파손은 대부분 **운전온도 관리 실패(산노점 미준수)**와 **분진 특성 미고려**에서 비롯된다. 설계 단계에서 산노점 여유 확보, 방폭설비 반영, 적정 여재·탈진조건 선정을 갖추고, 운전 단계에서는 예열절차 준수와 압력손실·온도 상시 모니터링을 통해 이상 징후를 조기에 포착하는 것이 안정적 운영의 핵심이다.\n","side":[{"title":"산노점 결로 방지 설계 계산 개념","body":"### 산노점 추정 개념\n배출가스 중 SO3 농도가 높을수록, 수분함량이 높을수록 산노점은 상승한다. 일반적으로 중유 등 황함량이 높은 연료 연소가스는 산노점이 130~150℃ 수준까지 상승할 수 있다.\n\n### 설계 여유 확보 예시\n| 항목 | 값 |\n|---|---|\n| 추정 산노점 | 135℃ |\n| 설계 여유 | +25℃ |\n| 최소 운전온도 설정 | 160℃ |\n| 정지 시 최소 유지온도(보온) | 산노점 이상 유지 권장 |\n\n### 기동 시 예열 절차 예시\n```\n1. 여과집진기 하우징 예열(전기히터 또는 보조버너)\n2. 하우징 온도가 산노점+여유온도 도달 확인\n3. 함진가스 인입 시작(초기 저유량으로 서서히 증량)\n4. 정상 운전온도·유량 도달 후 자동운전 전환\n```\n예열 절차를 생략하고 저온 상태에서 급격히 고온·고습 가스를 유입시키면 결로가 즉시 발생하므로, 기동 SOP(표준운전절차)에 예열단계를 명문화하는 것이 실무상 중요하다.\n\n### 정지 시 유의사항\n설비 정지 시에도 잔류 가스가 냉각되면서 결로가 발생할 수 있으므로, 정지 직전 청정공기(purge air)로 하우징 내부를 치환하거나 잔류 분진을 최대한 배출한 후 정지하는 절차가 권장된다. 동절기 장기정지 시에는 보온 히터를 병행 가동해 내부 온도를 노점 이상으로 유지하는 것이 바람직하다."},{"title":"장애현상별 조기 진단 체크리스트","body":"### 정기점검 항목\n| 점검항목 | 정상 범위/기준 | 이상 시 의심 장애 |\n|---|---|---|\n| 압력손실(ΔP) 추이 | 탈진 후 초기치로 회복 | 미회복 시 블라인딩 |\n| 운전온도 | 산노점+20~30℃ 이상 | 저하 시 결로 위험 |\n| 배출구 먼지농도 | 설계치 이내 안정 | 간헐적 급상승 시 백 파손 |\n| 하우징 내부 육안(정지 시) | 백 표면 균일한 케이크 | 국부 고착·변색 시 결로·화학반응 의심 |\n| 정전기 접지저항 | 규정치 이내(통상 10Ω 이하 등) | 초과 시 정전기 축적 위험 |\n\n### 진단 우선순위\n1. 압력손실 이상 → 블라인딩·백파손 가능성 우선 확인\n2. 온도 이상 → 결로 가능성 우선 확인\n3. 배출농도 이상 → 백파손·리크 가능성 우선 확인\n\n### 예방정비(PM) 체계 구축의 중요성\n사후 고장 대응보다 압력손실·온도·배출농도의 추세를 상시 모니터링하여 이상 징후를 사전에 포착하는 예방정비 체계가 장기적으로 유지관리비를 절감한다. 최근에는 IoT 센서 기반 실시간 모니터링과 AI 이상감지를 결합한 스마트 집진설비 관리 사례도 늘고 있어, 답안 작성 시 최신 관리기법으로 언급할 수 있다.\n\n### 법적 자가측정·기록관리 연계\n「대기환경보전법」에 따른 자가측정 결과와 함께 압력손실·온도 운전기록을 병행 보관하면, 배출기준 초과 발생 시 원인분석 자료로 활용할 수 있을 뿐 아니라 관계기관 점검 대응에도 유리하다. 최근 굴뚝자동측정기기(TMS) 부착사업장은 실시간 데이터가 자동 축적되므로 이상 징후 발생 시점과 장애원인을 교차 분석하기가 한층 수월해졌다.\n\n### 종합 점검주기표\n| 구분 | 점검주기 | 담당 |\n|---|---|---|\n| 일상점검(육안·계기확인) | 매일 | 운전원 |\n| 정기점검(내부 육안) | 분기 1회 | 정비팀 |\n| 정밀점검(백 샘플링·인장강도시험) | 연 1회 | 전문기관 |\n| 배출가스 자가측정 | 법정 주기 준수 | 측정대행업체 |"}]},"40":{"day":40,"date":"2026-09-09","title":"1단계 이론·확산·집진 회독 5회차","keywords":[{"k":"집진효율 체계","subs":["η=1-Pt, 직렬 ηt=1-Π(1-ηi)","부분집진율η(d)·절단입경d50","종합효율=∫η(d)f(d)dd"]},{"k":"중력·관성력집진","subs":["Q=A·Vt, 다단선반형 Q=nAVt","관성력: 배플 급회전, d50 10~20㎛","전처리(pre-cleaner) 용도"]},{"k":"원심력집진(사이클론)","subs":["Lapple dpc=√(9μW/2πNeVi(ρp-ρ))","분리계수S=v²/rg, 한계유속","ΔP=ξ(ρV²/2)"]},{"k":"여과집진 5기작","subs":["관성충돌·직접차단·확산·중력·정전기","MPPS 0.1~1㎛, 케이크여과","탈진 3방식(진동/역기류/펄스제트)"]},{"k":"여과집진 장애·설계","subs":["A/C비, ΔP=K1V+K2WV²","블라인딩·결로(산노점)·화재폭발","여재 재질별 내열온도"]}],"answer":"# 1단계 회독 5회차 — Day 33~39 요약·자가점검\n\n## Ⅰ. 회독 목적 + 논리 흐름도\n\n이번 구간은 \"집진장치 이론의 정량적 기초\"에 해당한다. Day 33에서 정의한 총괄효율·부분집진율·절단입경이라는 공통 언어를 바탕으로, 중력식·관성력식(단순물리)→원심력식(선회유동)→여과식(섬유포집+케이크)까지 원리가 점점 정교해지는 순서로 학습이 진행되었다. 절단입경이 작아질수록(성능이 좋을수록) 구조가 복잡해지고 압력손실이 커지는 상충관계를 계속 확인하는 것이 이 구간의 핵심이다.\n\n```\n[성능평가 공통언어] (Day 33)\n총괄효율 η=1-Pt / 부분집진율η(d) / 절단입경d50\n   ↓\n[물리력 기반 집진] (Day 34)\n중력(침강실) → 관성력(배플 방향전환)\n   ↓ d50 큼(10~50㎛), 압손 낮음 → 전처리용\n[선회유동 기반 집진] (Day 35~36)\n원심력(사이클론) Lapple식 → 분리계수S·한계유속\n   ↓ d50 중간(5~15㎛), 압손 중간\n[섬유·케이크 기반 집진] (Day 37~39)\n여과집진(백필터) 5대 포집기작 → MPPS형성\n   ↓ 케이크여과 → 탈진(3방식) → A/C비 설계\n   ↓ 장애: 블라인딩·결로(산노점)·화재폭발\nd50 매우 작음(0.1㎛↓), 압손 큼, 미세먼지 최고효율\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 총괄효율 정의 | η = **1−Pt** = (Cin−Cout)/Cin | ☐ |\n| 직렬 다단 투과율 | Pt(total) = **Pt1×Pt2×...** | ☐ |\n| 중력집진 처리유량 | Q = **A·Vt** (면적에만 비례) | ☐ |\n| 다단선반형 처리유량 | Q = **n·A·Vt** | ☐ |\n| 중력집진 절단입경 | 약 **50㎛ 이상** | ☐ |\n| 관성력집진 절단입경 | 약 **10~20㎛** | ☐ |\n| 사이클론 절단입경(Lapple) | dpc=√(9μW/**2πNeVi**(ρp−ρ)) | ☐ |\n| 사이클론 유효회전수(Ne) | 통상 **5~10** | ☐ |\n| 사이클론 압력손실 | ΔP=ξ(ρV²/2), ξ **6~10** | ☐ |\n| 분리계수 | S = **v²/(r·g)** | ☐ |\n| 사이클론 절단입경 범위 | 약 **5~15㎛** | ☐ |\n| 여과집진 MPPS | **0.1~1㎛** | ☐ |\n| 여과속도(A/C비, 펄스제트) | 통상 **1~3 cm/s** | ☐ |\n| 압력손실 근사식 | ΔP = **K1V+K2WV²** | ☐ |\n| 탈진 압력손실 상한 | 통상 **150~250mmH2O** | ☐ |\n| 산노점 설계 여유 | 통상 **+20~30℃** | ☐ |\n| 여재 최고사용온도(유리섬유) | 약 **250~280℃** | ☐ |\n| 여재 최고사용온도(PTFE) | 약 **260℃** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **총괄집진효율**: η = (Cin−Cout)/Cin = 1−Pt\n2. **직렬 총괄효율**: ηtotal = 1−(1−η1)(1−η2)···(1−ηn)\n3. **종합효율(입도가중)**: η(total) = ∫η(d)·f(d)dd\n4. **중력집진 처리유량**: Q = A·Vt\n5. **중력집진 효율**: η = Vt·L/(H·V)\n6. **Lapple 절단입경**: dpc = √[9μW/(2πNeVi(ρp−ρ))]\n7. **사이클론 압력손실**: ΔP = ξ·(ρV²/2)\n8. **분리계수**: S = v²/(r·g)\n9. **여과속도**: A/C = Q/A\n10. **여과 압력손실**: ΔP = K1·V + K2·W·V²\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 총괄효율 vs 부분집진율 | 장치 전체 성능(1개 값) | 입경별 성능(곡선) | 대표성 vs 상세성 |\n| 중력집진 vs 관성력집진 | 침강실, 중력 지배 | 배플, 관성 지배 | 분리력의 종류 |\n| 표준형 vs 고효율형 사이클론 | d50 크고 ΔP 낮음 | d50 작고 ΔP 높음 | 형상비·직경 |\n| 여재여과 vs 케이크여과 | 운전 초기, 섬유 자체 포집 | 정상운전, 퇴적층 포집 | 운전 경과시간 |\n| 진동형/역기류형 vs 펄스제트형 | 오프라인 탈진 필수 | 온라인 탈진 가능 | 탈진 중 운전 지속 여부 |\n| 블라인딩 vs 정상 탈진 | 탈진해도 ΔP 미회복 | 탈진 후 초기치 회복 | 영구폐색 여부 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 집진장치의 총괄집진효율과 부분집진효율(분급효율)을 설명하시오. *(다수 회차 10점)*\n2. 다단직렬로 연결된 집진장치의 총괄효율 산정방법을 설명하시오. *(114~138회 10점)*\n3. 중력집진장치와 관성력집진장치의 원리 및 특징을 비교 설명하시오. *(다수 회차 10~25점)*\n4. 원심력집진장치(사이클론)의 집진원리와 절단입경 결정인자를 설명하시오. *(120회 전후 25점)*\n5. 사이클론의 압력손실 및 분리계수를 설명하고 유입속도와 효율의 관계를 논하시오. *(최근 25점)*\n6. 여과집진장치의 포집기작 5가지를 설명하시오. *(다수 회차 10~25점)*\n7. 여과집진장치의 탈진방식 3가지를 비교 설명하시오. *(114~138회 25점)*\n8. 여과집진장치의 여과속도(A/C비) 설계 시 고려사항을 설명하시오. *(최근 10점)*\n9. 여과집진장치에서 블라인딩 현상의 원인과 대책을 설명하시오. *(126회 전후 25점)*\n10. 여과집진장치의 화재·폭발 방지대책을 설명하시오. *(최근 10~25점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(25분)**: Ⅰ의 4단계 흐름도(중력→관성력→원심력→여과)를 그리며 각 단계의 d50·압손 경향을 함께 적는다.\n2. **식 쓰기(30분)**: Ⅲ의 10개 식을 기호 정의까지 포함해서.\n3. **수치 암기(25분)**: Ⅱ 체크리스트, 5개 이상 틀리면 해당 일자 재독.\n4. **기출 구술(30분)**: Ⅴ의 10문항을 소리 내어 답해본다.\n5. **계산 연습(20분)**: Day 35의 Lapple 절단입경, Day 38의 여과면적 계산 예제를 다른 수치로 바꿔 다시 풀어본다.\n\n> 이번 구간부터는 계산문제 출제 비중이 높아지는 영역이다. 식을 외우는 데 그치지 말고, 손으로 최소 3회 이상 직접 대입계산을 해봐야 시험장에서 막히지 않는다.\n","side":[{"title":"답안 작성 요령 — 집진장치 비교형 문제","body":"### 문제 유형별 답안 구조\n1. \"원리·구조·효율식\" 단일장치 서술형 → **Ⅰ개요-Ⅱ원리-Ⅲ설계식(표포함)-Ⅳ적용/문제점-Ⅴ결론**\n2. \"두 장치 비교\" 형 → 반드시 **비교표를 본문 중앙에 배치**하고, 표 앞뒤로 비교 기준(효율·압손·적용성)을 서술\n\n### 표 활용 포인트\n- 집진장치 문제는 \"절단입경·압력손실·적용조건\" 3열 비교표가 채점자에게 좋은 인상을 준다\n- 계산형 문제는 조건 정리 → 공식 → 대입 → 결과 → 해석(공학적 의미) 순서로 답안을 구성할 것\n\n### 흔한 감점 요인\n- 압력손실과 효율의 상충관계(trade-off)를 언급하지 않고 \"유속을 높이면 효율이 무조건 좋아진다\"고 서술\n- 여과집진장치 문제에서 탈진방식 3가지 중 일부만 서술\n- 사이클론 절단입경식의 기호 정의를 생략\n\n### 시간배분 요령(25점 문항 기준)\n| 단계 | 시간 | 내용 |\n|---|---|---|\n| 개요 | 3분 | 정의+출제의도 |\n| 본론 구성 | 2분 | 표·식 배치 스케치 |\n| 본론 작성 | 30분 | 식·표·비교 포함 |\n| 결론 | 3분 | 요약+개선방향 |\n| 검토 | 2분 | 오탈자·법령명 확인 |\n\n### 표 작성 원칙\n1. 열 개수는 3~4개로 제한(가독성)\n2. 수치는 단위와 함께 명시(예: dpc, ㎛)\n3. 비교 대상은 반드시 대구조로 배치(장치A vs 장치B)\n\n### 계산문제 답안 체크포인트\n- 조건 값의 단위 통일(㎛→m, mmH2O→Pa 등) 여부를 반드시 확인\n- 산출값의 물리적 타당성(예: 절단입경이 음수나 비현실적으로 클 경우 재검토) 검산\n- 최종 답에 단위를 명시하고, 필요 시 공학적 의미(효율 향상/저하 방향)를 한 줄로 해석"},{"title":"진도 점검 — Day 33~39 자가진단표","body":"| Day | 주제 | 이해도(상/중/하) | 재복습 필요 |\n|---|---|---|---|\n| 33 | 집진효율·부분집진율·절단입경 | | ☐ |\n| 34 | 중력식·관성력식 집진장치 | | ☐ |\n| 35 | 원심력집진장치 원리와 설계 | | ☐ |\n| 36 | 원심력집진장치 효율인자·분리계수 | | ☐ |\n| 37 | 여과집진장치 원리와 여재 선정 | | ☐ |\n| 38 | 여과집진장치 탈진방식과 여과속도 | | ☐ |\n| 39 | 여과집진장치 장애현상과 대책 | | ☐ |\n\n### 활용법\n'하' 표시가 2개 이상이면 해당 일자를 재독한 후 다음 구간(Day 41~ 전기집진장치)으로 진행할 것을 권장한다. 특히 Day 35~36(사이클론 절단입경식)은 계산문제로 자주 출제되므로 '중' 이하라면 반드시 재복습이 필요하다.\n\n### 다음 구간 예고\nDay 41부터는 전기집진장치(ESP)의 Deutsch식과 비저항 관리가 이어진다. 오늘 정리한 절단입경·집진효율 개념이 전기집진 이동속도(drift velocity) 산정에도 동일하게 적용되므로 연결지어 학습할 것.\n\n### 누적 진도 요약\n| 구간 | Day 범위 | 핵심 축 |\n|---|---|---|\n| 4회독 | 25~32 | 2차오염물질·입자물리 기초 |\n| 5회독(이번) | 33~39 | 중력·관성력·원심력·여과집진 |\n| 다음 구간 | 41~47 | 전기집진·세정·후드·덕트 |\n\n### 학습 지속 팁\n집진장치 파트는 이후 국소배기(후드·덕트·송풍기, Day 46~50)와도 설계 논리가 이어지므로, 압력손실·유속 개념을 지금 확실히 잡아두면 뒤로 갈수록 학습 속도가 빨라진다."}]},"41":{"day":41,"date":"2026-09-10","title":"전기집진장치 집진원리와 Deutsch식","keywords":[{"k":"전기집진 4단계","subs":["하전(코로나방전)→이동→포집→탈진","코로나전극(방전극)·집진극 구성","(-)코로나 산업용 주로 채택"]},{"k":"하전기작","subs":["장 하전(field charging, 조대입자)","확산 하전(diffusion charging, 미세입자)","0.1~1㎛ 구간 두 기작 혼재"]},{"k":"Deutsch-Anderson식","subs":["η=1-exp(-A·we/Q)","A: 집진면적, we: 이동속도, Q: 유량","이동속도(we)=CcEEpd/3πμ"]},{"k":"설계인자","subs":["비집진면적(SCA)·처리풍속","전계강도, 인가전압","다단(전기적 구획)배치"]},{"k":"장단점","subs":["압력손실 매우 낮음(10~20mmH2O)","초기투자비 큼, 비저항 민감","대용량 처리에 유리"]}],"answer":"# 전기집진장치(ESP) 집진원리와 Deutsch식\n\n## Ⅰ. 개요\n\n전기집진장치(Electrostatic Precipitator, ESP)는 고전압 직류 전계를 이용해 입자를 하전시킨 후 정전기력으로 집진극에 포집하는 장치로, 압력손실이 매우 낮으면서도(10~20mmH2O) 대용량 가스를 처리할 수 있어 발전소·시멘트공장 등 대형 배출시설에 널리 적용된다. 성능은 Deutsch-Anderson식으로 이론적으로 산정되며, 하전기작·이동속도·집진면적이 핵심 설계변수다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 집진 4단계와 하전기작\n\n### 1. 4단계 공정\n**하전(charging) → 이동(migration) → 포집(collection) → 탈진(rapping)**\n\n방전극(코로나전극)에 고전압을 인가하면 전극 주위에 코로나 방전이 발생해 이온·전자가 생성되고, 이 이온이 입자에 부착되어 입자가 대전(하전)된다. 하전된 입자는 전계를 따라 접지된 집진극으로 이동·포집되며, 집진극에 퇴적된 분진은 주기적인 타격(rapping)으로 탈락시켜 호퍼로 회수한다.\n\n### 2. 하전기작 2종\n| 기작 | 지배 입경 | 원리 |\n|---|---|---|\n| 장 하전(Field Charging) | 1㎛ 이상(조대) | 전계 내 이온이 입자 표면에 직접 충돌·부착 |\n| 확산 하전(Diffusion Charging) | 0.1㎛ 이하(미세) | 이온의 열운동(브라운 확산)에 의한 부착 |\n\n0.1~1㎛ 구간은 두 기작이 혼재하며 상대적으로 하전효율이 낮아, 여과집진장치와 마찬가지로 이 구간에서 포집효율이 최소가 되는 경향이 있다.\n\n### 3. 코로나 극성\n실무에서는 오존 발생이 적고 방전이 안정적인 **부(-)코로나**를 산업용 ESP에 주로 채택하며, 실내 공기청정기 등 소용량 장치에서는 정(+)코로나를 사용하기도 한다.\n\n## Ⅲ. Deutsch-Anderson식\n\n### 1. 이동속도(drift velocity, we)\n하전된 입자가 전계·항력의 평형으로 집진극을 향해 이동하는 속도로, Day 31의 Cunningham 보정을 포함해 다음과 같이 유도된다.\n\n**we = Cc·E·Ep·d / (3πμ)**\n\n| 기호 | 의미 |\n|---|---|\n| Cc | Cunningham 보정계수 |\n| E | 하전전계 세기 |\n| Ep | 집진전계 세기 |\n| d | 입자직경 |\n| μ | 가스 점성계수 |\n\n### 2. 집진효율식(Deutsch-Anderson)\n**η = 1 − exp(−A·we/Q)**\n\n| 기호 | 의미 |\n|---|---|\n| A | 집진극 총면적(㎡) |\n| we | 이동속도(m/s) |\n| Q | 처리가스 유량(㎥/s) |\n\n이 식은 집진면적(A)이 클수록, 이동속도(we)가 클수록, 처리유량(Q)이 작을수록 효율이 지수적으로 증가함을 보여준다. **비집진면적(Specific Collection Area, SCA = A/Q)**을 도입하면 η=1−exp(−SCA·we)로 단순화되며, 실무 설계에서 SCA는 효율 목표를 만족시키기 위한 핵심 설계 파라미터로 사용된다.\n\n## Ⅳ. 설계인자와 실무 적용\n\n### 1. 주요 설계인자\n| 인자 | 효율에 미치는 영향 |\n|---|---|\n| 집진면적(A) 증가 | 효율 증가(전극판 수·길이 확대) |\n| 처리풍속 감소 | 체류시간 증가 → 효율 증가 |\n| 인가전압(전계강도) 증가 | we 증가 → 효율 증가(단, 스파크 한계 존재) |\n| 전기적 구획(field) 다단화 | 단별 독립 제어로 이상 발생 시 국부 대응 가능 |\n\n### 2. 전기적 구획(Field) 다단 배치\n대형 ESP는 가스 유동방향으로 여러 전기적 구획(통상 3~5단)으로 나누어 각 단을 독립적으로 전원 제어한다. 입구단은 고농도 조대입자를 주로 포집하고, 출구단으로 갈수록 미세입자·저농도를 대상으로 하므로 각 단의 최적 전압 조건이 달라 개별 제어가 유리하다.\n\n### 3. 장단점\n| 구분 | 내용 |\n|---|---|\n| 장점 | 압력손실 매우 낮음, 대용량 처리 가능, 유지비 저렴(전력비 제외) |\n| 단점 | 초기투자비 큼, 분진 비저항에 성능 크게 좌우(Day 42 연계), 폭발성 가스에 부적합(스파크 위험) |\n\n## Ⅴ. Deutsch식의 이론적 한계와 실무 보정\n\nDeutsch식은 가스가 집진극 단면 전체에 균일하게 분포하고, 입자가 재비산 없이 완전히 포집된다는 이상적 가정 위에 성립한다. 그러나 실제 현장에서는 가스 유동 편차(비균일 유속분포), 타격에 의한 순간 재비산, 입경분포에 따른 이동속도 차이 등으로 실측효율이 이론치보다 낮게 나타나는 경우가 많다. 이를 보정하기 위해 실무에서는 이동속도(we)에 안전율을 반영한 **유효이동속도(effective migration velocity)** 개념을 사용하거나, 실측 데이터 기반의 경험식을 병행 적용한다.\n\n| 이상적 가정 | 실제 현장 편차 | 보정 방법 |\n|---|---|---|\n| 균일 유속분포 | 국부 편류(channeling) 발생 | 정류판(가스분배판) 설치 |\n| 재비산 없음 | 타격 시 순간 재비산 | 유효이동속도 저감 적용 |\n| 단일 입경 가정 | 실제는 입도분포 존재 | 입경 구간별 부분효율 합산 |\n\n## Ⅵ. 결론\n\n전기집진장치는 코로나 방전에 의한 입자 하전과 정전기력에 의한 포집이라는 물리 원리를 기반으로 하며, 성능은 Deutsch-Anderson식(η=1−exp(−A·we/Q))으로 이론적으로 설명된다. 이동속도(we)는 전계강도·입경·Cunningham 보정의 함수이므로, 설계 시 목표효율에 필요한 집진면적(SCA)을 산정하고 전기적 구획을 다단화해 안정적인 운전조건을 확보하는 것이 핵심이다. 다음 학습에서는 ESP 성능의 최대 변수인 분진 비저항과 그 조절대책을 다룬다.\n","side":[{"title":"Deutsch식을 이용한 집진면적 산정 예제","body":"### 조건\n목표효율 η=99.5%, 처리유량 Q=500㎥/s, 이동속도 we=0.08m/s\n\n### 계산\nη=1−exp(−A·we/Q) → 0.995=1−exp(−A×0.08/500)\nexp(−A×0.08/500) = 0.005\n−A×0.08/500 = ln(0.005) ≈ −5.30\nA = 5.30×500/0.08 ≈ **33,125㎡**\n\n### 비집진면적(SCA) 환산\nSCA = A/Q = 33,125/500 ≈ **66.3 s/m** (또는 m²/(m³/s))\n\n### 목표효율 상향 시 민감도\n| 목표효율 | 필요 ln(1/Pt) | 상대 소요면적 |\n|---|---|---|\n| 99.0% | ln(100)≈4.61 | 기준×0.87 |\n| 99.5% | ln(200)≈5.30 | 기준×1.00 |\n| 99.9% | ln(1000)≈6.91 | 기준×1.30 |\n\n효율을 99.5%→99.9%로 높이려면 집진면적을 약 30% 더 늘려야 한다는 점에서, ESP는 목표효율이 높아질수록 설비 규모(투자비)가 비선형적으로 증가하는 특성을 확인할 수 있다.\n\n### 이동속도(we) 변화에 따른 소요면적 비교\n| we(m/s) | 소요면적(상대값) |\n|---|---|\n| 0.04 | 기준×2.0 |\n| 0.08 | 기준×1.0 |\n| 0.12 | 기준×0.67 |\n\n이동속도가 낮은(비저항 문제가 있는) 분진일수록 동일 목표효율을 위해 훨씬 넓은 집진면적이 필요하므로, 설계 초기에 대상 분진의 비저항·이동속도 특성을 정확히 파악하는 것이 투자비 결정에 직결된다."},{"title":"전기적 구획(다단) 설계 개념과 운전관리","body":"### 다단 구획 배치 예시(4단)\n```\n[입구] → 1단(고전압, 조대입자 주포집)\n       → 2단(중전압)\n       → 3단(중전압)\n       → 4단(정밀제어, 미세입자 최종포집) → [출구]\n```\n\n### 단별 특성 비교\n| 구획 | 유입 분진농도 | 스파크 빈도 | 전압 설정 |\n|---|---|---|---|\n| 입구단(1단) | 높음 | 높음(전류 제한 필요) | 상대적으로 낮게 설정 |\n| 중간단 | 중간 | 중간 | 표준 설정 |\n| 출구단(마지막단) | 낮음 | 낮음 | 높게 설정(정밀포집) |\n\n### 운전관리 포인트\n1. 입구단은 고농도 분진으로 인한 스페이스 차지(space charge) 효과로 스파크가 잦으므로 전류제한기로 보호\n2. 출구단은 저농도 조건에서 최대 전압을 인가해 미세입자 포집효율을 극대화\n3. 단별 전류·전압을 실시간 모니터링해 이상 발생 구획을 조기에 식별\n\n### 실무 시사점\n전기적 구획을 다단화하지 않고 단일 전원으로 전체를 제어하면, 입구단의 스파크 제한 전압에 맞춰 전체 시스템 전압이 낮게 유지되어 출구단의 미세입자 포집효율이 저하되는 문제가 발생한다. 따라서 대형 ESP 설계에서는 구획별 독립 전원 공급이 사실상 표준 사양으로 자리잡았다.\n\n### 최근 전원장치 기술 동향\n과거 상용주파(60Hz) 변압기-정류기(T/R Set) 방식이 주류였으나, 최근에는 고주파 스위칭 전원(High Frequency Power Supply)이 보급되며 응답속도가 빨라져 스파크 발생 즉시 전압을 낮추고 재상승시키는 정밀 제어가 가능해졌다. 이를 통해 평균 전계강도를 종전 대비 높게 유지할 수 있어 동일 집진면적에서도 효율 향상 또는 설비 소형화 효과를 얻을 수 있다."}]},"42":{"day":42,"date":"2026-09-11","title":"전기집진장치 비저항과 조절대책","keywords":[{"k":"분진 비저항(resistivity)","subs":["정상범위 10⁴~10¹¹ Ω·cm","전기저항 크기 = 전하 소멸 난이도","단위 Ω·cm"]},{"k":"저비저항 문제","subs":["<10⁴Ω·cm: 재비산(reentrainment)","전하 즉시 소멸→쿨롱력 상실","금속분·카본 등 도전성 분진"]},{"k":"고비저항 문제","subs":[">10¹¹Ω·cm: 역전리(back corona)","절연층 형성→전류 급감","저황탄 연소 시 대표적 발생"]},{"k":"비저항 조절대책","subs":["SO3 컨디셔닝(가스주입)","암모니아 주입, 온도조절","습식ESP(WESP) 도입"]},{"k":"비저항-온도 관계","subs":["저온역: 표면전도 지배(비저항↓)","고온역: 체적전도 지배(비저항↓)","중간역(150~200℃) 비저항 최대"]}],"answer":"# 전기집진장치 비저항과 조절대책\n\n## Ⅰ. 개요\n\n전기집진장치(ESP)의 성능은 Deutsch식(Day 41)만으로 설명되지 않으며, 실제 현장 성능을 좌우하는 가장 중요한 변수는 **분진의 전기비저항(electrical resistivity)**이다. 비저항이 정상범위를 벗어나면 이론적으로 충분한 집진면적을 확보해도 실제 효율이 급격히 저하될 수 있어, 기술사 시험에서 ESP 관련 문제의 상당수는 비저항 문제와 그 대책을 다룬다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 비저항의 정의와 정상범위\n\n### 1. 정의\n비저항은 분진층에 전류가 흐르는 것을 방해하는 정도를 나타내는 물성치로, 단위는 **Ω·cm**를 사용한다. ESP가 정상적으로 작동하기 위한 적정 비저항 범위는 통상 **10⁴ ~ 10¹¹ Ω·cm**이며, 이 범위를 벗어나면 아래에서 설명할 두 가지 문제가 발생한다.\n\n### 2. 비저항과 온도의 관계\n비저항은 지배 기작에 따라 온도별로 다르게 나타난다.\n\n| 온도 구간 | 지배 기작 | 비저항 경향 |\n|---|---|---|\n| 저온(약 100℃ 이하) | 표면전도(수분·화학종 흡착) | 비저항 낮음 |\n| 중간온도(150~200℃ 부근) | 표면전도 약화, 체적전도 미약 | **비저항 최대**(문제 구간) |\n| 고온(약 250℃ 이상) | 체적전도(열에너지에 의한 이온이동) | 비저항 낮음 |\n\n즉 비저항은 온도에 대해 위로 볼록한(최대값을 갖는) 곡선 형태를 보이며, 통상 150~200℃ 부근에서 최대치를 나타내 이 온도대에서 ESP 운전 시 성능 저하 위험이 가장 크다.\n\n## Ⅲ. 저비저항·고비저항 문제\n\n### 1. 저비저항 문제(<10⁴ Ω·cm)\n카본블랙·금속분 등 도전성이 강한 분진은 집진극에 도달하는 즉시 전하가 순식간에 소멸되어 입자를 붙잡는 정전기적 부착력(쿨롱력)을 상실한다. 이 경우 입자가 집진극에 제대로 부착되지 못하고 가스류로 다시 튕겨나가는 **재비산(reentrainment)**이 심화되어 겉보기 효율이 급격히 저하된다.\n\n### 2. 고비저항 문제(>10¹¹ Ω·cm)\n저황탄(저유황 석탄) 연소 시 발생하는 비산재처럼 비저항이 매우 높은 분진은 집진극 표면에 전하가 축적되어 빠져나가지 못하고, 이 축적된 전하가 절연층을 형성해 국부적으로 전계가 역전되는 **역전리(back corona)** 현상을 유발한다. 역전리가 발생하면 정상적인 코로나 방전이 방해받아 전류가 급감하고, 심한 경우 오히려 미세입자가 재비산해 배출농도가 상승한다.\n\n| 구분 | 저비저항(<10⁴) | 고비저항(>10¹¹) |\n|---|---|---|\n| 주요 원인 물질 | 카본, 금속분, 도전성 분진 | 저황탄 비산재, 고저항 산화물 |\n| 발생 현상 | 즉시 방전, 재비산 | 절연층 형성, 역전리 |\n| 겉보기 증상 | 정상 전압에서도 효율 저하 | 전류 급감, 스파크 감소 |\n\n## Ⅳ. 비저항 조절대책\n\n### 1. 화학적 컨디셔닝\n| 방법 | 원리 | 적용 |\n|---|---|---|\n| SO3 주입(가스 컨디셔닝) | 표면전도 유발물질 공급 → 고비저항 완화 | 저황탄 연소 배가스에 효과적 |\n| 암모니아(NH3) 주입 | 분진 표면 개질, 응집·전도성 개선 | 국내외 다수 발전소 적용 사례 |\n| 수분 조절 | 표면 흡착수분 증가로 저항 저감 | 습분 첨가 스프레이 방식 |\n\n### 2. 운전조건 조절\n1. **온도 관리**: 문제구간(150~200℃)을 회피하도록 열교환기 위치·운전온도를 조정\n2. **전압·전류 파형 조절**: 간헐펄스전원(Intermittent Energization) 방식을 사용해 역전리 발생을 억제하면서 평균 전계강도 유지\n3. **습식 ESP(WESP) 도입**: 집진극을 물로 세정하는 방식으로 재비산·비저항 문제를 근본적으로 회피, 미세먼지·황산미스트 등 저비저항·점착성 물질 대상에 효과적이나 폐수처리 부담이 발생\n\n## Ⅴ. 연료·원료 특성에 따른 비저항 사전평가\n\n설계 단계에서 대상 연료·원료의 화학조성(황함량, 알칼리금속 함량, 수분함량 등)을 기반으로 비저항을 사전 예측하면, 준공 후 발생할 수 있는 성능저하 리스크를 상당 부분 줄일 수 있다.\n\n| 연료·원료 특성 | 비저항 경향 | ESP 설계 시사점 |\n|---|---|---|\n| 고황탄(황함량 높음) | 낮음(SO3 자연 생성) | 정상적 ESP 설계로 충분 |\n| 저황탄(황함량 낮음) | 높음(역전리 위험) | SO3 컨디셔닝 설비 사전반영 |\n| 알칼리금속 풍부(바이오매스 등) | 매우 낮음(도전성) | 재비산 대책(타격 최적화) 강화 |\n| 고수분 원료 | 낮음(표면전도 증가) | 상대적으로 유리 |\n\n이처럼 연료 전환이나 원료 변경 계획이 있는 사업장은 ESP 설계·개조 시 비저항 변화를 반드시 사전 검토해야 하며, 이는 환경영향평가 협의 과정에서도 방지시설 적정성을 판단하는 근거자료로 활용된다.\n\n### 비저항 실측 방법 개요\n설계·정밀진단 단계에서는 현장에서 채취한 분진 시료를 대상으로 인가전압을 가하며 저항을 측정하는 실험실 시험(또는 In-situ 프로브 측정)을 통해 실제 비저항 값을 확인한다. 문헌상 일반값과 실측값이 크게 다를 수 있으므로, 대형 신설 프로젝트에서는 반드시 실측 기반 설계를 권장한다.\n\n## Ⅵ. 결론\n\n전기집진장치의 실제 성능은 이론적 집진면적만으로 결정되지 않으며, 분진 비저항이 정상범위(10⁴~10¹¹ Ω·cm)를 벗어나면 저비저항의 경우 재비산, 고비저항의 경우 역전리로 인해 효율이 급격히 저하될 수 있다. 설계·운전 단계에서는 대상 연료·원료의 비저항 특성을 사전에 파악해 SO3·암모니아 컨디셔닝, 운전온도 조정, 습식ESP 도입 등의 대책을 선제적으로 반영해야 한다. 아울러 준공 후에도 원료·연료 변경, 공정 조건 변화가 있을 때마다 비저항 특성을 재평가하는 관리체계를 갖추는 것이 배출기준을 안정적으로 준수하는 지름길이다.\n","side":[{"title":"비저항 문제 사례별 대응 흐름도","body":"### 현장 진단 절차\n```\n1. ESP 출구 배출농도가 설계치보다 높은가?\n   → Q2\n2. 1차·2차 전류-전압 특성곡선 확인\n   전류가 정상보다 낮고 스파크가 적은가?\n   YES → 고비저항(역전리) 의심 → Q3\n   NO  → 저비저항(재비산) 의심 → Q4\n3. [고비저항 대응]\n   - SO3 또는 암모니아 컨디셔닝 검토\n   - 간헐펄스전원 적용 검토\n   - 운전온도가 150~200℃ 구간인지 확인, 가능시 온도 조정\n4. [저비저항 대응]\n   - 타격(rapping) 강도·주기 최적화\n   - 습식ESP 전환 검토\n   - 전기적 구획별 전압 재조정\n```\n\n### 연료 전환 시 유의사항\n저황탄에서 고황탄으로 연료를 전환하면 배가스 내 SO3 농도가 자연히 증가해 비저항이 낮아지는 효과가 있어 ESP 성능이 개선되는 경우가 있으나, 반대로 대기오염물질(SOx) 배출량 자체는 증가하므로 탈황설비 용량과 함께 종합적으로 검토해야 한다.\n\n### 간헐펄스전원(IE) 적용 원리\n간헐펄스전원은 코로나 방전을 연속이 아닌 짧은 펄스 형태로 인가해, 역전리가 진행되기 전에 전압을 낮췄다가 다시 높이는 방식으로 평균 전계강도는 유지하면서 역전리 발생을 억제한다. 고비저항 문제가 심각한 현장에서 화학적 컨디셔닝(SO3 주입 등)의 설비투자 없이도 효과를 볼 수 있는 대안으로 최근 적용이 늘고 있다."},{"title":"습식 전기집진장치(WESP)와 최신 적용 동향","body":"### WESP의 원리\n집진극 표면에 연속적 또는 주기적으로 물을 흘려 포집된 입자를 씻어내는 방식으로, 건식ESP의 타격(rapping) 대신 세정으로 집진극을 청소하기 때문에 타격에 의한 재비산이 원천적으로 발생하지 않는다.\n\n### 적용 우수 분야\n| 대상 물질 | 이유 |\n|---|---|\n| 황산미스트(SO3 유래) | 점착성·부식성으로 건식 타격 곤란 |\n| 초미세먼지(PM1.0 이하) | 세정에 의한 안정적 포집 |\n| 점착성·저비저항 분진 | 재비산 문제 원천 해소 |\n\n### 최신 적용 동향\n최근 소각시설·반도체 스크러버 후단 등에서 초미세먼지·황산미스트 동시저감 요구가 높아지면서 건식ESP 또는 여과집진장치 후단에 WESP를 추가하는 **다단 조합 방식**이 늘고 있다. 다만 세정수 처리(폐수처리시설 연계)가 추가되므로 설치비·운영비 증가를 종합적으로 고려해야 한다.\n\n### 인허가 검토 시 유의점\nWESP 도입 시 발생하는 폐수는 「물환경보전법」상 폐수배출시설 신고·허가 대상에 해당할 수 있으므로, 대기분야뿐 아니라 수질분야 인허가를 함께 검토해야 하는 대표적 사례다.\n\n### 세정수 순환·처리 계통 개요\nWESP의 세정수는 통상 순환 사용 후 일부를 블로우다운(폐수 배출)하며, 배출 전 침전·중화 등 전처리를 거쳐 방류하거나 기존 폐수처리시설로 연계 처리한다. 세정수 내 중금속·황산염 농도가 높아질 수 있어 정기적인 수질분석과 함께 배출허용기준 준수 여부를 확인해야 한다.\n\n### 타 방지시설과의 조합 사례\n최근 대형 소각시설에서는 반건식반응탑(산성가스 제거) → 여과집진기(미세먼지 1차 포집) → WESP(초미세먼지·황산미스트 최종 제거) 순의 다단 조합이 채택되는 사례가 늘고 있으며, 이는 단일 장치로는 달성하기 어려운 복합 배출기준(먼지·중금속·산성가스 동시 저감)을 만족시키기 위한 실무적 대응이다."}]},"43":{"day":43,"date":"2026-09-12","title":"전기집진장치 운전·유지관리 점검","keywords":[{"k":"타격(Rapping) 관리","subs":["타격강도·주기 최적화 필요","과도시 재비산, 과소시 절연층","입구/출구단 별도 주기 설정"]},{"k":"스파크율 관리","subs":["적정 스파크율(분당 수회) 유지","전류-전압 특성곡선(V-I curve)","과다시 전원 손상, 과소시 저전압운전"]},{"k":"전기적 이상 진단","subs":["절연 파괴·애자 오염","방전극 단선·집진극 변형","접지저항 관리"]},{"k":"성능평가·점검주기","subs":["자가측정·정밀진단 주기","TMS 연동 실시간 감시","가동률·전력원단위 관리"]},{"k":"타 집진장치와 비교","subs":["여과집진 대비 압손 낮음","비저항 민감 vs 습분 민감(여과)","초기투자비 큼 vs 운영비 유리"]}],"answer":"# 전기집진장치 운전·유지관리 점검\n\n## Ⅰ. 개요\n\n전기집진장치(ESP)는 압력손실이 낮고 유지비가 저렴한 장점이 있으나, 고전압 설비 특성상 전기적 이상(절연파괴, 스파크 과다, 애자오염 등)에 취약하고 타격(rapping) 조건이 부적절하면 재비산으로 성능이 급격히 저하될 수 있어 체계적인 운전·유지관리가 필수적이다. Day 41~42에서 다룬 이론적 설계식(Deutsch식)과 비저항 문제를 실제 현장에서 관리하는 절차를 정리한다. *(114~138회 다수 기출 연계)*\n\n## Ⅱ. 타격(Rapping) 관리\n\n### 1. 타격의 목적과 딜레마\n집진극·방전극에 퇴적된 분진을 주기적으로 타격해 탈락시켜 호퍼로 회수해야 하나, 타격 강도가 과도하거나 빈도가 지나치게 잦으면 탈락 중인 입자가 가스류에 재비산해 오히려 배출농도를 상승시킨다. 반대로 타격이 부족하면 집진극 표면에 두꺼운 절연층이 형성되어 국부적 역전리를 유발할 수 있다.\n\n### 2. 구획별 타격 전략\n| 구획 위치 | 분진 축적 속도 | 타격 주기 전략 |\n|---|---|---|\n| 입구단 | 빠름(고농도) | 상대적으로 짧은 주기 |\n| 출구단 | 느림(저농도) | 긴 주기(재비산 최소화 우선) |\n\n출구단은 최종 배출농도를 결정하는 구획이므로, 타격 시 발생하는 순간적 재비산이 전체 배출농도에 미치는 영향이 크다. 따라서 출구단 타격 주기는 입구단보다 길게 설정하고, 타격 시점을 배출가스 모니터링과 연동해 최적화하는 것이 실무 관행이다.\n\n## Ⅲ. 스파크율 관리와 전기적 진단\n\n### 1. 스파크율(Spark Rate)\n인가전압이 너무 낮으면 코로나 방전이 약해 하전 효율이 떨어지고, 너무 높으면 국부적으로 절연파괴(스파크)가 빈번해져 전원장치에 부담을 준다. 적정 스파크율(분당 수회 수준)을 유지하는 전압을 자동전압제어(AVC, Automatic Voltage Control) 장치로 실시간 탐색·유지하는 것이 표준 운전방식이다.\n\n### 2. 전류-전압 특성곡선(V-I Curve)\n전압을 서서히 높이며 전류를 측정한 V-I 곡선의 형태로 비저항 이상 여부를 진단할 수 있다.\n\n| V-I 곡선 특징 | 추정 상태 |\n|---|---|\n| 낮은 전압에서도 전류 급상승 | 저비저항(도전성 분진 과다) 의심 |\n| 전압을 높여도 전류 증가 미미 | 고비저항(역전리) 의심 |\n| 정상적인 완만한 상승곡선 | 정상 운전 상태 |\n\n### 3. 전기적 이상 유형\n| 이상 유형 | 원인 | 조치 |\n|---|---|---|\n| 절연 애자 오염·파손 | 분진 부착, 결로 | 애자 히터 가동, 정기세척 |\n| 방전극 단선 | 부식, 과전류 | 예비 방전극 확보, 정기교체 |\n| 집진극 변형 | 열변형, 타격 충격 누적 | 정기 정렬점검, 교정 |\n| 접지불량 | 접지선 부식·단선 | 접지저항 정기측정 |\n\n## Ⅳ. 성능평가와 정기점검 체계\n\n### 1. 점검 주기\n| 항목 | 주기 |\n|---|---|\n| V-I 곡선(구획별) 확인 | 매일 또는 상시(자동기록) |\n| 애자·방전극 육안점검 | 정지 시 또는 분기 1회 |\n| 절연저항·접지저항 측정 | 연 1~2회 |\n| 배출가스 자가측정 | 「대기환경보전법」 법정주기 준수 |\n\n### 2. TMS 연동 감시\n굴뚝자동측정기기(TMS)가 부착된 대형 사업장은 배출농도 실시간 데이터를 ESP 운전데이터(전압·전류·타격주기)와 연계 분석하면, 배출농도 이상 발생 시점을 특정 전기적 구획·타격 이벤트와 대조해 원인을 신속히 규명할 수 있다.\n\n## Ⅴ. 타 집진장치와의 비교 및 선정 시사점\n\n| 구분 | 전기집진장치(ESP) | 여과집진장치(백필터) |\n|---|---|---|\n| 압력손실 | 매우 낮음(10~20mmH2O) | 큼(150~250mmH2O) |\n| 초기투자비 | 큼 | 상대적으로 낮음 |\n| 성능 민감 요인 | 분진 비저항 | 여재 손상·습분·결로 |\n| 폭발성 가스 적용성 | 부적합(스파크 위험) | 방폭설계 시 적용 가능 |\n| 대용량 처리 | 매우 유리 | 유리(모듈 증설로 대응) |\n\n비저항 문제가 심각하게 우려되거나 폭발성 분진을 다루는 공정에서는 여과집진장치가 유리하며, 대용량·저압손 요구가 우선인 발전소 등에서는 ESP가 여전히 경쟁력을 가진다. 최근에는 두 장치의 장점을 결합한 하이브리드 집진(Day 37 연계)도 검토되고 있다.\n\n## Ⅵ. 가동률·전력원단위 관리\n\nESP는 다른 집진장치 대비 운영비(특히 압력손실에 따른 송풍동력비)가 낮다는 장점이 있으나, 고전압 전원장치의 전력소비량(전력원단위, kWh/처리풍량)을 정기적으로 산정·관리하는 것도 경제적 운전의 중요한 요소다. 전력원단위가 설계치보다 상승하는 추세는 절연 열화, 애자 오염, 방전극 마모 등 설비 노후화의 간접 지표로 활용할 수 있다.\n\n| 관리지표 | 활용 목적 |\n|---|---|\n| 구획별 전력소비량 | 이상 구획 조기 식별 |\n| 가동률(운전시간/전체시간) | 정지빈도·정비필요성 평가 |\n| 배출농도 대비 전력원단위 | 에너지효율 벤치마킹 |\n\n## Ⅶ. 결론\n\n전기집진장치의 안정적 운영은 이론적 설계식만으로 완성되지 않으며, 타격 조건의 구획별 최적화, 스파크율 관리를 통한 전압 최적화, V-I 곡선을 활용한 비저항 이상 조기진단, 정기적인 전기적 이상점검이 함께 이루어져야 한다. 설계 단계에서부터 대상 분진의 특성을 파악해 타 집진장치와의 적용성을 비교 검토하는 것이 최적의 배출시설 선정으로 이어진다.\n","side":[{"title":"V-I 곡선 해석 및 트러블슈팅 사례","body":"### 사례 1: 전류 급상승형(저비저항 의심)\n증상: 전압 30kV 부근에서 전류가 급격히 상승, 스파크율 과다\n진단: 도전성 분진(카본 등) 혼입 가능성\n조치: 타격주기 단축 검토, 원료 성상 변경 이력 확인\n\n### 사례 2: 전류 정체형(고비저항 의심)\n증상: 전압을 45kV까지 높여도 전류가 거의 증가하지 않음\n진단: 역전리 발생 가능성(저황탄 연료전환 등)\n조치: SO3/암모니아 컨디셔닝 검토, 간헐펄스전원 적용\n\n### 사례 3: 정상 곡선이나 배출농도 상승\n증상: V-I 곡선은 정상이나 TMS 배출농도 상승\n진단: 전기적 문제가 아닌 기계적 문제(호퍼 막힘, 타격장치 고장, 가스편류) 의심\n조치: 호퍼 레벨스위치 점검, 타격 모터 작동상태 확인, 가스분배판(정류판) 점검\n\n### 진단 우선순위 요약\n| 증상 | 1차 의심 | 확인 방법 |\n|---|---|---|\n| 전류 급상승 | 저비저항 | 원료성상 확인 |\n| 전류 정체 | 고비저항(역전리) | 연료·온도 이력 확인 |\n| V-I 정상, 농도만 상승 | 기계적 결함 | 호퍼·타격장치 점검 |\n\n### 가스 편류(Channeling) 진단\n전기적·기계적 이상이 모두 없는데도 특정 구획 출구 농도만 지속적으로 높다면, 입구 정류판(가스분배판) 손상이나 내부 구조물 변형으로 가스가 특정 유로에 편중되는 편류 현상을 의심할 수 있다. 이 경우 CFD(전산유체역학) 해석이나 현장 유속 실측을 통해 유동분포를 재확인하고 정류판을 보수하는 것이 근본 대책이다."},{"title":"ESP 정기점검·정비 체크리스트","body":"### 일상점검(운전 중)\n| 항목 | 확인내용 |\n|---|---|\n| 구획별 V-I 값 | 전일 대비 급변 여부 |\n| 스파크율 | 정상범위 유지 여부 |\n| 호퍼 레벨 | 분진 과다 축적(막힘) 여부 |\n| 배출구 농도(TMS) | 기준 대비 여유율 |\n\n### 정지 시 정밀점검(정기보수)\n1. 방전극·집진극 육안점검(변형·부식·단선)\n2. 애자 청소 및 절연저항 측정\n3. 타격장치(모터·캠·로드) 작동상태 점검\n4. 호퍼 내부 분진 고착 여부 확인 및 청소\n5. 접지계통 저항 측정\n\n### 정비이력 관리의 중요성\n전기적 이상은 서서히 진행되다가 특정 임계점에서 급격한 성능저하로 나타나는 경우가 많으므로, V-I 곡선·스파크율 추이를 시계열로 기록·관리하면 고장을 사전에 예측하고 계획정비로 대응할 수 있어 불시정지에 따른 배출기준 초과 리스크를 줄일 수 있다.\n\n### 인허가·관리 연계\n「대기환경보전법」상 방지시설 운영기록부에 ESP의 주요 운전인자(전압·전류·타격주기)를 기록·보관하도록 하는 사업장이 많으며, 이는 사후 배출기준 초과 시 원인규명 자료로도 활용된다.\n\n### 정비 우선순위 결정 기준\n| 우선순위 | 판단기준 |\n|---|---|\n| 긴급 | 배출기준 초과 우려, TMS 경보 발생 |\n| 계획정비 | V-I 곡선 열화 추세 확인, 아직 기준 이내 |\n| 예방정비 | 정기점검 주기 도래, 특이사항 없음 |\n\n긴급도에 따라 정비자원을 배분하면 제한된 정비인력·예산으로도 배출기준 준수와 설비 신뢰성을 동시에 확보할 수 있다."}]},"44":{"day":44,"date":"2026-09-13","title":"세정집진장치 원리와 종류","keywords":[{"k":"세정 포집기작","subs":["관성충돌·차단·확산·응결·정전기","액적과 입자의 상대속도가 핵심","가스상+입자상 동시 제거 가능"]},{"k":"장치 종류","subs":["분무탑(spray tower)·충전탑","사이클론스크러버·제트스크러버","벤투리스크러버(고효율)"]},{"k":"액가스비(L/G)","subs":["액체량/가스량, 단위 L/㎥","높을수록 효율↑ 압손·폐수↑","0.5~several L/㎥ 범위"]},{"k":"가스상 흡수 병행","subs":["세정탑은 입자+가스(SOx등) 동시처리","헨리상수·물질전달계수 관련","산성가스 흡수탑과 원리 공유"]},{"k":"장단점","subs":["고온·가연성가스에 안전","폐수처리 부담, 백연(플룸) 발생","동절기 결빙 문제"]}],"answer":"# 세정집진장치 원리와 종류\n\n## Ⅰ. 개요\n\n세정집진장치(Wet Scrubber)는 액체(주로 물)를 가스와 접촉시켜 입자를 액적에 포집하거나 가스상 오염물질을 흡수 제거하는 습식 방지시설이다. 건식 집진장치와 달리 고온·가연성·폭발성 가스에도 안전하게 적용할 수 있고, 입자상뿐 아니라 SOx·HCl 등 가스상 오염물질을 동시에 처리할 수 있는 장점이 있어 소각시설·화학공정 등에서 널리 사용된다. 다만 폐수처리 부담과 백연(플룸) 발생이라는 특유의 단점이 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 세정 포집기작\n\n세정집진의 입자 포집은 액적과 입자 사이의 상대속도에 의한 물리적 접촉이 핵심이며, 다음 기작이 복합 작용한다.\n\n| 기작 | 지배 조건 |\n|---|---|\n| 관성충돌(Impaction) | 조대입자, 액적-가스 상대속도 큼(벤투리 등) |\n| 직접차단(Interception) | 액적 크기에 근접한 입자 |\n| 확산(Diffusion) | 미세입자(<0.1㎛), 브라운 운동 |\n| 응결(Condensation) | 과포화 수증기 응축핵으로 입자 작용, 입자 성장 후 포집 용이 |\n| 정전기력 | 대전된 입자·액적 사이 인력 |\n\n여과집진(Day 37)과 마찬가지로 관성충돌은 조대입자에, 확산은 미세입자에 유리해 중간 입경대(0.1~1㎛)에서 포집이 어려운 경향이 공통적으로 나타난다.\n\n## Ⅲ. 세정집진장치의 종류\n\n| 형식 | 구조 특징 | 절단입경 | 압력손실 |\n|---|---|---|---|\n| 분무탑(Spray Tower) | 탑 내부에 노즐로 액적 분무 | 5~10㎛ | 낮음(50~150mmH2O) |\n| 충전탑(Packed Tower) | 충전재로 접촉면적 확대 | 2~5㎛(가스흡수 위주) | 중간(100~300mmH2O) |\n| 사이클론스크러버 | 원심력+세정 병행 | 3~8㎛ | 중간 |\n| 제트스크러버(Ejector) | 고압액체 분사로 가스 흡인 | 1~5㎛ | 액체압력에 좌우 |\n| 벤투리스크러버 | 벤투리관 목부에서 고속접촉 | 0.5~2㎛(가장 우수) | 매우 큼(300~800mmH2O) |\n\n절단입경이 작을수록(고효율일수록) 압력손실이 크다는 상충관계는 건식 집진장치와 동일하게 세정집진장치에도 적용된다.\n\n## Ⅳ. 액가스비(L/G)와 가스상 물질 동시처리\n\n### 1. 액가스비(Liquid-to-Gas Ratio)\n**L/G = 액체 공급량(L)/가스 처리량(G)**, 단위는 통상 L/㎥로 표시한다. L/G가 클수록 입자·가스상 물질과 액적의 접촉기회가 늘어 제거효율은 향상되나, 순환수량·폐수량·압력손실이 함께 증가하는 상충관계가 있다.\n\n### 2. 가스상 오염물질 동시 흡수\n세정탑은 입자 포집과 동시에 SOx·HCl·NH3 등 수용성 가스상 오염물질을 액상에 흡수 제거할 수 있다. 흡수효율은 헨리상수(용해도)와 기액 물질전달계수에 좌우되며, 소각시설의 반건식·습식 세정탑은 산성가스 중화(알칼리 첨가)와 입자 포집을 동시에 수행하도록 설계되는 경우가 많다.\n\n## Ⅴ. 장단점과 실무 적용상 유의점\n\n| 구분 | 내용 |\n|---|---|\n| 장점 | 고온·가연성·폭발성 가스에 안전, 가스상+입자상 동시처리, 점착성 분진 적용 가능 |\n| 단점 | 폐수처리 부담(수질 인허가 연계), 백연(연돌 플룸) 발생, 동절기 결빙 위험, 부식 문제 |\n\n### 유의점\n1. **폐수처리 연계**: 세정폐수는 「물환경보전법」상 폐수배출시설에 해당하므로 대기·수질 인허가를 함께 검토해야 한다.\n2. **백연 저감**: 포화습가스가 대기 중 냉각되며 발생하는 백연은 민원의 주요 원인이 되어, 재가열(reheat) 설비나 백연방지형 세정탑을 검토하는 경우가 있다.\n3. **동절기 결빙**: 노즐·배관 동결 방지를 위한 보온·트레이싱이 필요하다.\n4. **부식 관리**: 산성·염기성 흡수액을 다루는 세정탑은 탄소강보다 FRP, 스테인리스, 고무라이닝 등 내식재질을 적용해야 장기적인 누수·설비손상을 예방할 수 있다.\n\n## Ⅵ. 타 집진장치와의 종합 비교\n\n| 구분 | 세정집진 | 여과집진 | 전기집진 |\n|---|---|---|---|\n| 고온·가연성가스 적용성 | 우수 | 제한적(내열여재 필요) | 부적합(스파크 위험) |\n| 가스상 물질 동시처리 | 가능(흡수) | 불가 | 불가 |\n| 폐수 발생 | 발생(처리 필요) | 없음 | 없음(습식 제외) |\n| 압력손실 | 형식에 따라 다양(50~800) | 큼(150~250) | 매우 낮음(10~20) |\n| 점착성 분진 적용성 | 우수 | 블라인딩 우려 | 비저항 문제 우려 |\n\n이 비교표는 배출시설 인허가 협의 시 방지시설 선정 근거를 서술하는 문제에서 자주 활용되는 핵심 프레임으로, 대상 공정의 가스 특성(온도·가연성·수용성 오염물질 유무)에 따라 최적 방지시설이 달라진다는 점을 논리적으로 뒷받침한다.\n\n특히 화학공정·도금공정처럼 산·알칼리 가스와 미세입자가 혼재하고 폭발위험이 있는 배가스를 다루는 사업장에서는 세정집진장치가 사실상 유일한 대안으로 채택되는 경우가 많으며, 이 경우 대상 오염물질별 흡수액(산성가스는 알칼리 세정액, 알칼리가스는 산성 세정액)을 정확히 선정하는 것이 처리효율을 좌우하는 핵심 설계요소가 된다.\n\n또한 반도체·디스플레이 제조공정의 스크러버는 다양한 특수가스(실란류, 불소화합물 등)를 대상으로 하므로, 표준 세정탑 설계식만으로는 충분하지 않고 물질별 반응성·용해도를 개별적으로 검토한 맞춤형 설계가 요구된다는 점도 최근 기출 경향에서 언급되고 있다.\n\n## Ⅶ. 결론\n\n세정집진장치는 액적과의 물리적 접촉을 통해 입자를 포집하고, 동시에 가스상 오염물질을 흡수 제거할 수 있는 다기능 방지시설이다. 형식별로 분무탑(저효율·저압손)에서 벤투리스크러버(고효율·고압손)까지 성능·비용 스펙트럼이 넓으므로 대상 오염물질과 처리목표에 맞는 형식 선정이 중요하며, 폐수처리·백연·결빙 등 습식 방식 고유의 부수적 문제를 설계 초기부터 함께 고려해야 한다. Day 45에서는 벤투리스크러버와 살수탑의 효율식을 구체적으로 다룬다.\n","side":[{"title":"세정집진장치 형식 선정 흐름도","body":"### 선정 절차\n```\n1. 처리 대상이 가스상 물질(SOx 등) 위주인가?\n   YES → 충전탑(흡수 효율 우선) 검토\n   NO  → Q2\n2. 목표 절단입경이 1㎛ 이하로 매우 낮은가?\n   YES → 벤투리스크러버 검토(고압손 감수)\n   NO  → Q3\n3. 폭발성·가연성 분진으로 건식장치 적용이 곤란한가?\n   YES → 세정집진장치 우선 적용\n   NO  → 건식 집진장치(여과·전기집진)와 비교 검토\n4. 폐수처리 인프라 확보 가능한가?\n   NO  → 세정집진 적용 재검토 또는 폐수처리시설 함께 계획\n```\n\n### 복합 오염물질 처리 사례\n반도체 공정 배가스처럼 산성가스(HF, HCl)와 미세입자가 함께 발생하는 경우, 충전탑(가스흡수)과 벤투리스크러버(입자포집)를 직렬 배치해 두 오염물질을 동시에 처리하는 설계가 일반적이다.\n\n### 소각시설 세정탑 적용 사례\n소각시설에서는 반건식 반응탑(소석회 분무로 HCl·SOx 1차 중화) 후단에 습식 세정탑을 추가해 잔류 산성가스와 중금속(수은 등)을 최종 제거하는 2단 처리가 일반적으로 채택되며, 이후 여과집진기 또는 활성탄 흡착탑과 조합해 다이옥신류까지 종합 관리한다.\n\n### 습식과 반건식의 차이\n| 구분 | 습식(세정탑) | 반건식(반응탑) |\n|---|---|---|\n| 반응제 상태 | 수용액(슬러리) | 소석회 슬러리 분무 후 건조 |\n| 부산물 | 폐수 발생 | 건조분말(비산재와 혼합 가능) |\n| 설치면적 | 상대적으로 작음 | 체류시간 확보 위해 큼 |\n| 적용 온도 | 상대적으로 낮음 | 다소 높음(150~200℃) |\n\n두 방식 모두 산성가스 중화라는 공통 목적을 가지지만, 폐수 발생 여부와 부산물 처리방식이 근본적으로 다르므로 사업장의 용수·폐수처리 여건에 따라 선택이 갈린다. 최근에는 폐수 무방류를 지향하는 사업장이 늘면서 반건식 방식의 채택 비중이 높아지는 추세다."},{"title":"백연(플룸) 발생원리와 저감대책","body":"### 발생원리\n세정탑을 통과한 배출가스는 수증기로 포화된 상태(상대습도 100%에 근접)로 대기 중에 방출되는데, 저온의 외기와 만나면 급격히 냉각되며 과포화 상태가 되어 미세한 물방울(백연)이 응결·가시화된다. 특히 동절기 저온다습 조건에서 두드러진다.\n\n### 저감대책\n| 대책 | 원리 | 비고 |\n|---|---|---|\n| 재가열(Reheat) | 배출 전 가스온도 상승 → 상대습도 저하 | 에너지 소비 증가 |\n| 응축식 열교환기 | 수증기 일부 응축 제거 후 배출 | 응축수 회수 활용 가능 |\n| 백연방지형 세정탑 | 습식+건식 공기 혼합 배출 | 초기투자비 증가 |\n| 배출구 위치·높이 조정 | 확산 촉진으로 시인성 저감 | 근본 저감은 아님 |\n\n### 민원 대응 관점\n백연은 법적 오염물질은 아니지만 시각적 불쾌감으로 인한 민원의 주요 원인이므로, 주거지 인접 사업장은 환경영향평가 협의 단계에서부터 백연 저감방안을 사전에 제시하는 것이 사업 추진에 유리하다. 최근에는 백연저감 여부를 환경영향평가 협의조건으로 명시하는 사례도 늘고 있다.\n\n### 백연과 실제 오염물질 배출의 구분\n백연은 수증기 응결에 의한 시각적 현상으로 그 자체가 「대기환경보전법」상 규제 오염물질은 아니지만, 일반 주민 입장에서는 오염물질 배출로 오인하기 쉬워 사업장 이미지·주민 수용성에 영향을 미친다. 환경영향평가 보고서 작성 시 백연 현상과 실제 배출농도(오염물질 농도)를 명확히 구분해 설명하는 것이 오해를 줄이는 데 효과적이다.\n\n### 계절별 백연 발생 특성\n동절기(저온·저습 외기)에는 배출가스와 외기의 온도차가 커 백연이 뚜렷하게 관찰되는 반면, 하절기(고온다습 외기)에는 상대적으로 덜 관찰되는 경향이 있다. 이러한 계절적 특성을 사전에 설명하면 동절기 민원 발생 시 시설 이상이 아니라는 점을 효과적으로 소명할 수 있다."}]},"45":{"day":45,"date":"2026-09-14","title":"벤투리스크러버와 살수탑 효율식","keywords":[{"k":"벤투리스크러버 구조","subs":["수축부-목부(throat)-확대부","목부 고속기류(60~120m/s)에서 세정수 접촉","목부 유속 조절로 압손·효율 제어"]},{"k":"Johnstone식","subs":["η=1-exp(-k·(L/G)·√ΔP)","k: 장치상수(분진특성별)","L/G와 ΔP 모두 효율에 기여"]},{"k":"살수탑(spray tower) 효율식","subs":["η=1-exp(-3QlHη0/2dQgVt) 계열식","액적 종말속도·직경 영향","체류시간(H/Vt)이 핵심"]},{"k":"압력손실-효율 관계","subs":["ΔP↑→목부유속↑→미세액적생성↑→효율↑","과도한 ΔP는 동력비 급증","목부 가변형(가변벤투리)으로 조절"]},{"k":"설계 실무","subs":["목부 유속 설계값 선정","순환수 배관·펌프 용량 산정","액적 재비산(demister) 방지 구조"]}],"answer":"# 벤투리스크러버와 살수탑 효율식\n\n## Ⅰ. 개요\n\n세정집진장치 중 벤투리스크러버는 절단입경 1㎛ 이하까지 확보 가능한 고효율 형식이며, 살수탑(분무탑)은 상대적으로 저압손·저효율의 범용 형식이다. 두 장치 모두 액적과 입자의 상대속도·접촉시간이 효율을 좌우하지만, 그 구현 방식(고속기류 vs 자유낙하 액적)이 근본적으로 달라 각각 다른 효율식으로 설계된다. *(114~138회 다수 25점, 계산문제 기출)*\n\n## Ⅱ. 벤투리스크러버(Venturi Scrubber)\n\n### 1. 구조와 원리\n벤투리관은 수축부(converging)-목부(throat)-확대부(diverging)로 구성되며, 목부에서 유속이 극대화(통상 60~120m/s)될 때 세정수를 분사하면 고속기류가 액체를 미세한 액적으로 파쇄(atomization)한다. 이 미세액적과 입자 사이의 큰 상대속도가 강력한 관성충돌을 유발해 미세입자까지 효과적으로 포집한다.\n\n### 2. Johnstone식(효율식)\n**η = 1 − exp[−k·(L/G)·√ΔP]**\n\n| 기호 | 의미 |\n|---|---|\n| k | 장치상수(대상 분진의 관성충돌 특성에 따라 결정, 실험적으로 구함) |\n| L/G | 액가스비(L/㎥) |\n| ΔP | 벤투리 압력손실 |\n\n이 식에서 효율은 **액가스비와 압력손실 모두에 양의 상관관계**를 가지며, 압력손실은 제곱근으로 기여하므로 효율을 크게 높이려면 액가스비 증가보다 압력손실(목부유속) 증가가 상대적으로 효과적임을 알 수 있다. 다만 압력손실 증가는 송풍동력비 급증을 수반하므로 경제적 최적점이 존재한다.\n\n## Ⅲ. 살수탑(Spray Tower)\n\n### 1. 원리\n탑 상부에서 노즐로 분사된 물방울(액적)이 자유낙하하는 동안 상승하는 함진가스와 접촉해 입자를 포집한다. 벤투리처럼 강제 고속접촉이 아닌 중력낙하 액적과 가스의 상대운동에 의존하므로 상대적으로 효율이 낮다.\n\n### 2. 효율식(개념)\n액적의 종말침강속도(Vt, Day 30 Stokes식)와 가스 상승속도(Vg), 탑 높이(H), 액적 직경(d) 등이 지배변수이며, 개념적으로 다음과 같이 표현된다.\n\n**η = 1 − exp[−(3·Ql·H·η0)/(2·d·Qg·Vt)]** (η0: 단일액적 포집효율)\n\n| 기호 | 의미 |\n|---|---|\n| Ql, Qg | 액체·가스 유량 |\n| H | 탑 높이(액적 낙하거리) |\n| d | 액적 직경 |\n| Vt | 액적 종말속도 |\n| η0 | 단일액적-단일입자 포집효율(관성충돌계수 함수) |\n\n핵심은 **체류시간(액적이 낙하하는 시간, H/Vt에 비례)이 길수록, 액적 직경이 작을수록** 효율이 향상된다는 점이며, 이는 앞서 학습한 여과·전기집진의 \"접촉시간 확보\"라는 공통 원리와 일맥상통한다.\n\n## Ⅳ. 두 장치의 비교와 압력손실-효율 관계\n\n| 구분 | 벤투리스크러버 | 살수탑 |\n|---|---|---|\n| 접촉방식 | 강제 고속기류(목부) | 자유낙하 액적 |\n| 절단입경 | 0.5~2㎛(우수) | 5~10㎛(보통) |\n| 압력손실 | 300~800mmH2O(큼) | 50~150mmH2O(작음) |\n| 주 용도 | 미세먼지 고효율 처리 | 가스흡수 병행, 전처리 |\n| 목부유속 조절 | 가변벤투리로 유량변동 대응 가능 | 노즐수·압력 조절 |\n\n### 압력손실 조절 방식 — 가변 벤투리(Variable Throat)\n목부 단면적을 가변으로 조절할 수 있는 가변벤투리는 유량 변동 시에도 목부유속(및 압력손실)을 일정하게 유지해 효율 변동을 최소화할 수 있어, 유량 변동이 큰 공정에 유리하다.\n\n## Ⅴ. 실무 설계 시 유의사항\n\n1. **목부 유속 상한**: 목부 유속을 지나치게 높이면 액적이 과도하게 미세화되어 데미스터에서도 포집되지 않고 동반 유출되거나, 벤투리 목부·확대부의 마모가 급격히 진행될 수 있어 통상 120m/s 이내로 제한한다.\n2. **분진 특성별 k값 관리**: Johnstone식의 장치상수 k는 분진의 밀도·형상·친수성에 따라 달라지므로, 동일 설계 압력손실이라도 대상 분진이 바뀌면 실측 효율이 달라질 수 있다. 신규 공정 도입 시 파일럿 시험으로 k값을 재확인하는 것이 바람직하다.\n3. **순환수 정도관리**: 순환수의 고형물 농도가 높아지면 노즐 폐색·목부 마모가 가속되므로, 정기적인 블로우다운과 청수 보충으로 수질을 관리해야 한다.\n4. **압력손실 실측 검증**: 설계 단계의 이론적 ΔP-효율 관계는 실제 운전 시 목부 형상 오차, 노즐 배치, 액적 분포 불균일 등으로 편차가 발생할 수 있으므로, 준공 후 성능시험을 통해 실측 효율을 확인하고 필요시 목부 유속을 재조정한다.\n\n## Ⅵ. 결론\n\n벤투리스크러버는 목부 고속기류에 의한 미세액적 생성으로 미세입자까지 고효율로 포집하며, 효율은 Johnstone식(액가스비와 압력손실의 함수)으로 산정된다. 살수탑은 자유낙하 액적의 체류시간에 의존해 상대적으로 낮은 효율·압력손실을 가지며, 주로 가스흡수 병행이나 전처리 용도로 활용된다. 두 장치 모두 압력손실(동력비)과 효율의 상충관계가 뚜렷하므로, 목표 배출기준과 운영비를 종합적으로 고려한 설계가 필요하다. 계산문제 대비를 위해 Johnstone식과 살수탑 효율식의 변수별 민감도(ΔP·L/G·H·d)를 손으로 직접 대입해보는 연습이 실전에서 큰 도움이 된다. 아울러 두 장치의 효율식 형태가 모두 \"1−exp(−지수항)\"의 구조를 공유한다는 점을 기억해두면, 유사한 형태의 다른 집진장치 효율식(Deutsch식 등)과 연결지어 암기하는 데에도 효과적이다.\n","side":[{"title":"Johnstone식 계산 예제","body":"### 조건\nk=0.15(장치상수 가정), L/G=1.2 L/㎥, ΔP=500mmH2O\n\n### 계산\nη = 1−exp[−k×(L/G)×√ΔP]\n= 1−exp[−0.15×1.2×√500]\n= 1−exp[−0.15×1.2×22.36]\n= 1−exp[−4.02]\n= 1−0.018\n≈ **98.2%**\n\n### 압력손실 변화에 따른 민감도\n| ΔP(mmH2O) | √ΔP | 효율(근사) |\n|---|---|---|\n| 200 | 14.1 | 약 92.9% |\n| 500 | 22.4 | 약 98.2% |\n| 800 | 28.3 | 약 99.4% |\n\n압력손실을 200→800(4배)으로 높이면 효율은 92.9%→99.4%로 향상되지만, 송풍동력은 유량×압력손실에 비례해 대략 4배 가까이 증가하므로, 목표 배출농도를 만족하는 최소 압력손실을 찾는 것이 경제적 설계의 핵심이다.\n\n### 액가스비 변화에 따른 민감도\n| L/G | 효율(근사, ΔP=500 고정) | 폐수량 |\n|---|---|---|\n| 0.6 | 약 90.9% | 기준×0.5 |\n| 1.2 | 약 98.2% | 기준×1.0 |\n| 1.8 | 약 99.7% | 기준×1.5 |"},{"title":"세정탑 설계 실무 절차와 데미스터(demister)","body":"### 설계 절차 개요\n```\n1. 목표 배출농도(효율) 설정\n2. 대상 분진 특성 파악(입도분포, k값 추정 또는 실측)\n3. Johnstone식으로 필요 ΔP·L/G 조합 산정\n4. 목부 유속·단면적 결정(벤투리 형상 설계)\n5. 순환수 펌프·배관 용량 산정\n6. 데미스터(demister) 설계로 출구 액적 재비산 방지\n7. 폐수처리 계통 연계 설계\n```\n\n### 데미스터의 역할\n세정탑 출구에서 가스에 동반된 미세 물방울(mist)이 그대로 배출되면 배출가스 중 액적이 재증발하며 오염물질을 다시 방출하거나, 굴뚝 주변에 물방울 낙하(민원 원인)를 유발할 수 있다. 이를 방지하기 위해 출구에 지그재그형 또는 메쉬형 데미스터를 설치해 동반 액적을 제거한다.\n\n### 순환수 관리\n세정수는 통상 순환 사용하며, 포집된 분진·흡수된 가스상 물질이 누적되므로 주기적으로 일부를 배출(블로우다운)하고 청수를 보충한다. 순환수의 pH·부유물질농도(SS)를 상시 관리하지 않으면 노즐 폐색, 배관 스케일, 세정효율 저하로 이어질 수 있다.\n\n### 부식·마모 관리\n산성가스를 흡수하는 세정탑은 내산 라이닝(FRP, 고무라이닝 등)을 적용해야 하며, 벤투리 목부는 고속기류에 의한 마모가 심하므로 세라믹·내마모합금 등 교체형 라이닝을 채택하는 경우가 많다.\n\n### 동절기 운전관리\n순환수 배관·노즐이 동결되면 세정수 공급이 중단되어 방지시설 기능이 상실될 수 있으므로, 동절기에는 배관 보온·열선(트레이싱)을 설치하고 정지 시 잔류수를 배수하는 절차를 운전지침에 포함해야 한다. 특히 옥외 설치된 세정탑은 동절기 관리소홀 시 배관 파손으로 이어져 장기간 가동중단이 발생할 수 있다."}]},"46":{"day":46,"date":"2026-09-15","title":"후드의 유형과 포착속도","keywords":[{"k":"후드 유형 4종","subs":["포위식(부스형·글러브박스형)","외부식(측방·하부·상방흡인형)","레시버식(캐노피형)"]},{"k":"포착속도(Capture Velocity)","subs":["오염원에서 후드까지 오염물 이송 유속","ACGIH 권장범위 0.25~10 m/s","작업조건별 차등 적용"]},{"k":"외부식 후드 설계식","subs":["무플랜지 Q=V(10X²+A)","플랜지부착 Q=0.75V(10X²+A)","슬롯형 Q=3.7LVX"]},{"k":"포착속도 지배인자","subs":["오염물질 비산 속도(발생조건)","작업장 기류·확산조건","오염물질 유해성 등급"]},{"k":"후드 설계원칙","subs":["가능한 오염원 근접·포위","플랜지 부착으로 효율 향상","측방 기류 차단(측벽 설치)"]}],"answer":"# 후드(Hood)의 유형과 포착속도\n\n## Ⅰ. 개요\n\n국소배기장치(Local Exhaust Ventilation)의 첫 구성요소인 후드(Hood)는 발생원에서 오염물질을 포집해 덕트로 이송하는 입구부로, 후드의 형식과 설계 유속(포착속도)이 국소배기 전체 시스템의 소요 풍량·에너지 소비를 결정하는 출발점이 된다. 후드 설계가 부적절하면 아무리 우수한 집진장치를 후단에 설치해도 오염물질이 작업환경으로 확산되어 근로자 노출을 막을 수 없다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 후드의 유형\n\n### 1. 포위식(Enclosure Type)\n오염원을 완전히 또는 부분적으로 감싸는 형식으로, 오염물질의 외부 확산을 원천 차단해 가장 효율적이다.\n- 부스형(Booth): 도장부스 등, 개구부를 통해서만 작업\n- 글러브박스형(Glove Box): 완전밀폐, 유해성 극히 높은 물질(방사성물질 등)\n\n### 2. 외부식(Exterior/Receiving Type — 정확히는 External Hood)\n오염원을 감싸지 않고 근접 배치해 흡인하는 형식. 설치가 용이하나 포위식보다 필요 풍량이 크다.\n- 측방흡인형(Side-draft): 작업대 측면 배치\n- 하방흡인형(Downdraft): 작업대 하부에서 흡인, 무거운 입자·흄에 유리\n- 상방흡인형(Updraft): 작업대 상부에서 흡인\n\n### 3. 레시버식(Receiving Type)\n오염물질이 일정한 방향과 속도로 스스로 비산하는 경우, 그 진행경로 상에 후드를 설치해 자연스럽게 받아들이는 형식.\n- 캐노피형(Canopy): 고온상승기류를 이용(용융로, 가열조 상부)\n- 그라인더형: 회전체에서 비산하는 입자의 관성방향에 배치\n\n| 유형 | 오염원과의 관계 | 필요풍량 | 효율 |\n|---|---|---|---|\n| 포위식 | 감쌈 | 작음 | 매우 높음 |\n| 외부식 | 근접 배치 | 큼(거리제곱에 비례 증가) | 중간 |\n| 레시버식 | 자연 비산경로 이용 | 상대적으로 작음 | 오염원 특성에 좌우 |\n\n## Ⅲ. 포착속도(Capture Velocity)\n\n### 1. 정의\n포착속도는 오염원에서 발생한 오염물질을 후드 방향으로 이송시키는 데 필요한 최소 기류속도로, ACGIH(미국산업위생전문가협의회) 권장기준에 따라 작업조건별로 차등 적용한다.\n\n| 작업조건 예시 | 포착속도 범위(m/s) |\n|---|---|\n| 정지 공기 중 저속 확산(도금조 등) | 0.25~0.5 |\n| 저속 기류 중 완만한 비산(용접 등) | 0.5~1.0 |\n| 능동적 비산(분쇄·컨베이어 이송) | 1.0~2.5 |\n| 고속 비산(블라스팅·분사) | 2.5~10 |\n\n### 2. 지배인자\n1. 오염물질의 발생 시 초기속도(비산조건)\n2. 작업장 내 실내기류·난기류 조건(방해기류가 강할수록 높은 포착속도 필요)\n3. 오염물질의 유해성(유해성이 높을수록 안전측 설계, 높은 포착속도 채택)\n\n## Ⅳ. 외부식 후드 설계식(ACGIH)\n\n### 1. 원형·사각 후드(플랜지 없음)\n**Q = V(10X² + A)**\n\n| 기호 | 의미 |\n|---|---|\n| Q | 필요 송풍량(㎥/s) |\n| V | 제어점(오염원)에서의 목표 포착속도 |\n| X | 후드 개구면에서 오염원까지 거리 |\n| A | 후드 개구면적 |\n\n### 2. 플랜지 부착 후드\n**Q = 0.75·V(10X² + A)**\n\n플랜지(개구부 주변 판)를 부착하면 후드 후방으로부터의 무효 흡인을 차단해 동일 포착속도 확보에 필요한 풍량을 약 25% 절감할 수 있다.\n\n### 3. 슬롯형 후드\n**Q = 3.7·L·V·X** (L: 슬롯 길이)\n\n슬롯형은 좁고 긴 개구부로 균일한 흡인분포를 얻기 쉬워 도금조·화학조 등 장방형 오염원에 적합하다.\n\n## Ⅴ. 후드 설계원칙과 실무 유의점\n\n1. **근접 배치 원칙**: 설계식에서 X²에 비례해 필요풍량이 증가하므로, 후드를 오염원에 최대한 가깝게 배치하는 것이 가장 효과적인 에너지 절감 방법이다.\n2. **플랜지 활용**: 구조적으로 가능하다면 플랜지를 부착해 풍량을 절감한다.\n3. **측방 방해기류 차단**: 작업장 내 공조기류·출입문 기류 등이 후드 성능을 저해할 수 있어, 측벽이나 커튼으로 방해기류를 차단하는 설계를 병행한다.\n4. **작업동선 고려**: 근로자가 오염원과 후드 사이에 위치하면 포집효율이 급격히 저하되므로 작업자세·동선을 설계 단계에서 반영해야 한다.\n\n## Ⅵ. 결론\n\n후드는 국소배기장치의 성능을 좌우하는 첫 관문으로, 포위식-외부식-레시버식 중 오염원 특성에 맞는 유형을 선정하고, ACGIH 권장 포착속도 범위 내에서 근접거리·플랜지 여부를 반영해 설계식으로 필요풍량을 산정해야 한다. 다음 학습(Day 47)에서는 후드에서 흡인된 오염물질을 이송하는 덕트의 설계(반송속도·동수직경)를 다룬다.\n","side":[{"title":"외부식 후드 설계 계산 예제","body":"### 조건\n원형 후드, 플랜지 없음, 개구면적 A=0.2㎡, 오염원까지 거리 X=0.3m, 목표 포착속도 V=1.0m/s\n\n### 1. 무플랜지 후드\nQ = V(10X²+A) = 1.0×(10×0.09+0.2) = 1.0×(0.9+0.2) = **1.1㎥/s**\n\n### 2. 플랜지 부착 시\nQ = 0.75×1.0×(0.9+0.2) = 0.75×1.1 ≈ **0.825㎥/s**\n\n→ 플랜지 부착만으로 약 25% 풍량 절감(약 0.275㎥/s 감소), 연간 송풍동력비 절감으로 이어진다.\n\n### 3. 거리(X) 증가에 따른 민감도\n| X(m) | Q(무플랜지, ㎥/s) | 증가율 |\n|---|---|---|\n| 0.2 | 1.0×(0.4+0.2)=0.6 | 기준 |\n| 0.3 | 1.1 | +83% |\n| 0.4 | 1.0×(1.6+0.2)=1.8 | +200% |\n\n거리가 2배(0.2→0.4m) 늘어나면 필요풍량은 3배로 급증한다. 이는 후드를 오염원에 최대한 근접 배치해야 하는 이유를 정량적으로 뒷받침하는 핵심 근거다.\n\n### 슬롯형 후드 계산 예제\n슬롯 길이 L=1.0m, X=0.3m, V=1.0m/s 적용 시\nQ = 3.7×L×V×X = 3.7×1.0×1.0×0.3 ≈ **1.11㎥/s**\n\n슬롯형은 개구부가 좁고 길어 균일한 흡인분포를 얻을 수 있어, 도금조·화학조와 같이 표면 전체에서 고르게 오염물질이 발생하는 오염원에 적합하다."},{"title":"후드 형식 선정 흐름도와 산업안전보건법 연계","body":"### 선정 절차\n```\n1. 오염물질의 유해성 등급 확인(특별관리물질 여부)\n   높음 → 포위식(가능한 완전포위) 우선 검토\n2. 오염원의 비산 특성 확인\n   자연 비산경로 뚜렷(고온상승류 등) → 레시버식 검토\n   비산경로 불명확 → 외부식 검토\n3. 작업 접근성 요구사항 확인\n   근로자 수작업 필요 → 외부식(측방/하방) 또는 부분포위식\n4. 설치공간·구조 제약 확인\n   제약 심함 → 슬롯형 등 컴팩트 형식 검토\n```\n\n### 산업안전보건법령과의 연계\n「산업안전보건법」및 관련 고시(국소배기장치·전체환기장치 설비 기준)에서는 특정 유해물질 취급 작업 시 국소배기장치 설치를 의무화하고, 후드의 제어풍속(포착속도) 기준을 물질별로 규정하고 있다. 대기환경보전법상 배출시설 인허가와 별개로 산업안전보건 분야의 후드 설계기준도 함께 검토해야 하는 경우가 실무에서 자주 발생한다.\n\n### 실무 시사점\n환경기술사 업무에서는 대기오염물질 저감(대기환경보전법)과 근로자 보호(산업안전보건법)라는 두 법체계의 요구사항이 후드 설계에서 만나므로, 두 기준을 모두 충족하는 통합적 접근이 필요하다.\n\n### 후드 성능 점검 방법\n설치 후에는 연막(smoke tube) 시험이나 열선풍속계를 이용해 후드 개구면의 실제 포착속도 분포를 확인하고, 설계치에 미달하는 구간이 있으면 송풍량 재조정 또는 후드 형상 보완을 검토한다. 정기적인 성능점검은 국소배기장치 자체검사 항목에도 포함되는 경우가 많다."}]},"47":{"day":47,"date":"2026-09-16","title":"덕트 설계와 반송속도·동수직경","keywords":[{"k":"반송속도(Transport Velocity)","subs":["입자 침강·퇴적 방지 최소유속","물질 종류별 5~25m/s 차등","과소 시 덕트 내 퇴적·폐색"]},{"k":"동수직경(Hydraulic Diameter)","subs":["Dh=4A/P (단면적/둘레)","비원형 덕트의 등가직경 산정","압력손실 계산에 사용"]},{"k":"압력손실 구성","subs":["마찰손실(직관부)+국부손실(부속류)","국부손실=속도압×손실계수(ζ)","등가길이법 병행 사용"]},{"k":"덕트 배치 설계","subs":["최단거리·급격한 굴곡 지양","합류부 각도 30° 이내 권장","정압균형(밸런싱) 확보"]},{"k":"실무 설계절차","subs":["최대 저항경로(index run) 선정","분기별 유량-저항 균형 확인","댐퍼 최소화(고정저항 우선)"]}],"answer":"# 덕트 설계와 반송속도·동수직경\n\n## Ⅰ. 개요\n\n덕트(Duct)는 후드에서 흡인한 오염물질을 집진장치·배출구까지 이송하는 관로로, 유속이 너무 낮으면 입자가 덕트 내부에 퇴적해 폐색을 유발하고, 너무 높으면 압력손실과 마모가 커진다. 덕트 설계는 반송속도 선정, 단면형상에 따른 동수직경 산정, 압력손실 계산의 세 요소가 핵심이며, 이는 후드(Day 46)에서 결정된 풍량을 실제로 이송 가능하게 만드는 실무 설계 과정이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 반송속도(Transport Velocity)\n\n### 1. 개념\n덕트 내부에서 입자가 중력에 의해 침강·퇴적되지 않고 기류에 실려 이동하는 데 필요한 최소 유속을 반송속도라 한다. 물질의 밀도·입경이 클수록 높은 반송속도가 요구된다.\n\n### 2. 물질별 권장 반송속도\n\n| 물질 종류 | 권장 반송속도(m/s) |\n|---|---|\n| 가스·증기(입자 없음) | 5~10 |\n| 흄(fume, 매우 미세) | 10~13 |\n| 미세건조분진(목분, 곡물분진 등) | 13~18 |\n| 일반 산업분진(연마분진, 방직분진) | 18~20 |\n| 무겁고 습한 분진(금속분, 주물분진) | 20~25 |\n\n반송속도를 지나치게 높게 설계하면 압력손실 증가로 송풍동력비가 상승하고 덕트 마모가 촉진되므로, 물질 특성에 맞는 하한값 근처에서 설계하는 것이 경제적이다.\n\n## Ⅲ. 동수직경(Hydraulic Diameter)\n\n### 1. 정의\n원형이 아닌(사각형 등) 덕트 단면에 대해 등가의 원형 직경을 산정하는 개념으로, 압력손실 계산 시 원형관 기준 공식(레이놀즈수, 마찰손실계수 등)을 그대로 적용할 수 있게 해준다.\n\n**Dh = 4A/P**\n\n| 기호 | 의미 |\n|---|---|\n| A | 덕트 단면적 |\n| P | 단면의 젖은 둘레(wetted perimeter) |\n\n### 2. 사각덕트 적용 예\n가로 a, 세로 b인 사각덕트의 경우: Dh = 4(a·b)/[2(a+b)] = 2ab/(a+b)\n\n정사각형(a=b)이면 Dh=a로 한 변의 길이와 같아지며, 세로가 극단적으로 좁은 편평한 덕트일수록 동일 단면적 대비 동수직경이 작아져 마찰손실이 상대적으로 커진다.\n\n## Ⅳ. 압력손실 계산\n\n### 1. 구성\n**전체 압력손실 = 마찰손실(직관부) + 국부손실(부속류: 엘보, 분기, 확대·축소부 등)**\n\n### 2. 마찰손실\nDarcy-Weisbach식 등을 이용해 관 길이·동수직경·유속·마찰계수의 함수로 산정한다. 실무에서는 덕트 재질·유속별 압력손실 선도(마찰손실 챠트)를 활용하는 경우가 많다.\n\n### 3. 국부손실\n**국부손실 = 손실계수(ζ) × 속도압(VP)**, 속도압 VP = ρV²/2\n\n| 부속류 | 손실계수(ζ) 개략값 |\n|---|---|\n| 90° 엘보(급) | 0.9~1.2 |\n| 90° 엘보(완만, R/D≥1.5) | 0.2~0.4 |\n| 45° 분기(Y형) | 0.2~0.4 |\n| 급격 확대부 | 0.5~1.0 |\n| 급격 축소부 | 0.1~0.3 |\n\n곡률반경이 클수록(완만한 굴곡일수록), 분기각이 작을수록 국부손실이 줄어들므로 배관 배치 시 이를 우선 고려한다.\n\n### 4. 등가길이법(Equivalent Length Method)\n부속류의 국부손실을 동일한 압력손실을 발생시키는 직관 길이로 환산해 전체를 직관 마찰손실로 통합 계산하는 방법으로, 복잡한 배관 시스템의 압력손실을 간편하게 산정할 수 있어 실무에서 널리 사용된다.\n\n## Ⅴ. 덕트 배치 설계와 실무 절차\n\n### 1. 배치 원칙\n1. 최단거리·최소 굴곡으로 설계해 압력손실 최소화\n2. 급격한 방향전환 대신 완만한 곡률반경(R≥1.5D) 확보\n3. 분기 합류 시 각도는 30° 이내로 완만하게 접속(급격 합류 시 난류·압력손실 증가)\n4. 청소구·점검구를 주요 굴곡부·합류부 인근에 배치\n\n### 2. 실무 설계 절차 — 최대저항경로(Index Run) 산정\n```\n1. 각 후드로부터 집진장치까지의 경로별 압력손실 계산\n2. 압력손실이 가장 큰 경로(index run)를 기준경로로 선정\n3. 송풍기는 index run의 총 압력손실을 충족하도록 선정\n4. 나머지 경로는 index run 대비 압력손실이 낮으므로,\n   댐퍼로 저항을 추가하거나(저항균형법) 덕트 직경을 조정(정압균형법)해\n   전체 시스템의 유량 배분을 설계치에 맞춤\n```\n\n### 3. 저항균형법 vs 정압균형법\n| 구분 | 저항균형법(댐퍼) | 정압균형법(직경조정) |\n|---|---|---|\n| 조정방법 | 댐퍼로 인위적 저항 추가 | 덕트 직경 자체를 설계로 조정 |\n| 장점 | 시공 후 미세조정 용이 | 반송속도 설계치 유지 |\n| 단점 | 댐퍼 부분 퇴적 위험(분진 작업 시) | 초기 설계 정밀도 요구 |\n\n분진을 이송하는 국소배기 계통에서는 댐퍼 개도 축소부에 분진이 퇴적·폐색될 위험이 있어, 가능한 정압균형법(덕트 직경 자체를 설계로 균형화)을 우선 적용하는 것이 원칙이다.\n\n## Ⅵ. 결론\n\n덕트 설계는 물질 특성에 맞는 반송속도 선정, 동수직경을 이용한 비원형 단면의 등가화, 마찰손실·국부손실을 포함한 압력손실 산정을 통해 완성된다. 배치 단계에서는 최대저항경로(index run)를 기준으로 송풍기를 선정하고, 분진 이송계통에서는 댐퍼보다 정압균형법을 우선 적용해 배관 내 퇴적·폐색 위험을 최소화하는 것이 실무 설계의 핵심 원칙이다.\n","side":[{"title":"동수직경·압력손실 계산 예제","body":"### 조건\n사각덕트 단면 400mm×200mm, 반송속도 V=18m/s, 직관길이 20m, 90° 완만엘보 2개(ζ=0.3), 가스밀도 ρ=1.2kg/㎥\n\n### 1. 동수직경\nDh = 2ab/(a+b) = 2×0.4×0.2/(0.4+0.2) = 0.16/0.6 ≈ **0.267m**\n\n### 2. 속도압\nVP = ρV²/2 = 1.2×18²/2 = 1.2×324/2 = **194.4 Pa** (약 19.8mmH2O)\n\n### 3. 국부손실(엘보 2개)\nΔP(국부) = 2×ζ×VP = 2×0.3×194.4 ≈ **116.6 Pa**\n\n### 4. 마찰손실(개략, 단위길이당 손실 3 Pa/m 가정 시)\nΔP(마찰) = 20m × 3 Pa/m = **60 Pa**\n\n### 5. 총 압력손실\nΔP(total) ≈ 116.6 + 60 = **약 176.6 Pa**(약 18mmH2O)\n\n### 해석\n이 경로의 압력손실은 후드 손실, 집진장치 손실과 합산해 송풍기 전체 소요양정을 결정하는 데 사용된다. 실무에서는 유사한 계산을 모든 분기경로에 대해 반복해 최대저항경로(index run)를 식별한다.\n\n### 반송속도 검증\n설계유량 Q=1.44㎥/s(=V×A=18×0.08)를 유지하기 위해서는 단면적 0.08㎡(0.4m×0.2m)가 정확히 확보되어야 하며, 시공오차로 단면적이 줄어들면 반송속도가 설계치보다 높아져 압력손실이 예상보다 커지는 결과로 이어진다. 준공 후 반드시 실측 유속을 확인해 설계치와의 편차를 점검해야 한다."},{"title":"덕트 폐색 방지 설계와 유지관리","body":"### 폐색 발생 원인\n1. 반송속도 설계치보다 낮은 실제 운전유속(송풍기 성능저하, 누기 등)\n2. 수평 덕트 구간의 과도한 사용(가능한 수직·경사 배치 권장)\n3. 급격한 단면 변화·정체구간 존재\n4. 다습 조건에서 분진이 응결·고착\n\n### 예방설계 원칙\n| 원칙 | 내용 |\n|---|---|\n| 수평구간 최소화 | 가능한 수직 또는 경사(45° 이상) 배치 |\n| 청소구 설치 | 주요 굴곡부·합류부·수평구간 저점에 배치 |\n| 정기 유속측정 | 반송속도 실측으로 퇴적 조짐 조기 발견 |\n| 압력손실 모니터링 | 계통 전체 ΔP 상승 시 폐색 의심구간 점검 |\n\n### 폐색 발견 시 조치 절차\n```\n1. 압력손실 이상 상승 구간 특정(계통별 차압 비교)\n2. 해당 구간 청소구를 통한 육안·기계적 점검\n3. 퇴적 확인 시 기계적 제거(로드, 압축공기 블로우) 또는 부분 분해청소\n4. 재발 방지를 위한 반송속도 재검토(필요시 덕트 직경 축소 개조)\n```\n\n### 실무 시사점\n덕트 폐색은 국소배기장치 전체의 흡인 성능을 급격히 저하시켜 작업환경 기준 초과, 나아가 대기오염물질 배출허용기준 위반으로 이어질 수 있으므로, 정기적인 압력손실·반송속도 점검을 예방정비 계획에 반드시 포함해야 한다.\n\n### 재질 선정과 마모 관리\n분진 함유 가스를 이송하는 덕트는 내마모성이 요구되며, 곡관부·분기부 등 유동방향이 급격히 변하는 구간은 직관부보다 마모가 빠르게 진행되므로 교체 가능한 마모판(wear plate)을 부착하거나 내마모 재질(스테인리스, 세라믹 라이닝)을 국부 적용하는 것이 유지관리비 절감에 효과적이다."}]},"48":{"day":48,"date":"2026-09-17","title":"1단계 이론·확산·집진 회독 6회차","keywords":[{"k":"전기집진 원리·설계식","subs":["4단계: 하전→이동→포집→탈진","Deutsch-Anderson η=1-exp(-Awe/Q)","이동속도we=CcEEpd/3πμ"]},{"k":"비저항(resistivity) 관리","subs":["정상범위 10⁴~10¹¹Ω·cm","저비저항→재비산, 고비저항→역전리","SO3컨디셔닝·온도조절 대책"]},{"k":"세정집진 설계식","subs":["벤투리 Johnstone식 η=1-exp(-kL/G√ΔP)","살수탑 η=1-exp(-3QlHη0/2dQgVt)","액가스비(L/G) 효율·폐수 상충"]},{"k":"후드·포착속도","subs":["ACGIH 권장 0.25~10m/s","외부식 무플랜지 Q=V(10X²+A)","플랜지부착 Q=0.75V(10X²+A)"]},{"k":"덕트·시스템 설계 흐름","subs":["반송속도(물질별 5~25m/s)","동수직경 Dh=4A/P","후드→덕트→집진기→송풍기 순서"]}],"answer":"# 1단계 회독 6회차 — Day 41~47 요약·자가점검\n\n## Ⅰ. 회독 목적 + 논리 흐름도\n\n이번 구간은 \"고효율 집진(전기·세정)\"과 \"오염물질 이송계통(후드·덕트)\"이라는 두 축으로 구성된다. Day 41~43은 전기집진장치의 하전-이동-포집-탈진 메커니즘과 비저항이라는 운전변수를, Day 44~45는 세정집진장치의 포집기작과 벤투리·살수탑 설계식을, Day 46~47은 오염물질을 발생원에서 처리장치까지 이송하는 후드·덕트 설계를 다룬다. 전기집진·세정집진이 \"처리장치 내부의 물리화학\"이라면 후드·덕트는 \"처리장치까지 가는 유동설계\"로, 이 둘이 합쳐져야 하나의 방지시설 계통이 완성된다.\n\n```\n[고효율 집진 - 정전기력]           [고효율 집진 - 액적포집]\n전기집진(Day41~43)                  세정집진(Day44~45)\n하전(코로나)→이동(Deutsch)→포집→탈진   관성충돌·확산·응결(벤투리/살수탑)\n   ↓ 비저항 10^4~10^11 정상범위          ↓ L/G비, ΔP-효율 관계\n저비저항(재비산) / 고비저항(역전리)      고온·가연성가스 안전, 폐수·백연 문제\n   └──────────────┬──────────────┘\n                   ↓\n      [이송계통] 후드(Day46) → 덕트(Day47)\n      포착속도(ACGIH) → 반송속도·동수직경 → 압력손실\n                   ↓\n         다음 구간(49~51): 송풍기·국소배기 전체설계\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| Deutsch-Anderson식 | η=**1−exp(−A·we/Q)** | ☐ |\n| 이동속도(drift velocity) | we = **Cc·E·Ep·d/3πμ** | ☐ |\n| 전기집진 압력손실 | 통상 **10~20mmH2O** (매우 낮음) | ☐ |\n| 비저항 정상범위 | **10⁴~10¹¹ Ω·cm** | ☐ |\n| 저비저항 기준 | **<10⁴Ω·cm** → 재비산 | ☐ |\n| 고비저항 기준 | **>10¹¹Ω·cm** → 역전리(back corona) | ☐ |\n| 비저항 최대구간(온도) | 약 **150~200℃** | ☐ |\n| 벤투리 목부유속 | 통상 **60~120 m/s** | ☐ |\n| 액가스비(L/G) 범위 | 통상 **0.5~several L/㎥** | ☐ |\n| 후드 포착속도(ACGIH) | **0.25~10 m/s** | ☐ |\n| 외부식(무플랜지) | Q=**V(10X²+A)** | ☐ |\n| 외부식(플랜지부착) | Q=**0.75V(10X²+A)** | ☐ |\n| 슬롯형 후드 | Q=**3.7LVX** | ☐ |\n| 덕트 반송속도(흄) | **10~13 m/s** | ☐ |\n| 덕트 반송속도(무거운 습분진) | **20~25 m/s** | ☐ |\n| 동수직경 | Dh=**4A/P** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **Deutsch-Anderson 효율식**: η = 1−exp(−A·we/Q)\n2. **이동속도**: we = Cc·E·Ep·d/(3πμ)\n3. **Johnstone식(벤투리)**: η = 1−exp[−k·(L/G)·√ΔP]\n4. **살수탑 효율식**: η = 1−exp[−3·Ql·H·η0/(2d·Qg·Vt)]\n5. **외부식 후드(무플랜지)**: Q = V(10X²+A)\n6. **외부식 후드(플랜지)**: Q = 0.75V(10X²+A)\n7. **슬롯형 후드**: Q = 3.7LVX\n8. **동수직경**: Dh = 4A/P\n9. **덕트 압력손실 구성**: ΔPtotal = 마찰손실 + 국부손실(=ζ·ρV²/2)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 저비저항 vs 고비저항 | <10⁴Ω·cm, 재비산 | >10¹¹Ω·cm, 역전리 | 전하 소멸 속도(너무 빠름 vs 너무 느림) |\n| 벤투리스크러버 vs 살수탑 | 목부 고속기류, 고효율·고압손 | 저유속 분무, 저효율·저압손 | 액적 미세화 정도 |\n| 포착속도 vs 반송속도 | 후드 앞 오염물 흡인 유속 | 덕트 내 입자 이송 유속 | 적용 위치(발생원 vs 관로) |\n| 포위식 후드 vs 외부식 후드 | 오염원 감쌈, 효율 최고 | 오염원 노출, 포착속도 필요 | 오염원과 후드의 관계 |\n| 플랜지 유무 | 무플랜지 Q=V(10X²+A) | 플랜지 Q=0.75V(10X²+A) | 동일 포착속도에 필요풍량 25%↓ |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 전기집진장치의 하전 원리(장하전·확산하전)와 Deutsch-Anderson식을 설명하시오. *(114~138회 다수 25점)*\n2. 분진 비저항이 전기집진 효율에 미치는 영향과 조절대책을 설명하시오. *(120회 전후 25점)*\n3. 전기집진장치의 재비산(reentrainment)과 역전리(back corona) 현상을 비교 설명하시오. *(다수 회차 10~25점)*\n4. 세정집진장치의 포집기작과 벤투리스크러버의 효율 결정인자를 설명하시오. *(114~138회 25점)*\n5. 액가스비(L/G)가 세정집진 효율과 운전비에 미치는 영향을 설명하시오. *(최근 10점)*\n6. 후드의 종류를 분류하고 포착속도 결정인자를 설명하시오. *(다수 회차 10~25점)*\n7. 외부식 후드의 설계식(무플랜지·플랜지부착·슬롯형)을 유도·비교하시오. *(126회 전후 25점)*\n8. 덕트 설계 시 반송속도 선정기준과 동수직경 산정방법을 설명하시오. *(최근 10~25점)*\n9. 덕트 압력손실의 구성요소(마찰손실·국부손실)를 설명하시오. *(다수 회차 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(25분)**: Ⅰ의 흐름도를 그리며 전기집진·세정집진·후드·덕트가 하나의 계통으로 이어지는 순서를 설명해본다.\n2. **식 쓰기(30분)**: Ⅲ의 9개 식을 기호 정의까지 포함해서 백지에 작성.\n3. **수치 암기(20분)**: Ⅱ 체크리스트, 특히 비저항 범위와 후드 설계식 3종을 우선 암기.\n4. **기출 구술(30분)**: Ⅴ의 9문항을 소리 내어 답해본다.\n5. **계산 연습(20분)**: Day 41의 Deutsch식, Day 46의 외부식 후드 풍량을 다른 수치로 바꿔 재계산.\n\n> 전기집진·세정집진 비교형 문제는 25점 배점이 잦다. \"정전기력 vs 액적포집\"이라는 원리 차이를 축으로 장단점을 대구조로 서술하는 연습이 필요하다.\n","side":[{"title":"답안 작성 요령 — 설계식 유도·비교형 문제","body":"### 문제 유형별 답안 구조\n1. \"설계식 유도+적용\" 형 → **Ⅰ개요-Ⅱ식유도(기호정의)-Ⅲ설계인자별 영향-Ⅳ적용상 문제점-Ⅴ결론**\n2. \"두 집진방식 비교\" 형(전기 vs 세정) → 비교표를 중앙 배치, 원리 차이(정전기력 vs 액적포집)를 먼저 서술 후 표로 정리\n\n### 표 활용 포인트\n- 전기집진 vs 세정집진 문제는 \"압력손실·효율·적용 배가스 특성\" 3열 비교표가 효과적\n- 후드 설계식 문제는 조건(X, A, V)을 먼저 정의한 뒤 무플랜지→플랜지→슬롯형 순으로 식을 전개\n\n### 흔한 감점 요인\n- Deutsch식에서 이동속도(we)를 상수처럼 취급하고 입경·전계강도 의존성을 언급하지 않음\n- 비저항 문제에서 \"높으면 나쁘다\"고만 쓰고 저비저항의 재비산 문제를 누락\n- 후드 설계식에서 X(오염원-후드 거리)의 정의를 생략\n\n### 시간배분 요령(25점 문항 기준)\n| 단계 | 시간 | 내용 |\n|---|---|---|\n| 개요 | 3분 | 정의+출제의도 |\n| 본론 구성 | 2분 | 식·표 배치 스케치 |\n| 본론 작성 | 30분 | 식 유도+비교표+적용사례 |\n| 결론 | 3분 | 요약+개선방향 |\n| 검토 | 2분 | 기호정의·법령명 확인 |\n\n### 표 작성 원칙\n1. 비교형은 반드시 좌우 대구조(A vs B)로 배치\n2. 설계식은 기호를 표 하단에 별도 정리\n3. 수치 범위는 근거(ACGIH, 실무 경험치 등) 병기"},{"title":"암기 카드 12선 — 전기집진·세정·후드·덕트","body":"| # | 카드 |\n|---|---|\n| 1 | 전기집진 4단계: 하전→이동→포집→탈진 |\n| 2 | Deutsch-Anderson: η=1-exp(-Awe/Q) |\n| 3 | 비저항 정상범위 10⁴~10¹¹Ω·cm |\n| 4 | 저비저항(<10⁴): 재비산 / 고비저항(>10¹¹): 역전리 |\n| 5 | 전기집진 압손 10~20mmH2O (매우 낮음) |\n| 6 | 벤투리 목부유속 60~120m/s |\n| 7 | Johnstone식: η=1-exp(-k(L/G)√ΔP) |\n| 8 | 액가스비(L/G)↑ → 효율↑, 폐수·압손↑ |\n| 9 | 후드 포착속도 ACGIH 0.25~10m/s |\n| 10 | 무플랜지 Q=V(10X²+A), 플랜지 Q=0.75V(10X²+A) |\n| 11 | 반송속도 흄 10~13, 무거운습분진 20~25 m/s |\n| 12 | 동수직경 Dh=4A/P |\n\n### 활용법\n카드 순서대로 5초 이내 답이 나오지 않으면 해당 Day를 재복습한다. 특히 4·10번(재비산/역전리, 후드 설계식)은 계산·서술 혼합형으로 출제되므로 반복 암기가 필요하다.\n\n### 추가 암기 카드(13~18)\n| # | 카드 |\n|---|---|\n| 13 | 코로나전극(방전극)은 (-)극성이 산업용 표준 |\n| 14 | 전기집진 유효단면적↑ → 처리풍속↓ → 효율↑ |\n| 15 | 세정집진 5대 포집기작: 관성충돌·차단·확산·응결·정전기 |\n| 16 | 살수탑은 저압손·저효율, 벤투리는 고압손·고효율 |\n| 17 | 포위식 후드는 오염원을 감싸 최고효율(외부식보다 유리) |\n| 18 | 덕트 정압균형: 댐퍼조정법 vs 유속조정법 |\n\n### 다음 구간 예고\nDay 49~51은 송풍기·국소배기 전체설계·미세먼지 최신기술로, 이번 구간의 후드·덕트 압력손실을 실제 송풍기 선정(정압·풍량)으로 연결한다. Day 52는 1단계(Day 1~51) 전체 종합정리이므로 이번 회독에서 약한 부분을 미리 표시해두면 좋다.\n\n### 이번 구간 자가진단표\n| Day | 주제 | 이해도(상/중/하) | 재복습 필요 |\n|---|---|---|---|\n| 41 | 전기집진장치 원리·Deutsch식 | | ☐ |\n| 42 | 전기집진 비저항과 조절대책 | | ☐ |\n| 43 | 전기집진 운전·유지관리 | | ☐ |\n| 44 | 세정집진장치 원리와 종류 | | ☐ |\n| 45 | 벤투리스크러버·살수탑 효율식 | | ☐ |\n| 46 | 후드의 유형과 포착속도 | | ☐ |\n| 47 | 덕트 설계와 반송속도·동수직경 | | ☐ |"}]},"49":{"day":49,"date":"2026-09-18","title":"송풍기 종류·선정인자·풍량조절","keywords":[{"k":"송풍기 종류","subs":["원심형: 다익형·터보형·평판형","축류형: 프로펠러형·튜브형","원심형 고압 vs 축류형 대풍량저압"]},{"k":"상사법칙(Fan Laws)","subs":["Q∝N (풍량-회전수 1승)","ΔP∝N² (정압-회전수 2승)","L∝N³ (동력-회전수 3승)"]},{"k":"운전점과 서징(Surging)","subs":["시스템저항곡선∩특성곡선=운전점","서징: 저풍량-고압 불안정 진동구간","방지: 최소풍량 확보·바이패스"]},{"k":"풍량조절 3방식","subs":["댐퍼제어(교축, 저효율)","흡입베인제어(중간효율)","회전수제어(인버터, 고효율)"]},{"k":"송풍기 선정절차","subs":["소요풍량+전압(정압+속도압) 산정","여유율 10~20% 반영","BEP(최고효율점) 부근 운전"]}],"answer":"# 송풍기 종류·선정인자·풍량조절\n\n## Ⅰ. 개요\n\n송풍기(Fan/Blower)는 후드-덕트-집진장치로 이어지는 방지시설 계통에서 발생하는 압력손실을 극복하고 필요풍량을 안정적으로 공급하는 동력원이다. 형식(원심형·축류형)에 따라 압력-풍량 특성곡선이 크게 다르므로, 시스템 저항곡선과의 교점에서 운전점을 정확히 선정하는 것이 설계의 핵심이다. 또한 회전수 변화에 따른 풍량·정압·동력의 관계는 상사법칙으로 예측되며, 이는 풍량조절 방식(특히 인버터 회전수제어)의 에너지 절감 효과를 정량적으로 설명하는 근거가 된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 송풍기의 종류와 특성\n\n### 1. 원심형 송풍기(Centrifugal Fan)\n- **다익형(시로코팬, Sirocco fan)**: 전곡형(forward-curved) 날개, 저속·저압·대풍량, 크기 작고 소음 큼, 효율 55~65%\n- **터보형(후곡형, Backward-curved)**: 고효율(75~85%), 고압 적용, 풍량 증가 시 동력이 완만히 증가하는 자기제한(self-limiting) 특성으로 과부하 방지에 유리\n- **평판형(방사형, Radial)**: 날개가 평판형으로 마모·부식성 분진 이송에 적합, 효율은 낮은 편(50~60%)\n\n### 2. 축류형 송풍기(Axial Fan)\n- **프로펠러형**: 저압·대풍량, 환기·냉각용\n- **튜브형(축류팬)**: 덕트 내 직결 설치, 중압 영역, 구조 간단\n\n### 3. 형식별 비교표\n\n| 구분 | 다익형 | 터보형 | 축류형 |\n|---|---|---|---|\n| 압력 범위 | 저압(~150mmH2O) | 고압(~1000mmH2O) | 저압(~100mmH2O) |\n| 풍량 특성 | 중간 | 소~중풍량 | 대풍량 |\n| 효율 | 55~65% | 75~85% | 60~75% |\n| 소음 | 큼 | 중간 | 큼(고속회전) |\n| 적용 | 일반환기·소용량 집진 | 고압손 방지시설(전기집진 등) | 대용량 저압 환기 |\n\n## Ⅲ. 상사법칙(Fan Laws)과 운전점\n\n### 1. 상사법칙\n동일 송풍기에서 회전수(N)가 변할 때:\n\n**Q2/Q1 = N2/N1** (풍량은 회전수에 비례)\n**ΔP2/ΔP1 = (N2/N1)²** (정압은 회전수 제곱에 비례)\n**L2/L1 = (N2/N1)³** (동력은 회전수 세제곱에 비례)\n\n| 기호 | 의미 |\n|---|---|\n| Q | 풍량(㎥/min) |\n| ΔP | 전압(정압+속도압, mmH2O) |\n| L | 축동력(kW) |\n| N | 회전수(rpm) |\n\n동력이 회전수의 3승에 비례한다는 점이 회전수제어(인버터)의 에너지 절감 근거가 된다(회전수 20% 저감 시 동력은 약 49% 절감).\n\n### 2. 운전점(Operating Point)\n송풍기의 풍량-정압 특성곡선과 덕트계통의 저항곡선(ΔP∝Q²)이 만나는 점이 실제 운전점이 된다. 설계풍량과 실제운전점이 어긋나면 과압손·과소풍량 등 문제가 발생하므로, 시운전 시 댐퍼 조정 등으로 설계점에 근접시킨다.\n\n### 3. 서징(Surging) 현상\n터보형·다익형 등 원심송풍기에서 풍량이 특정 값 이하로 낮아지면 특성곡선의 우향 하강 기울기가 (+)로 바뀌는 구간에 진입하여 풍량-압력이 주기적으로 급변하는 불안정 현상. 진동·소음·역류를 유발하며 심하면 설비 손상으로 이어진다. 방지대책으로는 최소풍량 확보(바이패스 배관), 가변익(가이드베인) 조정, 병렬 대수제어 등이 있다.\n\n## Ⅳ. 선정절차와 풍량조절 방식\n\n### 1. 선정절차\n1. 계통 전체의 소요풍량(Q) 산정(후드·덕트 설계값 합산)\n2. 계통 전압(ΔPt) = 정압손실(마찰+국부) + 속도압 산정\n3. 여유율 10~20% 반영(누설·설계오차 대비)\n4. 제조사 특성곡선에서 운전점이 최고효율점(BEP) 부근에 오도록 형식·크기 선정\n\n### 2. 풍량조절 3방식 비교\n\n| 방식 | 원리 | 효율 | 초기투자 | 비고 |\n|---|---|---|---|---|\n| 댐퍼제어 | 배출측 교축으로 저항 증가 | 낮음(교축손실) | 낮음 | 구조 간단, 에너지손실 큼 |\n| 흡입베인제어 | 흡입구 베인 각도 조절 | 중간 | 중간 | 댐퍼보다 효율적 |\n| 회전수제어(인버터) | 모터 회전수 자체를 가변 | 높음(동력∝N³) | 높음 | 최근 에너지절감 표준으로 확대 |\n\n### 3. 소음·진동 관리\n송풍기는 계통 내 대표적 소음원이므로 방음커버·소음기(silencer) 설치, 방진스프링·방진고무를 이용한 기초 진동절연이 함께 검토된다. 특히 다익형은 회전날개 통과주파수(BPF) 성분의 소음이 크므로 저소음 요구 시 터보형·축류형 채택이 유리하다.\n\n### 4. 재질·부식 대책\n부식성 가스(SOx, HCl 등)를 이송하는 경우 임펠러·케이싱을 내식재질(FRP, 스테인리스, 라이닝처리)로 선정하며, 마모성 분진의 경우 내마모 코팅 또는 교체가 용이한 라이닝 구조를 채택한다.\n\n## Ⅴ. 결론\n\n송풍기는 방지시설 이송계통의 심장부로, 형식별 압력-풍량 특성을 이해하고 상사법칙에 따라 운전점·동력을 정량적으로 예측하는 것이 설계의 기본이다. 서징 회피와 최고효율점 운전을 함께 고려해야 하며, 최근에는 「에너지이용 합리화법」에 따른 에너지효율 관리 강화로 인버터(VVVF) 기반 회전수제어 방식이 댐퍼제어를 대체하는 추세이다. 향후 설계에서는 초기투자비 대비 장기 운영비 절감, 소음·부식 등 유지관리 요소를 함께 고려한 방식 선정이 요구된다.\n","side":[{"title":"계산 예제 — 송풍기 축동력 산정","body":"### 축동력 계산식\n**L(kW) = Q(㎥/min) × ΔPt(mmH2O) / (6120 × η)**\n\n| 기호 | 의미 |\n|---|---|\n| Q | 풍량(㎥/min) |\n| ΔPt | 전압(mmH2O) |\n| η | 송풍기 효율(0~1) |\n| 6120 | 단위환산상수(102×60) |\n\n### 예제\nQ=600㎥/min, ΔPt=300mmH2O, η=0.6인 터보송풍기의 축동력은?\n\nL = 600×300/(6120×0.6) = 180,000/3,672 ≈ **49.0kW**\n\n### 상사법칙 적용 예제\n위 송풍기의 회전수를 10% 증속(N2=1.1N1)할 때:\n- 풍량: Q2=600×1.1=660㎥/min\n- 정압: ΔP2=300×1.1²=363mmH2O\n- 동력: L2=49.0×1.1³≈65.3kW (약 33% 증가)\n\n회전수를 소폭 올려도 동력은 3승 비례로 급증하므로, 여유율 과다 설계는 운영비 낭비로 직결된다는 점을 답안에 언급하면 좋다.\n\n### 실무 체크포인트\n- 계산 시 모터 여유율(통상 1.1~1.15배)을 축동력에 추가로 반영해 모터 정격을 선정\n- mmH2O 단위를 Pa로 환산할 경우 1mmH2O≈9.8Pa\n\n### 소요동력 산정 시 주의사항\n| 항목 | 반영 이유 |\n|---|---|\n| 송풍기 효율(η) | 형식별 상이(다익형 60%대, 터보형 80%대) |\n| 모터 여유율 | 기동전류·설계오차 대비 |\n| 전달효율(벨트 등) | 직결이 아닌 경우 추가 손실 반영 |\n| 표준상태 보정 | 온도·고도에 따른 공기밀도 보정 필요 |\n\n### 관련 기출 포인트\n동일 조건에서 송풍기 회전수를 변화시킬 때 풍량·정압·동력이 어떻게 변하는지 상사법칙을 이용해 설명하는 문제는 계산형으로 자주 출제된다. 답안에는 반드시 3개 비례식을 모두 제시하고, 동력이 3승 비례임을 근거로 회전수제어의 에너지절감 효과를 논리적으로 연결해야 한다."},{"title":"서징 방지대책과 병렬·직렬 운전","body":"### 서징(Surging) 방지대책\n1. 최소풍량 확보용 바이패스 배관 설치(과소풍량 운전 회피)\n2. 가변 가이드베인(IGV)으로 특성곡선 자체를 조정\n3. 병렬운전 대수제어(부하 감소 시 대수를 줄여 개별 송풍기 풍량 유지)\n4. 방출밸브를 이용한 순간적 풍량 우회\n\n### 병렬운전 vs 직렬운전\n\n| 구분 | 병렬운전 | 직렬운전 |\n|---|---|---|\n| 목적 | 풍량 증대 | 정압 증대 |\n| 특성곡선 합성 | 동일 압력에서 풍량 합산 | 동일 풍량에서 압력 합산 |\n| 적용 예 | 대용량 환기, 예비기 겸용 | 고저항 계통(장거리 덕트, 고성능 집진기) |\n| 주의사항 | 특성 다른 기종 병렬 시 역류 위험 | 전단 서징 발생 시 후단까지 영향 |\n\n### 실무 적용 시 유의사항\n- 병렬운전은 동일 기종·동일 특성곡선을 사용해야 풍량 배분이 균등해짐\n- 직렬운전은 전단 송풍기의 토출압이 후단 흡입측 조건에 영향을 주므로 배관 설계 시 열손실·누설 최소화 필요\n- 두 방식 모두 시스템 저항곡선이 설계와 달라지면 운전점이 이동하므로 준공 후 실측 검증이 필요\n\n### 기출 연계\n병렬·직렬운전에 따른 풍량-정압 특성곡선의 합성방법을 도시하고 설명하시오. *(다수 회차 10점)*\n\n### 서징 판별 실무 포인트\n- 운전 중 풍량계·압력계 지침이 주기적으로 진동하면 서징을 의심\n- 서징 발생영역은 제조사 특성곡선에 표시되어 있으므로 선정 단계에서 운전점이 해당 영역을 벗어나는지 반드시 확인\n- 부하변동이 큰 공정(간헐가동 등)은 서징 여유폭을 크게 두고 설계\n\n### 유지관리 관점 비교표\n| 항목 | 병렬운전 | 직렬운전 |\n|---|---|---|\n| 1대 고장 시 영향 | 전체 풍량의 일부만 감소 | 전체 정압이 크게 감소 |\n| 예비율 확보 | 상대적으로 용이 | 상대적으로 어려움 |\n| 배관 구조 | 병렬 분기 배관 필요 | 직렬 연결 배관, 구조 단순 |"}]},"50":{"day":50,"date":"2026-09-19","title":"국소배기장치 설계절차와 압력손실","keywords":[{"k":"국소배기장치 구성","subs":["후드-덕트-공기정화장치-송풍기-배출구","각 구성요소 역할 분담","「산업안전보건법」적용대상"]},{"k":"설계절차(7단계)","subs":["오염물질 특성·발생량 파악→후드→덕트→압손→송풍기","반송속도·단면적 결정","최대저항경로(index run) 선정"]},{"k":"압력손실 계산법","subs":["등가길이법: ΔP=f(L+Le)/D×VP","속도압법: ΔP=ζ×VP","전압TP=정압SP+동압VP"]},{"k":"정압균형(Balance)","subs":["댐퍼조정법: 저항작은분지에댐퍼추가","유속조정법: 분지단면적 재설계","분지별 저항 불균형시 풍량편차"]},{"k":"설계 시 고려사항","subs":["최대저항경로 기준 송풍기 선정","여유율 반영(10~20%)","유지관리성·점검구 확보"]}],"answer":"# 국소배기장치 설계절차와 압력손실\n\n## Ⅰ. 개요\n\n국소배기장치(Local Exhaust Ventilation, LEV)는 작업공정에서 발생하는 오염물질을 발생원 부근(후드)에서 포집하여 덕트로 이송하고, 공기정화장치에서 처리한 후 송풍기의 동력으로 배출구까지 배출하는 통합 계통이다. 「산업안전보건법」및 관련 고시(국소배기장치 성능검사 기준 등)와 「대기환경보전법」상 배출허용기준을 동시에 만족해야 하며, 설계의 핵심은 정압(SP)·동압(VP)·전압(TP) 개념에 기반해 계통 전체의 압력손실을 정확히 산정하고 이를 근거로 송풍기를 선정하는 데 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 구성요소와 설계절차\n\n### 1. 구성요소별 역할\n\n| 구성요소 | 역할 |\n|---|---|\n| 후드 | 발생원 오염물질 포집(포착속도 확보) |\n| 덕트 | 포집된 오염물질을 이송(반송속도 유지) |\n| 공기정화장치 | 오염물질 제거(집진·흡수·흡착 등) |\n| 송풍기 | 계통 전체 압력손실 극복, 유동 동력원 |\n| 배출구 | 정화된 배출가스를 대기로 최종 방출 |\n\n### 2. 설계절차(7단계)\n1. 오염물질의 종류·발생량·물리화학적 특성 파악\n2. 후드 형식 선정 및 포착속도 기반 필요풍량(Q) 산정\n3. 물질별 반송속도 결정 및 덕트 경로·단면적 산정\n4. 각 구간(직관·부속류)의 압력손실 계산(마찰손실+국부손실)\n5. 여러 분지가 있는 경우 최대저항경로(index run) 선정\n6. 분지 간 정압균형 확인, 불균형 시 댐퍼 또는 단면적 조정\n7. 계통 총압력손실을 기준으로 송풍기 형식·용량 선정\n\n## Ⅲ. 압력손실 계산 방법\n\n### 1. 정압·동압·전압의 관계\n**전압(TP) = 정압(SP) + 동압(VP)**\n\n| 구분 | 의미 |\n|---|---|\n| 정압(SP) | 계통 저항을 극복하는 데 소모되는 압력, 유동방향과 무관 |\n| 동압(VP) | 공기가 흐르는 운동에너지에 해당하는 압력, 유속의 함수 |\n| 전압(TP) | 정압+동압, 실제 송풍기가 부담하는 전체 에너지 |\n\n동압은 **VP(mmH2O) = (V/4.04)²** (V: 유속 m/s, 표준공기밀도 1.2kg/㎥ 기준)로 산정한다.\n\n### 2. 등가길이법(Equivalent Length Method)\n부속류(엘보·확대관 등)의 손실을 동일 압력손실을 일으키는 직관 길이(등가길이 Le)로 환산하여 계산.\n\n**ΔP = f·(L+Le)/D × VP**\n\n| 기호 | 의미 |\n|---|---|\n| f | 관마찰계수 |\n| L | 실제 직관길이 |\n| Le | 부속류 등가길이 |\n| D | 덕트 직경(동수직경) |\n\n### 3. 속도압법(국부손실계수법)\n부속류별 손실계수(ζ)를 동압에 곱해 국부손실을 직접 산정.\n\n**ΔP = ζ × VP**\n\n| 방법 | 장점 | 단점 |\n|---|---|---|\n| 등가길이법 | 직관·부속류를 하나의 계산식으로 통합 | 등가길이표 필요, 관경별 상이 |\n| 속도압법 | 부속류별 손실계수가 명확, 계산 직관적 | 부속류가 많을수록 항목 증가 |\n\n## Ⅳ. 최대저항경로(Index Run)와 정압균형\n\n### 1. 최대저항경로 선정\n여러 후드·분지가 하나의 송풍기에 연결된 계통에서는, 압력손실이 가장 큰 경로(index run)를 기준으로 송풍기의 소요정압을 결정해야 다른 분지에서도 충분한 흡인력이 확보된다.\n\n### 2. 정압균형 방법 비교\n\n| 방법 | 원리 | 장점 | 단점 |\n|---|---|---|---|\n| 댐퍼조정법 | 저항이 작은 분지에 댐퍼를 추가해 인위적으로 저항 증가 | 시공 후 미세조정 용이 | 교축손실로 에너지 낭비, 댐퍼 폐쇄 오조작 위험 |\n| 유속조정법(정압균형법) | 설계 단계에서 분지별 단면적을 재계산해 저항을 균형 | 에너지손실 없음, 근본적 해결 | 설계 변경 시 재계산 필요, 시공 유연성 낮음 |\n\n분지 간 정압이 불균형하면 저항이 작은 분지로 과다풍량이 흘러 다른 후드의 포착속도가 부족해지는 문제(under-exhaust)가 발생한다.\n\n### 3. 다분지 계통 설계 시 실무 포인트\n\n여러 후드가 하나의 주덕트로 합류하는 경우, 각 분지의 압력손실이 서로 다르면 저항이 작은 분지로 과다풍량이 몰리는 현상이 발생한다. 이를 방지하기 위해 설계 단계에서 분지별 소요풍량 대비 필요 정압을 표로 정리하고, 최대저항경로를 기준으로 나머지 분지의 여유 정압을 댐퍼로 흡수하거나 애초에 단면적을 좁게 설계하는 방식을 택한다.\n\n| 분지 | 소요풍량(㎥/min) | 정압손실(mmH2O) | 조정방식 |\n|---|---|---|---|\n| A(최대저항경로) | 200 | 55 | 기준(조정없음) |\n| B | 180 | 40 | 댐퍼로 15mmH2O 추가 |\n| C | 150 | 35 | 댐퍼로 20mmH2O 추가 |\n\n### 4. 유지관리 설계 고려사항\n설계 단계에서부터 점검구·청소구를 덕트 주요 분기점과 압력손실이 큰 구간(엘보, 집진장치 전후)에 배치하여 분진 퇴적·폐색을 조기에 발견할 수 있도록 한다. 또한 정기적인 정압 측정지점(피토관 삽입구)을 미리 설치하면 운전 중 계통 이상을 신속히 진단할 수 있다.\n\n## Ⅴ. 결론\n\n국소배기장치 설계는 후드의 포착속도, 덕트의 반송속도, 압력손실 계산, 최대저항경로 기준 송풍기 선정이라는 일련의 절차를 정확히 따라야 하며, 이를 벗어나면 설계풍량 미달·에너지 낭비·작업환경 기준 초과로 이어진다. 최근에는 전산유체역학(CFD)을 활용한 후드 포착효율 사전 검증과, 다분지 계통의 정압균형 자동설계 도구 활용이 확대되는 추세로, 설계 초기 단계부터 유지관리성(점검구·청소구 확보)과 측정지점 확보를 함께 고려하는 것이 바람직하다.\n","side":[{"title":"압력손실 계산 예제 — 단일 덕트 계통","body":"### 조건\n- 반송속도 V=18m/s, 덕트직경 D=300mm(0.3m)\n- 직관길이 L=20m, 엘보(90°) 2개(등가길이 각 5m)\n- 관마찰계수 f=0.02\n\n### 1. 동압 계산\nVP = (V/4.04)² = (18/4.04)² ≈ **19.8mmH2O**\n\n### 2. 등가길이법 적용\n전체 등가길이 = L + Le(엘보2개) = 20 + (5×2) = 30m\n\nΔP = f×(L+Le)/D × VP = 0.02×(30/0.3)×19.8 = 0.02×100×19.8 = **39.6mmH2O**\n\n### 3. 후드 진입손실 포함 시\n후드 진입손실계수 ζ=0.5 가정 시: ΔP후드 = 0.5×19.8 = 9.9mmH2O\n\n**계통 총정압손실 ≈ 39.6 + 9.9 = 49.5mmH2O**\n\n### 검산 체크포인트\n- 반송속도가 물질별 권장범위(예: 일반분진 18~20m/s) 내에 있는지 확인\n- 산출된 압력손실이 송풍기 특성곡선상 도달 가능한 범위인지 확인\n- 단위(mmH2O) 통일 여부 재확인 후 최종 답에 명시\n\n### 속도압법으로 재계산(검증)\n동일 계통을 국부손실계수법으로 검산하면:\n- 엘보(90°) 손실계수 ζ=0.3 가정 시, 개당 손실 = 0.3×19.8 ≈ 5.9mmH2O, 2개 = 11.9mmH2O\n- 직관 마찰손실 = f×L/D×VP = 0.02×(20/0.3)×19.8 ≈ 26.4mmH2O\n- 합계 ≈ 26.4+11.9 = 38.3mmH2O (등가길이법 결과 39.6mmH2O와 유사한 오더로 검증됨)\n\n두 방법의 결과가 유사한 오더로 나오는지 비교하면 계산 오류를 조기에 발견할 수 있어 답안 신뢰도를 높이는 방법으로 활용 가능하다."},{"title":"정압·동압 측정과 계통 진단","body":"### 피토관을 이용한 현장측정\n피토관(Pitot tube)으로 덕트 내 정압·동압을 직접 측정해 설계값과 실측값을 비교한다.\n\n| 측정항목 | 측정방법 | 활용 |\n|---|---|---|\n| 정압(SP) | 피토관 정압공에서 측정 | 계통 저항 확인 |\n| 동압(VP) | 전압-정압으로 산출 또는 직접측정 | 실제 유속 역산(V=4.04√VP) |\n| 전압(TP) | 피토관 전압공에서 측정 | 송풍기 성능 확인 |\n\n### 계통 이상 진단 체크리스트\n1. 실측 정압이 설계값보다 크게 낮음 → 덕트 누설, 후드 개구부 과다 개방 의심\n2. 실측 정압이 설계값보다 크게 높음 → 집진장치 폐색, 덕트 내 분진 퇴적 의심\n3. 특정 분지만 풍량 부족 → 정압균형 미흡, 댐퍼 오조작 확인\n4. 전 계통 풍량 저하 → 송풍기 벨트 슬립, 임펠러 마모·부착물 확인\n\n### 성능검사 관련 근거\n「산업안전보건법」에 따른 국소배기장치 자율/정기 성능검사 시 제어풍속(포착속도) 및 덕트 내 반송속도를 측정하여 설계기준 충족 여부를 확인한다. 측정 결과 미달 시 송풍기 증속, 덕트 개조, 후드 위치 조정 등의 개선조치가 요구된다.\n\n### 기출 연계\n피토관을 이용한 덕트 내 유속 측정원리와 정압·동압·전압의 관계를 설명하시오. *(다수 회차 10점)*\n\n### 측정 실무 절차\n1. 피토관을 덕트 중심축에 유동방향과 평행하게 삽입\n2. 원형덕트는 직경을 등면적으로 분할한 다수 지점에서 측정(트래버스법)하여 평균유속 산정\n3. 사각덕트는 단면을 격자형으로 분할해 각 격자 중심에서 측정\n4. 측정 위치는 엘보·확대축소부 등 난류 발생지점에서 충분히 이격(직경의 7.5배 이상 권장)\n\n### 정압균형 판정 기준\n설계 정압 대비 실측 정압의 편차가 ±10% 이내이면 정상, 이를 초과하면 원인(누설·퇴적·오조작) 조사 후 개선조치를 시행하는 것이 일반적 실무 기준이다."}]},"51":{"day":51,"date":"2026-09-20","title":"미세먼지(PM) 처리 최신기술 동향","keywords":[{"k":"하이브리드 집진기술","subs":["ESP+백필터 결합(EBS/COHPAC)","전처리 하전 후 여과, 압손·효율 개선","기존 ESP 개조(retrofit) 수요 증가"]},{"k":"습식전기집진장치(WESP)","subs":["PM2.5·황산미스트·중금속 동시제거","건식ESP 후단 최종처리에 적용","점착성·고비저항 분진에 유리"]},{"k":"응축성미세먼지(CPM)","subs":["굴뚝 배출 직후 응축·응집되는 성분","기존 여과성먼지(FPM)와 별도 관리","국내 측정방법·배출계수 정비 중"]},{"k":"촉매 결합 여과기술","subs":["촉매여과포(Catalytic Filter Bag)","PM+NOx(SCR) 동시저감","설치면적·초기비용 절감 효과"]},{"k":"백연저감 및 배출관리 고도화","subs":["재열·응축수분리 백연저감시설","굴뚝TMS 고도화·실시간 공개","환경신기술인증·BAT 적용 확대"]}],"answer":"# 미세먼지(PM) 처리 최신기술 동향\n\n## Ⅰ. 개요\n\n미세먼지(PM10, PM2.5)에 대한 국민적 관심과 「대기환경보전법」상 배출허용기준 강화로, 사업장 방지시설은 기존 단일 집진방식의 한계를 넘어서는 융합·고도화 기술 도입이 확대되고 있다. 최근 기술 동향은 크게 (1) 기존 집진장치의 하이브리드화, (2) 미세·초미세 입자 및 응축성물질까지 포괄하는 처리기술, (3) 다오염물질 동시저감 기술, (4) 배출관리 고도화(TMS·백연저감)의 네 방향으로 요약된다. 출제 시에는 최신기술 명칭을 나열하기보다 각 기술이 \"기존 방식의 어떤 한계를 보완하는가\"를 원리와 함께 서술하는 것이 핵심이다. *(최근 회차 10~15점 기출 증가 추세)*\n\n## Ⅱ. 하이브리드 집진기술\n\n### 1. 전기집진+여과집진 결합(EBS/COHPAC 방식)\n기존 전기집진장치(ESP) 후단 또는 전단에 여과집진(백필터)을 결합한 방식. ESP에서 조대입자·대부분의 분진을 1차 하전·포집한 뒤, 여과집진에서 미세입자를 최종 포집하여 개별 장치보다 낮은 압력손실로 높은 총괄효율을 달성한다.\n\n| 구분 | 단독 ESP | 단독 백필터 | 하이브리드(ESP+BF) |\n|---|---|---|---|\n| PM2.5 제어 | 비저항 민감, 제한적 | 우수 | 우수(상호보완) |\n| 압력손실 | 낮음 | 중~높음 | 중간(부하분담) |\n| 기존설비 활용 | - | - | 기존 ESP 개조(retrofit) 가능 |\n\n### 2. 습식전기집진장치(Wet ESP, WESP)\n집진극 표면에 세정수를 순환시켜 탈진하는 방식으로, 점착성·고비저항 분진이나 황산미스트, 중금속, PM2.5를 동시에 제거하는 데 효과적이다. 주로 건식 ESP 또는 탈황설비 후단의 최종 정제 단계에 적용되어 미세먼지·미스트 동시 저감에 활용된다.\n\n## Ⅲ. 응축성미세먼지(Condensable PM, CPM) 관리\n\n### 1. 개념\n굴뚝에서 측정되는 여과성먼지(Filterable PM, FPM)와 달리, 배출 시점에는 가스상이었다가 대기 중 냉각·희석 과정에서 응축·응집되어 입자화되는 성분을 응축성미세먼지(CPM)라 한다. 기존 굴뚝 배출허용기준은 FPM 중심이어서 CPM은 상대적으로 관리 사각지대에 있었다.\n\n### 2. 관리 동향\n국내에서는 CPM 측정방법 및 배출계수 정비가 진행 중이며, 사업장 총 PM 배출량 산정 시 FPM+CPM을 함께 고려하는 방향으로 정책이 전환되고 있다. 방지시설 측면에서는 저온 응축·세정 단계를 추가하거나 WESP를 통해 CPM 성분(황산미스트 등)을 함께 저감하는 접근이 활용된다.\n\n## Ⅳ. 다오염물질 동시저감 및 배출관리 고도화\n\n### 1. 촉매 결합 여과기술(Catalytic Filter Bag)\n여과포 표면 또는 내부에 SCR 촉매를 담지하여, 분진 여과와 NOx 선택적 촉매환원을 하나의 장치에서 동시에 수행하는 기술이다. 별도의 SCR 반응기 설치면적과 초기 투자비를 줄일 수 있어 중소규모 사업장에 적합한 대안으로 검토되고 있다.\n\n### 2. 백연저감시설 고도화\n습식탈황(FGD) 후단에서 발생하는 백연(플룸)을 저감하기 위해 재열(reheating) 또는 응축수 분리 방식이 적용되며, 최근에는 에너지 회수형(열교환 기반) 백연저감시설이 함께 검토된다.\n\n### 3. 배출관리 디지털화\n굴뚝원격감시체계(TMS) 확대·고도화와 실시간 배출정보 공개, IoT 기반 저비용 센서를 활용한 사업장 자가진단 확대 등 관리 측면의 고도화도 함께 진행되고 있다. 특히 TMS 측정자료의 실시간 공개는 사업장의 자발적 저감 유인을 높이는 효과가 있으며, 인공지능 기반 이상치 탐지를 결합해 방지시설 고장을 조기에 감지하는 스마트관제 사례도 확대되고 있다.\n\n### 4. 배출시설 통합관리(사업장 단위 최적화)\n개별 배출구별 방지시설 최적화에서 나아가, 사업장 전체의 오염물질 배출 경로를 통합적으로 분석해 방지시설 투자우선순위를 정하는 접근도 확산되고 있다. 이는 「환경오염시설의 통합관리에 관한 법률」(통합환경관리제도)의 최적가용기법(BAT) 적용과 연계되며, 배출시설별 개별 기준 대신 사업장 전체의 배출 성능을 종합 평가하는 방향으로 정책이 전환되고 있다.\n\n| 기술 축 | 핵심 내용 |\n|---|---|\n| 집진 하이브리드화 | ESP+백필터, WESP |\n| 미세성분 관리 | CPM 측정·저감 |\n| 다오염물질 동시저감 | 촉매여과포(PM+NOx) |\n| 배출관리 고도화 | TMS 고도화, 백연저감 |\n\n### 4. 사업장 총량관리·배출권거래제 연계\n「대기환경규제지역」및 특별대책지역 사업장을 중심으로 대기오염물질 총량관리제가 확대되고 있으며, 온실가스·대기오염물질 통합관리 관점에서 방지시설 고도화 투자와 배출권거래제(ETS)를 연계해 검토하는 사례가 늘고 있다. 이는 단순 배출허용기준 준수를 넘어, 총량 저감 실적을 확보하는 방향으로 방지시설 투자 의사결정이 이동하고 있음을 의미한다.\n\n## Ⅴ. 결론\n\n미세먼지 처리 최신기술은 단일 원리에 의존하던 기존 집진방식을 넘어, 여러 원리를 결합하거나(하이브리드 집진), 관리 범위를 확장하고(CPM), 다오염물질을 동시에 처리하는(촉매여과포) 방향으로 발전하고 있다. 이는 60점 목표 수준에서는 각 기술의 원리와 기존 기술 대비 개선점을 명확히 서술하는 것으로 충분하며, 향후 「대기환경보전법」상 CPM 관리기준 법제화와 노후 방지시설의 하이브리드 개조(retrofit) 지원정책, 총량관리·배출권거래제 연계 확대가 예상되는 분야이다.\n\n| 구분 | 기존 방식 | 최신 동향 |\n|---|---|---|\n| 집진 원리 | 단일 원리(전기 또는 여과) | 하이브리드 결합(ESP+BF, WESP) |\n| 관리 대상 | 여과성먼지(FPM) 중심 | FPM+CPM 통합 관리 |\n| 저감 대상 | 단일 오염물질(PM) | 다오염물질 동시저감(PM+NOx) |\n| 관리 체계 | 굴뚝 배출허용기준 준수 | TMS 고도화+총량관리 연계 |\n","side":[{"title":"응축성미세먼지(CPM) 심화","body":"### FPM과 CPM 비교\n\n| 구분 | 여과성먼지(FPM) | 응축성미세먼지(CPM) |\n|---|---|---|\n| 존재상태(굴뚝 내) | 고체·액체 입자 | 가스상(응축 전) |\n| 측정방법 | 굴뚝 내 여과지 포집 | 냉각·응축 후 별도 포집 필요 |\n| 기존 배출기준 | 포함(먼지 배출허용기준) | 별도 관리기준 정비 중 |\n| 주요 성분 | 회분·미연분 등 고형분 | 황산미스트, 유기물, 암모늄염 등 |\n\n### 측정상 어려움\nCPM은 굴뚝 내부(고온)에서는 가스 상태이므로 일반 먼지 측정법(등속흡인)으로 포집되지 않는다. 이에 따라 별도의 냉각·응축 과정을 거친 시료채취 방법(예: 희석채취법, 응축장치 병용법)이 요구되며, 국내외적으로 측정방법 표준화가 진행 중인 분야이다.\n\n### 정책적 시사점\nCPM이 총 PM 배출량 산정에 포함될 경우, 기존에는 기준 이내였던 사업장도 CPM을 합산하면 배출부하가 증가할 수 있어 방지시설 보완(습식 후처리, 저온응축 단계 추가) 수요가 커질 것으로 전망된다.\n\n### CPM 저감을 위한 방지시설 대응방향\n| 대응 방안 | 원리 |\n|---|---|\n| 저온 응축단계 추가 | 배출가스 냉각으로 응축성 성분을 사전 응축·포집 |\n| WESP 적용 | 응축된 미세액적·미스트를 습식으로 포집 |\n| 세정 강화(L/G 상향) | 수용성 CPM 전구물질(황산 등) 흡수 강화 |\n\n### 해외 동향 참고\n미국 EPA 등 해외에서는 CPM을 배출허용기준에 포함하는 측정방법(Method 202 등)이 오래전부터 운영되고 있으며, 국내도 이를 참고해 측정방법·배출계수를 정비하는 단계에 있다. 답안에서는 구체적 수치를 단정하기보다 \"국내외 CPM 관리기준 정비가 진행 중\"이라는 방향성 위주로 서술하는 것이 안전하다."},{"title":"하이브리드 집진 적용사례형 답안 포인트","body":"### 답안 작성 시 강조할 논리\n1. 왜 하이브리드가 필요한가: 단독 ESP는 고비저항 분진에서 효율 저하, 단독 백필터는 압력손실·여과포 수명 부담 → 두 방식의 약점을 상호 보완\n2. 어떻게 결합하는가: 배치 순서(ESP 선처리 후 백필터) 및 각 단계의 역할 분담(조대입자 vs 미세입자)\n3. 기대효과: 총괄효율 향상, 개별 장치 대비 압력손실 절감, 기존 ESP 설비 활용(개조비용 절감)\n\n### 관련 기출 확장 포인트\n- 기존 방지시설의 성능 개선(retrofit) 방안을 묻는 문제에 하이브리드 집진기술을 답안 요소로 활용 가능\n- PM2.5 저감대책을 묻는 문제에서 WESP·CPM 관리를 정책적 대응방안으로 함께 서술\n\n### 최근 정책 연계\n「대기환경보전법 시행규칙」상 배출허용기준은 지속적으로 강화되는 추세이며, 최적방지시설(BAT: Best Available Technology) 개념이 인허가 협의 과정에서 점차 강조되고 있다. 답안 결론부에 \"기존 시설 대비 하이브리드/고도화 기술 적용을 통한 기준 대응\"을 개선방향으로 제시하면 좋은 인상을 줄 수 있다.\n\n### 환경신기술 인증제도 연계\n「환경기술 및 환경산업 지원법」에 따른 환경신기술 인증제도는 새로운 방지기술의 현장 적용 실적·성능을 공인하는 제도로, 하이브리드 집진·촉매여과포 등 신기술이 사업장에 도입될 때 인허가 협의 과정에서 신뢰성 근거로 활용된다. 답안에서 최신기술을 언급할 때 이러한 제도적 뒷받침을 함께 서술하면 완성도가 높아진다.\n\n### 답안 마무리 문장 예시\n\"기존 단일 원리 방지시설의 한계를 하이브리드화·다오염물질 동시저감 기술로 보완하는 것이 최근 추세이며, 이는 「대기환경보전법」상 강화되는 배출허용기준 및 총량관리 체계에 대응하기 위한 필수적 방향이다.\"라는 문장을 결론부에 활용할 수 있다."}]},"52":{"day":52,"date":"2026-09-21","title":"1단계 이론·확산·집진 종합정리","keywords":[{"k":"대기안정도·확산이론","subs":["환경감률vs단열감률, 안정도 판정","Pasquill-Gifford 등급 A~F","가우시안 플룸식 σy·σz"]},{"k":"굴뚝설계·확산모델","subs":["유효굴뚝높이He=H+ΔH","오일러리안(격자) vs 라그랑지안(입자추적)","수용모델 CMB·PMF"]},{"k":"환경영향평가·2차오염","subs":["대기질예측-저감방안 협의체계","오존 VOC/NOx 농도비 지배","시정장애 소멸계수·산성비 pH5.6"]},{"k":"집진이론(물리~여과)","subs":["η=1-Pt, 절단입경d50 개념","사이클론 Lapple식, 여과 5대기작","MPPS 0.1~1㎛"]},{"k":"전기집진·세정·이송계통","subs":["Deutsch식, 비저항 10⁴~10¹¹Ω·cm","Johnstone식, 후드·덕트·송풍기 설계","상사법칙 Q∝N,ΔP∝N²,L∝N³"]}],"answer":"# 1단계 종합정리 — Day 1~51 전체 요약·자가점검\n\n## Ⅰ. 종합정리 목적 + 전체 논리 흐름도\n\n1단계(Day 1~51)는 필기시험 1교시~4교시 전반에 걸쳐 출제되는 \"대기오염 확산이론\"과 \"방지시설(집진) 이론\"의 기초를 완성하는 구간이다. 크게 여섯 개의 축 — ①대기안정도·확산 기초이론, ②굴뚝설계·확산모델, ③대기환경영향평가, ④2차오염물질·입자물리, ⑤집진이론(중력~여과), ⑥전기집진·세정·이송계통 — 으로 구성되며, 앞의 이론(대기가 오염물질을 어떻게 확산·희석시키는가)이 뒤의 방지시설 설계(오염물질을 어떻게 포집·제거하는가)와 논리적으로 연결된다는 점이 이 단계 전체를 관통하는 핵심이다.\n\n```\n[①대기안정도·확산기초] Day1~7\n연직구조·감률·안정도(정적/동적) → Pasquill등급 → 혼합고·바람\n        ↓\n[②국지순환·굴뚝설계·확산모델] Day9~19\n해륙풍·열섬 → 연기유동6형태 → 유효굴뚝고·통풍력 → 가우시안식 → 오일러/라그랑지·수용모델\n        ↓\n[③대기환경영향평가] Day20~23\n평가항목·현황조사 → 예측·저감방안 → 건강영향평가 → 자연적 제거기작\n        ↓\n[④2차오염·입자물리] Day25~31\n시정장애·산성비 → 광화학반응·오존 → 입자물리(Stokes·Cunningham)\n        ↓\n[⑤집진이론 - 물리력 기반] Day33~39\n집진효율 공통언어(η,d50) → 중력·관성력 → 원심력(사이클론) → 여과(백필터)\n        ↓\n[⑥고효율집진·이송계통] Day41~51\n전기집진(Deutsch) → 세정(Johnstone) → 후드·덕트 → 송풍기 → PM 최신기술\n```\n\n이론(①~④)에서 배운 \"오염물질이 대기 중에서 어떻게 거동하는가\"는 대기환경영향평가(③)의 예측모델 근거가 되고, 방지시설(⑤~⑥)에서 배운 \"발생원에서 오염물질을 얼마나 제거할 수 있는가\"는 배출원 강도(소스텀) 저감을 통해 다시 확산모델의 입력값을 낮추는 역할을 한다는 점을 답안에서 연결지어 서술하면 고득점에 유리하다.\n\n## Ⅱ. 핵심 수치 암기 체크리스트(구간별 압축)\n\n| 구간 | 항목 | 값 | 확인 |\n|---|---|---|---|\n| ① | 건조단열감률 | **약 0.98~1℃/100m** | ☐ |\n| ① | 안정도 판정(감률차) | 환경감률<단열감률 → **안정** | ☐ |\n| ① | Pasquill 등급 | **A(매우불안정)~F(매우안정)** | ☐ |\n| ② | 유효굴뚝높이 | **He = H + ΔH** | ☐ |\n| ② | 가우시안 최대착지농도 위치 | σz = **He/√2** 지점 | ☐ |\n| ③ | 대기환경영향평가 대상사업 | 「환경영향평가법」 별표 근거 | ☐ |\n| ④ | 산성비 기준 pH | **5.6 미만** | ☐ |\n| ④ | 오존생성 지배인자 | **NOx/VOC 농도비** | ☐ |\n| ④ | Stokes 종말속도 | Vt=**d²(ρp-ρ)g/18μ** | ☐ |\n| ⑤ | 총괄집진효율 | η=**1-Pt** | ☐ |\n| ⑤ | 사이클론 Lapple 절단입경 | dpc=√(9μW/**2πNeVi**(ρp-ρ)) | ☐ |\n| ⑤ | 여과 MPPS | **0.1~1㎛** | ☐ |\n| ⑥ | Deutsch-Anderson | η=**1-exp(-Awe/Q)** | ☐ |\n| ⑥ | 비저항 정상범위 | **10⁴~10¹¹Ω·cm** | ☐ |\n| ⑥ | 후드 포착속도(ACGIH) | **0.25~10m/s** | ☐ |\n| ⑥ | 송풍기 상사법칙 | Q∝N, ΔP∝**N²**, L∝**N³** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 핵심식 15선\n\n1. **정적안정도 판정**: 환경감률(Γ) vs 건조단열감률(Γd=0.98℃/100m) 비교\n2. **리차드슨수**: Ri = (g/T)(ΔΘ/Δz)/(Δu/Δz)²\n3. **유효굴뚝높이**: He = H + ΔH\n4. **가우시안 플룸 지상축상농도**: C(x,0,0,H) = Q/(πσyσzu)·exp[-He²/2σz²]\n5. **총괄집진효율**: η = 1-Pt = (Cin-Cout)/Cin\n6. **직렬 총괄효율**: ηtotal = 1-Π(1-ηi)\n7. **Stokes 종말속도**: Vt = d²(ρp-ρ)g/18μ\n8. **Cunningham 보정계수 적용**: Vt' = Cc·Vt\n9. **사이클론 분리계수**: S = v²/(r·g)\n10. **Lapple 절단입경**: dpc = √[9μW/(2πNeVi(ρp-ρ))]\n11. **여과 압력손실**: ΔP = K1V+K2WV²\n12. **Deutsch-Anderson**: η = 1-exp(-A·we/Q)\n13. **Johnstone식(벤투리)**: η = 1-exp[-k(L/G)√ΔP]\n14. **외부식 후드(무플랜지)**: Q = V(10X²+A)\n15. **송풍기 축동력**: L(kW) = Q·ΔPt/(6120·η)\n\n## Ⅳ. 자주 혼동하는 개념(구간 통합)\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 정적안정도 vs 동적안정도 | 온도 연직분포(부력) | 풍속전단(기계적 난류) | 지배 힘의 종류 |\n| 오일러리안 vs 라그랑지안 | 고정격자에서 농도 계산 | 오염원 입자를 추적 | 좌표계 기준 |\n| 확산모델 vs 수용모델 | 배출원→농도(forward) | 농도→배출원 기여도(backward) | 추정 방향 |\n| 1차오염물질 vs 2차오염물질 | 배출원에서 직접배출 | 대기 중 반응으로 생성(오존등) | 생성 경로 |\n| 총괄효율 vs 부분집진율 | 장치 전체 성능 | 입경별 성능(곡선) | 대표성 vs 상세성 |\n| 전기집진 vs 세정집진 | 정전기력 포집 | 액적 관성충돌 포집 | 포집력의 종류 |\n| 포착속도 vs 반송속도 | 후드 앞 흡인유속 | 덕트 내 이송유속 | 적용 위치 |\n\n## Ⅴ. 기출 연계 자가점검(구간별 대표문항)\n\n1. 대기안정도의 판정방법(정적·동적)과 Pasquill-Gifford 등급 분류기준을 설명하시오. *(다수 회차 25점)*\n2. 유효굴뚝높이 산정식과 굴뚝설계 시 고려사항을 설명하시오. *(114~138회 25점)*\n3. 가우시안 확산모델의 기본가정과 한계를 설명하시오. *(다수 회차 10~25점)*\n4. 대기환경영향평가의 절차와 예측·저감방안 수립 시 고려사항을 설명하시오. *(최근 25점)*\n5. 오존 생성기작에서 NOx/VOC 농도비의 역할을 설명하시오. *(120회 전후 25점)*\n6. 집진장치의 총괄효율과 부분집진율(분급효율)의 관계를 설명하시오. *(다수 회차 10점)*\n7. 원심력집진장치의 절단입경 결정인자와 압력손실을 설명하시오. *(126회 전후 25점)*\n8. 전기집진장치의 Deutsch식과 비저항에 따른 문제점·대책을 설명하시오. *(114~138회 25점)*\n9. 세정집진장치의 포집기작과 벤투리스크러버 설계인자를 설명하시오. *(최근 25점)*\n10. 국소배기장치 설계절차와 압력손실 계산방법을 설명하시오. *(다수 회차 25점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **전체 흐름도 재구성(40분)**: Ⅰ의 6단계 흐름도를 백지에 다시 그리며, 이론→평가→방지시설로 이어지는 논리를 스스로 설명해본다.\n2. **식 15선 전체 작성(50분)**: Ⅲ의 15개 식을 기호 정의까지 포함해 백지에 쓰고, 막히는 식은 해당 Day로 즉시 돌아가 재확인.\n3. **수치 체크리스트 전수 점검(30분)**: Ⅱ의 16개 항목, 3개 이상 틀리면 해당 구간 전체 재독 권장.\n4. **기출 10문항 구술(40분)**: Ⅴ의 문항을 실전처럼 시간 재며 답해본다(25점 문항은 30분 목표).\n5. **약점 구간 표시**: 6개 구간 중 이해도가 낮은 구간을 2개 선정해 다음 3일간 집중 재복습 계획을 세운다.\n\n> 1단계는 전체 194일 중 약 26%에 해당하는 분량이며, 확산이론(①~④)과 집진이론(⑤~⑥)이 거의 균등한 비중이다. 60점 목표 기준으로는 두 축 모두에서 \"정의-핵심식-대표 비교표\"를 막힘없이 쓸 수 있는 수준이면 충분하며, 지엽적 수치 암기보다 구조적 이해(왜 이 순서로 배웠는가)에 집중하는 것이 장기 기억에 유리하다.\n","side":[{"title":"답안 작성 요령 — 1단계 전범위 통합 대비","body":"### 구간별 출제 빈도 감각(경향분석 기준)\n| 구간 | 출제 빈도 | 배점 경향 |\n|---|---|---|\n| 대기안정도·확산기초 | 매우 높음 | 10~25점 혼재 |\n| 굴뚝설계·확산모델 | 높음 | 25점 위주 |\n| 환경영향평가 | 중간(최근 증가) | 25점 위주 |\n| 2차오염·입자물리 | 중간 | 10~25점 혼재 |\n| 집진이론(물리~여과) | 매우 높음 | 10~25점 혼재 |\n| 전기집진·세정·이송계통 | 높음 | 25점 위주 |\n\n### 통합형 문제 대응 전략\n최근 기출은 \"확산이론+방지시설\"을 결합한 통합형 문제(예: 배출원 저감이 주변 대기질에 미치는 영향)가 늘고 있다. 이런 문제는 Ⅰ개요에서 두 개념을 모두 정의하고, 본론에서 \"배출원 강도 저감(방지시설) → 확산모델 입력값 감소 → 착지농도 저감\"의 인과관계를 논리적으로 서술해야 한다.\n\n### 흔한 감점 요인(1단계 전체)\n- 정의만 나열하고 설계식의 기호 정의를 누락\n- 비교형 문제에서 비교표 없이 서술로만 답안 작성\n- 법령 근거를 「」 없이 구어체로 인용\n- 결론에 개선방향·최신동향을 언급하지 않고 요약만 반복\n\n### 25점 문항 답안 배분(재확인)\n| 단계 | 시간 | 분량 |\n|---|---|---|\n| 개요 | 3분 | 5~7줄 |\n| 본론(2~3개 소제목) | 30분 | 표·식 포함 A4 2장 내외 |\n| 결론 | 3분 | 2~3줄 |\n| 검토 | 2분 | 오탈자·법령명 |"},{"title":"1단계 전체 진도 점검표(Day 1~51)","body":"| 구간 | Day 범위 | 핵심 축 | 이해도(상/중/하) |\n|---|---|---|---|\n| 1회독 | 1~7 | 대기안정도·확산기초 | |\n| 2회독 | 9~15 | 국지순환·굴뚝설계·가우시안 | |\n| 3회독 | 17~23 | 확산모델·환경영향평가 | |\n| 4회독 | 25~31 | 2차오염물질·입자물리 | |\n| 5회독 | 33~39 | 중력·관성·원심·여과집진 | |\n| 6회독 | 41~47 | 전기집진·세정·후드·덕트 | |\n| 종합 | 49~51 | 송풍기·국소배기·PM신기술 | |\n\n### 활용법\n'하' 표시가 2개 구간 이상이면 2단계(가스상·연소·측정, Day 53~) 진입 전 해당 구간을 우선 재복습할 것을 권장한다. 특히 집진이론(5~6회독 구간)은 2단계의 흡수·흡착 이론과 설계논리가 유사(효율식·파과·압력손실 개념 반복)하므로, 여기서 확실히 정리해두면 2단계 학습 속도가 크게 빨라진다.\n\n### 2단계 예고\nDay 53부터는 가스상 오염물질 처리(흡수·흡착)와 연소·NOx/SOx 저감기술, 측정법으로 이어진다. 1단계에서 익힌 \"효율식-설계인자-장단점\" 서술 패턴이 그대로 적용되므로, 이번 종합정리에서 다진 답안 구조화 능력이 2단계 학습의 기반이 된다.\n\n### 누적 통계\n- 1단계 총 51일 중 회독(review)일 7회 포함\n- 전체 194일 대비 진도율 약 26.3%\n- 남은 구간: 2단계(가스상·연소·측정), 3단계(측정·법규), 마무리(전범위 회독·모의답안)\n\n### 자기점검 활용 팁\n표의 이해도 칸은 매 회독마다 색을 바꿔가며 갱신하면 취약 구간의 변화 추이를 한눈에 볼 수 있다. 시험일이 가까워질수록 '중' 이하 구간 수가 줄어드는지를 진도 관리의 핵심 지표로 삼는다."}]},"53":{"day":53,"date":"2026-09-22","title":"흡수의 원리와 헨리의 법칙","keywords":[{"k":"흡수(Absorption) 원리","subs":["가스를 액체에 접촉시켜 용해·반응제거","물리흡수(단순용해) vs 화학흡수(반응)","SOx·HCl·NH3 등 수용성가스 적용"]},{"k":"헨리의 법칙","subs":["P=Hx (또는 y=mx), 희박용액 적용","H 클수록 난용성(흡수 어려움)","온도↑ → H↑ → 용해도↓"]},{"k":"2막이론(Two-film Theory)","subs":["기체막·액체막 정체막 통과 확산","1/KG=1/kg+H/kl (총괄물질전달계수)","기막지배 vs 액막지배 가스 구분"]},{"k":"NTU-HTU 설계법","subs":["충전탑높이 Z=HTU×NTU","HTU: 장치특성(물질전달계수)","NTU: 공정조건(요구제거율)"]},{"k":"흡수효율 영향인자","subs":["저온·고압일수록 흡수 유리","액가스비(L/G)↑ → 효율↑","충전물 비표면적 클수록 유리"]}],"answer":"# 흡수의 원리와 헨리의 법칙\n\n## Ⅰ. 개요\n\n흡수(Absorption)는 가스상 오염물질을 액체(물 또는 반응성 흡수액)에 접촉시켜 용해 또는 화학반응을 통해 가스흐름에서 제거하는 공정으로, SOx·HCl·HF·NH3 등 수용성이 높은 산성·염기성 가스상 오염물질 처리에 널리 적용된다. 기액 간 평형관계를 정량화하는 헨리의 법칙은 어떤 물질이 흡수에 유리한지(용해도가 높은지)를 판단하는 기초이며, 이를 근거로 물질전달이론(2막이론)과 흡수탑 설계(NTU-HTU법)가 전개된다. 이는 다음 Day의 흡수장치 종류·충전물 설계와 직결되는 이론적 토대이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 헨리의 법칙과 기액평형\n\n### 1. 헨리의 법칙\n저농도 희박용액에서 기상 분압(P)과 액상 몰분율(x)은 비례관계를 가진다.\n\n**P = H·x** (또는 y = m·x, 몰분율 기준)\n\n| 기호 | 의미 |\n|---|---|\n| P | 기상에서의 분압 |\n| H | 헨리상수(온도·물질별 고유값) |\n| x | 액상 중 용질의 몰분율 |\n\n### 2. 헨리상수와 흡수 용이성\n헨리상수(H)가 **클수록** 동일 액상농도에서 평형분압이 높다는 의미이므로 **난용성(흡수 어려움)**이며, H가 **작을수록 이용성(흡수 쉬움)**이다.\n\n| 구분 | 헨리상수(H) | 흡수 용이성 | 대표 물질 |\n|---|---|---|---|\n| 난용성 가스 | 큼 | 어려움(물리흡수 비효율) | O2, N2, CO2(일부) |\n| 이용성 가스 | 작음 | 쉬움 | NH3, HCl, HF, SO2 |\n\n### 3. 온도·압력의 영향\n온도가 상승하면 헨리상수(H)가 증가하여 용해도가 감소하므로, 흡수공정은 **저온**에서 유리하다. 반대로 압력이 높을수록 동일 액상농도에 대한 분압 여유가 커져 흡수에 **유리**하다.\n\n## Ⅲ. 물질전달이론(Two-film Theory)\n\n### 1. 2막이론의 개념\nWhitman의 2막이론에 따르면 기액 계면 양쪽에 얇은 정체막(기체막·액체막)이 존재하며, 물질전달은 이 막을 통과하는 분자확산에 의해 일어난다고 가정한다. 계면에서는 평형(헨리법칙)이 즉시 성립한다고 본다.\n\n### 2. 총괄물질전달계수\n기체상 기준 총괄물질전달계수(KG)는 기막저항과 액막저항의 직렬합으로 표현된다.\n\n**1/KG = 1/kg + H/kl**\n\n| 기호 | 의미 |\n|---|---|\n| kg | 기막 물질전달계수 |\n| kl | 액막 물질전달계수 |\n| H | 헨리상수 |\n\n### 3. 지배저항 판정\n\n| 구분 | 조건 | 대표 물질 |\n|---|---|---|\n| 기막지배(gas-film controlling) | H 작음(이용성 가스) | NH3, HCl |\n| 액막지배(liquid-film controlling) | H 큼(난용성 가스) | O2, CO2 |\n\n기막지배 물질은 액측 교반(충전물 분산)보다 기체 접촉면적 확보가 중요하며, 액막지배 물질은 액측 유동 개선(분무, 충전물 표면갱신)이 효율 향상에 더 효과적이다.\n\n## Ⅳ. 흡수탑 설계(NTU-HTU법)와 효율 영향인자\n\n### 1. 충전탑 높이 설계\n**Z(충전탑 높이) = HTU × NTU**\n\n| 구분 | 의미 |\n|---|---|\n| HTU(이동단위높이) | 장치의 물질전달 성능(충전물 종류·물질전달계수)에 좌우 |\n| NTU(이동단위수) | 요구되는 제거율(공정조건)에 좌우, 제거율이 높을수록 NTU 증가 |\n\n### 2. 흡수효율 영향인자\n\n| 인자 | 흡수에 유리한 조건 | 이유 |\n|---|---|---|\n| 온도 | 낮을수록 | 헨리상수(H) 감소 → 용해도 증가 |\n| 압력 | 높을수록 | 분압 여유 증가 |\n| 액가스비(L/G) | 클수록 | 접촉 흡수액량 증가, 단 압손·폐수 증가 |\n| 접촉면적 | 충전물 비표면적 클수록 | 물질전달 면적 확대 |\n| 액상 반응성 | 화학흡수제 사용 시 | 겉보기 용해도 대폭 향상 |\n\n### 3. 흡수공정 설계 시 실무 검토사항\n1. **처리대상가스의 용해도 사전평가**: 헨리상수 문헌값 또는 실험값 확보\n2. **흡수액 선정**: 물(단순 물리흡수) vs 알칼리 수용액(화학흡수 병행) 결정\n3. **부산물 처리**: 화학흡수 시 반응생성물(예: 아황산칼슘 등)의 폐수·슬러지 처리계획 수립\n4. **부식·스케일 대책**: 흡수액의 pH, 염 농도에 따른 장치 재질 선정\n\n| 검토항목 | 물리흡수 설계 시 | 화학흡수 설계 시 |\n|---|---|---|\n| 흡수액 | 순수 물 | 알칼리 수용액(NaOH, Ca(OH)2 등) |\n| 재생 여부 | 필요(감압·가열) | 불필요(소모형, 폐액 배출) |\n| 부산물 | 없음 | 반응생성물(폐수·슬러지) 발생 |\n| 적용 오염물질 | 이용성 가스(HCl, NH3 등) | 난용성~중간 용해도 가스(SO2 등) |\n\n## Ⅴ. 결론\n\n흡수는 헨리의 법칙에 따른 기액평형관계를 기초로, 2막이론에 근거한 물질전달저항을 최소화하는 방향으로 설계된다. 헨리상수가 작은(이용성) 가스일수록 물리흡수만으로도 고효율 처리가 가능하지만, 난용성 가스는 화학흡수제 사용이나 충전물 표면적 확대 등 보완이 필요하다. 실무에서는 「대기환경보전법」상 배출허용기준 강화에 대응해 화학흡수(알칼리 세정 등)를 병행하는 습식 흡수탑이 SOx·산성가스 저감시설로 널리 채택되고 있으며, 다음 학습에서는 이를 구현하는 구체적 장치 형식(충전탑·분무탑 등)을 다룬다.\n","side":[{"title":"계산 예제 — 헨리법칙 이용 평형농도 산정","body":"### 조건\n어떤 가스의 헨리상수 H=3×10⁴ mmHg (몰분율 기준), 기상 중 해당 가스의 분압 P=30mmHg일 때 액상과 평형을 이루는 몰분율(x)은?\n\n### 계산\nP = H·x → x = P/H = 30/(3×10⁴) = **1×10⁻³** (몰분율)\n\n### 해석\n헨리상수가 매우 크므로(3×10⁴) 동일 분압 대비 액상 용해 몰분율이 매우 작다. 즉 이 가스는 난용성이며, 단순 물리흡수(물 세정)만으로는 고효율 제거가 어려워 화학흡수제(알칼리 등) 검토가 필요함을 답안에서 함께 언급하면 좋다.\n\n### 물질전달계수 계산 흐름(개념)\n1. 기막계수(kg)·액막계수(kl)를 실험 또는 상관식으로 산정\n2. 총괄계수 1/KG = 1/kg + H/kl 계산\n3. 지배저항(기막 또는 액막) 판정\n4. 지배저항 개선방향(접촉면적, 유속, 충전물 종류)을 설계에 반영\n\n### 답안 작성 포인트\n헨리상수 계산 문제는 단위(mmHg, atm 등) 통일 여부가 채점 포인트이며, 산출된 몰분율의 크기가 물리적으로 타당한지(0~1 범위, 난용성/이용성 판정과 일치하는지) 검토하는 문장을 답안에 포함하면 완성도가 높아진다.\n\n### 온도에 따른 헨리상수 변화 계산(개념)\n헨리상수는 온도가 높을수록 커지는 경향(용해도 감소)을 가지며, 실무에서는 Van't Hoff 유사 형태의 온도-헨리상수 상관식이나 문헌 도표를 활용해 설계온도에서의 값을 보정한다. 계산문제에서 별도 상관식이 주어지지 않으면 \"온도 상승 시 H값 증가, 흡수효율 저하\"라는 정성적 관계만 서술해도 무방하다.\n\n### 단위 환산 참고\n| 환산 | 값 |\n|---|---|\n| 1atm | 760mmHg |\n| 1atm | 101.325kPa |\n| ppm→mmHg(분압, 상압기준) | P(mmHg)=760×ppm×10⁻⁶ |"},{"title":"흡수 관련 제도·기출 연계 정리","body":"### 관련 제도\n「대기환경보전법 시행규칙」별표에 따라 황산화물·염화수소·불화수소 등은 배출허용기준이 설정되어 있으며, 흡수(습식 세정)는 이들 산성가스 저감의 대표적 방지시설로 인허가 협의 시 처리효율 근거자료(설계계산서) 제출이 요구되는 경우가 많다.\n\n### 화학흡수 vs 물리흡수 비교\n\n| 구분 | 물리흡수 | 화학흡수 |\n|---|---|---|\n| 원리 | 단순 용해(헨리법칙 지배) | 액상 반응물과 화학반응 |\n| 겉보기 용해도 | 헨리상수에 의존 | 반응으로 대폭 향상 가능 |\n| 적용 예 | CO2 물흡수(저효율) | NaOH/Ca(OH)2에 의한 SO2 흡수 |\n| 재생 여부 | 감압·가열로 재생 가능 | 반응생성물 별도 처리 필요(폐수) |\n\n### 기출 연계 자가점검\n1. 헨리의 법
