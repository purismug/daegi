 a·b는 물질·입경별 상수)\n- 통상 Λ = 10⁻⁵ ~ 10⁻³ s⁻¹\n- 강수 시 반감기가 수십 분~수 시간으로 급감\n\n### 4. 기여도\n연간 기준 습성침적이 전체 제거의 **50~80%**를 차지하는 물질이 많으며, 특히 수용성이 큰 SO₄²⁻·NO₃⁻·NH₄⁺에서 지배적이다.\n\n## Ⅴ. 화학적 변환\n\n### 1. OH 라디칼 — \"대기의 세제(detergent)\"\n주간에 O₃ 광분해로 생성된 O(¹D)가 수증기와 반응해 생성된다.\n- O₃ + hν(λ<310nm) → O(¹D) + O₂\n- O(¹D) + H₂O → **2·OH**\n\nOH는 대부분의 대기오염물질(CO, CH₄, VOC, SO₂, NO₂)과 반응하여 산화·제거한다.\n- SO₂ + OH → ... → **H₂SO₄** (황산염)\n- NO₂ + OH → **HNO₃** (질산염)\n- CH₄ + OH → ... (메탄의 주 소멸 경로)\n\n### 2. 광분해(Photolysis)\nNO₂, 알데히드, 케톤, 유기과산화물 등이 자외선을 흡수해 분해된다.\n- NO₂ + hν → NO + O (오존 생성의 출발)\n\n### 3. 가스-입자 전환\n가스상 전구물질이 산화되어 저휘발성 물질이 되면 응결·응집하여 **2차 입자**를 형성한다. 이는 제거라기보다 **형태 변환**이며, 이후 침적으로 최종 제거된다.\n\n## Ⅵ. 대기 체류시간\n\n**τ = M / F = 1/(k_건성 + k_습성 + k_화학)**  (M: 대기 중 총량, F: 제거율)\n\n| 물질 | 체류시간 | 규모 |\n|---|---|---|\n| NOx | 약 1일 | 국지~지역 |\n| SO₂ | 2~4일 | 지역 |\n| PM2.5 | 3~10일 | 지역~대륙(장거리 이송) |\n| CO | 1~3개월 | 반구 |\n| CH₄ | 약 9~12년 | 전지구 |\n| N₂O | 약 120년 | 전지구 |\n| CFC-11 | 약 45~55년 | 전지구 |\n| CO₂ | 수백~수천 년(다중 시상수) | 전지구 |\n\n**체류시간이 길수록 공간적으로 균일하게 분포**하며, 그래서 온실가스는 배출 위치와 무관하게 전지구적 문제가 된다.\n\n## Ⅶ. 대기환경 관리적 의의\n\n1. **장거리 이송**: PM2.5의 체류시간이 수일이므로 국경을 넘어 이동 → 동북아 협력·CLRTAP의 근거\n2. **산성비**: 습성침적이 산성물질을 지표로 운반 → 임계부하량·PAI 개념\n3. **확산모델**: 근거리 모델은 침적을 무시할 수 있으나, 장거리 모델(CALPUFF·CMAQ)은 반드시 침적·화학변환을 포함\n4. **온실가스 정책**: 체류시간이 GWP 산정의 핵심 변수. CH₄은 짧아 단기 감축 효과가 크고, CO₂는 길어 누적배출이 중요\n5. **오존층**: ODS의 긴 체류시간 때문에 배출 중단 후에도 회복에 수십 년 소요\n\n## Ⅷ. 결론\n\n대기오염물질의 자연적 제거는 **건성침적·습성침적·화학변환**의 세 기작으로 이루어지며, 여기에 확산에 의한 희석이 더해진다. 특히 0.1~1㎛ 축적모드 입자는 어느 침적기작으로도 잘 제거되지 않아 체류시간이 길고 장거리 이송되므로, PM2.5 관리는 국내 저감만으로 완결될 수 없고 국제 협력이 병행되어야 한다. 자연적 제거능력은 유한하므로 결국 **배출 저감이 유일한 근본 대책**이라는 점을 명확히 인식할 필요가 있다.\n","side":[{"title":"산성비의 침적 형태와 임계부하량","body":"### 산성 침적의 두 경로\n| 형태 | 물질 | 특징 |\n|---|---|---|\n| **습성침적** | H₂SO₄, HNO₃ 용해된 강수 | pH 5.6 미만을 산성비로 정의 |\n| **건성침적** | SO₂, NO₂, HNO₃ 가스 / SO₄²⁻, NO₃⁻ 입자 | 강수 없는 기간에도 지속. 산림에서는 습성보다 클 수 있음 |\n\n**총 산성침적 = 습성 + 건성**이므로 산성비만 측정해서는 실제 부하를 알 수 없다.\n\n### pH 5.6의 근거\n청정 대기의 CO₂(약 400ppm)가 빗물에 용해되어 탄산을 형성할 때의 평형 pH.\nCO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻\n\n### PAI(Potential Acid Input, 잠재 산부하량)\n**PAI = (SO₄²⁻ + NO₃⁻ + NH₄⁺ 침적당량) − (Ca²⁺ + Mg²⁺ + K⁺ + Na⁺ 염기양이온 침적당량)**\n\n- 단위: keq/ha·yr\n- NH₄⁺가 산부하에 포함되는 이유: 토양에서 질산화되며 H⁺를 방출하기 때문\n- 값이 클수록 토양·수계 산성화 위험 증가\n\n### 임계부하량(Critical Load)\n생태계에 장기적 유해영향을 주지 않는 침적량의 상한. **초과분(Exceedance) = 실제 침적 − 임계부하**로 관리 목표를 설정하며, 유럽 CLRTAP 체제에서 국가별 감축의무 배분의 과학적 근거로 사용된다.\n\n### 국내 현황\nEANET(동아시아 산성강하물 모니터링 네트워크)에 참여하여 습·건성 침적을 관측하고 있으며, 강원·경기 일부 산림토양의 산성화가 보고되고 있다.\n"},{"title":"OH 라디칼과 대기 산화능","body":"### 왜 \"대기의 세제\"인가\nOH 라디칼은 반응성이 극히 커서 대류권에 배출된 거의 모든 환원성 물질을 산화·제거한다. **대기 자정능력의 핵심**이다.\n\n### 생성 경로\n**주간 주 경로**\n1. O₃ + hν (λ < 310 nm) → O(¹D) + O₂\n2. O(¹D) + H₂O → 2·OH\n\n**부차 경로**: HONO 광분해, 알켄-오존 반응, H₂O₂ 광분해\n\n### 특성\n| 항목 | 값 |\n|---|---|\n| 대기 중 농도 | 약 10⁶ molecules/cm³ (극미량) |\n| 수명 | **1초 미만** |\n| 일변화 | 정오 최대, 야간 거의 0 |\n| 계절변화 | 여름 최대(일사·수증기) |\n\n### 주요 반응과 대기환경 의의\n| 반응 | 생성물 | 의의 |\n|---|---|---|\n| SO₂ + OH → | H₂SO₄ | **황산염 2차 입자**, 산성비 |\n| NO₂ + OH → | HNO₃ | **질산염 2차 입자** |\n| VOC + OH → | RO₂ → 오존 생성 | **광화학 스모그** |\n| CH₄ + OH → | CO, CO₂ | 메탄 소멸(체류시간 결정) |\n| CO + OH → | CO₂ | OH 소모(농도 저하) |\n\n### 야간 산화제 — NO₃ 라디칼\n야간에는 OH가 없으므로 **NO₃ 라디칼**(NO₂ + O₃ → NO₃)이 산화를 담당한다.\n- NO₃ + NO₂ ⇌ **N₂O₅**\n- N₂O₅ + H₂O(입자 표면) → **2HNO₃** → 질산암모늄\n\n겨울철 야간 고습 조건에서 이 경로가 활발하여 **새벽 질산염 급증**의 원인이 된다. 국내 겨울 PM2.5에서 질산염 비중이 높은 이유이기도 하다.\n"}]},"24":{"day":24,"date":"2026-08-24","title":"1단계 이론·확산·집진 회독 3회차","keywords":[{"k":"모델 3계열","subs":["가우시안(정상·해석해)·퍼프(비정상)","격자(오일러리안·광화학)","수용모델(역방향 진단)"]},{"k":"배출원 형태별 식","subs":["선원 C=2q/(√(2π)σz·u·sinφ)","면원 σy₀≈W/4.3, σz₀≈H/2.15","점원 기본 가우시안"]},{"k":"환경영향평가","subs":["스코핑→현황조사→예측→저감→사후조사","기상 5년·대기질 3년 + 현지 계절별","기여 + 배경 = 총농도"]},{"k":"건강영향평가","subs":["위해성평가 4단계","ECR = EC × IUR, 10⁻⁶~10⁻⁴","HQ = EC/RfC < 1"]},{"k":"자연적 제거기작","subs":["건성침적 Vd=1/(Ra+Rb+Rc)","습성침적 Rainout·Washout, C=C₀e^(−Λt)","OH 라디칼 산화, 체류시간"]}],"answer":"# 1단계 회독 3회차 — Day 17~23 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n3회독부터는 **수치와 식을 실제로 외우는 단계**다. 1·2회독에서 구조를 잡았다면, 이제는 백지에 식을 쓰고 숫자를 채울 수 있어야 한다. 이번 구간은 \"모델 → 평가 → 제거\"의 흐름이다.\n\n```\n배출량 산정 (배출계수 × 활동도)\n   ↓\n모델 선정 (가우시안 / 퍼프 / 격자 / 수용)\n   ↓\n배출원 형태별 식 (점 / 선 / 면 / 체적)\n   ↓\n예측농도 + 배경농도 = 총농도\n   ↓\n환경기준 비교 / 건강위해도(ECR, HQ)\n   ↓\n저감방안 → 사후환경영향조사\n   ↕\n자연적 제거(침적·화학변환) → 체류시간 → 영향 범위\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 가우시안 적용 거리 | 50km 이내 | ☐ |\n| 선원 확산식 | C = 2q/(√(2π)·σz·u·**sin φ**) | ☐ |\n| φ = 30°일 때 상대농도 | 90° 대비 **2배** | ☐ |\n| 면원 초기 확산폭 | σy₀ ≈ W/**4.3**, σz₀ ≈ H/**2.15** | ☐ |\n| 혼합고 완전혼합 판정 | σz ≥ **1.6 zi** | ☐ |\n| 기상 현황조사 기간 | 최근 **5년** | ☐ |\n| 대기질 기존자료 조사 | 최근 **3년** | ☐ |\n| 현지측정 | 계절별 각 1회, 연속 **24시간 이상** | ☐ |\n| 발암위해도 관리구간 | **10⁻⁶ ~ 10⁻⁴** | ☐ |\n| 비발암 판정 | **HQ, HI < 1** | ☐ |\n| ECR 산정식 | ECR = **EC × IUR** | ☐ |\n| HQ 산정식 | HQ = **EC / RfC** | ☐ |\n| 특정대기유해물질 | **35종** | ☐ |\n| 침적속도 저항모형 | Vd = 1/(**Ra + Rb + Rc**) | ☐ |\n| 침적속도 최소 입경 | **0.1~1 ㎛**(축적모드) | ☐ |\n| 세정 감쇠식 | C = C₀·exp(−**Λ**t) | ☐ |\n| 산성비 pH 기준 | **5.6** 미만 | ☐ |\n| SO₂ 체류시간 | 2~4일 | ☐ |\n| PM2.5 체류시간 | 3~10일 | ☐ |\n| CH₄ / N₂O 체류시간 | 약 9~12년 / 약 120년 | ☐ |\n| OH 라디칼 수명 | **1초 미만** | ☐ |\n| 비산먼지 작업중지 풍속 | **8 m/s 이상** | ☐ |\n| 공사차량 운행속도 제한 | 20 km/h | ☐ |\n| 저공해 건설기계 의무 | 대기관리권역 **100억 원 이상** 관급공사 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **선원**: C = 2q/(√(2π)·σz·u·sinφ) × exp(−He²/2σz²)\n2. **면원 가상거리**: σy₀ = W/4.3, σz₀ = H/2.15\n3. **완전혼합**: C = Q/(√(2π)·u·σy·zi)\n4. **CMB**: Cᵢ = Σⱼ(aᵢⱼ·Sⱼ) + eᵢ\n5. **PMF**: X = G·F + E (비음수 제약)\n6. **배출량**: 활동도 × 배출계수 × (1 − 제거효율)\n7. **노출농도**: EC = (C×ET×EF×ED)/AT\n8. **발암위해도**: ECR = EC × IUR\n9. **비발암**: HQ = EC/RfC, HI = ΣHQ\n10. **건성침적**: F = Vd·C, Vd = 1/(Ra+Rb+Rc)\n11. **습성침적**: C = C₀·exp(−Λt)\n12. **체류시간**: τ = 1/(k건성 + k습성 + k화학)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 오일러리안 vs 라그랑지안 | 격자 고정, **화학반응 유리** | 덩어리 추적, **수치확산 없음** | 좌표계 |\n| 분산 vs 수용모델 | 배출→농도(예측) | 농도→배출원(진단) | 계산 방향 |\n| CMB vs PMF | 지문 **필요**, 시료 1개 가능 | 지문 **불필요**, 시료 100개↑ | 지문 유무 |\n| Rainout vs Washout | **구름 내** 세정 | **구름 밑** 세정 | 제거 위치 |\n| 건성 vs 습성침적 | 강수 없이 상시 | 강수 시 집중 | 강수 매개 |\n| 기여농도 vs 총농도 | 사업 영향분 | 기여 + **배경** | 기준 비교는 **총농도** |\n| IUR vs RfC | 발암, 위해도 산정 | 비발암, 안전농도 | 발암성 유무 |\n| 대기오염물질 vs 특정대기유해물질 | 60여 종 | **35종**(포함관계) | 위해성 정도 |\n| SEA vs EIA | 계획 단계, 입지 타당성 | 사업 단계, 영향 예측 | 시점 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 대기오염 예측모델 중 오일러리안 모델과 라그랑지안 모델을 비교 설명하시오. *(116회 25점)*\n2. 수용모델과 분산모델에 관하여 설명하시오. *(123회 25점)*\n3. PMF 모델의 개념과 Factor 정의 시 고려사항을 설명하시오. *(최근 25점)*\n4. 고속도로와 같은 선 배출원의 풍하지역 오염농도 평가식을 쓰고 설명하시오. *(120회 25점)*\n5. 우리나라 환경영향평가 권장모델과 미국 EPA의 SCRAM을 설명하시오. *(117회 25점)*\n6. 산업단지 건강영향평가 계획 적정성 평가방안을 설명하시오. *(126회 25점)*\n7. 호흡노출참고치, 호흡단위위해도를 설명하시오. *(최근 10점)*\n8. 대기오염물질의 자연적인 제거기작 4가지를 쓰시오. *(117회 10점)*\n9. 세정효과(washout), 건성침적(dry deposition)을 설명하시오. *(116회 10점)*\n10. 대기오염물질, 유해성대기감시물질, 특정대기유해물질을 설명하시오. *(120회 10점)*\n11. Brute-Force Method(BFM)를 설명하시오. *(126회 10점)*\n12. CAPSS를 설명하시오. *(117·126회 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(25분)**: Ⅰ의 흐름도를 그린다.\n2. **식 쓰기(30분)**: Ⅲ의 12개 식을 손으로. 기호 정의 포함. **이번 회독의 핵심 과제**.\n3. **수치 암기(25분)**: Ⅱ 체크리스트. 5개 이상 틀리면 해당 일자 재독.\n4. **기출 구술(30분)**: Ⅴ의 12문항.\n5. **계산 연습(20분)**: Day 22의 위해성평가 예제를 숫자를 바꿔 다시 풀어본다.\n\n> 3회독인데도 식이 안 나오면, 외우려 하지 말고 **유도 과정을 한 번 더 따라가 보라.** 이해한 식은 안 잊는다.\n","side":[{"title":"모델 선정 의사결정 흐름도","body":"### 판단 순서\n```\nQ1. 대상물질이 2차 생성물(O₃, PM2.5)인가?\n   YES → CMAQ / CAMx (광화학 격자모델)\n   NO  → Q2\n\nQ2. 평가거리 50km 초과인가?\n   YES → CALPUFF\n   NO  → Q3\n\nQ3. 지형이 복잡한가? (산지·해안·분지)\n   YES → CALPUFF (또는 AERMOD + 지형처리)\n   NO  → Q4\n\nQ4. 정온율 20% 초과인가?\n   YES → CALPUFF\n   NO  → Q5\n\nQ5. 건물·구조물 영향이 큰가? (Hs < GEP)\n   YES → AERMOD + PRIME\n   NO  → Q6\n\nQ6. 배출원이 도로·터널인가?\n   YES → CALINE4 / RLINE / CFD\n   NO  → **AERMOD** (기본)\n```\n\n### 병행 수행이 바람직한 경우\n- 대규모 사업(발전소·산업단지): AERMOD + CALPUFF 병행 후 보수적 결과 채택\n- 정책 평가: CMAQ(광역) + 수용모델(검증)\n- 국지 민원: AERMOD + CFD\n\n### 평가서 기술 요령\n\"① 대상지가 평탄지형이고 ② 평가거리가 5km 이내이며 ③ 정온율이 12%로 낮고 ④ 대상물질이 1차 오염물질이므로, 환경부 대기질 모델링 지침에 따라 **AERMOD**를 선정하였다.\" — 이렇게 **번호로 근거를 나열**하면 명확하다.\n"},{"title":"암기 카드 — Day 17~23 핵심 20선","body":"1. **오일러리안** = 격자 고정, 화학반응 유리, **수치확산** 발생\n2. **라그랑지안** = 덩어리 추적, 수치확산 없음, 정온 유리\n3. **CMAQ** = 오일러리안 + 광화학 → O₃·2차 PM2.5\n4. **CALPUFF** = 퍼프, 장거리·복잡지형·저풍속\n5. **HYSPLIT** = 역궤적 → 국외 유입 경로\n6. **CMB** = 배출원 지문 **필요**, T-stat > 2\n7. **PMF** = 지문 **불필요**, 비음수 제약, 시료 100개↑\n8. **지시물질**: V·Ni=중유 / As·Se=석탄 / Zn·Pb=소각 / K⁺=생물성연소 / Cu·Sb=브레이크\n9. **선원** C ∝ **1/sin φ** → 도로와 평행할수록 고농도\n10. **면원** σy₀ = W/4.3, σz₀ = H/2.15\n11. **CAPSS** = 국가 배출량 산정, **13개 대분류**\n12. 환경영향평가 절차: 스코핑 → 현황 → 예측 → 저감 → 협의 → **사후조사**\n13. 기상 **5년** / 대기질 **3년** + 계절별 현지측정\n14. **기여 + 배경 = 총농도** → 기준 비교\n15. **ECR = EC × IUR**, 관리구간 **10⁻⁶~10⁻⁴**\n16. **HQ = EC / RfC < 1**\n17. **특정대기유해물질 35종** (대기오염물질 ⊃ 감시물질 ⊃ 특정)\n18. **Vd = 1/(Ra+Rb+Rc)**, 최소 침적 입경 **0.1~1㎛**\n19. **Rainout**(구름 내) vs **Washout**(구름 밑), C = C₀e^(−Λt)\n20. **OH 라디칼** = 대기의 세제, 수명 1초 미만 / 야간은 **NO₃·N₂O₅**\n"}]},"25":{"day":25,"date":"2026-08-25","title":"시정장애 현상과 소멸계수","keywords":[{"k":"시정거리(Visibility)","subs":["목측 vs 계기측정(투과율계·산란계)","코쉬미더식 Lv=3.912/bext","기상청 시정 관측기준"]},{"k":"소멸계수(bext)","subs":["bext=bsp+bap+bsg+bag","단위 Mm⁻¹(=10⁻⁶ m⁻¹)","가시광선 파장 0.4~0.7㎛"]},{"k":"산란·흡수 기작","subs":["Rayleigh 산란(기체분자, λ⁻⁴)","Mie 산란(입자, 0.1~1㎛ 최대 효율)","EC(원소탄소)의 광흡수 지배"]},{"k":"IMPROVE 재구성식","subs":["황산염·질산염×f(RH) 가중","OC×4, EC×10 질량소멸효율","흡습증대계수 f(RH)"]},{"k":"관리 및 영향","subs":["PM2.5 저감이 시정개선 핵심","고농도 시 박무·연무 발생","교통안전·경관가치 저하"]}],"answer":"# 시정장애 현상과 소멸계수\n\n## Ⅰ. 개요\n\n시정장애(visibility impairment)란 대기 중 오염물질(주로 미세먼지)에 의한 빛의 산란·흡수로 대상물을 식별할 수 있는 최대 거리(시정거리)가 감소하는 현상이다. 시정거리는 대기질의 체감 지표이자 관광·경관가치, 교통안전과 직결되어 정책적 관심이 높다. 시정장애의 물리량적 근거는 **소멸계수(extinction coefficient, bext)**이며, PM2.5 농도와 상관성이 매우 높아 초미세먼지 관리의 보조지표로 활용된다. 최근 기출에서 시정장애 기작과 IMPROVE 재구성식이 다루어지고 있다.\n\n## Ⅱ. 시정거리와 소멸계수의 관계\n\n### 1. 코쉬미더(Koschmieder) 식\n검은 물체를 흰 배경에서 식별 가능한 한계 대비(통상 2%)를 기준으로 유도된 식이다.\n\n**Lv = 3.912 / bext**\n\n- Lv: 시정거리(visual range, km 또는 m)\n- bext: 총 소멸계수(㎞⁻¹ 또는 Mm⁻¹)\n- 3.912 = −ln(0.02) (대비 인지한계 2% 가정)\n\n### 2. 소멸계수의 구성\n**bext = bsp + bap + bsg + bag**\n\n| 기호 | 의미 | 주 기여물질 |\n|---|---|---|\n| bsp | 입자 산란(particle scattering) | PM2.5(황산염·질산염·유기물) |\n| bap | 입자 흡수(particle absorption) | EC(원소탄소, 검댕) |\n| bsg | 기체 산란(gas scattering, Rayleigh) | 공기분자(질소·산소) |\n| bag | 기체 흡수(gas absorption) | NO₂(갈색), O₃ 미량 |\n\n청정 대기에서는 bsg(레일리 산란)만 존재하며 이때 이론적 최대 시정은 약 300~400km 수준이다. 도심·고농도 시에는 bsp가 전체의 80~90%를 차지한다.\n\n## Ⅲ. 산란·흡수 기작\n\n### 1. Rayleigh 산란 (기체분자)\n입자 크기가 파장보다 훨씬 작을 때(d ≪ λ) 발생. 산란강도가 **파장의 4제곱에 반비례**(∝ λ⁻⁴)하여 파란빛이 붉은빛보다 훨씬 많이 산란 — 하늘이 파랗게 보이는 이유와 동일 원리.\n\n### 2. Mie 산란 (입자)\n입자 크기가 파장과 비슷할 때(d ≈ λ) 산란효율이 최대가 된다. 가시광선 파장이 0.4~0.7㎛이므로 **0.1~1㎛ 입자(축적모드, PM2.5의 핵심 입경대)**가 시정장애에 가장 크게 기여한다. 이는 건성침적이 가장 비효율적인 입경대(0.1~1㎛)와 정확히 겹쳐, 이 입경대 입자가 대기 중 체류시간도 길고 시정장애 기여도도 가장 크다는 점이 핵심 논리다.\n\n### 3. 흡수 기작\n- **EC(원소탄소, black carbon)**: 전 파장에서 강하게 흡수, 질량소멸효율이 가장 큼 → 흡수 기여 지배\n- **NO₂**: 청색광 흡수 → 도시 스모그의 갈색(brown haze) 현상의 원인\n- **갈색탄소(Brown Carbon)**: 유기물 연소 기원, 자외선~가시광 단파장 흡수\n\n## Ⅳ. IMPROVE 재구성식과 국내 적용\n\n미국 IMPROVE(Interagency Monitoring of Protected Visual Environments) 프로그램에서 개발한 성분별 질량-소멸계수 재구성식으로, PM 성분 농도로부터 bext를 역산한다.\n\n**bext ≈ 3×f(RH)×[황산염] + 3×f(RH)×[질산염] + 4×[OC] + 10×[EC] + 1×[토양성분] + 0.6×[PM10-2.5] + Rayleigh**\n\n| 성분 | 질량소멸효율(m²/g) | 특징 |\n|---|---|---|\n| 황산염(SO₄²⁻), 질산염(NO₃⁻) | 3 (건조), ×f(RH) | 흡습성 강함, 고습도에서 급증 |\n| 유기탄소(OC) | 4 | 2차 생성 시 소멸효율 증가 |\n| 원소탄소(EC) | 10 | 흡수 지배, 소멸효율 최대 |\n| 토양성분(Fine Soil) | 1 | 황사 시 기여 증가 |\n| 조대입자(PM10-2.5) | 0.6 | 상대적으로 기여 작음 |\n\n### f(RH) — 흡습증대계수\n황산염·질산염은 흡습성이 강해 상대습도가 높아지면 입자가 수분을 흡수해 크기가 커지고 산란효율이 급증한다. RH 90% 이상에서 f(RH)는 건조 시의 3~5배까지 상승하여, **동일 PM 농도에서도 고습도 날 시정이 급격히 악화**되는 이유가 된다.\n\n## Ⅴ. 국내외 소멸계수 성분 기여도 비교\n\n지역·계절에 따라 소멸계수를 구성하는 성분 기여도는 상이하며, 이는 저감정책의 우선순위를 정하는 데 직결된다.\n\n| 지역·상황 | 주 기여 성분 | 정책 시사점 |\n|---|---|---|\n| 국내 수도권(평시) | 황산염·질산염(약 40~50%) | 2차 생성 전구물질(SOx, NOx) 저감 우선 |\n| 국내 고농도 시(정체) | 질산염 급증(겨울 새벽) | 노후경유차·난방 NOx 저감 |\n| 황사 시 | 토양성분(조대입자) | PM10 저감, 발원지 협력 |\n| 산불·소각 인근 | EC·유기탄소(OC) | 생물성 연소 관리 |\n| 미국 서부(청정지역) | Rayleigh(자연배경) | 인위적 기여 이미 낮음 |\n\n### 참고 — 시정관측 관련 용어 정리\n| 용어 | 의미 |\n|---|---|\n| 시정거리(Lv) | 대상물 식별 가능한 최대거리 |\n| 소멸계수(bext) | 단위거리당 빛 소멸 정도 |\n| 산란비(scattering ratio) | bsp/bext, 흡수 대비 산란 비중 |\n\n## Ⅵ. 결론\n\n시정장애는 소멸계수(bext)로 정량화되며, 그 물리적 실체는 0.1~1㎛ 축적모드 입자의 Mie 산란과 EC의 흡수다. 코쉬미더 식(Lv=3.912/bext)으로 시정거리와 대기질을 연결할 수 있고, IMPROVE 재구성식은 PM 성분 분석 결과를 시정 저하 기여도로 환산해 정책 우선순위(황산염·질산염 저감 vs EC 저감)를 정하는 근거가 된다. 향후 미세먼지 성분 모니터링 확대와 함께 시정장애 예보·경보 체계를 PM2.5 예보와 연계 고도화할 필요가 있다.\n","side":[{"title":"국내 시정 관측과 미세먼지 상관성","body":"### 관측 방식\n| 방식 | 원리 | 특징 |\n|---|---|---|\n| 목측(目測) | 관측자가 목표물 식별 | 기상청 전통 방식, 주관적 오차 |\n| 투과율계(Transmissometer) | 광원-수광부 간 투과율 측정 | 두 지점 간 평균 소멸계수 |\n| 산란계(Nephelometer) | 특정 각도 산란광 측정 | bsp 직접 측정, 실시간 |\n\n### PM2.5-시정 상관관계\n- 상대습도 70% 미만 조건에서 시정거리는 PM2.5 농도와 강한 반비례 관계\n- 경험식 예: Lv(km) ≈ k / PM2.5(㎍/㎥) (k는 지역·계절별 상수, 통상 1,000~1,300)\n- PM2.5 35㎍/㎥(나쁨 기준) 부근에서 시정 10km 이하로 저하되는 사례가 다수 보고됨\n\n### 황사와의 차이\n- 황사: 조대입자(PM10) 주도, 토양성분 기여 큼, f(RH) 영향 상대적으로 작음\n- 스모그성 저시정: PM2.5·황산염·질산염 주도, 고습도와 결합 시 급격 악화(박무·연무)\n\n### 관리적 시사점\n시정장애 민원은 관광지·공항 인근에서 특히 문제가 되므로, 환경영향평가 시 항공 안전(활주로 시정기준 통상 5,000m 이상 요구)과 연계한 검토가 필요하다.\n\n### 측정자료 활용 시 유의점\n| 유의사항 | 내용 |\n|---|---|\n| 상대습도 보정 | RH 70% 이상 구간은 별도 분리 통계 필요 |\n| 야간 자료 | 목측 불가로 결측 많음, 계기측정으로 보완 |\n| 강수 중 자료 | 안개·강수 혼재 시 원인 성분 판별 어려움 |\n| 계절 대표성 | 최소 1년, 가급적 3년 이상 자료로 경향 분석 권고 |"},{"title":"박무(Haze)·연무(Mist)·안개(Fog)의 구분","body":"### 정의 비교\n| 구분 | 상대습도 | 주 원인 | 시정거리 |\n|---|---|---|---|\n| 안개(Fog) | 90% 이상(포화 근접) | 수증기 응결(물방울) | 1km 미만 |\n| 박무(Haze) | 70% 미만 | 건조한 에어로졸(PM) | 1~10km |\n| 연무(Mist) | 70~90% | 흡습 성장 중인 에어로졸 | 1~10km |\n\n세 현상은 모두 시정을 저하시키지만 **기상학적 성인(수증기 vs 에어로졸)**이 다르므로 대책도 다르다. 안개는 지역 기상현상으로 저감이 어렵지만, 박무는 오염물질 배출저감으로 개선 가능하다.\n\n### 국내 대기환경 통계상 구분\n기상청은 시정 1km 미만 & 상대습도 90% 이상을 안개, 시정 1~10km & 상대습도 무관하게 미세입자에 의한 경우를 박무로 통계 처리한다. 최근 10년간 국내 '맑은 날 박무' 일수가 증가 추세인데, 이는 습도와 무관하게 PM2.5 자체 농도가 높아진 결과로 해석된다.\n\n### 항공기상 연계\n공항에서는 활주로 가시거리(RVR, Runway Visual Range)를 별도로 측정하며, 저시정 시 이착륙 제한 기준이 별도로 운영된다. 대규모 개발사업의 환경영향평가에서 인근 공항이 있는 경우 시정장애 영향예측이 요구될 수 있다.\n\n### 안개·박무·연무 발생 시 대응 비교\n| 현상 | 지속시간 | 저감 가능성 | 주 대응 수단 |\n|---|---|---|---|\n| 안개 | 수 시간(일출 후 소산) | 낮음(기상현상) | 교통 서행·경보 |\n| 박무 | 수일 지속 가능 | 있음(배출저감) | PM 저감 정책 |\n| 연무 | 습도 변화에 연동 | 있음(배출+습도) | 복합 대응 |\n\n해상 인접 사업(항만·발전소 등)의 해양이용영향평가에서는 해무(sea fog) 발생빈도도 별도로 검토 대상이 될 수 있다."}]},"26":{"day":26,"date":"2026-08-26","title":"산성비의 기작·영향·대책","keywords":[{"k":"산성비 정의","subs":["pH 5.6 미만 강수","청정대기 CO₂ 평형 pH가 기준","건성+습성=총 산성침적"]},{"k":"생성 기작","subs":["SO₂→H₂SO₄(액상 산화, OH·H₂O₂·O₃)","NOx→HNO₃(OH 산화)","전구물질 장거리 이송"]},{"k":"영향","subs":["토양·수계 산성화(Al³⁺ 용출)","산림 쇠퇴, 어류 폐사(pH<5)","건축물·문화재 부식(탄산칼슘 용해)"]},{"k":"대책","subs":["배출저감: FGD·SCR·저황유","석회 살포(중화, liming)","국제협력: LRTAP, EANET"]},{"k":"평가지표","subs":["임계부하량(Critical Load)","PAI(잠재산부하량)","초과분(Exceedance)"]}],"answer":"# 산성비의 기작·영향·대책\n\n## Ⅰ. 개요\n\n산성비(acid rain, acid precipitation)는 대기 중 SOx·NOx가 산화되어 생성된 황산·질산이 강수(습성) 또는 가스·입자(건성) 형태로 지표에 침적되는 현상이다. 통상 **pH 5.6 미만**의 강수를 산성비로 정의하며, 이는 청정대기의 CO₂(약 400ppm)가 빗물에 용해되어 이루는 평형 pH를 기준으로 한다. 산성비는 발생원과 피해지가 국경을 넘나드는 **월경성(transboundary) 오염**의 대표 사례로, 1970~80년대 유럽·북미의 산성비 피해를 계기로 국제협약 체계(LRTAP)가 형성된 정책적으로도 중요한 주제다.\n\n## Ⅱ. 생성 기작\n\n### 1. 전구물질과 반응 경로\n| 전구물질 | 산화제 | 생성물 | 비고 |\n|---|---|---|---|\n| SO₂ | OH(기상), H₂O₂·O₃(액상, 구름물방울 내) | H₂SO₄ (황산) | 액상 경로가 지배적, 산성비 기여 최대 |\n| NOx(NO, NO₂) | OH(주간), O₃→NO₃·N₂O₅(야간) | HNO₃ (질산) | 기상 경로 지배적 |\n| NH₃ | — | NH₄⁺ | 중화 역할, 토양 질산화 시 재산성화 |\n\n### 2. 반응식 요약\n- 기상: SO₂ + OH → HSO₃ → ... → **H₂SO₄**\n- 액상(구름 내): SO₂(aq) + H₂O₂ → H₂SO₄ (pH 의존적, 저pH에서 O₃ 경로 우세)\n- NO₂ + OH → **HNO₃**\n- 야간: NO₂ + O₃ → NO₃ ; NO₃ + NO₂ ⇌ N₂O₅ ; N₂O₅ + H₂O(입자표면) → 2HNO₃\n\n### 3. 침적 경로\n**총 산성침적 = 습성침적(Rainout+Washout) + 건성침적(가스·입자)**\n- 습성: 산성비 자체, 관측·정량이 용이\n- 건성: 강수 없는 기간에도 지속, 산림 캐노피에서는 습성보다 클 수 있어 과소평가 주의\n\n## Ⅲ. 영향\n\n### 1. 생태계\n| 대상 | 영향 | 기작 |\n|---|---|---|\n| 토양 | 염기포화도 저하, 산성화 | H⁺가 Ca²⁺·Mg²⁺·K⁺ 등 염기양이온 용탈 |\n| 토양·지하수 | 알루미늄 독성 | 산성화로 불용성 Al이 Al³⁺로 용출, 식물 뿌리·어류 아가미 손상 |\n| 산림 | 쇠퇴(decline) | 양분 결핍 + Al 독성 + 병해충 저항성 저하 복합 |\n| 호소·하천 | 어류 폐사 | pH 5 이하에서 산란·부화 실패, pH 4.5 이하 치명적 |\n\n### 2. 건축·재료·문화재\n- 대리석·석회암(CaCO₃) 문화재: CaCO₃ + H₂SO₄ → CaSO₄ + H₂O + CO₂ (석고화, 표면 박리)\n- 금속 구조물 부식 가속, 도료·페인트 열화\n\n### 3. 인체·기타\n- 직접 노출보다는 전구물질(SO₂, NOx, 2차 PM) 흡입에 의한 호흡기 영향이 주된 건강 경로\n- 시정장애(Day 25) 유발 — 황산염·질산염이 흡습성 강해 산란효율 높음\n\n## Ⅳ. 대책\n\n### 1. 배출저감(발생원 대책)\n| 대상 | 대책 | 비고 |\n|---|---|---|\n| SOx | 탈황설비(FGD, 습식석회석-석고법) | 효율 90% 이상 |\n| SOx | 저황유·청정연료 전환 | 황함유기준 강화 연계 |\n| NOx | 탈질설비(SCR, 촉매환원) | NH₃/요소 환원제, 효율 80~90% |\n| NOx | 연소개선(저NOx버너, 배가스재순환) | 1차 저감 |\n\n### 2. 피해지 대책\n- **석회 살포(liming)**: 산성화된 호소·토양에 석회(CaCO₃·CaO)를 살포해 직접 중화 — 근본대책이 아닌 응급·완화 조치\n- 내산성 수종 조림, 산림 시비를 통한 양분 보충\n\n### 3. 국제협력\n- **LRTAP(장거리 월경성 대기오염물질에 관한 협약, 1979, 유럽)**: 황·질소 배출 감축 의정서(헬싱키·소피아·오슬로 등) 채택\n- **EANET(동아시아 산성강하물 모니터링 네트워크)**: 한·중·일 등 동아시아 국가 습·건성 침적 공동 관측\n- 국내는 한·중·일 대기질 공동연구(LTP) 등을 통해 월경성 오염 저감 협력 진행\n\n## Ⅴ. 국내 산성비 관측 현황\n\n| 관측지표 | 국내 동향(개략) |\n|---|---|\n| 강수 pH | 전국 평균 대략 4.5~5.0대(산성 강수 지속) |\n| 원인물질 | SOx는 감소 추세, NOx·NH₃ 기여 상대적 증가 |\n| 지역차 | 서해안·수도권이 대륙 기원 영향으로 산성도 더 높은 경향 |\n| 관측망 | 산성강하물 측정망(환경부·국립환경과학원), EANET 국내 참여 지점 |\n\n국내는 SOx 저감(FGD 확대 등)이 상당 부분 진전되었으나 암모니아(NH₃, 축산·비료 기원)의 기여가 상대적으로 부각되고 있어, 향후 산성비 관리는 SOx·NOx 중심에서 **NH₃까지 포함하는 다물질 접근**으로 확대될 필요가 있다는 점이 최근 논의의 흐름이다.\n\n## Ⅵ. 결론 및 평가지표\n\n산성비는 SOx·NOx의 산화 생성물이 습·건성 경로로 침적되는 현상으로, 생태계·재료·경관에 광범위한 피해를 유발하며 월경성 특성 때문에 국제협력이 필수적이다. 정량적 관리를 위해 **임계부하량(Critical Load, 생태계가 장기적으로 견딜 수 있는 침적 상한)**과 **PAI(잠재산부하량)**를 산정하고, 실제 침적량이 임계부하를 넘는 **초과분(Exceedance)**을 줄이는 방향으로 감축목표를 설정하는 것이 국제적으로 통용되는 접근이다. 국내 산림토양의 산성화 사례가 일부 보고되는 만큼, 배출저감과 함께 EANET 등 국제 모니터링 참여를 지속 확대해야 한다.\n","side":[{"title":"임계부하량과 초과분 산정 예제","body":"### 개념\n**임계부하량(Critical Load)**: 현재의 과학적 지식으로 볼 때 장기적으로 생태계에 유해한 변화를 일으키지 않는 하나 이상 오염물질의 침적량 상한(keq/ha·yr 또는 kg S(또는 N)/ha·yr).\n\n**초과분(Exceedance) = 실제 침적량 − 임계부하량**  (양수면 관리 필요)\n\n### 계산 예제\n어느 산림 토양의 황 임계부하량이 0.8 keq/ha·yr이고, 실측 총 황침적량(습성+건성)이 1.3 keq/ha·yr이라면:\n\nExceedance = 1.3 − 0.8 = **0.5 keq/ha·yr (초과)**\n\n→ 배출원 저감을 통해 침적량을 0.8 이하로 낮추는 것이 정책 목표가 된다.\n\n### PAI(잠재산부하량) 산정\n**PAI = (SO₄²⁻+NO₃⁻+NH₄⁺ 당량) − (Ca²⁺+Mg²⁺+K⁺+Na⁺ 당량)**  [keq/ha·yr]\n\n| 이온 | 침적량(keq/ha·yr) |\n|---|---|\n| SO₄²⁻ | 0.6 |\n| NO₃⁻ | 0.4 |\n| NH₄⁺ | 0.3 |\n| Ca²⁺+Mg²⁺+K⁺+Na⁺ | 0.5 |\n\nPAI = (0.6+0.4+0.3) − 0.5 = **0.8 keq/ha·yr**\n\n값이 클수록 토양 산성화·염기 용탈 위험이 크다고 판단한다."},{"title":"국내외 산성비 대응 연혁","body":"### 국제\n1. 1979 LRTAP 협약 채택(제네바)\n2. 1985 헬싱키 의정서 — SO₂ 30% 감축(1차 유황의정서)\n3. 1994 오슬로 의정서 — 임계부하량 기반 차등 감축(2차 유황의정서)\n4. 1999 예테보리 의정서 — SO₂·NOx·VOC·NH₃ 다물질 동시 규제\n\n### 국내\n1. 대기환경보전법에 황함유기준·저황유 공급지역 지정 근거\n2. 발전·산업 부문 FGD·SCR 설치 의무화 확대(대형 사업장)\n3. 대기관리권역 특별법을 통한 권역별 총량관리(SOx·NOx 포함)\n4. 한중일 대기질 공동연구(LTP, Long-range Transboundary Air Pollutants in Northeast Asia) — 월경성 이동 정량화\n\n### 환경영향평가 실무 연계\n대형 연소사업(발전소 등)의 환경영향평가 시 SOx·NOx 배출량과 확산모델링 결과로부터 산성침적 영향권을 검토하며, 필요시 임계부하량 초과 여부를 간접적으로 논의하는 사례가 늘고 있다. 특히 산림·습지 등 민감 수용체가 인접한 경우 침적 영향에 대한 정성적 서술이 요구되는 경우가 있다.\n\n### 관련 법령·제도 요약\n| 제도 | 근거 | 내용 |\n|---|---|---|\n| 배출허용기준 | 「대기환경보전법」 시행규칙 별표 | 시설별 SOx·NOx 농도기준 |\n| 총량관리 | 「대기관리권역법」 | 권역 내 SOx·NOx·먼지 총량 할당 |\n| 청정연료 사용 | 「대기환경보전법」 | 저황유·청정연료 사용지역 지정 |\n| 배출권거래제 | 「온실가스 배출권거래법」 | 간접적으로 연소저감 유도(SOx·NOx 동반감축) |\n\n### 답안 작성 팁\n산성비 문제는 \"기작→영향→대책\" 흐름에 더해 **임계부하량·PAI 같은 정량지표**를 하나 이상 언급하면 차별화된 고득점 답안이 된다."}]},"27":{"day":27,"date":"2026-08-27","title":"광화학반응과 2차 대기오염물질","keywords":[{"k":"광화학반응 개념","subs":["1차 오염물질 + 자외선 → 2차 생성","NO₂ 광분해가 출발점(hν<420nm)","라디칼 연쇄반응(OH·HO₂·RO₂)"]},{"k":"2차 오염물질 종류","subs":["오존(O₃)","PAN(과산화아세틸질산염)","2차 유기에어로졸(SOA)·황산염·질산염"]},{"k":"NO-NO₂-O₃ 광정상상태","subs":["NO₂+hν→NO+O(³P)","O+O₂+M→O₃","Leighton 관계식"]},{"k":"VOC의 역할","subs":["RO₂가 NO를 NO₂로 전환(오존 축적)","반응성 순서: 알켄>방향족>알칸","SOA 생성 전구물질"]},{"k":"영향 및 관리","subs":["광화학스모그(LA형)","오존경보제·환경기준(8시간 0.06ppm)","VOC·NOx 동시저감 필요"]}],"answer":"# 광화학반응과 2차 대기오염물질\n\n## Ⅰ. 개요\n\n대기 중 오염물질은 배출원에서 직접 나온 **1차 오염물질**과, 이들이 태양광(자외선)의 에너지를 받아 대기 중에서 반응하여 생성되는 **2차 오염물질**로 구분된다. 광화학반응(photochemical reaction)은 NO₂의 광분해를 출발점으로 하는 라디칼 연쇄반응 체계이며, 그 산물인 오존·PAN·2차 유기에어로졸(SOA)·황산염·질산염이 대기질을 좌우하는 핵심 물질이다. 국내 오존·PM2.5 고농도의 상당 부분이 2차 생성 기여이므로, 1차 배출저감만으로는 개선에 한계가 있다는 점이 최근 대기관리 정책의 핵심 논점이다.\n\n## Ⅱ. 광화학반응의 기본 골격\n\n### 1. 출발 반응 — NO₂ 광분해\n**NO₂ + hν(λ<420nm) → NO + O(³P)**\n**O(³P) + O₂ + M → O₃ + M**\n**O₃ + NO → NO₂ + O₂**\n\n이 세 반응만 있으면 O₃는 축적되지 않고 NO-NO₂-O₃ 사이 **광정상상태(Photostationary State)**를 이룬다.\n\n### 2. 라디칼 연쇄반응 — VOC의 개입\nVOC가 OH 라디칼에 의해 산화되면 **RO₂(유기과산화라디칼)**가 생성되고, 이것이 **NO를 NO₂로 전환**시키면서 O₃를 소모하지 않는 경로가 열린다.\n\nVOC + OH → R• → (+O₂) → RO₂•\nRO₂• + NO → RO• + **NO₂** (③의 O₃+NO 반응을 우회 — 오존 축적의 핵심)\nRO• + O₂ → 카르보닐 + HO₂•\nHO₂• + NO → OH + **NO₂**\n\n즉 VOC가 있으면 NO가 O₃를 소모하지 않고 NO₂로 전환되므로, 광분해될 NO₂가 계속 공급되어 **O₃가 순증가**한다.\n\n## Ⅲ. 주요 2차 오염물질\n\n| 물질 | 생성 경로 | 특징 |\n|---|---|---|\n| 오존(O₃) | NO₂ 광분해 + VOC 연쇄반응 | 대표적 광화학 산화제, 환경기준 8시간 0.06ppm |\n| PAN(CH₃COOO NO₂) | 알데히드(아세트알데히드) + NO₂ + O₂ | 강한 산화력, 저온에서 안정 → 장거리 이송, 식물독성 |\n| 황산염(SO₄²⁻) | SO₂ + OH(기상)/H₂O₂·O₃(액상) | PM2.5 주요 성분, 흡습성 |\n| 질산염(NO₃⁻) | NO₂ + OH, N₂O₅ 가수분해(야간) | PM2.5 주요 성분, 겨울철 새벽 급증 |\n| 2차 유기에어로졸(SOA) | VOC(특히 방향족·테르펜) 산화 후 응축 | PM2.5 유기물의 상당 비중, 생성기작 불확실성 큼 |\n\n## Ⅳ. VOC 반응성과 광화학스모그\n\n### 1. VOC 반응성 서열\n방향족(자일렌·톨루엔) ≈ 알켄류 > 알칸류(반응성 낮음)\n- 반응성이 높을수록 OH와 빠르게 반응 → 오존 생성 기여도(OFP, Ozone Formation Potential) 큼\n\n### 2. 광화학스모그(LA형 스모그)\n| 항목 | 내용 |\n|---|---|\n| 발생 조건 | 강한 일사, 정체된 대기(고기압), 자동차 배출가스(NOx+VOC) |\n| 시간대 특성 | 아침 NO·VOC 배출 → 정오~오후 O₃ 최고 (반응에 수 시간 소요) |\n| 대표 사례 | 1940년대 LA 스모그 — 런던형(환원성, SO₂+매연)과 대비되는 산화성 스모그 |\n| 국내 특징 | 여름철 맑고 무더운 날, 수도권·내륙분지에서 고농도 빈발 |\n\n### 3. NOx·VOC 동시저감의 중요성\nNOx만 저감하면 일시적으로 O₃가 오히려 증가할 수 있는 **NOx 적정(titration) 효과 소멸** 문제가 있어(Day 28 상세), VOC·NOx **동시 저감 전략**과 지역별 민감도 분석이 필요하다.\n\n## Ⅴ. 라디칼 수지와 反응성 비교\n\n### 1. 주요 라디칼의 역할\n| 라디칼 | 생성 경로 | 주 역할 |\n|---|---|---|\n| OH | O₃ 광분해+H₂O, HONO 광분해 | 대기 산화의 출발점, \"대기의 세제\" |\n| HO₂ | RO+O₂, HCHO 광분해 | NO를 NO₂로 전환 |\n| RO₂ | VOC+OH | NO를 NO₂로 전환, 오존 생성 매개 |\n| NO₃ | NO₂+O₃(야간) | 야간 산화, N₂O₅ 생성 경로 |\n\n### 2. VOC 반응성 순위와 오존생성능(OFP)\n| VOC 종류 | OH와의 반응속도(상대적) | 오존생성기여(대표사례) |\n|---|---|---|\n| 알켄류(에틸렌 등) | 매우 빠름 | 높음 |\n| 방향족(자일렌·톨루엔) | 빠름 | 높음, SOA 기여도 큼 |\n| 알데히드류 | 중간~빠름 | 중간, 광분해로 라디칼 직접 공급 |\n| 알칸류(메탄 제외) | 느림 | 낮음~중간 |\n| 메탄(CH₄) | 매우 느림 | 매우 낮음(장기·광역적 영향) |\n\n오존생성능(OFP, Ozone Formation Potential)이 높은 VOC를 우선 저감하는 것이 동일한 배출량 감축 대비 오존 저감 효과가 크므로, 반응성 기반 저감 우선순위 설정(Reactivity-based control)이 정책적으로 주목받고 있다.\n\n### 참고 — 1차 vs 2차 오염물질 판별표\n| 구분 | 1차 오염물질 | 2차 오염물질 |\n|---|---|---|\n| 예시 | SO₂, NOx, CO, 매연 | O₃, PAN, SOA, 황산염 |\n| 배출원 직접 측정 | 가능 | 불가능(반응 산물) |\n| 저감방법 | 배출시설 규제 | 전구물질·반응조건 관리 |\n\n## Ⅵ. 결론\n\n광화학반응은 NO₂ 광분해를 출발점으로 VOC·라디칼이 개입하는 연쇄반응이며, 그 결과 오존·PAN·SOA·황산염·질산염 등 2차 오염물질이 생성된다. 이들은 1차 배출원 규제만으로 저감되지 않고 반응 조건(일사·기온·전구물질비)에 크게 좌우되므로, 관리를 위해서는 전구물질(NOx, VOC)의 배출특성과 대기 중 반응성을 함께 고려한 **통합적 저감전략**이 필요하다. 향후 SOA 생성기작 규명과 VOC 반응성 기반 저감 우선순위 설정이 정책 고도화의 핵심 과제다.\n","side":[{"title":"PAN(과산화아세틸질산염)의 특성","body":"### 생성 반응\nCH₃CHO(아세트알데히드) + OH → CH₃CO• (+O₂) → CH₃C(O)OO• (PA 라디칼)\nCH₃C(O)OO• + NO₂ ⇌ **CH₃C(O)OONO₂ (PAN)**\n\n### 특성\n| 항목 | 내용 |\n|---|---|\n| 안정성 | 저온에서 안정(열분해 평형), 고온에서 쉽게 분해 → NO₂ 재방출 |\n| 역할 | NOx의 \"저장·운반체(reservoir)\" — 저온 상공에서 장거리 이송 후 재분해되어 하류지역 O₃ 생성에 기여 |\n| 독성 | 강한 산화력으로 식물 잎 손상(감광성 반점), 안구·점막 자극 |\n| 측정 | 국내 상시측정망 항목은 아니며 연구목적 관측 중심 |\n\n### 정책적 의의\nPAN은 국지적으로 배출된 NOx가 원거리(도시 하류·산간지역)에서 재방출되어 오존을 생성시키는 매개체로 작용하므로, 오존 문제를 순수한 국지 문제로만 보지 않고 **광역·이동성 문제**로 접근해야 하는 근거가 된다.\n\n### PAN류 화합물 비교\n| 물질 | 전구 알데히드 | 안정성 |\n|---|---|---|\n| PAN | 아세트알데히드 | 가장 흔함, 저온 안정 |\n| PPN(과산화프로피오닐질산염) | 프로피온알데히드 | PAN보다 소량 |\n| MPAN | 메타크롤레인(이소프렌 산화생성물) | 생물기원 VOC 지표 |\n\n### 국내 관측 시사점\n국내에서도 여름철 고농도 오존 시기에 PAN 농도가 함께 상승하는 경향이 보고되며, PAN/NOy 비율은 광화학반응의 진행 정도(성숙도)를 판단하는 보조지표로 활용될 수 있다."},{"title":"2차 유기에어로졸(SOA) 생성 개관","body":"### 생성 과정\n1. VOC(전구물질: 방향족, 테르펜, 이소프렌 등)가 OH·O₃·NO₃ 라디칼과 반응\n2. 저휘발성 산화생성물(응축성 유기물) 생성\n3. 기존 입자 표면에 응축하거나 신규 핵생성 → SOA\n\n### 전구물질 구분\n| 구분 | 대표물질 | 배출원 |\n|---|---|---|\n| 인위적(anthropogenic) VOC | 톨루엔, 자일렌 | 도료·용제·자동차 |\n| 자연적(biogenic) VOC | 이소프렌, 모노테르펜 | 식생(활엽수·침엽수) |\n\n### 관리상 어려움\n- 인위적 VOC 저감만으로는 SOA를 완전히 통제하기 어려움(자연 기원 기여 존재)\n- 생성 메커니즘의 비선형성(다단계 산화, 상평형)으로 모델 예측 불확도 큼\n- 국내 PM2.5 중 유기물 비중이 20~30%대로 높아, SOA 규명이 초미세먼지 저감의 남은 과제로 지목됨\n\n### 기출 연계\n2차 유기에어로졸의 생성기작과 전구물질을 설명하라는 문제가 자주 출제되며, 답안에서는 \"VOC 반응성 서열 → 산화생성물의 응축 → SOA\" 흐름을 명확히 제시하는 것이 중요하다.\n\n### SOA 생성 영향인자\n| 인자 | 영향 |\n|---|---|\n| 산화제 종류 | OH(주간)·O₃(상시)·NO₃(야간)에 따라 생성물 조성 상이 |\n| 기존 입자 존재량 | 응축 표면적 클수록 SOA 생성 촉진 |\n| 온도 | 낮을수록 휘발성 산화생성물의 응축 유리 |\n| NOx 농도 | 고NOx에서는 질산에스터 경로, 저NOx에서는 과산화물 경로로 분화 |"}]},"28":{"day":28,"date":"2026-08-28","title":"오존 생성기작과 NOx/VOC 농도비","keywords":[{"k":"Leighton 관계식","subs":["[O₃]=k₁[NO₂]/(k₂[NO])","광정상상태(PSS) 가정","VOC 개입 시 관계 붕괴"]},{"k":"NOx 적정효과(titration)","subs":["O₃+NO→NO₂+O₂","배출원 인근 O₃ 낮음(NOx 高)","도심 역설적 저농도"]},{"k":"VOC-limited vs NOx-limited","subs":["EKMA/오존등농도곡선(isopleth)","도심: VOC-limited 多","교외·하류: NOx-limited 多"]},{"k":"주말효과(Weekend Effect)","subs":["주말 NOx 감소, VOC 상대적 유지","O₃ 오히려 증가하는 역설","NOx 저감 정책의 딜레마"]},{"k":"관리전략","subs":["오존등농도곡선 기반 지역별 저감비율 결정","NOx만 저감 시 역효과 가능","VOC·NOx 비율 진단 후 맞춤 대책"]}],"answer":"# 오존 생성기작과 NOx/VOC 농도비\n\n## Ⅰ. 개요\n\n지표오존(O₃)은 직접 배출되지 않는 순수 2차 오염물질로, NOx와 VOC가 태양광 하에서 반응하여 생성된다. 그런데 오존 생성은 NOx·VOC의 절대 농도가 아니라 **상대적 비율(NOx/VOC)**에 의해 지배되는 비선형적 특성을 가지며, 이 때문에 \"NOx를 줄였는데 오존이 오히려 증가\"하는 역설적 현상이 관측된다. 이는 오존 저감 정책 설계에서 가장 까다롭고 자주 출제되는 핵심 주제다.\n\n## Ⅱ. 광정상상태와 Leighton 관계식\n\nVOC가 없다고 가정할 때 NO-NO₂-O₃ 삼자는 아래 반응으로 평형(정상상태)을 이룬다.\n\nNO₂ + hν → NO + O(³P) (k₁)\nO(³P) + O₂ + M → O₃ + M\nO₃ + NO → NO₂ + O₂ (k₂)\n\n정상상태에서 **[O₃] = k₁[NO₂] / (k₂[NO])** (Leighton 관계식)\n\n이 관계식만으로는 O₃가 축적되지 않는다(생성·소멸 균형). **VOC가 개입해 RO₂·HO₂ 라디칼이 NO를 NO₂로 전환시키면(O₃ 소모 없이) 이 균형이 깨지고 O₃가 순증가**한다 — Day 27의 라디칼 연쇄반응이 여기 연결된다.\n\n## Ⅲ. NOx 적정효과(Titration Effect)\n\n배출원 인근(도심 도로변 등)은 NOx 농도가 매우 높아 **O₃ + NO → NO₂ + O₂** 반응으로 O₃가 소모되어 오히려 O₃ 농도가 낮게 관측되는 역설이 나타난다.\n\n| 위치 | NOx 농도 | O₃ 농도 | 설명 |\n|---|---|---|---|\n| 도로변·도심 | 높음 | 낮음 | 적정효과로 O₃ 소모 |\n| 도심 하류(교외) | 감소 | 높음 | NO 소모로 적정효과 약화 + 이송된 O₃ 축적 |\n| 야간 | NO 없음(NO₂→NO₃로 전환) | O₃ 축적 후 서서히 소모 | NO₃ 라디칼 경로(야간 산화) |\n\n## Ⅳ. VOC-limited / NOx-limited 체제\n\n오존 생성량은 NOx와 VOC 농도의 비율에 따라 두 영역으로 나뉘며, 이를 **오존등농도곡선(Ozone Isopleth, EKMA)**으로 도식화한다.\n\n| 구분 | NOx/VOC 비 | 특징 | 저감 전략 |\n|---|---|---|---|\n| **VOC-limited(NOx 過剩)** | 비 큼(NOx 상대적으로 많음) | VOC 감소 시 O₃ 뚜렷이 감소, **NOx만 줄이면 O₃ 오히려 증가 가능** | VOC 우선 저감 |\n| **NOx-limited(VOC 過剩)** | 비 작음(VOC 상대적으로 많음) | NOx 감소가 O₃ 저감에 직접 효과 | NOx 우선 저감 |\n\n- **도심(교통량 多)**: NOx 배출이 워낙 많아 VOC-limited 구간에 위치하는 경우가 많음 → NOx만 줄이면 적정효과가 약화되며 O₃가 늘 수 있음\n- **교외·풍하측**: NOx 희석·소모로 상대적으로 NOx-limited 구간 → NOx 저감이 유효\n\n이 비선형성 때문에 **\"어디서, 무엇을 얼마나 줄일지\"를 오존등농도곡선으로 진단한 후 지역 맞춤형 저감비율을 설정**하는 것이 정책의 핵심이다.\n\n## Ⅴ. 오존 생성 민감도 현장 진단 지표\n\n관측자료만으로 VOC-limited/NOx-limited를 판별하는 보조 지표들이 실무에서 활용된다.\n\n| 진단 지표 | 판별 기준(대략) | 의미 |\n|---|---|---|\n| O₃/NOy 비 | 낮음 → VOC-limited, 높음 → NOx-limited | 광화학 반응 진행도 반영 |\n| H₂O₂/HNO₃ 비 | 낮음(<0.5) → VOC-limited | 라디칼-질소 화학 균형 반영 |\n| HCHO/NO₂ 비(위성관측) | 낮음(<1) → VOC-limited, 높음(>2) → NOx-limited | 위성 기반 광역 진단에 활용 |\n\n이러한 비율 지표는 특히 위성(HCHO/NO₂ column ratio)을 활용한 광역 진단에 널리 쓰이며, 국내에서도 천리안 위성 등을 활용한 오존 민감도 지도 작성 연구가 진행되고 있다.\n\n## Ⅵ. 주말효과와 관리적 시사점\n\n### 1. 주말효과(Weekend Effect)\n주말에는 화물차 통행이 줄어 NOx 배출이 크게 감소하지만 VOC(승용차·생활부문)는 상대적으로 덜 감소하여, NOx/VOC 비가 낮아지고 **적정효과가 약화되어 주말 O₃가 평일보다 높게 관측**되는 현상이 국내외에서 보고된다.\n\n### 2. 정책적 시사점\n1. 단순 NOx 총량규제만으로는 도심 O₃를 낮추지 못할 수 있음 — 지역별 민감도 진단 선행 필요\n2. VOC(용제·도장·인쇄 등 생활·산업부문) 관리도 병행 필요\n3. 장기적으로는 NOx·VOC **동시 저감**이 유일한 근본 해법(전이구간에서는 어느 한쪽만으로는 한계)\n\n## Ⅶ. 국내 오존 농도 추세와 시사점\n\n| 항목 | 국내 동향(개략) |\n|---|---|\n| 전국 오존 연평균 | 지속적 증가 추세(NOx·PM 저감에 따른 적정효과 약화 영향 포함) |\n| PM2.5 대비 | PM2.5는 감소 추세인 반면 오존은 상대적으로 개선 정체 |\n| 지역차 | 대도심보다 교외·중소도시에서 고농도 사례 다수 |\n| 계절차 | 5~9월 집중, 최근 봄철(4~5월) 고농도도 증가 |\n\n이러한 추세는 **NOx 저감 정책이 도심 내 적정효과를 약화시켜 오존을 오히려 증가시킬 수 있다는 이론(Ⅲ장)이 실제 관측으로 뒷받침**되는 사례로 해석되며, 향후 오존 대책은 NOx 저감과 함께 VOC 저감 강도를 동반 강화해야 한다는 정책적 함의를 준다.\n\n### 참고 — 관련 핵심 용어 정리\n| 용어 | 의미 |\n|---|---|\n| NOy | NOx + 산화생성물(HNO₃, PAN 등) 총합 |\n| Ridge line | EKMA 등농도곡선의 능선(체제 전환 경계) |\n\n## Ⅷ. 결론\n\n오존은 NOx와 VOC의 절대량이 아닌 **상대 비율**과 반응조건(일사·기온)에 의해 비선형적으로 생성되며, 도심의 NOx 적정효과와 VOC-limited/NOx-limited 체제 전환이 정책 설계를 복잡하게 만든다. 오존등농도곡선을 활용한 지역별 민감도 분석을 토대로 NOx·VOC 저감 비율을 과학적으로 설정하고, 장기적으로는 두 전구물질을 동시에 감축하는 전략이 필요하다.\n","side":[{"title":"오존경보제 운영기준","body":"### 발령 기준(1시간 평균, ppm)\n| 단계 | 농도 | 조치 |\n|---|---|---|\n| 주의보 | 0.12 이상 | 실외활동 자제 권고, 자동차 사용 자제 |\n| 경보 | 0.3 이상 | 유치원·학교 실외수업 자제, 배출시설 가동시간 조정 권고 |\n| 중대경보 | 0.5 이상 | 주민 실외활동 금지 권고, 사업장 조업단축 권고 |\n\n- 「대기환경보전법」 및 시행규칙에 근거, 시·도지사가 권역별로 발령\n- 환경기준(8시간 평균 0.06ppm)과는 별개의 단기 경보 체계임에 유의 — 경보기준은 1시간 평균, 환경기준은 8시간 평균\n\n### 환경기준 비교\n| 항목 | 기준 |\n|---|---|\n| 오존 1시간 평균 | 0.1 ppm 이하 |\n| 오존 8시간 평균 | 0.06 ppm 이하 |\n\n### 실무 유의점\n경보제와 환경기준은 목적(단기 건강보호 vs 장기 대기질 목표)과 평균시간이 다르므로 답안에서 혼동하지 않도록 구분해 서술해야 한다.\n\n### 발령·해제 절차 요약\n| 단계 | 절차 |\n|---|---|\n| 예보 | 전일 대기질 예보에서 고농도 가능성 통보 |\n| 발령 | 측정소 1시간 평균 초과 확인 즉시 해당 권역 발령 |\n| 유지 | 기준 초과 지속 시 단계 유지·상향 |\n| 해제 | 기준 이하로 낮아지고 하강 추세 확인 시 해제 |\n\n### 관련 기관 역할\n| 기관 | 역할 |\n|---|---|\n| 국립환경과학원 | 대기질 예보·모델링 총괄 |\n| 시·도 보건환경연구원 | 측정자료 실시간 관리 |\n| 시·도지사 | 경보 발령·해제 권한 행사 |"},{"title":"오존등농도곡선(EKMA) 읽는 법","body":"### 개념\n가로축 VOC 농도, 세로축 NOx 농도인 평면에 동일 최대오존농도를 잇는 등농도선을 그린 도표. 도심의 관측 NOx/VOC 지점이 등농도선의 어느 쪽에 위치하는지로 저감전략을 판단한다.\n\n### 판단 절차\n```\n1. 현재 지점(NOx, VOC 관측값)을 등농도곡선 위에 표시\n2. 등농도선의 능선(ridge line)과 비교\n   - 능선보다 VOC/NOx 비가 낮은 쪽(NOx 過多) → VOC-limited\n   - 능선보다 VOC/NOx 비가 높은 쪽(VOC 過多) → NOx-limited\n3. VOC-limited 구간 → VOC 저감 벡터를 따라 이동 시 O₃ 감소\n4. NOx-limited 구간 → NOx 저감 벡터를 따라 이동 시 O₃ 감소\n5. 능선 부근(전이구간) → 어느 한쪽만 저감 시 효과 미미, 동시저감 필요\n```\n\n### 실무 적용\n지자체 오존관리 시행계획 수립 시 관측망 자료로 지역별 EKMA 분석을 수행하여 NOx·VOC 저감 우선순위를 정하며, 대규모 사업장 인허가 시에도 배출원의 지역적 위치(도심형 VOC-limited 인근인지)를 고려한 저감계획이 요구될 수 있다.\n\n### 모델별 활용 비교\n| 모델 | 특징 | 용도 |\n|---|---|---|\n| EKMA(박스모델 기반) | 단순, 빠름, 지역대표 1지점 | 정책 시나리오 스크리닝 |\n| CMAQ 등 3차원 광화학모델 | 공간분포·이송 반영 | 정밀 정책평가·환경영향평가 |"}]},"29":{"day":29,"date":"2026-08-29","title":"광화학스모그와 오존경보제","keywords":[{"k":"광화학스모그 발생조건","subs":["강한 일사·고온·정체(고기압)","접지역전(방사성역전)으로 확산 억제","전구물질(NOx·VOC) 축적"]},{"k":"일변화 프로파일","subs":["아침 NO·VOC 배출 피크","정오~오후 O₃ 최고(반응 지연)","야간 NO 재배출로 O₃ 소모"]},{"k":"역사적 사례","subs":["1943 LA 스모그(Haagen-Smit 규명)","런던형(환원성) vs LA형(산화성) 스모그","국내 1990년대 이후 오존 문제 대두"]},{"k":"오존경보제 체계","subs":["주의보 0.12·경보 0.3·중대경보 0.5ppm(1h)","권역별 발령, 시·도지사 권한","측정망 기반 실시간 모니터링"]},{"k":"국내외 비교","subs":["미국 AQI, WHO 대기질 가이드라인","경보 vs 환경기준의 목적 차이","경보 해제 절차"]}],"answer":"# 광화학스모그와 오존경보제\n\n## Ⅰ. 개요\n\n광화학스모그(photochemical smog)는 자동차·산업 배출가스의 NOx·VOC가 강한 일사 하에서 광화학반응을 일으켜 오존을 비롯한 산화성 물질을 생성하고, 이것이 대기 정체 조건과 결합해 시정 저하·건강피해를 유발하는 현상이다. 1943년 미국 로스앤젤레스에서 처음 규명된 이래(Haagen-Smit), 오존은 여름철 대표적 대기오염 지표가 되었으며, 국내는 이를 관리하기 위해 **오존경보제**를 운영하고 있다. 기출에서는 스모그의 기상학적 발생조건과 경보제 운영기준을 함께 묻는 경우가 많다.\n\n## Ⅱ. 발생 기상조건\n\n| 조건 | 내용 | 오존 생성에 미치는 영향 |\n|---|---|---|\n| 강한 일사 | 자외선 강도 高(여름, 맑은 날) | 광분해 반응속도 증가 |\n| 고온 | 30℃ 이상 | 반응속도 증가, VOC 휘발 증가 |\n| 대기 정체 | 이동성고기압, 풍속 2m/s 이하 | 전구물질·생성물 축적, 확산 억제 |\n| 접지(방사성) 역전 | 야간 복사냉각으로 지표 부근 기온역전 | 아침까지 오염물질 정체 후 일출 후 반응 개시 |\n| 낮은 혼합고 | 정체 고기압 하 침강역전과 결합 | 연직 확산 제한, 지표 농도 상승 |\n\n즉 **\"맑고 무덥고 바람 없는 날\"**이 전형적인 고오존일 조건이다.\n\n## Ⅲ. 일변화(diurnal) 프로파일\n\n```\n06~09시   출근 교통량 → NO·VOC 배출 피크, O₃는 NO 적정효과로 오히려 낮음\n09~13시   광화학반응 진행 → NO₂·VOC 소모, O₃ 축적 시작\n13~16시   일사 최대 + 반응 누적 → O₃ 최고농도(오후 2~4시경 흔함)\n16~19시   일사 약화, 반응속도 감소 → O₃ 서서히 감소\n야간      NO 재배출(없으면 NO₃ 라디칼 경로) → O₃ 소모, 익일 새벽 최저\n```\n\n오존 최고농도가 배출 피크(아침)보다 수 시간 늦게 나타나는 것은 **광화학반응에 걸리는 시간(라디칼 연쇄반응 진행)** 때문이며, 이 때문에 발생지와 최고농도 관측지가 공간적으로 분리(풍하측 교외에서 최고치)되기도 한다.\n\n## Ⅳ. 역사적 사례와 스모그 유형 비교\n\n| 구분 | 런던형 스모그(1952) | LA형 스모그(1943~) |\n|---|---|---|\n| 주 원인물질 | SO₂ + 매연(입자) | NOx + VOC |\n| 반응 성격 | 환원성(reducing) | 산화성(oxidizing) |\n| 발생 계절·시간 | 겨울, 새벽~아침, 무풍 역전 | 여름, 한낮, 강한 일사 |\n| 관련 기상 | 침강역전 + 무풍 | 광화학반응 + 대기정체 |\n| 주요 물질 | SO₂, 황산 미스트 | O₃, PAN, NO₂ |\n\n1943년 LA 스모그는 당시 원인 불명이었으나, Haagen-Smit이 자동차 배출가스(NOx·탄화수소)와 자외선의 반응으로 오존이 생성됨을 규명하며 광화학스모그 개념이 확립되었다.\n\n## Ⅴ. 오존경보제 운영\n\n### 1. 발령기준(1시간 평균)\n| 단계 | 농도(ppm) | 주요 조치 |\n|---|---|---|\n| 주의보 | 0.12 이상 | 실외활동·자동차 사용 자제 권고 |\n| 경보 | 0.3 이상 | 학교 실외수업 자제, 배출시설 가동시간 조정 권고 |\n| 중대경보 | 0.5 이상 | 실외활동 금지 권고, 사업장 조업단축 권고 |\n\n### 2. 운영 체계\n- 「대기환경보전법」 및 하위법령에 근거, **권역(구·군 단위 등)별로 시·도지사가 발령**\n- 대기오염 측정망의 실시간 자료를 기준으로 하며, 해당 권역 내 어느 한 측정소라도 기준을 초과하면 발령\n- 해제는 기준 농도 이하로 낮아지고 지속 하락 추세가 확인될 때\n\n### 3. 환경기준과의 차이\n경보제(1시간 평균, 단기 급성 대응)와 환경기준(8시간 평균 0.06ppm, 장기 대기질 목표)은 **목적과 평균시간이 다르므로 반드시 구분**해 서술해야 한다.\n\n## Ⅵ. 국내 오존 특보 발령 현황과 개선 방향\n\n| 항목 | 내용 |\n|---|---|\n| 발령 시기 집중 | 5~9월, 특히 폭염일수 증가와 함께 발령일수도 증가 추세 |\n| 지역 특성 | 내륙 분지·공단 인접지역에서 상대적으로 잦은 발령 |\n| 예보 정확도 | 광화학모델(CMAQ 등) 기반 익일 예보 정확도 지속 개선 중 |\n| 향후 과제 | 기후변화에 따른 폭염일수 증가 대응, 조기경보 체계 고도화 |\n\n기후변화로 여름철 폭염일수와 정체일수가 함께 늘어나는 추세를 고려하면, 향후 오존 고농도 발생빈도와 지속시간이 함께 증가할 가능성이 높아 예보·경보 체계의 선제적 고도화가 필요하다.\n\n### 참고 — 관련 용어 정리\n| 용어 | 의미 |\n|---|---|\n| 정온율 | 풍속 1m/s 미만 정온 상태의 발생 빈도 비율 |\n| 혼합고(Mixing Height) | 연직 난류혼합이 일어나는 상한 고도 |\n| 접지역전 | 지표 부근에서 형성되는 기온역전층 |\n\n## Ⅶ. 결론\n\n광화학스모그는 강한 일사·고온·대기정체라는 기상조건 하에서 NOx·VOC가 반응해 생성되며, 오존 최고농도는 배출 피크보다 지연되어 나타나는 특성이 있다. 국내는 이를 관리하기 위해 3단계 오존경보제를 운영하고 있으나, 경보는 사후 대응적 성격이 강하므로 근본적으로는 NOx·VOC 배출저감과 EKMA 기반 지역별 저감전략(Day 28)이 병행되어야 한다. 기후변화로 폭염일수가 증가하는 추세를 고려할 때 오존 고농도 발생빈도도 증가할 가능성이 높아, 경보체계의 실효성 제고와 예보 정확도 향상이 지속 과제다.\n","side":[{"title":"국내외 오존·대기질 경보체계 비교","body":"### 미국 AQI(Air Quality Index)\n| 등급 | AQI | 오존 8h(ppm) | 대응 |\n|---|---|---|---|\n| Good | 0~50 | 0~0.054 | 없음 |\n| Moderate | 51~100 | 0.055~0.070 | 민감군 주의 |\n| Unhealthy for Sensitive | 101~150 | 0.071~0.085 | 민감군 실외활동 자제 |\n| Unhealthy | 151~200 | 0.086~0.105 | 전체 실외활동 자제 |\n\n미국은 통합 AQI 지수로 여러 오염물질을 하나의 척도로 표현하는 반면, 국내 오존경보제는 오존 단일물질의 절대농도 기준으로 운영된다는 차이가 있다.\n\n### 일본·유럽 사례\n| 국가 | 체계 | 특징 |\n|---|---|---|\n| 일본 | 광화학스모그 경보 | 오존을 포함한 산화성물질 농도로 판단, 1970년대부터 운영 |\n| EU | 정보역치·경보역치(1h 180/240㎍/㎥) | 대중 정보제공과 비상조치를 이원화 |\n\n### WHO 대기질 가이드라인(2021 개정)\n- 오존 최대 8시간 평균 권고치: **100㎍/㎥(약 0.05ppm) 성수기 평균**\n- 기존(2005) 가이드라인보다 강화된 값으로, 국내 환경기준(0.06ppm)보다도 엄격 — 국내 기준 강화 논의의 근거로 자주 인용됨\n\n### 국내 통합대기환경지수(CAI)\n미세먼지·오존 등 6개 물질을 종합해 좋음~매우나쁨 4~6단계로 표시하는 예보 지수로, 경보제(발령 요건)와는 별도로 대국민 정보제공 목적으로 운영된다.\n\n### 비교 요약\n| 체계 | 목적 |\n|---|---|\n| 오존경보제 | 단일물질 급성 대응 |\n| CAI | 다물질 종합 정보제공 |\n| AQI(미국) | 다물질 종합 등급화 |"},{"title":"오존 저감을 위한 국내 정책 수단","body":"### 배출원별 대책\n| 부문 | 대책 |\n|---|---|\n| 자동차(NOx) | 배출가스 기준 강화(유로6), 저공해차 보급, 노후경유차 저감장치 |\n| 산업(VOC) | 도장·인쇄·석유화학 시설 VOC 회수·소각시설 의무화 |\n| 생활(VOC) | 저VOC 함유 제품 인증제, 주유소 유증기 회수설비 |\n| 발전(NOx) | SCR 설치 의무화, 노후 석탄화력 가동중단·전환 |\n\n### 계절관리제와의 연계\n미세먼지 계절관리제(12~3월)는 주로 PM2.5에 초점을 맞추나, 여름철 오존 고농도 시기(6~8월)에는 별도로 **오존 시즌 대응**(배출시설 가동시간 조정 권고, 대중교통 이용 캠페인)이 시행된다.\n\n### 실무 시사점\n환경영향평가에서 VOC를 다량 배출하는 시설(도장공정, 석유화학 등)은 오존전구물질 배출량을 별도로 산정하고, 필요시 저감계획을 제시하도록 요구되는 경우가 많다. 배출원의 NOx/VOC 비율이 EKMA상 어느 구간에 해당하는지 정성적으로 언급하면 평가서 완성도를 높일 수 있다.\n\n### 사업장 인허가 연계 체크리스트\n| 항목 | 확인사항 |\n|---|---|\n| VOC 배출량 산정 | 원료 사용량×배출계수 또는 물질수지법 |\n| 방지시설 | 흡착(활성탄)·축열식소각(RTO)·촉매산화(RCO) 등 적용여부 |\n| 저장·이송단계 누출 | 유증기 회수설비, 밀폐 이송 여부 |\n| 인허가 서류 | 「대기환경보전법」상 방지시설 설치신고·허가 대상 여부 확인 |\n\n### 향후 전망\n전기차 보급 확대로 자동차 부문 NOx·VOC 배출은 점차 감소할 전망이나, 생활·산업 부문 VOC(용제류)의 상대적 비중이 커질 것으로 예상되어 해당 부문 관리 강화가 향후 정책의 중심으로 이동할 가능성이 높다."}]},"30":{"day":30,"date":"2026-08-30","title":"입자의 물리적 특성과 Stokes 법칙","keywords":[{"k":"입자 크기 표현","subs":["공기역학적 직경(da)","기하학적·스토크스 직경","입경분포(개수·질량기준)"]},{"k":"Stokes 법칙","subs":["층류영역(Re<1) 항력 Fd=3πμdVt","중력=항력 → 종말침강속도","Vt=ρp·d²·g/(18μ)"]},{"k":"레이놀즈수 영역 구분","subs":["층류(Stokes, Re<1)","전이영역(1<Re<1000)","난류(Newton, Re>1000)"]},{"k":"입자 밀도·형상 보정","subs":["구형 가정의 한계","진구형계수(형상계수)","공기역학적 직경=√(ρp/ρ0)×기하직경"]},{"k":"집진장치 설계 적용","subs":["절단입경(dc) 산정 기초","중력식·원심력식 이론 근거","Stokes 영역 벗어날 시 보정 필요"]}],"answer":"# 입자의 물리적 특성과 Stokes 법칙\n\n## Ⅰ. 개요\n\n집진장치의 성능은 입자에 작용하는 힘의 균형으로 설명되며, 그 출발점이 **입자의 침강·이동 운동을 지배하는 Stokes 법칙**이다. 입자는 크기·밀도·형상이 제각각이므로 이를 일관된 척도로 비교하기 위해 **공기역학적 직경(aerodynamic diameter)** 개념이 사용된다. Stokes 법칙과 종말침강속도식은 중력식·관성력식·원심력식·여과식 등 거의 모든 집진이론의 기초가 되므로 정확한 유도 과정과 적용범위(Re<1)의 이해가 필수적이다.\n\n## Ⅱ. 입자 크기의 표현\n\n| 직경 정의 | 내용 |\n|---|---|\n| 기하학적 직경(dg) | 현미경 등으로 관측한 실제 형상 기준 직경 |\n| 스토크스 직경(ds) | 동일한 침강속도를 갖는 밀도 1인 구형입자의 직경 |\n| **공기역학적 직경(da)** | 동일한 침강속도를 갖는 **밀도 1g/㎤ 구형입자**의 직경으로 환산한 값 |\n\n**da = dg × √(ρp / ρ0 × χ)**  (ρp: 입자밀도, ρ0: 기준밀도(1g/㎤), χ: 형상계수의 함수)\n\n집진장치 효율·환경기준(PM10, PM2.5)은 모두 **공기역학적 직경 기준**으로 정의된다는 점이 중요하다 — 예: PM2.5는 공기역학적 직경 2.5㎛ 이하 입자.\n\n## Ⅲ. Stokes 법�칙과 종말침강속도\n\n### 1. 항력(Drag Force)\n저속·층류 조건(레이놀즈수 Re<1)에서 구형입자에 작용하는 항력은 **Stokes 법칙**으로 표현된다.\n\n**Fd = 3πμ·d·Vt**\n\n- μ: 유체(공기)의 점성계수 [kg/m·s]\n- d: 입자 직경 [m]\n- Vt: 입자의 상대속도 [m/s]\n\n### 2. 종말침강속도(Terminal Settling Velocity) 유도\n중력 = 부력 + 항력의 힘의 평형에서 (부력은 통상 무시 가능, ρp≫ρ air)\n\n**중력**: Fg = (π/6)d³·ρp·g\n**항력**(Stokes): Fd = 3πμdVt\n\n평형(Fg=Fd)에서:\n\n**Vt = ρp·d²·g / (18μ)**\n\n| 기호 | 의미 |\n|---|---|\n| Vt | 종말침강속도 [m/s] |\n| ρp | 입자 밀도 [kg/㎥] |\n| d | 입자 직경 [m] |\n| g | 중력가속도 9.8 m/s² |\n| μ | 공기 점성계수(약 1.8×10⁻⁵ kg/m·s, 20℃) |\n\n**Vt는 입경의 제곱에 비례**하므로 입자가 조금만 작아져도 침강속도가 급격히 감소한다 — 미세입자가 대기 중에 오래 부유하는 근본 이유.\n\n## Ⅳ. 레이놀즈수 영역과 적용범위\n\n입자 레이놀즈수 **Rep = d·Vt·ρ/μ**로 유동 영역을 판별하며, 영역별로 항력식이 달라진다.\n\n| 영역 | Rep 범위 | 항력계수(CD) | 비고 |\n|---|---|---|---|\n| **층류(Stokes)** | Rep < 1 | CD = 24/Rep | 미세입자(대략 <50~80㎛), 집진이론 대부분 이 영역 가정 |\n| 전이영역(Allen) | 1 < Rep < 1,000 | CD ≈ 24/Rep(1+0.15Rep^0.687) | 중간 입경, 근사식 필요 |\n| **난류(Newton)** | Rep > 1,000 | CD ≈ 0.44(상수) | 큰 입자·고속, Vt ∝ √d |\n\nStokes 법칙은 **Rep<1 영역에서만 정확**하므로, 큰 입자나 고속 유동(사이클론 내부 등)에서는 보정이 필요하다(Day 31 항력계수·Cunningham 보정 연계).\n\n## Ⅴ. 집진장치 설계에의 적용과 한계\n\n1. **중력집진장치**: Vt 자체가 곧 분리 가능 여부를 결정 — 체류시간 중 낙하거리로 절단입경 산정\n2. **원심력집진장치**: 중력 g 대신 원심가속도(Vt²/R)를 대입해 유사하게 유도(Day 35~36)\n3. **전기집진장치**: 정전기력과 항력(Stokes)의 평형으로 분리속도(drift velocity) 산정\n4. **한계**: 실제 입자는 비구형이 많아 **형상계수(sphericity factor)**로 보정하며, 0.1㎛ 이하 미세입자는 Cunningham 보정계수(Day 31)를 곱하지 않으면 Stokes 식이 침강속도를 과소평가함\n\n## Ⅵ. 대표 물질별 종말침강속도 참고표\n\n| 입경(㎛) | 밀도(kg/㎥) | 종말침강속도(대략) | 비고 |\n|---|---|---|---|\n| 1 | 1,000 | 3.5×10⁻⁵ m/s | Cunningham 보정 필요 |\n| 10 | 1,000 | 3×10⁻³ m/s | Stokes 영역 |\n| 44(200mesh) | 2,650(토사) | 약 0.13 m/s | 사이클론 절단입경 부근 |\n| 100 | 2,650 | Stokes 부적합 | Newton 영역 근접 |\n\n이 표는 이후 중력집진장치(Day 34)·원심력집진장치(Day 35~36)의 절단입경 산정 문제에서 반복적으로 활용되는 수치 감각을 제공한다.\n\n### 참고 — 입경 표기 관례\n| 표기 | 의미 |\n|---|---|\n| PM10 | 공기역학적 직경 10㎛ 이하 |\n| PM2.5 | 공기역학적 직경 2.5㎛ 이하 |\n| TSP | 총부유먼지(입경 제한 없음, 통상 50㎛ 이하 포집) |\n\n## Ⅶ. 결론\n\nStokes 법칙은 층류 조건에서 입자에 작용하는 항력을 기술하며, 이로부터 유도된 종말침강속도식(Vt=ρpd²g/18μ)은 거의 모든 집진장치 이론의 출발점이다. 다만 이 식은 Re<1이라는 전제 위에 성립하므로, 큰 입자(난류영역)나 초미세입자(분자 수준 상호작용 영역)에서는 각각 뉴턴 항력식과 Cunningham 보정이 필요하다. 집진장치 설계 문제를 풀 때는 먼저 대상 입경의 Re 영역을 판별하는 것이 실수를 줄이는 핵심이다.\n","side":[{"title":"종말침강속도 계산 예제","body":"### 조건\n밀도 ρp = 2,000 kg/㎥인 구형입자, 직경 d = 20㎛ = 2×10⁻⁵ m, 공기 점성계수 μ = 1.8×10⁻⁵ kg/m·s, g = 9.8 m/s²\n\n### 계산\nVt = ρp·d²·g / (18μ)\n= (2,000 × (2×10⁻⁵)² × 9.8) / (18 × 1.8×10⁻⁵)\n= (2,000 × 4×10⁻¹⁰ × 9.8) / (3.24×10⁻⁴)\n= (7.84×10⁻⁶) / (3.24×10⁻⁴)\n≈ **0.0242 m/s (2.42 cm/s)**\n\n### Re 검증\nRep = d·Vt·ρair/μ = (2×10⁻⁵ × 0.0242 × 1.2) / (1.8×10⁻⁵) ≈ 0.032 < 1 → **Stokes 영역 유효**\n\n### 입경 민감도 비교\n| 직경(㎛) | Vt(계산값, cm/s) |\n|---|---|\n| 1 | 약 0.006 |\n| 10 | 약 0.6 |\n| 20 | 약 2.4 |\n| 50 | 약 15(단, Re>1 근접, 보정 필요) |\n| 100 | Stokes 부적합(Re≫1, Newton 영역) |\n\n입경이 10배 커지면 침강속도는 100배(제곱비례) 증가함을 알 수 있다."},{"title":"형상계수와 비구형 입자 보정","body":"### 문제의식\n실제 산업 배출입자(비산재, 분진 등)는 완전한 구형이 아니므로 Stokes 식을 그대로 적용하면 오차가 발생한다.\n\n### 진구형계수(Sphericity, ψ)\n**ψ = (동일 부피 구의 표면적) / (실제 입자의 표면적)**\n- 완전 구형: ψ = 1\n- 불규칙한 형상일수록 ψ < 1 (표면적이 상대적으로 큼 → 항력 증가 → 침강속도 감소)\n\n### 보정 적용\n동적형상계수(dynamic shape factor, χ)를 항력식에 곱하여 비구형 효과를 반영:\n\n**Vt(비구형) = Vt(구형) / χ**\n\n| 입자 형태 | χ(대략) |\n|---|---|\n| 구형 | 1.0 |\n| 입방형 | 약 1.08 |\n| 원판형(편평) | 1.5~2.0 이상 |\n| 섬유형 | 방향에 따라 크게 변동 |\n\n### 실무 시사점\n비산먼지·연소재 등은 다공성·불규칙 형상이 많아 공기역학적 직경이 기하학적 직경보다 작게 평가되는 경우가 흔하며, 집진장치 효율평가 시 이를 감안하지 않으면 설계 절단입경과 실제 성능 사이에 괴리가 발생할 수 있다.\n\n### 측정 방법과의 관계\n| 측정기기 | 측정 기준 직경 |\n|---|---|\n| 임팩터(Impactor) | 공기역학적 직경(관성충돌 기반) |\n| 현미경·이미지분석 | 기하학적(투영면적) 직경 |\n| 레이저 산란법 | 광학적 등가직경(굴절률 영향 받음) |\n\n동일 시료라도 측정원리에 따라 산출되는 \"입경\"의 정의가 다르므로, 서로 다른 기기의 측정값을 단순 비교하는 것은 주의가 필요하다."}]},"31":{"day":31,"date":"2026-08-31","title":"Cunningham 보정계수와 항력계수","keywords":[{"k":"Cunningham 보정계수(Cc)","subs":["미세입자(<1㎛)의 슬립 보정","Cc=1+(2λ/d)[1.257+0.4e^(-1.1d/2λ)]","공기 평균자유행로 λ≈0.065㎛"]},{"k":"보정 적용식","subs":["Vt(보정)=Cc×ρp d²g/(18μ)","입경 작을수록 Cc 값 커짐","1㎛ 미만에서 보정 필수"]},{"k":"항력계수(CD) 일반식","subs":["CD=24/Rep(층류)","CD≈24/Rep(1+0.15Rep^0.687)(전이)","CD≈0.44(난류)"]},{"k":"확산·열영동·광영동","subs":["브라운 확산(<0.1㎛ 지배)","열영동(Thermophoresis, 온도구배)","광영동(Photophoresis)"]},{"k":"집진장치 설계 시사점","subs":["0.1~1㎛ 최소효율구간(MPPS)","전기집진기 이론에 Cc 필수 반영","여과지 확산포집과 연계"]}],"answer":"# Cunningham 보정계수와 항력계수\n\n## Ⅰ. 개요\n\nStokes 법칙(Day 30)은 유체를 연속체로 가정하지만, 입자 크기가 공기분자의 평균자유행로에 근접할 만큼 작아지면(대략 1㎛ 미만) 입자가 공기분자 사이를 \"미끄러지듯\" 통과하는 **슬립(slip) 현상**이 발생해 실제 침강속도가 Stokes 식보다 커진다. 이를 보정하는 값이 **Cunningham 보정계수(Cc)**이며, 전기집진장치·여과집진장치 등 미세입자를 다루는 모든 이론에 필수적으로 반영된다. 아울러 입경 전 범위에서 통용되는 **항력계수(Drag Coefficient, CD)**의 일반식 체계를 함께 정리한다.\n\n## Ⅱ. Cunningham 보정계수\n\n### 1. 개념\n공기를 연속체로 보지 않고 분자 수준에서 보면, 입자 크기가 공기분자의 **평균자유행로(mean free path, λ ≈ 0.065㎛, 상온상압)**에 가까워질수록 입자 표면에서의 마찰(항력)이 실제보다 과대평가된다. Cunningham은 이를 보정하는 계수를 제안했다.\n\n### 2. 보정식\n**Cc = 1 + (2λ/d)×[1.257 + 0.4·exp(−1.1d/2λ)]**\n\n- λ: 공기의 평균자유행로(약 0.065㎛, 20℃·1atm 기준)\n- d: 입자 직경\n\n### 3. 보정 적용\n**Vt(보정) = Cc × ρp·d²·g / (18μ)**\n\n즉 Stokes 종말침강속도에 Cc를 곱하여 실제값에 근접시킨다.\n\n| 입경(㎛) | Cc(근사값) | 보정 영향 |\n|---|---|---|\n| 10 | 약 1.02 | 거의 무시 가능 |\n| 1 | 약 1.16 | 약간 영향 |\n| 0.5 | 약 1.32 | 뚜렷한 영향 |\n| 0.1 | 약 2.9 | **매우 큼**(약 3배) |\n| 0.01 | 약 23 | 극히 큼 |\n\n**입경이 1㎛보다 작아질수록 Cc가 급격히 커지므로, 미세입자·나노입자를 다루는 전기집진·여과이론에서는 Cc 보정이 필수**다.\n\n## Ⅲ. 항력계수(Drag Coefficient, CD)의 전영역 정리\n\n| 영역 | Rep 범위 | CD 식 | 물리적 의미 |\n|---|---|---|---|\n| Stokes(층류) | Rep < 1 | CD = 24/Rep | 점성력 지배 |\n| Allen(전이) | 1~1,000 | CD ≈ (24/Rep)(1+0.15Rep^0.687) | 점성+관성 혼재 |\n| Newton(난류) | Rep > 1,000 | CD ≈ 0.44(상수) | 관성력 지배, Vt∝√d |\n\n일반 항력식: **Fd = CD × (π/4)d² × (ρVt²/2)**\n\nStokes 영역(CD=24/Rep)을 대입하면 Fd=3πμdVt로 환원되어 Day 30의 식과 일치함을 확인할 수 있다 — 즉 Stokes 법칙은 항력계수 일반식의 **저Re 극한**에 해당하는 특수해다.\n\n## Ⅳ. 미세입자의 기타 이동기작\n\nCc 보정 외에도 초미세입자·특수조건에서는 아래 기작이 추가로 작용한다.\n\n| 기작 | 지배 입경/조건 | 원리 |\n|---|---|---|\n| 브라운 확산(Brownian Diffusion) | < 0.1㎛ | 분자 열운동에 의한 무작위 이동, 여과지 포집의 핵심 |\n| 열영동(Thermophoresis) | 온도구배 존재 시 | 입자가 고온→저온 방향으로 이동(냉각면 침적) |\n| 광영동(Photophoresis) | 강한 빛 조사 시 | 비대칭 가열로 입자 이동(영향 제한적) |\n| 확산영동(Diffusiophoresis) | 수증기 응축·증발면 | 증기 흐름 방향으로 입자 이동 |\n\n이 중 실무적으로 가장 중요한 것은 **브라운 확산**으로, 0.1~1㎛ 구간(Day 25의 시정장애 지배 입경대와 동일)에서 관성충돌·중력침강·확산 모두가 비효율적이 되어 **최소포집효율입경(MPPS, Most Penetrating Particle Size)**이 형성된다.\n\n## Ⅴ. 집진장치 설계 시사점\n\n1. **전기집진장치**: 입자의 겉보기 이동속도(drift velocity) 산정 시 Cc를 반드시 포함(Day 41 연계)\n2. **여과집진장치**: 0.1~1㎛ 구간이 관성충돌·차단·확산 어느 기작으로도 잘 포집되지 않아 여재 설계 시 이 구간의 통과율을 별도로 검토(Day 37~39 연계)\n3. **사이클론(원심력)**: 고속 회전 유동이므로 Rep가 커 Stokes 영역을 벗어나는 경우가 많아 실측 보정계수 사용이 일반적\n\n## Ⅵ. 전기집진장치 이동속도 산정에서의 활용 예고\n\nDay 41에서 다룰 전기집진장치의 이동속도(drift velocity, we)는 정전기력과 항력(Stokes+Cunningham)의 평형으로 유도된다.\n\n**we = Cc × E × Ep × d / (3πμ)**\n\n| 기호 | 의미 |\n|---|---|\n| E | 하전전계 세기 |\n| Ep | 집진전계 세기 |\n| d | 입자직경 |\n| Cc | Cunningham 보정계수 |\n\n이 식에서 보듯 **Cc가 분자에 직접 곱해지므로, 미세입자일수록 Cc 보정 없이는 이동속도(따라서 집진효율)를 크게 과소평가**하게 된다. 즉 Cunningham 보정은 단순 침강속도 계산을 넘어 전기집진장치 설계의 핵심 변수로 재사용된다.\n\n## Ⅶ. 결론\n\nCunningham 보정계수는 입자가 연속체 가정을 벗어나는 미세입경 영역(특히 1㎛ 미만)에서 Stokes 침강속도를 실제값에 맞게 보정하는 무차원 계수이며, 입경이 작아질수록 그 영향이 기하급수적으로 커진다. 항력계수는 레이놀즈수 전 영역에 걸쳐 Stokes-Allen-Newton 3구간으로 일반화되고, Stokes 법칙은 그 저Re 극한의 특수해임을 이해해야 한다. 미세입자 집진장치 설계는 이 두 보정 개념 없이는 정확한 효율 예측이 불가능하다는 점이 핵심이다.\n","side":[{"title":"Cunningham 보정 적용 계산 예제","body":"### 조건\nd = 0.3㎛인 입자, λ = 0.065㎛, ρp = 1,500 kg/㎥, μ = 1.8×10⁻⁵ kg/m·s\n\n### Cc 계산(간이식 Cc≈1+2λ/d×1.657 근사 사용 시)\nCc ≈ 1 + (2×0.065/0.3)×1.657 ≈ 1 + 0.433×1.657 ≈ **1.72**\n\n### 보정 전후 비교\nVt(Stokes) = ρp·d²·g/(18μ) = (1,500×(3×10⁻⁷)²×9.8)/(18×1.8×10⁻⁵)\n= (1,500×9×10⁻¹⁴×9.8)/(3.24×10⁻⁴) ≈ 4.08×10⁻⁷ m/s\n\nVt(보정) = Cc × Vt(Stokes) ≈ 1.72 × 4.08×10⁻⁷ ≈ **7.0×10⁻⁷ m/s**\n\n→ 보정하지 않으면 실제 침강속도(따라서 전기집진기 이동속도 등)를 약 **42% 과소평가**하게 된다.\n\n### 실무적 의미\n0.3㎛ 부근은 PM2.5 관리에서 중요한 축적모드 입경이므로, 전기집진장치의 포집효율을 정확히 예측하려면 Cc 보정이 반드시 필요하다.\n\n### 입경별 Cc 보정 영향 비교\n| 입경(㎛) | Cc(근사) | 보정 전후 차이 |\n|---|---|---|\n| 5 | 약 1.03 | 3% 내외, 무시 가능 수준 |\n| 1 | 약 1.16 | 16% 내외 |\n| 0.3 | 약 1.72 | 72% 내외(큰 영향) |\n| 0.1 | 약 2.9 | 190% 내외(매우 큼) |\n\n이 표는 미세먼지 관리 대상 입경(PM2.5, PM1.0)일수록 Cunningham 보정의 중요성이 커진다는 점을 정량적으로 보여준다."},{"title":"레이놀즈수 판별과 설계 흐름도","body":"### 설계 시 판별 절차\n```\n1. 대상 입경(d)과 예상 유속(V) 확인\n2. Rep = d·V·ρ/μ 계산\n3. Rep < 1?\n   YES → Stokes 식(CD=24/Rep) 적용, 필요시 Cc 보정(d<1㎛)\n   NO  → Rep < 1,000?\n         YES → Allen 전이식 적용(반복계산 필요, Vt를 가정 후 수렴시킬 것)\n         NO  → Newton 식(CD=0.44) 적용, Vt∝√d\n```\n\n### 반복계산이 필요한 이유\nVt는 Rep 계산에 필요하지만 Rep는 어느 영역인지 판별에 필요하므로, 전이영역에서는 **Vt를 가정 → Rep 계산 → CD 재계산 → Vt 재계산**을 수렴할 때까지 반복하는 것이 정석이다. 기술사 답안에서는 이 반복구조를 언급하는 것만으로도 이해도를 보여줄 수 있다.\n\n### 실무 적용 사례\n- 사이클론 내부 유속(통상 10~20 m/s)에서 10㎛ 입자는 Rep가 1을 초과하는 경우가 많아 단순 Stokes 적용 시 오차 발생 → 실측 기반 보정계수(예: Leith-Licht 모델) 사용이 일반적\n- 전기집진장치 이동속도는 입경이 작고 유속도 느려 대부분 Stokes+Cc 영역에 해당\n- 여과집진장치의 여과속도(통상 1~3 cm/s)도 대체로 층류 영역에 해당하여 Stokes 기반 이론이 유효하게 적용됨\n- 기술사 답안에서는 이 판별 절차를 명시적으로 서술하는 것만으로도 개념 이해도를 보여줄 수 있음"}]},"32":{"day":32,"date":"2026-09-01","title":"1단계 이론·확산·집진 회독 4회차","keywords":[{"k":"시정·산성비","subs":["bext=bsp+bap+bsg+bag, Lv=3.912/bext","산성비 pH<5.6, 임계부하량·PAI","IMPROVE식 EC×10 최대 소멸효율"]},{"k":"광화학반응 체계","subs":["NO₂+hν→NO+O(³P)→O₃","VOC 개입 시 RO₂가 NO→NO₂ 전환","Leighton식 [O₃]=k₁[NO₂]/k₂[NO]"]},{"k":"오존 관리","subs":["VOC-limited vs NOx-limited(EKMA)","NOx 적정효과·주말효과","경보 0.12/0.3/0.5ppm(1h)"]},{"k":"입자 운동 이론","subs":["Stokes Vt=ρpd²g/18μ, Re<1 전제","Cunningham Cc, 1㎛ 미만 급증","CD: 24/Rep→전이→0.44"]},{"k":"입경 정의","subs":["공기역학적 직경(밀도1 환산)","MPPS 0.1~1㎛(모든 기작 비효율)","형상계수로 비구형 보정"]}],"answer":"# 1단계 회독 4회차 — Day 25~31 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간(Day 25~31)은 \"2차 오염물질 생성·확산 현상\"과 \"입자 운동의 물리 기초\"라는 두 축으로 구성된다. 전자는 시정장애·산성비·광화학반응·오존이 하나의 산화·침적 체계로 연결되고, 후자는 Stokes 법칙에서 출발해 이후 모든 집진장치 이론(중력식~전기집진식)의 공통 기반이 된다.\n\n```\n[대기화학 축]\n1차 오염물질(SOx, NOx, VOC)\n   ↓ 광화학반응(OH·라디칼)\n2차 오염물질(O₃, PAN, 황산염, 질산염, SOA)\n   ↓\n시정장애(bext) + 산성비(습·건성 침적)\n   ↓\n오존경보제·환경기준으로 관리\n\n[입자물리 축]\n입자 크기(공기역학적 직경)\n   ↓ 힘의 평형(중력=항력)\nStokes 종말침강속도 Vt=ρpd²g/18μ (Re<1 전제)\n   ↓ 미세입자(<1㎛) 보정\nCunningham 보정계수 Cc\n   ↓ 전 입경 일반화\n항력계수 CD(층류/전이/난류)\n   ↓\n집진장치 설계(중력·원심력·여과·전기집진 공통기반)\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 시정거리 코쉬미더식 | Lv = **3.912/bext** | ☐ |\n| IMPROVE EC 질량소멸효율 | **10** m²/g (최대) | ☐ |\n| IMPROVE 황산염·질산염 효율 | **3**×f(RH) | ☐ |\n| 산성비 정의 pH | **5.6** 미만 | ☐ |\n| 오존 환경기준 | 1h **0.1ppm**, 8h **0.06ppm** | ☐ |\n| 오존경보 주의보/경보/중대경보 | **0.12 / 0.3 / 0.5 ppm**(1h) | ☐ |\n| WHO 오존 권고치(8h, 성수기평균) | 약 **0.05ppm(100㎍/㎥)** | ☐ |\n| Stokes 적용 레이놀즈수 | **Rep < 1** | ☐ |\n| 층류 항력계수 | CD = **24/Rep** | ☐ |\n| 난류 항력계수 | CD ≈ **0.44** | ☐ |\n| 종말침강속도식 | Vt = **ρp d² g / 18μ** | ☐ |\n| 공기 평균자유행로 λ | 약 **0.065㎛** | ☐ |\n| Cunningham 영향 급증 입경 | **1㎛ 미만** | ☐ |\n| 최소포집효율입경(MPPS) | **0.1~1㎛** | ☐ |\n| 공기 점성계수(20℃) | 약 **1.8×10⁻⁵ kg/m·s** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **코쉬미더**: Lv = 3.912/bext\n2. **소멸계수 구성**: bext = bsp+bap+bsg+bag\n3. **Leighton 광정상상태**: [O₃] = k₁[NO₂]/(k₂[NO])\n4. **NOx 적정**: O₃+NO→NO₂+O₂\n5. **PAI**: (SO₄²⁻+NO₃⁻+NH₄⁺) − (Ca²⁺+Mg²⁺+K⁺+Na⁺) [당량]\n6. **Stokes 항력**: Fd = 3πμdVt\n7. **종말침강속도**: Vt = ρp d² g/(18μ)\n8. **일반 항력식**: Fd = CD(π/4)d²(ρVt²/2)\n9. **Cunningham 보정**: Vt(보정) = Cc × Vt(Stokes)\n10. **공기역학적 직경**: da = dg√(ρp/ρ0 × χ)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 오존경보제 vs 환경기준 | 1시간 평균, 단기 대응 | 8시간 평균, 장기 목표 | 평균시간·목적 |\n| VOC-limited vs NOx-limited | NOx 過多, VOC 저감 유효 | VOC 過多, NOx 저감 유효 | EKMA 위치 |\n| Rainout vs Washout | 구름 내 세정 | 구름 밑 세정 | 위치(Day23 연계) |\n| 건성침적 vs 습성침적 | 상시 지속 | 강수 시 집중 | 강수 매개 |\n| Stokes vs Newton 영역 | Re<1, CD=24/Rep | Re>1000, CD≈0.44 | 지배력(점성 vs 관성) |\n| 기하학적 직경 vs 공기역학적 직경 | 실제 형상 기준 | 밀도1 환산 침강속도 기준 | 환산 여부 |\n| 런던형 vs LA형 스모그 | 환원성, 겨울 SO₂+매연 | 산화성, 여름 NOx+VOC | 계절·물질 |\n| Rayleigh vs Mie 산란 | 기체분자, λ⁻⁴ | 입자(0.1~1㎛), 최대효율 | 대상 크기 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 시정장애 현상의 원인과 소멸계수 구성요소를 설명하시오. *(최근 10~25점)*\n2. 산성비의 생성기작과 대책을 설명하시오. *(다수 회차 기출)*\n3. 임계부하량과 PAI를 설명하시오. *(120회 전후 10점)*\n4. 오존 생성의 광화학반응 기작을 NO₂ 광분해부터 설명하시오. *(다수 회차 25점)*\n5. VOC-limited와 NOx-limited 조건에서의 오존 저감 전략 차이를 설명하시오. *(126회 전후 25점)*\n6. 오존경보제의 발령기준과 절차를 설명하시오. *(10점 단골)*\n7. Stokes 법칙을 유도하고 종말침강속도식을 쓰시오. *(다수 회차 10~25점)*\n8. Cunningham 보정계수의 필요성과 적용 범위를 설명하시오. *(114~138회 10점)*\n9. 입자 레이놀즈수에 따른 항력계수 구간을 설명하시오. *(최근 10점)*\n10. 공기역학적 직경과 기하학적 직경의 차이를 설명하시오. *(최근 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(25분)**: Ⅰ의 두 축 흐름도를 그린다.\n2. **식 쓰기(30분)**: Ⅲ의 10개 식, 기호 정의까지 포함해서.\n3. **수치 암기(25분)**: Ⅱ 체크리스트, 5개 이상 틀리면 해당 일자 재독.\n4. **기출 구술(30분)**: Ⅴ의 10문항을 소리 내어 답해본다.\n5. **계산 연습(20분)**: Day 30·31의 Vt 계산 예제를 다른 입경으로 바꿔 다시 풀어본다.\n\n> Stokes 식과 Cunningham 보정은 이후 원심력·여과·전기집진 전 구간에서 재사용된다. 지금 완전히 소화하지 않으면 뒤에서 계속 발목을 잡으므로, 이번 회독에서 반드시 손으로 두 번 이상 유도해 볼 것.\n","side":[{"title":"답안 작성 요령 — 대기화학 vs 입자물리 문제 구분","body":"### 문제 유형 판별\n1. \"생성기작·영향·대책\"류(산성비, 오존, 스모그) → **Ⅰ개요-Ⅱ기작-Ⅲ영향-Ⅳ대책-Ⅴ결론** 구조가 안전\n2. \"법칙·이론 유도\"류(Stokes, Cunningham) → **Ⅰ개요-Ⅱ힘의 평형 유도-Ⅲ적용범위-Ⅳ보정·한계-Ⅴ설계적용-Ⅵ결론** 구조로 유도과정을 명확히\n\n### 표 활용 포인트\n- 대기화학 문제: \"물질별 특징 비교표\"(생성경로·소멸계수·기여도)가 채점자에게 좋은 인상\n- 입자물리 문제: \"영역별 CD·Re 구간표\"는 거의 모든 답안에 재사용 가능한 만능 표\n\n### 흔한 감점 요인\n- 오존경보제와 환경기준의 평균시간을 혼동해서 서술\n- Stokes 식의 적용 전제(Re<1)를 언급하지 않고 무조건 적용\n- 산성비 문제에서 습성침적만 언급하고 건성침적을 누락\n\n### 시간배분 요령(25점 문항 기준)\n| 단계 | 시간 | 내용 |\n|---|---|---|\n| 개요 | 3분 | 정의+출제의도 |\n| 본론 구성 | 2분 | 목차·표 구조 스케치 |\n| 본론 작성 | 30분 | 식·표·비교 포함 |\n| 결론 | 3분 | 요약+개선방향 |\n| 검토 | 2분 | 오탈자·법령명 확인 |\n\n### 표 작성 원칙\n1. 열 개수는 3~4개로 제한(가독성)\n2. 수치는 단위 명시\n3. 비교 대상은 반드시 대구조로 배치(A vs B)"},{"title":"진도 점검 — Day 25~31 자가진단표","body":"| Day | 주제 | 이해도(상/중/하) | 재복습 필요 |\n|---|---|---|---|\n| 25 | 시정장애·소멸계수 | | ☐ |\n| 26 | 산성비 기작·영향·대책 | | ☐ |\n| 27 | 광화학반응·2차오염물질 | | ☐ |\n| 28 | 오존 생성기작·NOx/VOC비 | | ☐ |\n| 29 | 광화학스모그·오존경보제 | | ☐ |\n| 30 | 입자 물리특성·Stokes법칙 | | ☐ |\n| 31 | Cunningham·항력계수 | | ☐ |\n\n### 활용법\n'하' 표시가 2개 이상이면 해당 일자를 재독한 후 다음 구간(Day 33~ 여과·원심력집진)으로 진행할 것을 권장한다. 특히 Day 30~31(Stokes·Cunningham)은 이후 전 집진장치 이론의 기초이므로 '중' 이하라면 반드시 재복습이 필요하다.\n\n### 다음 구간 예고\nDay 33부터는 집진효율 정의(부분집진율·절단입경)를 시작으로 중력식·관성력식·원심력식 집진장치가 이어진다. 오늘 정리한 Vt·CD·Cc 개념이 그대로 사용되므로 연결지어 학습할 것.\n\n### 누적 진도 요약\n| 구간 | Day 범위 | 핵심 축 |\n|---|---|---|\n| 1회독 | 1~8 | 전체 구조 파악 |\n| 2회독 | 9~16 | 확산모델·환경영향평가 |\n| 3회독 | 17~24 | 모델·건강영향평가·자연제거 |\n| 4회독(이번) | 25~32 | 2차오염물질·입자물리 기초 |\n| 다음 구간 | 33~40 | 집진장치 이론(중력~여과) |\n\n### 학습 지속 팁\n매 회독마다 이해도가 오르는 항목과 정체된 항목을 구분해 기록해두면, 마무리 단계(Day 178~194) 총정리 시 취약점 위주로 시간을 배분할 수 있다."}]},"33":{"day":33,"date":"2026-09-02","title":"집진효율·부분집진율·절단입경","keywords":[{"k":"총괄집진효율","subs":["η=(Cin-Cout)/Cin=1-Pt","직렬 다단: ηt=1-Π(1-ηi)","물질수지 기반 산정"]},{"k":"부분집진율(분급효율)","subs":["η(d): 입경별 포집효율 곡선","전체효율=∫η(d)f(d)dd","등급효율곡선(grade efficiency curve)"]},{"k":"절단입경(d50)","subs":["η(d50)=50%인 입경","장치 성능비교의 핵심 지표","작을수록 미세입자 포집 우수"]},{"k":"투과율(Pt)","subs":["Pt=1-η=Cout/Cin","다단직렬 시 Pt끼리 곱함","저투과=고효율"]},{"k":"측정·평가 실무","subs":["등속흡인(isokinetic sampling)","재비산(reentrainment)의 영향","입도분포 가정(Rosin-Rammler)"]}],"answer":"# 집진효율·부분집진율·절단입경\n\n## Ⅰ. 개요\n\n집진장치의 성능은 단일 수치인 총괄집진효율만으로는 온전히 평가할 수 없다. 동일한 총괄효율이라도 어떤 장치는 조대입자만 잘 잡고 미세입자는 통과시킬 수 있기 때문이다. 이에 기술사 시험에서는 총괄집진효율, 입경별 포집성능을 나타내는 **부분집진율(분급효율)**, 그리고 장치 성능비교의 핵심 지표인 **절단입경(cut diameter, d50)**을 구분해 설명할 수 있어야 한다. 이 세 개념은 이후 학습할 모든 집진장치(중력식~전기집진식)의 성능식에 공통으로 사용된다. *(114~138회 다수 10점 기출)*\n\n## Ⅱ. 총괄집진효율과 물질수지\n\n### 1. 정의식\n**η = (Cin − Cout)/Cin = (Win − Wout)/Win = 1 − Pt**\n\n- Cin, Cout: 입구·출구 농도(mg/Sm³)\n- Pt: 투과율(penetration) = Cout/Cin = 1 − η\n\n### 2. 물질수지\nQin·Cin = Qout·Cout + 포집량(회수량)\n\n가스 유량이 장치 통과 전후 크게 변하지 않는다고 가정하면 위 정의식이 성립한다. 다만 벤투리스크러버처럼 세정수 첨가로 유량 변화가 큰 경우 유량 보정이 필요하다.\n\n### 3. 직렬(다단) 연결 시 총괄효율\n**ηtotal = 1 − (1−η1)(1−η2)···(1−ηn)**\n\n동일하게 투과율로 표현하면 **Pt(total) = Pt1 × Pt2 × ··· × Ptn** — 즉 직렬 연결의 투과율은 각 단 투과율의 곱이다. 예를 들어 전처리 사이클론(η1=70%) 후 여과집진기(η2=99%)를 직렬 배치하면 총괄효율은 1-(0.3×0.01)=99.7%로, 개별 장치보다 크게 향상된다.\n\n## Ⅲ. 부분집진율(분급효율)과 절단입경\n\n### 1. 등급효율곡선(Grade Efficiency Curve)\n총괄효율은 입경분포에 따라 달라지는 값이므로, 장치 고유의 성능은 **입경별 포집효율 η(d)**로 나타내는 것이 정확하다. η(d)를 입경(d)에 대해 그린 곡선이 등급효율곡선이며, 일반적으로 입경이 클수록 η(d)가 증가하는 S자형을 보인다.\n\n### 2. 절단입경(d50)\n**η(d50) = 50%**가 되는 입경을 절단입경이라 한다. 절단입경이 작을수록 미세입자까지 잘 포집하는 고성능 장치이며, 사이클론·전기집진기 등 서로 다른 원리의 장치 성능을 비교하는 공통 지표로 사용된다.\n\n| 집진장치 | 일반적 절단입경(d50) 범위 |\n|---|---|\n| 중력집진장치 | 약 50㎛ 이상 |\n| 관성력집진장치 | 약 10~20㎛ |\n| 원심력집진장치(사이클론) | 약 5~15㎛ |\n| 세정집진장치(벤투리) | 약 0.5~5㎛ |\n| 여과집진장치 | 약 0.1~1㎛ 이하 |\n| 전기집진장치 | 약 0.1㎛ 이하 |\n\n### 3. 종합효율과 입도분포의 관계\n전체 총괄효율은 입경별 효율을 입도분포로 가중평균한 값이다.\n\n**η(total) = ∫ η(d)·f(d) dd**\n\n- f(d): 입경별 질량분율(입도분포함수, 통상 Rosin-Rammler 분포로 가정)\n\n즉 같은 장치라도 유입 분진의 입도분포가 미세할수록(작은 입자 비중이 높을수록) 총괄효율은 낮아진다. 이 때문에 배출허용기준 준수 여부를 판단할 때는 처리 대상 분진의 입도분포 특성을 반드시 함께 검토해야 한다.\n\n## Ⅳ. 실무 적용상 유의사항\n\n1. **재비산(reentrainment)**: 일단 포집된 입자가 진동·고속기류·타격(rapping) 등에 의해 재비산하면 겉보기 총괄효율이 저하된다. 전기집진장치의 타격 재비산, 여과집진장치의 탈진 시 재비산이 대표적이다.\n2. **등속흡인(isokinetic sampling)**: 굴뚝 배출가스 시료채취 시 채취관 입구 유속을 덕트 내 유속과 동일하게 맞추지 않으면 입경이 큰 입자일수록 채취 오차가 커져 효율 측정값이 왜곡된다. *(대기오염공정시험기준 배출가스 중 먼지 측정 연계)*\n3. **압력손실과의 상충관계**: 절단입경을 낮추려면(미세입자 포집효율을 높이려면) 대개 유속 증가·압력손실 증가가 수반되므로, 효율과 운전비용은 상충관계(trade-off)에 있다.\n4. **다단직렬 설계 시 부하배분**: 앞단(전처리) 집진장치의 절단입경이 크면 뒷단 장치가 미세입자 부하를 전담하게 되어 뒷단의 압력손실·유지비가 급증할 수 있다.\n\n## Ⅴ. 배출허용기준과의 연계\n\n「대기환경보전법 시행규칙」 별표에서 정하는 먼지 배출허용기준은 총량(mg/Sm³) 기준으로 규정되어 있으나, 실제 인허가 협의 과정에서는 PM2.5·PM10 저감 목표에 따라 입경별 저감효과(부분집진율)를 함께 요구하는 경우가 늘고 있다. 따라서 배출시설 설치허가 신청 시 총괄효율뿐 아니라 대상 집진장치의 절단입경 자료(제작사 성능시험성적서 등)를 함께 제출하는 것이 실무상 유리하다.\n\n또한 총괄효율은 측정 시점의 입도분포에 따라 달라질 수 있으므로, 인허가 협의 시 \"설계 입도분포 조건\"을 명시하지 않으면 준공 후 자가측정 결과가 예상보다 낮게 나오는 분쟁이 발생할 수 있다. 이 경우 등급효율곡선 자료를 근거로 입도분포 차이를 설명하는 것이 기술적 대응방법이 된다.\n\n## Ⅵ. 결론\n\n집진장치의 성능평가는 총괄집진효율(물질수지 기반)과 입경별 부분집진율(등급효율곡선), 그리고 두 지표를 대표하는 절단입경(d50)을 함께 고려해야 정확하다. 향후 학습할 개별 집진장치의 효율식은 모두 이 세 개념의 구체화이므로, 각 장치별 절단입경 산정식과 그 지배인자(입경, 밀도, 유속, 점성계수)를 연결지어 이해하는 것이 60점 합격 전략의 핵심이다.\n","side":[{"title":"등급효율곡선 계산 예제","body":"### 조건\n어느 집진장치의 입경별 효율이 다음과 같다.\n\n| 입경(㎛) | 질량분율 f(d) | 효율 η(d) |\n|---|---|---|\n| 1 | 0.10 | 30% |\n| 5 | 0.30 | 70% |\n| 10 | 0.35 | 90% |\n| 20 | 0.25 | 99% |\n\n### 종합효율 계산\nη(total) = Σ f(d)·η(d)\n= (0.10×0.30)+(0.30×0.70)+(0.35×0.90)+(0.25×0.99)\n= 0.030+0.210+0.315+0.2475\n= **약 80.3%**\n\n### 해석\n입경 1㎛ 구간의 효율(30%)이 가장 낮지만 질량분율이 작아 전체효율에 미치는 영향은 제한적이다. 반대로 미세먼지(PM2.5) 규제 강화 시에는 질량 기준이 아닌 **개수(number) 기준** 효율도 함께 검토해야 하며, 이 경우 미세입경 구간의 낮은 효율이 훨씬 크게 부각된다.\n\n### 실무 시사점\n같은 총괄효율 80%라도 조대입자 위주로 포집했는지, 미세입자까지 고르게 포집했는지에 따라 PM2.5 저감효과는 전혀 다르다. 배출시설 인허가 시 총괄효율뿐 아니라 절단입경 자료를 함께 요구하는 이유가 여기에 있다.\n\n### 개수기준 효율과의 차이\n질량기준 종합효율이 80%로 높더라도, 입자 개수(number count) 기준으로 환산하면 미세입자의 개수 비중이 압도적으로 크기 때문에 개수기준 효율은 이보다 훨씬 낮게 나타난다. 최근 초미세먼지·나노입자 규제 논의에서는 질량기준과 개수기준 효율을 함께 제시하는 추세이므로, 답안 작성 시 이 차이를 언급하면 최신성을 어필할 수 있다.\n\n| 기준 | 특징 | 관리 관점 |\n|---|---|---|\n| 질량기준(mg/Sm³) | 현행 배출허용기준의 기본 단위 | 법적 준수 판단 |\n| 개수기준(#/cm³) | 초미세입자 비중 민감 | 건강영향평가 보조지표 |"},{"title":"직렬 다단 집진 총괄효율 계산 예제","body":"### 조건\n사이클론(η1=75%) → 여과집진기(η2=98%) 직렬 배치\n\n### 계산\nPt1 = 1-0.75 = 0.25\nPt2 = 1-0.98 = 0.02\nPt(total) = Pt1×Pt2 = 0.25×0.02 = 0.005\nηtotal = 1-0.005 = **99.5%**\n\n### 만약 순서를 바꾼다면?\n여과집진기를 앞단에 두면 조대입자·고농도 분진이 여과지에 직접 부하를 주어 폐색(blinding)·마모가 촉진되므로, 실무에서는 **저효율·저비용 장치를 전처리로 앞단에, 고효율 장치를 후단에** 배치하는 것이 원칙이다.\n\n### 3단 직렬 확장\n중력집진(η=50%) → 사이클론(η=80%) → 여과집진(η=99%)\nPt(total) = 0.5×0.2×0.01 = 0.001\nηtotal = **99.9%**\n\n이처럼 전처리 단계를 추가할수록 후단 고효율 장치의 부하(먼지농도·마모·폐색 속도)를 크게 낮출 수 있어, 실제 현장에서는 단일 고성능 장치보다 다단 직렬 조합이 경제적인 경우가 많다.\n\n### 설계 시 유의점\n| 배치 원칙 | 이유 |\n|---|---|\n| 저효율→고효율 순서 | 후단 부하 저감, 수명 연장 |\n| 조대입자 전처리 우선 | 고효율 장치 마모·폐색 방지 |\n| 단별 압력손실 누적 고려 | 송풍기 용량 결정에 반영 |"}]},"34":{"day":34,"date":"2026-09-03","title":"중력식·관성력식 집진장치","keywords":[{"k":"중력집진장치 원리","subs":["중력 vs 항력 평형, Stokes 종말속도","침강실 체류시간 확보가 핵심","다단선반형(Howard)으로 효율 향상"]},{"k":"중력집진 효율식","subs":["η=Vt·L/(H·V) (이상적 층류가정)","Q=A·Vt (침강가능 최대유량)","다단화 시 유효면적 n배 증가"]},{"k":"관성력집진장치 원리","subs":["유동방향 급변으로 관성분리","배플(baffle)·루버형 구조","조대입자(10㎛ 이상) 위주 포집"]},{"k":"설계 인자","subs":["처리가스 유속(저속 유지 필요)","침강실 길이·높이·단수","압력손실은 두 장치 모두 낮음(10~50mmH2O)"]},{"k":"적용·한계","subs":["전처리(pre-cleaner) 용도가 일반적","미세입자 포집 불가(d50 10~50㎛)","설치면적 크고 유지관리 간단"]}],"answer":"# 중력식·관성력식 집진장치\n\n## Ⅰ. 개요\n\n중력식·관성력식 집진장치는 별도의 동력이나 복잡한 기구 없이 입자에 작용하는 **중력** 또는 **관성력**만으로 가스류에서 입자를 분리하는 가장 단순한 구조의 집진장치다. 압력손실이 낮고 유지관리가 쉬운 반면 절단입경이 커서(10㎛ 이상) 단독으로는 배출허용기준을 만족시키기 어려워, 실무에서는 주로 고농도·조대입자 함유 가스의 **전처리(pre-cleaner)** 용도로 사용된다. *(114~138회 10점 기출 다수)*\n\n## Ⅱ. 중력집진장치(Gravity Settling Chamber)\n\n### 1. 원리\n가스 유속을 크게 낮춰 침강실 내 체류시간을 확보하면, 입자에 작용하는 **중력(침강)과 항력(부력+유체저항)이 평형**을 이루는 Stokes 종말침강속도(Vt=ρp·d²·g/18μ, Day 30)로 입자가 서서히 가라앉아 바닥에 퇴적된다.\n\n### 2. 효율식\n침강실 길이 L, 높이 H, 처리가스 수평유속 V, 종말침강속도 Vt일 때, 입자가 침강실을 통과하는 동안 바닥까지 도달할 조건은 체류시간(L/V) ≥ 침강시간(H/Vt)이다.\n\n**η = Vt·L/(H·V)** (η≥1이면 100% 포집)\n\n처리 가능 최대유량 기준으로는 **Q = A·Vt** (A: 침강실 바닥 투영면적)로 나타낼 수 있다 — 즉 처리유량은 침강실의 **바닥면적에만 비례**하고 높이·길이에는 무관하다는 것이 핵심 설계 원리다.\n\n### 3. 다단선반형(Howard형)\n침강실 내부에 수평 선반을 n단 설치하면 유효 침강면적이 n배로 늘어 동일 설치면적에서 처리유량 또는 효율을 크게 높일 수 있다.\n\n**Q(다단) = n·A·Vt**\n\n| 구분 | 단일형 | 다단선반형(Howard) |\n|---|---|---|\n| 유효면적 | A | n×A |\n| 처리유량(동일효율기준) | 기준 | n배 |\n| 청소 난이도 | 쉬움 | 단수만큼 증가 |\n| 설치높이 | 낮음 | 높음 |\n\n## Ⅲ. 관성력집진장치(Inertial Collector)\n\n### 1. 원리\n가스 유동경로에 배플(baffle)·루버(louver) 등 급격한 방향전환 구조를 두면, 관성이 큰 입자(질량이 큰 조대입자)는 관성 때문에 유선을 따라가지 못하고 직진하여 분리·포집되고, 관성이 작은 가스·미세입자는 유선을 따라 방향을 바꿔 빠져나간다.\n\n### 2. 설계 요소\n- **방향전환 각도**: 급격할수록 분리효율은 높아지나 압력손실도 증가\n- **배플 간격·단수**: 다단 배치로 효율 향상 가능\n- **유속**: 지나치게 빠르면 재비산(포집된 입자가 다시 날림) 발생\n\n## Ⅳ. 두 장치의 비교 및 적용상 유의점\n\n| 구분 | 중력집진장치 | 관성력집진장치 |\n|---|---|---|\n| 분리력 | 중력 | 관성력(방향전환) |\n| 절단입경(d50) | 약 50㎛ 이상 | 약 10~20㎛ |\n| 압력손실 | 매우 낮음(10~30mmH2O) | 낮음(30~70mmH2O) |\n| 설치면적 | 매우 큼 | 중간 |\n| 주 용도 | 대형 소각로·보일러 전처리 | 사이클론 전단 전처리 |\n| 청소주기 | 김 | 짧음(배플 폐색 우려) |\n\n### 적용상 유의점\n1. 단독 사용 시 대기환경보전법령상 배출허용기준(먼지) 준수가 어려운 경우가 대부분이므로, 반드시 후단에 사이클론·여과·전기집진 등 고효율 장치를 직렬 연결한다.\n2. 침강실 내 유속이 너무 빠르면 이미 침강한 입자가 재비산하므로, 설계유속은 통상 1~2m/s 이하로 제한한다.\n3. 관성력집진장치는 배플 표면 마모·폐색이 발생하기 쉬워 정기적인 점검이 필요하다.\n\n## Ⅴ. 개선형 구조와 최근 적용 동향\n\n기본형 중력·관성력집진장치의 낮은 효율을 보완하기 위해 다음과 같은 개선 구조가 실무에 적용된다.\n\n| 개선형 | 방식 | 효과 |\n|---|---|---|\n| 다단선반형(Howard) | 수평 선반 다단 설치 | 유효침강면적 확대, 동일 설치면적에서 효율 향상 |\n| 지그재그형 배플 | 배플을 지그재그 배치 | 방향전환 횟수 증가로 관성분리 강화 |\n| 습식 병용형 | 침강실 내 살수 병행 | 미세입자 응집·부착 촉진 |\n\n최근에는 소각시설·발전소의 온실가스·미세먼지 동시저감 요구에 따라 단독 전처리 장치보다는 **다단직렬 시스템의 첫 단**으로만 위치를 한정하고, 상세설계 단계에서부터 후단 장치와의 압력손실 배분을 통합 검토하는 추세다.\n\n### 관성력집진장치 배플 형상별 비교\n| 배플 형상 | 방향전환 각도 | 압력손실 | 절단입경 |\n|---|---|---|---|\n| 단순판형 | 완만(30~45°) | 낮음 | 큼(20㎛ 내외) |\n| 지그재그형 | 급격(60~90° 반복) | 중간 | 중간(10~15㎛) |\n| 루버형(다공) | 급격+분산 | 다소 높음 | 작음(10㎛ 내외) |\n\n배플 형상을 급격하게 설계할수록 절단입경은 작아지지만 압력손실이 함께 증가하므로, 관성력집진장치 역시 사이클론과 마찬가지로 효율-압력손실 상충관계가 성립한다는 점을 답안에서 함께 언급하면 좋은 평가를 받을 수 있다.\n\n## Ⅵ. 결론\n\n중력식·관성력식 집진장치는 구조가 단순하고 압력손실이 낮아 유지비 부담이 적은 반면, 절단입경이 10~50㎛로 커서 미세먼지 규제에는 대응할 수 없다. 따라서 실무 설계에서는 이들을 **고농도 조대입자의 전처리 장치**로 규정하고, 다음 학습할 원심력집진장치(Day 35~36) 이후 고효율 장치와의 직렬 조합을 전제로 설계하는 것이 원칙이다.\n","side":[{"title":"중력집진장치 설계 계산 예제","body":"### 조건\n처리유량 Q=10㎥/s, 입자밀도 ρp=1,800kg/㎥, 대상 최소입경 d=40㎛, 공기점성계수 μ=1.8×10⁻⁵kg/m·s\n\n### 1. 종말침강속도 계산\nVt = ρp·d²·g/(18μ)\n= (1,800×(4×10⁻⁵)²×9.8)/(18×1.8×10⁻⁵)\n= (1,800×1.6×10⁻⁹×9.8)/(3.24×10⁻⁴)\n≈ **0.087 m/s**\n\n### 2. 필요 침강실 바닥면적\nQ = A·Vt → A = Q/Vt = 10/0.087 ≈ **115㎡**\n\n### 3. 다단선반형(5단) 적용 시\nA(5단) = 115/5 = **23㎡**\n\n동일 유량·효율 조건에서 설치 바닥면적을 1/5로 줄일 수 있음을 확인할 수 있다. 다만 5단 구조는 청소·유지관리 접근성이 떨어지므로 대형 발전소 등에서는 자동 스크레이퍼 방식을 병행한다.\n\n### 설계 시 확인사항\n| 항목 | 권장범위 |\n|---|---|\n| 수평유속 | 1~2 m/s 이하(재비산 방지) |\n| 침강실 L/H 비 | 통상 5~10 이상 |\n| 청소주기 | 분진 발생량에 따라 결정 |\n\n### 참고: 대상입경을 20㎛로 낮출 경우\nd=20㎛로 재계산하면 Vt는 (20/40)²=1/4배로 감소해 약 0.022m/s가 되고, 필요면적은 4배(약 460㎡)로 급증한다. 이는 중력집진장치가 입경이 작아질수록 설치면적 부담이 기하급수적으로 커져 미세입자 대응에 근본적으로 부적합함을 정량적으로 보여준다."},{"title":"전처리 장치 선정 흐름도와 실무 사례","body":"### 전처리 장치 선정 절차\n```\n1. 유입 분진 특성 확인\n   - 농도(g/Sm³), 입도분포, 부착성·점착성 여부\n2. 조대입자(50㎛ 이상) 비중이 큰가?\n   YES → 중력집진장치(1차) 검토\n   NO  → Q3\n3. 10~50㎛ 구간 비중이 큰가?\n   YES → 관성력집진장치 또는 사이클론(Day 35) 검토\n   NO  → 전처리 생략, 고효율 장치 직접 적용\n4. 후단 고효율장치(여과·전기집진) 보호 목적 확인\n   → 전처리 필수 여부 최종 결정\n```\n\n### 실무 적용 사례\n- 소각시설: 중력집진(비산재 조대분) → 반건식반응탑 → 여과집진기(백필터) 순서\n- 시멘트 킬른: 사이클론(전처리, 조대분) → 전기집진기 또는 백필터\n- 목재가공 집진: 관성력집진(톱밥·대형 부스러기) → 사이클론 → 백필터\n\n### 전처리 생략 시 문제점\n전처리 없이 고농도 조대분진을 곧바로 여과집진기에 유입시키면 여과포 마모·폐색이 급격히 진행되어 교체주기가 단축되고, 압력손실 상승에 따른 송풍기 동력비 증가로 이어진다. 따라서 배출시설 설치허가 신청 시 전처리 장치의 적정성도 함께 검토 대상이 된다.\n\n### 인허가 협의 시 체크포인트\n| 확인사항 | 근거 |\n|---|---|\n| 전처리 장치 단독 운영 여부 | 배출허용기준 미달 우려 시 후단 장치 추가 요구 |\n| 청소·유지관리 계획서 | 배플·선반 폐색에 따른 성능저하 방지 |\n| 재비산 방지 설계(유속 제한) | 겉보기 효율과 실측 효율 괴리 방지 |"}]},"35":{"day":35,"date":"2026-09-04","title":"원심력집진장치 원리와 설계","keywords":[{"k":"사이클론 원리","subs":["접선유입→선회류→원심력 분리","중력의 수백~수천배 원심력","단일형·병렬형(멀티사이클론)"]},{"k":"주요 구조 형식","subs":["접선유입식·축류식(vane형)","단일사이클론 vs 멀티사이클론","dust hopper 재비산 방지 구조"]},{"k":"절단입경식(Lapple)","subs":["dpc=√(9μW/(2πNeVi(ρp-ρ)))","Ne: 유효회전수(통상 5~10)","W: 유입구 폭"]},{"k":"압력손실","subs":["ΔP=ξ·(ρV²/2)","ξ: 속도두수(통상 6~10)","고효율형일수록 ΔP 큼"]},{"k":"설계인자 영향","subs":["직경 작을수록 절단입경 감소","유입속도 증가 시 효율↑ 압손↑","직렬(멀티)배치로 효율 향상"]}],"answer":"# 원심력집진장치(사이클론) 원리와 설계\n\n## Ⅰ. 개요\n\n원심력집진장치(사이클론, Cyclone)는 함진가스를 원통 내부로 접선 방향으로 유입시켜 강제 선회류를 형성함으로써, 입자에 작용하는 **원심력이 중력의 수백~수천 배**에 달하게 하여 조대~중간 입경(5~15㎛)의 입자를 분리하는 장치다. 구조가 비교적 단순하고 압력손실 대비 효율이 우수해 전처리 또는 단독 집진장치로 널리 사용되며, 후단 여과·전기집진장치와의 직렬 조합에서 필수적인 전처리 단으로도 활용된다. *(다수 회차 10~25점 기출)*\n\n## Ⅱ. 원리 및 구조\n\n### 1. 분리 원리\n접선 방향으로 유입된 가스는 원통 내벽을 따라 나선형으로 하강하는 **외선회류**를 형성하고, 원통 하부(dust hopper)에서 방향을 바꿔 중심축을 따라 상승하는 **내선회류**로 배출된다. 이 과정에서 입자에 작용하는 원심력이 항력(유체저항)보다 커지면 입자는 벽면 쪽으로 밀려나 낙하·포집된다.\n\n### 2. 힘의 평형\n원심력 Fc = m·v²/r = (π/6)d³ρp·v²/r\n\n항력(Stokes) Fd = 3πμd·Vr (Vr: 반경방향 이동속도)\n\n두 힘이 평형을 이룰 때의 반경방향 이동속도가 입자의 분리 여부를 결정한다.\n\n### 3. 분리계수(Separation Factor, S)\n**S = v²/(r·g)**\n\n중력 대비 원심력의 비를 나타내며, 사이클론은 통상 S=5~2,500 범위(직경·유속에 따라 상이)로, 값이 클수록 미세입자 분리 능력이 향상된다.\n\n## Ⅲ. 절단입경(Lapple식)과 압력손실\n\n### 1. 절단입경 산정식\n**dpc = √[9μW / (2πNeVi(ρp−ρ))]**\n\n| 기호 | 의미 |\n|---|---|\n| μ | 가스 점성계수 |\n| W | 유입구 폭 |\n| Ne | 유효 회전수(effective number of turns, 통상 5~10) |\n| Vi | 유입 속도 |\n| ρp, ρ | 입자밀도, 가스밀도 |\n\n식에서 보듯 **유입구 폭(W)이 좁을수록, 유효회전수·유입속도가 클수록 절단입경은 작아져 효율이 향상**된다.\n\n### 2. 압력손실\n**ΔP = ξ·(ρV²/2)**\n\nξ(속도두수, velocity head number)는 사이클론 형식에 따라 통상 6~10이며, 고효율형(직경이 작고 유효회전수가 많은 형식)일수록 ξ가 커 압력손실도 증가한다.\n\n| 형식 | 절단입경 | 압력손실(속도두 ξ) | 특징 |\n|---|---|---|---|\n| 표준형(Conventional) | 10~15㎛ | 6~8 | 범용, 저압손 |\n| 고효율형(High-efficiency) | 5~8㎛ | 8~10 | 소구경·다단, 압손 큼 |\n| 고용량형(High-throughput) | 15~20㎛ | 3~6 | 대유량, 저효율 |\n\n## Ⅳ. 설계인자의 영향 및 실무 적용\n\n### 1. 주요 설계인자와 효율의 관계\n| 인자 | 변화 | 효율 | 압력손실 |\n|---|---|---|---|\n| 사이클론 직경(D) | 감소 | 증가 | 증가 |\n| 유입속도(Vi) | 증가 | 증가(한계 있음) | 증가 |\n| 원통부 길이 | 증가 | 증가 | 소폭 증가 |\n| 유효회전수(Ne) | 증가 | 증가 | 증가 |\n\n유입속도는 무한정 높인다고 효율이 계속 증가하지 않으며, 일정 속도(통상 20~25m/s) 이상에서는 난류 증가·재비산으로 오히려 효율이 저하되는 **한계유속(saltation velocity)** 특성이 있다.\n\n### 2. 병렬·직렬 배치(멀티사이클론)\n소구경 사이클론을 다수 병렬 배치(멀티사이클론)하면 개별 사이클론의 높은 효율(작은 직경 효과)을 유지하면서 대유량을 처리할 수 있어, 대형 보일러·소각로에서 널리 채택된다.\n\n### 3. 실무 유의점\n1. **더스트 호퍼 기밀 유지**: 하부 호퍼에서 외기가 유입되면 내선회류가 교란되어 효율이 급격히 저하된다.\n2. **점착성 분진 부적합**: 벽면에 부착·고화되는 분진은 사이클론 성능을 저하시키므로 사전 검토 필요.\n3. **마모 관리**: 고농도·경질 입자는 벽면 마모를 유발하므로 내마모 라이닝 적용을 검토한다.\n\n## Ⅴ. 습식 사이클론과 특수 형식\n\n건식 사이클론의 효율 한계를 보완하기 위해 원통 내벽에 물을 살수하여 분리된 입자를 세정·부착시키는 **습식 사이클론(wet cyclone)**도 실무에서 사용된다. 습식 형식은 미세입자 포집효율이 향상되고 폭발성 분진의 화재위험을 낮출 수 있으나, 폐수처리 부담이 추가로 발생하므로 대상 공정의 수처리 여건을 함께 검토해야 한다.\n\n또한 축류식(vane-axial) 사이클론은 접선유입 대신 나선형 안내날개(vane)로 선회류를 형성해 압력손실을 낮추면서도 비교적 균일한 유동분포를 얻을 수 있어, 대유량·저압손 조건이 요구되는 현장에 적용된다.\n\n| 형식 | 유입방식 | 특징 |\n|---|---|---|\n| 접선유입식 | 원통 측면 접선 유입 | 구조 단순, 가장 일반적 |\n| 축류식(vane형) | 안내날개로 선회 유도 | 압력손실 낮음, 균일 유동 |\n| 습식 사이클론 | 살수 병행 | 미세입자 효율 향상, 폭발위험 저감, 폐수 발생 |\n\n## Ⅵ. 결론\n\n원심력집진장치는 접선유입에 의한 선회류로 원심력을 발생시켜 조대~중간입경 입자를 분리하며, 절단입경은 Lapple식에 따라 유입구 폭·유효회전수·유입속도·입자밀도차의 함수로 결정된다. 압력손실과 효율은 상충관계이므로, 설계 시 목표 배출기준과 허용 압력손실을 함께 고려해 형식(표준형/고효율형/고용량형)과 단일·병렬 배치를 선정해야 한다.\n","side":[{"title":"사이클론 절단입경 계산 예제","body":"### 조건\nW=0.3m, Ne=6, Vi=15m/s, ρp=2,000kg/㎥, ρ=1.2kg/㎥, μ=1.8×10⁻⁵kg/m·s\n\n### 계산\ndpc = √[9μW/(2πNeVi(ρp−ρ))]\n= √[(9×1.8×10⁻⁵×0.3)/(2π×6×15×(2,000−1.2))]\n= √[(4.86×10⁻⁵)/(2×3.1416×6×15×1998.8)]\n= √[(4.86×10⁻⁵)/(1,130,000)]\n≈ √(4.30×10⁻¹¹)\n≈ **6.6×10⁻⁶ m ≈ 6.6㎛**\n\n### 해석\n이 조건에서 절단입경은 약 6.6㎛로 고효율형 사이클론 수준이다. 만약 유입구 폭(W)을 절반으로 줄이면 dpc는 1/√2 ≈ 0.71배로 감소해 약 4.7㎛까지 향상되나, 유입구가 좁아지면 압력손실이 함께 증가하므로 송풍기 동력비와의 균형을 검토해야 한다.\n\n### 유효회전수(Ne) 변화 영향\n| Ne | dpc(㎛) 상대값 |\n|---|---|\n| 5 | 기준×1.10 |\n| 6 | 기준×1.00 |\n| 8 | 기준×0.87 |\n| 10 | 기준×0.77 |\n\n### 설계 활용\n이 계산 절차는 시험 답안에서 \"조건을 대입해 dpc를 산정하고, 설계변수(W, Ne, Vi) 변화에 따른 민감도를 함께 제시\"하는 방식으로 응용하면 계산형 문제(10~25점)에 효과적으로 대응할 수 있다."},{"title":"멀티사이클론 설계 개념과 실무 사례","body":"### 멀티사이클론의 원리\n동일 유량을 큰 사이클론 1기로 처리하는 대신, 소구경 사이클론 N기를 병렬 배치하면 각 유닛의 처리유량은 1/N로 줄어 유입속도를 유지하면서도 직경이 작아 절단입경이 낮아지는 효과를 얻는다.\n\n### 설계 절차\n```\n1. 총 처리유량(Q총) 확인\n2. 목표 절단입경 설정 → 요구 사이클론 직경(D) 결정\n3. 단위 사이클론 처리유량(q) = Vi × 유입구 면적\n4. 필요 병렬 개수 N = Q총 / q\n5. 공통 입구·출구 매니폴드 설계(유량 균등분배 확인)\n6. 개별 유닛 호퍼 기밀성 확보\n```\n\n### 실무 사례\n- 대형 유동층보일러: 비산재 회수용 멀티사이클론(수십~수백 기 병렬) 후단에 백필터 배치\n- 시멘트 원료분쇄 공정: 사이클론 회수분을 공정으로 재투입(자원순환) 후 잔여가스만 후단 처리\n- 목재펠릿 제조: 사이클론 단독으로 배출허용기준(먼지) 충족이 어려워 반드시 백필터 후단 병행\n\n### 유량 불균등 분배 시 문제점\n매니폴드 설계가 부적절하면 일부 유닛에 유량이 집중되어 해당 유닛의 유입속도가 과도해지고, 반대로 유량이 적은 유닛은 효율이 저하되어 전체 시스템 효율이 설계치보다 낮게 나타나는 경우가 실무에서 흔히 발생한다.\n\n### 병렬유닛 수와 개별 유닛 처리유량의 관계\n| 병렬 유닛 수(N) | 유닛당 처리유량 | 유닛 직경(상대) | 절단입경 경향 |\n|---|---|---|---|\n| 1 | 100% | 기준(대) | 큼 |\n| 4 | 25% | 1/2배 | 중간 |\n| 16 | 6.25% | 1/4배 | 작음(미세입자 유리) |\n\n유닛 수를 늘릴수록 절단입경은 향상되지만 초기투자비·배관 복잡도가 함께 증가하므로, 목표 배출농도와 경제성을 함께 고려한 최적점 선정이 실무의 핵심 과제다."}]},"36":{"day":36,"date":"2026-09-05","title":"원심력집진장치 효율인자·분리계수","keywords":[{"k":"분리계수(S)","subs":["S=v²/(rg), 중력 대비 원심력 비","S 클수록 미세입자 분리 유리","직경 작을수록 S 증가"]},{"k":"한계유속(Saltation velocity)","subs":["Vs 초과 시 재비산 급증","Vi/Vs 비율로 설계 적정성 판단","통상 유입속도 15~25m/s 권장"]},{"k":"압력손실-효율 상충","subs":["ΔP∝V², 효율∝V(일정범위)","유속 과다시 효율 오히려 저하","경제적 최적유속 존재"]},{"k":"직경·형상비 영향","subs":["직경↓→분리계수↑→효율↑","원통부/원추부 길이비 영향","입구형상(접선/와류형)별 차이"]},{"k":"운전 유지관리 요인","subs":["호퍼 기밀 누기 시 효율 급락","마모·부식에 따른 성능저하","분진 재비산·응집 영향"]}],"answer":"# 원심력집진장치 효율인자·분리계수\n\n## Ⅰ. 개요\n\nDay 35에서 사이클론의 기본 원리와 절단입경 산정식(Lapple식)을 다뤘다면, 이번 학습은 효율에 영향을 미치는 **분리계수(S)**, **한계유속(saltation velocity)**, 압력손실-효율의 상충관계 등 실제 설계·운전 시 효율을 좌우하는 세부 인자를 정리한다. 기술사 시험에서는 이 인자들을 정성적으로 서술하는 문제와 함께, 설계변경이 효율에 미치는 영향을 논리적으로 설명하는 문제가 자주 출제된다. *(120회 전후 10~25점 기출)*\n\n## Ⅱ. 분리계수(Separation Factor)\n\n### 1. 정의식\n**S = v²/(r·g)**\n\n- v: 접선방향 선회속도\n- r: 선회반경(사이클론 반경)\n- g: 중력가속도\n\n분리계수는 입자에 작용하는 원심력이 중력의 몇 배인지를 나타내는 무차원수로, 사이클론의 근본적인 분리능력을 표현하는 지표다. 일반 사이클론은 S=5~2,500 범위이며, 소형 고효율 사이클론일수록 S가 커진다.\n\n### 2. 분리계수와 절단입경의 관계\nS가 클수록(즉 반경이 작거나 선회속도가 빠를수록) 동일한 항력에 대해 더 작은 입자까지 분리할 수 있어 절단입경이 작아진다. 이는 Lapple식에서 분모의 Vi(유입속도)가 클수록, 분모 항 전체에 포함된 반경 관련 인자가 작을수록 dpc가 작아지는 것과 같은 맥락이다.\n\n## Ⅲ. 한계유속(Saltation Velocity)과 재비산\n\n### 1. 개념\n사이클론 벽면에 일단 분리된 입자층이라도, 벽면 근처 유속이 특정 임계치(saltation velocity, Vs)를 초과하면 벽면의 입자가 다시 가스류로 튕겨 올라가는 **재비산(reentrainment)**이 발생해 효율이 급격히 저하된다.\n\n### 2. 유속과 효율의 관계(정성적)\n| 유입속도(Vi) 구간 | 효율 경향 | 비고 |\n|---|---|---|\n| 저속(권장범위 미만) | 효율 낮음 | 원심력 부족 |\n| 적정속도(15~25m/s) | 효율 최대 | 설계 권장범위 |\n| 과속(Vs 초과) | 효율 오히려 저하 | 재비산·난류 증가 |\n\n즉 유입속도를 무조건 높인다고 효율이 계속 증가하는 것이 아니라, **재비산이 시작되는 한계유속 이전까지만 효율 증가 효과가 있다.** 이 관계는 시험 답안에서 \"유속-효율 곡선이 상향 후 정체·저하하는 형태\"임을 그래프 개념으로 설명하면 좋은 인상을 줄 수 있다.\n\n## Ⅳ. 압력손실-효율 상충관계와 형상 인자\n\n### 1. 압력손실과 유속의 관계\n**ΔP = ξ·(ρV²/2)** — 압력손실은 유속의 제곱에 비례하므로, 효율 향상을 위해 유속을 높이면 압력손실은 유속 증가율보다 훨씬 가파르게 증가한다. 따라서 한계유속 근처에서 효율 향상 폭은 둔화되는 반면 동력비는 계속 상승하는 비경제적 운전점이 존재한다.\n\n### 2. 형상비(원통부/원추부 길이) 영향\n| 형상 요소 | 효율에 미치는 영향 |\n|---|---|\n| 원통부 길이 증가 | 선회 유지시간 증가 → 효율 소폭 향상 |\n| 원추부 길이 증가 | 내선회류 형성 안정화 → 효율 향상 |\n| 배출관(vortex finder) 삽입깊이 | 과도하면 단락류(short-circuit) 발생, 효율 저하 |\n| 입구형상(접선형 vs 와류형) | 와류형이 압력손실 낮으나 효율은 접선형이 대체로 우수 |\n\n### 3. 운전 중 효율 저하 요인\n1. **호퍼 기밀 누기**: 하부에서 외기가 유입되면 내선회류가 흐트러져 이미 분리된 입자가 재비산 — 사이클론 효율 저하의 가장 흔한 실무 원인\n2. **마모·부식**: 내벽 마모로 표면이 거칠어지면 난류 증가, 장기적으로는 천공에 의한 외기 유입까지 발생\n3. **분진 점착·고화**: 습분이 많거나 점착성 분진은 벽면에 부착되어 유효 반경을 변화시키고 폐색 유발\n4. **유량 변동**: 설계 유량 대비 과소 유량 운전 시 유속 저하로 효율이 설계치보다 낮게 나타남\n\n## Ⅴ. 효율 저하 시 대응 절차와 성능평가 실무\n\n### 1. 성능평가 절차\n사이클론의 실측 효율이 설계치를 벗어날 경우, 원인 규명은 통상 다음 순서로 진행한다.\n\n| 단계 | 점검 내용 | 확인 방법 |\n|---|---|---|\n| 1 | 처리유량(풍량) 확인 | 덕트 내 유속측정, 송풍기 사양 대조 |\n| 2 | 호퍼 기밀 확인 | 육안·연막테스트 |\n| 3 | 내벽 마모·부식 확인 | 두께측정, 육안점검 |\n| 4 | 분진 성상 변화 확인 | 입도분석, 함수율 측정 |\n| 5 | 배출가스 먼지농도 재측정 | 「대기오염공정시험기준」 준용 |\n\n### 2. 압력손실 실측을 통한 간접 진단\n사이클론 입·출구 차압을 정기적으로 측정해 설계 압력손실 대비 편차를 확인하면, 내부 폐색·누기 여부를 별도 분해점검 없이도 조기에 감지할 수 있다. 차압이 설계치보다 크게 낮으면 누기 또는 마모에 의한 단락류, 크게 높으면 폐색을 의심할 수 있다.\n\n## Ⅵ. 결론\n\n사이클론의 실제 운전 효율은 Lapple식으로 산출되는 이론적 절단입경만으로 설명되지 않으며, 분리계수(S)로 표현되는 원심력의 상대적 크기, 한계유속을 넘지 않는 범위 내의 적정 유입속도 유지, 호퍼 기밀 등 운전관리 요인이 함께 작용한다. 설계 시에는 목표 효율과 허용 압력손실의 경제적 균형점을 찾아 유입속도·직경·형상비를 결정하고, 운전 중에는 호퍼 누기·마모·분진 점착을 정기점검하여 설계효율을 유지해야 한다.\n","side":[{"title":"분리계수 계산 및 사이클론 소형화 효과","body":"### 조건 비교: 대형 vs 소형 사이클론\n동일 접선속도 v=15m/s 가정\n\n| 반경(r) | 분리계수 S=v²/(rg) |\n|---|---|\n| 1.0m | 15²/(1.0×9.8) ≈ 23 |\n| 0.5m | 15²/(0.5×9.8) ≈ 46 |\n| 0.25m | 15²/(0.25×9.8) ≈ 92 |\n\n### 해석\n반경이 절반으로 줄어들 때마다 분리계수는 2배씩 증가한다. 이는 앞서 학습한 \"소구경 사이클론(멀티사이클론)이 대구경 단일 사이클론보다 미세입자 분리에 유리하다\"는 설계원칙을 정량적으로 뒷받침한다.\n\n### 실무 적용\n동일 총 처리유량을 대구경 1기 대신 소구경 4기 병렬로 처리하면, 개별 유닛의 반경이 작아 분리계수(S)가 커지고 결과적으로 절단입경이 작아져 전체 시스템 효율이 향상된다. 다만 유닛 수가 늘수록 초기 설치비·배관 복잡도는 증가하므로, 목표 배출기준과 경제성을 함께 검토해 최적 유닛 수를 결정해야 한다.\n\n### 분리계수와 접선속도의 관계\n분리계수는 접선속도(v)의 제곱에 비례하므로, 유입속도를 1.5배로 높이면 분리계수는 2.25배로 증가한다. 다만 앞서 설명한 한계유속(saltation velocity)을 초과하면 재비산으로 오히려 효율이 저하되므로, 접선속도 증가를 통한 분리계수 향상에는 실질적인 상한이 존재함을 답안에서 함께 언급해야 한다.\n\n| v 증가율 | S 증가율(=배율²) |\n|---|---|\n| ×1.2 | ×1.44 |\n| ×1.5 | ×2.25 |\n| ×2.0 | ×4.00(한계유속 초과 우려) |"},{"title":"사이클론 효율 저하 트러블슈팅 체크리스트","body":"### 현장 점검 순서\n```\n1. 배출구 먼지농도 측정치가 설계치보다 높은가?\n   → Q2\n2. 호퍼 하부 점검구·배출밸브 기밀 확인\n   → 누기 발견 시: 즉시 밀봉, 효율 즉각 회복 여부 확인\n3. 처리유량(풍량) 측정 → 설계 유입속도 대비 비교\n   → 과소: 송풍기 점검 / 과다: 재비산 여부 확인\n4. 내벽 마모·천공 육안점검(가능시 두께측정)\n   → 마모 심각 시 라이닝 보수 또는 교체\n5. 분진 성상 변화 확인(점착성·수분함량)\n   → 원료·공정 변경 이력 대조\n```\n\n### 원인별 대응방안\n| 원인 | 조치 |\n|---|---|\n| 호퍼 누기 | 배출밸브·점검구 실링 교체 |\n| 유입속도 과소 | 송풍기 풍량 재조정, 덕트 누기 점검 |\n| 유입속도 과다(재비산) | 유량 저감 또는 병렬유닛 증설 |\n| 내벽 마모 | 내마모 라이닝 시공, 세라믹 코팅 검토 |\n| 분진 점착 | 워터커튼·가열 트레이싱 등 부착방지 설비 검토 |\n\n### 기술사 답안 활용 팁\n효율 저하 원인을 묻는 문제에는 위 체크리스트 순서(누기→유속→마모→분진성상)로 답안을 구성하면 논리적 서술이 가능하며, 원인별 대응방안을 표로 정리하면 가독성이 높아진다.\n\n### 정기점검 주기 예시\n| 점검항목 | 권장주기 |\n|---|---|\n| 호퍼 기밀·배출밸브 작동 | 1일 1회(육안) |\n| 차압(입출구) 기록 | 상시(자동계측) 또는 주 1회 |\n| 내벽 두께측정 | 연 1~2회 |\n| 배출농도 자가측정 | 「대기환경보전법」상 자가측정 주기 준용 |"}]},"37":{"day":37,"date":"2026-09-06","title":"여과집진장치 원리와 여재 선정","keywords":[{"k":"여과 포집기작 5가지","subs":["관성충돌·직접차단·확산·중력·정전기력","입경대별 지배기작 상이","MPPS 0.1~1㎛ 최소효율구간"]},{"k":"케이크(cake) 여과","subs":["초기 여재여과→분진층 형성 후 케이크여과","케이크가 실질적 포집매체","여과속도(air-to-cloth ratio) 좌우"]},{"k":"여재(filter media) 종류","subs":["면·양모·유리섬유·테프론 등","내열온도별 선정(80~260℃)","부직포 vs 직포(woven)"]},{"k":"여과속도(A/C ratio)","subs":["통상 1~3 cm/s(0.6~1.8 m/min)","펄스제트형은 다소 높게 설계 가능","과속 시 압력손실·재비산 급증"]},{"k":"여재 선정 고려인자","subs":["가스온도·산노점·수분함량","분진 화학적 특성(부식·흡습)","케이크 박리성(release 특성)"]}],"answer":"# 여과집진장치(백필터) 원리와 여재 선정\n\n## Ⅰ. 개요\n\n여과집진장치(Bag Filter, Fabric Filter)는 함진가스를 직물·부직포 등 여재(filter media)로 통과시켜 입자를 포집하는 장치로, 절단입경이 0.1~1㎛ 이하까지 확보 가능해 현존하는 건식 집진장치 중 가장 높은 미세먼지 포집효율(통상 99% 이상)을 나타낸다. 다만 압력손실이 크고 고온·수분에 취약한 여재의 손상 위험이 있어, 원리와 여재 특성을 정확히 이해한 설계·운전이 필수적이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 여과 포집기작\n\n입자가 여재 섬유 사이를 통과하면서 포집되는 물리적 기작은 입경대별로 다음 5가지가 복합 작용한다.\n\n| 기작 | 지배 입경대 | 원리 |\n|---|---|---|\n| 관성충돌(Inertial Impaction) | 1㎛ 이상(조대) | 유선을 벗어나 섬유에 직접 충돌 |\n| 직접차단(Interception) | 0.1~1㎛ | 유선을 따라가되 섬유 반경 내 접촉 시 포집 |\n| 확산(Diffusion) | 0.1㎛ 이하(미세) | 브라운 운동에 의한 무작위 이동·포집 |\n| 중력침강(Gravity) | 조대입자 보조기작 | 침강속도에 의한 낙하 포집 |\n| 정전기력(Electrostatic) | 대전된 입자·섬유 | 정전인력에 의한 부착 |\n\n관성충돌과 확산은 입경에 대해 반대 경향(조대는 관성충돌 유리, 미세는 확산 유리)을 보이므로, 두 기작 모두 비효율적인 **0.1~1㎛ 구간에서 최소포집효율입경(MPPS)**이 형성된다(Day 31 Cunningham 보정 연계).\n\n## Ⅲ. 케이크(Cake) 여과의 원리\n\n### 1. 여과 단계\n운전 초기에는 여재 섬유 자체가 입자를 포집하는 **여재여과(depth filtration)**가 이루어지나, 운전이 진행되면서 여재 표면에 분진이 퇴적되어 형성되는 **분진 케이크층**이 실질적인 포집 매체 역할을 하게 된다(케이크 여과, cake filtration). 이 케이크층은 여재보다 훨씬 미세한 공극을 가져, 여재 단독일 때보다 오히려 포집효율이 향상된다.\n\n### 2. 압력손실의 구성\n**ΔP = ΔP(여재) + ΔP(케이크)**\n\n케이크층 두께가 증가할수록 압력손실이 누적 상승하며, 일정 압력손실(통상 150~250mmH2O)에 도달하면 탈진(cleaning)을 실시해 케이크를 탈락시킨다. 탈진 직후에는 여재만 남아 순간적으로 포집효율이 낮아지는 특성이 있어, 탈진 주기·강도 설계가 성능에 직결된다.\n\n## Ⅳ. 여재(Filter Media) 선정\n\n### 1. 재질별 특성\n\n| 재질 | 최고 사용온도 | 내산성 | 내알칼리성 | 특징 |\n|---|---|---|---|---|\n| 면(Cotton) | 약 80℃ | 나쁨 | 양호 | 저가, 저온용 |\n| 양모(Wool) | 약 90~100℃ | 양호 | 나쁨 | 흡습성 |\n| 폴리에스터 | 약 130~150℃ | 양호 | 양호 | 범용, 경제적 |\n| 아라미드(Nomex) | 약 200~220℃ | 보통 | 양호 | 내열성 우수 |\n| 유리섬유(Glass) | 약 250~280℃ | 양호 | 나쁨(불산 제외) | 고온용, 취성 |\n| PTFE(테프론) | 약 260℃ | 매우 양호 | 매우 양호 | 최고 내화학성, 고가 |\n\n### 2. 여재 선정 시 고려인자\n1. **가스 온도**: 여재 최고사용온도를 초과하면 수축·용융·강도저하가 발생하므로, 설계 시 최고운전온도에 10~20% 여유를 둔다.\n2. **산노점(acid dew point)**: 배출가스에 SOx가 포함된 경우 노점 이하로 온도가 내려가면 황산 응축으로 여재가 부식되므로, 산노점보다 20~30℃ 높은 운전온도를 유지한다.\n3. **분진의 화학적 특성**: 흡습성·부식성 분진은 내산·내알칼리 재질을 선정한다.\n4. **케이크 박리성(release 특성)**: 표면처리(멤브레인 코팅, 글레이징 등)로 탈진 시 케이크가 잘 떨어지도록 개선할 수 있다.\n5. **직포(woven) vs 부직포(felt)**: 직포는 저여과속도·역기류 탈진에, 부직포(펠트)는 고여과속도·펄스제트 탈진에 적합하다.\n\n## Ⅴ. 여과집진장치의 장단점과 타 집진장치 대비 위치\n\n### 1. 장단점\n| 구분 | 내용 |\n|---|---|\n| 장점 | 미세먼지 포집효율 최고 수준(0.1㎛까지 99% 이상 가능), 입도·비저항에 무관하게 적용 |\n| 단점 | 압력손실 큼(150~250mmH2O), 고온·수분에 취약, 설치면적 큼, 화재폭발 위험(가연성 분진) |\n\n### 2. 전기집진장치와의 비교 우위\n전기집진장치(Day 41~43)는 압력손실이 낮다는 장점이 있으나 분진 비저항에 성능이 크게 좌우되는 반면, 여과집진장치는 비저항과 무관하게 안정적인 고효율을 확보할 수 있어 최근 신설되는 소각시설·발전소에서는 여과집진장치(백필터)를 우선 채택하는 경향이 뚜렷하다. 다만 압력손실에 따른 송풍동력비 증가는 여과집진장치의 대표적 약점으로 남는다.\n\n### 3. 최근 하이브리드 집진 동향\n전기집진장치의 저압손 장점과 여과집진장치의 고효율 장점을 결합한 **하이브리드 집진장치(EFB, Electrostatic Fabric filter/Baghouse)**가 최근 대형 발전소·소각시설에 적용되는 추세다. 전단에 하전부(전기집진 원리)를 두어 입자를 미리 대전·응집시킨 후 후단 여과부에서 포집하면, 여과속도를 높이면서도 압력손실 상승을 억제할 수 있다.\n\n## Ⅵ. 결론\n\n여과집진장치는 관성충돌·직접차단·확산 등 복합 포집기작과, 여재 위에 형성되는 케이크층의 정밀 여과작용으로 미세먼지까지 고효율로 포집하는 장치다. 여재는 가스온도·산노점·분진 화학성·탈진방식에 맞춰 재질(면~PTFE)과 구조(직포/부직포)를 선정해야 하며, 잘못된 여재 선정은 조기 손상·성능저하·화재위험으로 직결되므로 설계 단계에서 운전조건을 정확히 파악하는 것이 무엇보다 중요하다. Day 38~39에서는 탈진방식·여과속도 설계와 장애현상 대책을 이어서 다룬다.\n","side":[{"title":"여재 선정 사례 — 산업별 적용 예시","body":"### 업종별 여재 선정 예시\n| 업종 | 가스온도 | 주요 특성 | 권장 여재 |\n|---|---|---|---|\n| 시멘트 킬른 | 150~200℃ | 알칼리성 분진 | 유리섬유 또는 아라미드 |\n| 소각시설(RDF·SRF) | 150~180℃, SOx 포함 | 산성가스+다이옥신 흡착 필요 | PTFE 멤브레인 코팅 |\n| 제철 소결로 | 130~150℃ | 고농도, 마모성 | 아라미드+내마모 코팅 |\n| 목재가공 | 상온~60℃ | 저온, 저비용 요구 | 폴리에스터 |\n| 아스콘 플랜트 | 100~130℃ | 오일미스트 혼입 가능 | 폴리에스터(발수처리) |\n\n### 산노점 여유 확보 예시\n배출가스 SO3 농도 기준 산노점이 약 130℃로 추정되는 경우, 운전온도를 150~160℃ 이상으로 유지하여 20~30℃의 여유를 확보하는 것이 실무 설계 관행이다. 정지·기동 시 저온구간을 통과할 때 결로가 발생하기 쉬우므로, 예열 절차를 운전지침에 반드시 포함해야 한다.\n\n### 여재 손상 시 나타나는 징후\n1. 출구 먼지농도 급상승(핀홀·파손 의심)\n2. 특정 백(bag)만 배출구 온도가 다르게 나타남\n3. 탈진 후에도 압력손실이 회복되지 않음(블라인딩 진행)\n4. 하우징 내부 점검 시 백 표면 변색·경화 관찰(화학적 손상 의심)\n\n### 여재 두께·중량과 성능의 관계\n| 항목 | 얇은/경량 여재 | 두꺼운/중량 여재 |\n|---|---|---|\n| 초기 압력손실 | 낮음 | 다소 높음 |\n| 여과 정밀도 | 낮음(미세입자 통과 우려) | 높음 |\n| 내구성 | 낮음 | 높음(장수명) |\n| 적용 예 | 저농도·저부하 공정 | 고농도·마모성 분진 공정 |"},{"title":"여재 표면처리 기술과 최근 동향","body":"### 표면처리 종류\n| 처리기술 | 목적 | 효과 |\n|---|---|---|\n| 글레이징(Glazing) | 표면 평활화 | 케이크 박리성 향상, 압력손실 저감 |\n| 멤브레인 코팅(PTFE membrane) | 표면여과 강화 | 초미세입자 포집효율 극대화, 여재수명 연장 |\n| 발수·발유처리 | 오일미스트·수분 대응 | 블라인딩 방지 |\n| 대전방지처리 | 정전기 축적 방지 | 분진폭발 위험 저감 |\n\n### 멤브레인 여재의 장점\nPTFE 멤브레인을 표면에 코팅한 여재는 입자가 여재 내부 깊숙이 침투하지 못하고 표면에서 케이크를 형성하므로(표면여과), 탈진 시 케이크 박리가 용이하고 초기 여과효율이 매우 높아 최근 소각시설·발전소 등 엄격한 배출기준이 적용되는 시설에서 채택이 늘고 있다. 다만 초기 투자비가 일반 여재 대비 높다.\n\n### 최근 규제 연계\n「대기환경보전법」상 특정대기유해물질 배출시설 등 강화된 배출허용기준이 적용되는 시설에서는 멤브레인 여재 적용을 통해 안정적으로 저농도(예: 5mg/Sm³ 이하) 배출을 확보하는 사례가 증가하고 있으며, 최근 기출에서도 여재 개선기술을 묻는 문제가 출제된 바 있다.\n\n### 여재 교체주기 관리\n일반적으로 여재 수명은 2~5년 수준이나, 운전온도·분진농도·탈진빈도에 따라 크게 달라진다. 압력손실 회복률이 지속적으로 저하되거나 배출농도가 서서히 상승하는 추세가 확인되면, 전수 교체보다 손상이 심한 구획(compartment)부터 선별 교체하는 것이 유지관리비 절감에 유리하다.\n\n### 교체 이력 관리\n백 교체 시 설치일자·위치·사용시간을 기록해두면 이후 수명 예측과 예산계획 수립에 활용할 수 있으며, 특정 구획에서 반복적으로 조기손상이 발생하는 경우 국부적 유동 편중이나 결로 취약구간으로 판단해 설계 보완(정류판 설치 등)을 검토할 수 있다."}]},"38":{"day":38,"date":"2026-09-07","title":"여과집진장치 탈진방식과 여과속도","keywords":[{"k":"탈진방식 3종","subs":["진동형(shaking)·역기류형(reverse air)","펄스제트형(pulse-jet)","오프라인/온라인 탈진 방식"]},{"k":"여과속도(A/C ratio)","subs":["Q/A(㎥/min/㎡ 또는 cm/s)","탈진방식별 권장범위 상이","과속 시 압력손실·마모 급증"]},{"k":"압력손실 산정","subs":["ΔP=K1V+K2WV² (Darcy 근사)","K1: 여재저항, K2: 케이크저항계수","W: 케이크 단위면적당 축적량"]},{"k":"탈진 강도·주기 설계","subs":["압력손실 상한 도달 시 탈진(150~250mmH2O)","과탈진 시 여재 피로·조기손상","탈진 직후 순간 리크 현상"]},{"k":"실무 설계 절차","subs":["처리유량→A/C비 선정→소요여과면적 산정","백 수량·모듈(compartment) 구성","오프라인 탈진용 예비모듈 확보"]}],"answer":"# 여과집진장치 탈진방식과 여과속도\n\n## Ⅰ. 개요\n\n여과집진장치는 운전이 진행됨에 따라 여재 표면에 분진 케이크가 쌓여 압력손실이 계속 상승하므로, 주기적으로 케이크를 탈락시키는 **탈진(cleaning)** 과정이 필수적이다. 탈진방식은 여과속도(air-to-cloth ratio) 설계와 직결되며, 두 요소는 여과집진장치의 설치면적·압력손실·유지관리비를 결정하는 핵심 설계인자다. *(114~138회 다수 기출, 계산문제 포함)*\n\n## Ⅱ. 탈진방식 3종 비교\n\n### 1. 진동형(Mechanical Shaking)\n백 상단을 기계적으로 흔들어 케이크를 탈락시키는 방식으로, 구조가 단순하고 저비용이나 탈진 시 반드시 가스 흐름을 차단(오프라인)해야 하므로 다수의 모듈로 나누어 순차 탈진한다.\n\n### 2. 역기류형(Reverse Air)\n탈진 대상 모듈에 정상 운전과 반대 방향으로 저압 공기를 흘려보내 백을 수축시켜 케이크를 탈락시키는 방식. 백에 가해지는 물리적 충격이 적어 여재 수명이 길지만, 역시 오프라인 탈진이 필요하다.\n\n### 3. 펄스제트형(Pulse-Jet)\n백 상단에서 압축공기를 순간적으로(0.1초 내외) 분사해 백을 급격히 팽창시켜 충격파로 케이크를 탈락시키는 방식. 운전 중에도 개별 백만 탈진 가능(온라인 탈진)하여 정지 없이 연속운전이 가능하고, 여과속도를 상대적으로 높게 설계할 수 있어 최근 가장 널리 채택된다.\n\n| 구분 | 진동형 | 역기류형 | 펄스제트형 |\n|---|---|---|---|\n| 탈진 시 운전 | 오프라인 필수 | 오프라인 필수 | 온라인 가능 |\n| 권장 여과속도 | 낮음(0.5~1.5cm/s) | 낮음(0.5~1.5cm/s) | 높음(1.5~3cm/s 이상) |\n| 여재 형태 | 직포 위주 | 직포 위주 | 부직포(펠트) 위주 |\n| 여재 수명 | 중간 | 김(충격 적음) | 짧음(반복충격) |\n| 설치면적 | 큼 | 큼 | 작음(고A/C비) |\n\n## Ⅲ. 여과속도(Air-to-Cloth Ratio)\n\n### 1. 정의\n**A/C = Q/A** (Q: 처리풍량 ㎥/min, A: 총 여과면적 ㎡) 단위는 통상 m/min 또는 cm/s로 표시한다.\n\n여과속도는 여재를 통과하는 겉보기 유속으로, 값이 클수록 소요 여과면적(설치규모)은 줄어들지만 압력손실·마모·재비산이 증가해 효율이 저하될 위험이 있다.\n\n| 분진 특성 | 권장 여과속도(펄스제트 기준) |\n|---|---|\n| 미세·경량 분진(퓸류) | 0.6~1.0 cm/s |\n| 일반 산업분진 | 1.0~2.0 cm/s |\n| 조대·건조 분진 | 2.0~3.0 cm/s |\n\n### 2. 소요 여과면적 산정\n**A = Q / (A/C비)**\n\n## Ⅳ. 압력손실 산정과 탈진 주기 설계\n\n### 1. 압력손실 근사식\n**ΔP = K1·V + K2·W·V²**\n\n| 기호 | 의미 |\n|---|---|\n| K1 | 여재 자체 저항계수 |\n| K2 | 케이크 비저항계수(분진 특성에 좌우) |\n| V | 여과속도 |\n| W | 케이크 단위면적당 축적 분진량 |\n\n운전시간이 경과할수록 W가 증가해 ΔP가 상승하므로, 설정 압력손실 상한(통상 150~250mmH2O)에 도달하면 탈진을 실시한다.\n\n### 2. 탈진 강도·주기의 상충관계\n| 조건 | 여재 영향 | 포집효율 영향 |\n|---|---|---|\n| 탈진 과도(너무 잦음/강함) | 여재 피로·조기손상 | 케이크 과소로 순간 효율 저하 |\n| 탈진 과소(너무 드묾/약함) | 압력손실 누적, 송풍동력 증가 | 장기적으로는 안정적 |\n\n탈진 직후에는 케이크가 얇아 순간적으로 배출농도가 상승하는 **리크(leak) 현상**이 나타날 수 있어, 펄스제트형에서는 개별 백을 순차적으로(전체 동시가 아닌) 탈진해 전체 배출농도 변동을 최소화하는 설계가 일반적이다.\n\n## Ⅴ. 모듈(Compartment) 구성과 정지 없는 유지관리\n\n대형 여과집진설비는 다수의 백을 모듈(compartment) 단위로 나누어 배치한다. 진동형·역기류형처럼 탈진 시 오프라인이 필요한 방식에서는 하나의 모듈을 탈진 중에도 나머지 모듈이 정상 운전을 지속하도록 하여 전체 공정 정지 없이 연속운전이 가능하도록 설계한다. 펄스제트형도 정비·백 교체 시 개별 모듈을 격리할 수 있도록 모듈별 댐퍼를 설치하는 것이 일반적이다.\n\n| 설계 고려사항 | 내용 |\n|---|---|\n| 모듈 수 | 탈진 중 모듈 부하를 나머지 모듈이 감당 가능한 수준으로 설정 |\n| 예비율 | 1개 모듈 정비 중에도 처리용량 유지 가능하도록 여유설계(N+1) |\n| 댐퍼 연동제어 | 자동제어반과 연동해 순차탈진·격리 운전 구현 |\n| 정비 접근성 | 백 교체 작업공간 확보(상부 플레넘 점검구) |\n\n모듈 단위 격리운전은 정기점검·백 교체 작업 시 전체 공정을 정지하지 않고도 유지보수가 가능하게 하여, 특히 24시간 연속가동이 요구되는 소각시설·발전소에서 필수적인 설계요소로 평가된다.\n\n## Ⅵ. 결론\n\n여과집진장치의 설계는 탈진방식(진동형·역기류형·펄스제트형) 선정과 그에 따른 적정 여과속도 결정이 핵심이며, 이는 곧 소요 설치면적·압력손실·유지관리비를 좌우한다. 최근에는 온라인 탈진이 가능하고 고여과속도 설계가 가능한 펄스제트형이 주류를 이루나, 분진 특성(마모성·점착성·미세도)에 따라 여과속도를 보수적으로 설정하지 않으면 조기 여재손상·배출기준 초과로 이어질 수 있어 설계 시 분진 특성 파악이 선행되어야 한다.\n","side":[{"title":"여과면적 및 탈진주기 계산 예제","body":"### 조건\n처리풍량 Q=600㎥/min, 펄스제트형, 권장 A/C비=1.5cm/s=0.9m/min 적용\n\n### 1. 소요 여과면적\nA = Q/(A/C비) = 600/0.9 ≈ **667㎡**\n\n### 2. 백 규격 적용 시 필요 개수\n표준 백(직경 130mm, 길이 3m, 단위면적 약 1.2㎡/본) 적용 시\n필요 백 개수 = 667/1.2 ≈ **556본**\n\n### 3. 오프라인 예비모듈 고려\n펄스제트형이라도 정비를 위한 예비모듈(통상 전체의 10~20%)을 추가 확보하면, 설계 여과면적은 667×1.15 ≈ **767㎡** 수준으로 상향 조정하는 것이 실무 관행이다.\n\n### 4. 탈진 주기 추정(개념)\n압력손실 상한 200mmH2O, 초기 압력손실 100mmH2O, 상승률 5mmH2O/hr로 가정 시\n탈진 주기 = (200-100)/5 = **20시간**\n\n실제로는 분진농도·입도·습도에 따라 상승률이 시시각각 변하므로, 현장에서는 차압계 실시간 모니터링을 통한 압력손실 기준 자동탈진(온디맨드 탈진)이 일반적이다.\n\n### 시간기준 vs 압력손실기준 탈진 비교\n| 방식 | 원리 | 장단점 |\n|---|---|---|\n| 시간기준(고정주기) | 일정 시간마다 탈진 | 단순하나 부하변동 대응 어려움 |\n| 압력손실기준(온디맨드) | ΔP 상한 도달 시 탈진 | 여재수명 연장, 제어 복잡도 증가 |\n\n실무에서는 두 방식을 병행하여, 압력손실이 기준치 이하라도 장시간 미탈진 시 최소 1회 탈진을 강제하는 하이브리드 제어를 적용하는 경우가 많다."},{"title":"탈진방식 선정 흐름도와 실무 트러블슈팅","body":"### 탈진방식 선정 절차\n```\n1. 처리풍량 규모 확인(연속운전 필요 여부)\n   대규모·연속공정 → 펄스제트형(온라인) 우선 검토\n2. 분진 특성
