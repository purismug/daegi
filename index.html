 | 분석결과의 지속적 신뢰성 관리 |\n| 숙련도시험 참여 | 분석기관·분석자의 능력 검증 |\n\n### 3. 시험기록과 유효숫자\n측정값은 규정된 유효숫자 자릿수에 따라 반올림하여 기록하며, 계산과정에서 임의로 자릿수를 늘리거나 줄이지 않도록 하는 것이 공정시험기준의 기본 원칙이다.\n\n### 4. 측정불확도 개념\n측정값은 항상 일정한 불확도(측정값이 참값으로부터 벗어날 수 있는 범위)를 가지며, 공정시험기준은 이러한 불확도를 정량적으로 평가·표기하도록 요구하는 경우가 있어 단순 평균값 제시를 넘어선 통계적 엄밀성을 요구한다.\n\n### 5. 법적 근거로서의 위상\n공정시험기준에 따라 측정되지 않은 결과는 배출허용기준 초과 여부 판정이나 행정처분의 근거로 인정되지 않으므로, 총칙에서 규정하는 절차 준수는 단순한 기술적 요구를 넘어 법적 효력을 갖는 핵심 요건이다.\n\n## Ⅴ. 결론\n\n대기오염 공정시험기준 총칙은 이후 학습할 개별 측정방법(등속흡입, 먼지측정, 가스상물질 분석 등)의 공통 기초로서, 표준상태·농도단위·보정방법이라는 통일된 기준 위에서 측정이 이루어지도록 하는 역할을 한다. 아울러 품질보증 절차는 측정결과가 법적·행정적 근거로 활용될 수 있을 만큼의 신뢰성을 담보하는 필수 장치로, 측정 실무자는 총칙의 원칙을 정확히 숙지한 상태에서 각론의 세부 절차를 적용해야 한다.\n\n| 요약 | 핵심 |\n|---|---|\n| 표준상태 | 0℃, 1기압 |\n| 농도단위 | ppm, mg/Sm³ |\n| 표준산소농도 보정 | 시설별 공정 비교 |\n| QA/QC | 바탕시료+첨가회수율+숙련도시험 |\n\n이러한 총칙 규정은 이후 학습할 모든 측정방법의 공통 언어와 같은 역할을 하므로, 개별 수치를 암기하기보다 표준화의 필요성이라는 원리를 먼저 체화하는 것이 측정 파트 전체 학습의 효율을 높이는 지름길이다. 다음 Day부터는 이 총칙을 바탕으로 굴뚝 배출가스라는 구체적 대상에 대한 측정방법을 순차적으로 심화 학습하게 된다.\n","side":[{"title":"공정시험기준 각론 구성 미리보기","body":"### 대기 분야 공정시험기준 각론 구조(개념)\n| 구분 | 주요 내용 |\n|---|---|\n| 배출가스 일반사항 | 시료채취공·측정공 위치, 등속흡입 |\n| 배출가스 개별항목 | 먼지, 가스상물질(SOx·NOx·HCl 등)별 분석법 |\n| 환경대기 일반사항 | 측정소 입지조건, 시료채취 방법 |\n| 환경대기 개별항목 | 먼지(PM10·PM2.5), 가스상물질 측정법 |\n\n### 총칙 학습의 중요성\n총칙에서 정의한 용어(표준상태, 항량 등)와 원칙(표준산소농도 보정)은 이후 학습할 Day102~115의 모든 세부 측정방법에서 반복적으로 사용되므로, 총칙 개념이 불명확하면 각론 학습에서 혼란이 발생하기 쉽다.\n\n### 측정방법과 시험방법의 구분\n공정시험기준에서는 \"측정\"(현장에서의 시료채취·계측)과 \"시험\"(채취된 시료의 실험실 분석)을 구분하여 사용하는 경우가 많으며, 이 구분을 명확히 인지하면 이후 학습할 각 항목별 절차(현장측정 vs 분석실시험)를 이해하는 데 도움이 된다.\n\n### 수치·용어 암기 우선순위\n공정시험기준은 세부 고시 개정이 잦은 영역이므로, 절대적인 수치 암기보다 \"왜 이런 절차가 필요한가\"라는 원리 이해를 우선하고, 최신 수치는 시험 직전 공식 자료로 재확인하는 것이 안전한 학습전략이다.\n\n### 대기·수질 공정시험기준의 유사성\n수질 공정시험기준도 유사한 총칙 체계(표준상태 대신 표준온도, 품질보증 절차 등)를 가지고 있어, 환경 분야 전체가 유사한 표준화 철학을 공유한다는 점을 이해하면 타 분야 지식과의 연계 학습에도 도움이 된다.\n\n### 정도관리(QC) 차트 해석 감각\n정도관리 차트는 반복측정값의 관리상한선(UCL)·관리하한선(LCL)을 설정하여 분석과정의 이상 여부를 시각적으로 판단하는 도구로, 값이 관리한계를 벗어나면 분석과정 전반을 재점검해야 한다는 신호로 해석된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 대기오염 공정시험기준의 체계와 주요 용어를 설명하시오. *(114~138회 다수 10점)*\n2. 표준산소농도 보정농도 산정식을 유도하고 계산하시오. *(다수 회차 25점 계산형)*\n3. 공정시험기준상 품질보증(QA/QC) 절차를 설명하시오. *(120회 10점)*\n4. 바탕시료와 첨가회수율 시험의 목적을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n총칙 관련 문제는 \"왜 이러한 표준화가 필요한가\"(전국적으로 비교 가능한 측정결과 확보)라는 목적을 서두에 제시하면 답안의 논리적 완결성이 높아진다. 품질보증 절차는 나열형으로 서술하되 각 절차의 목적(정확도·정밀도 확보)을 함께 명시해야 한다.\n\n### 3단계 측정 파트 진입\nDay 101부터 측정 파트가 본격 시작된다. 이 파트는 절차형·계산형 문제가 많아 이전 파트와는 다른 학습방식(공정시험기준 원문과의 직접 대조)이 효과적이다.\n\n### 암기 카드 5선\n1. **표준상태** = 0℃, 1기압\n2. **건조가스 vs 습가스** = 수분 제거 여부\n3. **표준산소농도 보정** = C보정=C실측×(21-Cs)/(21-O2실측)\n4. **QA/QC** = 바탕시료+첨가회수율+숙련도시험\n5. **법적 위상** = 공정시험기준 미준수 측정값은 행정처분 근거 불인정\n\n### 답안 확장 포인트\n총칙 문제는 지엽적으로 보일 수 있으나, 이후 학습할 모든 계산문제(등속계수, 표준산소농도 보정 등)의 기초 개념을 묻는 경우가 많으므로 \"총칙=측정 파트의 문법\"이라는 인식으로 접근해야 한다."}]},"102":{"day":102,"date":"2026-11-10","title":"굴뚝 배출가스 시료채취 위치와 방법","keywords":[{"k":"측정공 위치 원칙","subs":["직관부 확보(상류·하류 이격거리)","원형굴뚝: 직경의 배수로 규정","곡관·단면변화부 회피"]},{"k":"측정공 규격","subs":["측정공 직경 규정(장비 삽입 가능)","보조작업대·안전시설 구비","다수 측정공 배치(대구경 굴뚝)"]},{"k":"측정점 분할","subs":["단면을 등면적으로 구분","측정점 수는 굴뚝 크기에 비례","각 측정점 유속·농도 측정"]},{"k":"시료채취 절차","subs":["측정 전 예비조사(유속·온도)","등속흡입 조건 확인 후 채취","현장 기록·시료 보관"]},{"k":"측정 안전관리","subs":["고소작업 안전장비","가스 위험성 사전 확인","전기·기계설비 격리조치"]}],"answer":"# 굴뚝 배출가스 시료채취 위치와 방법\n\n## Ⅰ. 개요\n\n굴뚝 배출가스 측정의 신뢰성은 측정공(시료채취공) 위치의 적정성에 크게 좌우되며, 이는 배출가스의 유동이 충분히 안정된(정상류) 지점에서 측정해야 대표성 있는 결과를 얻을 수 있기 때문이다. 공정시험기준은 측정공의 위치 선정 원칙, 규격, 측정점 분할 방법을 구체적으로 규정하고 있으며, 이러한 절차를 정확히 준수하지 않으면 등속흡입(Day103)을 비롯한 후속 측정 전체의 신뢰성이 저하된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 측정공 위치 선정 원칙\n\n### 1. 직관부 확보의 원칙\n측정공은 굴뚝의 곡관, 단면변화부, 합류부 등 유동이 교란되는 지점을 피하여, 충분히 긴 직관부(정상류가 형성되는 구간)에 설치해야 한다.\n\n| 구분 | 원칙 |\n|---|---|\n| 상류측 이격거리 | 굴뚝(관) 직경의 일정 배수 이상 확보 |\n| 하류측 이격거리 | 상류측보다 상대적으로 짧은 배수 적용 |\n| 곡관·단면변화부 | 최대한 회피, 불가피시 추가 이격거리 확보 |\n\n일반적으로 상류측(유동교란원 이전)이 하류측보다 더 긴 직관부를 요구하는데, 이는 교란된 유동이 안정화되는 데 상당한 거리가 필요하기 때문이다.\n\n### 2. 측정공 위치 선정이 부적절할 경우 문제점\n유동이 불안정한 지점에서 측정하면 단면 내 유속·농도 분포가 불균일하여 등속흡입 조건을 만족하기 어렵고, 결과적으로 측정값의 대표성이 상실되어 배출허용기준 준수 여부 판정의 신뢰성이 훼손된다.\n\n## Ⅲ. 측정공 규격과 측정점 분할\n\n### 1. 측정공 규격\n측정공은 시료채취관·피토관 등 측정장비를 삽입할 수 있는 충분한 직경으로 설치하며, 대구경 굴뚝의 경우 단면 전체를 대표할 수 있도록 서로 직각 방향으로 2개 이상의 측정공을 설치하는 것이 일반적이다.\n\n### 2. 측정점 분할 원칙\n| 굴뚝 형태 | 측정점 분할 방법 |\n|---|---|\n| 원형 굴뚝 | 단면을 등면적의 동심원으로 구분, 각 구간 중심에서 측정 |\n| 각형 굴뚝 | 단면을 등면적의 격자로 구분, 각 구간 중심에서 측정 |\n\n측정점 수는 굴뚝의 단면적(직경)이 클수록 많아지도록 규정되어 있으며, 이는 단면 내 유속·농도 분포의 불균일성을 충분히 대표하기 위함이다.\n\n### 3. 측정점별 측정 항목\n각 측정점에서는 유속(피토관)과 온도를 측정하며, 이를 통해 단면 평균유속과 배출유량을 산정하는 기초자료로 활용한다.\n\n## Ⅳ. 시료채취 절차와 안전관리\n\n### 1. 예비조사와 본측정\n| 단계 | 내용 |\n|---|---|\n| 예비조사 | 배출가스 유속·온도·수분함량 등 사전 확인 |\n| 등속흡입 조건 설정 | 예비조사 결과를 바탕으로 등속 조건 계산(Day103 연계) |\n| 본측정(시료채취) | 등속흡입 조건 하에서 실제 시료 채취 |\n\n### 2. 현장 기록과 시료 관리\n측정일시, 기상조건, 공정가동상태, 측정값 등을 현장에서 상세히 기록하며, 채취된 시료는 변질 방지를 위해 규정된 방법으로 보관·운반하여 분석실로 이송한다.\n\n### 3. 측정 안전관리\n| 위험요소 | 안전조치 |\n|---|---|\n| 고소작업(측정공 접근) | 안전대·안전난간 등 고소작업 안전장비 착용 |\n| 고온·유해가스 | 보호구 착용, 사전 가스농도 확인 |\n| 전기·기계설비 인접 | 작업 전 격리조치, 전원 차단 협의 |\n\n### 4. 기존 시설의 측정공 개선 문제\n이미 설치·운영 중인 배출시설에서 측정공 위치가 원칙에 미달하는 경우가 실무에서 종종 발견되며, 이 경우 시설 개조 없이는 근본적 해결이 어려워 측정값의 대표성에 대한 논란이 발생할 수 있다. 신설시설 설계단계에서부터 측정공 요건을 반영하는 것이 사후 개선보다 훨씬 경제적이다.\n\n### 5. 측정공과 방지시설 배치의 연계\n측정공은 통상 방지시설 후단(최종 배출구)에 설치되어 최종 배출농도를 대표해야 하며, 방지시설의 여러 단계 사이에 설치하는 중간측정공은 공정 진단 목적으로 별도 활용될 수 있다는 점도 실무에서 이해해야 할 부분이다.\n\n## Ⅴ. 결론\n\n굴뚝 배출가스 측정은 측정공 위치 선정(직관부 확보)에서 시작하여 측정점 분할, 예비조사, 등속흡입 시료채취로 이어지는 일련의 절차가 정확히 준수되어야 신뢰성 있는 결과를 얻을 수 있다. 특히 유동이 안정된 직관부에서 측정해야 한다는 원칙은 이후 학습할 등속흡입·등속계수(Day103) 개념의 전제조건이 되므로, 두 Day를 연계하여 이해하는 것이 중요하다.\n\n| 요약 | 핵심 |\n|---|---|\n| 측정공 위치 | 직관부 확보(상류>하류 이격거리) |\n| 측정점 분할 | 등면적 구분, 굴뚝 크기에 비례한 측정점 수 |\n| 절차 | 예비조사→등속조건설정→본측정 |\n\n측정공 위치 선정은 이후 학습할 등속흡입(Day103)과 먼지측정(Day104)의 정확도를 근본적으로 좌우하는 전제조건이므로, 측정 파트 전체를 관통하는 첫 단추로서의 중요성을 인식해야 한다. 아무리 정교한 후속 분석기술을 적용하더라도, 측정공 위치가 부적절하면 애초에 대표성 있는 시료를 확보할 수 없다는 점에서 이 단계의 중요성은 아무리 강조해도 지나치지 않는다.\n","side":[{"title":"측정공 위치 선정 실무 절차","body":"### 신설 배출시설의 측정공 설계 절차\n1. 굴뚝 도면 검토, 곡관·단면변화부 위치 파악\n2. 상류·하류 직관부 길이 확인\n3. 직관부 확보가 어려운 경우 대안 위치 검토 또는 굴뚝 설계 변경 협의\n4. 측정공 규격(직경) 및 보조작업대 설계 반영\n5. 측정점 수 사전 산정(예상 굴뚝 직경 기준)\n\n### 측정공 설치가 어려운 경우의 대안\n부지 여건상 이상적인 직관부 확보가 불가능한 경우, 추가적인 측정점 배치나 유동 균일화 장치(정류판 등) 설치를 검토할 수 있으나, 이는 예외적 조치이며 원칙적으로는 설계단계에서부터 충분한 직관부를 확보하는 것이 최선이다.\n\n### 기존시설 대안 마련 시 유의점\n정류판 등 보완장치를 설치하더라도 완벽한 유동 균일화는 어려우므로, 이러한 대안적 측정공에서 얻은 결과는 표준 조건에서의 측정값과 일정한 오차가 있을 수 있음을 감안하여 해석해야 한다.\n\n### 측정공 다중화의 필요성\n대구경 굴뚝에서는 단일 측정공만으로는 단면 전체를 충분히 대표하기 어려우므로, 서로 직각 방향의 복수 측정공을 통해 여러 각도에서 측정점에 접근함으로써 측정의 대표성을 높이는 것이 실무적 표준이다.\n\n### 측정공 관리 소홀 시 문제\n측정공이 부식되거나 폐쇄물로 막혀 있으면 측정 자체가 불가능하거나 지연되므로, 정기적인 측정공 점검·유지관리도 원활한 배출가스 측정의 전제조건이다.\n\n### 보조작업대 설계 고려사항\n측정자가 안전하게 측정공에 접근하여 장비를 조작할 수 있도록 충분한 면적의 보조작업대와 안전난간을 설치해야 하며, 특히 고층 굴뚝의 경우 승강설비(리프트 등) 설치 여부도 함께 검토된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 굴뚝 측정공의 위치 선정 원칙(직관부 확보)을 설명하시오. *(114~138회 다수 10~25점)*\n2. 측정점 분할 방법(원형·각형 굴뚝)을 설명하시오. *(120회 10점)*\n3. 측정공 위치가 부적절할 경우 발생하는 문제점을 설명하시오. *(126회 10점)*\n4. 배출가스 측정의 예비조사 절차를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n측정공 위치 문제는 \"왜 직관부가 필요한가\"(유동 안정화, 대표성 있는 시료채취)를 먼저 설명한 후 구체적 이격거리 규정을 언급하는 순서로 서술하면 논리적이다. 정확한 배수 수치는 공정시험기준 원문을 확인하되, 답안에서는 \"상류측이 하류측보다 길게 요구된다\"는 상대적 관계를 정확히 서술하는 것이 핵심이다.\n\n### 다음 학습 연계\nDay 103(등속흡입과 등속계수)에서 이번 Day의 측정점에서 측정한 유속 자료를 활용해 등속흡입 조건을 계산하는 방법을 학습한다.\n\n### 암기 카드 4선\n1. **직관부 원칙** = 상류측 이격거리 > 하류측 이격거리\n2. **측정점 분할** = 등면적 구분, 굴뚝 크기에 비례\n3. **측정 절차** = 예비조사→등속조건설정→본측정\n4. **측정공 위치** = 방지시설 후단(최종 배출구) 기준\n\n### 답안 확장 포인트\n측정공 위치 문제는 단순 절차 나열보다 \"이 위치가 왜 측정 신뢰성의 출발점인가\"라는 인과관계를 강조하면, 이후 Day103 등속흡입 논의로 자연스럽게 이어지는 논리적 답안이 완성된다."}]},"103":{"day":103,"date":"2026-11-11","title":"등속흡입과 등속계수","keywords":[{"k":"등속흡입 원리","subs":["흡입속도=배출가스 유속 일치","입자상물질 대표성 확보 목적","노즐 유속 편차시 오차 발생"]},{"k":"등속계수(I)","subs":["I=(흡입유속/배출가스유속)×100(%)","90~110% 범위 내 인정","벗어나면 재측정"]},{"k":"과대·과소흡입 오차","subs":["과대흡입: 미세입자 과다포집","과소흡입: 조대입자 과다포집","관성효과에 기인"]},{"k":"측정장비 구성","subs":["피토관(유속측정)+노즐(흡입)","등속흡입장치(유량 자동제어)","여과지+응축수 포집부"]},{"k":"계산 절차","subs":["예비측정 유속→노즐구경 선정","본측정 흡입유량 실시간 조절","등속계수 사후 검증"]}],"answer":"# 등속흡입과 등속계수\n\n## Ⅰ. 개요\n\n등속흡입(Isokinetic Sampling)은 먼지(입자상물질) 측정 시 시료채취 노즐에서의 흡입속도를 굴뚝 내 배출가스의 실제 유속과 동일하게 유지하는 채취방법으로, 입자의 관성 때문에 흡입속도가 배출가스 유속과 다르면 입경별 포집 편향이 발생하여 측정값이 실제 먼지농도를 왜곡한다. 이러한 편향 정도를 정량화한 지표가 등속계수(Isokinetic Ratio)이며, 공정시험기준은 등속계수가 일정 범위 내에 있어야 유효한 측정으로 인정한다. *(114~138회 다수 25점 계산형 기출)*\n\n## Ⅱ. 등속흡입의 원리\n\n### 1. 왜 등속흡입이 필요한가\n먼지는 가스와 달리 질량을 가진 입자이므로 관성의 영향을 받는다. 노즐 흡입속도가 배출가스 유속과 다르면, 유선이 노즐 입구에서 휘어지면서 입자의 궤적이 가스 유선과 어긋나 특정 입경대의 먼지가 과다 또는 과소하게 포집되는 오차가 발생한다.\n\n### 2. 과대흡입과 과소흡입\n| 상태 | 조건 | 결과 |\n|---|---|---|\n| 과대흡입(Super-isokinetic) | 흡입속도 > 배출가스유속 | 유선이 노즐로 집중, 미세입자 과다포집(측정값 낮아짐 경향, 조대입자는 관성으로 유선 이탈) |\n| 등속흡입(Isokinetic) | 흡입속도 = 배출가스유속 | 유선 왜곡 없음, 대표성 있는 시료 채취 |\n| 과소흡입(Sub-isokinetic) | 흡입속도 < 배출가스유속 | 유선이 노즐을 우회, 관성이 큰 조대입자가 유선을 벗어나지 못하고 과다포집(측정값 높아짐 경향) |\n\n## Ⅲ. 등속계수(I)의 정의와 판정기준\n\n### 1. 등속계수 산정식\n**등속계수 I(%) = (노즐 흡입유속 / 굴뚝 배출가스 유속) × 100**\n\n### 2. 판정기준\n| 등속계수 범위 | 판정 |\n|---|---|\n| **90~110%** | 유효한 측정으로 인정 |\n| 90% 미만 또는 110% 초과 | 측정 무효, 재측정 필요 |\n\n이 범위는 공정시험기준에서 규정하는 대표적 허용범위로, 실무에서는 반드시 최신 고시를 확인해야 하나 답안 작성 시 \"90~110%\"라는 수치는 널리 통용되는 기준값으로 암기해둘 필요가 있다.\n\n### 3. 등속계수 산정을 위한 사전 절차\n| 단계 | 내용 |\n|---|---|\n| 예비측정 | 굴뚝 내 유속·온도·수분함량 측정 |\n| 노즐 구경 선정 | 예비측정 유속에 맞는 노즐 크기 계산·선정 |\n| 본측정 | 노즐을 통한 흡입유량을 실시간 조절하며 등속 유지 |\n| 사후검증 | 실제 흡입유량과 배출가스유량으로 등속계수 계산, 범위 확인 |\n\n## Ⅳ. 측정장비 구성과 계산 실무\n\n### 1. 등속흡입 측정장비 구성\n| 구성요소 | 역할 |\n|---|---|\n| 피토관 | 굴뚝 내 배출가스 유속 측정 |\n| 흡입노즐 | 등속 조건으로 시료가스 흡입 |\n| 여과지(필터) | 먼지 포집 |\n| 응축수 포집부(임핀저) | 수분 응축·포집(수분함량 산정) |\n| 유량계·펌프 | 흡입유량 측정 및 제어 |\n\n### 2. 계산 시 유의사항\n등속계수 계산에는 굴뚝 내 온도·압력 조건에서의 배출가스 유속과, 흡입관 내 온도·압력 조건에서의 흡입유속을 정확히 환산하여 비교해야 하며, 온도·압력 보정을 누락하면 등속계수가 왜곡될 수 있다.\n\n### 3. 등속흡입과 다른 측정항목의 관계\n등속흡입 원칙은 입자상물질(먼지) 측정에 특화된 개념으로, 가스상물질(SOx, NOx 등) 측정에는 적용되지 않는다. 이는 가스 분자는 관성 영향이 무시할 만큼 작아 등속 여부와 무관하게 대표성 있는 시료채취가 가능하기 때문이며, 이러한 차이를 이해하는 것이 먼지와 가스상물질 측정법의 근본적 구분점이다.\n\n### 4. 등속흡입 실무의 어려움\n실제 현장에서는 배출가스 유속이 시간에 따라 변동하는 경우가 많아, 흡입유량을 실시간으로 정밀 조절하는 것이 기술적으로 까다로우며, 이 때문에 최근에는 유속 변동을 자동 감지하여 흡입유량을 보정하는 자동등속흡입장치가 도입되고 있다.\n\n## Ⅴ. 결론\n\n등속흡입은 먼지 측정의 대표성을 좌우하는 핵심 원칙으로, 흡입속도와 배출가스 유속의 일치 여부를 등속계수(90~110%)로 판정한다. 과대흡입과 과소흡입은 각각 다른 방향으로 측정값을 왜곡시키므로, Day102에서 학습한 정확한 측정공 위치 선정과 함께 등속흡입 조건의 엄격한 준수가 신뢰성 있는 먼지 배출량 측정의 두 축을 이룬다.\n\n| 요약 | 핵심 |\n|---|---|\n| 등속계수 | I=(흡입유속/배출가스유속)×100 |\n| 유효범위 | 90~110% |\n| 과대흡입 | 미세입자 과다포집 경향 |\n| 과소흡입 | 조대입자 과다포집 경향 |\n\n등속흡입 원칙은 공정시험기준 총칙(Day101)에서 규정한 표준화 철학이 먼지 측정에 구체적으로 구현된 대표 사례로, 측정 파트 전체에서 가장 계산문제 출제빈도가 높은 주제 중 하나이므로 확실히 익혀두어야 한다. 등속계수 계산은 매 회차 빠지지 않는 단골 계산문제이므로 공식과 판정기준(90~110%)을 반사적으로 적용할 수 있을 만큼 숙달해두는 것이 중요하다. 아울러 이 개념은 Day104의 먼지 무게측정법과 직결되므로, 두 Day를 하나의 흐름(채취→계량)으로 묶어 이해하는 것이 효율적이다. 등속흡입이라는 개념 하나가 채취 절차 전체의 신뢰도를 좌우한다는 점에서, 측정 파트에서 가장 비중 있게 다뤄야 할 원리 중 하나로 꼽힌다.\n","side":[{"title":"등속계수 계산 예제","body":"### 계산 예제\n예비측정 결과 굴뚝 내 배출가스 평균유속이 15 m/s로 측정되어 이에 맞는 노즐을 선정하고 본측정을 실시한 결과, 실제 노즐 흡입유속이 14.2 m/s로 계산되었다면:\n\n등속계수 I = (14.2/15) × 100 ≈ **94.7%**\n\n→ 90~110% 범위 이내이므로 유효한 측정으로 판정된다.\n\n만약 흡입유속이 17.5 m/s로 계산되었다면:\n\nI = (17.5/15) × 100 ≈ **116.7%**\n\n→ 110%를 초과하므로 측정 무효, 재측정이 필요하다.\n\n### 등속계수 벗어남의 원인 진단\n| 원인 | 대응 |\n|---|---|\n| 노즐 구경 선정 오류 | 예비측정 재실시 후 노즐 재선정 |\n| 흡입유량 제어 오작동 | 장비 점검 및 재조정 |\n| 굴뚝 내 유속 변동(비정상 운전) | 공정 안정화 후 재측정 |\n\n### 등속흡입 판정 재측정 프로토콜\n등속계수가 범위를 벗어나 재측정이 필요한 경우, 동일한 측정점에서 노즐·유량 설정을 재조정한 후 다시 시료를 채취해야 하며, 이전 시료는 폐기하고 새로운 시료로 전체 분석을 다시 진행하는 것이 원칙이다.\n\n### 실전 계산 팁\n계산문제에서 등속계수가 애매하게 100%에 근접한 값(예: 99.5%)이 나오면 \"90~110% 범위 이내로 유효\"라고 명확히 판정 문장을 작성해야 하며, 단순히 숫자만 제시하고 판정을 누락하면 감점 요인이 된다.\n\n### 등속흡입 관련 부가 계산: 흡입유량 산정\n노즐 단면적(A)과 배출가스 유속(V)을 알면 등속조건에서 필요한 흡입유량(Q)은 Q = A × V로 산정되며, 이 값을 목표로 흡입펌프의 유량을 실시간 제어하는 것이 등속흡입 장비의 핵심 작동원리다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 등속흡입의 원리와 필요성을 설명하시오. *(114~138회 다수 25점)*\n2. 등속계수를 계산하고 판정기준을 설명하시오. *(다수 회차 25점 계산형)*\n3. 과대흡입과 과소흡입이 측정값에 미치는 영향을 설명하시오. *(120회 25점)*\n4. 등속흡입 측정장비의 구성과 각 부분의 역할을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n등속흡입 계산문제는 반드시 등속계수 산정식을 먼저 제시하고 단계별 계산과정을 보여야 하며, 최종적으로 90~110% 범위와 비교하여 유효/무효를 판정하는 문장으로 마무리해야 완결된 답안이 된다. 과대·과소흡입의 방향(어느 쪽이 미세입자를 과다포집하는지)은 관성 개념으로 설명하면 암기 부담이 줄어든다.\n\n### 다음 학습 연계\nDay 104(먼지 측정 - 반자동·수동식)에서 등속흡입으로 채취한 시료를 실제 어떻게 무게측정하여 먼지농도를 산정하는지 학습한다.\n\n### 암기 카드 4선\n1. **등속흡입** = 흡입속도=배출가스유속, 관성에 의한 오차방지\n2. **등속계수** = I=(흡입유속/배출가스유속)×100, 90~110%\n3. **과대흡입** = 미세입자 과다포집(측정값↓ 경향)\n4. **과소흡입** = 조대입자 과다포집(측정값↑ 경향)\n\n### 답안 확장 포인트\n등속흡입은 \"왜 가스상물질은 등속흡입이 필요 없는가\"라는 대비 질문에도 답할 수 있어야 하며, 이는 입자의 관성 유무라는 물리적 차이에서 비롯된다는 점을 명확히 서술하면 심화된 이해를 보여줄 수 있다."}]},"104":{"day":104,"date":"2026-11-12","title":"먼지 측정 - 반자동·수동식","keywords":[{"k":"반자동식(수동식) 측정법","subs":["여과지 채취 후 실험실 칭량","등속흡입+중량법 결합","가장 기본적인 표준측정법"]},{"k":"여과지 선정","subs":["석영섬유·유리섬유 여과지","내열성·포집효율 고려","항량 처리 후 칭량"]},{"k":"먼지농도 산정식","subs":["C=(포집먼지량/흡입건조가스량)","표준상태 환산 필수","표준산소농도 보정 병행"]},{"k":"측정 오차 요인","subs":["여과지 파손·오염","등속흡입 불량","칭량 오차·수분 영향"]},{"k":"자동측정과의 관계","subs":["TMS(연속측정)의 정도검증 기준","반자동식이 참값 기준(Reference Method)","상대정확도 판정에 활용"]}],"answer":"# 먼지 측정 - 반자동·수동식\n\n## Ⅰ. 개요\n\n반자동식(수동식) 먼지측정법은 등속흡입으로 채취한 배출가스 중 먼지를 여과지에 포집한 후, 실험실에서 정밀히 칭량하여 먼지농도를 산정하는 중량법(Gravimetric Method)으로, 대기오염 공정시험기준상 가장 기본적이고 정확도가 높은 표준측정법이다. 이 방법은 연속자동측정기기(TMS)의 측정값을 검증하는 기준측정법(Reference Method)으로도 활용되어, 자동측정과 수동측정이 상호보완적으로 배출가스 관리체계를 뒷받침한다. *(114~138회 다수 25점 계산형 기출)*\n\n## Ⅱ. 측정 원리와 절차\n\n### 1. 기본 원리\nDay102~103에서 학습한 측정공 위치 선정과 등속흡입 원칙에 따라 배출가스를 일정시간 흡입하면서 여과지에 먼지를 포집하고, 채취 전후 여과지의 무게 차이로 포집된 먼지량을 산정한다.\n\n### 2. 측정 절차\n| 단계 | 내용 |\n|---|---|\n| 여과지 준비 | 항량 처리(일정 무게가 될 때까지 건조·칭량 반복) 후 초기무게 측정 |\n| 시료채취 | 등속흡입 조건으로 일정시간 배출가스 흡입, 먼지 포집 |\n| 여과지 회수 | 채취 후 여과지를 손상 없이 회수 |\n| 항량·칭량 | 동일 조건에서 재건조 후 최종무게 측정 |\n| 농도 산정 | 포집먼지량과 흡입가스량으로 농도 계산 |\n\n### 3. 여과지 재질 선정\n| 재질 | 특징 |\n|---|---|\n| 석영섬유 여과지 | 내열성 우수, 고온 배출가스에 적합 |\n| 유리섬유 여과지 | 포집효율 높음, 일반적으로 널리 사용 |\n\n여과지는 목표 입경범위의 먼지를 높은 효율로 포집할 수 있어야 하며, 배출가스의 온도·산성도 등 조건에 견딜 수 있는 내구성도 함께 요구된다.\n\n## Ⅲ. 먼지농도 산정\n\n### 1. 기본 산정식\n**먼지농도 C(mg/Sm³) = 포집먼지량(mg) / 표준상태 건조가스 흡입량(Sm³)**\n\n### 2. 표준상태 환산\n현장에서 측정된 흡입가스량은 측정 당시의 온도·압력 조건이므로, 이를 표준상태(0℃, 1기압)로 환산하는 절차가 필요하다.\n\n**표준상태 환산가스량 = 실측가스량 × (273/(273+t)) × (P/760)**\n\n여기서 t는 측정 시 가스온도(℃), P는 측정 시 압력(mmHg)이다.\n\n### 3. 표준산소농도 보정(Day80·90·101 연계)\n시설별 표준산소농도가 규정된 경우, 산정된 먼지농도를 다시 표준산소농도 기준으로 보정하여 배출허용기준과 비교한다.\n\n## Ⅳ. 측정 오차 요인과 자동측정과의 관계\n\n### 1. 주요 오차 요인\n| 오차 요인 | 영향 |\n|---|---|\n| 여과지 파손 | 먼지 누출로 과소측정 |\n| 등속흡입 불량(Day103) | 입경별 포집 편향 |\n| 칭량 오차 | 항량 처리 미흡, 수분 흡습 등으로 무게 오차 |\n| 채취관 내 먼지 부착 | 채취관 세척 미흡 시 과소측정 |\n\n### 2. TMS(연속자동측정기기) 정도검증과의 관계\nTMS는 광산란법 등 간접적 방식으로 실시간 먼지농도를 측정하므로, 정기적으로 반자동식(수동식) 측정값과 비교하여 상대정확도를 검증받아야 한다. 이때 반자동식 측정법이 참값에 가장 가까운 기준측정법(Reference Method)으로 기능하며, TMS 측정값과의 편차가 일정 범위를 벗어나면 TMS를 보정하거나 재점검해야 한다.\n\n### 3. 채취 실무상의 유의사항\n채취관과 노즐은 시료채취 전후 아세톤 등으로 세척하여 관 내벽에 부착된 먼지까지 회수해야 하며, 이를 누락하면 실제 포집된 먼지량보다 낮게 산정되는 과소평가 오류가 발생한다. 또한 채취 시간과 유량은 여과지에 과도한 먼지가 쌓여 통기저항이 급증하지 않는 범위에서 설정해야 등속흡입 조건을 안정적으로 유지할 수 있다.\n\n### 4. 시료채취량과 정량한계의 관계\n채취시간이 지나치게 짧거나 배출가스 중 먼지농도가 매우 낮은 경우, 포집된 먼지량이 저울의 정량한계에 근접하여 상대오차가 커질 수 있으므로, 예비조사 결과를 바탕으로 목표 포집량을 확보할 수 있는 충분한 채취시간을 사전에 계획해야 한다.\n\n## Ⅴ. 결론\n\n반자동식(수동식) 먼지측정법은 등속흡입으로 채취한 시료를 정밀 중량분석하는 방식으로, 공정시험기준상 가장 기본적이면서도 정확도가 높은 표준측정법이다. 이 방법으로 산정된 먼지농도는 표준상태 환산과 표준산소농도 보정을 거쳐 배출허용기준과 비교되며, 동시에 TMS와 같은 연속자동측정기기의 정확성을 검증하는 기준측정법으로 기능한다는 점에서 배출가스 측정체계 전체의 신뢰성을 뒷받침하는 핵심 방법이다. 측정 실무자는 채취관 세척, 항량 처리, 등속흡입 유지라는 세 가지 실무 원칙을 동시에 지켜야만 신뢰할 수 있는 먼지농도 값을 얻을 수 있다는 점을 항상 유념해야 한다.\n\n| 요약 | 핵심 |\n|---|---|\n| 원리 | 등속흡입+여과지 중량법 |\n| 산정식 | C=포집먼지량/표준상태건조가스량 |\n| 역할 | TMS 정도검증의 기준측정법 |\n| 실무유의점 | 채취관 세척, 정량한계 고려한 채취시간 설정 |\n","side":[{"title":"먼지농도 계산 종합 예제","body":"### 계산 예제\n등속흡입으로 30분간 배출가스를 흡입하여 여과지에 포집한 먼지량이 채취 전후 무게차로 25.6mg이었고, 흡입건조가스량이 표준상태 환산 후 1.2 Sm³이었다면:\n\n먼지농도 C = 25.6 / 1.2 ≈ **21.3 mg/Sm³**\n\n### 표준상태 환산 계산 예제\n현장에서 측정된 흡입가스량이 1.5㎥, 측정 시 온도 25℃, 압력 750mmHg였다면 표준상태 환산가스량은:\n\n환산가스량 = 1.5 × (273/(273+25)) × (750/760) ≈ 1.5 × 0.916 × 0.987 ≈ **1.36 Sm³**\n\n이렇게 환산된 가스량을 앞의 먼지농도 산정식 분모에 대입하는 것이 올바른 계산 순서이며, 환산을 누락하면 농도값이 왜곡된다.\n\n### 표준산소농도 보정까지 포함한 종합 계산 예제\n위에서 산정된 먼지농도 21.3 mg/Sm³을 표준산소농도 6%, 측정 시 실측산소농도 9%인 시설에 적용하면:\n\n보정농도 = 21.3 × (21−6)/(21−9) = 21.3 × 15/12 ≈ **26.6 mg/Sm³**\n\n이처럼 표준산소농도 보정은 항상 실측농도보다 값을 높이거나 낮출 수 있으므로, 계산문제에서는 반드시 보정 방향(실측산소농도가 표준보다 높으면 보정농도가 상승)을 함께 서술해야 한다.\n\n### 채취시간 산정 예제\n목표 포집량이 최소 10mg 이상 필요하고, 예비측정 결과 먼지농도가 약 20mg/Sm³, 흡입유량이 분당 0.02Sm³로 예상된다면, 필요한 채취시간은 10÷(20×0.02)=25분 이상으로 설정해야 정량한계 문제를 피할 수 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 반자동식(수동식) 먼지측정법의 원리와 절차를 설명하시오. *(114~138회 다수 25점)*\n2. 먼지농도 산정식을 유도하고 표준상태 환산을 계산하시오. *(다수 회차 25점 계산형)*\n3. 여과지 선정 시 고려사항을 설명하시오. *(120회 10점)*\n4. TMS와 반자동식 측정법의 관계(정도검증)를 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n먼지농도 계산문제는 반드시 \"표준상태 환산 → 농도산정 → (필요시)표준산소농도 보정\"의 3단계 순서를 지켜 계산해야 하며, 이 순서를 건너뛰면 오답으로 처리될 수 있다.\n\n### 다음 학습 연계\nDay 105(환경대기 시료채취와 측정소 입지)에서 배출가스가 아닌 환경대기 측정으로 학습 범위를 확장하며, Day 106(베타선법 등)에서 이번 Day의 중량법과 다른 자동측정 원리를 학습한다.\n\n### 암기 카드 5선\n1. **반자동식(수동식)** = 등속흡입+여과지 중량법, 기준측정법\n2. **산정식** = C=포집먼지량/표준상태건조가스량\n3. **여과지** = 석영섬유(내열성), 유리섬유(포집효율)\n4. **오차요인** = 여과지파손, 등속흡입불량, 칭량오차\n5. **TMS관계** = 반자동식이 TMS 정도검증의 기준측정법\n\n### 답안 확장 포인트\n계산문제에서 항량 처리를 \"왜\" 하는지(무게변화가 없는 안정상태를 확보해야 칭량오차를 최소화할 수 있기 때문) 원리까지 함께 서술하면 단순 절차 나열보다 높은 평가를 받을 수 있다. 아울러 이 측정법이 왜 TMS의 기준측정법으로 채택되었는지(가장 직접적인 중량 측정이라 참값에 근접) 논리적으로 연결하면 답안의 완결성이 높아진다."}]},"105":{"day":105,"date":"2026-11-13","title":"환경대기 시료채취와 측정소 입지","keywords":[{"k":"측정소 입지 원칙","subs":["주변 오염원 영향 최소화","대표성 있는 지역 선정","건물·장애물 이격거리 확보"]},{"k":"측정소 유형","subs":["도시대기측정소","도로변대기측정소","국가배경농도측정소"]},{"k":"시료채취 높이","subs":["지상 일정 높이 범위 규정","건물 옥상 설치시 고려사항","호흡대 대표성 확보"]},{"k":"배출가스와의 차이","subs":["환경대기는 저농도·광범위 측정","등속흡입 불필요(가스상 위주)","장기 연속측정 중심"]},{"k":"측정망 운영","subs":["국가대기오염측정망 연계","실시간 자료 공개(에어코리아)","측정소별 특성 반영 해석"]}],"answer":"# 환경대기 시료채취와 측정소 입지\n\n## Ⅰ. 개요\n\n환경대기 측정은 굴뚝 배출가스 측정과 달리 특정 배출원이 아닌 대기환경 전반의 오염물질 농도를 파악하기 위한 것으로, 측정소의 입지 선정이 측정자료의 대표성과 신뢰성을 좌우하는 가장 중요한 요소이다. 측정소는 목적(도시대기 파악, 도로변 영향 평가, 국가배경농도 파악 등)에 따라 유형이 구분되며, 각 유형별로 입지 조건과 시료채취 방법이 다르게 규정되어 있다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 측정소 입지 선정 원칙\n\n### 1. 대표성 확보의 원칙\n측정소는 주변 지역의 대기질을 대표할 수 있는 위치에 설치해야 하며, 국지적인 오염원(주차장, 굴뚝 인근 등)의 직접적 영향을 받지 않도록 충분한 이격거리를 확보해야 한다.\n\n| 원칙 | 내용 |\n|---|---|\n| 오염원 회피 | 국지적 오염원(공사장, 소각시설 등) 인근 회피 |\n| 장애물 이격 | 건물·수목 등으로부터 일정 거리 이상 이격 |\n| 개방성 확보 | 시료채취구 주변의 공기흐름이 자유로운 위치 |\n\n### 2. 측정소 유형별 입지 목적\n| 측정소 유형 | 설치 목적 |\n|---|---|\n| 도시대기측정소 | 일반 주거·상업지역의 평균적 대기질 파악 |\n| 도로변대기측정소 | 자동차 배출가스의 도로 인근 영향 평가 |\n| 국가배경농도측정소 | 인위적 오염원 영향이 적은 지역의 배경농도 파악 |\n| 교외대기측정소 | 도시 외곽의 대기질 및 장거리 이동 오염 파악 |\n\n## Ⅲ. 시료채취 높이와 방법\n\n### 1. 시료채취 높이 규정\n환경대기 측정은 일반적으로 사람이 호흡하는 높이대(호흡대)를 대표할 수 있는 지상 일정 높이 범위(통상 지상 1.5~10m 내외 범위가 다수 활용됨)에서 이루어지도록 규정되어 있으며, 건물 옥상에 설치하는 경우에도 옥상 바닥면으로부터 일정 높이를 확보해야 주변 기류 영향을 최소화할 수 있다.\n\n### 2. 건물 옥상 설치 시 고려사항\n| 고려사항 | 이유 |\n|---|---|\n| 옥상 바닥면 이격 | 지붕면 반사·가열에 의한 국지적 기류 영향 회피 |\n| 배기구·환기구 회피 | 건물 자체 배출원의 직접 영향 방지 |\n| 접근성 확보 | 정기적 유지관리·점검을 위한 안전한 접근로 필요 |\n\n### 3. 배출가스 측정과의 근본적 차이(Day102~104 연계)\n| 구분 | 배출가스(굴뚝) 측정 | 환경대기 측정 |\n|---|---|---|\n| 목적 | 배출원의 배출농도 파악 | 주변 대기질(수용지점 농도) 파악 |\n| 농도 수준 | 상대적으로 고농도 | 상대적으로 저농도 |\n| 등속흡입 | 먼지 측정시 필수(Day103) | 일반적으로 불필요 |\n| 측정 주기 | 필요시 단속측정 또는 TMS 연속측정 | 대부분 장기 연속측정 |\n\n## Ⅳ. 측정망 운영과 자료 활용\n\n### 1. 국가대기오염측정망 체계\n환경대기측정소는 전국적으로 배치되어 국가대기오염측정망을 구성하며, 도시대기·도로변대기·국가배경농도·교외대기 등 다양한 유형의 측정소가 상호보완적으로 전국 대기질 현황을 파악한다.\n\n### 2. 실시간 자료 공개\n측정된 자료는 에어코리아 등을 통해 실시간으로 국민에게 공개되며, 대기환경기준(Day118에서 학습 예정) 초과 여부 판정과 대기질 예보·경보 발령의 기초자료로 활용된다.\n\n### 3. 측정소별 특성을 고려한 자료 해석\n동일한 오염물질이라도 측정소 유형에 따라 농도 수준과 변동 패턴이 다르게 나타날 수 있으므로(예: 도로변측정소는 출퇴근시간대 NOx 농도가 뚜렷하게 상승), 자료 해석 시 측정소의 입지 특성을 함께 고려해야 한다.\n\n### 4. 측정소 신설·이전 시 행정절차\n측정소를 신설하거나 이전하는 경우 관계기관 협의, 부지 확보, 시설 설치 등 행정절차를 거쳐야 하며, 특히 도로변측정소는 도로관리청과의 협의가, 국가배경농도측정소는 대상 지역의 오염원 현황에 대한 사전 조사가 추가로 요구된다.\n\n### 5. 계절·기상조건이 입지 평가에 미치는 영향\n동일한 측정소라도 계절풍향, 강수량, 대기안정도 등 기상조건에 따라 측정되는 오염물질의 농도 패턴이 달라질 수 있으므로, 입지 적정성을 평가할 때는 단기간이 아닌 장기간(최소 1년 이상)의 자료를 바탕으로 종합적으로 판단하는 것이 바람직하다.\n\n## Ⅴ. 결론\n\n환경대기 시료채취는 측정소의 대표성 있는 입지 선정에서 출발하며, 측정 목적에 부합하는 측정소 유형(도시대기·도로변·배경농도 등)을 적절히 배치하고 표준화된 높이·방법으로 시료를 채취해야 신뢰성 있는 대기질 자료를 확보할 수 있다. 이는 배출가스 측정(Day101~104)이 개별 배출원의 관리에 초점을 둔 것과 달리, 국민이 실제로 노출되는 대기환경 전체를 파악하기 위한 목적을 가진다는 점에서 상호보완적 역할을 수행한다. 측정소 입지의 대표성은 한 번 확보되었다고 끝나는 것이 아니라, 주변 개발 상황을 지속적으로 모니터링하며 유지·관리해야 하는 동적인 과제라는 점도 실무적으로 중요하다.\n\n| 요약 | 핵심 |\n|---|---|\n| 입지 원칙 | 대표성 확보, 오염원·장애물 회피 |\n| 측정소 유형 | 도시대기·도로변·배경농도·교외대기 |\n| 채취 높이 | 호흡대 대표 높이, 옥상 설치시 이격 |\n| 활용 | 국가측정망, 에어코리아 공개, 환경기준 판정 |\n| 관리 | 신설·이전 행정절차, 장기자료 기반 평가 |\n\n측정소 입지 선정 원칙과 유형별 특성에 대한 이해는 Day106에서 학습할 구체적인 먼지측정법(중량법·베타선흡수법·광산란법)의 적용 맥락을 이해하는 데도 직접적으로 도움이 되며, 어떤 측정소에 어떤 측정법이 적용되는지(예: 국가측정망은 베타선흡수법 상시운영)를 연계하여 학습하면 두 Day의 내용이 하나의 체계로 통합된다.\n","side":[{"title":"측정소 유형별 사례와 해석 요령","body":"### 측정소 유형별 특징 비교\n| 유형 | 대표 오염물질 특징 | 해석시 유의점 |\n|---|---|---|\n| 도시대기 | 종합적 오염 수준 | 계절·시간대별 변동 패턴 파악 |\n| 도로변대기 | NOx, PM 상대적 고농도 | 출퇴근시간대 피크 고려 |\n| 국가배경농도 | 장거리이동 오염 영향 반영 | 국내 발생원과 구분한 해석 필요 |\n\n### 도로변측정소 특별 고려사항\n도로변측정소는 도로 경계로부터의 이격거리, 교통량, 도로 구조(터널·고가 등) 등을 종합적으로 고려하여 입지를 선정해야 하며, 이는 도로변 대기질이 일반 도시대기와 뚜렷이 다른 패턴을 보이기 때문이다.\n\n### 산업단지 인근 측정소 운영\n산업단지 주변에 별도의 측정소를 설치하는 경우, 특정 업종의 특징적 오염물질(예: 석유화학단지의 VOCs)을 추가 측정항목으로 포함시키는 등 지역 특성을 반영한 측정항목 구성이 필요하며, 이는 일반 도시대기측정소와 차별화되는 지점이다.\n\n### 측정소 이전·재배치 시 고려사항\n도시개발로 측정소 주변 환경이 변화하면(신축건물, 도로 신설 등) 대표성이 훼손될 수 있어 주기적으로 입지 적정성을 재평가하고 필요시 이전을 검토해야 하며, 이 경우 이전 전후 자료의 연속성 문제도 함께 검토해야 한다.\n\n### 국가배경농도측정소 운영상 특징\n국가배경농도측정소는 인위적 오염원의 영향을 최소화하기 위해 도서지역이나 산간지역 등 인구밀집지역에서 멀리 떨어진 곳에 설치되는 경우가 많으며, 이로 인해 시설 유지관리(전력공급, 정기점검 접근성)에 상대적으로 높은 운영비용이 소요된다는 특징이 있다.\n\n### 측정소 자료의 결측 관리\n기기 고장, 정전, 정기점검 등으로 일시적 결측이 발생할 수 있으며, 결측률이 일정 기준을 초과하면 해당 기간의 대표성 있는 통계치(연평균 등) 산정에서 제외하거나 별도 표기하는 등 자료 품질관리 절차가 필요하다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 환경대기측정소의 입지 선정 원칙을 설명하시오. *(114~138회 다수 10점)*\n2. 측정소 유형별 설치 목적과 특징을 비교 설명하시오. *(120회 10점)*\n3. 배출가스 측정과 환경대기 측정의 차이를 비교 설명하시오. *(126회 10~20점)*\n4. 도로변대기측정소의 입지 고려사항을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n환경대기 측정 문제는 배출가스 측정과의 \"목적 차이\"(배출원 관리 vs 수용지점 대기질 파악)를 먼저 명확히 하고, 이에 따라 입지·방법이 어떻게 달라지는지 설명하는 대비구조로 답안을 구성하면 논리적으로 완결된다.\n\n### 다음 학습 연계\nDay 106(베타선법·중량법 등 먼지측정법)에서 환경대기 중 먼지(PM10·PM2.5)를 실제로 측정하는 구체적 방법을 학습한다.\n\n### 암기 카드 4선\n1. **측정소 유형** = 도시대기·도로변대기·국가배경농도·교외대기\n2. **입지 원칙** = 대표성 확보, 오염원·장애물 회피\n3. **채취 높이** = 호흡대 대표 높이(지상 1.5~10m 내외)\n4. **배출가스와 차이** = 저농도·광범위, 등속흡입 불필요, 장기연속측정\n\n### 답안 확장 포인트\n환경대기 측정소 문제는 단순 유형 나열보다 \"왜 이 유형이 필요한가\"(도시대기=일반적 노출수준, 도로변=이동오염원 영향, 배경농도=자연적/장거리이동 성분 구분)라는 목적론적 설명을 곁들이면 답안의 설득력이 높아진다."}]},"106":{"day":106,"date":"2026-11-14","title":"베타선법·중량법 등 먼지측정법","keywords":[{"k":"중량법(PM10·PM2.5)","subs":["여과지 포집 후 실험실 칭량","고용량·저용량 채취기","가장 정확한 기준측정법"]},{"k":"베타선흡수법","subs":["베타선 감쇠량으로 실시간 농도 산정","연속자동측정 가능","중량법과의 정도검증 필요"]},{"k":"광산란법","subs":["빛의 산란정도로 먼지농도 추정","간이측정·이동측정에 활용","보정계수 필요"]},{"k":"PM10·PM2.5 분립장치","subs":["절단입경(Cut-off Diameter)","임팩터·사이클론 방식","입경별 선택적 포집"]},{"k":"측정법간 비교와 선택","subs":["기준측정법 vs 상당측정법","정확도-실시간성 트레이드오프","측정목적별 적정 방법 선택"]}],"answer":"# 베타선법·중량법 등 먼지측정법\n\n## Ⅰ. 개요\n\n환경대기 중 먼지(PM10, PM2.5)의 측정방법은 정확도가 가장 높은 중량법(기준측정법)부터, 실시간 연속측정이 가능한 베타선흡수법, 간이측정에 활용되는 광산란법까지 다양하게 존재하며, 각 방법은 정확도와 실시간성 사이의 트레이드오프 관계에 있다. Day104에서 학습한 배출가스 먼지측정(반자동식)과 원리는 유사하나, 환경대기 측정은 PM10·PM2.5와 같이 입경을 구분하여 측정한다는 점이 핵심적 차이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 중량법(기준측정법)\n\n### 1. 원리와 절차\n중량법은 대기 중 먼지를 여과지에 포집한 후 실험실에서 정밀 칭량하여 질량농도를 산정하는 방법으로, Day104의 배출가스 중량법과 동일한 원리이나 PM10·PM2.5 분립장치를 통해 특정 입경 이하의 먼지만 선택적으로 포집한다는 차이가 있다.\n\n| 구분 | 고용량 채취기 | 저용량 채취기 |\n|---|---|---|\n| 흡입유량 | 상대적으로 높음 | 상대적으로 낮음 |\n| 채취시간 | 상대적으로 짧음 | 상대적으로 김(통상 24시간) |\n| 활용 | 대량 시료 필요시 | 표준 24시간 평균농도 측정 |\n\n### 2. 중량법의 위상\n중량법은 측정 정확도가 가장 높아 다른 자동측정법의 정도검증 기준(Reference Method)으로 활용되며, 국가측정망의 공식 자료 생산에도 핵심적으로 사용된다.\n\n## Ⅲ. 베타선흡수법\n\n### 1. 측정 원리\n베타선흡수법은 여과지에 연속적으로 먼지를 포집하면서, 베타선(방사성동위원소에서 방출)이 포집된 먼지층을 통과할 때 감쇠되는 정도를 측정하여 먼지의 질량농도를 실시간으로 산정하는 방법이다. 먼지량이 많을수록 베타선의 투과량이 감소하는 원리를 이용한다.\n\n### 2. 장단점\n| 구분 | 내용 |\n|---|---|\n| 장점 | 실시간 연속측정 가능, 자동화된 무인운영 가능 |\n| 단점 | 중량법 대비 상대적으로 정확도 낮음, 정기적 정도검증 필요 |\n\n### 3. 국가측정망에서의 활용\n베타선흡수법은 실시간성이 뛰어나 국가대기오염측정망(Day105 연계)의 상시 운영 측정기로 널리 사용되며, 대기질 예보·경보 발령에 필요한 실시간 자료를 제공한다.\n\n## Ⅳ. 광산란법과 분립장치\n\n### 1. 광산란법(간이측정)\n광산란법은 먼지 입자에 빛을 조사했을 때 발생하는 산란광의 세기로 먼지농도를 추정하는 방법으로, 소형·경량화가 가능해 이동측정이나 간이측정소, 실내공기질 측정 등에 활용되나, 입자의 크기·형태·색상 등에 따라 산란 특성이 달라져 중량법 대비 정확도가 낮으므로 보정계수 적용이 필요하다.\n\n| 측정법 | 정확도 | 실시간성 | 주요 활용 |\n|---|---|---|---|\n| 중량법 | 최고(기준) | 낮음(사후분석) | 공식 기준자료, 정도검증 |\n| 베타선흡수법 | 중간~높음 | 높음(연속) | 국가측정망 상시운영 |\n| 광산란법 | 상대적으로 낮음 | 매우 높음(즉시) | 간이측정, 이동측정 |\n\n### 2. PM10·PM2.5 분립장치\n| 방식 | 원리 |\n|---|---|\n| 임팩터(Impactor) | 관성충돌로 특정 입경 이상 입자를 판에 부착시켜 제거 |\n| 사이클론(Cyclone) | 원심력으로 조대입자를 분리·제거 |\n\n분립장치는 절단입경(Cut-off Diameter, 예: 10㎛ 또는 2.5㎛)을 기준으로 그 이하 입경의 먼지만 통과시켜 후단의 여과지나 검출부로 보내는 역할을 하며, 이 절단입경의 정확한 구현이 PM10·PM2.5 구분측정의 핵심이다.\n\n### 3. 절단입경 구현의 정밀도 문제\n분립장치의 절단입경 곡선(입경별 통과율)이 이상적인 계단형태가 아니라 일정한 기울기를 가진 S자형으로 나타나는 것이 일반적이며, 이 때문에 절단입경 부근의 입자들은 일부만 통과하거나 일부만 제거되는 경계효과가 발생한다. 분립장치의 정도관리는 이러한 절단곡선의 형태가 규정된 허용범위 내에 있는지를 정기적으로 점검하는 것을 포함한다.\n\n## Ⅴ. 측정법 간 비교 심화와 실무 선택\n\n### 1. 정확도-실시간성 트레이드오프의 실무적 의미\n연속자동측정법(베타선흡수법)은 국가측정망처럼 광범위한 지역에서 상시 자료를 생산해야 하는 목적에는 적합하지만, 개별 지점의 정밀한 규제 판정이나 학술연구 목적에는 중량법의 정확도가 요구되는 경우가 많아, 실무에서는 목적에 따라 두 방법을 병행하는 것이 일반적이다.\n\n### 2. 최근 측정기술 동향\n최근에는 광산란법 기반의 저가형 센서가 소형화·고도화되어 촘촘한 지점별 대기질 모니터링(마이크로 센싱)에 활용되는 사례가 늘고 있으나, 이러한 센서 자료는 국가 공식 통계로 인정되지 않으며 어디까지나 보조적·참고적 자료로 활용된다는 한계를 명확히 인식해야 한다.\n\n## Ⅵ. 결론\n\n먼지측정법은 정확도가 가장 높은 중량법(기준측정법), 실시간성이 뛰어난 베타선흡수법, 간편한 광산란법이 각각의 목적에 따라 상호보완적으로 활용되며, 어떤 방법이든 PM10·PM2.5 분립장치를 통한 정확한 절단입경 구현이 전제되어야 한다. 국가측정망은 베타선흡수법을 상시운영 방식으로 채택하되, 정기적으로 중량법과 비교하여 정도검증을 실시함으로써 실시간성과 정확도를 동시에 확보하는 체계를 갖추고 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 중량법 | 여과지+칭량, 최고 정확도(기준측정법) |\n| 베타선흡수법 | 베타선 감쇠, 실시간 연속측정 |\n| 광산란법 | 산란광 세기, 간이·이동측정 |\n| 분립장치 | 임팩터·사이클론, 절단입경 구현 |\n| 최근동향 | 저가형 센서 확산, 보조적 활용에 한정 |\n","side":[{"title":"측정법 선택과 정도검증 사례","body":"### 측정목적별 적정 방법 선택\n| 목적 | 권장 측정법 |\n|---|---|\n| 국가 공식 기준자료 생산 | 중량법 |\n| 실시간 예보·경보 | 베타선흡수법 |\n| 현장 간이진단·이동측정 | 광산란법 |\n\n### 측정법 도입 시 경제성 고려\n중량법은 인력·분석시간이 많이 소요되어 지점당 운영비용이 높은 반면, 베타선흡수법은 초기 장비투자비용은 크지만 무인 자동운영이 가능해 장기적으로는 다지점 상시운영에 유리하다는 경제성 측면의 차이도 측정망 설계 시 함께 고려된다.\n\n### 베타선흡수법 정도검증 절차\n베타선흡수법으로 측정된 자료는 정기적으로 동일 지점·동일 기간의 중량법 측정값과 비교하여 상대정확도를 검증하며, 이는 Day104에서 학습한 TMS-반자동식 측정법 관계와 유사한 구조로 이해할 수 있다.\n\n### 실내공기질 측정과의 연계\n광산란법 기반 소형 측정기는 실내공기질 관리(다중이용시설 등)에서도 활용도가 높아지고 있으며, 이 경우에도 정확도 한계를 인지하고 정기적인 기준측정법 대조가 권장된다.\n\n### PM10·PM2.5 동시측정 실무\n동일 지점에서 PM10과 PM2.5를 동시에 측정하는 경우, 별도의 분립장치를 갖춘 두 대의 측정기를 나란히 설치하거나, 하나의 채취기에 단계별 분립장치를 직렬로 연결하는 방식이 활용되며, PM2.5는 PM10에 포함되는 개념이므로 두 측정값의 비율(PM2.5/PM10)을 통해 미세먼지 중 초미세먼지의 비중을 파악할 수 있다.\n\n### 여과지 재질과 성분분석의 관계\n중량법으로 사용된 여과지는 이후 중금속·이온성분 등 화학적 성분분석에도 활용될 수 있어, 여과지 재질 선정 시 목표 성분분석 항목과의 화학적 간섭 여부도 함께 고려해야 한다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. PM10·PM2.5 측정에 사용되는 주요 측정법을 비교 설명하시오. *(114~138회 다수 25점)*\n2. 베타선흡수법의 원리와 장단점을 설명하시오. *(120회 10~25점)*\n3. PM10·PM2.5 분립장치의 원리(임팩터·사이클론)를 설명하시오. *(126회 10점)*\n4. 중량법이 기준측정법으로 활용되는 이유를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n측정법 비교 문제는 정확도-실시간성 트레이드오프 구조로 설명하면 명확하다. \"왜 국가측정망은 베타선흡수법을 상시 사용하면서도 중량법으로 정기 검증하는가\"라는 질문형 서술로 접근하면 두 방법의 관계를 자연스럽게 설명할 수 있다.\n\n### 다음 학습 연계\nDay 107(가스상 물질 분석 - 흡광광도·GC)에서 먼지가 아닌 가스상 오염물질의 실험실 분석법을 학습하며, 측정 파트의 범위를 입자상에서 가스상으로 확장한다.\n\n### 암기 카드 5선\n1. **중량법** = 여과지+칭량, 기준측정법(Reference Method)\n2. **베타선흡수법** = 베타선 감쇠량 측정, 실시간 연속\n3. **광산란법** = 산란광 세기, 간이·이동측정용\n4. **임팩터** = 관성충돌로 조대입자 제거\n5. **절단입경** = PM10=10㎛, PM2.5=2.5㎛ 기준\n6. **PM2.5/PM10 비율** = 초미세먼지 비중 파악 지표\n\n### 답안 확장 포인트\n측정법 비교 문제에서는 \"국가측정망이 왜 굳이 정확도가 낮은 베타선흡수법을 상시 사용하는가\"라는 역설적 질문에 답할 수 있어야 하며, 이는 실시간성이라는 다른 가치(예보·경보의 신속성)가 정확도와 트레이드오프 관계에 있기 때문이라는 논리로 설명하면 답안의 깊이를 더할 수 있다."}]},"107":{"day":107,"date":"2026-11-15","title":"가스상 물질 분석 - 흡광광도·GC","keywords":[{"k":"흡광광도법","subs":["특정 파장 흡광도로 농도 정량","발색시약 반응 이용","SO2·NOx·HCl 등 다수 적용"]},{"k":"기체크로마토그래피(GC)","subs":["성분별 분리 후 검출기로 정량","FID·ECD·TCD 등 검출기 종류","VOCs 등 다성분 동시분석"]},{"k":"자외선형광법(SO2)","subs":["SO2가 자외선 흡수 후 형광 방출","연속자동측정에 활용","높은 선택성·민감도"]},{"k":"화학발광법(NOx)","subs":["NO+O3 반응시 화학발광 발생","발광강도로 NO농도 정량","NO2는 컨버터로 NO 전환 후 측정"]},{"k":"분석법 선택 기준","subs":["오염물질 특성별 최적 분석법","검출한계·간섭물질 고려","현장연속측정 vs 실험실분석"]}],"answer":"# 가스상 물질 분석 - 흡광광도·GC\n\n## Ⅰ. 개요\n\n가스상 오염물질(SO2, NOx, HCl, VOCs 등)의 분석은 입자상물질(먼지)과 달리 중량법이 아닌, 물질의 화학적·광학적 특성을 이용한 다양한 기기분석법이 활용된다. 대표적으로 흡광광도법(발색반응 이용), 기체크로마토그래피(성분 분리), 자외선형광법·화학발광법(연속자동측정)이 있으며, 오염물질의 종류와 측정목적(단속측정 vs 연속측정)에 따라 적정 분석법이 선택된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 흡광광도법\n\n### 1. 측정 원리\n흡광광도법은 시료가스를 특정 발색시약과 반응시켜 색을 띠는 화합물을 생성한 후, 특정 파장에서의 흡광도를 측정하여 램버트-비어(Lambert-Beer) 법칙에 따라 농도를 정량하는 방법이다.\n\n**흡광도 A = ε·c·l** (ε: 흡광계수, c: 농도, l: 셀 길이)\n\n### 2. 주요 적용 대상\n| 오염물질 | 발색 원리(개념) |\n|---|---|\n| SO2 | 파라로자닐린 등 발색시약과의 반응 |\n| NOx | 잘츠만(Saltzman) 시약 등과의 발색반응 |\n| HCl | 특정 발색시약과의 반응 |\n\n### 3. 장단점\n흡광광도법은 비교적 간단한 장비로 정밀한 정량이 가능하나, 시료채취 후 실험실에서 발색·분석하는 과정이 필요해 실시간 연속측정에는 한계가 있으며, 발색시약의 선택성에 따라 간섭물질의 영향을 받을 수 있다.\n\n## Ⅲ. 기체크로마토그래피(GC)\n\n### 1. 측정 원리\nGC는 시료가스를 컬럼(관)에 통과시켜 각 성분물질이 컬럼과의 상호작용(흡착·분배) 차이에 따라 서로 다른 속도로 이동·분리된 후, 컬럼 끝단의 검출기에서 순차적으로 검출·정량하는 방법이다.\n\n### 2. 주요 검출기 종류\n| 검출기 | 특징 | 주요 대상 |\n|---|---|---|\n| FID(불꽃이온화검출기) | 탄화수소류에 높은 민감도 | VOCs, THC |\n| ECD(전자포획검출기) | 할로겐화합물에 높은 민감도 | 유기염소계 화합물 |\n| TCD(열전도도검출기) | 범용적이나 민감도 낮음 | 일반 가스성분 |\n\n### 3. GC의 장점과 활용\nGC는 다성분 혼합물을 동시에 분리·정량할 수 있어 VOCs와 같이 수십 종의 성분이 혼재된 시료 분석에 특히 유리하며, 대기환경 분야에서는 휘발성유기화합물 분석의 표준적 방법으로 자리잡고 있다.\n\n## Ⅳ. 연속자동측정 전용 분석법\n\n### 1. 자외선형광법(SO2)\nSO2가 자외선을 흡수한 후 특정 파장의 형광을 방출하는 성질을 이용하여, 방출되는 형광의 강도를 측정함으로써 SO2 농도를 실시간으로 정량하는 방법으로, 선택성과 민감도가 높아 TMS(굴뚝 자동측정기기)의 SO2 측정에 널리 사용된다.\n\n### 2. 화학발광법(NOx)\nNO는 오존(O3)과 반응할 때 화학발광을 일으키며, 이 발광강도를 측정하여 NO 농도를 정량한다. 대기 중 NOx는 NO와 NO2의 합이므로, NO2를 컨버터를 통해 NO로 환원시킨 후 총 NOx를 측정하고, 별도로 측정한 NO값과의 차이로 NO2 농도를 산출하는 방식이 일반적이다.\n\n**NO2 농도 = 총NOx(컨버터 경유) 측정값 − NO 단독 측정값**\n\n### 3. 연속자동측정법과 실험실분석법의 비교\n| 구분 | 자외선형광법·화학발광법 | 흡광광도법(습식) |\n|---|---|---|\n| 측정방식 | 현장 연속자동측정 | 시료채취 후 실험실 분석 |\n| 실시간성 | 높음(TMS 활용) | 낮음(사후분석) |\n| 활용 | TMS, 상시 감시 | 정도검증, 특수성분 분석 |\n\n### 3. 분석법 선택 시 종합 고려사항\n가스상 물질 분석법을 선택할 때는 대상물질의 반응성·안정성, 요구되는 검출한계, 간섭물질의 존재 여부, 측정목적(단속측정 vs 상시감시)을 종합적으로 고려해야 하며, 동일한 물질이라도 배출허용기준 초과 여부를 다투는 정밀 판정에는 실험실 분석법이, 상시 감시에는 연속자동측정법이 선호되는 경향이 있다.\n\n## Ⅴ. 검출한계와 정도관리\n\n### 1. 검출한계(Detection Limit)의 의미\n모든 분석법은 신뢰성 있게 검출할 수 있는 최소농도인 검출한계를 가지며, 측정값이 검출한계 미만인 경우 \"불검출\" 또는 검출한계값 이하로 표기하는 것이 원칙이다. 검출한계는 분석법의 민감도를 나타내는 핵심 지표로, 저농도 오염물질을 다루는 환경대기 분석에서 특히 중요하게 고려된다.\n\n### 2. 간섭물질 관리\n흡광광도법은 발색시약이 목표물질 외 다른 성분과도 반응하여 양의 간섭(과대측정) 또는 음의 간섭(과소측정)을 일으킬 수 있으므로, 표준물질을 이용한 정기적 교정과 함께 간섭물질 제거를 위한 전처리 절차가 병행되어야 한다.\n\n## Ⅵ. 결론\n\n가스상 물질 분석법은 오염물질의 화학적 특성에 따라 흡광광도법(발색반응), GC(성분분리), 자외선형광법·화학발광법(연속자동측정)으로 다양화되어 있으며, 측정목적이 정밀한 실험실 분석인지 실시간 연속감시인지에 따라 적정 방법이 선택된다. 이러한 가스상 물질 분석법은 Day104~106에서 학습한 입자상물질(먼지) 측정법과 함께 대기오염 공정시험기준 각론의 양대 축을 이루며, 다음 회독(Day108)에서 Day101~107 측정 파트 전체를 종합적으로 복습하게 된다.\n\n| 요약 | 핵심 |\n|---|---|\n| 흡광광도법 | 발색반응+흡광도, 실험실 분석 |\n| GC | 성분분리+검출기(FID·ECD·TCD) |\n| 자외선형광법 | SO2 연속자동측정 |\n| 화학발광법 | NO+O3 반응, NOx 연속자동측정 |\n| 정도관리 | 검출한계 확인, 간섭물질 관리 필수 |\n","side":[{"title":"검출기별 비교와 실무 적용","body":"### 검출기 선택 실무 팁\n| 분석 목적 | 권장 검출기 |\n|---|---|\n| 총탄화수소(THC) 측정 | FID |\n| 유기염소계 농약 등 미량분석 | ECD |\n| 영구가스(N2, O2, CO2 등) 분석 | TCD |\n\n### 흡광광도법 계산 예제(개념)\n흡광계수 ε=0.5(L/mg·cm), 셀 길이 l=1cm인 조건에서 측정된 흡광도 A=0.25라면, 램버트-비어 법칙에 따라:\n\n농도 c = A/(ε·l) = 0.25/(0.5×1) = **0.5 mg/L**\n\n이처럼 흡광광도법 계산문제는 램버트-비어 법칙 공식을 직접 적용하는 형태로 출제될 수 있으므로 공식을 정확히 암기해두어야 한다.\n\n### TMS 구성과의 연계(Day111 예고)\n자외선형광법(SO2)과 화학발광법(NOx)은 Day111에서 학습할 TMS(굴뚝 자동측정기기)의 핵심 분석원리로 다시 등장하므로, 이번 Day에서 원리를 확실히 이해해두면 이후 학습이 수월해진다.\n\n### GC 분석 실무 절차\nGC 분석은 시료 주입 → 컬럼 내 성분 분리 → 검출기 신호 측정 → 크로마토그램(체류시간별 피크) 분석 → 표준물질과의 체류시간·피크면적 비교를 통한 정성·정량의 순서로 진행되며, 각 성분의 체류시간은 컬럼 종류와 온도조건에 따라 달라지므로 표준물질을 이용한 정기적 재검정이 필요하다.\n\n### VOCs 분석에서 GC의 실무적 중요성\n휘발성유기화합물(VOCs)은 수십~수백 종의 성분이 혼재되어 있어 개별 성분별 규제·관리가 필요한 경우가 많으며, GC-FID 또는 GC-MS(질량분석기 결합)를 통해 벤젠, 톨루엔 등 개별 성분을 정성·정량함으로써 특정대기유해물질(Day119 예고) 관리의 기초자료로 활용된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 흡광광도법의 원리(램버트-비어 법칙)를 설명하고 계산하시오. *(114~138회 다수 25점 계산형)*\n2. 기체크로마토그래피의 원리와 주요 검출기를 설명하시오. *(120회 10~25점)*\n3. 자외선형광법과 화학발광법의 원리를 설명하시오. *(126회 25점)*\n4. NO2 농도 산정 방식(컨버터 이용)을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n가스상 물질 분석법 문제는 \"왜 이 물질에는 이 분석법이 적합한가\"라는 물질별 특성과의 연계를 강조하면 답안의 깊이가 더해진다. 화학발광법의 NO2 산정 방식(총NOx-NO=NO2)은 계산문제로 자주 출제되므로 공식을 정확히 암기해야 한다.\n\n### 다음 학습 연계\nDay 108은 Day101~107 측정(공정시험기준) 파트 전체를 종합 복습하는 회독일로, 총칙부터 가스상물질 분석까지의 전체 흐름을 다시 한번 정리한다.\n\n### 암기 카드 5선\n1. **흡광광도법** = A=ε·c·l(램버트-비어 법칙)\n2. **GC 검출기** = FID(탄화수소), ECD(할로겐), TCD(범용)\n3. **자외선형광법** = SO2 연속자동측정\n4. **화학발광법** = NO+O3 반응, NOx 연속자동측정\n5. **NO2 산정** = 총NOx(컨버터)-NO=NO2\n6. **검출한계** = 신뢰성있게 검출가능한 최소농도, 미달시 불검출 표기\n\n### 답안 확장 포인트\n가스상 물질 분석법 문제는 각 방법의 원리 나열에 그치지 않고, \"왜 이 물질 조합(SO2-자외선형광법, NOx-화학발광법)이 표준으로 자리잡았는가\"(선택성·민감도·연속측정 적합성)까지 설명하면 심화된 답안이 된다. 아울러 GC의 검출기 선택 문제는 \"탄화수소=FID, 할로겐화합물=ECD\"라는 대응관계를 확실히 암기해두는 것이 실전에 유리하다."}]},"108":{"day":108,"date":"2026-11-16","title":"2단계 가스상·연소·측정 회독 7회차","keywords":[{"k":"공정시험기준 총칙","subs":["표준상태(0℃,1기압), 건조·습가스","표준산소농도 보정","QA/QC(바탕시료·첨가회수율)"]},{"k":"배출가스 먼지측정","subs":["측정공 위치(직관부)+등속흡입","등속계수 90~110%","반자동식(중량법)=TMS 기준측정법"]},{"k":"환경대기 측정","subs":["측정소 입지(도시·도로변·배경농도)","베타선흡수법·광산란법","PM10·PM2.5 분립장치"]},{"k":"가스상물질 분석","subs":["흡광광도법(램버트-비어)","GC(FID·ECD·TCD)","자외선형광법(SO2)·화학발광법(NOx)"]},{"k":"측정 파트 전체구조","subs":["총칙→배출가스→환경대기→분석법 순","기준측정법 vs 연속자동측정법","정도검증 상호관계"]}],"answer":"# 2단계 회독 7회차 — Day 101~107 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 측정 파트의 **총론(공정시험기준 총칙) → 배출가스 측정(측정공·등속흡입·먼지) → 환경대기 측정(측정소·먼지) → 가스상물질 분석**으로 이어지는 계통적 흐름을 가진다. 이전 3단계(자동차·선박)가 배출원별 기술·정책이었다면, 이번 구간은 \"어떻게 정확하게 측정할 것인가\"라는 방법론 중심이므로, 절차의 순서와 각 단계가 왜 필요한지를 논리적으로 암기하는 것이 효과적이다.\n\n```\n공정시험기준 총칙(Day101)\n   ↓ 표준상태·농도단위·QA/QC 정의\n배출가스 측정\n   ├─ 측정공 위치(Day102): 직관부 확보\n   ├─ 등속흡입·등속계수(Day103): 90~110%\n   └─ 먼지측정 반자동식(Day104): 중량법=기준측정법\n        ↓\n환경대기 측정\n   ├─ 측정소 입지(Day105): 도시·도로변·배경농도\n   └─ 먼지측정법(Day106): 중량법·베타선흡수법·광산란법\n        ↓\n가스상물질 분석(Day107): 흡광광도법·GC·자외선형광법·화학발광법\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 표준상태 | **0℃, 1기압(760mmHg)** | ☐ |\n| 등속계수 유효범위 | **90~110%** | ☐ |\n| 표준산소농도 보정식 | C보정=C실측×(21−Cs)/(21−O2실측) | ☐ |\n| 램버트-비어 법칙 | **A=ε·c·l** | ☐ |\n| PM10·PM2.5 절단입경 | **10㎛ / 2.5㎛** | ☐ |\n| NO2 산정 | 총NOx(컨버터)−NO=NO2 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **먼지농도**: C(mg/Sm³)=포집먼지량(mg)/표준상태건조가스흡입량(Sm³)\n2. **표준상태 환산**: 환산가스량=실측가스량×(273/(273+t))×(P/760)\n3. **등속계수**: I(%)=(노즐흡입유속/배출가스유속)×100\n4. **표준산소농도 보정**: C보정=C실측×(21−Cs)/(21−O2실측)\n5. **흡광도(램버트-비어)**: A=ε·c·l\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 배출가스 vs 환경대기 측정 | 고농도, 등속흡입 필수 | 저농도, 등속흡입 불필요 | 측정 목적(배출원 vs 수용지점) |\n| 중량법 vs 베타선흡수법 | 최고정확도, 사후분석 | 실시간, 정확도 다소 낮음 | 정확도-실시간성 트레이드오프 |\n| 건조가스 vs 습가스 | 수분 제거 | 수분 포함 | 총칙 정의(Day101) |\n| 자외선형광법 vs 화학발광법 | SO2 측정 | NOx 측정 | 대상물질 |\n| FID vs ECD | 탄화수소 민감 | 할로겐화합물 민감 | 검출대상 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 대기오염 공정시험기준 총칙의 주요 개념(표준상태·QA/QC)을 설명하시오. *(다수 회차 10점)*\n2. 등속흡입과 등속계수를 계산하시오. *(114~138회 다수 25점 계산형)*\n3. 반자동식 먼지측정법의 원리와 표준산소농도 보정을 계산하시오. *(다수 회차 25점)*\n4. 환경대기측정소의 입지 선정 원칙과 유형을 설명하시오. *(120회 10점)*\n5. PM10·PM2.5 측정법(중량법·베타선흡수법)을 비교 설명하시오. *(126회 25점)*\n6. 가스상물질 분석법(흡광광도법·GC·자외선형광법·화학발광법)을 비교 설명하시오. *(다수 회차 25점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 총칙→배출가스→환경대기→분석법의 논리적 연결을 설명해본다.\n2. **공식 암기 확인(20분)**: Ⅲ의 5개 공식을 백지에 써보고, 등속계수·먼지농도 계산문제를 각 1개씩 직접 풀어본다.\n3. **비교표 재구성(20분)**: Ⅳ의 5개 비교쌍을 스스로 표로 다시 그려본다.\n4. **기출 구술(30분)**: Ⅴ의 6문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: 등속흡입·등속계수(Day103)나 표준산소농도 보정(Day101·104)이 어려웠다면 재복습 권장.\n\n> 측정 파트는 계산문제 출제빈도가 매우 높은 영역이다. 공식을 암기하는 데 그치지 않고, 반드시 직접 손으로 계산해보는 연습이 필요하다.\n\n## Ⅶ. 측정 파트 전반부(Day101~107) 회고\n\nDay101(총칙)부터 Day107(가스상물질 분석)까지는 대기오염 공정시험기준의 핵심 골격을 다뤘다. 이 구간의 가장 중요한 통찰은 \"모든 측정법에는 기준측정법(참값에 가까운 정밀분석)과 연속자동측정법(실시간이지만 정확도가 다소 낮은 방법)이 짝을 이루며, 후자는 정기적으로 전자와 비교하여 정도검증을 받는다\"는 구조가 반복된다는 점이다. 반자동식(중량법)과 TMS의 관계, 중량법과 베타선흡수법의 관계가 모두 이 구조를 따른다는 것을 이해하면, 이후 Day111~113에서 학습할 TMS 관련 내용도 동일한 논리로 쉽게 이해할 수 있다.\n\n## Ⅷ. 학습전략 재점검\n\n측정 파트는 이론 파트(1~2단계)와 달리 계산문제 비중이 매우 높으므로, 단순히 개념을 읽고 넘어가는 학습방식으로는 실전 대응력이 부족할 수 있다. 이번 회독을 기점으로, 앞으로는 매 계산공식마다 최소 1개의 숫자예제를 직접 손으로 풀어보는 습관을 들이는 것이 바람직하다. 특히 등속계수·먼지농도·표준산소농도보정·램버트-비어 법칙의 4개 공식은 서로 다른 상황에서 조합되어 출제되는 경우가 많으므로(예: 먼지농도 계산 후 표준산소농도 보정까지 요구하는 복합문제), 개별 공식 암기를 넘어 여러 공식을 연계하여 순차적으로 적용하는 훈련이 중요하다. 또한 이번 구간에서 학습한 QA/QC 개념(바탕시료, 첨가회수율, 숙련도시험)은 이후 Day110의 정도관리 파트에서 더욱 심화되어 다뤄지므로, 지금 단계에서 대략적인 개념만 잡아두고 완벽한 암기는 다음 학습 단계로 미루어도 무방하다.\n","side":[{"title":"측정 파트 전반부 종합 비교표","body":"### 측정법별 정확도-실시간성 매트릭스\n| 측정법 | 대상 | 정확도 | 실시간성 |\n|---|---|---|---|\n| 반자동식(중량법) | 배출가스 먼지 | 최고(기준) | 낮음 |\n| TMS | 배출가스 먼지·가스 | 중간 | 높음(연속) |\n| 중량법 | 환경대기 PM | 최고(기준) | 낮음 |\n| 베타선흡수법 | 환경대기 PM | 중간 | 높음(연속) |\n| 흡광광도법 | 가스상물질 | 높음 | 낮음(실험실) |\n| 자외선형광법·화학발광법 | SO2·NOx | 높음 | 높음(연속) |\n\n### 계산형 문제 대비 공식 재점검\n등속계수·먼지농도·표준산소농도보정·램버트-비어법칙 4개 공식은 매 회차 최소 1문제 이상 출제되는 핵심 계산공식이므로, 이번 회독에서 4개 공식 모두 막힘없이 유도·적용할 수 있는지 재점검해야 한다.\n\n### 총칙과 각론의 관계 재확인\nDay101 총칙에서 정의한 표준상태·농도단위·QA/QC 개념은 Day102~107의 모든 각론에서 전제조건으로 반복 사용되므로, 총칙 개념이 흔들리면 각론 전체의 이해도 흔들린다는 점을 명심해야 한다.\n\n### 배출가스와 환경대기 측정법 대비 재정리\n배출가스 측정(Day102~104)은 등속흡입이 필수인 반면, 환경대기 측정(Day105~106)은 저농도·광범위 측정 특성상 등속흡입이 불필요하다는 차이를 다시 한번 명확히 정리해두어야 하며, 이 대비구조는 두 파트를 비교하는 통합형 문제에 자주 활용된다.\n\n### 계산문제 유형별 재점검 전략\n지금까지 다룬 계산문제는 크게 두 유형으로 나뉜다. 첫째는 하나의 공식만으로 답이 나오는 단일공식형(예: 등속계수 계산)이고, 둘째는 여러 공식을 순차 적용해야 하는 복합형(예: 표준상태환산→먼지농도산정→표준산소농도보정)이다. 실전에서는 복합형 문제의 출제빈도가 높으므로, 이번 회독에서는 특히 복합형 계산문제를 단계별로 나누어 각 단계마다 정확히 어떤 공식이 적용되는지 명확히 설명하는 연습에 집중하는 것이 효과적이다."},{"title":"암기 카드 — Day 101~107 핵심 20선","body":"1. **표준상태** = 0℃, 1기압\n2. **건조가스 vs 습가스** = 수분제거 여부\n3. **QA/QC** = 바탕시료+첨가회수율+숙련도시험\n4. **직관부 원칙** = 상류측 이격거리 > 하류측\n5. **측정점 분할** = 등면적 구분\n6. **등속흡입** = 흡입속도=배출가스유속\n7. **등속계수** = I=(흡입유속/배출가스유속)×100, 90~110%\n8. **과대흡입** = 미세입자 과다포집\n9. **과소흡입** = 조대입자 과다포집\n10. **반자동식** = 등속흡입+여과지중량법\n11. **먼지농도식** = C=포집먼지량/표준상태건조가스량\n12. **TMS관계** = 반자동식이 정도검증 기준측정법\n13. **환경대기측정소** = 도시·도로변·배경농도·교외\n14. **채취높이** = 호흡대 대표높이\n15. **중량법(환경대기)** = 최고정확도 기준측정법\n16. **베타선흡수법** = 베타선감쇠, 실시간연속\n17. **광산란법** = 산란광세기, 간이측정\n18. **흡광광도법** = A=ε·c·l\n19. **GC검출기** = FID(탄화수소)·ECD(할로겐)·TCD(범용)\n20. **자외선형광법·화학발광법** = SO2·NOx 연속자동측정\n\n### 회독 진도 메모\n측정 파트 전반부(Day101~107)가 완료되었다. 다음은 Day109~115로 TMS·측정정도관리·측정망 등 심화 주제로 이어진다.\n\n### 취약도 자가진단 체크리스트\n아래 중 3개 이상 막힘없이 설명이 안 되면 해당 Day를 재복습할 것: ① 표준산소농도 보정식 유도(Day101) ② 측정공 직관부 원칙(Day102) ③ 등속계수 계산(Day103) ④ 먼지농도 계산 전체과정(Day104) ⑤ 측정소 유형별 목적(Day105) ⑥ 램버트-비어 법칙 계산(Day107)."}]},"109":{"day":109,"date":"2026-11-17","title":"THC/FID, FTIR, LIDAR","keywords":[{"k":"THC/FID","subs":["총탄화수소(Total Hydrocarbon) 측정","불꽃이온화검출기(FID) 원리","VOCs 관리·누출감시(LDAR)에 활용"]},{"k":"FTIR(푸리에변환적외선분광법)","subs":["다성분 동시분석 가능","적외선 흡수스펙트럼으로 정성·정량","비접촉·원격측정 응용"]},{"k":"LIDAR(라이다)","subs":["레이저 광 산란·흡수로 원격측정","광범위 대기오염 분포 파악","이동오염원·비산먼지 감시"]},{"k":"원격측정법의 특징","subs":["비접촉·비파괴 측정","넓은 공간적 범위 커버","점측정 대비 상대적 정확도 한계"]},{"k":"측정법 선택 실무","subs":["누출감시(LDAR)에는 THC/FID","다성분 실시간 분석엔 FTIR","광역 오염원 추적엔 LIDAR"]}],"answer":"# THC/FID, FTIR, LIDAR\n\n## Ⅰ. 개요\n\nDay107에서 학습한 GC-FID가 실험실에서 개별 VOCs 성분을 분리·정량하는 방법이라면, 이번 Day에서 다루는 THC/FID, FTIR, LIDAR는 현장에서 총량 또는 다성분을 신속하게, 나아가 원격으로 측정할 수 있는 방법들이다. 이들은 특히 석유화학단지 등 VOCs 누출감시(LDAR, Leak Detection And Repair)와 대기오염물질의 공간적 분포 파악에 실무적으로 널리 활용된다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. THC/FID(총탄화수소 측정)\n\n### 1. 측정 원리\nTHC(Total Hydrocarbon, 총탄화수소)는 개별 성분을 분리하지 않고 시료가스를 직접 불꽃이온화검출기(FID)에 도입하여, 탄화수소류 전체가 불꽃 속에서 이온화될 때 발생하는 전류를 측정함으로써 탄화수소의 총량을 신속하게 정량하는 방법이다.\n\n| 구분 | GC-FID(Day107) | THC/FID |\n|---|---|---|\n| 목적 | 개별 성분 분리·정량 | 총량(합산량) 신속측정 |\n| 소요시간 | 분석시간 김(분리과정 필요) | 매우 짧음(즉시성) |\n| 활용 | 정밀 성분분석 | 현장 누출감시, 배출허용기준(THC) 판정 |\n\n### 2. LDAR(누출감지·보수) 제도와의 연계\n석유화학단지 등에서는 배관·밸브 등 설비 이음부에서의 VOCs 누출을 정기적으로 점검해야 하며, 이때 휴대용 THC/FID 측정기로 누출농도를 신속히 확인하고, 기준을 초과하면 보수(Repair)하는 LDAR 제도가 운영된다.\n\n## Ⅲ. FTIR(푸리에변환적외선분광법)\n\n### 1. 측정 원리\nFTIR은 적외선을 시료가스에 조사했을 때 각 물질이 고유한 파장에서 적외선을 흡수하는 특성(적외선 흡수스펙트럼)을 이용하여, 하나의 측정으로 다수의 가스상물질을 동시에 정성·정량할 수 있는 분석법이다.\n\n### 2. FTIR의 장점\n| 장점 | 내용 |\n|---|---|\n| 다성분 동시분석 | 하나의 스펙트럼에서 여러 물질을 동시 검출 |\n| 비접촉 측정 가능 | 개방경로(Open-path) 방식으로 원격측정 응용 |\n| 실시간성 | 스펙트럼 처리 속도가 빨라 준실시간 분석 가능 |\n\n### 3. 개방경로 FTIR(OP-FTIR)\n개방경로 FTIR은 발신부와 수신부 사이의 대기 중 오염물질 농도를 적외선 흡수량으로 원격 측정하는 방식으로, 매립지·산업단지 등 넓은 부지의 경계면 농도를 감시하는 데 활용된다.\n\n### 4. FTIR의 한계와 보완\nFTIR은 물질별 고유 흡수스펙트럼이 서로 겹치는 경우 개별 성분의 정확한 정량이 어려워질 수 있으며, 이 경우 다변량 통계기법(화학계량학)을 활용한 스펙트럼 해석 소프트웨어의 지원이 필요하다. 또한 수증기·이산화탄소와 같이 대기 중 농도가 매우 높은 성분이 목표물질의 흡수피크와 겹치는 경우, 이를 배제하는 보정과정이 함께 요구된다.\n\n## Ⅳ. LIDAR(라이다)\n\n### 1. 측정 원리\nLIDAR(Light Detection And Ranging)는 레이저 광을 대기 중으로 발사한 후, 대기 중 오염물질(먼지, 특정가스)에 의해 산란되거나 흡수되어 되돌아오는 광신호를 분석하여, 거리에 따른 오염물질 농도 분포를 원격으로 파악하는 기술이다.\n\n### 2. LIDAR의 활용 분야\n| 활용 분야 | 내용 |\n|---|---|\n| 비산먼지 감시 | 공사장·산업단지 등 비산먼지 발생원 추적 |\n| 이동오염원 배출플룸 관측 | 굴뚝 등에서 배출되는 오염물질 플룸의 확산 관찰 |\n| 광역 대기질 분포 파악 | 도시 규모의 오염물질 공간분포 지도화 |\n\n### 3. LIDAR의 한계\nLIDAR는 넓은 공간을 신속히 스캔할 수 있는 장점이 있으나, 점측정법(중량법 등) 대비 절대농도의 정확도가 상대적으로 낮고, 기상조건(강수·안개 등)의 영향을 받기 쉽다는 한계가 있다.\n\n## Ⅴ. 세 측정법의 종합 비교와 실무 선택기준\n\n### 1. 종합 비교\n| 구분 | THC/FID | FTIR | LIDAR |\n|---|---|---|---|\n| 측정대상 | 총탄화수소(총량) | 다성분 가스상물질 | 먼지·특정가스 공간분포 |\n| 측정거리 | 접촉식(누출점) | 근거리~중거리(개방경로) | 원거리(수백m~수km) |\n| 주요 활용처 | 석유화학단지 LDAR | 매립지·산업단지 경계 | 도시·광역 대기질 지도화 |\n| 데이터 형태 | 단일 농도값 | 다성분 스펙트럼 | 거리별 농도분포(단면도) |\n\n### 2. 실무 선택기준\n측정목적이 \"특정 누출지점의 신속확인\"이라면 THC/FID, \"부지경계에서의 다성분 동시감시\"라면 FTIR, \"광역 오염원 위치추적이나 확산양상 관찰\"이라면 LIDAR를 선택하는 것이 실무의 일반적 원칙이며, 대규모 사업장에서는 이 세 방법을 상호보완적으로 병행 활용하는 경우도 많다.\n\n## Ⅵ. 결론\n\nTHC/FID, FTIR, LIDAR는 각각 신속한 총량측정, 다성분 동시분석, 광역 원격측정이라는 서로 다른 강점을 가진 현장·원격 측정기술로, Day101~108에서 학습한 표준 측정법(중량법, 흡광광도법 등)을 보완하여 실무 현장의 다양한 요구(누출감시, 경계면 감시, 광역 오염원 추적)에 대응한다. 측정목적에 따라 정확도가 필요한 경우 표준측정법을, 신속성·광역성이 필요한 경우 이번 Day의 방법들을 선택적으로 활용하는 것이 실무의 원칙이다.\n\n| 요약 | 핵심 |\n|---|---|\n| THC/FID | 총탄화수소 신속측정, LDAR 활용 |\n| FTIR | 다성분 동시분석, 개방경로 원격측정 |\n| LIDAR | 레이저 산란·흡수, 광역 공간분포 파악 |\n| 공통 특징 | 신속성·현장성·원격성 강조 |\n","side":[{"title":"LDAR 제도 실무와 원격측정 사례","body":"### LDAR 운영 절차(개념)\n| 단계 | 내용 |\n|---|---|\n| 정기점검 | THC/FID로 설비 이음부 누출농도 측정 |\n| 기준초과 판정 | 규정 농도(ppm) 초과시 누출로 판정 |\n| 보수(Repair) | 일정 기한 내 보수 실시 |\n| 재점검 | 보수 후 재측정으로 누출 해소 확인 |\n\n### LDAR 대상 설비 유형\nLDAR 점검대상은 밸브, 펌프, 압축기, 플랜지 연결부, 압력방출장치 등 VOCs 누출 가능성이 있는 모든 설비 이음부를 포함하며, 대규모 석유화학단지의 경우 수만 개에 달하는 점검대상 설비를 체계적으로 관리하기 위한 전산화된 점검이력 관리시스템이 함께 운영되는 경우가 많다.\n\n### 개방경로 FTIR 활용 사례\n매립지 경계면에 발신부와 수신부를 설치하여 메탄 등 매립가스의 누출 여부를 상시 감시하거나, 산업단지 경계에서 특정 VOCs의 부지경계 농도를 실시간 모니터링하는 데 개방경로 FTIR이 활용된다.\n\n### LIDAR와 위성관측의 연계\n최근에는 지상 LIDAR와 위성 기반 원격탐사자료를 결합하여 광역 대기질을 입체적으로 파악하려는 시도가 늘고 있으며, 이는 국가 단위를 넘어선 월경성 대기오염(예: 국외 유입 미세먼지) 분석에도 활용되는 추세이다.\n\n### THC/FID 휴대용 장비의 현장 활용 특징\n휴대용 THC/FID 측정기는 배터리로 구동되며 수 초 내에 반응값을 표시할 수 있어, 넓은 사업장 부지를 순회하며 다수의 누출 가능 지점을 신속하게 점검하는 데 적합하고, 이러한 신속성이 LDAR 제도의 실효성을 뒷받침하는 핵심 요소이다.\n\n### FTIR 스펙트럼 해석의 실무 난이도\nFTIR로 얻어진 스펙트럼에서 여러 물질의 흡수피크가 중첩되는 경우 해석이 복잡해질 수 있어, 숙련된 분석자의 경험과 표준 스펙트럼 라이브러리와의 대조가 정확한 정성·정량분석에 필수적이다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. THC/FID의 원리와 LDAR 제도를 설명하시오. *(114~138회 다수 10~20점)*\n2. FTIR의 원리와 개방경로 측정의 장점을 설명하시오. *(120회 10점)*\n3. LIDAR의 원리와 활용 분야를 설명하시오. *(126회 10점)*\n4. 원격측정법의 장단점을 점측정법과 비교하여 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n이번 Day의 측정법들은 \"왜 이 방법이 필요한가\"(정밀도가 다소 낮아도 신속성·광역성이 필요한 실무 상황)라는 목적론적 서술로 접근하면 표준측정법과의 차별점이 명확해진다. GC-FID(Day107)와 THC/FID의 차이(개별성분 vs 총량)를 명확히 구분하는 것이 핵심 채점포인트이다.\n\n### 다음 학습 연계\nDay 110(측정 정도관리 - 오차·불확도·검출한계)에서 이번 Day를 포함한 모든 측정법에 공통적으로 적용되는 정도관리 개념을 심화 학습한다.\n\n### 암기 카드 4선\n1. **THC/FID** = 총탄화수소 신속측정, LDAR 활용\n2. **FTIR** = 적외선흡수스펙트럼, 다성분 동시분석\n3. **개방경로(OP-FTIR)** = 발신-수신부 사이 원격측정\n4. **LIDAR** = 레이저 산란·흡수, 광역 공간분포\n\n### 답안 확장 포인트\n이번 Day의 세 측정법은 \"왜 표준측정법만으로는 부족한가\"(현장 신속대응, 넓은 공간 커버 필요성)라는 실무적 필요성에서 출발했다는 점을 서두에 제시하면, 표준측정법(Day101~107)과의 관계 속에서 논리적으로 설명하는 완결된 답안이 된다."}]},"110":{"day":110,"date":"2026-11-18","title":"측정 정도관리 - 오차·불확도·검출한계","keywords":[{"k":"정확도와 정밀도","subs":["정확도: 참값과의 근접성","정밀도: 반복측정값의 재현성","두 개념은 독립적으로 평가"]},{"k":"오차의 종류","subs":["계통오차(일정방향 편향)","우연오차(무작위 변동)","과실오차(조작실수)"]},{"k":"측정불확도","subs":["측정값이 참값에서 벗어날 수 있는 범위","합성표준불확도·확장불확도","불확도 요인 식별과 정량화"]},{"k":"검출한계·정량한계","subs":["검출한계(LOD): 검출가능 최소농도","정량한계(LOQ): 정량가능 최소농도","LOQ는 통상 LOD의 일정 배수"]},{"k":"정도관리 도구","subs":["관리도(Control Chart)","숙련도시험(PT)","실험실간 비교시험"]}],"answer":"# 측정 정도관리 - 오차·불확도·검출한계\n\n## Ⅰ. 개요\n\nDay101~109에서 학습한 모든 측정법은 필연적으로 오차를 수반하며, 측정결과가 신뢰할 수 있는 수준인지를 정량적으로 평가·관리하는 체계가 정도관리(QA/QC)이다. 정도관리는 정확도·정밀도라는 두 축으로 측정의 질을 평가하고, 오차의 종류를 구분하여 원인별로 대응하며, 불확도와 검출한계라는 통계적 지표로 측정결과의 신뢰수준을 명시한다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 정확도와 정밀도\n\n### 1. 개념 구분\n| 구분 | 정의 | 평가 방법 |\n|---|---|---|\n| 정확도(Accuracy) | 측정값이 참값에 얼마나 가까운가 | 표준물질·인증시료와의 비교 |\n| 정밀도(Precision) | 반복측정값들이 서로 얼마나 일치하는가 | 표준편차·상대표준편차(RSD) |\n\n### 2. 정확도-정밀도의 독립성\n정확도가 높다고 정밀도가 반드시 높은 것은 아니며, 그 반대도 마찬가지이다. 예를 들어 계통오차가 있는 측정기는 반복측정값이 서로 매우 일치(높은 정밀도)하더라도 참값에서 일정하게 벗어나(낮은 정확도) 있을 수 있다. 이 두 개념을 과녁의 탄착군에 비유하면, 정밀도는 탄착점들이 얼마나 모여 있는가, 정확도는 탄착군의 중심이 과녁 중앙에 얼마나 가까운가로 설명할 수 있다.\n\n## Ⅲ. 오차의 종류\n\n| 오차 종류 | 특징 | 원인 예시 |\n|---|---|---|\n| 계통오차(Systematic Error) | 일정한 방향으로 편향, 반복해도 해소 안됨 | 장비 교정불량, 표준물질 오차 |\n| 우연오차(Random Error) | 무작위 변동, 반복측정으로 평균화 가능 | 환경조건 미세변동, 기기 잡음 |\n| 과실오차(Gross Error) | 명백한 조작실수 | 시약 오배합, 기록오류 |\n\n계통오차는 정기적 교정과 표준물질 검증으로, 우연오차는 반복측정과 통계처리로, 과실오차는 절차 준수와 이중확인으로 각각 대응해야 한다는 점에서 오차의 종류 구분이 곧 대응방안 수립의 출발점이 된다.\n\n## Ⅳ. 측정불확도\n\n### 1. 측정불확도의 정의\n측정불확도(Uncertainty)는 측정결과에 합리적으로 부여할 수 있는 참값의 분포범위를 정량화한 값으로, 단순히 \"오차가 있다\"는 정성적 서술을 넘어 \"측정값 ± 불확도\" 형태로 신뢰구간을 명시하는 국제표준화된 표현방식이다.\n\n### 2. 불확도 요인의 식별과 합성\n| 불확도 요인 | 예시 |\n|---|---|\n| 표준물질의 불확도 | 인증표준물질(CRM) 자체의 인증값 불확도 |\n| 측정기기의 불확도 | 교정 시 부여된 기기 자체 불확도 |\n| 측정조건의 변동 | 온도·압력 등 환경조건 변동 |\n| 분석자·절차의 변동 | 반복성·재현성에 기인한 불확도 |\n\n각 요인별 불확도를 통계적으로 합성한 것이 합성표준불확도이며, 여기에 신뢰수준(통상 95%)에 해당하는 포함인자(k, 통상 2)를 곱하여 확장불확도를 산정한다.\n\n**확장불확도 U = k × 합성표준불확도**\n\n## Ⅴ. 검출한계·정량한계와 정도관리 도구\n\n### 1. 검출한계(LOD)와 정량한계(LOQ)\n| 구분 | 정의 | 관계 |\n|---|---|---|\n| 검출한계(LOD) | 신뢰성 있게 \"검출되었다\"고 판단할 수 있는 최소농도 | 바탕시료 반복측정의 표준편차 기반 산정 |\n| 정량한계(LOQ) | 신뢰성 있게 \"정량\"할 수 있는 최소농도 | 통상 LOD의 약 3~3.3배 수준으로 설정 |\n\n측정값이 LOD 미만이면 \"불검출\"로, LOD 이상 LOQ 미만이면 \"검출되었으나 정량 불가\"로, LOQ 이상이면 정량값으로 각각 다르게 보고하는 것이 정도관리의 원칙이다.\n\n### 2. 정도관리 도구\n| 도구 | 목적 |\n|---|---|\n| 관리도(Control Chart) | 반복측정값의 시계열 추이를 관리한계선과 비교하여 이상 여부 판단 |\n| 숙련도시험(Proficiency Test) | 분석기관·분석자의 분석능력을 외부기관이 평가 |\n| 실험실간 비교시험 | 동일시료를 복수 기관이 분석하여 결과 일치도 검증 |\n\n## Ⅵ. 정도관리와 이후 학습 파트의 연계\n\n### 1. TMS 정도검사와의 관계 예고\nDay112에서 학습할 TMS 상대정확도시험은 본질적으로 이번 Day의 \"정확도\" 개념을, 편향시험은 \"계통오차 점검\" 개념을 각각 구체적 시스템에 적용한 것이다. 즉 이번 Day의 정도관리 이론은 이후 TMS 파트 전체를 이해하는 개념적 토대가 된다.\n\n### 2. 측정대행업 관리와의 관계 예고\nDay115에서 학습할 측정대행업의 숙련도시험 참여 의무 역시, 이번 Day에서 정도관리 도구로 제시한 숙련도시험 개념이 실제 제도로 구현된 사례이다. 이처럼 정도관리는 측정 파트 후반부 전체를 관통하는 공통 원리로 기능한다.\n\n## Ⅶ. 결론\n\n측정 정도관리는 정확도·정밀도의 구분, 오차 종류별 원인 분석, 불확도의 정량화, 검출한계·정량한계의 설정이라는 다층적 체계를 통해 Day101~109의 모든 측정법이 신뢰할 수 있는 결과를 산출하도록 뒷받침하는 핵심 기반이다. 정도관리 없는 측정값은 법적·행정적 근거로서의 효력을 인정받기 어려우므로, 측정 실무자는 정도관리 절차를 측정 그 자체만큼 중요하게 인식해야 한다.\n\n| 요약 | 핵심 |\n|---|---|\n| 정확도·정밀도 | 참값근접성 vs 반복재현성, 독립적 개념 |\n| 오차 종류 | 계통·우연·과실오차 |\n| 불확도 | 확장불확도=k×합성표준불확도 |\n| 검출한계 | LOD<LOQ, 검출·정량 판정기준 |\n| 후속연계 | TMS정도검사(Day112), 측정대행업관리(Day115) |\n","side":[{"title":"정도관리 개념 심화와 계산 예제","body":"### 정확도·정밀도 조합 4가지 유형\n| 유형 | 정확도 | 정밀도 | 해석 |\n|---|---|---|---|\n| 이상적 | 높음 | 높음 | 참값에 근접하고 일관됨 |\n| 계통오차형 | 낮음 | 높음 | 일관되지만 편향됨(교정필요) |\n| 우연오차형 | 높음 | 낮음 | 평균은 맞지만 변동 큼(반복측정 필요) |\n| 최악 | 낮음 | 낮음 | 편향+변동 모두 존재 |\n\n### 확장불확도 계산 예제\n합성표준불확도가 0.8mg/Sm³이고 포함인자 k=2(95% 신뢰수준)라면:\n\n확장불확도 U = 2 × 0.8 = **1.6 mg/Sm³**\n\n측정결과가 21.3mg/Sm³이라면 \"21.3 ± 1.6 mg/Sm³(95% 신뢰수준)\"과 같이 표기하는 것이 불확도를 포함한 완전한 측정결과 보고방식이다.\n\n### 관리도 해석 실무\n관리도에서 측정값이 관리상한선(UCL)이나 관리하한선(LCL)을 벗어나면 해당 분석과정에 이상이 발생했다고 판단하여, 원인 규명과 재교정 전까지 해당 분석결과의 사용을 보류하는 것이 정도관리의 표준 대응절차이다.\n\n### 검출한계 산정 실무 절차\n검출한계는 통상 바탕시료(공시료)를 다수 회(예: 7회 이상) 반복분석하여 얻은 표준편차에 특정 계수(예: 3배)를 곱하여 산정하며, 이렇게 산정된 검출한계는 분석장비·시약·분석자의 상태에 따라 주기적으로 재산정해야 한다.\n\n### 숙련도시험 결과 활용\n숙련도시험에서 특정 분석기관의 결과가 다른 참여기관들의 결과와 크게 벗어나는 경우(이상치), 해당 기관은 자체 분석절차를 재점검하고 원인을 규명하여 개선조치를 취해야 하며, 이는 개별 실험실 수준에서의 정도관리 개선 사이클을 촉발하는 계기가 된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 정확도와 정밀도의 차이를 설명하시오. *(114~138회 다수 10점)*\n2. 오차의 종류(계통·우연·과실오차)를 설명하시오. *(120회 10점)*\n3. 측정불확도의 개념과 확장불확도 산정방법을 설명하시오. *(126회 10~20점)*\n4. 검출한계와 정량한계의 차이를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n정도관리 문제는 개념 정의에 그치지 않고 \"이 개념이 왜 필요한가\"(측정값의 신뢰성을 객관적으로 입증하기 위함)를 함께 서술해야 한다. 정확도-정밀도는 반드시 과녁 비유 등 직관적 설명을 곁들이면 채점자에게 명확히 전달된다.\n\n### 다음 학습 연계\nDay 111(TMS 구성과 부착대상·절차)에서 이번 Day의 정도관리 개념(특히 상대정확도 검증)이 TMS라는 구체적 시스템에 어떻게 적용되는지 학습한다.\n\n### 암기 카드 5선\n1. **정확도** = 참값과의 근접성\n2. **정밀도** = 반복측정값의 재현성\n3. **오차 3종** = 계통오차·우연오차·과실오차\n4. **확장불확도** = U=k×합성표준불확도(k≈2, 95%)\n5. **LOD vs LOQ** = 검출한계<정량한계(약 3~3.3배)\n\n### 답안 확장 포인트\n정도관리 문제는 종종 \"이 개념이 실제로 어디에 적용되는가\"라는 응용형 질문과 결합되어 출제되므로, 이번 Day의 개념(정확도·불확도·검출한계)이 Day112의 TMS 정도확인시험, Day115의 측정대행업 관리와 각각 어떻게 연결되는지 함께 언급하면 답안의 완성도를 크게 높일 수 있다."}]},"111":{"day":111,"date":"2026-11-19","title":"TMS 구성과 부착대상·절차","keywords":[{"k":"TMS 정의","subs":["Tele-Monitoring System, 굴뚝원격감시체계","연속자동측정기기+전송장치","실시간 배출농도 감시"]},{"k":"TMS 구성","subs":["측정기기부(먼지·가스상 분석계)","자료수집기(DAS)","관제센터 전송장치"]},{"k":"부착대상","subs":["대기배출시설 중 일정 규모 이상","1~3종 사업장 중심(종별 규정)","오염물질별 부착의무 상이"]},{"k":"부착 절차","subs":["설치계획서 제출·승인","설치 후 가동시작 신고","정도검사 통과 후 정상가동"]},{"k":"측정항목","subs":["먼지: 광산란법 또는 베타선법 등","SO2: 자외선형광법","NOx: 화학발광법"]}],"answer":"# TMS 구성과 부착대상·절차\n\n## Ⅰ. 개요\n\nTMS(Tele-Monitoring System, 굴뚝원격감시체계)는 대기배출시설의 굴뚝에 연속자동측정기기를 설치하여 먼지·가스상물질의 배출농도를 실시간으로 측정하고, 그 자료를 관제센터로 원격 전송하여 상시 감시하는 시스템이다. Day104~107에서 학습한 각 측정법(반자동식 먼지측정, 자외선형광법, 화학발광법 등)이 TMS의 핵심 측정원리로 실제 구현되며, 이를 통해 배출시설의 상시 배출관리가 가능해진다. *(114~138회 다수 20~25점 기출)*\n\n## Ⅱ. TMS의 구성\n\n### 1. 시스템 구성요소\n| 구성요소 | 역할 |\n|---|---|\n| 측정기기부 | 먼지·가스상물질 분석계로 실시간 배출농도 측정 |\n| 자료수집기(DAS, Data Acquisition System) | 측정신호 수집·환산·저장 |\n| 자료전송장치 | 관제센터(한국환경공단 등)로 실시간 자료 전송 |\n| 유량계 | 배출가스 유량 측정(배출량 산정에 필요) |\n\n### 2. 측정항목별 적용 원리(Day107·109 연계)\n| 항목 | 측정원리 |\n|---|---|\n| 먼지 | 광산란법 또는 베타선흡수법 등 |\n| SO2 | 자외선형광법 |\n| NOx | 화학발광법 |\n| HCl, HF 등 | 비분산적외선법(NDIR) 등 |\n\n### 3. 자료처리 흐름\n측정기기부에서 생성된 원자료(1분 단위 등)는 자료수집기에서 표준상태·표준산소농도 보정(Day101 연계)을 거쳐 정제된 후, 자료전송장치를 통해 관제센터로 실시간 전송되며, 관제센터는 이를 CleanSYS(Day113 예고)를 통해 통합 관리한다.\n\n## Ⅲ. 부착대상과 부착의무\n\n### 1. 부착대상 사업장\nTMS는 대기배출시설 중 일정 규모 이상(주로 1~3종 사업장, Day120에서 학습할 배출시설 종별 분류와 연계)에 부착의무가 부여되며, 오염물질 배출량이 큰 대형 사업장을 중심으로 적용된다.\n\n### 2. 오염물질별 부착의무 차등\n모든 배출시설이 모든 오염물질에 대해 TMS를 부착해야 하는 것은 아니며, 배출량 규모와 오염물질의 종류(먼지, SOx, NOx 등)에 따라 부착의무가 차등 적용된다. 소규모 배출시설은 TMS 대신 자가측정(Day115 예고)으로 관리되는 경우가 많다.\n\n## Ⅳ. TMS 부착 절차\n\n### 1. 절차 개요\n| 단계 | 내용 |\n|---|---|\n| 설치계획서 제출 | 사업자가 관할기관에 TMS 설치계획서 제출 |\n| 설치 승인 | 관할기관의 계획서 검토·승인 |\n| 설치 및 가동시작 신고 | TMS 설치 완료 후 가동시작 신고 |\n| 정도검사(Day112 예고) | 설치된 TMS의 정확성을 정도검사로 검증 |\n| 정상가동 | 정도검사 통과 후 정식 자료로 인정, 관제센터 상시 전송 개시 |\n\n### 2. 정도검사의 중요성\nTMS는 설치만으로 곧바로 신뢰할 수 있는 자료를 생산하는 것이 아니라, Day112에서 학습할 정도확인시험·상대정확도시험 등 정도검사를 통과해야 비로소 공식 배출자료로 인정받을 수 있다. 이는 Day110에서 학습한 정도관리 원칙이 TMS라는 구체적 시스템에 적용된 사례이다.\n\n### 3. TMS 유지관리 의무\n사업자는 TMS를 설치한 이후에도 정기적인 점검·교정·청소 등 유지관리 의무를 지며, 유지관리를 소홀히 하여 측정자료에 이상이 발생하면 무효자료(Day113 예고)로 처리될 수 있다.\n\n## Ⅴ. TMS 설치의 실무적 고려사항\n\n### 1. 설치 위치와 측정공 요건\nTMS 측정기기 역시 Day102에서 학습한 측정공 위치 선정 원칙(직관부 확보)의 적용을 받으며, 다만 상시 가동되는 특성상 유지보수 접근성과 전원·통신 인프라 확보가 추가로 중요하게 고려된다.\n\n### 2. 다항목 통합관리의 실무적 이점\n하나의 굴뚝에 먼지·SO2·NOx 등 여러 측정기를 통합 설치하는 경우, 자료수집기(DAS)가 이들을 일원화하여 관리함으로써 개별 항목의 이상 여부를 종합적으로 진단할 수 있고, 특정 항목의 이상변동이 다른 항목과 연관되어 있는지(예: 연소조건 변화로 NOx와 O2가 동시에 변동) 분석하는 데도 유리하다.\n\n### 3. 유량계와 배출량 산정의 관계\nTMS의 유량계는 배출가스의 유량을 실시간으로 측정하여, 농도(mg/Sm³)뿐 아니라 시간당 총배출량(kg/hr 등)을 함께 산정할 수 있게 하며, 이는 총량관리제(배출권거래제 등)에서 요구하는 배출총량 산정의 핵심 기초자료로 활용된다.\n\n## Ⅵ. 결론\n\nTMS는 Day104~110에서 학습한 개별 측정법과 정도관리 원칙이 종합적으로 구현된 시스템으로, 대형 배출시설의 배출농도를 실시간으로 감시함으로써 상시적인 대기오염 관리를 가능하게 한다. 다만 TMS 자료가 신뢰성을 갖기 위해서는 정도검사 통과와 지속적인 유지관리가 전제되어야 하며, 이는 다음 Day112(정도확인시험과 편향시험)에서 구체적으로 학습한다.\n\n| 요약 | 핵심 |\n|---|---|\n| TMS 정의 | 굴뚝원격감시체계, 실시간 측정+전송 |\n| 구성 | 측정기기부+DAS+전송장치+유량계 |\n| 부착대상 | 대형(1~3종) 사업장 중심, 물질별 차등 |\n| 절차 | 설치계획→승인→설치→정도검사→정상가동 |\n| 실무고려 | 측정공 요건 준수, 다항목 통합관리 |\n","side":[{"title":"TMS 운영 실무와 관리체계","body":"### TMS와 관제센터의 관계\n관제센터(한국환경공단 운영)는 전국 TMS 부착사업장의 실시간 배출자료를 통합 수집하여, 배출허용기준 초과 여부를 상시 모니터링하고 이상징후 발견 시 관할 지자체에 통보하는 역할을 수행한다.\n\n### TMS 자료의 활용 범위\nTMS 자료는 배출허용기준 준수 여부 판정뿐 아니라, 총량관리제(배출권거래 등)의 기초자료, 사업장별 배출특성 분석, 정책효과 평가(저감시설 개선 전후 비교) 등 다양한 목적으로 활용된다.\n\n### TMS 데이터의 시간해상도 활용\nTMS는 통상 1분 단위의 원시자료를 생성하며, 이를 시간·일·월 평균값으로 집계하여 다양한 규제기준(단시간 기준, 일평균 기준 등)과 비교할 수 있게 하므로, 고해상도 원시자료의 확보 자체가 다양한 정책적 활용의 전제조건이 된다는 점도 실무적으로 중요하다.\n\n### 부착대상 확대 추세\n최근에는 중소규모 사업장까지 TMS 부착대상을 단계적으로 확대하려는 정책 방향이 이어지고 있으며, 이는 소규모 다수 배출원의 누적 배출량이 무시할 수 없는 수준이라는 문제의식에서 비롯된다.\n\n### TMS 설치비용 부담과 지원제도\nTMS 설치와 유지관리에는 상당한 비용이 소요되므로, 중소규모 사업장의 부착대상 확대에 대응하여 설치비 일부를 지원하는 제도가 함께 운영되는 경우가 많으며, 이는 정책의 실효성을 높이기 위한 보완장치로 이해할 수 있다.\n\n### TMS와 방지시설 운영의 연계\nTMS 자료는 방지시설의 운전상태(예: 집진기 압력손실, 탈황설비 반응조건)와 함께 분석하면 방지시설의 이상 여부를 조기에 진단하는 데도 활용될 수 있어, 단순 규제감시 수단을 넘어 사업장 자체의 공정관리 도구로도 기능한다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. TMS의 정의와 구성요소를 설명하시오. *(114~138회 다수 20점)*\n2. TMS 부착대상과 부착의무 차등 원칙을 설명하시오. *(120회 10~20점)*\n3. TMS 부착 절차(설치계획서~정상가동)를 설명하시오. *(126회 20점)*\n4. TMS 자료가 관제센터로 전송되는 과정을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nTMS 문제는 단순 구성요소 나열보다 \"왜 정도검사를 통과해야 정식 자료로 인정되는가\"(Day110의 정도관리 원칙과의 연계)를 함께 서술하면 답안의 논리적 깊이가 더해진다.\n\n### 다음 학습 연계\nDay 112(TMS 정도확인시험과 편향시험)에서 TMS가 정식 자료로 인정받기 위해 거쳐야 하는 구체적인 검증절차를 학습한다.\n\n### 답안 확장 포인트\nTMS 문제는 단순 구성요소나 절차 나열에 그치지 않고, \"왜 TMS라는 상시감시체계가 자가측정만으로는 부족한가\"(대형시설의 배출량 기여도가 크므로 상시감시의 사회적 편익이 비용을 상회하기 때문)라는 정책적 논리를 함께 제시하면 답안의 설득력이 한층 높아진다.\n\n### 암기 카드 4선\n1. **TMS** = 굴뚝원격감시체계(Tele-Monitoring System)\n2. **구성** = 측정기기부+DAS+전송장치+유량계\n3. **부착대상** = 대형(1~3종) 사업장, 물질별 차등\n4. **절차** = 설치계획서→승인→설치→정도검사→정상가동"}]},"112":{"day":112,"date":"2026-11-20","title":"TMS 정도확인시험과 편향시험","keywords":[{"k":"정도확인시험 개념","subs":["TMS 측정값의 정확성 정기검증","반자동식(기준측정법)과 비교","상대정확도로 판정"]},{"k":"상대정확도(RA)","subs":["RA=|TMS평균-기준측정법평균|/기준측정법평균×100","일정 기준(%) 이내면 적합 판정","초과시 TMS 재교정·보수"]},{"k":"편향시험(Bias Test)","subs":["표준가스 주입으로 TMS 반응 확인","제로가스·스팬가스 이용","선형성·재현성 검증"]},{"k":"정도검사 주기","subs":["신규설치시 최초정도검사","이후 정기적 정도검사(주기 규정)","교정·수리 후 재검사"]},{"k":"판정 후 조치","subs":["적합: 정상가동 자료로 인정","부적합: 무효자료 처리, 보수 후 재검사","반복 부적합시 행정조치 가능"]}],"answer":"# TMS 정도확인시험과 편향시험\n\n## Ⅰ. 개요\n\nDay111에서 학습한 대로 TMS는 설치만으로 곧바로 신뢰할 수 있는 것이 아니라, 정도확인시험(상대정확도시험)과 편향시험(정도검사의 세부 항목)을 통과해야 정식 배출자료로 인정받는다. 이는 Day110에서 학습한 정도관리 원칙(정확도 검증, 불확도 관리)이 TMS라는 연속자동측정시스템에 구체적으로 적용된 절차로, TMS 자료의 법적·행정적 신뢰성을 담보하는 핵심 관문이다. *(114~138회 다수 20~25점 기출)*\n\n## Ⅱ. 정도확인시험(상대정확도시험)\n\n### 1. 시험 목적과 원리\n정도확인시험은 TMS(연속자동측정값)와 Day104에서 학습한 반자동식(기준측정법) 측정값을 동일한 조건에서 병행 측정하여 비교함으로써, TMS 측정값이 참값에 얼마나 근접한지를 정량적으로 검증하는 시험이다.\n\n### 2. 상대정확도(RA) 산정식\n**상대정확도 RA(%) = |TMS 평균값 − 기준측정법 평균값| / 기준측정법 평균값 × 100**\n\n일반적으로 다수 회(예: 9회 이상)의 병행측정을 실시하여 각각의 평균값을 산정한 후 위 식에 대입하며, 산정된 RA가 규정된 허용범위(통상 20% 이내 등 오염물질·조건별 상이) 이내이면 TMS가 적합하게 작동하는 것으로 판정한다.\n\n### 3. 병행측정 실시 시 유의사항\n| 유의사항 | 이유 |\n|---|---|\n| 동일 시점·동일 조건 측정 | 공정변동에 의한 농도차이 배제 |\n| 충분한 병행측정 횟수 확보 | 통계적 신뢰성 확보 |\n| 기준측정법의 정확한 시행 | 비교기준 자체의 오차 최소화 |\n\n## Ⅲ. 편향시험(Bias Test)\n\n### 1. 편향시험의 목적\n편향시험은 TMS 측정기기에 농도를 알고 있는 표준가스(제로가스·스팬가스)를 직접 주입하여, 측정기기의 반응값이 표준가스의 실제 농도와 얼마나 일치하는지를 검증함으로써 기기 자체의 계통오차(Day110 연계)를 점검하는 시험이다.\n\n### 2. 표준가스 종류와 활용\n| 표준가스 | 목적 |\n|---|---|\n| 제로가스(Zero Gas) | 0점(기준선) 반응 확인 |\n| 스팬가스(Span Gas) | 특정 고농도 지점에서의 반응 확인 |\n\n제로가스와 스팬가스에서의 측정기 반응을 통해 측정기의 선형성(농도-반응값의 비례관계)과 재현성(반복 주입시 일관된 반응)을 함께 검증할 수 있다.\n\n### 3. 정도확인시험과 편향시험의 관계\n| 구분 | 정도확인시험(상대정확도) | 편향시험 |\n|---|---|---|\n| 비교대상 | 실제 배출가스(기준측정법) | 표준가스(알려진 농도) |\n| 검증 내용 | 실제 조건에서의 종합적 정확성 | 기기 자체의 반응 특성(선형성 등) |\n| 상호관계 | 상호보완적으로 TMS 전체 신뢰성 확보 |\n\n## Ⅳ. 정도검사 주기와 판정 후 조치\n\n### 1. 정도검사 주기\n| 시점 | 검사 종류 |\n|---|---|\n| 신규설치 직후 | 최초 정도검사 |\n| 이후 | 정기적 정도검사(규정된 주기, 통상 연 1회 이상) |\n| 주요 부품 교체·수리 후 | 재검사 |\n\n### 2. 판정 결과에 따른 조치\n| 판정 | 조치 |\n|---|---|\n| 적합 | 해당 기간 TMS 자료를 정상 배출자료로 인정 |\n| 부적합 | 무효자료(Day113 예고)로 처리, TMS 보수·재교정 후 재검사 |\n| 반복 부적합 | 행정지도 또는 행정처분 대상이 될 수 있음 |\n\n## Ⅴ. 실무상 시험 절차와 유의사항\n\n### 1. 병행측정 실무 절차\n정도확인시험을 위한 병행측정은 통상 동일한 측정공(또는 인접 측정공)에서 TMS와 반자동식 측정기를 동시에 가동하여 실시하며, 공정 부하율이 정상범위를 벗어난 시점을 피해 대표성 있는 가동조건에서 측정하는 것이 원칙이다.\n\n### 2. 편향시험 결과의 보정 활용\n편향시험에서 일정한 방향의 편향(예: 항상 실제값보다 5% 높게 측정)이 확인되는 경우, 단순 재교정 외에도 해당 편향값을 반영한 보정계수를 적용하여 이후 측정값을 자동 보정하는 방식이 활용되기도 한다.\n\n## Ⅵ. 결론\n\nTMS 정도확인시험(상대정확도시험)과 편향시험은 각각 실제 배출조건에서의 종합적 정확성과 기기 자체의 반응 특성을 검증하는 상호보완적 절차로, 두 시험을 모두 통과해야 TMS 자료가 법적 효력을 갖는 신뢰할 수 있는 배출자료로 인정받는다. 이는 Day110에서 학습한 \"모든 연속자동측정법은 기준측정법과의 정기적 비교검증이 필요하다\"는 정도관리 원리가 TMS에 가장 엄밀하게 적용된 사례라 할 수 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 정도확인시험 | RA=｜TMS-기준측정법｜/기준측정법×100 |\n| 편향시험 | 표준가스(제로·스팬)로 기기반응 검증 |\n| 검사주기 | 최초+정기+수리후 재검사 |\n| 부적합시 | 무효자료 처리, 보수 후 재검사 |\n| 실무활용 | 병행측정 대표성 확보, 편향보정계수 적용 |\n","side":[{"title":"상대정확도 계산 예제","body":"### 계산 예제\n9회 병행측정 결과 TMS 평균 배출농도가 48mg/Sm³, 동일 조건에서 반자동식(기준측정법) 평균값이 45mg/Sm³이었다면:\n\nRA = |48−45| / 45 × 100 ≈ **6.7%**\n\n이 값이 허용범위(예: 20% 이내) 이내이므로 해당 TMS는 적합 판정을 받는다.\n\n만약 기준측정법 평균값이 30mg/Sm³로 낮은 상황에서 TMS 평균값이 40mg/Sm³로 크게 벗어났다면:\n\nRA = |40−30| / 30 × 100 ≈ **33.3%**\n\n허용범위를 초과하므로 부적합 판정, TMS 재교정 및 보수 후 재검사가 필요하다.\n\n### 저농도 조건에서의 RA 해석 유의점\n배출농도가 매우 낮은 조건에서는 절대오차가 작더라도 상대정확도(%) 값이 커지는 경향이 있어, 저농도 시설의 경우 RA 기준 외에 절대오차 기준을 함께 고려하는 보완적 판정방식이 활용되기도 한다.\n\n### 편향시험 계산 예제\n스팬가스 실제농도가 100ppm인 표준가스를 TMS에 주입했을 때 측정기 반응값이 95ppm으로 나타났다면, 편향률은 (100-95)/100×100=5%로 산정되며, 이 값이 허용범위 이내인지 판정기준과 비교하여 적합 여부를 결정한다.\n\n### 정도검사 불합격이 반복되는 경우의 대응\n동일 TMS가 연속하여 정도검사에 불합격하는 경우, 단순 재교정을 넘어 측정원리 자체의 부적합성(예: 배출가스 조성 변화로 인한 간섭물질 영향)을 재검토해야 하며, 필요시 측정기기 자체를 교체하는 방안까지 검토될 수 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. TMS 정도확인시험(상대정확도시험)의 원리와 계산방법을 설명하시오. *(114~138회 다수 25점 계산형)*\n2. 편향시험의 목적과 제로가스·스팬가스의 역할을 설명하시오. *(120회 20점)*\n3. 정도확인시험과 편향시험의 차이를 비교 설명하시오. *(126회 10점)*\n4. TMS 정도검사 부적합 판정 시 조치사항을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n상대정확도 계산문제는 반드시 절댓값 기호를 명시하고, 계산 후 허용범위와 비교하여 적합/부적합을 판정하는 문장으로 마무리해야 완결된 답안이 된다. 정도확인시험과 편향시험을 \"실제조건 vs 표준조건\"이라는 대비구조로 설명하면 명확하다.\n\n### 다음 학습 연계\nDay 113(CleanSYS 무효자료와 대체자료)에서 정도검사 부적합 등으로 발생하는 무효자료를 CleanSYS가 어떻게 처리하는지 학습한다.\n\n### 암기 카드 5선\n1. **정도확인시험** = TMS vs 기준측정법 병행측정 비교\n2. **상대정확도(RA)** = ｜TMS-기준측정법｜/기준측정법×100\n3. **편향시험** = 제로가스·스팬가스로 기기반응 검증\n4. **정도검사 주기** = 최초+정기+수리후 재검사\n5. **부적합 조치** = 무효자료처리+보수+재검사\n\n### 답안 확장 포인트\n정도확인시험과 편향시험을 함께 서술할 때는 \"왜 두 가지 시험이 모두 필요한가\"(실제조건 종합검증만으로는 기기 자체의 반응특성 이상을 놓칠 수 있고, 표준가스 검증만으로는 실제 배출가스 조건의 간섭효과를 반영하지 못하기 때문)라는 상호보완성을 명확히 설명하면 답안의 논리적 완성도가 크게 높아진다."}]},"113":{"day":113,"date":"2026-11-21","title":"CleanSYS 무효자료와 대체자료","keywords":[{"k":"CleanSYS 개념","subs":["굴뚝원격감시체계 통합관리시스템","한국환경공단 운영","TMS 자료 수집·분석·공개"]},{"k":"무효자료 발생사유","subs":["정도검사 부적합 기간","점검·보수·정전 등 미가동 기간","자료전송장애 기간"]},{"k":"대체자료 산정방법","subs":["무효자료 발생 전후 정상자료 활용","동일공정 유사조건 자료 활용","최대값 적용 등 보수적 산정"]},{"k":"자료 활용과 행정처분","subs":["무효자료 기간 배출량은 대체자료로 보정","배출허용기준 초과 판정의 근거자료 활용","허위조작 적발시 강력한 행정·형사처분"]},{"k":"TMS 조작 방지대책","subs":["실시간 원격감시로 조작 곤란화","이상패턴 자동탐지 알고리즘","현장점검과 연계한 교차검증"]}],"answer":"# CleanSYS 무효자료와 대체자료\n\n## Ⅰ. 개요\n\nCleanSYS(Clean Stack, 굴뚝원격감시체계 통합관리시스템)는 Day111~112에서 학습한 TMS로부터 전송되는 배출자료를 통합 수집·분석·공개하는 국가 관제시스템으로, 한국환경공단이 운영한다. TMS는 기기 특성상 정도검사 부적합, 점검·보수, 정전 등으로 일시적으로 정상 측정이 불가능한 기간이 발생할 수 있으며, 이러한 기간의 자료를 무효자료로 처리하고 합리적인 대체자료로 보정하는 체계가 마련되어 있다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. CleanSYS의 역할\n\n### 1. 시스템 기능\n| 기능 | 내용 |\n|---|---|\n| 실시간 자료 수집 | 전국 TMS 부착사업장의 배출자료 통합 수집 |\n| 자료 분석·관리 | 배출허용기준 초과 여부 자동 판정, 이상패턴 탐지 |\n| 정보 공개 | 사업장별 배출현황 등 일반에 공개 |\n| 행정 연계 | 초과 사업장 관할 지자체 통보, 행정조치 근거자료 제공 |\n\n### 2. Day111~112와의 연계\nCleanSYS는 TMS(Day111)가 생산하고 정도검사(Day112)를 통과한 자료를 최종적으로 통합 관리하는 상위 체계로, 세 Day(111~113)는 \"측정(TMS)→검증(정도검사)→통합관리(CleanSYS)\"라는 하나의 연속된 흐름을 이룬다.\n\n## Ⅲ. 무효자료의 발생사유와 처리\n\n### 1. 무효자료 발생사유\n| 사유 | 내용 |\n|---|---|\n| 정도검사 부적합 기간 | Day112의 상대정확도·편향시험 부적합 판정 기간 |\n| 설비 점검·보수 기간 | 정기점검, 고장수리 등으로 측정 중단 |\n| 정전·전송장애 | 전력공급 중단, 통신장애 등으로 자료 미전송 |\n| 공정 비정상 운전 | 배출시설 자체의 비정상 가동으로 대표성 상실 |\n\n### 2. 무효자료 처리 원칙\n무효자료로 판정된 기간은 해당 TMS 측정값을 그대로 사용하지 않으며, 이 기간의 배출량을 합리적으로 추정하기 위한 대체자료 산정 절차가 적용된다.\n\n## Ⅳ. 대체자료 산정방법\n\n### 1. 주요 산정방식\n| 방식 | 내용 |\n|---|---|\n| 전후 정상자료 활용 | 무효자료 발생 직전·직후의 정상 측정값을 기준으로 보간 또는 평균 적용 |\n| 동일공정 유사조건 자료 | 동일 시설의 유사한 가동조건(부하율 등) 시기의 자료 활용 |\n| 보수적(최대값) 적용 | 불확실성이 큰 경우 해당 기간 중 상대적으로 높은 값을 적용하여 과소평가 방지 |\n\n### 2. 대체자료 원칙의 취지\n대체자료 산정은 사업자가 TMS 미가동 기간을 악용하여 배출량을 축소 신고하는 유인을 차단하기 위한 것으로, 일반적으로 무효자료 기간의 배출량을 낮게 추정하기보다 다소 보수적(높게)으로 산정하는 원칙이 적용된다.\n\n## Ⅴ. 자료 활용과 부정행위 방지\n\n### 1. 행정처분 근거로서의 활용\nCleanSYS 자료(정상자료+대체자료)는 배출허용기준 초과 여부 판정과 행정처분의 핵심 근거자료로 활용되며, Day101에서 학습한 \"공정시험기준에 따르지 않은 측정값은 법적 근거로 인정되지 않는다\"는 원칙이 TMS·CleanSYS 체계에도 동일하게 적용된다.\n\n### 2. TMS 조작 방지대책\n| 대책 | 내용 |\n|---|---|\n| 실시간 원격감시 | 사업장이 자료를 임의 조작하기 어려운 구조 |\n| 이상패턴 자동탐지 | 비정상적으로 일정한 값, 급격한 변동 등을 알고리즘으로 탐지 |\n| 현장점검 연계 | 이상탐지시 관할기관의 현장점검으로 교차검증 |\n\n### 3. 부정행위 적발시 조치\nTMS 측정값을 고의로 조작(희석, 우회배출, 자료 조작 등)한 것으로 적발되는 경우, 단순 행정처분을 넘어 형사처벌까지 가능한 중대한 위반행위로 다루어지며, 이는 배출시설 관리의 근간을 흔드는 행위로 엄격히 규제된다.\n\n## Ⅵ. CleanSYS 자료의 법적·행정적 성격 심화\n\n### 1. 자료 보존과 열람권\nCleanSYS에 축적된 배출자료는 일정기간 보존되며, 행정처분 절차나 소송 등에서 객관적 증거자료로 활용될 수 있어, 사업자와 행정기관 모두에게 법적으로 중요한 의미를 가진다.\n\n### 2. 자료 공개 범위와 균형\nCleanSYS 자료 공개는 국민의 알권리와 사업장의 영업비밀 보호 사이에서 적절한 균형을 유지해야 하며, 일반적으로 배출농도·초과여부 등 환경정보는 공개하되, 공정의 세부기술적 사항은 별도로 보호되는 방식으로 운영된다.\n\n## Ⅶ. 결론\n\nCleanSYS는 TMS 자료를 통합 관리하는 국가 관제시스템으로, 무효자료 발생시 합리적인 대체자료 산정을 통해 배출량 추정의 공백을 메우는 동시에, 실시간 원격감시와 이상패턴 탐지를 통해 자료 조작을 방지하는 이중의 역할을 수행한다. 이는 Day111(TMS)→Day112(정도검사)→Day113(CleanSYS·무효자료)로 이어지는 배출자료 관리체계의 최종 단계로서, 배출시설 관리의 신뢰성을 뒷받침하는 핵심 인프라이다.\n\n| 요약 | 핵심 |\n|---|---|\n| CleanSYS | TMS 통합관리시스템, 한국환경공단 운영 |\n| 무효자료 사유 | 정도검사부적합, 점검·보수, 정전·전송장애 |\n| 대체자료 | 전후자료·유사조건자료·보수적(최대값) 산정 |\n| 부정방지 | 원격감시+이상탐지+현장점검 연계 |\n| 자료 성격 | 법적 증거자료, 공개와 영업비밀보호의 균형 |\n","side":[{"title":"무효자료·대체자료 실무 사례","body":"### 무효자료 기간별 대체자료 적용 예시\n| 무효자료 발생 상황 | 대체자료 산정 방식(개념) |\n|---|---|\n| 짧은 정전(수시간) | 전후 정상자료의 평균 또는 보간 |\n| 정도검사 부적합(수일~수주) | 유사 가동조건 시기의 자료 활용 |\n| 장기 설비고장(수개월) | 해당 기간 최대 가동조건에 준하는 보수적 산정 |\n\n### CleanSYS 정보공개의 사회적 의미\nCleanSYS를 통한 배출정보 공개는 시민사회의 감시기능을 강화하고 사업장의 자발적 배출저감 유인을 제공하는 효과가 있으며, 이는 정보공개 자체가 규제수단으로 기능하는 사례로 평가된다.\n\n### 이상패턴 탐지의 기술적 발전\n최근에는 인공지능 기반 이상탐지 알고리즘이 CleanSYS에 도입되어, 단순 임계값 초과뿐 아니라 미세한 패턴 변화(계절성 대비 이상변동 등)까지 탐지하는 방향으로 고도화되고 있다.\n\n### 무효자료 처리와 배출부과금의 관계\n무효자료 기간에 산정된 대체자료는 배출부과금(초과배출부과금 등) 산정의 기초자료로도 활용될 수 있어, 대체자료 산정방식이 사업자의 경제적 부담에 직접적인 영향을 미친다는 점에서 그 합리성과 투명성이 중요하게 요구된다.\n\n### 우회배출·희석 등 부정행위 유형\n사업자가 TMS 측정 지점 이후에 별도의 우회배관을 설치하여 오염물질을 무단 배출하거나, 측정 지점 앞에서 외부공기를 유입시켜 농도를 인위적으로 낮추는 희석행위는 대표적인 TMS 부정행위 유형으로, 현장점검과 배출가스 유량 이상패턴 분석을 통해 적발될 수 있다.\n\n### 무효자료 비율 관리지표\n사업장별로 연간 무효자료 발생비율을 별도로 관리하는 경우가 있으며, 이 비율이 지나치게 높은 사업장은 TMS 유지관리가 부실한 것으로 간주되어 별도의 현장점검 우선순위 대상으로 지정될 수 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. CleanSYS의 개념과 역할을 설명하시오. *(114~138회 다수 10~20점)*\n2. 무효자료의 발생사유를 설명하시오. *(120회 10점)*\n3. 대체자료 산정방법과 그 취지를 설명하시오. *(126회 10~20점)*\n4. TMS 자료 조작 방지대책을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nCleanSYS 문제는 \"왜 대체자료를 보수적으로(높게) 산정하는가\"(사업자의 축소신고 유인 차단)라는 정책적 취지를 함께 서술하면 답안의 완성도가 높아진다. Day111~113을 하나의 흐름(측정→검증→통합관리)으로 묶어 답안 서론에서 제시하면 논리적 구조가 명확해진다.\n\n### 다음 학습 연계\nDay 114(대기오염 측정망의 종류와 항목)에서 TMS(배출원 감시)와 별개로 운영되는 환경대기 측정망 전체 체계를 학습한다.\n\n### 암기 카드 4선\n1. **CleanSYS** = 굴뚝원격감시체계 통합관리시스템(한국환경공단)\n2. **무효자료 사유** = 정도검사부적합, 점검·보수, 정전·전송장애\n3. **대체자료** = 전후자료·유사조건자료·보수적(최대값) 산정\n4. **부정방지** = 원격감시+이상탐지알고리즘+현장점검\n\n### 답안 확장 포인트\nCleanSYS 관련 문제는 단순 시스템 설명에 그치지 않고, 무효자료·대체자료 처리가 궁극적으로 \"측정 공백기간에도 배출관리의 연속성을 확보하기 위한 제도적 장치\"라는 목적을 함께 서술하면, 단순 암기를 넘어선 이해도를 보여줄 수 있다."}]},"114":{"day":114,"date":"2026-11-22","title":"대기오염 측정망의 종류와 항목","keywords":[{"k":"국가대기오염측정망 체계","subs":["도시대기·도로변·국가배경농도·교외측정망","측정망별 설치목적 상이(Day105 연계)","전국 통합 네트워크 구성"]},{"k":"특수목적 측정망","subs":["산성강하물측정망(산성비)","광화학대기오염측정망(오존 등)","대기중금속측정망"]},{"k":"측정항목 구성","subs":["일반항목: SO2,NO2,O3,CO,PM10,PM2.5","특수항목: 중금속, VOCs, 산성강하물","측정망 유형별 항목 차등"]},{"k":"측정자료 활용","subs":["대기환경기준 평가(Day118 연계)","대기질예보·경보 발령","정책효과 분석·연구자료"]},{"k":"측정망 운영체계","subs":["환경부·지자체·환경공단 역할분담","측정망 설치·운영계획 수립","측정소 신설·재배치 절차"]}],"answer":"# 대기오염 측정망의 종류와 항목\n\n## Ⅰ. 개요\n\nDay105에서 개별 환경대기측정소의 입지 원칙을 학습했다면, 이번 Day는 이러한 측정소들이 모여 구성하는 국가 차원의 대기오염측정망 전체 체계를 다룬다. 측정망은 일반적인 대기질 파악을 위한 기본측정망과 산성비·광화학스모그·중금속 등 특수목적을 위한 특수측정망으로 구분되며, 각 측정망은 서로 다른 측정항목과 목적을 가지고 상호보완적으로 국가 대기질 관리체계를 뒷받침한다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 국가대기오염측정망 체계(기본측정망)\n\n### 1. 측정망 유형 재정리(Day105 연계)\n| 측정망 유형 | 설치 목적 |\n|---|---|\n| 도시대기측정망 | 일반 주거·상업지역의 평균적 대기질 파악 |\n| 도로변대기측정망 | 자동차 배출가스의 도로 인근 영향 평가 |\n| 국가배경농도측정망 | 인위적 오염원 영향이 적은 지역의 배경농도 파악 |\n| 교외대기측정망 | 도시 외곽 대기질 및 장거리이동 오염 파악 |\n\n### 2. 기본측정항목\n기본측정망의 공통 측정항목은 대기환경기준(Day118 예고) 설정물질과 대체로 일치하며, SO2, NO2, O3, CO, PM10, PM2.5 등이 상시 측정된다.\n\n## Ⅲ. 특수목적 측정망\n\n### 1. 산성강하물측정망\n| 항목 | 내용 |\n|---|---|\n| 측정 대상 | 강수 중 pH, 이온성분(황산이온, 질산이온 등) |\n| 목적 | 산성비 현황 파악, 산성강하물의 생태계 영향 평가 |\n\n### 2. 광화학대기오염측정망\n| 항목 | 내용 |\n|---|---|\n| 측정 대상 | 오존(O3), 휘발성유기화합물(VOCs), 질소산화물 등 |\n| 목적 | 광화학스모그(오존) 생성기작 연구 및 고농도 예측 |\n\n### 3. 대기중금속측정망\n| 항목 | 내용 |\n|---|---|\n| 측정 대상 | 납, 카드뮴 등 대기 중 중금속 성분 |\n| 목적 | 중금속의 장거리이동·축적 현황 파악 |\n\n### 4. 특수측정망의 공통적 특징\n특수목적 측정망은 기본측정망보다 측정소 수가 적고 정밀분석이 필요한 항목이 많아, 상대적으로 전문화된 분석장비와 절차(Day106~107에서 학습한 GC, 흡광광도법 등)가 요구되는 경우가 많다.\n\n## Ⅳ. 측정자료의 활용\n\n### 1. 대기환경기준 평가(Day118 연계)\n측정망 자료는 각 지역이 대기환경기준을 준수하고 있는지 평가하는 핵심 근거자료로 활용되며, 이는 지역별 대기질 개선 정책 수립의 출발점이 된다.\n\n### 2. 대기질 예보·경보\n실시간 측정자료(특히 베타선흡수법 기반 PM10·PM2.5, Day106 연계)는 대기질 예보모델의 입력자료로 활용되며, 고농도 오염 발생시 경보 발령의 판단 근거로도 사용된다.\n\n### 3. 정책효과 분석과 연구\n장기간 축적된 측정자료는 대기오염 저감정책(배출허용기준 강화, 저공해차 보급 등)의 효과를 정량적으로 평가하는 연구자료로 활용되며, 국내외 학술연구에도 폭넓게 활용된다.\n\n## Ⅴ. 측정망 운영체계\n\n### 1. 기관별 역할분담\n| 기관 | 역할 |\n|---|---|\n| 환경부 | 측정망 종합계획 수립, 정책 총괄 |\n| 지방자치단체 | 관할 지역 측정소 운영·관리 |\n| 한국환경공단 | 측정자료 통합관리, 품질관리 지원 |\n\n### 2. 측정망 설치·운영계획\n측정망은 일정 주기(예: 5년 단위)로 종합계획을 수립하여 신규 측정소 설치, 노후 측정소 재배치, 측정항목 추가 등을 체계적으로 추진하며, 이는 Day105에서 학습한 개별 측정소 입지평가와 연계되어 이루어진다.\n\n## Ⅵ. 측정망 확장과 미래 방향\n\n### 1. 신규 측정항목의 추가 논의\n최근 극초미세먼지(PM1) 등 새로운 관심물질이나, 온실가스와 대기오염물질을 통합 감시하려는 논의가 이루어지고 있어, 측정망의 측정항목은 정책수요와 과학적 지식의 발전에 따라 지속적으로 확장되는 추세에 있다.\n\n### 2. 측정망 자료의 국제 비교와 협력\n국가대기오염측정망 자료는 국제기구·인접국과의 대기질 비교, 월경성 오염 공동연구 등에도 활용되며, 이러한 국제협력은 특히 국가배경농도측정망과 광화학대기오염측정망 자료를 중심으로 이루어지는 경우가 많다.\n\n## Ⅶ. 결론\n\n대기오염측정망은 기본측정망(도시·도로변·배경농도)과 특수목적측정망(산성강하물·광화학·중금속)이 상호보완적으로 구성되어, 일반적 대기질 파악부터 특수 오염현상 감시까지 국가 대기질 관리의 전체 그림을 뒷받침한다. Day111~113에서 학습한 TMS·CleanSYS가 개별 배출원(사업장)을 감시하는 체계라면, 이번 Day의 측정망은 국민이 실제로 노출되는 대기환경 전체를 감시하는 체계라는 점에서 두 체계가 상호보완적으로 국가 대기질 관리를 완성한다.\n\n| 요약 | 핵심 |\n|---|---|\n| 기본측정망 | 도시·도로변·배경농도·교외 |\n| 특수측정망 | 산성강하물·광화학·중금속 |\n| 활용 | 환경기준평가, 예보·경보, 정책연구 |\n| 운영체계 | 환경부(총괄)+지자체(운영)+환경공단(관리) |\n| 확장방향 | 신규항목 추가, 국제 비교·협력 강화 |\n","side":[{"title":"측정망 유형별 종합 비교와 사례","body":"### 측정망 목적별 핵심 오염물질 정리\n| 측정망 | 핵심 물질 |\n|---|---|\n| 도시대기 | SO2,NO2,O3,CO,PM10,PM2.5(종합) |\n| 도로변대기 | NOx, PM(자동차 기인) |\n| 산성강하물 | 강수 pH, 황산·질산이온 |\n| 광화학대기오염 | O3, VOCs |\n| 대기중금속 | 납, 카드뮴 등 |\n\n### TMS·CleanSYS와 측정망의 관계 재정리\n| 구분 | TMS·CleanSYS(Day111~113) | 대기오염측정망(Day114) |\n|---|---|---|\n| 감시대상 | 개별 배출시설(사업장) | 대기환경 전체(수용지점) |\n| 목적 | 배출허용기준 준수 여부 | 대기환경기준 준수 여부 |\n| 관리주체 | 사업자+한국환경공단 | 환경부+지자체+환경공단 |\n\n이 비교표는 배출원관리(TMS)와 환경관리(측정망)라는 대기질 관리의 두 축을 명확히 구분하여 이해하는 데 도움이 되며, 종합형 답안 작성 시 서론에서 활용하면 효과적이다.\n\n### 측정망 설치 갈등사례와 대응\n측정소 신설 과정에서 인근 주민의 님비(NIMBY) 반응이나 부지확보 어려움이 발생하는 경우가 실무에서 종종 있으며, 이 경우 측정망의 공익적 필요성을 설명하고 대안부지를 검토하는 등 지역사회와의 소통 과정이 함께 요구된다.\n\n### 특수측정망 운영기관의 전문성\n산성강하물측정망이나 대기중금속측정망은 특수 분석장비와 전문인력이 필요해 국립환경과학원 등 전문연구기관이 직접 운영·분석을 담당하는 경우가 많으며, 이는 기본측정망이 지자체 중심으로 운영되는 것과 대비되는 특징이다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 국가대기오염측정망의 종류와 설치목적을 설명하시오. *(114~138회 다수 10~20점)*\n2. 특수목적 측정망(산성강하물·광화학·중금속)을 설명하시오. *(120회 10~20점)*\n3. 측정망 자료의 활용 분야를 설명하시오. *(126회 10점)*\n4. TMS·CleanSYS와 대기오염측정망의 차이를 비교 설명하시오. *(최근 10~20점)*\n\n### 답안 작성 요령\n측정망 문제는 \"배출원 관리(TMS)와 환경 관리(측정망)의 구분\"이라는 큰 틀에서 접근하면 답안이 체계적으로 구성된다. 특수측정망은 각각의 고유 목적(산성비, 광화학스모그, 중금속축적)을 명확히 서술해야 감점을 피할 수 있다.\n\n### 다음 학습 연계\nDay 115(자가측정제도와 대행제도)에서 TMS가 부착되지 않은 중소규모 사업장의 배출관리 방식을 학습한다.\n\n### 답안 확장 포인트\n측정망 문제는 \"왜 국가가 이렇게 다양한 유형의 측정망을 운영하는가\"라는 근본 질문에 \"단일 유형의 측정망만으로는 도시평균·도로영향·배경농도·특수오염현상을 모두 포착할 수 없기 때문\"이라는 논리로 답하면, 단순 나열을 넘어선 체계적 이해를 보여줄 수 있다.\n\n### 암기 카드 5선\n1. **기본측정망** = 도시대기·도로변·배경농도·교외\n2. **산성강하물측정망** = 강수 pH, 황산·질산이온\n3. **광화학대기오염측정망** = O3, VOCs\n4. **대기중금속측정망** = 납, 카드뮴 등\n5. **운영체계** = 환경부(총괄)+지자체(운영)+환경공단(관리)"}]},"115":{"day":115,"date":"2026-11-23","title":"자가측정제도와 대행제도","keywords":[{"k":"자가측정제도","subs":["사업자 스스로 배출농도 측정·기록","TMS 미부착 시설의 기본 관리수단","측정주기·항목 법령 규정"]},{"k":"측정대행업","subs":["전문 측정대행업체가 사업자 위탁 측정","등록제(자본·인력·장비 요건)","측정결과 신뢰성 확보 목적"]},{"k":"자가측정 기록·보고","subs":["측정기록부 작성·보존 의무","일정기간(수년) 보존 의무","행정기관 제출·점검 대상"]},{"k":"측정대행업 관리","subs":["숙련도시험 정기 참여","부실측정 적발시 등록취소 등 제재","측정성적서 위·변조 금지"]},{"k":"TMS·자가측정 비교","subs":["대형시설: TMS 상시감시","중소형시설: 자가측정(정기)","규모별 차등관리 원칙"]}],"answer":"# 자가측정제도와 대행제도\n\n## Ⅰ. 개요\n\nDay111~113에서 학습한 TMS는 주로 대형(1~3종) 배출시설에 적용되는 상시 감시체계인 반면, TMS가 부착되지 않은 중소규모 배출시설은 사업자 스스로 또는 전문 측정대행업체를 통해 정기적으로 배출농도를 측정·기록하는 자가측정제도로 관리된다. 이는 모든 배출시설에 TMS를 부착하는 것이 비용·행정 측면에서 비효율적이라는 점을 고려하여, 시설 규모에 따라 차등화된 관리수단을 적용하는 원칙을 반영한다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 자가측정제도\n\n### 1. 제도의 취지와 대상\n자가측정제도는 배출시설을 운영하는 사업자가 스스로(또는 대행업체를 통해) 정기적으로 배출가스 중 오염물질 농도를 측정하고 그 결과를 기록·보고하도록 하는 제도로, TMS가 부착되지 않은 대다수의 중소규모 배출시설에 기본적으로 적용된다.\n\n### 2. 측정주기와 항목\n| 구분 | 내용 |\n|---|---|\n| 측정주기 | 배출시설 종별·오염물질별로 법령에 규정(월 1회, 분기 1회 등 차등) |\n| 측정항목 | 해당 시설의 배출허용기준이 설정된 오염물질 중심 |\n| 측정방법 | Day101~107에서 학습한 공정시험기준에 따른 표준측정법 적용 |\n\n### 3. 측정기록의 작성·보존\n사업자는 자가측정 결과를 측정기록부에 기재하고 일정기간(통상 수년) 보존해야 하며, 관할 행정기관의 점검 시 이를 제시할 의무가 있다. 측정기록은 배출허용기준 준수 여부를 판단하는 기초자료이자, 향후 행정처분의 근거로 활용될 수 있다.\n\n## Ⅲ. 측정대행업\n\n### 1. 측정대행업의 필요성\n다수의 중소규모 사업자가 자체적으로 전문 측정인력·장비를 갖추기 어려운 현실을 고려하여, 전문성을 갖춘 측정대행업체가 사업자를 대신하여 배출가스를 측정·분석하는 측정대행업 제도가 운영된다.\n\n### 2. 측정대행업 등록 요건\n| 요건 | 내용 |\n|---|---|\n| 인력 | 일정 자격을 갖춘 기술인력 확보 |\n| 장비 | 공정시험기준에 따른 측정·분석 장비 구비 |\n| 시설 | 실험실 등 분석시설 확보 |\n\n측정대행업은 등록제로 운영되며, 등록 요건을 충족하지 못하거나 부실 측정이 적발되는 경우 등록취소 등의 행정제재를 받을 수 있다.\n\n### 3. 측정대행업 관리·감독\n| 관리수단 | 내용 |\n|---|---|\n| 숙련도시험(Day110 연계) | 정기적으로 분석능력 검증 참여 |\n| 현장점검 | 측정과정의 적정성 여부 관할기관 점검 |\n| 성적서 관리 | 측정성적서 위·변조 금지, 적발시 강력 제재 |\n\n## Ⅳ. TMS와 자가측정의 규모별 차등관리\n\n### 1. 관리수단 비교\n| 구분 | TMS(Day111~113) | 자가측정(이번 Day) |\n|---|---|---|\n| 적용대상 | 대형(1~3종) 시설 중심 | 중소규모 시설 포함 전반 |\n| 측정방식 | 상시 연속자동측정 | 정기적(월·분기 등) 단속측정 |\n| 신뢰성 확보 | 정도확인시험·편향시험(Day112) | 대행업체 등록관리, 숙련도시험 |\n\n### 2. 규모별 차등관리의 정책적 의미\n배출량이 큰 대형시설에는 상시감시(TMS)를, 개별 배출량은 작지만 수가 많은 중소형시설에는 정기측정(자가측정)을 적용하는 것은, 한정된 관리자원을 배출량 기여도에 따라 효율적으로 배분하는 위험기반(Risk-based) 관리원칙의 사례로 이해할 수 있다.\n\n## Ⅴ. 자가측정과 관련 제도의 실무적 확장\n\n### 1. 자가측정 결과의 배출허용기준 초과시 대응\n자가측정 결과 배출허용기준을 초과한 것으로 확인되는 경우, 사업자는 즉시 개선대책을 수립·시행해야 하며, 이를 지연하거나 은폐하는 경우 별도의 행정처분 대상이 될 수 있어 자가측정은 단순 기록의무를 넘어 사업자 스스로의 자율관리 책임을 수반한다.\n\n### 2. 자가측정과 TMS 부착 전환의 관계\n사업장의 생산량이 증가하여 배출량 규모가 커지는 경우, 배출시설 종별 분류(Day120 예고)가 변경되면서 기존 자가측정 대상에서 TMS 부착의무 대상으로 전환될 수 있으며, 이는 배출관리 수준이 시설 운영조건 변화에 따라 동적으로 조정된다는 점을 보여준다.\n\n### 3. 자가측정 결과와 정도관리 원칙의 결합\n자가측정 역시 Day110에서 학습한 정도관리 원칙(정확도·정밀도 확보, 표준물질 검증 등)이 적용되어야 하며, 측정대행업체는 자체적으로 내부 정도관리 체계를 갖추고 정기적으로 이를 점검받는 것이 원칙이다.\n\n## Ⅵ. 결론\n\n자가측정제도와 측정대행업은 TMS가 적용되지 않는 다수의 중소규모 배출시설에 대한 배출관리 체계로, 정기적 측정·기록·보고를 통해 배출허용기준 준수 여부를 확인하는 기본 수단이다. Day111~115를 종합하면, 대기오염 배출원 관리는 시설 규모에 따라 TMS(상시감시)와 자가측정(정기측정)으로 차등화되어 있으며, 두 체계 모두 Day101~110에서 학습한 공정시험기준과 정도관리 원칙을 공통 기반으로 삼는다는 점에서 일관된 체계를 이루고 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 자가측정 | 사업자 정기측정·기록·보고 의무 |\n| 측정대행업 | 전문업체 위탁측정, 등록제 관리 |\n| 규모별 차등 | 대형=TMS(상시), 중소형=자가측정(정기) |\n| 공통기반 | 공정시험기준(Day101~107)+정도관리(Day110) |\n| 동적관리 | 시설규모 변화에 따른 관리수준 전환 |\n","side":[{"title":"자가측정·대행업 실무 사례","body":"### 측정주기 예시(개념)\n| 시설 규모·오염물질 위험도 | 측정주기(개념) |\n|---|---|\n| 상대적 고위험·중규모 | 월 1회 이상 |\n| 상대적 저위험·소규모 | 분기 또는 반기 1회 |\n\n정확한 법정 주기는 최신 관계법령을 확인해야 하나, \"규모·위험도가 클수록 측정주기가 짧아진다\"는 원칙적 방향은 답안 작성 시 활용할 수 있다.\n\n### 측정대행업 부실측정 적발 사례 유형\n측정대행업체가 실제 측정 없이 과거 자료를 재활용하거나, 시료채취 없이 임의로 성적서를 작성하는 등의 부정행위가 적발되는 경우가 실무에서 발생하며, 이러한 행위는 측정자료 전체의 신뢰성을 훼손하므로 강력한 제재(등록취소, 형사처벌)의 대상이 된다.\n\n### 자가측정과 TMS 병행 사업장\n일부 대형사업장은 TMS로 상시감시를 받으면서도, TMS 미설치 오염물질에 대해서는 별도로 자가측정을 병행해야 하는 경우가 있어, 하나의 사업장 내에서도 오염물질별로 서로 다른 관리방식이 적용될 수 있다.\n\n### 자가측정 기록의 전산화 추세\n최근에는 종이 기반의 측정기록부 대신 전산시스템을 통한 자가측정 결과 입력·보고가 확대되는 추세로, 이는 행정기관의 자료 취합·분석 효율성을 높이는 동시에 사업자의 기록 조작 가능성을 낮추는 효과도 기대된다.\n\n### 측정대행업체 선정 시 실무 고려사항\n사업자가 측정대행업체를 선정할 때는 등록 유효성, 보유 장비의 교정상태, 과거 부실측정 이력 유무 등을 확인하는 것이 바람직하며, 이는 자가측정 결과의 신뢰성이 궁극적으로 사업자 자신의 법적 책임과 직결되기 때문이다.\n\n### 자가측정 결과와 배출시설 개선투자의 연계\n자가측정 자료가 누적되면 사업자는 이를 바탕으로 방지시설의 노후화나 성능저하 추세를 스스로 파악할 수 있어, 단순 규제 대응을 넘어 자발적인 시설 개선투자 계획 수립의 근거자료로 활용하는 것이 바람직한 실무 관행으로 권장된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 자가측정제도의 취지와 절차를 설명하시오. *(114~138회 다수 10~20점)*\n2. 측정대행업의 등록요건과 관리방안을 설명하시오. *(120회 10점)*\n3. TMS와 자가측정의 규모별 차등관리 원칙을 설명하시오. *(126회 10~20점)*\n4. 측정대행업체의 부실측정 방지대책을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n자가측정 문제는 \"왜 모든 시설에 TMS를 부착하지 않는가\"(비용효율성, 위험기반 관리원칙)라는 정책적 논리를 서두에 제시하면 답안의 설득력이 높아진다. 측정대행업 문제는 등록요건 나열보다 \"신뢰성 확보를 위한 관리장치(숙련도시험 등)\"를 함께 언급해야 완결된 답안이 된다.\n\n### 다음 학습 연계\nDay 116은 Day108~115(TMS·정도관리·측정망·자가측정) 구간을 종합 복습하는 회독일이다.\n\n### 답안 확장 포인트\n자가측정·측정대행업 문제는 \"왜 사업자에게 측정의무를 부여하면서도 대행업을 별도로 인정하는가\"(전문성 부족 사업자를 배제하지 않으면서도 측정 품질을 담보하기 위한 절충적 제도설계)라는 관점으로 서술하면, 제도 설계의 취지를 깊이 있게 설명하는 답안이 된다.\n\n### 암기 카드 4선\n1. **자가측정** = 사업자 정기측정·기록·보존 의무\n2. **측정대행업** = 전문업체 위탁측정, 등록제\n3. **차등관리** = 대형(TMS 상시)·중소형(자가측정 정기)\n4. **대행업 관리** = 숙련도시험+현장점검+성적서관리"}]},"116":{"day":116,"date":"2026-11-24","title":"2단계 가스상·연소·측정 회독 8회차","keywords":[{"k":"현장·원격 측정법","subs":["THC/FID(총탄화수소), LDAR","FTIR(다성분), LIDAR(원격)","목적별 신속성·광역성 대응"]},{"k":"정도관리 핵심개념","subs":["정확도·정밀도, 계통·우연·과실오차","측정불확도(확장불확도=k×표준불확도)","검출한계(LOD)<정량한계(LOQ)"]},{"k":"TMS 3단 구조","subs":["TMS(측정·전송)→정도검사(검증)→CleanSYS(통합관리)","상대정확도(RA), 편향시험(제로·스팬가스)","무효자료-대체자료 처리"]},{"k":"측정망과 자가측정","subs":["기본측정망(도시·도로변·배경농도)+특수측정망","자가측정(사업자 정기측정)+측정대행업","규모별 차등관리(TMS vs 자가측정)"]},{"k":"측정 파트 후반부 구조","subs":["신속현장측정→정도관리→TMS체계→환경측정망","배출원관리(TMS)와 환경관리(측정망) 이원구조","정책 파트(Day118~) 진입 준비"]}],"answer":"# 2단계 회독 8회차 — Day 109~115 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 측정 파트 후반부로, **현장·원격 측정법(Day109) → 정도관리 이론(Day110) → TMS 체계(Day111~113) → 환경측정망·자가측정(Day114~115)**으로 이어진다. 핵심은 Day110의 정도관리 개념(정확도, 불확도, 검출한계)이 이후 Day111~115 전체를 관통하는 공통원리로 반복 적용된다는 점이다. 이 구조를 이해하면 개별 Day를 암기가 아닌 논리로 연결할 수 있다.\n\n```\nDay109(THC/FID·FTIR·LIDAR): 신속·원격 현장측정\n        ↓\nDay110(정도관리): 정확도·정밀도·오차·불확도·검출한계 ─┐\n        ↓                                        │(공통원리 적용)\nDay111(TMS 구성) → Day112(정도검사=RA+편향시험) ←──┘\n        ↓\nDay113(CleanSYS): 무효자료·대체자료·부정방지\n        ↓\nDay114(측정망) : 배출원관리(TMS)와 별개의 환경관리 체계\n        ↓\nDay115(자가측정·대행업): TMS 미부착 시설의 대안적 관리\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 상대정확도(RA) 산정식 | ｜TMS-기준측정법｜/기준측정법×100 | ☐ |\n| 확장불확도 | U=k×합성표준불확도(k≈2, 95%) | ☐ |\n| LOD vs LOQ | 정량한계는 검출한계의 약 3~3.3배 | ☐ |\n| TMS 부착대상 | 주로 1~3종 대형사업장 | ☐ |\n| 편향시험 표준가스 | 제로가스+스팬가스 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **상대정확도**: RA(%)=｜TMS평균-기준측정법평균｜/기준측정법평균×100\n2. **확장불확도**: U=k×합성표준불확도\n3. **검출한계 관계**: LOQ≈3~3.3×LOD\n4. **THC/FID vs GC-FID**: 총량신속측정 vs 개별성분분리정량(목적차이)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 정도확인시험 vs 편향시험 | 실제배출가스+기준측정법 비교 | 표준가스로 기기반응 검증 | 비교대상(실제 vs 표준) |\n| 정확도 vs 정밀도 | 참값과의 근접성 | 반복측정값의 재현성 | 독립적 개념 |\n| TMS vs 자가측정 | 대형시설, 상시연속측정 | 중소형시설, 정기단속측정 | 시설규모·측정빈도 |\n| 무효자료 vs 대체자료 | 신뢰불가 판정된 기간 | 무효기간을 보정한 추정값 | 원인과 결과 관계 |\n| 기본측정망 vs 특수측정망 | 도시·도로변·배경농도 | 산성강하물·광화학·중금속 | 목적의 일반성/특수성 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. THC/FID, FTIR, LIDAR의 원리와 활용을 비교 설명하시오. *(114~138회 다수 10~20점)*\n2. 정확도·정밀도·오차의 종류·측정불확도를 설명하시오. *(다수 회차 10~20점)*\n3. TMS의 구성, 부착대상, 부착절차를 설명하시오. *(다수 회차 20~25점)*\n4. TMS 상대정확도시험을 계산하고 편향시험을 설명하시오. *(114~138회 다수 25점 계산형)*\n5. CleanSYS의 무효자료·대체자료 처리방식을 설명하시오. *(120회 10~20점)*\n6. 대기오염측정망의 종류와 자가측정제도를 설명하시오. *(126회 10~20점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 정도관리 원리가 어떻게 TMS 전체를 관통하는지 설명해본다.\n2. **계산 연습(25분)**: 상대정확도 계산문제 2개, 확장불확도 계산문제 1개를 직접 풀어본다.\n3. **비교표 재구성(20분)**: Ⅳ의 5개 비교쌍을 스스로 표로 다시 그려본다.\n4. **기출 구술(30분)**: Ⅴ의 6문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: TMS 정도검사(Day112)나 CleanSYS(Day113)가 어려웠다면 재복습 권장.\n\n> 측정 파트 후반부(Day109~115)는 계산형과 서술형이 균형있게 출제되는 영역이다. 특히 TMS 관련 3개 Day(111~113)는 매 시험 고정출제 영역이므로 집중 학습이 필요하다.\n\n## Ⅶ. 측정 파트 전체(Day101~115) 총정리\n\n측정 파트는 크게 세 흐름으로 요약된다. 첫째, 표준화된 측정방법론(Day101~107: 총칙, 배출가스, 환경대기, 분석법)이 모든 측정의 공통 기반을 형성한다. 둘째, 신속·원격 측정기술과 정도관리 이론(Day109~110)이 표준방법론을 실무적으로 보완하고 신뢰성을 뒷받침한다. 셋째, 이러한 원리들이 통합적으로 구현된 실제 관리체계(Day111~115: TMS·CleanSYS·측정망·자가측정)가 국가 차원의 대기질 관리를 완성한다. 이 세 흐름을 하나의 논리로 연결하여 이해하면, 측정 파트 전체를 암기가 아닌 체계로 기억할 수 있어 시험장에서의 응용력이 크게 향상된다.\n\n## Ⅷ. 다음 회독(Day117)을 위한 준비\n\n이번 8회차 회독은 Day109~115라는 상대적으로 좁은 구간을 심화 복습했다면, 다음 Day117은 Day101부터 Day115까지 측정 파트 전체를 통합하는 마지막 종합정리 회독이 된다. 따라서 이번 회독을 마친 후에는 Day108(1차 복습, Day101~107 대상)의 내용도 함께 가볍게 훑어보아, 측정 파트 전체 흐름이 하나로 연결되는지 스스로 점검해보는 것이 효과적이다. 특히 총칙(Day101)의 표준상태·QA/QC 개념이 TMS의 정도검사(Day112)와 어떻게 연결되는지, 배출가스 측정공 원칙(Day102)이 TMS 설치 시 측정공 요건(Day111)과 어떻게 연결되는지와 같이, 전반부와 후반부를 잇는 연결고리를 의식적으로 되짚어보는 학습이 다음 종합회독의 효과를 극대화할 것이다.\n","side":[{"title":"측정 파트 후반부 종합 비교표","body":"### 관리체계별 핵심 비교\n| 체계 | 적용대상 | 감시방식 | 정도검증 수단 |\n|---|---|---|---|\n| TMS | 대형(1~3종) 사업장 | 상시연속측정 | 정도확인시험+편향시험 |\n| 자가측정 | 중소형 사업장 | 정기단속측정 | 측정대행업 등록관리+숙련도시험 |\n| 환경측정망 | 대기환경 전체 | 상시(측정소별 상이) | 국가 정도관리체계 |\n\n### 정도관리 원리의 3단 적용 재확인\nDay110의 정도관리 이론은 (1) TMS의 정도확인시험(Day112)에서 \"정확도\" 개념으로, (2) TMS의 편향시험(Day112)에서 \"계통오차 점검\" 개념으로, (3) 측정대행업 관리(Day115)에서 \"숙련도시험\" 개념으로 각각 구체화되어 반복 적용된다. 이 3단 적용구조를 이해하면 서로 다른 Day의 내용을 하나의 원리로 통합할 수 있다.\n\n### 신속측정법과 표준측정법의 역할 분담 재확인\nDay109의 THC/FID·FTIR·LIDAR는 Day101~107의 표준측정법을 대체하는 것이 아니라, 표준측정법이 커버하기 어려운 신속대응·광역감시 영역을 보완하는 역할을 한다는 점을 다시 한번 명확히 정리해두어야 하며, 이 구분은 \"왜 두 부류의 측정법이 공존하는가\"를 묻는 문제에 직접 활용된다.\n\n### 계산형 문제 대비 공식 재점검\n상대정확도, 확장불확도, 검출한계-정량한계 관계는 측정 파트 후반부에서 매 회차 출제되는 핵심 계산요소이므로, 이번 회독에서 각 공식의 적용 순서와 판정기준(RA 허용범위 등)까지 명확히 암기했는지 재점검해야 한다.\n\n### 후반부 학습에서 자주 나오는 실무 사례형 문제 대응\nDay111~115는 단순 개념설명형 문제 외에도 \"특정 상황에서 어떤 조치를 취해야 하는가\"와 같은 실무 사례형 문제로도 자주 출제되므로(예: TMS 정도검사 부적합시 대응절차, 무효자료 발생시 대체자료 산정방법), 절차의 순서를 정확히 암기하는 것이 개념 이해 못지않게 중요하다."},{"title":"암기 카드 — Day 109~115 핵심 20선","body":"1. **THC/FID** = 총탄화수소 신속측정, LDAR 활용\n2. **FTIR** = 적외선흡수스펙트럼, 다성분 동시분석\n3. **LIDAR** = 레이저 산란·흡수, 광역 공간분포\n4. **정확도·정밀도** = 참값근접성 vs 반복재현성\n5. **오차 3종** = 계통·우연·과실오차\n6. **확장불확도** = U=k×합성표준불확도\n7. **LOD vs LOQ** = 검출한계<정량한계(약 3~3.3배)\n8. **TMS** = 굴뚝원격감시체계\n9. **TMS 구성** = 측정기기부+DAS+전송장치+유량계\n10. **TMS 부착대상** = 대형(1~3종) 사업장 중심\n11. **정도확인시험** = RA=｜TMS-기준측정법｜/기준측정법×100\n12. **편향시험** = 제로가스·스팬가스로 기기반응 검증\n13. **CleanSYS** = TMS 통합관리시스템(한국환경공단)\n14. **무효자료 사유** = 정도검사부적합, 점검·보수, 정전·전송장애\n15. **대체자료** = 전후자료·유사조건자료·보수적산정\n16. **기본측정망** = 도시·도로변·배경농도·교외\n17. **특수측정망** = 산성강하물·광화학·중금속\n18. **자가측정** = 사업자 정기측정·기록·보고 의무\n19. **측정대행업** = 전문업체 위탁측정, 등록제\n20. **규모별차등** = 대형(TMS)·중소형(자가측정)\n\n### 회독 진도 메모\n측정 파트 후반부(Day109~115)가 완료되었다. 다음 Day117은 측정 파트(Day101~115) 전체를 종합정리하는 마지막 회독일이며, 이후 정책 파트(Day118~)로 진입한다.\n\n### 취약도 자가진단 체크리스트\n아래 중 3개 이상 막힘없이 설명이 안 되면 해당 Day를 재복습할 것: ① THC/FID vs GC-FID 차이(Day109) ② 확장불확도 계산(Day110) ③ TMS 구성요소(Day111) ④ 상대정확도 계산(Day112) ⑤ 무효자료·대체자료 관계(Day113) ⑥ 자가측정과 TMS 차등기준(Day115)."}]},"117":{"day":117,"date":"2026-11-25","title":"2단계 가스상·연소·측정 종합정리","keywords":[{"k":"측정방법론 총론","subs":["공정시험기준 총칙(표준상태·QA/QC)","배출가스 측정(측정공·등속흡입·먼지)","환경대기 측정(측정소·먼지·가스상분석)"]},{"k":"신속·원격측정과 정도관리","subs":["THC/FID·FTIR·LIDAR(현장·원격)","정확도·정밀도·오차·불확도·검출한계","측정 신뢰성의 통계적 기반"]},{"k":"TMS·CleanSYS 통합체계","subs":["TMS(측정+전송)→정도검사→CleanSYS","상대정확도·편향시험","무효자료-대체자료 원칙"]},{"k":"환경관리 체계","subs":["기본·특수측정망","자가측정·측정대행업","배출원관리 vs 환경관리 이원구조"]},{"k":"계산공식 총정리","subs":["등속계수, 먼지농도, 표준산소농도보정","램버트-비어법칙, 상대정확도, 확장불확도","복합계산 문제 대응전략"]}],"answer":"# 2단계 종합정리 — 측정 파트(Day101~115) 전체 총복습\n\n## Ⅰ. 종합정리 목적\n\n이번 회독은 Day101부터 Day115까지 15일간 학습한 측정 파트 전체를 하나의 통합된 그림으로 재구성하는 것을 목표로 한다. 지금까지 3회에 걸쳐(Day108, Day116, 이번 Day) 부분적으로 복습했다면, 이번에는 측정 파트 전체를 처음부터 끝까지 하나의 논리적 흐름으로 재조립하여 시험장에서 어떤 각도의 질문이 나와도 유연하게 대응할 수 있는 완성도를 갖추는 것이 목표이다.\n\n```\n[측정방법론 총론: Day101~107]\n 총칙(표준상태·QA/QC) → 배출가스(측정공·등속흡입·먼지) → 환경대기(측정소·먼지·가스분석)\n              ↓\n[신속측정·정도관리: Day109~110]\n THC/FID·FTIR·LIDAR(현장·원격) + 정확도·불확도·검출한계(통계적 신뢰성기반)\n              ↓\n[TMS·CleanSYS 통합관리체계: Day111~113]\n TMS(측정+전송) → 정도검사(RA+편향시험) → CleanSYS(무효자료·대체자료·부정방지)\n              ↓\n[환경관리 체계: Day114~115]\n 대기오염측정망(기본+특수) + 자가측정·측정대행업(TMS 미부착 시설)\n```\n\n## Ⅱ. 핵심 수치 총정리 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 표준상태 | 0℃, 1기압(760mmHg) | ☐ |\n| 등속계수 유효범위 | 90~110% | ☐ |\n| PM10·PM2.5 절단입경 | 10㎛/2.5㎛ | ☐ |\n| LOQ/LOD 관계 | 약 3~3.3배 | ☐ |\n| 확장불확도 | U=k×합성표준불확도(k≈2) | ☐ |\n| TMS 부착대상 | 주로 1~3종 대형사업장 | ☐ |\n\n## Ⅲ. 계산공식 총정리(반드시 즉시 적용 가능해야 함)\n\n1. **먼지농도**: C(mg/Sm³)=포집먼지량(mg)/표준상태건조가스흡입량(Sm³)\n2. **표준상태 환산**: 환산가스량=실측가스량×(273/(273+t))×(P/760)\n3. **등속계수**: I(%)=(노즐흡입유속/배출가스유속)×100\n4. **표준산소농도 보정**: C보정=C실측×(21−Cs)/(21−O2실측)\n5. **램버트-비어 법칙**: A=ε·c·l\n6. **상대정확도**: RA(%)=｜TMS평균-기준측정법평균｜/기준측정법평균×100\n7. **확장불확
