 내 완전산화 확보 |\n| 연소온도 | RTO 750~850℃, RCO 300~450℃, DTO 700~800℃(열회수 없이 직접 유지) |\n| LEL(폭발하한계) | 유입 VOCs 농도는 안전상 LEL의 **25% 이하**로 희석·설계 |\n| 압력손실 | 축열재·촉매층 통과 시 발생, 송풍기 동력에 직결 |\n\n## Ⅲ. 3공정 비교\n\n| 구분 | RTO | RCO | DTO |\n|---|---|---|---|\n| 반응온도 | 750~850℃ | 300~450℃ | 700~800℃ |\n| 촉매 사용 | 없음 | Pt·Pd계 촉매 | 없음 |\n| 열회수율 | 85~95%(세라믹 축열재) | RTO보다 낮음(60~80%) | 없음(또는 매우 낮음) |\n| 초기투자비 | 높음 | RTO보다 낮음 | 가장 낮음 |\n| 운영비(연료비) | 열회수로 낮음 | 낮음(저온운전) | 높음(열회수 없어 연료소모 큼) |\n| 적용 농도 | 저~중농도, 대풍량 | 저농도 | 고농도, 간헐적 배출 |\n| 촉매피독 위험 | 없음 | 있음(Si, P, 중금속, 할로겐) | 없음 |\n| 적용 특징 | 24시간 연속가동 대형시설 | 안정적 저농도 배출원 | 비정상 고농도·비상 배출 |\n\n## Ⅳ. 적용상 문제점과 관리방안\n\n### 1. RTO 운전상 문제점\n- 챔버 전환(밸브 절환) 시 미처리 가스 슬립 발생 → 챔버 수 증대(2탑→3탑) 또는 로터리식 채택으로 저감\n- 축열재 압력손실 누적 시 송풍기 부하 증가 → 정기 세정·교체 필요\n\n### 2. RCO 운전상 문제점\n- 배출가스 중 Si(실리콘), P(인), 중금속, 할로겐화합물이 촉매를 피독시켜 활성 저하\n- 대책: 전처리(예비 여과·흡착)로 피독물질 제거, 정기적 촉매 세정·교체\n\n### 3. DTO 적용 시 유의사항\n- 열회수가 없어 연료비 부담이 크므로 상시가동보다는 간헐적·고농도 배출(비상방지시설)에 한정 적용\n- 배기가스 폐열을 보일러 예열 등에 활용하는 열회수 연계 설계로 경제성 보완 가능\n\n### 3-1. 폐열회수 연계 설계\nRTO·RCO 모두 연소실에서 발생하는 고온 배출가스의 잔여 폐열을 스팀 발생이나 공정 용수 예열에 활용하는 폐열회수보일러(WHRB)를 후단에 연계하면, 단순 열회수(축열재 순환)를 넘어 사업장 전체의 에너지 효율을 추가로 높일 수 있다. 다만 폐열회수설비 추가는 초기투자비와 배관·열교환기 부식(산성가스 응축) 문제를 함께 검토해야 한다.\n\n### 4. 흡착농축+연소 결합 시스템\n저농도 대풍량 VOCs를 활성탄 또는 제올라이트 휠(Wheel)로 우선 농축한 후, 탈착된 고농도 가스만 RTO/RCO로 처리하는 방식으로, 대풍량 처리 시 연소설비 규모와 연료비를 크게 절감할 수 있다.\n\n| 결합방식 | 적용 대상 | 효과 |\n|---|---|---|\n| 활성탄 흡착+RTO | 저농도(수백 ppm 이하) 대풍량 | 풍량 1/10~1/20 농축, 설비 소형화 |\n| 제올라이트 휠+RTO | 도장·인쇄 등 저농도 연속배출 | 연속 흡탈착, 무인운전 가능 |\n\n### 5. 연료비·유지비 비교 감각(개념)\n| 구분 | 상대적 연료비 | 상대적 유지비 | 비고 |\n|---|---|---|---|\n| RTO | 낮음(열회수) | 중간(축열재 세정) | 대풍량일수록 유리 |\n| RCO | 낮음(저온운전) | 중간~높음(촉매 교체) | 촉매수명 2~5년 |\n| DTO | 높음(열회수 없음) | 낮음(구조 단순) | 소용량·간헐가동에 한정 |\n\n연료비는 배출가스 자체의 열량(VOCs 농도)에 크게 의존하며, 자열연소(Autothermal) 조건(외부연료 없이 자체 발열만으로 유지)에 도달하는 최소 VOCs 농도를 설계 초기에 검토하는 것이 실무적으로 중요하다.\n\n## Ⅴ. 결론\n\nRTO·RCO·DTO는 모두 VOCs를 열적으로 파괴하는 산화처리기술이나, RTO는 고효율 열회수를 통한 대풍량 저·중농도 처리에, RCO는 저온 운전으로 저농도 배출원의 운영비 절감에, DTO는 열회수 없이 고농도·간헐적 배출의 단순 처리에 각각 강점을 가진다. 설계 시에는 배출가스의 농도·유량·연속성과 함께 LEL 25% 이하 희석 등 안전설계기준을 준수해야 하며, 저농도 대풍량 조건에서는 흡착농축과의 결합으로 경제성을 확보하는 것이 최근의 설계 방향이다.\n\n| 요약 | 선정 우선순위 |\n|---|---|\n| 저~중농도, 대풍량, 연속가동 | RTO |\n| 저농도, 안정적 조성 | RCO |\n| 고농도, 간헐적·비상 배출 | DTO |\n\n인허가 실무에서는 배출가스의 시간대별 농도 변동(피크·기저부하)을 함께 검토하여, 기저부하는 RTO/RCO로 상시 처리하고 피크부하는 DTO 또는 예비 흡착설비로 대응하는 이원화 설계도 종종 채택된다.\n","side":[{"title":"RTO 챔버 방식 비교와 슬립 저감","body":"### 챔버 방식별 비교\n| 방식 | 원리 | 슬립 수준 | 비고 |\n|---|---|---|---|\n| 2탑식 | 2개 챔버 교대 전환 | 상대적으로 큼 | 구조 단순, 초기 저비용 |\n| 3탑식 | 3개 챔버 순차 전환(퍼지구간 확보) | 낮음 | 슬립 최소화, 대형시설 표준 |\n| 로터리식 | 회전형 축열재 매체 연속 통과 | 가장 낮음 | 연속운전 안정적, 고가 |\n\n### 슬립(Slip) 발생 메커니즘\n챔버 전환 순간 직전 유입가스가 미처리 상태로 배출되는 구간(퍼지되지 않은 잔류가스)에서 슬립이 발생한다. 퍼지시간을 늘리면 슬립은 줄지만 처리용량과 열손실이 증가하는 trade-off가 있다.\n\n### 열회수율 계산 예제(개념)\n연소실 온도 800℃, 유입가스 온도 30℃인 RTO에서 축열재를 통과한 배출가스 온도가 65℃라면,\n열회수율 = (800-65)/(800-30) × 100 ≈ **95.5%**\n→ 축열재 교번 방식이 대풍량 처리에서 연료비 절감에 결정적으로 기여함을 보여주는 계산 감각이다.\n\n### 유지관리 체크리스트\n| 점검항목 | 주기 | 목적 |\n|---|---|---|\n| 축열재 압력손실 | 월 1회 | 폐색·분진퇴적 확인 |\n| 밸브 절환 타이밍 | 분기 1회 | 슬립 최소화 |\n| 버너 착화상태 | 상시 | 보조연료 정상연소 확인 |\n| 배출구 VOCs 농도 | 배출허용기준 준수 여부에 따라 정기측정 | DRE 확인 |\n\n### 화재·폭발 안전설계\n연소실 상류에 가연성가스 농도 감지기(LEL 모니터)를 설치하여 유입농도가 LEL 25%를 초과하면 자동으로 신선공기를 희석 투입하거나 공정을 정지시키는 인터록 설계가 필수적이다."},{"title":"인허가 실무 — DRE 산정과 관련 기출","body":"### DRE(파괴제거효율) 산정\nDRE(%) = (유입 VOCs 질량 − 유출 VOCs 질량) / 유입 VOCs 질량 × 100\n\n허가 조건에서 DRE 95% 이상을 요구하는 경우가 많으며, 이는 흡착·연소 등 개별 단위공정 효율이 아니라 **전체 시스템 종합효율**로 평가되는 점에 유의해야 한다.\n\n### 연소가스 부산물 관리\n- 할로겐화합물 함유 VOCs를 RTO/RCO로 처리할 경우 HCl 등 산성가스가 생성되므로, 후단에 세정탑(스크러버) 추가 설치 검토 필요\n- 고온연소 시 NOx(Thermal NOx) 부생 가능성 → 저온측 RCO 선택이 유리할 수 있음\n\n### 기출 연계 자가점검\n1. RTO와 RCO의 원리·설계인자를 비교 설명하시오. *(다수 회차 25점)*\n2. 축열식산화(RTO)의 열회수 원리와 챔버 방식별 특징을 설명하시오. *(최근 10점)*\n3. VOCs 처리에서 흡착농축과 연소처리의 결합 시스템을 설명하시오. *(120회 10점)*\n4. DRE(파괴제거효율)의 개념과 산정방법을 설명하시오. *(최근 10점)*\n5. DTO(직화식산화)의 적용 대상과 RTO·RCO 대비 경제성을 비교 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nDRE·열회수율 등 수치를 다룰 때는 반드시 계산식과 기호 정의를 함께 제시하고, \"설계농도가 LEL의 25% 이하가 되도록 관리한다\"는 안전기준 문구를 넣으면 실무형 답안으로 가점 요인이 된다."}]},"70":{"day":70,"date":"2026-10-09","title":"바이오필터와 생물학적 처리","keywords":[{"k":"생물학적 처리 원리","subs":["미생물이 오염물질을 대사·분해","최종산물 CO₂·H₂O·미생물체","저농도·저에너지 처리에 적합"]},{"k":"바이오필터(Biofilter)","subs":["담체(퇴비·우드칩) 고정, 살수 없음","체류시간 30~60초","압력손실 낮음, 부지 넓음"]},{"k":"바이오트리클링필터","subs":["담체 + 순환살수(Trickling)","영양분·pH 조절 용이","바이오필터보다 고농도 처리"]},{"k":"바이오스크러버","subs":["액상 미생물 슬러리 순환","흡수+생분해 동시 진행","고농도·수용성 물질에 유리"]},{"k":"설계·운전인자","subs":["EBRT(체류시간)·부하율(㎥/㎥·h)","함수율 40~60% 유지","압력손실·매체 수명(2~5년)"]}],"answer":"# 바이오필터와 생물학적 처리\n\n## Ⅰ. 개요\n\n생물학적 처리기술은 미생물이 VOCs·악취물질을 영양원(탄소원)으로 대사하여 CO₂와 H₂O로 분해하는 원리를 이용한 저에너지·친환경 처리기술이다. 연소처리(RTO·RCO)가 고온·고에너지를 필요로 하는 반면, 생물학적 처리는 상온에서 운전되어 운영비가 낮고 부산물이 적어 저농도·대풍량 배출원(하수처리장, 축산시설, 폐기물처리시설 등)의 악취·VOCs 처리에 널리 적용된다. 담체와 미생물의 접촉 방식에 따라 바이오필터, 바이오트리클링필터, 바이오스크러버로 구분된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 반응 원리와 설계인자\n\n### 1. 생분해 반응\n유기물(오염물질) + O₂ + 미생물 → CO₂ + H₂O + 미생물 증식(바이오매스)\n\n처리효율은 오염물질이 담체 표면의 생막(Biofilm)으로 물질전달된 후 미생물에 의해 분해되는 속도에 의해 결정되며, 물질전달이 율속단계인 경우가 많다.\n\n### 2. 핵심 설계인자\n| 인자 | 설명 |\n|---|---|\n| EBRT(공탑체류시간) | 통상 **30~60초**(바이오필터 기준), 짧으면 처리효율 저하 |\n| 부하율 | 오염물질 부하(g/㎥·h), 초과 시 파과(Breakthrough) 발생 |\n| 함수율 | 담체 **40~60%** 유지 필수, 건조 시 미생물 사멸 |\n| pH | 중성 부근 유지, 산성가스(H₂S 등) 처리 시 pH 저하 관리 필요 |\n| 온도 | 중온균 기준 20~40℃가 최적 |\n\n## Ⅲ. 공정별 비교\n\n| 구분 | 바이오필터 | 바이오트리클링필터 | 바이오스크러버 |\n|---|---|---|---|\n| 담체 | 퇴비·우드칩·피트모스(고정) | 인공담체 + 순환살수 | 액상(부유 미생물) |\n| 살수 여부 | 간헐적(습윤 유지용) | 지속적 순환살수 | 액상 흡수액 순환 |\n| 영양분·pH 조절 | 어려움(담체 자체 함유) | 용이(순환수로 조절) | 가장 용이 |\n| 적용 농도 | 저농도(악취 등) | 중농도 | 고농도·수용성 물질 |\n| 부지 소요 | 큼 | 중간 | 작음 |\n| 압력손실 | 낮음 | 중간 | 높음(액분무) |\n| 매체 수명 | 2~5년(교체 필요) | 반영구적(인공담체) | 반영구적 |\n\n## Ⅳ. 적용 대상과 문제점·관리방안\n\n### 1. 적용 대상\n하수·분뇨처리시설, 축산시설(돈사·계사), 폐기물처리시설(퇴비화·매립), 식품가공시설 등 H₂S·NH₃·저급지방산 등 수용성 악취물질 배출원에 특히 효과적이다.\n\n### 2. 운전상 문제점\n- 담체 건조 시 미생물 활성 급감 → 정기 살수·함수율 모니터링 필요\n- 고농도 충격부하 시 미생물 사멸(독성물질 유입) → 전단 완충조·희석설비 병행\n- 담체 압밀(Compaction)로 인한 채널링(단락류) 발생 → 정기 교반·담체 교체\n\n### 3. 관리방안\n| 문제 | 관리방안 |\n|---|---|\n| 함수율 저하 | 자동 살수제어, 함수율 센서 연동 |\n| 파과(고부하) | 체류시간 확대, 담체 층고 증대 |\n| 채널링 | 담체 정기 뒤집기, 균등 분배판 설치 |\n| 저온기 활성 저하 | 보온·가온설비 병행(동절기) |\n\n### 3-1. 미생물 균주와 접종(Inoculation)\n효율적인 생분해를 위해서는 대상 오염물질을 분해할 수 있는 특정 균주(예: H₂S 분해균인 Thiobacillus속)를 초기에 접종하는 것이 순화기간을 단축하는 데 도움이 된다. 상용 미생물 제제를 활용하거나, 기존 가동 중인 처리시설의 담체 일부를 종균으로 이식하는 방법이 실무에서 활용된다.\n\n### 4. 악취방지시설과의 연계\nDay 72~78에서 학습하는 악취방지법상 지정악취물질 중 H₂S·NH₃·트리메틸아민 등 수용성·저분자 물질은 생물학적 처리의 적용성이 높아, 화학적 세정(습식) 또는 흡착과 직렬 결합하여 처리효율을 높이는 사례가 많다.\n\n### 5. 미생물 순화(Acclimation)와 기동 특성\n생물학적 처리시설은 초기 가동 시 미생물이 대상 오염물질에 적응(순화)하는 기간이 필요하며, 통상 **2~6주**의 초기 기동기간 동안 처리효율이 점진적으로 상승한다. 이 기간에는 목표 부하보다 낮은 부하로 운전하며 종균(Seed) 투입으로 기동기간을 단축할 수 있다.\n\n| 기동 단계 | 기간 | 특징 |\n|---|---|---|\n| 초기 순화 | 1~2주 | 저부하 운전, 종균 투입 |\n| 활성 안정화 | 2~4주 | 부하 점진 증가, 효율 상승 |\n| 정상 운전 | 4주 이후 | 목표 부하·효율 도달 |\n\n## Ⅴ. 결론\n\n바이오필터를 비롯한 생물학적 처리기술은 저에너지·저비용으로 저농도·대풍량 악취 및 VOCs를 처리할 수 있는 친환경 기술로, 담체 고정형(바이오필터)부터 액상형(바이오스크러버)까지 대상물질의 농도·수용성에 따라 선정이 달라진다. 다만 미생물의 생존조건(함수율·pH·온도)에 처리효율이 크게 좌우되므로 충격부하 대응과 정기적인 담체 관리가 안정적 운전의 핵심이며, 향후에는 화학적·물리적 처리와의 하이브리드 결합을 통해 처리범위를 확대하는 방향으로 발전하고 있다.\n\n| 요약 | 적용 우선순위 |\n|---|---|\n| 저농도, 부지 여유 | 바이오필터 |\n| 중농도, 정밀제어 필요 | 바이오트리클링필터 |\n| 고농도, 수용성 물질 | 바이오스크러버 |\n\n부지 확보가 어려운 도심 인근 사업장에서는 바이오트리클링필터나 바이오스크러버처럼 부지소요가 작은 공정을 우선 검토하며, 반대로 부지 여유가 있는 매립지·하수처리장 등에서는 유지관리가 단순한 바이오필터가 경제적으로 유리하다.\n","side":[{"title":"바이오필터 설계 계산 예제","body":"### EBRT와 담체 체적 산정\n풍량 Q = 3,600 ㎥/h, 목표 EBRT = 45초인 바이오필터의 필요 담체체적(V)은:\n\nV = Q × EBRT(h 환산) = 3,600 × (45/3,600) = **45 ㎥**\n\n담체 층고를 1m로 설계할 경우 필요 단면적 A = V/H = 45/1 = **45 ㎡**\n\n### 부하율 검토\n오염물질(예: H₂S) 유입농도 20 ppm, 풍량 3,600㎥/h인 경우 부하량과 담체체적 45㎥를 기준으로 부하율(g/㎥·h)을 산정하여 설계 부하기준(통상 수십 g/㎥·h 이하) 이내인지 확인하는 절차가 필요하다.\n\n### 압력손실 관리\n담체가 미세할수록 접촉면적은 커지나 압력손실이 증가하므로, 우드칩·퇴비 혼합비를 조정하여 공극률을 확보하는 것이 실무 설계의 핵심이다.\n\n### 담체 재료별 특성 비교\n| 담체 | 공극률 | 수명 | 특징 |\n|---|---|---|---|\n| 퇴비(Compost) | 높음 | 2~3년 | 영양분 자체 함유, 초기비용 낮음 |\n| 우드칩 | 매우 높음 | 3~5년 | 압력손실 최소, 퇴비와 혼합사용 多 |\n| 피트모스 | 중간 | 2~4년 | 보습력 우수, 산성 유지에 유리 |\n| 인공담체(세라믹 등) | 조절 가능 | 반영구 | 트리클링필터용, 초기비용 높음 |\n\n### 함수율 관리 실무\n함수율이 40% 미만으로 떨어지면 미생물 활성이 급격히 감소하므로, 자동 살수 타이머와 함수율 센서를 연동한 제어가 안정적 운전의 핵심이다.\n\n### 겨울철 운전 관리\n저온기에는 미생물 활성이 저하되어 처리효율이 떨어질 수 있으므로, 보온재 설치나 배출가스 예열 등을 통해 담체층 온도를 15℃ 이상으로 유지하는 것이 권장된다.\n\n### 처리효율 저하 시 원인 진단 순서\n1. 함수율·pH 측정(가장 먼저 확인)\n2. 채널링 여부 육안·열화상 확인\n3. 유입농도 급증(충격부하) 이력 확인\n4. 담체 압밀·수명 초과 여부 확인"},{"title":"미생물 처리 관련 제도와 기출 연계","body":"### 악취방지시설로서의 생물학적 처리 인정 요건\n악취방지시설 성능검사 시 생물학적 처리시설은 제거효율(입·출구 복합악취 희석배수 비교) 기준을 충족해야 하며, Day 78에서 학습할 악취방지시설 성능검증제도와 연계하여 정기적인 효율 확인이 요구된다.\n\n### 하이브리드 결합 사례\n1. 습식스크러버(1차, 고농도 산성가스 제거) → 바이오필터(2차, 저농도 잔류물질 최종 처리)\n2. 활성탄흡착(피크부하 대응) → 바이오필터(기저부하 상시 처리)\n\n### 기출 연계 자가점검\n1. 바이오필터의 처리원리와 설계인자(EBRT, 함수율)를 설명하시오. *(다수 회차 10~25점)*\n2. 바이오필터·바이오트리클링필터·바이오스크러버를 비교 설명하시오. *(120회 25점)*\n3. 생물학적 처리시설의 운전상 문제점과 대책을 설명하시오. *(최근 10점)*\n4. 악취방지시설로서 생물학적 처리기술의 적용 사례를 설명하시오. *(126회 10점)*\n5. 미생물 순화(Acclimation) 기간과 초기 기동관리 방안을 설명하시오. *(최근 10점)*\n\n### 진도 점검\nDay 53~70(흡수·흡착·NOx·SOx·VOCs·생물학적처리)까지 학습이 완료되었다면, 방지시설 전체 계열 중 화학적·물리적·생물학적 처리기술의 큰 그림은 갖춘 것이다. 다음 Day 71부터는 신기술(플라즈마·광촉매)로 넘어간다.\n\n### 관련 법령·제도 메모\n「악취방지법」에 따른 악취방지시설 설치·운영 신고 시, 생물학적 처리시설도 방지시설의 한 종류로 인정되며 정기적인 복합악취 측정을 통해 배출허용기준 준수 여부를 입증해야 한다. 설계용량·처리효율 근거자료를 갖추어 두는 것이 인허가 실무에서 중요하다."}]},"71":{"day":71,"date":"2026-10-10","title":"플라즈마·광촉매 등 신기술","keywords":[{"k":"저온플라즈마(NTP)","subs":["고전압 방전으로 라디칼(O·OH) 생성","코로나·유전체장벽방전(DBD)","부산물 오존·NOx 발생 관리"]},{"k":"광촉매(TiO₂ UV)","subs":["UV 조사로 전자-정공쌍 생성","·OH 라디칼 산화, 상온 반응","저농도·저풍량에 적합"]},{"k":"광산화(UV/O₃, AOP)","subs":["UV+오존 병행 산화","고급산화공정(AOP) 개념","수처리·배가스 병행 적용"]},{"k":"장단점 비교","subs":["저에너지·소형화 장점","부산물(오존) 관리 필요","고농도 처리한계·촉매수명"]},{"k":"결합·최신동향","subs":["플라즈마+촉매(Plasma-catalysis)","광촉매+흡착 병행","실증단계 다수, 상용화 확대중"]}],"answer":"# 플라즈마·광촉매 등 신기술\n\n## Ⅰ. 개요\n\n기존 흡착·연소·생물학적 처리로 처리하기 어려운 저농도·복합조성 VOCs 및 악취물질에 대응하기 위해 저온플라즈마(NTP, Non-Thermal Plasma)와 광촉매산화(Photocatalytic Oxidation) 등의 신기술이 개발·적용되고 있다. 이들 기술은 공통적으로 반응성이 매우 높은 라디칼(O·, OH·)을 생성하여 상온에서 유기물을 산화·분해하는 원리를 이용하며, 연소처리 대비 에너지 소비가 적고 설비가 소형화될 수 있다는 장점이 있으나, 부산물 관리와 고농도 처리 한계 등 실무 적용상 고려사항이 있다. *(114~138회 다수 10점, 일부 25점 기출)*\n\n## Ⅱ. 반응 원리\n\n### 1. 저온플라즈마(NTP)\n고전압 방전(코로나방전, 유전체장벽방전 DBD 등)으로 전자를 가속시켜 기체분자와 충돌시키면, 전자온도는 매우 높으나(수만 K) 기체 전체 온도는 상온에 가까운 비평형 플라즈마가 형성된다. 이 과정에서 생성된 전자·이온·라디칼(O·, OH·, O₃)이 오염물질과 반응하여 산화·분해한다.\n\n반응식(개념): e⁻ + O₂ → O· + O· + e⁻ , O· + O₂ → O₃, 유기물 + O·(또는 O₃) → CO₂ + H₂O\n\n### 2. 광촉매산화(TiO₂/UV)\nTiO₂ 등의 반도체 촉매에 밴드갭 이상 에너지의 자외선(UV)을 조사하면 전자-정공쌍(e⁻-h⁺)이 생성되고, 정공이 표면의 수분·산소와 반응하여 강력한 산화제인 ·OH 라디칼과 O₂⁻를 생성, 유기물을 분해한다.\n\n반응식(개념): TiO₂ + hν → e⁻ + h⁺ , h⁺ + H₂O → ·OH + H⁺ , ·OH + 유기물 → CO₂ + H₂O\n\n## Ⅲ. 기술별 비교\n\n| 구분 | 저온플라즈마(NTP) | 광촉매(TiO₂/UV) | AOP(UV/O₃) |\n|---|---|---|---|\n| 에너지원 | 고전압 방전 | 자외선(UV) | 자외선+오존 |\n| 반응매질 | 기상 직접 방전 | 촉매 표면 | 기상·액상 병행 |\n| 적용 농도 | 저~중농도 | 저농도 | 저농도 |\n| 주요 부산물 | 오존, 미량 NOx | 미미(부분산화 중간체 주의) | 잔류오존 |\n| 처리대상 | VOCs, 악취, 살균 | VOCs, 악취, 항균·자정 코팅 | 수처리, 저농도 악취 |\n| 상용화 수준 | 실증~일부 상용 | 실증~일부 상용 | 수처리 위주 상용화 |\n\n## Ⅳ. 문제점과 관리방안\n\n### 1. 부산물 관리\n플라즈마·광촉매 공정 모두 반응 부산물로 오존(O₃)이 생성될 수 있어, 후단에 오존 분해 촉매(MnO₂계) 또는 활성탄을 배치하여 잔류 오존을 제거하는 설계가 필요하다. 또한 불완전산화 시 알데히드류 등 2차 부산물이 생성될 수 있어 후단 처리(흡착 등)와의 결합이 권장된다.\n\n### 2. 고농도·대풍량 처리 한계\n현재 기술 수준에서는 고농도·대풍량 배출원에 단독 적용 시 처리효율이 급감하므로, 저농도 대풍량 조건 또는 기존 공정(흡착·바이오필터)의 보조·후처리 공정으로 결합하는 하이브리드 적용이 실무적으로 확대되고 있다.\n\n### 2-1. 광촉매의 밴드갭과 UV 파장 선택\nTiO₂(아나타제형)의 밴드갭은 약 3.2eV로, 이를 여기시키기 위해서는 파장 388nm 이하의 UV(주로 UV-A 영역)가 필요하다. 가시광 응답형 광촉매(질소·금속 도핑 TiO₂)는 태양광 활용 가능성 때문에 최근 연구가 활발하나, 상용화 수준의 처리효율 확보는 아직 제한적이다.\n\n### 3. 촉매·전극 수명 관리\n광촉매는 표면 오염(분진 피복)으로 활성이 저하되므로 정기 세정이 필요하며, 플라즈마 전극은 방전에 의한 마모·오염으로 정기 점검·교체가 요구된다.\n\n| 문제 | 관리방안 |\n|---|---|\n| 오존 부산물 | 후단 오존분해촉매·활성탄 설치 |\n| 불완전산화 중간체 | 흡착·생물학적 처리와 결합 |\n| 고농도 처리한계 | 전처리(흡착 농축) 병행 |\n| 촉매 표면오염 | 정기 세정, 예비 집진 |\n\n### 4. 경제성·에너지 비교(개념)\n| 구분 | 상대적 에너지 소비 | 초기투자비 | 처리규모 적합성 |\n|---|---|---|---|\n| RTO/RCO(연소) | 높음~중간(열회수 시 절감) | 높음 | 대풍량 |\n| 저온플라즈마 | 낮음~중간(전력) | 중간 | 소~중풍량 |\n| 광촉매 | 낮음(UV 램프) | 낮음~중간 | 소풍량, 분산형 |\n\n신기술은 대체로 소형·분산 배출원, 또는 기존 대형 공정의 후처리(폴리싱) 단계에 적합하며, 대풍량 고농도 배출원의 주공정으로는 아직 제한적이라는 점을 답안에 명시하는 것이 바람직하다.\n\n## Ⅴ. 결론\n\n저온플라즈마와 광촉매 등 신기술은 상온에서 강력한 라디칼을 생성해 저농도·복합조성 VOCs 및 악취물질을 처리할 수 있는 저에너지 대안 기술로, 소형·분산형 배출원이나 기존 공정의 후처리 단계에서 활용도가 높아지고 있다. 다만 오존 등 부산물 관리와 고농도 처리 한계라는 실무적 제약이 있으므로, 단독 적용보다는 흡착·생물학적 처리 등 기존 기술과의 하이브리드 결합을 통해 처리범위와 안정성을 확보하는 것이 최근의 기술개발 방향이다.\n\n| 요약 | 강점 | 유의사항 |\n|---|---|---|\n| 저온플라즈마 | 저에너지, 신속반응, 살균효과 | 오존·NOx 부산물 관리 |\n| 광촉매 | 상온반응, 표면코팅 응용 가능 | 저농도 한정, 촉매수명 |\n\n답안 작성 시에는 신기술을 단독 만능해법으로 서술하지 않도록 유의하고, \"기존 공정과의 하이브리드 결합을 통한 보완적 적용\"이라는 관점을 결론에 명시하면 균형 잡힌 서술이 된다.\n","side":[{"title":"Plasma-catalysis(플라즈마-촉매 결합) 최신동향","body":"### 결합 원리\n플라즈마 방전 공간에 촉매(TiO₂, MnO₂ 등)를 함께 배치하여, 플라즈마가 생성한 라디칼·오존을 촉매 표면에서 추가 분해시킴으로써 단독 플라즈마 대비 처리효율을 높이고 오존 부산물을 저감하는 기술이다.\n\n### 적용 형태 비교\n| 배치 방식 | 특징 |\n|---|---|\n| In-plasma catalysis | 방전공간 내 촉매 직접 배치, 반응 즉시성 우수 |\n| Post-plasma catalysis | 방전 후단에 촉매층 배치, 오존 분해 목적에 특화 |\n\n### 실증 적용 사례 경향\n악취방지시설(음식물처리시설, 도장부스 등)에서 기존 흡착·세정 공정의 전처리 또는 후처리로 소형 플라즈마 모듈을 결합하는 사례가 늘고 있으며, 국내 다수 지자체·환경산업 실증사업에서 시범 적용되고 있다.\n\n### 방전 방식별 비교\n| 방식 | 원리 | 특징 |\n|---|---|---|\n| 코로나방전 | 침-판 전극 간 국소 고전계 방전 | 구조 단순, 오존 발생 상대적으로 큼 |\n| 유전체장벽방전(DBD) | 전극 사이 유전체 삽입, 균일방전 | 대면적 처리 유리, 상용화 다수 |\n| 펄스방전 | 짧은 고전압 펄스 인가 | 에너지효율 우수, 설비 복잡 |\n\n### 도입 검토 시 고려사항\n소규모 사업장(악취배출시설 3종 등)에서는 초기투자비가 낮은 플라즈마·광촉매 모듈이 활성탄 교체비용 부담을 줄이는 대안으로 검토되나, 처리풍량이 커질수록 단위비용이 상승하는 한계를 함께 설명하는 것이 균형 잡힌 답안이다.\n\n### 전력비 개념 계산\n방전전력 1kW급 모듈로 풍량 1,000㎥/h를 처리한다고 가정하면, 단위풍량당 전력소비는 1kWh/1,000㎥로, 연소식(RTO 등) 대비 전력비만 비교 시 상대적으로 낮은 편이나 절대 처리용량이 작다는 한계가 있다."},{"title":"UV/AOP 처리와 관련 기출 연계","body":"### 고급산화공정(AOP)의 정의\nAOP(Advanced Oxidation Process)는 ·OH 라디칼과 같은 강력한 산화제를 활용하여 난분해성 오염물질을 무기물로 분해하는 공정의 총칭으로, UV/O₃, UV/H₂O₂, Fenton 등이 있으며 대기 분야에서는 저농도 악취·VOCs의 UV 병행 산화처리에 응용된다.\n\n### 광촉매 자정작용(Self-cleaning) 응용\nTiO₂ 광촉매는 건축 외장재·도로 방음벽 등에 코팅되어 NOx·VOCs를 대기 중에서 직접 분해하는 자정형 소재로도 응용되며, 이는 점오염원 방지시설이 아닌 확산 저감형 적용 사례로 최근 기출에서 언급되고 있다.\n\n### 기출 연계 자가점검\n1. 저온플라즈마(NTP)를 이용한 VOCs 처리원리를 설명하시오. *(다수 회차 10점)*\n2. 광촉매산화의 원리와 적용 사례를 설명하시오. *(120회 10점)*\n3. 플라즈마·광촉매 처리기술의 부산물(오존) 관리방안을 설명하시오. *(최근 10점)*\n4. 대기오염 저감을 위한 신기술 3가지를 제시하고 각각의 원리를 설명하시오. *(126회 25점)*\n5. 고급산화공정(AOP)의 개념과 대기오염 방지분야 적용 가능성을 설명하시오. *(최근 10점)*\n\n### 암기 카드 4선\n1. **NTP** = 비평형 플라즈마, 전자온도만 높고 기체온도는 상온\n2. **광촉매** = TiO₂+UV → e⁻-h⁺쌍 → ·OH 라디칼 생성\n3. **DBD** = 유전체장벽방전, 대면적 처리에 유리\n4. **부산물 관리** = 오존분해촉매(MnO₂계) 후단 설치가 핵심"}]},"72":{"day":72,"date":"2026-10-11","title":"악취의 정의와 지정악취물질","keywords":[{"k":"악취 정의","subs":["「악취방지법」제2조 정의","황화합물·질소화합물·VOCs 등 자극성 냄새","불쾌감·혐오감 유발 물질"]},{"k":"지정악취물질","subs":["현재 22종 지정(암모니아·H2S 등)","「악취방지법 시행규칙」별표","배출허용기준·엄격기준 설정 근거"]},{"k":"악취물질 분류","subs":["황계열(H2S·메르캅탄류)","질소계열(암모니아·아민류)","VOCs계열(알데히드·지방산류)"]},{"k":"악취 특성","subs":["복합취(단일물질 아님)","극미량(ppb)에서도 감지","기여도 산정의 어려움"]},{"k":"관리체계 개요","subs":["악취배출시설 신고제","배출허용기준(부지경계·굴뚝)","복합악취·지정악취물질 병행관리"]}],"answer":"# 악취의 정의와 지정악취물질\n\n## Ⅰ. 개요\n\n악취란 「악취방지법」제2조에 따라 \"황화수소, 메르캅탄류, 아민류 등의 화학물질이나 부패한 동식물성 물질 등으로부터 발생하는 자극성이 있는 냄새로 사람의 후각을 자극하여 불쾌감과 혐오감을 주는 냄새\"를 말한다. 대기오염물질이 대부분 기기측정을 통해 정량화되는 것과 달리, 악취는 사람의 후각이라는 주관적 감각기관을 통해 인지되며 극미량(ppb 수준)에서도 민원의 원인이 된다는 점에서 관리상 특수성을 가진다. 이에 따라 개별 물질 농도로 규제하는 지정악취물질과 사람 코를 이용한 공기희석관능법(복합악취)을 병행하여 관리한다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 법적 정의와 관리 근거\n\n### 1. 관련 법령 체계\n「악취방지법」이 악취 관리의 기본법으로, 「대기환경보전법」과는 별도의 독립된 법체계다. 「악취방지법 시행규칙」에서 지정악취물질의 종류·배출허용기준·측정방법을 구체적으로 규정한다.\n\n### 2. 용어 정의\n| 용어 | 정의 |\n|---|---|\n| 악취 | 사람의 후각을 자극, 불쾌감·혐오감을 주는 냄새(법 제2조) |\n| 지정악취물질 | 악취의 원인으로 관리가 필요하다고 인정되는 물질(환경부령 지정) |\n| 복합악취 | 두 가지 이상 악취물질의 상호작용으로 발생하는 냄새 |\n| 악취배출시설 | 악취를 발생시키는 시설 중 악취방지법에 따라 신고대상으로 지정된 시설 |\n\n## Ⅲ. 지정악취물질의 분류\n\n### 1. 계열별 분류(현재 22종 수준, 개정 여부 확인 필요)\n| 계열 | 대표물질 | 발생원 |\n|---|---|---|\n| 황화합물 | 황화수소(H₂S), 메틸메르캅탄, 다이메틸설파이드, 다이메틸다이설파이드 | 하수처리장, 축산시설, 매립지 |\n| 질소화합물 | 암모니아, 트리메틸아민 | 축산시설, 비료제조, 수산가공 |\n| 알데히드류 | 아세트알데히드, 프로피온알데히드, 뷰티르알데히드 등 | 도장시설, 식품가공 |\n| 지방산류 | 프로피온산, n-뷰티르산, n-발레르산, i-발레르산 | 축산·식품 폐수처리 |\n| 방향족·기타 | 스타이렌, 톨루엔, 자일렌 등 | 도장·인쇄·화학공정 |\n\n### 2. 악취물질의 공통 특성\n- 낮은 후각감지역치(극미량에서도 감지, 물질별 ppb~ppt 수준)\n- 복합적으로 존재하여 상승·상쇄 작용(단순 합산으로 평가 불가)\n- 기상조건(온도·습도·풍향)에 따라 확산·강도 변동이 큼\n\n## Ⅳ. 관리체계와 문제점·대응방안\n\n### 1. 이원적 관리체계\n| 관리방식 | 측정방법 | 기준 |\n|---|---|---|\n| 지정악취물질 개별관리 | 기기분석(GC 등) | 물질별 배출허용기준(ppm 단위) |\n| 복합악취 관리 | 공기희석관능법(패널) | 희석배수 기준(부지경계·굴뚝 구분) |\n\n### 2. 관리상 문제점\n- 개별 지정악취물질 기준을 만족해도 복합적으로는 불쾌감을 유발할 수 있어 두 지표가 병행 필요\n- 후각 순응(Adaptation)으로 인해 발생원 종사자는 둔감해지나 인근 주민은 민감하게 반응하는 인지 격차\n- 간헐적·순간적 배출(피크성)이 많아 상시측정만으로는 실제 민원 상황을 완전히 반영하기 어려움\n\n### 3. 대응방안\n관리주체는 정기적인 복합악취·지정악취물질 측정과 함께, 실시간 악취센서 모니터링 시스템을 보조적으로 도입하여 피크성 배출을 포착하고 원인시설을 신속히 특정하는 체계를 구축할 필요가 있다. 아울러 사업장 스스로도 공정 개선(원료 대체, 밀폐화)을 통한 발생원 저감을 방지시설 설치와 병행하는 것이 근본적 해결책이 된다.\n\n### 4. 지정악취물질 목록의 개정 동향\n지정악취물질은 산업구조 변화와 신규 배출원 출현에 따라 주기적으로 검토·개정되며, 최근에는 폐기물처리시설·바이오가스화시설 등 신규 악취배출시설 유형이 늘어나면서 관련 물질의 추가 지정 필요성이 논의되고 있다. 수험 답안에서는 특정 개수를 절대적으로 단정하기보다 \"환경부 고시로 지정·관리되며 주기적으로 개정된다\"는 제도적 유연성을 함께 서술하는 것이 안전하다.\n\n### 5. 악취 관련 인접 개념과의 구분\n| 구분 | 대상 | 관리법령 |\n|---|---|---|\n| 대기오염물질 | 건강·환경 영향 중심 | 「대기환경보전법」 |\n| 특정대기유해물질 | 대기오염물질 중 유해성 높은 35종 | 「대기환경보전법」 |\n| 악취물질(지정악취물질) | 후각 자극·불쾌감 중심 | 「악취방지법」 |\n\n세 개념은 서로 배타적이지 않고 일부 중첩(예: 암모니아, 황화수소는 악취물질이면서 대기오염물질이기도 함)되므로, 답안에서는 \"목적과 관리법령이 다른 별개의 분류체계\"라는 점을 명확히 구분해 서술해야 한다. 이 구분을 명확히 하지 못하면 「악취방지법」과 「대기환경보전법」이 요구하는 신고·허가 절차를 혼동하여 실무상 인허가 누락으로 이어질 수 있으므로 실무적으로도 중요한 구분이다.\n\n## Ⅴ. 결론\n\n악취는 후각이라는 주관적 감각을 대상으로 하는 오염물질로, 지정악취물질의 개별 기준과 복합악취(공기희석관능법)의 병행 관리가 핵심 특징이다. 향후에는 실시간 모니터링 기술 고도화와 지정악취물질 목록의 주기적 갱신을 통해, 변화하는 산업구조와 신규 배출원(예: 폐기물 에너지화 시설)에 대응하는 관리체계 강화가 필요하다.\n\n| 요약 | 관리수단 |\n|---|---|\n| 지정악취물질 | 기기측정, 개별 배출허용기준 |\n| 복합악취 | 공기희석관능법, 희석배수 기준 |\n\n수험 답안에서는 \"왜 하나의 관리방식만으로는 부족한가\"를 먼저 짚은 뒤 두 관리방식의 상호보완적 관계를 설명하는 순서로 서술하면 논리적 완결성이 높은 답안이 된다.\n","side":[{"title":"지정악취물질 22종 암기 정리","body":"### 계열별 암기표\n| 계열 | 물질 |\n|---|---|\n| 황화합물(4) | 황화수소, 메틸메르캅탄, 다이메틸설파이드, 다이메틸다이설파이드 |\n| 질소화합물(2) | 암모니아, 트리메틸아민 |\n| 알데히드류(4) | 아세트알데히드, 프로피온알데히드, 뷰티르알데히드, n-발레르알데히드 |\n| 지방산류(4) | 프로피온산, n-뷰티르산, n-발레르산, i-발레르산 |\n| 방향족·에스터·기타(다수) | 스타이렌, 톨루엔, 자일렌, 메틸에틸케톤, 메틸아이소뷰틸케톤, 아이소뷰틸알코올, 아이소발레르산 등 |\n\n물질 목록·개수는 환경부 고시 개정으로 변동될 수 있으므로, 답안 작성 시 절대 개수를 단정하기보다 \"환경부장관이 관계 중앙행정기관과 협의하여 정하는 물질\"이라는 법적 근거 표현을 함께 쓰는 것이 안전하다.\n\n### 후각감지역치 감각(예시, 문헌값)\n| 물질 | 감지역치(ppb 수준) |\n|---|---|\n| 황화수소 | 매우 낮음(0.5 이하 수준) |\n| 암모니아 | 상대적으로 높음(수백 ppb 수준) |\n| 메틸메르캅탄 | 매우 낮음(1 이하 수준) |\n\n수치는 문헌마다 차이가 있으므로 상대적 크기 비교(황화합물이 암모니아보다 훨씬 낮은 농도에서 감지) 위주로 기억하는 것이 실전에서 안전하다.\n\n### 발생원별 대표 악취물질 매칭\n| 발생원 | 대표 악취물질 |\n|---|---|\n| 하수·분뇨처리장 | 황화수소, 메틸메르캅탄, 암모니아 |\n| 축산시설(돈사·계사) | 암모니아, 트리메틸아민, 지방산류 |\n| 도장·인쇄시설 | 톨루엔, 자일렌, 스타이렌 |\n| 식품가공·폐수처리 | 지방산류, 알데히드류 |\n| 매립지·소각시설 | 황화합물, 알데히드류, 복합가스 |\n\n발생원-물질 매칭은 원인시설 추정과 방지시설 선정(Day 70 생물학적 처리, Day 53~56 흡수·흡착)에 직결되므로 실무·시험 모두에서 핵심 암기 대상이다."},{"title":"악취 관련 기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 악취의 정의와 지정악취물질의 종류를 설명하시오. *(114~138회 다수 10~25점)*\n2. 지정악취물질과 복합악취의 관리방식 차이를 설명하시오. *(120회 25점)*\n3. 악취물질의 특성(감지역치, 복합작용)을 설명하시오. *(최근 10점)*\n4. 「악취방지법」과 「대기환경보전법」의 관계를 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n악취 관련 문제는 정의 → 법적 근거 → 물질 분류(표) → 관리방식(지정악취물질 vs 복합악취) 순서로 서술하면 논리적 흐름이 명확해진다. 특히 \"왜 두 가지 관리방식을 병행하는가\"에 대한 서술(개별기준 충족해도 복합적 불쾌감 발생 가능)을 포함하면 고득점 포인트가 된다.\n\n### 관련 제도 확장 메모\n최근에는 악취관리지역 지정, 악취실태조사, 악취기술진단 등 사전예방적 제도가 확대되고 있으며 이는 Day 75에서 상세히 다룬다.\n\n### 암기 카드 5선\n1. **악취 정의** = 자극성 냄새로 불쾌감·혐오감을 주는 것(악취방지법 제2조)\n2. **지정악취물질** = 개별 기기측정, 계열별(황·질소·알데히드·지방산·방향족) 분류\n3. **복합악취** = 공기희석관능법(사람 후각), Day73 상세\n4. **이원관리** = 지정악취물질(개별) + 복합악취(종합) 병행\n5. **후각특성** = 순응(둔감화), 극미량 감지, 개인차 큼\n\n### 답안 확장 포인트\n악취물질 목록을 단순 나열하기보다, \"왜 22종만 지정하는가\"에 대해 관리 실효성(측정 가능성·발생 빈도·주민 영향)을 종합적으로 고려해 선정한다는 취지를 함께 언급하면 답안의 완성도가 높아진다."}]},"73":{"day":73,"date":"2026-10-12","title":"복합악취·공기희석관능법과 악취단위","keywords":[{"k":"공기희석관능법","subs":["패널요원(5인 이상) 관능평가","무취공기로 단계 희석","최소감지희석배수(판정역치)"]},{"k":"희석배수 산정","subs":["기하평균으로 대표값 산출","최고·최저값 제외 처리","배출구·부지경계 기준 상이"]},{"k":"악취농도·악취지수","subs":["OU(Odor Unit) 개념","악취지수 = 판정 희석배수","OU/㎥ 표시 방식"]},{"k":"측정지점 구분","subs":["배출구(굴뚝) — 높은 희석배수 허용","부지경계선 — 낮은 희석배수","공정악취·복합악취 시료채취법"]},{"k":"시료채취·분석 절차","subs":["시료채취 백(Tedlar bag)","즉시 분석원칙(보관시간 제한)","패널 선정·자격기준"]}],"answer":"# 복합악취·공기희석관능법과 악취단위\n\n## Ⅰ. 개요\n\n복합악취는 두 가지 이상의 악취물질이 상호작용하여 나타나는 종합적인 냄새로, 개별 물질의 기기측정만으로는 실제 사람이 느끼는 불쾌감의 정도를 완전히 반영하기 어렵다. 이에 「악취방지법」에서는 사람의 후각을 직접 이용하는 공기희석관능법을 통해 복합악취를 정량화하며, 그 결과값을 희석배수(악취농도 또는 악취지수)로 표현한다. 이 방법은 주관적 감각을 표준화된 절차(패널 선정, 단계희석, 통계처리)로 객관화한다는 점에서 대기오염 측정 분야의 독특한 기법이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 공기희석관능법의 원리와 절차\n\n### 1. 기본 원리\n채취한 시료를 무취공기로 단계적으로(통상 3배수 계열) 희석하면서 패널요원이 냄새를 감지하는지 판정하고, 냄새를 감지하지 못하게 되는 최소 희석배수를 그 시료의 악취농도로 정의한다.\n\n### 2. 측정 절차\n| 단계 | 내용 |\n|---|---|\n| 시료 채취 | Tedlar bag 등에 배출구 또는 부지경계에서 채취 |\n| 패널 선정 | 후각 정상자 5인 이상, 사전 후각검사로 선정 |\n| 단계 희석 | 무취공기로 순차 희석(3배수 계열 등) |\n| 판정 | 각 희석단계에서 냄새 감지 여부 응답 |\n| 통계처리 | 최고·최저 판정값 제외 후 기하평균 산출 |\n\n### 3. 시료 보관·분석상 유의사항\n채취된 시료는 시간 경과에 따라 냄새성분이 변질되거나 감소할 수 있어, 채취 후 신속한 분석(통상 채취 당일 또는 규정된 제한시간 내)이 원칙이다.\n\n## Ⅲ. 악취농도·악취지수의 정의와 산정\n\n### 1. 용어 정리\n| 용어 | 정의 |\n|---|---|\n| 악취농도(희석배수) | 냄새를 감지할 수 없게 되는 최소 희석배수 |\n| 악취지수 | 악취농도를 이용해 산출한 지표(측정지점별 배출허용기준과 비교) |\n| OU(Odor Unit, 악취단위) | 국제적으로 통용되는 악취 강도 표시 단위(OU/㎥) |\n\n### 2. 통계처리 방법\n각 패널요원의 판정 희석배수 중 최고값과 최저값을 제외한 나머지 값들의 기하평균을 대표 악취농도로 산정하며, 이는 극단적 감각편차(과민·둔감)의 영향을 최소화하기 위한 절차다.\n\n### 3. 측정지점별 기준 차등 구조\n| 측정지점 | 특징 | 배출허용기준 경향 |\n|---|---|---|\n| 배출구(굴뚝) | 고농도, 유량 있음 | 상대적으로 높은 희석배수까지 허용(유량 고려 보정) |\n| 부지경계선 | 저농도, 직접 주민 노출 | 상대적으로 낮은 희석배수 기준(엄격) |\n\n이러한 차등은 배출구의 고농도 오염물질이 대기 중에서 확산·희석을 거쳐 부지경계에 도달할 때는 상당히 낮아진다는 물리적 특성을 반영한 것으로, 배출구 기준만 충족하고 부지경계 기준을 초과하는 경우도 실무에서 종종 발생하므로 두 지점을 모두 관리해야 한다.\n\n## Ⅳ. 문제점과 관리방안\n\n### 1. 관능법의 한계\n- 패널요원의 개인차·컨디션에 따른 판정 편차 가능성\n- 순간적·간헐적 배출(피크성 악취)을 짧은 측정시점에 포착하지 못할 가능성\n- 측정비용·시간 소요로 상시 모니터링에는 한계\n\n### 2. 보완방안\n| 문제 | 보완방안 |\n|---|---|\n| 판정 편차 | 패널 선정기준 강화, 정기 후각검사 |\n| 피크성 배출 미포착 | 실시간 악취센서 병행 모니터링 |\n| 측정비용·시간 | 지정악취물질 기기측정과 역할 분담 |\n\n### 3. 배출구 희석배수와 부지경계 규제의 연계\n배출구 희석배수 기준은 유효굴뚝높이·배출유량 등을 고려해 확산 후 부지경계에서 목표 농도 이하가 되도록 역산하여 설정되는 경우가 많아, 두 지점 기준은 서로 연계되어 있다.\n\n### 3. 패널 선정 및 자격 관리\n공기희석관능법의 신뢰도는 패널요원의 후각 정상성에 크게 의존하므로, 사전 후각검사(기준물질에 대한 감지·식별 능력 확인)를 통과한 인원만 패널로 선정하며, 흡연·감기 등 후각에 영향을 줄 수 있는 상태의 인원은 측정 당일 제외하는 등 엄격한 절차관리가 요구된다.\n\n### 4. 국내외 악취단위 비교\n| 구분 | 표시방식 | 비고 |\n|---|---|---|\n| 국내(공기희석관능법) | 희석배수(무차원) | 최소감지 희석배수 |\n| 유럽(EN 13725) | OU/㎥ (Odor Unit) | 동적 올팩토미터 활용 |\n| 미국(ASTM 등) | D/T ratio | 희석배수 개념과 유사 |\n\n국내 관능법과 국제 표준(EN 13725)은 측정원리(단계 희석+패널 판정)가 유사하나, 사용 장비(정적 대 동적 올팩토미터)와 통계처리 방식에 차이가 있다는 점을 답안에서 언급하면 심화 서술이 가능하다.\n\n## Ⅴ. 결론\n\n공기희석관능법은 사람의 후각을 표준화된 절차로 객관화하여 복합악취를 정량화하는 핵심 측정기법으로, 배출구와 부지경계선의 이원적 기준체계를 통해 사업장 관리와 주민 체감 저감을 동시에 도모한다. 다만 관능법 고유의 주관성 한계를 보완하기 위해 실시간 센서 모니터링과 지정악취물질 기기측정을 병행하는 통합 관리체계 구축이 필요하다.\n\n| 요약 | 핵심 |\n|---|---|\n| 측정원리 | 무취공기 단계희석, 최소감지 희석배수 |\n| 통계처리 | 최고·최저 제외 기하평균 |\n| 기준체계 | 배출구(완화) vs 부지경계(엄격) 이원화 |\n","side":[{"title":"희석배수 산정 계산 예제","body":"### 기하평균 계산 개념\n5인 패널의 판정 희석배수가 10, 30, 30, 100, 300이라면, 최고값(300)과 최저값(10)을 제외한 나머지 30, 30, 100의 기하평균을 산정한다.\n\n기하평균 = (30 × 30 × 100)^(1/3) ≈ **44.8**\n\n→ 소수점 처리 및 반올림 규정은 관련 공정시험기준에 따르며, 실무에서는 계산기·통계프로그램으로 처리하되 원리(이상값 제외+기하평균)를 정확히 설명할 수 있어야 한다.\n\n### 시료 수 증가 시 처리 원칙\n패널 인원이 5인을 초과하는 경우에도 동일하게 최고·최저 각 1개씩 제외 후 나머지 값의 기하평균을 취하는 것이 일반적 원칙이며, 구체적인 제외 개수·절차는 관련 공정시험기준의 세부 규정을 따른다.\n\n### 무취공기 품질관리\n희석에 사용하는 무취공기 자체에 잔류 냄새가 있으면 측정결과가 왜곡되므로, 활성탄 필터 등을 통과시켜 무취 상태를 확보하고 정기적으로 품질을 점검하는 것이 측정 신뢰도 확보의 전제조건이다.\n\n### 유효굴뚝높이 보정 개념(연계 계산)\nHe(유효굴뚝높이) = Hs(실제높이) + ΔH(연기상승고)이며, He가 높을수록 지상 도달농도가 낮아지므로 동일한 배출구 희석배수라도 부지경계 영향은 굴뚝 높이에 따라 달라진다. 이는 Day 12~13의 플룸상승고 공식과 연결되는 부분으로, 답안에서 \"배출구 기준이 완화된 이유\"를 설명할 때 함께 인용하면 좋다.\n\n### 배출구 희석배수 여유도 개념\n배출유량이 크고 유효굴뚝높이가 높을수록 대기 중 희석·확산이 크게 일어나므로, 배출구에서 허용되는 희석배수 기준은 부지경계 기준보다 완화되어 설정되는 경향이 있다. 이는 Day 12~13에서 학습한 확산이론(유효고·풍속에 따른 농도 저감)과 직접 연결된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 공기희석관능법의 측정원리와 절차를 설명하시오. *(114~138회 다수 25점)*\n2. 악취농도(희석배수) 산정 시 통계처리 방법을 설명하시오. *(120회 10점)*\n3. 배출구와 부지경계선의 악취 배출허용기준 차이를 설명하시오. *(126회 25점)*\n4. 공기희석관능법의 한계와 보완방안을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n계산 문제(희석배수·기하평균)가 출제되면 반드시 \"최고·최저값 제외\" 절차를 명시하고 계산과정을 단계별로 제시해야 한다. 서술형 문제에서는 관능법의 객관화 절차(패널선정→희석→판정→통계처리)를 순서대로 나열하는 것이 감점을 피하는 요령이다.\n\n### 실무 연계 메모\n악취배출시설 인허가 시 사업장은 정기적으로 배출구·부지경계 복합악취를 측정하여 관할 지자체에 결과를 제출해야 하며, 초과 시 개선명령 등의 행정조치 대상이 될 수 있다.\n\n### 암기 카드 5선\n1. **공기희석관능법** = 패널 5인 이상, 무취공기 단계희석\n2. **통계처리** = 최고·최저 제외 후 기하평균\n3. **OU/㎥** = 국제표준(EN 13725) 악취단위 표기\n4. **배출구 vs 부지경계** = 완화 vs 엄격 기준\n5. **패널 자격관리** = 사전 후각검사, 당일 컨디션 확인 필수\n\n### 답안 확장 포인트\n계산문제 채점에서는 정답 수치보다 \"왜 최고·최저값을 제외하는가\"(패널 간 극단적 편차의 영향 최소화)를 설명하는 논리 서술에 배점이 있는 경우가 많으므로, 계산과정과 함께 절차의 취지를 반드시 서술해야 한다."}]},"74":{"day":74,"date":"2026-10-13","title":"악취 배출허용기준과 엄격한 기준","keywords":[{"k":"배출허용기준 체계","subs":["「악취방지법」환경부령 기준","지역구분(공업/기타지역)","복합악취·지정악취물질 병행기준"]},{"k":"엄격한 기준","subs":["지자체 조례로 강화 가능","환경부 기준 이하로만 강화","악취관리지역 지정과 연계"]},{"k":"측정지점별 차등","subs":["배출구 vs 부지경계 기준 상이","공업지역/기타지역 차등","신규/기존시설 차등 유예"]},{"k":"초과 시 조치","subs":["개선명령·조업정지 등 행정처분","악취방지계획서 제출","기술진단 명령"]},{"k":"악취관리지역","subs":["민원 다발지역 지정","강화된 기준·특별관리","지정·해제 절차"]}],"answer":"# 악취 배출허용기준과 엄격한 기준\n\n## Ⅰ. 개요\n\n「악취방지법」은 악취배출시설에서 배출되는 악취물질에 대하여 지정악취물질 개별기준과 복합악취(희석배수) 기준을 병행하여 배출허용기준을 설정하고 있으며, 이는 배출구와 부지경계선에서 각각 다르게 적용된다. 나아가 지방자치단체는 지역 특성(공업지역·주거지역 인접도 등)을 고려하여 환경부 기준보다 강화된 별도의 기준을 조례로 정할 수 있는데, 이를 엄격한 배출허용기준이라 한다. 이러한 이원적·지역차등적 기준체계는 산업 활동의 필요성과 주민 생활환경 보호를 조화시키기 위한 제도적 장치이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 배출허용기준의 체계\n\n### 1. 기준의 종류\n| 구분 | 근거 | 특징 |\n|---|---|---|\n| 배출허용기준(일반) | 「악취방지법 시행규칙」 | 전국 공통 최소기준 |\n| 엄격한 배출허용기준 | 지자체 조례 | 일반기준보다 강화(완화 불가) |\n\n### 2. 지역구분에 따른 차등\n악취배출시설의 배출허용기준은 통상 공업지역과 기타지역(주거·상업·녹지지역 등)으로 구분하여 차등 적용되며, 주거지역에 가까운 기타지역일수록 더 엄격한 기준이 적용되는 것이 일반적 원칙이다.\n\n### 3. 측정지점별 기준\n| 지점 | 특징 |\n|---|---|\n| 배출구(굴뚝) | 유량 고려, 상대적으로 완화된 희석배수 허용 |\n| 부지경계선 | 주민 직접 노출지점, 엄격한 기준 적용 |\n\n## Ⅲ. 엄격한 배출허용기준 제도\n\n### 1. 제정 취지\n동일한 전국 기준을 적용할 경우 산업단지 밀집지역이나 주거지 인접 사업장 등 지역별 여건 차이를 반영하지 못하는 문제가 있어, 지방자치단체가 지역 실정에 맞게 조례로 환경부 기준보다 강화된 기준을 설정할 수 있도록 하였다.\n\n### 2. 적용 원칙\n- 엄격한 기준은 환경부 일반기준보다 **강화하는 방향으로만** 설정 가능(완화 불가)\n- 지역 여건(민원 발생 이력, 인구밀집도, 산업단지 현황)을 종합적으로 고려해 설정\n- 신설·변경 시설과 기존 시설 간 적용시기 차등(유예기간) 부여 가능\n\n이러한 강화기준 제도는 지방자치의 취지를 반영하여 지역 실정에 맞는 탄력적 규제를 가능하게 하는 동시에, 사업자 입장에서는 사업장 소재지에 따라 요구되는 방지시설의 수준이 달라질 수 있음을 사전에 확인해야 하는 실무적 부담으로 작용하기도 한다.\n\n### 3. 악취관리지역 지정 제도\n| 구분 | 내용 |\n|---|---|\n| 지정 대상 | 악취민원이 지속적으로 발생하는 지역 |\n| 지정 효과 | 강화된 배출허용기준 적용, 악취실태조사 의무화 |\n| 지정 절차 | 시·도지사가 주민의견 수렴 후 지정·고시 |\n| 관리 강화 | 악취방지계획 수립, 정기적 실태조사·개선사업 추진 |\n\n## Ⅳ. 초과 시 행정조치와 관리방안\n\n### 1. 기준 초과 시 조치 절차\n배출허용기준 초과가 확인되면 관할 행정청은 개선명령을 내릴 수 있으며, 개선명령 미이행 시 조업정지 등 후속 행정처분이 가능하다. 상습적·심각한 초과 사업장에는 악취방지계획서 제출 명령이나 악취기술진단(Day 75)을 요구할 수 있다.\n\n| 단계 | 조치 |\n|---|---|\n| 1차 초과 확인 | 개선권고 또는 개선명령 |\n| 명령 미이행 | 조업정지명령 |\n| 반복·심각 초과 | 악취방지계획서 제출, 기술진단 명령 |\n\n### 2. 사업장 대응방안\n- 정기적 자체 측정을 통한 사전 초과 예측 및 방지시설 성능 점검\n- 악취방지시설 설계 시 엄격한 기준 지역 여부를 사전 확인하여 여유율을 두고 설계\n- 악취관리지역 지정 가능성이 있는 신규 입지에 대해서는 인허가 단계에서부터 강화기준 대응 설계 반영\n\n### 3. 신규·기존시설 적용시기 차등\n엄격한 배출허용기준을 새로 제정·강화하는 경우, 기존에 운영 중이던 시설에 대해서는 일정한 유예기간을 부여하여 시설개선에 필요한 준비기간을 보장하는 것이 일반적이며, 신규 설치·변경 시설은 시행일부터 즉시 강화기준을 적용받는 경우가 많다.\n\n### 4. 조례 제정 시 고려요소\n| 고려요소 | 내용 |\n|---|---|\n| 민원 발생 이력 | 최근 수년간 악취 민원 통계 |\n| 지역 산업구조 | 악취배출시설 밀집도, 업종 특성 |\n| 주거지 인접도 | 완충녹지 유무, 이격거리 |\n| 기존 방지시설 수준 | 지역 내 사업장의 평균적 방지시설 현황 |\n\n## Ⅴ. 결론\n\n악취 배출허용기준은 전국 공통기준과 지자체 조례에 의한 엄격한 기준이 이원적으로 운영되며, 배출구·부지경계·지역구분에 따라 세분화되어 적용된다. 사업자는 입지의 지역구분과 엄격한 기준 적용 여부를 사전에 확인하여 여유율 있는 방지시설을 설계해야 하며, 향후에는 악취관리지역 지정 확대와 실시간 모니터링 연계를 통해 예방적 관리체계가 더욱 강화될 것으로 전망된다.\n\n| 요약 | 핵심 |\n|---|---|\n| 배출허용기준 | 전국 공통, 지역·지점별 차등 |\n| 엄격한 기준 | 지자체 조례, 강화방향만 가능 |\n| 악취관리지역 | 강화기준+실태조사 의무화 |\n","side":[{"title":"공업지역 vs 기타지역 기준 차등 인허가 실무","body":"### 인허가 검토 순서\n1. 사업장 소재지의 용도지역(공업/주거/상업/녹지) 확인\n2. 해당 지자체의 엄격한 배출허용기준 조례 제정 여부 확인\n3. 악취관리지역 지정 여부 확인(지정 시 강화기준 추가 적용)\n4. 배출구·부지경계 각각의 적용기준 확정\n5. 방지시설 설계 목표효율을 기준 대비 여유율(통상 20~30%)을 두고 설정\n\n### 지역별 차등 개념표\n| 구분 | 기준 수준 | 비고 |\n|---|---|---|\n| 공업지역 | 상대적으로 완화 | 산업활동 특성 고려 |\n| 기타지역(주거인접) | 엄격 | 주민 생활환경 보호 우선 |\n| 악취관리지역 | 가장 엄격 | 추가 강화기준+실태조사 |\n\n### 실무 팁\n인허가 신청 전 지자체 환경부서에 해당 부지의 엄격한 기준 적용 여부를 사전 질의하는 것이 설계 리스크를 줄이는 실무적 방법이다.\n\n### 방지시설 여유율 설계 개념\n| 기준농도 대비 여유율 | 적용 상황 |\n|---|---|\n| 10~20% | 안정적 배출원, 변동 적음 |\n| 20~30% | 일반적 권장 수준 |\n| 30% 이상 | 배출 변동 크거나 악취관리지역 등 고위험 입지 |\n\n여유율은 공정변동·설비노후화에 따른 처리효율 저하를 감안하여 설정하며, 방지시설 설계용량 산정 시 반드시 검토해야 하는 실무적 안전계수 개념이다.\n\n### 조례 확인 실무 체크리스트\n1. 해당 지자체 홈페이지 환경 관련 조례·규칙 검색\n2. 악취관리지역 지정 현황 지도 확인\n3. 최근 3~5년간 악취 민원처리 통계 확인(강화 가능성 예측)\n4. 인접 사업장의 기존 방지시설 수준 벤치마킹"},{"title":"기출 연계와 서술 요령","body":"### 기출 연계 자가점검\n1. 악취 배출허용기준의 체계(일반기준·엄격한 기준)를 설명하시오. *(114~138회 다수 25점)*\n2. 엄격한 배출허용기준 제도의 취지와 적용 원칙을 설명하시오. *(120회 10점)*\n3. 악취관리지역 지정 제도를 설명하시오. *(126회 10점)*\n4. 배출허용기준 초과 시 행정조치 절차를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n\"전국 공통기준 + 지자체 강화기준(완화 불가)\"이라는 이원 구조를 먼저 제시하고, 이후 지역구분(공업/기타)과 측정지점(배출구/부지경계)의 이중 차등구조를 표로 정리하면 채점자가 논리를 파악하기 쉬운 답안이 된다.\n\n### 관련 제도 확장\nDay 75의 악취기술진단제도는 이번 Day의 초과 시 행정조치(기술진단 명령)와 직접 연결되므로 두 Day를 묶어 복습하는 것이 효율적이다.\n\n### 암기 카드 5선\n1. **배출허용기준** = 전국 공통 최소기준(환경부령)\n2. **엄격한 기준** = 지자체 조례, 강화방향만 허용(완화 불가)\n3. **지역차등** = 공업지역(완화) vs 기타지역(엄격)\n4. **악취관리지역** = 민원다발지역, 강화기준+실태조사 의무\n5. **초과 시 조치** = 개선명령 → 조업정지 → 기술진단 명령\n\n### 답안 확장 포인트\n엄격한 기준 문제에서는 \"완화는 불가능하고 강화만 가능하다\"는 단방향성 원칙을 명확히 언급하는 것이 핵심 채점 포인트이며, 이를 누락하면 감점 요인이 될 수 있다."}]},"75":{"day":75,"date":"2026-10-14","title":"악취방지법 기술진단제도","keywords":[{"k":"기술진단 개념","subs":["악취배출시설·방지시설 종합점검","「악취방지법」근거 제도","전문기관·기술진단자 수행"]},{"k":"진단 대상·주기","subs":["배출허용기준 초과 사업장 등 명령대상","자발적 진단(정기)도 가능","진단주기 지자체·상황별 상이"]},{"k":"진단 항목","subs":["배출원 조사(공정별 발생량)","방지시설 성능·효율 평가","악취 확산·민원 영향 분석"]},{"k":"진단 결과 활용","subs":["악취방지계획 수립 근거","시설개선 우선순위 도출","행정처분·이행점검 자료"]},{"k":"관련 제도 연계","subs":["악취방지시설 성능검증(Day78)","악취관리지역 실태조사","환경개선사업 지원 연계"]}],"answer":"# 악취방지법 기술진단제도\n\n## Ⅰ. 개요\n\n악취기술진단제도는 악취배출시설을 운영하는 사업장의 악취 발생원, 방지시설의 성능, 확산·민원 영향 등을 종합적으로 진단하여 실효성 있는 개선방안을 도출하기 위해 「악취방지법」에 근거하여 운영되는 제도이다. 배출허용기준을 반복적으로 초과하거나 민원이 지속되는 사업장에 대해 행정청이 진단을 명령할 수 있으며, 사업장이 자발적으로 진단을 신청하여 사전예방적으로 시설을 개선하는 경우도 있다. 단순 배출허용기준 준수 여부 확인을 넘어 공정별 발생원 분석과 방지시설 개선방향까지 제시한다는 점에서 사후관리와 예방관리를 연결하는 핵심 제도이다. *(114~138회 다수 10~25점 기출)*\n\n이러한 기술진단은 사업장이 배출허용기준을 형식적으로만 준수하는 데 그치지 않고, 공정 자체의 구조적 문제와 방지시설의 실질적 성능을 근본적으로 점검하도록 유도한다는 점에서 의의가 크다. 특히 단순 벌칙 위주의 사후규제와 달리, 진단을 통해 도출된 개선방안이 실제 시설투자로 이어지도록 유도하는 예방적·기술지원적 성격을 함께 지닌다는 점이 이 제도의 핵심 특징이다.\n\n## Ⅱ. 제도의 근거와 대상\n\n### 1. 법적 근거\n「악취방지법」에 따라 환경부장관 또는 시·도지사는 악취배출시설 설치·운영자에게 악취기술진단을 받도록 명할 수 있으며, 전문기관 또는 등록된 기술진단자가 진단을 수행한다.\n\n### 2. 진단 대상 구분\n| 구분 | 내용 |\n|---|---|\n| 명령에 의한 진단 | 배출허용기준 반복 초과, 민원 지속 사업장 |\n| 자발적 진단 | 사업장이 사전예방·시설개선 목적으로 신청 |\n| 악취관리지역 실태조사 연계 | 지역 단위 종합진단의 일환으로 개별 사업장 진단 수행 |\n\n## Ⅲ. 진단 항목과 절차\n\n### 1. 주요 진단 항목\n| 항목 | 세부 내용 |\n|---|---|\n| 배출원 조사 | 공정별 악취 발생 원단위·발생량 파악 |\n| 방지시설 성능평가 | 설계효율 대비 실제 처리효율 측정·비교 |\n| 확산·민원 영향분석 | 기상조건·부지경계 농도 분포, 민원 발생지점과의 연계성 |\n| 운영관리 실태 | 방지시설 가동률, 유지관리 이력, 운전기록 점검 |\n\n이 네 가지 항목은 서로 독립적이지 않고 상호 연계되어 있어, 예를 들어 방지시설 성능평가에서 처리효율 저하가 확인되면 그 원인을 운영관리 실태(유지보수 소홀)와 배출원 조사(부하 변동)에서 함께 찾아야 근본적인 개선방안이 도출된다.\n\n### 2. 진단 절차(개념)\n공정 현황조사 → 배출원별 시료채취·분석 → 방지시설 효율 평가 → 확산영향 검토 → 개선방안 도출 → 진단보고서 제출\n\n## Ⅳ. 진단 결과의 활용과 관리방안\n\n### 1. 결과 활용\n| 활용 분야 | 내용 |\n|---|---|\n| 악취방지계획 수립 | 진단결과를 근거로 시설개선 우선순위·투자계획 수립 |\n| 행정처분 이행점검 | 개선명령 이행 여부 확인 자료로 활용 |\n| 환경개선사업 연계 | 중소사업장 대상 시설개선 지원사업 신청 근거자료 |\n\n### 2. 실무상 문제점\n- 진단기관·진단자의 역량 편차로 진단 품질이 상이할 수 있음\n- 진단 이후 실제 개선사업 이행까지 상당한 시간과 비용이 소요되어 이행력 확보가 과제\n- 진단 시점의 조업조건(계절·가동률)이 실제와 다를 경우 대표성 문제 발생 가능\n\n### 3. 관리방안\n진단기관 등록요건 강화와 진단자 교육·자격관리를 통해 진단 품질을 표준화하고, 진단결과에 따른 개선사업에 대해서는 융자·보조금 등 재정지원 프로그램을 연계하여 이행력을 높이는 것이 바람직하다.\n\n### 4. 진단 수행 주체와 자격\n악취기술진단은 관련 법령에 따라 등록된 전문기관 또는 일정 자격을 갖춘 기술진단자가 수행하며, 진단자는 악취방지 분야의 전문지식과 현장 실무경험을 갖추어야 한다. 진단기관은 정기적으로 등록요건 충족 여부를 점검받는다.\n\n### 5. 유사 제도와의 비교\n| 제도 | 목적 | 수행주체 |\n|---|---|---|\n| 악취기술진단 | 사업장 종합진단·개선방안 도출 | 등록 전문기관·기술진단자 |\n| 방지시설 성능검증(Day78) | 개별 방지시설 처리효율 검증 | 성능검증기관 |\n| 악취실태조사 | 지역 단위 악취 현황 파악 | 지자체·전문기관 |\n\n세 제도는 상호 배타적이지 않고 유기적으로 연계되어 운영되는데, 예컨대 악취실태조사에서 특정 사업장이 주요 민원원인으로 지목되면 해당 사업장에 기술진단이 명령되고, 진단 결과 방지시설 성능 저하가 확인되면 성능검증을 통해 개선 전후 효율을 정량적으로 비교하는 흐름으로 이어진다.\n\n## Ⅴ. 결론\n\n악취기술진단제도는 배출원 조사부터 방지시설 성능평가, 확산영향분석까지 아우르는 종합진단으로, 사후적 규제 대응을 넘어 예방적·근본적인 악취관리 체계로 기능한다. 진단결과가 실제 시설개선으로 이어지도록 이행점검과 재정지원을 연계하는 것이 제도의 실효성을 높이는 핵심 과제이며, 이는 Day 78에서 학습할 악취방지시설 성능검증제도와 함께 사업장의 지속적 악취관리 역량을 뒷받침하는 두 축이다.\n\n| 요약 | 핵심 |\n|---|---|\n| 진단 대상 | 명령대상(초과·민원) + 자발적 신청 |\n| 진단 항목 | 배출원·방지시설·확산영향·운영관리 |\n| 결과 활용 | 개선계획 수립, 행정처분 이행점검 |\n","side":[{"title":"진단 보고서 구성과 작성 실무","body":"### 표준 진단보고서 구성(개념)\n1. 사업장 개요 및 공정 현황\n2. 배출원별 악취 발생 특성(지정악취물질·복합악취 측정결과)\n3. 방지시설 현황 및 성능평가 결과\n4. 확산모델링 또는 부지경계 측정 기반 영향분석\n5. 개선방안 및 우선순위(단기/중장기)\n6. 예상 개선효과(정량적 저감률 제시)\n\n### 방지시설 성능평가 항목 예시\n| 항목 | 평가내용 |\n|---|---|\n| 처리효율 | 입구·출구 농도 비교(설계효율 대비 실측효율) |\n| 가동상태 | 정상가동 여부, 이상운전 이력 |\n| 유지관리 | 소모품(활성탄 등) 교체주기 준수 여부 |\n\n### 개선 우선순위 판단 기준\n민원 빈도가 높고 개선비용 대비 저감효과가 큰 항목을 우선순위로 선정하는 비용효과분석적 접근이 실무에서 널리 활용된다.\n\n### 진단 결과 정량화 예시(개념)\n| 배출원 | 현재 복합악취(희석배수) | 목표기준 | 필요 저감률 |\n|---|---|---|---|\n| 발효공정 배출구 | 500 | 300 이하 | 약 40% |\n| 폐수처리 부지경계 | 25 | 15 이하 | 약 40% |\n\n필요 저감률 산정은 방지시설 개선 목표효율 설정과 투자 우선순위 결정의 정량적 근거가 된다.\n\n### 진단비용 부담 원칙\n진단명령에 의한 기술진단 비용은 원칙적으로 사업장(원인자)이 부담하며, 이는 오염원인자 부담원칙(PPP, Polluter Pays Principle)에 근거한다. 자발적 진단의 경우에도 대부분 사업장 자체 비용으로 수행하되, 중소사업장에는 일부 지자체·정부의 재정지원 프로그램이 마련되어 있다."},{"title":"기출 연계와 관련 제도 확장","body":"### 기출 연계 자가점검\n1. 악취기술진단제도의 목적과 진단 절차를 설명하시오. *(114~138회 다수 10~25점)*\n2. 악취기술진단 명령의 대상과 법적 근거를 설명하시오. *(120회 10점)*\n3. 진단결과를 활용한 악취방지계획 수립방안을 설명하시오. *(최근 10점)*\n4. 악취기술진단과 악취방지시설 성능검증의 차이를 설명하시오. *(126회 10점)*\n\n### 성능검증과의 차이(예고)\n기술진단이 사업장 전체(발생원+시설+확산영향)를 종합평가하는 개념이라면, Day 78의 방지시설 성능검증은 개별 방지시설의 처리효율 자체를 검증하는 데 초점을 둔다는 점에서 범위와 목적이 다르다.\n\n### 답안 작성 요령\n기술진단제도는 절차형 문제로 자주 출제되므로, 진단 절차(현황조사→시료채취→성능평가→확산분석→개선방안)를 순서도 형태로 답안에 제시하면 가독성이 높은 고득점 답안이 된다.\n\n### 암기 카드 5선\n1. **기술진단** = 배출원+방지시설+확산영향 종합진단\n2. **진단명령 대상** = 기준 반복초과, 민원지속 사업장\n3. **자발적 진단** = 사전예방 목적 신청 가능\n4. **결과 활용** = 방지계획 수립, 행정처분 이행점검 근거\n5. **성능검증과 구분** = 진단(전체 종합) vs 검증(개별 시설 효율)\n\n### 답안 확장 포인트\n진단 절차를 서술할 때 \"왜 확산·민원 영향분석까지 포함하는가\"에 대해, 배출허용기준 준수만으로는 실제 주민 체감 개선을 보장하지 못하기 때문이라는 논리를 덧붙이면 심화된 답안이 된다."}]},"76":{"day":76,"date":"2026-10-15","title":"2단계 가스상·연소·측정 회독 3회차","keywords":[{"k":"VOCs·악취 연소처리","subs":["RTO 750~850℃, RCO 300~450℃","DTO 열회수 없음, 고농도용","DRE 95% 이상, LEL 25% 이하"]},{"k":"생물학적 처리","subs":["바이오필터 EBRT 30~60초","함수율 40~60% 유지","바이오트리클링/스크러버 비교"]},{"k":"신기술(플라즈마·광촉매)","subs":["NTP 비평형 방전, 오존 부산물","TiO₂/UV, ·OH 라디칼","저농도·소형 배출원 적합"]},{"k":"악취 정의·측정","subs":["지정악취물질 계열별 22종","공기희석관능법, 최고·최저 제외 기하평균","OU/㎥, 배출구 vs 부지경계"]},{"k":"악취 관리제도","subs":["배출허용기준·엄격한 기준(강화만 가능)","악취관리지역 지정","기술진단제도(진단→개선계획)"]}],"answer":"# 2단계 회독 3회차 — Day 69~75 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 **VOCs·악취 방지기술(연소·생물·신기술) → 악취의 정의·측정 → 악취 관리제도**로 이어지는 흐름이다. 앞선 2회독(Day 61~67)에서 NOx·SOx·VOCs의 화학적 처리를 다뤘다면, 이번 3회독은 **악취라는 별도 법체계**로 확장되는 구간이므로 「대기환경보전법」과 「악취방지법」의 개념을 혼동하지 않는 것이 핵심이다.\n\n```\nVOCs/악취 방지기술\n   ├─ 연소처리: RTO(고온·고효율)/RCO(저온·저농도)/DTO(단순·고농도)\n   ├─ 생물학적처리: 바이오필터/트리클링필터/스크러버\n   └─ 신기술: 저온플라즈마(NTP)/광촉매(TiO₂-UV)\n        ↓\n악취(「악취방지법」 별도 체계)\n   ├─ 정의: 지정악취물질(개별) + 복합악취(공기희석관능법)\n   ├─ 측정: 패널 5인, 최고·최저 제외 기하평균\n   └─ 관리: 배출허용기준(전국) + 엄격한 기준(지자체, 강화만) + 악취관리지역 + 기술진단\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| RTO 반응온도 | **750~850℃** | ☐ |\n| RCO 반응온도 | **300~450℃** | ☐ |\n| RTO 열회수율 | **85~95%** | ☐ |\n| 연소실 체류시간 | **0.5~1초** | ☐ |\n| 안전설계 기준 | 유입농도 **LEL의 25% 이하** | ☐ |\n| DRE(파괴제거효율) 요구수준 | **95% 이상** | ☐ |\n| 바이오필터 EBRT | **30~60초** | ☐ |\n| 담체 함수율 | **40~60%** | ☐ |\n| 미생물 순화(기동)기간 | **2~6주** | ☐ |\n| 매체 수명(바이오필터 담체) | **2~5년** | ☐ |\n| 지정악취물질 개수(참고) | 약 **22종**(고시 개정 가능) | ☐ |\n| 공기희석관능법 패널 인원 | **5인 이상** | ☐ |\n| 희석배수 통계처리 | 최고·최저 제외 후 **기하평균** | ☐ |\n| 국제 악취단위 표기 | **OU/㎥**(EN 13725) | ☐ |\n| 엄격한 배출허용기준 방향 | **강화만 가능**(완화 불가) | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **파괴제거효율**: DRE = (유입질량 − 유출질량)/유입질량 × 100\n2. **열회수율**: η = (연소온도 − 배출온도)/(연소온도 − 유입온도) × 100\n3. **생분해 반응**: 유기물 + O₂ + 미생물 → CO₂ + H₂O + 바이오매스\n4. **EBRT**: EBRT = 담체체적(V) / 처리풍량(Q)\n5. **광촉매 반응**: TiO₂ + hν → e⁻ + h⁺, h⁺ + H₂O → ·OH + H⁺\n6. **희석배수 대표값**: 기하평균 = (x₁×x₂×x₃)^(1/3) (최고·최저 제외 후 n개)\n7. **물질수지법(VOCs)**: 배출량 = 투입 − 제품잔류 − 위탁폐기\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| RTO vs RCO | 750~850℃, 무촉매 | 300~450℃, 촉매 | 온도·촉매 유무 |\n| RTO vs DTO | 열회수 85~95% | 열회수 없음 | 열회수 유무 |\n| 바이오필터 vs 트리클링필터 | 담체 고정, 간헐살수 | 담체+지속 순환살수 | 살수 방식 |\n| 저온플라즈마 vs 광촉매 | 고전압 방전, 오존 부산물 | UV+TiO₂, ·OH 라디칼 | 에너지원 |\n| 지정악취물질 vs 복합악취 | 기기측정, 개별기준 | 사람 후각, 희석배수 기준 | 측정방법 |\n| 배출허용기준 vs 엄격한 기준 | 전국 공통(환경부령) | 지자체 조례, 강화만 | 제정주체 |\n| 배출구 vs 부지경계 | 완화된 희석배수 | 엄격한 희석배수 | 확산·희석 반영 |\n| 기술진단 vs 성능검증 | 사업장 종합진단 | 개별 시설 효율검증 | 범위 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. RTO와 RCO의 원리·설계인자를 비교 설명하시오. *(다수 회차 25점)*\n2. 바이오필터의 처리원리와 설계인자를 설명하시오. *(다수 회차 10~25점)*\n3. 저온플라즈마·광촉매 등 VOCs 처리 신기술을 설명하시오. *(120회 10점)*\n4. 악취의 정의와 지정악취물질을 설명하시오. *(114~138회 다수 25점)*\n5. 공기희석관능법의 측정원리와 통계처리 방법을 설명하시오. *(126회 25점)*\n6. 악취 배출허용기준(엄격한 기준 포함) 체계를 설명하시오. *(114~138회 다수 25점)*\n7. 악취기술진단제도의 목적과 절차를 설명하시오. *(120회 10점)*\n8. 악취관리지역 지정 제도를 설명하시오. *(최근 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 \"왜 악취는 별도 법체계인가\"를 한 문장으로 설명해본다.\n2. **비교표 재구성(30분)**: Ⅳ의 8개 비교쌍을 스스로 표로 다시 그려본다.\n3. **수치 암기(20분)**: Ⅱ 체크리스트. 특히 RTO·RCO 온도창과 배출구/부지경계 기준방향은 절대 혼동 금지.\n4. **기출 구술(30분)**: Ⅴ의 8문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: 공기희석관능법 통계처리(Day73)와 엄격한 기준(Day74)은 재확인 권장.\n\n> 악취 파트는 「대기환경보전법」과 완전히 다른 법체계임을 답안 서두에서 명시하는 것이 채점자에게 정확한 이해를 보여주는 핵심 포인트다.\n\n## Ⅶ. 이번 구간 총정리 메모\n\nDay 69~75는 \"방지기술(연소·생물·신기술)\"과 \"악취 법체계(정의·측정·관리)\"라는 두 축으로 구성되어 있다. 시험에서는 두 축을 섞어 묻는 복합문제(예: \"축산시설 악취 저감을 위한 방지기술과 관련 배출허용기준을 설명하시오\")가 자주 출제되므로, 기술적 원리와 법적 기준을 하나의 답안 안에서 유기적으로 연결하는 연습이 이번 회독의 핵심 과제다.\n","side":[{"title":"VOCs·악취 방지기술 선정 흐름도","body":"### 판단 순서\n```\nQ1. 대상이 악취인가 VOCs(오존전구물질)인가?\n   악취 위주 → 생물학적 처리(바이오필터 등) 우선 검토\n   VOCs 위주 → 연소처리(RTO/RCO) 또는 흡착 우선 검토\n\nQ2. 농도 수준은?\n   고농도 → DTO 또는 흡착회수\n   저~중농도 → RTO(대풍량)/RCO(안정적 저농도)/바이오필터\n\nQ3. 부지 여유가 있는가?\n   YES → 바이오필터(부지 소요 크나 저비용)\n   NO  → 트리클링필터/스크러버 또는 연소처리\n\nQ4. 초기투자 여력이 제한적인가?\n   YES → 광촉매·플라즈마(소형 모듈)로 보조처리 검토\n   NO  → RTO 등 대형 표준공정 적용\n```\n\n### 복합 적용 사례\n대형 산업단지 통합 방지시설에서는 흡착농축(전처리) → RTO(주처리) → 활성탄(후처리, 잔류물질 폴리싱)의 다단 결합이 일반적이며, 소규모 악취배출시설에서는 습식세정(1차) → 바이오필터(2차)의 결합이 널리 쓰인다.\n\n### 시설 규모별 선정 감각\n| 규모 | 우선 검토 기술 |\n|---|---|\n| 대형(공단·발전소급) | RTO/RCO 표준화 대형설비 |\n| 중형(환경기초시설) | 세정+바이오필터 결합 |\n| 소형(개별 사업장) | 흡착 또는 소형 플라즈마·광촉매 모듈 |\n\n시설 규모가 커질수록 초기투자비 회수기간이 짧아지는 경향이 있어, 소규모 사업장에는 초기투자비가 낮은 기술을, 대규모 시설에는 장기 운영비 절감이 큰 표준화 기술을 우선 검토하는 것이 일반적인 경제성 판단 원칙이다."},{"title":"암기 카드 — Day 69~75 핵심 20선","body":"1. **RTO** = 750~850℃, 열회수 85~95%, 대풍량 저·중농도\n2. **RCO** = 300~450℃, 촉매(Pt/Pd), 저농도 안정적 조성\n3. **DTO** = 열회수 없음, 고농도·간헐 배출용\n4. **DRE** = 파괴제거효율, 인허가 요구수준 95%↑\n5. **LEL 25%** = 연소처리 안전설계 희석기준\n6. **바이오필터** = EBRT 30~60초, 함수율 40~60%\n7. **트리클링필터** = 순환살수, 영양·pH 조절 용이\n8. **바이오스크러버** = 액상 미생물, 고농도·수용성 유리\n9. **미생물 순화** = 기동기간 2~6주, 종균 접종으로 단축\n10. **저온플라즈마(NTP)** = 비평형 방전, 오존 부산물 관리 필요\n11. **광촉매(TiO₂/UV)** = ·OH 라디칼 생성, 저농도·소형 적합\n12. **지정악취물질** = 계열별(황·질소·알데히드·지방산·방향족) 약 22종\n13. **복합악취** = 공기희석관능법, 패널 5인 이상\n14. **통계처리** = 최고·최저 제외 후 기하평균\n15. **OU/㎥** = 국제표준(EN 13725) 악취단위\n16. **배출구 vs 부지경계** = 완화 vs 엄격 기준\n17. **엄격한 배출허용기준** = 지자체 조례, 강화만 가능\n18. **악취관리지역** = 민원다발지역, 강화기준+실태조사\n19. **악취기술진단** = 배출원+시설+확산영향 종합진단\n20. **성능검증(Day78 예고)** = 개별 방지시설 처리효율 검증\n\n### 회독 진도 메모\n1회독(Day 53~60), 2회독(Day 61~68)까지 화학적 방지기술을 다뤘고, 이번 3회독(Day 69~75)에서 생물학적·신기술과 악취 법체계를 완료했다. 다음 4회독(Day 84)에서는 연료·연소 파트(Day 77~83)를 다룬다."}]},"77":{"day":77,"date":"2026-10-16","title":"하수·축산·매립지 악취 저감대책","keywords":[{"k":"하수처리장 악취","subs":["침사지·농축조·탈수동 주요 발생원","H2S·메르캅탄류 중심","밀폐화+포집+화학/생물처리"]},{"k":"축산시설 악취","subs":["돈사·계사·퇴비화시설","암모니아·지방산류 중심","사료·분뇨관리+환기+저감시설"]},{"k":"매립지 악취","subs":["매립가스(LFG) 중 H2S·VOCs","복토관리·가스포집·소각/발전 연계","침출수처리시설 병행관리"]},{"k":"공통 저감원칙","subs":["발생원 밀폐화가 최우선","포집 후 집중처리(스크러버+바이오필터)","운영관리(정기청소·복토)"]},{"k":"정책·제도 연계","subs":["악취관리지역 지정 사례 다수","환경기초시설 현대화사업","주민참여형 모니터링"]}],"answer":"# 하수·축산·매립지 악취 저감대책\n\n## Ⅰ. 개요\n\n하수처리장, 축산시설, 매립지는 대표적인 악취 다발 환경기초시설로, 민원 발생 빈도가 매우 높아 악취관리지역으로 지정되는 사례도 다수 존재한다. 세 시설 모두 유기물의 부패·분해 과정에서 황화합물·질소화합물이 발생한다는 공통점이 있으나, 발생 공정과 배출 형태(점오염원·면오염원)가 상이하여 시설별 맞춤형 저감대책이 필요하다. 공통적으로는 발생원 밀폐화를 통한 확산 차단이 최우선 원칙이며, 포집된 악취가스를 집중적으로 처리하는 것이 효과적이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 시설별 발생 특성\n\n### 1. 하수처리장\n| 발생 공정 | 주요 악취물질 |\n|---|---|\n| 침사지·유입펌프장 | 황화수소, 메르캅탄류 |\n| 농축조·소화조 | 황화수소, 암모니아 |\n| 탈수동(슬러지 탈수) | 암모니아, 트리메틸아민, 지방산류 |\n\n### 2. 축산시설\n| 발생원 | 주요 악취물질 |\n|---|---|\n| 돈사·계사(사육시설) | 암모니아, 황화수소, 휘발성지방산 |\n| 분뇨저장조 | 암모니아, 황화합물 |\n| 퇴비화시설 | 암모니아, 지방산류(발효과정) |\n\n### 3. 매립지\n| 발생원 | 주요 악취물질 |\n|---|---|\n| 매립가스(LFG) | 메탄과 함께 황화수소, VOCs 미량 |\n| 노출 폐기물면 | 복합 부패취 |\n| 침출수처리시설 | 암모니아성 질소 유래 냄새 |\n\n## Ⅲ. 시설별 저감대책\n\n### 1. 하수처리장 저감대책\n| 대책 | 내용 |\n|---|---|\n| 밀폐화 | 침사지·농축조 상부 덮개(Cover) 설치 |\n| 포집·집중처리 | 밀폐공간 배기 → 약액세정(습식)+바이오필터 직렬처리 |\n| 운영관리 | 슬러지 체류시간 단축, 정기 청소로 부패 최소화 |\n\n### 2. 축산시설 저감대책\n| 대책 | 내용 |\n|---|---|\n| 사료·급이 관리 | 저단백 사료 급여로 질소 배출 저감(암모니아 발생원 저감) |\n| 환기·공조 개선 | 강제환기+포집 후 스크러버(산세정)·바이오필터 처리 |\n| 분뇨관리 | 정기적 분뇨 반출, 발효제 살포로 악취 저감 |\n| 퇴비화 공정관리 | 함수율·통기 최적화로 혐기성 부패 억제 |\n\n### 3. 매립지 저감대책\n| 대책 | 내용 |\n|---|---|\n| 복토관리 | 일일복토·중간복토 철저(가스 누출 차단) |\n| 가스포집·자원화 | LFG 포집관 설치 → 소각(플레어) 또는 발전·연료 활용 |\n| 침출수처리 | 밀폐형 처리시설+탈취설비 병행 |\n\n## Ⅳ. 공통 관리방안과 정책 연계\n\n### 1. 공통 저감 우선순위\n발생원 저감(원인관리) → 밀폐화(확산차단) → 포집·집중처리(방지시설) → 확산 저감(이격거리·완충녹지)의 단계적 접근이 세 시설 모두에 공통적으로 적용된다.\n\n### 2. 정책·제도 연계\n| 제도 | 연계 내용 |\n|---|---|\n| 악취관리지역 지정 | 환경기초시설 밀집지역 다수 지정 사례 |\n| 환경기초시설 현대화사업 | 노후 하수처리장 밀폐화·탈취시설 개량 지원 |\n| 가축분뇨 자원화 | 퇴비화·바이오가스화 연계로 악취저감+자원순환 동시 추진 |\n| 주민참여형 모니터링 | 실시간 악취센서·민원앱 연계 |\n\n### 3. 통합 관리의 필요성\n개별 시설 단위 대책만으로는 지역 전체의 악취 민원을 해소하기 어려운 경우가 많아, 지자체 차원의 악취관리계획을 통해 여러 시설의 저감대책을 통합적으로 추진하는 것이 효과적이다.\n\n### 4. 시설별 대표 이격거리 관리 개념\n악취 확산에 따른 민원을 근본적으로 줄이기 위해서는 방지시설 설치와 함께 주거지역과의 이격거리 확보, 완충녹지 조성 등 확산저감형 대책도 병행되어야 하며, 신규 시설 입지 선정 단계에서부터 이러한 요소를 고려하는 것이 사후 민원 발생을 예방하는 가장 효과적인 방법이다.\n\n### 5. 시설 운영단계별 관리 포인트\n| 단계 | 관리 포인트 |\n|---|---|\n| 설계단계 | 밀폐화·방지시설 용량을 최대부하 기준으로 설계 |\n| 시공단계 | 밀폐공간 기밀성 시공품질 관리 |\n| 운영단계 | 정기 청소·복토·환기설비 점검 |\n| 모니터링단계 | 실시간 센서+정기 관능측정 병행 |\n\n## Ⅴ. 결론\n\n하수·축산·매립지는 유기물 부패라는 공통 메커니즘을 가지면서도 발생 공정과 배출 형태가 상이하므로, 시설별 맞춤형 저감대책과 함께 밀폐화·포집·집중처리라는 공통 원칙을 함께 적용해야 한다. 향후에는 개별 시설 단위 대책을 넘어 지자체 차원의 통합 악취관리계획과 환경기초시설 현대화사업을 통해 근본적인 악취 저감을 도모하는 것이 정책 방향이다.\n\n| 요약 | 대표 저감기술 |\n|---|---|\n| 하수처리장 | 밀폐+습식세정+바이오필터 |\n| 축산시설 | 사료관리+환기포집+스크러버 |\n| 매립지 | 복토관리+가스포집·자원화 |\n","side":[{"title":"환경기초시설 탈취공정 설계 사례","body":"### 하수처리장 표준 탈취공정(다단 결합)\n```\n악취 발생원(농축조·탈수동)\n   ↓ 밀폐 포집\n1단계: 약액세정(산·알칼리 세정, H2S·암모니아 제거)\n   ↓\n2단계: 바이오필터(잔류 저농도 물질 최종 처리)\n   ↓\n정화된 배출가스\n```\n\n### 단계별 목표 제거효율(개념)\n| 단계 | 목표 제거효율 |\n|---|---|\n| 약액세정(1단계) | 70~90% |\n| 바이오필터(2단계) | 잔류물질 추가 80% 이상 |\n| 종합 | 95% 이상 목표 |\n\n### 설계 시 유의사항\n계절별 온도변화가 큰 지역에서는 바이오필터 담체 보온설계를 반드시 반영해야 하며, 세정탑 폐수는 별도 처리계통으로 연계해야 한다.\n\n### 축산시설 저감시설 사례(스크러버+바이오필터)\n```\n돈사 환기 배출가스\n   ↓\n1단계: 산세정(황산 세정, 암모니아 흡수) — 효율 70~85%\n   ↓\n2단계: 바이오필터(잔류 지방산류·황화합물 처리)\n   ↓\n정화된 배출가스\n```\n산세정은 암모니아와 같은 염기성 물질 제거에 특화되어 있어, 축산시설처럼 암모니아 비중이 높은 배출원에서 1단계 처리로 우선 채택되는 경우가 많다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 하수처리장의 주요 악취 발생공정과 저감대책을 설명하시오. *(114~138회 다수 25점)*\n2. 축산시설 악취의 발생원인과 저감방안을 설명하시오. *(120회 25점)*\n3. 매립지 악취 발생원과 매립가스 포집·자원화 방안을 설명하시오. *(126회 10~25점)*\n4. 환경기초시설 악취 저감의 공통 원칙(밀폐화·포집·집중처리)을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n세 시설을 비교하는 문제가 출제되면, 발생 메커니즘(공통: 유기물 부패)을 먼저 짚고 이후 시설별 세부 발생원·저감기술을 표로 정리하면 채점자가 논리를 파악하기 쉽다. 단일 시설 문제에서는 발생원 → 저감대책의 인과관계를 명확히 서술해야 한다.\n\n### 실무 연계 메모\n악취관리지역으로 지정된 지자체에서는 이들 환경기초시설에 대한 강화된 배출허용기준(Day74)이 적용되는 경우가 많아, 설계 단계에서부터 지역별 기준을 사전 확인하는 것이 중요하다.\n\n### 암기 카드 5선\n1. **하수처리장** = 침사지·농축조·탈수동, H2S·메르캅탄류 중심\n2. **축산시설** = 돈사·계사·퇴비화, 암모니아·지방산류 중심\n3. **매립지** = LFG(메탄+H2S+VOCs), 복토관리 핵심\n4. **공통원칙** = 발생원저감→밀폐화→포집·집중처리\n5. **정책연계** = 환경기초시설 현대화사업, 악취관리지역 지정 다수\n\n### 답안 확장 포인트\n세 시설의 저감대책을 단순 나열하기보다, \"왜 밀폐화가 최우선 원칙인가\"(포집되지 않은 악취는 어떤 고성능 방지시설로도 처리할 수 없기 때문)를 서두에 명시하면 답안의 논리적 완성도가 높아진다."}]},"78":{"day":78,"date":"2026-10-17","title":"악취방지시설 성능검증과 실내부압","keywords":[{"k":"성능검증 개념","subs":["방지시설 처리효율 정량 검증","입구·출구 복합악취 비교측정","인증·보조금 신청 근거자료"]},{"k":"검증 절차","subs":["검증기관 신청·현장측정","입출구 동시 시료채취","제거효율 산정·보고서 발급"]},{"k":"실내부압 관리","subs":["악취발생공간 음압(부압) 유지","외부 누출 차단 원리","차압계·인터록 연동"]},{"k":"밀폐공간 설계","subs":["출입문 에어커튼·이중문","환기량과 부압 균형 설계","가동중단 시 대응절차"]},{"k":"운영 모니터링","subs":["차압 실시간 감시","경보설정·이력관리","정기점검주기"]}],"answer":"# 악취방지시설 성능검증과 실내부압\n\n## Ⅰ. 개요\n\n악취방지시설의 실효성을 담보하기 위해서는 설계효율이 아닌 실제 운전 중 처리효율을 정량적으로 확인하는 성능검증 절차가 필요하며, 이는 인허가 이행점검과 보조금 지원사업의 근거자료로도 활용된다. 아울러 악취 발생공간 자체를 밀폐하여 외부로 냄새가 누출되지 않도록 하는 실내부압(음압) 관리는 방지시설 이전 단계의 1차적 확산 차단 수단으로, 두 개념은 상호보완적으로 악취방지시설의 종합적 성능을 결정한다. *(114~138회 다수 10점, 일부 25점 기출)*\n\n## Ⅱ. 악취방지시설 성능검증\n\n### 1. 검증의 목적과 근거\n성능검증은 방지시설이 설계된 목표 제거효율을 실제로 달성하고 있는지 제3자 검증기관을 통해 객관적으로 확인하는 절차로, 「악취방지법」및 관련 지침에 근거하여 운영된다.\n\n### 2. 검증 절차\n| 단계 | 내용 |\n|---|---|\n| 신청 | 사업장이 검증기관에 성능검증 신청 |\n| 현장조사 | 시설 가동상태·설계자료 확인 |\n| 동시 시료채취 | 입구·출구에서 동일 시점 복합악취(또는 지정악취물질) 채취 |\n| 제거효율 산정 | (입구농도−출구농도)/입구농도 × 100 |\n| 결과보고 | 검증서 발급, 인허가·보조금 근거자료로 활용 |\n\n### 3. 검증 시 유의사항\n정상 가동조건(정격 부하)에서 측정해야 대표성이 확보되며, 저부하 상태에서 측정할 경우 실제 최대부하 시 효율을 과대평가할 위험이 있다.\n\n## Ⅲ. 실내부압(음압) 관리\n\n### 1. 부압 관리의 원리\n악취 발생공간(탈수동, 축사, 처리조 등)의 실내압력을 외부보다 낮게(음압) 유지하면, 문틈이나 개구부를 통해 공기가 항상 실내로 유입되는 방향으로 흐르므로 냄새가 밖으로 새어나가지 못하고 전량 포집·처리계통으로 유도된다.\n\n### 2. 설계 요소\n| 요소 | 설계 고려사항 |\n|---|---|\n| 배기량 | 급기량보다 크게 설정해 부압 형성(통상 급기의 1.1~1.2배) |\n| 출입구 | 이중문·에어커튼 설치로 개폐 시 순간 압력손실 최소화 |\n| 밀폐도 | 벽체·바닥 틈새 최소화, 개구부 최소화 설계 |\n| 차압계 | 실내외 압력차 실시간 모니터링(통상 -1~-5Pa 수준 유지) |\n\n### 3. 부압 관리 실패 시 문제점\n부압이 확보되지 않으면 방지시설이 아무리 고효율이어도 개구부를 통한 직접 누출로 민원이 발생할 수 있어, 부압 관리는 방지시설 처리효율만큼이나 중요한 1차 방어선이다.\n\n## Ⅳ. 통합 관리방안과 모니터링\n\n### 1. 통합 관리 개념\n| 단계 | 관리수단 |\n|---|---|\n| 1차 방어(확산차단) | 밀폐화 + 실내부압 유지 |\n| 2차 방어(처리) | 포집가스 방지시설 처리(세정·바이오필터 등) |\n| 3차 확인(검증) | 정기 성능검증으로 처리효율 확인 |\n\n### 2. 실시간 모니터링 체계\n차압계·풍량계를 통한 실내부압 상시 감시와 함께, 기준 이하로 부압이 떨어지면 경보가 발생하는 인터록 시스템을 구축하여 관리자가 즉시 대응할 수 있도록 하는 것이 바람직하다.\n\n### 3. 정기점검 주기\n| 항목 | 점검주기 |\n|---|---|\n| 차압계 교정 | 연 1~2회 |\n| 출입문 밀폐상태 | 월 1회 |\n| 방지시설 성능검증 | 정기(연 1회 또는 인허가 조건에 따름) |\n\n이러한 정기점검 체계는 성능검증과 부압관리를 일회성 확인이 아닌 지속적인 관리 프로세스로 정착시키는 데 목적이 있으며, 점검 이력을 데이터베이스화하여 추세 분석(효율 저하 조기 감지)에 활용하는 것이 최근의 관리 고도화 방향이다.\n\n### 4. 성능검증과 실내부압의 상호 보완 관계\n아무리 우수한 처리효율의 방지시설을 설치하더라도 실내부압이 확보되지 않아 개구부로 냄새가 직접 누출된다면 전체 시스템의 악취저감 효과는 크게 저하된다. 반대로 부압관리가 완벽하더라도 방지시설 처리효율이 낮으면 배출구를 통한 고농도 배출로 민원이 발생할 수 있으므로, 두 요소는 어느 하나만으로는 완전한 관리가 불가능한 상호보완적 관계에 있다.\n\n### 5. 인허가 서류상 요구사항\n악취방지시설 설치신고 시에는 방지시설의 설계 처리효율과 함께 밀폐공간의 환기설계(급배기량, 예상 부압 수준)를 도면과 계산서로 제출해야 하는 경우가 많으며, 준공 후에는 성능검증 결과를 통해 설계값과 실측값의 일치 여부를 확인받아야 한다. 이 절차는 시공 품질과 설계 적정성을 동시에 검증하는 이중 확인장치로 기능한다.\n\n## Ⅴ. 결론\n\n악취방지시설의 실효성은 방지시설 자체의 처리효율뿐 아니라 발생공간의 실내부압 관리에 의해 좌우되며, 두 요소가 결합되어야 비로소 완전한 악취 확산 차단 체계가 완성된다. 정기적인 성능검증을 통해 처리효율을 객관적으로 입증하고, 실시간 차압 모니터링으로 부압 유지 여부를 상시 확인하는 통합 관리체계 구축이 지속가능한 악취관리의 핵심이다.\n\n| 요약 | 핵심 관리수단 |\n|---|---|\n| 방지시설 성능검증 | 입출구 동시측정, 정기 검증 |\n| 실내부압 관리 | 배기>급기, 이중문, 차압 모니터링 |\n","side":[{"title":"부압 설계 계산 예제","body":"### 급배기량 설정 예제\n악취발생공간 체적 500㎥, 필요 환기횟수 10회/h인 경우 필요 배기량은:\n\n배기량 = 체적 × 환기횟수 = 500 × 10 = **5,000㎥/h**\n\n부압 형성을 위해 급기량을 배기량의 90%로 설정하면:\n\n급기량 = 5,000 × 0.9 = **4,500㎥/h**\n\n이 차이(500㎥/h)만큼 외부 공기가 개구부를 통해 유입되며 실내가 음압 상태로 유지된다.\n\n### 성능검증 제거효율 계산 예제\n입구 복합악취 희석배수 800, 출구 희석배수 40인 경우 제거효율은:\n\n제거효율 = (800−40)/800 × 100 = **95%**\n\n다만 복합악취는 로그적 특성이 있어 단순 희석배수 차감 방식 외에 냄새강도 환산식을 활용하는 경우도 있으므로, 관련 공정시험기준의 세부 산정방법을 확인해야 한다.\n\n### 차압계 설치 위치와 관리기준\n| 위치 | 관리기준(예시 감각) |\n|---|---|\n| 주 출입문 | 상시 -1~-3Pa 유지 |\n| 작업동 내부 | 구역별 -2~-5Pa 유지 |\n| 방지시설 연결부 | 배기팬 정상가동 확인용 압력스위치 |\n\n수치는 시설 규모·용도에 따라 다르므로 절대값보다 \"배기가 급기보다 항상 커서 음압이 유지되어야 한다\"는 원리를 우선 설명하는 것이 안전하다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 악취방지시설 성능검증의 절차와 목적을 설명하시오. *(다수 회차 10점)*\n2. 실내부압(음압) 관리의 원리와 설계요소를 설명하시오. *(120회 10점)*\n3. 악취발생공간의 밀폐화 설계 시 고려사항을 설명하시오. *(126회 10점)*\n4. 방지시설 처리효율과 실내부압 관리의 관계를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n실내부압 문제는 \"왜 배기량을 급기량보다 크게 설정하는가\"에 대한 원리(음압 형성→외부 누출 차단)를 먼저 설명한 후 구체적 설계요소(이중문·차압계)를 나열하는 순서로 서술하면 논리적이다.\n\n### 실무 연계 메모\nDay 75의 악취기술진단 결과 방지시설 효율저하가 확인되면, 이번 Day의 성능검증을 통해 개선 전후 효율을 정량적으로 비교·검증하는 후속 절차로 이어진다.\n\n### 암기 카드 5선\n1. **성능검증** = 입출구 동시측정, 정격부하 조건 필수\n2. **부압** = 배기 > 급기, 통상 1.1~1.2배\n3. **차압관리** = -1~-5Pa 수준, 실시간 모니터링\n4. **이중문·에어커튼** = 개폐 시 압력손실 최소화\n5. **1차·2차·3차 방어** = 밀폐+부압 → 방지시설 처리 → 성능검증\n\n### 답안 확장 포인트\n\"방지시설 효율이 높아도 부압이 확보되지 않으면 소용없다\"는 상호보완 관계를 결론부에서 명시적으로 언급하면, 단편적 지식 나열을 넘어선 통합적 이해를 보여주는 답안이 된다."}]},"79":{"day":79,"date":"2026-10-18","title":"연료의 종류와 연소특성","keywords":[{"k":"연료 3분류","subs":["고체연료(석탄·바이오매스)","액체연료(중유·경유·등유)","기체연료(LNG·LPG·바이오가스)"]},{"k":"연료 성분·발열량","subs":["원소분석(C·H·O·N·S·회분·수분)","고위발열량(HHV) vs 저위발열량(LHV)","황분·회분과 오염물질 관계"]},{"k":"연소 특성인자","subs":["착화온도·연소속도","공기비 소요량","매연·NOx 발생 경향"]},{"k":"연료별 대기오염 특성","subs":["고체: 먼지·SOx 多","액체: SOx·V(바나듐)","기체: 청정, NOx 위주"]},{"k":"연료전환 정책","subs":["석탄→LNG 전환 정책","청정연료 사용 의무화","대기관리권역 연료제한"]}],"answer":"# 연료의 종류와 연소특성\n\n## Ⅰ. 개요\n\n연료는 물리적 상태에 따라 고체·액체·기체연료로 구분되며, 각각의 화학적 조성(탄소·수소·황·질소·회분 함유량)에 따라 발열량과 대기오염물질 배출 특성이 크게 달라진다. 대기관리기술사 실무에서는 연료의 종류를 파악하는 것이 곧 예상 배출오염물질(먼지·SOx·NOx)의 종류와 수준을 예측하는 출발점이 되며, 최근에는 청정연료(LNG 등)로의 전환 정책이 대기질 개선의 핵심 수단으로 활용되고 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 연료의 분류와 성분\n\n### 1. 물리적 상태에 따른 분류\n| 구분 | 대표 연료 | 특징 |\n|---|---|---|\n| 고체연료 | 유연탄, 무연탄, 바이오매스 | 회분·황분 함유, 저장·운반 용이 |\n| 액체연료 | 중유(벙커C유), 경유, 등유 | 황분·바나듐 함유, 취급 비교적 용이 |\n| 기체연료 | LNG, LPG, 바이오가스 | 회분·황분 거의 없음, 청정연소 |\n\n### 2. 연료의 원소분석과 발열량\n연료의 조성은 원소분석(C, H, O, N, S)과 공업분석(수분, 회분, 휘발분, 고정탄소)으로 파악하며, 발열량은 연소 시 발생하는 수증기의 응축열 포함 여부에 따라 고위발열량(HHV, 총발열량)과 저위발열량(LHV, 진발열량)으로 구분한다.\n\n| 구분 | 정의 | 관계 |\n|---|---|---|\n| 고위발열량(HHV) | 수증기 응축열 포함(연소 후 물이 액체) | HHV > LHV |\n| 저위발열량(LHV) | 수증기 응축열 미포함(연소 후 물이 기체) | 실제 보일러 효율계산 기준으로 주로 사용 |\n\n## Ⅲ. 연료별 연소·오염 특성 비교\n\n| 구분 | 고체연료(석탄) | 액체연료(중유) | 기체연료(LNG) |\n|---|---|---|---|\n| 회분 | 있음(5~20%) | 미량 | 없음 |\n| 황분 | 있음(0.5~3%) | 있음(1~4%, 고황중유) | 거의 없음 |\n| 발열량 | 중간(4,500~6,500 kcal/kg) | 높음(9,500~10,000 kcal/kg) | 매우 높음(단위질량당) |\n| 주요 배출오염물질 | 먼지, SOx, NOx | SOx, 바나듐(V), NOx | NOx 위주(청정) |\n| 연소장치 | 미분탄보일러, 스토커 | 유류버너 | 가스버너, 가스터빈 |\n| 저장·취급 | 야적·옥내저탄장 필요 | 탱크저장, 예열 필요(점도) | 배관공급, 저장 부담 적음 |\n\n## Ⅳ. 연소 특성인자와 정책적 관리\n\n### 1. 주요 연소 특성인자\n| 인자 | 의미 |\n|---|---|\n| 착화온도 | 연료가 스스로 발화하는 최저온도, 낮을수록 착화 용이 |\n| 연소속도 | 화염 전파속도, 기체연료가 가장 빠름 |\n| 이론공기량 | 완전연소에 필요한 최소 공기량(Day80 상세) |\n| 매연 발생 경향 | 고체·액체연료가 기체연료보다 매연(그을음) 발생 경향 큼 |\n\n### 2. 연료전환 정책\n「대기관리권역의 대기환경개선에 관한 특별법」등에 따라 대기관리권역 내 일정 규모 이상 사업장은 청정연료(LNG 등) 사용이 권장·의무화되고 있으며, 노후 석탄화력의 LNG 전환이나 폐지가 국가 온실가스·대기오염물질 저감 정책의 핵심 축으로 추진되고 있다.\n\n이러한 연료전환 정책은 배출허용기준 강화만으로는 달성하기 어려운 근본적인 배출량 저감을 가능하게 한다는 점에서, 방지시설 고도화와 함께 대기질 개선의 양대 축으로 평가된다.\n\n### 3. 연료 선정 시 고려사항\n| 고려요소 | 내용 |\n|---|---|\n| 경제성 | 연료단가, 공급 안정성 |\n| 환경성 | 배출오염물질 종류·양, 방지시설 투자비 |\n| 설비 호환성 | 기존 연소설비의 연료전환 가능 여부 |\n| 정책 규제 | 대기관리권역 연료사용 제한 여부 |\n\n### 4. 연료 저장·취급상 환경관리 포인트\n| 연료 | 관리 포인트 |\n|---|---|\n| 고체연료 | 옥내저탄장 비산먼지 관리, 자연발화 방지(Day83 연계) |\n| 액체연료 | 저장탱크 유증기 회수(Stage Ⅰ, Day67 연계), 예열배관 보온 |\n| 기체연료 | 배관 누출감지(가스누출경보기), 압력관리 |\n\n### 5. 혼소·대체연료 활용 동향\n최근에는 석탄화력에서 바이오매스를 혼소하거나, 폐기물 유래 고형연료(SRF, Day87 연계)를 활용하는 사례가 늘고 있으며, 이는 화석연료 사용량 저감과 온실가스 감축을 동시에 도모하는 정책적 수단으로 활용되고 있다.\n\n## Ⅴ. 결론\n\n연료의 종류는 대기오염물질 배출 특성을 결정하는 가장 근본적인 요소로, 고체·액체연료는 회분·황분에 기인한 먼지·SOx 문제가, 기체연료는 상대적으로 청정하나 고온연소에 따른 NOx 문제가 주요 관리대상이 된다. 향후에는 청정연료 전환과 함께 재생에너지·수소 등 대체에너지로의 전환이 가속화될 것으로 전망되며, 연소기술사는 연료 특성에 대한 정확한 이해를 바탕으로 방지시설을 선정해야 한다. 특히 동일한 방지시설이라도 연료 조성에 따라 요구되는 설계효율이 달라지므로, 연료 성상 분석은 방지시설 설계의 선행 필수 절차다.\n\n| 요약 | 주요 배출오염물질 | 대표 저감기술 |\n|---|---|---|\n| 고체연료 | 먼지, SOx, NOx | 집진+탈황+탈질 |\n| 액체연료 | SOx, V, NOx | 저황유 사용+탈황+탈질 |\n| 기체연료 | NOx | 저NOx버너, SCR |\n\n인허가 실무에서는 연료 종류가 확정되어야 배출시설 분류(연소시설의 규모·형식 신고)와 방지시설 인허가 요건이 구체화되므로, 사업계획 초기 단계에서부터 연료 선정을 명확히 하는 것이 인허가 절차 지연을 예방하는 길이다. 결국 연료 선정은 경제성·환경성·정책규제라는 세 축을 종합적으로 고려한 의사결정 문제이며, 이는 다음 Day부터 학습할 연소계산·연소조절 전 과정의 출발점이 된다. 이 세 축의 균형을 맞추는 것이 실무 엔지니어의 핵심 역량이다.\n","side":[{"title":"발열량 계산과 원소분석 활용 예제","body":"### Dulong식(고위발열량 추정, 개념)\nHHV(kcal/kg) ≈ 8,100×C + 34,000×(H − O/8) + 2,500×S\n\n여기서 C, H, O, S는 연료 중 각 원소의 질량분율(무차원 소수)이며, 이 식은 원소분석 결과로부터 발열량을 추정하는 대표적 경험식이다.\n\n### 저위발열량 환산(개념)\nLHV = HHV − 600×(9H + W)\n\n여기서 9H는 수소 연소로 생성되는 수분(질량비), W는 연료 중 수분 함량이며, 600은 물의 증발잠열(kcal/kg) 근사값이다.\n\n### 계산 감각 예제\n탄소함량 70%, 수소 5%, 산소 8%, 황분 1%인 석탄의 개략 HHV는:\nHHV ≈ 8,100×0.70 + 34,000×(0.05−0.08/8) + 2,500×0.01 ≈ 5,670 + 1,360 + 25 ≈ **7,055 kcal/kg**\n\n### 연료별 발열량 개략 비교표\n| 연료 | 저위발열량(개략, kcal/kg 또는 kcal/Nm³) |\n|---|---|\n| 유연탄 | 약 5,500~6,500 kcal/kg |\n| 무연탄 | 약 4,000~4,600 kcal/kg |\n| 중유(벙커C) | 약 9,700~10,000 kcal/kg |\n| LNG | 약 9,000~13,000 kcal/Nm³ |\n\n수치는 산지·등급에 따라 변동이 크므로, 답안에서는 \"연료 종류에 따라 상당한 편차가 있으며 실제 설계 시 공급자 성적서를 확인해야 한다\"는 점도 함께 언급하면 좋다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 연료의 종류(고체·액체·기체)별 연소특성과 오염물질 배출특성을 비교 설명하시오. *(114~138회 다수 25점)*\n2. 고위발열량과 저위발열량의 차이를 설명하시오. *(120회 10점)*\n3. 연료 원소분석 결과를 이용한 발열량 산정방법을 설명하시오. *(최근 10점)*\n4. 청정연료 전환 정책과 대기질 개선 효과를 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n연료 비교문제는 표(회분·황분·발열량·배출오염물질)로 정리하는 것이 가장 효율적이며, 결론에서 \"연료 선정이 곧 방지시설 선정의 출발점\"이라는 논리로 다음 Day(이론공기량·공기비)와 연결지어 서술하면 흐름이 자연스럽다.\n\n### 다음 학습 연계\nDay 80(이론공기량·공기비)은 이번 Day의 연료 원소분석 결과를 직접 활용하여 연소계산을 수행하는 내용으로, 두 Day를 연속으로 학습하면 이해도가 크게 높아진다. 연료 종류별 이론공기량은 탄소·수소·황 함량에 비례하므로, 오늘 학습한 원소분석 개념이 내일 계산문제의 기초가 된다.\n\n### 암기 카드 5선\n1. **고체연료** = 회분·황분 有, 먼지+SOx+NOx 종합관리 필요\n2. **액체연료** = 황분+바나듐(V), 저황유 사용이 핵심 대책\n3. **기체연료** = 청정연소, NOx 위주 관리\n4. **HHV vs LHV** = 수증기 응축열 포함 여부, HHV>LHV\n5. **연료전환정책** = 대기관리권역 청정연료 사용 의무화 확대"}]},"80":{"day":80,"date":"2026-10-19","title":"이론공기량·공기비·연소계산","keywords":[{"k":"이론산소량·공기량","subs":["원소별 산소 소요량(C·H·S)","Ao = Oo/0.21","연료 종류별 계산식"]},{"k":"실제공기량·공기비","subs":["A = m·Ao (m: 공기비)","공기비 m = A/Ao","과잉공기율 = (m-1)×100"]},{"k":"공기비 영향","subs":["과다: 배기손실 증가·NOx 증가","과소: 불완전연소·CO·매연 증가","적정범위 1.1~1.3(연료별 상이)"]},{"k":"연소가스량 계산","subs":["이론연소가스량 Go","실제연소가스량 G = Go+(m-1)Ao","CO2max 산정"]},{"k":"실무 활용","subs":["배기가스 O2 농도로 공기비 역산","보일러 효율과 공기비 관계","배출농도 표준산소농도 보정"]}],"answer":"# 이론공기량·공기비·연소계산\n\n## Ⅰ. 개요\n\n연소계산은 연료의 원소조성으로부터 완전연소에 필요한 이론공기량을 산정하고, 실제 운전 시 투입되는 공기량과의 비율인 공기비를 통해 연소 효율과 오염물질 발생 경향을 예측하는 대기관리기술사의 핵심 계산 분야다. 공기비는 연소가스량, 배출오염물질 농도, 방지시설 설계용량 산정의 기초가 되며, 배출가스 중 오염물질 농도를 표준산소농도로 보정하는 실무 절차와도 직결된다. *(114~138회 다수 10~25점, 계산문제 다수 기출)*\n\n## Ⅱ. 이론공기량 산정\n\n### 1. 이론산소량(Oo)\n연료 중 가연성분(C, H, S)이 완전연소하는 데 필요한 산소량으로, 원소별 산소 소요 반응식을 기초로 산정한다.\n\n| 원소 | 연소반응 | 산소 소요(Nm³/kg 개념) |\n|---|---|---|\n| 탄소(C) | C + O₂ → CO₂ | 1.867×C |\n| 수소(H) | H₂ + 1/2O₂ → H₂O | 5.6×(H − O/8) |\n| 황(S) | S + O₂ → SO₂ | 0.7×S |\n\n이론산소량 Oo = 1.867C + 5.6(H − O/8) + 0.7S (Nm³/kg-연료, C·H·O·S는 질량분율)\n\n### 2. 이론공기량(Ao)\n공기 중 산소 비율(약 21%)을 고려하여 이론공기량을 산정한다.\n\n**Ao = Oo / 0.21**\n\n## Ⅲ. 공기비(m)의 정의와 영향\n\n### 1. 정의\n| 용어 | 정의 |\n|---|---|\n| 공기비(m) | 실제공기량(A) / 이론공기량(Ao) |\n| 과잉공기율 | (m − 1) × 100 (%) |\n| 과잉공기량 | A − Ao = (m−1)Ao |\n\n### 2. 공기비의 영향\n| 공기비 상태 | 결과 |\n|---|---|\n| m < 1(부족) | 불완전연소, CO·매연·미연분 증가 |\n| m ≈ 1(이론적 완전연소) | 실제로는 혼합 불균일로 달성 어려움 |\n| m 적정(1.1~1.3 수준) | 완전연소 확보, 배기손실 최소화 |\n| m 과다(과잉이 큼) | 배기가스량 증가로 열손실 증가, 연소온도 저하, 그러나 국소적으로는 Thermal NOx 억제 효과도 있음 |\n\n### 3. 연료별 적정 공기비 경향\n기체연료는 혼합이 균일하여 상대적으로 낮은 공기비(1.1 내외)로도 완전연소가 가능한 반면, 고체연료(미분탄 등)는 혼합이 불균일하여 상대적으로 높은 공기비(1.2~1.4)가 필요한 경향이 있다.\n\n## Ⅳ. 연소가스량 계산과 실무 활용\n\n### 1. 이론연소가스량과 실제연소가스량\n| 구분 | 산정식 |\n|---|---|\n| 이론연소가스량(Go) | 완전연소 시 발생하는 가스량(CO₂, H₂O, N₂ 등의 합) |\n| 실제연소가스량(G) | G = Go + (m−1)Ao (과잉공기에 의한 증가분 포함) |\n\n### 2. CO2max(이론 최대 CO2 농도)\nCO2max(%) = (이론연소가스 중 CO₂량 / Go) × 100\n\n실제운전에서는 공기비 증가에 따라 배기가스가 희석되어 실측 CO₂ 농도는 CO2max보다 낮아지며, 역으로 실측 CO₂ 농도를 통해 공기비를 추정하는 데 활용된다.\n\n### 3. 배기가스 O2 농도를 이용한 공기비 역산(실무 핵심)\n현장에서는 이론공기량을 직접 측정하기 어려우므로, 배기가스 중 O₂ 농도를 측정하여 공기비를 역산하는 방법이 널리 활용된다.\n\n**m = 21 / (21 − O2(%))**\n\n### 4. 표준산소농도 보정\n배출허용기준은 시설별로 정해진 표준산소농도(예: 보일러 4%, 소각시설 12% 등, 시설별 상이) 기준으로 환산한 농도로 비교하며, 실측농도를 표준산소농도 조건으로 보정하는 계산은 배출시설 인허가·측정 실무에서 필수적이다.\n\n**보정농도 = 실측농도 × (21−표준O2) / (21−실측O2)**\n\n### 5. 공기비와 보일러 효율의 관계\n공기비가 지나치게 크면 배기가스량이 증가하여 배기가스와 함께 빠져나가는 열손실(배기손실)이 증가하고 보일러 열효율이 저하된다. 반대로 공기비가 너무 작으면 불완전연소로 인한 미연손실(CO·매연 중 미연탄소분)이 증가하므로, 실무에서는 배기손실과 미연손실의 합이 최소가 되는 지점을 최적 공기비로 관리한다.\n\n| 공기비 | 배기손실 | 미연손실 | 종합손실 |\n|---|---|---|---|\n| 과소 | 낮음 | 높음(불완전연소) | 높음 |\n| 적정 | 중간 | 낮음 | 최소(최적점) |\n| 과다 | 높음 | 낮음 | 높음 |\n\n## Ⅴ. 결론\n\n이론공기량과 공기비는 연소 효율, 배기가스량, 오염물질 발생 경향을 예측하는 연소계산의 핵심 도구로, 특히 배기가스 O₂ 농도로부터 공기비를 역산하고 표준산소농도로 배출농도를 보정하는 절차는 실무 인허가와 시험 계산문제 모두에서 빈출된다. 적정 공기비 유지는 완전연소를 통한 대기오염물질(CO·매연) 저감과 과잉공기에 의한 열손실·NOx 증가 억제라는 상충되는 목표 사이의 균형점을 찾는 것으로, 연소관리의 근본 원칙이다.\n\n| 요약 | 핵심 공식 |\n|---|---|\n| 이론공기량 | Ao = Oo/0.21 |\n| 공기비 | m = A/Ao = 21/(21−O2) |\n| 표준산소농도 보정 | C보정 = C실측×(21−Cs)/(21−O2실측) |\n","side":[{"title":"연소계산 종합 예제","body":"### 예제 1: 이론공기량 산정\n탄소 80%, 수소 5%, 산소 3%, 황 1%인 연료의 이론산소량과 이론공기량은:\n\nOo = 1.867×0.80 + 5.6×(0.05−0.03/8) + 0.7×0.01\n   = 1.494 + 5.6×0.04625 + 0.007 ≈ 1.494+0.259+0.007 ≈ **1.76 Nm³/kg**\n\nAo = Oo/0.21 = 1.76/0.21 ≈ **8.38 Nm³/kg**\n\n### 예제 2: 공기비 역산\n배기가스 O₂ 농도가 6%로 측정되었다면:\n\nm = 21/(21−6) = 21/15 ≈ **1.40**\n\n→ 과잉공기율 = (1.40−1)×100 = **40%**\n\n### 예제 3: 표준산소농도 보정\n실측 NOx 농도 150ppm, 실측 O₂ 15%, 표준산소농도 4%인 소각시설의 보정농도는:\n\nC보정 = 150 × (21−4)/(21−15) = 150 × 17/6 ≈ **425 ppm**\n\n→ 실측 시 과잉공기가 많아 농도가 희석되었으므로, 표준조건으로 보정하면 훨씬 높은 값이 됨을 보여주는 대표적 계산 유형이다.\n\n### 예제 4: CO2를 이용한 공기비 산정(대안식)\nCO2max가 18%이고 실측 CO2가 12%인 경우, 근사적으로 공기비는 CO2max/CO2실측 비율에 비례하는 경향을 보이며(정확한 산정에는 CO·N2 등 조성을 함께 고려하는 정밀식 필요), 현장에서는 O2 측정법이 CO2측정법보다 오차가 적어 더 널리 사용된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 이론공기량과 실제공기량, 공기비의 관계를 설명하고 계산하시오. *(다수 회차 25점 계산형)*\n2. 배기가스 O2 농도를 이용한 공기비 산정방법을 설명하시오. *(114~138회 다수 10~25점)*\n3. 표준산소농도 보정농도 산정식을 유도하고 계산 예제를 제시하시오. *(다수 회차 25점)*\n4. 공기비가 연소 및 오염물질 배출에 미치는 영향을 설명하시오. *(120회 25점)*\n\n### 답안 작성 요령\n계산문제는 기호 정의(Oo, Ao, m, A, G, Go 등)를 답안 서두에 명확히 제시한 뒤 단계별로 계산과정을 전개해야 하며, 최종 답에는 반드시 단위를 표기해야 한다. 공기비 개념 문제는 \"과다·과소 양쪽의 문제점\"을 균형있게 서술하는 것이 핵심 채점 포인트다.\n\n### 실무 연계 메모\n표준산소농도 보정은 배출시설 종류별로 기준이 상이(보일러·소각로·발전소 등)하므로, 실무에서는 반드시 해당 시설의 배출허용기준 고시를 확인해야 한다.\n\n### 암기 카드 5선\n1. **Oo = 1.867C+5.6(H-O/8)+0.7S** — 원소별 산소소요량\n2. **Ao = Oo/0.21** — 이론공기량\n3. **m = A/Ao = 21/(21-O2)** — 공기비(O2 역산식)\n4. **보정농도 = 실측×(21-Cs)/(21-O2실측)** — 표준산소농도 보정\n5. **최적공기비** = 배기손실+미연손실 최소화 지점"}]},"81":{"day":81,"date":"2026-10-20","title":"완전연소 조건 3T와 연소장치","keywords":[{"k":"3T 이론","subs":["Temperature(온도)·Time(시간)·Turbulence(혼합)","3요소 동시 충족 필요","불완전 시 CO·매연·다이옥신 증가"]},{"k":"연소실 설계인자","subs":["연소실 부하율(열발생율)","체류시간(Retention Time)","화염온도·단열화염온도"]},{"k":"연소장치 종류","subs":["미분탄버너·스토커·유동층","가스버너·유류버너","2차연소실(후연소)"]},{"k":"불완전연소 원인","subs":["공기비 부족·혼합불량","연소실 온도 저하","체류시간 부족"]},{"k":"관리방안","subs":["버너 정비·공연비 제어","연소실 단열·보온","연소가스 재순환(FGR)"]}],"answer":"# 완전연소 조건 3T와 연소장치\n\n## Ⅰ. 개요\n\n완전연소란 연료 중 가연성분이 산소와 완전히 반응하여 CO₂와 H₂O로 전환되는 이상적인 연소상태로, 이를 달성하기 위한 필요조건이 온도(Temperature), 시간(Time), 혼합(Turbulence)의 3요소, 이른바 3T 이론이다. 3T 중 어느 하나라도 충족되지 못하면 CO·매연(그을음)·다이옥신 등 불완전연소 생성물이 발생하므로, 연소장치 설계와 운전관리의 궁극적 목표는 3T를 동시에 만족시키는 데 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 3T 이론의 각 요소\n\n### 1. 온도(Temperature)\n연료의 착화온도 이상으로 충분히 높은 온도가 유지되어야 반응속도가 확보되며, 온도가 낮으면 반응이 느려져 불완전연소가 발생한다. 소각시설의 경우 다이옥신 재합성 방지를 위해 통상 **800℃ 이상**(관련 기준상 850℃ 이상 등 시설별 상이)의 연소온도 유지가 요구된다.\n\n### 2. 시간(Time)\n고온상태에서 가연성분이 충분히 반응을 완결할 수 있는 체류시간이 확보되어야 하며, 소각시설의 경우 통상 **2초 이상**의 체류시간이 요구되는 경우가 많다(시설·기준별 상이).\n\n### 3. 혼합(Turbulence)\n연료와 공기(산소)가 충분히 난류혼합되어야 국소적인 산소 부족 없이 균일한 연소가 이루어진다. 버너 형식·연소실 구조 설계를 통해 난류를 형성시켜 혼합을 촉진한다.\n\n| 요소 | 부족 시 결과 | 확보 수단 |\n|---|---|---|\n| 온도(T) | 반응속도 저하, CO 증가 | 예열, 단열, 보조연료 |\n| 시간(t) | 반응 미완결, 매연 증가 | 연소실 체적 확대, 유속 저감 |\n| 혼합(Turbulence) | 국소 산소부족, 불균일연소 | 버너 개선, 2차공기 분사 |\n\n## Ⅲ. 연소장치의 종류와 특성\n\n### 1. 고체연료 연소장치\n| 장치 | 원리 | 특징 |\n|---|---|---|\n| 미분탄버너 | 석탄을 미분화하여 부유연소 | 대형 발전소 표준, 고효율 |\n| 스토커 | 화격자 위에서 고체연료 이동연소 | 중소형, 구조 단순 |\n| 유동층연소(FBC) | 모래 등 유동매체 위에서 저온연소 | 저NOx, 다양한 연료 적용 가능 |\n\n### 2. 액체·기체연료 연소장치\n| 장치 | 원리 | 특징 |\n|---|---|---|\n| 유류버너 | 연료 무화(Atomization) 후 분사연소 | 예열 필요(중유), 점도관리 중요 |\n| 가스버너 | 기체연료+공기 예혼합 또는 확산연소 | 청정연소, 제어 용이 |\n\n### 3. 2차연소실(후연소) 개념\n1차 연소에서 불완전연소된 가스(CO, 미연탄화수소 등)를 2차연소실에서 추가로 공기를 주입하여 완전산화시키는 방식으로, 소각시설을 비롯한 다수 연소장치에 적용되어 3T 조건을 보완한다.\n\n## Ⅳ. 불완전연소 원인과 관리방안\n\n### 1. 불완전연소의 주요 원인\n| 원인 | 결과 |\n|---|---|\n| 공기비 부족 | CO·매연 증가(Day80 연계) |\n| 연소실 온도 저하 | 반응속도 저하, 미연분 증가 |\n| 체류시간 부족(과부하 운전) | 반응 미완결 |\n| 혼합불량(버너 노후·손상) | 국소적 산소부족 |\n\n### 2. 관리방안\n| 방안 | 내용 |\n|---|---|\n| 공연비 최적제어 | O₂ 트림 제어로 적정 공기비 유지 |\n| 연소실 단열·보온 | 화염온도 유지, 열손실 최소화 |\n| 정기 버너 정비 | 노즐 마모·오염 점검, 무화상태 확인 |\n| 부하관리 | 설계용량 초과 운전 지양(체류시간 확보) |\n\n### 3. 3T와 NOx의 상충관계\n3T 조건 중 고온(T)을 과도하게 추구하면 오히려 Thermal NOx 생성이 촉진되므로, 완전연소(CO·매연 저감)와 NOx 저감(연소온도 제한)이라는 두 목표가 상충될 수 있어, 단계연소·저NOx버너 등으로 균형점을 찾는 것이 실무 설계의 핵심이다.\n\n### 4. 연소실 부하율과 설계 여유\n연소실 부하율(단위 체적당 열발생률)이 과도하게 높게 설계되면 체류시간이 짧아져 3T 중 시간(T) 요소가 부족해질 위험이 있으므로, 설계단계에서 연소실 체적을 충분히 확보하고 여유율을 두는 것이 실무적으로 중요하다.\n\n### 5. 시운전·성능시험 시 3T 확인 절차\n신설 연소시설의 성능시험에서는 정격부하 조건에서 연소실 내 온도분포, 배기가스 CO 농도, 체류시간 계산치를 종합적으로 확인하여 3T 조건 충족 여부를 판정하며, 이는 인허가 준공검사의 핵심 항목이다.\n\n## Ⅴ. 결론\n\n완전연소는 온도·시간·혼합의 3T 조건이 동시에 충족되어야 달성되며, 어느 한 요소라도 부족하면 CO·매연·다이옥신 등 유해 부산물이 증가한다. 연소장치는 연료 종류에 따라 미분탄버너·스토커·유동층·유류버너·가스버너 등으로 다양화되어 있으며, 2차연소실 등 보완설비를 통해 3T 조건을 확보한다. 다만 완전연소 추구가 NOx 증가로 이어질 수 있는 상충관계를 고려하여, 저NOx버너·단계연소 등 균형 잡힌 연소기술 적용이 필요하다.\n\n| 요약 | 핵심 |\n|---|---|\n| 3T | 온도·시간·혼합 동시 충족 |\n| 상충관계 | 완전연소(고온 지향) vs NOx 저감(저온 지향) |\n| 관리수단 | 공연비제어, 2차연소실, 정기정비 |\n","side":[{"title":"소각시설 3T 기준과 다이옥신 연계","body":"### 소각시설 3T 관련 기준 감각(시설·법령별 상이, 범위로 기억)\n| 항목 | 기준 감각 |\n|---|---|\n| 연소온도 | 800~850℃ 이상 |\n| 체류시간 | 2초 이상 |\n| 산소농도 | 6% 이상(과잉공기 확보) |\n\n### 다이옥신과 3T의 관계\n소각시설에서 3T 조건이 미흡하면 300~450℃ 구간에서 다이옥신이 De Novo 합성(Day89~90 연계)으로 재생성될 수 있어, 3T 확보 후에도 배가스를 이 온도대에서 급냉시키는 급속냉각(Quenching)이 다이옥신 저감의 핵심 관리수단으로 병행된다.\n\n### 2차연소실 설계 개념\n1차연소실에서 미연분을 포함한 배가스가 2차연소실로 유입되면, 추가 공기 주입과 함께 최소 체류시간을 확보하도록 연소실 형상과 유속을 설계하여 CO 등 미연가스를 완전 산화시킨다.\n\n### 급속냉각(Quenching) 설계 개념\n2차연소실 통과 후 배가스는 다이옥신 De Novo 합성이 활발한 300~450℃ 구간을 최대한 빠르게(통상 1초 이내) 통과하도록 급속냉각설비(수분무 등)를 배치하여 재합성을 억제한다. 이는 3T와는 별개의 후속 관리수단이지만 시험에서 함께 출제되는 경우가 많다.\n\n### 소각시설 성능시험 기록 예시(개념)\n| 측정항목 | 실측치 | 기준 |\n|---|---|---|\n| 연소실 온도 | 860℃ | 850℃ 이상 |\n| 체류시간 | 2.3초 | 2초 이상 |\n| 배기 O2 | 8% | 6% 이상 |\n| CO 농도 | 45ppm | 기준 이내 |\n\n이러한 실측 기록표는 3T 조건이 실제로 충족되었음을 정량적으로 입증하는 준공검사·정기검사의 핵심 근거자료가 된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 완전연소의 3요소(3T)를 설명하고 각각의 확보방안을 제시하시오. *(114~138회 다수 25점)*\n2. 불완전연소의 원인과 관리방안을 설명하시오. *(120회 10~25점)*\n3. 연소장치의 종류(미분탄버너·스토커·유동층 등)를 비교 설명하시오. *(126회 25점)*\n4. 완전연소 추구와 NOx 저감의 상충관계를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n3T 이론은 각 요소를 단순 나열하지 말고, 소각시설 등 구체적 기준수치(온도·시간·산소농도)와 함께 제시하면 실무형 고득점 답안이 된다. NOx와의 상충관계 서술은 이 파트의 심화 포인트로, 언급 시 가점 요인이 된다.\n\n### 다음 학습 연계\nDay 82(석탄화력 대기오염물질과 저감)는 이번 Day의 연소장치(미분탄버너)와 3T 조건을 실제 대형 발전설비에 적용하는 사례로 직접 이어진다.\n\n### 암기 카드 5선\n1. **3T** = 온도(Temperature)·시간(Time)·혼합(Turbulence)\n2. **소각시설 기준감각** = 800~850℃ 이상, 2초 이상, O2 6% 이상\n3. **2차연소실** = 1차 미연가스 완전산화 보완설비\n4. **급속냉각** = 300~450℃ 구간 급속통과로 다이옥신 재합성 억제\n5. **상충관계** = 완전연소(고온) vs NOx저감(저온) 균형 필요"}]},"82":{"day":82,"date":"2026-10-21","title":"석탄화력 대기오염물질과 저감","keywords":[{"k":"석탄화력 오염물질","subs":["먼지(비산재)·SOx·NOx 3대 오염물질","중금속(Hg·As)·미량 유해물질","CO2 등 온실가스 동반배출"]},{"k":"저감기술 조합(BAT)","subs":["집진: 전기집진기(ESP)·여과집진기(FF)","탈황: 습식 석회석-석고법","탈질: SCR"]},{"k":"통합 저감 순서","subs":["연소조절(저NOx버너)→SCR→집진→FGD","공정 배치와 온도구간 고려","White Plume 저감설비 병행"]},{"k":"정책·규제","subs":["대기관리권역 배출허용기준 강화","노후 석탄화력 폐지·LNG 전환","석탄상한제·가동정지 제도"]},{"k":"수은·미량유해물질","subs":["Hg 배출특성(원소상·산화상·입자상)","활성탄 분사(ACI)로 제거","미나마타협약 대응"]}],"answer":"# 석탄화력 대기오염물질과 저감\n\n## Ⅰ. 개요\n\n석탄화력발전소는 국내 대기오염물질 배출의 주요 고정오염원 중 하나로, 먼지·SOx·NOx의 3대 오염물질과 함께 수은 등 미량 유해물질을 배출한다. 이에 따라 집진(ESP·FF)·탈황(FGD)·탈질(SCR)의 3대 저감기술을 표준적으로 갖추고 있으며, 최근에는 온실가스 감축과 미세먼지 저감 정책이 맞물리면서 노후 석탄화력의 단계적 폐지·LNG 전환이 핵심 정책과제로 대두되고 있다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 석탄화력의 주요 대기오염물질\n\n### 1. 오염물질별 발생 특성\n| 오염물질 | 발생 원인 | 특징 |\n|---|---|---|\n| 먼지(비산재) | 석탄 중 회분 연소 후 잔류 | 전기집진·여과집진으로 고효율 제거 가능 |\n| SOx | 석탄 중 황분 연소 | 습식탈황(FGD)으로 90% 이상 제거 |\n| NOx | 연소 시 Thermal·Fuel NOx | 저NOx버너+SCR 병행 |\n| 수은(Hg) | 석탄 중 미량 함유 | 원소상·산화상·입자상 형태로 배출, 관리 까다로움 |\n\n### 2. 오염물질별 배출 형태\n석탄 연소 시 발생하는 비산재의 일부는 입자가 매우 작은 초미세먼지(PM2.5) 형태로 배출되며, 미분해 상태의 다환방향족탄화수소(PAHs) 등도 미량 동반될 수 있다.\n\n## Ⅲ. 3대 저감기술과 통합 배치\n\n### 1. 개별 저감기술 요약\n| 기술 | 대상오염물질 | 원리 |\n|---|---|---|\n| 전기집진기(ESP) | 먼지 | 전기적 대전·집진(Day41~43 연계) |\n| 여과집진기(FF) | 먼지 | 필터 여과, 초미세먼지 고효율 |\n| SCR | NOx | 촉매(300~400℃)+암모니아 환원(Day59 연계) |\n| 습식탈황(FGD) | SOx | 석회석-석고법(Day63 연계) |\n\n### 2. 통합 저감설비 배치 순서\n연소조절(저NOx버너·FGR) → SCR(고온측, 집진 전) → 집진기(ESP 또는 FF) → 습식탈황(FGD) → (필요시 White Plume 저감설비) → 굴뚝\n\n이 순서는 SCR의 최적 반응온도(300~400℃)가 집진·탈황 이전 고온 구간에 위치하기 때문이며, 집진을 먼저 거치는 것은 탈황설비로 유입되는 먼지부하를 줄여 탈황효율과 부생석고 품질을 확보하기 위함이다.\n\n### 3. 미량 유해물질(수은) 저감\n| 저감방안 | 원리 |\n|---|---|\n| 활성탄분사(ACI, Activated Carbon Injection) | 수은을 활성탄에 흡착시켜 후단 집진기로 포집 |\n| 기존 저감설비 부수효과 | SCR·FGD 통과 과정에서 일부 수은도 산화·흡수되어 제거 |\n\n## Ⅳ. 정책적 관리와 문제점\n\n### 1. 정책 동향\n| 정책 | 내용 |\n|---|---|\n| 노후 석탄화력 폐지·전환 | 노후설비 조기폐지 또는 LNG 전환 추진 |\n| 계절관리제·가동정지 | 미세먼지 고농도 계절(12~3월) 가동률 제한·상한제약 |\n| 대기관리권역 강화기준 | 신설·기존시설 배출허용기준 단계적 강화 |\n| 미나마타협약 대응 | 수은 배출 저감 국제협약 이행 |\n\n### 2. 운영상 문제점\n- 다수 저감설비 동시 운영에 따른 압력손실 누적, 보조동력 소비 증가\n- 탈황 부생석고·비산재 등 부산물의 안정적 처리·자원화 필요\n- 계절관리제 등 가동제약이 전력수급 안정성과 상충될 수 있음\n\n### 3. 관리방안\n저감설비 간 통합 최적운전(에너지효율과 배출저감의 균형), 부산물 자원화(시멘트 원료, 콘크리트 혼화재 등) 확대, 계절관리제 시행 시 대체 전력원 확보 계획 병행이 필요하다. 특히 부생석고·비산재의 안정적 판매처 확보는 방지시설 운영비 절감과도 직결되므로 정책적 지원이 함께 요구된다.\n\n### 4. 발전효율과 환경설비의 관계\n저감설비(SCR·집진기·FGD)는 각각 상당한 압력손실을 유발하여 유인송풍기 동력 소비를 증가시키므로, 저감설비 추가는 발전소의 순발전효율을 일정 부분 저하시키는 트레이드오프가 있다. 최신 초초임계압(USC) 발전기술은 발전효율 자체를 높여 단위 발전량당 오염물질 배출량(원단위)을 낮추는 접근으로, 저감설비 고효율화와 함께 병행되는 전략이다. 이처럼 발전효율 제고와 저감설비 고도화는 상호 대립하는 것이 아니라, 원단위 배출량 저감이라는 공동의 목표를 향한 두 가지 보완적 수단으로 이해해야 한다.\n\n## Ⅴ. 결론\n\n석탄화력은 먼지·SOx·NOx·수은 등 다양한 대기오염물질을 배출하는 대표적 고정오염원으로, 집진·탈질·탈황을 결합한 통합 저감설비 체계를 통해 배출을 최소화하고 있다. 다만 온실가스 감축과 미세먼지 저감이라는 이중의 정책 압력 속에서 노후 석탄화력의 폐지·전환이 가속화되고 있으며, 잔존 설비에 대해서는 저감기술 고도화와 계절관리제 등을 통한 탄력적 운영이 함께 요구된다.\n\n| 요약 | 저감기술 배치순서 |\n|---|---|\n| 연소조절 | 저NOx버너·FGR |\n| 탈질 | SCR(고온측) |\n| 집진 | ESP/FF |\n| 탈황 | 습식FGD |\n\n궁극적으로 석탄화력의 대기오염물질 관리는 개별 저감설비의 고도화만으로는 한계가 있으며, 발전원 구성 전환이라는 보다 근본적인 에너지정책과 병행될 때 실질적인 대기질 개선 효과를 거둘 수 있다. 대기관리기술사로서는 이러한 정책 흐름을 이해한 위에서 잔존 설비의 저감기술을 지속적으로 고도화하는 실무적 대응이 요구된다.\n","side":[{"title":"석탄화력 방지설비 배치도와 설계 감각","body":"### 배치 개념도\n```\n석탄 → 미분탄버너(저NOx버너, 3T 조건 관리)\n   ↓\n연소가스(NOx 발생, ~300~400℃)\n   ↓\nSCR(탈질, 촉매+NH3)\n   ↓\n공기예열기(열회수)\n   ↓\nESP 또는 FF(집진)\n   ↓\nFGD(습식탈황, 석회석-석고법)\n   ↓\n(White Plume 저감/재가열)\n   ↓\n굴뚝 배출\n```\n\n### 저감효율 종합 감각(문헌 참고범위)\n| 오염물질 | 종합 저감효율 감각 |\n|---|---|\n| 먼지 | 99% 이상(ESP/FF) |\n| SOx | 90% 이상(습식FGD) |\n| NOx | 80~90%(SCR, 연소조절 포함 시 그 이상) |\n\n### White Plume 저감설비\n습식탈황 후 포화수증기 배출로 발생하는 백연(연돌 흰 연기)을 저감하기 위해 배가스 재가열(GGH) 또는 응축수 회수 방식을 적용하며, 이는 오염물질 저감이 아닌 시각적 민원 저감 목적의 설비임에 유의해야 한다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 석탄화력발전소의 주요 대기오염물질과 저감기술을 종합적으로 설명하시오. *(114~138회 다수 25점)*\n2. 석탄화력 방지설비의 통합 배치순서와 그 이유를 설명하시오. *(120회 25점)*\n3. 석탄화력의 수은 저감기술(ACI 등)을 설명하시오. *(126회 10점)*\n4. 노후 석탄화력 폐지·전환 정책과 대기질 개선 효과를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n방지설비 배치순서 문제는 반드시 \"왜 이 순서인가\"(SCR 온도창, 집진 후 탈황의 이유)를 함께 설명해야 고득점이 가능하다. 단순 순서 나열은 부분점수에 그친다.\n\n### 관련 기출 흐름 연계\n이 Day는 Day 57~59(NOx 저감), Day 61~64(탈황), Day 41~43(전기집진)의 통합 응용문제로, 개별 기술 학습이 부실하면 이 Day의 답안 완성도가 떨어진다. 취약하다면 해당 Day를 재복습할 것을 권장한다.\n\n### 종합형 문제 대비 답안 골격 예시\n\"석탄화력의 3대 오염물질은 먼지·SOx·NOx이며(Ⅰ), 각각 ESP/FF·FGD·SCR로 저감하되(Ⅱ), 설비배치는 SCR 온도창을 고려해 연소조절→SCR→집진→FGD 순으로 하고(Ⅲ), 수은 등 미량유해물질은 ACI로 보완하며(Ⅳ), 향후 노후설비 전환·계절관리제 등 정책과 연계해 관리한다(Ⅴ)\"는 5단 구조를 미리 암기해두면 실전에서 시간을 절약할 수 있다.\n\n### 암기 카드 5선\n1. **3대 오염물질** = 먼지·SOx·NOx, 3대 저감기술(ESP/FF·FGD·SCR)\n2. **배치순서** = 연소조절→SCR→집진→FGD\n3. **ACI** = 활성탄분사, 수은 흡착 후 집진기 포집\n4. **계절관리제** = 12~3월 가동률 제한\n5. **White Plume 저감** = 오염저감이 아닌 시각적 민원 대응 설비"}]},"83":{"day":83,"date":"2026-10-22","title":"옥내저탄장과 회처리장 환경영향","keywords":[{"k":"옥외 vs 옥내저탄장","subs":["옥외: 비산먼지·자연발화 위험","옥내: 밀폐+집진 병행","대기관리권역 옥내화 의무 확대"]},{"k":"자연발화 관리","subs":["석탄 자연발화(저온산화) 메커니즘","적치높이·기간 제한","온도모니터링·살수"]},{"k":"비산먼지 저감","subs":["방진망·방진벽 설치","살수시설·세륜시설","야적더미 형상관리"]},{"k":"회처리장(Ash Pond)","subs":["비산재·바닥재 처리·매립","침출수 관리(중금속)","건식회처리 전환 추세"]},{"k":"관련 제도","subs":["「대기환경보전법」비산먼지 신고대상","석탄재 재활용 촉진법령","환경영향평가 저감방안 반영"]}],"answer":"# 옥내저탄장과 회처리장 환경영향\n\n## Ⅰ. 개요\n\n석탄화력발전소·제철소 등 대규모 석탄 사용시설은 원료탄 저장을 위한 저탄장과 연소 후 발생하는 회(灰)를 처리하는 회처리장을 필수적으로 운영하며, 두 시설 모두 비산먼지와 중금속 오염 등 부수적인 환경영향을 유발할 수 있다. 저탄장은 옥외 야적 시 비산먼지와 자연발화 위험이 있어 최근 옥내저탄장으로의 전환이 정책적으로 촉진되고 있으며, 회처리장은 비산재·바닥재 중 중금속의 침출수 오염 우려로 건식 처리·재활용이 확대되는 추세다. *(114~138회 다수 10점, 일부 25점 기출)*\n\n## Ⅱ. 저탄장의 환경영향과 관리\n\n### 1. 옥외저탄장의 문제점\n| 문제 | 원인 |\n|---|---|\n| 비산먼지 발생 | 강풍 시 야적더미 표면 미세입자 비산 |\n| 자연발화 | 석탄의 저온산화 반응열 축적(장기 적치 시) |\n| 우수 유출오염 | 강우 시 석탄분 함유 침출수 발생 |\n\n### 2. 옥내저탄장 전환\n| 구분 | 옥외저탄장 | 옥내저탄장 |\n|---|---|---|\n| 비산먼지 | 방진망·살수로 저감(한계 존재) | 밀폐구조로 원천 차단 |\n| 자연발화 관리 | 온도모니터링·적치높이 제한 | 밀폐공간 내 집중관리 용이 |\n| 초기투자비 | 낮음 | 높음(돔형 구조물 등) |\n| 정책 방향 | 축소 지향 | 대기관리권역 내 신규시설 의무화 확대 |\n\n### 3. 자연발화 관리방안\n석탄은 공기 중 산소와 서서히 반응(저온산화)하며 열을 발생시키는데, 이 열이 축적되어 일정 온도 이상에 도달하면 자연발화로 이어질 수 있다. 이를 방지하기 위해 적치높이·적치기간을 제한하고, 내부 온도를 정기적으로 모니터링하며 필요시 살수·이적(반출입 순환)을 실시한다.\n\n## Ⅲ. 비산먼지 저감시설\n\n| 시설 | 원리 |\n|---|---|\n| 방진망·방진벽 | 야적더미 주변 설치로 풍속 저감·비산 차단 |\n| 살수시설 | 정기 살수로 표면 함수율 유지, 비산 억제 |\n| 세륜시설 | 반출입 차량 바퀴 세정으로 도로 비산먼지 저감 |\n| 야적더미 형상관리 | 경사각·높이 제한으로 풍식(Wind Erosion) 최소화 |\n\n이러한 비산먼지 저감시설은 「대기환경보전법」상 비산먼지 발생사업 신고대상시설의 필수 설치 항목으로 규정되어 있다.\n\n## Ⅳ. 회처리장의 환경영향과 관리방안\n\n### 1. 회(灰)의 종류와 발생\n| 구분 | 발생 위치 | 특징 |\n|---|---|---|\n| 비산재(Fly Ash) | 집진기(ESP/FF)에서 포집 | 미세입자, 발생량 많음 |\n| 바닥재(Bottom Ash) | 연소실 하부에서 배출 | 상대적으로 조립자 |\n\n### 2. 회처리장(Ash Pond) 환경영향\n습식 회처리 방식(수쇄 이송 후 저류지 적치)은 중금속(As, Pb 등)이 침출수를 통해 지하수·토양으로 확산될 우려가 있어, 차수막 설치와 침출수 처리시설이 필수적으로 요구된다.\n\n비산재는 발생량이 많고 입경이 작아 관리 부담이 크며, 통상 시멘트 산업의 혼합재 등으로 재활용되는 비중이 바닥재보다 높다. 반면 바닥재는 상대적으로 조립자로서 도로 노반재·성토재 등으로 활용된다.\n\n### 3. 관리방안과 전환 추세\n| 방안 | 내용 |\n|---|---|\n| 차수막·침출수 처리 | 중금속 지하수 오염 방지 |\n| 건식 회처리 전환 | 수쇄방식 대비 침출수 발생 자체를 최소화 |\n| 자원화(재활용) | 시멘트 원료, 콘크리트 혼화재, 도로 노반재 등으로 활용 |\n\n건식 회처리는 물 사용량 저감과 침출수 문제 근본 해소라는 장점으로 최근 신설·개조 시 우선 적용되는 추세이며, 자원화 확대는 매립부담 저감과 자원순환이라는 이중의 효과를 갖는다.\n\n### 4. 환경영향평가 및 인허가 실무 연계\n발전소·제철소 등 대규모 사업의 환경영향평가서에서는 연소시설 배출가스뿐 아니라 저탄장의 비산먼지 확산예측, 회처리장의 침출수 수질영향까지 포함하여 종합적으로 검토해야 하며, 저감방안으로 옥내화·건식화 계획을 구체적으로 제시하는 것이 최근 협의 실무의 경향이다.\n\n### 5. 저탄장·회처리장과 수질·토양 분야의 연계\n비산먼지가 지표에 침적되거나 회처리장 침출수가 유출되는 경우 대기 분야를 넘어 수질·토양 오염으로 이어질 수 있어, 대기관리기술사 실무에서도 타 분야(수질·폐기물)와의 통합적 검토 관점이 요구된다.\n\n### 6. 자원화 촉진을 위한 품질관리\n석탄재를 시멘트·콘크리트 원료로 재활용하기 위해서는 미연탄소분 함량, 중금속 용출량 등 품질기준을 충족해야 하며, 연소관리(3T 확보)가 양호할수록 미연탄소분이 적어 자원화 품질도 함께 개선되는 연계관계가 있다는 점도 답안의 심화 포인트가 될 수 있다.\n\n## Ⅴ. 결론\n\n저탄장과 회처리장은 석탄화력의 연소 전·후 단계에서 각각 비산먼지·자연발화, 중금속 침출수라는 부수적 환경영향을 유발할 수 있는 시설로, 옥내저탄장 전환과 건식 회처리·자원화 확대가 최근의 관리 방향이다. 대기관리기술사 실무에서는 연소시설 자체의 배출가스 저감뿐 아니라 이러한 부대시설의 환경영향까지 종합적으로 검토하는 것이 환경영향평가 및 인허가 실무의 핵심 과제다.\n\n| 요약 | 관리방향 |\n|---|---|\n| 저탄장 | 옥외→옥내 전환, 비산먼지·자연발화 관리 |\n| 회처리장 | 습식→건식 전환, 자원화 확대 |\n\n이러한 부대시설 관리는 연소시설 자체의 배출가스 저감기술만큼이나 인허가 협의와 주민 수용성 확보에 직결되므로, 실무 엔지니어는 주공정뿐 아니라 부대시설까지 통합적으로 검토하는 습관을 길러야 한다. 특히 최근 환경영향평가에서는 부대시설의 저감방안이 미흡하면 주공정의 우수한 저감계획에도 불구하고 협의 지연의 원인이 되는 경우가 많으므로 실무적으로도 소홀히 할 수 없는 영역이다.\n","side":[{"title":"비산먼지 발생사업 신고제도 실무","body":"### 비산먼지 신고대상 시설 예시\n| 업종 | 해당 시설 |\n|---|---|\n| 발전·제철 | 야외 저탄장, 원료 야적장 |\n| 건설공사 | 토공사·건축공사 현장 |\n| 시멘트·골재 | 채석장, 골재 야적장 |\n\n### 저감시설 설치기준(개념)\n「대기환경보전법 시행규칙」에 따라 비산먼지 발생사업자는 방진벽·방진망·살수시설 등 저감시설을 설치·운영해야 하며, 미이행 시 개선명령 등 행정조치 대상이 된다.\n\n### 저탄장 화재 대응 절차(개념)\n1. 온도센서로 이상고온 구간 조기 감지\n2. 해당 구간 우선 반출 또는 살수 냉각\n3. 필요시 이적(다른 야적장으로 재배치)하여 축열 해소\n4. 화재 발생 시 질식소화(공기차단) 및 냉각소화 병행\n\n### 대기관리권역과 옥내저탄장 의무화\n「대기관리권역의 대기환경개선에 관한 특별법」이 시행되는 권역 내 신규·증설 발전시설에는 옥내저탄장 설치가 사실상 의무화되는 경향이며, 이는 노후 옥외저탄장을 보유한 기존 사업장에도 단계적 전환 압박으로 작용하고 있다.\n\n### 저탄장 관리 관련 유사 사례(제철소)\n제철소의 원료탄·철광석 야적장도 동일한 비산먼지 문제를 안고 있어, 방진덮개·방진벽 설치는 물론 대규모 사업장의 경우 아예 밀폐형 사일로(Silo)로 원료를 저장하는 방식으로 전환하는 사례도 늘고 있다. 이는 저탄장 관리원칙이 발전소에 국한되지 않고 원료 야적이 필요한 산업 전반에 적용됨을 보여준다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 옥외저탄장의 환경문제와 옥내저탄장 전환의 필요성을 설명하시오. *(다수 회차 10점)*\n2. 석탄의 자연발화 메커니즘과 관리방안을 설명하시오. *(120회 10점)*\n3. 회처리장(Ash Pond)의 환경영향과 건식 회처리 전환의 장점을 설명하시오. *(126회 10점)*\n4. 비산먼지 발생사업 신고제도와 저감시설을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n저탄장·회처리장 문제는 소각시설·연소시설 위주의 학습에서 놓치기 쉬운 \"부대시설\"영역이므로, 발전소 전체 공정도 안에서 이 시설들의 위치(연료 투입 전/연소 후)를 명확히 하며 서술하면 완성도가 높아진다.\n\n### 암기 카드 4선\n1. **자연발화** = 저온산화 반응열 축적, 적치높이·기간 제한 필요\n2. **옥내저탄장** = 대기관리권역 신규시설 의무화 확대 추세\n3. **비산재 vs 바닥재** = 집진기 포집(미세) vs 연소실 하부(조립)\n4. **건식 회처리** = 침출수 문제 근본 해소, 자원화 용이\n\n### 답안 확장 포인트\n저탄장·회처리장은 출제빈도가 높지 않지만 나올 경우 배점이 정형화되어 있으므로(발생원인→환경영향→저감방안), 짧은 시간 내 표를 활용해 핵심만 정확히 서술하는 전략이 효율적이다.\n\n### 관련 기출 흐름 연계\n이 Day는 Day 41~43(전기집진, 회처리와 연계)과 Day 82(석탄화력 종합저감)의 부속 내용으로, 독립된 대주제로 출제되기보다 종합문제의 일부(소논술)로 출제되는 경향이 있음을 참고하여 학습 비중을 조절하는 것이 효율적이다."}]},"84":{"day":84,"date":"2026-10-23","title":"2단계 가스상·연소·측정 회독 4회차","keywords":[{"k":"악취 저감·검증","subs":["하수·축산·매립지 시설별 저감대책","성능검증(입출구 동시측정)","실내부압(배기>급기) 관리"]},{"k":"연소계산","subs":["Oo=1.867C+5.6(H-O/8)+0.7S","Ao=Oo/0.21, m=21/(21-O2)","표준산소농도 보정식"]},{"k":"완전연소 3T","subs":["온도·시간·혼합 동시충족","소각시설 800~850℃·2초·O2 6%↑","2차연소실·급속냉각"]},{"k":"석탄화력 저감","subs":["3대오염물질(먼지·SOx·NOx)","저감순서: 연소조절→SCR→집진→FGD","ACI(수은), 계절관리제"]},{"k":"부대시설 관리","subs":["옥내저탄장 전환, 자연발화 관리","회처리장 습식→건식 전환","비산먼지 신고대상시설"]}],"answer":"# 2단계 회독 4회차 — Day 77~83 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 **악취 저감·검증(환경기초시설) → 연소계산 → 완전연소 3T → 석탄화력 종합저감 → 부대시설(저탄장·회처리장)**로 이어지며, 2단계 학습의 마지막 4회독이다. 연소 파트의 계산문제(공기비·발열량)와 서술문제(3T·저감기술)가 집중되어 있으므로, 계산식은 손으로 직접 써보고 서술문제는 표로 정리하는 이중 학습이 필요하다.\n\n```\n악취(환경기초시설 저감 + 검증체계)\n   ↓\n연소이론: 이론공기량 → 공기비 → 3T(완전연소)\n   ↓\n석탄화력 종합응용: 3대오염물질 + 저감설비 배치 + 미량유해물질\n   ↓\n부대시설: 저탄장(비산먼지·자연발화) + 회처리장(중금속 침출수)\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 이론산소량 | Oo=1.867C+5.6(H−O/8)+0.7S | ☐ |\n| 이론공기량 | **Ao = Oo/0.21** | ☐ |\n| 공기비(O2 역산) | **m = 21/(21−O2)** | ☐ |\n| 표준산소농도 보정 | C보정=C실측×(21−Cs)/(21−O2실측) | ☐ |\n| 소각시설 연소온도 | **800~850℃ 이상** | ☐ |\n| 소각시설 체류시간 | **2초 이상** | ☐ |\n| 소각시설 배기 O2 | **6% 이상** | ☐ |\n| 다이옥신 재합성 구간 | **300~450℃** | ☐ |\n| 급속냉각 통과시간 | 통상 **1초 이내** | ☐ |\n| 석탄화력 3대 오염물질 | 먼지·SOx·NOx | ☐ |\n| SCR 설치위치 | 집진·탈황 **이전**(고온측) | ☐ |\n| 습식탈황 효율 | **90% 이상** | ☐ |\n| 실내부압 배기/급기 비율 | **1.1~1.2배** | ☐ |\n| 방지시설 성능검증 방식 | 입·출구 **동시** 측정 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **이론산소량**: Oo = 1.867C + 5.6(H−O/8) + 0.7S\n2. **이론공기량**: Ao = Oo/0.21\n3. **공기비**: m = A/Ao = 21/(21−O2)\n4. **표준산소농도 보정**: C보정 = C실측×(21−Cs)/(21−O2실측)\n5. **저위발열량**: LHV = HHV − 600×(9H+W)\n6. **제거효율(방지시설·성능검증 공통)**: η = (Cin−Cout)/Cin×100\n7. **필요배기량(부압설계)**: 체적×환기횟수\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 저탄장 옥외 vs 옥내 | 비산먼지·발화 위험 | 밀폐 원천차단 | 관리방식 |\n| 비산재 vs 바닥재 | 집진기 포집(미세) | 연소실 하부(조립) | 발생위치 |\n| 습식 vs 건식 회처리 | 침출수 발생 | 침출수 문제 최소화 | 수분 사용 |\n| 기술진단 vs 성능검증(Day75·78) | 사업장 종합진단 | 개별시설 효율검증 | 범위 |\n| 3T 중 온도 vs NOx 저감 | 고온 지향(완전연소) | 저온 지향(NOx억제) | 상충관계 |\n| 공기비 과다 vs 과소 | 배기손실 증가 | 불완전연소(CO·매연) | 손실 종류 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 하수·축산·매립지 악취 저감대책을 비교 설명하시오. *(114~138회 다수 25점)*\n2. 이론공기량·공기비를 계산하고 배기가스 O2 농도로 공기비를 역산하시오. *(다수 회차 25점 계산형)*\n3. 완전연소의 3T 조건과 소각시설 적용기준을 설명하시오. *(114~138회 다수 25점)*\n4. 석탄화력의 3대 오염물질 저감기술과 설비배치 순서를 설명하시오. *(다수 회차 25점)*\n5. 옥내저탄장 전환과 회처리장 건식화의 환경적 의의를 설명하시오. *(최근 10점)*\n6. 악취방지시설 성능검증과 실내부압 관리의 관계를 설명하시오. *(120회 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 연소계산→3T→석탄화력→부대시설의 인과관계를 설명해본다.\n2. **계산 연습(30분)**: Ⅲ의 공기비·표준산소농도 보정식을 숫자를 바꿔가며 3회 이상 반복 계산.\n3. **수치 암기(20분)**: Ⅱ 체크리스트. 소각시설 3T 기준(800~850℃·2초·O2 6%)은 세트로 암기.\n4. **기출 구술(30분)**: Ⅴ의 6문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: 연소계산(Day80)이 어려웠다면 공기비 예제를 반복 재계산.\n\n> 2단계(가스상·연소·측정) 학습이 이번 4회독으로 마무리된다. 다음 구간(소각·SRF)은 연소이론의 응용편이므로, 이번 회독에서 3T와 공기비를 확실히 다져두어야 한다.\n\n## Ⅶ. 2단계 전체 회고\n\nDay 53(흡수)부터 Day 83(부대시설)까지가 2단계 전체로, 화학적 처리(흡수·흡착·탈질·탈황) → 생물학적·신기술 → 악취 법체계 → 연소이론·3T → 석탄화력 종합응용 → 부대시설의 순서로 구성되어 있다. 이 흐름을 하나의 이야기로 백지에 재현할 수 있다면 2단계는 사실상 완성된 것이다.\n\n2단계는 1단계(이론·확산·집진)에 비해 암기해야 할 반응식·기준수치가 압도적으로 많은 구간이었다. 3회독까지는 개별 기술의 원리 이해에 집중했다면, 이번 4회독부터는 \"종합응용문제\"(예: 석탄화력 전체 저감체계 25점 문제) 형태의 출제에 대비해 여러 Day의 내용을 하나의 답안 안에 엮어내는 훈련이 필요하다. 다음 5회독부터는 3단계(소각·SRF·유해물질) 진입 전 최종 점검의 의미도 함께 갖는다.\n","side":[{"title":"연소계산 통합 문제풀이 흐름도","body":"### 계산문제 접근 순서\n```\nStep1. 연료 원소분석값(C,H,O,S) 확인\n   ↓\nStep2. 이론산소량 Oo 계산 (1.867C+5.6(H-O/8)+0.7S)\n   ↓\nStep3. 이론공기량 Ao = Oo/0.21\n   ↓\nStep4. (측정문제라면) 배기 O2로 공기비 m = 21/(21-O2) 역산\n   ↓\nStep5. 실제공기량 A = m×Ao\n   ↓\nStep6. (필요시) 표준산소농도 보정농도 계산\n```\n\n### 자주 나오는 함정\n- 원소분율을 %가 아닌 소수로 환산하지 않고 계산하는 실수(0.80이 아닌 80을 대입)\n- 공기비 역산식의 분모(21−O2)에서 O2를 %가 아닌 소수로 잘못 대입\n- 표준산소농도 보정 시 실측 O2와 표준 O2를 반대로 대입\n\n### 계산문제 검산 요령\n계산 결과의 공기비(m)가 1보다 크게 나오지 않으면(예: 0.8 등) 계산과정에 오류가 있을 가능성이 높으며, 통상 공기비는 1.1~1.5 범위에 위치한다는 감각으로 자체 검산하는 습관을 들이면 실전에서 실수를 줄일 수 있다.\n\n### 종합응용문제 대비 연결 훈련\n\"석탄화력의 완전연소 조건과 저감기술을 설명하시오\"와 같은 통합형 문제가 출제되면, Ⅰ개요에서 연료특성(Day79)을 언급하고 Ⅱ에서 연소계산(Day80)과 3T(Day81)를 원리로 제시한 뒤 Ⅲ~Ⅳ에서 석탄화력 저감설비(Day82)로 응용하는 구조로 답안을 설계하면 여러 Day의 지식을 하나의 논리로 엮어낼 수 있다."},{"title":"암기 카드 — Day 77~83 핵심 20선","body":"1. **저탄장·회처리장** = 부대시설도 환경영향평가 대상\n2. **자연발화** = 저온산화 열축적, 적치높이·기간 제한\n3. **비산먼지 신고** = 방진벽·살수·세륜시설 필수\n4. **회처리** = 습식(침출수 우려)→건식 전환 추세\n5. **성능검증** = 입출구 동시측정, 정격부하 조건\n6. **실내부압** = 배기>급기(1.1~1.2배), 이중문\n7. **이론산소량** = Oo=1.867C+5.6(H-O/8)+0.7S\n8. **이론공기량** = Ao=Oo/0.21\n9. **공기비** = m=A/Ao=21/(21-O2)\n10. **표준산소농도 보정** = C보정=C실측×(21-Cs)/(21-O2실측)\n11. **최적공기비** = 배기손실+미연손실 최소점\n12. **3T** = 온도·시간·혼합\n13. **소각시설 기준** = 800~850℃·2초·O2 6%↑\n14. **De Novo 합성구간** = 300~450℃, 급속냉각으로 억제\n15. **2차연소실** = 1차 미연가스 완전산화\n16. **석탄화력 3대오염물질** = 먼지·SOx·NOx\n17. **저감배치순서** = 연소조절→SCR→집진→FGD\n18. **ACI** = 활성탄분사, 수은 저감\n19. **계절관리제** = 12~3월 가동률 제한\n20. **White Plume 저감** = 시각적 민원 대응(오염저감 아님)\n\n### 회독 진도 메모\n1~3회독에서 화학적·생물학적 처리와 악취를 다뤘고, 이번 4회독으로 연소이론·석탄화력·부대시설까지 2단계 전체가 마무리된다. 다음 5회독(Day 92)에서는 소각·SRF(Day85~91) 구간을 다룬다.\n\n### 2단계 전체 취약도 자가진단\n아래 5개 영역 중 3개 이상에서 막힘없이 설명이 안 된다면 해당 영역의 원래 Day를 재복습할 것을 권장한다: ① NOx·SOx 저감(Day57~64) ② VOCs·악취 방지기술(Day67~71) ③ 악취 법체계(Day72~78) ④ 연소계산·3T(Day79~81) ⑤ 석탄화력 종합응용(Day82~83)."}]},"85":{"day":85,"date":"2026-10-24","title":"소각시설 대기오염물질과 방지시설","keywords":[{"k":"소각 대기오염물질","subs":["먼지·HCl·SOx·NOx","다이옥신·중금속(Hg 등)","CO(불완전연소 지표)"]},{"k":"소각시설 방지설비","subs":["반건식+백필터(대표조합)","SCR/SNCR 탈질","활성탄분사(다이옥신·Hg)"]},{"k":"HCl·산성가스 처리","subs":["소석회 슬러리 분무(반건식)","건식 소다분사","세정탑(습식)"]},{"k":"다이옥신 종합관리","subs":["3T로 생성억제+급속냉각+활성탄흡착","TEQ 환산·기준","연속측정 대체 지표관리"]},{"k":"소각시설 종류","subs":["스토커식·유동층식·회전로식","생활폐기물·지정(의료)폐기물 구분","소각재(비산재·바닥재) 관리"]}],"answer":"# 소각시설 대기오염물질과 방지시설\n\n## Ⅰ. 개요\n\n소각시설은 폐기물 종류(생활폐기물, 사업장폐기물, 지정폐기물, 의료폐기물)에 따라 다양한 형식으로 운영되며, 연소과정에서 먼지·산성가스(HCl·SOx)·NOx뿐 아니라 다이옥신·중금속 등 유해대기오염물질을 함께 배출할 수 있어 일반 연소시설보다 강화된 종합 방지설비 체계를 요구한다. 특히 폐기물 중 염소 함유 플라스틱 등에서 유래하는 HCl과, 불완전연소·저온영역에서 재합성되는 다이옥신은 소각시설 고유의 관리 대상으로, 3T 조건 확보와 후단 방지설비의 결합이 핵심 관리전략이다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 소각시설의 주요 대기오염물질\n\n| 오염물질 | 발생 원인 | 비고 |\n|---|---|---|\n| 먼지(비산재) | 폐기물 중 불연분·회분 | 백필터로 고효율 제거 |\n| HCl | 폐기물 중 염소성분(PVC 등) 연소 | 소각시설 특유의 오염물질 |\n| SOx | 폐기물 중 황성분 | 상대적으로 화력발전보다 낮은 편 |\n| NOx | 고온연소(Thermal), 폐기물 질소성분(Fuel) | SNCR/SCR로 저감 |\n| 다이옥신류 | 불완전연소+De Novo 재합성 | 3T+급속냉각+흡착 종합관리 |\n| 중금속(Hg 등) | 폐기물 중 미량 함유 | 활성탄분사로 흡착 제거 |\n| CO | 불완전연소 지표물질 | 실시간 모니터링으로 연소상태 판단 |\n\n## Ⅲ. 소각시설 표준 방지설비 체계\n\n### 1. 대표적 방지설비 조합(반건식+백필터+활성탄+SCR)\n```\n소각로(3T 조건 확보) → 급속냉각(300~450℃ 구간 급속통과)\n   ↓\n반건식반응탑(소석회 슬러리 분무, HCl·SOx 흡수)\n   ↓\n활성탄분사(다이옥신·중금속 흡착)\n   ↓\n백필터(먼지+흡착된 활성탄·반응생성물 포집)\n   ↓\nSCR 또는 SNCR(NOx 저감)\n   ↓\n굴뚝 배출\n```\n\n### 2. 산성가스 처리방식 비교\n| 방식 | 원리 | 특징 |\n|---|---|---|\n| 습식(세정탑) | 알칼리 용액 분사·흡수 | 고효율, 폐수 발생 |\n| 반건식(Semi-dry) | 소석회 슬러리 분무+건조 | 폐수 없음, 소각시설 표준 방식 |\n| 건식(소다분사) | 분말 소다회/소석회 직접 분사 | 설비 단순, 효율은 상대적으로 낮음 |\n\n### 3. 백필터(여과집진기)의 역할\n백필터는 먼지 제거뿐 아니라 반건식반응탑에서 미반응된 소석회, 활성탄에 흡착된 다이옥신·중금속을 함께 포집하는 다중 역할을 수행하여, 소각시설에서는 전기집진기보다 백필터가 표준으로 채택되는 경우가 많다.\n\n## Ⅳ. 다이옥신 종합관리와 소각재 관리\n\n### 1. 다이옥신 3단계 관리전략\n| 단계 | 관리수단 |\n|---|---|\n| 생성억제 | 3T 조건 확보(Day81 연계), 폐기물 균질 혼합 투입 |\n| 재합성 억제 | 300~450℃ 구간 급속냉각(Quenching) |\n| 후단 제거 | 활성탄분사+백필터 흡착포집 |\n\n### 2. TEQ(독성등가환산량) 개념\n다이옥신류는 이성질체별로 독성이 크게 달라 국제독성등가계수(I-TEQ 등)를 이용해 단일 지표(TEQ)로 환산하여 기준을 관리하며, 이는 특정대기유해물질 관리에서 특수한 접근법으로 시험에 자주 인용된다.\n\n### 3. 소각재 관리\n| 구분 | 관리방안 |\n|---|---|\n| 비산재(백필터 포집분) | 중금속·다이옥신 농축 가능성, 지정폐기물로 엄격 관리 |\n| 바닥재 | 상대적으로 안정적, 재활용(성토재 등) 검토 |\n\n### 4. 소각시설과 일반 연소시설의 방지설비 차이\n일반 화력발전(Day82)이 먼지·SOx·NOx 위주의 3대 저감기술(ESP/FF·FGD·SCR)로 구성되는 반면, 소각시설은 여기에 HCl 등 산성가스 처리(반건식반응탑)와 다이옥신·중금속 흡착(활성탄분사)이 추가되어 방지설비 체계가 한층 복잡하고 다단계로 구성된다는 점이 핵심 차이다.\n\n### 5. 소각시설 운영관리와 방지설비의 상호작용\n방지설비가 아무리 고도화되어도 소각로 자체의 3T 조건이 확보되지 않으면 후단 설비의 처리 부담이 급증하여 전체 시스템의 신뢰성이 저하되므로, 연소관리(1차 방어)와 후단 방지설비(2차 방어)는 반드시
