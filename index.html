층 안정 / 상층 불안정","지표농도 최소 → 가장 이상적","일몰 후 역전 형성기"]},{"k":"Fumigation·Trapping","subs":["Fumigation: 상층안정/하층불안정 → 지표 최고농도","일출 후 역전 해소기","Trapping: 상·하 이중역전, 지속 축적"]}],"answer":"# 연기의 유동특수현상(Plume Behavior) 6가지\n\n## Ⅰ. 개요\n\n굴뚝에서 배출된 배출가스(plume)는 **대기안정도(ELR과 Γd의 관계)**에 따라 뚜렷이 다른 형태로 확산된다. 이를 **연기의 유동특수현상**이라 하며, 형태별로 지표 착지농도와 최대착지거리가 크게 달라지므로 **굴뚝높이 설계·입지 계획·민원 대응**의 기초가 된다. 기본형 3가지(Looping, Coning, Fanning)와 역전층과의 상대적 위치에 따른 3가지(Lofting, Fumigation, Trapping)로 구분한다.\n\n## Ⅱ. 기본형 3가지 — 안정도에 의한 분류\n\n### 1. 환상형(Looping, 파상형)\n- **조건**: ELR > Γd (**과단열, 절대불안정**)\n- **기상**: 맑은 여름 낮, 강한 일사, 풍속 2m/s 이하. Pasquill A~B\n- **형태**: 대규모 대류 와동(thermal)에 의해 연기가 크게 상하로 요동\n- **특징**\n  - 전체적 확산은 매우 양호하나 **순간적으로 지표에 착지**하여 국지 고농도 발생\n  - 착지지점이 시시각각 변동 → 민원 발생 원인\n  - 최대착지농도 지점이 굴뚝에 **가까움**\n- **대책**: 유효굴뚝높이 상향, 주간 고부하 운전 조정\n\n### 2. 원추형(Coning)\n- **조건**: ELR ≈ Γd (**중립**)\n- **기상**: 흐린 날, 강풍(> 6m/s), 주야 무관. Pasquill C~D\n- **형태**: 풍하방향으로 원뿔 모양으로 균일 확산\n- **특징**\n  - 수평·연직 확산이 모두 정규분포(Gaussian) → **가우시안 플룸모델 가정이 가장 잘 성립**\n  - 농도 예측 정확도가 가장 높은 조건\n  - 최대착지거리는 통상 굴뚝높이의 10~20배\n\n### 3. 부채형(Fanning)\n- **조건**: ELR < 0 (**역전, 절대안정**) 또는 강한 미단열\n- **기상**: 맑은 야간~새벽, 미풍, 접지역전. Pasquill E~F\n- **형태**: 연직확산이 억제되어 **수평으로만 부채처럼 퍼짐**\n- **특징**\n  - 지표 착지가 거의 없어 **단기적으로는 지표농도 낮음**\n  - 그러나 오염물질이 상공에 **축적**되었다가 일출 후 Fumigation으로 급강하 → 최악의 결과\n  - 상공에서 장거리 이송\n\n## Ⅲ. 역전층과의 상대 위치에 의한 3가지\n\n### 4. 지붕형(Lofting, 상승형)\n- **조건**: **하층 안정(역전) / 상층 불안정 또는 중립**, 배출구가 역전층 **위**에 위치\n- **기상**: 일몰 후 지표 복사역전이 형성되기 시작하는 시간대\n- **형태**: 연기가 위로만 확산, 아래로는 역전층에 막혀 내려오지 못함\n- **특징**: **지표 착지농도가 6가지 중 가장 낮음 → 가장 바람직한 형태**\n- **설계 시사점**: 유효굴뚝높이(He)를 **역전층 상단보다 높게** 설계하면 Lofting을 유도할 수 있음\n\n### 5. 훈증형(Fumigation)\n- **조건**: **상층 안정(역전) / 하층 불안정**, 배출구가 역전층 **아래 또는 내부**\n- **기상**: 일출 후 2~3시간, 지표부터 역전층이 해소되는 시간대\n- **형태**: 상부 역전층에 막혀 위로 못 가고, 하부 불안정으로 급격히 **하향 확산**\n- **특징**\n  - **지표 착지농도가 6가지 중 가장 높음 → 최악 조건**\n  - 지속시간 30분~2시간, 굴뚝 인근 고농도 민원의 주원인\n  - 농도식(연직 완전혼합 가정): **C = Q / (√(2π)·u·σy·hi)**  (hi ≈ He + 2σz)\n- **대책**: 굴뚝높이 상향, 배출가스 온도·유속 확보(유효고 증대), 아침 시간대 부하 조정\n\n### 6. 구속형(Trapping, 함정형)\n- **조건**: **상·하층 모두 역전**(이중역전), 배출구가 두 역전층 사이\n- **기상**: 야간 복사역전 + 상공 침강역전이 동시 발생하는 정체 고기압\n- **형태**: 상하로 갇힌 채 수평으로만 확산·축적\n- **특징**: 오염물질이 **수일간 지속 축적** → LA스모그·런던스모그형 대기오염 사건의 조건\n\n## Ⅳ. 종합 비교표\n\n| 형태 | 안정도 조건 | 발생 시간대 | 지표농도 | 확산 |\n|---|---|---|---|---|\n| Looping | ELR > Γd (불안정) | 맑은 낮 | 순간 고농도(변동) | 매우 양호 |\n| Coning | ELR ≈ Γd (중립) | 흐림·강풍 | 보통 | 양호 |\n| Fanning | ELR < 0 (역전) | 맑은 밤 | 낮음(단기) | 불량 |\n| **Lofting** | 하부 역전 / 상부 불안정 | 일몰 후 | **최저** | 상방 양호 |\n| **Fumigation** | 상부 역전 / 하부 불안정 | 일출 후 | **최고** | 하방 급확산 |\n| Trapping | 상·하 이중역전 | 정체 고기압 | 지속 고농도 | 최악 |\n\n## Ⅴ. 대기환경 관리적 적용\n\n1. **굴뚝높이 설계**: **Fumigation과 Trapping을 지배조건**으로 가정하여 최악 착지농도를 산정하고, 유효굴뚝높이가 역전층 상단을 초과하도록 설계한다.\n2. **환경영향평가**: 시간대별 안정도 출현빈도를 반영해 단기(1시간 최대) 예측 시 Fumigation 조건을 반드시 포함한다.\n3. **입지 계획**: 역전 빈발지역(분지·계곡·해안)은 Trapping 위험이 크므로 배출시설 입지를 제한하거나 총량관리를 적용한다.\n4. **운전 관리**: 아침 훈증 시간대에 고부하 운전을 피하고, 배출가스 온도(부력 상승)와 토출속도(운동량 상승)를 확보한다.\n5. **민원 대응**: 민원 발생 시각과 기상조건을 대조하여 Looping(주간 순간) 또는 Fumigation(오전)을 구분하면 원인 규명이 용이하다.\n\n## Ⅵ. 결론\n\n연기의 유동특수현상은 대기안정도와 역전층의 상대적 위치가 결정하며, **Lofting이 가장 바람직하고 Fumigation과 Trapping이 최악**의 조건이다. 실무에서는 이 6가지 형태를 정성적으로 이해하는 데 그치지 않고, 각 조건에 대응하는 농도식과 발생 빈도를 정량적으로 평가하여 **유효굴뚝높이 결정과 최대착지농도 예측**에 반영하여야 하며, 특히 역전 발생특성 조사가 선행되어야 한다.\n","side":[{"title":"Building Down Wash와 Down Draught","body":"126회 기출: \"Fumigation, Building Down Draught & Down Wash\"\n\n### 1. Building Down Wash (건물 세류)\n- **정의**: 굴뚝 인근 건물의 **후류(wake)** 영역에 배출가스가 말려들어 지표로 끌려 내려오는 현상\n- **원인**: 건물 풍하측에 생기는 저압 재순환 영역\n- **판정 기준(GEP, Good Engineering Practice 굴뚝높이)**\n  - **Hs ≥ H + 1.5L** 이면 down wash 회피\n  - H: 인접 건물 높이, L: 건물의 높이와 투영폭 중 작은 값\n  - 미국 EPA GEP 최대 인정높이 = 65m 또는 H+1.5L\n- **영향**: 지표농도 수배 상승, 근거리 고농도\n\n### 2. Stack Down Wash (굴뚝 세류)\n- **정의**: 굴뚝 자체의 후류에 배출가스가 말려 내려오는 현상\n- **판정**: **토출속도 Vs < 1.5 × 풍속 u** 일 때 발생\n- **대책**: **Vs ≥ 1.5u** 유지 (통상 Vs 15~20 m/s 이상 설계), 굴뚝 상단부 축소(cone), 풍향판 설치\n- Briggs 보정: Vs < 1.5u 이면 유효고에 h' = 2(Vs/u - 1.5)·d 만큼 감산\n\n### 3. Down Draught (하강기류)\n- 굴뚝 주변 지형(산·절벽)이나 건물군에 의해 발생하는 하강기류가 배출가스를 지표로 끌어내리는 현상\n\n### 4. 종합 대책\n1. 굴뚝높이 ≥ 주변 건물 높이의 2.5배 또는 GEP 만족\n2. 토출속도 확보 (Vs/u ≥ 1.5)\n3. **빗물유입방지 갓(rain cap) 금지** — 하향 토출 유발\n4. 배치계획 단계에서 건물·굴뚝 상대위치 검토 (풍동실험·CFD)\n\n### 건물 후류(Wake) 구조\n| 영역 | 범위 | 특징 |\n|---|---|---|\n| 공동역(Cavity) | 건물 풍하 1~3H | 재순환 와류, **농도 최대** |\n| 후류역(Wake) | 3~10H | 난류 강화, 확산 촉진 |\n| 변위역(Displacement) | 건물 전면 | 상승 유동 |\n\n### 확산모델에서의 처리\n- **PRIME 알고리즘**(AERMOD 내장): 공동역 내 균일혼합 + 후류 확산 증대를 동시 모의\n- BPIP-PRIME 전처리기로 36개 풍향별 건물 투영폭·높이 입력\n- Down Wash 미고려 시 지표농도를 **수배 과소평가**하게 되므로 반드시 적용\n\n### 실무 점검사항\n1. 굴뚝 반경 5L 이내 모든 구조물 조사(높이·폭·위치)\n2. 향후 증축 계획까지 고려\n3. 냉각탑·저장탱크 등 부속 구조물도 포함\n4. 인접 사업장 건물도 검토 대상\n"},{"title":"최대착지농도와 최대착지거리","body":"### 정의\n- **최대착지농도(Cmax)**: 지표(z=0), 플룸 중심선(y=0)에서 나타나는 최대 농도\n- **최대착지거리(Xmax)**: Cmax가 나타나는 굴뚝으로부터의 풍하거리\n\n### 유도 (σz/σy = 일정 가정)\n가우시안 지표농도식\nC(x,0,0) = (Q / π·u·σy·σz)·exp(-He²/2σz²)\n\ndC/dx = 0 조건에서\n\n**σz(at Xmax) = He / √2**\n\n이를 대입하면\n\n**Cmax = 2Q / (π·e·u·He²) × (σz/σy)**\n   ≈ **0.234 Q / (u·He²) × (σz/σy)**\n\n### 시사점\n1. **Cmax ∝ 1/He²** → **유효굴뚝높이를 2배로 하면 최대농도는 1/4로 감소**\n   → 굴뚝높이가 가장 효과적인 저감수단인 이유\n2. **Cmax ∝ 1/u** → 저풍속에서 고농도\n3. **Cmax ∝ Q** → 배출량에 비례\n4. Xmax는 안정도에 따라 변화: 불안정(A)일수록 가깝고, 안정(F)일수록 멀어짐\n   (대략 He의 5~10배(불안정) ~ 수십 km(안정))\n\n### 실무 적용\n환경영향평가에서 Cmax와 Xmax를 산정해 **최대영향예상지점**을 선정하고, 해당 지점의 예측농도를 환경기준과 비교한다.\n\n### 안정도별 Xmax 개략값 (He = 100m 기준)\n| 안정도 | σz 성장 | Xmax |\n|---|---|---|\n| A (강불안정) | 매우 빠름 | 약 0.3~0.5 km |\n| C | 빠름 | 약 1~2 km |\n| D (중립) | 보통 | 약 2~4 km |\n| E | 느림 | 약 8~15 km |\n| F (안정) | 매우 느림 | 20 km 이상 또는 미착지 |\n\n### 계산 문제 풀이 순서\n1. **He = Hs + Δh** 산정 (Briggs 식)\n2. **σz = He/√2** 계산\n3. 해당 안정도의 σz 곡선(또는 Briggs 식)에서 **역으로 Xmax** 산출\n4. 그 지점의 σy를 구해 **Cmax** 계산\n5. 단위 확인: Q[g/s], u[m/s], σ[m] → C[g/m³] → **×10⁶ 하여 µg/m³**\n\n### 실무적 시사점\n- Cmax는 굴뚝높이의 제곱에 반비례하나, **배출량 저감이 우선**이라는 원칙은 변하지 않는다\n- 굴뚝을 높이면 Cmax는 감소하지만 Xmax가 멀어져 **영향범위가 넓어지고 장거리 이송이 증가**한다\n- 따라서 GEP 상한(65m) 개념으로 \"굴뚝만 높이는 회피\"를 제도적으로 차단한다\n"},{"title":"플레어시스템(Flare System)","body":"### 정의\n석유화학·정유 공정에서 비정상 운전·긴급방출 시 발생하는 가연성 가스를 안전하게 **연소 처리**하는 설비. 120회·최근 기출.\n\n### 구성\n| 구성요소 | 기능 |\n|---|---|\n| **Knock-out Drum** | 액적 제거 (액체 낙하 화재 방지) |\n| **Liquid Seal Drum** | 역화(flash back) 방지 |\n| **Flare Stack** | 연소 및 확산 (통상 30~100m) |\n| **Pilot Burner + Igniter** | 상시 점화 유지 |\n| **Steam/Air Injection** | 매연(smoke) 억제, 연소 촉진 |\n| **Molecular Seal** | 공기 유입 차단 |\n\n### 설계 시 고려사항\n1. **복사열(Radiation)**: 지상 인체 노출 한계 통상 **4.73 kW/m²** 이하 → 높이·이격거리 결정\n2. **연소효율**: 98% 이상 (US EPA 기준: 열량 ≥ 11.2 MJ/Nm³, 출구유속 제한)\n3. **매연 억제**: Steam/Air 주입비, 발연한계(smokeless capacity)\n4. **역화 방지**: Purge gas 상시 공급 (유속 하한 유지)\n5. **소음**: 저소음 팁, 야간 기준 준수\n\n### 대기환경 측면\n- 배출물질: **NOx, CO, 미연 VOC, 매연(그을음), SO₂**(H₂S 함유 시)\n- 「대기환경보전법」상 **비산배출시설 관리대상**(정유·석유화학 업종)\n- 비정상 운전 시 순간 대량 배출 → 인근 악취·민원\n- **저감방안**: Flare Gas Recovery System(FGRS) 도입으로 회수·재사용, 발생 자체 최소화\n- 통합환경허가 시 BAT로 FGRS 및 플레어 모니터링(유량계·열량계·영상감시) 요구\n"}]},"12":{"day":12,"date":"2026-08-12","title":"유효굴뚝높이와 굴뚝설계","keywords":[{"k":"유효굴뚝높이(He)","subs":["He = Hs + Δh","Hs: 실제높이, Δh: 연기상승고","최대착지농도 ∝ 1/He²"]},{"k":"연기상승 기구","subs":["운동량 상승(momentum): Vs·d","부력 상승(buoyancy): ΔT","풍속에 반비례"]},{"k":"Δh 산정식","subs":["Briggs식(부력플럭스 F)","CONCAWE식, Holland식","안정도별 구분 적용"]},{"k":"Down Wash 방지","subs":["Stack: Vs ≥ 1.5u","Building: Hs ≥ H + 1.5L (GEP)","rain cap 금지"]},{"k":"굴뚝 설계 요소","subs":["법정 최소높이·측정공 위치","내식·내열 재질, 라이닝","항공장애표시, 구조안정성"]}],"answer":"# 유효굴뚝높이와 굴뚝설계\n\n## Ⅰ. 개요\n\n굴뚝에서 배출된 가스는 자체의 **운동량(momentum)**과 주위 대기보다 높은 온도에 의한 **부력(buoyancy)**으로 실제 굴뚝높이보다 더 높은 곳까지 상승한 후 수평 이송된다. 이때 연기 중심선이 최종적으로 도달한 높이를 **유효굴뚝높이(He, Effective Stack Height)**라 하며, 최대착지농도가 **He²에 반비례**하므로 굴뚝 설계에서 가장 중요한 인자이다.\n\n## Ⅱ. 유효굴뚝높이의 정의\n\n**He = Hs + Δh**\n\n- **Hs**: 실제 굴뚝높이(geometric stack height) [m]\n- **Δh**: 연기상승고(plume rise) [m]\n- 확산모델에서 배출원의 연직 위치로 He를 사용한다.\n\n### 최대착지농도와의 관계\n가우시안 모델에서\n\n**Cmax ≈ 0.234 · Q / (u · He²) × (σz/σy)**\n\n→ **He를 2배로 하면 Cmax는 1/4로 감소**. 굴뚝높이 상향이 가장 확실한 저감수단인 이유이며, 동시에 \"높은 굴뚝은 희석일 뿐 저감이 아니다(dilution is not the solution)\"라는 비판의 근거이기도 하다.\n\n## Ⅲ. 연기상승(Plume Rise)의 기구\n\n### 1. 운동량 상승(Momentum Rise)\n- 배출가스의 **토출속도(Vs)와 굴뚝 내경(d)**에 의한 상승\n- 운동량 플럭스 **Fm = Vs²·d²·(Ts - Ta)/(4·Ts)** 또는 Fm = Vs²·d²/4 × (ρs/ρa)\n- 배출가스 온도가 대기온도와 같을 때(등온 배출) 지배적\n\n### 2. 부력 상승(Buoyancy Rise)\n- 배출가스가 주변 공기보다 **뜨거워 밀도가 작기 때문**에 발생\n- 부력 플럭스 **F = g·Vs·d²·(Ts - Ta) / (4·Ts)**  [m⁴/s³]\n- 대부분의 연소시설(보일러·소각로)에서 **지배적 기구**\n\n### 3. 영향 인자\n\n| 인자 | Δh와의 관계 |\n|---|---|\n| 배출가스 온도(Ts) | 높을수록 증가 (부력↑) |\n| 토출속도(Vs) | 클수록 증가 (운동량↑) |\n| 굴뚝 직경(d) | 클수록 증가 |\n| **풍속(u)** | **클수록 감소** (Δh ∝ 1/u) |\n| 대기안정도 | 안정할수록 감소(부력 억제) |\n\n## Ⅳ. 연기상승고(Δh) 산정식\n\n### 1. Briggs 식 (가장 널리 사용, US EPA 표준)\n\n**(1) 불안정·중립 조건 (F ≥ 55 m⁴/s³)**\n- 최종상승고: **Δh = 38.71 · F^(3/5) / u**\n- 천이거리: xf = 119 F^(2/5)\n\n**(2) 불안정·중립 (F < 55)**\n- **Δh = 21.425 · F^(3/4) / u**\n- xf = 49 F^(5/8)\n\n**(3) 안정 조건**\n- **Δh = 2.6 · (F / (u·S))^(1/3)**\n- 여기서 안정도 매개변수 **S = (g/Ta)·(∂θ/∂z)**\n\n**(4) 무풍(u→0) 안정 조건**\n- Δh = 5.0 · F^(1/4) · S^(-3/8)\n\n### 2. Holland 식 (간이식)\n**Δh = (Vs·d/u) · [1.5 + 2.68×10⁻³ · P · d · (Ts - Ta)/Ts]**\n- P: 대기압(mb). 중립 기준이며 불안정 시 ×1.1~1.2, 안정 시 ×0.8~0.9 보정\n\n### 3. CONCAWE 식\n**Δh = 2.71 · Qh^0.5 / u^0.75**  (Qh: 배출열량 kcal/s)\n- 유럽 정유업계 실측 기반. 부력 지배 조건에 적합\n\n### 4. 적용 시 유의\n- 국내 환경영향평가에서는 AERMOD 내장 **Briggs 식**이 표준\n- 식마다 결과 편차가 크므로 사용 식과 근거를 반드시 명시\n\n## Ⅴ. 굴뚝 설계 시 고려사항\n\n### 1. 높이 결정\n| 항목 | 내용 |\n|---|---|\n| **법정 최소높이** | 「대기환경보전법 시행규칙」 배출시설별 규정, 지자체 조례 |\n| **확산 요구높이** | 예측 착지농도 ≤ 환경기준·목표농도가 되는 높이 |\n| **Building Down Wash 회피** | **Hs ≥ H + 1.5L** (GEP: H=인접건물 높이, L=건물 높이·투영폭 중 작은 값) |\n| **역전층 상단 초과** | Lofting 유도, Fumigation 회피 |\n| **항공법** | 공항 주변 장애물 제한표면, 60m 초과 시 항공장애표시등·주간표지 |\n\n### 2. 토출속도 설계\n- **Vs ≥ 1.5 u** (Stack Down Wash 방지). 통상 **15~20 m/s** 설계\n- 과도한 Vs는 송풍동력 증가 → 최적화 필요\n- **빗물받이 갓(rain cap) 설치 금지** — 하향 토출로 down wash 유발. 대신 배수구·경사 처리\n\n### 3. 구조·재질\n- **재질**: 강판(내후성강), 콘크리트, FRP. 부식성 가스는 내산 라이닝(고무·불소수지·내산벽돌)\n- **부식·응축 방지**: 배출가스 온도를 **산노점(acid dew point) 이상**으로 유지(통상 SO₃ 함유 시 130~150℃ 이상), 보온·재가열\n- **구조 안정성**: 풍하중·지진하중, 와류진동(vortex shedding) 검토 → 나선형 스트레이크(helical strake) 설치\n- **연돌효과(Stack Effect)**: 통풍력 확보를 위한 단면·높이 설계\n\n### 4. 부대설비 및 법정 요구사항\n- **측정공(Sampling port)**: 「대기오염공정시험기준」에 따라 **굴뚝 내경의 8배 이상 하류, 2배 이상 상류** 직관부에 설치(수직 굴뚝 기준). 작업대·안전난간·사다리·전원 확보\n- **TMS 설치**: 배출량 기준 해당 시 굴뚝자동측정기기 부착\n- **다중관 굴뚝(multi-flue)**: 여러 배출시설을 하나의 외통에 묶어 부지 절약 및 부력 증대\n\n## Ⅵ. 결론\n\n유효굴뚝높이는 실제 높이에 운동량·부력에 의한 연기상승고를 더한 값으로, 최대착지농도가 He²에 반비례하므로 대기질 영향 저감에 결정적이다. 다만 굴뚝높이 상향은 **국지 농도를 희석할 뿐 총 배출량을 줄이지 않으며 장거리 이송을 오히려 증가**시키므로, 방지시설에 의한 **배출량 저감이 우선**되고 굴뚝 설계는 보완적 수단으로 접근하여야 한다. 설계 시에는 Down Wash 회피(GEP, Vs ≥ 1.5u), 역전층 고도, 산노점 이상의 온도 유지, 측정공 기준 등을 종합적으로 반영하여야 한다.\n","side":[{"title":"굴뚝 측정공(Sampling Port) 설치기준","body":"### 근거\n「대기오염공정시험기준」 ES 01301 배출가스 시료채취방법\n\n### 위치 선정 원칙\n**\"가장 균일한 유속분포를 나타내는 곳\"**\n- **굴뚝 내경(D)의 8배 이상 하류(직관부)**, **2배 이상 상류**\n- 즉, 굴곡부·단면변화부에서 충분히 떨어진 직관 구간\n- 부득이한 경우 **하류 2D, 상류 0.5D 이상** 확보하고 측정점 수를 늘림\n\n### 측정점 수 (원형 굴뚝)\n| 굴뚝 직경 | 반경 구분 수 | 측정점 수 |\n|---|---|---|\n| 1m 이하 | 1 | 4 |\n| 1~2m | 2 | 8 |\n| 2~4m | 3 | 12 |\n| 4~4.5m | 4 | 16 |\n| 4.5m 초과 | 5 | 20 |\n\n### 사각 굴뚝\n단면을 등면적으로 분할(통상 1구역 ≤ 1m²)하여 각 구역 중심에서 측정. 최대 20점.\n\n### 부대 요구사항\n- 측정공 내경 **100mm 이상** 권장, 마개 설치\n- 안전한 **작업대(폭 80cm 이상)**·안전난간(높이 1.1m 이상)·사다리\n- 전원(220V) 및 조명 확보\n- 굴뚝 상부에서 측정공까지 접근로 확보\n\n### 유의사항\n와류·역류가 있는 지점, 누기(air in-leakage)가 있는 지점을 피하고, 예비측정으로 유속분포를 확인한다.\n"},{"title":"GEP 굴뚝높이(Good Engineering Practice)","body":"### 개념\n인접 건물에 의한 **Building Down Wash를 회피**하기 위해 필요한 최소 굴뚝높이. US EPA가 규정하고 국내 확산모델링에서도 준용.\n\n### 산정식\n**HGEP = H + 1.5 L**\n- **H**: 인접 건물(구조물) 높이\n- **L**: 건물의 **높이(H)와 최대 투영폭(W)** 중 **작은 값**\n\n### 적용 범위\n- 굴뚝으로부터 **5L 이내**에 있는 건물이 대상\n- 미국 EPA는 규제 목적상 **GEP 최대 인정높이를 65m**로 제한 (그 이상은 \"희석에 의한 회피\"로 간주하여 확산모델에서 인정하지 않음)\n\n### 계산 예\n건물 높이 H = 30m, 투영폭 W = 50m\n→ L = min(30, 50) = 30m\n→ HGEP = 30 + 1.5×30 = **75m**\n\n### 실무 적용\n1. 굴뚝높이 Hs < HGEP 이면 확산모델에 **Building Down Wash 알고리즘(PRIME)** 적용 필수\n2. AERMOD는 **BPIP-PRIME** 전처리기로 건물 제원을 입력\n3. 신규 설계 시 가능한 한 Hs ≥ HGEP 확보\n4. 확보 불가 시: 건물 재배치, 굴뚝 위치 변경, 토출속도 증대, 방지시설 강화로 배출농도 저감\n\n### 유의\nGEP는 \"이 이상 높이면 규제상 인정 안 함\"이라는 **상한 개념**이기도 하다. 즉 배출량 저감 없이 굴뚝만 높이는 것을 방지하는 제도적 장치이다.\n"},{"title":"연돌효과(Stack Effect)와 통풍력","body":"### 정의\n굴뚝 내부의 고온가스와 외부 대기의 **밀도차**에 의해 발생하는 자연 상승력(자연통풍력).\n\n### 통풍력 산정식\n**Z = 273 · H · (γa/(273+ta) - γg/(273+tg))**  [mmH₂O]\n\n- H: 굴뚝높이(m)\n- γa, γg: 표준상태 공기·배출가스 비중량(kgf/m³, 통상 1.293)\n- ta, tg: 외기·배출가스 온도(℃)\n\n간이식(γa ≈ γg ≈ 1.293):\n**Z ≈ 355 · H · (1/(273+ta) - 1/(273+tg))**\n\n### 영향 인자\n| 인자 | 통풍력 |\n|---|---|\n| 굴뚝높이 ↑ | 증가(비례) |\n| 배출가스 온도 ↑ | 증가 |\n| 외기온도 ↓ (겨울) | 증가 |\n| 굴뚝 내 마찰·굴곡 | 감소 |\n\n### 통풍의 종류\n1. **자연통풍**: 연돌효과만 이용. 동력 불필요, 조절 곤란\n2. **강제통풍(압입)**: 송풍기로 연소용 공기 압입. 노 내 정압\n3. **흡인통풍(유인)**: 굴뚝 앞 유인송풍기로 흡인. 노 내 부압 → 누출 방지\n4. **평형통풍**: 압입 + 흡인 병용. 대형 보일러 표준\n\n### 대기환경 의의\n- 통풍력 부족 → 불완전연소, 배출가스 역류, 실내 오염\n- **116회 기출**: \"굴뚝의 통풍력 및 산정방법\"\n- 방지시설(집진기·탈황탑) 설치 시 압력손실이 커져 자연통풍만으로는 부족 → 유인송풍기 필수\n"}]},"13":{"day":13,"date":"2026-08-13","title":"굴뚝 통풍력과 백연현상 대책","keywords":[{"k":"통풍력(Draft)","subs":["Z=273H(γa/(273+ta) - γg/(273+tg))","밀도차에 의한 자연 상승력","높이·온도차에 비례"]},{"k":"통풍방식","subs":["자연통풍 / 강제(압입)통풍","흡인(유인)통풍: 노내 부압","평형통풍: 대형 보일러 표준"]},{"k":"백연(White Plume) 발생기구","subs":["배출가스 수증기의 응축","혼합선이 포화곡선 상부 통과","습식 방지시설·저온 배출 시"]},{"k":"백연 방지대책","subs":["재가열(Reheating)","혼합희석(고온 공기 혼합)","응축·제습 후 배출"]},{"k":"청연·황연 등","subs":["청연: 미연탄화수소·유황","황연: NO₂ 과다","흑연: 매연(불완전연소)"]}],"answer":"# 굴뚝 통풍력과 백연현상 대책\n\n## Ⅰ. 개요\n\n**통풍력(Draft)**은 연소용 공기의 공급과 배출가스의 배출을 위해 필요한 압력차로, 굴뚝 내 고온가스와 외기의 밀도차에 의한 **연돌효과(Stack Effect)**가 기본이 된다. 한편 습식 방지시설이나 저온 배출 조건에서는 배출가스 중 수증기가 대기 중에서 응축하여 **백연(White Plume)**을 형성하는데, 이는 오염물질이 아님에도 시각적 불쾌감과 민원을 유발하고 시정장애·착빙 등 2차 문제를 일으켜 별도의 대책이 요구된다.\n\n## Ⅱ. 굴뚝 통풍력\n\n### 1. 원리\n굴뚝 내 고온 배출가스는 밀도가 작아 부력을 받아 상승하며, 이때 굴뚝 하부에 부압이 형성되어 연소용 공기를 흡입하는 힘이 생긴다.\n\n### 2. 산정식\n**Z = 273 · H · [ γa/(273 + ta) − γg/(273 + tg) ]**  [mmH₂O]\n- H: 굴뚝높이(m)\n- γa, γg: 표준상태 공기·배출가스 비중량(kgf/m³, 통상 1.293)\n- ta, tg: 외기온도·배출가스 온도(℃)\n\nγa ≈ γg ≈ 1.293 인 경우 간이식\n\n**Z ≈ 355 · H · [ 1/(273+ta) − 1/(273+tg) ]**\n\n### 3. 영향 인자\n\n| 인자 | 통풍력 변화 | 비고 |\n|---|---|---|\n| 굴뚝높이(H) ↑ | **증가(비례)** | 가장 직접적 |\n| 배출가스 온도(tg) ↑ | 증가 | 단, 열손실 증가 |\n| 외기온도(ta) ↓ | 증가 | 겨울철 통풍력 양호 |\n| 굴뚝 내 마찰·굴곡 | 감소 | 실통풍력 = 이론값의 80% 내외 |\n| 배출가스 밀도 ↑ | 감소 | |\n\n### 4. 통풍방식\n\n| 방식 | 원리 | 노 내 압력 | 특징 |\n|---|---|---|---|\n| **자연통풍** | 연돌효과만 이용 | 부압 | 동력 불필요, 조절 곤란, 소형에 적용 |\n| **강제(압입)통풍** | 송풍기로 연소용 공기 압입 | **정압** | 고온 공기 예열 가능, 노 밖으로 가스 누출 우려 |\n| **흡인(유인)통풍** | 굴뚝 앞 유인송풍기로 흡인 | **부압** | 누출 방지, 고온가스 통과로 송풍기 내식·내열 필요 |\n| **평형통풍** | 압입 + 흡인 병용 | 미세 부압 | 대형 보일러 표준, 정밀 제어 가능 |\n\n### 5. 방지시설과 통풍\n집진기·탈황탑·SCR 등 방지시설의 **압력손실(수백 mmH₂O)**이 통풍력을 크게 초과하므로, 실무에서는 자연통풍만으로 불가능하고 **유인송풍기(IDF)**가 반드시 필요하다.\n\n## Ⅲ. 백연현상(White Plume)\n\n### 1. 정의\n굴뚝에서 배출된 고온·다습한 배출가스가 찬 대기와 혼합·냉각되면서 **수증기가 응축하여 미세 물방울(안개)을 형성**해 흰 연기처럼 보이는 현상. 오염물질이 아니라 **수증기의 상변화**이다.\n\n### 2. 발생 기구 — 습공기선도(Psychrometric Chart) 해석\n- 배출가스 상태점(고온·고습)과 외기 상태점(저온·저습)을 잇는 **혼합선(mixing line)**을 그림\n- 이 혼합선이 **포화곡선(RH=100%)의 상부를 통과**하면 → 과포화 → **응축(백연 발생)**\n- 혼합선이 포화곡선 아래로만 지나면 → 백연 없음\n- 겨울철·야간에 외기온도가 낮고 습도가 높을수록 발생 용이\n\n### 3. 발생 조건\n- **습식 방지시설**(습식 세정기, 습식 EP, 습식 탈황(FGD), 냉각탑) 후단\n- 배출가스 온도가 낮고 수분함량이 높은 경우\n- 외기온도가 낮고(겨울) 상대습도가 높은 경우\n\n### 4. 문제점\n1. **시각적 민원** — 오염물질로 오인\n2. **시정장애**: 인근 도로 가시거리 저하 → 교통안전 위험\n3. **착빙(icing)**: 겨울철 지표·도로·구조물 결빙\n4. **낙수·부식**: 응축수 낙하로 인근 시설·농작물 피해\n5. **산성 응축수**: SO₃ 함유 시 산성 미스트 형성\n\n## Ⅳ. 백연 방지대책\n\n### 1. 재가열법(Reheating) — 가장 일반적\n배출가스를 산노점 및 포화점 이상으로 **재가열**하여 상대습도를 낮춤\n- **GGH(Gas-Gas Heater, 회전식 열교환기)**: 탈황탑 입구 고온가스의 열을 출구 저온가스로 전달 (Ljungström형)\n- **직접 재가열(버너)**: 별도 연료 사용 → 에너지비·CO₂ 증가\n- **스팀 열교환기**: 공정 폐열 활용\n- 통상 배출온도를 **80~90℃ 이상**으로 상승\n\n### 2. 혼합희석법(Mixing)\n고온·저습의 외기 또는 공정 폐열 공기를 배출가스에 혼합하여 혼합선이 포화곡선 아래를 지나도록 조정\n- 설비 간단, 그러나 **배출가스량 증가** → 굴뚝·송풍기 용량 증대\n\n### 3. 응축·제습법(Condensing)\n배출 전 냉각하여 수증기를 **미리 응축·제거**한 후 배출\n- 응축열 회수 가능(**백연저감형 열회수 시스템**)\n- 응축수 처리(수처리) 필요\n- 최근 에너지 회수와 결합한 방식으로 확대\n\n### 4. 근본적 방법\n- **건식/반건식 방지시설로 전환** (Semi-dry Reactor, 건식 EP, 백필터)\n- 수분 발생원 자체 억제\n\n### 5. 대책 비교\n\n| 방법 | 장점 | 단점 |\n|---|---|---|\n| 재가열(GGH) | 확실, 검증됨 | 설비비·차압 증가, 부식·누설 |\n| 재가열(버너) | 즉시 효과 | 연료비·CO₂·NOx 증가 |\n| 혼합희석 | 단순, 저비용 | 가스량 증가, 굴뚝 용량 증대 |\n| 응축·제습 | 열회수 가능, 오염물 동시 제거 | 초기 투자비 큼, 폐수 발생 |\n| 건식 전환 | 근본 해결 | 공정 변경, 처리효율 재검토 |\n\n## Ⅴ. 기타 착색연기\n\n| 종류 | 색 | 원인 |\n|---|---|---|\n| **백연** | 흰색 | 수증기 응축(무해) |\n| **흑연(매연)** | 검정 | 불완전연소에 의한 그을음(C) |\n| **청연** | 푸른빛 | 미연 탄화수소·황화합물의 미세 액적 |\n| **황연** | 황갈색 | **NO₂** 과다(NO₂는 적갈색), 소각·질산 공정 |\n| **적연** | 붉은색 | 산화철 미분(제철·소결) |\n\n## Ⅵ. 결론\n\n통풍력은 굴뚝높이와 배출가스-외기 온도차에 비례하나, 방지시설의 압력손실이 크므로 실무에서는 평형통풍 방식이 표준이다. 백연은 오염물질이 아닌 수증기 응축현상이지만 민원·시정장애·착빙 등 실질적 문제를 야기하므로, **재가열(GGH)·혼합희석·응축제습** 중 배출조건과 경제성을 고려해 선정하여야 한다. 특히 최근에는 백연 저감과 **폐열회수·용수 재이용**을 결합한 응축식 시스템이 탄소중립 측면에서도 유리하여 확대 적용되고 있다.\n","side":[{"title":"습공기선도(Psychrometric Chart)를 이용한 백연 판정","body":"### 선도의 구성\n- **가로축**: 건구온도(DBT, ℃)\n- **세로축**: 절대습도(kg/kg-DA)\n- **곡선**: 상대습도(RH) 곡선, 최상단이 **포화곡선(RH=100%)**\n- 사선: 습구온도, 엔탈피, 비체적\n\n### 백연 판정 절차\n1. **배출가스 상태점 A** 표시 (온도 tg, 절대습도 xg)\n2. **외기 상태점 B** 표시 (온도 ta, 절대습도 xa)\n3. A와 B를 **직선(혼합선)**으로 연결\n4. **판정**\n   - 혼합선이 **포화곡선을 넘어감** → 과포화 → **백연 발생**\n   - 혼합선이 포화곡선 아래에 머묾 → 백연 없음\n\n### 대책의 도해적 의미\n| 대책 | 선도상 변화 |\n|---|---|\n| **재가열** | A점을 오른쪽(고온)으로 이동 → 혼합선이 아래로 내려감 |\n| **혼합희석** | 고온·저습 공기와 먼저 혼합 → A점 이동 후 재작도 |\n| **응축·제습** | A점을 아래(저습)로 이동 |\n\n### 실무 활용\n- 연중 외기조건(특히 **최저 외기온도·고습도 시**)을 기준으로 최악 조건 검토\n- 필요 재가열 온도를 정량 산정하여 GGH 용량 결정\n- 백연 발생일수 예측 → 민원 대응 근거자료\n\n### 백연 발생 판정의 실무 절차\n1. 배출가스 조건 확보: 온도 tg, 수분함량(체적%), 유량\n2. **절대습도 환산**: x = 0.622 × Pw/(P − Pw)\n3. 외기 설계조건 결정 — **연중 최저기온·고습 조건**(보수적)\n4. 선도에 A(배출)·B(외기) 작도 후 혼합선 검토\n5. 포화곡선 초과 시 필요 재가열 온도 역산\n\n### 백연 저감 목표 설정\n| 수준 | 목표 |\n|---|---|\n| 완전 무백연 | 연중 100% 미발생 — 설비비 과다 |\n| **실용 수준** | 외기 0℃ 이상에서 미발생 (국내 통상) |\n| 최소 수준 | 민원 발생 시간대만 대응 |\n\n### 관련 계산 예\n배출가스 60℃·포화, 외기 0℃·RH 60% → 혼합선이 포화곡선을 크게 넘음 → 백연 발생.\n재가열로 배출온도를 90℃로 올리면 혼합선이 포화곡선 아래로 이동 → 백연 소멸.\n\n### 답안 작성 팁\n습공기선도를 **간략히 스케치**(가로 건구온도, 세로 절대습도, 포화곡선 1개)하고 A·B점과 혼합선을 표시하면 원리 이해를 명확히 보여줄 수 있다.\n"},{"title":"GGH(Gas-Gas Heater)의 구조와 문제점","body":"### 목적\n습식 탈황(FGD) 후단의 저온·포화 배출가스를 재가열하여 **백연 방지 + 부력 확보 + 부식 방지**.\n\n### 형식\n1. **회전재생식(Ljungström형)** — 가장 일반적\n   - 축열체(element)가 회전하며 고온측/저온측을 번갈아 통과\n   - 장점: 열회수율 높음(60~80%), 컴팩트\n   - **단점: 누설(leakage) 5~10%** — 미처리 가스가 처리 가스로 섞임 → SO₂ 제거효율 저하\n2. **비재생식(무누설형, MGGH)**\n   - 열매체(물·오일) 순환식 열교환기 2대\n   - 장점: **누설 없음**\n   - 단점: 설비비·부지 증가, 열매체 배관 부식\n\n### 주요 문제점과 대책\n| 문제 | 원인 | 대책 |\n|---|---|---|\n| 저온부식 | 산노점 이하 → 황산 응축 | 입구온도 상한 관리, 내산 코팅(에나멜) |\n| 폐색(clogging) | 황산암모늄((NH₄)HSO₄) 생성 | 수트블로잉, 고압수 세정, NH₃ 슬립 억제 |\n| 누설 | 씰(seal) 마모 | 씰 자동조정, 차압 관리, MGGH 채택 |\n| 차압 상승 | 폐색 누적 | 정기 세정, 차압 감시 |\n\n### 최근 동향\n탄소중립 대응으로 GGH 재가열 대신 **응축식 백연저감 + 폐열회수(열교환기 + 히트펌프)** 방식이 확대되고 있으며, 회수열은 지역난방·공정 예열에 활용된다.\n\n### GGH 열회수율과 에너지 영향\n- 회전재생식 열회수율 60~80%\n- 재가열에 필요한 열량의 상당 부분을 자체 회수하나, **압력손실(100~200 mmH₂O)**로 송풍동력이 증가\n- 직접 버너 재가열은 연료 소비로 CO₂·NOx 추가 발생 → 탄소중립 관점에서 불리\n\n### 운전관리 점검항목\n| 항목 | 주기 | 판단 기준 |\n|---|---|---|\n| 차압 | 연속 | 설계값 대비 130% 초과 시 세정 |\n| 입·출구 온도 | 연속 | 열회수율 저하 감시 |\n| 누설률 | 정기 | 트레이서 가스(SF₆) 측정 |\n| 축열체 부식·폐색 | 정기점검 | 육안·내시경 |\n\n### 대안 기술\n1. **MGGH(무누설형)**: 열매체 순환, 탈황효율 저하 없음\n2. **응축식 백연저감 + 히트펌프**: 응축열 회수하여 지역난방 공급. 용수 재이용 가능\n3. **하이브리드**: 부분 응축 + 소량 재가열로 설비·운전비 최적화\n\n최근 국내 대형 발전소·소각시설에서는 GGH 대신 **응축·열회수형**을 채택하는 사례가 증가하고 있다.\n"},{"title":"산노점(Acid Dew Point)과 저온부식","body":"### 정의\n배출가스 중 **SO₃**가 수증기와 결합해 황산(H₂SO₄) 증기를 형성하고, 이것이 응축하기 시작하는 온도.\n\n**SO₃ + H₂O → H₂SO₄(g) → (냉각) → H₂SO₄(l)**\n\n### 특징\n- 물의 이슬점(약 40~60℃)보다 **훨씬 높음**: SO₃ 농도에 따라 **90~160℃**\n- SO₃가 10ppm만 있어도 산노점이 140℃ 내외로 상승\n- SO₃는 연소 중 SO₂의 1~5%가 산화되어 생성 (과잉공기·촉매(V₂O₅)·고온에서 증가)\n\n### 저온부식(Low Temperature Corrosion)\n산노점 이하로 냉각되는 부위(공기예열기 저온단, 굴뚝 상부, 덕트)에서 황산이 응축하여 급격한 부식 발생.\n\n### 대책\n1. **온도 관리**: 배출가스 온도를 **산노점 + 10~20℃ 이상** 유지 (통상 150℃ 이상)\n2. **SO₃ 생성 억제**\n   - 저황 연료 사용, 탈황\n   - **공기비(과잉공기) 최소화** → SO₂→SO₃ 산화 억제\n   - 첨가제 주입: **MgO, Mg(OH)₂, NH₃** (SO₃ 중화)\n3. **재질**: 내산 코팅(에나멜, 불소수지), Corten강, 유리관 열교환기\n4. **설계**: 공기예열기 저온단을 교체 가능한 카세트형으로\n\n### 상충관계\n배출온도를 높이면 부식·백연은 방지되나 **열손실 증가 → 에너지효율 저하 → CO₂ 증가**. 최근에는 저온 열회수 + 내식재질 조합으로 산노점 이하 운전을 허용하는 방향으로 발전 중이다.\n"}]},"14":{"day":14,"date":"2026-08-14","title":"가우시안 플룸 확산모델","keywords":[{"k":"기본 가정","subs":["정상상태·질량보존(무반응)","농도분포 정규(Gaussian)","풍속 일정, 풍하 확산 무시"]},{"k":"기본식","subs":["C=(Q/2πuσyσz)·exp(-y²/2σy²)·exp(-(z-He)²/2σz²)","지표반사항 추가","σy,σz는 안정도·거리 함수"]},{"k":"지표농도·최대착지","subs":["σz=He/√2 에서 Cmax","Cmax≈0.234Q/(u·He²)","Cmax ∝ 1/He²"]},{"k":"혼합고 반사","subs":["σz > 1.6·zi 시 완전혼합","C = Q/(√(2π)·u·σy·zi)","다중반사항 적용"]},{"k":"적용 한계","subs":["평탄지형·근거리(<50km)","저풍속(<1m/s) 부적합","2차 생성·침적 미반영"]}],"answer":"# 가우시안 플룸 확산모델(Gaussian Plume Model)\n\n## Ⅰ. 개요\n\n**가우시안 플룸모델**은 연속적으로 배출되는 오염물질의 풍하방향 농도분포가 수평·연직으로 **정규분포(Gaussian distribution)**를 이룬다고 가정하는 정상상태 확산모델이다. 이론적 간명성과 계산 효율 덕분에 60여 년간 대기확산 예측의 표준으로 사용되어 왔으며, 국내 환경영향평가에서도 AERMOD·ISCST 등 가우시안 계열 모델이 널리 활용된다.\n\n## Ⅱ. 기본 가정\n\n1. **정상상태(Steady-state)**: 배출량 Q와 기상조건이 시간에 따라 일정\n2. **질량보존**: 화학반응·침적·분해가 없어 배출된 질량이 보존\n3. **정규분포**: y(수평)·z(연직) 방향 농도분포가 가우시안\n4. **풍속 일정**: 풍속 u가 시간·공간적으로 일정하며, 연직 평균값 사용\n5. **풍하방향 확산 무시**: 이송(advection)이 확산보다 지배적 (u가 충분히 클 때)\n6. **지표 완전반사**: 지표면에서 흡수 없이 전량 반사\n7. 연기상승(plume rise)은 별도 산정하여 He로 반영\n\n## Ⅲ. 기본식\n\n### 1. 일반식 (지표반사 포함)\n\n**C(x, y, z) = Q / (2π · u · σy · σz) × exp(−y²/2σy²) × [ exp(−(z−He)²/2σz²) + exp(−(z+He)²/2σz²) ]**\n\n- C: 농도 [g/m³ 또는 µg/m³]\n- Q: 배출률 [g/s]\n- u: 유효굴뚝높이에서의 평균풍속 [m/s]\n- σy, σz: 수평·연직 확산계수 [m] (안정도와 x의 함수)\n- He: 유효굴뚝높이 [m]\n- 우변 둘째 항이 **지표 반사(virtual source, 가상배출원)** 항\n\n### 2. 지표농도식 (z = 0)\n\n**C(x, y, 0) = Q / (π · u · σy · σz) × exp(−y²/2σy²) × exp(−He²/2σz²)**\n\n### 3. 플룸 중심선 지표농도 (y = 0, z = 0)\n\n**C(x, 0, 0) = Q / (π · u · σy · σz) × exp(−He²/2σz²)**\n\n### 4. 지표배출원(He = 0)\n\n**C = Q / (π · u · σy · σz) × exp(−y²/2σy²)**  → 지표배출은 동일 배출량에서 최고 농도\n\n## Ⅳ. 최대착지농도와 최대착지거리\n\n### 1. 유도\nC(x,0,0)를 x에 대해 미분하여 0으로 두면(σz/σy = 일정 가정)\n\n**σz(Xmax) = He / √2 ≈ 0.707 He**\n\n### 2. 최대착지농도\n\n**Cmax = 2Q / (π · e · u · He²) × (σz/σy) ≈ 0.234 · Q / (u · He²) × (σz/σy)**\n\n### 3. 시사점\n- **Cmax ∝ 1/He²** : 유효굴뚝높이 2배 → 최대농도 1/4\n- **Cmax ∝ 1/u** : 저풍속에서 최고농도\n- **Cmax ∝ Q** : 배출량에 정비례\n- **Xmax**는 불안정할수록 가깝고(수백 m), 안정할수록 멀어짐(수~수십 km)\n\n## Ⅴ. 혼합고(zi)의 처리\n\n배출가스가 상방으로 확산되다 혼합고 상단의 안정층에 도달하면 반사된다.\n\n- **σz < 0.47 zi**: 반사 없음, 기본식 적용\n- **0.47 zi ≤ σz < 1.6 zi**: **다중반사항** 적용\n  C = (Q/2πuσyσz)·exp(−y²/2σy²)·Σₙ[exp(−(z−He−2n·zi)²/2σz²) + exp(−(z+He−2n·zi)²/2σz²)]\n- **σz ≥ 1.6 zi**: 혼합층 내 **완전혼합** 가정\n  **C = Q / (√(2π) · u · σy · zi) × exp(−y²/2σy²)**\n\n## Ⅵ. 확산계수(σy, σz)\n\n- **Pasquill-Gifford 곡선** 또는 **Briggs 근사식**으로 안정도 등급(A~F)과 풍하거리 x로부터 산정\n- 도시(urban)/개활지(rural) 구분 적용\n- 예: 중립(D), 개활지 → σy = 0.08x(1+0.0001x)^(−1/2), σz = 0.06x(1+0.0015x)^(−1/2)\n\n## Ⅶ. 확장 및 응용\n\n| 조건 | 처리방법 |\n|---|---|\n| **훈증(Fumigation)** | 연직 완전혼합: C = Q/(√(2π)·u·σy·hi), hi ≈ He + 2σz |\n| **선 배출원(도로)** | 무한선원 적분: C = 2q/(√(2π)·σz·u·sinφ)·exp(−He²/2σz²), q=단위길이당 배출률 |\n| **면 배출원** | 가상거리(virtual distance)법으로 초기 σy0, σz0 부여 |\n| **장기평균농도** | 섹터평균 + 기상결합빈도(STAR) |\n| **침적·감쇠** | 지수감쇠항 exp(−λt) 또는 침적속도(Vd) 반영한 tilted plume |\n\n## Ⅷ. 적용 한계와 대안\n\n### 1. 한계\n1. **정상상태 가정** → 시간에 따라 변하는 기상·배출 반영 불가\n2. **저풍속·정온(u < 1m/s)**에서 C → ∞ 로 발산\n3. **평탄·균질 지형** 가정 → 복잡지형·해안 순환 재현 불가\n4. **근거리(수백 m ~ 50km)**에 한정. 장거리 이송 부적합\n5. **화학반응 미반영** → O₃, 2차 PM2.5 등 2차 생성물 예측 불가\n6. 건물 후류(down wash), 지형 상승효과는 별도 알고리즘 필요\n\n### 2. 대안 모델\n\n| 모델 | 특징 | 적용 |\n|---|---|---|\n| **AERMOD** | 경계층 매개변수(u\\*, w\\*, L) 기반, PRIME 건물영향 | 근거리 규제모델(권장) |\n| **CALPUFF** | 라그랑지안 퍼프, 비정상·비균질 | 장거리·복잡지형·저풍속 |\n| **CMAQ / CAMx** | 오일러리안 광화학 격자모델 | 2차 생성·광역 대기질 |\n| **CFD** | 나비에-스토크스 직접 해석 | 건물군·도시협곡 국지 |\n\n## Ⅸ. 결론\n\n가우시안 플룸모델은 명확한 물리적 가정 위에 세워진 간명한 해석해로, 최대착지농도가 유효굴뚝높이의 제곱에 반비례한다는 핵심 설계 지침을 제공한다. 다만 정상상태·평탄지형·무반응이라는 가정은 실제 대기와 괴리가 크므로, 근거리 규제 목적에는 **AERMOD**, 복잡지형·장거리에는 **CALPUFF**, 2차 오염물질에는 **CMAQ** 등을 조건에 맞게 선택·병행하여야 하며, 어떤 경우든 실측자료를 이용한 **모델 검증(Model Performance Evaluation)**이 필수적이다.\n","side":[{"title":"Fick의 확산법칙과 확산방정식","body":"### Fick의 제1법칙\n확산에 의한 물질 플럭스는 **농도경사에 비례**하고 방향은 반대이다.\n\n**J = −D · (∂C/∂x)**  [g/m²·s]\n- J: 확산 플럭스, D: 확산계수 [m²/s], ∂C/∂x: 농도경사\n\n3차원: **J = −D∇C**\n\n### Fick의 제2법칙 (연속식과 결합)\n질량보존식 ∂C/∂t = −∇·J 에 제1법칙 대입\n\n**∂C/∂t = D · ∇²C = D(∂²C/∂x² + ∂²C/∂y² + ∂²C/∂z²)**\n\n### 대기확산방정식(이송-확산식)\n분자확산 대신 **난류확산계수 K**를 사용(K-이론, gradient transport theory)하고 이송항을 추가하면\n\n**∂C/∂t + u(∂C/∂x) = ∂/∂y(Ky ∂C/∂y) + ∂/∂z(Kz ∂C/∂z) + S − R**\n\n- S: 배출항(source), R: 제거항(sink: 반응·침적)\n\n### 가우시안 해와의 관계\n정상상태(∂C/∂t=0), Ky·Kz 일정, 풍하확산 무시, 무한공간 조건에서 위 식을 풀면 **정규분포 형태의 해**가 얻어지며, 이때\n**σy² = 2Ky·x/u,  σz² = 2Kz·x/u**\n즉 가우시안 모델은 이송-확산방정식의 **해석해(analytical solution)**이다. 실제로는 K가 일정하지 않으므로 σ를 실험식(Pasquill-Gifford)으로 대체한 것이다.\n\n### K-이론(Gradient Transport Theory)의 한계\n난류 확산을 분자확산과 같은 형태(플럭스 ∝ −K∇C)로 가정하는 K-이론은\n1. **대류경계층에서 성립하지 않음** — 큰 에디가 농도경사와 무관하게 물질을 수송(역경사 수송, counter-gradient flux)\n2. 근거리(플룸이 에디보다 작을 때) 부적합\n3. K값이 위치·안정도에 따라 크게 변함\n\n→ AERMOD가 불안정 조건에서 **비대칭 이중가우시안**을 쓰는 이유이며, 대안으로 라그랑지안 입자모델·LES가 사용된다.\n\n### 통계이론(Taylor의 확산이론)\nσy² = 2 σv² T² [ t/T − 1 + exp(−t/T) ]\n- σv: 횡방향 풍속 변동 표준편차, T: 라그랑지안 시간척도\n- **단시간(t≪T)**: σy ≈ σv·t (선형 성장)\n- **장시간(t≫T)**: σy ≈ σv·√(2Tt) (√t 성장)\n\nPasquill-Gifford 곡선이 근거리에서 기울기 1, 원거리에서 0.5에 가까워지는 것이 이 이론과 부합한다.\n"},{"title":"모델 검증(Model Performance Evaluation)","body":"### 필요성\n확산모델의 예측값은 배출량·기상·확산계수의 불확실성이 누적되므로, **실측치와의 비교 검증**이 없으면 신뢰할 수 없다.\n\n### 주요 통계지표\n| 지표 | 식 | 이상값 |\n|---|---|---|\n| **FB**(Fractional Bias) | 2(C̄o − C̄p)/(C̄o + C̄p) | 0 (\\|FB\\| < 0.3 양호) |\n| **NMSE**(정규화 평균제곱오차) | (Co−Cp)²̄ / (C̄o·C̄p) | 0 (< 1.5 양호) |\n| **FAC2** | 0.5 ≤ Cp/Co ≤ 2 인 비율 | 1 (> 0.5 양호) |\n| **R**(상관계수) | — | 1 |\n| **MG / VG** | 기하평균편차·기하분산 | 1 |\n\n(Co: 관측값, Cp: 예측값)\n\n### 검증 절차\n1. 대상지역 측정망 자료 확보(1년 이상 권장)\n2. 동일 기간 모델 수행\n3. 시간별·일별·연평균 단위로 짝지어 비교\n4. 통계지표 산정 및 **Q-Q plot**, 산점도 작성\n5. 편차 원인 분석(배출인벤토리, 기상장, 배경농도)\n6. 필요 시 보정계수 적용 및 근거 명시\n\n### 실무 유의\n- 대기 확산모델은 개별 시간의 농도 재현보다 **상위 백분위 농도(예: 98 백분위)**의 재현성이 중요\n- 환경영향평가 시 모델 선정 근거·입력자료 출처·검증 결과를 반드시 기술\n\n### 규제 목적의 평가 관점\n규제모델 평가는 개별 시각의 농도 일치가 아니라 **분포의 상단(설계농도) 재현**을 본다.\n- **Q-Q plot**: 관측·예측 농도를 각각 크기순 정렬해 대응시킴 (시각 일치 불필요)\n- **RHC**(Robust Highest Concentration): 상위 농도의 안정적 추정치\n- 목표: 예측 RHC가 관측 RHC의 **0.5~2배** 범위\n\n### 불확실성의 주요 원인\n| 원인 | 기여 |\n|---|---|\n| 배출량(인벤토리) | 최대 — CAPSS 불확실성 |\n| 기상장 | 큼 — 특히 저풍속·복잡지형 |\n| 확산계수 | 중간 |\n| 배경농도 산정 | 중간 |\n| 화학변환·침적 | 2차 물질에서 큼 |\n\n### 실무 원칙\n1. 검증 결과가 나쁘면 **모델을 바꾸기 전에 입력자료부터 점검**\n2. 임의의 보정계수 적용은 지양하되, 불가피하면 근거를 명시\n3. 검증 불가(측정망 없음) 시에는 **보수적 가정**을 적용하고 그 사실을 기술\n4. 민감도 분석(배출량 ±20%, 풍속 ±1m/s)으로 결과의 강건성 제시\n"},{"title":"환경영향평가 권장 대기확산모델","body":"### 국내 체계\n「환경영향평가서등 작성 등에 관한 규정」 및 환경부 **대기질 모델링 지침**에 따라 사업 특성별로 모델을 선정한다.\n\n### 주요 권장모델\n| 모델 | 유형 | 적용 조건 |\n|---|---|---|\n| **AERMOD** | 정상 가우시안 플룸 | 평탄~완만 지형, 50km 이내, 점·면·선 배출원. **기본 권장** |\n| **ISCST3** | 가우시안 플룸(구형) | 간이 스크리닝 (현재는 AERMOD로 대체) |\n| **CALPUFF** | 라그랑지안 퍼프 | 복잡지형, 해안, 저풍속, 50km 초과 장거리 |\n| **CMAQ / CAMx** | 오일러리안 광화학 | 2차 생성(O₃·PM2.5), 광역 정책평가 |\n| **CFD** | 전산유체역학 | 건물·터널·도시협곡 국지 유동 |\n| **ADMS** | 가우시안(경계층 기반) | 유럽계 대안 |\n\n### 미국 EPA SCRAM\n**Support Center for Regulatory Atmospheric Modeling** — EPA가 규제용 대기질 모델과 관련 자료(모델 코드, 전처리기, 기상자료, 가이드라인)를 제공하는 공식 창구.\n- **Preferred/Recommended models**: AERMOD, CALPUFF(장거리), CMAQ 등\n- **117회 기출**: \"우리나라 환경영향평가 권장모델과 미국 EPA의 SCRAM\"\n\n### 선정 시 검토사항\n1. 지형 복잡도, 대상 거리, 배출원 형태\n2. 대상 물질(1차/2차)\n3. 기상자료 가용성(지상·상층)\n4. 예측 기간(단기 최대 vs 장기 평균)\n5. 모델 검증 가능성\n\n### 모델 선정 절차 (환경영향평가)\n1. 사업 유형·배출원 형태 파악 (점/면/선, 고가/지표)\n2. 대상지 지형복잡도·정온율 검토\n3. 평가 거리와 대상물질(1차/2차) 확정\n4. 후보 모델 비교표 작성 후 선정사유 기술\n5. 입력자료 출처·기간 명시\n6. 가능 시 **2개 모델 병행** 및 결과 비교\n7. 측정망 자료로 검증, 통계지표 제시\n\n### 예측 결과의 제시 요건\n| 항목 | 제시 방법 |\n|---|---|\n| 최대영향예상지점 | 위치·거리·농도 |\n| 예측농도 | 1시간·24시간·연평균 |\n| 배경농도 | 인근 측정망 실측치 |\n| **총 농도** | 예측 + 배경 → **환경기준과 비교** |\n| 등농도선도 | GIS 중첩(주거지·보호시설 표시) |\n\n### 유의사항\n- 배경농도를 누락하고 기여농도만 기준과 비교하는 것은 **중대한 오류**\n- 저감방안 적용 전·후를 각각 제시\n- 2차 생성물질(PM2.5·O₃)은 가우시안 모델로 평가 불가 → CMAQ 등 광화학 모델 또는 정성적 평가로 대체하고 그 한계를 명시\n"}]}};

<script>
/* 대기관리기술사 학습앱 v1.0 */
(function(){
'use strict';
var C = window.CURRICULUM, LS = window.LESSONS;
var KEY='amt_done_v1', KEYSET='amt_settings_v1';
var app=document.getElementById('app');
var tab='today', calYM=null, curDay=null;

/* ---------- storage ---------- */
var MEM={};
var STORE_OK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function sGet(k){ if(STORE_OK){try{return localStorage.getItem(k);}catch(e){}} return MEM[k]||null; }
function sSet(k,v){ if(STORE_OK){try{localStorage.setItem(k,v);return;}catch(e){}} MEM[k]=v; }
function loadDone(){ try{return JSON.parse(sGet(KEY))||{};}catch(e){return {};} }
function saveDone(d){ sSet(KEY,JSON.stringify(d)); }
var DONE = loadDone();

/* ---------- date utils ---------- */
function iso(d){var m=d.getMonth()+1,dy=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dy<10?'0':'')+dy;}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){return iso(new Date());}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

var DAYS=C.days, BYDATE={}, BYDAY={};
DAYS.forEach(function(d){BYDATE[d.date]=d;BYDAY[d.day]=d;});

/* 오늘에 해당하는 학습일 (범위 밖이면 가장 가까운 날) */
function currentDay(){
  var t=todayISO();
  if(BYDATE[t]) return BYDATE[t];
  if(t < C.start) return DAYS[0];
  return DAYS[DAYS.length-1];
}

/* ---------- streak ---------- */
function streak(){
  var n=0, d=new Date(), guard=0;
  // 오늘 미완료면 어제부터 센다
  if(!DONE[iso(d)]) d.setDate(d.getDate()-1);
  while(guard++<400){ if(DONE[iso(d)]){n++;d.setDate(d.getDate()-1);} else break; }
  return n;
}
function bestStreak(){
  var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
  var best=0,cur=0,prev=null;
  ks.forEach(function(k){
    if(prev && daysBetween(prev,k)===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=k;
  });
  return best;
}
function doneCount(){var n=0;for(var k in DONE){if(DONE[k])n++;}return n;}

/* ---------- markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(src){
  var lines=esc(src).split('\n'), out=[], i=0;
  function flushList(tag,items){ if(items.length){out.push('<'+tag+'>'+items.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</'+tag+'>');} }
  while(i<lines.length){
    var l=lines[i];
    // code fence
    if(/^```/.test(l)){
      var buf=[];i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out.push('<pre><code>'+buf.join('\n')+'</code></pre>'); continue;
    }
    // table
    if(/^\|/.test(l) && i+1<lines.length && /^\|[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var head=l, rows=[]; i+=2;
      while(i<lines.length && /^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){var a=r.split('|');a.shift();if(a.length&&/^\s*$/.test(a[a.length-1]))a.pop();return a.map(function(x){return inline(x.trim());});};
      var h='<tr>'+cells(head).map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
      var b=rows.map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('');
      out.push('<div class="tblwrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>');
      continue;
    }
    // heading
    var hm=l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){var lv=Math.min(hm[1].length,4);out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>');i++;continue;}
    // hr
    if(/^---+\s*$/.test(l)){out.push('<hr>');i++;continue;}
    // blockquote
    if(/^&gt;\s?/.test(l)){
      var q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^&gt;\s?/,''));i++;}
      out.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>');continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(l)){
      var oi=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){oi.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      flushList('ol',oi);continue;
    }
    // unordered list
    if(/^\s*[-*]\s+/.test(l)){
      var ui=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ui.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      flushList('ul',ui);continue;
    }
    if(/^\s*$/.test(l)){i++;continue;}
    // paragraph
    var p=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^[#|`]|^&gt;|^\s*[-*]\s|^\s*\d+\.\s|^---+\s*$/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+inline(p.join('<br>'))+'</p>');
  }
  return out.join('');
}

/* ---------- views ---------- */
function pill(d){
  if(d.kind==='review') return '<span class="badge b">회독</span>';
  if(d.kind==='final')  return '<span class="badge a">마무리</span>';
  return '<span class="badge ac">'+d.cat+'</span>';
}

function viewToday(){
  var d = curDay || currentDay();
  var L = LS[String(d.day)];
  var dleft = daysBetween(todayISO(), C.end);
  var isDone = !!DONE[d.date];
  var prog = Math.round(doneCount()/C.total*100);
  var h='';
  h+='<div class="hd"><h1>대기관리기술사</h1><div class="sub">'+d.date+' ('+d.dow+') · Day '+d.day+' / '+C.total+' · <span class="dday">시험까지 D-'+(dleft>=0?dleft:0)+'</span></div></div>';
  h+='<div class="wrap">';
  /* hero */
  h+='<div class="hero"><div class="big">🔥 '+streak()+'일</div><div class="lbl">연속 학습 중</div>';
  h+='<div class="pbar"><i style="width:'+prog+'%"></i></div>';
  h+='<div class="stats"><div><b>'+doneCount()+'</b><span>완료일</span></div><div><b>'+bestStreak()+'</b><span>최고 연속</span></div><div><b>'+prog+'%</b><span>진도율</span></div></div></div>';
  /* topic */
  h+='<div class="card"><div class="row" style="margin-bottom:8px"><div>'+pill(d)+' <span class="badge">'+d.phaseName+'</span></div>'+(isDone?'<span class="badge ok">✓ 완료</span>':'')+'</div>';
  h+='<div style="font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.3px">'+d.title+'</div></div>';

  if(!L){
    h+='<div class="card"><div class="empty">📘 이 날짜의 상세 본문은<br>ver.1.0에 아직 포함되지 않았습니다.<br><br><span class="mini">현재 Day 1~14 본문 제공<br>(다음 버전에서 확대 예정)</span></div></div>';
    h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
    h+='</div>';
    app.innerHTML=h; bindToday(d); return;
  }
  /* keywords */
  h+='<h2 class="sec">핵심 키워드 5</h2><div class="card">';
  L.keywords.forEach(function(k,idx){
    h+='<div class="kw"><b>'+(idx+1)+'. '+k.k+'</b><ul>'+k.subs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>';
  });
  h+='</div>';
  /* main answer */
  h+='<h2 class="sec">메인 답안 (A4 3장 분량)</h2>';
  h+='<details class="acc" open><summary>📝 '+L.title+'</summary><div class="inner md">'+md(L.answer)+'</div></details>';
  /* side */
  h+='<h2 class="sec">사이드 주제 ('+L.side.length+')</h2>';
  L.side.forEach(function(s,idx){
    h+='<details class="acc"><summary>'+(idx+1)+'. '+s.title+'</summary><div class="inner md">'+md(s.body)+'</div></details>';
  });
  /* actions */
  h+='<div style="height:6px"></div>';
  h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
  h+='<div style="height:9px"></div><div class="btn2">';
  h+='<button class="btn ghost" id="prev"'+(d.day<=1?' disabled':'')+'>← 이전날</button>';
  h+='<button class="btn ghost" id="next"'+(d.day>=C.total?' disabled':'')+'>다음날 →</button></div>';
  if(curDay && curDay.date!==todayISO()){
    h+='<div style="height:9px"></div><button class="btn ghost" id="goto">오늘로 돌아가기</button>';
  }
  h+='</div>';
  app.innerHTML=h; bindToday(d);
}
function bindToday(d){
  var mk=document.getElementById('mk');
  if(mk) mk.onclick=function(){
    if(DONE[d.date]){ delete DONE[d.date]; toast('완료 취소'); }
    else { DONE[d.date]=true; toast('🔥 '+streak()+'일 연속! 잘하고 있어요'); }
    saveDone(DONE); viewToday();
  };
  var p=document.getElementById('prev'), n=document.getElementById('next'), g=document.getElementById('goto');
  if(p) p.onclick=function(){curDay=BYDAY[d.day-1];window.scrollTo(0,0);viewToday();};
  if(n) n.onclick=function(){curDay=BYDAY[d.day+1];window.scrollTo(0,0);viewToday();};
  if(g) g.onclick=function(){curDay=null;window.scrollTo(0,0);viewToday();};
}

function viewCal(){
  var t=new Date();
  if(!calYM) calYM={y:t.getFullYear(),m:t.getMonth()};
  var y=calYM.y,m=calYM.m;
  var first=new Date(y,m,1), last=new Date(y,m+1,0);
  var pad=first.getDay(), n=last.getDate();
  var sD=parseISO(C.start), eD=parseISO(C.end);
  var h='';
  h+='<div class="hd"><h1>학습 캘린더</h1><div class="sub">매일 꾸준히 — 연속 '+streak()+'일 · 최고 '+bestStreak()+'일</div></div>';
  h+='<div class="wrap">';
  h+='<div class="hero"><div class="big">🔥 '+streak()+'일</div><div class="lbl">현재 연속 학습</div>'+
     '<div class="stats"><div><b>'+doneCount()+'</b><span>총 완료일</span></div><div><b>'+bestStreak()+'</b><span>최고 기록</span></div>'+
     '<div><b>'+Math.round(doneCount()/C.total*100)+'%</b><span>전체 진도</span></div></div></div>';
  h+='<div class="card">';
  h+='<div class="calhd"><button class="navb" id="pm">‹</button><b>'+y+'년 '+(m+1)+'월</b><button class="navb" id="nm">›</button></div>';
  h+='<div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>';
  h+='<div class="grid">';
  for(var i=0;i<pad;i++) h+='<div class="cell pad"></div>';
  for(var dd=1;dd<=n;dd++){
    var cur=new Date(y,m,dd), s=iso(cur), cls='cell', dot='';
    var inRange = cur>=sD && cur<=eD;
    if(!inRange) cls+=' out';
    if(DONE[s]) {cls+=' done';}
    else if(inRange && cur<t && s!==todayISO()) cls+=' miss';
    if(s===todayISO()) cls+=' today';
    if(inRange && LS[String((BYDATE[s]||{}).day)]) dot='<div class="dot"></div>';
    h+='<div class="'+cls+'" data-d="'+s+'">'+dd+dot+'</div>';
  }
  h+='</div>';
  h+='<div class="legend">'+
     '<span><i style="background:#2d9c5f"></i>학습 완료</span>'+
     '<span><i style="background:rgba(255,92,92,.25)"></i>미완료</span>'+
     '<span><i style="border:2px solid #4ea1ff;background:none"></i>오늘</span>'+
     '<span><i style="background:#4ea1ff;border-radius:50%;width:7px;height:7px"></i>본문 제공일</span></div>';
  h+='</div>';
  h+='<div class="card tight"><div class="mini">📅 날짜를 탭하면 해당 일자의 학습으로 이동합니다. 완료 체크는 학습 화면에서 하세요.</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('pm').onclick=function(){calYM={y:m===0?y-1:y,m:m===0?11:m-1};viewCal();};
  document.getElementById('nm').onclick=function(){calYM={y:m===11?y+1:y,m:m===11?0:m+1};viewCal();};
  Array.prototype.forEach.call(document.querySelectorAll('.cell[data-d]'),function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-d');
      if(BYDATE[s]){ curDay=BYDATE[s]; setTab('today'); }
      else toast('학습 기간이 아닙니다');
    };
  });
}

function viewCurr(){
  var h='';
  h+='<div class="hd"><h1>전체 커리큘럼</h1><div class="sub">'+C.start+' ~ '+C.end+' · 총 '+C.total+'일 · 완료 '+doneCount()+'일</div></div>';
  h+='<div class="wrap">';
  var lastPhase=null, open=false;
  DAYS.forEach(function(d){
    if(d.phaseName!==lastPhase){
      if(open) h+='</div>';
      h+='<div class="listcard"><div class="phase">'+d.phaseName+'</div>';
      lastPhase=d.phaseName; open=true;
    }
    var cls='item'+(DONE[d.date]?' isdone':'')+(d.date===todayISO()?' istoday':'');
    var st=DONE[d.date]?'✅':(LS[String(d.day)]?'📘':'⚪');
    h+='<div class="'+cls+'" data-day="'+d.day+'"><div class="n">D'+d.day+'</div>'+
       '<div class="t"><b>'+d.title+'</b><span>'+d.date+' ('+d.dow+') · '+d.cat+'</span></div>'+
       '<div class="st">'+st+'</div></div>';
  });
  if(open) h+='</div>';
  h+='<div class="card tight"><div class="mini">✅ 완료 · 📘 본문 제공(ver.1.0) · ⚪ 제목만 (다음 버전 확대)</div></div>';
  h+='</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.item[data-day]'),function(el){
    el.onclick=function(){curDay=BYDAY[+el.getAttribute('data-day')];setTab('today');};
  });
}

function viewStat(){
  var byPhase={}, byCat={};
  DAYS.forEach(function(d){
    byPhase[d.phaseName]=byPhase[d.phaseName]||{t:0,d:0};
    byPhase[d.phaseName].t++; if(DONE[d.date]) byPhase[d.phaseName].d++;
    byCat[d.cat]=byCat[d.cat]||{t:0,d:0};
    byCat[d.cat].t++; if(DONE[d.date]) byCat[d.cat].d++;
  });
  var dleft=daysBetween(todayISO(),C.end);
  var elapsed=daysBetween(C.start,todayISO())+1;
  var expect=Math.max(0,Math.min(elapsed,C.total));
  var h='';
  h+='<div class="hd"><h1>학습 통계</h1><div class="sub">시험까지 D-'+(dleft>=0?dleft:0)+' · 목표 60점 합격</div></div>';
  h+='<div class="wrap">';
  h+='<div class="card"><div class="row"><b>전체 진도</b><span class="badge ac">'+doneCount()+' / '+C.total+'일</span></div>'+
     '<div class="pbar" style="margin-top:10px"><i style="width:'+(doneCount()/C.total*100)+'%"></i></div>'+
     '<div class="mini" style="margin-top:9px">예정 '+expect+'일 대비 <b style="color:'+(doneCount()>=expect?'#3ddc84':'#ffb020')+'">'+
     (doneCount()>=expect?'+':'')+(doneCount()-expect)+'일</b></div></div>';
  h+='<h2 class="sec">단계별 진도</h2><div class="card">';
  Object.keys(byPhase).forEach(function(k){
    var v=byPhase[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:13px"><div class="row" style="margin-bottom:5px"><span style="font-size:13.5px;font-weight:600">'+k+'</span><span class="mini">'+v.d+'/'+v.t+'</span></div>'+
       '<div class="pbar"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">분야별 진도</h2><div class="card">';
  Object.keys(byCat).sort(function(a,b){return byCat[b].t-byCat[a].t;}).forEach(function(k){
    var v=byCat[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:11px"><div class="row" style="margin-bottom:4px"><span style="font-size:13px">'+k+'</span><span class="mini">'+v.d+'/'+v.t+' ('+p+'%)</span></div>'+
       '<div class="pbar" style="height:5px"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">데이터 관리</h2>';
  if(!STORE_OK){
    h+='<div class="card" style="border-color:#7a5a20;background:rgba(255,176,32,.08)">'+
       '<div style="font-size:13.5px;color:#ffc357;font-weight:700;margin-bottom:6px">⚠️ 저장 기능이 꺼져 있습니다</div>'+
       '<div class="mini">지금 방식으로는 앱을 닫으면 기록이 사라집니다. 아래 <b>기록 내보내기</b>로 백업하거나, README의 GitHub Pages 방법으로 설치하면 자동 저장됩니다.</div></div>';
  }
  h+='<div class="card"><div class="mini" style="margin-bottom:11px">학습 기록은 이 기기에만 저장됩니다. 기기를 바꾸기 전에 내보내기로 백업하세요.</div>'+
     '<div class="btn2"><button class="btn ghost" id="exp">기록 내보내기</button><button class="btn ghost" id="imp">기록 불러오기</button></div>'+
     '<div style="height:9px"></div><button class="btn ghost" id="rst">기록 초기화</button></div>';
  h+='<div class="card tight"><div class="mini">대기관리기술사 학습앱 <b>ver.1.0</b><br>커리큘럼 194일 · 본문 Day 1~14 수록<br>114~138회 기출 325문항 분석 기반</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('exp').onclick=function(){
    var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
    var txt=ks.join(',');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('클립보드에 복사됨 ('+ks.length+'일)');},
        function(){prompt('아래 내용을 복사해 보관하세요',txt);});
    } else prompt('아래 내용을 복사해 보관하세요',txt);
  };
  document.getElementById('imp').onclick=function(){
    var v=prompt('내보내기한 완료일 목록을 붙여넣으세요\n(예: 2026-08-01,2026-08-02)','');
    if(v===null) return;
    var n=0;
    v.split(/[,\s]+/).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)){DONE[k]=true;n++;} });
    saveDone(DONE); toast(n+'일 불러왔습니다'); viewStat();
  };
  document.getElementById('rst').onclick=function(){
    if(confirm('모든 학습 기록을 삭제할까요? 되돌릴 수 없습니다.')){DONE={};saveDone(DONE);toast('초기화되었습니다');viewStat();}
  };
}

/* ---------- toast ---------- */
var tEl=null,tTimer=null;
function toast(msg){
  if(!tEl){tEl=document.createElement('div');tEl.className='toast';document.body.appendChild(tEl);}
  tEl.textContent=msg; tEl.classList.add('on');
  clearTimeout(tTimer); tTimer=setTimeout(function(){tEl.classList.remove('on');},1900);
}

/* ---------- tabs ---------- */
function setTab(t){
  tab=t; window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-t')===t);
  });
  if(t==='today') viewToday();
  else if(t==='cal') viewCal();
  else if(t==='curr') viewCurr();
  else viewStat();
}
function initTabs(){
  var n=document.createElement('div'); n.className='tabs';
  n.innerHTML=
   '<button data-t="today" class="on"><span class="ic">📖</span>오늘의 학습</button>'+
   '<button data-t="cal"><span class="ic">🗓</span>캘린더</button>'+
   '<button data-t="curr"><span class="ic">📋</span>커리큘럼</button>'+
   '<button data-t="stat"><span class="ic">📊</span>통계</button>';
  document.body.appendChild(n);
  Array.prototype.forEach.call(n.querySelectorAll('button'),function(b){
    b.onclick=function(){ if(b.getAttribute('data-t')==='today') curDay=null; setTab(b.getAttribute('data-t')); };
  });
}
initTabs(); setTab('today');
window.__APP={md:md,streak:streak,DAYS:DAYS,LS:LS};
})();
