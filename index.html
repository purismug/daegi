도**: U=k×합성표준불확도\n\n이 7개 공식은 측정 파트 계산문제의 사실상 전부를 커버하므로, 백지에 순서대로 모두 써낼 수 있는지 지금 바로 점검해보아야 한다.\n\n## Ⅳ. 측정 파트 전체를 관통하는 3대 원리\n\n| 원리 | 설명 | 적용 사례 |\n|---|---|---|\n| 기준측정법-연속측정법 짝 구조 | 정확도 높은 기준측정법이 실시간 연속측정법을 정기 검증 | 반자동식↔TMS, 중량법↔베타선흡수법 |\n| 배출원관리-환경관리 이원구조 | 개별 배출원 감시(TMS)와 대기환경 전체 감시(측정망)가 별개 체계로 병존 | Day111~113(TMS) vs Day114(측정망) |\n| 규모별 차등관리 | 배출량 기여도가 큰 시설일수록 강화된 감시(상시) 적용 | 대형=TMS(상시), 중소형=자가측정(정기) |\n\n이 3대 원리를 이해하면, 측정 파트의 15개 Day가 단순히 나열된 지식이 아니라 하나의 정합적인 관리철학 위에 구성되어 있음을 알 수 있다.\n\n## Ⅴ. 기출 연계 통합 자가점검\n\n1. 대기오염 공정시험기준 총칙부터 TMS·CleanSYS까지 측정관리체계 전체를 설명하시오. *(다수 회차 25점 종합형)*\n2. 기준측정법과 연속자동측정법의 관계를 예시를 들어 설명하시오. *(114~138회 다수 20~25점)*\n3. 배출원관리(TMS)와 환경관리(측정망)의 차이를 비교 설명하시오. *(120회 20점)*\n4. 측정 파트의 계산공식 7개 중 3개를 선택하여 계산과정을 보이시오. *(126회 25점 계산형)*\n5. 규모별 차등관리 원칙(TMS vs 자가측정)의 정책적 타당성을 논하시오. *(최근 20점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **전체 흐름도 재구성(30분)**: Ⅰ의 흐름도를 안 보고 처음부터 그려본다.\n2. **공식 7선 완전암기 점검(30분)**: Ⅲ의 7개 공식을 순서 없이 무작위로 불러도 즉시 쓸 수 있는지 점검한다.\n3. **3대 원리 서술 연습(20분)**: Ⅳ의 3대 원리를 각각 3문장 이내로 요약 서술해본다.\n4. **통합형 기출 구술(40분)**: Ⅴ의 5문항 중 1번(종합형)을 반드시 포함하여 개요 작성 연습.\n5. **최종 취약점 목록화(20분)**: Day108·116·117 세 번의 회독을 거치고도 여전히 헷갈리는 개념을 별도로 목록화하여 시험 직전 최종 점검 리스트를 만든다.\n\n> 측정 파트는 전체 시험에서 계산형·서술형이 고르게 출제되는 고득점 전략 영역이다. 이번 종합정리를 계기로 15개 Day 전체를 하나의 체계로 완성했다면, 다음 정책 파트(Day118~)로 자신있게 넘어갈 수 있다.\n\n## Ⅶ. 측정 파트를 마무리하며\n\nDay101(총칙)에서 시작해 Day115(자가측정)까지 이어진 15일간의 학습은 \"어떻게 정확하고 신뢰할 수 있는 방법으로 대기오염을 측정할 것인가\"라는 하나의 질문에 대한 답을 체계적으로 쌓아온 과정이었다. 이 측정 파트에서 확립한 공정시험기준·정도관리·TMS·측정망에 대한 이해는, 앞으로 학습할 정책 파트(대기환경기준, 배출시설 분류 등)에서 \"왜 이런 기준이 설정되었는가\", \"이 기준을 어떻게 확인하는가\"라는 질문에 답할 수 있는 실질적 토대가 된다. 측정이라는 객관적 근거 없이는 어떠한 환경정책도 실효성을 가질 수 없다는 점에서, 이번 파트의 학습은 단순한 암기를 넘어 환경관리 전체의 근간을 이해하는 과정이었다고 할 수 있다.\n","side":[{"title":"측정 파트 전체 종합 비교 매트릭스","body":"### Day101~115 전체 구조 한눈에 보기\n| 구간 | Day | 핵심주제 |\n|---|---|---|\n| 총론 | 101 | 공정시험기준 총칙 |\n| 배출가스 | 102~104 | 측정공위치·등속흡입·먼지측정 |\n| 환경대기 | 105~107 | 측정소입지·먼지측정법·가스상분석 |\n| 회독 | 108 | 1차 복습(101~107) |\n| 신속측정 | 109 | THC/FID·FTIR·LIDAR |\n| 정도관리 | 110 | 정확도·불확도·검출한계 |\n| TMS체계 | 111~113 | TMS구성·정도검사·CleanSYS |\n| 환경관리 | 114~115 | 측정망·자가측정 |\n| 회독 | 116 | 2차 복습(109~115) |\n| 종합정리 | 117 | 전체(101~115) 통합복습(현재) |\n\n### 측정법 총정리 매트릭스(기준측정법 vs 연속측정법)\n| 대상 | 기준측정법 | 연속자동측정법 |\n|---|---|---|\n| 배출가스 먼지 | 반자동식(중량법) | TMS(광산란·베타선법 등) |\n| 환경대기 PM | 중량법 | 베타선흡수법 |\n| SO2·NOx | 흡광광도법(습식) | 자외선형광법·화학발광법 |\n\n이 매트릭스는 측정 파트 전체에서 반복되는 \"기준-연속\" 짝 구조를 한눈에 보여주므로, 종합형 문제의 답안 설계에 직접 활용할 수 있다.\n\n### 측정 파트 학습시간 배분 재점검\n15개 학습일(Day101~115) 중 계산문제 출제빈도가 특히 높은 Day는 Day103(등속계수), Day104(먼지농도), Day107(램버트-비어법칙), Day112(상대정확도)의 4개 Day로, 시험 직전 최종 점검 시에는 이 4개 Day의 계산문제를 우선적으로 재점검하는 것이 시간 대비 효율이 높은 전략이다."},{"title":"암기 카드 총정리 — 측정 파트 필수 30선","body":"1. **표준상태** = 0℃, 1기압\n2. **QA/QC** = 바탕시료+첨가회수율+숙련도시험\n3. **직관부 원칙** = 상류측 이격거리>하류측\n4. **등속계수** = 90~110% 유효범위\n5. **반자동식** = 등속흡입+여과지중량법\n6. **환경대기측정소** = 도시·도로변·배경농도·교외\n7. **중량법(환경대기)** = 최고정확도 기준측정법\n8. **베타선흡수법** = 실시간연속, 국가측정망 상시운영\n9. **PM10·PM2.5** = 절단입경 10㎛/2.5㎛\n10. **램버트-비어법칙** = A=ε·c·l\n11. **GC검출기** = FID(탄화수소)·ECD(할로겐)·TCD(범용)\n12. **자외선형광법·화학발광법** = SO2·NOx 연속측정\n13. **THC/FID** = 총탄화수소 신속측정, LDAR\n14. **FTIR** = 다성분동시분석, 개방경로원격측정\n15. **LIDAR** = 레이저산란·흡수, 광역분포\n16. **정확도·정밀도** = 참값근접성 vs 반복재현성\n17. **오차3종** = 계통·우연·과실오차\n18. **확장불확도** = U=k×합성표준불확도\n19. **LOD·LOQ** = 검출한계<정량한계(약3~3.3배)\n20. **TMS** = 굴뚝원격감시체계\n21. **TMS구성** = 측정기기부+DAS+전송장치+유량계\n22. **정도확인시험** = RA=｜TMS-기준측정법｜/기준측정법×100\n23. **편향시험** = 제로·스팬가스로 반응검증\n24. **CleanSYS** = TMS통합관리시스템\n25. **무효자료** = 정도검사부적합·점검보수·전송장애\n26. **대체자료** = 전후·유사조건·보수적산정\n27. **기본측정망** = 도시·도로변·배경농도·교외\n28. **특수측정망** = 산성강하물·광화학·중금속\n29. **자가측정** = 사업자 정기측정·기록의무\n30. **측정대행업** = 전문업체위탁, 등록제\n\n### 측정 파트 학습 완주 메모\nDay101~117(총 17일, 회독 3회 포함)의 측정 파트 학습이 이번 Day로 완료되었다. 다음 Day118부터는 정책 파트(대기환경기준, 배출시설 종별분류 등)로 전환되며, 측정에서 다진 개념적 토대 위에서 법령·기준 중심의 학습으로 이어진다.\n\n### 최종 취약도 자가진단\n위 30선 중 즉시 설명이 어려운 항목이 5개 이상이라면 해당 항목이 속한 Day를 시험 직전 반드시 재복습 목록에 포함시켜야 한다."}]},"118":{"day":118,"date":"2026-11-26","title":"대기환경기준과 환경지표","keywords":[{"k":"대기환경기준 개념","subs":["환경정책기본법상 국가목표기준","국민건강·생활환경 보호 목적","배출허용기준과는 별개 개념"]},{"k":"환경기준 설정물질","subs":["SO2,NO2,O3,CO,PM10,PM2.5,납,벤젠 등","물질별 평균시간(연간·24시간·1시간 등)","다중 시간척도 병행 설정"]},{"k":"대기환경지수(CAI)","subs":["여러 오염물질 농도를 통합지수로 환산","단계구분(좋음~매우나쁨)","국민 이해도 제고 목적"]},{"k":"환경기준과 배출기준의 관계","subs":["환경기준: 대기 중 농도의 목표수준(수용체)","배출기준: 개별시설의 배출허용 상한(배출원)","환경기준 달성을 위한 배출기준 역산 설계"]},{"k":"환경기준 평가와 정책연계","subs":["측정망(Day114) 자료로 달성여부 평가","미달성지역 대기환경관리 시행계획 수립","대기질 예보·경보와 연계"]}],"answer":"# 대기환경기준과 환경지표\n\n## Ⅰ. 개요\n\n대기환경기준은 「환경정책기본법」에 근거하여 국가가 설정한, 국민의 건강과 생활환경을 보호하기 위해 대기 중 오염물질 농도가 유지되어야 할 목표수준이다. 이는 Day102~104에서 학습한 배출허용기준(개별 배출시설이 지켜야 할 상한)과는 근본적으로 다른 개념으로, 환경기준은 \"수용체(국민이 노출되는 대기환경)\" 관점의 목표치인 반면 배출기준은 \"배출원(개별 시설)\" 관점의 규제치라는 점에서 구분된다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 대기환경기준의 설정물질과 구조\n\n### 1. 환경기준 설정물질(개념)\n| 물질 | 특징 |\n|---|---|\n| SO2, NO2, CO | 연소·산업활동 기인 대표 가스상오염물질 |\n| O3 | 광화학반응으로 2차 생성되는 오염물질 |\n| PM10, PM2.5 | 입자상물질, 건강영향 상대적으로 큼 |\n| 납(Pb), 벤젠 | 중금속·유해물질, 만성노출 영향 고려 |\n\n### 2. 다중 시간척도 설정의 이유\n대기환경기준은 물질별로 연간평균, 24시간평균, 8시간평균, 1시간평균 등 복수의 평균시간 기준을 병행 설정하는 경우가 많은데, 이는 만성노출(장기평균)과 급성노출(단기평균)이 건강에 미치는 영향이 서로 다르기 때문이다. 예를 들어 오존은 단기간 고농도 노출이 호흡기에 급성 영향을 미치므로 1시간·8시간 기준이 함께 설정되는 반면, PM2.5는 장기 누적노출의 만성영향이 중요해 연간기준이 함께 관리된다.\n\n## Ⅲ. 대기환경지수(CAI, Comprehensive Air-quality Index)\n\n### 1. 개념과 목적\n대기환경지수는 여러 오염물질의 개별 농도를 국민이 이해하기 쉬운 단일 지수(0~500 등 범위)로 통합 환산하여, \"좋음-보통-나쁨-매우나쁨\"과 같은 단계로 대기질 상태를 직관적으로 전달하는 지표이다.\n\n### 2. 산정 방식(개념)\n각 오염물질별로 농도구간을 지수구간에 대응시키는 환산표를 적용하여 물질별 지수를 계산한 후, 그 중 가장 높은(가장 나쁜) 값을 해당 지역의 대표 지수로 채택하는 최댓값 방식이 일반적으로 사용된다.\n\n### 3. CAI의 정책적 활용\nCAI는 대기질 예보·경보(고농도 미세먼지 비상저감조치 등)의 국민 전달 도구로 활용되며, Day114에서 학습한 측정망 자료가 CAI 산정의 기초자료로 사용된다는 점에서 측정과 정책이 직접 연결되는 지점이다.\n\n### 4. 통합지수 방식의 한계와 보완\n최댓값 방식의 CAI는 특정 한 물질의 농도가 유독 높을 때 전체 지수가 그 물질에 좌우되어, 다른 물질의 상대적 개선 정도가 지수에 충분히 반영되지 못하는 한계가 있으며, 이 때문에 전문가들은 CAI와 함께 개별 물질별 농도 정보도 함께 공개하여 보완적으로 해석하도록 권장하는 경우가 많다.\n\n## Ⅳ. 환경기준과 배출기준의 관계\n\n### 1. 개념 비교\n| 구분 | 대기환경기준 | 배출허용기준 |\n|---|---|---|\n| 관점 | 수용체(대기 중 농도) | 배출원(굴뚝 등 배출구 농도) |\n| 목적 | 국민건강·생활환경 보호 목표 | 개별시설의 오염물질 배출 상한 규제 |\n| 법적 근거 | 환경정책기본법 | 대기환경보전법 등 개별법 |\n| 위반시 효과 | 직접적 처벌 대상 아님(정책목표) | 위반시 행정처분 대상 |\n\n### 2. 역산적 설계 관계\n배출허용기준은 궁극적으로 대기환경기준을 달성하기 위한 수단으로 설계되며, 특정 지역의 환경기준 달성이 어려운 경우 해당 지역 배출시설에 더 강화된 배출허용기준(특별대책지역 등)을 적용하는 방식으로 정책이 연계된다.\n\n## Ⅴ. 환경기준 평가와 정책 연계\n\n### 1. 달성여부 평가\nDay114의 대기오염측정망 자료를 바탕으로 지역별·물질별 환경기준 달성여부를 정기적으로 평가하며, 이는 국가 대기질 관리정책의 성과지표로 활용된다.\n\n### 2. 미달성지역 대응\n환경기준을 지속적으로 달성하지 못하는 지역에는 대기환경관리 시행계획 수립, 배출시설 관리 강화, 계절관리제(Day93~99에서 학습한 자동차 계절관리제 등과 연계) 등 추가적인 정책수단이 투입된다.\n\n### 3. 광역-지역 단위 정책의 결합\n환경기준 달성은 개별 지자체 단독의 노력만으로 이루어지기 어려운 경우가 많아(대기오염물질의 광역적 이동성 때문에), 수도권 대기환경관리와 같이 여러 지자체가 공동으로 참여하는 광역 단위의 관리계획이 함께 수립되는 것이 일반적이다.\n\n### 3. 국제적 환경기준 비교의 의미\n국가별 대기환경기준은 각국의 산업구조, 기후조건, 정책우선순위에 따라 다소 차이가 있을 수 있으며, WHO의 권고기준과 국내 환경기준을 비교하는 것은 향후 기준 강화 방향을 논의하는 데 중요한 참고자료로 활용된다. 일반적으로 선진국일수록, 그리고 최근 개정될수록 더 엄격한 기준을 채택하는 경향이 있으며, 이는 오염물질의 건강영향에 대한 과학적 지식이 축적됨에 따라 안전역을 확대하는 방향으로 정책이 진화하고 있음을 보여준다.\n\n## Ⅵ. 결론\n\n대기환경기준은 국민건강 보호를 위한 대기질의 목표수준으로, 물질별로 다중 시간척도를 병행 설정하여 급성·만성 건강영향을 포괄적으로 관리한다. 이는 개별 배출시설을 규제하는 배출허용기준과 구분되면서도, 배출기준이 환경기준 달성을 위한 수단으로 역산 설계된다는 점에서 긴밀히 연계되어 있다. 대기환경지수(CAI)는 이러한 복잡한 환경기준 체계를 국민이 쉽게 이해할 수 있는 형태로 전달하는 소통도구로서, 측정(Day101~117)과 정책을 잇는 핵심 연결고리 역할을 한다.\n\n| 요약 | 핵심 |\n|---|---|\n| 환경기준 | 수용체 관점, 국민건강보호 목표 |\n| 배출기준 | 배출원 관점, 개별시설 규제상한 |\n| CAI | 통합지수, 국민소통 도구 |\n| 연계 | 측정망자료→기준평가→정책수립 |\n| 국제비교 | WHO권고기준 대비 지속적 강화추세 |\n","side":[{"title":"환경기준-배출기준 연계 사례와 CAI 등급표","body":"### CAI 등급 구간(개념)\n| 등급 | 의미 |\n|---|---|\n| 좋음 | 대기오염 영향이 거의 없는 수준 |\n| 보통 | 일반적인 실외활동에 지장 없는 수준 |\n| 나쁨 | 민감군에게 건강영향 가능성 있는 수준 |\n| 매우나쁨 | 모든 사람에게 건강영향 우려되는 수준 |\n\n### 특별대책지역 지정과 배출기준 강화 사례(개념)\n환경기준 미달성이 반복되는 산업단지 밀집지역 등은 특별대책지역으로 지정되어 일반지역보다 강화된 배출허용기준이 적용되거나, 총량관리제가 도입되는 등 추가규제가 부과될 수 있다.\n\n### 오존(O3) 환경기준의 특수성\n오존은 1차 배출물질이 아니라 NOx와 VOCs의 광화학반응으로 생성되는 2차 오염물질이므로, 오존 환경기준 미달성 문제는 특정 배출원 하나를 규제하는 것만으로 해결되지 않으며, NOx·VOCs 저감이라는 전구물질 관리전략이 함께 필요하다는 특수성이 있다.\n\n### 환경기준 초과 원인진단의 실무적 어려움\n특정 지역에서 환경기준이 반복 초과되는 경우, 그 원인이 지역 내 배출원 때문인지 인접 지역이나 국외에서 유입된 오염물질 때문인지를 구분하는 것이 정책 대응의 핵심 과제이며, 이를 위해 대기질 모델링과 국가배경농도측정망(Day114) 자료를 결합한 원인기여도 분석이 활용된다.\n\n### PM2.5 환경기준 강화 추이\nPM2.5는 상대적으로 최근에 환경기준이 도입된 물질로, 건강영향에 대한 과학적 근거가 축적됨에 따라 기준값이 단계적으로 강화되어 온 대표적 사례이며, 이는 환경기준이 고정불변의 값이 아니라 과학적 지식의 발전과 함께 지속적으로 재검토되는 동적인 기준임을 보여준다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 대기환경기준의 개념과 설정물질을 설명하시오. *(114~138회 다수 10~20점)*\n2. 대기환경기준과 배출허용기준의 차이를 비교 설명하시오. *(다수 회차 10~20점)*\n3. 대기환경지수(CAI)의 산정방식과 활용을 설명하시오. *(120회 10점)*\n4. 환경기준 미달성지역에 대한 정책대응을 설명하시오. *(최근 10~20점)*\n\n### 답안 작성 요령\n환경기준-배출기준 비교문제는 \"수용체 vs 배출원\"이라는 관점차이를 먼저 명확히 제시한 후, 두 기준이 어떻게 연계되는지(역산설계) 설명하는 순서로 답안을 구성하면 논리적이다.\n\n### 다음 학습 연계\nDay 119(대기오염물질·특정대기유해물질·유해성대기감시물질)에서 환경기준 설정 대상이 되는 오염물질의 법적 분류체계를 심화 학습한다.\n\n### 암기 카드 5선\n1. **대기환경기준** = 수용체관점, 국민건강보호 목표(환경정책기본법)\n2. **배출허용기준** = 배출원관점, 개별시설 규제상한\n3. **CAI** = 통합지수, 최댓값방식 산정\n4. **다중시간척도** = 급성(단기)+만성(장기) 영향 포괄\n5. **오존 특수성** = 2차오염물질, 전구물질(NOx·VOCs) 관리 필요\n\n### 답안 확장 포인트\n환경기준 문제는 \"왜 물질마다 여러 시간척도의 기준이 병행 설정되는가\"(급성-만성 건강영향의 이원적 고려)라는 배경설명을 포함하면 답안의 전문성이 높아지며, 오존과 PM2.5처럼 최근 정책적 관심이 높은 물질을 예시로 활용하면 답안의 시의성도 함께 확보할 수 있다."}]},"119":{"day":119,"date":"2026-11-27","title":"대기오염물질·특정대기유해물질·유해성대기감시물질","keywords":[{"k":"대기오염물질(일반)","subs":["대기환경보전법상 포괄적 정의","입자상물질+가스상물질","배출허용기준 관리 대상 전체"]},{"k":"특정대기유해물질","subs":["장기적 인체·환경 유해성이 큰 물질군","벤젠·다이옥신·중금속류 등 포함","별도 강화관리 대상으로 지정"]},{"k":"유해성대기감시물질","subs":["유해성 우려가 있어 감시가 필요한 물질","특정대기유해물질보다 넓은 범위","모니터링·조사 중심 관리"]},{"k":"물질 분류체계의 위계","subs":["대기오염물질(최상위, 포괄적)","⊃특정대기유해물질(강화관리)","⊃유해성대기감시물질(감시대상, 일부 중첩)"]},{"k":"관리 강도 차등","subs":["일반물질: 배출허용기준 준수","특정유해물질: 별도 저감계획·강화기준","감시물질: 실태조사·모니터링 우선"]}],"answer":"# 대기오염물질·특정대기유해물질·유해성대기감시물질\n\n## Ⅰ. 개요\n\n「대기환경보전법」은 관리 대상 오염물질을 위해도와 관리목적에 따라 여러 층위로 구분하여 규정하고 있으며, 대표적으로 대기오염물질(포괄적 일반개념), 특정대기유해물질(장기적 유해성이 큰 물질군), 유해성대기감시물질(감시가 필요한 물질군)의 세 범주가 있다. 이 세 개념은 서로 배타적이지 않고 위계적·중첩적 관계를 가지며, 물질의 위해도가 높을수록 더 강화된 관리수단이 적용된다는 원칙을 이해하는 것이 핵심이다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 대기오염물질(일반개념)\n\n### 1. 정의와 범위\n대기오염물질은 대기 중에 존재하여 사람의 건강이나 환경에 피해를 줄 수 있는 물질을 포괄적으로 지칭하는 최상위 개념으로, Day101~107에서 학습한 먼지(입자상물질)와 SO2·NOx 등 가스상물질을 모두 포함한다.\n\n### 2. 관리 방식\n일반 대기오염물질은 Day102~104(배출가스), Day118(환경기준)에서 학습한 배출허용기준과 대기환경기준 체계를 통해 관리되며, 이는 대기질 관리의 가장 기본적이고 광범위한 관리틀이다.\n\n## Ⅲ. 특정대기유해물질\n\n### 1. 정의와 지정 취지\n특정대기유해물질은 대기오염물질 중에서도 발암성, 생식독성, 만성중독성 등 장기적으로 인체와 환경에 미치는 유해성이 특별히 크다고 인정되어 별도로 지정된 물질군으로, 일반적인 배출허용기준 관리만으로는 충분히 통제하기 어렵다는 판단에서 강화된 관리가 요구된다.\n\n### 2. 대표적 특정대기유해물질(예시)\n| 물질군 | 예시 |\n|---|---|\n| 휘발성유기화합물 계열 | 벤젠 등 |\n| 유기화합물 | 다이옥신(Day89~90 연계) 등 |\n| 중금속류 | 수은(Day91 연계), 카드뮴, 납 등 |\n\n### 3. 관리 강화 방식\n특정대기유해물질을 배출하는 시설은 저감계획서 제출, 강화된 배출허용기준 적용, 정기적인 배출실태 조사 등 일반 오염물질보다 엄격한 관리절차를 거치는 경우가 많다.\n\n## Ⅳ. 유해성대기감시물질\n\n### 1. 정의와 특정대기유해물질과의 차이\n유해성대기감시물질은 대기 중 유해성이 우려되어 지속적인 모니터링(감시)이 필요하다고 판단되는 물질군으로, 특정대기유해물질보다 상대적으로 넓은 범위의 물질을 포괄하며, 아직 위해성이 완전히 규명되지 않았거나 배출량이 증가추세에 있는 신종 물질까지 포함할 수 있다.\n\n### 2. 감시 중심의 관리방식\n| 구분 | 특정대기유해물질 | 유해성대기감시물질 |\n|---|---|---|\n| 관리 초점 | 배출저감(규제 중심) | 실태파악(감시·조사 중심) |\n| 관리단계 | 이미 유해성이 확립된 물질 | 유해성 우려로 추가 조사가 필요한 물질 |\n\n### 3. 감시결과의 활용\n유해성대기감시물질 모니터링 결과 유해성이 명확히 확인되고 배출량이 유의미한 수준으로 판단되면, 향후 특정대기유해물질로 재지정되어 관리수준이 격상될 수 있다는 점에서, 감시물질 제도는 규제물질 목록을 지속적으로 갱신하는 예비단계 기능을 수행한다.\n\n## Ⅴ. 세 범주의 위계적 관계와 관리강도 차등\n\n### 1. 위계 구조\n대기오염물질(최상위 포괄개념) ⊃ 특정대기유해물질(장기 유해성 확립, 강화관리) 및 유해성대기감시물질(유해성 우려, 감시대상)의 구조로 이해할 수 있으며, 특정대기유해물질과 유해성대기감시물질은 서로 완전히 배타적이지 않고 일부 중첩될 수 있다.\n\n### 2. 관리강도 차등의 원칙\n| 범주 | 관리강도 |\n|---|---|\n| 일반 대기오염물질 | 배출허용기준 준수(기본관리) |\n| 특정대기유해물질 | 저감계획+강화기준(적극관리) |\n| 유해성대기감시물질 | 실태조사+모니터링(감시관리) |\n\n이러한 관리강도 차등은 Day115에서 학습한 \"위험기반 관리원칙\"(배출량·위해도가 클수록 강화된 관리)이 오염물질 분류체계에도 동일하게 적용된 사례로 이해할 수 있다.\n\n## Ⅵ. 물질 분류체계와 국제협약·산업정책의 연계\n\n### 1. 국제협약과의 연계\nDay91에서 학습한 미나마타협약(수은)과 같은 국제협약 대상물질은 국내법상 특정대기유해물질로도 함께 지정되어 이중의 관리체계(국제협약 이행+국내법 규제)를 받는 경우가 많으며, 이는 국제적 위해성 합의가 국내 물질분류체계에 직접 반영되는 사례로 이해할 수 있다.\n\n### 2. 산업계 대응과 대체물질 개발\n특정대기유해물질로 신규 지정되는 경우, 해당 물질을 사용하는 산업계는 대체물질 개발이나 공정개선을 통해 사용량을 저감해야 하는 부담을 안게 되며, 이 때문에 물질 지정 과정에서는 유해성 평가뿐 아니라 산업계 영향평가와 충분한 유예기간 부여가 함께 고려되는 것이 일반적이다.\n\n## Ⅶ. 결론\n\n대기오염물질·특정대기유해물질·유해성대기감시물질은 위해도와 관리목적에 따라 층위를 이루는 법적 분류체계로, 일반 오염물질은 배출허용기준으로, 유해성이 확립된 특정대기유해물질은 강화된 규제로, 유해성이 우려되는 감시물질은 지속적 모니터링으로 각각 차등 관리된다. 이 체계는 한정된 행정자원을 물질의 위해도에 비례하여 효율적으로 배분하는 원칙을 구현한 것으로, Day89~91에서 학습한 다이옥신·수은과 같은 구체적 물질들이 실제로 이러한 분류체계 속에서 어떻게 관리되는지 연결하여 이해하면 학습효과가 높아진다.\n\n| 요약 | 핵심 |\n|---|---|\n| 대기오염물질 | 최상위 포괄개념 |\n| 특정대기유해물질 | 장기유해성 확립, 강화관리(벤젠·다이옥신·중금속 등) |\n| 유해성대기감시물질 | 유해성 우려, 감시·모니터링 중심 |\n| 관리원칙 | 위해도 비례 차등관리 |\n","side":[{"title":"물질 분류체계 실무 사례","body":"### 물질 분류 전환 사례(개념)\n| 단계 | 진행 |\n|---|---|\n| 1단계 | 신종물질에 대한 유해성 우려 제기 |\n| 2단계 | 유해성대기감시물질로 지정, 모니터링 개시 |\n| 3단계 | 유해성·배출량 확인시 특정대기유해물질로 격상 |\n| 4단계 | 저감계획·강화기준 등 규제강도 상향 |\n\n### 특정대기유해물질과 자동차·선박 파트의 연계\nDay93~99에서 학습한 자동차·선박 배출가스 중 벤젠, 다환방향족탄화수소(PAHs) 등도 특정대기유해물질에 해당할 수 있어, 이동오염원 관리에서도 특정대기유해물질 저감이 중요한 정책목표로 다루어진다.\n\n### 특정대기유해물질 목록의 주기적 재검토\n과학적 연구가 축적되면서 기존에 일반물질로 관리되던 물질이 특정대기유해물질로 신규 편입되거나, 반대로 유해성 재평가를 통해 관리방식이 조정되는 경우가 있어, 물질 목록은 고정된 것이 아니라 주기적으로 재검토·갱신되는 동적 체계로 운영된다.\n\n### 사업장 배출시설의 특정대기유해물질 관리 실무\n특정대기유해물질을 배출하는 사업장은 일반적인 자가측정(Day115)보다 더 엄격한 측정주기나 항목이 요구되는 경우가 있어, 물질 분류가 실제 측정·관리 실무에도 직접적인 영향을 미친다는 점을 이해해야 한다.\n\n### 특정대기유해물질과 환경영향평가의 연계\n개발사업 인허가 과정에서 특정대기유해물질을 배출할 가능성이 있는 시설이 포함되는 경우, 환경영향평가 단계에서부터 해당 물질의 확산예측과 저감방안이 중점적으로 검토되며, 이는 환경영향평가 실무자가 물질분류체계를 정확히 이해해야 하는 실질적 이유이기도 하다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 대기오염물질·특정대기유해물질·유해성대기감시물질의 개념과 관계를 설명하시오. *(114~138회 다수 10~20점)*\n2. 특정대기유해물질의 지정취지와 관리방안을 설명하시오. *(120회 10~20점)*\n3. 유해성대기감시물질 제도의 기능을 설명하시오. *(126회 10점)*\n4. 물질 분류에 따른 관리강도 차등원칙을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n세 개념을 비교하는 문제는 반드시 벤 다이어그램식 위계관계(포괄-중첩)를 먼저 설명한 후, 각 범주별 관리방식의 차이(규제 중심 vs 감시 중심)를 서술하는 순서로 접근하면 명확하다.\n\n### 다음 학습 연계\nDay 120(배출시설 종별 분류(1~5종))에서 이번 Day의 물질 분류체계가 실제 배출시설 규모별 분류와 어떻게 연계되어 관리강도를 결정하는지 학습한다.\n\n### 암기 카드 4선\n1. **대기오염물질** = 최상위 포괄개념\n2. **특정대기유해물질** = 장기유해성 확립(벤젠·다이옥신·중금속), 강화관리\n3. **유해성대기감시물질** = 유해성우려, 감시·모니터링 중심\n4. **관리강도 차등** = 위해도에 비례한 3단계 관리(기본-적극-감시)\n\n### 답안 확장 포인트\n물질분류 문제는 단순 목록 암기보다 \"왜 3단계로 세분화하는가\"(모든 오염물질을 동일하게 규제하면 산업계 부담이 과도하고, 반대로 유해물질을 일반물질과 동일하게 관리하면 국민건강 보호에 공백이 생기기 때문)라는 정책설계의 균형논리를 함께 서술하면 심화된 답안이 된다."}]},"120":{"day":120,"date":"2026-11-28","title":"배출시설 종별 분류(1~5종)","keywords":[{"k":"종별 분류 기준","subs":["연간 오염물질 발생량 기준 구분","1종(최대)~5종(최소) 5단계","시설 규모·배출량에 따른 차등"]},{"k":"종별 관리강도 차등","subs":["1~3종: TMS 부착 등 강화관리 중심","4~5종: 자가측정 등 상대적 완화관리","종별 배출부과금·점검주기 차등"]},{"k":"허가·신고 구분","subs":["일정규모 이상: 설치허가 대상","소규모: 설치신고 대상","종별에 따른 인허가 절차 차등"]},{"k":"종별 분류와 다른 제도의 연계","subs":["TMS 부착대상(Day111)=주로 1~3종","자가측정(Day115)=4~5종 중심","특정대기유해물질(Day119) 배출시 강화"]},{"k":"종별 변경과 관리전환","subs":["생산량 증가시 상위종 전환 가능","전환시 관리의무 강화(TMS부착 등)","정기적 재산정·신고 의무"]}],"answer":"# 배출시설 종별 분류(1~5종)\n\n## Ⅰ. 개요\n\n대기배출시설은 연간 오염물질 발생량을 기준으로 1종부터 5종까지 5단계로 분류되며, 이는 Day111~115에서 학습한 TMS 부착의무, 자가측정 주기, 인허가 절차 등 거의 모든 배출시설 관리제도의 적용 기준이 되는 핵심 분류체계이다. 배출량이 클수록(1종에 가까울수록) 강화된 관리가, 배출량이 작을수록(5종에 가까울수록) 상대적으로 완화된 관리가 적용되는 규모비례 원칙이 이 분류체계의 근간을 이룬다. *(114~138회 다수 10~20점 기출)*\n\n## Ⅱ. 종별 분류 기준\n\n### 1. 분류 원칙\n| 종별 | 상대적 배출량 수준(개념) |\n|---|---|\n| 1종 | 연간 오염물질 발생량 최대 규모 |\n| 2종 | 1종보다 작은 대규모 |\n| 3종 | 중규모 |\n| 4종 | 소규모 |\n| 5종 | 연간 오염물질 발생량 최소 규모 |\n\n정확한 종별 구분의 수치 기준(톤/년 등)은 관계법령 시행령에서 규정하고 있으며, 답안 작성 시에는 \"연간 오염물질 발생량을 기준으로 1종에서 5종까지 5단계로 구분되며, 1종이 가장 큰 규모\"라는 상대적 구조를 정확히 서술하는 것이 핵심이다.\n\n### 2. 오염물질 발생량 산정 방식\n종별 분류의 기준이 되는 오염물질 발생량은 원료 사용량, 시설 규모, 방지시설 설치 전 배출농도 등을 토대로 산정되며, 이는 방지시설을 거친 후의 실제 배출량이 아니라 방지시설 설치 전 잠재적 발생량을 기준으로 한다는 점이 실무상 중요한 특징이다.\n\n## Ⅲ. 종별 관리강도 차등\n\n### 1. 종별-관리제도 연계표\n| 종별 | TMS 부착(Day111) | 자가측정(Day115) | 관리강도 |\n|---|---|---|---|\n| 1~2종 | 원칙적 부착대상 | 병행(TMS 미설치 물질) | 강화관리(상시감시) |\n| 3종 | 물질·규모에 따라 부착대상 확대 추세 | 병행 | 강화관리로 전환 중 |\n| 4~5종 | 통상 미대상 | 정기 자가측정 중심 | 상대적 완화관리 |\n\n### 2. 배출부과금과 점검주기 차등\n종별에 따라 배출부과금 산정방식(기본부과금·초과부과금)의 적용범위나, 관할기관의 정기점검 주기도 차등화되는 경우가 많아, 1~2종 시설은 상대적으로 빈번한 현장점검의 대상이 된다.\n\n## Ⅳ. 허가·신고 구분\n\n### 1. 인허가 절차 차등\n| 구분 | 대상(개념) | 절차 |\n|---|---|---|\n| 설치허가 | 일정규모 이상(통상 1~3종 등 대규모) | 사전 심사를 거친 허가 절차 |\n| 설치신고 | 상대적 소규모(통상 4~5종 등) | 신고 절차(허가보다 간소) |\n\n배출량이 큰 시설일수록 설치 전 단계에서부터 더 엄격한 심사(허가)를 거치도록 하는 것은, 대규모 시설의 잠재적 환경영향이 크다는 점을 사전에 통제하기 위한 정책설계로 이해할 수 있다.\n\n### 2. 환경영향평가와의 연계\n대규모 배출시설(1~2종 등)을 포함하는 사업은 개발사업의 규모에 따라 환경영향평가 대상사업에 해당할 수 있으며, 이 경우 대기질 영향예측·저감방안이 환경영향평가서에 포함되어 사전 검토된다는 점에서 배출시설 종별 분류가 환경영향평가 실무와도 연계된다.\n\n### 3. 인허가 절차상 협의기관의 차이\n설치허가 대상 시설은 통상 환경부 또는 광역지자체가, 설치신고 대상 시설은 기초지자체가 각각 소관기관이 되는 경우가 많아, 종별 분류가 단순한 관리강도 차등을 넘어 실제 인허가 절차의 소관기관 자체를 결정하는 실무적 의미도 가진다.\n\n## Ⅴ. 종별 분류와 다른 제도의 종합적 연계, 그리고 종별 변경\n\n### 1. 물질 분류(Day119)와의 결합 관리\n특정대기유해물질(Day119)을 배출하는 시설은 동일한 종별이라도 일반물질만 배출하는 시설보다 더 강화된 관리(저감계획 제출 등)를 받을 수 있어, 종별 분류(시설규모)와 물질 분류(위해도)가 함께 작용하여 최종 관리강도를 결정하는 구조를 이룬다.\n\n### 2. 종별 변경과 관리전환\n사업장의 생산량 증가, 신규 설비 도입 등으로 오염물질 발생량이 증가하면 상위 종으로 재분류될 수 있으며, 이 경우 TMS 부착의무 등 강화된 관리의무가 새로 부과되므로 사업자는 정기적으로 배출량을 재산정하여 종별 변경사항을 신고해야 한다.\n\n### 3. 종별 분류와 환경영향평가·해양이용영향평가 실무 연계\n개발사업 인허가 검토 시 사업계획에 포함된 배출시설의 예상 종별을 사전에 파악하는 것은, 해당 사업이 어떤 수준의 대기질 관리의무(TMS 부착 여부, 배출허용기준 강도)를 부담하게 될지를 가늠하는 핵심 단서가 되며, 이는 환경영향평가서 작성 시 대기질 영향예측의 전제조건을 설정하는 데도 직접적으로 활용된다.\n\n## Ⅵ. 결론\n\n배출시설 종별 분류(1~5종)는 연간 오염물질 발생량을 기준으로 시설을 5단계로 구분하여, TMS 부착의무(Day111), 자가측정 주기(Day115), 인허가 절차, 배출부과금 등 대기오염 관리제도 전반의 적용기준으로 기능하는 핵심 분류체계이다. 이는 Day119에서 학습한 물질 분류(위해도 기준)와 결합하여, 시설규모와 물질위해도라는 두 축을 종합적으로 고려한 정교한 차등관리 체계를 완성한다. Day118(환경기준)부터 Day120(종별분류)까지의 학습을 통해, 대기오염 관리는 \"환경기준(목표)→물질분류(위해도)→시설종별(규모)\"이라는 세 층위가 유기적으로 결합되어 작동한다는 것을 이해할 수 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 종별 구분 | 연간 오염물질 발생량 기준 1~5종 |\n| 관리강도 | 1종(최대)→강화관리, 5종(최소)→완화관리 |\n| 인허가 | 대규모=허가, 소규모=신고 |\n| 종합연계 | 시설종별(규모)+물질분류(위해도)=최종 관리강도 |\n","side":[{"title":"종별 분류 실무 사례와 관리체계 종합","body":"### 종별 분류 관련 실무 시나리오(개념)\n| 상황 | 대응 |\n|---|---|\n| 신규시설 설치계획 수립 | 예상 오염물질발생량 산정→종별 예측→허가/신고 결정 |\n| 생산량 증대(증설) | 발생량 재산정→상위종 전환 여부 검토→신고 |\n| 특정대기유해물질 신규 취급 | 종별과 무관하게 저감계획 등 추가의무 검토 |\n\n### 종별 분류와 방지시설 설계의 연계\n종별이 높은(배출량이 큰) 시설일수록 요구되는 방지시설의 처리효율과 여유용량 기준도 함께 강화되는 경향이 있어, 시설 설계단계에서부터 예상 종별을 고려한 방지시설 규모 산정이 이루어지는 것이 실무적으로 바람직하다.\n\n### 정책 파트(Day118~120) 통합 재정리\n| Day | 핵심 개념 | 관점 |\n|---|---|---|\n| 118 | 대기환경기준 | 목표(수용체 기준 대기질 목표) |\n| 119 | 물질 분류체계 | 위해도(물질별 유해성 등급) |\n| 120 | 시설 종별 분류 | 규모(시설별 배출량 등급) |\n\n이 세 Day를 종합하면, 대기오염 관리체계는 \"무엇을 목표로(환경기준), 어떤 물질을, 어떤 규모의 시설에서 관리할 것인가\"라는 질문에 체계적으로 답하는 구조임을 알 수 있으며, 이는 측정 파트(Day101~117)에서 확립한 방법론이 실제로 적용되는 정책적 틀이기도 하다.\n\n### 종별 분류 관련 행정처분 강도 차등\n동일한 배출허용기준 초과행위라도 1~2종과 같은 대규모 시설의 위반은 4~5종 소규모 시설의 위반보다 사회적 영향이 크다고 판단되어, 행정처분 양정(과징금 산정 등)에서 시설 종별이 가중·감경 요소로 고려되는 경우가 있다는 점도 실무적으로 알아둘 필요가 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 배출시설 종별 분류(1~5종) 기준과 관리강도 차등을 설명하시오. *(114~138회 다수 10~20점)*\n2. 종별에 따른 설치허가·신고 절차의 차이를 설명하시오. *(120회 10점)*\n3. 종별 분류가 TMS·자가측정 적용과 어떻게 연계되는지 설명하시오. *(126회 20점)*\n4. 시설종별 분류와 물질분류(특정대기유해물질)의 종합적 관리방식을 설명하시오. *(최근 20점)*\n\n### 답안 작성 요령\n종별 분류 문제는 정확한 수치기준보다 \"규모비례 관리원칙\"(배출량이 클수록 강화관리)이라는 방향성을 명확히 제시하고, 이를 TMS·자가측정·인허가 등 구체적 제도와 연계하여 서술하는 것이 핵심 채점포인트이다.\n\n### 측정 파트~정책 파트 통합 학습 마무리\nDay101부터 Day120까지 이어진 측정·정책 파트 학습을 통해, \"어떻게 측정하고(측정방법론), 무엇을 목표로 하며(환경기준), 어떤 물질을(물질분류), 어떤 규모의 시설에서(종별분류) 관리하는가\"라는 대기오염 관리체계의 전체 그림을 완성했다. 다음 학습 구간(Day121~)부터는 이 토대 위에서 더 세부적인 인허가·방지시설·법령 주제로 심화된다.\n\n### 암기 카드 5선\n1. **종별분류** = 연간 오염물질발생량 기준 1~5종(1종 최대)\n2. **관리강도** = 종별 낮을수록(1종에 가까울수록) 강화관리\n3. **인허가** = 대규모=허가, 소규모=신고\n4. **TMS·자가측정 연계** = 1~3종 중심 TMS, 4~5종 중심 자가측정\n5. **종합관리** = 시설종별(규모)+물질분류(위해도) 결합 적용"}]}};

var SUP='⁰¹²³⁴⁵⁶⁷⁸⁹', SUB='₀₁₂₃₄₅₆₇₈₉';
function supNum(s){ return s.split('').map(function(c){return SUP.indexOf(c);}).join(''); }
function subNum(s){ return s.split('').map(function(c){return SUB.indexOf(c);}).join(''); }

function sym(t){
  for(var i=0;i<SYM.length;i++) t = t.replace(SYM[i][0], SYM[i][1]);
  // 최종 정리: 남은 마크다운·수학기호 제거
  t = t.replace(/u\s*\*+/g,'유 스타').replace(/w\s*\*+/g,'더블유 스타');
  t = t.replace(/\|/g,' ').replace(/\*/g,'');
  t = t.replace(/\s+/g,' ');
  return t;
}

function inlineClean(t){
  return t.replace(/\*\*([^*]+)\*\*/g,'$1')
          .replace(/\*([^*\n]+)\*/g,'$1')
          .replace(/`([^`]+)`/g,'$1')
          .replace(/\\/g,'')
          .replace(/\s+/g,' ').trim();
}

/* 마크다운 → 읽기용 문장 배열 */
function toSpeech(md){
  var lines = md.split('\n'), out = [], i = 0;
  function push(s){
    s = sym(inlineClean(s));
    s = s.replace(/\s+/g,' ').replace(/^[\s.,·-]+/,'').trim();
    if(s.length > 1) out.push(s);
  }
  while(i < lines.length){
    var l = lines[i];
    if(/^```/.test(l)){                        // 코드블록(흐름도) — 건너뜀
      i++; while(i<lines.length && !/^```/.test(lines[i])) i++;
      i++; continue;
    }
    if(/^\|/.test(l) && i+1<lines.length && /^\|[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var cells = function(r){
        var a = r.split('|'); a.shift();
        if(a.length && /^\s*$/.test(a[a.length-1])) a.pop();
        return a.map(function(x){ return inlineClean(x); });
      };
      var head = cells(l); i += 2;
      var rows = [];
      while(i<lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      rows.forEach(function(r){
        if(!r.length) return;
        var first = r[0];
        if(!first) return;
        var parts = [];
        for(var k=1;k<r.length;k++){
          var v = r[k];
          if(!v || v==='-' || v==='—') continue;
          var h = head[k] || '';
          parts.push(h ? (h + ' ' + v) : v);
        }
        push(parts.length ? (first + ', ' + parts.join(', ') + '.') : (first + '.'));
      });
      continue;
    }
    var hm = l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ push(hm[2] + '.'); i++; continue; }
    if(/^---+\s*$/.test(l)){ i++; continue; }
    if(/^>\s?/.test(l)){ push(l.replace(/^>\s?/,'')); i++; continue; }
    if(/^\s*\d+\.\s+/.test(l)){ push(l.replace(/^\s*(\d+)\.\s+/,'$1. ')); i++; continue; }
    if(/^\s*[-*]\s+/.test(l)){ push(l.replace(/^\s*[-*]\s+/,'')); i++; continue; }
    if(/^\s*$/.test(l)){ i++; continue; }
    push(l); i++;
  }
  // 긴 문장 분할 (안드로이드 TTS 안정성)
  var fin = [];
  out.forEach(function(s){
    if(s.length <= 170){ fin.push(s); return; }
    var buf = '';
    s.split(/(?<=[.。!?])\s+|(?<=다)\s+(?=[가-힣])|,\s+/).forEach(function(p){
      if((buf + p).length > 170 && buf){ fin.push(buf.trim()); buf = ''; }
      buf += p + ' ';
    });
    if(buf.trim()) fin.push(buf.trim());
  });
  return fin;
}

/* 하루 분량 전체를 재생 큐로 */
function buildQueue(L){
  var q = [];
  q.push({sec:'제목', t:'오늘의 주제. ' + sym(L.title) + '.'});
  q.push({sec:'키워드', t:'핵심 키워드 5가지입니다.'});
  L.keywords.forEach(function(k,i){
    q.push({sec:'키워드', t:(i+1) + '. ' + sym(inlineClean(k.k)) + '. ' + k.subs.map(function(s){return sym(inlineClean(s));}).join(', ') + '.'});
  });
  q.push({sec:'답안', t:'이제 메인 답안입니다.'});
  toSpeech(L.answer).forEach(function(t){ q.push({sec:'답안', t:t}); });
  L.side.forEach(function(s,i){
    q.push({sec:'사이드'+(i+1), t:'사이드 주제 ' + (i+1) + '. ' + sym(inlineClean(s.title)) + '.'});
    toSpeech(s.body).forEach(function(t){ q.push({sec:'사이드'+(i+1), t:t}); });
  });
  q.push({sec:'종료', t:'오늘 분량이 끝났습니다. 수고하셨습니다.'});
  return q;
}

return { toSpeech: toSpeech, buildQueue: buildQueue, sym: sym };

/* ===== 재생 엔진 ===== */
var Player = (function(){
'use strict';
var SUP = ('speechSynthesis' in window);
var q=[], idx=0, playing=false, rate=1.0, voice=null, wake=null, curDayNo=null;
var onTick = function(){};

function pickVoice(){
  if(!SUP) return null;
  var vs = speechSynthesis.getVoices()||[];
  var ko = vs.filter(function(v){ return /^ko(-|_)?/i.test(v.lang||''); });
  return ko[0] || null;
}
if(SUP){
  try{ speechSynthesis.onvoiceschanged = function(){ voice = pickVoice(); }; }catch(e){}
}

function reqWake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(w){
    wake = w;
    w.addEventListener('release', function(){ wake = null; });
  }).catch(function(){});
}
function relWake(){ if(wake){ try{ wake.release(); }catch(e){} wake=null; } }
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && playing) reqWake();
});

function speakAt(i){
  if(!SUP || i>=q.length){ stop(true); return; }
  idx = i; onTick();
  var u = new SpeechSynthesisUtterance(q[i].t);
  u.lang='ko-KR'; u.rate=rate; u.pitch=1;
  if(voice) u.voice=voice;
  u.onend = function(){ if(playing) speakAt(idx+1); };
  u.onerror = function(){ if(playing) setTimeout(function(){ speakAt(idx+1); },250); };
  try{ speechSynthesis.speak(u); }catch(e){}
}

function load(dayNo, L){
  if(curDayNo!==dayNo){ q = TTS.buildQueue(L); idx = 0; curDayNo = dayNo; }
  return q.length;
}
function play(){
  if(!SUP || !q.length) return;
  if(!voice) voice = pickVoice();
  playing = true; reqWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(function(){ speakAt(idx); }, 60);
  onTick();
}
function pause(){
  playing = false; relWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  onTick();
}
function stop(done){
  playing = false; relWake();
  try{ speechSynthesis.cancel(); }catch(e){}
  if(done) idx = 0;
  onTick();
}
function jump(d){
  var n = Math.max(0, Math.min(q.length-1, idx+d));
  idx = n;
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
function jumpSection(dir){
  var cur = q[idx] ? q[idx].sec : null, i = idx;
  while(i>=0 && i<q.length){
    i += dir;
    if(!q[i]) break;
    if(q[i].sec !== cur){ break; }
  }
  idx = Math.max(0, Math.min(q.length-1, i));
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
function setRate(r){
  rate = r;
  if(playing){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ speakAt(idx); },60); }
  else onTick();
}
return {
  supported: SUP, load: load, play: play, pause: pause, stop: stop,
  jump: jump, jumpSection: jumpSection, setRate: setRate,
  isPlaying: function(){ return playing; },
  pos: function(){ return {i: idx, n: q.length, sec: q[idx]?q[idx].sec:'', t: q[idx]?q[idx].t:''}; },
  rate: function(){ return rate; },
  onTick: function(f){ onTick = f; }
};
})();

var MEM={};
var STORE_OK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function sGet(k){ if(STORE_OK){try{return localStorage.getItem(k);}catch(e){}} return MEM[k]||null; }

/* ---------- date utils ---------- */
function iso(d){var m=d.getMonth()+1,dy=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dy<10?'0':'')+dy;}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){return iso(new Date());}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

/* ---------- streak ---------- */
function streak(){
  var n=0, d=new Date(), guard=0;
  // 오늘 미완료면 어제부터 센다
  if(!DONE[iso(d)]) d.setDate(d.getDate()-1);
  while(guard++<400){ if(DONE[iso(d)]){n++;d.setDate(d.getDate()-1);} else break; }
  return n;
}
function bestStreak(){
  var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
  var best=0,cur=0,prev=null;
  ks.forEach(function(k){
    if(prev && daysBetween(prev,k)===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=k;
  });
  return best;
}
function doneCount(){var n=0;for(var k in DONE){if(DONE[k])n++;}return n;}

/* ---------- markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(src){
  var lines=esc(src).split('\n'), out=[], i=0;
  function flushList(tag,items){ if(items.length){out.push('<'+tag+'>'+items.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</'+tag+'>');} }
  while(i<lines.length){
    var l=lines[i];
    // code fence
    if(/^```/.test(l)){
      var buf=[];i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out.push('<pre><code>'+buf.join('\n')+'</code></pre>'); continue;
    }
    // table
    if(/^\|/.test(l) && i+1<lines.length && /^\|[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var head=l, rows=[]; i+=2;
      while(i<lines.length && /^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){var a=r.split('|');a.shift();if(a.length&&/^\s*$/.test(a[a.length-1]))a.pop();return a.map(function(x){return inline(x.trim());});};
      var h='<tr>'+cells(head).map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
      var b=rows.map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('');
      out.push('<div class="tblwrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>');
      continue;
    }
    // heading
    var hm=l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){var lv=Math.min(hm[1].length,4);out.push('<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>');i++;continue;}
    // hr
    if(/^---+\s*$/.test(l)){out.push('<hr>');i++;continue;}
    // blockquote
    if(/^&gt;\s?/.test(l)){
      var q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^&gt;\s?/,''));i++;}
      out.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>');continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(l)){
      var oi=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){oi.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      flushList('ol',oi);continue;
    }
    // unordered list
    if(/^\s*[-*]\s+/.test(l)){
      var ui=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ui.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      flushList('ul',ui);continue;
    }
    if(/^\s*$/.test(l)){i++;continue;}
    // paragraph
    var p=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^[#|`]|^&gt;|^\s*[-*]\s|^\s*\d+\.\s|^---+\s*$/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+inline(p.join('<br>'))+'</p>');
  }
  return out.join('');
}

  h+='<div class="hero"><div class="big">🔥 '+streak()+'일</div><div class="lbl">연속 학습 중</div>';
  h+='<div class="pbar"><i style="width:'+prog+'%"></i></div>';
  h+='<div class="stats"><div><b>'+doneCount()+'</b><span>완료일</span></div><div><b>'+bestStreak()+'</b><span>최고 연속</span></div><div><b>'+prog+'%</b><span>진도율</span></div></div></div>';
  /* topic */
  h+='<div class="card"><div class="row" style="margin-bottom:8px"><div>'+pill(d)+' <span class="badge">'+d.phaseName+'</span></div>'+(isDone?'<span class="badge ok">✓ 완료</span>':'')+'</div>';
  h+='<div style="font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.3px">'+d.title+'</div></div>';

  if(!L){
    h+='<div class="card"><div class="empty">📘 이 날짜의 상세 본문은<br>ver.1.0에 아직 포함되지 않았습니다.<br><br><span class="mini">현재 Day 1~14 본문 제공<br>(다음 버전에서 확대 예정)</span></div></div>';
    h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
    h+='</div>';
    app.innerHTML=h; bindToday(d); return;
  }
  /* keywords */
  h+=playerHTML();
  h+='<h2 class="sec">핵심 키워드 5</h2><div class="card">';
  L.keywords.forEach(function(k,idx){
    h+='<div class="kw"><b>'+(idx+1)+'. '+k.k+'</b><ul>'+k.subs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>';
  });
  h+='</div>';
  /* main answer */
  h+='<h2 class="sec">메인 답안 (A4 3장 분량)</h2>';
  h+='<details class="acc" open><summary>📝 '+L.title+'</summary><div class="inner md">'+md(L.answer)+'</div></details>';
  /* side */
  h+='<h2 class="sec">사이드 주제 ('+L.side.length+')</h2>';
  L.side.forEach(function(s,idx){
    h+='<details class="acc"><summary>'+(idx+1)+'. '+s.title+'</summary><div class="inner md">'+md(s.body)+'</div></details>';
  });
  /* actions */
  h+='<div style="height:6px"></div>';
  h+='<button class="btn '+(isDone?'done':'')+'" id="mk">'+(isDone?'✓ 오늘 학습 완료됨 (탭하여 취소)':'오늘 학습 완료하기')+'</button>';
  h+='<div style="height:9px"></div><div class="btn2">';
  h+='<button class="btn ghost" id="prev"'+(d.day<=1?' disabled':'')+'>← 이전날</button>';
  h+='<button class="btn ghost" id="next"'+(d.day>=C.total?' disabled':'')+'>다음날 →</button></div>';
  if(curDay && curDay.date!==todayISO()){
    h+='<div style="height:9px"></div><button class="btn ghost" id="goto">오늘로 돌아가기</button>';
  }
  h+='</div>';
  app.innerHTML=h; bindToday(d); bindPlayer(d,L);
}
function playerHTML(){
  if(!Player.supported) return '';
  var p=Player.pos(), on=Player.isPlaying();
  var pct=p.n?Math.round((p.i+1)/p.n*100):0;
  var h='<h2 class="sec">듣기 (운전 중 학습)</h2><div class="card ply">';
  h+='<div class="row" style="margin-bottom:10px"><div><span class="badge ac">'+(p.sec||'대기')+'</span> <span class="mini">'+(p.n?(p.i+1)+' / '+p.n+' 문장':'준비')+'</span></div><span class="mini">'+pct+'%</span></div>';
  h+='<div class="pbar" style="margin:0 0 12px"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="nowtx" id="nowtx">'+(p.t?esc(p.t):'재생 버튼을 누르면 오늘 분량을 처음부터 끝까지 읽어줍니다.')+'</div>';
  h+='<div class="plyrow">';
  h+='<button class="pbtn" id="pPrevS" title="이전 구간">⏮</button>';
  h+='<button class="pbtn" id="pPrev" title="이전 문장">◀</button>';
  h+='<button class="pbtn big" id="pPlay">'+(on?'⏸':'▶')+'</button>';
  h+='<button class="pbtn" id="pNext" title="다음 문장">▶</button>';
  h+='<button class="pbtn" id="pNextS" title="다음 구간">⏭</button>';
  h+='</div>';
  h+='<div class="plyrow2"><span class="mini">속도</span>';
  [0.8,1.0,1.2,1.4,1.6].forEach(function(r){
    h+='<button class="rbtn'+(Math.abs(Player.rate()-r)<0.01?' on':'')+'" data-r="'+r+'">'+r.toFixed(1)+'x</button>';
  });
  h+='<button class="rbtn" id="pStop">처음</button></div>';
  h+='<div class="mini" style="margin-top:10px">화면이 꺼지면 재생이 멈춥니다. 차량 거치대에 두고 화면을 켜두세요. 운전 중에는 조작하지 마시고 출발 전에 재생을 눌러두시면 끝까지 이어집니다.</div>';
  h+='</div>';
  return h;
}
function bindPlayer(d,L){
  if(!Player.supported||!L) return;
  Player.load(d.day,L);
  Player.onTick(function(){
    var p=Player.pos(), on=Player.isPlaying();
    var el=document.getElementById('nowtx'); if(el&&p.t) el.textContent=p.t;
    var pb=document.getElementById('pPlay'); if(pb) pb.textContent=on?'⏸':'▶';
    var bar=document.querySelector('.ply .pbar i'); if(bar&&p.n) bar.style.width=Math.round((p.i+1)/p.n*100)+'%';
    var rw=document.querySelector('.ply .row'); if(rw&&p.n) rw.innerHTML='<div><span class="badge ac">'+(p.sec||'')+'</span> <span class="mini">'+(p.i+1)+' / '+p.n+' 문장</span></div><span class="mini">'+Math.round((p.i+1)/p.n*100)+'%</span>';
  });
  var g=function(id){return document.getElementById(id);};
  if(g('pPlay')) g('pPlay').onclick=function(){ Player.isPlaying()?Player.pause():Player.play(); };
  if(g('pPrev')) g('pPrev').onclick=function(){ Player.jump(-1); };
  if(g('pNext')) g('pNext').onclick=function(){ Player.jump(1); };
  if(g('pPrevS')) g('pPrevS').onclick=function(){ Player.jumpSection(-1); };
  if(g('pNextS')) g('pNextS').onclick=function(){ Player.jumpSection(1); };
  if(g('pStop')) g('pStop').onclick=function(){ Player.stop(true); toast('처음으로 이동'); };
  Array.prototype.forEach.call(document.querySelectorAll('.rbtn[data-r]'),function(b){
    b.onclick=function(){
      Player.setRate(parseFloat(b.getAttribute('data-r')));
      Array.prototype.forEach.call(document.querySelectorAll('.rbtn[data-r]'),function(x){x.classList.remove('on');});
      b.classList.add('on');
    };
  });
}
function bindToday(d){
  var mk=document.getElementById('mk');
  if(mk) mk.onclick=function(){
    if(DONE[d.date]){ delete DONE[d.date]; toast('완료 취소'); }
    else { DONE[d.date]=true; toast('🔥 '+streak()+'일 연속! 잘하고 있어요'); }
    saveDone(DONE); viewToday();
  };
  var p=document.getElementById('prev'), n=document.getElementById('next'), g=document.getElementById('goto');
  if(p) p.onclick=function(){Player.stop(true);curDay=BYDAY[d.day-1];window.scrollTo(0,0);viewToday();};
  if(n) n.onclick=function(){Player.stop(true);curDay=BYDAY[d.day+1];window.scrollTo(0,0);viewToday();};
  if(g) g.onclick=function(){curDay=null;window.scrollTo(0,0);viewToday();};
}

function viewCal(){
  var t=new Date();
  if(!calYM) calYM={y:t.getFullYear(),m:t.getMonth()};
  var y=calYM.y,m=calYM.m;
  var first=new Date(y,m,1), last=new Date(y,m+1,0);
  var pad=first.getDay(), n=last.getDate();
  var sD=parseISO(C.start), eD=parseISO(C.end);
  var h='';
  h+='<div class="hd"><h1>학습 캘린더</h1><div class="sub">매일 꾸준히 — 연속 '+streak()+'일 · 최고 '+bestStreak()+'일</div></div>';
  h+='<div class="wrap">';
  h+='<div class="hero"><div class="big">🔥 '+streak()+'일</div><div class="lbl">현재 연속 학습</div>'+
     '<div class="stats"><div><b>'+doneCount()+'</b><span>총 완료일</span></div><div><b>'+bestStreak()+'</b><span>최고 기록</span></div>'+
     '<div><b>'+Math.round(doneCount()/C.total*100)+'%</b><span>전체 진도</span></div></div></div>';
  h+='<div class="card">';
  h+='<div class="calhd"><button class="navb" id="pm">‹</button><b>'+y+'년 '+(m+1)+'월</b><button class="navb" id="nm">›</button></div>';
  h+='<div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>';
  h+='<div class="grid">';
  for(var i=0;i<pad;i++) h+='<div class="cell pad"></div>';
  for(var dd=1;dd<=n;dd++){
    var cur=new Date(y,m,dd), s=iso(cur), cls='cell', dot='';
    var inRange = cur>=sD && cur<=eD;
    if(!inRange) cls+=' out';
    if(DONE[s]) {cls+=' done';}
    else if(inRange && cur<t && s!==todayISO()) cls+=' miss';
    if(s===todayISO()) cls+=' today';
    if(inRange && LS[String((BYDATE[s]||{}).day)]) dot='<div class="dot"></div>';
    h+='<div class="'+cls+'" data-d="'+s+'">'+dd+dot+'</div>';
  }
  h+='</div>';
  h+='<div class="legend">'+
     '<span><i style="background:#2f9c6a"></i>학습 완료</span>'+
     '<span><i style="background:rgba(255,92,92,.25)"></i>미완료</span>'+
     '<span><i style="border:2px solid #5ec9a8;background:none"></i>오늘</span>'+
     '<span><i style="background:#5ec9a8;border-radius:50%;width:7px;height:7px"></i>본문 제공일</span></div>';
  h+='</div>';
  h+='<div class="card tight"><div class="mini">📅 날짜를 탭하면 해당 일자의 학습으로 이동합니다. 완료 체크는 학습 화면에서 하세요.</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('pm').onclick=function(){calYM={y:m===0?y-1:y,m:m===0?11:m-1};viewCal();};
  document.getElementById('nm').onclick=function(){calYM={y:m===11?y+1:y,m:m===11?0:m+1};viewCal();};
  Array.prototype.forEach.call(document.querySelectorAll('.cell[data-d]'),function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-d');
      if(BYDATE[s]){ curDay=BYDATE[s]; setTab('today'); }
      else toast('학습 기간이 아닙니다');
    };
  });
}

function viewCurr(){
  var h='';
  h+='<div class="hd"><h1>전체 커리큘럼</h1><div class="sub">'+C.start+' ~ '+C.end+' · 총 '+C.total+'일 · 완료 '+doneCount()+'일</div></div>';
  h+='<div class="wrap">';
  var lastPhase=null, open=false;
  DAYS.forEach(function(d){
    if(d.phaseName!==lastPhase){
      if(open) h+='</div>';
      h+='<div class="listcard"><div class="phase">'+d.phaseName+'</div>';
      lastPhase=d.phaseName; open=true;
    }
    var cls='item'+(DONE[d.date]?' isdone':'')+(d.date===todayISO()?' istoday':'');
    var st=DONE[d.date]?'✅':(LS[String(d.day)]?'📘':'⚪');
    h+='<div class="'+cls+'" data-day="'+d.day+'"><div class="n">D'+d.day+'</div>'+
       '<div class="t"><b>'+d.title+'</b><span>'+d.date+' ('+d.dow+') · '+d.cat+'</span></div>'+
       '<div class="st">'+st+'</div></div>';
  });
  if(open) h+='</div>';
  h+='<div class="card tight"><div class="mini">✅ 완료 · 📘 본문 제공(ver.1.0) · ⚪ 제목만 (다음 버전 확대)</div></div>';
  h+='</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.item[data-day]'),function(el){
    el.onclick=function(){curDay=BYDAY[+el.getAttribute('data-day')];setTab('today');};
  });
}

function viewStat(){
  var byPhase={}, byCat={};
  DAYS.forEach(function(d){
    byPhase[d.phaseName]=byPhase[d.phaseName]||{t:0,d:0};
    byPhase[d.phaseName].t++; if(DONE[d.date]) byPhase[d.phaseName].d++;
    byCat[d.cat]=byCat[d.cat]||{t:0,d:0};
    byCat[d.cat].t++; if(DONE[d.date]) byCat[d.cat].d++;
  });
  var dleft=daysBetween(todayISO(),C.end);
  var elapsed=daysBetween(C.start,todayISO())+1;
  var expect=Math.max(0,Math.min(elapsed,C.total));
  var h='';
  h+='<div class="hd"><h1>학습 통계</h1><div class="sub">시험까지 D-'+(dleft>=0?dleft:0)+' · 목표 60점 합격</div></div>';
  h+='<div class="wrap">';
  h+='<div class="card"><div class="row"><b>전체 진도</b><span class="badge ac">'+doneCount()+' / '+C.total+'일</span></div>'+
     '<div class="pbar" style="margin-top:10px"><i style="width:'+(doneCount()/C.total*100)+'%"></i></div>'+
     '<div class="mini" style="margin-top:9px">예정 '+expect+'일 대비 <b style="color:'+(doneCount()>=expect?'#3ddc84':'#ffb020')+'">'+
     (doneCount()>=expect?'+':'')+(doneCount()-expect)+'일</b></div></div>';
  h+='<h2 class="sec">단계별 진도</h2><div class="card">';
  Object.keys(byPhase).forEach(function(k){
    var v=byPhase[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:13px"><div class="row" style="margin-bottom:5px"><span style="font-size:13.5px;font-weight:600">'+k+'</span><span class="mini">'+v.d+'/'+v.t+'</span></div>'+
       '<div class="pbar"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">분야별 진도</h2><div class="card">';
  Object.keys(byCat).sort(function(a,b){return byCat[b].t-byCat[a].t;}).forEach(function(k){
    var v=byCat[k], p=Math.round(v.d/v.t*100);
    h+='<div style="margin-bottom:11px"><div class="row" style="margin-bottom:4px"><span style="font-size:13px">'+k+'</span><span class="mini">'+v.d+'/'+v.t+' ('+p+'%)</span></div>'+
       '<div class="pbar" style="height:5px"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2 class="sec">데이터 관리</h2>';
  if(!STORE_OK){
    h+='<div class="card" style="border-color:#7a5a20;background:rgba(255,176,32,.08)">'+
       '<div style="font-size:13.5px;color:#ffc357;font-weight:700;margin-bottom:6px">⚠️ 저장 기능이 꺼져 있습니다</div>'+
       '<div class="mini">지금 방식으로는 앱을 닫으면 기록이 사라집니다. 아래 <b>기록 내보내기</b>로 백업하거나, README의 GitHub Pages 방법으로 설치하면 자동 저장됩니다.</div></div>';
  }
  h+='<div class="card"><div class="mini" style="margin-bottom:11px">학습 기록은 이 기기에만 저장됩니다. 기기를 바꾸기 전에 내보내기로 백업하세요.</div>'+
     '<div class="btn2"><button class="btn ghost" id="exp">기록 내보내기</button><button class="btn ghost" id="imp">기록 불러오기</button></div>'+
     '<div style="height:9px"></div><button class="btn ghost" id="rst">기록 초기화</button></div>';
  h+='<div class="card tight"><div class="mini">대기관리기술사 학습앱 <b>ver.1.0</b><br>커리큘럼 194일 · 본문 Day 1~14 수록<br>114~138회 기출 325문항 분석 기반</div></div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('exp').onclick=function(){
    var ks=Object.keys(DONE).filter(function(k){return DONE[k];}).sort();
    var txt=ks.join(',');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('클립보드에 복사됨 ('+ks.length+'일)');},
        function(){prompt('아래 내용을 복사해 보관하세요',txt);});
    } else prompt('아래 내용을 복사해 보관하세요',txt);
  };
  document.getElementById('imp').onclick=function(){
    var v=prompt('내보내기한 완료일 목록을 붙여넣으세요\n(예: 2026-08-01,2026-08-02)','');
    if(v===null) return;
    var n=0;
    v.split(/[,\s]+/).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)){DONE[k]=true;n++;} });
    saveDone(DONE); toast(n+'일 불러왔습니다'); viewStat();
  };
  document.getElementById('rst').onclick=function(){
    if(confirm('모든 학습 기록을 삭제할까요? 되돌릴 수 없습니다.')){DONE={};saveDone(DONE);toast('초기화되었습니다');viewStat();}
  };
}

/* ---------- toast ---------- */
var tEl=null,tTimer=null;
function toast(msg){
  if(!tEl){tEl=document.createElement('div');tEl.className='toast';document.body.appendChild(tEl);}
  tEl.textContent=msg; tEl.classList.add('on');
  clearTimeout(tTimer); tTimer=setTimeout(function(){tEl.classList.remove('on');},1900);
}

/* ---------- tabs ---------- */
function setTab(t){
  if(Player.supported && t!=='today') Player.pause();
  tab=t; window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-t')===t);
  });
  if(t==='today') viewToday();
  else if(t==='cal') viewCal();
  else if(t==='curr') viewCurr();
  else viewStat();
}
function initTabs(){
  var n=document.createElement('div'); n.className='tabs';
  n.innerHTML=
   '<button data-t="today" class="on"><span class="ic">📖</span>오늘의 학습</button>'+
   '<button data-t="cal"><span class="ic">🗓</span>캘린더</button>'+
   '<button data-t="curr"><span class="ic">📋</span>커리큘럼</button>'+
   '<button data-t="stat"><span class="ic">📊</span>통계</button>';
  document.body.appendChild(n);
  Array.prototype.forEach.call(n.querySelectorAll('button'),function(b){
    b.onclick=function(){ if(b.getAttribute('data-t')==='today') curDay=null; setTab(b.getAttribute('data-t')); };
  });
}
initTabs(); setTab('today');
window.__APP={md:md,streak:streak,DAYS:DAYS,LS:LS};
})();
