칙을 설명하고 헨리상수가 흡수 효율에 미치는 영향을 논하시오. *(다수 회차 10점)*\n2. 2막이론에 근거한 총괄물질전달계수 산정식을 유도하시오. *(114~138회 25점)*\n3. 물리흡수와 화학흡수의 차이를 비교하고 각각의 적용 사례를 설명하시오. *(최근 10점)*\n\n### 학습 연결 포인트\n다음 Day(54)의 흡수장치(충전탑·분무탑) 설계는 이번 Day에서 정의한 NTU-HTU 개념을 실제 장치 치수(충전물 높이)로 구현하는 과정이므로, HTU·NTU 개념을 명확히 정리한 뒤 다음 학습으로 넘어가는 것이 좋다.\n\n### 관련 법령 근거 정리\n「대기환경보전법 시행규칙」 별표8(대기오염물질 배출허용기준)에서 황산화물, 염화수소, 불화수소 등의 항목별 배출허용기준이 규정되어 있으며, 흡수시설은 이들 항목의 대표적 방지시설로서 인허가 협의 시 처리효율 산정근거(헨리상수, NTU-HTU 계산서 등)가 요구될 수 있다. 답안에서 법령명을 인용할 때는 반드시 「」로 정확히 표기해야 한다."}]},"54":{"day":54,"date":"2026-09-23","title":"흡수장치 종류와 충전물 구비조건","keywords":[{"k":"흡수장치 4종","subs":["충전탑(packed)·분무탑(spray)","단탑(plate/tray)·벤투리스크러버","향류접촉이 기본(효율 최대)"]},{"k":"충전물 구비조건","subs":["비표면적 크고 공극률 클것","내식·내열성, 충분한 강도","균일한 젖음성·액분배"]},{"k":"충전물 종류(세대별)","subs":["1세대 라쉬히링(Raschig ring)","2세대 폴링(Pall ring)","3세대 새들형(Berl·Intalox saddle)"]},{"k":"로딩점·플러딩점","subs":["로딩점: 액정체 시작 유속","플러딩점: 액범람, 운전불가","설계유속=플러딩속도의 50~75%"]},{"k":"편류(Channeling) 현상","subs":["충전물 내 액체 특정경로 편중","접촉효율 저하 원인","액분배기(distributor) 설치로 방지"]}],"answer":"# 흡수장치 종류와 충전물 구비조건\n\n## Ⅰ. 개요\n\n흡수장치는 헨리의 법칙과 2막이론(Day 53)에서 정의한 기액 물질전달을 실제 설비로 구현하는 장치로, 접촉방식에 따라 충전탑(Packed Tower)·분무탑(Spray Tower)·단탑(Plate/Tray Tower)·벤투리스크러버 등으로 분류된다. 설계의 핵심은 기액 접촉면적을 극대화하면서 압력손실을 최소화하는 데 있으며, 충전탑의 경우 충전물(packing)의 구비조건과 로딩·플러딩 현상에 대한 이해가 실무 설계의 필수 요소이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 흡수장치의 종류\n\n| 구분 | 접촉방식 | 압력손실 | 효율 | 적용 |\n|---|---|---|---|---|\n| 충전탑(Packed Tower) | 충전물 표면 액막-가스 향류접촉 | 중간 | 높음 | 일반적 산성가스 흡수 |\n| 분무탑(Spray Tower) | 액체를 단순 분무, 액적-가스 접촉 | 낮음 | 낮음~중간 | 전처리, 저농도 처리 |\n| 단탑(Plate/Tray Tower) | 다공판·기포캡에서 단별 기액평형 | 중~높음 | 높음(단수설계) | 정밀 분리, 다단효율 필요시 |\n| 벤투리스크러버 | 목부 고속기류에서 액적 미세화 | 높음 | 높음(입자+가스) | 가스+입자 동시처리 |\n\n### 1. 충전탑\n충전물 위에서 흡수액을 살수하여 가스와 향류(counter-current)로 접촉시키는 방식이 일반적이며, 향류접촉은 병류(co-current)보다 구동력(농도차)을 크게 유지할 수 있어 효율이 높다.\n\n### 2. 분무탑\n구조가 단순하고 압력손실이 낮으나 접촉면적이 작아 효율이 제한적이므로, 주로 전처리 또는 상대적으로 저농도 오염물질 처리에 활용된다.\n\n### 3. 단탑(Plate Tower)\n다공판(sieve tray)이나 기포캡(bubble cap)을 통해 가스가 액층을 통과하며 단(段, stage)별로 기액평형에 근접한 접촉을 이룬다. 요구 분리도에 따라 이론단수를 계산해 실제 단수를 설계하는 방식이 충전탑의 NTU-HTU법과 대응된다.\n\n## Ⅲ. 충전물(Packing)의 구비조건과 종류\n\n### 1. 구비조건\n1. 단위체적당 비표면적이 클 것(물질전달 면적 확대)\n2. 공극률(void fraction)이 클 것(압력손실 최소화)\n3. 내식성·내열성이 우수할 것(흡수액·가스 특성에 대응)\n4. 충분한 기계적 강도(자중·적재하중 지지)\n5. 표면 젖음성이 좋아 액막 형성이 균일할 것\n6. 충전 시 액체가 고르게 분배되도록 균일한 형상일 것\n\n### 2. 충전물 세대별 비교\n\n| 세대 | 대표 형상 | 특징 |\n|---|---|---|\n| 1세대 | 라쉬히링(Raschig ring) | 단순 원통형, 비표면적·효율 낮은 편, 압손 큼 |\n| 2세대 | 폴링(Pall ring) | 라쉬히링 측면에 슬릿(창) 추가, 압손 감소·효율 향상 |\n| 3세대 | 새들형(Berl saddle, Intalox saddle) | 곡면 안장형, 균일한 액분배·낮은 압손 |\n| 구조체 충전물 | 규칙충전물(structured packing) | 규칙적 배열판형, 비표면적 최대, 고효율·저압손, 고가 |\n\n## Ⅳ. 로딩점·플러딩점과 편류현상\n\n### 1. 로딩점(Loading Point)과 플러딩점(Flooding Point)\n가스 유속을 점차 증가시키면 어느 시점부터 충전물 내 액체가 정체되기 시작하는 **로딩점**에 도달하고, 유속을 더 높이면 액이 가스에 밀려 위로 역류·범람하여 정상적인 향류접촉이 불가능해지는 **플러딩점**에 도달한다.\n\n| 구간 | 현상 | 설계 시사점 |\n|---|---|---|\n| 로딩점 이전 | 정상 향류접촉, 압손 완만히 증가 | 정상 운전영역 |\n| 로딩점~플러딩점 | 압손 급증, 액정체 시작 | 비정상 접근구간(회피) |\n| 플러딩점 이후 | 액범람, 운전 불가 | 절대 회피 |\n\n설계 가스유속은 통상 **플러딩속도의 약 50~75%** 수준에서 선정하여 안정적인 운전여유를 확보한다.\n\n### 2. 편류(Channeling) 현상\n충전탑 내에서 액체가 특정 경로로만 편중되어 흐르고 일부 충전물 표면은 액과 접촉하지 못하는 현상으로, 유효 접촉면적이 감소해 흡수효율이 저하된다. 액분배기(liquid distributor)를 상단에 설치하고, 탑 직경 대비 충전 높이가 과도하지 않도록(재분배판 삽입) 설계하여 방지한다.\n\n### 3. 향류접촉과 병류접촉 비교\n충전탑·단탑에서는 가스와 액체의 흐름 방향에 따라 향류(counter-current)와 병류(co-current) 방식으로 구분된다.\n\n| 구분 | 향류접촉 | 병류접촉 |\n|---|---|---|\n| 흐름방향 | 가스↑, 액체↓ (반대) | 가스·액체 동일방향 |\n| 구동력(농도차) | 전 구간에서 크게 유지 | 출구 부근 급격히 감소 |\n| 효율 | 높음(일반적 채택) | 낮음(특수한 경우만 채택) |\n| 적용 예 | 대부분의 흡수탑 | 고농도 급속처리, 압손 최소화 필요시 |\n\n## Ⅴ. 결론\n\n흡수장치는 접촉방식에 따라 효율·압력손실·적용성이 다르므로 오염물질 농도와 요구 제거율에 맞는 형식을 선정해야 하며, 충전탑 채택 시에는 충전물의 비표면적·압손 특성과 로딩·플러딩 여유를 확보하는 것이 안정적 운전의 핵심이다. 최근에는 저압손·고효율의 규칙충전물(structured packing) 채택이 확대되는 추세이며, 편류 방지를 위한 액분배 설계 기술도 함께 고도화되고 있다. 설계 시에는 처리대상 가스의 오염물질 농도·유량, 요구 제거율에 따라 충전탑·단탑·분무탑 중 경제성과 효율을 종합적으로 고려하여 형식을 선정해야 한다.\n\n| 선정 기준 | 권장 형식 |\n|---|---|\n| 고효율 요구, 일반적 산성가스 | 충전탑 |\n| 저농도, 전처리 목적 | 분무탑 |\n| 정밀한 단별 분리 요구 | 단탑 |\n| 가스+입자 동시처리 | 벤투리스크러버 |\n","side":[{"title":"계산 예제 — 이론단수 개념과 설계유속 선정","body":"### 단탑 이론단수 개념\n목표 제거율을 달성하기 위한 이론단수(N)는 조작선(operating line)과 평형선(equilibrium line, 헨리법칙 y=mx) 사이의 계단작도(McCabe-Thiele 유사 개념)로 결정된다. 이론단수가 많을수록 목표 제거율을 위한 접촉기회가 증가하나, 실제 단수는 단효율(단당 실제/이론 도달률)을 반영해 이론단수보다 많게 설계한다.\n\n### 설계유속 선정 예제\n플러딩속도 Vf = 3.0m/s로 산정된 충전탑에서, 설계유속을 플러딩속도의 60%로 선정하면:\n\nVdesign = 0.6 × 3.0 = **1.8 m/s**\n\n### 설계유속 선정 시 고려사항\n| 고려요소 | 내용 |\n|---|---|\n| 안전여유 | 플러딩속도의 50~75% 범위 내 보수적 선정 |\n| 압력손실 | 유속이 높을수록 압손 증가, 송풍동력비 상승 |\n| 탑 직경 | 동일 풍량에서 설계유속을 낮추면 탑 직경 증가(설치면적↑) |\n\n### 답안 작성 포인트\n설계유속을 플러딩속도 대비 백분율로 제시하고, 그 근거(안전운전여유 확보)를 함께 서술하면 설계 근거가 명확한 답안이 된다.\n\n### 탑 직경 산정 개념\n소요 가스유량(Q)과 설계유속(Vdesign)이 결정되면 탑 단면적(A=Q/Vdesign)을 통해 직경을 산정한다. 동일 유량에서 설계유속을 낮게(보수적으로) 잡을수록 탑 직경이 커져 설치면적과 초기투자비가 증가하므로, 안전여유와 경제성 사이의 균형이 실무 설계의 핵심 판단이 된다.\n\n### 압력손실과 유속의 관계\n충전탑 압력손실은 유속의 약 2승에 근접하게 증가하는 경향을 보이며, 플러딩점에 가까워질수록 압력손실 증가율이 급격히 커진다(특성곡선의 급격한 기울기 변화). 설계유속 선정 시 이 압력손실-유속 특성곡선을 함께 검토하는 것이 실무적으로 중요하다."},{"title":"충전물 비교 상세와 기출 연계","body":"### 충전물 형상별 상세 비교\n\n| 항목 | 라쉬히링 | 폴링 | 새들형 | 규칙충전물 |\n|---|---|---|---|---|\n| 비표면적 | 낮음 | 중간 | 중간~높음 | 매우 높음 |\n| 공극률 | 낮음 | 중간 | 높음 | 매우 높음 |\n| 압력손실 | 큼 | 중간 | 작음 | 매우 작음 |\n| 액분배 균일성 | 낮음 | 중간 | 우수 | 매우 우수 |\n| 초기비용 | 저렴 | 중간 | 중간 | 고가 |\n\n### 재질 선정\n산성가스(SOx, HCl 등) 흡수 시 충전물 재질은 폴리프로필렌(PP), PVC, 세라믹, 스테인리스 등 흡수액·가스 특성에 맞는 내식재질을 선정하며, 고온 배가스의 경우 내열성도 함께 고려해야 한다.\n\n### 기출 연계 자가점검\n1. 흡수탑용 충전물의 구비조건을 설명하고 세대별 충전물의 특징을 비교하시오. *(다수 회차 10~25점)*\n2. 충전탑의 로딩점·플러딩점을 설명하고 설계유속 선정기준을 논하시오. *(114~138회 25점)*\n3. 충전탑 내 편류(channeling) 현상의 원인과 방지대책을 설명하시오. *(최근 10점)*\n\n### 학습 연결 포인트\n다음 Day(55)의 흡착 원리는 흡수와 마찬가지로 물질전달 개념(2막이론 유사 확산기구)을 공유하지만, 액체가 아닌 고체 표면에 오염물질이 부착된다는 점에서 상(phase)의 차이가 핵심 구분점이 된다.\n\n### 흡수장치 유지관리 포인트\n| 관리항목 | 점검내용 |\n|---|---|\n| 충전물 상태 | 파손·폐색·스케일 부착 여부 정기점검 |\n| 액분배기 | 노즐 막힘, 균일 살수 여부 확인 |\n| 순환펌프 | 유량·양정 저하 여부 점검 |\n| 배관·탑체 부식 | 산성가스 흡수 시 정기 두께측정 |\n\n### 관련 기출 확장\n흡수탑의 압력손실이 설계값보다 크게 증가한 경우 예상되는 원인(충전물 폐색, 플러딩 근접운전, 편류 등)을 진단하는 문제 형태로도 출제될 수 있으므로, 원인-현상-대책을 표로 정리해두면 대응이 수월하다."}]},"55":{"day":55,"date":"2026-09-24","title":"흡착의 원리 - 물리흡착·화학흡착","keywords":[{"k":"흡착(Adsorption) 정의","subs":["기체분자가 고체(흡착제) 표면에 부착·농축","VOCs 등 저농도 오염물질에 효과적","다공성 고체의 큰 비표면적 활용"]},{"k":"물리흡착 vs 화학흡착","subs":["물리: Van der Waals力, 가역적, 다층","화학: 화학결합, 비가역적, 단층","저온일수록 물리흡착에 유리(발열)"]},{"k":"흡착등온식","subs":["Freundlich식 x/m=kC^(1/n)","Langmuir식 x/m=abC/(1+bC)","BET식(다층흡착, 표면적 측정)"]},{"k":"흡착제 종류","subs":["활성탄(비극성, VOCs)","실리카겔·활성알루미나(극성, 수분)","제올라이트(분자체, 선택적 흡착)"]},{"k":"흡착 영향인자","subs":["온도 낮을수록 유리(발열반응)","압력 높을수록 유리","흡착제 비표면적·기공구조"]}],"answer":"# 흡착의 원리 - 물리흡착·화학흡착\n\n## Ⅰ. 개요\n\n흡착(Adsorption)은 기체 중의 특정 오염물질 분자가 고체(흡착제) 표면에 물리적 또는 화학적 힘으로 부착·농축되는 현상으로, 흡수(Day 53~54)가 액체를 매체로 하는 것과 달리 다공성 고체의 극도로 큰 비표면적을 활용해 저농도·소량의 VOCs, 악취물질 등을 효과적으로 제거한다. 흡착은 결합력의 종류에 따라 물리흡착과 화학흡착으로 구분되며, 이 구분이 재생 가능성·흡착층 형성 방식·설계 온도조건을 결정하는 핵심 기준이 된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 물리흡착과 화학흡착 비교\n\n| 구분 | 물리흡착(Physisorption) | 화학흡착(Chemisorption) |\n|---|---|---|\n| 결합력 | Van der Waals力(분자간 인력) | 화학결합(공유·이온결합) |\n| 가역성 | 가역적(재생 용이) | 비가역적(재생 어려움) |\n| 발열량 | 작음(응축열 수준) | 큼(반응열 수준) |\n| 흡착층 | 다층흡착(multi-layer) 가능 | 단분자층(mono-layer)만 |\n| 활성화에너지 | 거의 불필요 | 필요(특정 조건에서만 발생) |\n| 선택성 | 낮음(비선택적) | 높음(특정물질에 선택적) |\n| 온도영향 | 저온일수록 유리 | 특정 온도범위에서만 진행 |\n\n물리흡착은 응축과 유사한 메커니즘으로 발열량이 작고 가역적이어서 흡착제 재생(탈착)이 용이한 반면, 화학흡착은 화학결합을 형성하므로 발열량이 크고 재생이 어렵거나 불가능한 경우가 많다. 방지시설에서 활용하는 흡착(활성탄 등)은 주로 물리흡착 원리에 기반한다.\n\n## Ⅲ. 흡착등온식\n\n### 1. Freundlich식(경험식)\n저~중농도 범위에서 널리 사용되는 경험적 흡착등온식.\n\n**x/m = k·C^(1/n)**\n\n| 기호 | 의미 |\n|---|---|\n| x/m | 흡착제 단위질량당 흡착량 |\n| C | 평형농도 |\n| k, n | 물질·온도별 실험상수(n>1) |\n\n### 2. Langmuir식(이론식)\n단분자층 흡착을 가정한 이론적 등온식으로, 흡착 자리(site)가 유한하다는 전제 하에 유도된다.\n\n**x/m = a·b·C/(1+b·C)**\n\n| 기호 | 의미 |\n|---|---|\n| a | 최대 흡착량 관련 상수 |\n| b | 흡착평형상수 |\n\n농도가 매우 높아지면 x/m이 a에 점근(포화)하는 것이 Freundlich식과의 주요 차이이다.\n\n### 3. BET식\nLangmuir식을 다층흡착까지 확장한 식으로, 흡착제의 비표면적 측정(질소흡착법 등)에 실무적으로 널리 활용된다.\n\n| 등온식 | 가정 | 주 용도 |\n|---|---|---|\n| Freundlich | 경험적, 불균일 표면 | 실무 설계(파과곡선 예측 등) |\n| Langmuir | 단분자층, 균일 표면 | 이론적 흡착기구 설명 |\n| BET | 다층흡착 | 흡착제 비표면적 측정 |\n\n## Ⅳ. 흡착제 종류와 영향인자\n\n### 1. 흡착제 종류\n\n| 흡착제 | 특성 | 주 적용대상 |\n|---|---|---|\n| 활성탄(Activated Carbon) | 비극성, 비표면적 약 500~1,500㎡/g | VOCs, 유기용제, 악취 |\n| 실리카겔 | 극성, 친수성 | 수분(건조), 극성 유기물 일부 |\n| 활성알루미나 | 극성, 내열성 우수 | 건조제, 불소화합물 흡착 |\n| 제올라이트(분자체) | 규칙적 세공구조, 분자크기 선택적 흡착 | 특정 분자 선택 분리, VOCs 회수 |\n\n### 2. 흡착 효율 영향인자\n1. **온도**: 흡착은 발열반응이므로 온도가 낮을수록 평형이 흡착 방향으로 이동(유리)\n2. **압력(농도)**: 분압이 높을수록 흡착량 증가\n3. **흡착제 비표면적·기공구조**: 비표면적이 클수록, 기공크기가 대상물질 분자크기에 적합할수록 유리\n4. **수분(상대습도)**: 활성탄의 경우 고습도 조건에서 수증기가 흡착자리를 경쟁적으로 점유해 VOCs 흡착효율 저하 가능\n\n### 3. 흡착과 흡수의 비교\n흡착(고체 매체)과 흡수(액체 매체)는 모두 오염물질을 다른 상(phase)으로 이동시켜 제거한다는 공통점이 있으나, 처리 대상 농도범위와 재생 방식에서 뚜렷한 차이를 보인다.\n\n| 구분 | 흡수(Absorption) | 흡착(Adsorption) |\n|---|---|---|\n| 매체 | 액체(흡수액) | 고체(흡착제) |\n| 적용 농도 | 중~고농도 | 저농도(ppm 수준) |\n| 주요 대상 | SOx, HCl, NH3 등 무기가스 | VOCs, 악취 등 유기가스 |\n| 재생 | 흡수액 재생 또는 소모형 | 가열·감압 재생(활성탄 재사용) |\n| 부산물 | 폐수·슬러지 발생 가능 | 재생배가스(응축·회수 가능) |\n\n## Ⅴ. 결론\n\n흡착은 다공성 고체 표면의 물리적·화학적 인력을 이용해 저농도 오염물질을 효과적으로 제거하는 공정으로, 물리흡착과 화학흡착의 구분이 재생 가능성과 설계온도 결정의 기준이 된다. Freundlich·Langmuir·BET 등온식은 각각 실무 설계, 이론적 이해, 흡착제 물성 측정이라는 서로 다른 목적으로 활용되며, 활성탄을 중심으로 한 VOCs 처리는 「대기환경보전법」상 휘발성유기화합물 배출시설 관리와 직결되는 실무적으로 매우 중요한 기술이다. 다음 학습에서는 이러한 흡착 성능을 시간에 따른 파과곡선과 활성탄 설계인자로 정량화한다.\n\n| 요약 비교 | 물리흡착 | 화학흡착 |\n|---|---|---|\n| 재생 가능성 | 용이 | 어려움 |\n| 방지시설 적용 | 활성탄 흡착탑(주류) | 특수 촉매·소재 연구단계 |\n| 설계 온도 | 상온~약간 저온 | 반응별 특정 온도 |\n","side":[{"title":"계산 예제 — Freundlich식 적용","body":"### 조건\n어떤 VOCs에 대한 활성탄의 Freundlich 상수가 k=0.5, n=2이고, 평형농도 C=100mg/㎥일 때 흡착제 단위질량당 흡착량(x/m)은?\n\n### 계산\nx/m = k·C^(1/n) = 0.5×100^(1/2) = 0.5×10 = **5 mg/g**\n\n### 농도 변화에 따른 민감도 분석\n같은 활성탄에서 평형농도가 400mg/㎥로 4배 증가하면:\nx/m = 0.5×400^(0.5) = 0.5×20 = **10 mg/g** (2배 증가)\n\nn값이 클수록(1/n이 작을수록) 농도 증가에 대한 흡착량 증가폭이 완만해짐을 알 수 있다.\n\n### 설계 활용\nFreundlich식으로 산정한 평형흡착량은 흡착탑의 파과시간 예측, 소요 흡착제량 산정의 기초자료로 활용되며, 다음 Day의 파과곡선·활성탄 설계와 연결된다.\n\n### 답안 작성 포인트\n계산형 문제에서는 단위(mg/g, mg/㎥ 등) 표기를 명확히 하고, 산출된 흡착량이 활성탄의 이론적 최대 흡착용량 범위 내인지 간단히 언급하면 완성도가 높아진다.\n\n### Langmuir식과의 비교 계산\n동일 조건에서 Langmuir식(a=15mg/g, b=0.05㎥/mg)을 적용하면:\nx/m = a·b·C/(1+b·C) = 15×0.05×100/(1+0.05×100) = 75/6 = **12.5 mg/g**\n\n두 식의 결과가 다른 것은 가정(경험적 vs 균일표면 단분자층)이 다르기 때문이며, 실제 설계에서는 흡착제 제조사 제공 등온선 데이터를 우선 활용하고 이론식은 경향 파악에 활용하는 것이 일반적이다."},{"title":"흡착제 재생 개요와 기출 연계","body":"### 흡착제 재생방법 개요(상세는 Day56 파과곡선에서 연계)\n| 재생방법 | 원리 | 적용 흡착제 |\n|---|---|---|\n| 수증기 재생 | 고온 수증기로 탈착 | 활성탄(가장 일반적) |\n| 가열재생(열풍) | 온도 상승으로 물리흡착 평형 역전 | 활성탄, 제올라이트 |\n| 감압재생 | 압력 저하로 탈착(PSA 공정) | 제올라이트, 활성탄 |\n| 약품재생 | 화학세정으로 흡착물 제거 | 화학흡착이 일부 결합된 경우 |\n\n### 물리흡착 재생이 용이한 이유\n물리흡착은 Van der Waals力에 의한 가역적 결합이므로, 온도 상승이나 압력 저하로 흡착평형을 탈착 방향으로 이동시키는 것만으로 흡착제를 재사용할 수 있다. 이는 화학흡착 대비 활성탄 흡착탑이 널리 채택되는 주요 이유 중 하나이다.\n\n### 기출 연계 자가점검\n1. 물리흡착과 화학흡착의 차이를 결합력·가역성·발열량 관점에서 비교 설명하시오. *(다수 회차 10~25점)*\n2. Freundlich식과 Langmuir식의 가정과 적용범위를 비교하시오. *(114~138회 10점)*\n3. 흡착제(활성탄·실리카겔·제올라이트)의 종류별 특성과 적용대상을 설명하시오. *(최근 10~25점)*\n\n### 학습 연결 포인트\n다음 Day(56)는 이번에 다룬 등온흡착 개념을 시간축으로 확장한 파과곡선(breakthrough curve)과 활성탄 흡착탑의 실제 설계(MTZ, 접촉시간)를 다룬다.\n\n### 흡착제 선정 시 실무 체크리스트\n1. 대상 오염물질의 극성 여부(비극성 VOCs → 활성탄, 극성 수분 → 실리카겔)\n2. 분자크기와 흡착제 기공크기의 적합성(제올라이트 분자체 특성 활용)\n3. 처리가스의 온도·습도 조건(고습도 시 활성탄 효율 저하 고려)\n4. 재생 주기 및 폐흡착제 처리방안(위탁처리 또는 재생설비 자체 보유)"}]},"56":{"day":56,"date":"2026-09-25","title":"흡착 파과곡선과 활성탄 설계","keywords":[{"k":"파과곡선(Breakthrough Curve)","subs":["출구농도(Ct)-시간 S자형 그래프","파과점: Ct/C0=보통 5~10%","파과시간(tb) 이후 흡착제 교체·재생"]},{"k":"물질전달대(MTZ)","subs":["흡착이 실제 진행되는 층(대) 구간","MTZ가 짧을수록 흡착제 이용효율↑","MTZ 이동속도로 파과시간 예측"]},{"k":"흡착탑 설계인자","subs":["공탑접촉시간(EBCT)","공탑속도(공간속도, SV)","충전층 높이(Bed Depth)"]},{"k":"파과시간 예측식","subs":["Bohart-Adams식 개념","베드깊이서비스시간(BDST)법","안전계수 반영한 설계 여유"]},{"k":"재생·다단운전","subs":["2탑(또는 다탑) 교대운전","수증기 재생, 재생주기 관리","재생배가스 응축·회수(용제회수)"]}],"answer":"# 흡착 파과곡선과 활성탄 설계\n\n## Ⅰ. 개요\n\n흡착탑은 시간이 지남에 따라 흡착제(활성탄 등)의 흡착 자리가 점차 오염물질로 포화되며, 이 과정을 시간에 따른 출구농도 변화로 나타낸 것이 파과곡선(Breakthrough Curve)이다. Day 55에서 다룬 흡착등온식이 \"평형상태에서의 흡착량\"을 다룬다면, 파과곡선은 \"시간에 따라 흡착탑이 어떻게 포화되어 가는가\"를 다루는 동적(dynamic) 개념으로, 실제 흡착탑의 설계수명·교체주기·설계치수를 결정하는 실무적 핵심이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 파과곡선과 물질전달대(MTZ)\n\n### 1. 파과곡선의 형태\n흡착탑에 오염가스를 연속 통과시키면 초기에는 출구농도가 거의 0에 가깝게 유지되다가, 흡착제가 점차 포화되면서 출구농도가 S자형으로 급격히 상승한다. 출구농도(Ct)가 유입농도(C0) 대비 일정 비율(통상 5~10%)에 도달하는 시점을 **파과점(Breakthrough Point)**, 그 시간을 **파과시간(tb)**이라 한다.\n\n| 구간 | 출구농도 | 상태 |\n|---|---|---|\n| 파과 이전 | Ct≈0 | 흡착제 대부분 미포화, 정상 운전 |\n| 파과점 | Ct/C0 = 5~10% | 흡착제 교체·재생 시점 |\n| 파과 이후 | Ct 급격히 상승 | 포화 진행, 처리효율 급감 |\n| 완전포화 | Ct→C0 | 흡착능 소진 |\n\n### 2. 물질전달대(Mass Transfer Zone, MTZ)\n흡착탑 내에서 실제로 흡착반응이 진행되는 구간(흡착제가 부분적으로 포화된 층)을 물질전달대(MTZ)라 하며, 이 대(zone)가 가스 흐름방향으로 이동하면서 점차 출구에 가까워지다가 파과점에 도달하면 급격히 빠져나간다. MTZ의 길이가 짧을수록(물질전달이 빠를수록) 흡착제 이용효율이 높아지며, MTZ 형성 속도로부터 파과시간을 예측할 수 있다.\n\n## Ⅲ. 파과시간 예측과 설계인자\n\n### 1. Bohart-Adams식(개념)\n흡착탑의 파과시간을 충전층 높이·유속·흡착능의 함수로 나타내는 대표적 모델로, 베드깊이서비스시간(Bed Depth Service Time, BDST)법의 이론적 근거가 된다. 실무에서는 파일럿 시험 또는 문헌값을 통해 BDST 상관식(파과시간과 충전층 깊이의 선형관계)을 구성하고, 이를 바탕으로 소요 충전층 높이를 설계한다.\n\n### 2. 흡착탑 설계인자\n\n| 설계인자 | 정의 | 설계 시사점 |\n|---|---|---|\n| 공탑접촉시간(EBCT) | 충전층 부피/가스유량 | 통상 수 초~수십 초, 길수록 파과시간 증가 |\n| 공간속도(SV) | 가스유량/충전층 부피 (1/EBCT) | 작을수록(체류시간↑) 흡착에 유리 |\n| 충전층 높이 | 흡착제 충전 두께 | MTZ보다 충분히 커야 함 |\n| 공탑속도 | 충전층 단면적 기준 유속 | 압력손실·흡착효율에 영향 |\n\n### 3. 안전 설계 여유\n실제 설계에서는 계산된 파과시간에 안전계수(통상 0.7~0.8 배 적용 등 설비별 상이)를 곱해 여유를 두거나, 파과점 기준을 보수적으로(예: Ct/C0=1~5%) 설정하여 오염물질 미처리 배출 위험을 최소화한다.\n\n## Ⅳ. 재생 및 다단(다탑) 운전\n\n### 1. 2탑(또는 다탑) 교대운전\n흡착탑 1기가 파과에 근접하면 예비 흡착탑으로 전환하고, 파과된 탑은 재생 공정에 투입하는 방식으로 연속 운전을 구현한다. 통상 2탑 이상을 교대로 운전하여 처리 중단 없이 흡착-재생을 반복한다.\n\n### 2. 재생 방법과 특징\n\n| 재생방법 | 원리 | 비고 |\n|---|---|---|\n| 수증기 재생 | 고온 수증기로 흡착물 탈착 | 가장 일반적, 활성탄 손상 최소화 |\n| 열풍(고온공기) 재생 | 온도 상승으로 탈착 | 화재위험 관리 필요 |\n| 감압재생(PSA) | 압력 저하로 탈착 | 순환주기 짧음, 고순도 회수 가능 |\n\n### 3. 재생배가스 처리(용제회수)\n수증기 재생 시 탈착된 고농도 VOCs는 응축(냉각) 공정을 거쳐 액상 용제로 회수하거나 소각 처리한다. 회수형 흡착 시스템은 고가 용제를 재사용할 수 있어 경제성이 높은 경우가 많다.\n\n### 4. 다층(다단) 흡착탑 구조와 압력손실\n대용량 처리를 위해 흡착탑을 여러 층으로 나누거나 여러 기를 병렬 배치하는 경우, 각 층의 압력손실이 균등하도록 충전밀도·입경을 관리해야 하며, 층 사이 재분배판을 설치해 가스흐름의 편류를 방지한다.\n\n| 설계 항목 | 소형 흡착탑 | 대형 다층 흡착탑 |\n|---|---|---|\n| 충전층 구조 | 단일층 | 다층 또는 병렬다탑 |\n| 압력손실 관리 | 단일 계산 | 층별 균등화 필요 |\n| 유지관리 | 전체 교체 | 층별 순차 교체 가능 |\n\n## Ⅴ. 결론\n\n흡착탑 설계는 정적인 흡착등온식(Day 55)을 넘어, 시간에 따른 파과 거동을 예측하고 이를 근거로 충전층 높이·접촉시간·교체주기를 결정하는 동적 설계 과정이다. MTZ 개념을 이해하면 왜 흡착제 전체가 아닌 일부만 실질적으로 흡착에 기여하는지, 왜 충분한 충전층 높이가 필요한지를 논리적으로 설명할 수 있다. 실무에서는 2탑 교대운전과 수증기 재생을 통한 연속 처리, 나아가 회수형 시스템을 통한 용제 재사용까지 고려하여 경제성과 처리효율을 동시에 확보하는 것이 최근 설계 동향이다.\n\n| 요약 | 정적 개념(Day55) | 동적 개념(Day56) |\n|---|---|---|\n| 대상 | 평형흡착량 | 시간에 따른 파과거동 |\n| 대표식 | Freundlich·Langmuir | Bohart-Adams·BDST |\n| 설계 산출물 | 흡착제 종류·이론용량 | 충전층 높이·교체주기 |\n","side":[{"title":"계산 예제 — EBCT와 파과시간 관계","body":"### 조건\n충전층 부피 V=2㎥, 처리가스 유량 Q=600㎥/min인 흡착탑의 공탑접촉시간(EBCT)은?\n\n### 계산\nEBCT = V/Q = 2/600 = 0.00333min = **약 0.2초(200ms)**\n\n실제 VOCs 처리용 활성탄흡착탑은 통상 EBCT 수 초 이상을 확보하도록 설계하므로, 위 조건이라면 충전층 부피를 늘리거나 유량을 분산(다탑 병렬)하는 방향의 재설계가 필요함을 답안에서 지적할 수 있다.\n\n### BDST법 개념 적용 예\n파일럿 시험 결과 충전층 깊이 0.5m에서 파과시간 10시간, 1.0m에서 파과시간 22시간으로 나타났다면, 이 관계(대략 선형)를 이용해 목표 파과시간(예: 48시간)에 필요한 충전층 깊이를 외삽 추정할 수 있다.\n\n### 답안 작성 포인트\n계산문제에서 EBCT·SV는 서로 역수 관계(SV=1/EBCT, 단위 환산 주의)이므로 문제에서 요구하는 값이 무엇인지 먼저 확인 후 계산해야 한다.\n\n### 충전층 높이 산정 순서(실무 절차)\n1. 파일럿 시험 또는 문헌자료로 목표물질의 흡착특성(등온식, 파과거동) 확보\n2. 목표 파과시간(운전주기) 설정\n3. BDST 관계식으로 필요 충전층 높이 산정\n4. 안전계수 반영, 최종 설계 높이 확정\n5. 압력손실·탑 직경과의 상호 검토 후 최종 치수 결정"},{"title":"파과곡선·재생 관련 기출 연계","body":"### 파과곡선 형태에 영향을 미치는 인자\n\n| 인자 | 파과곡선에 미치는 영향 |\n|---|---|\n| 가스유속 | 빠를수록 MTZ 길어지고 파과시간 단축 |\n| 유입농도 | 높을수록 파과시간 단축 |\n| 흡착제 입경 | 작을수록 물질전달 빨라져 MTZ 짧아짐(단 압손 증가) |\n| 온도 | 높을수록 물리흡착 평형 불리, 파과시간 단축 |\n| 습도 | 높을수록(활성탄의 경우) 경쟁흡착으로 파과시간 단축 |\n\n### 흡착탑 이상운전 진단\n1. 예상보다 파과시간이 짧음 → 습도 과다, 흡착제 열화(재생 반복에 따른 성능저하), 채널링(편류) 의심\n2. 압력손실 과다 상승 → 흡착제 분말화·폐색, 입경 과소 선정 검토\n3. 재생 후 흡착능 미회복 → 화학흡착 성분 혼입, 흡착제 수명 도래(교체 필요)\n\n### 기출 연계 자가점검\n1. 흡착탑의 파과곡선을 도시하고 파과점·파과시간의 정의를 설명하시오. *(다수 회차 10~25점)*\n2. 물질전달대(MTZ)의 개념과 흡착탑 설계에서의 의의를 설명하시오. *(114~138회 25점)*\n3. 활성탄 흡착탑의 재생방법을 비교하고 회수형 시스템의 장점을 설명하시오. *(최근 10~25점)*\n\n### 학습 연결 포인트\n지금까지 흡수·흡착(Day 53~56)에서 다룬 물질전달 개념은 다음 구간(연소·NOx저감)의 반응공학적 접근과도 연결되므로, 평형-속도-설계인자로 이어지는 논리 흐름을 기억해두면 학습이 수월하다."}]},"57":{"day":57,"date":"2026-09-26","title":"NOx 생성기작(Thermal·Fuel·Prompt)","keywords":[{"k":"Thermal NOx","subs":["Zeldovich 연쇄반응(O+N2→NO+N 등)","1300℃ 이상 고온에서 급증","온도에 지수함수적으로 민감"]},{"k":"Fuel NOx","subs":["연료 중 질소화합물 산화로 생성","저온(약800℃)에서도 발생","중질유·석탄 등 高질소연료 지배적"]},{"k":"Prompt NOx(Fenimore)","subs":["CH라디칼+N2 화염대 순간반응","연료희박 조건에서도 생성","3기작 중 생성량 가장 적음"]},{"k":"NOx 생성 영향인자","subs":["연소온도(Thermal 지배)","과잉공기율(O2농도)","체류시간(고온 노출시간)"]},{"k":"NO/NO2 배출형태","subs":["배출 시 90%이상 NO형태","대기중 산화되어 NO2 전환","광화학반응(오존생성)의 전구물질"]}],"answer":"# NOx 생성기작(Thermal·Fuel·Prompt)\n\n## Ⅰ. 개요\n\n질소산화물(NOx)은 고정연소원·이동연소원에서 배출되는 대표적 대기오염물질이자, 산성비(Day 26)와 광화학스모그·오존 생성(Day 28~29)의 전구물질이다. 연소 과정에서 NOx는 생성 메커니즘에 따라 Thermal NOx, Fuel NOx, Prompt NOx 세 가지로 구분되며, 이 세 기작의 지배인자(온도·연료질소·라디칼반응)를 정확히 구분하는 것이 다음 학습(Day 58)의 연소조절 저감기술(저녹스버너, FGR 등)이 왜 효과적인지를 이해하는 전제가 된다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. Thermal NOx\n\n### 1. 생성기작(Zeldovich Mechanism)\n공기 중의 질소(N2)와 산소(O2)가 고온에서 해리·반응하여 생성되는 NOx로, 확장 Zeldovich 기작으로 설명된다.\n\n- O2 → 2O (고온에서 산소 해리)\n- O + N2 → NO + N\n- N + O2 → NO + O\n- (확장) N + OH → NO + H\n\n### 2. 특징\n연료의 종류와 무관하게 순수히 **연소온도·체류시간·산소농도**의 함수이며, 약 **1,300℃ 이상**의 고온에서 반응속도가 급격히 증가한다(아레니우스식에 따른 지수함수적 온도 민감성). 연소온도가 소폭만 상승해도 Thermal NOx 생성량은 수 배로 증가할 수 있어, 고온 연소를 사용하는 대형 보일러·가스터빈에서 지배적인 생성원이 된다.\n\n## Ⅲ. Fuel NOx\n\n### 1. 생성기작\n연료 자체에 함유된 질소화합물(피리딘류, 아민류 등 유기질소)이 연소 중 산화되어 생성되는 NOx이다. Thermal NOx와 달리 **비교적 저온(약 800℃ 내외)에서도 발생**할 수 있다는 점이 핵심 차이이다.\n\n### 2. 특징\n연료 중 질소함량이 높을수록(중질유, 석탄 등) 생성 비중이 커지며, 일부 연료(고질소 석탄 등)의 경우 전체 NOx 배출량 중 Fuel NOx가 지배적인 비중을 차지하기도 한다. 가스연료(천연가스 등)는 연료 중 질소함량이 거의 없어 Fuel NOx 생성이 미미하다.\n\n## Ⅳ. Prompt NOx(Fenimore NOx)와 3대 기작 비교\n\n### 1. Prompt NOx 생성기작\n탄화수소 연료의 연소 화염대에서 생성되는 CH·CH2 등 탄화수소 라디칼이 공기 중 N2와 직접 반응하여 순간적으로 NOx를 생성하는 기작(Fenimore가 발견하여 Fenimore NOx라고도 함)이다. 연료가 과잉인(fuel-rich) 화염 전단부에서 주로 발생하며, 비교적 저온에서도 생성될 수 있으나 3대 기작 중 생성량이 가장 적다.\n\n### 2. 3대 NOx 생성기작 비교표\n\n| 구분 | Thermal NOx | Fuel NOx | Prompt NOx |\n|---|---|---|---|\n| 지배인자 | 연소온도(1300℃↑) | 연료 중 질소함량 | 탄화수소라디칼-N2 반응 |\n| 생성온도 | 고온(1300℃ 이상) | 저온에서도 발생(~800℃) | 저온에서도 발생 |\n| 연료 의존성 | 무관 | 연료질소 함량에 비례 | 탄화수소계 연료 |\n| 생성량 비중 | 대형설비에서 지배적 | 고질소연료에서 지배적 | 상대적으로 미미 |\n| 저감 접근 | 연소온도 저감(연소조절) | 저질소연료 전환, 탈질 | 화염구조 개선 |\n\n### 3. NOx 배출형태와 대기 중 전환\n연소로에서 배출되는 NOx는 대부분(통상 90% 이상) **NO(일산화질소)** 형태이며, 대기 중으로 방출된 후 오존 등 산화제와 반응하여 **NO2(이산화질소)**로 전환된다. 이 NO-NO2 전환 과정은 Day 28에서 학습한 오존 생성기작과 NOx/VOC 광화학반응 사이클에 직접 연결된다.\n\n### 4. NOx 생성기작별 저감접근 요약\n세 가지 생성기작은 지배인자가 서로 다르므로 저감기술 선정 시 사업장의 연소조건과 연료 특성을 먼저 진단해야 한다.\n\n| 생성기작 | 주요 저감접근 | 관련 기술(예고) |\n|---|---|---|\n| Thermal NOx | 화염온도·체류시간 저감 | 저녹스버너, FGR(Day58) |\n| Fuel NOx | 연료 질소함량 저감, 단계연소 | 저질소연료 전환, 연료 전처리 |\n| Prompt NOx | 화염구조 개선(연료-공기 혼합 최적화) | 버너 설계 개선 |\n\n### 5. 배출원별 지배 기작 경향\n대형 화력발전 보일러(고온연소)는 Thermal NOx 비중이 크고, 석탄화력 등 질소함량이 높은 고체연료는 Fuel NOx 비중이 상대적으로 크다. 반면 가스터빈 등 예혼합연소 설비는 Prompt NOx의 상대적 비중이 커질 수 있다. 이러한 배출원별 특성 이해가 적정 저감기술 선정의 출발점이 된다.\n\n## Ⅴ. 결론\n\nNOx는 Thermal·Fuel·Prompt 세 가지 서로 다른 생성기작을 가지며, 각 기작의 지배인자가 다르므로 저감기술 또한 기작별로 차별화하여 접근해야 한다. Thermal NOx는 연소온도 저감(저녹스버너, 배가스재순환), Fuel NOx는 저질소 연료 전환이나 후단 탈질(SCR·SNCR), Prompt NOx는 화염구조 개선이 각각의 대응 원리가 된다. 「대기환경보전법」상 질소산화물 배출허용기준이 지속적으로 강화되는 추세이므로, 사업장 배출원 특성(연료 종류, 연소온도)에 따라 지배적인 생성기작을 먼저 파악한 뒤 저감기술을 선정하는 것이 실무적으로 중요하다.\n\n| 항목 | 확인 포인트 |\n|---|---|\n| 연료 종류 | 가스(Thermal 위주)·중질유/석탄(Fuel 병존) |\n| 연소온도 | 1,300℃ 이상 여부(Thermal 지배 판정) |\n| 화염형태 | 예혼합·확산화염(Prompt 기여도 판단) |\n","side":[{"title":"온도-NOx 생성량 관계와 실무 적용","body":"### 온도 민감도 개념 정리\nThermal NOx 생성속도는 아레니우스식 형태(k∝exp(-Ea/RT))를 따르므로, 연소온도가 일정 임계값(약 1,300~1,500℃) 이상에서는 온도 상승에 따라 생성량이 지수적으로 급증한다.\n\n| 연소온도 | Thermal NOx 생성 경향 |\n|---|---|\n| 1,300℃ 미만 | 생성 미미 |\n| 1,300~1,500℃ | 생성 시작, 온도상승에 민감 |\n| 1,500℃ 이상 | 급격히 증가 |\n\n### 연소조절 저감원리와의 연결(Day58 예고)\n이 온도 민감성 때문에 저녹스버너(Low-NOx Burner), 배가스재순환(FGR), 단계연소(Staged Combustion) 등 연소조절 기술은 공통적으로 \"국부적 화염 최고온도를 낮추거나 산소농도를 낮추는\" 원리로 Thermal NOx를 저감한다.\n\n### 답안 작성 포인트\nNOx 저감기술을 묻는 문제에서는 먼저 어떤 생성기작(Thermal/Fuel/Prompt)을 저감 대상으로 하는지 명시한 뒤, 해당 기작의 지배인자를 낮추는 방향으로 기술 원리를 서술하면 논리적 일관성이 확보된다.\n\n### 온도별 NOx 생성 개념표(정성적)\n| 화염 최고온도 | 예상 지배기작 | 대응방향 |\n|---|---|---|\n| 1,600℃ 이상 | Thermal NOx 급증 | 화염온도 저감이 최우선 |\n| 1,300~1,600℃ | Thermal+Fuel 병존 | 온도저감+연료질소 관리 |\n| 1,300℃ 미만 | Fuel/Prompt 상대적 우세 | 연료 전환, 화염구조 개선 |\n\n### 온도계측의 실무 어려움\n연소실 내 실제 화염 최고온도는 직접 측정이 어려워 배가스 온도·산소농도 등 간접지표로 추정하는 경우가 많으며, 설계 단계에서는 전산유체역학(CFD) 연소해석을 활용해 국부 최고온도를 예측하기도 한다."},{"title":"NOx 생성기작 기출 연계와 심화","body":"### 과잉공기율(공기비)과 NOx의 관계\n과잉공기율이 높아지면 연소실 내 산소농도는 증가하지만, 동시에 과잉공기에 의한 냉각효과로 화염온도가 낮아져 Thermal NOx는 오히려 감소하는 경향을 보일 수 있다. 다만 과잉공기율이 지나치게 낮으면(연료과잉) 불완전연소로 CO·매연이 증가하므로, 최적 공기비 관리가 중요하다.\n\n| 공기비 조건 | Thermal NOx | 불완전연소물(CO 등) |\n|---|---|---|\n| 과잉공기 과다 | 화염온도↓→NOx 감소 경향 | 낮음 |\n| 이론공기비 부근 | 화염온도 최고→NOx 최대 | 낮음 |\n| 공기부족(연료과잉) | 화염온도↓→NOx 감소 | 급증(불완전연소) |\n\n### 체류시간의 영향\n고온영역에서의 체류시간이 길수록 Thermal NOx 생성 반응이 더 진행될 시간을 확보하므로 생성량이 증가한다. 이 때문에 연소가스를 고온영역에서 신속히 냉각시키는 것도 저감전략 중 하나가 된다.\n\n### 기출 연계 자가점검\n1. Thermal NOx의 생성기작(Zeldovich)을 설명하고 온도 의존성을 논하시오. *(다수 회차 25점)*\n2. Fuel NOx와 Thermal NOx의 생성기작 차이를 비교하고 각각의 저감방안을 제시하시오. *(114~138회 25점)*\n3. Prompt NOx의 생성기작과 다른 NOx 생성기작과의 차이점을 설명하시오. *(최근 10점)*\n4. 연소용 공기비가 NOx 및 불완전연소물 생성에 미치는 영향을 설명하시오. *(다수 회차 25점)*\n\n### 광화학반응과의 연결(Day28~29 복습)\n배출된 NO는 대기 중에서 오존 등과 반응해 NO2로 산화되며, NO2는 자외선에 의해 광분해되어 오존 생성사이클(NOx-VOC-O3)의 핵심 전구물질로 작용한다. NOx 저감이 1차 오염물질 관리뿐 아니라 광화학스모그·오존 저감에도 직결된다는 점을 답안 결론부에 연결하면 통합적 이해를 보여줄 수 있다."}]},"58":{"day":58,"date":"2026-09-27","title":"연소조절에 의한 NOx 저감(저녹스버너·FGR)","keywords":[{"k":"연소조절(Combustion Modification)","subs":["연소 중(in-furnace) 1차적 저감기술","후처리(SCR/SNCR) 대비 저비용","화염 최고온도·국부산소농도 저감 원리"]},{"k":"저녹스버너(Low-NOx Burner)","subs":["단계연소(Air/Fuel Staging)","1차연료과잉→2차완전연소","저감률 통상 30~50%"]},{"k":"배가스재순환(FGR)","subs":["배가스 10~30% 재순환 혼합","산소농도 희석+화염온도 저하","Thermal NOx 저감에 특히 효과적"]},{"k":"기타 연소조절기법","subs":["스팀/수분분사(화염온도저감)","저산소연소(과잉공기 최소화)","다단버너 배치(열부하 분산)"]},{"k":"연소조절의 한계","subs":["단독저감률 30~50% 수준 한계","CO·불완전연소물 증가 우려","강화기준 대응위해 후처리 병행필요"]}],"answer":"# 연소조절에 의한 NOx 저감(저녹스버너·FGR)\n\n## Ⅰ. 개요\n\n연소조절(Combustion Modification)은 연소 과정 자체의 조건(온도·산소농도·체류시간)을 조절하여 NOx 생성을 원천적으로 억제하는 1차적(in-furnace) 저감기술이다. Day 57에서 학습한 Thermal NOx의 강한 온도 의존성에 근거하여, 화염의 국부적 최고온도를 낮추거나 국부 산소농도를 낮추는 방향으로 작동하며, 후단 처리기술(SCR·SNCR, Day 59~61)보다 시설투자비가 낮아 우선적으로 적용되는 저감방안이다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 저녹스버너(Low-NOx Burner)\n\n### 1. 단계연소(Air/Fuel Staging) 원리\n저녹스버너는 연료 또는 공기를 한 번에 공급하지 않고 다단으로 나누어 공급함으로써 국부적 화염온도와 산소농도를 동시에 낮춘다.\n\n- **1차 연소영역**: 연료과잉(fuel-rich) 조건으로 운전, 산소 부족으로 화염온도가 낮아져 Thermal NOx 생성 억제\n- **2차 연소영역**: 나머지 공기를 추가 공급하여 상대적으로 낮은 온도에서 완전연소 유도\n\n### 2. 특징\n| 항목 | 내용 |\n|---|---|\n| 저감원리 | 화염 최고온도·국부 O2농도 저감 |\n| 저감률 | 통상 30~50% |\n| 적용대상 | 보일러, 산업로 등 고정연소원 |\n| 부작용 관리 | 단계연소 과다 시 화염 불안정·CO 증가 우려 |\n\n## Ⅲ. 배가스재순환(Flue Gas Recirculation, FGR)\n\n### 1. 원리\n연소 후 배출되는 배가스의 일부(통상 **10~30%**)를 연소용 공기와 혼합하여 연소실에 재투입하는 방식이다.\n\n1. **산소농도 희석 효과**: 재순환된 배가스(저산소·불활성) 혼입으로 국부 산소농도 저하\n2. **열용량 흡열 효과**: 재순환 배가스가 화염의 열을 흡수하여 화염 최고온도를 저하\n\n이 두 효과가 결합되어 Thermal NOx 생성을 효과적으로 억제하며, 특히 고온 연소를 사용하는 대형 보일러·가스터빈에서 효과가 크다.\n\n### 2. 저녹스버너와의 병용\nFGR은 단독으로도 사용되지만, 저녹스버너와 병용하여 단계연소의 효과와 재순환의 열흡수 효과를 함께 활용하는 것이 실무에서 일반적이다.\n\n## Ⅳ. 기타 연소조절기법과 저감 한계\n\n### 1. 기타 연소조절기법\n\n| 기법 | 원리 | 적용 |\n|---|---|---|\n| 스팀/수분 분사 | 화염 내 수분 증발잠열로 온도저감 | 가스터빈 등 |\n| 저산소연소(Low Excess Air) | 과잉공기 최소화로 산소농도·열손실 저감 | 전 연소설비 공통 |\n| 다단버너 배치 | 연소실 내 열부하를 여러 버너에 분산 | 대형 보일러 |\n| 저NOx 화염형성기술 | 화염 형상·혼합 패턴 최적화 | 신설 버너 설계 |\n\n### 2. 연소조절 기법 종합 비교\n\n| 기법 | 저감 대상 | 저감률(단독) | 주의사항 |\n|---|---|---|---|\n| 저녹스버너 | Thermal NOx | 30~50% | 화염 불안정 관리 |\n| FGR | Thermal NOx | 20~50% | 배가스 재순환 팬 추가 필요 |\n| 저산소연소 | Thermal NOx | 10~20% | CO 증가 위험 |\n| 스팀분사 | Thermal NOx | 30~60%(가스터빈) | 열효율 저하, 용수 소비 |\n\n### 2-1. 저녹스버너·FGR 적용 시 고려사항 보충\n버너 교체나 FGR 도입은 기존 노(furnace) 형상·연소부하와의 정합성이 중요하므로, 신설 여부와 무관하게 사전 열정산(heat balance) 및 CFD 연소해석을 통해 화염길이·열부하 분포 변화가 전열면 성능에 미치는 영향을 검토하는 것이 실무적으로 권장된다.\n\n### 3. 연소조절의 한계\n연소조절 기법은 단독으로 통상 30~50% 수준의 NOx 저감률을 나타내며, 「대기환경보전법 시행규칙」상 강화되는 배출허용기준을 충족하기 위해서는 이것만으로 부족한 경우가 많다. 이 경우 SNCR·SCR 등 후단 탈질설비(Day 59~61)와 병행 적용하여 총 저감률을 90% 이상까지 확보하는 것이 일반적이다. 또한 단계연소·저산소연소를 과도하게 적용하면 불완전연소에 따른 CO·매연 증가라는 상충 문제가 발생할 수 있어, 최적 운전조건 관리가 실무적으로 중요하다.\n\n### 4. 연소조절 적용 시 통합 검토사항\n연소조절 기법은 단일 기법보다 여러 기법을 조합할 때 시너지가 크다. 예를 들어 저녹스버너와 FGR을 병행하면 단계연소에 의한 국부 저온영역 형성과 재순환배가스에 의한 열용량 증가 효과가 결합되어 단독 적용보다 높은 저감률을 기대할 수 있다.\n\n| 조합 | 기대 저감률 | 비고 |\n|---|---|---|\n| 저녹스버너 단독 | 30~50% | 기본 적용 |\n| 저녹스버너+FGR | 50~70% | 실무 표준 조합 |\n| 저녹스버너+FGR+저산소연소 | 60~75% | 상한에 근접, CO관리 필요 |\n| 연소조절+SCR/SNCR | 90% 이상 | 강화기준 대응 표준 |\n\n## Ⅴ. 결론\n\n연소조절에 의한 NOx 저감은 Thermal NOx의 온도 의존성을 이용해 화염 최고온도와 국부 산소농도를 낮추는 저비용·1차적 저감방안으로, 저녹스버너와 배가스재순환이 대표적 기술이다. 다만 단독 저감률이 제한적(30~50%)이고 불완전연소 부작용이 상충관계로 존재하므로, 강화되는 배출기준에 대응하기 위해서는 후단 탈질설비(SNCR/SCR)와의 병행 적용이 실무적 표준으로 자리잡고 있다. 향후 설계에서는 연소조절-후처리를 통합적으로 최적화하는 접근이 요구된다.\n\n| 설계단계 | 우선 검토 기법 | 근거 |\n|---|---|---|\n| 신설 설비 | 저녹스버너+FGR 기본 반영 | 저비용 1차 저감 |\n| 기존 설비 개조 | 운전조건 최적화(공기비 등)부터 | 투자비 최소화 |\n| 강화기준 대응 | 후단 SNCR/SCR 추가 | 90% 이상 저감 필요시 |\n","side":[{"title":"FGR 비율과 저감효과 개념 계산","body":"### FGR율 정의\n**FGR율(%) = 재순환배가스량 / (재순환배가스량+연소용공기량) × 100**\n\n### 개념 예제\n연소용 공기량 1,000㎥/h에 재순환 배가스 250㎥/h를 혼합하는 경우:\n\nFGR율 = 250/(250+1,000)×100 ≈ **20%**\n\n이 조건에서 재순환 배가스가 산소를 거의 포함하지 않는다고 가정하면, 혼합가스 중 유효 산소농도는 순수 공기 대비 약 20% 희석된 수준으로 낮아지는 효과를 기대할 수 있다(실제 저감률은 연소조건·설비별 실측 필요).\n\n### 실무 설계 시 고려사항\n| 고려요소 | 내용 |\n|---|---|\n| 재순환팬 용량 | FGR율에 비례한 추가 송풍동력 필요 |\n| 배관·덕트 | 고온 배가스 재순환 경로의 내열설계 |\n| 화염 안정성 | FGR율 과다 시 실화(flame-out) 위험 |\n| 저감효과 한계 | FGR율 20~30% 초과 시 저감률 개선폭 둔화 |\n\n### 답안 작성 포인트\nFGR 관련 계산문제는 재순환율 정의식을 정확히 쓰고, 재순환배가스가 \"희석\"과 \"흡열\" 두 가지 메커니즘으로 동시에 작용한다는 점을 함께 서술해야 한다.\n\n### FGR 적용 시 부가 검토사항\n| 항목 | 검토 내용 |\n|---|---|\n| 재순환팬 동력 | FGR율에 비례해 송풍동력 추가 소요 |\n| 노 내 유동 | 재순환가스 혼입에 따른 유동 패턴 변화 |\n| 열효율 영향 | 배가스 현열 일부 재순환으로 열손실 저감 효과 병존 |\n| 제어방식 | 부하변동에 따른 FGR율 자동제어 필요 |"},{"title":"연소조절 기법 기출 연계와 비교 정리","body":"### 저녹스버너 vs FGR vs 후처리(SCR) 비교\n\n| 구분 | 저녹스버너 | FGR | SCR(후처리) |\n|---|---|---|---|\n| 적용 위치 | 연소실 내부 | 연소실 내부(급기계통) | 연소 후(배가스 계통) |\n| 저감률 | 30~50% | 20~50% | 80~90%(단독) |\n| 투자비 | 낮음 | 중간 | 높음 |\n| 촉매 등 소모품 | 불필요 | 불필요 | 촉매 교체비용 발생 |\n| 적용 우선순위 | 1차 적용(저비용) | 1차 적용(병용) | 2차 적용(강화기준 대응) |\n\n### 저감기술 조합 전략\n실무에서는 \"저녹스버너+FGR\"로 1차 저감(30~60%)을 확보한 후, 잔여 배출량이 배출허용기준을 초과할 경우에만 SNCR·SCR을 추가하는 단계적 접근이 경제적으로 합리적이다. 답안에서 이러한 단계적 접근을 제시하면 실무적 이해도를 보여줄 수 있다.\n\n### 기출 연계 자가점검\n1. 저녹스버너의 단계연소 원리와 저감효과를 설명하시오. *(다수 회차 25점)*\n2. 배가스재순환(FGR)의 NOx 저감 메커니즘을 두 가지로 나누어 설명하시오. *(114~138회 25점)*\n3. 연소조절 기법의 한계와 후처리 기술 병행의 필요성을 논하시오. *(최근 25점)*\n4. 저산소연소 시 NOx와 CO 배출의 상충관계(trade-off)를 설명하시오. *(다수 회차 10점)*\n\n### 실무 운전관리 체크리스트\n1. 배가스 O2·CO 농도 상시 모니터링(공기비 최적화 근거)\n2. 저녹스버너 화염 안정성 정기점검(실화·역화 방지)\n3. FGR 재순환팬 풍량 제어 로직 검증\n4. 계절별(대기온도 변화) 연소조건 재최적화"}]},"59":{"day":59,"date":"2026-09-28","title":"SCR의 원리·촉매·설계인자","keywords":[{"k":"SCR 반응원리","subs":["4NO+4NH3+O2→4N2+6H2O","선택적(Selective): NH3가 NOx와 우선반응","반응온도 통상 300~400℃"]},{"k":"SCR 촉매 종류","subs":["V2O5-TiO2(+WO3)계: 표준, 300~400℃","제올라이트계: 고온용 400~600℃","허니콤·플레이트·코루게이트 형상"]},{"k":"설계인자","subs":["공간속도(AV/GHSV)","NH3/NOx 몰비(이론비 1:1)","암모니아슬립 관리(통상 수ppm)"]},{"k":"SCR 배치방식","subs":["High-dust: 집진기 전단, 고온고분진","Low-dust: 집진기 후단","Tail-end: 탈황후단, 재열필요"]},{"k":"SCR 저감성능","subs":["단독 저감효율 80~90%이상","연소조절과 병행시 종합 90%대","촉매 피독·열화는 Day62 연계"]}],"answer":"# SCR의 원리·촉매·설계인자\n\n## Ⅰ. 개요\n\n선택적촉매환원법(Selective Catalytic Reduction, SCR)은 촉매 존재 하에 환원제(주로 암모니아, NH3)를 이용하여 NOx를 무해한 질소(N2)와 수증기(H2O)로 환원시키는 후처리 탈질기술이다. Day 58에서 학습한 연소조절이 NOx의 \"생성 자체를 억제\"하는 접근이라면, SCR은 이미 생성된 NOx를 화학적으로 \"환원 제거\"하는 접근으로, 현재 산업현장에서 가장 널리 적용되는 고효율(단독 80~90% 이상) 탈질기술이다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. SCR 반응원리\n\n### 1. 표준반응식\n촉매 표면에서 NH3와 NOx(주로 NO)가 산소와 함께 반응하여 질소와 물로 전환된다.\n\n**4NO + 4NH3 + O2 → 4N2 + 6H2O**\n\n배가스 중 NO2가 일부 포함된 경우의 반응식도 병행하여 진행된다.\n\n**2NO2 + 4NH3 + O2 → 3N2 + 6H2O**\n\n### 2. \"선택적(Selective)\"의 의미\n암모니아는 이론적으로 산소(O2)와도 반응(연소)할 수 있으나, SCR 촉매는 NH3가 O2보다 NOx와 **우선적으로** 반응하도록 선택성을 부여하여, 불필요한 NH3 산화(부반응)를 최소화하면서 탈질 효율을 극대화한다.\n\n### 3. 반응온도 범위\n표준 V2O5-TiO2계 촉매의 활성온도는 통상 **300~400℃**이며, 이 범위를 벗어나면(저온 또는 고온) 반응속도 저하 또는 촉매 열화가 발생할 수 있다. 최근에는 200℃대에서도 활성을 갖는 저온SCR 촉매 개발이 진행되고 있다.\n\n## Ⅲ. SCR 촉매의 종류와 형상\n\n### 1. 촉매 종류\n\n| 촉매 | 활성온도 | 특징 |\n|---|---|---|\n| V2O5-TiO2(+WO3)계 | 300~400℃ | 표준촉매, 산성가스 저항성 우수, 가장 널리 사용 |\n| 제올라이트계 | 400~600℃ | 고온 적용 가능, 내구성 우수 |\n| 저온용 촉매(개발 중) | 약 150~250℃ | 열교환 없이 저온배가스 직접 처리 지향 |\n\n### 2. 촉매 형상\n\n| 형상 | 특징 |\n|---|---|\n| 허니콤형(Honeycomb) | 비표면적 큼, 압력손실 낮음, 가장 일반적 |\n| 플레이트형(Plate) | 고분진 배가스에 강함(폐색 저항성) |\n| 코루게이트형(Corrugated) | 허니콤과 플레이트의 중간 특성 |\n\n## Ⅳ. 설계인자와 배치방식\n\n### 1. 주요 설계인자\n\n| 설계인자 | 정의 | 설계 시사점 |\n|---|---|---|\n| 공간속도(AV/GHSV) | 촉매 단위체적당 처리가스량 | 작을수록(체류시간↑) 저감효율↑, 촉매량↑ |\n| NH3/NOx 몰비 | 주입 암모니아와 NOx의 몰비 | 이론비(약 1:1) 부근에서 운전 |\n| 암모니아슬립 | 미반응 NH3의 배출 | 통상 수 ppm 이내로 관리(2차오염 방지) |\n| 촉매층수 | 반응기 내 촉매 배치 단수 | 통상 2~3층, 열화 대비 예비층 확보 |\n\n과잉 NH3 분사 시 반응하지 않은 NH3가 그대로 배출(암모니아슬립)되어 별도의 대기오염물질이자, 후단 설비(공기예열기 등)에 황산암모늄염 형태로 부착되는 문제를 유발할 수 있다.\n\n### 2. SCR 배치방식(반응기 위치)\n\n| 방식 | 위치 | 특징 |\n|---|---|---|\n| High-dust 방식 | 집진기 전단(고온·고분진) | 재열 불필요, 촉매 마모·피독 위험 큼 |\n| Low-dust 방식 | 집진기 후단(저분진) | 촉매 수명 유리, 온도유지용 재열 검토 |\n| Tail-end 방식 | 탈황설비 후단 | 배가스 청정, 저온이라 재가열 필요(에너지비용↑) |\n\n배치방식 선정은 배가스 온도·분진 특성·기존 설비 배치에 따라 달라지며, 촉매 피독·열화 문제(Day 62에서 상세 학습)와도 직결된다.\n\n### 3. 반응기 압력손실과 촉매층 구조\nSCR 반응기의 압력손실은 촉매층수·형상·공간속도에 좌우되며, 통상 층당 수십mmH2O 수준의 압력손실이 발생한다. 촉매층 사이에는 분진 퇴적을 막기 위한 청소장치(수트블로어, Sonic Horn 등)를 설치하는 것이 일반적이다.\n\n| 구성요소 | 역할 |\n|---|---|\n| 촉매층(2~3단) | 실제 탈질반응 진행 |\n| 예비층(옵션) | 촉매 열화 대비, 활성 저하 시 교체 |\n| 암모니아 분사格자(AIG) | NH3와 배가스의 균일혼합 |\n| 정류판(유동정리) | 촉매 전단 유속분포 균일화 |\n\n### 4. SCR과 연소조절의 통합 설계\nSCR은 단독으로도 높은 저감효율을 보이지만, Day 58의 연소조절 기법과 병행하면 SCR 반응기로 유입되는 NOx 절대량 자체가 줄어들어 촉매 부담(및 NH3 소요량)이 감소하고 촉매 수명이 길어지는 효과가 있다.\n\n## Ⅴ. 결론\n\nSCR은 촉매를 매개로 암모니아와 NOx를 선택적으로 반응시켜 질소와 물로 환원하는 고효율 탈질기술로, 촉매 종류·형상·설계인자(공간속도, NH3/NOx 몰비, 암모니아슬립)를 적절히 설계·운전하는 것이 핵심이다. 연소조절(Day 58)과 SCR을 병행 적용하면 종합 저감효율을 90% 이상까지 확보할 수 있어, 「대기환경보전법」상 강화되는 질소산화물 배출허용기준에 대응하는 표준적 조합으로 자리잡고 있다. 다음 학습에서는 SCR과 유사하나 촉매 없이 작동하는 SNCR 및 Hybrid 시스템을 다룬다.\n\n| 항목 | 요약 |\n|---|---|\n| 핵심반응 | 4NO+4NH3+O2→4N2+6H2O |\n| 표준촉매 | V2O5-TiO2계, 300~400℃ |\n| 핵심설계인자 | 공간속도, NH3/NOx몰비, 슬립관리 |\n| 저감효율 | 단독 80~90%↑, 연소조절 병행시 최적 |\n","side":[{"title":"계산 예제 — NH3 소요량 산정","body":"### 조건\n배가스 중 NOx(NO 기준) 농도 200ppm, 유량 100,000㎥/h, NH3/NOx 몰비를 이론비인 1:1로 운전할 때 시간당 NH3 소요량(㎏/h, 표준상태 기준)은?\n\n### 계산\nNOx 몰유량 = 200×10⁻⁶ × 100,000㎥/h ÷ 22.4㎥/kmol = 20㎥/h ÷ 22.4 ≈ 0.893 kmol/h\n\nNH3/NOx=1:1이므로 NH3 몰유량 = 0.893 kmol/h\n\nNH3 질량유량 = 0.893 × 17(NH3 분자량) ≈ **15.2 kg/h**\n\n### 실제 설계 시 보정\n실제로는 NH3/NOx 몰비를 이론비보다 약간 높게(1.0~1.2 수준) 설정하여 탈질효율을 확보하되, 과잉주입에 따른 암모니아슬립 증가와 상충관계를 고려해 최적점을 설정한다.\n\n### 답안 작성 포인트\n계산문제에서는 표준상태(0℃, 1atm) 몰부피 22.4㎥/kmol을 사용하는지, 실측조건(온도·압력 보정)을 사용하는지 문제 조건을 반드시 확인해야 하며, 답안에 가정을 명시하는 것이 감점을 피하는 방법이다.\n\n### NH3 저장·공급설비 고려사항\n| 항목 | 내용 |\n|---|---|\n| 저장형태 | 액체암모니아 또는 요소수(Urea) 분해방식 |\n| 안전관리 | 「고압가스 안전관리법」등 관련 법규 적용 검토 |\n| 정량공급 | 부하변동에 따른 NH3 분사량 자동제어 필요 |\n| 대안 환원제 | 요소수 사용 시 열분해·가수분해 공정 추가 필요 |"},{"title":"SCR 배치방식·촉매 관련 기출 연계","body":"### 배치방식별 상세 비교\n\n| 항목 | High-dust | Low-dust | Tail-end |\n|---|---|---|---|\n| 배가스 온도 | 고온(재열 불필요) | 중간(경우별 재열 검토) | 저온(재열 필수) |\n| 분진 노출 | 높음(마모·폐색 위험) | 낮음 | 매우 낮음 |\n| 촉매 수명 | 상대적으로 짧음 | 김 | 가장 김 |\n| 초기투자·운영비 | 재열비 없음, 촉매교체비 큼 | 중간 | 재열 에너지비용 큼 |\n| 적용 우선순위 | 신설 대형설비 | 기존설비 개조 | 탈황 후단 활용시 |\n\n### 암모니아슬립 관리의 중요성\n암모니아슬립이 과다하면 (1) NH3 자체가 대기오염물질로 배출, (2) 배가스 중 SO3와 반응해 황산암모늄염(NH4HSO4 등)을 형성하여 후단 공기예열기·덕트에 부착·부식을 유발하는 문제가 발생한다. 따라서 실시간 NH3/NOx 비율 제어(피드포워드+피드백 제어)가 실무적으로 중요하다.\n\n### 기출 연계 자가점검\n1. SCR의 반응원리를 화학반응식과 함께 설명하시오. *(다수 회차 25점)*\n2. SCR 촉매의 종류와 활성온도 범위를 설명하시오. *(114~138회 10~25점)*\n3. SCR의 설계인자(공간속도, NH3/NOx 몰비)가 탈질효율에 미치는 영향을 설명하시오. *(최근 25점)*\n4. SCR의 반응기 배치방식(High-dust, Low-dust, Tail-end)을 비교 설명하시오. *(다수 회차 25점)*\n\n### 촉매 열화 예고(Day62 연계)\nSCR 촉매는 운전기간이 길어질수록 비소·알칼리금속 등에 의한 피독, 분진 마모, 열적 소결(sintering) 등으로 활성이 저하된다. High-dust 배치일수록 이러한 열화가 빠르게 진행되므로, 배치방식 선정 시 촉매 수명과 유지관리비용을 함께 고려해야 한다는 점을 답안에 언급하면 완성도가 높아진다."}]},"60":{"day":60,"date":"2026-09-29","title":"2단계 가스상·연소·측정 회독 1회차","keywords":[{"k":"흡수 이론","subs":["헨리법칙 P=Hx, H작을수록 이용성","2막이론 1/KG=1/kg+H/kl","NTU-HTU법 Z=HTU×NTU"]},{"k":"흡수장치·충전물","subs":["충전탑·분무탑·단탑·벤투리","충전물 구비조건(비표면적·공극률)","로딩점→플러딩점, 편류방지"]},{"k":"흡착 이론","subs":["물리흡착(가역)vs화학흡착(비가역)","Freundlich x/m=kC^(1/n)","파과곡선·MTZ·BDST법"]},{"k":"NOx 생성·연소조절","subs":["Thermal(Zeldovich)·Fuel·Prompt","저녹스버너(단계연소) 30~50%","FGR: 희석+흡열 이중효과"]},{"k":"SCR 탈질","subs":["4NO+4NH3+O2→4N2+6H2O","V2O5-TiO2계 300~400℃","공간속도·NH3/NOx몰비·슬립관리"]}],"answer":"# 2단계 회독 1회차 — Day 53~59 요약·자가점검\n\n## Ⅰ. 회독 목적 + 논리 흐름도\n\n이번 구간은 가스상 오염물질 처리의 두 축(흡수·흡착)과 고정연소원 NOx 저감의 두 접근(연소조절·촉매환원)을 다룬다. 흡수(Day53~54)와 흡착(Day55~56)은 \"물질전달\"이라는 공통 원리 위에서 매체가 액체냐 고체냐로 갈라지고, NOx 저감은 \"생성 억제(연소조절)\"와 \"생성 후 제거(SCR)\"라는 두 단계적 접근으로 구성된다는 점이 이 구간 전체를 관통하는 핵심이다.\n\n```\n[가스상 오염물질 제거 - 물질전달]\n흡수(Day53~54): 헨리법칙→2막이론→NTU-HTU→충전탑설계\n   ↓ 매체: 액체, 대상: SOx·HCl·NH3(무기가스, 중~고농도)\n흡착(Day55~56): 등온식(Freundlich/Langmuir)→파과곡선→MTZ→BDST설계\n   ↓ 매체: 고체(활성탄), 대상: VOCs·악취(유기가스, 저농도)\n        ↓\n[NOx 저감 - 생성억제와 제거]\nDay57: NOx 3대 생성기작(Thermal·Fuel·Prompt) 규명\n   ↓\nDay58: 연소조절(저녹스버너·FGR) → 생성 자체를 억제(30~50%)\n   ↓\nDay59: SCR(선택적촉매환원) → 생성된 NOx를 화학적으로 제거(80~90%↑)\n   ↓\n연소조절+SCR 병행 → 종합 저감률 90%대, 배출허용기준 대응\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 헨리법칙 | P = **H·x** | ☐ |\n| 2막이론 총괄계수 | 1/KG = **1/kg + H/kl** | ☐ |\n| 충전탑 높이 | Z = **HTU×NTU** | ☐ |\n| 설계유속 선정 | 플러딩속도의 **50~75%** | ☐ |\n| Freundlich식 | x/m = **k·C^(1/n)** | ☐ |\n| Langmuir식 | x/m = **abC/(1+bC)** | ☐ |\n| 파과점 기준 | Ct/C0 = **5~10%** | ☐ |\n| Thermal NOx 생성온도 | **1,300℃** 이상 | ☐ |\n| 저녹스버너 저감률 | **30~50%** | ☐ |\n| FGR 재순환율 | 통상 **10~30%** | ☐ |\n| SCR 표준반응 | 4NO+4NH3+O2→**4N2+6H2O** | ☐ |\n| SCR 촉매 활성온도 | **300~400℃**(V2O5-TiO2계) | ☐ |\n| NH3/NOx 몰비 | 이론비 **약 1:1** | ☐ |\n| 암모니아슬립 관리기준 | 통상 **수 ppm 이내** | ☐ |\n| SCR 단독 저감효율 | **80~90%** 이상 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **헨리법칙**: P = H·x\n2. **총괄물질전달계수**: 1/KG = 1/kg + H/kl\n3. **충전탑 높이**: Z = HTU×NTU\n4. **Freundlich식**: x/m = k·C^(1/n)\n5. **Langmuir식**: x/m = a·b·C/(1+b·C)\n6. **공탑접촉시간**: EBCT = 충전층부피/가스유량\n7. **Thermal NOx 생성반응(Zeldovich)**: O+N2→NO+N, N+O2→NO+O\n8. **FGR율**: 재순환배가스량/(재순환배가스량+연소용공기량)×100\n9. **SCR 표준반응**: 4NO+4NH3+O2→4N2+6H2O\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 흡수 vs 흡착 | 액체 매체, 중~고농도 | 고체 매체, 저농도(ppm) | 매체의 상(phase) |\n| 물리흡착 vs 화학흡착 | 가역적, 다층, 저발열 | 비가역적, 단층, 고발열 | 결합력의 종류 |\n| Thermal NOx vs Fuel NOx | 순수 온도지배, 연료무관 | 연료질소 함량지배 | 지배인자 |\n| 연소조절 vs SCR | 생성 자체를 억제(저비용) | 생성물을 화학적 제거(고효율) | 접근 시점 |\n| 로딩점 vs 플러딩점 | 액정체 시작 | 액범람, 운전불가 | 심각도 |\n| 파과점 vs 완전포화 | Ct/C0=5~10%(교체시점) | Ct→C0(흡착능 소진) | 관리 기준 vs 한계상태 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 헨리의 법칙과 2막이론을 이용해 흡수탑 물질전달 메커니즘을 설명하시오. *(114~138회 25점)*\n2. 흡수탑 충전물의 구비조건과 로딩·플러딩 현상을 설명하시오. *(다수 회차 25점)*\n3. 물리흡착과 화학흡착을 비교하고 흡착등온식(Freundlich·Langmuir)을 설명하시오. *(다수 회차 10~25점)*\n4. 활성탄 흡착탑의 파과곡선과 물질전달대(MTZ) 개념을 설명하시오. *(114~138회 25점)*\n5. NOx의 3대 생성기작(Thermal·Fuel·Prompt)을 비교 설명하시오. *(다수 회차 25점)*\n6. 저녹스버너와 배가스재순환(FGR)의 NOx 저감원리를 설명하시오. *(114~138회 25점)*\n7. SCR의 반응원리·촉매·설계인자를 설명하시오. *(다수 회차 25점)*\n8. SCR 반응기의 배치방식(High-dust, Low-dust, Tail-end)을 비교하시오. *(최근 25점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(30분)**: Ⅰ의 흐름도를 그리며 \"흡수-흡착\" 병렬구조와 \"연소조절-SCR\" 단계적 구조를 각각 설명해본다.\n2. **식 쓰기(30분)**: Ⅲ의 9개 식을 기호 정의까지 포함해서 작성.\n3. **수치 암기(25분)**: Ⅱ 체크리스트, 특히 SCR 반응식과 온도조건은 정확히 암기.\n4. **기출 구술(30분)**: Ⅴ의 8문항을 소리 내어 답해본다.\n5. **계산 연습(20분)**: Day 53의 헨리법칙, Day 59의 NH3 소요량 계산을 다른 수치로 재계산.\n\n> 이 구간은 1단계 집진이론(효율식-설계인자-장단점 구조)과 답안 서술 패턴이 유사하므로, 1단계에서 익힌 답안 구조화 능력을 그대로 적용하되 \"물질전달\"과 \"화학반응\"이라는 새로운 개념 축을 추가로 암기해야 한다.\n","side":[{"title":"답안 작성 요령 — 가스상 처리·탈질 통합형 문제","body":"### 문제 유형별 답안 구조\n1. \"이론+설계식\" 단일주제형 → **Ⅰ개요-Ⅱ이론(식 유도)-Ⅲ설계인자(표)-Ⅳ적용/한계-Ⅴ결론**\n2. \"흡수 vs 흡착\" 또는 \"연소조절 vs SCR\" 비교형 → 비교표를 본문 중앙 배치, 적용 오염물질·농도범위를 기준으로 구분\n\n### 표 활용 포인트\n- 흡수·흡착 비교문제는 \"매체·적용농도·재생방식\" 3열 비교표가 효과적\n- NOx 저감기술 비교문제는 \"저감률·투자비·적용위치\" 비교표로 단계적 접근(연소조절→후처리)을 시각화\n\n### 흔한 감점 요인\n- 헨리법칙에서 H가 클수록 흡수가 쉽다고 반대로 서술(H 클수록 난용성=흡수 어려움)\n- SCR 반응식에서 계수(4NO+4NH3+O2→4N2+6H2O)를 부정확하게 기재\n- Thermal NOx를 \"연료 중 질소가 원인\"이라고 Fuel NOx와 혼동\n- 저감기술 서술 시 법령 근거(「대기환경보전법 시행규칙」) 누락\n\n### 시간배분 요령(25점 문항 기준)\n| 단계 | 시간 | 내용 |\n|---|---|---|\n| 개요 | 3분 | 정의+출제의도 |\n| 본론 구성 | 2분 | 식·표 배치 스케치 |\n| 본론 작성 | 30분 | 식 유도+비교표+설계인자 |\n| 결론 | 3분 | 요약+최신동향 |\n| 검토 | 2분 | 반응식·법령명 확인 |\n\n### 계산문제 체크포인트\n- 단위(mmHg, ppm, kmol 등) 일관성 확인\n- 표준상태(0℃, 1atm, 22.4㎥/kmol) 적용 여부 명시\n- 산출값의 물리적 타당성(0~100% 범위 등) 검산"},{"title":"진도 점검 — Day 53~59 자가진단표","body":"| Day | 주제 | 이해도(상/중/하) | 재복습 필요 |\n|---|---|---|---|\n| 53 | 흡수의 원리와 헨리의 법칙 | | ☐ |\n| 54 | 흡수장치 종류와 충전물 구비조건 | | ☐ |\n| 55 | 흡착의 원리(물리·화학흡착) | | ☐ |\n| 56 | 흡착 파과곡선과 활성탄 설계 | | ☐ |\n| 57 | NOx 생성기작(Thermal·Fuel·Prompt) | | ☐ |\n| 58 | 연소조절 NOx 저감(저녹스버너·FGR) | | ☐ |\n| 59 | SCR의 원리·촉매·설계인자 | | ☐ |\n\n### 활용법\n'하' 표시가 2개 이상이면 다음 구간(SNCR·탈황, Day 61~) 진입 전 해당 일자를 재독할 것을 권장한다. 특히 Day 57(NOx 생성기작)은 이후 SNCR(Day61)·탈황(Day63~66) 전체를 관통하는 기초 개념이므로 '중' 이하라면 반드시 재복습이 필요하다.\n\n### 1단계와의 연결 확인\n| 1단계 개념(집진) | 2단계 대응 개념(가스처리) |\n|---|---|\n| 집진효율 η=1-Pt | 탈질효율(SCR 저감률) |\n| 절단입경 d50 | 파과점(Ct/C0=5~10%) |\n| 압력손실(마찰+국부) | 충전탑 압력손실(로딩·플러딩) |\n| 여과속도(A/C비) | 공간속도(AV/GHSV) |\n\n### 다음 구간 예고\nDay 61부터는 SNCR과 Hybrid SNCR/SCR, SCR 촉매 피독·열화, 습식·건식 탈황공정이 이어진다. 이번 구간에서 정리한 SCR 기초(반응식·설계인자)가 그대로 확장되므로, SCR 관련 수치를 확실히 암기한 뒤 다음 구간으로 진행하는 것이 효율적이다."}]},"61":{"day":61,"date":"2026-09-30","title":"SNCR과 Hybrid SNCR/SCR","keywords":[{"k":"SNCR 원리","subs":["촉매없이 노내 고온부에 환원제 직접분사","NH3/요소가 NOx와 균일기상반응","850~1100℃ 온도창(Temperature Window)"]},{"k":"SNCR 온도창의 중요성","subs":["온도 높으면 NH3산화→NOx재생성","온도 낮으면 미반응NH3슬립 증가","노내 분사위치 선정이 핵심"]},{"k":"SNCR 환원제","subs":["암모니아수(NH4OH)","요소수(Urea, CO(NH2)2)","요소는 취급안전성 우수, 분해반응 추가"]},{"k":"SNCR 성능·장단점","subs":["저감효율 30~50%(SCR보다 낮음)","촉매 불필요, 초기투자비 저렴","온도창 좁아 부하변동 대응 어려움"]},{"k":"Hybrid SNCR/SCR","subs":["SNCR(노내)+소형SCR(후단) 결합","SNCR 미반응NH3슬립을 SCR환원제로 활용","저비용+고효율(80%이상) 동시확보"]}],"answer":"# SNCR과 Hybrid SNCR/SCR\n\n## Ⅰ. 개요\n\n선택적비촉매환원법(Selective Non-Catalytic Reduction, SNCR)은 촉매 없이 연소로 내부의 고온 영역에 암모니아 또는 요소(Urea)를 직접 분사하여 NOx를 질소와 물로 환원시키는 탈질기술이다. Day 59의 SCR이 촉매를 이용해 비교적 저온(300~400℃)에서 반응을 진행시킨다면, SNCR은 촉매 없이 고온(850~1,100℃)에서 균일기상반응(homogeneous gas-phase reaction)으로 NOx를 제거한다는 점이 핵심 차이이다. 이 온도 차이와 촉매 유무가 두 기술의 저감효율·투자비·적용성을 가르는 근본 원인이 된다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. SNCR 반응원리와 온도창(Temperature Window)\n\n### 1. 반응원리\n암모니아를 환원제로 사용하는 경우 SCR과 유사한 반응이 촉매 없이 고온에서 진행된다.\n\n**4NO + 4NH3 + O2 → 4N2 + 6H2O**\n\n요소(Urea)를 사용하는 경우 먼저 열분해·가수분해되어 NH3를 생성한 뒤 위와 동일한 반응이 진행된다.\n\n**CO(NH2)2 + H2O → 2NH3 + CO2**\n\n### 2. 온도창(Temperature Window)의 중요성\nSNCR은 촉매의 도움 없이 반응이 진행되므로 반응온도 범위가 매우 좁고 민감하다.\n\n| 온도 조건 | 결과 |\n|---|---|\n| 적정범위(850~1,100℃) | NOx-NH3 반응 우세, 정상 탈질 진행 |\n| 온도 과다(1,100℃ 초과) | NH3가 산소와 반응(산화)하여 오히려 NOx를 재생성 |\n| 온도 과소(850℃ 미만) | 반응속도 저하, 미반응 NH3의 암모니아슬립 급증 |\n\n이 때문에 SNCR은 노(furnace) 내에서 해당 온도범위가 형성되는 위치에 환원제를 정확히 분사하는 것이 성능을 좌우하며, 보일러 부하 변동에 따라 온도창의 위치가 이동하므로 다단 분사노즐을 배치해 대응하는 경우가 많다.\n\n## Ⅲ. SNCR 환원제 비교\n\n| 구분 | 암모니아수(NH4OH) | 요소수(Urea) |\n|---|---|---|\n| 반응 | 직접 NOx와 반응 | 열분해 후 NH3 생성, NOx와 반응 |\n| 취급안전성 | 자극성·독성 관리 필요 | 상대적으로 안전(고체·수용액) |\n| 저장·운반 | 별도 안전기준 적용 | 상대적으로 용이 |\n| 반응속도 | 상대적으로 빠름 | 분해단계 추가로 다소 느림 |\n| 실무 채택 경향 | 대형설비 일부 | 중소형설비에서 선호 증가 |\n\n## Ⅳ. SNCR 성능·한계와 Hybrid SNCR/SCR\n\n### 1. SNCR의 성능과 한계\n\n| 항목 | SNCR | SCR(참고) |\n|---|---|---|\n| 저감효율 | 30~50% | 80~90% 이상 |\n| 촉매 필요 여부 | 불필요 | 필요(교체비용 발생) |\n| 초기투자비 | 낮음 | 높음 |\n| 온도조건 민감도 | 매우 높음(좁은 온도창) | 상대적으로 넓음 |\n| 암모니아슬립 | 상대적으로 큼 | 관리 시 낮음 |\n\nSNCR은 저비용으로 신속히 적용 가능하지만, 온도창이 좁아 부하변동이 큰 설비에서는 저감효율이 불안정할 수 있고, 목표 저감효율이 SCR 수준(80% 이상)에 미치지 못하는 한계가 있다.\n\n### 2. Hybrid SNCR/SCR\nSNCR과 SCR을 결합한 하이브리드 시스템은 노 내부(고온부)에 SNCR을 적용해 1차 저감을 수행하고, SNCR에서 반응하지 못하고 남은 미반응 NH3(암모니아슬립)를 후단의 소형 SCR 촉매층에서 재활용하여 잔여 NOx를 추가로 제거하는 방식이다.\n\n**핵심 장점**: SNCR 슬립을 \"낭비되는 오염물질\"이 아니라 \"SCR의 환원제 공급원\"으로 활용하므로, 별도의 NH3 추가 분사 없이도 SCR 반응이 가능해 운영비를 절감할 수 있으며, 소형 촉매만으로도 전체 시스템 저감효율을 80% 수준까지 끌어올릴 수 있다.\n\n| 비교 | SNCR 단독 | SCR 단독 | Hybrid SNCR/SCR |\n|---|---|---|---|\n| 저감효율 | 30~50% | 80~90%↑ | 70~85% 수준 |\n| 촉매 규모 | 없음 | 대형 | 소형(SNCR 부담분 경감) |\n| 투자비 | 낮음 | 높음 | 중간 |\n| 적용 적합 | 소규모, 개조 어려운 기존설비 | 신설 대형설비 | 기존설비 성능개선(retrofit) |\n\n### 3. Hybrid 시스템의 경제성 분석 관점\nHybrid SNCR/SCR은 신설 대형 SCR 대비 촉매량이 적어 초기투자비를 절감할 수 있는 동시에, SNCR 단독 대비 저감효율을 크게 개선할 수 있어 기존 SNCR 설비를 보유한 소각시설·중소형 보일러의 성능 개선(retrofit) 사업에서 특히 경제성이 우수하게 평가된다.\n\n| 검토 시나리오 | 권장 방안 |\n|---|---|\n| 기존 SNCR 설비, 배출기준 강화 대응 | 후단 소형 SCR 추가(Hybrid 전환) |\n| 신설 대형 발전설비 | SCR 단독 채택(고효율 우선) |\n| 부지 협소, 예산 제약 | SNCR 단독 또는 Hybrid 검토 |\n\n## Ⅴ. 결론\n\nSNCR은 촉매 없이 고온에서 직접 환원반응을 유도하는 저비용 탈질기술이나, 좁은 온도창으로 인해 저감효율과 안정성에 한계가 있다. 이를 보완하는 Hybrid SNCR/SCR은 SNCR의 저비용 특성과 SCR의 고효율 특성을 결합하고, 특히 SNCR의 암모니아슬립을 SCR 환원제로 재활용함으로써 경제성과 성능을 동시에 개선하는 실용적 대안으로 평가된다. 노후 소각시설·중소형 보일러의 탈질설비 개선(retrofit) 수요가 늘어나면서 Hybrid 시스템의 적용 사례가 확대되는 추세이다.\n\n| 요약 | SNCR | SCR | Hybrid |\n|---|---|---|---|\n| 반응위치 | 노 내부(고온) | 후단(중온, 촉매) | 노 내부+후단 결합 |\n| 저감효율 | 30~50% | 80~90%↑ | 70~85% |\n| 투자비 순위 | 최저 | 최고 | 중간 |\n","side":[{"title":"SNCR·SCR·Hybrid 비교 심화","body":"### 적용 대상 설비 비교\n| 설비 유형 | 권장 탈질기술 | 이유 |\n|---|---|---|\n| 대형 화력발전 보일러 | SCR | 넓은 설치공간, 고효율 요구 |\n| 소각시설(생활폐기물 등) | SNCR 또는 Hybrid | 노 내 온도창 확보 용이, 부지 제약 |\n| 중소형 산업보일러 | SNCR 또는 Hybrid | 초기투자비 제약 |\n| 기존설비 개조(성능강화) | Hybrid SNCR/SCR | 기존 SNCR 활용, 소형 SCR 추가 |\n\n### 분사노즐 배치와 부하대응\nSNCR은 보일러 부하가 변동하면 노 내 온도분포가 함께 변하므로, 여러 높이(온도구간)에 분사노즐을 배치하고 부하에 따라 활성화되는 노즐 위치를 전환하는 다단분사 제어를 적용하는 경우가 많다. 이를 통해 부분부하 조건에서도 온도창 내 분사를 유지할 수 있다.\n\n### 요소수 분해반응 상세\nCO(NH2)2 + H2O → 2NH3 + CO2 (가수분해)\n고온에서는 열분해 경로(CO(NH2)2 → NH3 + HNCO, HNCO+H2O→NH3+CO2)도 함께 진행되며, 최종적으로 NH3가 생성되어 NOx 환원에 기여한다.\n\n### 분사시스템 설계 요소\n| 요소 | 내용 |\n|---|---|\n| 노즐 형식 | 이류체(공기+약액) 또는 고압단류체 분사 |\n| 액적 크기 | 미세할수록 증발·혼합 빨라 반응성 향상 |\n| 분사각·침투깊이 | 노 단면 전체에 고르게 도달하도록 설계 |\n| 다단 배치 | 부하변동 대응을 위해 상하 여러 단 설치 |\n\n### 부산물 부생 문제(N2O)\nSNCR 반응 부산물로 온실가스인 아산화질소(N2O)가 일부 생성될 수 있으며, 특히 저온측 반응에서 생성 비중이 높아지는 경향이 있어 온도창 관리가 NOx 저감뿐 아니라 N2O 억제 측면에서도 중요하다."},{"title":"기출 연계 및 운전관리 포인트","body":"### SNCR 운전 이상 진단\n| 증상 | 예상 원인 | 대책 |\n|---|---|---|\n| 저감효율 급감 | 노 부하변동으로 온도창 이탈 | 분사노즐 위치 전환 |\n| 암모니아슬립 급증 | 분사위치 온도 과소 | 상류(고온측) 노즐로 전환 |\n| N2O 부산물 증가 | 저온측 반응 부산물 | 온도창 재조정, 요소 대신 NH3 검토 |\n\n### Hybrid 시스템 설계 시 고려사항\n1. SNCR 슬립량을 사전 예측(운전데이터 또는 시뮬레이션)하여 후단 SCR 촉매 규모 결정\n2. 슬립 NH3만으로 부족한 경우 SCR 전단에 보조 NH3 분사 설비 추가\n3. SNCR-SCR 사이 배가스 온도가 SCR 촉매 활성온도(300~400℃) 범위에 들도록 열교환 설계\n\n### 기출 연계 자가점검\n1. SNCR의 반응원리와 온도창(Temperature Window)의 의미를 설명하시오. *(다수 회차 25점)*\n2. SNCR과 SCR의 저감효율·투자비를 비교하고 각각의 적용 조건을 설명하시오. *(114~138회 25점)*\n3. Hybrid SNCR/SCR 시스템의 원리와 장점을 설명하시오. *(최근 25점)*\n4. 요소(Urea)를 환원제로 사용할 때의 반응과정과 암모니아수 대비 장단점을 설명하시오. *(다수 회차 10점)*\n\n### 학습 연결 포인트\n다음 Day(62)는 SCR 촉매의 피독·활성저하 메커니즘을 다루며, 이는 Hybrid 시스템에서도 후단 소형 SCR 촉매에 동일하게 적용되는 개념이므로 함께 연결지어 학습하면 효율적이다.\n\n### 국내 적용 현황 요약\n국내 소각시설은 「대기환경보전법」상 강화된 질소산화물 기준 대응을 위해 SNCR을 기본 적용하고, 배출허용기준이 더욱 엄격한 지역이나 신설시설에서는 Hybrid SNCR/SCR 또는 SCR 단독 채택이 점차 확대되는 추세이다. 답안 결론부에 이러한 정책적 흐름을 한 줄 언급하면 완성도가 높아진다."}]},"62":{"day":62,"date":"2026-10-01","title":"SCR 촉매 피독·활성저하와 대책","keywords":[{"k":"화학적 피독(Poisoning)","subs":["비소(As)·알칼리금속(K,Na)이 활성점 점유","알칼리토금속(Ca)도 피독 유발","석탄회분 중 성분이 주요 원인"]},{"k":"물리적 열화","subs":["마모(Erosion): 고속분진 충돌","폐색(Blinding/Fouling): 분진퇴적","비산재 부착으로 유효면적 감소"]},{"k":"열적 열화(소결)","subs":["Sintering: 고온노출시 결정성장","비표면적 감소→활성저하","400℃ 장기초과 노출시 가속"]},{"k":"황산암모늄염 문제","subs":["SO2가 SO3로 산화후 NH3와 결합","NH4HSO4(황산수소암모늄) 생성","저온부 기공폐색·부식 유발"]},{"k":"열화 대책","subs":["배치방식 최적화(Low-dust 선호)","정기 촉매세정·재생·순차교체","촉매 수명예측·성능진단(활성측정)"]}],"answer":"# SCR 촉매 피독·활성저하와 대책\n\n## Ⅰ. 개요\n\nSCR 촉매(Day 59)는 운전기간이 길어질수록 배가스 중 성분과의 화학적·물리적·열적 상호작용으로 활성이 점차 저하되며, 이는 촉매 수명과 탈질효율을 직접 좌우하는 실무적으로 매우 중요한 문제이다. 촉매 열화는 원인에 따라 화학적 피독, 물리적 열화(마모·폐색), 열적 열화(소결)로 구분되며, 특히 석탄화력 등 고분진·고황 배가스를 처리하는 High-dust 배치(Day 59)에서 열화가 가속되는 경향이 있다. 열화 메커니즘을 정확히 이해해야 배치방식 선정, 유지관리 주기, 촉매 교체계획을 합리적으로 수립할 수 있다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 화학적 피독(Chemical Poisoning)\n\n### 1. 피독 물질과 기작\n배가스 중 특정 미량성분이 촉매의 활성점(active site)을 화학적으로 점유하거나 파괴하여 탈질반응을 저해하는 현상이다.\n\n| 피독물질 | 기작 | 주요 발생원 |\n|---|---|---|\n| 비소(As) | 활성점(V2O5) 화학적 피복 | 석탄 중 비소화합물의 기화·응축 |\n| 알칼리금속(K, Na) | 촉매 산성점 중화, 활성저하 | 석탄회분, 바이오매스 연료 |\n| 알칼리토금속(Ca) | 표면 반응생성물 형성 | 석회 첨가 연소, 회분 중 Ca |\n| 중금속(Pb 등) | 활성점 피복 | 폐기물 소각 배가스 |\n\n알칼리금속에 의한 피독은 비가역적인 경우가 많아 촉매 교체가 유일한 해결책인 경우가 대부분이다.\n\n## Ⅲ. 물리적 열화와 열적 열화(소결)\n\n### 1. 물리적 열화\n\n| 구분 | 기작 | 주요 영향 |\n|---|---|---|\n| 마모(Erosion) | 고속 비산분진의 촉매표면 충돌·깎임 | 촉매 유효두께 감소, 특히 High-dust에서 심함 |\n| 폐색(Blinding/Fouling) | 미세분진이 촉매 기공·표면에 퇴적 | 유효 비표면적 감소, 압력손실 증가 |\n\n### 2. 열적 열화(소결, Sintering)\n촉매가 설계 활성온도 범위(300~400℃)를 초과하여 장기간 고온에 노출되면 촉매 결정입자가 성장(소결)하여 비표면적이 감소하고 활성점 수가 줄어드는 비가역적 열화가 발생한다. 특히 400℃를 지속적으로 초과하는 운전조건에서 열화가 가속되므로, 촉매층 전후단 온도관리가 중요하다.\n\n부하변동이 큰 설비는 기동·정지 시 촉매층 온도가 급격히 변화하면서 열충격(thermal shock)에 의한 미세균열이 발생할 수 있어, 승온·강온 속도를 제한하는 운전절차(Ramp rate 관리)가 함께 요구된다.\n\n## Ⅳ. 황산암모늄염 문제와 종합 대책\n\n### 1. 황산암모늄염(NH4HSO4) 생성 문제\n배가스 중 SO2의 일부가 촉매 표면에서 SO3로 산화되고, 이 SO3가 미반응 NH3(암모니아슬립)와 결합하여 황산수소암모늄(NH4HSO4) 등 점착성 염을 형성한다. 이 염은 저온부(촉매 후단, 공기예열기 등)에서 응축·부착되어 기공을 막고(폐색) 부식을 유발하는 대표적 2차 문제이다.\n\n| 조건 | 결과 |\n|---|---|\n| 배가스 SO2 농도 높음 | SO3 생성량 증가, 염 형성 위험 증가 |\n| 암모니아슬립 과다 | 염 형성 반응물(NH3) 과잉 공급 |\n| 후단 온도 저하 | 염의 응축·부착 촉진 |\n\n### 2. 열화 종합 대책\n\n| 대책 | 내용 |\n|---|---|\n| 배치방식 최적화 | Low-dust/Tail-end 방식 채택으로 분진·황 노출 저감 |\n| 촉매 재질·형상 개선 | 내마모성 코팅, 피독저항성 조성 채택 |\n| 운전온도 관리 | 촉매층 온도를 활성온도범위 내로 정밀 제어 |\n| NH3 분사 최적화 | 슬립 최소화로 황산암모늄염 생성 억제 |\n| 정기 세정·재생 | 촉매 표면 퇴적물 제거(물리적 세정) |\n| 순차 교체·예비층 확보 | 열화 진행에 따라 단계적 교체(Day 59의 예비층 개념) |\n| 성능진단 | 정기적 촉매 활성도 측정(탈질율·압손 추이 관리) |\n\n### 3. 열화 메커니즘 종합 요약표\n| 열화 유형 | 원인물질/조건 | 가역성 | 주 저감위치 |\n|---|---|---|---|\n| 화학적 피독 | As, K, Na, Ca 등 | 대부분 비가역 | High-dust에서 심함 |\n| 물리적 마모 | 고속 비산분진 | 비가역(두께감소) | High-dust에서 심함 |\n| 물리적 폐색 | 미세분진 퇴적 | 부분 가역(세정 가능) | 전 배치 공통 |\n| 열적 소결 | 400℃ 장기초과 | 비가역 | 국부 고온영역 |\n| 황산암모늄염 폐색 | SO3+NH3슬립 | 부분 가역(가열재생) | 저온부(후단) |\n\n### 4. 촉매 활성 저하가 시스템 전체에 미치는 영향\n촉매 활성이 저하되면 동일 탈질효율을 유지하기 위해 NH3 분사량을 늘려야 하는데, 이는 암모니아슬립 증가와 황산암모늄염 생성 촉진이라는 악순환으로 이어질 수 있다. 따라서 촉매 활성 저하를 조기에 감지하고 교체 계획을 수립하는 것이 전체 시스템의 안정적 운영에 필수적이다.\n\n## Ⅴ. 결론\n\nSCR 촉매의 열화는 화학적 피독, 물리적 마모·폐색, 열적 소결이라는 세 가지 서로 다른 기작으로 진행되며, 여기에 황산암모늄염 생성이라는 2차적 문제가 더해져 실제 운전에서는 복합적으로 작용한다. 열화 대책은 배치방식 선정 단계(Day 59)부터 운전 중 온도·NH3 관리, 정기 세정·교체에 이르기까지 설계-운전-유지관리 전 과정에 걸쳐 통합적으로 접근해야 하며, 이는 SCR 설비의 장기적 경제성(촉매 수명당 저감비용)을 좌우하는 핵심 요소이다. 최근에는 피독저항성이 강화된 촉매 조성 개발과 실시간 촉매 상태 진단 기술이 함께 발전하고 있다.\n\n| 관리단계 | 핵심조치 |\n|---|---|\n| 설계단계 | 배치방식 선정(피독·마모 위험 최소화) |\n| 운전단계 | 온도·NH3분사 정밀제어 |\n| 유지관리단계 | 정기세정·성능진단·순차교체 |\n","side":[{"title":"촉매 수명 관리와 진단 실무","body":"### 물리적 열화 예방 설계 포인트\n반응기 내 배가스 유속 분포가 불균일하면 특정 구역에 마모·폐색이 집중되는 경향이 있으므로, 촉매층 전단에 정류판(유동정리판)을 설치해 유속을 균일화하는 것이 예방적으로 중요하다. 또한 촉매 상단부는 조대분진에 의한 마모가 집중되므로 내마모 보호층을 별도로 적용하는 설계도 활용된다.\n\n### 촉매 성능 저하 판정 지표\n| 지표 | 정상 | 열화 의심 |\n|---|---|---|\n| 탈질효율 | 설계값 유지 | 설계값 대비 뚜렷한 저하 |\n| 압력손실 | 설계값 근접 | 설계값 대비 상승(폐색 의심) |\n| 암모니아슬립 | 관리기준 이내 | 기준 초과(활성저하로 미반응 증가) |\n| 촉매 비표면적(실험실 분석) | 초기값 대비 큰 변화 없음 | BET 비표면적 뚜렷한 감소 |\n\n### 촉매 수명 예측 접근\n운전 초기부터 정기적으로 촉매 샘플을 채취해 활성도(반응율)를 측정하고, 시간에 따른 활성저하 추세선을 확보하면 목표 탈질효율을 유지할 수 있는 한계시점(교체시점)을 예측할 수 있다. 이는 예방적 유지관리(PM) 계획 수립의 기초가 된다.\n\n### 촉매 재생(세정) 방법\n1. 건식 재생: 압축공기·초음파를 이용한 표면 분진 제거\n2. 습식 재생: 세정액을 이용한 피독물질 일부 용출(제한적 효과)\n3. 재생의 한계: 화학적 피독·열적 소결은 재생으로 회복 불가, 물리적 폐색만 부분적 개선 가능\n\n### 촉매 교체 계획 수립 예시\n| 운전기간 | 예상 활성 | 조치 |\n|---|---|---|\n| 0~3년 | 설계값 유지 | 정기 모니터링 |\n| 3~5년 | 서서히 저하 | 세정, NH3분사 미세조정 |\n| 5년 이상 | 기준 미달 위험 | 촉매층 순차 교체 |"},{"title":"기출 연계 및 실무 사례","body":"### 배치방식별 열화 위험도 비교(Day59 연계)\n| 배치방식 | 화학적 피독 | 물리적 마모 | 열적열화 |\n|---|---|---|---|\n| High-dust | 높음(비산재 직접노출) | 높음 | 중간 |\n| Low-dust | 중간 | 낮음 | 중간 |\n| Tail-end | 낮음(청정배가스) | 매우낮음 | 재열관리 필요 |\n\n### 연료 종류별 피독 위험\n석탄(특히 저품위탄, 비소 함량 높은 탄종)을 사용하는 화력발전소는 알칼리금속·비소에 의한 피독 위험이 크고, 바이오매스 연료는 알칼리금속(K) 함량이 높아 유사한 문제가 발생할 수 있다. 반면 천연가스 등 청정연료는 촉매 열화 위험이 상대적으로 낮다.\n\n### 기출 연계 자가점검\n1. SCR 촉매의 화학적 피독 기작과 주요 피독물질을 설명하시오. *(다수 회차 25점)*\n2. 촉매의 물리적 열화(마모·폐색)와 열적 열화(소결)를 비교 설명하시오. *(114~138회 25점)*\n3. 황산암모늄염(NH4HSO4) 생성 원인과 방지대책을 설명하시오. *(최근 25점)*\n4. SCR 촉매 수명 연장을 위한 설계·운전상 대책을 종합적으로 설명하시오. *(다수 회차 25점)*\n\n### 학습 연결 포인트\n다음 Day(63)는 SOx 저감을 위한 습식·건식·반건식 탈황공정을 다루며, 이번 Day에서 학습한 SO2→SO3 산화 문제와 황산암모늄염 생성 메커니즘이 탈황설비 설계와도 밀접하게 연결된다.\n\n### 배치 위치와 탈황 연계 검토\n동일 사업장에서 SCR을 탈황설비 전단(High-dust 계열)에 두는지 후단(Tail-end)에 두는지에 따라 촉매가 겪는 SO2 농도 조건이 크게 달라지므로, 탈질-탈황 설비의 전체 배치 순서를 통합적으로 검토하는 것이 실무적으로 중요하다."}]},"63":{"day":63,"date":"2026-10-02","title":"습식·건식·반건식 탈황공정","keywords":[{"k":"탈황공정 3분류","subs":["습식(석회석-석고법, 최고효율)","건식(소석회 직접분사, 무폐수)","반건식(SDA, 슬러리분무+건조)"]},{"k":"습식탈황(WFGD)","subs":["CaCO3+SO2+½O2+2H2O→CaSO4·2H2O+CO2","탈황효율 90~99%","부산물 석고 재활용, 백연 발생"]},{"k":"건식탈황","subs":["Ca(OH)2+SO2→CaSO3+H2O","물 사용 없음, 무폐수","효율 낮음(70~90%), 부산물 재활용 제한"]},{"k":"반건식탈황(SDA)","subs":["소석회 슬러리 미세분무+배가스열 건조","건식부산물, 백필터에서 회수","Ca/S비 1~1.5배 이상 과잉투입"]},{"k":"공정 선정기준","subs":["효율: 습식>반건식>건식","용수·폐수: 건식<반건식<습식","대형발전소=습식, 중소형=건식/반건식"]}],"answer":"# 습식·건식·반건식 탈황공정\n\n## Ⅰ. 개요\n\n탈황(Flue Gas Desulfurization, FGD)은 연소배가스 중 황산화물(SO2, SO3)을 제거하는 공정으로, 흡수제(주로 석회석·소석회)와 배가스의 접촉 방식(매체의 상태)에 따라 습식·건식·반건식으로 분류된다. 「대기환경보전법 시행규칙」상 황산화물 배출허용기준을 충족하기 위해 대형 화력발전소는 고효율의 습식탈황(석회석-석고법)을 주로 채택하며, 중소형 설비는 초기투자비·용수제약을 고려해 건식·반건식을 적용하는 경우가 많다. 세 공정 모두 흡수(Day 53~54)의 화학흡수 원리를 확장한 응용이라는 공통점을 가진다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 습식탈황(Wet FGD) — 석회석-석고법\n\n### 1. 반응원리\n석회석(CaCO3) 슬러리를 흡수탑(스프레이타워)에서 배가스와 향류 접촉시켜 SO2를 흡수·산화시켜 석고(CaSO4·2H2O)로 전환한다.\n\n**CaCO3 + SO2 + ½O2 + 2H2O → CaSO4·2H2O(석고) + CO2**\n\n### 2. 특징\n| 항목 | 내용 |\n|---|---|\n| 탈황효율 | 90% 이상(설계에 따라 95~99%까지) |\n| 부산물 | 석고(건축자재·시멘트원료 등으로 재활용 가능) |\n| 용수 사용 | 많음(슬러리 제조, 세정) |\n| 부작용 | 백연(플룸) 발생 → 재열 또는 응축수분리 필요(Day 51 CPM 연계) |\n| 초기투자비 | 세 공정 중 가장 높음 |\n\n## Ⅲ. 건식탈황(Dry FGD)\n\n### 1. 반응원리\n소석회(Ca(OH)2) 또는 중조(NaHCO3) 분말을 배가스 흐름에 직접 분사하여 SO2와 기상-고상 반응을 일으킨다.\n\n**Ca(OH)2 + SO2 → CaSO3 + H2O**\n\n### 2. 특징\n| 항목 | 내용 |\n|---|---|\n| 탈황효율 | 상대적으로 낮음(70~90%) |\n| 용수 사용 | 없음(무폐수 공정) |\n| 부산물 | 미반응 소석회+반응생성물 혼합 고체, 재활용 제한적(순도 낮음) |\n| 개선형 | 순환유동층(CFB)형 건식탈황: 미반응 흡수제 재순환으로 효율 향상 |\n| 적용 | 중소형 설비, 용수 제약 지역 |\n\n## Ⅳ. 반건식탈황(Spray Dryer Absorption, SDA)\n\n### 1. 반응원리\n소석회 슬러리를 배가스에 미세하게 분무하면, 배가스의 현열로 슬러리 중 수분이 증발(건조)되면서 동시에 SO2와 반응한다.\n\n**Ca(OH)2 + SO2 → CaSO3·½H2O + 3/2H2O**\n\n건조가 완료된 반응생성물은 후단 백필터(또는 전기집진기)에서 분진과 함께 건식으로 포집된다.\n\n### 2. Ca/S비(설계인자)\nSDA 공정은 습식 대비 반응시간이 짧아 흡수제를 화학양론비보다 과잉으로 투입해야 하며, 소요 Ca/S 몰비는 통상 **1~1.5배 이상**으로 설계된다. Ca/S비가 클수록 탈황효율은 높아지지만 흡수제 소모량·부산물량이 증가하는 상충관계가 있다.\n\n### 3. 세 공정 종합 비교\n\n| 구분 | 습식(WFGD) | 반건식(SDA) | 건식 |\n|---|---|---|---|\n| 탈황효율 | 90~99% | 85~95% | 70~90% |\n| 용수 사용 | 많음 | 중간 | 없음 |\n| 폐수 발생 | 있음(처리필요) | 없음(건식부산물) | 없음 |\n| 부산물 재활용 | 석고(우수) | 혼합고체(제한적) | 혼합고체(제한적) |\n| 초기투자비 | 높음 | 중간 | 낮음 |\n| 적용 규모 | 대형(화력발전 등) | 중형 | 중소형 |\n\n### 4. 탈황공정 선정 시 종합 검토 흐름\n1. 사업장 규모·배가스 유량 파악\n2. 목표 탈황효율(배출허용기준) 확인\n3. 용수·폐수처리 인프라 여건 검토\n4. 부산물 재활용(석고 판매처 확보 여부) 검토\n5. 초기투자비·운영비 종합 비교 후 공정 선정\n\n| 검토 우선순위 | 습식 유리 조건 | 건식/반건식 유리 조건 |\n|---|---|---|\n| 배가스 유량 | 대용량 | 중소용량 |\n| 용수 확보 | 용이(발전소 등) | 제약(내륙 중소사업장) |\n| 부산물 판로 | 석고 수요처 인접 | 무관(매립 가능) |\n| 배출기준 | 매우 엄격 | 상대적으로 완화 |\n\n## Ⅴ. 결론\n\n탈황공정은 처리 매체의 상태(습식·건식·반건식)에 따라 효율·용수사용·부산물 재활용성·투자비가 뚜렷이 구분되며, 일반적으로 효율이 높을수록 용수사용과 초기투자비가 커지는 상충관계를 가진다. 대형 화력발전소는 고효율·부산물 재활용이 가능한 습식탈황을 표준으로 채택하고 있으며, 용수 제약이나 초기투자비 부담이 있는 중소형 설비는 건식·반건식이 현실적 대안이 된다. 최근에는 해수를 흡수제로 활용하는 해수탈황(연안 발전소) 등 지역 특성을 반영한 변형 공정도 확대되고 있으며, 부산물(석고)의 고부가가치 재활용 기술 개발도 함께 진행되고 있다.\n\n| 핵심요약 | 습식 | 반건식 | 건식 |\n|---|---|---|---|\n| 반응매체 | 슬러리(액상) | 슬러리 미세분무 | 건식분말 |\n| 최종상태 | 습식(폐수) | 건식(증발) | 건식 |\n| 대표 흡수제 | 석회석 | 소석회 | 소석회/중조 |\n","side":[{"title":"계산 예제 — Ca/S비와 소요 소석회량","body":"### 조건\n배가스 중 SO2 유량 100 kmol/h를 반건식탈황(SDA)으로 처리하며 Ca/S 몰비를 1.3으로 설계할 때, 시간당 소요 소석회(Ca(OH)2, 분자량 74) 질량은?\n\n### 계산\n소요 Ca(OH)2 몰유량 = SO2 몰유량 × Ca/S비 = 100 × 1.3 = 130 kmol/h\n\n소요 질량 = 130 × 74 = **9,620 kg/h ≈ 9.62 ton/h**\n\n### 습식탈황과의 비교\n습식탈황(석회석 사용)은 화학양론비에 가깝게(Ca/S≈1.0~1.05) 설계되는 경우가 많아, 동일 SO2 처리량 대비 흡수제 소요량이 반건식보다 적은 경향이 있다. 이는 습식탈황의 반응시간이 충분히 길어(슬러리 순환·체류) 흡수제 이용효율이 높기 때문이다.\n\n### 흡수제 이용률 비교\n| 공정 | Ca/S비 | 흡수제 이용률 | 이유 |\n|---|---|---|---|\n| 습식 | 1.0~1.05 | 높음 | 슬러리 순환, 긴 접촉시간 |\n| 반건식 | 1.0~1.5 | 중간 | 미세분무, 짧은 접촉시간 |\n| 건식 | 1.5~2.5 | 낮음 | 1회성 분사, 접촉시간 최소 |\n\n### 답안 작성 포인트\nCa/S비 계산문제는 분자량(Ca(OH)2=74, CaCO3=100)을 정확히 활용해야 하며, 탈황효율과 Ca/S비의 상관관계(비율이 높을수록 효율↑, 부산물↑)를 함께 서술하면 완성도가 높아진다.\n\n### 습식탈황 액가스비(L/G) 참고\n습식탈황도 Day54의 흡수탑 설계 개념이 그대로 적용되며, L/G비가 클수록 탈황효율이 향상되나 순환펌프 동력비가 증가하는 상충관계를 가진다. 일반적으로 대형 습식탈황설비는 다단 스프레이 노즐을 배치해 L/G비를 구간별로 배분한다."},{"title":"탈황 부산물·백연 문제와 기출 연계","body":"### 석고(습식탈황 부산물) 품질관리\n습식탈황에서 생산되는 석고의 순도는 배가스 중 분진 혼입 정도, 산화공정(강제산화) 여부에 따라 달라지며, 순도가 높을수록 시멘트·석고보드 원료로 재활용 가치가 높아진다. 강제산화(forced oxidation) 공정을 통해 아황산칼슘(CaSO3)을 황산칼슘(CaSO4)으로 완전 산화시키는 것이 고품질 석고 생산의 핵심이다.\n\n### 백연(플룸) 현상과 대책\n습식탈황 후 배가스는 포화수증기를 다량 함유한 저온 상태로 배출되어, 대기 중 냉각 시 수증기가 응축되며 흰 연기(백연)로 보이는 현상이 발생한다. 이는 Day 45·51에서 학습한 백연저감시설(재열, 응축수분리, GGH 등)과 직접 연결된다.\n\n### 3공정 부산물 처리 비교\n\n| 구분 | 부산물 형태 | 처리·활용 |\n|---|---|---|\n| 습식 | 석고(CaSO4·2H2O) | 건축자재·시멘트원료 재활용 |\n| 반건식 | 혼합 건식분말 | 매립 또는 제한적 재활용 |\n| 건식 | 혼합 건식분말 | 매립 또는 제한적 재활용 |\n\n### 기출 연계 자가점검\n1. 습식·건식·반건식 탈황공정의 원리와 특징을 비교 설명하시오. *(다수 회차 25점)*\n2. 석회석-석고법의 반응식과 탈황효율에 영향을 미치는 인자를 설명하시오. *(114~138회 25점)*\n3. 반건식탈황(SDA)에서 Ca/S비가 탈황효율과 부산물량에 미치는 영향을 설명하시오. *(최근 10~25점)*\n4. 습식탈황 후 발생하는 백연현상의 원인과 저감대책을 설명하시오. *(다수 회차 10점)*"}]},"64":{"day":64,"date":"2026-10-03","title":"Semi-dry Reactor와 산성가스 처리","keywords":[{"k":"Semi-dry Reactor 정의","subs":["소석회 슬러리 미세분무+반응+건조 통합탑","소각시설 다종산성가스 동시제거 표준","HCl·HF·SO2 동시처리 가능"]},{"k":"반응탑 설계인자","subs":["체류시간 수초~10초 내외","포화온도차(ΔT approach) 관리","소석회 입도·분무액적 크기"]},{"k":"다종산성가스 반응성 순서","subs":["HCl·HF가 SO2보다 반응성 높음","염소·불소가 우선적으로 제거","SO2 제거에는 상대적 과잉 Ca 필요"]},{"k":"DSI(건식분사) 비교","subs":["덕트 내 직접분사, 반응탑 불필요","설치 간단하나 효율·이용률 낮음","흡수제 소요량 Semi-dry 대비 큼"]},{"k":"백필터 연계처리","subs":["반응생성물+미반응흡수제 백필터 포집","필터케이크에서 잔류 반응(추가효율)","Day37~39 여과집진 원리와 연결"]}],"answer":"# Semi-dry Reactor와 산성가스 처리\n\n## Ⅰ. 개요\n\nSemi-dry Reactor(반건식 반응탑)는 Day 63에서 다룬 반건식탈황(SDA) 원리를 확장하여, 소각시설·산업로 등에서 배출되는 HCl·HF·SO2 등 다종 산성가스를 동시에 처리하는 데 특화된 방식이다. 소석회 슬러리를 반응탑 내부에 미세분무하여 배가스와 접촉·반응시키면서 배가스 현열로 건조시키고, 반응생성물을 후단 백필터에서 건식으로 포집하는 통합 공정으로, 국내 생활폐기물·산업폐기물 소각시설의 표준적인 산성가스 방지시설로 널리 채택되고 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 반응탑 설계인자\n\n### 1. 체류시간과 반응탑 구조\n반응탑 내에서 소석회 슬러리 액적이 충분히 배가스와 접촉·반응하고 건조될 수 있도록 통상 **수 초~10초** 내외의 체류시간을 확보하도록 설계한다. 체류시간이 부족하면 미건조 슬러리가 후단 백필터에 도달해 여과포를 습윤·폐색시키는 문제가 발생할 수 있다.\n\n### 2. 포화온도차(Approach Temperature) 관리\n반응탑 출구 배가스 온도를 단열포화온도(배가스가 완전히 수분 포화되는 온도)보다 일정 온도차(ΔT, 통상 20~30℃ 내외)만큼 높게 유지하여 슬러리가 완전히 건조되면서도 결로가 발생하지 않도록 관리한다. 이 온도차가 작을수록(포화온도에 근접할수록) 반응성은 향상되나 결로·부착 위험이 커지는 상충관계가 있다.\n\n| 설계인자 | 영향 |\n|---|---|\n| 체류시간 | 길수록 반응·건조 완결도 향상 |\n| 포화온도차(ΔT) | 작을수록 반응성↑, 결로위험↑ |\n| 소석회 입도·분무액적 크기 | 작을수록 비표면적↑, 반응성↑ |\n\n## Ⅲ. 다종 산성가스 동시처리와 반응성 순서\n\n### 1. 산성가스별 반응성 차이\nHCl·HF는 SO2보다 소석회와의 반응성이 높아 반응탑 내에서 우선적으로 제거되는 경향이 있다.\n\n| 산성가스 | 반응 | 반응성 |\n|---|---|---|\n| HCl | Ca(OH)2+2HCl→CaCl2+2H2O | 높음(우선제거) |\n| HF | Ca(OH)2+2HF→CaF2+2H2O | 높음(우선제거) |\n| SO2 | Ca(OH)2+SO2→CaSO3·½H2O+3/2H2O | 상대적으로 낮음 |\n\n### 2. 설계 시사점\nHCl·HF가 먼저 소석회를 소모하므로, SO2까지 충분히 제거하려면 화학양론비보다 과잉의 소석회 투입(Day 63의 Ca/S비 개념을 다종가스로 확장)이 필요하다. 배가스 중 각 산성가스 농도비에 따라 소요 흡수제량을 개별적으로 산정해야 한다.\n\n## Ⅳ. DSI(건식분사)와의 비교, 백필터 연계처리\n\n### 1. DSI(Dry Sorbent Injection)와 비교\n\n| 구분 | Semi-dry Reactor | DSI(건식분사) |\n|---|---|---|\n| 반응매체 | 소석회 슬러리(미세분무) | 소석회/중조 건식분말 |\n| 설치공간 | 별도 반응탑 필요 | 덕트 내 직접분사(공간절약) |\n| 반응효율 | 상대적으로 높음 | 상대적으로 낮음 |\n| 흡수제 이용률 | 중간 | 낮음(짧은 접촉시간) |\n| 초기투자비 | 높음 | 낮음 |\n| 적용 | 신설 대형 소각시설 | 기존설비 개조, 소규모 |\n\n### 2. 백필터 연계처리\n반응탑에서 1차 반응·건조된 소석회 반응생성물과 미반응 소석회는 후단 백필터(여과집진장치, Day 37~39)에서 분진과 함께 포집된다. 이때 여과포 표면에 형성되는 필터케이크(분진층) 내에서도 배가스가 잔류 미반응 소석회와 추가로 접촉·반응하는 \"케이크여과 반응\"이 일어나 전체 제거효율이 한 단계 더 향상되는 효과가 있다.\n\n### 3. 소각시설 방지시설 계통에서의 위치\nSemi-dry Reactor는 통상 소각로 후단, 백필터 전단에 배치되어 \"1차 급냉(Quenching)→Semi-dry Reactor(산성가스 반응)→백필터(분진+반응생성물 포집)→(필요시) SCR/SNCR(NOx)\" 순의 방지시설 계통을 구성한다. 급냉 단계는 다이옥신 재형성을 방지하기 위한 급속냉각(De-novo synthesis 방지, 통상 200℃ 이하로 급속 냉각) 역할도 겸한다.\n\n| 계통 단계 | 주요 목적 |\n|---|---|\n| 급냉(Quench) | 온도 급강하로 다이옥신 재합성 방지 |\n| Semi-dry Reactor | HCl·HF·SO2 등 산성가스 제거 |\n| 백필터 | 분진+반응생성물+잔류산성가스 포집 |\n| SCR/SNCR(옵션) | NOx 저감 |\n\n### 4. 반응탑 형상과 유지관리\n반응탑은 원통형 또는 사각형으로 설계되며, 내부에 분무노즐과 배가스 선회 유도장치를 배치해 슬러리 액적과 배가스의 접촉시간을 극대화한다. 노즐 막힘·마모는 반응탑의 대표적 유지관리 이슈로, 정기적인 노즐 점검·교체 주기를 설계 단계에서부터 반영한다.\n\n## Ⅴ. 결론\n\nSemi-dry Reactor는 반건식탈황(SDA)의 원리를 다종 산성가스(HCl·HF·SO2) 동시처리로 확장한 기술로, 체류시간·포화온도차·입도 등 설계인자를 정밀하게 관리하고 후단 백필터와의 연계(필터케이크 반응)를 통해 종합 제거효율을 높이는 것이 핵심이다. DSI 대비 초기투자비는 크지만 흡수제 이용효율과 처리효율이 우수하여, 국내 소각시설의 산성가스 방지시설로 표준적으로 채택되고 있다. 향후에는 흡수제 이용률을 높이는 고반응성 소재 개발과 다종가스 반응 모델링을 통한 최적 Ca 투입비 설계가 발전 방향으로 제시된다.\n\n| 요약 | 내용 |\n|---|---|\n| 핵심 매체 | 소석회 슬러리(미세분무) |\n| 처리 대상 | HCl, HF, SO2(다종 산성가스) |\n| 후단 연계 | 백필터(필터케이크 반응 포함) |\n| 주 적용처 | 소각시설(생활·산업폐기물) |\n","side":[{"title":"계산 예제 — 다종 산성가스 소요 소석회량","body":"### 조건\n배가스 중 HCl 50kmol/h, SO2 30kmol/h를 Semi-dry Reactor로 처리하며, HCl은 Ca/Cl비 1.0(화학양론), SO2는 Ca/S비 1.3으로 설계할 때 총 소요 Ca(OH)2 몰유량은?\n\n### 계산\nHCl 반응식 기준(Ca(OH)2 1몰당 HCl 2몰 소모): HCl 소요 Ca(OH)2 = 50/2 = 25 kmol/h\n\nSO2 소요 Ca(OH)2 = 30×1.3 = 39 kmol/h\n\n**총 소요 Ca(OH)2 = 25+39 = 64 kmol/h → 질량 = 64×74 ≈ 4,736 kg/h**\n\n### 답안 작성 포인트\n다종가스 계산문제는 각 반응의 화학양론계수(HCl은 Ca(OH)2 1몰당 2몰 반응, SO2는 1:1)를 정확히 구분해 적용해야 하며, 두 반응이 동일 흡수제를 공유(경쟁)한다는 점을 서술하면 완성도가 높아진다.\n\n### 설계 여유율 반영\n실제 설계에서는 산출된 이론 소요량에 반응 미완결·분포불균일을 고려한 여유율(통상 10~20%)을 추가로 반영한다.\n\n### 반응탑 체류시간 검증 계산\n반응탑 부피 50㎥, 배가스 유량 30,000㎥/h(반응탑 내 온도조건 환산 기준)인 경우 체류시간은:\n\n체류시간 = 50/(30,000/3,600) = 50/8.33 ≈ **6초**\n\nSemi-dry Reactor의 일반적 설계범위(수 초~10초) 이내임을 확인할 수 있으며, 목표 체류시간에 미달하면 반응탑 부피 증대 또는 배가스 유량 분산(다탑 병렬)을 검토해야 한다."},{"title":"기출 연계 및 실무 운전 포인트","body":"### 소각시설 산성가스 배출기준 연계\n「폐기물관리법」 및 「대기환경보전법」에 따라 소각시설은 HCl·SO2·HF 등에 대한 배출허용기준이 각각 설정되어 있으며, Semi-dry Reactor+백필터 조합은 이들 기준을 동시에 충족하기 위한 표준적 방지시설 조합으로 활용된다.\n\n### 운전 이상 진단\n| 증상 | 예상 원인 | 대책 |\n|---|---|---|\n| HCl 제거율 저하 | 소석회 공급량 부족 | Ca/Cl비 재계산·증량 |\n| 백필터 압손 급증 | 반응탑 건조 불완전(습윤분진 유입) | 포화온도차(ΔT) 확대 |\n| 소석회 소모량 과다 | 입도 과대, 분무 불균일 | 노즐 점검, 입도 관리 |\n\n### 기출 연계 자가점검\n1. Semi-dry Reactor의 구조와 반응원리를 설명하고 DSI 방식과 비교하시오. *(다수 회차 25점)*\n2. 다종 산성가스(HCl·HF·SO2) 동시처리 시 반응성 차이와 설계 시 고려사항을 설명하시오. *(114~138회 25점)*\n3. 반응탑의 포화온도차(Approach Temperature) 개념과 설계상 의미를 설명하시오. *(최근 10점)*\n4. 필터케이크에서 일어나는 잔류반응이 전체 제거효율에 미치는 영향을 설명하시오. *(다수 회차 10점)*\n\n### 학습 연결 포인트\n다음 Day(65)는 중유탈황(연료 자체의 황분 저감)과 수소화탈황법을 다루며, 이는 배가스 후처리가 아닌 연료 전처리 관점의 탈황이라는 점에서 이번 Day와 대비되는 접근이다.\n\n### 다이옥신 관리와의 연계\n소각시설의 Semi-dry Reactor+백필터 계통은 산성가스뿐 아니라 활성탄 동시분사를 통해 다이옥신·중금속을 함께 흡착·포집하는 경우가 많다. 이는 하나의 방지시설 계통에서 다수의 오염물질(산성가스, 다이옥신, 중금속, 분진)을 동시에 관리하는 통합적 접근의 대표적 사례로 답안에 언급할 수 있다."}]},"65":{"day":65,"date":"2026-10-04","title":"중유탈황과 수소화탈황법","keywords":[{"k":"연료탈황(사전처리) 개념","subs":["연소 전 연료 자체의 황분 제거","배가스 후처리(습식탈황)와 대비","저유황연료 사용으로 SOx 원천저감"]},{"k":"수소화탈황(HDS)","subs":["Co-Mo/Al2O3 등 촉매, 고온고압 수소첨가","유기황화합물→H2S+탄화수소","약300~400℃, 수십기압 조건"]},{"k":"중유탈황 공정 분류","subs":["직접탈황: 중유 자체 직접 HDS","간접탈황: 경질유분 탈황 후 배합","직접탈황이 설비부담 크나 탈황률 우수"]},{"k":"저유황유 정책","subs":["선박연료 IMO 2020 황함량 규제(0.5%)","국내 중유 황함량 기준 지역별 차등","청정연료 전환 유인정책"]},{"k":"HDS 부산물 처리","subs":["반응 부산물 H2S 발생","Claus공정으로 원소황(S) 회수","황 회수는 부가가치 자원화"]}],"answer":"# 중유탈황과 수소화탈황법\n\n## Ⅰ. 개요\n\n연료탈황(Fuel Desulfurization)은 Day 63~64에서 다룬 배가스 후처리(습식·건식·반건식 탈황)와 달리, 연소가 일어나기 전 연료 자체에 함유된 황분을 사전에 제거하는 접근이다. 대표적으로 중유(重油)와 같은 액체연료에 적용되는 수소화탈황법(Hydrodesulfurization, HDS)은 정유공정에서 촉매와 수소를 이용해 유기황화합물을 분해·제거하는 기술로, SOx 배출을 원천적으로 저감한다는 점에서 방지시설 설치와는 다른 차원의 저감전략이다. *(114~138회 다수 10점 기출, 우선순위 B)*\n\n## Ⅱ. 수소화탈황(HDS) 원리\n\n### 1. 반응원리\n연료 중 유기황화합물(티오펜류, 메르캅탄류 등)을 Co-Mo(코발트-몰리브덴) 또는 Ni-Mo계 촉매 존재 하에 고온·고압에서 수소와 반응시켜 황화수소(H2S)와 탄화수소로 분해한다.\n\n**R-S-R' + H2 →(촉매) RH + R'H + H2S**\n\n### 2. 반응조건\n\n| 조건 | 범위 |\n|---|---|\n| 반응온도 | 약 300~400℃ |\n| 반응압력 | 수십 기압(고압 수소 분위기) |\n| 촉매 | Co-Mo/Al2O3, Ni-Mo/Al2O3계 |\n\n고온·고압·수소 다량 소비 공정이므로 대규모 정유시설에서 주로 운영되며, 상당한 에너지·수소 비용이 소요된다.\n\n## Ⅲ. 중유탈황 공정의 분류\n\n### 1. 직접탈황(Direct Desulfurization)\n중유(잔사유) 자체를 직접 수소화탈황 반응기에 투입하여 탈황하는 방식으로, 탈황률이 우수하나 중유의 높은 점도·금속성분(V, Ni 등)으로 인해 촉매 피독·폐색이 발생하기 쉬워 설비 부담이 크다.\n\n### 2. 간접탈황(Indirect Desulfurization)\n비교적 처리가 용이한 경질유분(감압경유 등)을 먼저 탈황한 뒤, 이를 미탈황 중유와 배합하여 목표 황함량을 맞추는 방식이다. 설비 부담은 적으나 배합 비율에 따라 탈황률에 한계가 있다.\n\n| 구분 | 직접탈황 | 간접탈황 |\n|---|---|---|\n| 처리대상 | 중유 자체 | 경질유분(배합용) |\n| 탈황률 | 높음 | 상대적으로 낮음(배합 의존) |\n| 설비 부담(촉매 피독 등) | 큼 | 작음 |\n| 투자비 | 높음 | 상대적으로 낮음 |\n\n## Ⅳ. 저유황유 정책과 HDS 부산물 처리\n\n### 1. 저유황연료 정책 동향\n국제해사기구(IMO)는 2020년부터 선박연료의 황함량을 기존 3.5%에서 0.5% 이하로 강화하는 규제(IMO 2020)를 시행하였으며, 국내에서도 「대기환경보전법」및 관련 고시에 따라 지역별·용도별로 중유 황함량 기준이 차등 적용된다. 이러한 정책은 저유황연료 사용 확대와 HDS 설비 투자를 촉진하는 유인으로 작용한다.\n\n### 2. HDS 부산물(H2S) 처리\nHDS 반응으로 생성된 H2S는 그대로 대기 배출할 수 없는 유독가스이므로, Claus 공정 등을 통해 원소황(S)으로 회수·처리한다.\n\n**2H2S + SO2 → 3S + 2H2O** (Claus 반응 개략식, 부분산화-반응 단계로 구성)\n\n회수된 황은 비료·화학원료 등으로 자원화가 가능해 부가가치를 창출하며, HDS와 Claus 공정은 대형 정유·석유화학 단지에서 일체형으로 운영되는 경우가 많다.\n\n### 3. HDS 공정 흐름 개요\n정유공정에서 HDS는 통상 다음 순서로 진행된다: 원료유 예열 → 수소 혼합 → 반응기(촉매층, 고온고압) → 반응생성물 냉각·분리 → H2S 함유 가스는 Claus 공정으로, 탈황된 유분은 후속 정제공정으로 이송.\n\n| 공정 단계 | 주요 설비 | 목적 |\n|---|---|---|\n| 예열·혼합 | 열교환기, 수소압축기 | 반응조건 형성 |\n| 반응 | 고정층 반응기(촉매) | 유기황화합물 분해 |\n| 분리 | 기액분리기, 증류탑 | 생성물·미반응물 분리 |\n| 후처리 | Claus공정 연계 | H2S 자원화 |\n\n### 4. 탈황률과 배출저감 효과\n중유의 황함량을 예를 들어 3.0%에서 0.5%로 낮추면, 동일 연소조건에서 SOx 배출농도도 대략 비례하여 낮아지는 효과를 기대할 수 있다(단, 실제 배출계수는 연소조건에 따라 다소 상이). 이러한 연료 자체의 황함량 저감은 배가스탈황설비의 부하를 경감시키는 효과도 함께 가진다.\n\n## Ⅴ. 결론\n\n중유탈황(수소화탈황)은 연소 전 연료 단계에서 황분을 제거하는 사전적 저감전략으로, 배가스 후처리 탈황설비(Day 63~64)와 상호 보완적으로 활용된다. 직접탈황·간접탈황은 처리 대상과 설비 부담에 따라 선택되며, 부산물 H2S를 Claus 공정으로 자원화하는 것이 환경적·경제적으로 중요하다. IMO 2020 등 국제적 저유황연료 규제 강화 추세에 따라 국내에서도 저유황중유·청정연료 전환이 계속 확대될 것으로 전망되며, 이는 SOx 배출저감의 근본적 해법 중 하나로 평가된다.\n\n| 요약 | 연료탈황(HDS) |\n|---|---|\n| 처리시점 | 연소 전(정유단계) |\n| 핵심촉매 | Co-Mo, Ni-Mo계 |\n| 부산물 | H2S→Claus공정→원소황 |\n| 정책연계 | IMO2020, 국내 저유황유 고시 |\n","side":[{"title":"연료탈황 vs 배가스탈황 비교 정리","body":"### 저감 접근 방식 비교\n\n| 구분 | 연료탈황(HDS) | 배가스탈황(습식·건식 FGD) |\n|---|---|---|\n| 처리 시점 | 연소 전(사전예방) | 연소 후(사후처리) |\n| 처리 대상 | 연료 중 황화합물 | 배가스 중 SO2 |\n| 부산물 | H2S→황(S) 회수(자원화) | 석고 또는 혼합고체 |\n| 설비 위치 | 정유공장(연료공급단계) | 개별 사업장(배출단계) |\n| 적용 주체 | 정유사(연료 생산자) | 배출시설 운영자(사용자) |\n\n### 저유황연료 사용의 이점\n연료 자체의 황함량이 낮으면 별도의 배가스탈황설비 없이도(또는 저용량 설비만으로도) 배출허용기준을 충족할 수 있어, 중소 사업장 입장에서는 저유황연료 구매가 현실적인 SOx 저감 수단이 되는 경우가 많다.\n\n### 두 접근의 병행 적용 사례\n대형 화력발전소는 저유황중유 사용(연료탈황 결과물)과 습식탈황설비(Day63)를 함께 운영하여 이중으로 SOx를 저감하는 경우가 일반적이다. 이는 단일 저감수단의 한계(연료탈황만으로는 완전한 배출기준 충족이 어려울 수 있음)를 보완하는 전략이다.\n\n| 저감 단계 | 적용 기술 | 저감 대상 |\n|---|---|---|\n| 1단계(연료단계) | 저유황중유(HDS 처리) | 연료 중 황함량 자체 저감 |\n| 2단계(배가스단계) | 습식탈황(WFGD) | 잔여 SOx 추가 제거 |\n\n### 경제성 비교 관점\n연료탈황은 정유사 단계에서 대규모로 이루어져 규모의 경제가 작용하는 반면, 개별 사업장의 배가스탈황설비는 초기투자비가 사업장 규모에 비례해 부담이 커질 수 있다. 따라서 저유황연료 구매비용과 자체 탈황설비 투자비용을 비교하여 최적 조합을 선택하는 것이 실무적 의사결정의 핵심이다."},{"title":"기출 연계 및 정책 동향","body":"### Claus 공정 개요(참고)\nClaus 공정은 H2S의 일부를 먼저 연소하여 SO2로 전환한 뒤, 남은 H2S와 반응시켜 원소황을 회수하는 2단계 공정이다. 회수율을 더욱 높이기 위해 후단에 테일가스 처리설비(SCOT 공정 등)를 추가하는 경우도 있다.\n\n### 국내외 정책 비교\n\n| 구분 | 내용 |\n|---|---|\n| IMO 2020(국제) | 선박연료 황함량 0.5% 이하(배출규제해역은 더 강화) |\n| 국내 중유 기준 | 「대기환경보전법」 관련 고시에 따라 지역별 차등(청정연료 사용지역 강화) |\n| 대안기술 | 저유황유 외 스크러버(선박용 습식탈황) 설치도 대안으로 활용 |\n\n### 기출 연계 자가점검\n1. 수소화탈황(HDS)의 반응원리와 반응조건을 설명하시오. *(다수 회차 10점)*\n2. 직접탈황과 간접탈황의 차이를 비교 설명하시오. *(114~138회 10점)*\n3. 연료탈황과 배가스탈황의 차이를 비교하고 각각의 장단점을 설명하시오. *(최근 10~25점)*\n4. IMO 2020 등 국제 저유황연료 규제가 국내 대기환경 정책에 미치는 영향을 논하시오. *(최근 10점)*\n\n### 학습 연결 포인트\n다음 Day(66)는 H2S 제거기술과 탈황 부산물 관리를 다루며, 이번 Day에서 언급한 Claus 공정을 심화하여 학습한다.\n\n### 촉매 피독 이슈(HDS 촉매)\nHDS 촉매도 SCR 촉매(Day62)와 유사하게 금속성분(V, Ni 등)에 의한 피독·마모가 발생할 수 있으며, 중유와 같이 금속함량이 높은 잔사유를 직접탈황할 때 이 문제가 더욱 두드러진다. 이는 직접탈황의 설비 부담이 큰 주된 이유 중 하나이다."}]},"66":{"day":66,"date":"2026-10-05","title":"H2S 제거와 탈황 부산물","keywords":[{"k":"H2S 발생원","subs":["정유·석유화학 공정가스","하수처리장·축산시설(혐기성분해)","매립지가스(LFG)"]},{"k":"H2S 제거기술","subs":["습식산화법(Fe킬레이트, LO-CAT 등)","흡착법(활성탄, 함침활성탄)","생물학적탈황(Biofilter, 황산화균)"]},{"k":"Claus공정 심화","subs":["연소단: 2H2S+3O2→2SO2+2H2O","Claus반응: 2H2S+SO2→3S+2H2O","촉매단(Al2O3), 회수율 95~97%"]},{"k":"탈황 부산물 종류·관리","subs":["석고(습식FGD)-건축자재 재활용","원소황(Claus)-화학원료 자원화","아황산칼슘(건식·반건식)-매립위주"]},{"k":"악취관리 연계","subs":["H2S는 대표적 악취물질(낮은 역치)","「악취방지법」배출허용기준 적용","탈황시설이 악취저감과 직결"]}],"answer":"# H2S 제거와 탈황 부산물\n\n## Ⅰ. 개요\n\n황화수소(H2S)는 정유·석유화학 공정가스, 하수처리장·축산시설의 혐기성 분해가스, 매립지가스(LFG) 등 다양한 배출원에서 발생하는 유독·악취 물질로, Day 65에서 다룬 수소화탈황(HDS)의 반응 부산물이기도 하다. H2S는 낮은 농도에서도 강한 악취를 유발하고 고농도에서는 독성을 나타내므로, 배출원 특성에 맞는 제거기술 선정과 함께 탈황공정 전반에서 발생하는 부산물(석고·원소황·아황산칼슘 등)의 관리방안을 종합적으로 이해하는 것이 중요하다. *(114~138회 다수 10점 기출, 우선순위 B)*\n\n## Ⅱ. H2S 제거기술\n\n### 1. 습식산화법\n철킬레이트 촉매(Fe³⁺ 착물)를 이용한 산화-환원 순환반응으로 H2S를 원소황으로 전환하는 방식(LO-CAT 공정 등)으로, 상온·상압에서 운전 가능하고 중소규모 가스처리에 적합하다.\n\n**H2S + 2Fe³⁺ → S + 2Fe²⁺ + 2H⁺** (흡수·산화), 이후 공기로 Fe²⁺를 Fe³⁺로 재산화하여 순환 재사용\n\n### 2. 흡착법\n활성탄(특히 KOH 등으로 함침 처리한 활성탄)을 이용해 H2S를 물리·화학적으로 흡착 제거하는 방식으로, 소규모 처리(하수처리장 탈취 등)에 널리 사용된다. Day 55~56에서 학습한 흡착 원리(파과곡선, 흡착제 재생)가 그대로 적용된다.\n\n### 3. 생물학적 탈황(Biofilter)\n황산화균(Thiobacillus 등)을 이용해 H2S를 생물학적으로 산화시켜 황산염 등으로 전환하는 방식으로, 약품 소모가 적고 운영비가 저렴하나 반응속도가 느리고 미생물 관리가 필요하다. 저농도·대풍량 악취가스 처리(하수처리장, 축산시설)에 적합하다.\n\n| 제거기술 | 적용 농도·규모 | 특징 |\n|---|---|---|\n| 습식산화법(Fe킬레이트) | 중~고농도, 중규모 | 원소황 회수 가능, 약품비 발생 |\n| 흡착법(활성탄) | 저농도, 소규모 | 설치 간단, 흡착제 교체 필요 |\n| 생물학적탈황 | 저농도, 대풍량 | 저비용, 반응 느림, 미생물 관리 필요 |\n\n## Ⅲ. Claus 공정 심화\n\n### 1. 반응단계\n대규모 정유·가스처리시설에서는 H2S를 원소황으로 회수하는 Claus 공정을 표준적으로 채택한다.\n\n- **연소단(1단계)**: H2S의 약 1/3을 연소하여 SO2로 전환\n  **2H2S + 3O2 → 2SO2 + 2H2O**\n- **Claus 반응단(2단계, 촉매 사용)**: 남은 H2S와 생성된 SO2가 반응하여 원소황 생성\n  **2H2S + SO2 → 3S + 2H2O**\n\n### 2. 촉매와 회수율\n촉매(활성알루미나 Al2O3 등)를 이용한 다단 반응기를 거치며, 전체 황 회수율은 통상 **95~97%** 수준에 달한다. 잔여 미회수 황성분은 후단 테일가스 처리설비(SCOT 공정 등)를 통해 추가 회수하여 최종 대기 배출 농도를 최소화한다.\n\n## Ⅳ. 탈황 부산물 관리와 악취관리 연계\n\n### 1. 탈황 부산물 종류별 관리\n\n| 부산물 | 발생 공정 | 관리·활용 |\n|---|---|---|\n| 석고(CaSO4·2H2O) | 습식탈황(WFGD) | 건축자재·시멘트원료 재활용 |\n| 원소황(S) | Claus 공정 | 화학원료(황산 제조 등) 자원화 |\n| 아황산칼슘 등 혼합고체 | 건식·반건식탈황 | 재활용 제한적, 매립 위주 |\n\n### 2. 악취관리와의 연계\nH2S는 「악취방지법」상 지정악취물질로 관리되며, 매우 낮은 농도(취기역치가 낮음)에서도 불쾌한 악취를 유발한다. 하수처리장·축산시설·매립지 등에서는 대기오염물질 관리 차원과 별개로 악취 민원 예방 차원에서도 H2S 제거설비가 필수적으로 요구되며, 이 경우 대기환경(「대기환경보전법」)과 악취(「악취방지법」) 두 법령 체계를 함께 검토해야 한다.\n\n### 3. 제거기술 선정 시 통합 검토표\n| 검토 항목 | 습식산화법 | 흡착법 | 생물학적탈황 |\n|---|---|---|---|\n| 초기투자비 | 중간 | 낮음 | 중간~높음 |\n| 운영비 | 약품비 발생 | 흡착제 교체비 | 낮음(미생물 자가증식) |\n| 부지면적 | 중간 | 작음 | 큼(biofilter 베드) |\n| 부산물 가치 | 원소황 회수 가능 | 폐흡착제(재생 또는 폐기) | 없음(생물학적 산화) |\n| 반응속도 | 빠름 | 빠름 | 느림 |\n\n### 4. 매립지가스(LFG) 내 H2S 관리\n매립지가스는 메탄·이산화탄소가 주성분이며 소량의 H2S가 포함되어, 에너지회수(발전·연료 활용) 이전 전처리 단계에서 H2S를 제거하지 않으면 엔진·설비 부식을 유발할 수 있다. 이 경우 흡착법이나 소규모 습식산화법이 전처리 기술로 흔히 채택된다.\n\n## Ⅴ. 결론\n\nH2S 제거기술은 배출원의 농도·규모에 따라 습식산화법·흡착법·생물학적탈황 중 적정 기술을 선정해야 하며, 대규모 정유시설에서는 Claus 공정을 통한 원소황 회수가 표준이다. 탈황공정 전반에서 발생하는 부산물(석고·원소황 등)은 폐기물이 아닌 자원으로 재활용될 수 있는 경우가 많아, 방지시설 설계 시 부산물의 재활용 경로까지 함께 고려하는 것이 경제성과 환경성을 동시에 높이는 방향이다. H2S는 대기오염물질이자 대표적 악취물질이라는 이중적 성격을 가지므로, 관련 법령을 통합적으로 검토하는 것이 실무적으로 중요하다.\n\n| 요약 | 저농도 대풍량 | 고농도 소풍량 |\n|---|---|---|\n| 권장기술 | 생물학적탈황·흡착법 | 습식산화법·Claus공정 |\n| 대표 배출원 | 하수처리장, 축산시설 | 정유·가스처리시설 |\n","side":[{"title":"악취방지법과 대기환경보전법의 연계 관리","body":"### 두 법령의 관리 대상 비교\n\n| 구분 | 「대기환경보전법」 | 「악취방지법」 |\n|---|---|---|\n| 관리 목적 | 대기오염물질 농도관리(건강·환경) | 악취 민원·불쾌감 관리 |\n| 주요 대상물질 | 먼지, SOx, NOx 등 | 지정악취물질(H2S, 암모니아, 메르캅탄류 등) |\n| 판정 방식 | 기기측정(농도) | 기기측정+공기희석관능법(복합악취) |\n| 적용시설 | 대기배출시설 | 악취배출시설(신고대상) |\n\nH2S는 두 법령 모두에서 관리대상이 될 수 있어, 하수처리장·축산시설 등은 악취 민원 대응 차원에서 대기오염물질 관리기준보다 더 엄격한 관리가 요구되는 경우가 많다.\n\n특히 공동주택 인접 사업장은 부지경계 민원 발생 가능성이 높아, 설계 단계에서부터 악취방지시설 용량을 여유 있게 산정하고 밀폐형 반응조·포집덮개 등 발생원 차단 조치를 병행하는 것이 실무적으로 권장된다.\n\n| 관리 강화 조치 | 목적 |\n|---|---|\n| 반응조·저류조 밀폐화 | 발생원 자체 차단 |\n| 국소배기+탈취설비 연계 | 포집효율 향상 |\n| 부지경계 상시모니터링 | 민원 사전대응 |\n\n### 실무 설계 시 유의사항\n악취 저감을 목적으로 방지시설을 설계할 때는 단순 농도기준 충족뿐 아니라 부지경계에서의 복합악취 희석배수 기준도 함께 만족해야 하므로, 설계 여유율을 대기오염물질 기준보다 보수적으로 설정하는 경우가 일반적이다.\n\n### 복합악취와 지정악취물질의 관계\n복합악취는 여러 악취물질이 혼합되어 사람이 실제로 느끼는 냄새의 세기(공기희석관능법으로 측정)를 의미하며, 지정악취물질(H2S 포함) 개별 농도기준을 만족하더라도 복합악취 기준을 초과할 수 있어 두 기준을 모두 확인하는 것이 중요하다."},{"title":"기출 연계 및 공정 비교 정리","body":"### H2S 제거기술 선정 흐름\n1. 배출원 농도·풍량 파악(저농도 대풍량 vs 고농도 소풍량)\n2. 부산물 자원화 필요성 검토(원소황 회수 가치 여부)\n3. 운영 인력·기술 수준 고려(생물학적 처리는 미생물 관리 전문성 필요)\n4. 최종 처리기술(습식산화/흡착/생물학적/Claus) 선정\n\n### Claus 공정과 탈황 부산물의 연결\nClaus 공정에서 회수된 원소황은 다시 황산(H2SO4) 제조 원료로 활용될 수 있어, 정유·석유화학 단지 내에서 \"탈황→원소황 회수→황산 생산\"으로 이어지는 자원순환 체계가 구축되는 경우가 많다.\n\n이러한 자원순환은 폐기물 발생을 최소화하는 동시에 부가가치를 창출하는 사례로, 답안에서 탈황 전체 공정을 설명할 때 \"오염물질 제거\"에 그치지 않고 \"자원화\"까지 연결지어 서술하면 완성도 높은 답안이 된다.\n\n### 기출 연계 자가점검\n1. H2S의 발생원과 제거기술(습식산화법, 흡착법, 생물학적탈황)을 비교 설명하시오. *(다수 회차 10점)*\n2. Claus 공정의 반응단계와 황 회수율을 설명하시오. *(114~138회 10~25점)*\n3. 탈황공정에서 발생하는 부산물의 종류와 재활용 방안을 설명하시오. *(최근 10점)*\n4. 「대기환경보전법」과 「악취방지법」의 관리체계 차이를 설명하시오. *(다수 회차 10점)*\n\n### 학습 연결 포인트\n다음 Day(67)는 VOCs(휘발성유기화합물)의 정의·배출원·관리제도를 다루며, 이는 앞서 학습한 흡착(Day55~56)·연소처리 기술의 실제 적용대상이자 악취관리(이번 Day)와도 상당 부분 겹치는 주제이다."}]},"67":{"day":67,"date":"2026-10-06","title":"VOCs의 정의·배출원·관리제도","keywords":[{"k":"VOCs 정의·특성","subs":["「대기환경보전법」환경부고시 지정물질","증기압 높음(휘발성), 오존전구물질","일부 발암성(벤젠 등)"]},{"k":"고정오염원 배출","subs":["도장·세정·인쇄시설","저장시설(breathing/working loss)","화학제품 제조시설"]},{"k":"이동·비산 배출","subs":["자동차 연료증발가스, 급유(Stage Ⅰ/Ⅱ)","비산배출(fugitive emission)","LDAR(누출감지수선) 프로그램"]},{"k":"VOCs 저감기술","subs":["흡착회수(활성탄, Day55~56 연계)","연소처리: RTO(축열식)·RCO(촉매식)","저휘발성원료 대체"]},{"k":"관리제도·배출량 산정","subs":["신고대상시설·배출허용기준","특별대책지역 강화기준","물질수지법·배출계수법(AP-42)"]}],"answer":"# VOCs의 정의·배출원·관리제도\n\n## Ⅰ. 개요\n\n휘발성유기화합물(Volatile Organic Compounds, VOCs)은 상온·상압에서 쉽게 증발하는 유기화합물의 총칭으로, 「대기환경보전법」에 따라 환경부장관이 별도로 고시하는 물질군이다. VOCs는 Day 28~29에서 학습한 오존·광화학스모그의 핵심 전구물질이며, 벤젠 등 일부 물질은 발암성을 가져 건강영향 측면에서도 중요하게 관리된다. VOCs 저감에는 앞서 학습한 흡착(Day 55~56)·연소 등 다양한 기술이 종합적으로 적용되며, 배출원의 다양성(고정·이동·비산) 때문에 관리제도 또한 시설별로 세분화되어 있다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. VOCs의 정의와 특성\n\n### 1. 법적 정의\n「대기환경보전법」및 관련 고시에 따라 벤젠·톨루엔·자일렌 등 다수의 물질이 VOCs로 지정되어 있으며, 물질별 증기압·반응성 등을 기준으로 목록이 관리된다.\n\n### 2. 물리화학적 특성\n| 특성 | 내용 |\n|---|---|\n| 높은 증기압(휘발성) | 상온에서 쉽게 기화, 대기 중 확산 용이 |\n| 광화학반응성 | NOx와 함께 오존·2차유기에어로졸(SOA) 생성 전구물질(Day28~29 연계) |\n| 유해성 | 일부 물질(벤젠 등) 발암성, 신경계 영향 |\n| 냄새 | 다수가 악취 유발물질과 중첩(Day66 연계) |\n\n## Ⅲ. 배출원 분류\n\n### 1. 고정오염원\n| 배출원 | 발생 형태 |\n|---|---|\n| 도장시설 | 도료·희석제 중 유기용제 휘발 |\n| 세정시설(드라이클리닝 등) | 세정용제 휘발 |\n| 인쇄시설 | 잉크·세척액 중 용제 휘발 |\n| 저장시설(유류탱크) | 호흡손실(Breathing Loss)·작업손실(Working Loss) |\n| 화학제품 제조시설 | 공정 중 원료·중간체 누출·휘발 |\n\n### 2. 이동오염원 및 비산배출\n- **이동오염원**: 자동차 연료의 증발가스, 주유소 급유 시 발생가스(Stage Ⅰ: 저장탱크 하역 시, Stage Ⅱ: 차량 급유 시)\n- **비산배출(Fugitive Emission)**: 배관·밸브·플랜지 등 연결부의 미세누출로, 개별 누출량은 적으나 사업장 전체로는 상당한 배출량을 차지할 수 있어 LDAR(Leak Detection And Repair, 누출감지수선) 프로그램을 통해 정기적으로 관리한다.\n\n## Ⅳ. 저감기술과 배출량 산정\n\n### 1. 저감기술 비교\n| 기술 | 원리 | 적용 농도 | 비고 |\n|---|---|---|---|\n| 흡착회수(활성탄) | Day55~56 흡착원리, 용제 회수 가능 | 저~중농도 | 회수형은 경제성 우수 |\n| 축열식연소(RTO) | 고온 산화, 축열재로 열회수(85~95%) | 저~중농도, 대풍량 | 열효율 우수, 초기투자비 큼 |\n| 촉매식연소(RCO) | 촉매로 저온에서 산화(RTO보다 저온) | 저농도 | 에너지비용 절감, 촉매 피독 주의 |\n| 직접연소(소각) | 고온 직접 산화 | 고농도 | 단순하나 열회수 없으면 비효율 |\n\n### 2. 관리제도\n「대기환경보전법 시행규칙」에 따라 VOCs 배출시설은 신고대상시설로 관리되며, 배출허용기준 준수와 함께 저휘발성 원료(저VOC 함유 도료 등) 사용 권장·의무화가 확대되고 있다. 특히 특별대책지역·대기관리권역 등에서는 강화된 기준이 적용되어 방지시설 설치 의무가 더욱 엄격하다.\n\n### 3. 배출량 산정 방법\n| 방법 | 원리 |\n|---|---|\n| 물질수지법 | 투입원료 중 VOCs 함유량 - 제품·폐기물 중 잔류량 = 대기배출량 |\n| 배출계수법 | 활동자료(생산량 등)×배출계수(AP-42 등 문헌값) |\n\n물질수지법은 개별 사업장의 실제 투입·산출자료를 근거로 하여 정확도가 높은 반면, 배출계수법은 실측이 어려운 다수 소규모 배출원에 대한 통계적 추정에 활용된다.\n\n### 4. 저VOC 함유제품 정책과 대기관리권역 연계\n「대기환경보전법」에 따라 일정 규모 이상의 VOCs 배출시설은 신고 및 방지시설 설치의무가 부과되며, 「대기관리권역의 대기환경개선에 관한 특별법」에 따른 대기관리권역 내 사업장은 총량관리와 연계한 더욱 강화된 관리를 받는다. 도료·세정제 등 제품 자체의 VOC 함유기준을 규제하는 저VOC 함유제품 지정제도도 병행되어, 배출원 관리와 제품 관리가 함께 이루어지는 것이 최근 정책 방향이다.\n\n| 관리수단 | 적용 대상 | 특징 |\n|---|---|---|\n| 배출시설 신고·허가 | 개별 사업장 | 시설 단위 규제 |\n| 방지시설 설치의무 | 일정 규모 이상 시설 | 저감기술 적용 강제 |\n| 저VOC 함유제품 지정 | 도료·세정제 등 제품 | 원료 단계 관리 |\n| 대기관리권역 총량관리 | 권역 내 사업장 | 지역 단위 종합관리 |\n\n## Ⅴ. 결론\n\nVOCs는 고정·이동·비산이라는 다양한 형태로 배출되며, 오존 생성 전구물질이자 유해대기오염물질이라는 이중적 성격 때문에 「대기환경보전법」상 별도의 관리체계(신고대상시설, 저VOC제품 정책, LDAR)가 운영되고 있다. 저감기술은 오염물질 농도·풍량에 따라 흡착회수와 연소처리(RTO·RCO)를 구분하여 적용하며, 회수형 흡착은 경제성을, 연소처리는 고효율 파괴를 각각의 강점으로 한다. 향후에는 특별대책지역 확대와 저휘발성 원료 사용 의무화 등 배출원 관리가 한층 강화될 것으로 전망되며, 사업장 입장에서는 물질수지법 기반의 정확한 배출량 산정이 인허가·저감계획 수립의 출발점이 된다.\n\n| 요약 | 배출원 | 대표 저감기술 |\n|---|---|---|\n| 고정오염원 | 도장·인쇄·저장시설 | 흡착회수, RTO/RCO |\n| 이동오염원 | 자동차, 급유시설 | Stage Ⅰ/Ⅱ 회수설비 |\n| 비산배출 | 배관·밸브 누출 | LDAR 프로그램 |\n","side":[{"title":"RTO vs RCO 설계·운전 비교","body":"### 상세 비교표\n| 구분 | RTO(축열식산화) | RCO(촉매식산화) |\n|---|---|---|\n| 산화온도 | 750~850℃(고온) | 300~450℃(촉매 도움) |\n| 열회수율 | 85~95%(축열재 교번) | RTO보다 낮은 편 |\n| 초기투자비 | 높음 | RTO보다 낮은 편 |\n| 운영비 | 열회수 우수, 연료비 절감 | 촉매 교체비용 발생 |\n| 촉매피독 위험 | 없음 | 있음(Si, P, 중금속 등) |\n| 적용 VOCs 농도 | 저~중농도, 대풍량에 적합 | 저농도, 안정적 조성에 적합 |\n\n### RTO 축열재 교번 운전 개념\nRTO는 세라믹 축열재를 채운 여러 챔버를 교대로 전환하며, 산화된 고온가스의 열을 축열재에 저장했다가 다음 유입가스를 예열하는 데 재사용하여 높은 열회수율을 달성한다. 챔버 수가 많을수록(3탑식 등) 미처리 가스 슬립(퍼지구간 배출)을 최소화할 수 있다.\n\n### 설계 시 고려사항\n- VOCs 농도가 폭발하한계(LEL)의 25% 이하가 되도록 희석(안전설계) 필요\n- 혼합 VOCs 조성이 다양한 경우 RTO가 RCO보다 안정적 처리 가능(촉매피독 위험 없음)\n- 저농도 VOCs를 다량 처리하는 경우 RTO의 축열재 교번 방식이 에너지비용 측면에서 유리\n- 배출가스 중 할로겐화합물이 포함된 경우 RCO 촉매의 피독 위험이 커지므로 RTO 채택을 우선 검토\n\n### 흡착회수 시스템과의 결합\n저농도 대풍량 VOCs를 우선 활성탄으로 농축(흡착 후 재생)한 다음, 재생 시 발생하는 고농도 탈착가스를 RTO/RCO로 최종 산화 처리하는 흡착농축+연소 결합 시스템도 실무에서 널리 활용되며, 이는 대풍량 처리 시 연소설비의 에너지비용을 절감하는 효과가 있다."},{"title":"LDAR·배출량 산정 실무와 기출 연계","body":"### LDAR 프로그램 개요\n1. 사업장 내 배관·밸브·플랜지 등 잠재적 누출지점을 목록화\n2. 휴대용 VOCs 검지기로 정기적(월별·분기별) 누출농도 측정\n3. 기준농도(예: 500ppm 등) 초과 시 누출관리대상으로 지정, 일정기간 내 수리\n4. 수리 결과 재측정으로 확인\n\nLDAR은 개별 누출은 미미하지만 누적 시 상당한 배출량을 차지하는 비산배출을 체계적으로 관리하는 핵심 제도로, 정유·석유화학 사업장에서 특히 중요하게 운영된다.\n\n### 물질수지법 계산 예제(개념)\n어떤 도장시설에서 연간 도료 사용량 중 유기용제 함유량이 10톤이고, 이 중 도막(건조도료)에 잔류하는 용제가 1톤, 폐도료로 배출(폐기물 위탁)되는 용제가 0.5톤이라면:\n\n**대기 중 VOCs 배출량 = 10 - 1 - 0.5 = 8.5톤/년**\n\n### 배출계수법 참고(AP-42 등)\n미국 EPA의 AP-42 문헌은 업종·공정별 표준 배출계수를 제공하며, 국내에서도 「대기정책지원시스템(CAPSS)」등에서 유사한 배출계수 체계를 활용한 국가 배출량 통계를 산정한다. 배출계수법은 개별 사업장 실측이 어려운 소규모·다수 배출원의 통계적 총량 파악에 유용하다.\n\n### 기출 연계 자가점검\n1. VOCs의 정의와 오존 생성에서의 역할을 설명하시오. *(다수 회차 10~25점)*\n2. VOCs 배출원을 고정·이동·비산으로 분류하고 각각의 저감방안을 제시하시오. *(114~138회 25점)*\n3. RTO와 RCO의 원리·설계인자를 비교 설명하시오. *(최근 25점)*\n4. 물질수지법을 이용한 VOCs 배출량 산정방법을 설명하시오. *(다수 회차 10점)*"}]},"68":{"day":68,"date":"2026-10-07","title":"2단계 가스상·연소·측정 회독 2회차","keywords":[{"k":"NOx 저감기술","subs":["SNCR(700~1,000℃, NH₃/요소수)","Hybrid SNCR/SCR","SCR 피독(As·Pb·촉매 비소피독)"]},{"k":"탈황공정 3계열","subs":["습식(석회석-석고법, 탈황율 90%↑)","건식/반건식(Semi-dry, 소석회 slurry)","부생석고·폐수 처리"]},{"k":"중유·H2S 탈황","subs":["직접탈황(HDS)·간접탈황","Claus 공정(H2S→S)","LNG 대비 중유 SOx·V 문제"]},{"k":"VOCs 관리","subs":["「대기환경보전법」신고대상시설","LDAR, Stage Ⅰ/Ⅱ","RTO·RCO·흡착회수"]},{"k":"공통 설계인자","subs":["체류시간·온도·촉매 SV","암모니아슬립 관리","반응온도 windows"]}],"answer":"# 2단계 회독 2회차 — Day 61~67 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 **NOx 저감(SNCR/SCR) → 탈황(습식/건식) → 중유·H2S 탈황 → VOCs**로 이어지는 가스상 오염물질 후처리 기술의 핵심 구간이다. 1회독에서 개별 공정을 이해했다면, 2회독에서는 **공정 간 비교(온도창, 효율, 부산물)**를 표로 정리해 답안에 바로 쓸 수 있어야 한다.\n\n```\n연소 후 배출가스\n   ↓\nNOx 저감: SNCR(700~1,000℃, 무촉매) / SCR(300~400℃, 촉매) / Hybrid\n   ↓\nSOx 저감: 습식(석회석-석고, 고효율) / 건식·반건식(Semi-dry, 부산물 재활용 곤란)\n   ↓\n특수 연료: 중유탈황(HDS) / H2S(Claus 공정)\n   ↓\nVOCs: 신고대상시설 → 흡착회수 / RTO·RCO → LDAR(비산배출 관리)\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| SNCR 반응 온도창 | **700~1,000℃** | ☐ |\n| SNCR 온도창 벗어날 때 | 낮으면 NH₃ 미반응(슬립), 높으면 NH₃가 산화되어 **NOx 재생성** | ☐ |\n| SCR 반응 온도 | **300~400℃**(V₂O₅-TiO₂ 촉매) | ☐ |\n| SCR NOx 제거효율 | **80~90%** 이상 | ☐ |\n| SNCR NOx 제거효율 | **30~50%** 내외(SCR보다 낮음) | ☐ |\n| 암모니아 슬립 관리기준 | 통상 **10ppm 이하** | ☐ |\n| SCR 촉매 피독물질 | As(비소), Pb, K/Na(알칼리), CaSO₄(공극폐색) | ☐ |\n| 습식탈황(석회석-석고법) 효율 | **90% 이상** | ☐ |\n| 건식/반건식 탈황 효율 | 습식보다 낮은 **70~90%** | ☐ |\n| Semi-dry 반응 특징 | 소석회 슬러리 분무, 물 증발과 동시 반응 | ☐ |\n| Claus 공정 반응 | H₂S + O₂/SO₂ → **S(황) + H₂O** | ☐ |\n| 중유 탈황(HDS) 촉매 | Co-Mo/Ni-Mo계, 고온·고압 수소 첨가 | ☐ |\n| VOCs 신고대상시설 근거 | 「대기환경보전법 시행규칙」 별표 | ☐ |\n| RTO 열회수율 | **85~95%** | ☐ |\n| Stage Ⅰ/Ⅱ 구분 | Ⅰ=저장탱크 하역 / Ⅱ=차량 급유 | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **SCR 주 반응**: 4NH₃ + 4NO + O₂ → 4N₂ + 6H₂O\n2. **SNCR 반응(요소수)**: CO(NH₂)₂ + 2NO + 1/2O₂ → 2N₂ + CO₂ + 2H₂O\n3. **NOx 제거효율**: η = (Cin − Cout)/Cin × 100\n4. **습식탈황 반응**: CaCO₃ + SO₂ + 1/2O₂ + 2H₂O → CaSO₄·2H₂O + CO₂\n5. **Claus 반응**: 2H₂S + SO₂ → 3S + 2H₂O (또는 2H₂S + 3O₂ → 2SO₂ + 2H₂O 후 위 반응)\n6. **공간속도(SV)**: SV = 처리가스량(Nm³/h) / 촉매체적(m³)\n7. **물질수지법(VOCs)**: 배출량 = 투입 − 제품잔류 − 폐기물위탁\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| SNCR vs SCR | 무촉매, 700~1,000℃, 저효율 | 촉매, 300~400℃, 고효율 | 촉매 유무·온도 |\n| 습식 vs 건식탈황 | 고효율, 부생석고 회수 | 저효율, 폐기물 발생(비산회 혼합) | 부산물 활용성 |\n| Rainout vs Semi-dry | (1단계 개념) | 소석회 슬러리 분무, 건조 동시진행 | — |\n| 직접탈황 vs 간접탈황(중유) | 원유 자체 탈황(고압수소) | 상압잔사유를 분해 후 탈황 | 처리 대상 |\n| Stage Ⅰ vs Stage Ⅱ | 저장탱크 하역 시 증기 회수 | 차량 급유 시 증기 회수 | 발생 시점 |\n| RTO vs RCO | 750~850℃ 고온 열산화 | 300~450℃ 촉매 산화 | 온도·촉매 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. SNCR과 SCR의 원리·설계인자·적용조건을 비교 설명하시오. *(다수 회차 25점)*\n2. SCR 촉매의 피독 원인과 방지대책을 설명하시오. *(120회 25점)*\n3. 배연탈황 공정을 습식·건식·반건식으로 구분하여 설명하시오. *(114~138회 25점)*\n4. Semi-dry(반건식) 탈황 공정의 원리와 특징을 설명하시오. *(최근 10점)*\n5. 중유의 탈황방법(직접·간접)을 설명하시오. *(다수 회차 10점)*\n6. Claus 공정을 설명하시오. *(126회 10점)*\n7. VOCs 배출원을 고정·이동·비산으로 분류하고 저감방안을 제시하시오. *(114~138회 25점)*\n8. LDAR 프로그램의 개념과 절차를 설명하시오. *(최근 10점)*\n9. 암모니아 슬립의 원인과 저감방안을 설명하시오. *(120회 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고, NOx→SOx→VOCs 순서로 처리 위치를 설명해본다.\n2. **비교표 재구성(30분)**: Ⅳ의 6개 비교쌍을 스스로 표로 다시 그려본다.\n3. **수치 암기(20분)**: Ⅱ 체크리스트. 온도창(SNCR 700~1,000℃, SCR 300~400℃)은 절대 혼동 금지.\n4. **기출 구술(30분)**: Ⅴ의 9문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: 촉매 피독(Day62)과 Claus 공정(Day66)은 재확인 권장.\n\n> SNCR·SCR은 매 회차 빠지지 않는 최고빈출 주제다. 온도창과 반응식은 눈감고도 쓸 수 있어야 한다.\n","side":[{"title":"질소·황산화물 저감기술 선정 흐름도","body":"### 판단 순서\n```\nQ1. 기존시설(Retrofit)인가, 신설(Green field)인가?\n   신설 → 배출허용기준 강화 대비 SCR 우선 검토\n   기존 → 설치공간·촉매교체비용 확인\n\nQ2. 목표 NOx 제거효율이 80% 이상인가?\n   YES → SCR (또는 Hybrid SNCR/SCR)\n   NO  → SNCR (소형 보일러·소각로에 유리)\n\nQ3. 배출가스 중 As·중금속 농도가 높은가? (석탄화력 등)\n   YES → 촉매 피독 대책(저As 촉매, 예비 탈진설비) 병행\n   NO  → 일반 촉매 적용\n\nQ4. 부생석고 판매처(시멘트·석고보드)가 확보되는가?\n   YES → 습식(석회석-석고법) 우선\n   NO  → 건식/반건식 검토(부지·용수 제약 시)\n```\n\n### 통합 저감 순서(대형 발전소 기준)\n연소조절(저NOx버너·FGR) → SCR(고온측, 집진 전) → 전기집진(또는 여과) → 습식탈황(FGD) → 굴뚝\n\n### 설계 검토 시 체크포인트\n- SCR 설치 위치는 통상 절탄기와 공기예열기 사이(300~400℃ 구간)\n- 습식탈황 후 배출가스는 재가열(GGH) 또는 White Plume 저감설비 검토\n- 암모니아 저장·주입설비의 누출·폭발 방지 설계 필수\n\n### 발전소 배출허용기준 비교(참고 감각)\n| 오염물질 | 화력발전(신설 기준 예시) | 비고 |\n|---|---|---|\n| NOx | 십 ppm대 수준(설비별 상이) | SCR 필수 적용 |\n| SOx | 십 ppm대 수준(설비별 상이) | 습식탈황 필수 적용 |\n| 먼지 | 수 mg/Sm³ 수준 | 여과집진 병행 |\n\n정확한 수치는 「대기환경보전법 시행규칙」별표 및 배출시설별 허가조건에 따라 상이하므로, 답안에서는 절대수치 단정보다 **\"설비 규모·연료·지역별로 차등 적용된다\"**는 원칙을 함께 서술하는 것이 안전하다."},{"title":"암기 카드 — Day 61~67 핵심 18선","body":"1. **SNCR** = 무촉매, 700~1,000℃, 요소수/NH₃ 직접 분사, 효율 30~50%\n2. **SCR** = 촉매(V₂O₅-TiO₂), 300~400℃, 효율 80~90%↑\n3. **Hybrid SNCR/SCR** = 고온부 SNCR + 저온부 SCR, 암모니아슬립 저감\n4. **촉매 피독** = As(비소)가 최대 위협, Pb·알칼리금속도 피독 유발\n5. **암모니아 슬립** = 미반응 NH₃ 배출, 기준 통상 10ppm 이하\n6. **습식탈황** = 석회석-석고법, 효율 90%↑, 부생석고 회수\n7. **건식탈황** = 분말 소석회 분사, 폐기물 혼합배출, 효율 낮음\n8. **반건식(Semi-dry)** = 슬러리 분무+건조 동시, 폐수 無, 부산물 재활용 곤란\n9. **직접탈황(HDS)** = 원유 자체 고온고압 수소첨가 탈황\n10. **간접탈황** = 상압잔사유 분해 후 경질유 탈황\n11. **Claus 공정** = H₂S를 원소황(S)으로 회수, 정유·가스처리 필수 공정\n12. **VOCs** = 오존전구물질+발암성, 「대기환경보전법」신고대상시설\n13. **RTO** = 750~850℃ 열산화, 열회수 85~95%\n14. **RCO** = 300~450℃ 촉매산화, 저농도 유리\n15. **LDAR** = 누출감지수선, 비산배출 체계적 관리\n16. **Stage Ⅰ/Ⅱ** = 저장탱크 하역 / 차량 급유 시 증기 회수\n17. **물질수지법** = 투입 - 잔류 - 위탁폐기 = 대기배출량\n18. **저VOC 함유제품** = 도료·세정제 원료단계 규제, 배출원관리와 병행"}]},"69":{"day":69,"date":"2026-10-08","title":"RTO·RCO·DTO 비교","keywords":[{"k":"RTO(축열식산화)","subs":["750~850℃, 세라믹 축열재 교번","열회수율 85~95%","2탑/3탑/로터리식"]},{"k":"RCO(촉매식산화)","subs":["300~450℃, Pt/Pd계 촉매","촉매피독(Si·P·중금속)","운영비 절감, 초기투자 낮음"]},{"k":"DTO(직화식산화)","subs":["열회수 없음(단순 소각)","고농도·간헐적 배출에 적합","설비 단순, 연료비 큼"]},{"k":"설계인자","subs":["체류시간 0.5~1초, 연소온도 750℃↑","LEL 25% 이하 희석(안전설계)","챔버 수·퍼지구간 슬립관리"]},{"k":"결합공정","subs":["흡착농축+연소(Wheel/활성탄)","열교환기 예열","폐열회수 연계(스팀·온수)"]}],"answer":"# RTO·RCO·DTO 비교\n\n## Ⅰ. 개요\n\nVOCs 및 악취물질의 연소산화 처리기술은 열원 공급방식과 촉매 사용 여부에 따라 축열식산화(RTO, Regenerative Thermal Oxidizer), 촉매식산화(RCO, Regenerative Catalytic Oxidizer), 직화식산화(DTO, Direct Thermal Oxidizer)로 구분된다. 세 공정 모두 유기물을 고온에서 CO₂와 H₂O로 산화·분해한다는 원리는 같으나, 열회수 방식과 반응온도에서 큰 차이가 있어 배출가스의 농도·유량·연속성에 따라 선정기준이 달라진다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 반응 원리와 설계인자\n\n### 1. 공통 반응식\n유기물(CₓHᵧ) + O₂ → CO₂ + H₂O + 열\n\n산화(파괴)효율 η = (Cin − Cout)/Cin × 100 이며, 대부분의 인허가 기준은 **DRE(Destruction & Removal Efficiency) 95% 이상**을 요구한다.\n\n### 2. 핵심 설계인자\n| 인자 | 설명 |\n|---|---|\n| 체류시간(Residence Time) | 통상 0.5~1초, 연소실
