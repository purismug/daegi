함께 관리되어야 하는 통합 시스템으로 이해해야 한다.\n\n## Ⅴ. 결론\n\n소각시설은 먼지·산성가스·NOx라는 일반 연소시설의 공통 오염물질에 더해 다이옥신·중금속이라는 특유의 유해물질을 배출하므로, 3T 조건에 의한 생성억제, 급속냉각에 의한 재합성 억제, 활성탄·백필터에 의한 후단 제거라는 3중 방어체계가 핵심이다. 반건식+백필터+활성탄분사+SCR/SNCR의 표준 조합은 국내외 소각시설의 대표적 방지설비 체계로 자리잡았으며, 소각재의 안전한 관리와 자원화 또한 소각시설 전주기 환경관리의 중요한 축이다.\n\n| 요약 | 대응 오염물질 | 핵심 설비 |\n|---|---|---|\n| 산성가스 | HCl, SOx | 반건식반응탑 |\n| 먼지+흡착물질 | 먼지, 다이옥신, 중금속 | 활성탄분사+백필터 |\n| 질소산화물 | NOx | SCR/SNCR |\n\n소각시설 인허가 실무에서는 이러한 다단계 방지설비 각각의 설계효율을 합산한 종합 제거효율이 배출허용기준을 충분한 여유율로 만족하는지 사전에 검증하는 것이 필수 절차이며, 이는 환경영향평가와 대기배출시설 허가 협의의 핵심 검토사항이다.\n","side":[{"title":"소각시설 배출허용기준 감각과 연속측정","body":"### 소각시설 배출허용기준 항목(개념, 시설규모·종류별 상이)\n| 항목 | 관리방식 |\n|---|---|\n| 먼지, HCl, SOx, NOx, CO | 굴뚝자동측정기기(TMS)로 연속측정 |\n| 다이옥신 | 연속측정 어려움 → 정기 시료채취 분석(연 1~수회) |\n| 중금속(Hg 등) | 정기 측정, 일부 연속측정기 도입 확대 |\n\n### 다이옥신 대체 관리지표\n다이옥신은 연속측정이 기술적으로 어려워, CO 농도(불완전연소 지표)를 실시간 모니터링하여 간접적으로 연소상태를 관리하고, 정기적인 다이옥신 시료채취·분석으로 이를 보완하는 이원적 관리방식이 활용된다.\n\n### TMS(굴뚝원격감시체계) 연계\n소각시설은 TMS를 통해 실시간 배출농도가 관제센터로 전송되어 상시 감시되며, 기준초과 시 즉시 경보와 함께 행정조치로 이어질 수 있어 사업장의 상시 운전관리 부담이 크다.\n\n### 정보공개와 주민감시\n다수의 소각시설은 TMS 측정값을 전광판이나 인터넷을 통해 실시간 공개하도록 요구받는 경우가 많으며, 이는 시설 운영의 투명성을 높이고 주민 수용성을 확보하기 위한 정책적 장치로 기능한다.\n\n### 정기측정 항목과 주기(개념)\n| 항목 | 측정주기 감각 |\n|---|---|\n| 다이옥신 | 연 1~4회(시설 규모·종류별 상이) |\n| 중금속(Hg 등) | 연 1~2회 또는 연속측정 확대 중 |\n| 먼지·HCl·SOx·NOx·CO | TMS 상시 연속측정 |\n\n측정주기는 시설 규모와 관련 법령 개정에 따라 변동될 수 있으므로, 답안에서는 절대 수치보다 \"연속측정 가능 항목과 정기측정에 의존하는 항목이 구분된다\"는 원칙을 설명하는 것이 안전하다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 소각시설의 주요 대기오염물질과 방지설비 체계를 종합적으로 설명하시오. *(114~138회 다수 25점)*\n2. 반건식(Semi-dry) 반응탑의 원리와 백필터와의 연계를 설명하시오. *(120회 25점)*\n3. 다이옥신의 생성·재합성 기작과 3단계 관리전략을 설명하시오. *(다수 회차 25점)*\n4. 소각재(비산재·바닥재)의 관리방안을 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n소각시설 종합문제는 오염물질별 발생원인과 대응 방지설비를 매칭한 표를 제시한 뒤, 다이옥신은 별도 단락으로 3단계 관리전략(생성억제-재합성억제-후단제거)을 강조하는 구성이 고득점 전략이다.\n\n### 다음 학습 연계\nDay 89~90(다이옥신 생성기작·De Novo 합성, TEQ)에서 이번 Day의 다이옥신 파트를 심화 학습하므로, 두 Day를 연결하여 복습하면 이해도가 크게 향상된다.\n\n### 암기 카드 5선\n1. **소각 특유 오염물질** = HCl, 다이옥신(일반 연소시설과 차별점)\n2. **표준 방지설비 조합** = 반건식+활성탄분사+백필터+SCR/SNCR\n3. **다이옥신 3단계 관리** = 생성억제(3T)+재합성억제(급냉)+후단제거(흡착)\n4. **TEQ** = 이성질체별 독성 환산, 단일지표 관리\n5. **소각재** = 비산재(엄격관리) vs 바닥재(재활용 검토)\n\n### 답안 확장 포인트\n소각시설 문제는 출제 범위가 넓어 \"오염물질별 대응 설비\"를 표로 정리하는 것만으로도 상당한 배점을 확보할 수 있으며, 여기에 다이옥신 3단계 관리전략을 별도 단락으로 강조하면 25점 문제에서도 충분한 답안 분량을 채울 수 있다."}]},"86":{"day":86,"date":"2026-10-25","title":"클링커 생성과 소각로 관리","keywords":[{"k":"클링커 정의","subs":["회분이 용융·응고된 덩어리","화격자·노벽 부착·폐색","연소불량 유발 악순환"]},{"k":"생성 원인","subs":["국소 고온(연소온도 편중)","회분 융점 낮은 폐기물 혼입","공기분배 불균일"]},{"k":"소각로 형식별 특성","subs":["스토커식: 화격자 이송연소","유동층식: 유동매체 저온균일연소","회전로식(로터리킬른): 회전이송"]},{"k":"클링커 방지·관리","subs":["연소온도 균일화(공기분배 최적화)","폐기물 성상관리(사전선별·혼합)","정기 화격자 점검·클링커 제거"]},{"k":"소각로 운영관리","subs":["부하변동 최소화(균질 투입)","내화물 손상관리","가동중단 대응절차"]}],"answer":"# 클링커 생성과 소각로 관리\n\n## Ⅰ. 개요\n\n클링커(Clinker)는 소각시설 운전 중 폐기물 중 회분·무기물이 국소적 고온에서 용융된 후 냉각·응고되어 화격자나 노벽에 부착되는 덩어리로, 소각로의 안정적 운전을 저해하는 대표적인 운전상 장애요인이다. 클링커가 형성되면 화격자 사이의 공기 통로가 막혀 국소적 산소 부족이 발생하고, 이는 다시 불완전연소와 추가적인 클링커 생성으로 이어지는 악순환을 유발할 수 있어 소각시설 관리자의 핵심 관리 대상이다. *(114~138회 다수 10점 기출)*\n\n## Ⅱ. 클링커 생성 메커니즘과 원인\n\n### 1. 생성 메커니즘\n폐기물 중 유리·금속·토사 등 무기성분이 국소적으로 회분 융점 이상의 고온에 노출되면 용융되며, 이 용융물이 저온부에서 냉각되면서 고체화되어 클링커를 형성한다.\n\n### 2. 주요 원인\n| 원인 | 설명 |\n|---|---|\n| 국소 고온(화염 편중) | 공기분배 불균일로 특정 구간 과도한 고온 형성 |\n| 저융점 회분 혼입 | 유리·특정 금속 등 융점이 낮은 물질의 다량 혼입 |\n| 폐기물 성상 불균질 | 발열량 편차가 큰 폐기물의 국소적 집중 투입 |\n| 공기비 관리 부적정 | 과도한 국소 공기 부족 또는 과잉 |\n\n## Ⅲ. 소각로 형식별 클링커 발생 특성\n\n| 형식 | 원리 | 클링커 발생 경향 |\n|---|---|---|\n| 스토커식 | 화격자 위 이송하며 연소 | 화격자 틈새 폐색 위험, 가장 흔한 발생 형태 |\n| 유동층식(FBC) | 유동매체(모래) 위 저온 균일연소 | 상대적으로 낮음(저온·균일연소 특성) |\n| 회전로식(로터리킬른) | 원통형 노체 회전으로 폐기물 이송 | 노벽 부착형 클링커 발생 가능 |\n\n유동층식은 연소온도가 상대적으로 낮고 균일하게 유지되는 특성상 클링커 발생 위험이 스토커식보다 낮은 것으로 평가되나, 유동매체 자체의 응집(Agglomeration) 문제가 별도로 발생할 수 있다.\n\n## Ⅳ. 클링커 방지 및 소각로 운영관리\n\n### 1. 클링커 방지대책\n| 대책 | 내용 |\n|---|---|\n| 공기분배 최적화 | 화격자 구간별 공기공급량 세분 제어로 국소 고온 방지 |\n| 폐기물 성상관리 | 반입 폐기물 사전 선별·파쇄·혼합으로 균질화 |\n| 연소온도 모니터링 | 구간별 온도센서로 이상고온 조기 감지 |\n| 정기 점검·제거 | 화격자·노벽 클링커 정기 점검 및 물리적 제거 |\n\n### 2. 클링커 발생 시 문제점\n- 화격자 통기저항 증가로 국소 산소부족 → 불완전연소(CO 증가)\n- 화격자 이송 저항 증가로 기계적 고장 유발\n- 소각로 정지·보수에 따른 가동률 저하 및 처리용량 감소\n\n### 3. 소각로 안정 운영관리 원칙\n| 원칙 | 내용 |\n|---|---|\n| 균질 투입 | 폐기물 혼합·계량 투입으로 부하변동 최소화 |\n| 내화물 관리 | 정기 점검으로 손상부 조기 보수, 열충격 최소화 |\n| 부하 안정화 | 설계용량 대비 과부하 운전 지양 |\n| 가동중단 대응 | 비상정지 시 급속냉각·재가동 절차 표준화 |\n\n### 4. 클링커와 대기오염물질 배출의 정량적 연계\n클링커로 인한 불완전연소는 CO 농도 상승과 함께 미연탄화수소·매연 증가로 이어지며, 이는 후단 방지설비(백필터·활성탄분사 등)의 처리부하를 가중시켜 전체 시스템의 배출 안정성을 저해하는 연쇄효과를 가진다. 따라서 클링커 관리는 단순한 설비 유지보수 차원을 넘어 배출허용기준 준수의 전제조건으로 이해해야 한다.\n\n### 5. 클링커 조성 분석을 통한 원인 역추적\n클링커의 화학성분(주로 SiO2, CaO, 알칼리금속 산화물 등)을 분석하면 어떤 폐기물 성분이 융착에 기여했는지 역으로 추정할 수 있어, 반복적으로 클링커 문제가 발생하는 사업장에서는 정기적인 클링커 성분분석을 통해 반입 폐기물의 성상관리 기준을 조정하는 데 활용하기도 한다.\n\n### 6. 클링커 제거작업의 안전관리\n클링커 제거는 고온 상태의 노 내부에서 수행되는 경우가 많아 화상·낙하물 등 산업안전 위험이 상존하므로, 충분한 냉각 후 작업하거나 원격조작 장비를 활용하는 등 작업자 안전을 확보하는 절차가 함께 요구된다.\n\n## Ⅴ. 결론\n\n클링커는 소각시설 운전 중 국소 고온과 폐기물 성상 불균질에서 비롯되는 운전상 장애로, 방치할 경우 통기저항 증가와 불완전연소라는 악순환으로 이어져 소각로 전체의 처리효율과 대기오염물질 배출 관리에 부정적 영향을 미친다. 공기분배 최적화와 폐기물 성상 균질관리, 정기점검을 통한 조기 대응이 클링커 예방의 핵심이며, 이는 궁극적으로 3T 조건(Day81)의 안정적 확보와 직결되는 문제다.\n\n| 요약 | 핵심 |\n|---|---|\n| 발생원인 | 국소고온+저융점회분+불균질투입 |\n| 결과 | 통기저항↑, 불완전연소↑, 가동률↓ |\n| 대책 | 공기분배 최적화+성상관리+정기점검 |\n\n소각시설 운영 실무에서는 클링커를 완전히 없애는 것은 현실적으로 어려우며, 발생 빈도와 규모를 최소화하고 조기에 발견·제거하는 예방적 유지관리 체계를 구축하는 것이 현실적인 목표다. 이러한 예방적 관리 개념은 설비고장을 사후에 수리하는 것이 아니라 이상징후를 사전에 포착해 대응하는 예지보전(Predictive Maintenance)의 관점과도 일맥상통한다. 결국 클링커 관리는 소각시설의 안정적 가동률 확보와 대기오염물질 배출 저감이라는 두 목표를 동시에 달성하기 위한 기초적이지만 필수적인 운영관리 과제다. 신설 소각시설 설계 단계에서부터 폐기물 성상 특성을 충분히 반영한 화격자·공기공급 시스템을 채택하는 것이 장기적으로 가장 효과적인 예방책이다.\n","side":[{"title":"클링커와 3T 조건의 상호관계","body":"### 클링커가 3T에 미치는 영향\n| 3T 요소 | 클링커에 의한 영향 |\n|---|---|\n| 온도(Temperature) | 통기저항으로 국소 산소부족 → 온도 불균일 심화 |\n| 시간(Time) | 폐색구간 통과 폐기물의 체류시간 왜곡 |\n| 혼합(Turbulence) | 공기분배 왜곡으로 균일혼합 저해 |\n\n클링커 발생은 단순한 기계적 장애를 넘어 3T 조건 전체를 악화시키는 연쇄적 영향을 미치므로, 소각시설의 안정 운전관리에서 클링커 관리는 3T 확보의 전제조건으로 이해해야 한다.\n\n### 화격자 형식별 클링커 대응력\n이동화격자(Moving Grate)는 지속적인 이송 작용으로 클링커 부착을 어느 정도 자체적으로 파쇄·이동시키는 효과가 있는 반면, 고정화격자 구간이 있는 형식은 클링커가 누적되기 쉬워 정기적인 수동 제거작업이 더 빈번히 요구된다.\n\n### 유동층 소각로의 응집(Agglomeration) 문제\n유동층식은 클링커 자체는 적으나, 유동매체(모래)가 폐기물 중 저융점 성분과 결합해 덩어리로 응집되면 유동화가 저해되어 연소불안정을 초래할 수 있다. 이는 클링커와 유사한 메커니즘이나 발생 위치와 대응방식(매체 교체 등)이 다르므로 구분하여 이해해야 한다.\n\n### 형식별 클링커·응집 대응 비교\n| 형식 | 주요 문제 | 대응방식 |\n|---|---|---|\n| 스토커식 | 화격자 클링커 | 공기구획 제어, 정기 제거 |\n| 유동층식 | 유동매체 응집 | 매체 교체·보충, 온도관리 |\n| 회전로식 | 노벽 부착형 클링커 | 회전에 의한 자체 탈락 유도, 정기 점검 |\n\n### 화격자 공기구획 제어 개념\n스토커식 소각로는 화격자를 여러 구획으로 나누어 각 구획별로 공기공급량을 독립 제어하는데, 이는 폐기물의 건조-연소-후연소 단계별로 요구되는 공기량이 다르기 때문이며, 이 구획별 제어의 정밀도가 클링커 예방의 핵심 설계요소다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 클링커의 생성원인과 소각로 운전에 미치는 영향을 설명하시오. *(다수 회차 10점)*\n2. 클링커 방지를 위한 소각로 운영관리 방안을 설명하시오. *(120회 10점)*\n3. 소각로 형식(스토커·유동층·회전로)별 클링커 발생 특성을 비교 설명하시오. *(최근 10점)*\n4. 유동층 소각로의 유동매체 응집(Agglomeration) 문제를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n클링커 문제는 단순 정의형보다 \"원인→결과(악순환)→대책\"의 인과관계를 강조하는 서술이 효과적이며, 3T 조건과의 연계를 언급하면 심화된 답안으로 평가받을 수 있다. 소각로 형식별 비교표를 함께 제시하면 답안의 구조적 완성도가 한층 높아진다.\n\n### 실무 연계 메모\n클링커 관리 소홀은 소각시설 가동률 저하로 이어져 폐기물 처리 지연, 임시 매립 증가 등 폐기물 관리 전반에 영향을 미치므로, 대기 분야를 넘어 폐기물 관리 측면에서도 중요하게 다뤄지는 실무 이슈다. 실제로 다수 소각시설의 정기보수 계획에는 클링커 제거 작업이 표준 항목으로 포함되어 있으며, 이는 소각시설 위탁운영 계약서상 정기점검 의무사항으로 명시되는 경우도 많다.\n\n### 암기 카드 4선\n1. **클링커** = 회분 용융·응고 덩어리, 화격자·노벽 부착\n2. **생성원인** = 국소고온+저융점회분+불균질투입\n3. **악순환** = 통기저항↑ → 불완전연소 → 클링커 추가생성\n4. **형식별 경향** = 스토커(발생多) vs 유동층(상대적으로 낮음, 응집문제 별도)"}]},"87":{"day":87,"date":"2026-10-26","title":"SRF·고형연료 제도와 규제","keywords":[{"k":"SRF 정의","subs":["폐기물 유래 고형연료(Solid Refuse Fuel)","생활폐기물계·폐목재계 등 구분","「자원의 절약과 재활용촉진에 관한 법률」"]},{"k":"품질기준","subs":["저위발열량 기준(예: 3,000kcal/kg 이상 등)","염소·수분·회분 함량 제한","중금속(수은 등) 함량 제한"]},{"k":"사용시설 관리","subs":["SRF 전용보일러·시멘트소성로 혼소","배출허용기준 소각시설 수준 적용","사용시설 신고·허가 대상"]},{"k":"환경영향 이슈","subs":["염소함량 높을 시 HCl·다이옥신 우려","품질관리 미흡 시 민원 발생","저장·보관 중 비산·화재 위험"]},{"k":"정책 동향","subs":["폐기물 에너지화 확대 정책","품질인증제도 강화","주민 수용성 확보 과제"]}],"answer":"# SRF·고형연료 제도와 규제\n\n## Ⅰ. 개요\n\nSRF(Solid Refuse Fuel, 고형연료제품)는 생활폐기물이나 폐목재 등 폐기물을 선별·파쇄·성형하여 연료화한 것으로, 화석연료 대체와 폐기물 처리량 감축을 동시에 달성하는 자원순환형 에너지원으로 정책적으로 육성되고 있다. 다만 원료가 폐기물이라는 특성상 염소·중금속 등 유해성분이 잔류할 수 있어, 「자원의 절약과 재활용촉진에 관한 법률」등에 따른 엄격한 품질기준과 사용시설 관리가 병행되어야 하며, 최근에는 SRF 사용시설 인근 지역의 환경 민원도 주요 관리 이슈로 대두되고 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. SRF의 정의와 종류\n\n### 1. 법적 정의와 근거\nSRF는 「자원의 절약과 재활용촉진에 관한 법률」에 따라 폐기물을 원료로 제조되는 고형연료제품으로 인증받은 것을 말하며, 원료에 따라 다음과 같이 구분된다.\n\n| 구분 | 원료 | 비고 |\n|---|---|---|\n| 생활폐기물계 고형연료제품(SRF) | 생활폐기물 중 가연성분 선별 | 다양한 이물질 혼입 가능성 |\n| 폐목재계 고형연료제품(BIO-SRF) | 폐목재, 농업부산물 등 | 상대적으로 균질하고 청정 |\n\n### 2. 제조공정 개요\n반입 폐기물 → 선별(불연물·재활용품 제거) → 파쇄·건조 → 성형(펠릿·칩 형태) → 품질검사 → 출하\n\n## Ⅲ. 품질기준과 관리체계\n\n### 1. 주요 품질기준(개념, 세부수치는 고시 확인 필요)\n| 항목 | 관리 취지 |\n|---|---|\n| 저위발열량 | 일정 수준 이상 확보(연료로서의 경제성) |\n| 수분·회분 함량 | 낮을수록 연소효율 우수 |\n| 염소(Cl) 함량 | 상한 제한(HCl·다이옥신 생성 억제) |\n| 중금속(수은 등) 함량 | 상한 제한(대기배출 유해성 관리) |\n\n### 2. 품질인증제도\n제조업체는 관련 기관의 품질검사를 거쳐 SRF 품질기준 적합 여부를 인증받아야 하며, 인증받지 못한 저품질 SRF의 유통·사용은 규제 대상이 된다.\n\n## Ⅳ. 사용시설 관리와 환경영향\n\n### 1. 주요 사용처\n| 사용처 | 특징 |\n|---|---|\n| SRF 전용보일러(열병합발전 등) | SRF를 주연료로 사용, 소각시설 수준 방지설비 필요 |\n| 시멘트 소성로 혼소 | 기존 화석연료 일부 대체, 고온(1,400℃ 이상) 소성으로 완전분해 유리 |\n\n### 2. 배출허용기준 적용\nSRF 사용시설은 일반 연소시설이 아닌 폐기물을 원료로 하는 특성상, 통상 소각시설에 준하는 강화된 배출허용기준(HCl, 다이옥신 등 포함)이 적용되는 경우가 많다.\n\n### 3. 환경영향 이슈와 대응\n| 이슈 | 대응방안 |\n|---|---|\n| 염소함량 관리 미흡 | 원료 선별 강화, 정기 품질검사 |\n| 저장·보관 중 비산·화재 | 밀폐저장, 온도모니터링(Day83 저탄장 관리와 유사) |\n| 주민 수용성 | 정보공개, 배출농도 실시간 공개, 주민참여 모니터링 |\n\n시멘트 소성로 혼소의 경우 1,400℃ 이상의 고온과 알칼리성 원료(석회석) 환경으로 인해 산성가스가 자체 흡수되고 다이옥신 재합성 위험도 낮아지는 장점이 있으나, 이 역시 원료 SRF의 품질관리가 전제되어야 한다.\n\n### 4. SRF 저장·보관시설의 관리\nSRF는 유기물 기반의 가연성 물질이므로 대량 저장 시 저탄장(Day83)과 유사하게 자연발화·비산 위험이 있어, 밀폐형 저장사일로 또는 옥내저장시설을 통한 관리가 요구되며 정기적인 온도모니터링이 필요하다.\n\n### 5. 국내외 정책 비교 감각\n유럽 등 선진국에서는 폐기물 에너지화(Waste-to-Energy) 비중이 상대적으로 높게 정착되어 있는 반면, 국내에서는 소각시설·SRF 사용시설에 대한 주민 수용성 확보가 여전히 정책 확대의 주요 과제로 남아있어, 환경성 정보공개와 지역사회 소통이 중요한 정책 수단으로 강조되고 있다.\n\n## Ⅴ. 결론\n\nSRF는 폐기물 처리와 화석연료 대체라는 이중의 정책효과를 갖는 자원순환형 연료이나, 원료의 폐기물 유래 특성상 품질기준 준수와 사용시설의 강화된 방지설비가 필수적으로 병행되어야 한다. 향후에는 품질인증제도의 실효성 강화와 함께, 사용시설 주변 지역의 환경 모니터링 정보공개를 통해 주민 수용성을 확보하는 것이 SRF 확대 정책의 성패를 가르는 핵심 과제가 될 것이다.\n\n| 요약 | 핵심 |\n|---|---|\n| 정의 | 폐기물 유래 고형연료, 품질인증 필요 |\n| 관리 초점 | 염소·중금속 함량, 사용시설 방지설비 |\n| 주요 사용처 | SRF 전용보일러, 시멘트소성로 혼소 |\n\n결국 SRF 정책의 성공 여부는 품질관리 체계의 신뢰성과 사용시설의 환경관리 수준에 달려 있으며, 이 두 축이 함께 갖춰질 때 비로소 폐기물 감량과 에너지 회수라는 정책 목표가 주민 수용성과 함께 달성될 수 있다. 대기관리기술사로서는 SRF 사용시설의 인허가·환경영향평가 실무에서 이러한 이중적 성격을 균형 있게 반영한 저감계획을 제시할 수 있어야 한다. 이는 폐기물 정책과 대기환경 정책이 만나는 대표적인 접점 분야로서, 앞으로도 학습 비중을 지속적으로 유지해야 할 주제다. 향후 순환경제 정책이 확대될수록 SRF를 포함한 폐기물 에너지화 시설의 수와 규모는 늘어날 전망이므로, 관련 환경관리 기준과 기술 동향을 지속적으로 업데이트하는 자세가 필요하다.\n","side":[{"title":"SRF와 일반 폐기물 소각의 비교","body":"### 비교표\n| 구분 | SRF 사용시설 | 일반 소각시설 |\n|---|---|---|\n| 원료 형태 | 가공된 균질 연료(펠릿·칩) | 미가공 혼합폐기물 |\n| 발열량 안정성 | 상대적으로 균일 | 편차 큼(클링커 위험, Day86 연계) |\n| 연소관리 용이성 | 상대적으로 용이 | 상대적으로 어려움 |\n| 목적 | 에너지 회수(연료 대체) | 폐기물 감량·처리 우선 |\n\nSRF는 원료를 사전 가공·품질관리함으로써 소각시설의 고질적 문제인 발열량 편차와 클링커 발생 위험을 줄이는 효과가 있으나, 원료 자체의 오염물질 함량 관리가 선행되지 않으면 오히려 통제되지 않은 오염원이 될 수 있다는 양면성이 있다.\n\n### 폐기물 처리 우선순위와 SRF의 위치\n폐기물 관리의 일반 원칙(발생억제→재사용→재활용→에너지화→최종처분)에서 SRF를 통한 에너지화는 재활용이 불가능한 가연성 잔재물을 최종처분(매립) 이전 단계에서 자원으로 활용한다는 점에서 폐기물 위계상 매립보다 선호되는 처리방식으로 자리매김하고 있다.\n\n### 시멘트 소성로 혼소의 환경적 장점\n시멘트 소성로는 1,400℃ 이상의 고온·장체류시간 조건을 이미 갖추고 있어 별도의 소각시설 신설 없이 폐기물 에너지화가 가능하다는 점에서 자원순환 정책상 중요하게 활용되며, 이는 기존 산업공정을 활용한 폐기물 처리라는 점에서 순환경제의 대표 사례로 꼽힌다.\n\n### SRF vs 일반연료 발열량 비교 감각\n| 연료 | 저위발열량(개략) |\n|---|---|\n| 생활폐기물계 SRF | 약 3,000~4,500 kcal/kg |\n| 폐목재계(BIO-SRF) | 약 3,500~4,500 kcal/kg |\n| 유연탄(참고) | 약 5,500~6,500 kcal/kg |\n\nSRF는 화석연료 대비 발열량이 낮은 편이므로 동일 열량을 얻기 위해서는 더 많은 물량이 필요하며, 이는 저장·운송 부담과 방지설비 처리 용량 산정에 함께 고려되어야 하는 실무적 요소다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. SRF(고형연료제품)의 정의와 품질기준을 설명하시오. *(114~138회 다수 10~25점)*\n2. SRF 사용시설의 배출허용기준과 환경관리방안을 설명하시오. *(120회 25점)*\n3. 시멘트 소성로 혼소가 갖는 환경적 장점을 설명하시오. *(126회 10점)*\n4. SRF와 일반 소각시설의 차이를 비교 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nSRF 문제는 \"자원순환(장점)\"과 \"환경관리 필요성(품질관리)\"이라는 양면을 균형 있게 서술해야 하며, 한쪽만 강조하면 편향된 답안으로 평가될 수 있다. 결론에서 품질인증제도와 주민 수용성 문제를 함께 언급하면 완성도가 높아진다.\n\n### 2단계 마무리 메모\nDay 85~87(소각·클링커·SRF)로 2단계(가스상·연소·측정) 학습이 사실상 마무리된다. 다음 3단계는 유해대기오염물질·특정물질(다이옥신 심화, 중금속 등)로 이어지며, 이번 Day의 SRF 염소·다이옥신 이슈가 자연스럽게 연결된다.\n\n### 암기 카드 5선\n1. **SRF** = 폐기물 유래 고형연료, 「자원재활용법」근거\n2. **품질기준** = 발열량 하한, 염소·중금속 상한\n3. **생활폐기물계 vs 폐목재계(BIO-SRF)** = 균질성 차이\n4. **주요 사용처** = 전용보일러, 시멘트소성로 혼소(1,400℃↑)\n5. **정책 이중성** = 자원순환 장점 + 품질관리·수용성 과제"}]},"88":{"day":88,"date":"2026-10-27","title":"바이오가스화와 열분해·가스화","keywords":[{"k":"바이오가스화","subs":["혐기성소화(무산소 미생물 분해)","메탄(CH4) 55~65%+CO2 생성","유기성폐기물·가축분뇨·하수슬러지"]},{"k":"열분해(Pyrolysis)","subs":["무산소·저산소 열분해(400~800℃)","촤(Char)·타르·가스 생성","소각 대비 배가스량 저감"]},{"k":"가스화(Gasification)","subs":["부분산화(공기비<1) 고온반응","합성가스(Syngas, CO+H2)","가스엔진·터빈 연료화"]},{"k":"공통 장단점","subs":["소각 대비 저NOx·저다이옥신 잠재력","전처리(선별·건조) 부담","생성가스 정제 필요(타르·황화합물)"]},{"k":"정책·활용","subs":["폐기물 에너지화 정책 연계","바이오가스 정제 후 도시가스 병입","가스화발전 실증 확대"]}],"answer":"# 바이오가스화와 열분해·가스화\n\n## Ⅰ. 개요\n\n바이오가스화·열분해·가스화는 폐기물이나 유기성 자원을 직접 소각하지 않고 화학적·생물학적으로 전환하여 연료가스나 에너지를 회수하는 폐기물 에너지화 기술로, 소각 대비 배가스량이 적고 다이옥신·NOx 생성 잠재력이 낮다는 점에서 최근 정책적으로 주목받고 있다. 세 기술은 산소 공급조건(무산소~부분산화~완전산화)에 따라 구분되며, 각각 생성물의 형태(메탄가스, 촤·타르, 합성가스)와 적용 대상이 상이하다. *(114~138회 다수 10점 기출)*\n\n## Ⅱ. 개별 기술의 원리\n\n### 1. 바이오가스화(혐기성소화)\n산소가 없는 조건에서 혐기성 미생물이 유기물을 분해하여 메탄(CH₄)과 이산화탄소(CO₂)를 주성분으로 하는 바이오가스를 생성하는 생물학적 공정이다. 하수슬러지, 가축분뇨, 음식물류폐기물 등 수분 함량이 높은 유기성 폐기물에 적합하다.\n\n| 단계 | 반응 |\n|---|---|\n| 가수분해 | 고분자 유기물 → 저분자화 |\n| 산생성 | 저분자물질 → 유기산 |\n| 메탄생성 | 유기산 → CH₄ + CO₂ |\n\n### 2. 열분해(Pyrolysis)\n산소를 차단하거나 극히 제한한 상태(무산소~저산소)에서 폐기물을 400~800℃로 가열하여 고체(촤, Char)·액체(타르)·기체(열분해가스)로 분해하는 열화학적 공정이다.\n\n### 3. 가스화(Gasification)\n이론공기량보다 적은 공기(공기비 m<1, 부분산화)를 공급하여 고온(800~1,200℃)에서 반응시켜 CO와 H₂를 주성분으로 하는 합성가스(Syngas)를 생성하는 공정으로, 열분해보다 높은 온도와 제한된 산소 공급이 특징이다.\n\n## Ⅲ. 세 기술의 비교\n\n| 구분 | 바이오가스화 | 열분해 | 가스화 |\n|---|---|---|---|\n| 처리방식 | 생물학적(혐기성소화) | 열화학적(무산소) | 열화학적(부분산화) |\n| 온도 | 상온~중온(35~55℃) | 400~800℃ | 800~1,200℃ |\n| 주생성물 | CH₄+CO₂(바이오가스) | 촤+타르+가스 | 합성가스(CO+H₂) |\n| 적용 대상 | 고수분 유기성폐기물 | 플라스틱·폐목재 등 | 다양한 가연성폐기물 |\n| 배가스 발생량 | 매우 적음(밀폐 소화조) | 소각 대비 적음 | 소각 대비 적음 |\n\n## Ⅳ. 환경적 장단점과 관리방안\n\n### 1. 소각 대비 장점\n연소가 아닌 열분해·가스화 방식은 산소 공급이 제한되어 있어 NOx 생성이 억제되고, 다이옥신 생성의 전제조건인 산화적 고온 연소환경이 형성되지 않아 다이옥신 발생 잠재력이 상대적으로 낮은 것으로 평가된다.\n\n### 2. 실무상 문제점\n| 문제 | 내용 |\n|---|---|\n| 전처리 부담 | 폐기물 선별·파쇄·건조 등 사전처리 공정 필요 |\n| 생성가스 정제 | 타르·황화합물·먼지 등 불순물 제거 후 활용 가능 |\n| 촤·잔재물 처리 | 열분해 후 고체 잔재물(촤)의 별도 처리 필요 |\n| 경제성 | 소각 대비 초기투자비·운영 복잡도가 높은 편 |\n\n### 3. 활용 및 관리방안\n| 방안 | 내용 |\n|---|---|\n| 바이오가스 정제·활용 | 황화수소·수분 제거 후 발전연료 또는 도시가스 병입 |\n| 합성가스 활용 | 가스엔진·가스터빈 연료로 전력 생산 |\n| 잔재물 자원화 | 촤를 토양개량제·활성탄 원료로 활용 검토 |\n| 후단 방지설비 | 생성가스 연소 시에도 최종 연소단계에서 방지설비 병행 필요 |\n\n### 4. 가스화 발전 실증과 정책 동향\n가스화를 통해 얻은 합성가스는 가스엔진이나 가스터빈에서 전력을 생산하는 가스화발전(IGCC 유사 개념의 소규모 적용)으로 실증되고 있으며, 이는 폐기물 처리와 전력 생산을 동시에 달성하는 자원순환형 발전기술로 정책적 지원이 확대되고 있다.\n\n### 5. 열분해·가스화와 소각의 공정 배치 비교\n| 구분 | 배치 특징 |\n|---|---|\n| 일반 소각 | 단일 공정에서 완전산화+열회수 |\n| 열분해+2차연소 | 열분해 후 발생가스를 별도 연소실에서 완전산화 |\n| 가스화+가스엔진 | 합성가스 정제 후 별도 발전설비에서 연소 |\n\n이처럼 열분해·가스화는 \"분해\"와 \"최종 에너지 전환\"이 공정상 분리되어 있어, 각 단계별로 오염물질 관리 지점이 다르다는 점이 일반 소각과의 근본적 차이다.\n\n## Ⅴ. 결론\n\n바이오가스화·열분해·가스화는 산소 공급조건에 따라 구분되는 폐기물 에너지화 기술로, 소각 대비 오염물질 저감 잠재력을 가지면서도 전처리·정제 부담이라는 실무적 과제를 안고 있다. 향후 순환경제 정책 확대에 따라 이들 기술의 적용이 늘어날 것으로 전망되므로, 대기관리기술사는 생성가스 활용단계까지 포함한 전과정 환경관리 관점에서 이들 기술을 이해할 필요가 있다.\n\n| 요약 | 산소조건 | 주생성물 |\n|---|---|---|\n| 바이오가스화 | 무산소(생물학적) | CH₄+CO₂ |\n| 열분해 | 무산소~저산소(열화학) | 촤+타르+가스 |\n| 가스화 | 부분산화(m<1) | CO+H₂(Syngas) |\n\n대기관리기술사 실무에서는 이들 기술을 검토할 때 생성가스의 최종 연소·활용 단계까지 포함한 전과정 배출영향을 함께 평가해야 하며, 단순히 \"친환경 기술\"로 단정하기보다 정제·활용 설비의 관리수준에 따라 실제 환경성과가 달라진다는 균형 잡힌 관점이 필요하다. 이는 환경영향평가서 작성 시 저감방안의 실효성을 뒷받침하는 핵심 논리이기도 하다.\n","side":[{"title":"바이오가스 정제와 발전 활용 흐름도","body":"### 바이오가스 활용 공정\n```\n혐기성소화조(바이오가스 생성, CH4 55~65%)\n   ↓\n탈황(H2S 제거, 활성탄 또는 생물탈황)\n   ↓\n탈수(수분 제거)\n   ↓\n용도 분기\n   ├─ 가스엔진 발전(열병합)\n   └─ 고순도 정제(CO2 분리) → 도시가스 배관 병입 또는 차량연료\n```\n\n### 소화조 운영 핵심 인자\n| 인자 | 관리 포인트 |\n|---|---|\n| 온도 | 중온소화(35℃ 내외) 또는 고온소화(55℃ 내외) 일정 유지 |\n| 체류시간 | 통상 20~30일(중온 기준) |\n| pH | 6.8~7.2 유지(산생성-메탄생성 균형) |\n| C/N비 | 적정비율 유지로 암모니아 저해 방지 |\n\n### 바이오가스 열량 감각\n바이오가스는 메탄함량에 따라 저위발열량이 약 4,500~5,500 kcal/Nm³ 수준으로, LNG 대비 낮으나 정제(CO2 분리) 후에는 도시가스에 준하는 열량 확보가 가능하다.\n\n### 열분해·가스화 생성가스 정제 항목\n| 불순물 | 제거방법 |\n|---|---|\n| 타르(Tar) | 세정탑, 촉매분해 |\n| 황화합물(H2S 등) | 흡수·흡착 |\n| 먼지(Particulate) | 사이클론+집진 |\n| 할로겐화합물 | 알칼리 세정 |\n\n생성가스를 가스엔진 등 정밀기계에 사용하기 위해서는 이러한 불순물 제거가 필수적이며, 정제수준이 낮으면 엔진 손상이나 촉매 피독으로 이어질 수 있어 정제공정의 신뢰성이 사업 경제성을 좌우하는 핵심 요소다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 바이오가스화(혐기성소화)의 원리와 활용방안을 설명하시오. *(다수 회차 10점)*\n2. 열분해와 가스화의 차이를 산소공급조건 관점에서 비교 설명하시오. *(120회 10점)*\n3. 폐기물 에너지화 기술이 소각 대비 갖는 환경적 장점을 설명하시오. *(126회 10점)*\n4. 가스화에서 생성되는 합성가스(Syngas)의 활용방안을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n세 기술의 차이는 \"산소 공급조건\"이라는 하나의 축으로 정리하면 명확해진다(무산소=바이오가스화·열분해, 부분산화=가스화, 완전산화=일반소각). 이 축을 답안 서두에 제시하면 채점자가 논리를 빠르게 파악할 수 있다.\n\n### 다음 학습 연계\nDay 89~90(다이옥신 생성기작·TEQ)에서 이번 Day의 \"소각 대비 다이옥신 저감 잠재력\" 논리를 심화 학습하므로, 두 Day를 연결하여 이해하면 좋다. 아울러 Day 87(SRF)에서 다룬 폐기물 에너지화 정책과도 함께 묶어 이해하면 3단계 학습 전체의 흐름이 자연스럽게 연결된다.\n\n### 암기 카드 5선\n1. **바이오가스화** = 혐기성소화, CH4 55~65%+CO2\n2. **열분해** = 무산소 400~800℃, 촤+타르+가스\n3. **가스화** = 부분산화(m<1) 800~1,200℃, Syngas(CO+H2)\n4. **소각 대비 장점** = 저NOx·저다이옥신 잠재력(제한된 산소)\n5. **공통 과제** = 전처리+생성가스 정제 부담"}]},"89":{"day":89,"date":"2026-10-28","title":"다이옥신 생성기작과 De Novo 합성","keywords":[{"k":"다이옥신류 정의","subs":["PCDD(75종)+PCDF(135종)","염소원자 위치·개수로 이성질체 구분","2,3,7,8-TCDD 최고독성"]},{"k":"생성기작 3경로","subs":["전구물질경로(PCP·PCB 등 잔류 전구체)","De Novo 합성(탄소+염소+촉매)","미연소·불완전연소 고분자 재조합"]},{"k":"De Novo 합성 조건","subs":["300~450℃ 저온영역","비산재 중 구리 등 금속촉매","산소 존재+체류시간"]},{"k":"생성 억제 요인","subs":["3T 조건 확보(1차 방어)","급속냉각(2차 방어)","염소함유 원료 관리"]},{"k":"관련 배출원","subs":["소각시설·제철소 소결로","화재·비정상연소","펄프표백·농약제조 과거이력"]}],"answer":"# 다이옥신 생성기작과 De Novo 합성\n\n## Ⅰ. 개요\n\n다이옥신류는 폴리염화디벤조다이옥신(PCDD, 75종)과 폴리염화디벤조퓨란(PCDF, 135종)을 총칭하는 유기염소화합물로, 염소 치환 위치와 개수에 따라 210종의 이성질체가 존재하며 이 중 2,3,7,8-TCDD가 가장 높은 독성을 가진 것으로 알려져 있다. 다이옥신은 연소과정에서 크게 두 가지 경로, 즉 원료 중 잔류하는 전구물질이 그대로 반응하는 경로와 소각 후 저온영역에서 재합성되는 De Novo 합성 경로를 통해 생성되며, 특히 De Novo 합성은 소각시설 관리에서 가장 중요하게 다뤄지는 생성기작이다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 다이옥신류의 구조와 특성\n\n### 1. 구조적 특징\n| 구분 | 내용 |\n|---|---|\n| PCDD | 폴리염화디벤조파라다이옥신, 75종 이성질체 |\n| PCDF | 폴리염화디벤조퓨란, 135종 이성질체 |\n| 최고독성 이성질체 | 2,3,7,8-TCDD (사염화 이성질체) |\n\n### 2. 독성 특성\n다이옥신류는 지용성이 커서 생물체 내 축적성이 높고, 반감기가 길어 환경 중 잔류성이 크며, 발암성·생식독성·내분비계 교란 작용이 알려져 있어 특정대기유해물질로 엄격히 관리된다.\n\n## Ⅲ. 생성기작 3경로\n\n### 1. 전구물질경로(De Novo 이전 단계 개념)\n원료 폐기물 중 이미 존재하는 다이옥신 유사 전구물질(PCP, PCB, 염소화페놀류 등)이 연소 중 완전히 분해되지 못하고 다이옥신으로 전환되는 경로다.\n\n### 2. 미연소 유기물의 고온 재조합\n불완전연소로 생성된 미연 탄화수소(방향족 고리 화합물)가 염소와 반응하여 다이옥신 골격을 형성하는 경로로, 3T 조건 미흡 시 발생이 증가한다.\n\n### 3. De Novo 합성(가장 중요한 경로)\n| 항목 | 내용 |\n|---|---|\n| 발생 온도구간 | **300~450℃** |\n| 반응 장소 | 집진기 등 후단 설비의 비산재 표면 |\n| 촉매 역할 | 비산재 중 구리(Cu) 등 전이금속이 촉매 작용 |\n| 탄소원 | 비산재에 부착된 미연탄소분 |\n| 필요조건 | 산소 존재, 충분한 체류시간(수 초~수 분) |\n\nDe Novo 합성은 연소실에서 다이옥신이 완전히 파괴되었더라도, 후단 냉각과정에서 비산재 표면의 잔류탄소와 염소가 금속촉매의 작용으로 저온 재합성되는 현상으로, 소각시설 다이옥신 관리의 핵심 대상이다.\n\n## Ⅳ. 생성 억제 방안과 관리 체계\n\n### 1. 단계별 억제 전략\n| 단계 | 억제방안 | 대응 원리 |\n|---|---|---|\n| 1차(생성억제) | 3T 조건 확보(Day81 연계) | 완전연소로 전구물질·미연분 최소화 |\n| 2차(재합성억제) | 급속냉각(Quenching) | 300~450℃ 구간을 1초 이내 급속 통과 |\n| 3차(후단제거) | 활성탄분사+백필터 | 잔류 다이옥신 흡착 포집 |\n\n### 2. 원료관리 측면의 억제\n염소 함유 폐기물(PVC 등)의 반입량을 관리하고 균질 혼합 투입하여 국소적 염소 농도 편중을 방지하는 것도 보조적 억제수단이다.\n\n### 3. De Novo 합성 관련 설비관리 포인트\n| 관리포인트 | 내용 |\n|---|---|\n| 급속냉각설비 성능 | 통과시간을 최대한 단축하도록 설계·운전 |\n| 집진기 온도관리 | 200℃ 이하로 유지하여 재합성 속도 저감 |\n| 촉매금속 저감 | 비산재 중 구리 등 함량이 높은 원료의 사전 선별 |\n\n### 4. 다이옥신 생성 3경로의 상대적 기여도\n실무적으로는 De Novo 합성이 소각시설 다이옥신 발생량의 가장 큰 비중을 차지하는 것으로 알려져 있어, 방지설비 설계 시 급속냉각설비에 우선적인 투자가 이루어지는 경향이 있다. 다만 전구물질경로와 미연소 재조합도 무시할 수 없는 기여를 하므로, 3T 조건 확보라는 1차 방어선도 소홀히 할 수 없다.\n\n### 5. 다른 배출원과의 연계\n다이옥신은 소각시설뿐 아니라 제철소 소결로, 비정상적인 폐기물 소각(불법소각), 화재 등에서도 발생할 수 있어, 소각시설 관리에 국한되지 않는 광범위한 배출원 관리가 필요하다는 점도 답안에서 언급할 가치가 있다.\n\n## Ⅴ. 결론\n\n다이옥신은 전구물질경로, 미연소 재조합, De Novo 합성이라는 세 경로를 통해 생성되며, 이 중 300~450℃ 저온영역에서 금속촉매의 작용으로 일어나는 De Novo 합성이 소각시설 관리의 핵심 대상이다. 생성억제(3T)-재합성억제(급속냉각)-후단제거(흡착)의 3단계 방어체계는 이러한 생성기작에 정확히 대응하는 관리전략으로, 각 단계가 서로 다른 생성경로를 차단한다는 점을 이해하는 것이 다이옥신 관리의 핵심이다.\n\n| 요약 | 대응 방어단계 |\n|---|---|\n| 전구물질·미연소 재조합 | 3T 조건(1차) |\n| De Novo 합성(300~450℃) | 급속냉각(2차) |\n| 잔류 다이옥신 | 활성탄+백필터(3차) |\n\n다이옥신 관리는 어느 한 단계의 대책만으로는 완전한 저감이 어려우며, 세 단계가 유기적으로 결합될 때 비로소 배출허용기준을 안정적으로 만족할 수 있다는 점이 소각시설 환경관리의 핵심 원칙이다. 이러한 다단계 방어 개념은 다이옥신뿐 아니라 수은 등 다른 미량 유해물질 관리에도 동일하게 적용되는 일반원칙으로 확장하여 이해할 수 있다.\n","side":[{"title":"De Novo 합성 반응 메커니즘 상세","body":"### 반응 단계(개념)\n```\n비산재 표면 미연탄소분 + Cu(촉매) 존재\n   ↓\n300~450℃ 구간에서 탄소구조 산화적 분해\n   ↓\n염소화 반응(비산재 중 염소성분과 결합)\n   ↓\n방향족 고리 형성 및 염소치환\n   ↓\nPCDD/PCDF 생성\n```\n\n### 온도별 다이옥신 생성속도 경향\n| 온도구간 | 생성 경향 |\n|---|---|\n| 450℃ 이상 | 생성속도 급감(열분해 우세) |\n| 300~450℃ | 최대 생성구간(De Novo 최적조건) |\n| 300℃ 이하 | 반응속도 저하로 생성 미미 |\n\n이러한 온도 의존성 때문에 급속냉각설비는 정확히 이 구간을 최대한 빠르게 통과시키는 것이 설계 목표이며, 단순히 전체적으로 온도를 낮추는 것이 아니라 \"구간 통과시간\"을 최소화하는 것이 핵심임을 이해해야 한다.\n\n### 급속냉각설비 방식 비교\n| 방식 | 원리 | 특징 |\n|---|---|---|\n| 수분무 냉각 | 물을 직접 분무하여 증발잠열로 급냉 | 가장 일반적, 통과시간 단축 효과 큼 |\n| 공기 희석 냉각 | 다량의 신선공기로 희석 냉각 | 배가스량 증가, 후단설비 부담 증가 |\n| 열교환 냉각 | 열교환기를 통한 간접 냉각 | 폐열회수 가능하나 통과시간 상대적으로 김 |\n\n수분무 방식이 통과시간 단축에 가장 효과적이어서 소각시설에서 표준적으로 채택되는 경향이 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 다이옥신의 생성기작 3가지를 설명하시오. *(114~138회 다수 25점)*\n2. De Novo 합성의 조건과 억제방안을 설명하시오. *(다수 회차 25점)*\n3. 다이옥신 생성 억제를 위한 3단계 관리전략을 설명하시오. *(120회 25점)*\n4. 소각시설 비산재 중 금속촉매가 다이옥신 생성에 미치는 영향을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nDe Novo 합성 문제는 \"왜 300~450℃인가\", \"왜 급속냉각이 효과적인가\"를 반응 메커니즘과 연결지어 서술해야 고득점이 가능하다. 단순히 온도수치만 암기하지 말고 \"저온에서 촉매 작용으로 재합성\"이라는 인과관계를 반드시 포함해야 한다.\n\n### 다음 학습 연계\nDay 90(다이옥신 제거기술과 TEQ)에서 이번 Day의 생성기작을 전제로 후단 제거기술과 독성평가 지표를 학습하므로 연속 학습을 권장한다.\n\n### 암기 카드 5선\n1. **PCDD/PCDF** = 75종+135종, 총 210종 이성질체\n2. **최고독성** = 2,3,7,8-TCDD\n3. **De Novo 합성** = 300~450℃, 비산재+Cu촉매+미연탄소\n4. **3단계 방어** = 3T(생성억제)+급냉(재합성억제)+흡착(후단제거)\n5. **급속냉각** = 통과시간 최소화가 핵심(단순 저온화 아님)"}]},"90":{"day":90,"date":"2026-10-29","title":"다이옥신 제거기술과 TEQ","keywords":[{"k":"활성탄분사(ACI)","subs":["분말활성탄 배가스 내 분사","다이옥신·수은 동시 흡착","백필터에서 흡착물 포집"]},{"k":"촉매분해(SCR 겸용)","subs":["V2O5-TiO2 촉매 다이옥신 분해 겸용","NOx 저감과 동시 처리","저온형 촉매 개발 동향"]},{"k":"TEQ 개념","subs":["독성등가환산량(Toxic Equivalency)","이성질체별 독성등가계수(TEF) 곱셈합산","2,3,7,8-TCDD 기준 TEF=1"]},{"k":"배출허용기준","subs":["ng-TEQ/Sm³ 단위 표기","소각시설 규모별 차등기준","표준산소농도 보정 병행"]},{"k":"측정·관리","subs":["정기 시료채취(연 1~4회)","고분해능 GC/MS 분석","연속측정 대체지표(CO) 병행"]}],"answer":"# 다이옥신 제거기술과 TEQ\n\n## Ⅰ. 개요\n\n다이옥신은 생성 이후에도 활성탄분사·촉매분해 등 후단 방지설비를 통해 효과적으로 제거할 수 있으며, 210종에 이르는 이성질체의 독성 차이를 반영하기 위해 국제적으로 통용되는 독성등가환산량(TEQ, Toxic Equivalency Quantity) 개념을 이용해 단일 지표로 관리한다. Day 89에서 학습한 생성기작(3T·급속냉각)이 예방적 관리라면, 이번 Day는 이미 생성된 다이옥신을 최종적으로 제거하고 그 독성을 정량적으로 평가·관리하는 사후적 관리체계에 해당한다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 다이옥신 제거기술\n\n### 1. 활성탄분사(ACI, Activated Carbon Injection)\n분말활성탄을 배가스 유로에 분사하여 다이옥신·중금속(특히 수은)을 흡착시킨 후, 후단 백필터에서 활성탄과 함께 포집하는 방식으로, 소각시설의 표준적인 다이옥신 제거기술이다.\n\n| 인자 | 설계 고려사항 |\n|---|---|\n| 분사농도 | 배가스 유량 대비 적정 주입률 확보 |\n| 접촉시간 | 활성탄-배가스 충분한 접촉시간 확보 |\n| 백필터 여과속도 | 활성탄 포집 효율에 직접 영향 |\n\n### 2. 촉매분해(SCR 겸용형)\nV₂O₅-TiO₂ 계열 촉매는 NOx 환원반응(Day59 연계)과 함께 다이옥신을 분해하는 촉매작용도 겸비하고 있어, SCR 설비가 NOx 저감과 다이옥신 분해를 동시에 수행하는 겸용형으로 설계되기도 한다.\n\n### 3. 기타 보조기술\n| 기술 | 원리 |\n|---|---|\n| 저온촉매 개발 | 기존보다 낮은 온도에서 작동하는 촉매로 에너지 절감 |\n| 습식세정 병행 | 산성가스 처리와 함께 일부 다이옥신 흡수 효과 |\n\n## Ⅲ. TEQ(독성등가환산량) 개념\n\n### 1. TEF(독성등가계수)\n210종의 다이옥신·퓨란 이성질체는 독성 강도가 각기 다르므로, 가장 강한 독성을 가진 2,3,7,8-TCDD의 독성을 1로 기준(TEF=1)삼아 나머지 이성질체의 상대적 독성을 계수화한 것이 TEF(Toxic Equivalency Factor)다.\n\n### 2. TEQ 산정식\n**TEQ = Σ(Ci × TEFi)**\n\n여기서 Ci는 개별 이성질체의 농도, TEFi는 해당 이성질체의 독성등가계수이며, 이를 모든 이성질체에 대해 합산한 값이 시료의 종합적 독성을 나타내는 TEQ다.\n\n### 3. 배출허용기준 표기\n다이옥신 배출허용기준은 통상 **ng-TEQ/Sm³** 단위로 표기되며, 이는 단순 총량 농도가 아닌 독성으로 환산된 등가농도임에 유의해야 한다. 표준산소농도 보정(Day80 연계)도 함께 적용된다.\n\n## Ⅳ. 측정·관리체계\n\n### 1. 측정방법\n다이옥신은 연속측정이 기술적으로 어려워 정기적인 시료채취(연 1~4회, 시설 규모·종류별 상이) 후 고분해능 GC/MS(가스크로마토그래프-질량분석기)로 이성질체별 정밀분석을 실시한다.\n\n### 2. 대체 관리지표\n| 지표 | 활용 |\n|---|---|\n| CO 농도(연속측정) | 불완전연소 상태 간접 지표, De Novo 조건 추정 |\n| 소각로 온도·체류시간 | 3T 조건 실시간 확인 |\n\n### 3. 관리상 유의사항\n| 유의사항 | 내용 |\n|---|---|\n| 시료채취 대표성 | 정상 가동조건(정격부하)에서 측정 필요 |\n| 이성질체 누락 방지 | 210종 전체 분석 절차 준수 |\n| 비교기준 일치 | TEQ 산정 시 사용 TEF 체계(WHO 등) 통일 확인 |\n\n### 4. 국제 TEF 체계와 국내 적용\nTEF 값은 WHO 등 국제기구가 주기적으로 재평가하여 갱신하며(예: WHO-1998, WHO-2005 체계 등), 국내 배출허용기준 및 측정방법도 이러한 국제 체계를 준용하는 경우가 많으므로, 실무에서는 최신 TEF 개정판을 확인하는 것이 중요하다.\n\n### 5. 종합 방지설비에서 다이옥신 제거의 위치\n활성탄분사는 통상 백필터 직전 단계에 배치되어, 반건식반응탑(HCl·SOx 제거)을 거친 배가스에 활성탄을 분사한 뒤 백필터에서 흡착물질과 먼지를 동시에 포집하는 구조로 설계되며, 이는 Day 85에서 학습한 소각시설 표준 방지설비 배치와 정확히 일치한다.\n\n## Ⅴ. 결론\n\n다이옥신은 활성탄분사와 촉매분해를 통해 후단에서 효과적으로 제거될 수 있으며, 210종 이성질체의 독성 차이는 TEF를 이용한 TEQ 환산을 통해 단일 지표로 통합 관리된다. Day 89의 생성기작 이해와 이번 Day의 제거기술·TEQ 개념을 결합하면 다이옥신 관리의 전체 그림(생성억제-재합성억제-후단제거-독성평가)이 완성되며, 이는 소각시설 종합관리 문제의 핵심 축이다.\n\n| 요약 | 핵심 |\n|---|---|\n| 제거기술 | 활성탄분사(ACI), 촉매분해(SCR 겸용) |\n| TEQ | Σ(Ci×TEFi), 2,3,7,8-TCDD 기준 TEF=1 |\n| 기준표기 | ng-TEQ/Sm³ |\n\n이러한 제거기술과 평가지표의 결합은 다이옥신 관리를 \"생성 억제\"에서 \"정량적 리스크 관리\"로 확장시키는 것으로, 대기관리기술사가 소각시설 인허가·환경영향평가 실무에서 반드시 숙지해야 할 핵심 체계다.\n","side":[{"title":"TEQ 계산 예제","body":"### 계산 예제\n어떤 소각시설 배가스 시료에서 2,3,7,8-TCDD 농도가 0.01 ng/Sm³(TEF=1), 1,2,3,7,8-PeCDD 농도가 0.02 ng/Sm³(TEF=0.5)로 측정되었다면(단순화한 2개 이성질체 예시):\n\nTEQ = (0.01×1) + (0.02×0.5) = 0.01 + 0.01 = **0.02 ng-TEQ/Sm³**\n\n실제로는 210종 전체 이성질체에 대해 이 계산을 반복하여 합산하므로, 답안에서는 계산 원리(농도×TEF의 총합)를 정확히 제시하는 것이 핵심이며, 모든 이성질체를 나열할 필요는 없다.\n\n### 배출허용기준 초과 여부 판정 예제\n위 계산 결과 TEQ가 0.02 ng-TEQ/Sm³이고 해당 시설의 배출허용기준이 0.1 ng-TEQ/Sm³라면, 기준 대비 20% 수준으로 적합 판정되며, 이처럼 TEQ 산정 이후에는 반드시 해당 시설의 배출허용기준과 비교하여 적합 여부를 서술하는 것이 계산형 답안의 완결된 마무리다.\n\n### 활성탄분사 설계 감각\n| 항목 | 설계 감각 |\n|---|---|\n| 활성탄 주입률 | 배가스 유량 대비 적정 비율(현장 시험으로 최적화) |\n| 백필터 여과속도 | 낮을수록 접촉시간 확보에 유리 |\n| 다이옥신+수은 동시제거 | 동일 활성탄으로 두 물질 모두 흡착 가능 |\n\n활성탄분사는 다이옥신뿐 아니라 수은(Hg) 저감에도 동시에 효과적이라는 점에서, 소각시설과 석탄화력(Day82) 모두에서 공통적으로 활용되는 기술이라는 것을 기억해두면 종합문제 대응에 유리하다.\n\n### 촉매분해 겸용 SCR의 설계상 고려사항\n다이옥신 분해까지 겸하는 SCR 촉매는 일반 SCR보다 촉매층 두께나 체류시간을 다소 여유있게 설계하는 경우가 많으며, 촉매 표면적을 넓혀 다이옥신 분자와의 접촉기회를 늘리는 것이 분해효율 향상의 핵심 설계 포인트다.\n\n### GC/MS 분석 절차 개념\n시료채취(등속흡입, Day103 연계) → 추출·정제(방해물질 제거) → 고분해능 GC로 이성질체 분리 → MS로 정성·정량 분석 → 이성질체별 TEF 적용 TEQ 산출의 순서로 진행되며, 전체 분석에 수 주가 소요될 수 있어 실시간 관리에는 한계가 있다는 점이 다이옥신 관리의 실무적 어려움이다.\n\n### 정기측정 결과 활용\n정기측정에서 기준 초과가 확인되면 해당 기간의 운전기록(온도·CO농도 등)을 소급 분석하여 원인(3T 미흡, 급속냉각 이상 등)을 규명하고, 재발방지를 위한 운전관리 개선방안을 수립하는 것이 후속 절차다. 이러한 소급분석이 가능하려면 평상시 운전데이터를 충실히 기록·보관하는 것이 전제되어야 하며, 다수 소각시설은 운전기록 보관기간을 법령상 최소 요구기간보다 길게 자체 설정하여 문제 발생 시 원인규명 능력을 높이고 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 다이옥신 제거기술(활성탄분사 등)을 설명하시오. *(114~138회 다수 25점)*\n2. TEQ와 TEF의 개념을 설명하고 계산 예제를 제시하시오. *(다수 회차 25점)*\n3. 다이옥신 배출허용기준의 표기방식과 의미를 설명하시오. *(120회 10점)*\n4. 다이옥신 측정방법과 CO 농도를 이용한 대체 관리방안을 설명하시오. *(최근 10점)*\n5. TEF 체계의 국제적 개정 배경과 국내 적용 현황을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\nTEQ 계산문제는 Σ(Ci×TEFi) 산정식을 반드시 제시한 뒤 간단한 예제로 검증하는 방식으로 답안을 구성해야 하며, \"왜 단순 총량이 아닌 TEQ로 관리하는가\"(이성질체별 독성차이 반영)를 함께 설명하면 완성도가 높아진다.\n\n### 2단계 다이옥신 파트 총정리\nDay 85(소각 방지설비)-89(생성기작)-90(제거·TEQ)의 3개 Day가 다이옥신이라는 하나의 주제로 연결되어 있으므로, 세 Day를 묶어 하나의 스토리로 복습하는 것이 효율적이다.\n\n### 암기 카드 5선\n1. **ACI** = 활성탄분사, 다이옥신+수은 동시 흡착\n2. **SCR 겸용** = V2O5-TiO2 촉매, NOx저감+다이옥신분해\n3. **TEF** = 2,3,7,8-TCDD 기준(=1), 이성질체별 독성계수\n4. **TEQ = Σ(Ci×TEFi)** = 종합 독성등가값\n5. **기준단위** = ng-TEQ/Sm³, 표준산소농도 보정 병행"}]},"91":{"day":91,"date":"2026-10-30","title":"수은 배출저감과 미나마타협약","keywords":[{"k":"수은 배출특성","subs":["원소상(Hg0)·산화상(Hg2+)·입자상(Hgp)","석탄·폐기물 중 미량 함유","형태별 제거 난이도 상이"]},{"k":"저감기술","subs":["활성탄분사(ACI) 대표기술","브롬화활성탄(산화 촉진)","기존 저감설비 부수효과(SCR·FGD)"]},{"k":"미나마타협약","subs":["2013년 채택, 수은 국제관리협약","제조·수출입·배출 전주기 규제","국내 이행 관련 법령 정비"]},{"k":"국내 관리제도","subs":["특정대기유해물질 지정","배출허용기준(석탄화력·소각시설)","수은 함유폐기물 관리"]},{"k":"측정·모니터링","subs":["정기측정+연속측정 확대 추세","형태별(Speciation) 분석 어려움","저감효율 평가 지표"]}],"answer":"# 수은 배출저감과 미나마타협약\n\n## Ⅰ. 개요\n\n수은은 석탄·폐기물 등 연료 중 미량으로 함유되어 있으나 연소 과정에서 대기 중으로 배출되면 생물농축을 통해 신경계 손상 등 심각한 건강피해를 유발할 수 있는 대표적 유해중금속으로, 국제적으로는 미나마타협약을 통해 전주기 관리가 이루어지고 있다. 대기 중 수은은 배출 형태(원소상·산화상·입자상)에 따라 저감 난이도가 크게 다르며, 이러한 형태별 특성을 이해하는 것이 수은 저감기술 선정의 핵심이다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 수은의 배출 특성과 형태\n\n### 1. 배출 형태 구분\n| 형태 | 특징 | 제거 난이도 |\n|---|---|---|\n| 원소상 수은(Hg⁰) | 휘발성 높음, 수용성 낮음 | 가장 어려움(흡착·흡수 곤란) |\n| 산화상 수은(Hg²⁺) | 수용성 높음 | 습식탈황(FGD)에서 흡수 가능 |\n| 입자상 수은(Hgp) | 먼지에 흡착된 형태 | 집진설비로 제거 용이 |\n\n### 2. 형태별 관리전략\n원소상 수은은 화학적으로 안정하여 일반 집진·흡수설비로 제거가 어려우므로, 산화상으로 전환시킨 후 처리하는 접근이 저감기술의 핵심 원리가 된다.\n\n## Ⅲ. 수은 저감기술\n\n### 1. 활성탄분사(ACI, Day90 연계)\n분말활성탄을 배가스에 분사하여 수은을 흡착시킨 후 집진설비(백필터 등)에서 포집하는 방식으로, 다이옥신 제거와 동시에 적용되는 대표적 기술이다.\n\n### 2. 브롬화활성탄(할로겐 첨着)\n일반 활성탄에 브롬(Br) 등 할로겐을 첨착시키면 원소상 수은을 산화상으로 전환시키는 반응이 촉진되어 흡착효율이 크게 향상된다.\n\n| 활성탄 종류 | 수은 제거 특징 |\n|---|---|\n| 일반 활성탄 | 원소상 수은 흡착 효율 상대적으로 낮음 |\n| 브롬화(할로겐첨착) 활성탄 | 산화 촉진으로 흡착효율 대폭 향상 |\n\n### 3. 기존 저감설비의 부수적 효과\n| 설비 | 수은 저감 기여 |\n|---|---|\n| SCR(탈질) | 촉매 표면에서 원소상 수은의 일부 산화 촉진 |\n| 습식탈황(FGD) | 산화상 수은을 흡수액에서 함께 흡수 |\n| 집진설비(ESP·FF) | 입자상 수은 직접 포집 |\n\n이러한 부수효과 때문에 석탄화력의 표준 저감설비 배치(SCR→집진→FGD, Day82 연계)만으로도 상당한 수은 저감이 이루어지며, 여기에 ACI를 추가하면 저감효율을 더욱 높일 수 있다.\n\n## Ⅳ. 미나마타협약과 국내 관리제도\n\n### 1. 미나마타협약 개요\n2013년 채택된 국제협약으로, 수은의 채굴부터 제조·사용·배출·폐기에 이르는 전주기에 걸쳐 국제적 관리기준을 설정하고 있으며, 협약명은 과거 일본 미나마타에서 발생한 수은 중독 사건(미나마타병)에서 유래한다.\n\n| 규제 대상 | 내용 |\n|---|---|\n| 1차 수은광산 | 신규 개발 금지 |\n| 수은 함유제품 | 단계적 제조·수출입 금지 |\n| 대기배출원 | 석탄화력·소각시설 등 배출관리 |\n| 수은 폐기물 | 환경적으로 건전한 관리 요구 |\n\n### 2. 국내 이행체계\n| 제도 | 내용 |\n|---|---|\n| 특정대기유해물질 지정 | 수은 및 그 화합물 대기오염물질 관리대상 지정 |\n| 배출허용기준 | 석탄화력·소각시설 등 시설별 기준 설정 |\n| 관련법 정비 | 협약 이행을 위한 국내법령 제정·개정 |\n\n### 4. 폐기물 유래 수은 배출원 관리\n소각시설에서는 폐형광등·폐건전지 등 수은함유폐기물이 일반폐기물에 혼입되어 소각로에 투입되는 경우 국소적으로 높은 수은 배출이 발생할 수 있어, 반입단계에서의 수은함유폐기물 선별·분리배출이 배출저감의 1차적 수단이 된다.\n\n### 5. 수은 배출과 다이옥신 관리의 시너지\n활성탄분사는 다이옥신과 수은을 동시에 저감하는 공통 기술이므로, 소각시설 설계 시 두 오염물질을 별도로 접근하기보다 하나의 통합된 후단 흡착 시스템으로 설계하는 것이 경제적이며, 이는 Day 90에서 학습한 내용과 직접 연결된다.\n\n## Ⅴ. 결론\n\n수은은 배출 형태(원소상·산화상·입자상)에 따라 저감 난이도가 크게 달라, 원소상 수은을 산화시켜 흡착·흡수하기 쉬운 형태로 전환하는 것이 저감기술의 핵심 원리다. 활성탄분사(특히 브롬화활성탄)와 기존 저감설비(SCR·FGD)의 부수효과를 결합한 종합적 접근이 실무적으로 활용되며, 미나마타협약에 따른 국제적 규제 강화는 국내 배출허용기준 강화와 관리제도 정비로 이어지고 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 형태별 난이도 | 원소상(어려움) > 산화상 > 입자상(쉬움) |\n| 핵심전략 | 산화 촉진 후 흡착·흡수 |\n| 국제규제 | 미나마타협약(2013), 전주기 관리 |\n\n수은은 다이옥신과 함께 소각시설·석탄화력 관리의 양대 미량 유해물질로 취급되며, 두 물질 모두 후단 흡착기술(ACI)이라는 공통된 해법을 공유한다는 점에서 통합적 관리 관점이 실무와 시험 모두에서 중요하다. 향후 국제 규제가 지속적으로 강화될 것으로 예상되는 만큼, 관련 저감기술의 고도화와 배출원 관리의 선제적 대응이 요구된다. 대기관리기술사는 이러한 국제 동향과 국내 이행제도의 연계를 정확히 이해하고, 사업장의 배출원 특성에 맞는 최적 저감기술을 제안할 수 있어야 한다.\n","side":[{"title":"수은 형태 변환과 저감효율 향상 메커니즘","body":"### 산화 촉진 반응 개념\nHg⁰(원소상) + 할로겐(Br, Cl) → Hg²⁺(산화상, 수용성)\n\n이 반응을 통해 흡착·흡수가 어려운 원소상 수은을 처리가 용이한 산화상으로 전환시키는 것이 브롬화활성탄과 SCR 촉매의 공통된 작용 원리다.\n\n### 시설별 수은 배출 특성 비교\n| 시설 | 수은 함유 특성 |\n|---|---|\n| 석탄화력 | 석탄 중 미량 함유, 대량 처리로 총배출량 상당 |\n| 소각시설 | 폐기물 중 수은함유제품(폐형광등, 폐전지 등) 혼입 위험 |\n| 시멘트 소성로 | 원료(석회석 등) 중 미량 함유 |\n\n### 저감효율 종합 감각(문헌 참고범위)\n| 저감수단 조합 | 수은 저감효율 감각 |\n|---|---|\n| 기존 저감설비(SCR+FGD+집진)만 | 중간 수준 |\n| 기존설비+ACI(활성탄분사) | 90% 이상까지 향상 가능 |\n\n수치는 연료 성상·설비조건에 따라 크게 달라지므로, 답안에서는 절대수치보다 \"ACI 추가가 저감효율을 크게 향상시킨다\"는 경향을 중심으로 서술하는 것이 안전하다.\n\n### 미나마타협약과 국내 정책 연표(개념)\n| 시점 | 내용 |\n|---|---|\n| 2013년 | 미나마타협약 채택(구마모토, 일본) |\n| 협약 발효 이후 | 회원국 순차 비준 및 국내 이행법령 정비 |\n| 국내 이행 | 배출허용기준 강화, 특정대기유해물질 관리 강화 |\n\n협약의 구체적 발효연도나 국내 비준시점은 자료에 따라 표기가 다를 수 있으므로, 답안에서는 \"2013년 채택\"이라는 확실한 사실을 중심으로 서술하고 세부 시행일정은 범위로 언급하는 것이 안전하다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 수은의 배출형태별 특성과 저감기술을 설명하시오. *(114~138회 다수 25점)*\n2. 활성탄분사(ACI)와 브롬화활성탄의 수은 제거원리를 설명하시오. *(120회 10점)*\n3. 미나마타협약의 주요 내용과 국내 이행체계를 설명하시오. *(126회 10~25점)*\n4. 석탄화력의 기존 저감설비가 수은 저감에 미치는 부수적 효과를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n수은 문제는 \"왜 원소상 수은이 제거하기 어려운가\"(휘발성 높고 수용성 낮음)를 먼저 설명한 뒤, 저감기술이 이 문제를 어떻게 해결하는지(산화 촉진) 순서로 서술하면 논리적 완결성이 높아진다. 미나마타협약은 연도(2013년)와 유래(일본 미나마타병)를 정확히 언급하면 가점 요인이 된다.\n\n### 2단계 유해물질 파트 총정리\nDay 89~91(다이옥신 생성·제거, 수은)로 소각시설의 양대 유해물질(다이옥신·수은) 관리체계 학습이 마무리된다. 다음 Day 92(회독 5회차)에서 Day 85~91 전체를 종합 복습한다. 다이옥신과 수은은 개별 문제로도 출제되지만, \"소각시설 유해물질 종합관리방안\"과 같은 통합형 25점 문제로도 자주 출제되므로 두 주제를 하나의 답안 틀 안에서 함께 서술하는 연습이 필요하다.\n\n### 암기 카드 5선\n1. **형태별 난이도** = 원소상>산화상>입자상(제거 어려운 순)\n2. **브롬화활성탄** = 할로겐 첨着, 산화 촉진→흡착효율 향상\n3. **기존설비 부수효과** = SCR(산화)+FGD(흡수)+집진(포집)\n4. **미나마타협약** = 2013년 채택, 전주기 관리\n5. **국내제도** = 특정대기유해물질 지정, 배출허용기준"}]},"92":{"day":92,"date":"2026-10-31","title":"2단계 가스상·연소·측정 회독 5회차","keywords":[{"k":"소각시설 종합","subs":["표준 방지설비: 반건식+ACI+백필터+SCR/SNCR","클링커(국소고온+저융점회분)","형식별(스토커·유동층·회전로) 특성"]},{"k":"SRF·에너지화","subs":["SRF 품질기준(발열량·염소·중금속)","바이오가스화(혐기성소화)","열분해·가스화(무산소~부분산화)"]},{"k":"다이옥신 종합","subs":["De Novo 합성(300~450℃, Cu촉매)","3단계 방어(3T+급냉+흡착)","TEQ=Σ(Ci×TEFi)"]},{"k":"수은 관리","subs":["형태별(원소상·산화상·입자상) 난이도","브롬화활성탄(산화촉진)","미나마타협약(2013)"]},{"k":"공통 방지원리","subs":["ACI: 다이옥신+수은 동시제거","급속냉각: 재합성 억제","기존설비 부수효과(SCR·FGD)"]}],"answer":"# 2단계 회독 5회차 — Day 85~91 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 **소각시설 종합(방지설비·클링커) → 에너지화(SRF·바이오가스화·열분해·가스화) → 유해물질(다이옥신·수은)**로 이어지는 3단계 진입 직전의 응용 구간이다. 소각·에너지화 기술이 공통적으로 \"완전산화 vs 제한적 산소공급\"이라는 축을 가지고 있고, 다이옥신·수은은 \"생성 후 후단 제거\"라는 공통 해법(ACI)을 공유한다는 점을 파악하는 것이 이번 회독의 핵심이다.\n\n```\n소각시설(완전산화) ←→ 에너지화 기술(제한적 산소공급: 열분해·가스화)\n   ↓                                    ↓\n클링커 관리(운전상 장애)         SRF(원료 가공·품질관리)\n   ↓\n유해물질: 다이옥신(De Novo, TEQ) + 수은(형태별 저감)\n   ↓\n공통 후단제거: 활성탄분사(ACI) — 다이옥신·수은 동시 흡착\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| 소각시설 표준 방지설비 순서 | 반건식→ACI→백필터→SCR/SNCR | ☐ |\n| 열분해 온도 | **400~800℃**(무산소~저산소) | ☐ |\n| 가스화 온도 | **800~1,200℃**(부분산화, m<1) | ☐ |\n| 바이오가스 CH4 함량 | **55~65%** | ☐ |\n| De Novo 합성 구간 | **300~450℃** | ☐ |\n| 급속냉각 통과시간 | 통상 **1초 이내** | ☐ |\n| 다이옥신 이성질체 수 | PCDD 75종+PCDF 135종=**210종** | ☐ |\n| 최고독성 이성질체 | **2,3,7,8-TCDD**(TEF=1) | ☐ |\n| TEQ 산정식 | **TEQ=Σ(Ci×TEFi)** | ☐ |\n| 다이옥신 기준단위 | **ng-TEQ/Sm³** | ☐ |\n| 수은 제거 난이도 순 | 원소상>산화상>입자상 | ☐ |\n| 미나마타협약 채택연도 | **2013년** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **TEQ**: TEQ = Σ(Ci × TEFi)\n2. **DRE(파괴제거효율, Day69 연계)**: η=(Cin−Cout)/Cin×100\n3. **수은 산화반응(개념)**: Hg⁰ + 할로겐 → Hg²⁺(수용성)\n4. **바이오가스화 3단계**: 가수분해→산생성→메탄생성\n5. **가스화 반응(개념)**: 유기물 + 제한된 O2(m<1) → CO+H2(Syngas)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 열분해 vs 가스화 | 무산소, 400~800℃ | 부분산화, 800~1,200℃ | 산소공급 여부 |\n| 전구물질경로 vs De Novo | 원료 잔류 전구체 반응 | 후단 저온 재합성(촉매) | 반응 위치·시점 |\n| TEF vs TEQ | 이성질체별 독성계수 | 농도×TEF의 총합(종합지표) | 개별값 vs 종합값 |\n| 원소상 vs 산화상 수은 | 제거 어려움(비수용성) | 흡수·흡착 용이(수용성) | 수용성 |\n| 클링커 vs 유동매체 응집 | 화격자·노벽 부착(스토커) | 매체결합(유동층) | 발생 위치 |\n| SRF vs 일반소각 | 균질가공연료 | 미가공 혼합폐기물 | 원료 균질성 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 소각시설의 표준 방지설비 체계를 오염물질별로 종합 설명하시오. *(114~138회 다수 25점)*\n2. 열분해·가스화와 소각의 차이를 산소공급조건 관점에서 비교 설명하시오. *(120회 25점)*\n3. 다이옥신의 생성기작(3경로)과 3단계 관리전략을 설명하시오. *(다수 회차 25점)*\n4. TEQ와 TEF의 개념을 설명하고 계산하시오. *(다수 회차 25점 계산형)*\n5. 수은의 배출형태별 저감기술을 설명하시오. *(126회 25점)*\n6. 미나마타협약과 국내 이행체계를 설명하시오. *(최근 10점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 소각-에너지화-유해물질의 연결고리를 설명해본다.\n2. **비교표 재구성(30분)**: Ⅳ의 6개 비교쌍을 스스로 표로 다시 그려본다.\n3. **수치 암기(20분)**: Ⅱ 체크리스트. De Novo 구간(300~450℃)과 TEQ 산정식은 절대 혼동 금지.\n4. **기출 구술(30분)**: Ⅴ의 6문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: TEQ 계산(Day90)이 어려웠다면 예제를 반복 재계산.\n\n> 3단계(자동차) 진입 직전 마지막 2단계 회독이다. 소각·다이옥신·수은은 매 시험 고빈출 종합문제로 출제되므로 이번 회독에서 확실히 다져야 한다.\n\n## Ⅶ. 2단계 최종 회고\n\nDay 53(흡수)부터 Day 91(수은)까지가 2단계 전체로, 화학적 처리 → 생물학적·신기술 → 악취 → 연소이론 → 석탄화력 → 부대시설 → 소각·에너지화 → 유해물질(다이옥신·수은)의 8개 소주제로 구성되어 있다. 이 방대한 구간이 사실상 시험 범위의 절반 이상을 차지하므로, 이번 5회독을 끝으로 2단계는 매듭짓고 3단계(자동차·측정)로 학습 에너지를 넘겨야 한다. 특히 소각·다이옥신·수은 파트는 최근 회차에서 25점 종합문제로 자주 출제되는 고빈출 영역이므로, 시험 직전 최종 점검 시에도 반드시 재확인해야 할 우선순위 구간으로 표시해두는 것이 좋다. 이번 회독을 계기로 개인별 취약 Day 목록을 별도로 정리해두면 이후 마무리 단계(Day178~194) 회독에서 시간을 절약할 수 있다. 2단계를 완주했다는 것은 대기관리기술사 필기 범위의 절반 이상을 소화했다는 의미이므로, 스스로에게 충분한 격려를 건네고 다음 3단계로 넘어가도 좋다. 남은 절반은 상대적으로 암기 부담이 적은 자동차·측정·정책 파트가 중심이므로, 지금까지의 학습 속도를 유지한다면 충분히 완주할 수 있다. 특히 측정 파트는 계산문제와 절차형 문제가 많아 2단계와는 다른 학습 전략(공정시험기준 원문 대조)이 필요하다는 점을 미리 염두에 두자.\n","side":[{"title":"소각·에너지화·유해물질 통합 흐름도","body":"### 종합응용문제 대비 답안 골격\n```\nQ. \"생활폐기물 소각시설의 환경관리방안을 종합적으로 설명하시오\"\n   ↓\nⅠ. 개요: 소각시설 오염물질(먼지·산성가스·NOx·다이옥신·수은) 개관\nⅡ. 3T 조건과 방지설비 배치(반건식→ACI→백필터→SCR/SNCR)\nⅢ. 다이옥신 3단계 관리(3T+급냉+흡착) + TEQ 평가\nⅣ. 수은 저감(ACI+기존설비 부수효과) + 클링커 등 운전관리\nⅤ. 결론: SRF·에너지화 대안과 정책방향\n```\n\n### 대체기술 선택 기준 요약\n| 폐기물 특성 | 우선 검토 기술 |\n|---|---|\n| 고수분 유기성(음식물·슬러지) | 바이오가스화 |\n| 저위발열량 확보 가능(가연성) | SRF 제조 후 연료화 |\n| 다양한 혼합폐기물 | 소각(표준 방지설비 체계) |\n| 특수 처리(플라스틱 등) | 열분해·가스화 |\n\n### 오염물질별 관리기술 매트릭스\n| 오염물질 | 1차 저감(연소/공정) | 2차 저감(후단설비) |\n|---|---|---|\n| 먼지 | 3T 확보 | 백필터 |\n| HCl·SOx | - | 반건식반응탑 |\n| NOx | EGR·저NOx버너 | SCR/SNCR |\n| 다이옥신 | 3T+급속냉각 | 활성탄분사 |\n| 수은 | 원료관리(선별) | 활성탄분사(브롬화) |\n\n### 25점 종합문제 시간배분 전략\n서론(개요) 3분, 본론 3개 단락 각 6분씩(총 18분), 표 작성 시간 별도 확보, 결론 2분 등 총 25~30분 내에 작성을 마치는 훈련이 실전에서 중요하며, 표를 먼저 그려놓고 서술을 채우는 순서가 시간 관리에 효율적이다."},{"title":"암기 카드 — Day 85~91 핵심 20선","body":"1. **소각 표준방지설비** = 반건식→ACI→백필터→SCR/SNCR\n2. **클링커** = 국소고온+저융점회분, 화격자 폐색\n3. **SRF** = 폐기물 유래 고형연료, 품질인증 필요\n4. **바이오가스화** = 혐기성소화, CH4 55~65%\n5. **열분해** = 무산소 400~800℃, 촤+타르+가스\n6. **가스화** = 부분산화 800~1,200℃, Syngas\n7. **De Novo 합성** = 300~450℃, Cu촉매+미연탄소\n8. **급속냉각** = 통과시간 최소화(1초 이내)\n9. **다이옥신 210종** = PCDD75+PCDF135\n10. **2,3,7,8-TCDD** = 최고독성, TEF=1\n11. **TEQ=Σ(Ci×TEFi)** = 종합독성지표\n12. **ACI** = 활성탄분사, 다이옥신+수은 동시제거\n13. **SCR 겸용** = NOx저감+다이옥신분해\n14. **원소상 수은** = 제거 가장 어려움\n15. **브롬화활성탄** = 할로겐 첨着, 산화촉진\n16. **미나마타협약** = 2013년 채택\n17. **특정대기유해물질** = 수은 등 지정관리\n18. **폐기물 처리위계** = 발생억제>재사용>재활용>에너지화>매립\n19. **시멘트소성로 혼소** = 1,400℃↑ 고온, SRF 활용\n20. **통합관리원칙** = 생성억제+재합성억제+후단제거\n\n### 회독 진도 메모\n1~5회독으로 2단계(Day53~91) 전체를 완주했다. 다음은 3단계(자동차·측정)로, Day 100·108·116·117에서 4회에 걸쳐 회독이 예정되어 있다.\n\n### 취약도 자가진단 체크리스트\n아래 중 3개 이상 막힘없이 설명이 안 되면 해당 Day를 재복습할 것: ① 소각 표준방지설비 배치(Day85) ② 클링커 생성원인(Day86) ③ 열분해·가스화 비교(Day88) ④ De Novo 합성조건(Day89) ⑤ TEQ 계산(Day90) ⑥ 수은 형태별 저감(Day91)."}]},"93":{"day":93,"date":"2026-11-01","title":"자동차 배출가스 특성과 규제","keywords":[{"k":"배출가스 종류","subs":["배기가스(CO·HC·NOx·PM)","증발가스(연료탱크·급유)","블로바이가스(크랭크케이스)"]},{"k":"연료별 배출특성","subs":["휘발유차: CO·HC 위주","경유차: NOx·PM 위주","LPG차: 상대적으로 청정"]},{"k":"배출가스 인증제도","subs":["형식승인·인증시험(FTP-75 등)","실도로주행시험(RDE)","제작차 배출허용기준"]},{"k":"단계별 규제 강화","subs":["유로(Euro)/국내 배출가스 등급 단계적 강화","경유차 NOx 규제 특히 강화","저공해차 보급정책 연계"]},{"k":"운행차 관리","subs":["정기검사·수시점검","배출가스등급제 5등급 분류","저공해조치 지원사업"]}],"answer":"# 자동차 배출가스 특성과 규제\n\n## Ⅰ. 개요\n\n자동차는 이동오염원 중 가장 큰 비중을 차지하는 배출원으로, 연료 종류(휘발유·경유·LPG)와 배출 형태(배기가스·증발가스·블로바이가스)에 따라 서로 다른 오염물질 특성을 보인다. 이에 따라 각국은 제작차 인증시험을 통한 사전관리와 운행차 검사·등급제를 통한 사후관리를 병행하며, 특히 최근에는 실제 도로주행 조건을 반영한 RDE(Real Driving Emission) 규제가 강화되는 추세다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 자동차 배출가스의 종류\n\n| 구분 | 발생 위치 | 주요 성분 |\n|---|---|---|\n| 배기가스 | 배기관(머플러) | CO, HC, NOx, PM(미세먼지) |\n| 증발가스 | 연료탱크, 급유 시(Day67 Stage Ⅰ/Ⅱ 연계) | HC(휘발성 연료성분) |\n| 블로바이가스 | 크랭크케이스(피스톤-실린더 간극) | 미연소 연료+엔진오일 증기 |\n\n블로바이가스는 PCV(Positive Crankcase Ventilation) 밸브를 통해 흡기계로 재순환시켜 대기 중 직접 배출을 방지하는 것이 표준적 관리방식이다.\n\n### 증발가스 관리장치\n연료탱크에서 발생하는 증발가스는 캐니스터(활성탄 흡착장치)에 일시 포집한 후, 엔진 가동 시 흡기계로 유입시켜 연소·처리하는 방식으로 관리되며, 이는 Day55~56에서 학습한 흡착 원리가 자동차에 적용된 사례다.\n\n## Ⅲ. 연료별·차종별 배출 특성\n\n### 1. 연료별 배출 경향\n| 연료 | 주요 배출 오염물질 | 특징 |\n|---|---|---|\n| 휘발유(가솔린) | CO, HC 위주 | 삼원촉매(Day95)로 고효율 저감 가능 |\n| 경유(디젤) | NOx, PM(매연) 위주 | 후처리장치(DPF·SCR, Day94) 필요 |\n| LPG | CO, HC(휘발유보다 낮은 경향) | 상대적으로 청정연소 |\n\n### 2. 연소방식에 따른 차이\n디젤엔진은 압축착화(고온고압에서 자연발화)로 국소적 고온영역이 형성되어 Thermal NOx가 많이 생성되며, 공기비가 큰 희박연소 특성상 PM(매연) 생성도 동반된다. 반면 휘발유엔진은 불꽃점화(예혼합연소)로 상대적으로 균일한 연소가 이루어져 PM 생성은 적으나 이론공연비 부근 운전 시 CO·HC가 발생한다.\n\n## Ⅳ. 배출가스 규제체계\n\n### 1. 제작차 인증시험\n| 항목 | 내용 |\n|---|---|\n| 실내 인증시험 | 표준 주행모드(FTP-75 등)로 섀시다이나모미터 시험 |\n| RDE(실도로주행시험) | 실제 도로조건에서 휴대용 배출가스측정장비(PEMS)로 측정 |\n| 인증기준 | 차종·연료별 배출허용기준 충족 시 형식승인 |\n\n### 2. 규제 강화 흐름\n국내외 배출가스 규제는 유로(Euro) 단계 또는 이에 준하는 국내 기준으로 단계적으로 강화되어 왔으며, 특히 경유차의 NOx·PM 기준이 지속적으로 강화되어 후처리장치의 고도화(DOC→DPF→SCR 순차 도입)를 견인해왔다.\n\n### 3. 운행차 관리체계\n| 제도 | 내용 |\n|---|---|\n| 정기검사 | 배출가스 상태 정기 확인 |\n| 배출가스등급제 | 차량을 1~5등급으로 분류, 저공해차 인센티브·노후경유차 규제 연계 |\n| 저공해조치 지원사업 | 노후경유차 대상 DPF 부착·조기폐차 지원 |\n\n### 4. 자동차 배출가스 관리와 대기환경정책의 연계\n자동차 배출가스는 도심지역 NOx·미세먼지 오염의 주요 배출원으로 지목되어 대기관리권역 특별법, 계절관리제 등 대기질 개선 정책에서 자동차 통행제한·저공해차 의무화와 같은 이동오염원 대책이 핵심 축으로 다뤄지고 있다.\n\n### 5. 국내외 배출가스 규제 강화 경향\n경유차의 NOx 기준은 세대를 거듭할수록 대폭 강화되어 왔으며, 이는 DPF 단독 적용 시기에서 DPF+SCR 병행 적용 시기로의 후처리기술 발전을 견인한 정책적 요인으로 평가된다. 이처럼 규제 강화가 후처리기술의 고도화를 이끌어온 역사적 흐름을 이해하면, 향후 추가 강화 시 예상되는 기술적 대응방향도 논리적으로 서술할 수 있다.\n\n## Ⅴ. 결론\n\n자동차 배출가스는 연료·연소방식에 따라 뚜렷이 구분되는 특성(휘발유=CO·HC, 경유=NOx·PM)을 가지므로, 이에 대응하는 후처리기술도 차종별로 특화되어 발전해왔다. 제작차 인증(RDE 포함)을 통한 사전관리와 운행차 등급제·저공해조치를 통한 사후관리가 결합되어야 실효성 있는 이동오염원 관리가 가능하며, 향후 친환경차(Day98) 보급 확대와 함께 배출가스 규제는 더욱 강화될 것으로 전망된다.\n\n| 요약 | 주요 배출물질 | 관리축 |\n|---|---|---|\n| 휘발유차 | CO, HC | 삼원촉매 |\n| 경유차 | NOx, PM | DPF·SCR·EGR |\n| LPG차 | CO, HC(상대적으로 낮음) | 삼원촉매(휘발유차와 유사) |\n\n이러한 연료별 특성 차이는 대기관리기술사가 이동오염원 저감정책을 설계할 때 일괄적 규제보다 차종·연료별 맞춤형 접근이 필요함을 시사하며, 이는 다음 Day부터 학습할 구체적 후처리기술의 이론적 기반이 된다. 결국 이동오염원 관리의 성패는 연료 특성에 대한 정확한 이해에서 출발한다는 점을 다시 한번 강조할 필요가 있다. 대기관리기술사 시험에서도 자동차 파트는 매 회차 빠지지 않는 고정 출제영역이므로 기초 개념부터 확실히 다져야 한다. 특히 환경영향평가·해양이용영향평가 실무에서도 개발사업의 교통유발 저감방안을 검토할 때 자동차 배출가스 관리 지식이 직접 활용되므로 실무적 가치도 큰 주제다. 다음 세 개의 Day에 걸쳐 경유차·휘발유차의 구체적 후처리기술을 순차적으로 학습하면서 이번 Day의 개관 내용을 단단한 기초로 삼아야 한다.\n","side":[{"title":"인증시험 모드와 RDE 도입 배경","body":"### 실내 인증시험의 한계\nFTP-75 등 표준 주행모드는 정형화된 실험실 조건에서 수행되어, 실제 도로의 급가속·정체·고속주행 등 다양한 운전조건을 완전히 반영하지 못한다는 한계가 있다. 이러한 한계가 이른바 \"디젤게이트\"(Day96 연계) 사건의 배경이 되었다.\n\n### RDE(실도로주행시험) 개념\n| 항목 | 내용 |\n|---|---|\n| 측정장비 | PEMS(Portable Emissions Measurement System) |\n| 측정조건 | 실제 도로(도심·교외·고속도로) 주행 |\n| 도입 목적 | 실내시험과 실도로 배출량 간 괴리(Defeat Device 등) 해소 |\n\n### 배출가스 저감 정책의 이중 구조\n제작차 단계의 강화된 인증기준(RDE 포함)과 운행차 단계의 등급제·저공해조치가 결합되어야, 신차뿐 아니라 이미 운행 중인 노후차량의 배출량까지 종합적으로 관리할 수 있다.\n\n### 인증시험과 실도로 배출량 괴리 사례\n일부 차량이 실내 인증시험에서는 기준을 만족하나 실도로 주행에서는 기준을 크게 초과하는 사례가 다수 확인되면서 RDE 도입이 가속화되었으며, 이는 Day96에서 학습할 디젤게이트 사건과 직접적으로 연관된다.\n\n### 저공해차 등급 분류 개념\n| 등급 | 대상 |\n|---|---|\n| 1등급 | 전기차·수소차 등 무배출차량 |\n| 2~3등급 | 하이브리드·저배출 휘발유·LPG차 |\n| 4~5등급 | 노후 경유차 등 고배출차량 |\n\n이 등급은 배출가스등급제의 기초자료로 활용되며, 계절관리제·대기관리권역 내 운행제한 정책과 직접 연동된다.\n\n### 답안 확장 포인트\n등급제 관련 문제는 등급 구분기준(연료·연식·배출허용기준 충족 여부)을 표로 제시한 뒤, 저공해차 인센티브와 노후차 운행제한이라는 양방향 정책수단을 함께 언급하면 완성도가 높아진다. 아울러 배출가스등급이 낮은 차량에 대한 통행료 감면, 공영주차장 할인 등 실생활 인센티브 사례를 하나 정도 언급하면 답안의 구체성이 살아난다. 반대로 고배출등급 차량에 대해서는 계절관리제 기간 운행제한이 적용될 수 있다는 점도 함께 언급하면 정책의 양면성을 균형 있게 보여줄 수 있다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 자동차 배출가스의 종류(배기·증발·블로바이가스)를 설명하시오. *(114~138회 다수 10~25점)*\n2. 휘발유차와 경유차의 배출 특성 차이를 연소방식 관점에서 설명하시오. *(다수 회차 25점)*\n3. RDE(실도로주행시험) 도입 배경과 측정방법을 설명하시오. *(120회 10점)*\n4. 운행차 배출가스등급제와 저공해조치 지원사업을 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n자동차 배출가스는 \"연료-연소방식-오염물질-후처리기술\"을 하나의 논리사슬로 연결하면 답안 구조가 명확해진다. 휘발유차는 CO·HC→삼원촉매, 경유차는 NOx·PM→DPF·SCR로 매칭하여 서술하면 이후 Day94~96 학습과도 자연스럽게 연결된다.\n\n### 다음 학습 연계\nDay 94~96에서 경유차·휘발유차의 구체적 후처리기술을 심화 학습하므로, 이번 Day는 전체 개관으로 이해하고 세부 기술은 다음 Day에서 익힌다.\n\n### 암기 카드 5선\n1. **배출가스 3종류** = 배기가스+증발가스+블로바이가스\n2. **연료별 특성** = 휘발유(CO·HC) vs 경유(NOx·PM)\n3. **RDE** = PEMS로 실도로 측정, 실내시험 한계 보완\n4. **배출가스등급제** = 1~5등급, 저공해차 인센티브 연계\n5. **운행차 관리** = 정기검사+등급제+저공해조치\n\n### 실무 연계 메모\n환경영향평가에서 대규모 개발사업의 교통유발 저감방안을 검토할 때는 예상 통행량과 차종 구성비를 바탕으로 자동차 배출가스 기여농도를 산정하는 경우가 있으며, 이때 이번 Day에서 학습한 연료별·차종별 배출 특성이 직접적인 산정 근거자료로 활용된다."}]},"94":{"day":94,"date":"2026-11-02","title":"경유차 후처리장치 - DPF·SCR·EGR","keywords":[{"k":"DPF(매연저감장치)","subs":["세라믹 필터로 PM 물리적 포집","재생(연소)으로 필터 막힘 방지","포집효율 80~90% 이상"]},{"k":"SCR(선택적촉매환원)","subs":["요소수(AdBlue) 분사, NH3 환원","촉매(V2O5-TiO2계) 300~400℃","NOx 저감 80~90%"]},{"k":"EGR(배기가스재순환)","subs":["배기가스 일부 흡기로 재순환","연소온도 저하→Thermal NOx 억제","PM 증가 부작용, DPF와 병행"]},{"k":"DOC(산화촉매)","subs":["CO·HC 산화, PM 중 SOF 저감","DPF 전단 배치, NO→NO2 전환","DPF 재생 보조 역할"]},{"k":"통합 시스템","subs":["DOC→DPF→SCR 순차 배치","요소수 결빙·품질 관리","경고등·인터록(요소수 부족 시 출력제한)"]}],"answer":"# 경유차 후처리장치 - DPF·SCR·EGR\n\n## Ⅰ. 개요\n\n경유차는 압축착화 방식의 연소특성상 NOx와 PM(매연)이 상대적으로 많이 발생하며, 이 두 오염물질은 저감 방향이 상충되는 특성(NOx 저감을 위한 저온연소는 PM 증가, 완전연소는 NOx 증가)을 가져 단일 기술로 동시에 해결하기 어렵다. 이에 따라 경유차는 EGR(연소단계 저감), DOC·DPF(PM 후처리), SCR(NOx 후처리)을 통합적으로 조합하여 두 오염물질을 각각 별도의 메커니즘으로 저감하는 다단계 시스템을 채택하고 있다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 개별 후처리장치의 원리\n\n### 1. EGR(Exhaust Gas Recirculation, 배기가스재순환)\n배기가스의 일부를 흡기계로 재순환시켜 흡입공기를 희석함으로써 연소온도를 낮추고, 이를 통해 Thermal NOx(고온 생성)의 생성을 억제하는 연소단계 저감기술이다. 다만 연소온도 저하는 완전연소를 저해하여 PM(매연) 생성을 증가시키는 부작용이 있어, 반드시 DPF와 병행 적용된다.\n\n### 2. DOC(Diesel Oxidation Catalyst, 산화촉매)\n백금(Pt) 등 귀금속 촉매를 이용해 배기가스 중 CO·HC를 CO₂·H₂O로 산화시키고, PM 중 가용성유기성분(SOF)도 함께 저감한다. 또한 NO를 NO₂로 산화시켜 후단 DPF의 자연재생(NO₂를 이용한 촤 산화)을 돕는 역할도 수행한다.\n\n### 3. DPF(Diesel Particulate Filter, 매연저감장치)\n세라믹 재질의 벌집형(허니콤) 필터로 배기가스 중 PM을 물리적으로 포집하며, 포집효율은 통상 **80~90% 이상**에 달한다. 필터에 PM이 누적되면 배압이 상승하므로, 주기적으로 필터에 포집된 매연을 연소시켜 제거하는 재생(Regeneration) 과정이 필요하다.\n\n| 재생 방식 | 원리 |\n|---|---|\n| 수동재생(강제재생) | 별도 연료 분사로 배기온도를 인위적으로 상승시켜 연소 |\n| 자연재생 | DOC에서 생성된 NO₂를 이용해 상대적으로 낮은 온도에서 매연 산화 |\n\n### 4. SCR(Selective Catalytic Reduction, 선택적촉매환원, Day59 연계)\n요소수(AdBlue, 우레아수용액)를 배기가스에 분사하면 가수분해되어 암모니아(NH₃)가 생성되고, 이 NH₃가 촉매(V₂O₅-TiO₂계) 표면에서 NOx와 반응하여 N₂와 H₂O로 환원된다. 반응온도는 **300~400℃**이며, NOx 저감효율은 **80~90%**에 달한다.\n\n## Ⅲ. 통합 시스템 배치와 상호관계\n\n### 1. 표준 배치 순서\n엔진(EGR 적용) → DOC → DPF → SCR → 굴뚝(테일파이프)\n\n### 2. 배치 순서의 논리\n| 순서 | 이유 |\n|---|---|\n| DOC가 DPF보다 앞 | NO→NO2 전환으로 DPF 자연재생 촉진 |\n| DPF가 SCR보다 앞 | PM이 SCR 촉매를 오염·피독시키는 것을 방지 |\n| SCR이 최후단 | 상대적으로 낮은 온도구간에서 안정적 반응 유도 |\n\n### 3. NOx-PM 트레이드오프와 통합해법\n| 접근 | 효과 | 부작용 | 보완 |\n|---|---|---|---|\n| EGR 강화 | NOx 감소 | PM 증가 | DPF로 PM 포집 |\n| 고온완전연소 | PM 감소 | NOx 증가 | SCR로 NOx 환원 |\n\n이처럼 연소단계(EGR)와 후처리단계(DPF·SCR)를 결합함으로써, 단일 기술로는 해결할 수 없는 NOx-PM 트레이드오프 문제를 시스템 차원에서 해결하는 것이 현대 경유차 배출가스 저감의 핵심 전략이다.\n\n## Ⅳ. 운영상 문제점과 관리방안\n\n### 1. 요소수(AdBlue) 관리\n| 문제 | 대응 |\n|---|---|\n| 결빙(영하 조건) | 요소수 탱크 히팅시스템 내장 |\n| 품질 불량(농도 미달) | 인증 요소수 사용 의무화 |\n| 소진 시 | 경고등 점등 후 시동 제한(인터록) |\n\n### 2. DPF 필터 폐색\n장기간 재생이 이루어지지 않으면 필터가 폐색되어 배압 상승, 출력저하, 심한 경우 엔진 손상으로 이어질 수 있어 정기적인 강제재생 관리가 필요하다.\n\n### 3. 정기검사·불법개조 관리\nDPF·SCR을 임의로 제거하거나 요소수 분사를 차단하는 불법개조는 NOx·PM 배출을 급격히 증가시키므로, 운행차 정기검사에서 후처리장치의 정상 장착·작동 여부를 확인하는 것이 중요한 관리 항목이다.\n\n## Ⅴ. 결론\n\n경유차는 NOx-PM 트레이드오프라는 근본적 딜레마를 EGR(연소저감)-DOC·DPF(PM 후처리)-SCR(NOx 후처리)의 다단계 시스템으로 해결하고 있으며, 이 통합 시스템의 배치 순서에는 각 장치 간 상호작용(NO2 생성, 촉매 피독 방지)을 고려한 공학적 논리가 반영되어 있다. 요소수 관리와 DPF 재생이라는 운영관리 요소가 뒷받침되지 않으면 시스템 전체의 신뢰성이 저하되므로, 운전자·정비 측면의 관리도 배출가스 저감만큼 중요하다.\n\n| 요약 | 대상오염물질 | 핵심 원리 |\n|---|---|---|\n| EGR | NOx(연소단계) | 재순환 희석, 연소온도 저하 |\n| DOC+DPF | PM, CO, HC | 산화+물리적 포집 |\n| SCR | NOx(후처리단계) | 요소수+촉매 환원 |\n\n이 통합시스템은 개별 장치의 단순 합이 아니라 서로의 부산물과 부작용을 보완하도록 설계된 하나의 유기체적 시스템이라는 관점에서 이해해야 하며, 이는 최근 경유차 관련 종합문제의 핵심 출제 의도이기도 하다.\n","side":[{"title":"DPF 재생 과정 상세와 배압 관리","body":"### 배압 상승과 재생 트리거\n| 배압 수준 | 상태 | 대응 |\n|---|---|---|\n| 정상 | PM 축적 적음 | 정상 운행 |\n| 상승 | PM 축적 증가 | 자연재생(NO2) 우선 작동 |\n| 고배압 | 자연재생 부족 | 강제재생(연료 추가분사) 실행 |\n\n### DPF 압력센서 모니터링\nDPF 전후단의 차압을 실시간 측정하는 압력센서는 필터 내 PM 축적 정도를 간접적으로 판단하는 핵심 센서로, ECU는 이 신호를 바탕으로 재생 시점을 자동 결정한다.\n\n### 재생 실패 시 연쇄적 문제\n잦은 단거리 주행으로 자연재생·강제재생이 모두 충분히 이루어지지 않으면 배기온도를 인위적으로 올리는 강제재생이 반복되어 엔진오일 희석(연료가 오일에 섞이는 현상) 등 2차적 기계 문제로 이어질 수 있어, 운전 습관 관리도 DPF 수명에 중요한 영향을 미친다.\n\n### 강제재생 조건\n강제재생은 통상 배기온도를 600℃ 이상으로 인위적으로 상승시켜 필터 내 포집된 매연을 연소·제거하는 과정으로, 짧은 주행(단거리 반복 운행)이 많은 차량은 배기온도가 충분히 상승하지 못해 재생이 어려워 DPF 고장의 주요 원인이 된다.\n\n### DPF 고장 시 증상과 예방\n- 증상: 출력저하, 연비악화, 경고등 점등\n- 예방: 정기적인 고속·장거리 주행으로 자연재생 유도, 재생 경고 시 즉시 대응\n\n### SCR 반응 부산물 관리\n요소수 과다분사 시 미반응 암모니아가 배출되는 암모니아슬립(Day61~62와 동일 개념)이 발생할 수 있어, 차량용 SCR 시스템도 정밀한 요소수 분사량 제어를 통해 이를 최소화하도록 설계된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 경유차의 NOx-PM 트레이드오프 문제와 통합 저감시스템을 설명하시오. *(114~138회 다수 25점)*\n2. DPF의 원리와 재생방식(자연재생·강제재생)을 설명하시오. *(다수 회차 25점)*\n3. SCR의 반응원리와 요소수 관리방안을 설명하시오. *(120회 25점)*\n4. DOC-DPF-SCR의 배치순서와 그 이유를 설명하시오. *(126회 10점)*\n\n### 답안 작성 요령\n경유차 후처리 문제는 \"왜 NOx와 PM을 동시에 줄이기 어려운가\"(트레이드오프)를 먼저 짚은 뒤, 각 장치가 이 딜레마를 어떻게 시스템적으로 해결하는지 순서대로 설명하면 25점 문제에 적합한 논리적 답안이 완성된다.\n\n### 다음 학습 연계\nDay 95(휘발유차 삼원촉매)에서 경유차와 대비되는 휘발유차의 후처리 원리를 학습하며, Day 96(RDE·디젤게이트)에서 이번 Day 시스템의 실도로 성능 문제를 심화 학습한다.\n\n### 암기 카드 5선\n1. **EGR** = 배기 재순환, 연소온도↓, Thermal NOx 억제(PM↑ 부작용)\n2. **DOC** = CO·HC 산화+NO→NO2(DPF 자연재생 보조)\n3. **DPF** = 세라믹필터, 포집효율 80~90%↑, 재생 필수\n4. **SCR** = 요소수+촉매(300~400℃), NOx저감 80~90%\n5. **배치순서** = DOC→DPF→SCR(피독방지+반응순서 고려)"}]},"95":{"day":95,"date":"2026-11-03","title":"휘발유차 삼원촉매와 GDI","keywords":[{"k":"삼원촉매(TWC)","subs":["CO·HC 산화 + NOx 환원 동시처리","Pt·Pd·Rh 귀금속 촉매","이론공연비(λ=1) 부근 최고효율"]},{"k":"공연비 제어","subs":["산소센서(O2 sensor) 피드백제어","λ(람다) 윈도우 좁음","폐회로 제어 필수"]},{"k":"GDI(직분사)","subs":["연료 실린더 직접분사","연비·출력 향상","PM 배출 증가 이슈"]},{"k":"GDI 대응기술","subs":["GPF(가솔린미립자필터)","분사시기·패턴 최적화","린번 대응 별도 촉매"]},{"k":"콜드스타트 관리","subs":["촉매 활성화 전 배출 급증","촉매 예열(전기가열 등)","엔진 근접장착 촉매"]}],"answer":"# 휘발유차 삼원촉매와 GDI\n\n## Ⅰ. 개요\n\n휘발유차는 이론공연비 부근에서 운전되는 특성을 이용해 삼원촉매(TWC, Three-Way Catalyst) 하나로 CO·HC·NOx 세 가지 오염물질을 동시에 저감할 수 있다는 점이 경유차와 근본적으로 다른 특징이다. 다만 이러한 고효율은 정밀한 공연비 제어가 전제되어야 하며, 최근 연비·출력 향상을 위해 보급이 확대된 GDI(직분사) 엔진은 PM 배출 증가라는 새로운 과제를 낳아 별도의 후처리기술(GPF)이 요구되고 있다. *(114~138회 다수 25점 기출)*\n\n## Ⅱ. 삼원촉매(TWC)의 원리\n\n### 1. 동시 저감 메커니즘\n| 반응 | 화학식(개념) |\n|---|---|\n| CO 산화 | 2CO + O2 → 2CO2 |\n| HC 산화 | CxHy + O2 → CO2 + H2O |\n| NOx 환원 | 2NO + 2CO → N2 + 2CO2 |\n\n세 반응이 동시에 최적으로 진행되기 위해서는 배기가스 중 산화제(O₂, NOx)와 환원제(CO, HC)의 비율이 정확히 균형을 이루어야 하며, 이는 엔진이 이론공연비(λ=1, 공기와 연료가 화학양론적으로 정확히 반응하는 비율) 부근에서 운전될 때 달성된다.\n\n### 2. 촉매 구성\n백금(Pt)·팔라듐(Pd)은 주로 산화반응(CO·HC)을, 로듐(Rh)은 주로 환원반응(NOx)을 촉진하는 역할을 하며, 세 귀금속이 담체(세라믹 허니콤)에 코팅되어 하나의 촉매컨버터를 구성한다.\n\n## Ⅲ. 공연비 제어와 λ 윈도우\n\n### 1. 산소센서 피드백 제어\n배기관에 설치된 산소센서(O₂ 센서)가 배기가스 중 잔류 산소농도를 실시간 측정하여 ECU(엔진제어장치)에 전달하고, ECU는 이를 바탕으로 연료분사량을 조절하는 폐회로(Closed-loop) 제어를 수행한다.\n\n### 2. λ(람다) 윈도우\n삼원촉매는 이론공연비(λ=1)에서 아주 좁은 범위(λ 윈도우) 내에서만 세 오염물질을 동시에 고효율로 저감할 수 있으며, 이 범위를 벗어나면(농후 또는 희박) 어느 한 오염물질의 저감효율이 급격히 저하된다.\n\n| 공연비 상태 | 결과 |\n|---|---|\n| 농후(λ<1) | CO·HC 증가, NOx 저감 유리 |\n| 희박(λ>1) | NOx 증가, CO·HC 저감 유리 |\n| 이론공연비(λ=1) | 세 오염물질 동시 최적 저감 |\n\n## Ⅳ. GDI 엔진과 PM 관리\n\n### 1. GDI(Gasoline Direct Injection)의 특징\n연료를 흡기포트가 아닌 실린더 내부에 직접 분사하는 방식으로, 정밀한 연료제어를 통해 연비와 출력을 향상시킬 수 있으나, 연료와 공기의 혼합시간이 짧아 국소적으로 농후한 혼합기가 형성되어 불완전연소로 인한 PM(미세먼지) 배출이 기존 포트분사(MPI) 방식보다 증가하는 경향이 있다.\n\n### 2. GDI 대응기술: GPF(Gasoline Particulate Filter)\nDPF와 유사한 원리로 세라믹 필터를 이용해 GDI 엔진에서 배출되는 PM을 물리적으로 포집하는 장치로, 최근 GDI 차량에 표준 장착이 확대되는 추세다.\n\n| 구분 | DPF(경유차) | GPF(휘발유 GDI차) |\n|---|---|---|\n| 대상 PM | 상대적으로 다량 | 상대적으로 소량(그러나 규제강화로 필수화) |\n| 재생 필요성 | 필수(정기적 재생) | 상대적으로 재생빈도 낮음 |\n\n### 3. 분사시기·패턴 최적화\n분사시기를 조정하여 혼합기 형성시간을 확보하거나, 다단분사(예비분사+주분사)를 통해 국소적 농후영역을 최소화하는 것도 PM 저감의 보조적 수단이다.\n\n### 4. 휘발유차와 경유차 후처리 시스템의 근본적 차이\n휘발유차는 이론공연비 운전과 삼원촉매라는 단일 메커니즘으로 세 오염물질을 동시에 처리하는 반면, 경유차(Day94)는 희박연소(과잉공기) 특성상 배기가스 중 산소가 풍부하여 일반적인 환원촉매만으로는 NOx를 효과적으로 저감할 수 없어 별도의 환원제(요소수)를 투입하는 SCR이 필요하다는 점이 두 시스템의 근본적 차이다.\n\n### 5. 향후 기술 전망\n내연기관 차량에 대한 배출가스 규제가 지속적으로 강화되는 가운데, 하이브리드차(Day98 연계)의 확대는 엔진 가동시간 자체를 줄여 배출가스 총량을 저감하는 보완적 접근으로 주목받고 있다.\n\n## Ⅴ. 결론\n\n휘발유차는 이론공연비 부근 운전과 삼원촉매의 조합으로 CO·HC·NOx를 동시에 고효율 저감할 수 있다는 강점을 가지나, 이는 정밀한 공연비 피드백 제어라는 전제조건 위에서만 성립한다. GDI 엔진의 보급 확대는 연비·출력 향상이라는 이점과 함께 PM 배출 증가라는 새로운 환경과제를 낳았으며, GPF 등 추가 후처리기술의 도입으로 대응하고 있다. 이는 기술 발전이 한 문제(연비)를 해결하면서 다른 문제(PM)를 유발할 수 있다는 점을 보여주는 대표적 사례다.\n\n| 요약 | 핵심기술 | 대상오염물질 |\n|---|---|---|\n| 일반 휘발유차 | 삼원촉매(TWC) | CO, HC, NOx 동시 |\n| GDI 휘발유차 | 삼원촉매+GPF | CO, HC, NOx + PM |\n\n향후 GDI 엔진의 보급이 더욱 확대될 것으로 예상되는 만큼, GPF의 표준 장착과 관련 배출허용기준의 정비가 휘발유차 대기오염 관리의 핵심 과제로 부상하고 있다. 대기관리기술사는 이러한 기술 트렌드 변화를 지속적으로 추적하여 새로운 규제 수요를 예측할 수 있어야 한다. 결국 삼원촉매 기술의 성숙과 GDI 엔진의 새로운 과제는 자동차 배출가스 관리가 끊임없이 진화하는 분야임을 잘 보여주는 사례다.\n","side":[{"title":"콜드스타트 문제와 촉매 예열기술","body":"### 콜드스타트(Cold Start) 문제\n촉매는 일정 온도(통상 200~300℃) 이상에서 활성화되므로, 시동 직후 촉매가 충분히 가열되기 전까지는 저감효율이 매우 낮아 이 짧은 시간 동안 상당량의 오염물질이 배출된다. 실제 인증시험(Day93 연계)에서도 콜드스타트 구간이 전체 배출량의 상당 부분을 차지하는 것으로 알려져 있다.\n\n### 콜드스타트 대응기술\n| 기술 | 원리 |\n|---|---|\n| 근접장착 촉매(Close-coupled) | 엔진과 가깝게 배치하여 빠른 온도상승 |\n| 전기가열 촉매(EHC) | 시동 전·직후 전기로 촉매 예열 |\n| 점화시기 지연 | 배기온도를 높여 촉매 승온 촉진 |\n\n### 인증시험에서 콜드스타트의 비중\nFTP-75 등 표준 인증모드는 시동 직후 구간을 포함하도록 설계되어 있어, 콜드스타트 저감성능이 전체 인증시험 통과 여부에 상당한 영향을 미치며, 이 때문에 제작사들은 근접장착 촉매를 표준적으로 채택하고 있다.\n\n### GDI 분사방식 비교\n| 방식 | 특징 |\n|---|---|\n| 균질분사(Homogeneous) | 혼합기 균일, PM 상대적으로 적음 |\n| 성층분사(Stratified) | 국소 농후혼합기 형성, 연비 유리하나 PM 증가 가능 |\n\n### 촉매 열화(Aging)와 관리\n장시간 사용된 촉매는 귀금속 소결·피독 등으로 활성이 저하되며, 이는 배출가스등급제(Day93 연계)에서 노후차량의 배출량이 신차 대비 증가하는 주요 원인 중 하나로 작용한다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 삼원촉매의 원리와 이론공연비의 관계를 설명하시오. *(114~138회 다수 25점)*\n2. λ 윈도우와 산소센서 피드백 제어를 설명하시오. *(120회 10점)*\n3. GDI 엔진의 PM 배출 증가 원인과 GPF 저감기술을 설명하시오. *(126회 25점)*\n4. 콜드스타트 문제와 대응기술을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n삼원촉매 문제는 \"왜 이론공연비 부근에서만 세 오염물질을 동시에 줄일 수 있는가\"라는 인과관계(산화·환원 반응의 균형)를 명확히 설명하는 것이 핵심이며, 경유차(Day94)와 대비하여 \"휘발유차는 단일촉매, 경유차는 다단계시스템\"이라는 차이를 언급하면 비교형 문제에서 고득점할 수 있다.\n\n### 다음 학습 연계\nDay 96(RDE·디젤게이트·OBD)에서 실도로 인증과 배출가스 조작 이슈를 학습하며, 이는 이번 Day와 Day94에서 학습한 후처리기술이 실제 도로에서 어떻게 검증되는지를 다룬다.\n\n### 암기 카드 5선\n1. **삼원촉매(TWC)** = Pt·Pd·Rh, CO·HC 산화+NOx 환원 동시\n2. **이론공연비(λ=1)** = 삼원촉매 최고효율 조건\n3. **λ윈도우** = 매우 좁음, 산소센서 피드백제어 필수\n4. **GDI** = 실린더 직접분사, 연비↑ but PM↑\n5. **GPF** = DPF와 유사원리, GDI차 PM 저감\n\n### 답안 확장 포인트\n경유차·휘발유차를 비교하는 종합문제에서는 \"왜 휘발유차는 단일촉매로 충분한데 경유차는 다단계 시스템이 필요한가\"(희박연소로 인한 배기가스 중 과잉산소)를 명확히 설명하는 것이 두 Day를 아우르는 핵심 논리다."}]},"96":{"day":96,"date":"2026-11-04","title":"RDE와 디젤게이트, OBD","keywords":[{"k":"디젤게이트","subs":["2015년 폭스바겐 배출가스 조작사건","임의설정(Defeat Device) 소프트웨어","실내시험만 통과, 실도로 초과"]},{"k":"RDE 제도화","subs":["PEMS 기반 실도로 측정 의무화","적합성인자(CF) 단계적 강화","콜드스타트·급가속 구간 포함"]},{"k":"OBD(On-Board Diagnostics)","subs":["차량 자체 배출가스 감시시스템","후처리장치 고장 시 경고등 점등","정기검사 연계 진단"]},{"k":"임의설정 규제","subs":["시험조건 인식 후 별도 제어 금지","「대기환경보전법」임의설정 처벌 근거","제작차 인증취소·과징금"]},{"k":"제도 개선 방향","subs":["실도로 배출량 상시 모니터링 확대","OBD 데이터 원격진단 연계","소비자 신뢰 회복 과제"]}],"answer":"# RDE와 디젤게이트, OBD\n\n## Ⅰ. 개요\n\n2015년 발생한 폭스바겐 디젤게이트 사건은 자동차 제작사가 실내 인증시험 조건을 인식하는 소프트웨어(임의설정, Defeat Device)를 탑재하여 시험 중에만 배출가스 저감장치를 최대로 가동하고 실제 도로주행에서는 저감장치 가동을 낮추어 NOx를 과다 배출한 사건으로, 이를 계기로 실도로주행시험(RDE)이 전 세계적으로 제도화되는 결정적 전환점이 되었다. 아울러 차량 스스로 배출가스 관련 부품의 이상을 감시하는 OBD(On-Board Diagnostics) 시스템의 중요성도 함께 부각되었다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 디젤게이트 사건의 개요와 의미\n\n### 1. 사건 개요\n| 항목 | 내용 |\n|---|---|\n| 발생 시점 | 2015년 |\n| 제작사 | 폭스바겐(일부 경유차종) |\n| 조작 방식 | 임의설정 소프트웨어로 인증시험 조건 인식 후 저감장치 최대가동 |\n| 결과 | 실도로 주행 시 NOx가 인증기준의 수 배~수십 배까지 배출 |\n\n### 2. 임의설정(Defeat Device)의 개념\n임의설정이란 자동차 인증시험의 조건(온도, 속도패턴 등)을 인식하여 시험 중에만 배출가스 저감장치가 정상 작동하도록 하고, 실제 주행 중에는 저감장치의 작동을 의도적으로 저하시키는 소프트웨어나 장치를 말하며, 「대기환경보전법」등 관련 법령에서 엄격히 금지하고 위반 시 인증취소·과징금 등 강력한 제재 대상이 된다.\n\n### 3. 사건이 남긴 제도적 파급효과\n디젤게이트는 실내 인증시험만으로는 실제 도로에서의 배출량을 담보할 수 없다는 근본적 한계를 드러냈으며, 이는 Day93에서 학습한 RDE(실도로주행시험)가 선택적 보완수단에서 필수적 규제수단으로 전환되는 계기가 되었다.\n\n## Ⅲ. RDE 제도화와 적합성인자\n\n### 1. RDE 측정 방법\nPEMS(Portable Emissions Measurement System, 휴대용 배출가스측정장비)를 차량에 장착하여 실제 도로(도심·교외·고속도로를 일정 비율로 포함)를 주행하며 배출가스를 실시간 측정하는 방식이다.\n\n### 2. 적합성인자(Conformity Factor, CF)\n실내 인증기준 대비 실도로 측정값의 허용 배수를 의미하며, 실도로 조건의 불가피한 변동성(기상·교통상황 등)을 고려해 일정 배수까지는 허용하되, 이 배수를 단계적으로 낮춰 실내기준에 근접시키는 방향으로 제도가 강화되고 있다.\n\n| 단계 | 적합성인자 경향 |\n|---|---|\n| 초기 도입단계 | 상대적으로 완화된 배수 허용 |\n| 이후 단계 | 배수를 단계적으로 축소, 궁극적으로 1에 근접 |\n\n## Ⅳ. OBD(차량 자체진단장치)\n\n### 1. OBD의 기능\n| 기능 | 내용 |\n|---|---|\n| 상시 모니터링 | 배출가스 관련 센서·후처리장치 상태 실시간 감시 |\n| 고장 진단 | 이상 발생 시 고장코드(DTC) 저장 및 경고등 점등 |\n| 정비 연계 | 정비소에서 진단기로 고장코드 판독, 신속한 수리 유도 |\n\n### 2. 정기검사와의 연계\n운행차 정기검사 시 OBD 점검을 통해 배출가스 관련 부품의 정상 작동 여부를 확인하며, 경고등이 점등된 상태로는 검사에 불합격 처리되어 수리가 강제되는 구조로 운영된다.\n\n### 3. 향후 발전방향\nOBD 데이터를 통신망으로 실시간 전송하여 원격으로 배출가스 이상을 모니터링하는 원격OBD(remote OBD) 기술이 도입되면, 운행 중인 차량의 배출가스 상태를 상시 감시할 수 있는 체계로 발전할 것으로 전망된다.\n\n### 4. 디젤게이트 이후 소비자 신뢰와 산업 영향\n디젤게이트는 해당 제작사의 대규모 리콜과 손해배상, 소비자 신뢰 훼손으로 이어졌을 뿐 아니라, 전 세계 자동차 산업이 경유차 중심에서 전기차·하이브리드차 등 친환경차로 전환을 가속화하는 계기 중 하나로 작용했다는 점에서 단순한 규제 위반 사건을 넘어 산업 전반에 구조적 영향을 미친 사례로 평가된다.\n\n### 5. 실도로 배출량 검증의 국제적 확산\nRDE 제도는 국내뿐 아니라 유럽연합 등 주요국에서 유사한 형태로 도입·강화되고 있으며, 이는 자동차 배출가스 규제가 개별 국가 차원을 넘어 국제적으로 정합성을 갖춰가는 흐름을 보여준다.\n\n## Ⅴ. 결론\n\n디젤게이트는 실내 인증시험만으로는 완전한 배출가스 관리가 불가능함을 드러낸 상징적 사건으로, 이를 계기로 RDE(실도로주행시험)가 제도화되고 적합성인자를 통해 단계적으로 실내-실도로 배출량 격차를 줄여가고 있다. 아울러 차량 스스로 이상을 감시하는 OBD 시스템은 제작 단계의 인증뿐 아니라 운행 전 과정에 걸친 배출가스 관리를 가능케 하는 보완적 축으로, 두 제도의 결합이 자동차 배출가스 관리의 실효성을 담보하는 핵심 체계다.\n\n| 요약 | 핵심 |\n|---|---|\n| 디젤게이트 | 임의설정으로 실도로 NOx 과다배출 |\n| RDE | PEMS 실측, 적합성인자로 단계적 강화 |\n| OBD | 상시 자가진단, 정기검사 연계 |\n\n이 세 요소(사건-제도-기술)는 자동차 배출가스 관리가 \"제작사 자율\"에서 \"정부의 실측 기반 검증\"으로 패러다임이 전환된 과정을 보여주는 하나의 완결된 스토리로 이해할 수 있다.\n","side":[{"title":"임의설정 규제와 국내 처벌 사례 감각","body":"### 임의설정 판정 기준(개념)\n| 판정요소 | 내용 |\n|---|---|\n| 조건 인식 | 온도·속도패턴 등 시험조건 특이적 인식 여부 |\n| 성능 차등 | 시험조건과 실도로조건의 저감장치 작동 차이 |\n| 예외 인정 | 엔진 보호 등 정당한 사유가 있는 경우 예외적 인정 가능 |\n\n임의설정 여부 판정에서는 \"정당한 사유 없이 시험조건에서만 저감성능을 발휘하는가\"가 핵심 쟁점이 되며, 엔진 보호 등 기술적으로 불가피한 사유가 인정되는 경우는 예외로 취급될 수 있다는 점도 답안에서 균형 있게 언급할 필요가 있다.\n\n### 조사·적발 방법론\n당국은 실내 인증시험뿐 아니라 별도의 실도로 조건 재현시험, 소프트웨어 코드 분석 등을 병행하여 임의설정 여부를 조사하며, 이러한 다각적 검증체계는 디젤게이트 이후 크게 강화되었다.\n\n### 리콜 대상자 안내와 참여 독려\n리콜 대상 차량의 소유자에게는 우편·문자 등으로 개별 안내가 이루어지며, 리콜 참여율을 높이기 위해 정비 기간 대차서비스 제공 등의 인센티브가 함께 운영되는 경우도 있다.\n\n### 국내 대응 제도\n국내에서도 디젤게이트 이후 임의설정에 대한 처벌 근거를 강화하고, 인증 취소 시 과징금 부과와 리콜 명령을 병행하는 제도가 정비되었으며, 이는 소비자 피해 구제와 대기질 개선을 동시에 목적으로 한다.\n\n### 리콜 절차 개념\n임의설정이나 배출허용기준 위반이 확인되면 제작사는 해당 차종에 대해 소프트웨어 업데이트 또는 부품 교체 등의 리콜을 실시해야 하며, 리콜 이행 여부는 별도로 사후 점검을 통해 확인된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 디젤게이트 사건의 개요와 임의설정의 개념을 설명하시오. *(114~138회 다수 10~25점)*\n2. RDE 제도화 배경과 적합성인자의 의미를 설명하시오. *(120회 25점)*\n3. OBD 시스템의 기능과 정기검사 연계방안을 설명하시오. *(126회 10점)*\n4. 임의설정과 정당한 사유(엔진보호 등)의 구분기준을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n디젤게이트 문제는 사건의 인과관계(임의설정→실도로 초과배출→RDE 도입)를 시계열적으로 서술하는 것이 효과적이며, 단순 사건개요 나열보다 \"이 사건이 어떤 제도적 변화를 이끌었는가\"에 서술의 무게중심을 두어야 고득점할 수 있다.\n\n### 3단계 자동차 파트 중간 점검\nDay 93~96(개관-경유차-휘발유차-RDE/OBD)으로 자동차 배출가스의 핵심 골격이 완성되었다. 다음 Day 97~99에서 등급제·친환경차·선박 등 주변 주제로 확장한다.\n\n### 암기 카드 5선\n1. **디젤게이트** = 2015년, 폭스바겐, 임의설정(Defeat Device)\n2. **임의설정** = 시험조건 인식 후 저감장치 차등작동\n3. **RDE** = PEMS 실도로측정, 디젤게이트 이후 필수화\n4. **적합성인자(CF)** = 실내 대비 실도로 허용배수, 단계적 축소\n5. **OBD** = 상시 자가진단, 고장코드(DTC)+경고등\n\n### 답안 확장 포인트\n디젤게이트 문제는 사건을 비판적으로만 서술하기보다, 이 사건이 실도로 배출가스 검증체계(RDE·OBD)를 한 단계 발전시킨 계기가 되었다는 제도 발전사적 관점을 함께 제시하면 균형 잡힌 고득점 답안이 된다."}]},"97":{"day":97,"date":"2026-11-05","title":"자동차 배출가스 등급제·저공해조치","keywords":[{"k":"배출가스등급제","subs":["1~5등급 분류(연료·연식·기준)","전기·수소차=1등급","노후경유차=4~5등급"]},{"k":"등급 활용 정책","subs":["계절관리제 운행제한","저공해차 구매보조금·인센티브","공영주차장·혼잡통행료 감면"]},{"k":"저공해조치","subs":["DPF 부착사업(매연저감장치)","조기폐차 지원사업","LPG엔진 개조 지원"]},{"k":"운행제한 제도","subs":["미세먼지 비상저감조치 연계","대기관리권역 5등급차 상시제한","단속·과태료 체계"]},{"k":"정책 효과·과제","subs":["노후경유차 조기퇴출 유도","저소득층 부담 완화방안 병행","등급 데이터 정확성 관리"]}],"answer":"# 자동차 배출가스 등급제·저공해조치\n\n## Ⅰ. 개요\n\n자동차 배출가스등급제는 운행 중인 모든 차량을 배출가스 성능에 따라 1~5등급으로 분류하여, 저공해차에는 인센티브를, 고배출차에는 운행제한 등 규제를 차등 적용하는 제도로, 미세먼지 계절관리제·비상저감조치와 결합되어 이동오염원 관리의 핵심 정책수단으로 활용되고 있다. 아울러 노후 경유차 소유자의 부담을 완화하면서 배출가스를 줄이기 위한 저공해조치(DPF 부착, 조기폐차 등) 지원사업이 병행되어 정책의 실효성과 형평성을 동시에 도모하고 있다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 배출가스등급제의 분류체계\n\n### 1. 등급 분류 기준(개념)\n| 등급 | 대상 차량 |\n|---|---|\n| 1등급 | 전기차, 수소차 등 무배출차량 |\n| 2등급 | 하이브리드차, 저배출 휘발유·LPG차 |\n| 3등급 | 일반 휘발유·LPG차, 저배출 경유차 |\n| 4등급 | 배출허용기준이 상대적으로 낮은 경유차 |\n| 5등급 | 노후 경유차(배출가스 저감장치 미장착 등) |\n\n등급은 연료 종류, 최초등록일(제작연식), 해당 시점의 배출허용기준 충족 여부를 종합적으로 고려하여 산정되며, 구체적인 세부기준은 관련 고시에서 정한다.\n\n### 2. 등급 조회와 활용\n소유자는 자동차 배출가스 등급을 온라인으로 조회할 수 있으며, 이 정보는 각종 정책(운행제한, 인센티브)의 기초자료로 활용된다.\n\n## Ⅲ. 등급 활용 정책\n\n### 1. 인센티브 정책(저공해차 대상)\n| 정책 | 내용 |\n|---|---|\n| 구매보조금 | 전기차·수소차 등 구매 시 국가·지자체 보조금 |\n| 공영주차장 할인 | 저공해차 대상 주차요금 감면 |\n| 혼잡통행료 감면 | 일부 구간 통행료 할인·면제 |\n\n### 2. 규제 정책(고배출차 대상)\n| 정책 | 내용 |\n|---|---|\n| 계절관리제 운행제한 | 미세먼지 고농도 계절(12~3월) 5등급차 운행제한 |\n| 비상저감조치 연계 | 고농도 미세먼지 비상저감조치 발령 시 5등급차 운행제한 |\n| 대기관리권역 상시제한 | 저공해조치 미이행 5등급차 상시 운행제한 확대 추세 |\n\n## Ⅳ. 저공해조치 지원사업\n\n### 1. 주요 지원사업\n| 사업 | 내용 |\n|---|---|\n| DPF 부착사업 | 노후 경유차에 매연저감장치(DPF) 부착 비용 지원(Day94 연계) |\n| 조기폐차 지원 | 노후 경유차 조기폐차 시 보조금 지급 |\n| LPG엔진 개조 | 경유차를 LPG엔진으로 개조 시 지원 |\n| 저공해엔진 개조 | 건설기계 등 특수차량 엔진 개조 지원 |\n\n### 2. 정책 효과와 한계\n저공해조치는 노후차량의 조기 퇴출·개조를 유도하여 실질적인 배출량 저감 효과를 거두고 있으나, 지원 예산의 한계로 대상 차량 전체를 포괄하지 못하는 경우가 있어 지속적인 예산 확대와 우선순위 조정이 필요하다.\n\n### 3. 저공해조치와 배출가스 실효성\nDPF 부착은 PM 저감에는 효과적이나 NOx 저감효과는 제한적이므로, 최근에는 DPF 단독 부착보다 SCR을 결합한 통합 저감장치 지원으로 확대되는 추세이며 이는 Day94에서 학습한 경유차 통합시스템 원리가 저공해조치 정책에도 그대로 반영된 사례다.\n\n### 4. 형평성 고려\n노후 경유차는 소득이 낮은 소유자가 보유한 비중이 상대적으로 높은 경우가 많아, 일률적인 운행제한보다는 저공해조치 지원과 병행한 단계적 접근이 정책의 수용성을 높이는 데 중요하다. 특히 화물운송업 등 생계형 차량에 대해서는 지원 우선순위를 높이는 방향의 세부 시행지침이 함께 마련되는 경우가 많다.\n\n### 5. 등급 데이터 정확성과 행정 신뢰성\n등급제가 각종 규제·인센티브의 근거로 활용되는 만큼, 차량 등록정보와 배출가스 등급 데이터베이스의 정확성이 정책 신뢰성의 전제조건이며, 데이터 오류로 인한 부당한 단속·과태료 부과를 방지하기 위한 정기적인 데이터 검증체계도 함께 요구된다.\n\n## Ⅴ. 결론\n\n배출가스등급제는 차량별 배출성능에 따른 차등적 인센티브·규제를 통해 저공해차 보급과 노후차 저감을 동시에 견인하는 핵심 정책수단이며, 저공해조치 지원사업은 이러한 규제의 형평성을 보완하는 실질적 지원체계다. 향후에는 대기관리권역 내 5등급차 운행제한 확대와 함께, 저소득층 소유 차량에 대한 지원 강화 등 정책의 실효성과 형평성을 동시에 높이는 방향으로 발전할 필요가 있다.\n\n| 요약 | 핵심 |\n|---|---|\n| 등급제 | 1~5등급, 연료·연식·기준 종합 판정 |\n| 인센티브 | 보조금, 주차·통행료 감면 |\n| 규제 | 계절관리제·비상저감조치 시 5등급 운행제한 |\n| 저공해조치 | DPF부착·조기폐차·엔진개조 지원 |\n| 형평성 보완 | 생계형 차량 우선지원, 데이터 정확성 관리 |\n\n이러한 등급제와 저공해조치의 결합은 규제 일변도가 아닌 지원과 규제를 병행하는 정책설계의 대표적 사례로, 대기환경 정책 전반의 형평성 있는 이행을 위한 참고모델이 될 수 있다. 대기관리기술사는 이러한 정책의 설계 논리를 이해하고 실무에서 유사한 제도를 제안할 수 있는 역량을 갖춰야 한다. 이는 단순 기술적 지식을 넘어 정책 형평성까지 고려하는 종합적 문제해결 능력을 요구하는 영역이다.\n","side":[{"title":"계절관리제·비상저감조치와 등급제 연동 구조","body":"### 두 제도의 차이\n| 구분 | 계절관리제 | 비상저감조치 |\n|---|---|---|\n| 발동조건 | 매년 12~3월 정기 시행 | 고농도 미세먼지 예보 시 수시 발령 |\n| 대상 | 전국 또는 대기관리권역 | 발령 지역 |\n| 5등급차 조치 | 상시 운행제한(저공해조치 미이행 차량) | 발령일 한시적 운행제한 |\n\n### 단속 및 예외 체계\n운행제한 위반 시 과태료가 부과되며, 소방차·구급차 등 긴급차량과 저공해조치를 이미 완료한 5등급차는 단속 예외로 인정되는 경우가 많다. 정책 설계 시 이러한 예외 조항이 정책의 실효성과 형평성을 동시에 확보하는 장치로 기능한다.\n\n### 배출가스등급 산정 시 유의사항\n동일한 차종이라도 제작연도별 배출허용기준 개정 시점에 따라 등급이 달라질 수 있으므로, 등급 조회 시에는 차대번호 기준의 정확한 개별조회가 원칙이며 단순 차종명만으로 등급을 단정해서는 안 된다.\n\n### 저공해조치 완료차량 관리\nDPF 부착 등 저공해조치를 완료한 5등급 차량은 운행제한에서 제외되는 경우가 많으므로, 조치 이행 여부를 확인할 수 있는 스티커 부착이나 전산 등록 체계가 단속의 정확성을 높이는 데 중요한 역할을 한다.\n\n### 지자체별 추가 시행 사례\n일부 지자체는 국가 차원의 계절관리제·비상저감조치보다 강화된 자체 운행제한 조례를 시행하기도 하며, 이는 Day74에서 학습한 \"엄격한 배출허용기준\" 원리와 유사하게 지역 여건에 따른 탄력적 정책 설계 사례로 이해할 수 있다.\n\n### 운행제한 알림 체계\n차량번호 인식 카메라와 전광판, 모바일 알림서비스 등을 통해 운행제한 대상 차량 소유자에게 사전 안내가 이루어지며, 이는 단속의 실효성뿐 아니라 정책 수용성을 높이는 보조적 수단으로 함께 운영된다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 자동차 배출가스등급제의 분류기준과 정책 활용방안을 설명하시오. *(114~138회 다수 25점)*\n2. 저공해조치 지원사업(DPF부착·조기폐차 등)을 설명하시오. *(120회 10점)*\n3. 계절관리제와 비상저감조치의 차이를 설명하시오. *(126회 10점)*\n4. 노후경유차 운행제한 정책의 형평성 문제와 보완방안을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n등급제 문제는 \"분류기준→인센티브→규제→지원사업\"의 순서로 서술하면 정책의 전체 그림이 명확해지며, 형평성 문제(저소득층 부담)를 결론에서 언급하면 균형 잡힌 답안으로 평가받을 수 있다.\n\n### 다음 학습 연계\nDay 98(친환경자동차와 이륜차·건설기계)에서 1등급 차량(전기·수소차)과 저공해조치 대상이 아닌 특수차량(건설기계·이륜차)의 관리방안을 확장 학습한다.\n\n### 암기 카드 5선\n1. **1등급** = 전기·수소차(무배출), **5등급** = 노후경유차\n2. **인센티브** = 구매보조금, 주차·통행료 감면\n3. **규제** = 계절관리제(상시)+비상저감조치(수시)\n4. **저공해조치** = DPF부착, 조기폐차, LPG개조\n5. **정책원칙** = 규제(운행제한)+지원(저공해조치) 병행\n\n### 답안 확장 포인트\n등급제와 저공해조치를 함께 묻는 문제에서는 \"규제만으로는 형평성 문제가 발생하므로 지원사업이 반드시 병행되어야 한다\"는 정책설계의 논리를 결론부에 명시하면 서술의 완성도가 높아진다."}]},"98":{"day":98,"date":"2026-11-06","title":"친환경자동차와 이륜차·건설기계","keywords":[{"k":"친환경차 종류","subs":["전기차(BEV): 무배출, 배터리 구동","수소전기차(FCEV): 수소-산소 반응발전","하이브리드(HEV/PHEV): 엔진+모터"]},{"k":"전기차 환경성 평가","subs":["운행단계 무배출(Tailpipe Zero)","발전원별 간접배출 고려 필요","전과정평가(LCA) 관점"]},{"k":"이륜차 관리","subs":["2행정·4행정 엔진 배출특성 차이","배출가스 검사 상대적 사각지대","전기이륜차 보급 확대"]},{"k":"건설기계 관리","subs":["비도로이동오염원(Off-road) 분류","저공해엔진 개조·인증제도","공공발주 저공해건설기계 의무사용"]},{"k":"종합 관리방향","subs":["친환경차 보급목표·인프라 확충","비도로오염원 관리 사각지대 해소","전과정 배출량 기반 정책 전환"]}],"answer":"# 친환경자동차와 이륜차·건설기계\n\n## Ⅰ. 개요\n\n전기차·수소차 등 친환경자동차는 운행단계에서 배출가스가 없거나 매우 적어 자동차 배출가스등급제(Day97)에서 최상위 등급을 부여받으며, 정부의 이동오염원 저감정책의 핵심 축으로 보급이 확대되고 있다. 다만 친환경차의 환경성은 운행단계만이 아니라 전력 생산 등 전과정을 고려해 평가해야 하며, 이륜차와 건설기계는 일반 자동차와 달리 관리체계의 사각지대에 놓이는 경우가 많아 별도의 정책적 관심이 필요하다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 친환경자동차의 종류와 원리\n\n### 1. 전기차(BEV, Battery Electric Vehicle)\n배터리에 저장된 전기에너지로 모터를 구동하는 방식으로, 운행 중 배기가스가 전혀 발생하지 않는(Tailpipe Zero) 무배출차량이다.\n\n### 2. 수소전기차(FCEV, Fuel Cell Electric Vehicle)\n수소와 산소의 전기화학반응(연료전지)으로 전기를 생성하여 모터를 구동하며, 배출물은 물(H₂O)뿐이라는 점에서 전기차와 마찬가지로 운행단계 무배출차량으로 분류된다.\n\n### 3. 하이브리드차(HEV·PHEV)\n| 구분 | 특징 |\n|---|---|\n| HEV(하이브리드) | 내연기관+전기모터 병행, 배터리는 회생제동 등으로 자체충전 |\n| PHEV(플러그인하이브리드) | HEV에 외부충전 기능 추가, 단거리는 전기로만 주행 가능 |\n\n하이브리드차는 내연기관을 완전히 대체하지는 않으나, 엔진 가동시간과 저부하 구간을 줄여 배출가스 총량을 저감하는 과도기적·보완적 기술로 평가된다.\n\n## Ⅲ. 친환경차의 환경성 평가 관점\n\n### 1. 운행단계 vs 전과정평가(LCA)\n전기차는 운행 중 배출가스가 없으나, 충전에 사용되는 전력이 화석연료 발전으로 생산된 경우 간접적으로 대기오염물질·온실가스가 배출되므로, 전기차의 진정한 환경성은 발전원 구성(석탄·LNG·재생에너지 비중)까지 포함한 전과정평가(Life Cycle Assessment) 관점에서 평가해야 한다.\n\n| 평가범위 | 전기차 배출 특성 |\n|---|---|\n| 운행단계(Tailpipe) | 무배출 |\n| 발전단계(전력생산) | 발전원 구성에 따라 간접배출 발생 가능 |\n| 배터리 제조·폐기 | 원료채굴·제조 과정의 환경영향 별도 고려 필요 |\n\n### 2. 재생에너지 확대와의 연계\n전기차 보급 확대의 대기질 개선 효과는 재생에너지 발전 비중 확대와 병행될 때 극대화되며, 이는 자동차 정책이 에너지 정책과 긴밀히 연계되어야 함을 보여준다.\n\n## Ⅳ. 이륜차·건설기계 관리\n\n### 1. 이륜차 배출가스 특성\n| 엔진형식 | 특징 |\n|---|---|\n| 2행정 엔진 | 연료-오일 혼합연소로 HC·PM 배출 많음, 점차 감소 추세 |\n| 4행정 엔진 | 상대적으로 청정, 현재 주력 형식 |\n\n이륜차는 승용차 대비 개별 배출량은 적으나, 배출가스 검사·관리체계가 상대적으로 미비하여 관리 사각지대로 지적되어 왔으며, 최근 전기이륜차 보급 확대가 대안으로 추진되고 있다.\n\n### 2. 건설기계(비도로이동오염원)\n| 항목 | 내용 |\n|---|---|\n| 분류 | 도로가 아닌 곳에서 운행되는 비도로이동오염원(Off-road) |\n| 대표 기종 | 굴착기, 지게차, 콘크리트펌프 등 |\n| 관리제도 | 저공해엔진 개조·저공해건설기계 인증, 공공발주 공사 우선사용 의무화 |\n\n건설기계는 노후화된 디젤엔진이 다수 운행되고 있어 단위 기계당 배출량이 상당하며, 특히 대형 건설현장이 밀집한 도심지역에서 미세먼지 기여도가 무시할 수 없는 수준으로 평가된다.\n\n### 3. 배터리 재활용과 자원순환\n전기차 보급이 확대됨에 따라 폐배터리의 재활용·재사용 체계 구축도 중요한 환경정책 과제로 부상하고 있으며, 이는 대기 분야를 넘어 자원순환 정책과 연계되는 전기차 정책의 또 다른 측면이다.\n\n### 4. 이륜차·건설기계 관리의 정책적 사각지대\n승용차는 정기검사·등급제 등 촘촘한 관리체계를 갖추고 있는 반면, 이륜차는 검사주기나 항목이 상대적으로 느슨하고, 건설기계는 사업장별 산발적 운행으로 배출량 파악조차 쉽지 않아 정책 우선순위에서 밀리는 경향이 있었다. 최근에는 이러한 사각지대 해소가 미세먼지 저감 정책의 새로운 중점과제로 부각되고 있다.\n\n### 5. 전기이륜차·전기건설기계 보급 확대 동향\n배달업 확대와 맞물려 전기이륜차 보급이 빠르게 늘고 있으며, 건설기계 분야에서도 전기굴착기·전기지게차 등이 실증 단계를 거쳐 점진적으로 상용화되는 추세로, 이는 도로용 자동차뿐 아니라 비도로 부문까지 전동화가 확산되는 흐름을 보여준다.\n\n## Ⅴ. 결론\n\n친환경자동차는 운행단계 무배출이라는 강점을 가지나, 진정한 환경성 평가를 위해서는 발전원 구성을 포함한 전과정 관점의 접근이 필요하며, 재생에너지 확대와 병행되어야 그 효과가 극대화된다. 이륜차·건설기계는 승용차 중심의 관리체계에서 상대적으로 소외되어 온 영역으로, 전기이륜차 보급과 저공해건설기계 의무사용 확대 등을 통해 관리 사각지대를 해소하는 것이 향후 이동오염원 정책의 중요한 과제다.\n\n| 요약 | 핵심 특징 | 관리 이슈 |\n|---|---|---|\n| 전기차·수소차 | 운행단계 무배출 | 전과정평가, 발전원 연계 |\n| 하이브리드차 | 엔진+모터 병행 | 과도기적 보완기술 |\n| 이륜차 | 개별배출 적음 | 관리 사각지대 |\n| 건설기계 | 비도로이동오염원 | 저공해엔진 의무화 |\n\n결국 이동오염원 정책의 다음 단계는 승용차 중심의 관리를 넘어, 친환경차의 전과정 환경성과 이륜차·건설기계 같은 사각지대까지 포괄하는 통합적 접근으로 나아가야 한다는 것이 이번 Day의 핵심 메시지다. 대기관리기술사는 이러한 확장된 시야를 바탕으로 종합적인 이동오염원 저감전략을 제시할 수 있어야 한다.\n","side":[{"title":"전기차 전과정평가(LCA) 계산 감각","body":"### 발전원별 온실가스 배출계수 개념(상대적 비교)\n| 발전원 | 상대적 배출 수준 |\n|---|---|\n| 석탄화력 | 높음 |\n| LNG복합화력 | 중간 |\n| 재생에너지(태양광·풍력) | 매우 낮음 |\n| 원자력 | 매우 낮음(방사성폐기물 등 별도 이슈) |\n\n전기차의 \"웰투휠(Well-to-Wheel, 에너지원 채굴부터 바퀴 구동까지)\" 배출량은 해당 국가·지역의 발전원 구성에 따라 크게 달라지므로, 단순히 \"전기차=친환경\"이라고 단정하기보다 발전원 정보를 함께 고려한 균형 잡힌 서술이 필요하다.\n\n### 웰투휠 개념 구조\n```\n연료(전기)의 생산 단계(Well-to-Tank)\n   + 차량의 구동 단계(Tank-to-Wheel)\n   = 전과정 배출(Well-to-Wheel)\n```\n내연기관차는 Tank-to-Wheel 단계에서만 배출이 집중되는 반면, 전기차는 Well-to-Tank(발전) 단계에서 배출이 발생하므로 두 차종을 공정하게 비교하려면 반드시 전 구간을 함께 평가해야 한다.\n\n### 배터리 제조단계 환경영향\n리튬·니켈·코발트 등 배터리 원료 채굴과 정제 과정에서도 상당한 에너지와 자원이 소요되므로, 완전한 전과정평가는 제조단계까지 포함해야 하며 이는 최근 국제적으로 논의되는 배터리 여권(Battery Passport) 제도의 도입 배경이기도 하다.\n\n### 건설기계 저공해화 사업 개념\n노후 건설기계에 배출가스 저감장치(DPF 유사)를 부착하거나 저공해엔진으로 교체하는 지원사업이 운영되며, 일정 규모 이상의 공공 발주 공사에서는 저공해건설기계 사용이 의무화되는 추세다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. 전기차·수소차의 원리와 환경성 평가 시 고려사항을 설명하시오. *(114~138회 다수 25점)*\n2. 전과정평가(LCA) 관점에서 전기차의 환경성을 평가하시오. *(120회 10점)*\n3. 이륜차의 배출가스 특성과 관리방안을 설명하시오. *(126회 10점)*\n4. 건설기계(비도로이동오염원)의 관리제도를 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n친환경차 문제는 \"운행단계 무배출\"이라는 장점만 서술하지 말고 반드시 전과정평가 관점(발전원, 배터리 제조)의 균형 잡힌 시각을 포함해야 한다. 이는 최근 출제 경향에서 요구하는 심화된 답안 구성이다.\n\n### 실무 연계 메모\n해양이용영향평가 실무에서 항만·연안 개발사업을 검토할 때 전기하역장비, 전기건설기계 도입 여부가 저감방안의 구체성을 평가하는 요소가 될 수 있어, 이번 Day의 내용은 실무적으로도 직접 활용 가치가 크다.\n\n### 3단계 자동차 파트 마무리\nDay 93~98로 자동차 배출가스의 전체 스펙트럼(경유차·휘발유차·RDE·등급제·친환경차·이륜차·건설기계)을 학습했다. Day 99(선박·항만)에서 도로 밖 이동오염원으로 시야를 넓힌다.\n\n### 암기 카드 5선\n1. **BEV·FCEV** = 운행단계 무배출(Tailpipe Zero)\n2. **HEV·PHEV** = 엔진+모터 병행, 과도기적 기술\n3. **LCA** = 전과정평가, 발전원 구성까지 고려\n4. **이륜차** = 4행정 주력, 관리 사각지대\n5. **건설기계** = 비도로이동오염원, 저공해엔진 의무화"}]},"99":{"day":99,"date":"2026-11-07","title":"선박·항만 대기질 관리","keywords":[{"k":"선박 배출 특성","subs":["벙커C유(고황유) 사용, SOx·PM 다량 배출","대형 저속엔진, NOx 배출 상당"]},{"k":"IMO 국제규제","subs":["MARPOL 부속서Ⅵ, 황함량 규제","2020 IMO 글로벌 황상한(0.5%)","ECA(배출규제해역) 강화기준(0.1%)"]},{"k":"저감기술","subs":["저황유 전환, 스크러버(배기가스세정)","LNG 추진선박 확대","육상전원공급(AMP, 콜드아이닝)"]},{"k":"국내 항만대책","subs":["항만대기질개선 특별법","황산화물 배출규제해역(국내 ECA) 지정","저속운항프로그램(VSR)"]},{"k":"항만 배출원 종합","subs":["선박+하역장비+화물차량 복합배출","항만지역 미세먼지 특별관리","배출량 인벤토리 구축"]}],"answer":"# 선박·항만 대기질 관리\n\n## Ⅰ. 개요\n\n선박은 저가의 고황분 벙커C유를 연료로 사용하는 대형 저속엔진 특성상 SOx·PM·NOx를 다량 배출하는 대표적 이동오염원이며, 국제해사기구(IMO)의 국제협약과 국내 항만대기질개선 특별법을 통해 규제가 강화되고 있다. 항만지역은 선박뿐 아니라 하역장비·화물차량 등이 밀집하여 복합적인 대기오염이 발생하므로, 개별 배출원 관리를 넘어 항만 전체를 대상으로 한 종합적 대기질 관리가 요구된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 선박의 배출 특성\n\n### 1. 연료와 오염물질\n| 항목 | 특징 |\n|---|---|\n| 사용연료 | 벙커C유(고황중유, Day65 연계) 위주, 최근 저황유·LNG 확대 |\n| SOx | 연료 중 황분에 비례, 선박 배출의 핵심 관리대상 |\n| PM | 고황유 연소 시 다량 발생 |\n| NOx | 대형 저속엔진의 고온연소로 상당량 배출 |\n\n### 2. 선박엔진의 특수성\n선박용 대형 저속엔진은 육상 발전·자동차 엔진과 비교해 훨씬 대형이며 낮은 회전수로 운전되어, 단위 연료소비량당 오염물질 배출 특성이 육상 발생원과 다르게 나타난다. 또한 한 척의 대형 컨테이너선이 배출하는 오염물질 총량이 수천 대의 자동차에 맞먹는다는 비교가 종종 인용될 만큼, 개별 배출원 단위로는 매우 큰 규모를 차지한다.\n\n## Ⅲ. 국제 규제체계(IMO)\n\n### 1. MARPOL 부속서Ⅵ\n국제해사기구(IMO)의 해양오염방지협약(MARPOL) 부속서Ⅵ는 선박의 대기오염물질(SOx, NOx 등) 배출을 국제적으로 규제하는 핵심 근거로, 연료 중 황함량 상한을 단계적으로 강화해왔다. 이 협약은 국제항해에 종사하는 모든 선박에 적용되므로, 특정 국가만의 규제로는 실효성을 확보하기 어려운 이동오염원의 국제적 성격을 잘 보여준다.\n\n### 2. 글로벌 황상한 규제\n| 시행 시점 | 황함량 상한 |\n|---|---|\n| 이전 기준 | 3.5% |\n| **2020년 IMO 글로벌 규제** | **0.5% 이하** |\n| 배출규제해역(ECA) | **0.1% 이하**(일반해역보다 강화) |\n\n### 3. ECA(Emission Control Area, 배출규제해역)\n북미·발트해·북해 등 일부 해역은 ECA로 지정되어 일반해역보다 강화된 황함량 기준(0.1%)이 적용되며, NOx에 대해서도 별도의 강화된 배출기준(Tier Ⅲ)이 적용된다.\n\n## Ⅳ. 저감기술과 국내 항만대책\n\n### 1. 선박 저감기술\n| 기술 | 원리 |\n|---|---|\n| 저황유 전환 | 황함량 기준을 충족하는 저황 연료유로 대체 |\n| 스크러버(배기가스세정장치) | 고황유 계속 사용하되 배가스를 습식세정하여 SOx 제거(Day44 원리 응용) |\n| LNG 추진선박 | 청정연료(LNG) 사용으로 SOx·PM·NOx 대폭 저감 |\n| 육상전원공급(AMP, Alternative Maritime Power, 콜드아이닝) | 접안 중 선박엔진을 끄고 육상전력 공급받아 항만 정박 중 배출 차단 |\n\n### 2. 국내 항만대기질 개선 대책\n| 제도 | 내용 |\n|---|---|\n| 항만대기질개선 특별법 | 항만지역 대기질 관리를 위한 종합계획 수립 근거 |\n| 국내 배출규제해역 지정 | 주요 항만 인근 해역에 강화된 황함량·저속운항 기준 적용 |\n| 저속운항프로그램(VSR, Vessel Speed Reduction) | 항만 인근 접근 시 선박 속도를 낮춰 배출량 저감, 인센티브 제공 |\n| 육상전원공급 설비 확충 | 주요 항만에 AMP 설비 구축 및 이용 인센티브 |\n\n### 3. 항만 복합배출원 관리\n항만은 선박뿐 아니라 하역장비(크레인·야드트랙터), 화물차량, 창고·물류시설 등이 밀집한 복합 배출공간으로, 개별 배출원 대책의 총합만으로는 지역 전체의 대기질 개선을 담보하기 어려워 항만 단위의 통합 배출량 인벤토리 구축과 종합관리계획이 요구된다. 이는 Day98에서 학습한 전기건설기계·저공해장비 보급과도 직접 연계되는 부분이다.\n\n### 4. 국내외 정책 비교와 시사점\n유럽 주요 항만은 이미 다수의 육상전원공급 설비를 운영하며 정박 중 배출을 획기적으로 저감하고 있어, 국내 항만도 이러한 선진 사례를 참고하여 인프라 확충 속도를 높일 필요가 있다는 점이 정책적 시사점으로 논의된다. 아울러 국제 항로를 운항하는 국적 선사의 경쟁력 확보를 위해서도 국내 저감기술·인프라 수준을 국제 기준에 맞춰 나가는 것이 중요한 산업정책적 과제이기도 하다.\n\n## Ⅴ. 결론\n\n선박은 고황유 사용과 대형 저속엔진이라는 특수성으로 SOx·PM·NOx를 다량 배출하는 이동오염원으로, IMO의 국제 황상한 규제(2020년 0.5%, ECA 0.1%)를 계기로 저황유·스크러버·LNG추진 등 다각적 저감기술 적용이 확대되고 있다. 국내에서도 항만대기질개선 특별법에 따른 배출규제해역 지정과 저속운항프로그램·육상전원공급 확대를 통해 항만지역의 복합적 대기오염을 종합적으로 관리해나가고 있다.\n\n| 요약 | 규제·대책 |\n|---|---|\n| 국제규제 | IMO 2020(황 0.5%), ECA(황 0.1%) |\n| 선박기술 | 저황유, 스크러버, LNG추진 |\n| 항만대책 | VSR(저속운항), AMP(육상전원공급) |\n| 종합관리 | 항만 배출량 인벤토리+통합관리계획 |\n\n선박·항만 대기질 관리는 국제협약과 국내법령, 기술적 저감수단과 운항관리가 모두 결합되어야 실효성을 갖는 대표적인 다층적 관리 분야로, 대기관리기술사는 이러한 다층 구조를 종합적으로 이해하고 있어야 한다. 특히 해양이용영향평가 실무에서는 항만 개발사업의 대기질 영향을 평가할 때 이러한 국제·국내 규제체계를 종합적으로 검토하는 것이 필수적이다. 향후 국제 규제가 더욱 강화될 것으로 예상되는 만큼, 국내 조선·해운업계의 선제적 대응 전략 수립도 함께 요구된다.\n","side":[{"title":"스크러버 방식과 저황유 전환 경제성 비교","body":"### 스크러버 유형\n| 유형 | 원리 |\n|---|---|\n| 개방형(Open-loop) | 해수를 세정액으로 사용 후 그대로 배출 |\n| 폐쇄형(Closed-loop) | 세정액을 순환 사용, 폐수는 별도 처리 후 육상 처리 |\n| 하이브리드형 | 해역에 따라 개방형·폐쇄형 전환 운용 |\n\n스크러버는 Day44에서 학습한 세정집진장치의 원리를 선박 배가스에 적용한 것으로, 알칼리성 세정액이 SOx를 흡수·중화하는 원리는 육상 습식탈황설비(Day63)와 본질적으로 동일하다.\n\n### 저황유 전환 vs 스크러버 설치 비교\n| 구분 | 저황유 전환 | 스크러버 설치 |\n|---|---|---|\n| 초기투자비 | 낮음(연료만 교체) | 높음(설비 설치) |\n| 연료비 | 저황유가 상대적으로 고가 | 기존 고황유 계속 사용 가능(저렴) |\n| 세정폐수 | 발생 없음 | 개방형은 해양 배출 논란 |\n| 적용 해역 제약 | 없음 | 개방형은 일부 항만·해역에서 사용 제한 |\n\n세정폐수의 해양환경 영향 우려로 일부 항만·국가에서는 개방형 스크러버 사용을 제한하는 추세이며, 이는 대기오염 저감이 다른 환경매체(해양)에 영향을 미칠 수 있다는 통합환경관리 관점을 보여주는 사례다.\n\n### LNG 추진선박 확대의 제약요인\nLNG추진선박은 SOx·PM·NOx 모두 대폭 저감할 수 있으나, 초기 건조비용이 높고 LNG 벙커링(공급) 인프라가 아직 제한적이라는 점이 보급 확대의 제약요인으로 작용하고 있다.\n\n### 메탄슬립(Methane Slip) 이슈\nLNG추진선박은 대기오염물질은 크게 저감하나, 엔진에서 미연소 메탄(CH4)이 일부 배출되는 메탄슬립 현상이 온실가스 측면의 새로운 과제로 지적되고 있어, 대기오염물질 저감과 온실가스 저감이 항상 동일한 방향으로 작용하지는 않는다는 점을 보여주는 사례다."},{"title":"기출 연계와 답안 요령","body":"### 기출 연계 자가점검\n1. IMO 2020 글로벌 황상한 규제와 ECA(배출규제해역)를 설명하시오. *(114~138회 다수 25점)*\n2. 선박 SOx 저감기술(저황유·스크러버·LNG추진)을 비교 설명하시오. *(120회 25점)*\n3. 육상전원공급(AMP)의 원리와 효과를 설명하시오. *(126회 10점)*\n4. 국내 항만대기질개선 특별법과 저속운항프로그램을 설명하시오. *(최근 10점)*\n\n### 답안 작성 요령\n선박 문제는 국제규제(IMO)와 국내대책(항만대기질개선 특별법)을 구분하여 서술하되, \"왜 국제협약이 필요한가\"(선박은 국경을 넘나드는 이동오염원이라 개별국가 규제만으로는 한계)를 개요에서 짚어주면 완성도가 높아진다.\n\n### 3단계 이동오염원 파트 총정리\nDay 93~99(자동차 전반+선박·항만)로 이동오염원 파트가 마무리된다. 다음 Day 100(회독 6회차)에서 Day 92~99를 종합 복습한다.\n\n### 암기 카드 5선\n1. **선박연료** = 벙커C유(고황유), 대형저속엔진\n2. **IMO 2020** = 글로벌 황상한 0.5%\n3. **ECA** = 배출규제해역, 황상한 0.1%\n4. **저감기술 3가지** = 저황유·스크러버·LNG추진\n5. **AMP(콜드아이닝)** = 정박 중 육상전원, 엔진정지\n\n### 답안 확장 포인트\n선박·항만 문제는 \"이동성\"이라는 특성 때문에 국경을 넘나드는 오염원 관리의 어려움(국제협약 필요성)을 서두에 짚어주면, 왜 IMO라는 국제기구 중심의 규제체계가 형성되었는지 논리적으로 설명할 수 있다."}]},"100":{"day":100,"date":"2026-11-08","title":"2단계 가스상·연소·측정 회독 6회차","keywords":[{"k":"경유차 통합시스템","subs":["EGR(연소저감)+DOC·DPF(PM)+SCR(NOx)","NOx-PM 트레이드오프 해법","요소수 관리, 암모니아슬립"]},{"k":"휘발유차 삼원촉매","subs":["이론공연비(λ=1), TWC 동시저감","GDI+GPF, PM 대응"]},{"k":"RDE·디젤게이트·OBD","subs":["임의설정(Defeat Device)","PEMS 실도로측정, 적합성인자(CF)","OBD 상시 자가진단"]},{"k":"등급제·친환경차","subs":["1~5등급, 계절관리제 연계","BEV·FCEV 무배출, LCA 관점","이륜차·건설기계 사각지대"]},{"k":"선박·항만","subs":["IMO 2020(황0.5%), ECA(황0.1%)","저황유·스크러버·LNG추진","AMP(콜드아이닝), VSR"]}],"answer":"# 2단계 회독 6회차 — Day 92~99 요약·자가점검\n\n## Ⅰ. 회독 목적\n\n이번 구간은 **자동차(경유차·휘발유차·RDE·등급제·친환경차) → 선박·항만**으로 이어지는 이동오염원 전체를 다루는 3단계의 핵심 구간이다. 자동차는 연료별(경유·휘발유)로 후처리기술이 완전히 다르고, RDE·디젤게이트는 제도적 배경까지 함께 이해해야 하는 심화 주제이므로, 이번 회독에서는 \"기술원리\"와 \"정책제도\"를 분리하여 각각 정리하는 것이 효과적이다.\n\n```\n자동차 배출가스\n   ├─ 경유차: EGR+DOC+DPF+SCR (NOx-PM 트레이드오프 해결)\n   ├─ 휘발유차: 삼원촉매(TWC, λ=1) + GDI대응 GPF\n   ├─ 검증: RDE(PEMS)/디젤게이트/OBD\n   ├─ 관리: 배출가스등급제(1~5등급)+저공해조치\n   └─ 대안: 친환경차(BEV·FCEV·HEV) + 이륜차·건설기계\n        ↓\n선박·항만: IMO규제(황상한) + 저감기술(저황유·스크러버·LNG) + 항만대책(AMP·VSR)\n```\n\n## Ⅱ. 핵심 수치 암기 체크리스트\n\n| 항목 | 값 | 확인 |\n|---|---|---|\n| DPF 포집효율 | **80~90% 이상** | ☐ |\n| SCR(차량용) 반응온도 | **300~400℃** | ☐ |\n| SCR NOx저감효율 | **80~90%** | ☐ |\n| 삼원촉매 최적조건 | 이론공연비 **λ=1** | ☐ |\n| 촉매활성화 온도 | 통상 **200~300℃** 이상 | ☐ |\n| 배출가스등급 | **1~5등급**(1=무배출) | ☐ |\n| IMO 2020 황상한 | **0.5% 이하** | ☐ |\n| ECA(배출규제해역) 황상한 | **0.1% 이하** | ☐ |\n| 디젤게이트 발생연도 | **2015년** | ☐ |\n| RDE 측정장비 | **PEMS** | ☐ |\n\n## Ⅲ. 반드시 쓸 수 있어야 하는 식\n\n1. **삼원촉매 반응(개념)**: 2NO+2CO→N2+2CO2 (동시에 CO·HC 산화)\n2. **차량용 SCR**: 요소수(AdBlue)→NH3→NOx 환원(4NH3+4NO+O2→4N2+6H2O)\n3. **적합성인자(CF, 개념)**: 실도로측정값 / 실내인증기준\n4. **웰투휠(Well-to-Wheel)**: Well-to-Tank(발전) + Tank-to-Wheel(구동) = 전과정배출\n5. **DRE 개념 재적용**: 방지시설 공통 제거효율 산정식(η=(Cin-Cout)/Cin×100)\n\n## Ⅳ. 자주 혼동하는 개념\n\n| 구분 | A | B | 핵심 차이 |\n|---|---|---|---|\n| 경유차 vs 휘발유차 시스템 | 다단계(EGR+DPF+SCR) | 단일촉매(TWC) | 배기가스 중 과잉산소 유무 |\n| DOC vs DPF | 산화촉매, CO·HC·SOF | 필터, PM 물리포집 | 처리방식 |\n| BEV vs FCEV | 배터리+모터 | 수소+연료전지 | 에너지원 |\n| HEV vs PHEV | 자체충전만 | 외부충전 가능 | 충전방식 |\n| 저황유 vs 스크러버 | 연료 자체 교체 | 배가스 후처리 | 접근 단계 |\n| VSR vs AMP | 저속운항(항해 중) | 육상전원(정박 중) | 적용 시점 |\n\n## Ⅴ. 기출 연계 자가점검\n\n1. 경유차의 NOx-PM 트레이드오프와 통합 저감시스템을 설명하시오. *(다수 회차 25점)*\n2. 삼원촉매의 원리와 이론공연비의 관계를 설명하시오. *(114~138회 다수 25점)*\n3. 디젤게이트 사건과 RDE 제도화 과정을 설명하시오. *(다수 회차 10~25점)*\n4. 배출가스등급제와 저공해조치를 설명하시오. *(126회 25점)*\n5. 전기차의 전과정평가(LCA) 관점 환경성을 설명하시오. *(120회 10점)*\n6. IMO 2020 황상한 규제와 선박 저감기술을 설명하시오. *(114~138회 다수 25점)*\n\n## Ⅵ. 오늘의 학습 방법\n\n1. **백지 복습(20분)**: Ⅰ의 흐름도를 그리고 경유차-휘발유차-선박의 후처리 논리를 각각 설명해본다.\n2. **비교표 재구성(30분)**: Ⅳ의 6개 비교쌍을 스스로 표로 다시 그려본다.\n3. **수치 암기(20분)**: Ⅱ 체크리스트. IMO 2020(0.5%)과 ECA(0.1%)는 절대 혼동 금지.\n4. **기출 구술(30분)**: Ⅴ의 6문항을 5분 내로 개요 작성.\n5. **취약 일자 재독(20분)**: 경유차 통합시스템(Day94)이 어려웠다면 재복습 권장.\n\n> 3단계 자동차·선박 파트는 매 시험 2~3문제씩 고정 출제되는 영역이다. 이번 6회독으로 확실히 다져야 다음 측정 파트 학습에 여유가 생긴다.\n\n## Ⅶ. 3단계 이동오염원 파트 회고\n\nDay 93(자동차 개관)부터 Day 99(선박·항만)까지 7일간 이동오염원 전체를 학습했다. 고정오염원(1~2단계)과 달리 이동오염원은 \"이동성\"이라는 특성 때문에 제작단계 인증, 운행단계 관리, 국제협약이라는 세 층위의 관리체계가 필요하다는 공통된 논리구조를 가지고 있음을 기억해두면 종합문제 대응에 유리하다. 이러한 3층위 구조(인증-운행관리-국제협약)는 자동차뿐 아니라 선박에도 동일하게 적용되는 보편적 원리이므로, 두 배출원을 비교하는 통합문제에서 핵심 답안 골격으로 활용할 수 있다. 이 원리를 체화해두면 향후 새로운 이동오염원(도심항공교통 등)이 출제되더라도 동일한 논리로 답안을 구성할 수 있는 응용력을 갖추게 된다. 3단계 이동오염원 파트를 마무리하며, 다음 측정 파트로 넘어가기 전 지금까지의 학습 성과를 스스로 점검해보는 시간을 가져보자. 지금까지 100일간 꾸준히 학습을 이어왔다면, 이는 실제 시험 준비 과정에서 가장 어렵다고 평가되는 \"꾸준함\"을 이미 증명한 것이다.\n","side":[{"title":"이동오염원 종합 비교표","body":"### 배출원별 핵심 오염물질과 저감기술 매트릭스\n| 배출원 | 핵심 오염물질 | 핵심 저감기술 |\n|---|---|---|\n| 경유차 | NOx, PM | EGR+DPF+SCR |\n| 휘발유차 | CO, HC, NOx | 삼원촉매(TWC) |\n| GDI 휘발유차 | +PM | 삼원촉매+GPF |\n| 선박 | SOx, PM, NOx | 저황유·스크러버·LNG추진 |\n| 건설기계 | NOx, PM | 저공해엔진 개조 |\n\n### 정책수단 비교\n| 수단 | 적용대상 | 원리 |\n|---|---|---|\n| 인증(제작단계) | 신차·신조선 | RDE, IMO기준 충족 확인 |\n| 등급제(운행단계) | 운행차량 | 인센티브+규제 차등 |\n| 저공해조치(지원) | 노후차량 | DPF부착·조기폐차 지원 |\n| 운항관리(선박) | 운항 중 선박 | VSR(저속운항)+AMP(정박) |\n\n### 계산형 문제 대비 공식 재점검\nⅢ에서 제시한 웰투휠 개념과 적합성인자(CF) 개념은 서술형뿐 아니라 향후 측정 파트(Day101~)의 계산문제와 결합되어 출제될 수 있으므로, 개념뿐 아니라 계산 감각까지 함께 익혀두는 것이 안전하다.\n\n### 이동오염원 vs 고정오염원 관리철학 비교\n| 구분 | 고정오염원 | 이동오염원 |\n|---|---|---|\n| 규제 단위 | 개별 배출시설 | 차종·선종 단위 형식승인 |\n| 검증 시점 | 상시(TMS 등) | 제작단계+운행단계 이원화 |\n| 국제성 | 상대적으로 약함 | 강함(부품·연료 국제유통, 선박 국제운항) |\n\n이 비교표는 왜 이동오염원 파트에서 국제협약(IMO)과 국내외 인증제도(RDE)가 유독 강조되는지를 설명하는 핵심 근거가 되므로, 답안 서론에서 활용하면 논리적 설득력을 높일 수 있다."},{"title":"암기 카드 — Day 92~99 핵심 20선","body":"1. **EGR** = 배기재순환, Thermal NOx 억제(PM↑ 부작용)\n2. **DOC** = CO·HC산화+NO→NO2(DPF재생 보조)\n3. **DPF** = 세라믹필터, 포집효율 80~90%↑\n4. **SCR(차량용)** = 요소수+촉매, 300~400℃\n5. **삼원촉매** = Pt·Pd·Rh, λ=1에서 최고효율\n6. **λ윈도우** = 매우 좁음, 산소센서 피드백제어\n7. **GDI** = 직분사, 연비↑ PM↑\n8. **GPF** = GDI차 PM저감, DPF와 유사원리\n9. **디젤게이트** = 2015년, 임의설정(Defeat Device)\n10. **RDE** = PEMS 실도로측정\n11. **적합성인자(CF)** = 실도로/실내기준 배수, 단계적 축소\n12. **OBD** = 상시 자가진단, DTC+경고등\n13. **배출가스등급** = 1등급(무배출)~5등급(노후경유)\n14. **저공해조치** = DPF부착·조기폐차·LPG개조\n15. **BEV·FCEV** = 운행단계 무배출\n16. **LCA** = 웰투휠, 발전원 구성 고려\n17. **이륜차·건설기계** = 관리 사각지대\n18. **IMO 2020** = 황상한 0.5%, ECA는 0.1%\n19. **선박저감 3기술** = 저황유·스크러버·LNG추진\n20. **AMP·VSR** = 정박중 육상전원 / 항해중 저속운항\n\n### 회독 진도 메모\n3단계 이동오염원(Day93~99) 학습이 완료되었다. 다음은 측정 파트(Day101~115)로, 계산·절차형 문제가 중심이 되는 새로운 학습영역으로 전환된다.\n\n### 취약도 자가진단 체크리스트\n아래 중 3개 이상 막힘없이 설명이 안 되면 해당 Day를 재복습할 것: ① 경유차 통합시스템 배치순서(Day94) ② 삼원촉매 λ윈도우(Day95) ③ 디젤게이트-RDE 인과관계(Day96) ④ 등급제 분류기준(Day97) ⑤ 전기차 LCA(Day98) ⑥ IMO 2020 황상한(Day99)."}]},"101":{"day":101,"date":"2026-11-09","title":"대기오염 공정시험기준 총칙","keywords":[{"k":"공정시험기준 체계","subs":["환경오염공정시험기준 고시","대기·수질·소음 등 분야별 구성","측정방법 표준화 근거"]},{"k":"용어 정의","subs":["표준상태(0℃, 1기압)","건조가스·습가스 구분","항량(일정한 무게)"]},{"k":"농도 표시단위","subs":["ppm, mg/Sm³, ㎍/m³","표준산소농도 보정농도","측정불확도 표시"]},{"k":"시험 일반사항","subs":["시약·용액 등급 규정","분석기기 교정주기","시험기록·유효숫자 처리"]},{"k":"품질보증(QA/QC)","subs":["바탕시료·첨가회수율 시험","정도관리 절차 준수","숙련도시험 참여"]}],"answer":"# 대기오염 공정시험기준 총칙\n\n## Ⅰ. 개요\n\n대기오염 공정시험기준은 환경부 고시로 제정된 표준화된 측정·분석방법으로, 배출가스·환경대기 중 오염물질의 농도를 전국적으로 통일된 절차에 따라 측정함으로써 측정결과의 신뢰성과 상호비교 가능성을 확보하는 근거 규정이다. 총칙 부분은 개별 측정방법에 공통적으로 적용되는 용어 정의, 단위 표시, 시험 일반사항, 품질관리 원칙을 규정하여 이후 각론(굴뚝 배출가스, 환경대기 등)의 기초가 된다. *(114~138회 다수 10~25점 기출)*\n\n## Ⅱ. 공정시험기준의 체계와 용어\n\n### 1. 공정시험기준의 위상\n「환경오염공정시험기준」은 대기·수질·소음진동·폐기물 등 환경매체별로 구성되며, 대기 분야는 배출가스(굴뚝) 시험방법과 환경대기 시험방법으로 크게 구분된다. 배출허용기준 준수 여부 판정이나 환경기준 평가 시 반드시 이 공정시험기준에 따른 측정결과를 근거로 삼아야 한다.\n\n### 2. 주요 용어 정의\n| 용어 | 정의 |\n|---|---|\n| 표준상태 | 0℃, 1기압(760mmHg) 상태 |\n| 건조가스(Dry gas) | 수분을 제거한 상태의 가스 |\n| 습가스(Wet gas) | 수분을 포함한 상태의 가스 |\n| 항량 | 일정한 조건에서 더 이상 무게 변화가 없는 상태(무게측정법의 기준) |\n| 액성 표시 | 산성·중성·알칼리성 등 pH 범위 표시 규정 |\n\n### 3. 시험조작 관련 용어\n| 용어 | 의미 |\n|---|---|\n| \"정확히 취하여\" | 규정된 양을 정밀하게 측정하여 채취 |\n| \"약\" | 표시된 양에 근사한 값(오차 허용) |\n| \"즉시\" | 규정된 조작 후 곧바로 실시 |\n\n## Ⅲ. 농도 표시 단위와 보정\n\n### 1. 배출가스 농도 단위\n| 단위 | 의미 |\n|---|---|\n| ppm | 부피 기준 백만분율 |\n| mg/Sm³ | 표준상태 건조가스 1㎥당 질량(mg) |\n| ㎍/m³ | 환경대기 등에서 주로 사용하는 질량농도 |\n\n### 2. 표준산소농도 보정(Day80·90 연계)\n배출시설별로 정해진 표준산소농도를 기준으로 실측농도를 보정하여 비교하며, 이는 시설별 과잉공기 사용 정도의 차이를 배제하고 공정한 비교를 가능하게 하기 위함이다.\n\n**보정농도 = 실측농도 × (21−표준산소농도) / (21−실측산소농도)**\n\n## Ⅳ. 시험 일반사항과 품질보증(QA/QC)\n\n### 1. 시약·기기 관리\n| 항목 | 규정 내용 |\n|---|---|\n| 시약 등급 | 특급시약 등 규정된 순도 이상 사용 |\n| 용액 조제 | 규정된 절차에 따라 표준용액 조제·보관 |\n| 분석기기 교정 | 정기적인 교정주기 준수, 교정곡선 작성 |\n\n### 2. 품질보증(QA/QC) 절차\n| 절차 | 목적 |\n|---|---|\n| 바탕시료(Blank) 시험 | 시약·조작 과정의 오염 여부 확인 |\n| 첨가회수율(Spike Recovery) 시험 | 분석방법의 정확도 검증 |\n| 정도관리(QC) 차트 관리
